# The take-list of the local book importer: which bookmark paths are read into entries, and how. It holds no book text.
# A row names a book (pc or mc), a chapter key, the bookmark path(s) taken (titles, top level first), the parser, the entity type the entries
# become and whether the row is approved. A chapter may have several rows. Only an approved row reaches the pack; every row is parsed into
# the work folder so a reviewer can look at it first.
#   parser    entries (headers by font, one entry each), rules (the whole range is one entry), statblocks, table, glossary (one alphabetical list: only the trait definitions are kept)
#   target    the entity type of the four-degrees system the entries become (its pack folder is the plural unless `folder` says otherwise)
#   category  the entry's `category` field, in our own words, for a target type that has one
#   columns   the most columns a page of the row has (two unless stated)
#   own       paths (rules parser) whose own text, between the section's title and its first child section, becomes one entry named by ownName
#   planned   (below the rows) sections a later chapter takes: not read, only not counted as "left out" by the denylist generator
# Dropped material is never named here: the setting, religion, example-of-play and map sections are simply absent.
# A path that names anything but a game term does not belong in this file.
rows:
  - chapter: conditions
    book: pc
    parser: entries
    target: condition
    approved: true
    paths:
      - [Conditions Appendix, List of Conditions]
  - chapter: conditions
    book: pc
    parser: rules
    target: rule
    category: Conditions
    approved: true
    paths:
      - [Conditions Appendix, Condition Values]
      - [Conditions Appendix, Overriding Conditions]
    # The appendix's own intro rule, before its first child section, is its own rule entry named by ownName (our word). It is never dropped silently.
    own:
      - [Conditions Appendix]
    ownName: Conditions
  # The glossary is one alphabetical list with the index. Only an entry whose term is followed by the trait mark and some text is taken; the rest of the list is read past.
  - chapter: glossary-traits
    book: pc
    parser: glossary
    target: trait
    approved: true
    # The bookmarks end the glossary a page early: its last lines are at the top of the page the backmatter starts on.
    spillsOnto: 464
    paths:
      - ["Glossary & Index"]
# Sections a later chapter takes. They are not read: the denylist generator only counts them as "not left out", so their words are not hashed as setting material.
# Anything on neither list (the setting, map, religion and example-of-play sections, front matter, sheets) is left out and hashed. Plain game-term titles only.
planned:
  - book: pc
    paths:
      - ["Chapter 1: Introduction", Basics of Play]
      - ["Chapter 1: Introduction", Playing the Game]
      - ["Chapter 1: Introduction", Character Creation]
      - ["Chapter 2: Ancestries & Backgrounds"]
      - ["Chapter 3: Classes"]
      - ["Chapter 4: Skills"]
      - ["Chapter 5: Feats"]
      - ["Chapter 6: Equipment"]
      - ["Chapter 7: Spells"]
      - ["Chapter 8: Playing the Game"]
