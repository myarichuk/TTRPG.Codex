# The take-list of the local book importer: which bookmark paths are read into entries, and how. It holds no book text.
# A row names a book (pc or mc), a chapter key, the bookmark path(s) taken (titles, top level first), the parser, the entity type the entries
# become and whether the row is approved. A chapter may have several rows. Only an approved row reaches the pack; every row is parsed into
# the work folder so a reviewer can look at it first.
#   parser    entries (headers by font, one entry each), rules (the whole range is one entry), statblocks, table, glossary (one alphabetical list: only the trait definitions are kept)
#   target    the entity type of the four-degrees system the entries become (its pack folder is the plural unless `folder` says otherwise)
#   category  the entry's `category` field, in our own words, for a target type that has one
#   columns   the most columns a page of the row has (two unless stated)
#   actions   (parser) a skills chapter: headings in the section font are skills, entry-headers ending in "(Trained)" or "(Untrained)" introduce a general skill action, one ending in
#             "Trained Action(s)" switches a skill to its trained actions, and any other heading is a subsection; the range's prose becomes `rule` entries (the row's `category`) and its
#             action headings (an action icon, or a trait line below) become the target type's entries, with the skill and the least proficiency as fields
#   leadName  (actions parser) the name, in our own words, of the one rule made from the range's prose before its first heading
#   tailFromHeader  (rules parser) the range ends at the first heading in the block-header font; what follows in the section (overview tables) is read past
#   tableRows       a block of mostly multi-cell lines, or one that opens with a bold label line, is a table the extraction did not rebuild: one row to a line
#   spelllists (parser) the four spell lists of the spells chapter: read past, no entry; the (name, rank) pairs on them are the independent count of the spells
#   levelWord (entries parser) a header ends in the type's word and a number; `spell|cantrip` gives several words, and the one found is the entry's kind
#   boxes / readPastBoxes (entries row with a level word) a heading in the header font that has no entry's shape starts a box among the entries: each named title becomes a rule entry (the row's category),
#             and the number of the others, which are read past, must be the one stated
#   groups    (entries row with a level word) the section has child sections that group its entries (a class's focus spells, a domain, an order, a school): a heading in the section font or
#             the entry-header font names a group, and each entry after it says that group in its `focusGroup` field. The range starts at the section's first heading, and every bookmark below the
#             section is counted against these headings
#   listHeading (entries row with a level word) a heading in the block-header font, anywhere in the book, under which a table lists every entry of the row by rank: the independent count
#   subheadings (rules parser) a heading in the block-header font inside a section that has no bookmark is a paragraph of the entry; runsToTitle: the bookmark paths whose section's text goes on over a page break
#             above the next title (the pages between are sidebars, or the bookmark ends early); any other path still fails when text sits there
#   items     (parser) equipment: the paths are the sections that describe the items (a paragraph that opens with the item's name and a colon). Their statistics are the rows of the stat tables on the pages of `tables`
#             (the stat table reader carves them out before the page is cut into columns); a header row is a name cell and one of the `tableColumns` label lists, each starting with Price, and each label must be the
#             title of a bookmark of the chapter. `itemKind` is armor, shield or weapon. A table row and its description are joined by name: a row or a description with no partner fails the run, unless `exclude`
#             names it (with its reason in `countsDiffer`), `undescribed` names a row that has no paragraph (its entry is its row), or `ruleDescriptions` names descriptions with no row, which become the paragraphs of one
#             rule (`ruleName`, `ruleCategory`)
#   artLabels (items and rules rows) the lines set in capitals alone, which are the labels under a picture, are skipped, and the run prints how many
#   readPast / foldChildren / readPastChildren / proseBoxes (rules parser) readPast claims a section's blocks and makes no entry; foldChildren makes the child sections whose titles are in the entry-header font paragraphs
#             of one entry (counted against the bookmark children, and the names in readPastChildren leave their text out); proseBoxes reads a box of body text that opens with a bold heading as prose, not as a table
#   own       paths (rules parser) whose own text, between the section's title and its first child section, becomes one entry named by ownName
#   ancestries (parser) one ancestry's whole range: its lore is read past (and hashed as left-out text), its statistics box (the book floats it at the top of the second column of one of its pages) becomes
#             the `ancestry` entry's fields and special abilities, each heading in the entry-header font under its heritages section a `heritage` entry, and each feat under a level band a `feat` entry whose
#             level must be the band's. The bookmark children, the level bands, the feat headers, the trait lines and the level markers are counted, and the table of contents' list of ancestries is compared as a set
#   versatile (parser) a section of versatile heritages: the lore (and the sentence under each title) is read past; each heading that ends in "(Heritage)" is a `heritage` entry that names no ancestry, each feat
#             under a "Lineages" heading (1st level, no band) or a level band is a `feat` entry whose trait line carries the heritage's key, and a part before the first heritage of a section of several is one `rule`
#   backgrounds (parser) the section's text before its first heading is one `rule`; each heading that ends in the background word is a `background` entry whose story is read past, whose description is the rules
#             sentences and whose boosts, trained skills, Lore subject and skill feat are fields
#   classes (parser) one class's whole range: its flavor is read past; its statistics box (the key attribute, which may be a choice of two, and the hit points), its initial proficiencies and its advancement table make the `class` entry's fields and its
#             first feature row; each class feature (an entry-header heading, with its level after the name) is a feature row of the class, with the grants to the sheet's ranked lists that its sentences make; each heading in the block-header font
#             under the feature named by `subclassFeature` is a `subclass` entry (its first paragraph, the flavor, is read past); the class feats under their level bands are `feat` entries. The advancement table must agree with the feature rows
#             (every feature row is in the table at its level, and any other row of the table is a feature gained at an earlier level again); `advancementNames` maps a name the table prints otherwise than the heading does (the reason goes in
#             `countsDiffer`). `saveAttributes` names the attribute key of each saving throw, as the book's own rules say it. The bookmark children, the level bands, the feat headers, the trait lines, the level markers and the book's printed list of the
#             class's feats are counted
#   sidebarFillsColumn / endsAtPage   pages where a sidebar fills a whole column, so the opening text of the next column is the page's own; bookmark paths whose next section opens a page with no title block of its own, so the section ends with its page
#   bodySidebars (rules parser with subheadings) titles of taken sidebars read as the body of a rule; boxesLast (rules parser with subheadings) titles of boxes set over a column the text runs on in, read after the entry's text
#   noTraitLine / noIcon (actions parser) the number of action headings with no trait line and with no icon that the row's countsDiffer reason is for (the run compares them); splitLoneFields (actions parser) cuts an action's one labelled paragraph after its first sentence
#   foldSections (rules parser) as foldChildren, for a section whose children are titled in the section font (an overview of short paragraphs, or the general rules of effects); the children's bookmarks are counted against those headings (countsDiffer gives a reason when one has no heading)
#   artPages / sidebarSpill (rules parser) pages whose pictures are labelled with names and numbers (a display block, a body block of up to five words with no full stop, a block-header of up to four words that opens with a digit), or where the lines of a sidebar that is not taken run on past
#             the gutter (every block in the body font is the sidebar's): skipped, and hashed for the denylist with the text left out
#   actionGroups (actions parser) the section's child bookmarks are groups of actions (headings in the entry-header font), counted against those headings; a group that holds no text of its own makes no rule
#   sidebars  (rules parser) the path of a sidebar bookmark that states rules; a bookmark of two sidebars ("Sidebars: X & Y") takes the title of the one taken as its last segment, and the other stays out. entryNames may rename it by its last segment
#   A path segment may be the hash of a title the file must not hold: `#` and the SHA-256 of the title's slug (which is also the `entryHash` of the redaction row that renames the entry); the entry is named by the title until that row renames it, and the hash is not in its source
#   bands / artRegions / bodyAsRules / leftOutSections (rules parser) bands: a page that is one column with strips of two (`page: [[top, bottom, x]]`, y in points from the foot): each strip is cut at its gutter x, and the blocks follow the page from the top;
#             artRegions: rectangles (`page: [[left, top, right, bottom]]`) that a picture's own text fills (a character sheet shown whole): a block wholly inside one is skipped as text and hashed with the text left out; bodyAsRules: pages whose text is set in
#             the sidebars' font though it is the page's own, read as rules text; leftOutSections: the sections below the taken ones that the row leaves out, so every bookmark below a taken section is counted as an entry's own, inside a taken path or left out
#   planned   (below the rows) sections a later chapter takes: not read, only not counted as "left out" by the denylist generator
# Dropped material is never named here: the setting, religion, example-of-play and map sections are simply absent.
# A path that names anything but a game term does not belong in this file.
rows:
  - chapter: conditions
    book: pc
    parser: entries
    target: condition
    approved: true
    paths:
      - [Conditions Appendix, List of Conditions]
  - chapter: conditions
    book: pc
    parser: rules
    target: rule
    category: Conditions
    approved: true
    paths:
      - [Conditions Appendix, Condition Values]
      - [Conditions Appendix, Overriding Conditions]
    # The appendix's own intro rule, before its first child section, is its own rule entry named by ownName (our word). It is never dropped silently.
    own:
      - [Conditions Appendix]
    ownName: Conditions
  # The glossary is one alphabetical list with the index. Only an entry whose term is followed by the trait mark and some text is taken; the rest of the list is read past.
  - chapter: glossary-traits
    book: pc
    parser: glossary
    target: trait
    approved: true
    # The bookmarks end the glossary a page early: its last lines are at the top of the page the backmatter starts on.
    spillsOnto: 464
    paths:
      - ["Glossary & Index"]
  # The feats chapter has no child bookmarks, so its entries are found by the entry-header font alone.
  - chapter: feats
    book: pc
    parser: entries
    target: feat
    # The feats' headers are in the block-header font, set in capitals and ending in the word and the level; the chapter's introduction and overview tables come before the first one.
    headerRole: block-header
    levelWord: feat
    approved: true
    paths:
      - ["Chapter 5: Feats"]
  # The skills chapter. Its rules prose is `rule` entries of the category Skills (one per section, so nothing is dropped silently); a skill's own text, the skills' actions
  # and the general skill actions are `action` entries, and the rules text between them is rules too (a skill's description, a subsection). The actions have no bookmarks of
  # their own: the `actions` parser reads the headings in order. Sidebars are all left out.
  - chapter: skills
    book: pc
    parser: rules
    target: rule
    category: Skills
    approved: true
    tableRows: true
    # The chapter's own introduction, before its first section.
    own:
      - ["Chapter 4: Skills"]
    ownName: Skills
  - chapter: skills
    book: pc
    parser: rules
    target: rule
    category: Skills
    approved: true
    tableRows: true
    own:
      - ["Chapter 4: Skills", Skill Checks and DCs]
    ownName: Skill Checks and DCs
  - chapter: skills
    book: pc
    parser: rules
    target: rule
    category: Skills
    approved: true
    tableRows: true
    paths:
      - ["Chapter 4: Skills", Key Attribute]
      - ["Chapter 4: Skills", Skill Actions]
      - ["Chapter 4: Skills", Skill Checks and DCs, Armor and Skills]
      - ["Chapter 4: Skills", Skill Checks and DCs, Secret Checks]
  # The last section of the checks has two overview tables after its text (page numbers, and the actions of each skill): they are read past, and the actions are counted from them.
  - chapter: skills
    book: pc
    parser: rules
    target: rule
    category: Skills
    approved: true
    tableRows: true
    tailFromHeader: true
    paths:
      - ["Chapter 4: Skills", Skill Checks and DCs, Exploration and Downtime Activities]
  - chapter: skills
    book: pc
    parser: actions
    target: action
    category: Skills
    approved: true
    tableRows: true
    countsDiffer: Two jumps have an action icon and no trait line, and the actions that take no set number of actions (exploration, downtime and the like) have no action icon (some have exploration or downtime for a trait, some neither), so the headings, trait lines and icons are counted three ways that differ by those; every heading has an icon or a trait line, or it would not be a heading.
    paths:
      - ["Chapter 4: Skills", General Skill Actions]
  - chapter: skills
    book: pc
    parser: actions
    target: action
    category: Skills
    approved: true
    tableRows: true
    leadName: Skill Descriptions
    countsDiffer: Two jumps have an action icon and no trait line, and the actions that take no set number of actions (exploration, downtime and the like) have no action icon (some have exploration or downtime for a trait, some neither), so the headings, trait lines and icons are counted three ways that differ by those; every heading has an icon or a trait line, or it would not be a heading.
    paths:
      - ["Chapter 4: Skills", Skills]
  # The spells chapter (5a). Its rules prose is `rule` entries of the category Spells: the chapter's own introduction, each section's own text, and each child section on its own. A
  # heading with no bookmark inside a section (a sub-subsection, an activity's name, the format line of the spell example) is a paragraph of the entry. Sidebars are all left out.
  - chapter: spells
    book: pc
    parser: rules
    target: rule
    category: Spells
    approved: true
    own:
      - ["Chapter 7: Spells"]
    ownName: Spellcasting
  - chapter: spells
    book: pc
    parser: rules
    target: rule
    category: Spells
    approved: true
    subheadings: true
    # The only sections whose text goes on over a page break above the next title: the end of Heightened Spells (the next page's first lines), Innate Spells, and Targets (the whole page between is a sidebar).
    runsToTitle:
      - ["Chapter 7: Spells", Spell Slots, Heightened Spells]
      - ["Chapter 7: Spells", Innate Spells]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets", Targets]
    own:
      - ["Chapter 7: Spells", Spell Slots]
      - ["Chapter 7: Spells", Focus Spells]
      - ["Chapter 7: Spells", Casting Spells]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets"]
      - ["Chapter 7: Spells", Durations]
      - ["Chapter 7: Spells", Defenses]
    paths:
      - ["Chapter 7: Spells", Spell Slots, Prepared Spells]
      - ["Chapter 7: Spells", Spell Slots, Spontaneous Spells]
      - ["Chapter 7: Spells", Spell Slots, Heightened Spells]
      - ["Chapter 7: Spells", Cantrips]
      - ["Chapter 7: Spells", Focus Spells, Spellcasters with Focus Spells]
      - ["Chapter 7: Spells", Focus Spells, Non-Spellcasters with Focus Spells]
      - ["Chapter 7: Spells", Focus Spells, Focus Points from Multiple Sources]
      - ["Chapter 7: Spells", Innate Spells]
      - ["Chapter 7: Spells", Casting Spells, Costs and Loci]
      - ["Chapter 7: Spells", Casting Spells, Long Casting Times]
      - ["Chapter 7: Spells", Casting Spells, Disrupted and Lost Spells]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets", Touch Range]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets", Areas]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets", Targets]
      - ["Chapter 7: Spells", "Ranges, Areas, and Targets", Line of Effect]
      - ["Chapter 7: Spells", Durations, Sustaining Spells]
      - ["Chapter 7: Spells", Durations, Long Durations]
      - ["Chapter 7: Spells", Durations, Dismissing]
      - ["Chapter 7: Spells", Defenses, Basic Saving Throws]
      - ["Chapter 7: Spells", Spell Attacks]
      - ["Chapter 7: Spells", Identifying Spells]
      - ["Chapter 7: Spells", Counteracting]
      - ["Chapter 7: Spells", Hostile Actions]
      - ["Chapter 7: Spells", Setting Triggers]
      - ["Chapter 7: Spells", Walls]
      - ["Chapter 7: Spells", Reading Spells]
  # The four tradition lists are read past: they give no entry, only the independent count of the spells (name, rank, tradition).
  - chapter: spells
    book: pc
    parser: spelllists
    target: spell
    approved: true
    # A list goes on at the top of the page its next list starts on.
    runsToTitle:
      - ["Chapter 7: Spells", Spell Lists, Arcane Spells]
      - ["Chapter 7: Spells", Spell Lists, Divine Spells]
      - ["Chapter 7: Spells", Spell Lists, Occult Spells]
      - ["Chapter 7: Spells", Spell Lists, Primal Spells]
    paths:
      - ["Chapter 7: Spells", Spell Lists, Arcane Spells]
      - ["Chapter 7: Spells", Spell Lists, Divine Spells]
      - ["Chapter 7: Spells", Spell Lists, Occult Spells]
      - ["Chapter 7: Spells", Spell Lists, Primal Spells]
  # The spells themselves have no child bookmarks. A header is `NAME [icon] SPELL n` or `NAME [icon] CANTRIP n` in the block-header font; a heading of the same font that has no such
  # shape starts a box among the spells: two are taken as rules (a table of the creature level a summon can reach, the stats of one spell's creature) and one is read past.
  - chapter: spells
    book: pc
    parser: entries
    target: spell
    category: Spells
    approved: true
    headerRole: block-header
    levelWord: spell|cantrip
    boxes:
      - The Summon Trait
      - Phantasmal Minion Statistics
    readPastBoxes: 1
    paths:
      - ["Chapter 7: Spells", Spell Lists, Spells]
  # The focus spells (5b). A header is `NAME [icon] FOCUS n` or `NAME [icon] CANTRIP n` (a class's focus cantrip), set under the heading of its group (a class, then a domain, an order, a school or a tier).
  # The groups' headings are the section's bookmark children and grandchildren, and no group has any text of its own.
  - chapter: spells
    book: pc
    parser: entries
    target: spell
    approved: true
    headerRole: block-header
    levelWord: focus|cantrip
    groups: true
    tableRows: true
    paths:
      - ["Chapter 7: Spells", Spell Lists, Focus Spells]
  # The rules of casting a ritual: its own text, then each child section. The section on checks holds a smaller heading with a bookmark of its own (secondary checks) that is a paragraph of its text.
  - chapter: spells
    book: pc
    parser: rules
    target: rule
    category: Spells
    approved: true
    subheadings: true
    tableRows: true
    # The checks section goes on over a page break above the next title.
    runsToTitle:
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Checks]
    own:
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals]
    paths:
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Learning Rituals]
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Cost]
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Secondary Casters]
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Checks]
      - ["Chapter 7: Spells", Spell Lists, Rituals, Casting Rituals, Effect]
  # The rituals themselves: `NAME RITUAL n`, a trait line, and the stat lines of a ritual (its casting time, cost, checks and casters, then the spell's own). The book lists them by rank under a
  # heading in the rules above, which is the count; a table of the cost by creature level sits among them and is a rule.
  - chapter: spells
    book: pc
    parser: entries
    target: spell
    category: Spells
    approved: true
    headerRole: block-header
    levelWord: ritual
    listHeading: Rituals by Rank
    tableRows: true
    boxes:
      - Creature Creation Rituals
    paths:
      - ["Chapter 7: Spells", Spell Lists, Rituals, Rituals]
# The equipment chapter (6a, then the gear: 6b, the last two rows). Its rules prose is `rule` entries of the category Equipment; the item statistics are in tables (armor, shields, weapons), which the stat table reader
# carves out of their pages, and each row of a table is joined by name to the paragraph that describes it (the `items` parser). Sidebars are all left out.
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    tableRows: true
    # The headings of the chapter's sections (a section's own title and its children's) share one font, so the chapter's own text cannot be counted against its bookmark children by font.
    countsDiffer: The chapter's section headings and their children's share a font, so the count by font does not apply to the chapter's own text.
    own:
      - ["Chapter 6: Equipment"]
    ownName: Equipment
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    tableRows: true
    subheadings: true
    artLabels: true
    # A section whose text goes on over a page break above the next title.
    runsToTitle:
      - ["Chapter 6: Equipment", Carrying Items, Drawing and Stowing Items]
      # The box of the broken condition sits at the top of the next page, above the next section's title.
      - ["Chapter 6: Equipment", Item Damage, Object Immunities]
    own:
      - ["Chapter 6: Equipment", Coins and Currency]
      - ["Chapter 6: Equipment", Carrying Items]
      - ["Chapter 6: Equipment", Bulk]
      - ["Chapter 6: Equipment", Item Damage]
      - ["Chapter 6: Equipment", Items and Sizes]
    paths:
      - ["Chapter 6: Equipment", Coins and Currency, Other Currency]
      - ["Chapter 6: Equipment", Price]
      - ["Chapter 6: Equipment", Item Level]
      - ["Chapter 6: Equipment", Carrying Items, Wielding Items]
      - ["Chapter 6: Equipment", Carrying Items, Drawing and Stowing Items]
      - ["Chapter 6: Equipment", Bulk, Bulk Limits]
      - ["Chapter 6: Equipment", Bulk, Bulk Values]
      - ["Chapter 6: Equipment", Bulk, Estimating an Item’s Bulk]
      - ["Chapter 6: Equipment", Bulk, Bulk of Coins]
      - ["Chapter 6: Equipment", Bulk, Bulk of Creatures]
      - ["Chapter 6: Equipment", Bulk, Dragging]
      - ["Chapter 6: Equipment", Item Damage, Object Immunities]
      - ["Chapter 6: Equipment", Shoddy Items]
      - ["Chapter 6: Equipment", Items and Sizes, Bulk Conversions for Different Sizes]
      - ["Chapter 6: Equipment", Items and Sizes, Items of Different Sizes]
  # Armor: the rules of wearing it, its specialization effects, and the statistics of the table. The statistics section's children are the table's columns, each a paragraph of one rule.
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    tableRows: true
    artLabels: true
    paths:
      - ["Chapter 6: Equipment", Armor, Armor Class]
      - ["Chapter 6: Equipment", Armor, Donning and Removing Armor]
      - ["Chapter 6: Equipment", Armor, Armor Specialization Effects]
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    artLabels: true
    foldChildren: true
    subheadings: true
    proseBoxes: true
    runsToTitle:
      - ["Chapter 6: Equipment", Armor, Armor Statistics]
    paths:
      - ["Chapter 6: Equipment", Armor, Armor Statistics]
      - ["Chapter 6: Equipment", Shields, Shield Statistics]
      - ["Chapter 6: Equipment", Weapons, Weapon Statistics]
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    tableRows: true
    artLabels: true
    proseBoxes: true
    own:
      - ["Chapter 6: Equipment", Shields]
    paths:
      - ["Chapter 6: Equipment", Shields, Attacking With a Shield]
      - ["Chapter 6: Equipment", Weapons, Attack Rolls, Multiple Attack Penalty]
      - ["Chapter 6: Equipment", Weapons, Damage Rolls]
      - ["Chapter 6: Equipment", Weapons, Critical Hits]
      - ["Chapter 6: Equipment", Weapons, Unarmed Attacks]
      - ["Chapter 6: Equipment", Weapons, Improvised Weapons]
      - ["Chapter 6: Equipment", Weapons, Critical Specialization]
  - chapter: equipment
    book: pc
    parser: rules
    target: rule
    category: Equipment
    approved: true
    tableRows: true
    proseBoxes: true
    runsToTitle:
      - ["Chapter 6: Equipment", Weapons, Weapon Traits]
    paths:
      - ["Chapter 6: Equipment", Weapons, Weapon Traits]
    own:
      - ["Chapter 6: Equipment", Weapons, Attack Rolls]
  # The items. A description is a paragraph that opens with the item's name and a colon; its statistics are the row of a table with the same name. A row of a table that is not an item, or an item of the gear
  # chapter that the weapons table lists, is excluded by name with its reason.
  - chapter: equipment
    book: pc
    parser: items
    target: armor
    folder: armor
    itemKind: armor
    approved: true
    artLabels: true
    countsDiffer: The first row of the unarmored table says no armor is worn, which is no item and has no description.
    exclude:
      - No armor
    tables:
      - ["Chapter 6: Equipment", Armor]
    tableColumns:
      - ["Price", "AC Bonus", "Dex Cap", "Check Penalty", "Speed Penalty", "Bulk", "Group", "Armor Traits"]
      - ["Price", "AC Bonus", "Dex Cap", "Check Penalty", "Speed Penalty", "Strength", "Bulk", "Group", "Armor Traits"]
    paths:
      - ["Chapter 6: Equipment", Armor, Armor Descriptions]
  - chapter: equipment
    book: pc
    parser: items
    target: armor
    folder: armor
    itemKind: shield
    approved: true
    artLabels: true
    tables:
      - ["Chapter 6: Equipment", Shields]
    tableColumns:
      - ["Price", "AC Bonus", "Speed Penalty", "Bulk", "Hardness", "HP (BT)"]
    paths:
      - ["Chapter 6: Equipment", Shields, Shield Descriptions]
  - chapter: equipment
    book: pc
    parser: items
    target: weapon
    itemKind: weapon
    approved: true
    artLabels: true
    countsDiffer: The alchemical bomb is a weapon of the gear chapter whose statistics are there, so its table row and its description are left to that step.
    exclude:
      - Alchemical bomb
    # A fist is a row of the unarmed attacks table with no paragraph of its own; its entry is its row, and the unarmed attacks rule has the rest. The four kinds of ammunition are described but listed under the weapons that fire them.
    undescribed:
      - Fist
    ruleDescriptions:
      - Arrow
      - Blowgun Dart
      - Bolt
      - Sling Bullet
    ruleName: Kinds of Ammunition
    ruleCategory: Equipment
    tables:
      - ["Chapter 6: Equipment", Weapons]
    tableColumns:
