  - { book: pc, entry: rest-and-daily-preparations, field: description, span: { sha256: "bffb1cb9509134ff1f2ab1b0bfca31668db6e7f21723648fca7ffcc61dfb167d", length: 100 }, action: replace, text: "• You invest up to 10 worn magic items to gain their benefits for the day.", reason: *c9r2 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "2eee6cbc97a7aecc4aadcce82cfad25cb691517a2a37f1f9eeadaaed3e1e3ff0", length: 54 }, action: replace, text: "You can Delay to change when you take your turn.", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "2d16113682492c6528b056c9e6ebd898039d72fa6632e02186abe8360dcd3b18", length: 45 }, action: replace, text: "Related: Activities, disrupting actions", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "256c2820b5b3ab9943f2ad7d139d531f691ba2ee44ead476b6e4d707ceb50bd0", length: 77 }, action: replace, text: "Related: Flat checks, fortune and misfortune, secret checks", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "cf306bbf1568df8916ac8a0d7e1eb24739f96da21799eea5d36cfa3c43985251", length: 213 }, action: replace, text: "Related: Escape a grab or restraint, falling, forced movement, moving through creatures, special movement modes (burrow, climb, fly, and swim), travel speed outside of encounters", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "8314aa668bed0cb96ba26dac90999ee79df17e217e288932e08ff38cd36a6144", length: 92 }, action: replace, text: "Related: Cover, flanking enemies, spell attacks, targeting creatures", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "ae6365ad3f610491ca2c220ef23235573bb65fad04d43acc18eb51fcc9a2e257", length: 54 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "9d9bcd6fd6779ae1ce7cc72797f780bace5adeba03630198bc6f9a35c9c4908f", length: 48 }, action: replace, text: "Related: Dismiss and Sustain basic actions", reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "7eb811c1c963e36347d39fa555042686b825acdfbd5086b7653380ba55c7ae6f", length: 37 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: rules-overview, field: description, span: { sha256: "69f2d50d17c921f39ac1c15b1781cb55ddfeff13d3ede08492ac785d4ce38fff", length: 66 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: secret-check-rolls, field: description, span: { sha256: "1f6b899b39be48f010a9547706a2f077139e6fa0c0cfc830578d8580052d6ab6", length: 344 }, action: replace, text: "If you don't know a secret check is happening (for instance, if the GM rolls a secret Fortitude save against a poison that you failed to notice), you can't use any fortune or misfortune abilities on that check, but if a fortune or misfortune effect would apply automatically, the GM applies it to the secret check.", reason: *c9r3 }
  - { book: pc, entry: senses, field: description, span: { sha256: "f4de0861eeda1a8fb7c5f24f5a1d1dcbb6367cc505cea36d79d5162b8ec7b992", length: 125 }, action: replace, text: "The rules assume that a given creature has vision as its only precise sense and hearing as its only imprecise sense.", reason: *c9r4 }
  - { book: pc, entry: skill-checks, field: description, span: { sha256: "7a64a751ac35b030a676c6d5acd97627114305ecddac03d994b70bd4bead7028", length: 76 }, action: replace, text: "The game has a variety of skills, from Athletics to Medicine to Occultism.", reason: *c9r4 }
  - { book: pc, entry: skill-checks, field: description, span: { sha256: "b1fb35515d63c5eb39e5a0374b5360b2e9ac5b9983ab18a0fb7108e4e987a490", length: 85 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: skill-checks, field: description, span: { sha256: "cbd1a25d85fea94d0cb17bec48744164b4f7ecfb9ec32b52e6eaf86eafecb1e8", length: 142 }, action: replace, text: "Sometimes a skill action can be an attack, and in these cases, the skill check might take a multiple attack penalty.", reason: *c9r3 }
  - { book: pc, entry: special-battles, field: description, span: { sha256: "5364b0514b8d717b61029989babe146681ec39727039c5b8496537a78999d2e0", length: 77 }, action: replace, text: "Creatures might fall from the sky, using the falling rules.", reason: *c9r3 }
  - { book: pc, entry: special-senses, field: description, span: { sha256: "bfcd70f03ccc2e1b2ff71bfa0688090de7192926bc0d4cc14444395ccaba2121", length: 192 }, action: replace, text: "Special senses allow a creature to ignore or reduce the effects of the undetected, hidden, or concealed conditions when it comes to situations that foil average vision.", reason: *c9r3 }
  - { book: pc, entry: step-1-roll-d20, field: description, span: { sha256: "f2350e9dc901891869cfe42cf55cada185997dd14c27d5200f343500cce6e78f", length: 79 }, action: replace, text: "Attribute modifiers represent your raw capability.", reason: *c9r3 }
  - { book: pc, entry: step-1-roll-damage-dice, field: description, span: { sha256: "a77dcb6c301a9c0f288566b5c80c36ae55ac8fb0afbd89dfcc88e8ef31f69f8a", length: 105 }, action: replace, text: "See the persistent damage condition for the complete rules.", reason: *c9r3 }
  - { book: pc, entry: step-2-damage-type, field: description, span: { sha256: "fc480fa9978b84201ddc747bfbca51456678e8dd3c6a4082270d566dad24ce00", length: 43 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: step-3-apply-immunities-weaknesses-and-resistances, field: description, span: { sha256: "6d90c263ecaea15dcc328b090c0a0e49b23377bc269ae00a2c8193b15f5a091f", length: 12 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: step-4-reduce-hit-points, field: description, span: { sha256: "b69782635c9b773e2b97d18950f66f16a3054af61aca6e3d192cbb1d1caf71c5", length: 88 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: step-4-reduce-hit-points, field: description, span: { sha256: "9607fda4c7a040df220b5e2e5df2c64e08a5876a6104b6f4329ea4758b62503e", length: 117 }, action: replace, text: "You can make a nonlethal attack to knock someone out instead of killing them.", reason: *c9r3 }
  - { book: pc, entry: structure-rule, field: description, span: { sha256: "9f92484596f77cc4a9b3517dcfee67f0a237432d51f96e3dc1048af869a7862f", length: 45 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "349b7502c17ef844e003318346f3eb50931d70e1995df45e5da03209a3f1586a", length: 242 }, action: replace, text: "If an encounter involves combat, it's often a good idea to track the movement and relative position of the participants using a battle mat or some other form of grid to display the terrain, and miniatures to represent the combatants.", reason: *c9r4 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "5ee52e3abd2626414593d3b6b746c6b07bcc99e918a21274d91b8fb265f2c4b1", length: 91 }, action: replace, text: "Difficult terrain can make some squares cost more of your movement.", reason: *c9r3 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "390273798083bd6556ef04becd8a938f83063b9c0dbcd135af03e864e779586a", length: 41 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "63e8e1efe3aa2bbef86ecf163b459b551cdd3bb640588bd14bceb663580a8216", length: 137 }, action: replace, text: "If creatures are flying, swimming, or otherwise moving through three-dimensional space, see the advice under Special Battles.", reason: *c9r3 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "20879b59021e38cc8a7ce823e51693ed31afa2ca1326720bb2984d4cdd5d928d", length: 34 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: tactical-movement, field: description, span: { sha256: "e4032f2c5ca24a79a10ad43dd7c78731d8f16fa3670cc2eb5a61315166989aa3", length: 114 }, action: replace, text: "If you want to move through an unwilling creature's space, you can Tumble Through it.", reason: *c9r3 }
  - { book: pc, entry: terrain, field: description, span: { sha256: "154b7242c2a9c3e12aab3d0304fa49596a54560c950eb7e126f9d9de47fc6078", length: 111 }, action: replace, text: "A narrow surface is so precariously thin that you need to Balance or risk falling.", reason: *c9r3 }
  - { book: pc, entry: terrain, field: description, span: { sha256: "5019aef89190cfc16244f369a7cf604f0cd98df0e72a2b23aefee16a6116daeb", length: 197 }, action: replace, text: "Uneven ground is an area unsteady enough that you need to Balance or risk falling prone and possibly injuring yourself, depending on the specifics of the uneven ground.", reason: *c9r3 }
  - { book: pc, entry: turns, field: description, span: { sha256: "2cefd77a2dbae2d37daf43f5ec67da28632e7ca13cd1bc9f3c3434401ce3b570", length: 56 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: turns, field: description, span: { sha256: "525ab5b1dbbcfa25eff175b82c847bb4c4c9f9a90a7e888767eb6b6dd4f0fccc", length: 173 }, action: replace, text: "What actions you can use often depend on your class features, skills, feats, and items, but there are default actions anyone can use.", reason: *c9r3 }
  - { book: pc, entry: using-basic-actions, field: description, span: { sha256: "7439e4a69cb7dc8aafedd64057f64106508d7bb332e1b0f91e126094a7d06dd6", length: 142 }, action: replace, text: "Actions that are used less frequently but are still available to most creatures are presented in Specialty Basic Actions.", reason: *c9r3 }
  - { book: pc, entry: using-basic-actions, field: description, span: { sha256: "43c5a6d380f213cb08b6b529d7764d124aea772193f9cbc8127aaad54f9a820e", length: 178 }, action: replace, text: "In addition to the actions in these two sections, there are actions for spellcasting and for using magic items.", reason: *c9r2 }
  - { book: pc, entry: cover, field: description, span: { sha256: "65e23e9b3cabb66b5ddb7b1ea6d383480264290a5d60b5eb38cae811264ded0f", length: 107 }, action: replace, text: "If you're uncertain or need to be more precise, draw a line from the center of your space to the center of the target's space.", reason: &c9r5 "The first sentence of a picture's caption ran into the text; the sentence is said whole, as the text goes on after the caption." }
  - { book: pc, entry: cover, field: description, span: { sha256: "6bc54f13bea593dc5e1c8e6b16249e669d1ce99cbeac65f2a10f36e1d86f1fd4", length: 2 }, action: cut, reason: &c9r6 "The caption of a picture of the cover rules: an example with named characters, not a rule." }
  - { book: pc, entry: cover, field: description, span: { sha256: "6c465fdfce357f3a15eaf1857e396a9252b46a0df1bc286122ec604b628c5378", length: 54 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "c8e07e4add74a312e0fb874948968ecd88c531143ab07d1a067b970b8ac0a2fc", length: 126 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "267c23695b6e8fc29bd88b9f5d1962d3d208fa9c2fafd974614e6ab3b84fa55c", length: 2 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "d643bca1c4c45c10cf144f13919e33f31488ffbf8e0ebda03ca70c1db3f85e23", length: 59 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "0eb781e69a17d7baa114cd869ad1a80f74174281d75c7321bb1d8ada7d114bae", length: 70 }, action: replace, text: "If the line between the centers of two spaces crosses blocking terrain, the creatures have cover from one another.", reason: &c9s6 "The caption of a picture of the cover rules said its example with named characters; the rule it showed is said without them." }
  - { book: pc, entry: cover, field: description, span: { sha256: "23f663630e2f28250c09d7a0c370f55eebf635772f9ce27e46797ab8ef297f4b", length: 2 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "2519d5b248b1a9c993be339cd13a6c55071e60b71eab7faebe29d7770f04c4d6", length: 161 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "2485f73c9ea9b209a56313c93d9f87091d847fc70515d9f67d1f87fac75df6b2", length: 56 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "8d798df3df939ed142c288727270e4642c56d6300dd7cd1805e706bdd2aad70d", length: 42 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "b9dae4071da92880c3e84c14a34181afb6bbd821c5e7ffb3b2c33f42b3cfa3e1", length: 29 }, action: cut, reason: *c9r6 }
  - { book: pc, entry: cover, field: description, span: { sha256: "57e4246b2af205dc5da61d301d4953c774435f8ab55385a8c52a6dfd1f3c1286", length: 29 }, action: cut, reason: *c9r3 }
  - { book: pc, entry: flanking, field: description, span: { sha256: "50b042c2d61c26abb8596aaeee3625cac13da13f8d7fd8d1d4f5d9ad931f0349", length: 178 }, action: replace, text: "For instance, if one creature is underneath a flying sphinx while an ally is flying above the sphinx, they might be flanking it even if they're piled in an odd stack on your battle grid.", reason: &c9r7 "An example with named characters, said with none." }
  - { book: pc, entry: flanking, field: description, span: { sha256: "655e0c78cae9b6a2a8331409831b27d920f4da3b3218798f7e0539a328b0c6c7", length: 108 }, action: replace, text: "And if a creature were mounted on a horse, it might be able to measure from farther off the ground than normal.", reason: *c9r7 }
  - { book: pc, entry: instant-death, field: description, span: { sha256: "fdcf8e3edac11044e9d72906d096444b1188faac217d1a500c3a6701fe484f35", length: 156 }, action: replace, text: "For instance, an extremely powerful entity of death can automatically slay creatures who fail their save against its death strike ability.", phrases: ["ddf581efc74ffa356246b13f203ed7f2f960363af827d14ab22cfd327877de74"], reason: &c9s4 "An example that named a creature of the setting's bestiary; the example is kept without the name." }
  - { book: pc, entry: secret-check-rolls, field: description, span: { sha256: "ef454fc0187bb44963e637b376251e83eac371154cceab8b6584afb0aea7d424", length: 161 }, action: replace, text: "Some groups find it simpler to have players roll all secret checks and just try to avoid acting on any out-of-character knowledge, while others enjoy the mystery.", reason: &c9s5 "The extraction had run two words of a compound together at a line end; the compound is restored." }
  - { book: pc, entry: immunity, field: description, span: { sha256: "b9d7e4e2e8f5d2b1853a1fd0c4ddcc4a6b2a750e740b34773eafd791f6653eea", length: 142 }, action: replace, text: "If an effect grants you temporary immunity, repeated uses of that effect don't affect you for as long as the temporary immunity lasts.", reason: &c9s7 "A word that an earlier row takes out of another sentence stood here in an ordinary sense; the sentence says it another way." }
  - { book: pc, entry: cone, field: description, span: { sha256: "3bc49938c0b12aba208f062534726073a38de768bb02cda4fa2a35132cb4b3bb", length: 94 }, action: replace, text: "The cone extends out for a number of feet, widening as it goes.", reason: *c9r3 }
  - { book: pc, entry: light-rule, field: description, span: { sha256: "7576079edc6033a4e7e0b61a30979e5337e7cd90f783fab2041fc4588a26ea91", length: 92 }, action: replace, text: "The rules assume that all creatures are in bright light unless otherwise noted.", reason: *c9r3 }
  - { book: pc, entry: damage-types, field: description, span: { sha256: "6e05cc0c2399bd9d7728fae71a6f537859411deae173d64b90dc4e082c0baa37", length: 60 }, action: replace, text: "Damage has a number of different types and categories, which are described below.", reason: &c9t4 "Lines of a picture's labels and a box ran into the sentence in the extraction; the text is put back in order." }
  - { book: pc, entry: damage-types, field: description, span: { sha256: "1f45e744ca67bdf33d1d1da8ce6c1808f0a0dbf77c061c6f0456acd3897c5d66", length: 20 }, action: cut, reason: *c9t4 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "fa4b0728002be42402423bed16d9c6ae075498538d38dfca33609ee066883bf7", length: 25 }, action: replace, text: "Result = number on the d20 + proficiency bonus + attribute modifier + circumstance bonus or penalty + status bonus or penalty + item bonus or penalty + all untyped penalties. If you have more than one bonus or penalty of a particular type, apply only the highest bonus or the worst penalty.", reason: &c9t5 "The box that sets out how a check result is calculated was read in scrambled order; it is said whole, from its own words." }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "69636b1da8bb8bd95a3fc9354aedc53fc2344fdffceaefbe0b05adba0610fa1a", length: 48 }, action: cut, reason: &c9t6 "The box that sets out how a check result is calculated was read in scrambled order; it is said whole by the sentence before." }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "fb907481c9eb524a61f17b6ecd240e504fcafb7b05c3608b4bca8573f7c715a5", length: 11 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "3e0db2808639c929edf83a25a2d1f968f9932b2d77106382763746143231c41c", length: 32 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "98437957a9df3773119702b204df0c1d425cfa45f41af0074fa5f5cfbf273792", length: 23 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "652bcc3a478428893cc505ae19f847b49be52f861bedc64bb192ceed409fa733", length: 4 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "0fb4f8a00db66cd8fbe440774083eb0fa7f26d5e07af20528ab278a2b1e0a6ac", length: 86 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: step-4-degree-of-success, field: description, span: { sha256: "ba1ac1d2b93f5bceb4fadb46c501eaf1a62ca48b32c95a3e24cfade3378e80cf", length: 53 }, action: cut, reason: *c9t6 }
  - { book: pc, entry: format, field: description, span: { sha256: "c95beab4860382cb3c6818438b23b1146c52aaf0df627b13e1c4084824baf71c", length: 82 }, action: replace, text: "This first attempt to stave off the affliction is called the initial save.", reason: *c9t4 }
  - { book: pc, entry: format, field: description, span: { sha256: "c84674e7f5fdfbfb491f3eb6dadf2f5f213b4d4f700b58a229fd32d603bc02a2", length: 32 }, action: replace, text: "An affliction usually requires a Fortitude save, but the exact save and its DC are listed after the name and type of affliction.", reason: *c9t4 }
  - { book: pc, entry: format, field: description, span: { sha256: "63db6bf357ffad7dcc5dd6fe46015068df1e593bfec6fc74a94a0038aae656b4", length: 95 }, action: cut, reason: *c9t4 }
  # Chapter 9 review fixes: a plane of the cosmology said where the rules mean the energy, and the long form of the role's name.
  - { book: pc, entry: instant-death, field: description, span: { sha256: "82c9a87131d2e9f2dd9a53185980f728ea7736792ab1cf2584ff3ada71d139d4", length: 149 }, action: replace, text: "These abilities have the death trait and usually involve void energy, the antithesis of life, or other effects that target the mind or soul.", reason: "A sentence that named a plane of the setting's cosmology where the rules mean the energy; it is said by the energy." }
  - { book: pc, entry: flanking, field: description, span: { sha256: "47d07f33b05820a1031b2057243b463fbb28e9a9f8491204975fa3cc33b35713", length: 68 }, action: replace, text: "Though battle grids are often flat, the game world isn't!", reason: "A sentence with a word of the name of an institution of the setting (the word stays on the denylist, and is allowed only in one other phrase); it is said by a plain word of the same meaning." }
  - { book: pc, entry: other-actions, field: description, span: { sha256: "72e36b66fccd3eaadb45eadbc55f16ca4a6c4e7a20e8f6e80eb1daa40bfe02fd", length: 111 }, action: replace, text: "The GM can also use this approach when a character tries to do something that isn't covered in the rules.", reason: "A sentence that called the role by the long form of its name; it is said by the short form the rest of the chapter uses, and the mechanic stands." }
