# The redaction table of the local book importer. A row stores only the hash and length of the span it changes, never the span; a `replace`
# row's text is a redacted form of the book's sentence, so it is Licensed Material taken from the book (see LEGAL.md).
# Each row names an entry id and a field, then the SHA-256 and the character length of ONE exact normalized source span (a sentence, or one
# semicolon clause of a sentence; see SpanText.cs for the normalization and the splitter), then an action:
#   replace    swap the span for `text`, our own words (one line, already normalized)
#   cut        remove the span
#   drop-entry leave the whole entry out of the pack
# and a `reason` in our words that names no names. A row whose hash is not found fails the run.
# The replacement text is Licensed Material under the ORC and is released with the packs.
#
# A row names its entry by `entry` (the id) or, when the entry's own name is one the notice reserves, by `entryHash` (the lowercase hex SHA-256 of the id), so the file never holds the name.
# A row names its `book` (pc or mc) and applies only to that book's run; a row with no book applies to every run, so committed rows should always name theirs.
#
# - book: pc
#   entry: some-entry-id
#   field: description
#   span: { sha256: "<64 lowercase hex digits>", length: 42 }
#   action: replace
#   text: "Our own wording of the mechanic."
#   reason: "A sentence that carried a proper noun; the mechanic is kept."
normalization: 2
