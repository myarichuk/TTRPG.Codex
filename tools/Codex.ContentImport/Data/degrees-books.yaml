# What a supported printing of each book looks like, by structure only. No file hash is kept: a hash could tell one buyer's copy from another.
# The keys are the short book keys used everywhere else (pc: the player book, mc: the monster book).
#   pages      page count
#   bookmarks  bookmark count at each depth, from the top level down
#   notice     the bookmark path (titles, top level first) of the page that carries the ORC Notice
#   credit     the upstream credit line, copied from the book's own notice. It is cut at page and column breaks into segments, each of
#              which must appear in the notice page, in whitespace-insensitive form. It is the one place a product name may appear.
# A mismatch stops the run: a different printing needs every chapter reviewed again.
normalization: 1
books:
  pc:
    printing: 1
    pages: 466
    bookmarks: [13, 95, 460, 634, 281, 1]
    notice: [Backmatter, ORC Notice]
    credit:
      - "Pathfinder Player Core © 2023 Paizo Inc., Authors: Logan Bonner, Jason Bulmahn, Stephen Radney-MacFarland, and Mark Seifter, with Alexander Augunas, Kate Baker, Carlos Cabrera, Calder CaDavid, James Case, Eleanor Ferron, Steven Hammond, Joan Hong, Vanessa Hoskins, James Jacobs, Jenny Jarzabski, Erik Keith, Dustin Knight, Lyz Liddell, Luis Loza, Patchen Mortimer, Dennis Muldoon, Mikhail Rekun, David N. Ross, Michael Sayre, Kendra Leigh Speedling, Mark Thompson, Clark Valentine, Andrew White, Landon Winkler, and Linda Zayas-Palmer."
