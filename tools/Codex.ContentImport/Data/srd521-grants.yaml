# The reviewed mapping from SRD 5.2.1 rows to feature grants (docs/SRD_GRANTS_IMPORT_DESIGN.md).
#
# One line per row, beside the SRD text. A row is a grant (uses, spends, modifiers, adds, spells, resist, options, choose, gate) or
# is classified without one:
#   text: <reason>      nothing is written; the player applies it by hand
#   already: <where>    a field or list the system already reads carries it
#   covered: <row>      the effect sits on another row
# Reasons for text: rider (extra damage on a hit), die (a die the feature owns), advantage (advantage, a reroll or a floor on a roll),
# reactive (fires on an event), per-use (a menu chosen each use), gear (needs a gear condition), state (holds only while raging or similar),
# attribute (changes an ability score), skill-bonus (adds to checks, not a rank), training (weapon, armor, tool or language training),
# chosen-spell (the player picks the spell), not-in-source (options the source JSON lacks), moment-test (a refill the engine cannot test),
# sense (blindsight, flight and the like: no sheet field), aura (reaches allies), condition (condition immunity), other (narrative).
#
# A row is matched by name, and by level where a name repeats. A grant must match exactly one row; text, already and covered may name a
# repeated row once for every level. The importer stops, and writes nothing, when a row here matches nothing, a row of the source is not
# here, or a grant does not pass the checks (see GrantTable.cs).
#
# Shorthands: uses.max { column: X } is the step formula over classLevel of the Levels file's class_specific X; uses.$ref copies a pool
# from `pools`; spells is a list of spell ids, or levels each with a list (0: always); resist is a list of damage types; gate: N gives a
# species row the level it applies from.

pools:
  breath-weapon: { key: breath-weapon, label: Breath Weapon, max: proficiencyBonus, recoversOn: [Long Rest] }
  giant-ancestry: { key: giant-ancestry, label: Giant Ancestry, max: proficiencyBonus, recoversOn: [Long Rest] }

