# The eight traps of the System Reference Document 5.2.1 (CC BY 4.0), "Traps" in the Gameplay Toolbox. The 5e-bits transcription the rest of the
# pack is read from has no traps, so they are kept here, in this project's own words, and the importer writes each as an entry of type hazard.
#
# REVIEW BEFORE RELEASE. This file was drafted without reading the SRD document (the project never reads a PDF in the importer, and the draft was
# written from memory). The shapes (which parts a trap has, the four level bands 1-4, 5-10, 11-16 and 17-20, the damage progression 2d10, 4d10,
# 10d10, 18d10) follow docs/HAZARDS_DESIGN.md; every DC, damage die, severity, level band and the wording of each method is to be checked against
# the SRD by a person. A line marked "check" is one whose number the drafter was least sure of (all of them, today).
#
# Fields: id, name, description (the trap in one short paragraph, shown above the numbers), and properties, which are the hazard type's
# fields in content/systems/srd5e/system.yaml. higherLevels rows name only the fields they change; the rest keep the base value.

- id: collapsing-roof
  name: Collapsing Roof
  description: |-
    The ceiling over a corridor or room is held up by little more than a trigger. When something sets it off, tons of stone and timber come down on everyone beneath.
  properties:
    kind: trap
    severity: Deadly
    level: 1-4
    trigger: A pressure plate in the floor or a tripwire across the way.
    noticeCheck: Perception
    noticeDc: 10  # check
    disableCheck: Thieves' Tools
    disableDc: 15  # check
    saveAttribute: Dexterity
    saveDc: 15  # check
    damage: 2d10
    damageType: bludgeoning
    effect: Everything in the area makes the save. Failure takes the full damage and is buried (Restrained) until it digs free; success takes half and is not buried.
    reset: It does not rearm on its own. Rebuilding the roof takes a crew a full day.
    higherLevels:
      - { levels: 5-10, saveDc: 15, damage: 4d10 }  # check
      - { levels: 11-16, saveDc: 17, damage: 10d10 }  # check
      - { levels: 17-20, saveDc: 19, damage: 18d10 }  # check
    methods:
      - { name: Escape, check: Strength, dc: 15, text: "A buried creature, or a friend digging beside it, can make this check to get free." }  # check
      - { name: Avoid, check: Acrobatics, dc: 15, text: "A creature that knows the trigger is there can step over it." }  # check

- id: falling-net
  name: Falling Net
  description: |-
    A weighted net hangs folded in the dark above a door or corridor and drops on whoever pulls its cord.
  properties:
    kind: trap
    severity: Nuisance
    level: 1-4
    trigger: A tripwire at ankle height.
    noticeCheck: Perception
    noticeDc: 10  # check
    disableCheck: Thieves' Tools
    disableDc: 10  # check
    saveAttribute: Dexterity
    saveDc: 10  # check
    effect: A creature that fails the save is Restrained by the net. It deals no damage.
    reset: The net must be folded and hung again by hand.
    higherLevels:
      - { levels: 5-10, saveDc: 12 }  # check
      - { levels: 11-16, saveDc: 14 }  # check
      - { levels: 17-20, saveDc: 16 }  # check
    methods:
      - { name: Escape, check: Strength, dc: 10, text: "The restrained creature can try, or it can be cut loose with 5 points of slashing damage to the net (armor class 10)." }  # check
      - { name: Set, check: Sleight of Hand, dc: 10, text: "Hanging the net again so that it works." }  # check

- id: fire-casting-statue
  name: Fire-Casting Statue
  description: |-
    A stone figure with a hollow mouth stands guard in a hall. When someone crosses the floor in front of it, it breathes a gout of flame.
  properties:
    kind: trap
    severity: Deadly
    level: 1-4
    trigger: A pressure plate in the floor in front of the statue.
    noticeCheck: Investigation
    noticeDc: 15  # check
    disableCheck: Arcana
    disableDc: 15  # check
    saveAttribute: Dexterity
    saveDc: 15  # check
    damage: 2d10
    damageType: fire
    effect: The fire fills a 15-foot cone in front of the statue. Each creature in it takes the damage on a failed save, or half as much on a success.
    reset: The statue breathes again each time the plate is pressed, with no limit.
    higherLevels:
      - { levels: 5-10, saveDc: 15, damage: 4d10 }  # check
      - { levels: 11-16, saveDc: 17, damage: 10d10 }  # check
      - { levels: 17-20, saveDc: 19, damage: 18d10 }  # check
    methods:
      - { name: Destroy, check: Attack, dc: 15, text: "The statue is armor class 15 with 20 hit points, and takes only half damage from anything but bludgeoning." }  # check
      - { name: Avoid, check: Acrobatics, dc: 15, text: "A creature that knows the plate is there can cross without pressing it." }  # check

- id: hidden-pit
  name: Hidden Pit
  description: |-
    A shaft in the floor is covered with a thin lid that looks like the rest of the floor and gives way under any weight.
  properties:
    kind: trap
    severity: Nuisance
    level: 1-4
    trigger: Weight on the lid.
    noticeCheck: Perception
    noticeDc: 10  # check
    disableCheck: Thieves' Tools
    disableDc: 10  # check
    saveAttribute: Dexterity
    saveDc: 10  # check
    damage: 1d6
    damageType: bludgeoning
    effect: A creature that fails the save falls to the bottom, 10 feet down, and takes the damage. Success catches the edge.
    reset: The lid is broken for good. The pit stays, and is now easy to see.
    higherLevels:
      - { levels: 5-10, saveDc: 12, damage: 2d6 }  # check
      - { levels: 11-16, saveDc: 14, damage: 3d6 }  # check
      - { levels: 17-20, saveDc: 16, damage: 4d6 }  # check
    methods:
      - { name: Escape, check: Athletics, dc: 10, text: "Climbing out of the pit without help." }  # check
      - { name: Avoid, check: Acrobatics, dc: 10, text: "Jumping across a pit already known." }  # check

- id: poisoned-darts
  name: Poisoned Darts
  description: |-
    Small holes in a wall hide a rack of darts wetted with venom, ready to fly at whoever steps into the line of fire.
  properties:
    kind: trap
    severity: Deadly
    level: 1-4
    trigger: A pressure plate in the floor or a hidden latch on a chest or door.
    noticeCheck: Investigation
    noticeDc: 15  # check
    disableCheck: Thieves' Tools
    disableDc: 15  # check
    saveAttribute: Dexterity
    saveDc: 15  # check
    damage: 2d10
    damageType: poison
    effect: The darts fly at every creature in the line. Failure takes the damage; success takes half as much.
    reset: The rack holds one volley. It must be refilled and the holes cleaned by hand.
    higherLevels:
      - { levels: 5-10, saveDc: 15, damage: 4d10 }  # check
      - { levels: 11-16, saveDc: 17, damage: 10d10 }  # check
      - { levels: 17-20, saveDc: 19, damage: 18d10 }  # check
    methods:
      - { name: Avoid, check: Acrobatics, dc: 15, text: "A creature that knows where the holes are can slip out of the line." }  # check
      - { name: Set, check: Sleight of Hand, dc: 15, text: "Loading and aiming a fresh rack of darts." }  # check

- id: poisoned-needle
  name: Poisoned Needle
  description: |-
    A needle no bigger than a thorn waits in a lock or a handle, and pricks the hand of anyone who forces it.
  properties:
    kind: trap
    severity: Nuisance
    level: 1-4
    trigger: Opening the lock or handle without the right key.
    noticeCheck: Investigation
    noticeDc: 15  # check
    disableCheck: Thieves' Tools
    disableDc: 15  # check
    saveAttribute: Constitution
    saveDc: 15  # check
    damage: 1
    damageType: piercing
    effect: The pricked creature takes the damage and, on a failed save, is Poisoned for an hour.
    reset: Fresh poison must be put on the needle by hand.
    higherLevels:
      - { levels: 5-10, saveDc: 15 }  # check
      - { levels: 11-16, saveDc: 17 }  # check
      - { levels: 17-20, saveDc: 19 }  # check
    methods:
      - { name: Avoid, check: Thieves' Tools, dc: 15, text: "Opening the lock without touching the needle." }  # check

- id: rolling-stone
  name: Rolling Stone
  description: |-
    A great round stone sits in a niche above a sloping passage, and rolls down it when released, crushing anything in the way.
  properties:
    kind: trap
    severity: Deadly
    level: 11-16
    trigger: A tripwire or a pressure plate at the top of the slope.
    noticeCheck: Investigation
    noticeDc: 15  # check
    disableCheck: Thieves' Tools
    disableDc: 20  # check
    saveAttribute: Dexterity
    saveDc: 15  # check
    damage: 10d10
    damageType: bludgeoning
    effect: The stone rolls the length of the passage. Each creature in its path takes the damage on a failed save, or half as much on a success.
    reset: The stone must be hauled back up the slope and set in its niche.
    methods:
      - { name: Slow, check: Strength, dc: 20, text: "Several creatures can brace against the stone to stop it short of the creatures behind them." }  # check
      - { name: Avoid, check: Athletics, dc: 15, text: "A creature that sees it coming can leap to a side niche." }  # check

- id: spiked-pit
  name: Spiked Pit
  description: |-
    A pit like the hidden one, but the lid is lined beneath with iron spikes, set to catch whoever falls.
  properties:
    kind: trap
    severity: Deadly
    level: 1-4
    trigger: Weight on the lid.
    noticeCheck: Perception
    noticeDc: 15  # check
    disableCheck: Thieves' Tools
    disableDc: 15  # check
    saveAttribute: Dexterity
    saveDc: 15  # check
    damage: 2d10
    damageType: piercing
    effect: A creature that fails the save falls 10 feet onto the spikes and takes the damage. Success catches the edge.
    reset: The lid is broken for good. The spikes stay.
    higherLevels:
      - { levels: 5-10, saveDc: 15, damage: 4d10 }  # check
      - { levels: 11-16, saveDc: 17, damage: 10d10 }  # check
      - { levels: 17-20, saveDc: 19, damage: 18d10 }  # check
    methods:
      - { name: Escape, check: Athletics, dc: 10, text: "Climbing out of the pit without help." }  # check
      - { name: Avoid, check: Acrobatics, dc: 15, text: "Jumping across a pit already known." }  # check
