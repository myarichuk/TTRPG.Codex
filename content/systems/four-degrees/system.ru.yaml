name: Четыре степени
compatibility: Д20 с четырьмя степенями успеха
description: >-
  Система на d20 с четырьмя степенями успеха. Ранги (от обученного до легендарного) равны уровню плюс 2, 4, 6 или 8;
  характеристики строятся из повышений; у состояний есть значение, и одни состояния приносят с собой другие;
  с каждой следующей атакой за ход попасть труднее.

