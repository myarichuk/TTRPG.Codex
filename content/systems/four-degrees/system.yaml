# yaml-language-server: $schema=../../../docs/schema/system.schema.json
# Four Degrees - a data-driven d20 system definition for TTRPG.Codex.
#
# A d20 system whose checks come out in four degrees of success, whose proficiency ranks are worth the character's level plus a
# step, whose bonuses are typed (the highest of a type counts, untyped ones add up), whose conditions carry a value and bring other
# conditions with them, and whose attack penalty grows with each attack of a turn. Its rules are an adaptation of ORC-licensed
# rules, written in this project's own words and released under the ORC (see LEGAL.md). Nothing is copied from any book; the pack's
# names, descriptions and creatures are written for this project.
id: four-degrees
name: Four Degrees
version: 0.1.0
compatibility: Four-degree d20
description: >-
  A d20 system with four degrees of success. Ranks (trained to legendary) are worth the level plus 2, 4, 6 or 8; attributes are
  built from boosts; conditions have a value and bring others with them; each further attack in a turn is less likely to hit.
license:
  name: ORC
  url: https://paizo.com/orclicense
  # The ORC Notice and the upstream credit are copied verbatim from the upstream book's own ORC Notice. The attribution is the one place
  # the upstream publisher and product are named.
  attribution: "This product is based on the following Licensed Material: Pathfinder Player Core © 2023 Paizo Inc., Authors: Logan Bonner, Jason Bulmahn, Stephen Radney-MacFarland, and Mark Seifter, with Alexander Augunas, Kate Baker, Carlos Cabrera, Calder CaDavid, James Case, Eleanor Ferron, Steven Hammond, Joan Hong, Vanessa Hoskins, James Jacobs, Jenny Jarzabski, Erik Keith, Dustin Knight, Lyz Liddell, Luis Loza, Patchen Mortimer, Dennis Muldoon, Mikhail Rekun, David N. Ross, Michael Sayre, Kendra Leigh Speedling, Mark Thompson, Clark Valentine, Andrew White, Landon Winkler, and Linda Zayas-Palmer."
  modified: true
  notices:
    - "ORC Notice: This product is licensed under the ORC License located at the Library of Congress at TX 9-307-067 and available online at various locations including paizo.com/orclicense, azoralaw.com/orclicense, and others. All warranties are disclaimed as set forth therein."
    - "If you use our Licensed Material in your own published works, please credit us as follows: Four Degrees, © 2026 Michael Yarichuk, the TTRPG.Codex project."
    - "Reserved Material: Reserved Material elements in this product include, but may not be limited to: the name Four Degrees and every name invented for it (ancestries, backgrounds, classes, creatures, items, runes, hazards and places), with their descriptive and flavour text, and all elements designated as Reserved Material under the ORC License. The rules and numbers are not reserved."
    - "Expressly Designated Licensed Material: This product contains no Expressly Designated Licensed Material."
    - "Modified from the upstream rules: restated as data in this project's own words, with invented names and content."

attributes:
  # An attribute IS its modifier (`modifier: value`): it starts at +0, a boost adds 1, a flaw takes 1. Typed in by hand it runs -5 to +10.
  - { key: str, label: Strength,     abbreviation: STR, default: 0, min: -5, max: 10, modifier: value }
  - { key: dex, label: Dexterity,    abbreviation: DEX, default: 0, min: -5, max: 10, modifier: value }
  - { key: con, label: Constitution, abbreviation: CON, default: 0, min: -5, max: 10, modifier: value }
  - { key: int, label: Intelligence, abbreviation: INT, default: 0, min: -5, max: 10, modifier: value }
  - { key: wis, label: Wisdom,       abbreviation: WIS, default: 0, min: -5, max: 10, modifier: value }
  - { key: cha, label: Charisma,     abbreviation: CHA, default: 0, min: -5, max: 10, modifier: value }

resources:
  - { key: HP, label: Hit Points, maxKey: HP_Max, default: 10, isPrimary: true }

actorFields:
  - { key: level,       label: Level,       type: Number,          defaultValue: 1, min: 1, max: 20, category: General }
  - { key: ancestry,    label: Ancestry,    type: EntityReference, targetEntityType: ancestry,   category: General }
  - { key: heritage,    label: Heritage,    type: EntityReference, targetEntityType: heritage,   category: General }
  - { key: background,  label: Background,  type: EntityReference, targetEntityType: background, category: General }
  - { key: class,       label: Class,       type: EntityReference, targetEntityType: class,      category: General }
  - { key: subclass,    label: Subclass,    type: EntityReference, targetEntityType: subclass,   category: General }
  # The faith shape: a choice from the faith entries (a table may add its own) and two free text lines, one for what the faith asks
  # and one for what it forbids. There is no alignment: nothing here limits who may follow what.
  - { key: faith,       label: Faith,       type: EntityReference, targetEntityType: faith,      category: Faith }
  - { key: faithVows,   label: Vows,        type: LongText, category: Faith, description: "What the faith asks of its followers, in your own words." }
  - { key: faithTaboos, label: Taboos,      type: LongText, category: Faith, description: "What the faith forbids, in your own words." }
  - { key: armorClass,  label: Armor Class, type: Number,          defaultValue: 10, category: Combat }
  - { key: ancestrySpeed, label: Ancestry speed, type: Number,     defaultValue: 0, category: Combat, description: "Copied from your ancestry when you choose it, in feet; 0 when the ancestry gives none (the speed is then 25)." }

fieldRoles:
  level: level
  class: class
  summary: [level, ancestry, class]

entityTypes:
  - type: ancestry
    label: Ancestry
    pluralLabel: Ancestries
    folder: ancestries
    fields:
      - { key: hp,     label: Hit points,     type: Number,  description: "Added to hit points once, whatever the level." }
      - { key: boosts, label: Attribute boosts, type: TagList, description: "A word is a fixed boost, a|b one of two, free any attribute, a leading minus a flaw." }
      - { key: size,   label: Size,           type: Text,    description: "As the book prints it: Small or Medium." }
      - { key: speed,  label: Speed,          type: Number,  description: "The feet one action of movement covers." }
      - { key: languages,      label: Languages,       type: TagList, description: "The languages every member speaks, each as a lowercase word." }
      - { key: extraLanguages, label: Extra languages, type: Number,  description: "How many more languages to choose: this number, plus the Intelligence modifier when it is positive." }
      - { key: traits, label: Traits,         type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: specialAbilities, label: Special abilities, type: TagList, description: "The names of the senses and abilities every member has, as keys. Their text is in the description." }
  # What an ancestry offers at 1st level besides its own numbers: one heritage, picked from those that name the ancestry. The sheet's heritage field is limited to them (sheetRules.constraints).
  - type: heritage
    label: Heritage
    pluralLabel: Heritages
    folder: heritages
    summaryFields: [ancestry]
    filterFields: [ancestry]
    fields:
      - { key: ancestry, label: Ancestry, type: EntityReference, targetEntityType: ancestry, description: "The ancestry this heritage can be picked with. Empty: a versatile heritage, which any ancestry may take." }
      - { key: traits,   label: Traits,   type: TagList, description: "Trait keys, as the Library's trait entries name them; the rarity word is one." }
      - { key: grantsTraits, label: Granted traits, type: TagList, description: "Trait keys the heritage adds to its owner (a mixed-ancestry heritage adds its parent ancestry's). Not read by the sheet yet." }
  - type: background
    label: Background
    pluralLabel: Backgrounds
    folder: backgrounds
    summaryFields: [skills]
    fields:
      - { key: boosts,    label: Attribute boosts, type: TagList, description: "A word is a fixed boost, a|b one of two, free any attribute. A background whose limited boost depends on a faith's attribute (the pack holds no faiths) lists it as free; its description says which one is limited." }
      - { key: skills,    label: Trained skills,   type: TagList, description: "The skill keys the background trains; a|b is a choice between two." }
      - { key: lore,      label: Lore,             type: Text,    description: "The Lore subject, as text. The sheet's skill list has no Lore, so it is shown and not computed." }
      - { key: skillFeat, label: Skill feat,       type: Text,    description: "The id of the skill feat the background grants; a|b when the skill chosen decides it." }
      - { key: traits,    label: Traits,           type: TagList, description: "Trait keys; the rarity word is one." }
  - type: class
    label: Class
    pluralLabel: Classes
    folder: classes
    fields:
      - { key: hp,           label: Hit points per level, type: Number, description: "Added at 1st level and at every level after it, with the Constitution modifier." }
      - { key: keyAttribute, label: Key attribute,        type: Text, description: "The attribute the class cares about most and its class DC uses. a|b is a choice between two; the class DC takes the higher modifier." }
      - { key: boosts,       label: Attribute boosts,     type: TagList, description: "The boost the class gives: a word is a fixed boost, a|b one of two." }
      - { key: savingThrows, label: Saves trained,        type: TagList, description: "The saving throws the class starts trained in, by attribute (con for Fortitude, dex for Reflex, wis for Will). Higher ranks are grants of the features." }
      - { key: extraSkills,  label: Extra skills,         type: Number, description: "How many more skills the class trains, plus the Intelligence modifier when it is positive. Shown, not computed." }
      - { key: features,     label: Class features,       type: Collection, description: "One row per feature: name, level (1 when none), description, and grants (adds) to the sheet's ranked lists." }
      # A spellcaster's own fields. The spell attack modifier and the spell DC run on the key attribute (the sheet's `spellAttack` and `spellDc`), their rank is a grant of the features.
      - { key: tradition,    label: Tradition,            type: Dropdown, options: [arcane, divine, occult, primal], description: "The tradition of the spells the class casts: the sheet's spells and cantrips are those whose traditions hold it. Empty: the class casts none, or its subclass says the tradition (a witch's patron)." }
      - { key: casting,      label: Casting,              type: Dropdown, options: [prepared, spontaneous], description: "Prepared: the spells are chosen each day from the tradition's list. Spontaneous: they are a repertoire the class learns." }
      - { key: focusPool,    label: Focus pool,           type: Number, description: "The focus points the class's own features start a character with. Shown, not computed: a feat that adds focus spells grows it." }
      - { key: spellcasting, label: Spells per day,       type: Collection, description: "One row per level: cantrips (a number), slots (the slots of each rank from the 1st, such as 3/3/2), maxRank (the highest rank with a slot) and spells (how many spells the class knows or prepares: one for each slot)." }
  # A choice made at 1st level inside a class (a rogue's racket): its own feature rows, read beside the class's. The sheet's subclass choice is limited to the chosen class's (sheetRules.constraints).
  - type: subclass
    label: Subclass
    pluralLabel: Subclasses
    folder: subclasses
    summaryFields: [class]
    filterFields: [class]
    fields:
      - { key: class,        label: Class,         type: EntityReference, targetEntityType: class, description: "The class this choice belongs to." }
      - { key: keyAttribute, label: Key attribute, type: Text, description: "A key attribute the choice allows besides the class's (the class DC and the boost do not read it)." }
      # A class whose choice decides the tradition (a witch's patron) leaves the class's own `tradition` empty and writes it here; the sheet's spell lists read the class's, else the subclass's.
      - { key: tradition,    label: Tradition,     type: Dropdown, options: [arcane, divine, occult, primal], description: "The tradition of the spells a character of this choice casts, for a class that leaves its own empty. The sheet's spells and cantrips are those whose traditions hold it." }
      - { key: features,     label: Features,      type: Collection, description: "One row per feature: name, level (1 when none), description, and grants (adds) to the sheet's ranked lists." }
  # An animal companion of one type: what the book prints in the type's block, one field to each line. Nothing on the character sheet reads a companion yet; the entry is a reference to read at the table.
  # The six modifiers and the hit points are the starting numbers of a young companion; the advancement rules (rule entries) say how they grow.
  - type: companion
    label: Animal companion
    pluralLabel: Animal companions
    folder: companions
    icon: paw-print
    summaryFields: [size, skill]
    filterFields: [skill]
    fields:
      - { key: size,           label: Size,             type: Text, description: "As the book prints it, such as Small or Medium or Large." }
      - { key: str,            label: Strength,         type: Number, description: "The starting modifier." }
      - { key: dex,            label: Dexterity,        type: Number, description: "The starting modifier." }
      - { key: con,            label: Constitution,     type: Number, description: "The starting modifier." }
      - { key: int,            label: Intelligence,     type: Number, description: "The starting modifier." }
      - { key: wis,            label: Wisdom,           type: Number, description: "The starting modifier." }
      - { key: cha,            label: Charisma,         type: Number, description: "The starting modifier." }
      - { key: hp,             label: Hit points,       type: Number, description: "The hit points the companion's type gives it." }
      - { key: skill,          label: Skill,            type: Dropdown, options: [acrobatics, arcana, athletics, crafting, deception, diplomacy, intimidation, lore, medicine, nature, occultism, performance, religion, society, stealth, survival, thievery], description: "The skill the type adds to its trained ones." }
      - { key: senses,         label: Senses,           type: Text, description: "As the book prints them, with the ranges." }
      - { key: speed,          label: Speed,            type: Text, description: "Every Speed the type has, as printed (a type may have no land Speed)." }
      - { key: attacks,        label: Unarmed attacks,  type: Collection, description: "One row per attack: kind (melee or ranged), name, traits, damage (the dice), damageType and, when the book adds to the damage, extra (text)." }
      - { key: special,        label: Special,          type: Text, description: "A special ability of the type, such as serving as a mount." }
      - { key: access,         label: Access,           type: Text, description: "What a character must be to choose the type, for a type that is not open to all." }
      - { key: supportBenefit, label: Support benefit,  type: LongText, description: "What the owner gains when the companion uses the Support action." }
      - { key: advancedManeuver, label: Advanced maneuver, type: Text, description: "The name of the action the type learns when it becomes nimble or savage; its text is in the description." }
      - { key: traits,         label: Traits,           type: TagList, description: "Trait keys beyond the animal and minion ones every companion has (a rarity word, a creature type that replaces animal)." }
  # One ability of the familiars' two lists: a familiar ability changes the familiar itself, a master ability changes its master or the magic between them. Nothing on the character sheet reads a familiar yet.
  - type: familiar-ability
    label: Familiar ability
    pluralLabel: Familiar abilities
    folder: familiar-abilities
    icon: bird
    summaryFields: [kind]
    filterFields: [kind]
    fields:
      - { key: kind, label: Kind, type: Dropdown, options: [familiar, master], description: "Familiar: it changes the familiar. Master: it changes you or the magic between you and the familiar." }
  # A multiclass archetype: the choice of training in another class's specialties through feats. The dedication feat and the archetype feats are feat entries that name the archetype (their `archetype` field).
  - type: archetype
    label: Archetype
    pluralLabel: Archetypes
    folder: archetypes
    icon: layers
    summaryFields: [class]
    filterFields: [class]
    fields:
      - { key: class, label: Class, type: EntityReference, targetEntityType: class, description: "The class whose specialties the archetype trains. A character cannot take the dedication feat of the class they already have." }
  # A deity-like choice with no names built in. A faith entry holds the same two free lines the sheet has; picking one is optional.
  - type: faith
    label: Faith
    pluralLabel: Faiths
    folder: faiths
    fields:
      - { key: vows,   label: Vows,   type: LongText }
      - { key: taboos, label: Taboos, type: LongText }
      # What a table's own faith gives a character who is a cleric of it. The pack holds no faith; a table writes its own and fills what it wants. The sheet reads the feature rows (a trained skill is
      # a grant, as in a class's); the rest is shown beside the faith.
      - { key: font,          label: Divine font,     type: Dropdown, options: [heal, harm, either], description: "The spells a cleric of the faith prepares in its extra slots: heal, harm, or the player's choice." }
      - { key: sanctification, label: Sanctification, type: Dropdown, options: [none, holy, unholy, either], description: "Whether a cleric of the faith may or must take the holy or unholy trait." }
      - { key: favoredWeapon, label: Favored weapon,  type: EntityReference, targetEntityType: weapon, description: "The weapon a cleric of the faith is trained in. Shown, not computed: the sheet's weapon ranks are by category." }
      - { key: domains,       label: Domains,         type: TagList, description: "The domains a cleric of the faith may take, as words." }
      - { key: features,      label: Features,        type: Collection, description: "One row per benefit: name, level (1 when none), description, and grants (adds), such as the trained skill the faith gives a cleric." }
  - type: feat
    label: Feat
    pluralLabel: Feats
    folder: feats
    icon: sparkles
    summaryFields: [level, actions]
    filterFields: [level]
    # What the book prints on a feat's header, trait line and labelled lines. The rest of its text, and any degree sections, stay in the description.
    fields:
      - { key: level,         label: Level,         type: Number }
      - { key: actions,       label: Actions,       type: Dropdown, options: [one, two, three, reaction, free], description: "The action cost. Empty: not an activity." }
      - { key: traits,        label: Traits,        type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: prerequisites, label: Prerequisites, type: LongText }
      - { key: frequency,     label: Frequency,     type: Text }
      - { key: trigger,       label: Trigger,       type: LongText }
      - { key: requirements,  label: Requirements,  type: LongText }
      - { key: cost,          label: Cost,          type: Text }
      - { key: special,       label: Special,       type: LongText }
      - { key: archetype,     label: Archetype,     type: EntityReference, targetEntityType: archetype, description: "The archetype the feat belongs to (its dedication feat or one of its other feats). Empty on any other feat." }
  # A skill action: what a skill lets a character do with a roll. `skill` is the skill the action belongs to; empty is a general skill action that several skills can use.
  # `proficiency` is the least rank the action needs. The entry's text holds the rest, with its degrees of success.
  - type: action
    label: Action
    pluralLabel: Actions
    folder: actions
    icon: zap
    summaryFields: [skill, actions]
    filterFields: [skill, proficiency]
    fields:
      - { key: actions,      label: Actions,      type: Dropdown, options: [one, two, three, reaction, free], description: "The action cost. Empty: not a timed action (an activity that takes minutes, hours or days of downtime)." }
      - { key: traits,       label: Traits,       type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: skill,        label: Skill,        type: Dropdown, options: [acrobatics, arcana, athletics, crafting, deception, diplomacy, intimidation, lore, medicine, nature, occultism, performance, religion, society, stealth, survival, thievery], description: "The skill the action belongs to. Empty: a general skill action that several skills can use." }
      - { key: proficiency,  label: Proficiency,  type: Dropdown, options: [untrained, trained], description: "The least rank in the skill that the action needs." }
      - { key: frequency,    label: Frequency,    type: Text }
      - { key: trigger,      label: Trigger,      type: LongText }
      - { key: requirements, label: Requirements, type: LongText }
  # A spell, a cantrip or a focus spell: what the book prints on its header (the rank, the kind word and the action cost), its trait line and its labelled lines.
  # `kind` is the word the header sets before the rank (spell, cantrip, focus or ritual; a dropdown, not a yes/no, so the focus spells and rituals fit without another field), and `rank` is the
  # number after it: a cantrip's printed number is the rank it is cast at. The text holds the rest, with the degrees of success and the heightened entries in their source order.
  - type: spell
    label: Spell
    pluralLabel: Spells
    folder: spells
    icon: wand
    summaryFields: [rank, kind]
    filterFields: [rank, kind, traditions, focusGroup]
    fields:
      - { key: kind,         label: Kind,         type: Dropdown, options: [spell, cantrip, focus, ritual], description: "The word the header sets before the rank." }
      - { key: rank,         label: Rank,         type: Number, description: "The printed rank (1 to 10). A cantrip's is the rank it is cast at." }
      - { key: actions,      label: Actions,      type: Dropdown, options: [one, two, three, reaction, free], description: "The action cost in the header. Empty: a spell that takes minutes or hours, or a range of action costs (see Cast time)." }
      - { key: traits,       label: Traits,       type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: traditions,   label: Traditions,   type: TagList, description: "The magical traditions whose lists hold the spell: arcane, divine, occult, primal." }
      - { key: focusGroup,   label: Focus group,  type: Text, description: "For a focus spell or focus cantrip: the group the book lists it under (a class's compositions, a domain, an order, a school, a warden tier, the hexes)." }
      - { key: castTime,     label: Cast time,    type: Text, description: "The time a spell that takes longer than a turn needs, or the range of action costs of a spell that has no one cost (1 to 3 actions)." }
      - { key: cost,         label: Cost,         type: Text }
      - { key: trigger,      label: Trigger,      type: LongText }
      - { key: requirements, label: Requirements, type: LongText }
      - { key: secondaryCasters, label: Secondary casters, type: Text, description: "A ritual's minimum number of secondary casters, and any condition on them." }
      - { key: primaryCheck, label: Primary check, type: Text, description: "A ritual's primary skill check: the skills and the least proficiency of each." }
      - { key: secondaryChecks, label: Secondary checks, type: Text, description: "A ritual's secondary skill checks." }
      - { key: range,        label: Range,        type: Text }
      - { key: area,         label: Area,         type: Text }
      - { key: targets,      label: Targets,      type: Text }
      - { key: defense,      label: Defense,      type: Text }
      - { key: duration,     label: Duration,     type: Text }
  - type: armor
    label: Armor
    pluralLabel: Armor
    folder: armor
    # Body armor and shields are one type: the sheet's inventory lists `armor`, and it tells a shield by `armorType: shield` (a flat `armorClassBonus` on any equipped item) and body armor by a numeric `armorBase`.
    fields:
      - { key: armorBase,     label: Base armor class, type: Number, description: "The armor class the suit gives before Dexterity: 10 plus the armor bonus the book prints. Empty on a shield." }
      - { key: armorDexCap,   label: Dexterity cap, type: Number, description: "The most Dexterity modifier that counts toward armor class in this armor. Empty: no cap. 0: none counts." }
      - { key: armorCategory, label: Category, type: Dropdown, options: [unarmored, light, medium, heavy], description: "The proficiency the armor uses. Unarmored is clothing that gives no armor bonus. Empty on a shield." }
      - { key: armorType,     label: Armor type, type: Dropdown, options: [shield], description: "Shield for a shield (the sheet adds its armor class bonus while it is equipped); empty for body armor." }
      - { key: armorClassBonus, label: Shield bonus, type: Number, description: "A shield's circumstance bonus to armor class while it is raised. The sheet adds it whenever the shield is equipped, since it does not model raising one." }
      - { key: hardness,      label: Hardness, type: Number, description: "Damage a shield takes less from each hit." }
      - { key: hp,            label: Hit points, type: Number, description: "A shield's hit points." }
      - { key: brokenThreshold, label: Broken threshold, type: Number, description: "A shield is broken (and unusable) at this many hit points or fewer." }
      - { key: checkPenalty,  label: Check penalty, type: Number, description: "The penalty to Strength and Dexterity skill checks. Empty: none." }
      - { key: speedPenalty,  label: Speed penalty, type: Number, description: "The penalty to Speed, in feet. Empty: none." }
      - { key: strength,      label: Strength, type: Number, description: "The Strength modifier at which the check penalty goes away and the speed penalty is reduced." }
      - { key: bulk,          label: Bulk, type: Text, description: "The Bulk as printed: a number, or L for light. Empty: none." }
      - { key: group,         label: Group, type: Text, description: "The armor group, which armor specialization effects name." }
      - { key: traits,        label: Traits, type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: price,         label: Price, type: Text, description: "The price as printed, with its coin." }
      - { key: level,         label: Level, type: Number, description: "The item level, where the book prints one. Empty: level 0." }
  - type: weapon
    label: Weapon
    pluralLabel: Weapons
    folder: weapons
    # The Strike action reads `tag: weapons` and the entry's `use` map (attack, abilities, damage), as the homebrew weapons write them.
    fields:
      - { key: weaponCategory, label: Category, type: Dropdown, options: [simple, martial, advanced, unarmed], description: "The weapon proficiency the weapon uses." }
      - { key: traits,         label: Traits,   type: TagList, description: "Trait keys, as the Library's trait entries name them." }
      - { key: damage,         label: Damage dice, type: Text, description: "The damage dice, as the Strike rolls them (for example 1d6)." }
      - { key: damageType,     label: Damage type, type: Dropdown, options: [bludgeoning, piercing, slashing] }
      - { key: range,          label: Range, type: Number, description: "The range increment in feet. Empty: a melee weapon with no range of its own." }
      - { key: reload,         label: Reload, type: Number, description: "The Interact actions to reload it. 0: loaded as part of the attack. Empty: none." }
      - { key: hands,          label: Hands, type: Text, description: "The hands needed to wield it, as printed: 1, 2 or 1+." }
      - { key: bulk,           label: Bulk, type: Text, description: "The Bulk as printed: a number, or L for light. Empty: none." }
      - { key: group,          label: Group, type: Text, description: "The weapon group, which critical specialization effects name." }
      - { key: price,          label: Price, type: Text, description: "The price as printed, with its coin." }
      - { key: level,          label: Level, type: Number, description: "The item level, where the book prints one. Empty: level 0." }
      - { key: ammunition,     label: Ammunition, type: Text, description: "For a ranged weapon: the ammunition it uses, with the quantity, price and Bulk as the book prints them." }
  # Gear is the carried equipment that is neither armor nor a weapon: the adventuring gear, the alchemical items (bombs, elixirs and tools), the assistive items and barding. A character carries it through the inventory, which lists this type.
  # The sheet reads no Bulk, so `bulk` is the text the book prints, as the weapon's is.
  - type: gear
    label: Gear
    pluralLabel: Gear
    folder: gear
    summaryFields: [kind, price]
    filterFields: [kind]
    fields:
      - { key: kind,      label: Kind,   type: Dropdown, options: [gear, bomb, elixir, alchemical-tool, assistive, barding], valueLabels: { gear: { label: Gear, pluralLabel: Gear }, bomb: { label: Bomb, pluralLabel: Bombs }, elixir: { label: Elixir, pluralLabel: Elixirs }, alchemical-tool: { label: Alchemical tool, pluralLabel: Alchemical tools }, assistive: { label: Assistive item, pluralLabel: Assistive items }, barding: { label: Barding, pluralLabel: Barding } }, description: "Gear: the adventuring gear table. Bomb, elixir and alchemical tool: the three alchemical tables. Assistive: the assistive items. Barding: armor for an animal (its statistics are in the text)." }
      - { key: traits,    label: Traits, type: TagList, description: "Trait keys, as the Library's trait entries name them. The alchemical items also carry alchemical and consumable, which their table says all of them have." }
      - { key: price,     label: Price,  type: Text, description: "The price as printed, with its coin. For an item sold in a quantity, the price of the whole quantity." }
      - { key: bulk,      label: Bulk,   type: Text, description: "The Bulk as printed: a number, or L for light. Empty: none. For an item sold in a quantity, the Bulk of one." }
      - { key: hands,     label: Hands,  type: Text, description: "The hands needed to use it, as printed: 1, 2, 1 or 2, or see text." }
      - { key: level,     label: Level,  type: Number, description: "The item level, where the book prints one. Empty: level 0." }
      - { key: variantOf, label: Listed under, type: Text, description: "The item or heading the table lists it under, for a version of another item (an expanded or a superior one, or a size or a material)." }
  - type: trinket
    label: Trinket
    pluralLabel: Trinkets
    folder: trinkets
  # Worn or carried gear that is not a weapon or armor. Equipped, its `modifiers` reach the sheet as typed modifiers (docs/ITEM_RUNES_DESIGN.md).
  - type: magic-item
    label: Magic item
    pluralLabel: Magic items
    folder: magic-items
    fields:
      - { key: level, label: Level, type: Number }
      - { key: worth, label: Worth in silver, type: Number }
  # A mark set on a weapon or on armor. `appliesTo` is the item's type; a rune with a `group` (potency, weight, steadiness) is a fundamental one, held once
  # per group; a rune with no group is a property rune and takes one of the `slots` the item's potency rune gives. `extraDice` adds that many copies of a
  # weapon's damage dice.
  - type: rune
    label: Rune
    pluralLabel: Runes
    folder: runes
    fields:
      - { key: appliesTo, label: Goes on, type: Dropdown, options: [weapon, armor] }
      - { key: group,     label: Group,   type: Text }
      - { key: slots,     label: Property rune slots, type: Number }
      - { key: extraDice, label: Extra weapon dice,   type: Number }
      - { key: level,     label: Level, type: Number }
      - { key: worth,     label: Worth in silver, type: Number }
  # A trap, a vent or a haunt, placed on a place's feature. Detect and disarm routes name a skill, a DC, a minimum rank and how many successes
  # it takes; `triggersOn` lists the outcomes that set it off (`failure` means a failure or worse, `criticalFailure` that outcome alone).
  - type: hazard
    label: Hazard
    pluralLabel: Hazards
    folder: hazards
    icon: alert-triangle
    playerFacing: false
    summaryFields: [level, kind]
    filterFields: [level, kind]
    fields:
      - { key: kind,          label: Kind,         type: Text,       category: Profile, description: "Trap, environmental or haunt." }
      - { key: level,         label: Level,        type: Number,     category: Profile }
      - { key: detect,        label: Detect,       type: Collection, category: Notice, description: "Ways to find it: a name, the action, a skill, a DC and a minimum rank." }
      - { key: disarm,        label: Disarm,       type: Collection, category: Disable, description: "Ways to make it safe, the same shape, plus successes (how many it takes) and triggersOn (the outcomes that set it off)." }
      - { key: trigger,       label: Trigger,      type: LongText,   category: Trigger }
      - { key: duration,      label: Duration,     type: Text,       category: Trigger }
      - { key: saveAttribute, label: Save,         type: Text,       category: Effect, description: "The attribute of the saving throw. Empty: no save." }
      - { key: saveDc,        label: Save DC,      type: Number,     category: Effect }
      - { key: onSave,        label: On a save,    type: Dropdown,   category: Effect, options: [half, none] }
      - { key: damage,        label: Damage,       type: Collection, category: Effect, description: "One row per part: dice, type, and count." }
      - { key: area,          label: Area,         type: Text,       category: Effect }
      - { key: effect,        label: Effect,       type: LongText,   category: Effect }
      - { key: reset,         label: Reset,        type: LongText,   category: Reset }
    hazard:
      notice:  { routes: detect, passive: false }
      disable: { routes: disarm }
      trigger: trigger
      duration: duration
      effect:  { save: saveAttribute, saveDc: saveDc, onSave: onSave, damage: damage, area: area, text: effect }
      reset:   reset
      level:   level

  # A condition's text for the Library. Its name and effects are engine modelling (`conditions:` and `conditionEffects` below); this entry is the rules text only.
  - type: condition
    label: Condition
    pluralLabel: Conditions
    folder: conditions
    icon: skull
    fields: []

  # A trait's definition for the Library: what the word means wherever a feat, weapon or creature carries it. The entry's id is the trait's key, and
  # the importer's allowlist gate reads these keys and names as game terms.
  - type: trait
    label: Trait
    pluralLabel: Traits
    folder: traits
    icon: tag
    fields: []

  # A rules section that is not a game object: a procedure, a definition, a table's explanation. `category` groups it in the Library.
  - type: rule
    label: Rule
    pluralLabel: Rules Glossary
    folder: rules
    icon: book-open
    summaryFields: [category]
    filterFields: [category]
    fields:
      - { key: category, label: Category, type: Text }

  # A creature: its numbers are printed (sheetRules.printed below), so a condition on it lowers the number the stat block shows.
  - type: creature
    label: Creature
    pluralLabel: Creatures
    folder: creatures
    actorBlueprint: true
    hitPointsProperty: hitPoints
    playerFacing: false
    summaryFields: [level, family]
    filterFields: [family]
    fields:
      - { key: level,           label: Level,          type: Number, category: Profile }
      - { key: family,          label: Family,         type: Text,   category: Profile }
      - { key: armorClass,      label: Armor Class,    type: Number, category: Defenses }
      - { key: hitPoints,       label: Hit Points,     type: Number, category: Defenses }
      - { key: saveCon,         label: Con save,       type: Number, category: Defenses }
      - { key: saveDex,         label: Dex save,       type: Number, category: Defenses }
      - { key: saveWis,         label: Wis save,       type: Number, category: Defenses }
      - { key: perceptionBonus, label: Perception,     type: Number, category: Senses }
      - { key: classDcValue,    label: Special DC,     type: Number, category: Senses }
      - { key: str, label: Strength,     type: Number, category: Attribute modifiers }
      - { key: dex, label: Dexterity,    type: Number, category: Attribute modifiers }
      - { key: con, label: Constitution, type: Number, category: Attribute modifiers }
      - { key: int, label: Intelligence, type: Number, category: Attribute modifiers }
      - { key: wis, label: Wisdom,       type: Number, category: Attribute modifiers }
      - { key: cha, label: Charisma,     type: Number, category: Attribute modifiers }
      - { key: strikes,         label: Strikes,        type: Collection, category: Actions, description: "One row per Strike: name, bonus, range (melee or ranged) and damage." }
      - { key: abilities,       label: Abilities,      type: Collection, category: Actions }
    attributeProperties: { str: str, dex: dex, con: con, int: int, wis: wis, cha: cha }

# Spending a hero point to roll a check again (hero-points): the second result must be used (keep: new), and the rule counts it as a fortune effect,
# so a check is rerolled at most once (fortune-and-misfortune), which the table's one reroll per roll already is. The table offers it on a roll made
# with a check die, to the character's owner and the GM; a hero point can also be spent on a familiar's or companion's behalf, which the sheet cannot
# express yet, so the GM does that by hand.
rerolls:
  - { key: heroPoint, label: Hero Point reroll, spend: { track: heroPoints, by: 1 }, keep: new }

# Times the table names, beside the rests. A feature counter refills on one with `recovers: [{ on: dailyPrep }]`.
moments:
  - { key: dailyPrep,    label: Daily preparations }
  - { key: catchBreath,  label: Short breather }
  - { key: sessionStart, label: Session start }
  # One creature's own act, not a time of the table: a button on its sheet while it is dying (instant-death, hero-points).
  - { key: heroicRecovery, label: Heroic recovery, scope: actor, while: Dying, note: Spends all hero points }

# What the table does at zero hit points (rules getting-knocked-out and death-rule). A player character at 0 is knocked out: unconscious, not
# dead; most other creatures die there, and the GM can revive a significant one. Healing above 0 wakes a creature (the Revive button brings
# back one that died). This system has no death saves, so the table shows none. The rule's massive damage (twice the maximum in one blow)
# is another rule from the flag below, which counts the damage past zero, so the flag is off; rules.js does it on the damaged event, from
# the damage before temporary hit points take any of it (the rule does not say which, and this is the plainer reading). Gaining the dying
# condition when knocked out, raising it when a dying creature takes damage, and losing it when healed are rules.js too.
vitals:
  down:
    condition: Unconscious
    deadCondition: Dead
    instantDeathAtMax: false
    nonPlayersDieAtZero: true

# Events the table raises. The recovery check at the start of a turn of a dying creature is a script (dying-rule): it rolls a flat check,
# moves the dying value by the degree, and kills at the value the creature dies at. Damage and healing raise damaged and healed after the
# table's own rules, which the scripts read (getting-knocked-out, dying-rule, wounded, instant-death). Heroic recovery is a button for the
# player, not an automatic spend: the rule lets a player spend the points when the dying value would rise, and the table cannot ask in
# time, so the GM undoes the hit and the player presses the button. A session begins with 1 hero point (starting-hero-points);
# the points left at the end of a session are lost, and setting the track to 1 does the same.
events:
  turnStart: { script: rules.js#onTurnStart }
  damaged: { script: rules.js#onDamaged }
  healed: { script: rules.js#onHealed }
  heroicRecovery: { script: rules.js#onHeroicRecovery }
  sessionStart:
    - { intents: [{ set: { track: heroPoints, to: 1 } }] }

# The book's conditions, by the names of the pack's `conditions/` entries (rules-core), which hold each one's text. The effects below are the part
# the engine can express; a condition with no effect there has a rule the engine cannot compute, and its entry is the whole of it.
conditions:
  - Blinded
  - Broken
  - Clumsy
  - Concealed
  - Confused
  - Controlled
  - Dazzled
  - Deafened
  - Doomed
  - Drained
  - Dying
  - Encumbered
  - Enfeebled
  - Fascinated
  - Fatigued
  - Fleeing
  - Friendly
  - Frightened
  - Grabbed
  - Helpful
  - Hidden
  - Hostile
  - Immobilized
  - Indifferent
  - Invisible
  - Observed
  - Off-guard
  - Paralyzed
  - Persistent Damage
  - Petrified
  - Prone
  - Quickened
  - Restrained
  - Sickened
  - Slowed
  - Stunned
  - Stupefied
  - Unconscious
  - Undetected
  - Unfriendly
  - Unnoticed
  - Wounded

# An effect beside the conditions. Its bonus is a status bonus, so two copies of it never add.
effects: [Heartened]

# What the engine can compute of each condition, read from its pack entry. Each target belongs to one side (docs/SHEET_CONDITIONS_DESIGN.md):
# attack, save, check, armorClass, classDc and perception are the rules' own; senseDc and speed are the sheet kind's. `check.<attribute>`
# reaches the skills that use that attribute, `save.<attribute>` the saving throw of that attribute. A condition that is not here, or is
# here with no modifiers, holds a rule of actions, senses, damage or targeting, and its entry carries the text. Not modelled anywhere in
# this block: the one-off loss of current hit points under Drained, the floor under a Speed penalty, and the conditions that override
# another. A night's rest is the table's `dailyPrep` moment.
conditionEffects:
  # A status penalty of its value on everything that runs on Dexterity: armor class, saves, skills and ranged attacks.
  Clumsy:
    value: {}
    modifiers:
      - { target: armorClass,    amount: "-value", type: status }
      - { target: save.dex,      amount: "-value", type: status }
      - { target: check.dex,     amount: "-value", type: status }
      - { target: attack.ranged, amount: "-value", type: status }
  Confused:
    implies: [Off-guard]
  Doomed:
    value: { decrease: { on: dailyPrep, by: 1 } }
  # Constitution-based penalty, and the maximum hit points drop by the value times the level (at least 1). The hit points lost at once are
  # not modelled, only the lower maximum.
  Drained:
    value: { decrease: { on: dailyPrep, by: 1 } }
    modifiers:
      - { target: save.con,  amount: "-value", type: status }
      - { target: check.con, amount: "-value", type: status }
      - { target: HP_Max,    amount: "-value * max(1, level)" }
  # Bleeding out brings unconsciousness with it; at 4 the creature is dead, which is the value's top. A Doomed value lowers that top in the
  # entry's text; the maximum here is the plain 4.
  Dying:
    value: { max: 4 }
    implies: [Unconscious]
  Encumbered:
    implies: [{ condition: Clumsy, value: 1 }]
    modifiers:
      - { target: speed, amount: -10 }
  # Strength-based rolls. The pack entry also names melee attacks, but only those that use Strength, which a target cannot tell, so they are left out.
  Enfeebled:
    value: {}
    modifiers:
      - { target: save.str,  amount: "-value", type: status }
      - { target: check.str, amount: "-value", type: status }
  Fascinated:
    modifiers:
      - { target: check,      amount: -2, type: status }
      - { target: perception, amount: -2, type: status }
  Fatigued:
    modifiers:
      - { target: armorClass, amount: -1, type: status }
      - { target: save,       amount: -1, type: status }
  # A penalty equal to the value on every check and DC, dropping by 1 at the end of the creature's turn.
  Frightened:
    value: { decrease: { on: turnEnd, by: 1 } }
    modifiers:
      - { target: attack,     amount: "-value", type: status }
      - { target: save,       amount: "-value", type: status }
      - { target: check,      amount: "-value", type: status }
      - { target: strike,     amount: "-value", type: status }
      - { target: armorClass, amount: "-value", type: status }
      - { target: classDc,    amount: "-value", type: status }
      - { target: spellAttack, amount: "-value", type: status }
      - { target: spellDc,    amount: "-value", type: status }
      - { target: perception, amount: "-value", type: status }
      - { target: senseDc,    amount: "-value", type: status }
  Grabbed:
    implies: [Off-guard, Immobilized]
  Invisible:
    implies: [Undetected]
  Off-guard:
    modifiers:
      - { target: armorClass, amount: -2, type: circumstance }
  Paralyzed:
    implies: [Off-guard]
  Prone:
    implies: [Off-guard]
    modifiers:
      - { target: attack, amount: -2, type: circumstance }
      - { target: strike, amount: -2, type: circumstance }
  Restrained:
    implies: [Off-guard, Immobilized]
  # The same penalty as Frightened, but it does not drop by itself; the entry's way of recovering is an action.
  Sickened:
    value: {}
    modifiers:
      - { target: attack,     amount: "-value", type: status }
      - { target: save,       amount: "-value", type: status }
      - { target: check,      amount: "-value", type: status }
      - { target: strike,     amount: "-value", type: status }
      - { target: armorClass, amount: "-value", type: status }
      - { target: classDc,    amount: "-value", type: status }
      - { target: spellAttack, amount: "-value", type: status }
      - { target: spellDc,    amount: "-value", type: status }
      - { target: perception, amount: "-value", type: status }
      - { target: senseDc,    amount: "-value", type: status }
  Slowed:
    value: {}
  Stunned:
    value: {}
  # Everything that runs on Intelligence, Wisdom or Charisma, spell attack modifiers and spell DCs among it (the entry's text names them); here Perception and the sense DC run on Wisdom.
  Stupefied:
    value: {}
    modifiers:
      - { target: save.wis,   amount: "-value", type: status }
      - { target: save.int,   amount: "-value", type: status }
      - { target: save.cha,   amount: "-value", type: status }
      - { target: check.int,  amount: "-value", type: status }
      - { target: check.wis,  amount: "-value", type: status }
      - { target: check.cha,  amount: "-value", type: status }
      - { target: spellAttack, amount: "-value", type: status }
      - { target: spellDc,    amount: "-value", type: status }
      - { target: perception, amount: "-value", type: status }
      - { target: senseDc,    amount: "-value", type: status }
  # Knocked out: blinded and off-guard, and it falls prone, which stays when the condition ends.
  Unconscious:
    implies: [Blinded, Off-guard, { condition: Prone, stays: true }]
    modifiers:
      - { target: armorClass, amount: -4, type: status }
      - { target: perception, amount: -4, type: status }
      - { target: senseDc,    amount: -4, type: status }
      - { target: save.dex,   amount: -4, type: status }
  Unnoticed:
    implies: [Undetected]
  Wounded:
    value: {}
  Heartened:
    modifiers:
      - { target: attack,  amount: 1, type: status }
      - { target: strike,  amount: 1, type: status }
      - { target: classDc, amount: 1, type: status }
      - { target: senseDc, amount: 1, type: status }

# Status, circumstance and item bonuses keep the highest of their type; untyped ones add up. Penalties of a type keep the worst.
# Untyped penalties add up: `penaltyTypes` overrides `penalties` for one type.
modifierTypes:
  default: sum
  penalties: highest
  penaltyTypes:
    untyped: sum
  types:
    status: highest
    circumstance: highest
    item: highest

# A d20 check comes to a degree: 3 critical success, 2 success, 1 failure, 0 critical failure. Beating the DC by 10 is one step up, missing
# it by 10 one step down; a natural 20 then moves the result one step up and a natural 1 one step down, within 0 to 3.
dice:
  initiative: 1d20
  check: 1d20
  checkRoll: degreeCheck

functions:
  degree: { formula: "(total, dc, natural) => min(3, max(0, (total >= dc + 10 ? 3 : total >= dc ? 2 : total > dc - 10 ? 1 : 0) + (natural == 20 ? 1 : natural == 1 ? -1 : 0)))" }

sheetRules:
  enforcement: warn
  # A heritage is picked from those of the chosen ancestry, or from those that name none (the versatile heritages, which any ancestry may take).
  constraints:
    - field: heritage
      where:
        - { property: ancestry, equalsField: ancestry, orEmpty: true, message: "that heritage belongs to another ancestry." }
    - field: subclass
      where:
        - { property: class, equalsField: class, message: "that subclass belongs to another class." }
  # Hit points: the class's own number per level (no die) plus Constitution, and the ancestry's number once.
  hitPoints:
    key: HP_Max
    currentKey: HP
    flatProperty: hp
    attribute: con
    once: { field: ancestry, property: hp }

  # Attributes: typed in, or built from boosts. Each source gives boosts to different attributes (an ancestry's own, the class's, and
  # four free ones at levels 1, 5, 10, 15 and 20); a boost is +1 to the modifier, but from +4 it is half of that.
  attributes:
    methods: [manual, boosts]
    default: manual
    boosts:
      label: Boosts
      sources:
        - { key: ancestry, label: Ancestry, field: ancestry, trade: { fixed: 2, free: 1 } }
        # The background gives two boosts: one of two attributes it names and one free (the entry's `boosts`, as an ancestry's are).
        - { key: background, label: Background, field: background }
        - { key: class,    label: Class,    field: class }
        # The step that finishes the 1st-level build: four free boosts, each to a different modifier.
        - { key: lvl1,     label: Level 1,  level: 1,  free: 4 }
        - { key: lvl5,     label: Level 5,  level: 5,  free: 4 }
        - { key: lvl10,    label: Level 10, level: 10, free: 4 }
        - { key: lvl15,    label: Level 15, level: 15, free: 4 }
        - { key: lvl20,    label: Level 20, level: 20, free: 4 }

  # Choosing an ancestry copies its speed onto the sheet once; the character's speed reads it. Only the ancestry's own number: a heritage's or a feat's change to it is not modelled.
  inherits:
    - field: ancestry
      appliedKey: ancestryApplied
      copy: { speed: ancestrySpeed }

  inventory:
    key: inventory
    label: Gear
    types: [armor, weapon, gear, magic-item]
    runeType: rune

  # Armor: its base and Dexterity up to its cap, then the rank in what is worn (the armor list below).
  armorClass:
    key: armorClass
    unarmored: "10 + mod(dex)"
    dexAttribute: dex
    dexCapLimitsOnlyBonus: true  # the book's Dexterity cap is a maximum of the bonus: a cap of 0 still lets a negative modifier through
    rank: { list: armor, property: armorCategory, unarmored: unarmored }

  # Ranked lists beside the skills, on the skills' ranks (trained to legendary, worth level plus 2 to 8). Perception and the class DC
  # publish their scores as values under their own keys; armor and weapons hold one rank per category and publish nothing.
  ranked:
    - { key: perception, label: Perception, ranksOf: skills, attribute: wis, publish: true }
    - { key: classDc, label: Class DC, ranksOf: skills, base: 10, attributeFrom: { field: class, property: keyAttribute }, publish: true }
    # A spellcaster's spell attack modifier and spell DC share one rank (the book's classes grant both together) and run on the class's key attribute, which the class's text says. A class that casts
    # no spells has no rank in them: they show the attribute alone.
    - { key: spellAttack, label: Spell attack, ranksOf: skills, attributeFrom: { field: class, property: keyAttribute }, publish: true }
    - { key: spellDc, label: Spell DC, ranksOf: skills, base: 10, attributeFrom: { field: class, property: keyAttribute }, publish: true }
    - key: armor
      label: Armor
      ranksOf: skills
      list:
        - { key: unarmored, label: Unarmored }
        - { key: light,     label: Light armor }
        - { key: medium,    label: Medium armor }
        - { key: heavy,     label: Heavy armor }
    - key: weapons
      label: Weapons
      ranksOf: skills
      list:
        - { key: unarmed, label: Unarmed }
        - { key: simple,  label: Simple weapons }
        - { key: martial, label: Martial weapons }
        - { key: advanced, label: Advanced weapons }

  # What a character can do with a roll: a Strike with each equipped weapon (its attack bonus is the attribute plus the rank in its category).
  actions:
    - key: strike
      label: Strike
      inventory: equipped
      tag: weapons
      rank: { list: weapons, property: weaponCategory }
      attackBonus: "abilityMod + rankValue"

  # The multiple attack penalty: what the 1st, 2nd and 3rd or later attack of a turn adds. A weapon with the featherlight trait lowers it.
  multipleAttack:
    penalties: [0, -5, -10]
    variants:
      - { property: traits, has: featherlight, penalties: [0, -4, -8] }

  # Ranks: trained, expert, master, legendary, worth the level plus 2, 4, 6, 8. An untrained skill adds its attribute alone.
  skills:
    label: Skills
    list:
      - { key: acrobatics,  label: Acrobatics,  attribute: dex }
      - { key: arcana,      label: Arcana,      attribute: int }
      - { key: athletics,   label: Athletics,   attribute: str }
      - { key: crafting,    label: Crafting,    attribute: int }
      - { key: deception,   label: Deception,   attribute: cha }
      - { key: diplomacy,   label: Diplomacy,   attribute: cha }
      - { key: intimidation, label: Intimidation, attribute: cha }
      - { key: medicine,    label: Medicine,    attribute: wis }
      - { key: nature,      label: Nature,      attribute: wis }
      - { key: occultism,   label: Occultism,   attribute: int }
      - { key: performance, label: Performance, attribute: cha }
      - { key: religion,    label: Religion,    attribute: wis }
      - { key: society,     label: Society,     attribute: int }
      - { key: stealth,     label: Stealth,     attribute: dex }
      - { key: survival,    label: Survival,    attribute: wis }
      - { key: thievery,    label: Thievery,    attribute: dex }
      # The book also has Lore, an open-ended skill: each subject (a trade, a place, a kind of creature) counts as a skill of its own, with its own
      # rank, all on Intelligence. The sheet's skill list is fixed, so Lore is not modelled yet; a Lore subject is a decision for chapter 4.
    ranks:
      - { key: trained,   label: Trained,   sheetKey: skillTrained,   value: "level + 2" }
      - { key: expert,    label: Expert,    sheetKey: skillExpert,    value: "level + 4" }
      - { key: master,    label: Master,    sheetKey: skillMaster,    value: "level + 6" }
      - { key: legendary, label: Legendary, sheetKey: skillLegendary, value: "level + 8" }
    saves:
      ranks:
        - { key: trained,   label: Trained,   sheetKey: saveTrained,   value: "level + 2" }
        - { key: expert,    label: Expert,    sheetKey: saveExpert,    value: "level + 4" }
        - { key: master,    label: Master,    sheetKey: saveMaster,    value: "level + 6" }
        - { key: legendary, label: Legendary, sheetKey: saveLegendary, value: "level + 8" }

  # The numbers a printed creature carries as its stat block prints them. A condition's modifiers reach each by its target.
  printed:
    - { from: armorClass,      target: armorClass }
    - { from: saveCon,         target: save.con }
    - { from: saveDex,         target: save.dex }
    - { from: saveWis,         target: save.wis }
    - { from: perceptionBonus, target: perception }
    - { from: classDcValue,    target: classDc }
    - { list: strikes, bonus: bonus, range: range, name: name }

  lists:
    - key: feats
      label: Feats
      targetEntityType: feat
    # Spellcasting: the cantrips and spells of the class's tradition (the spell's `traditions` hold the class's `tradition`), the spells no higher than the highest rank the class has a slot for at the
    # character's level, and the counts of the class's table. A class that casts none offers nothing.
    - key: cantrips
      label: Cantrips
      description: Only your class's tradition, up to the number in your class table. A focus cantrip goes in the spells a feature gives you.
      targetEntityType: spell
      category: Spellcasting
      where:
        - { property: kind, equals: cantrip, message: "that is not a cantrip." }
        - { property: traditions, containsPropertyOfField: { field: class, property: tradition, or: { field: subclass, property: tradition } }, message: "not on your class's spell list." }
      maxCount: { lookup: { field: class, table: spellcasting, byField: level, column: cantrips } }
    - key: spells
      label: Spells
      description: The spells you know or prepare. Only your class's tradition, no higher than your highest spell slot, up to the number in your class table.
      targetEntityType: spell
      category: Spellcasting
      where:
        - { property: kind, equals: spell, message: "cantrips go in the cantrips list." }
        - { property: traditions, containsPropertyOfField: { field: class, property: tradition, or: { field: subclass, property: tradition } }, message: "not on your class's spell list." }
        - { property: rank, lteLookup: { field: class, table: spellcasting, byField: level, column: maxRank }, message: "above the highest spell rank you can cast." }
      maxCount: { lookup: { field: class, table: spellcasting, byField: level, column: spells } }
    - key: focusSpells
      label: Focus spells
      description: Focus spells a class feature, a feat or an order gives you. They take no slots; the focus pool is on the class.
      targetEntityType: spell
      category: Spellcasting
      where:
        - { property: kind, equals: focus, message: "that is not a focus spell." }
    - key: grantedSpells
      label: Granted spells
      description: Spells and cantrips a feature gives you outside your class's list (a muse's spell, a composition cantrip). They are not counted against your spells.
      targetEntityType: spell
      category: Spellcasting

  # A class's spell slots for each rank, from its table of spells per day; they are tracked at the table as resources (slots_1 for the 1st rank, and so on).
  slotPools:
    - key: slots
      label: Spell slots
      unit: spell slot
      field: class
      byField: level
      table: spellcasting
      column: slots

  features:
    - { field: ancestry }
    - { field: heritage }
    - { field: background }
    - { field: class, property: features, byField: level }
    - { field: subclass, property: features, byField: level }
    - { field: faith, property: features, byField: level }
    - { list: feats }

# The play-time half: a DC and a speed the kind owns, and trinkets whose modifiers reach them through the kind's own feature source.
sheetKinds:
  - kind: character
    label: Character
    role: player
    values:
      - { key: senseDc, label: Sense DC, formula: "10 + level + 2 + mod(wis)", modifiers: senseDc }
      - { key: speed,   label: Speed,    formula: "ancestrySpeed > 0 ? ancestrySpeed : 25", modifiers: speed }
    # Hero points (hero-points): at most 3 at a time.
    tracks:
      - { key: heroPoints, label: Hero Points, max: 3, display: boxes }
    lists:
      - key: trinkets
        label: Trinkets
        type: trinket
    features:
      - { list: trinkets }

rolls:
  # A check against a DC, with the bonus given: the four degrees and the natural 20 / 1 shift.
  - key: degreeCheck
    label: Check
    dice: 1d20
    add: ["bonus"]
    inputs:
      - { key: bonus,  from: roller, label: Bonus }
      - { key: target, from: gm,     label: DC }
    outcomes:
      - { name: criticalSuccess, when: "degree(total, target, natural) == 3", mark: critical }
      - { name: success,         when: "degree(total, target, natural) == 2" }
      - { name: failure,         when: "degree(total, target, natural) == 1" }
      - { name: criticalFailure, mark: fumble }
  # A strike: the same, less the multiple attack penalty of the attack number (an input) and of the weapon's traits (sheetRules.multipleAttack).
  - key: strike
    label: Strike
    dice: 1d20
    add: ["bonus", "attackPenalty(attackNumber)", "modifiers('strike')"]
    inputs:
      - { key: bonus,        from: roller, label: Attack bonus }
      - { key: target,       from: gm,     label: Armor class }
      - { key: attackNumber, from: roller, label: Attack this turn, default: 1 }
      - { key: weapon,       from: roller, label: Weapon, default: "" }
    outcomes:
      - { name: criticalSuccess, when: "degree(total, target, natural) == 3", mark: critical }
      - { name: success,         when: "degree(total, target, natural) == 2" }
      - { name: failure,         when: "degree(total, target, natural) == 1" }
      - { name: criticalFailure, mark: fumble }
