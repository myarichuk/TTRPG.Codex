# Invented runes. Attach one to a weapon or armor as the choice `rune.{id}` on its inventory pick ("ledge-axe|equipped:1,rune.honed-edge-1:1").
# A rune with a `group` is fundamental: an item holds one per group, and the potency runes give `slots` places for property runes. A rune without a
# group is a property rune and takes one place. On a weapon the targets `attack` and `damage` reach that weapon alone. Every number is invented.

# --- Weapon runes, fundamental ---
- id: honed-edge-1
  name: Honed edge I
  tags: [homebrew, runes]
  description: The weapon is balanced for its wielder. It gives a +1 item bonus to attack rolls and has room for one property rune.
  properties: { appliesTo: weapon, group: potency, slots: 1, level: 3, worth: 72, modifiers: [{ target: attack, amount: 1, type: item }] }
- id: honed-edge-2
  name: Honed edge II
  tags: [homebrew, runes]
  description: The weapon is balanced for its wielder. It gives a +2 item bonus to attack rolls and has room for two property runes.
  properties: { appliesTo: weapon, group: potency, slots: 2, level: 7, worth: 480, modifiers: [{ target: attack, amount: 2, type: item }] }
- id: honed-edge-3
  name: Honed edge III
  tags: [homebrew, runes]
  description: The weapon is balanced for its wielder. It gives a +3 item bonus to attack rolls and has room for three property runes.
  properties: { appliesTo: weapon, group: potency, slots: 3, level: 12, worth: 3300, modifiers: [{ target: attack, amount: 3, type: item }] }
- id: weighted-blow-1
  name: Weighted blow I
  tags: [homebrew, runes]
  description: The weapon lands as if it were heavier. Its Strikes roll one extra copy of the weapon's damage dice.
  properties: { appliesTo: weapon, group: striking, extraDice: 1, level: 5, worth: 270 }
- id: weighted-blow-2
  name: Weighted blow II
  tags: [homebrew, runes]
  description: The weapon lands as if it were far heavier. Its Strikes roll two extra copies of the weapon's damage dice.
  properties: { appliesTo: weapon, group: striking, extraDice: 2, level: 10, worth: 1850 }

