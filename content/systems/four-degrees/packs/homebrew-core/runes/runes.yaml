- id: icy
  name: Icy
  tags: [homebrew, runes]
  description: Frost rimes the weapon. Its Strikes deal 1d4 extra cold damage.
  properties: { appliesTo: weapon, level: 6, worth: 365, modifiers: [{ target: damage, amount: 1d4, type: item }] }
- id: jagged
  name: Jagged
  tags: [homebrew, runes]
  description: The weapon's edge is rough and cruel. Its Strikes deal 2 extra damage, a +2 item bonus to the damage roll.
  properties: { appliesTo: weapon, level: 5, worth: 210, modifiers: [{ target: damage, amount: 2, type: item }] }

