  properties:
    category: "Equipment"
- id: "bulk-values"
  name: "Bulk Values"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk Values"
  description: "Items can have a number to indicate their Bulk value, or they can be light (indicated by an L) or negligible (indicated by a —) for the purpose of determining Bulk. For instance, full plate armor is 4 Bulk, a longsword is 1 Bulk, a dagger or scroll is light, and a piece of chalk is negligible. Ten light items count as 1 Bulk, and you round down fractions (so 9 light items count as 0 Bulk, and 11 light items count as 1 Bulk). Items of negligible Bulk don't count toward Bulk unless you try to carry vast numbers of them, as determined by the GM."
  properties:
    category: "Equipment"
- id: "cantrips"
  name: "Cantrips"
  source: "pc > Chapter 7: Spells > Cantrips"
  description: |-
    A cantrip is a special type of spell that's weaker than other spells but can be used with greater freedom and flexibility. The title of a cantrip's stat block says "Cantrip" instead of "Spell", and the spell has the cantrip trait. Casting a cantrip doesn't use up your spell slots; you can cast a cantrip at will, any number of times per day. If you're a prepared caster, you can prepare a specific number of cantrips each day. You can't prepare a cantrip in a spell slot.
    A cantrip is always automatically heightened to half your level, rounded up. For a typical spellcaster, this means its rank is equal to the highest rank of spell slot you have.
  properties:
    category: "Spells"
- id: "carrying-items"
  name: "Carrying Items"
  source: "pc > Chapter 6: Equipment > Carrying Items"
  description: "A character carries items in three ways: held, worn, and stowed. Held items are in your hands; a character typically has two hands, allowing them to hold an item in each hand or a single two-handed item using both hands. Worn items are tucked into pockets, belt pouches, bandoliers, weapon sheaths, and so forth, and they can be retrieved and returned relatively quickly. Stowed items are in a backpack or a similar container, and they are more difficult to access."
  properties:
    category: "Equipment"
- id: "casting-rituals"
  name: "Casting Rituals"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals"
  description: |-
    When you take charge of a ritual, you are its primary caster, and others assisting you are secondary casters. You can be a primary caster for a ritual even if you can't cast spells. You must know the ritual, and the ritual's spell rank can be no higher than half your level rounded up. You must also have the required proficiency rank in the skill used for the ritual's primary check (see Checks below), and as the primary caster, you must attempt this skill check to determine the ritual's effects. The primary skill check determines the tradition.
    Rituals do not require spell slots to cast. You can heighten a ritual up to half your level rounded up, decided when the ritual is initiated. A ritual always takes at least 1 hour to perform, and often longer. While a ritual is a downtime activity, it's possible—albeit risky—to perform a ritual during exploration with enough uninterrupted time. A ritual's casting time is usually listed in days. Each day of casting requires 8 hours of participation in the ritual from all casters, with breaks during multiday rituals to allow rest. One caster can continue a multiday ritual, usually with some light chanting or meditation, while the other casters rest. All rituals require repeated spellcasting words and gestures throughout their casting time.
    Rituals by Rank
    Rank Ritual
    2 animate object
    2 consecrate
    2 create undead
    3 geas
    3 rune trap
    4 atone
    4 blight
    4 plant growth
    5 call spirit
    5 planar servitor
    5 resurrect
    6 awaken animal
    6 binding circle
    6 commune
    6 primal call
    7 collective memories
    7 planar displacement
    8 control weather
    10 wish
  properties:
    category: "Spells"
- id: "casting-spells"
  name: "Casting Spells"
  source: "pc > Chapter 7: Spells > Casting Spells"
  description: |-
    The casting of a spell can range from a simple word of magical might that creates a fleeting effect to a complex process taking hours to cast and producing a long-term impact. Casting a spell requires the caster to make gestures and utter incantations, so being unable to speak prevents spellcasting for most casters. If your character has a long-term disability that prevents or complicates them from speaking, work with the GM to determine an analogous way they cast their spells, such as tapping in code on their staff or whistling.
    Spellcasting creates obvious sensory manifestations, such as bright lights, crackling sounds, and sharp smells from the gathering magic. Nearly all spells manifest a spell signature—a colorful, glowing ring of magical runes that appears in midair, typically around your hands, though what kind of spellcaster you are can affect this—academic wizards typically have neat and ordered spell signatures, while a druid's might be more organic and a cleric's might be inspired by their deity. How spellcasting looks can vary from one spellcasting tradition or class to another, or even from person to person. You have a great deal of freedom in flavoring your character's magic however you wish!
    Spells can vary in how many actions they take, as shown in the spell's stat block. You cast cantrips, spells from spell slots, and focus spells using the same process, but must expend the spell when casting a spell from a spell slot and must spend 1 Focus Point to cast a focus spell. Some rules will refer to the Cast a Spell activity, such as "if the next action you use is to Cast a Spell." Any spell qualifies as a Cast a Spell activity, and any characteristics of the spell use those of the specific spell you're casting.
  properties:
    category: "Spells"
- id: "checks"
  name: "Checks"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Checks"
  description: |-
    At the ritual's culmination, you must attempt the skill check listed in the Primary Check entry to determine the ritual's outcome. Primary checks usually have a very hard DC for a level that's twice the ritual's spell rank. As with other downtime activities, fortune and misfortune effects can't modify your checks for the ritual, nor can bonuses or penalties that aren't active throughout the process.
    The GM can adjust the DCs of rituals, add or change primary or secondary checks, or even waive requirements to fit specific circumstances. For example, performing a ritual in a location where ley lines converge on the night of a new moon might make a normally difficult ritual drastically easier.
    Secondary Checks
    Often, a ritual requires secondary checks to represent aspects of its casting, usually with a standard DC for a level twice the ritual's spell rank. A different secondary caster must attempt each secondary check. If there are more secondary casters than checks, the others don't attempt any.
    Secondary casters attempt their checks before you attempt the primary check; no matter their results, the ritual proceeds to the primary check. Secondary checks affect the primary check depending on their results.
    **Critical Success.** You gain a +2 circumstance bonus to the primary check.
    **Success.** No bonus or penalty.
    **Failure.** You take a -4 circumstance penalty to the primary check.
    **Critical Failure.** As failure, and you reduce the degree of success of the primary skill check by one step.
  properties:
    category: "Spells"
- id: "coins-and-currency"
  name: "Coins and Currency"
  source: "pc > Chapter 6: Equipment > Coins and Currency"
  description: |-
    Though you might be able to barter valuable items in some areas, currency is the most versatile way to make transactions when you head to market. The most common currency is coins. There are four common types of coins, each standardized in weight and value.
    • The copper piece (cp) is worth one-tenth of a silver piece.
    • The silver piece (sp) is the standard unit of currency. Each silver piece is a standard weight of silver and is typically accepted by any merchant or kingdom no matter where it was minted.
    • The gold piece (gp) is often used for purchasing magic items and other expensive items, as 1 gold piece is worth 10 silver pieces or 100 copper pieces.
    • The platinum piece (pp) is used for the purchase of very expensive items or as a way to easily transport large sums of currency. A platinum piece is worth 10 gold pieces, 100 silver pieces, or 1,000 copper pieces.
  properties:
    category: "Equipment"
- id: "condition-values"
  name: "Condition Values"
  source: "pc > Conditions Appendix > Condition Values"
  description: "Some conditions have a number after the condition, called a condition value. This value conveys the severity of a condition, and such conditions often give you a bonus or penalty equal to their value. These values can often be reduced by skills, spells, or simply waiting. If a condition value is ever reduced to 0, the condition ends."
  properties:
    category: "Conditions"
- id: "conditions"
  name: "Conditions"
  source: "pc > Conditions Appendix"
  description: "Conditions are persistent. Whenever you're affected by a condition, its effects last until the condition's stated duration ends, the condition is removed, or terms dictated in the condition itself cause it to end."
  properties:
    category: "Conditions"
- id: "cost"
  name: "Cost"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Cost"
  description: "A ritual's Cost entry lists valuable components required to cast the ritual. If a ritual doesn't have any such components, it won't have a Cost entry. The cost is consumed when you attempt the primary skill check. Costs are often presented as a base cost multiplied by the target's level and sometimes the spell's rank. If the target's level is lower than 1, multiply the cost by 1 instead. Heightened versions that increase the base cost multiply it by the target's level or another value as appropriate. Most rituals that create permanent creatures, such as create undead, use costs based on the level of the creature, as presented in Creature Creation Rituals."
  properties:
    category: "Spells"
- id: "costs-and-loci"
  name: "Costs and Loci"
  source: "pc > Chapter 7: Spells > Casting Spells > Costs and Loci"
  description: |-
    Some spells require you to pay a cost or provide a locus. If the spell lists a cost, you must have the listed money, valuable materials, or other resources to cast the spell (such as gems or magical reagents), and they're expended during the casting.
    A locus is an object that funnels or directs the magical energy of the spell but is not consumed in its casting. As part of Casting the Spell, you retrieve the locus (if necessary, and if you have a free hand), and you can put it away again if you so choose. Loci tend to be expensive, and you need to acquire them in advance to cast the spell, but they aren't expended like costs are. Unless noted otherwise, a locus has negligible Bulk.
  properties:
    category: "Spells"
- id: "counteracting"
  name: "Counteracting"
  source: "pc > Chapter 7: Spells > Counteracting"
  description: "Some spells, such as dispel magic, can be used to eliminate the effects of other spells. At least one creature, object, or manifestation of the spell you are trying to counteract must be within range of the spell that you are using. You attempt a counteract check using your Charisma (or other spellcasting attribute modifier) and your proficiency bonus for spell attack rolls."
  properties:
    category: "Spells"
- id: "crafting"
  name: "Crafting"
  source: "pc > Chapter 4: Skills > Skills > Crafting"
  description: |-
    You can use this skill to create and repair items. Even if you're untrained, you can Recall Knowledge.
    • Recall Knowledge about alchemical reactions, the value of items, engineering, unusual materials, and alchemical or mechanical creatures. The GM determines which creatures this applies to, but it usually includes constructs.
    You must be trained in Crafting to use it to Earn Income.
    • Earn Income by crafting goods for the market.
  properties:
    category: "Skills"
- id: "crafting-goods-for-the-market"
  name: "Crafting Goods for the Market"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
    Using Crafting, you can work at producing common items for the market. It's usually easy to find work making basic items whose level is 1 or 2 below your settlement's level.
    Higher-level tasks represent special commissions, which might require you to Craft a specific item using the Craft downtime activity and sell it to a buyer at full Price. These opportunities don't occur as often and might have special requirements—or serious consequences if you disappoint a prominent client.
  properties:
    category: "Skills"
