- id: "arcana"
  name: "Arcana"
  source: "pc > Chapter 4: Skills > Skills > Arcana"
  description: |-
    Arcana measures how much you know about arcane magic and creatures. Even if you're untrained, you can Recall Knowledge.
    • Recall Knowledge about arcane theories; magic traditions; creatures of arcane significance (like constructs, beasts, and elementals); and the planes tied to arcane magic.
    You must be trained in Arcana to use it for the following general skill actions.
    • Decipher Writing about arcane theory.
    • Identify Magic, particularly magic of the arcane tradition.
    • Learn a Spell from the arcane tradition.
  properties:
    category: "Skills"
- id: "areas"
  name: "Areas"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Areas"
  description: "Sometimes a spell has an area, which can be a burst, cone, emanation, or line. If the spell originates from your position, the spell has only an area; if you can cause the spell's area to appear farther away from you, the spell has both a range and an area."
  properties:
    category: "Spells"
- id: "armor-and-skills"
  name: "Armor and Skills"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs > Armor and Skills"
  description: "Some armor imposes a penalty on specific skill checks and DCs. If a creature is wearing armor that imparts a skill penalty, that penalty is applied to the creature's Strength- and Dexterity-based skill checks and skill DCs, unless the action has the attack trait."
  properties:
    category: "Skills"
- id: "athletics"
  name: "Athletics"
  source: "pc > Chapter 4: Skills > Skills > Athletics"
  description: |-
    Athletics allows you to perform deeds of physical prowess. Most Athletics actions let you move about the environment (Climb, High Jump, Long Jump, Swim) or control your opponent's movement in combat (Grapple, Reposition, Shove, Trip, and Disarm).
    Escape: When you use the Escape basic action, you can use your Athletics modifier instead of your unarmed attack modifier.
  properties:
    category: "Skills"
- id: "basic-competence"
  name: "Basic Competence"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: "Some performances require you to be more than just charismatic, and if you don't meet the demands of the art form or the audience, the GM might apply a penalty based on the relevant attribute. For example, if you're dancing and have a negative Dexterity modifier, you might take a penalty to your attempt at dancing. Likewise, if you are orating and have a negative Intelligence modifier, you might have to hope your raw Charisma can overcome the penalties from your intellectual shortcomings—or ask someone to help write your speeches!"
  properties:
    category: "Skills"
- id: "basic-saving-throws"
  name: "Basic Saving Throws"
  source: "pc > Chapter 7: Spells > Defenses > Basic Saving Throws"
  description: "If a spell's Defenses entry specifies a \"basic\" saving throw, the spell's potential effects all relate to the damage listed in the spell's description. The target takes no damage on a critical success, half damage on a success, full damage on a failure, or double damage on a critical failure."
  properties:
    category: "Spells"
- id: "cantrips"
  name: "Cantrips"
  source: "pc > Chapter 7: Spells > Cantrips"
  description: |-
    A cantrip is a special type of spell that's weaker than other spells but can be used with greater freedom and flexibility. The title of a cantrip's stat block says "Cantrip" instead of "Spell", and the spell has the cantrip trait. Casting a cantrip doesn't use up your spell slots; you can cast a cantrip at will, any number of times per day. If you're a prepared caster, you can prepare a specific number of cantrips each day. You can't prepare a cantrip in a spell slot.
    A cantrip is always automatically heightened to half your level, rounded up. For a typical spellcaster, this means its rank is equal to the highest rank of spell slot you have.
  properties:
    category: "Spells"
- id: "casting-spells"
  name: "Casting Spells"
  source: "pc > Chapter 7: Spells > Casting Spells"
  description: |-
    The casting of a spell can range from a simple word of magical might that creates a fleeting effect to a complex process taking hours to cast and producing a long-term impact. Casting a spell requires the caster to make gestures and utter incantations, so being unable to speak prevents spellcasting for most casters. If your character has a long-term disability that prevents or complicates them from speaking, work with the GM to determine an analogous way they cast their spells, such as tapping in code on their staff or whistling.
    Spellcasting creates obvious sensory manifestations, such as bright lights, crackling sounds, and sharp smells from the gathering magic. Nearly all spells manifest a spell signature—a colorful, glowing ring of magical runes that appears in midair, typically around your hands, though what kind of spellcaster you are can affect this—academic wizards typically have neat and ordered spell signatures, while a druid's might be more organic and a cleric's might be inspired by their deity. How spellcasting looks can vary from one spellcasting tradition or class to another, or even from person to person. You have a great deal of freedom in flavoring your character's magic however you wish!
    Spells can vary in how many actions they take, as shown in the spell's stat block. You cast cantrips, spells from spell slots, and focus spells using the same process, but must expend the spell when casting a spell from a spell slot and must spend 1 Focus Point to cast a focus spell. Some rules will refer to the Cast a Spell activity, such as "if the next action you use is to Cast a Spell." Any spell qualifies as a Cast a Spell activity, and any characteristics of the spell use those of the specific spell you're casting.
  properties:
    category: "Spells"
- id: "condition-values"
  name: "Condition Values"
  source: "pc > Conditions Appendix > Condition Values"
  description: "Some conditions have a number after the condition, called a condition value. This value conveys the severity of a condition, and such conditions often give you a bonus or penalty equal to their value. These values can often be reduced by skills, spells, or simply waiting. If a condition value is ever reduced to 0, the condition ends."
  properties:
    category: "Conditions"
- id: "conditions"
  name: "Conditions"
  source: "pc > Conditions Appendix"
  description: "Conditions are persistent. Whenever you're affected by a condition, its effects last until the condition's stated duration ends, the condition is removed, or terms dictated in the condition itself cause it to end."
  properties:
    category: "Conditions"
- id: "costs-and-loci"
  name: "Costs and Loci"
  source: "pc > Chapter 7: Spells > Casting Spells > Costs and Loci"
  description: |-
    Some spells require you to pay a cost or provide a locus. If the spell lists a cost, you must have the listed money, valuable materials, or other resources to cast the spell (such as gems or magical reagents), and they're expended during the casting.
    A locus is an object that funnels or directs the magical energy of the spell but is not consumed in its casting. As part of Casting the Spell, you retrieve the locus (if necessary, and if you have a free hand), and you can put it away again if you so choose. Loci tend to be expensive, and you need to acquire them in advance to cast the spell, but they aren't expended like costs are. Unless noted otherwise, a locus has negligible Bulk.
  properties:
    category: "Spells"
- id: "counteracting"
  name: "Counteracting"
  source: "pc > Chapter 7: Spells > Counteracting"
  description: "Some spells, such as dispel magic, can be used to eliminate the effects of other spells. At least one creature, object, or manifestation of the spell you are trying to counteract must be within range of the spell that you are using. You attempt a counteract check using your Charisma (or other spellcasting attribute modifier) and your proficiency bonus for spell attack rolls."
  properties:
    category: "Spells"
- id: "crafting"
  name: "Crafting"
  source: "pc > Chapter 4: Skills > Skills > Crafting"
  description: |-
    You can use this skill to create and repair items. Even if you're untrained, you can Recall Knowledge.
    • Recall Knowledge about alchemical reactions, the value of items, engineering, unusual materials, and alchemical or mechanical creatures. The GM determines which creatures this applies to, but it usually includes constructs.
    You must be trained in Crafting to use it to Earn Income.
    • Earn Income by crafting goods for the market.
  properties:
    category: "Skills"
- id: "crafting-goods-for-the-market"
  name: "Crafting Goods for the Market"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
    Using Crafting, you can work at producing common items for the market. It's usually easy to find work making basic items whose level is 1 or 2 below your settlement's level.
    Higher-level tasks represent special commissions, which might require you to Craft a specific item using the Craft downtime activity and sell it to a buyer at full Price. These opportunities don't occur as often and might have special requirements—or serious consequences if you disappoint a prominent client.
  properties:
    category: "Skills"
- id: "deception"
  name: "Deception"
  source: "pc > Chapter 4: Skills > Skills > Deception"
  description: "You can trick and mislead others using disguises, lies, and other forms of subterfuge. Deception often has a drawback if you get found out, and it's often best to be out of town by the time this happens."
  properties:
    category: "Skills"
- id: "defenses"
  name: "Defenses"
  source: "pc > Chapter 7: Spells > Defenses"
  description: "If a spell allows the target to attempt a saving throw or use their AC to defend against it, the type of defense is listed in the stat block. Any details on the particular results and timing of the save appear in the text unless the entry specifies a basic saving throw, which follows a standard rule. If a spell allows a defense only under certain circumstances or at a certain time, the Defenses entry is omitted, since the text needs to explain it in more detail. Whenever a spell allows a saving throw, it uses the caster's spell DC, and one that allows AC as a defense typically requires a spell attack."
  properties:
    category: "Spells"
- id: "diplomacy"
  name: "Diplomacy"
  source: "pc > Chapter 4: Skills > Skills > Diplomacy"
  description: "You influence others through negotiation and flattery, or find out information through friendly chats."
  properties:
    category: "Skills"
- id: "dismissing"
  name: "Dismissing"
  source: "pc > Chapter 7: Spells > Durations > Dismissing"
  description: "Some spells can be dismissed, ending the duration early. This requires the caster or target to use the Dismiss action."
  properties:
    category: "Spells"
- id: "disrupted-and-lost-spells"
  name: "Disrupted and Lost Spells"
  source: "pc > Chapter 7: Spells > Casting Spells > Disrupted and Lost Spells"
  description: "Some abilities and spells can disrupt a spell, causing it to have no effect and be lost. When you lose a spell, you've already expended the spell slot and spent the spell's costs and actions. If a spell is disrupted during a Sustain action, the spell immediately ends."
  properties:
    category: "Spells"
- id: "durations"
  name: "Durations"
  source: "pc > Chapter 7: Spells > Durations"
  description: |-
    The duration of a spell is how long the spell effect lasts. Spells that last for more than an instant have a Duration entry. A spell might last until the start or end of a turn, for some number of rounds, for minutes, or even longer. If a spell's duration is given in rounds, the number of rounds remaining decreases by 1 at the start of each of the spellcaster's turns, ending when the duration reaches 0.
    Some spells have effects that remain even after the spell's magic is gone. Any ongoing effect that isn't part of the spell's duration entry isn't magical. For instance, a spell that creates a brief, loud sound might deafen someone for a time, even permanently. This deafness couldn't be counteracted because it is not itself magical (though it might be cured by other magic, such as sound body).
    If a spell's caster dies or is incapacitated during the spell's duration, the spell remains in effect until its duration ends, using the caster's initiative order.
  properties:
    category: "Spells"
- id: "exploration-and-downtime-activities"
  name: "Exploration and Downtime Activities"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs > Exploration and Downtime Activities"
  description: |-
    Some skill activities have the exploration or downtime trait. Exploration activities usually take a minute or more, while downtime activities may take a day or more. They usually can't be used during an encounter, though the GM might bend this restriction. If you're not sure whether you have the time to use one of these activities,
    ask your GM.
  properties:
    category: "Skills"
- id: "focus-points-from-multiple-sources"
  name: "Focus Points from Multiple Sources"
  source: "pc > Chapter 7: Spells > Focus Spells > Focus Points from Multiple Sources"
  description: "It's possible, especially through archetypes, to gain focus spells from more than one source. If this happens, you have just one focus pool, counting all your focus spells to determine the points in your pool. You can spend any of your Focus Points on any of your focus spells. Likewise, when you Refocus, you get back a point as long as you follow the guidelines of any abilities that granted you focus spells. Having Focus Points from multiple sources doesn't change the tradition of your spells; if you had both cleric domain spells and druid order spells, your domain spells would remain divine and the order spells primal. Similarly, you need to use the attribute modifier determined by the source of the focus spell."
  properties:
    category: "Spells"
- id: "focus-spells"
  name: "Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells"
  description: |-
    Focus spells are a special type of spell attained directly from a branch of study, from a deity, or from another specific source. You can learn focus spells only through special class features or feats, rather than choosing them from a spell list. Furthermore, you cast focus spells using a special pool of Focus Points—you can't prepare a focus spell in a spell slot or use your spell slots to cast focus spells; similarly, you can't spend your Focus Points to cast spells that aren't focus spells. Even some classes that don't normally grant spellcasting can grant focus spells, such as the ranger. The title of a focus spell's stat block says "Focus" instead of "Spell", and the spell has the focus trait.
    Focus spells are automatically heightened to half your level rounded up, just like cantrips are. You can't cast a focus spell if its minimum rank is greater than half your level rounded up, even if you somehow gain access to it.
    Casting any of your focus spells costs you 1 Focus Point. You automatically gain a focus pool the first time you gain an ability that gives you a focus spell. The maximum number of points in your pool is equal to the number of focus spells you know or 3, whichever is lower. This counts only spells that require Focus Points to cast. For example, a bard's composition cantrips don't count toward the size of the pool.
    You replenish all the Focus Points in your pool during your daily preparations. You can also use the Refocus activity to pray, study, meditate, or otherwise reattune yourself to the source of your focus magic and regain 1 Focus Point. You can Refocus multiple times to regain multiple points, up to your pool's maximum.
    Refocus
    CONCENTRATE EXPLORATION
    **Requirements.** You have a focus pool.
    You spend 10 minutes performing deeds to restore your magical connection. This restores 1 Focus Point to your focus pool. The deeds you need to perform are specified in the class or ability that gives you your focus spells. These deeds can usually overlap with other tasks that relate to the source of your focus spells. For instance, a cleric with focus spells from a holy deity can usually Refocus while tending the wounds of their allies.
  properties:
    category: "Spells"
- id: "heightened-spells"
  name: "Heightened Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Heightened Spells"
  description: |-
    Both prepared and spontaneous spellcasters can cast a spell at a higher spell rank than that listed for the spell. This is called heightening the spell. A prepared spellcaster can heighten a spell by preparing it in a higher-rank slot than its normal spell rank, while a spontaneous spellcaster can heighten a spell by casting it using a higher-rank spell slot, so long as they know the spell at that rank (see Heightened Spontaneous Spells below). When you heighten your spell, the spell's rank increases to match the higher rank of the spell slot you've prepared it in or used to cast it. This is useful for any spell, because some effects, such as counteracting, depend on the spell's rank.
    In addition, many spells have additional specific benefits when they are heightened, such as increased damage. These extra benefits are described at the end of the spell's stat block. Some heightened entries specify one or more ranks at which the spell must be prepared or cast to gain these extra advantages. Each of these heightened entries states specifically which aspects of the spell change at the given rank. Read the heightened entry only for the spell rank you're using or preparing; if its benefits are meant to include any of the effects of a lower-rank heightened entry, those benefits will be included in the entry.
    Other heightened entries give a number after a plus sign, indicating that heightening grants extra advantages over multiple ranks. The listed effect applies for every increment of ranks by which the spell is heightened above its lowest spell rank, and the benefit is cumulative. For example, fireball says "Heightened (+1) The damage increases by 2d6." Because fireball deals 6d6 fire damage at 3rd rank, a 4th-rank fireball would deal 8d6 fire damage, a 5th-rank spell would deal 10d6 fire damage, and so on.
    Heightened Spontaneous Spells
    If you're a spontaneous spellcaster, you must know a spell at the specific rank that you want to cast it in order to heighten it. You can add a spell to your spell repertoire at more than a single rank so that you have more options when casting it. For example, if you added fireball to your repertoire as a 3rd-rank spell and again as a 5th-rank spell, you could cast it as a 3rd-rank or a 5th-rank spell; however, you couldn't cast it as a 4th-rank spell.
    Many spontaneous spellcasting classes provide abilities like the signature spells class feature, which allows you to cast a limited number of spells as heightened versions even if you know the spell at only a single rank.
    As a spontaneous caster, you can also choose to cast a lower-rank spell using a higher-rank spell slot without heightening it or knowing it at a higher rank. This casts the spell at the rank you know the spell, not the rank of the higher slot. The spell doesn't have any heightened effects, so it's usually not a very efficient use of your magic outside of highly specific circumstances. For instance, if your party was having trouble with an invisible enemy, and you had revealing light in your repertoire but had already spent all of your 2nd-rank spell slots, it might be worth it to use a 3rd-rank spell slot to cast the spell, even though it'd have no heightened benefit.
  properties:
    category: "Spells"
- id: "hostile-actions"
  name: "Hostile Actions"
  source: "pc > Chapter 7: Spells > Hostile Actions"
  description: "Sometimes spells prevent a target from using hostile actions, or the spell ends if a creature uses any hostile actions. A hostile action is one that can harm or damage another creature, whether directly or indirectly, but not one that a creature is unaware could cause harm. For instance, casting fireball into a crowd would be a hostile action, but opening a door and accidentally freeing a horrible monster wouldn't be. The GM is the final arbitrator of what is a hostile action."
  properties:
    category: "Spells"
- id: "identifying-spells"
  name: "Identifying Spells"
  source: "pc > Chapter 7: Spells > Identifying Spells"
  description: |-
    Sometimes you need to identify a spell, especially if its effects aren't obvious right away. If you notice a spell being cast, and you have that spell in your repertoire or prepared it that day (even if you already cast it), you automatically know what the spell is, including the rank to which it is heightened.
    If you want to identify a spell but don't have it prepared or in your repertoire, you must spend an action on your turn attempting to identify it using Recall Knowledge. You typically notice a spell being cast due to its sensory spell manifestations. Identifying long-lasting spells that are already in place requires using Identify Magic instead of Recall Knowledge because you don't have the advantage of watching the spell being cast.
  properties:
    category: "Spells"
