- id: "condition-values"
  name: "Condition Values"
  source: "pc > Conditions Appendix > Condition Values"
  description: "Some conditions have a number after the condition, called a condition value. This value conveys the severity of a condition, and such conditions often give you a bonus or penalty equal to their value. These values can often be reduced by skills, spells, or simply waiting. If a condition value is ever reduced to 0, the condition ends."
  properties:
    category: "Conditions"
- id: "overriding-conditions"
  name: "Overriding Conditions"
  source: "pc > Conditions Appendix > Overriding Conditions"
  description: "Some conditions override others. This is always specified in the entry for the overriding condition. When this happens, all effects of the overridden condition are suppressed until the overriding condition ends. The overridden condition's duration continues to elapse, and it might run out while suppressed."
  properties:
    category: "Conditions"
