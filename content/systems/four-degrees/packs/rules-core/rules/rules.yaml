- id: "armor-class"
  name: "Armor Class"
  source: "pc > Chapter 6: Equipment > Armor > Armor Class"
  description: |-
    Your Armor Class (AC) measures how well you can defend against attacks. When a creature attacks you, your Armor Class is the DC for that attack roll.
    Armor Class = 10 + Dexterity modifier (up to your armor's Dex Cap) + proficiency bonus + armor's item
    bonus to AC + other bonuses + penalties
    Use your proficiency bonus for the category (light, medium, or heavy) or for the specific type of armor you're wearing. If you're not wearing armor, use your proficiency in unarmored defense.
  properties:
    category: "Equipment"
- id: "armor-class-and-saving-throws"
  name: "Armor Class and Saving Throws"
  source: "pc > Chapter 8: Playing the Game > Checks > Defenses"
  description: |-
    Multiple statistics help you defend against attacks, spells, hazards, and other dangers of adventuring: Armor Class and three saving throws.
    Armor Class
    Attack rolls are compared to a special Difficulty Class called Armor Class (AC), which measures how hard it is for your foes to hit you with Strikes, spell attack rolls, and other attacks. Just like for any other check and DC, the result of an attack roll must meet or exceed your AC to be successful, which allows your foe to deal damage to you. Armor Class is calculated using the following formula.
    Armor Class = 10 + Dexterity modifier (up to your armor's Dex Cap) + proficiency bonus + armor's item bonus to AC + other bonuses + penalties
    Use your proficiency bonus for the category (light, medium, or heavy) or the specific type of armor you're wearing. If you're not wearing armor, use your proficiency in unarmored defense.
    Armor Class can benefit from bonuses with a variety of sources, much like attack rolls. Armor itself grants an item bonus, so other item bonuses usually won't apply to your AC, but magic armor can increase the item bonus granted by your armor.
    Penalties to AC come from situations and effects in much the same way bonuses do. Circumstance penalties come from unfavorable situations, and status penalties come from effects that impede your abilities or from broken armor. You take an item penalty when you wear shoddy armor.
    Saving Throws
    There are three types of saving throws: Fortitude saves, Reflex saves, and Will saves. These are frequently called "saves"—it's the same thing. Saving throws measure your ability to shrug off harmful effects in the form of afflictions, damage, or conditions. You'll always add a proficiency bonus to each save. Your class might give a different proficiency to each save, but you'll be trained at minimum. Some circumstances and spells might give you circumstance or status bonuses to saves, and you might find resilient armor or other magic items that give an item bonus.
    Fortitude saving throws allow you to reduce the effects of abilities and afflictions that can debilitate the body. They use your Constitution modifier and are calculated as shown in the formula below.
    Fortitude save result = d20 roll + Constitution modifier + proficiency bonus + other bonuses + penalties
    Reflex saving throws measure how well you can respond quickly to a situation and how gracefully you can avoid effects that have been thrown at you. They use your Dexterity modifier and are calculated as shown in the formula below.
    Reflex save result = d20 roll + Dexterity modifier + proficiency bonus + other bonuses + penalties
    Will saving throws measure how well you can resist attacks to your mind and spirit. They use your Wisdom modifier and are calculated as shown in the formula below. Will save result = d20 roll + Wisdom modifier + proficiency bonus + other bonuses + penalties
    Sometimes you'll need to know your DC for a given saving throw (such as a Grapple attempt requiring a roll against your Fortitude DC). Like any other DC derived from a modifier, the DC for a saving throw is 10 + the total modifier for that saving throw.
    Most of the time, when you attempt a saving throw, you don't have to use your actions or your reaction. You don't even need to be able to act to attempt saving throws. However, in some special cases you might have to take an action to attempt a save. For instance, you can try to recover from the sickened condition by spending an action to attempt a Fortitude save.
    Basic Saving Throws
    Sometimes you will be called on to attempt a basic saving throw (or "basic save"). This type of saving throw works just like any other saving throw—the "basic" part refers to the effects. For a basic save, you'll attempt the check and determine whether you critically succeed, succeed, fail, or critically fail like you would any other saving throw. Then one of the following outcomes applies based on your degree of success—no matter what caused the saving throw. Some spells or abilities add an additional effect on certain results but still use a basic saving throw for brevity.
    **Critical Success.** You take no damage from the effect.
    **Success.** You take half the listed damage from the effect.
    **Failure.** You take the full damage listed from the effect.
    **Critical Failure.** You take double the listed damage from the effect.
  properties:
    category: "Playing the Game"
- id: "armor-specialization-effects"
  name: "Armor Specialization Effects"
  source: "pc > Chapter 6: Equipment > Armor > Armor Specialization Effects"
  description: |-
    Certain class features can grant you additional benefits with certain armors. This is called an armor specialization effect. The exact effect depends on which armor group your armor belongs to, as listed below.
    Chain: The armor can bend with a critical hit and absorb some of the blow. Reduce the damage from critical hits by 4 + the value of the armor's potency rune for medium armor, or 6 + the value of the armor's potency rune for heavy armor. This can't reduce the damage to less than the damage rolled for the hit before doubling for a critical hit.
    Composite: The numerous overlapping pieces of this armor protect you from piercing attacks. You gain resistance to piercing damage equal to 1 + the value of the armor's potency rune for medium armor, or 2 + the value of the armor's potency rune for heavy armor.
    Leather: The thick second skin of the armor disperses blunt force to reduce bludgeoning damage. You gain resistance to bludgeoning damage equal to 1 + the value of the armor's potency rune for medium armor, or 2 + the value of the armor's potency rune for heavy armor.
    Plate: The sturdy plate provides no purchase for a cutting edge. You gain resistance to slashing damage equal to 1 + the value of the armor's potency rune for medium armor, or 2 + the value of the armor's potency rune for heavy armor.
  properties:
    category: "Equipment"
- id: "armor-statistics"
  name: "Armor Statistics"
  source: "pc > Chapter 6: Equipment > Armor > Armor Statistics"
  description: |-
    The Unarmored Defense table provides the statistics for the various forms of protection without wearing armor. The Armor table provides the statistics for suits of armor that can be purchased and worn, organized by category. The columns in both tables provide the following statistics.
    Category
    The armor's category—unarmored, light armor, medium armor, or heavy armor—indicates which proficiency bonus you use while wearing the armor.
    AC Bonus
    This number is the item bonus you add for the armor when determining Armor Class.
    Dexterity Modifier Cap (Dex Cap)
    This number is the maximum amount of your Dexterity modifier that can apply to your AC while you are wearing a given suit of armor. For example, if you have a Dexterity modifier of +4 and you are wearing a suit of half plate, you apply only a +1 bonus from your Dexterity modifier to your AC while wearing that armor.
    Check Penalty
    While wearing your armor, you take this penalty to Strength- and Dexterity-based skill checks, except for those that have the attack trait. If you meet the armor's Strength threshold (see Strength below), you don't take this penalty.
    Speed Penalty
    While wearing a suit of armor, you take the penalty listed in this entry to your Speed, as well as to any other movement types you have, such as a climb Speed or swim Speed, to a minimum Speed of 5 feet. If you meet the armor's Strength threshold (see below), you reduce the penalty by 5 feet.
    Strength
    This entry indicates the Strength modifier at which you are strong enough to overcome some of the armor's penalties. If your Strength modifier is equal to or greater than this value, you no longer take the armor's check penalty, and you decrease the Speed penalty by 5 feet (to no penalty if the penalty was -5 feet, or to a -5-foot penalty if the penalty was -10 feet).
    Bulk
    This entry gives the armor's Bulk, assuming you're wearing the armor and distributing its weight across your body. A suit of armor that's carried usually has 1 more Bulk than what's listed here (or 1 Bulk total for armor of light Bulk). An armor's Bulk is increased or decreased if it's sized for creatures that aren't Small or Medium in size.
    Group
    Each type of clothing and armor belongs to an armor group, which classifies it with similar types of armor. Some abilities reference armor groups, typically to grant armor specialization effects, which are described in Armor Specialization Effects.
    Armor Traits
    The traits for each suit of armor presented in this book appear in this entry.
    Bulwark: The armor covers you so completely that it provides benefits against some damaging effects. On Reflex saves to avoid a damaging effect, such as a fireball, you add a +3 modifier instead of your Dexterity modifier.
    Comfort: The armor is so comfortable that you can rest normally while wearing it.
    Flexible: The armor is pliable and doesn't hinder most actions. You don't apply its check penalty to Acrobatics or Athletics checks.
    Noisy: This armor is loud and likely to alert others to your presence. The armor's check penalty applies to Stealth checks even if you have the required Strength modifier.
  properties:
    category: "Equipment"
- id: "assistive-items"
  name: "Assistive Items"
  source: "pc > Chapter 6: Equipment > Gear > Assistive Items"
  description: "Included in this section are assistive items for a variety of disabilities. If a character has been disabled from birth or for a significant period of time before setting out on their adventure, they should begin with any basic assistive items they require as part of their backstory. These items don't count against their starting money, and any item granted in this way likewise has no value when sold."
  properties:
    category: "Equipment"
- id: "athletics"
  name: "Athletics"
  source: "pc > Chapter 4: Skills > Skills > Athletics"
  description: |-
    Athletics allows you to perform deeds of physical prowess. Most Athletics actions let you move about the environment (Climb, High Jump, Long Jump, Swim) or control your opponent's movement in combat (Grapple, Reposition, Shove, Trip, and Disarm).
    Escape: When you use the Escape basic action, you can use your Athletics modifier instead of your unarmed attack modifier.
  properties:
    category: "Skills"
- id: "attack-rolls"
  name: "Attack Rolls"
  source: "pc > Chapter 6: Equipment > Weapons > Attack Rolls"
  description: |-
    When making an attack roll, determine the result by rolling 1d20 and adding your attack modifier for the weapon or unarmed attack you're using. Modifiers for melee and ranged attacks are calculated differently.
    Melee attack roll result = d20 roll + Strength modifier (or optionally Dexterity modifier for a finesse weapon) + proficiency bonus + other bonuses + penalties
    Ranged attack roll result = d20 roll + Dexterity modifier + proficiency bonus + other bonuses + penalties
  properties:
    category: "Equipment"
- id: "attacking-with-a-shield"
  name: "Attacking With a Shield"
  source: "pc > Chapter 6: Equipment > Shields > Attacking With a Shield"
  description: "A shield can be used as a martial weapon for attacks, using the statistics listed for a shield bash on the Martial Melee Weapons table. The shield bash is an option only for shields that weren't designed to be used as weapons. A shield can't have runes added to it. You can also buy and attach a shield boss or shield spikes to a shield to make it a more practical weapon. These can also be found on the Martial Melee Weapons table. These work like other weapons and can even be etched with runes."
  properties:
    category: "Equipment"
- id: "backgrounds"
  name: "Backgrounds"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Backgrounds"
  description: |-
    At 1st level, when you create your character, you gain a background of your choice. This decision is permanent; you can't change it at later levels. Each background listed here grants two boosts, a skill feat, and the trained proficiency rank in two skills, one of which is a Lore skill. If you gain the trained proficiency rank in a skill from your background and would then gain the trained proficiency rank in the same skill from your class at 1st level, you instead become trained in another skill of your choice.
    Lore skills represent deep knowledge of a specific subject. If a Lore skill involves a choice (for instance, a choice of terrain), explain your preference to the GM, who has the final say on whether it's acceptable or not.
    Skill feats expand the functions of your skills.
  properties:
    category: "Backgrounds"
- id: "barding"
  name: "Barding"
  source: "pc > Chapter 6: Equipment > Gear > Animals > Barding"
  description: "You can purchase special armor for animals, called barding (shown on the Barding table). All animals have a trained proficiency rank in light barding, and combat-trained animals are trained in heavy barding. Barding uses the same rules as armor except for the following. The Price and Bulk of barding depend on the animal's size (use the statistics for Small barding for creatures below Small size). Barding can't be etched with magic runes, though special magical barding might be available."
  properties:
    category: "Equipment"
- id: "baseline"
  name: "Baseline"
  source: "pc > Chapter 8: Playing the Game"
  description: |-
    Your group will likely talk about what types of content you want in your game before your campaign begins. The following is a set of basic assumptions that works for many groups.
    • Bloodshed, injuries, and even dismemberment might be described. However, excessive descriptions of gore and cruelty should be avoided.
    • Romantic and sexual relationships can happen in the game, but players should avoid being overly suggestive. Sex happens "off-screen." One player character attempting to initiate a relationship with another should generally be avoided.
    • Avoid excessively gross or scatological descriptions. Player characters shouldn't perform the following acts:
    • Torture
    • Rape, nonconsensual sexual contact, or sexual threats
    • Harm to children, including sexual abuse
    • Owning slaves or profiting from slavery
    • Reprehensible uses of mind-control magic
    Villains might engage in such acts "off-screen," but many groups choose to not have villains engage in these activities.
  properties:
    category: "Playing the Game"
- id: "basic-competence"
  name: "Basic Competence"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: "Some performances require you to be more than just charismatic, and if you don't meet the demands of the art form or the audience, the GM might apply a penalty based on the relevant attribute. For example, if you're dancing and have a negative Dexterity modifier, you might take a penalty to your attempt at dancing. Likewise, if you are orating and have a negative Intelligence modifier, you might have to hope your raw Charisma can overcome the penalties from your intellectual shortcomings—or ask someone to help write your speeches!"
  properties:
    category: "Skills"
- id: "basic-saving-throws"
  name: "Basic Saving Throws"
  source: "pc > Chapter 7: Spells > Defenses > Basic Saving Throws"
  description: "If a spell's Defenses entry specifies a \"basic\" saving throw, the spell's potential effects all relate to the damage listed in the spell's description. The target takes no damage on a critical success, half damage on a success, full damage on a failure, or double damage on a critical failure."
  properties:
    category: "Spells"
- id: "bulk"
  name: "Bulk"
  source: "pc > Chapter 6: Equipment > Bulk"
  description: "Carrying especially heavy or unwieldy items can make it more difficult for you to move, as can overloading yourself with too much gear. The Bulk value of an item reflects how difficult the item is to handle, representing its size, weight, and general awkwardness. If you have a high Strength modifier, you usually don't need to worry about Bulk unless you're carrying numerous substantial items."
  properties:
    category: "Equipment"
- id: "bulk-conversions-for-different-sizes"
  name: "Bulk Conversions for Different Sizes"
  source: "pc > Chapter 6: Equipment > Items and Sizes > Bulk Conversions for Different Sizes"
  description: |-
    As shown in the Bulk Conversions table, Large or larger creatures are less encumbered by bulky items than Small or Medium creatures, while Tiny creatures become overburdened more quickly. A Large creature treats 10 items of 1 Bulk as 1 Bulk, a Huge creature treats 10 items of 2 Bulk as 1 Bulk, and so on. A Tiny creature treats 10 items of negligible Bulk as 1 Bulk. Negligible items work in a similar way—a Huge creature treats items of 1 Bulk as negligible, so it can carry any number of items of 1 Bulk. A Tiny creature doesn't treat any items as having negligible Bulk.
    Bulk Conversions
    Creature Bulk Treats Treats as
    Size Limit as Light Negligible
    Tiny Half — none
    Small or Med. Standard L —
    Large x2 1 Bulk L
    Huge x4 2 Bulk 1 Bulk
    Gargantuan x8 4 Bulk 2 Bulk
  properties:
    category: "Equipment"
- id: "bulk-limits"
  name: "Bulk Limits"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk Limits"
  description: |-
    You can carry an amount of Bulk equal to 5 plus your Strength modifier without penalty; if you carry more, you gain the encumbered condition. You can't hold or carry more Bulk than 10 plus your Strength modifier.
    Encumbered
    You are carrying more weight than you can manage. While you're encumbered, you're clumsy 1 and take a -10-foot penalty to all your Speeds. As with all penalties to your Speed, this can't reduce your Speed below 5 feet.
  properties:
    category: "Equipment"
- id: "bulk-of-coins"
  name: "Bulk of Coins"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk of Coins"
  description: "Coins are a popular means of exchange due to their portability, but they can still add up. A thousand coins of any denomination or combination of denominations count as 1 Bulk. It's not usually necessary to determine the Bulk of coins in fractions of 1,000; simply round down fractions of 1,000. In other words, 100 coins don't count as a light item, and 1,999 coins are 1 Bulk, not 2."
  properties:
    category: "Equipment"
- id: "bulk-of-creatures"
  name: "Bulk of Creatures"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk of Creatures"
  description: |-
    You might need to know the Bulk of a creature, especially if you need to carry someone. This table lists the typical Bulk of a creature, but the GM might adjust this number.
    Size of Creature Bulk
    Tiny 1
    Small 3
    Medium 6
    Large 12
    Huge 24
    Gargantuan 48
  properties:
    category: "Equipment"
- id: "bulk-values"
  name: "Bulk Values"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk Values"
  description: "Items can have a number to indicate their Bulk value, or they can be light (indicated by an L) or negligible (indicated by a —) for the purpose of determining Bulk. For instance, full plate armor is 4 Bulk, a longsword is 1 Bulk, a dagger or scroll is light, and a piece of chalk is negligible. Ten light items count as 1 Bulk, and you round down fractions (so 9 light items count as 0 Bulk, and 11 light items count as 1 Bulk). Items of negligible Bulk don't count toward Bulk unless you try to carry vast numbers of them, as determined by the GM."
  properties:
    category: "Equipment"
- id: "burst"
  name: "Burst"
  source: "pc > Chapter 8: Playing the Game > Area > Burst"
  description: "A burst effect issues forth in all directions from a single corner of a square within the range of the effect, spreading in all directions to a specified radius. For instance, when you cast fireball, it detonates at the corner of a square within 500 feet of you and creates a 20-foot burst, meaning it extends out 20 feet in every direction from the corner of the square you chose, affecting each creature whose space (or even one square of its space) is within the burst."
  properties:
    category: "Playing the Game"
- id: "cantrips"
  name: "Cantrips"
  source: "pc > Chapter 7: Spells > Cantrips"
  description: |-
    A cantrip is a special type of spell that's weaker than other spells but can be used with greater freedom and flexibility. The title of a cantrip's stat block says "Cantrip" instead of "Spell", and the spell has the cantrip trait. Casting a cantrip doesn't use up your spell slots; you can cast a cantrip at will, any number of times per day. If you're a prepared caster, you can prepare a specific number of cantrips each day. You can't prepare a cantrip in a spell slot.
    A cantrip is always automatically heightened to half your level, rounded up. For a typical spellcaster, this means its rank is equal to the highest rank of spell slot you have.
  properties:
    category: "Spells"
- id: "carrying-items"
  name: "Carrying Items"
  source: "pc > Chapter 6: Equipment > Carrying Items"
  description: "A character carries items in three ways: held, worn, and stowed. Held items are in your hands; a character typically has two hands, allowing them to hold an item in each hand or a single two-handed item using both hands. Worn items are tucked into pockets, belt pouches, bandoliers, weapon sheaths, and so forth, and they can be retrieved and returned relatively quickly. Stowed items are in a backpack or a similar container, and they are more difficult to access."
  properties:
    category: "Equipment"
- id: "casting-rituals"
  name: "Casting Rituals"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals"
  description: |-
    When you take charge of a ritual, you are its primary caster, and others assisting you are secondary casters. You can be a primary caster for a ritual even if you can't cast spells. You must know the ritual, and the ritual's spell rank can be no higher than half your level rounded up. You must also have the required proficiency rank in the skill used for the ritual's primary check (see Checks below), and as the primary caster, you must attempt this skill check to determine the ritual's effects. The primary skill check determines the tradition.
    Rituals do not require spell slots to cast. You can heighten a ritual up to half your level rounded up, decided when the ritual is initiated. A ritual always takes at least 1 hour to perform, and often longer. While a ritual is a downtime activity, it's possible—albeit risky—to perform a ritual during exploration with enough uninterrupted time. A ritual's casting time is usually listed in days. Each day of casting requires 8 hours of participation in the ritual from all casters, with breaks during multiday rituals to allow rest. One caster can continue a multiday ritual, usually with some light chanting or meditation, while the other casters rest. All rituals require repeated spellcasting words and gestures throughout their casting time.
    Rituals by Rank
    Rank Ritual
    2 animate object
    2 consecrate
    2 create undead
    3 geas
    3 rune trap
    4 atone
    4 blight
    4 plant growth
    5 call spirit
    5 planar servitor
    5 resurrect
    6 awaken animal
    6 binding circle
    6 commune
    6 primal call
    7 collective memories
    7 planar displacement
    8 control weather
    10 wish
  properties:
    category: "Spells"
- id: "casting-spells"
  name: "Casting Spells"
  source: "pc > Chapter 7: Spells > Casting Spells"
  description: |-
    The casting of a spell can range from a simple word of magical might that creates a fleeting effect to a complex process taking hours to cast and producing a long-term impact. Casting a spell requires the caster to make gestures and utter incantations, so being unable to speak prevents spellcasting for most casters. If your character has a long-term disability that prevents or complicates them from speaking, work with the GM to determine an analogous way they cast their spells, such as tapping in code on their staff or whistling.
    Spellcasting creates obvious sensory manifestations, such as bright lights, crackling sounds, and sharp smells from the gathering magic. Nearly all spells manifest a spell signature—a colorful, glowing ring of magical runes that appears in midair, typically around your hands, though what kind of spellcaster you are can affect this—academic wizards typically have neat and ordered spell signatures, while a druid's might be more organic and a cleric's might be inspired by their deity. How spellcasting looks can vary from one spellcasting tradition or class to another, or even from person to person. You have a great deal of freedom in flavoring your character's magic however you wish!
    Spells can vary in how many actions they take, as shown in the spell's stat block. You cast cantrips, spells from spell slots, and focus spells using the same process, but must expend the spell when casting a spell from a spell slot and must spend 1 Focus Point to cast a focus spell. Some rules will refer to the Cast a Spell activity, such as "if the next action you use is to Cast a Spell." Any spell qualifies as a Cast a Spell activity, and any characteristics of the spell use those of the specific spell you're casting.
  properties:
    category: "Spells"
- id: "checks"
  name: "Checks"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Checks"
  description: |-
    At the ritual's culmination, you must attempt the skill check listed in the Primary Check entry to determine the ritual's outcome. Primary checks usually have a very hard DC for a level that's twice the ritual's spell rank. As with other downtime activities, fortune and misfortune effects can't modify your checks for the ritual, nor can bonuses or penalties that aren't active throughout the process.
    The GM can adjust the DCs of rituals, add or change primary or secondary checks, or even waive requirements to fit specific circumstances. For example, performing a ritual in a location where ley lines converge on the night of a new moon might make a normally difficult ritual drastically easier.
    Secondary Checks
    Often, a ritual requires secondary checks to represent aspects of its casting, usually with a standard DC for a level twice the ritual's spell rank. A different secondary caster must attempt each secondary check. If there are more secondary casters than checks, the others don't attempt any.
    Secondary casters attempt their checks before you attempt the primary check; no matter their results, the ritual proceeds to the primary check. Secondary checks affect the primary check depending on their results.
    **Critical Success.** You gain a +2 circumstance bonus to the primary check.
    **Success.** No bonus or penalty.
    **Failure.** You take a -4 circumstance penalty to the primary check.
    **Critical Failure.** As failure, and you reduce the degree of success of the primary skill check by one step.
  properties:
    category: "Spells"
- id: "class-entries"
  name: "Class Entries"
  source: "pc > Chapter 3: Classes > Reading Class Entries"
  description: "Every class entry includes information about typical members of the class, plus suggestions for roleplaying characters of that class and playing these characters in the game's various modes. Each class provides your character with an attribute boost to a key attribute; a number of Hit Points they receive at each level; proficiency ranks for various abilities, equipment, and skills; special abilities from their class features; and more. Your character's class entry also provides the information needed when they gain levels, so it will be a vital reference throughout the course of your campaign."
  properties:
    category: "Classes"
- id: "class-features"
  name: "Class Features"
  source: "pc > Chapter 3: Classes > Reading Class Entries > Class Features"
  description: |-
    This section presents all the abilities the class grants your character. An ability gained at a higher level lists the required level next to the ability's name. All classes include the class features detailed below, and each class also gets special class features specific to it. Many class features require you to choose between options. Unless the specific ability states otherwise, such decisions can't be changed without retraining.
    Class Feats
    This section specifies the levels at which your character gains class feats—special feats that only members of that class can access. Class feats are granted beginning at 1st or 2nd level, depending on the class. Specific class feats are detailed at the end of each class entry.
    Skill Feats
    This section specifies the levels at which your character gains feats with the skill trait, called skill feats. At 2nd level and every 2 levels thereafter, most classes gain a skill feat, though rogues gain them earlier and more often. Your character must be trained in the corresponding skill to take a skill feat.
    General Feats
    This section specifies the levels at which your character gains general feats. Most classes grant a general feat at 3rd level and every 4 levels thereafter. At each of these levels, you can select any general feat (including skill feats) as long as your character qualifies for it.
    Skill Increases
    This section specifies the levels at which your character can increase their proficiency rank in a skill. At 3rd level and every 2 levels thereafter, most classes grant a skill increase, though rogues gain them earlier and more often. Your character can use a skill increase to either become trained in one skill in which they're untrained or become an expert in one skill in which they're already trained.
    If your character is at least 7th level, they can use a skill increase to become a master of a skill in which they're already an expert. If they're at least 15th level, they can use an increase to become legendary in a skill in which they're already a master.
    Attribute Boosts
    At 5th level and every 5 levels thereafter, your character boosts four different attribute modifiers. This is described briefly in the class.
    Ancestry Feats
    This section serves as a reminder of the ancestry feats your character gains at 5th, 9th, 13th, and 17th levels. Ancestry feats are detailed in each ancestry entry.
  properties:
    category: "Classes"
- id: "class-key-attribute"
  name: "Class Key Attribute"
  source: "pc > Chapter 3: Classes > Reading Class Entries > Key Attribute"
  description: |-
    This is the attribute modifier that a member of your class cares about the most. Many of your most useful and powerful abilities are tied to this attribute in some way.
    For instance, this is the attribute modifier you'll use to determine the Difficulty Class (DC) associated with your character's class features and feats. This is called your class DC. If your character is a member of a spellcasting class, this key attribute is used to calculate spell DCs and similar values.
    Most classes are associated with one key attribute modifier, but some allow you to choose from two options. For instance, if you're a fighter, you can choose either Strength or Dexterity as your key attribute. A fighter who chooses Strength will excel in hand-to-hand combat, while those who choose Dexterity prefer ranged or finesse weapons.
    Additionally, when you choose your character's class, they gain an attribute boost to their key attribute modifier, increasing that attribute modifier by 1.
  properties:
    category: "Classes"
- id: "coins-and-currency"
  name: "Coins and Currency"
  source: "pc > Chapter 6: Equipment > Coins and Currency"
  description: |-
    Though you might be able to barter valuable items in some areas, currency is the most versatile way to make transactions when you head to market. The most common currency is coins. There are four common types of coins, each standardized in weight and value.
    • The copper piece (cp) is worth one-tenth of a silver piece.
    • The silver piece (sp) is the standard unit of currency. Each silver piece is a standard weight of silver and is typically accepted by any merchant or kingdom no matter where it was minted.
    • The gold piece (gp) is often used for purchasing magic items and other expensive items, as 1 gold piece is worth 10 silver pieces or 100 copper pieces.
    • The platinum piece (pp) is used for the purchase of very expensive items or as a way to easily transport large sums of currency. A platinum piece is worth 10 gold pieces, 100 silver pieces, or 1,000 copper pieces.
  properties:
    category: "Equipment"
- id: "combat-in-three-dimensions"
  name: "Combat in Three Dimensions"
  source: "pc > Chapter 8: Playing the Game > Encounter Mode > Special Battles > Sidebar"
  description: |-
    In aerial and aquatic combat, you might need to track positioning in three dimensions. For flying creatures, you might use one of the following methods:
    • Find platforms to place flying creatures' miniatures on.
    • Set a die next to a creature with the number indicating how many squares up in the air it is.
    • Make a stack of dice or tokens, 1 per 5 feet of elevation.
    • Write the elevation next to the monster on the grid.
    In underwater combat, choose a plane to be the baseline, typically the waterline, the sea floor, or a stationary object you can measure from.
    As with ground-based movement, moving diagonally up or down in 3-D space requires counting every other diagonal as 10 feet. Measure flanking in all directions—creatures above and below an enemy can flank it just as effectively as they can from opposite sides.
  properties:
    category: "Playing the Game"
- id: "communication"
  name: "Communication"
  source: "pc > Chapter 3: Classes > Familiars > Communication"
  description: "Your familiar can communicate empathically with you as long as it's within 1 mile of you, sharing emotions. It doesn't understand or speak languages normally, but it can gain speech from a familiar ability."
  properties:
    category: "Classes"
- id: "companion-advancement"
  name: "Companion Advancement"
  source: "pc > Chapter 3: Classes > Companions > Companion Advancement"
  description: "You can advance an animal companion, usually due to one of your class feat choices. Normally, you can advance a young animal companion to a mature animal companion, advance a mature companion to either a nimble or savage companion, and advance a nimble or savage companion into a specialized companion."
  properties:
    category: "Classes"
- id: "companion-types"
  name: "Companion Types"
  source: "pc > Chapter 3: Classes > Companions > Companion Types"
  description: |-
    The species of animal you choose is called your companion's type. Each companion type has its own statistics, as follows.
    **Size.** The companion's size
    **Unarmed Attacks.** One or more entries with the companion's unarmed attacks and their traits and damage
    **Attribute Modifiers.** Starting attribute modifiers
    **Hit Points.** The companion's ancestry Hit Points
    **Skill.** An additional trained skill your companion has
    **Senses.** Special senses your companion has
    **Speed.** Your companion's Speeds
    **Special.** If present, this lists any special ability your companion has, such as whether it often serves as a mount.
    **Support Benefit.** A special benefit you gain by Commanding the Animal to use the Support action (see below).
    **Advanced Maneuver.** A powerful new action your companion learns how to use if it becomes a nimble or savage animal companion.
    **Support (1 action).**
    **Requirements.** The creature is an animal companion.
    Your animal companion supports you. You gain the benefits listed in the companion type's Support Benefit entry. If the animal uses the Support action, the only other actions it can use on this turn are basic move actions to get into position to take advantage of the Support benefits; if it has already used any other action this turn, it can't Support you.
  properties:
    category: "Classes"
- id: "companions"
  name: "Companions"
  source: "pc > Chapter 3: Classes > Companions"
  description: "Animal companions and familiars are special benefits for certain classes or class feats. If you simply want a pet regardless of your class, you can take the Pet feat. You can have a familiar or pet, but not both. Because animal companions function much differently, you can have both an animal companion and a familiar or pet."
  properties:
    category: "Classes"
- id: "condition-values"
  name: "Condition Values"
  source: "pc > Conditions Appendix > Condition Values"
  description: "Some conditions have a number after the condition, called a condition value. This value conveys the severity of a condition, and such conditions often give you a bonus or penalty equal to their value. These values can often be reduced by skills, spells, or simply waiting. If a condition value is ever reduced to 0, the condition ends."
  properties:
    category: "Conditions"
- id: "conditions"
  name: "Conditions"
  source: "pc > Conditions Appendix"
  description: "Conditions are persistent. Whenever you're affected by a condition, its effects last until the condition's stated duration ends, the condition is removed, or terms dictated in the condition itself cause it to end."
  properties:
    category: "Conditions"
- id: "cone"
  name: "Cone"
  source: "pc > Chapter 8: Playing the Game > Area > Cone"
  description: |-
    A cone shoots out from you in a quarter circle on the grid. When you aim a cone, the first square of that cone must share an edge with your space if you're aiming orthogonally, or it must touch a corner of your space if you're aiming diagonally. If you're Large or larger, the first square can run along the edge of any square of your space. You can't aim a cone so that it overlaps your space. The cone extends out for a number of feet, widening as it goes. For instance, if you cast the breathe fire spell, you create a cone of flames that originates at the edge of one square of your space and affects a quarter-circle area 15 feet on each edge.
    If you make a cone originate elsewhere, use these same rules, with the first square of the cone using an edge or corner of that creature or object's space instead of your own.
  properties:
    category: "Playing the Game"
- id: "cost"
  name: "Cost"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Cost"
  description: "A ritual's Cost entry lists valuable components required to cast the ritual. If a ritual doesn't have any such components, it won't have a Cost entry. The cost is consumed when you attempt the primary skill check. Costs are often presented as a base cost multiplied by the target's level and sometimes the spell's rank. If the target's level is lower than 1, multiply the cost by 1 instead. Heightened versions that increase the base cost multiply it by the target's level or another value as appropriate. Most rituals that create permanent creatures, such as create undead, use costs based on the level of the creature, as presented in Creature Creation Rituals."
  properties:
    category: "Spells"
- id: "cost-of-living"
  name: "Cost of Living"
  source: "pc > Chapter 6: Equipment > Gear > Cost of Living"
  description: |-
    Cost of living provides a total cost to covers room and board, dues, taxes, and other fees. You typically need to track and pay for your cost of living only during downtime.
    Cost of Living
    Standard of Living Week Month Year
    Subsistence* 4 sp 2 gp 24 gp
    Comfortable 1 gp 4 gp 52 gp
    Fine 30 gp 130 gp 1,600 gp
    Extravagant 100 gp 430 gp 5,200 gp
    * You can attempt to Subsist using Society or Survival
    for free.
  properties:
    category: "Equipment"
- id: "costs-and-loci"
  name: "Costs and Loci"
  source: "pc > Chapter 7: Spells > Casting Spells > Costs and Loci"
  description: |-
    Some spells require you to pay a cost or provide a locus. If the spell lists a cost, you must have the listed money, valuable materials, or other resources to cast the spell (such as gems or magical reagents), and they're expended during the casting.
    A locus is an object that funnels or directs the magical energy of the spell but is not consumed in its casting. As part of Casting the Spell, you retrieve the locus (if necessary, and if you have a free hand), and you can put it away again if you so choose. Loci tend to be expensive, and you need to acquire them in advance to cast the spell, but they aren't expended like costs are. Unless noted otherwise, a locus has negligible Bulk.
  properties:
    category: "Spells"
- id: "counteract-checks"
  name: "Counteract Checks"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Sidebar: Counteracting"
  description: |-
    Some effects try to counteract spells, afflictions, conditions, or other effects. Counteract checks compare the power of two forces and determine which defeats the other. Successfully counteracting an effect disrupts it, preventing it from having any effect, unless noted otherwise.
    When attempting a counteract check, add the relevant skill modifier or other appropriate modifier to your check against the target's DC. If you're counteracting an affliction, the DC is in the affliction's stat block. If it's a spell, use the caster's DC. The GM can also calculate a DC based on the target effect's level. For spells, the counteract check modifier is your spellcasting attribute modifier plus your spellcasting proficiency bonus, plus any bonuses and penalties that specifically apply to counteract checks.
    What you can counteract depends on the check result and the target's counteract rank. If an effect is a spell, its rank is the counteract rank. Otherwise, halve its level and round up to determine its counteract rank (minimum counteract rank 0). If an effect's level is unclear and it came from a creature, halve and round up the creature's level.
    **Critical Success.** Counteract the target if its counteract rank is no more than 3 higher than your effect's counteract rank.
    **Success.** Counteract the target if its counteract rank is no more than 1 higher than your effect's counteract rank.
    **Failure.** Counteract the target if its counteract rank is lower than your effect's counteract rank.
    **Critical Failure.** You fail to counteract the target.
    Counteract Table
    This table provides a reference for what an effect can counteract based on its rank and the check result. The first number in each column is the counteract rank at which you can counteract an effect based on your degree of success. The numbers in parentheses are the typical level range corresponding to that rank.
    Counteract Critical
    Rank Failure Success Success
    0 — 1 (1 to 2) 3 (5 to 6)
    1 0 (-1 to 0) 2 (3 to 4) 4 (7 to 8)
    2 1 (1 to 2) 3 (5 to 6) 5 (9 to 10)
    3 2 (3 to 4) 4 (7 to 8) 6 (11 to 12)
    4 3 (5 to 6) 5 (9 to 10) 7 (13 to 14)
    5 4 (7 to 8) 6 (11 to 12) 8 (15 to 16)
    6 5 (9 to 10) 7 (13 to 14) 9 (17 to 18)
    7 6 (11 to 12) 8 (15 to 16) 10 (19 to 20)
    8 7 (13 to 14) 9 (17 to 18) 11 (21 to 22)
    9 8 (15 to 16) 10 (19 to 20) 12 (23 to 24)
    10 9 (17 to 18) 11 (21 to 22) 13 (25 to 26)
  properties:
    category: "Playing the Game"
- id: "counteracting"
  name: "Counteracting"
  source: "pc > Chapter 7: Spells > Counteracting"
  description: "Some spells, such as dispel magic, can be used to eliminate the effects of other spells. At least one creature, object, or manifestation of the spell you are trying to counteract must be within range of the spell that you are using. You attempt a counteract check using your Charisma (or other spellcasting attribute modifier) and your proficiency bonus for spell attack rolls."
  properties:
    category: "Spells"
- id: "cover"
  name: "Cover"
  source: "pc > Chapter 8: Playing the Game > Movement > Cover"
  description: |-
    When you're behind an obstacle that could block weapons, guard you against explosions, and make you harder to detect, you're behind cover. Standard cover gives you a +2 circumstance bonus to AC, to Reflex saves against area effects, and to Stealth checks to Hide, Sneak, or otherwise avoid detection. You can increase this to greater cover using the Take Cover basic action, increasing the circumstance bonus to +4. If cover is especially light, typically when it's provided by a creature, you have lesser cover, which grants a +1 circumstance bonus to AC. A creature with standard cover or greater cover can attempt to use Stealth to Hide, but lesser cover isn't sufficient.
    Type of Cover Circumstance Bonus Can Hide
    Lesser +1 to AC No
    Standard +2 to AC, Reflex, Stealth Yes
    Greater +4 to AC, Reflex, Stealth Yes
    Cover is relative, so you might simultaneously have cover against one creature and not another. Cover applies only if your path to the target is partially blocked. If a creature is entirely behind a wall or the like, you don't have line of effect and typically can't target it at all.
    Usually, the GM can quickly decide whether your target has cover. If you're uncertain or need to be more precise, draw a line from the center of your space to the center of the target's space.
    If the line between the centers of two spaces crosses blocking terrain, the creatures have cover from one another.
    If that line passes through any terrain or object that would block the effect, the target has standard cover (or greater cover if the obstruction is extreme or the target has Taken Cover). If the line passes through a creature instead, the target has lesser cover. When measuring cover against an area effect, draw the line from the effect's point of origin to the center of the creature's space.
    Cover and Large Creatures
    If a creature between you and a target is two or more sizes larger than both you and your target, that creature's space blocks the effect enough to provide standard cover instead of lesser cover. The GM might determine that a creature doesn't gain cover from terrain that it's significantly larger than. For example, a Huge dragon probably wouldn't receive any benefit from being behind a 1-foot-wide pillar.
    Special Circumstances
    Your GM might allow you to overcome your target's cover in some situations. If you're right next to an arrow slit, you can shoot without penalty, but you have greater cover against someone shooting back at you from far away. Your GM might let you reduce or negate cover by leaning around a corner to shoot or the like. This usually takes an action to set up, and the GM might measure cover from an edge or corner of your space instead of your center.
  properties:
    category: "Playing the Game"
- id: "crafting"
  name: "Crafting"
  source: "pc > Chapter 4: Skills > Skills > Crafting"
  description: |-
    You can use this skill to create and repair items. Even if you're untrained, you can Recall Knowledge.
    • Recall Knowledge about alchemical reactions, the value of items, engineering, unusual materials, and alchemical or mechanical creatures. The GM determines which creatures this applies to, but it usually includes constructs.
    You must be trained in Crafting to use it to Earn Income.
    • Earn Income by crafting goods for the market.
  properties:
    category: "Skills"
- id: "crafting-goods-for-the-market"
  name: "Crafting Goods for the Market"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
    Using Crafting, you can work at producing common items for the market. It's usually easy to find work making basic items whose level is 1 or 2 below your settlement's level.
    Higher-level tasks represent special commissions, which might require you to Craft a specific item using the Craft downtime activity and sell it to a buyer at full Price. These opportunities don't occur as often and might have special requirements—or serious consequences if you disappoint a prominent client.
  properties:
    category: "Skills"
- id: "creature-creation-rituals"
  name: "Creature Creation Rituals"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    Creature Level Ritual Rank Required Cost
    -1 or 0 2 15 gp
    1 2 60 gp
    2 3 105 gp
    3 3 180 gp
    4 4 300 gp
    5 4 480 gp
    6 5 750 gp
    7 5 1,080 gp
    8 6 1,500 gp
    9 6 2,100 gp
    10 7 3,000 gp
    11 7 4,200 gp
    12 8 6,000 gp
    13 8 9,000 gp
    14 9 13,500 gp
    15 9 19,500 gp
    16 10 30,000 gp
    17 10 45,000 gp
  properties:
    category: "Spells"
- id: "critical-hits"
  name: "Critical Hits"
  source: "pc > Chapter 6: Equipment > Weapons > Critical Hits"
  description: "When you make a Strike with a weapon or unarmed attack and succeed with a natural 20 (the number on the die is 20), or if the result of your attack exceeds the target's AC by 10, you achieve a critical success (also known as a critical hit). If you critically succeed at a Strike, your attack deals double damage."
  properties:
    category: "Equipment"
- id: "critical-specialization"
  name: "Critical Specialization"
  source: "pc > Chapter 6: Equipment > Weapons > Critical Specialization"
  description: |-
    Certain effects can grant you benefits when you make a Strike with certain weapons and get a critical success. This is called a critical specialization effect. The exact effect depends on which weapon group your weapon belongs to, as listed below. You can always decide not to add the critical specialization effect of your weapon.
    Axe: Choose one creature adjacent to the initial target and within reach. If its AC is lower than your attack roll result for the critical hit, you deal damage to that creature equal to the result of the weapon damage die you rolled (including extra dice for its striking rune, if any). This amount isn't doubled, and no bonuses or other additional dice apply to this damage.
    Bomb: Increase the radius of the bomb's splash damage (if any) to 10 feet.
    Bow: If the target of the critical hit is adjacent to a surface, it gets stuck to that surface by the missile. The target is immobilized and must spend an Interact action to attempt a DC 10 Athletics check to pull the missile free; it can't move from its space until it succeeds. The creature doesn't become stuck if it is incorporeal, is liquid, or could otherwise escape without effort (such as by being large enough that the missile would not be an impediment.)
    Brawling: The target must succeed at a Fortitude save against your class DC or be slowed 1 until the end of your next turn.
    Club: You knock the target up to 10 feet in a straight line away from you, in a direction of your choice. This is forced movement.
    Crossbow: The target takes 1d8 persistent bleed damage. You gain an item bonus to this bleed damage equal to the weapon's item bonus to attack rolls.
    Dart: The target takes 1d6 persistent bleed damage. You gain an item bonus to this bleed damage equal to the weapon's item bonus to attack rolls.
    Flail: The target is knocked prone unless they succeed at a Reflex save against your class DC.
    Hammer: The target is knocked prone unless they succeed at a Fortitude save against your class DC.
    Knife: The target takes 1d6 persistent bleed damage. You gain an item bonus to this bleed damage equal to the weapon's item bonus to attack rolls.
    Pick: The weapon viciously pierces the target, who takes 2 additional damage per weapon damage die.
    Polearm: The target is moved 5 feet in a direction of your choice. This is forced movement.
    Shield: You knock the target back from you 5 feet. This is forced movement.
    Sling: The target must succeed at a Fortitude save against your class DC or be stunned 1.
    Spear: Weapons of this type pierce the target, weakening its attacks. The target is clumsy 1 until the start of your next turn.
    Sword: The target is made off-balance by your attack, becoming off-guard until the start of your next turn.
  properties:
    category: "Equipment"
- id: "damage-and-conditions"
  name: "Damage and Conditions"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Damage and Conditions"
  description: "Any damage listed for a stage happens immediately when you reach that stage. Conditions affect you when you reach the stage and last for their normal duration. For instance, if you were drained for an affliction with a maximum duration of 5 minutes, you remain drained after the affliction ends, as normal for the drained condition. A condition that automatically changes its value or ends under certain circumstances, like frightened, still does so. Any condition that doesn't have a default duration, such as clumsy or paralyzed, lasts as long as you're at that stage unless noted otherwise, as do any penalties or any other effect of the stage that doesn't list a duration."
  properties:
    category: "Playing the Game"
- id: "damage-rolls"
  name: "Damage Rolls"
  source: "pc > Chapter 6: Equipment > Weapons > Damage Rolls"
  description: |-
    When the result of your attack roll with a weapon or unarmed attack equals or exceeds your target's AC, you hit your target! Roll the weapon or unarmed attack's damage die and add the relevant modifiers, bonuses, and penalties to determine the amount of damage you deal. Calculate a damage roll as follows.
    Melee damage roll = damage die of weapon or unarmed attack + Strength modifier + bonuses + penalties
    Ranged damage roll = damage die of weapon (+ Strength modifier for a thrown weapon or half Strength modifier for a propulsive weapon) + bonuses + penalties
    Ranged weapons don't normally add an attribute modifier to the damage roll, though weapons with the propulsive trait add half your Strength modifier (or your full modifier if it is a negative number), and thrown weapons add your full Strength modifier.
    Magic weapons with striking, greater striking, or major striking runes add one or more weapon damage dice to your damage roll. These extra dice are the same die size as the weapon's damage die. At higher levels, most characters also gain extra damage from weapon specialization.
  properties:
    category: "Equipment"
- id: "damage-types"
  name: "Damage Types"
  source: "pc > Chapter 8: Playing the Game > Immunity, Weakness, and Resistance > Sidebar: Damage Types"
  description: |-
    Damage has a number of different types and categories, which are described below.
    Physical Damage
    Damage dealt by weapons, many physical hazards, and a handful of spells is collectively called physical damage. The main types of physical damage are bludgeoning, piercing, and slashing. Bludgeoning damage comes from weapons and hazards that deal blunt-force trauma, like a hit from a club or being dashed against rocks. Piercing damage is dealt from stabs and punctures, whether from a dragon's fangs or the thrust of a spear. Slashing damage is delivered by a cut, be it the swing of the sword or the blow from a scythe blades trap.
    Ghosts and other incorporeal creatures have a high resistance to physical attacks that aren't magical (attacks that lack the magical trait). Furthermore, most incorporeal creatures have additional, though lower, resistance to magical physical damage (such as damage dealt from a mace with the magical trait) and most other damage types.
    Energy Damage
    Many spells and other magical effects deal energy damage. Energy damage is also dealt from effects in the world, such as the biting cold of a blizzard to a raging forest fire. The main types of energy damage are acid, cold, electricity, fire, and sonic. Acid damage can be delivered by gases, liquids, and certain solids that dissolve flesh, and sometimes harder materials. Cold damage freezes material by way of contact with chilling gases and ice. Electricity damage comes from the discharge of powerful lightning and sparks. Fire damage burns through heat and combustion. Sonic damage assaults matter with high-frequency vibration and sound waves. Many times, you deal energy damage by casting magic spells, and doing so is often useful against creatures that have immunities or resistances to physical damage.
    Two special types of energy damage specifically target the living and the undead. Vitality damage harms only undead creatures, withering undead bodies and disrupting incorporeal undead. Void damage saps life, damaging only living creatures.
    Powerful and pure magical energy can manifest itself as force damage. Few things can resist this type of damage—not even incorporeal creatures such as ghosts and wraiths.
    Spirit Damage
    Directly affecting the spiritual essence of a creature, spirit damage can damage a target projecting its consciousness or possessing another creature even if the target's body is elsewhere. The possessed creature isn't harmed by the blast. Spirit damage doesn't harm creatures that have no spirit, such as constructs. Many effects that deal spirit damage also have the sanctified, holy, or unholy trait.
    Mental Damage
    Sometimes an effect can target the mind with enough psychic force to actually deal damage to the creature. When it does, it deals mental damage. Mindless creatures and those with only programmed or rudimentary intelligence are often immune to mental damage and effects.
    Poison Damage
    Venoms, toxins and the like can deal poison damage, which affects creatures by way of contact, ingestion, inhalation, or injury. In addition to coming from monster attacks, alchemical items, and spells, poison damage is often caused by ongoing afflictions, which follow special rules.
    Bleed Damage
    Another special type of physical damage is bleed damage. This is typically persistent damage, and represents loss of blood. Typically nonliving creatures and living ones that don't need blood to live are immune to bleed. Weaknesses and resistances to physical damage apply. Bleed damage ends automatically if you're healed to your full Hit Points.
    Precision Damage
    Sometimes you are able to make the most of your attack through sheer precision. When you hit with an ability that grants you precision damage, you increase the attack's listed damage, using the same damage type, rather than tracking a separate pool of damage. For example, a non-magical dagger Strike that deals 1d6 precision damage from a rogue's sneak attack increases the piercing damage by 1d6.
    Some creatures are immune to precision damage, regardless of the damage type; these are often amorphous creatures that lack vulnerable anatomy. A creature immune to precision damage would ignore the 1d6 precision damage in the example above, but it would still take the rest of the piercing damage from the Strike. Since precision damage is always the same type of damage as the attack it's augmenting, a creature that is resistant to physical damage, like a gargoyle, would resist not only the dagger's damage but also the precision damage, even though it is not specifically resistant to precision damage.
    Precious Materials
    While not their own damage category, precious materials can modify damage to penetrate a creature's resistances or take advantage of its weaknesses. For instance, silver weapons are particularly effective against werecreatures and bypass the resistances to physical damage that most devils have.
  properties:
    category: "Playing the Game"
- id: "death-rule"
  name: "Death"
  source: "pc > Chapter 8: Playing the Game > Hit Points, Healing, and Dying > Death"
  description: |-
    After you die, you can't act or regain actions, can't be affected by spells that target creatures (unless they specifically target dead creatures), and for all other purposes, you're an object. When you die, you're reduced to 0 Hit Points if you had a different amount, and you can't be brought above 0 Hit Points as long as you remain dead.
    Some magic can bring creatures back to life, such as the resurrect ritual or the raise dead spell, though these abilities aren't without their risks or effects, and rare artifacts and powers can even interfere with them.
  properties:
    category: "Playing the Game"
- id: "deception"
  name: "Deception"
  source: "pc > Chapter 4: Skills > Skills > Deception"
  description: "You can trick and mislead others using disguises, lies, and other forms of subterfuge. Deception often has a drawback if you get found out, and it's often best to be out of town by the time this happens."
  properties:
    category: "Skills"
- id: "dedication-details"
  name: "Dedication Details"
  source: "pc > Chapter 3: Classes > Archetypes > Dedication Details"
  description: "Each archetype's dedication feat represents your character's dedicated effort learning a new set of abilities, making it impossible to split your focus and pursue another archetype at the same time. Once you take a dedication feat, you can't select a different dedication feat until you complete your dedication by taking two other feats from your current archetype. You can't retrain a dedication feat as long as you have any other feats from that archetype."
  properties:
    category: "Classes"
- id: "defenses"
  name: "Defenses"
  source: "pc > Chapter 7: Spells > Defenses"
  description: "If a spell allows the target to attempt a saving throw or use their AC to defend against it, the type of defense is listed in the stat block. Any details on the particular results and timing of the save appear in the text unless the entry specifies a basic saving throw, which follows a standard rule. If a spell allows a defense only under certain circumstances or at a certain time, the Defenses entry is omitted, since the text needs to explain it in more detail. Whenever a spell allows a saving throw, it uses the caster's spell DC, and one that allows AC as a defense typically requires a spell attack."
  properties:
    category: "Spells"
- id: "describing-heroic-deeds"
  name: "Describing Heroic Deeds"
  source: "pc > Chapter 8: Playing the Game > Hero Points > Describing Heroic Deeds"
  description: |-
    Because spending Hero Points reflects heroic deeds or tasks that surpass normal expectations, if you spend a Hero Point, you should describe the deed or task your character accomplishes with it to the other players.
    Your character's deed might invoke a lesson learned in a past adventure, could be spurred by a determination to save someone else, or might depend on an item that ended up on their person due to a previous exploit. If you don't want to describe the deed or don't have any strong ideas about how to do so, ask the GM to come up with something for you. This can be a collaborative process, too. The GM might remind you of a long-forgotten event in the campaign, and all you have to do is fill in how that event comes to mind just at the right time, motivating you to push past your limits.
  properties:
    category: "Playing the Game"
- id: "detecting-creatures"
  name: "Detecting Creatures"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection > Detecting Creatures"
  description: |-
    Three conditions measure the degree to which you can sense a creature: observed, hidden, and undetected. However, the concealed and invisible conditions can partially mask a creature, and the unnoticed condition indicates you have no idea a creature is around.
    With the exception of invisible, these conditions are relative to the viewer—it's possible for a creature to be observed to you but hidden from your ally. Most of these rules apply to objects as well as creatures.
    Typically, the GM tracks how well creatures detect each other, since neither party has perfect information. For example, you might think a creature is in the last place you sensed it, but it was able to Sneak away. Or you might think a creature can't see you in the dark, but it has darkvision.
    You can attempt to avoid detection by using the Stealth skill to Avoid Notice, Hide, or Sneak, or by using Deception to Create a Diversion.
    Observed
    In most circumstances, you can sense creatures without difficulty and target them normally. Creatures in this state are observed. Observing requires a precise sense, which for most creatures means sight. If you can't observe the creature, it's either hidden, undetected, or unnoticed, and you'll need to factor in the targeting restrictions. Even if a creature is observed, it might still be concealed.
    Hidden
    A creature that's hidden is only barely perceptible. You know what space it occupies, but little else. Perhaps the creature just moved behind cover and successfully used the Hide action. Your target might be behind a waterfall, where you can see some movement but can't determine an exact location. Maybe you've been blinded or the creature is invisible, but you used the Seek basic action to determine its general location based on hearing alone. Regardless of the specifics, you're off-guard to a hidden creature.
    When targeting a hidden creature, before you roll to determine your effect, you must attempt a DC 11 flat check. If you fail, you don't affect the creature, though the actions you used are still expended—as well as any spell slots, costs, and other resources. You remain off-guard to the creature, whether you successfully target it or not.
    Undetected
    If a creature is undetected, you don't know what space it occupies, you're off-guard to it, and you can't easily target it. Using the Seek basic action can help you find an undetected creature, usually making it hidden from you instead of undetected. If a creature is undetected, that doesn't necessarily mean you're unaware of its presence—you might suspect an undetected creature is in the room with you, even though you're unable to find its space. The unnoticed condition covers creatures you're unaware of.
    Targeting an undetected creature is difficult. If you suspect there's a creature around, you can pick a square and attempt an attack. This works like targeting a hidden creature, but the flat check and attack roll are both rolled in secret by the GM. The GM won't tell you why you missed—whether it was due to failing the flat check, rolling an insufficient attack roll, or choosing the wrong square. The GM might allow you to try targeting an undetected creature with some spells or other abilities in a similar fashion. Undetected creatures are subject to area effects normally.
    For instance, suppose an enemy elf wizard cast invisibility and then Sneaked away. You suspect that with the elf's Speed of 30 feet, they probably moved 15 feet toward an open door. You move up and attack a space 15 feet from where the elf started and directly on the path to the door. The GM secretly rolls an attack roll and flat check, but they know that you were not quite correct—the elf was actually in the adjacent space! The GM tells you that you missed, so you decide to make your next attack on the adjacent space, just in case. This time, it's the right space, and the GM's secret attack roll and flat check both succeed, so you hit!
    Unnoticed
    If you have no idea a creature is even present, that creature is unnoticed by you. A creature that is undetected might also be unnoticed. This condition usually matters for abilities that can be used only against targets totally unaware of your presence.
    Concealed
    A concealed creature is in mist, within dim light, or amid something else that obscures sight but isn't a physical barrier. When you target a creature that's concealed from you, you must attempt a DC 5 flat check before you roll to determine your effect. If you fail, you don't affect the target. The concealed condition doesn't change which of the main categories of detection apply. A creature in a light fog bank is still observed even though it's concealed.
    Invisible
    A creature with the invisible condition (by way of an invisibility spell, for example) is automatically undetected to any creatures relying on sight as their only precise sense. Precise senses other than sight ignore the invisible condition. You can Seek to attempt to figure out an invisible creature's location, making it only hidden from you. This lasts until the invisible creature successfully uses Sneak to become undetected again. If you're already observing a creature when it becomes invisible, it starts out hidden, since you know where it was, though it can then Sneak to become undetected.
    Other effects might partially foil invisibility. For instance, if you were tracking an invisible creature's footprints through the snow, the footprints would make it hidden. Throwing a net over an invisible creature would make it observed but concealed for as long as the net is on it.
  properties:
    category: "Playing the Game"
- id: "detecting-with-other-senses"
  name: "Detecting with Other Senses"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection > Sidebar: Detecting with Other Senses"
  description: |-
    Most abilities that designate "a creature you can see" or the like function just as well if the user can precisely sense the subject with a different sense. If a monster uses a sense other than vision, the GM can adapt ways of avoiding detection that work with the monster's senses. For example, a creature that has echolocation might use hearing as a primary sense. This could mean its quarry is concealed in a noisy chamber, hidden in a great enough din, or invisible under a silence spell.
    Using Stealth with Other Senses
    The Stealth skill is designed to use Hide for avoiding visual detection and Avoid Notice and Sneak to avoid being both seen and heard. For many special senses, a player can describe how they're avoiding detection by that special sense and use the most applicable Stealth action. For instance, a creature stepping lightly to avoid being detected via tremorsense would be using Sneak.
    In some cases, rolling a Dexterity-based Stealth skill check to Sneak doesn't make the most sense. For example, a PC trying to avoid being detected by a creature that senses heartbeats might meditate to slow their heart rate, using Wisdom instead of Dexterity for their Stealth check. When a creature could detect you using multiple different senses, use your lowest applicable attribute modifier.
  properties:
    category: "Playing the Game"
- id: "diplomacy"
  name: "Diplomacy"
  source: "pc > Chapter 4: Skills > Skills > Diplomacy"
  description: "You influence others through negotiation and flattery, or find out information through friendly chats."
  properties:
    category: "Skills"
- id: "dismissing"
  name: "Dismissing"
  source: "pc > Chapter 7: Spells > Durations > Dismissing"
  description: "Some spells can be dismissed, ending the duration early. This requires the caster or target to use the Dismiss action."
  properties:
    category: "Spells"
- id: "disrupted-and-lost-spells"
  name: "Disrupted and Lost Spells"
  source: "pc > Chapter 7: Spells > Casting Spells > Disrupted and Lost Spells"
  description: "Some abilities and spells can disrupt a spell, causing it to have no effect and be lost. When you lose a spell, you've already expended the spell slot and spent the spell's costs and actions. If a spell is disrupted during a Sustain action, the spell immediately ends."
  properties:
    category: "Spells"
- id: "disrupting-actions"
  name: "Disrupting Actions"
  source: "pc > Chapter 8: Playing the Game > Actions > Disrupting Actions"
  description: |-
    Various abilities and conditions, such as a Reactive Strike, can disrupt an action. When an action is disrupted, you still use the actions or reactions you committed and you still expend any costs, but the action's effects don't occur. In the case of an activity, you usually lose all actions spent for the activity up through the end of that turn. For instance, if you began to Cast a Spell requiring 3 actions and the first action was disrupted, you lose all 3 actions that you committed to that activity.
    The GM decides what effects a disruption causes beyond simply negating the effects that would have occurred from the disrupted action. For instance, a Leap disrupted midway wouldn't transport you back to the start of your jump, and a disrupted item hand off might cause the item to fall to the ground instead of staying in the hand of the creature who was trying to give it away.
  properties:
    category: "Playing the Game"
- id: "donning-and-removing-armor"
  name: "Donning and Removing Armor"
  source: "pc > Chapter 6: Equipment > Armor > Donning and Removing Armor"
  description: "Getting in and out of armor is time consuming—so make sure you're wearing it when you need it! Donning and removing armor are both activities involving many Interact actions. It takes 1 minute to don light armor, 5 minutes to don medium or heavy armor, and 1 minute to remove any armor."
  properties:
    category: "Equipment"
- id: "downtime-mode"
  name: "Downtime Mode"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode"
  description: "Downtime gives you time to rest fully, engage in crafting or a professional endeavor, learn new spells, retrain feats, or just have fun. You can sell items acquired during your adventures, buy new goods, and perform other activities as determined by your feats, your skills, and the settlement where you are spending the downtime."
  properties:
    category: "Playing the Game"
- id: "dragging"
  name: "Dragging"
  source: "pc > Chapter 6: Equipment > Bulk > Dragging"
  description: "In some situations, you might drag an object or creature rather than carry it. If you're dragging something, treat its Bulk as half. Typically, you can drag one thing at a time, you must use both hands to do so, and you drag slowly—roughly 50 feet per minute. Use the total Bulk of what you're dragging, for instance, if you're dragging a sack filled with treasure, total the Bulk of everything inside."
  properties:
    category: "Equipment"
- id: "drawing-and-stowing-items"
  name: "Drawing and Stowing Items"
  source: "pc > Chapter 6: Equipment > Carrying Items > Drawing and Stowing Items"
  description: |-
    Drawing a worn item or changing how you're carrying an item usually requires you to use an Interact action (or sometimes the Release action). Many ways of using items require you to spend multiple actions. For example, drinking a potion worn at your belt requires using an Interact action to draw it and then using a second action to drink it as described in its Activate entry.
    The number of hands you need to Interact is usually clear, and if it changes during the action the action takes the maximum number of hands needed during it. The GM decides if it's unclear. You can draw, pick up, or hold an item that needs two hands using only one hand, but you need to subsequently change your grip to hold it in two hands if you want to wield or use it.
    Interact
    You can use the Interact action to:
    • Draw, put away, or swap an item. You must be holding the item to put it away or wearing it to draw it. Swapping allows you to put away one item and draw another in the same action (such as putting away a dagger and drawing a mace). Abilities that specify what you do when you Interact only allow this if they say so; the Quick Draw feat lets a rogue Interact to draw a weapon, but doesn't allow them to stow one as well. Swapping lets you swap only one item for another; if you were wielding two weapons, you could put away one of them and draw a different item, but you would need to put away the second weapon separately.
    • Pick up an item from the ground.
    • Pass off or take a held item from a willing creature. The creature you're passing to must have a hand free. You can also attempt to throw an item to someone. You typically need to succeed at a DC 15 ranged attack with a 10-foot range increment to do so.
    • Detach a shield or other item from you using one hand.
    • Change your grip by adding a hand to an item.
    • Retrieve a stowed item from a backpack, pouch, or similar container (or put one away). You'll often need to Interact to open or close the backpack or container.
    Release
    You can use the Release free action to:
    • Drop an item to the ground.
    • Change your grip by removing a hand from an item.
  properties:
    category: "Equipment"
- id: "durations"
  name: "Durations"
  source: "pc > Chapter 7: Spells > Durations"
  description: |-
    The duration of a spell is how long the spell effect lasts. Spells that last for more than an instant have a Duration entry. A spell might last until the start or end of a turn, for some number of rounds, for minutes, or even longer. If a spell's duration is given in rounds, the number of rounds remaining decreases by 1 at the start of each of the spellcaster's turns, ending when the duration reaches 0.
    Some spells have effects that remain even after the spell's magic is gone. Any ongoing effect that isn't part of the spell's duration entry isn't magical. For instance, a spell that creates a brief, loud sound might deafen someone for a time, even permanently. This deafness couldn't be counteracted because it is not itself magical (though it might be cured by other magic, such as sound body).
    If a spell's caster dies or is incapacitated during the spell's duration, the spell remains in effect until its duration ends, using the caster's initiative order.
  properties:
    category: "Spells"
- id: "dying-rule"
  name: "Dying"
  source: "pc > Chapter 8: Playing the Game > Hit Points, Healing, and Dying > Dying"
  description: |-
    While you have the dying condition, you're bleeding out or otherwise at death's door. You're unconscious while you have the dying condition.
    Dying always includes a value that indicates how close you are to death. If your dying value ever reaches dying 4, you die.
    While you're dying, your dying value can increase or decrease in two different ways: when you fail a recovery check or when you can take damage.
    Recovery Checks
    While you're dying, attempt a recovery check at the start of each of your turns. This is a flat check with a DC equal to 10 + your current dying value to see if you get better or worse.
    **Critical Success.** Your dying value is reduced by 2.
    **Success.** Your dying value is reduced by 1.
    **Failure.** Your dying value increases by 1.
    **Critical Failure.** Your dying value increases by 2.
    Taking Damage
    If you take damage while you already have the dying condition, increase your dying condition value by 1, or by 2 if the damage came from an attacker's critical hit or your own critical failure.
    Losing the Dying Condition
    You lose the dying condition if it ever reaches dying 0. If you're still at 0 Hit Points, you remain unconscious, but you can wake up as described in that condition. You lose the dying condition automatically and wake up if you ever have 1 Hit Point or more.
    Anytime you lose the dying condition, you gain the wounded 1 condition, or increase your wounded value by 1 if you already have that condition.
  properties:
    category: "Playing the Game"
- id: "earning-income"
  name: "Earning Income"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode > Earning Income"
  description: |-
    The Earn Income skill action allows you to make money using a wide variety of skills. You can get creative with the skills you attempt to use, working with the GM on the details. Some skills might be much harder to earn money with than others. Crafting, Lore, and Performance are the most reliable. Jobs in a fantasy world tend not to be particularly stable, so you might need to look for new tasks on a fairly regular basis.
    The GM determines the levels of jobs you can find, as noted in the Earn Income activity. It's often in your best interest to determine what types of jobs are available for a small variety of skills, so you can take on the most lucrative or interesting option.
  properties:
    category: "Playing the Game"
- id: "effect"
  name: "Effect"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Effect"
  description: "A ritual's effect depends on the result of the primary check. If an effect lists a save DC, use your spell DC for the ritual's magic tradition (or 12 + your level + your highest mental attribute modifier, if you don't have a spell DC)."
  properties:
    category: "Spells"
- id: "effects"
  name: "Effects"
  source: "pc > Chapter 8: Playing the Game > Effects"
  description: |-
    Many spells, magic items, and feats create specific effects, and your character will be subject to effects caused by monsters, hazards, the environment, and other characters.
    Effects sometimes require checks, but not always. Casting a fly spell on yourself creates an effect that allows you to soar through the air, but casting the spell does not require a check. Conversely, using the Intimidation skill to Demoralize a foe does require a check, and your result on that check determines the effect's outcome.
    Duration
    Most effects are discrete, creating an instantaneous effect when you let the GM know what actions you are going to use. Firing a bow, moving to a new space, or taking something out of your pack all resolve instantly. Other effects instead last for a certain duration. Once the duration has elapsed, the effect ends. The rules generally use the following conventions for durations, though spells have some special durations.
    For an effect that lasts a number of rounds, the remaining duration decreases by 1 at the start of each turn of the creature that created the effect. Detrimental effects often last "until the end of the target's next turn" or "through" a number of their turns (such as "through the target's next 3 turns"), which means that the effect's duration decreases at the end of the creature's turn, rather than the start.
    Instead of lasting a fixed number of rounds, a duration might end only when certain conditions are met (or cease to be true). If so, the effects last until those conditions are met.
    Some effects can be ended early with the Dismiss action. An effect with the sustained duration lasts until the end of your next turn, but it can be extended as described in the Sustain action.
    Range and Reach
    Abilities that generate an effect typically work within a specified range or a reach. Most spells and abilities list a range—the maximum distance from the creature or object creating the effect in which the effect can occur.
    Ranged and thrown weapons have a range increment. Attacks with such weapons work normally up to that range. Attacks against targets beyond that range take a -2 penalty, which worsens by 2 for every additional multiple of that range, to a maximum of a -10 penalty after five additional range increments. Attacks beyond this range are not possible. For example, using a shortbow, your attacks take no penalty against a target up to 60 feet away, a -2 penalty if a target is over 60 and up to 120 feet away, a -4 if they're over 120 and up to 180 feet away, and so on, up to a maximum of 360 feet.
    Reach is how far you can physically reach with your body or a weapon. Melee Strikes rely on reach. Your reach is typically 5 feet, but weapons with the reach trait can extend this. Larger creatures can have greater reach; for instance, an ogre has a 10-foot reach. Unlike with measuring most distances, 10-foot reach can reach 2 squares diagonally. Reach greater than 10 feet is measured normally: 20-foot reach can reach 3 squares diagonally, 30-foot reach can reach 4, and so on.
    Targets
    Some effects require you to choose specific targets. Targeting can be difficult or impossible if your chosen creature is undetected by you, if the creature doesn't match restrictions on who you can target, or if some other ability prevents it from being targeted.
    Some effects require a target to be willing. Only you can decide whether your PC is willing, and the GM decides whether an NPC is willing. Even if you or your character don't know what the effect is, such as if your character is unconscious, you still decide if you're willing.
    Some effects target or require an ally, or otherwise refer to an ally. This must be someone on your side, often another PC, but it might be a bystander you are trying to protect. You don't count as your own ally. If it isn't clear, the GM decides who counts as an ally or an enemy.
    Areas
    Some effects occupy an area of a specified shape and size. An area effect always has a point of origin and extends out from that point. There are four types of areas: emanations, bursts, cones, and lines.
    Line of Effect
    When creating an effect, you usually need an unblocked path to the target of a spell, the origin point of an effect's area, or the place where you create something with a spell or other ability. This is called a line of effect. You have line of effect unless a creature is entirely behind a solid physical barrier. Visibility doesn't matter for line of effect, nor do portcullises and other barriers that aren't totally solid. Usually a 1-foot-square gap is enough to maintain a line of effect, though the GM makes the final call.
    In an area effect, creatures or targets must have line of effect to the point of origin to be affected. If there's no line of effect between the origin of the area and the target, the effect doesn't apply to that target. For example, if there's a solid wall between the origin of a fireball and a creature that's within the burst radius, the wall blocks the effect—that creature is unaffected by the fireball and doesn't need to attempt a save against it. Likewise, any ongoing effects created by an ability with an area cease to affect anyone who moves outside of the line of effect.
    Line of Sight
    Some effects require you to have line of sight to your target. As long as you can precisely sense the area and it is not blocked by a solid barrier, you have line of sight. An area of darkness prevents line of sight if you don't have darkvision, but portcullises and other obstacles that aren't totally solid do not. Usually a 1-foot-square gap is enough to maintain line of sight, though the GM makes the final call.
  properties:
    category: "Playing the Game"
- id: "elixirs"
  name: "Elixirs"
  source: "pc > Chapter 6: Equipment > Gear > Alchemical Gear > Elixirs"
  description: "Elixirs are alchemical items you drink with a single action that has the manipulate trait, gaining the listed benefit."
  properties:
    category: "Equipment"
- id: "emanation"
  name: "Emanation"
  source: "pc > Chapter 8: Playing the Game > Area > Emanation"
  description: "An emanation issues forth from each side of your space, extending out to a specified number of feet in all directions. For instance, the bless spell's emanation radiates 15 or more feet outward from the caster. Because the sides of a creature's space are the starting point for the emanation, an emanation from a Large or larger creature affects a greater overall area than that of a Medium or smaller creature. Unless the text states otherwise, the creature creating an emanation effect chooses whether the creature at its center is affected."
  properties:
    category: "Playing the Game"
- id: "equipment"
  name: "Equipment"
  source: "pc > Chapter 6: Equipment"
  description: |-
    Your character starts out with 15 gold pieces (150 silver pieces) to spend on any common items from this chapter. Items with an uncommon rarity can be purchased only if you have special access from abilities you selected during character creation or your GM gives you permission to purchase them.
    Once you've purchased your starting items, there are three main ways to gain new items and equipment: you can find them during an adventure, make them using the Crafting skill, or purchase them from a merchant.
  properties:
    category: "Equipment"
- id: "estimating-an-item-s-bulk"
  name: "Estimating an Item's Bulk"
  source: "pc > Chapter 6: Equipment > Bulk > Estimating an Item's Bulk"
  description: "Generally, an item that weighs 5 to 10 pounds is 1 Bulk, an item weighing less than a few ounces is negligible, and anything in between is light. Particularly unwieldy items might have higher Bulk values. For example, a 10-foot pole isn't heavy, but its length makes it awkward to manage, so its Bulk is 1. Items made for larger or smaller creatures have greater or lesser Bulk."
  properties:
    category: "Equipment"
- id: "exploration-activities"
  name: "Exploration Activities"
  source: "pc > Chapter 8: Playing the Game > Exploration Mode > Exploration Activities"
  description: |-
    While you're traveling and exploring, tell the GM what you'd generally like to do along the way. If you do nothing more than make steady progress toward your goal, you move at the full travel speeds given in the table.
    When you want to do something other than simply travel, you describe what you are attempting to do. It isn't necessary to go into extreme detail, such as "Using my dagger, I nudge the door so I can check for devious traps." Instead, "I'm searching the area for hazards" is sufficient. The GM finds the best exploration activity to match your description and describes the effects of that activity. Some exploration activities limit how fast you can travel and be effective.
    These are most common exploration activities.
  properties:
    category: "Playing the Game"
- id: "exploration-and-downtime-activities"
  name: "Exploration and Downtime Activities"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs > Exploration and Downtime Activities"
  description: |-
    Some skill activities have the exploration or downtime trait. Exploration activities usually take a minute or more, while downtime activities may take a day or more. They usually can't be used during an encounter, though the GM might bend this restriction. If you're not sure whether you have the time to use one of these activities,
    ask your GM.
  properties:
    category: "Skills"
- id: "exploration-mode"
  name: "Exploration Mode"
  source: "pc > Chapter 8: Playing the Game > Exploration Mode"
  description: "Much of exploration mode involves movement and roleplaying. You might be traveling from one town to another, chatting with a couple of merchants in an outpost along the way, or maybe having a terse conversation with the watchful city guards at your destination. Instead of measuring your rate of movement in 5-foot squares every round, you measure it in feet or miles per minute, hour, or day, using your travel speed. Rather than deciding on each action every turn, you'll engage in an exploration activity, and you'll typically spend some time every day resting and making your daily preparations."
  properties:
    category: "Playing the Game"
- id: "falling"
  name: "Falling"
  source: "pc > Chapter 8: Playing the Game > Movement > Falling"
  description: |-
    If you fall more than 5 feet, when you land you take bludgeoning damage equal to half the distance you fell. Treat falls longer than 1,500 feet as though they were 1,500 feet (750 damage). If you take any damage from a fall, you land prone. You fall about 500 feet in the first round of falling and about 1,500 feet each round thereafter.
    You can Grab an Edge as a reaction to reduce the damage from some falls, or Arrest a Fall if you have a fly Speed. In addition, if you fall into water, snow, or another relatively soft substance, you can treat the fall as though it were 20 feet shorter, or 30 feet shorter if you intentionally dove in. The effective reduction can't be greater than the depth (so when falling into 10-foot-deep water, you treat the fall as 10 feet shorter).
    Falling on a Creature
    If you land on a creature, that creature must attempt a DC 15 Reflex save. Intentionally aiming yourself to land on a creature after a long fall is almost impossible.
    **Critical Success.** The creature takes no damage.
    **Success.** The creature takes bludgeoning damage equal to one-quarter the falling damage you took.
    **Failure.** The creature takes bludgeoning damage equal to half the falling damage you took.
    **Critical Failure.** The creature takes the same amount of bludgeoning damage you took from the fall.
    Falling Objects
    A dropped object takes damage just like a falling creature. If the object lands on a creature, that creature can attempt a Reflex save using the same rules as for a creature falling on a creature. Hazards and spells that involve falling objects, such as a rock slide, have their own rules about how they interact with creatures and the damage they deal.
  properties:
    category: "Playing the Game"
- id: "familiar-abilities"
  name: "Familiar Abilities"
  source: "pc > Chapter 3: Classes > Familiars > Familiar Abilities"
  description: "Familiar abilities primarily affect the familiar itself. A familiar can have no more than one ability that changes its creature trait (such as construct or plant). You can choose a pet ability (from the Pet feat) as a familiar ability: amphibious, burrower, climber, darkvision, echolocation, fast movement, flier, manual dexterity, scent, or tough."
  properties:
    category: "Classes"
- id: "familiars"
  name: "Familiars"
  source: "pc > Chapter 3: Classes > Familiars"
  description: "Familiars are mystically bonded creatures tied to your magic. Most familiars were originally animals, though the ritual of becoming a familiar makes them something more. You gain the Pet general feat, except that your pet has special abilities. Common choices for familiars include bats, cats, foxes, ravens, and snakes. Some familiars are different, usually described in the ability that granted you a familiar; for example, a druid's leshy familiar has the plant or fungus trait instead of animal. You can replace a familiar or gain a new one as described in the Pet feat. A familiar is different from a basic pet in the following ways."
  properties:
    category: "Classes"
- id: "feats-that-grant-feats"
  name: "Feats that Grant Feats"
  source: "pc > Chapter 3: Classes > Archetypes > Feats that Grant Feats"
  description: "Sometimes an archetype feat lets you select another feat, such as a class feat of a lower level. You must always meet any prerequisites of the feat you gain in this way. These always count as only one feat for the purposes of your dedication; for example, taking the cleric archetype's Basic Dogma feat to gain the Healing Hands class feat counts as only one feat, not two."
  properties:
    category: "Classes"
- id: "flanking"
  name: "Flanking"
  source: "pc > Chapter 8: Playing the Game > Movement > Flanking"
  description: |-
    When you and an ally are flanking a foe, it has a harder time defending against you. A creature is off-guard (taking a -2 circumstance penalty to AC) to melee attacks from creatures that are flanking it.
    To flank a foe, you and your ally must be on opposite sides of the creature. A line drawn between the center of your space and the center of your ally's space must pass through opposite sides or opposite corners of the foe's space. Additionally, both you and the ally have to be able to act, you must be wielding melee weapons or be able to make an unarmed attack, you can't be under any effects that prevent you from attacking, and you must both have the enemy within reach. If you are wielding a reach weapon, you use your reach with that weapon for this purpose.
    3D Flanking
    Though battle grids are often flat, the game world isn't! Sometimes you might need to visualize a creature's space as a cube for flanking. For instance, if one creature is underneath a flying sphinx while an ally is flying above the sphinx, they might be flanking it even if they're piled in an odd stack on your battle grid. And if a creature were mounted on a horse, it might be able to measure from farther off the ground than normal.
    In these cases, it's usually best to have the GM make the call on who's flanking rather than trying to do meticulous measurements in three dimensions.
  properties:
    category: "Playing the Game"
- id: "flat-checks"
  name: "Flat Checks"
  source: "pc > Chapter 8: Playing the Game > Checks > Sidebars: Flat Checks & Secret Checks > Flat Checks"
  description: |-
    When the chance something will happen or fail to happen is based purely on chance, you'll attempt a flat check. A flat check never includes any modifiers, bonuses, or penalties—you just roll a d20 and compare the result on the die to the DC. Only abilities that specifically apply to flat checks can change the checks' DCs; most such effects affect only certain types of flat checks.
    If more than one flat check would ever cause or prevent the same thing, just roll once and use the highest DC. In the rare circumstance that a flat check has a DC of 1 or lower, skip rolling; you automatically succeed. Conversely, if one ever has a DC of 21 or higher, you automatically fail.
  properties:
    category: "Playing the Game"
- id: "focus-points-from-multiple-sources"
  name: "Focus Points from Multiple Sources"
  source: "pc > Chapter 7: Spells > Focus Spells > Focus Points from Multiple Sources"
  description: "It's possible, especially through archetypes, to gain focus spells from more than one source. If this happens, you have just one focus pool, counting all your focus spells to determine the points in your pool. You can spend any of your Focus Points on any of your focus spells. Likewise, when you Refocus, you get back a point as long as you follow the guidelines of any abilities that granted you focus spells. Having Focus Points from multiple sources doesn't change the tradition of your spells; if you had both cleric domain spells and druid order spells, your domain spells would remain divine and the order spells primal. Similarly, you need to use the attribute modifier determined by the source of the focus spell."
  properties:
    category: "Spells"
- id: "focus-spells"
  name: "Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells"
  description: |-
    Focus spells are a special type of spell attained directly from a branch of study, from a deity, or from another specific source. You can learn focus spells only through special class features or feats, rather than choosing them from a spell list. Furthermore, you cast focus spells using a special pool of Focus Points—you can't prepare a focus spell in a spell slot or use your spell slots to cast focus spells; similarly, you can't spend your Focus Points to cast spells that aren't focus spells. Even some classes that don't normally grant spellcasting can grant focus spells, such as the ranger. The title of a focus spell's stat block says "Focus" instead of "Spell", and the spell has the focus trait.
    Focus spells are automatically heightened to half your level rounded up, just like cantrips are. You can't cast a focus spell if its minimum rank is greater than half your level rounded up, even if you somehow gain access to it.
    Casting any of your focus spells costs you 1 Focus Point. You automatically gain a focus pool the first time you gain an ability that gives you a focus spell. The maximum number of points in your pool is equal to the number of focus spells you know or 3, whichever is lower. This counts only spells that require Focus Points to cast. For example, a bard's composition cantrips don't count toward the size of the pool.
    You replenish all the Focus Points in your pool during your daily preparations. You can also use the Refocus activity to pray, study, meditate, or otherwise reattune yourself to the source of your focus magic and regain 1 Focus Point. You can Refocus multiple times to regain multiple points, up to your pool's maximum.
    Refocus
    CONCENTRATE EXPLORATION
    **Requirements.** You have a focus pool.
    You spend 10 minutes performing deeds to restore your magical connection. This restores 1 Focus Point to your focus pool. The deeds you need to perform are specified in the class or ability that gives you your focus spells. These deeds can usually overlap with other tasks that relate to the source of your focus spells. For instance, a cleric with focus spells from a holy deity can usually Refocus while tending the wounds of their allies.
  properties:
    category: "Spells"
- id: "format"
  name: "Format"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Format"
  description: |-
    Whether appearing in a spell, as an item, or within a creature's stat block, afflictions appear in the following format.
    Name and Traits
    The affliction's name is given first, followed by its traits in parentheses—including the trait for the type of affliction (curse, disease, poison, and so forth). If the affliction needs to have a level specified, it follows the parentheses, followed by any unusual details, such as restrictions on removing the conditions imposed by an affliction. If no level is listed, the affliction matches the level of the creature, hazard, or item causing the affliction.
    Saving Throw
    When you're first exposed to the affliction, you must attempt a saving throw against it. This first attempt to stave off the affliction is called the initial save. An affliction usually requires a Fortitude save, but the exact save and its DC are listed after the name and type of affliction.
    Spells that can cause an affliction typically use the caster's spell DC.
    On a successful initial saving throw, you are unaffected by that exposure to the affliction. You don't need to attempt further saving throws against it unless you are exposed to the affliction again.
    If you fail the initial saving throw, you advance to stage 1 of the affliction and are subjected to the listed effect. On a critical failure, after its onset period (if applicable), you advance to stage 2 of the affliction and are subjected to that effect instead.
    Onset
    Some afflictions have onset times. For these afflictions, once you fail your initial save, you don't gain the effects for the first stage of the affliction until the onset time has elapsed. If this entry is absent, you gain the effects for the first stage (or the second stage on a critical failure) immediately upon failing the initial saving throw.
    Maximum Duration
    If an affliction lasts only a limited amount of time, it lists a maximum duration. Once this duration passes, the affliction ends. Otherwise, it lasts until you succeed at enough saves to recover, as described in Stages below.
    Stages
    An affliction typically has multiple stages, each of which lists an effect followed by an interval in parentheses. When you reach a given stage of an affliction, you are subjected to the effects listed for that stage.
    At the end of a stage's listed interval, you must attempt a new saving throw. On a success, you reduce the stage by 1; on a critical success, you reduce the stage by 2. You are then subjected to the effects of the new stage. If the affliction's stage is ever reduced below stage 1, the affliction ends and you don't need to attempt further saves unless you're exposed to the affliction again.
    On a failure, the stage increases by 1; on a critical failure, the stage increases by 2. You are then subjected to the effects listed for the new stage. If a failure or critical failure would increase the stage beyond the highest listed stage, the affliction instead repeats the effects of the highest stage.
  properties:
    category: "Playing the Game"
- id: "formulas"
  name: "Formulas"
  source: "pc > Chapter 6: Equipment > Gear > Formulas"
  description: |-
    Formulas are formalized instructions for making items. Their primary purpose is to reduce the time it takes you to start the Craft activity, which is helpful for items you'll make frequently. You can usually read a formula as long as you can read the language it's written in, even if you lack the skill to Craft the item. Often, alchemists and crafting guilds use obscure languages or create codes to protect their formulas. If you obtain a formula for an uncommon or rarer item, you have access to that item so you can Craft it. These formulas can be significantly more valuable—if you can find them at all!
    For the Price listed on the table, you can buy a common formula or pay an NPC to let you copy their formula. A purchased formula is typically a schematic on rolled-up parchment of light Bulk. You can copy a formula into your formula book in 1 hour.
    If you have a formula, you can Craft a copy of it using the Crafting skill. You can also Craft a formula by reverse-engineering it from an item you possess. Use the formula's Price and the item's Craft DC. You must meet any requirements to Craft the item, except you don't need to have access to the item or meet any special Craft Requirements listed in the item's stat block unless the GM determines otherwise.
    Formulas
    Item Level Formula Price Item Level Formula Price
    0* 5 sp 11 70 gp
    1 1 gp 12 100 gp
    2 2 gp 13 150 gp
    3 3 gp 14 225 gp
    4 5 gp 15 325 gp
    5 8 gp 16 500 gp
    6 13 gp 17 750 gp
    7 18 gp 18 1,200 gp
    8 25 gp 19 2,000 gp
    9 35 gp 20 3,500 gp
    10 50 gp
    * Formulas for all 0-level common items from this chapter
    can be purchased collectively in a basic crafter's book.
  properties:
    category: "Equipment"
- id: "fortune-and-misfortune"
  name: "Fortune and Misfortune"
  source: "pc > Chapter 8: Playing the Game > Checks > Step 4: Degree of Success > Sidebar: Fortune and Misfortune"
  description: |-
    Fortune and misfortune effects can alter how you roll your dice. These abilities might allow you to reroll a failed roll, force you to reroll a successful roll, allow you to roll twice and use the higher result, or force you to roll twice and use the lower result.
    You can never have more than one fortune effect or misfortune effect come into play on a single roll. For instance, if an effect lets you roll twice and use the higher roll, you can't then use Halfling Luck (a fortune effect) to reroll if you fail. If multiple fortune effects would apply, you have to pick which to use. If two misfortune effects apply, the GM decides which is worse and applies it.
    If both a fortune effect and a misfortune effect would apply to the same roll, the two cancel each other out, and you roll normally.
  properties:
    category: "Playing the Game"
- id: "gaining-and-losing-actions"
  name: "Gaining and Losing Actions"
  source: "pc > Chapter 8: Playing the Game > Actions > Gaining and Losing Actions"
  description: |-
    Effects can change the number of actions you can use on your turn, or whether you can use actions at all. The slowed condition, for example, causes you to lose actions, while the quickened condition causes you to gain them. Whenever you lose a number of actions—whether from these conditions or in any other way—you choose which to lose if there's any difference between them. For instance, the haste spell makes you quickened, but it limits what you can use your extra action to do. If you lost an action while haste was active, you might want to lose the action from haste first, since it's more limited than your normal actions.
    Some effects are even more restrictive. Certain abilities, instead of or in addition to changing the number of actions you can use, say specifically that you can't use reactions. The most restrictive form of reducing actions is when an effect states that you can't act: this means you can't use any actions, or even speak. When you can't act, you still regain your actions unless another effect (like the stunned condition) prevents it.
  properties:
    category: "Playing the Game"
- id: "game-conventions"
  name: "Game Conventions"
  source: "pc > Chapter 8: Playing the Game > Rules Overview > Sidebar: Game Conventions"
  description: |-
    Keep these general guidelines in mind when playing.
    The GM Has the Final Say
    If you're ever uncertain how to apply a rule, the GM decides. Of course, this is a game, so when adjudicating the rules, the GM is encouraged to listen to everyone's point of view and make a decision that is both fair and fun.
    Specific Overrides General
    A core principle of the game is that specific rules override general ones. If two rules conflict, the more specific one takes precedence. If there's still ambiguity, the GM determines which rule to use. For example, the rules state that when attacking a concealed creature, you must attempt a DC 5 flat check to determine if you hit. Flat checks don't benefit from modifiers, bonuses, or penalties, but an ability that's specifically designed to overcome concealment might override and alter this. While some special rules may also state the normal rules to provide context, you should always default to the general rules, even if effects don't specifically say to.
    Rounding
    You may need to calculate a fraction of a value, like halving damage. Always round down unless otherwise specified. For example, if a spell deals 7 damage and a creature takes half damage from it, that creature takes 3 damage.
    Multiplying
    When more than one effect would multiply the same number, don't multiply more than once. Instead, combine all the multipliers into a single multiplier, with each multiple after the first adding 1 less than its value. For instance, if one ability doubled the duration of one of your spells and another one doubled the duration of the same spell, you would triple the duration, not quadruple it.
    Duplicate Effects
    When you're affected by the same thing multiple times, only one instance applies, using the higher level or rank of the effects, or the newer effect if the two are equal. For example, if you were using mystic armor and then cast it again, you'd still benefit from only one casting of that spell. Casting a spell again on the same target might get you a better duration or effect if it were cast at a higher rank the second time, but otherwise doing so gives you no advantage.
    Ambiguous Rules
    Sometimes a rule could be interpreted multiple ways. If one version is too good to be true, it probably is. If a rule seems to have wording with problematic repercussions or doesn't work as intended, work with your group to find a good solution, rather than just playing with the rule as printed.
  properties:
    category: "Playing the Game"
- id: "gear-statistics"
  name: "Gear Statistics"
  source: "pc > Chapter 6: Equipment > Gear > Gear Statistics"
  description: "The gear table lists Price and Bulk entries for a wide variety of gear. Any item with a number after it in parentheses indicates that the item's Price is for the indicated quantity, though the Bulk entry for such an item is the value for only one such item. All items in this chapter are level 0 unless the item name is followed by a higher item level in parentheses."
  properties:
    category: "Equipment"
- id: "getting-knocked-out"
  name: "Getting Knocked Out"
  source: "pc > Chapter 8: Playing the Game > Hit Points, Healing, and Dying > Getting Knocked Out"
  description: |-
    Creatures can't be reduced to fewer than 0 Hit Points. When most creatures reach 0 Hit Points, they die and are removed from play unless the attack was nonlethal, in which case they're instead knocked out for a significant amount of time (usually 10 minutes or more). When undead and constructs reach 0 Hit Points, they're destroyed.
    Player characters, their companions, and other significant characters and creatures don't automatically die when they reach 0 Hit Points. Instead, they are knocked out and are at risk of death. The GM might determine that villains, powerful monsters, special NPCs, and enemies with special abilities that are likely to bring them back to the fight (like ferocity, regeneration, or healing magic) can use these rules as well.
    As a player character, when you're reduced to 0 Hit Points, you're knocked out with the following effects:
    • Move your initiative position to directly before the turn in which you were reduced to 0 HP.
    • Gain the dying 1 condition. If the effect that knocked you out was a critical success from the attacker or the result of your critical failure, you gain the dying 2 condition instead. If you have the wounded condition, increase your dying value by an amount equal to your wounded value. If the damage was dealt by a nonlethal attack or nonlethal effect, you don't gain the dying condition; you're instead unconscious with 0 Hit Points.
  properties:
    category: "Playing the Game"
- id: "hands"
  name: "Hands"
  source: "pc > Chapter 6: Equipment > Gear > Gear Statistics > Hands"
  description: "This lists how many hands it takes to use the item effectively. Most items that require two hands can be carried in only one hand, but you must spend an Interact action to change your grip in order to use the item. The GM may determine that an item is too big to carry in one hand (or even two hands, for particularly large items)."
  properties:
    category: "Equipment"
- id: "heightened-spells"
  name: "Heightened Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Heightened Spells"
  description: |-
    Both prepared and spontaneous spellcasters can cast a spell at a higher spell rank than that listed for the spell. This is called heightening the spell. A prepared spellcaster can heighten a spell by preparing it in a higher-rank slot than its normal spell rank, while a spontaneous spellcaster can heighten a spell by casting it using a higher-rank spell slot, so long as they know the spell at that rank (see Heightened Spontaneous Spells below). When you heighten your spell, the spell's rank increases to match the higher rank of the spell slot you've prepared it in or used to cast it. This is useful for any spell, because some effects, such as counteracting, depend on the spell's rank.
    In addition, many spells have additional specific benefits when they are heightened, such as increased damage. These extra benefits are described at the end of the spell's stat block. Some heightened entries specify one or more ranks at which the spell must be prepared or cast to gain these extra advantages. Each of these heightened entries states specifically which aspects of the spell change at the given rank. Read the heightened entry only for the spell rank you're using or preparing; if its benefits are meant to include any of the effects of a lower-rank heightened entry, those benefits will be included in the entry.
    Other heightened entries give a number after a plus sign, indicating that heightening grants extra advantages over multiple ranks. The listed effect applies for every increment of ranks by which the spell is heightened above its lowest spell rank, and the benefit is cumulative. For example, fireball says "Heightened (+1) The damage increases by 2d6." Because fireball deals 6d6 fire damage at 3rd rank, a 4th-rank fireball would deal 8d6 fire damage, a 5th-rank spell would deal 10d6 fire damage, and so on.
    Heightened Spontaneous Spells
    If you're a spontaneous spellcaster, you must know a spell at the specific rank that you want to cast it in order to heighten it. You can add a spell to your spell repertoire at more than a single rank so that you have more options when casting it. For example, if you added fireball to your repertoire as a 3rd-rank spell and again as a 5th-rank spell, you could cast it as a 3rd-rank or a 5th-rank spell; however, you couldn't cast it as a 4th-rank spell.
    Many spontaneous spellcasting classes provide abilities like the signature spells class feature, which allows you to cast a limited number of spells as heightened versions even if you know the spell at only a single rank.
    As a spontaneous caster, you can also choose to cast a lower-rank spell using a higher-rank spell slot without heightening it or knowing it at a higher rank. This casts the spell at the rank you know the spell, not the rank of the higher slot. The spell doesn't have any heightened effects, so it's usually not a very efficient use of your magic outside of highly specific circumstances. For instance, if your party was having trouble with an invisible enemy, and you had revealing light in your repertoire but had already spent all of your 2nd-rank spell slots, it might be worth it to use a 3rd-rank spell slot to cast the spell, even though it'd have no heightened benefit.
  properties:
    category: "Spells"
- id: "heritage-limits"
  name: "Heritage Limits"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Unlimited Possibilities!"
  description: "Though a character can have only one heritage and one lineage feat, the possible permutations of a character's background and family tree are virtually unlimited. A half-elf character might still have a changeling parent whose nature is visible in the coloration of their eyes even if they don't have access to changeling ancestry feats, and a dwarf with demon blood might very well have an ancestor with fey influences on their bloodline, reflected with a fey muse or patron gained through their class alongside their ancestral fiendishness."
  properties:
    category: "Ancestries"
- id: "hero-points"
  name: "Hero Points"
  source: "pc > Chapter 8: Playing the Game > Hero Points"
  description: |-
    The GM is in charge of awarding Hero Points. Usually, each character gets 1 Hero Point at the start of a session and can gain more later by performing heroic deeds—something selfless, daring, or beyond normal expectations. You can have a maximum of 3 Hero Points at a time, and you lose any remaining Hero Points at the end of a session.
    You can spend your Hero Points in one of two ways. Neither of these is an action, and you can spend Hero Points even if you aren't able to act. You can spend a Hero Point on behalf of your familiar or animal companion.
    • Spend 1 Hero Point to reroll a check. You must use the second result. This is a fortune effect (which means you can't use more than 1 Hero Point on a check).
    • Spend all your Hero Points (minimum 1) to avoid death. You can do this when your dying condition would increase. You lose the dying condition entirely and stabilize with 0 Hit Points. You don't gain the wounded condition or increase its value from losing the dying condition in this way, but if you already had that condition, you don't lose it or decrease its value.
  properties:
    category: "Playing the Game"
- id: "hit-points"
  name: "Hit Points"
  source: "pc > Chapter 3: Classes > Reading Class Entries > Hit Points"
  description: |-
    This section tells you how many Hit Points your character gains from their class at each level. To determine your character's starting Hit Points, add together the Hit Points they got when you chose their ancestry and the amount listed in this entry, which equals your Constitution modifier plus a fixed number. Classes that intend for characters to rush into battle with weapons bared gain a higher number of Hit Points each level, while those for characters who cast spells or engage in trickery gain fewer.
    Each time your character gains a level, they increase their maximum Hit Points by the amount listed in this entry.
  properties:
    category: "Classes"
- id: "hit-points-and-healing"
  name: "Hit Points and Healing"
  source: "pc > Chapter 8: Playing the Game > Hit Points, Healing, and Dying > Hit Points"
  description: |-
    All creatures and objects have Hit Points (HP). Your maximum Hit Point value represents your health, wherewithal, and heroic drive when you're in good health and rested. Your maximum Hit Points include the Hit Points you gain at 1st level from your ancestry and class, those you gain at higher levels from your class, and any you gain from other sources (like the Toughness general feat). When you take damage, you reduce your current Hit Points by a number equal to the damage dealt.
    Some spells, items, and other effects, as well as simply resting, can heal creatures. When you're healed, you regain Hit Points equal to the amount healed, up to your maximum Hit Points.
    Temporary Hit Points
    Some spells or abilities give you temporary Hit Points. Track these separately from your current and maximum Hit Points; when you take damage, reduce your temporary Hit Points first. Most temporary Hit Points last for a limited duration. You can't regain lost temporary Hit Points through healing, but you can gain more via other abilities. You can have temporary Hit Points from only one source at a time. If you gain temporary Hit Points when you already have some, choose whether to keep the amount you already have and their corresponding duration or to gain the new temporary Hit Points and their duration.
    Fast Healing and Regeneration
    A creature with fast healing or regeneration regains the listed amount of Hit Points each round at the beginning of its turn. A creature with regeneration has additional benefits. Its dying condition can't increase to a value that would kill it (this stops most creatures from going beyond dying 3) as long as its regeneration is active. If it takes damage of a type listed in the regeneration entry, its regeneration deactivates until the end of its next turn.
    Items and Hit Points
    Items have Hit Points like creatures, but the rules for damaging them are different. An item has a Hardness statistic that reduces damage the item takes by that amount. The item then takes any damage left over. If an item is reduced to 0 HP, it's destroyed. An item also has a Broken Threshold. If its HP are reduced to this amount or lower, it's broken, meaning it can't be used for its normal function and it doesn't grant bonuses. You usually can't attack an attended object (one on a creature's person).
  properties:
    category: "Playing the Game"
- id: "hostile-actions"
  name: "Hostile Actions"
  source: "pc > Chapter 7: Spells > Hostile Actions"
  description: "Sometimes spells prevent a target from using hostile actions, or the spell ends if a creature uses any hostile actions. A hostile action is one that can harm or damage another creature, whether directly or indirectly, but not one that a creature is unaware could cause harm. For instance, casting fireball into a crowd would be a hostile action, but opening a door and accidentally freeing a horrible monster wouldn't be. The GM is the final arbitrator of what is a hostile action."
  properties:
    category: "Spells"
- id: "how-checks-work"
  name: "How Checks Work"
  source: "pc > Chapter 8: Playing the Game > Checks"
  description: |-
    All types of checks, from skill checks to attack rolls to saving throws, follow these basic steps.
    1. Roll a d20 and identify the modifiers, bonuses, and penalties that apply.
    2. Calculate the result.
    3. Compare to the DC.
    4. Determine the degree of success and the effect.
    Checks and Difficulty Classes (DC) both come in many forms. When you swing your sword at that foul beast, you make an attack roll against its Armor Class, which is the DC to hit another creature. As you try to leap across that chasm, you'll attempt an Athletics skill check with a DC based on the distance you're trying to jump. When calling to mind the name of the earl's second cousin, you attempt a check to Recall Knowledge. You might use either the Society skill or a Lore skill you have that's relevant to the task, and the DC depends on how common the knowledge of the cousin's name might be, or possibly how many drinks your character had when they were introduced to the cousin the night before.
    No matter the details, for any check you must roll the d20 and achieve a result equal to or greater than the DC to succeed. Each of these steps is explained below.
  properties:
    category: "Playing the Game"
- id: "how-damage-works"
  name: "How Damage Works"
  source: "pc > Chapter 8: Playing the Game > Damage Rolls"
  description: |-
    Damage decreases a creature's Hit Points (HP) on a 1-to- 1 basis (so a creature that takes 6 damage loses 6 Hit Points).
    Damage is sometimes given as a fixed amount, but more often than not you'll make a damage roll to determine how much damage you deal. A damage roll typically uses a number and type of dice determined by the weapon or unarmed attack used or the spell cast, and it's often enhanced by various modifiers, bonuses, and penalties. Like checks, a damage roll—especially a melee weapon damage roll—is often modified by a number of modifiers, penalties, and bonuses. When making a damage roll, you take the following steps, explained in detail below.
    1. Roll damage dice indicated by the weapon, unarmed attack, or spell, and apply the modifiers, bonuses, and penalties that apply to the result of the roll.
    2. Determine the damage type.
    3. Apply immunities, weaknesses, and resistances the subject has to the damage.
    4. If any damage remains, reduce Hit Points the target has by that amount.
  properties:
    category: "Playing the Game"
- id: "identifying-spells"
  name: "Identifying Spells"
  source: "pc > Chapter 7: Spells > Identifying Spells"
  description: |-
    Sometimes you need to identify a spell, especially if its effects aren't obvious right away. If you notice a spell being cast, and you have that spell in your repertoire or prepared it that day (even if you already cast it), you automatically know what the spell is, including the rank to which it is heightened.
    If you want to identify a spell but don't have it prepared or in your repertoire, you must spend an action on your turn attempting to identify it using Recall Knowledge. You typically notice a spell being cast due to its sensory spell manifestations. Identifying long-lasting spells that are already in place requires using Identify Magic instead of Recall Knowledge because you don't have the advantage of watching the spell being cast.
  properties:
    category: "Spells"
- id: "immunity"
  name: "Immunity"
  source: "pc > Chapter 8: Playing the Game > Immunity, Weakness, and Resistance > Immunity"
  description: |-
    When you have immunity to a specific type of damage, you ignore all damage of that type. If you have immunity to a specific condition or type of effect, you can't be affected by that condition or any effect of that type. You can still be targeted by an ability that includes an effect or condition you are immune to; you just don't apply that particular effect or condition.
    If you have immunity to effects with a certain trait (such as death effects, poison, or disease), you are unaffected by effects with that trait. Often, an effect both has a trait and deals that type of damage (such as a lightning bolt spell). In these cases, the immunity applies to the effect corresponding to the trait, not just the damage. However, some complex effects might have parts that affect you even if you're immune to one of the effect's traits; for instance, a spell that deals both fire and acid damage can still deal acid damage to you even if you're immune to fire.
    Immunity to Critical Hits
    Immunity to critical hits works a little differently. When a creature immune to critical hits is critically hit by a Strike or other attack that deals damage, it takes normal damage instead of double damage. This does not make it immune to any other critical success effects of the actions, such as a critical specialization effect or the extra damage of the deadly trait. However, in some cases the GM might determine the added effects don't apply.
    Immunity to Nonlethal
    Another exception is immunity to the nonlethal trait. If you're immune to nonlethal, you're immune to all damage from attacks and effects with the nonlethal trait, no matter what other type the damage has. For instance, a typical construct has immunity to nonlethal attacks. No matter how hard you hit it with your fist, you're not going to damage it. However, you can take a penalty to remove the nonlethal trait from your fist, and some abilities give you unarmed attacks without the nonlethal trait.
    Temporary Immunity
    Some effects grant you immunity to the same effect for a set amount of time. If an effect grants you temporary immunity, repeated uses of that effect don't affect you for as long as the temporary immunity lasts. Unless the effect says it applies only to a certain creature's ability, it doesn't matter who created the effect. For example, the blindness spell says, "The target is temporarily immune to blindness for 1 minute." If anyone casts blindness on that creature again before 1 minute passes, the spell has no effect.
    Temporary immunity doesn't prevent or end ongoing effects of the source of the temporary immunity. For instance, if an ability makes you frightened and you then gain temporary immunity to the ability, you don't immediately lose the frightened condition due to the immunity you just gained—you simply don't become frightened if you're targeted by the ability again before the immunity ends.
  properties:
    category: "Playing the Game"
- id: "improvised-weapons"
  name: "Improvised Weapons"
  source: "pc > Chapter 6: Equipment > Weapons > Improvised Weapons"
  description: "If you attack with something that wasn't built to be a weapon, such as a chair or a vase, you're making an attack with an improvised weapon. Improvised weapons are simple weapons. You take a -2 item penalty to attack rolls with an improvised weapon. The GM determines the amount and type of damage the attack deals, if any, as well as any weapon traits that the improvised weapon should have."
  properties:
    category: "Equipment"
- id: "in-depth-action-rules"
  name: "In-Depth Action Rules"
  source: "pc > Chapter 8: Playing the Game > Actions > Sidebar: In-Depth Action Rules"
  description: |-
    These rules clarify some of the specifics of using actions.
    Simultaneous Actions
    You can use only one single action, activity, or free action that doesn't have a trigger at a time. You must complete one before beginning another. For example, the Sudden Charge activity states you must Stride twice and then Strike, so you couldn't use an Interact action to open a door in the middle of the movement, nor could you perform part of the move, make your attack, and then finish the move.
    Free actions with triggers and reactions work differently. You can use these whenever the trigger occurs, even if the trigger occurs in the middle of another action.
    Subordinate Actions
    An action might allow you to use a simpler action—usually one of the basic actions—in a different circumstance or with different effects. This subordinate action still has its normal traits and effects, but it's modified in any ways listed in the larger action. For example, an activity that tells you to Stride up to half your Speed alters the normal distance you can move in a Stride. The Stride would still have the move trait, would still trigger reactions that occur based on movement, and so on. The subordinate action doesn't gain any of the traits of the larger action unless specified. The action that allows you to use a subordinate action doesn't require you to spend more actions or reactions to do so; that cost is already factored in.
    Using an activity is not the same as using any of its subordinate actions. For example, the quickened condition you get from the haste spell lets you spend an extra action each turn to Stride or Strike, but you couldn't use the extra action for an activity that includes a Stride or Strike. As another example, if you used an action that specified, "If the next action you use is a Strike," an activity that includes a Strike wouldn't count, because the next thing you are doing is starting an activity, not using the Strike basic action.
  properties:
    category: "Playing the Game"
- id: "income-earned"
  name: "Income Earned"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
