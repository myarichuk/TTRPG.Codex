- id: "bulk"
  name: "Bulk"
  source: "pc > Chapter 6: Equipment > Bulk"
  description: "Carrying especially heavy or unwieldy items can make it more difficult for you to move, as can overloading yourself with too much gear. The Bulk value of an item reflects how difficult the item is to handle, representing its size, weight, and general awkwardness. If you have a high Strength modifier, you usually don't need to worry about Bulk unless you're carrying numerous substantial items."
  properties:
    category: "Equipment"
- id: "bulk-conversions-for-different-sizes"
  name: "Bulk Conversions for Different Sizes"
  source: "pc > Chapter 6: Equipment > Items and Sizes > Bulk Conversions for Different Sizes"
  description: |-
    As shown in the Bulk Conversions table, Large or larger creatures are less encumbered by bulky items than Small or Medium creatures, while Tiny creatures become overburdened more quickly. A Large creature treats 10 items of 1 Bulk as 1 Bulk, a Huge creature treats 10 items of 2 Bulk as 1 Bulk, and so on. A Tiny creature treats 10 items of negligible Bulk as 1 Bulk. Negligible items work in a similar way—a Huge creature treats items of 1 Bulk as negligible, so it can carry any number of items of 1 Bulk. A Tiny creature doesn't treat any items as having negligible Bulk.
    Bulk Conversions
    Creature Bulk Treats Treats as
    Size Limit as Light Negligible
    Tiny Half — none
    Small or Med. Standard L —
    Large x2 1 Bulk L
    Huge x4 2 Bulk 1 Bulk
    Gargantuan x8 4 Bulk 2 Bulk
  properties:
    category: "Equipment"
- id: "bulk-limits"
  name: "Bulk Limits"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk Limits"
  description: |-
    You can carry an amount of Bulk equal to 5 plus your Strength modifier without penalty; if you carry more, you gain the encumbered condition. You can't hold or carry more Bulk than 10 plus your Strength modifier.
    Encumbered
    You are carrying more weight than you can manage. While you're encumbered, you're clumsy 1 and take a -10-foot penalty to all your Speeds. As with all penalties to your Speed, this can't reduce your Speed below 5 feet.
  properties:
    category: "Equipment"
- id: "bulk-of-coins"
  name: "Bulk of Coins"
  source: "pc > Chapter 6: Equipment > Bulk > Bulk of Coins"
  description: "Coins are a popular means of exchange due to their portability, but they can still add up. A thousand coins of any denomination or combination of denominations count as 1 Bulk. It's not usually necessary to determine the Bulk of coins in fractions of 1,000; simply round down fractions of 1,000. In other words, 100 coins don't count as a light item, and 1,999 coins are 1 Bulk, not 2."
  properties:
    category: "Equipment"
