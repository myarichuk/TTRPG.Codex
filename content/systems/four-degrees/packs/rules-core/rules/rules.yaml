- id: "innate-spells"
  name: "Innate Spells"
  source: "pc > Chapter 7: Spells > Innate Spells"
  description: |-
    Certain spells are natural to your character, typically coming from your ancestry or a magic item. They're called innate spells. Innate spells don't let you qualify for abilities that require you to be a spellcaster—those require you to have spell slots. The ability that gives you an innate spell tells you how often you can cast it—usually once per day—and its magical tradition. Innate spells are refreshed during your daily preparations. Innate cantrips are cast at will and automatically heightened as normal for cantrips unless otherwise specified.
    When you gain an innate spell, you become trained in the spell attack modifier and spell DC statistics. At 12th level, these proficiencies increase to expert. Unless noted otherwise, Charisma is your spellcasting attribute modifier for innate spells.
    If you have an innate spell, you can cast it even if it's not of a spell rank you can normally cast. This is especially common for monsters.
    You can't use your spell slots to cast your innate spells, but you might have an innate spell and also be able to prepare or cast the same spell through your class. You also can't heighten innate spells, but some abilities that grant innate spells might give you the spell at a higher rank than its base rank or change the rank at which you cast the spell.
  properties:
    category: "Spells"
- id: "intimidation"
  name: "Intimidation"
  source: "pc > Chapter 4: Skills > Skills > Intimidation"
  description: "You bend others to your will using threats. Unlike Deception or Diplomacy, Intimidation is typically a blunt instrument with little room for nuance or care."
  properties:
    category: "Skills"
- id: "key-attribute"
  name: "Key Attribute"
  source: "pc > Chapter 4: Skills > Key Attribute"
  description: "Each skill is tied to a key attribute. You add your modifier for this attribute to checks and DCs when using that skill. For example, skulking about the shadows of a city at night with Stealth uses your Dexterity modifier, navigating the myriad personalities and power plays of court politics with Society uses your Intelligence modifier, and so on. If the GM deems it appropriate for a certain situation, however, they might have you use a different attribute modifier for a skill check or when determining your skill DC."
  properties:
    category: "Skills"
- id: "learned-spells"
  name: "Learned Spells"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: "A spell you learn is added to your repository of spells, such as a spellbook for a wizard, familiar for a witch, or spell list for a cleric or druid. If you have a spell repertoire, such as a bard, it's not automatically added since you can only know a limited number of spells. Instead, you can select it when you add or swap spells."
  properties:
    category: "Skills"
- id: "line-of-effect"
  name: "Line of Effect"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Line of Effect"
  description: "You usually need an unobstructed path to the target of a spell, the origin point of an area, or the place where you create something with a spell."
  properties:
    category: "Spells"
- id: "long-casting-times"
  name: "Long Casting Times"
  source: "pc > Chapter 7: Spells > Casting Spells > Long Casting Times"
  description: "Some spells take minutes or hours to cast. You can't use other actions or reactions while casting such a spell, though at the GM's discretion, you might be able to speak a few sentences. As with other activities that take a long time, these spells have the exploration trait, and you can't cast them in an encounter. If combat breaks out while you're casting one, your spell is disrupted (see Disrupted and Lost Spells below)."
  properties:
    category: "Spells"
- id: "long-durations"
  name: "Long Durations"
  source: "pc > Chapter 7: Spells > Durations > Long Durations"
  description: "If a spell's duration says it lasts until your next daily preparations, on the next day you can refrain from preparing a new spell in that spell's slot. (If you are a spontaneous caster, you can instead expend a spell slot during your preparations.) Doing so extends the spell's duration until your next daily preparations. This effectively Sustains the spell over a long period of time. If you prepare a new spell in the slot (or don't expend a spell slot), the spell ends. You can't do this if the spell didn't come from one of your spell slots. If you are dead or otherwise incapacitated at the 24-hour mark after the time you Cast the Spell or the last time you extended its duration, the spell ends. Spells with an unlimited duration last until counteracted or Dismissed. You don't need to keep a spell slot open for these spells."
  properties:
    category: "Spells"
- id: "lore"
  name: "Lore"
  source: "pc > Chapter 4: Skills > Skills > Lore"
  description: |-
    You have specialized information on a narrow topic. Lore features many subcategories. You might have a Lore skill for any similar narrow subcategory of the skill. Each subcategory counts as its own skill, so applying a skill increase to one Lore subcategory wouldn't increase your proficiency with another, for example.
    Most backgrounds make you trained in a specific subcategory of the Lore skill. The GM determines what other subcategories they'll allow as Lore skills, though these categories are always less broad than any of the other skills that allow you to Recall Knowledge, and they should never be able to take the place of another skill's Recall Knowledge action. For instance, you couldn't choose a Lore so broad that it covers the knowledge spread across several other skills.
    If you're making a check and multiple subcategories of Lore could apply, or a non-Lore skill could apply, you can use whichever skill you prefer. If there's any doubt whether a Lore skill applies to a specific topic or action, the GM decides whether it can be used or not.
    Even if you're untrained in Lore, you can use it to Recall Knowledge.
    • Recall Knowledge about the subject of the Lore skill's subcategory.
    You must be trained in Lore to use it to Earn Income.
    • Earn Income by using your knowledge to practice a trade.
  properties:
    category: "Skills"
- id: "medicine"
  name: "Medicine"
  source: "pc > Chapter 4: Skills > Skills > Medicine"
  description: |-
    You can patch up wounds and help people recover from diseases and poisons. Treat Wounds is especially useful, allowing your adventuring party to heal up between fights. It can be made more efficient with skill feats like Continual Recovery and Ward Medic.
    Even if you're untrained in Medicine, you can use it to Recall Knowledge.
    • Recall Knowledge about diseases, injuries, poisons, and other ailments. You can use this to perform forensic examinations if you spend 10 minutes (or more, as determined by the GM) checking for evidence such as wound patterns. This is most useful when determining how a body was injured or killed.
  properties:
    category: "Skills"
- id: "nature"
  name: "Nature"
  source: "pc > Chapter 4: Skills > Skills > Nature"
  description: |-
    You know about the natural world, and you command and train animals and magical beasts. Even if you're untrained in Nature, you can use it to Recall Knowledge.
    • Recall Knowledge about fauna, flora, geography, weather, the environment, creatures of natural origin (like animals, beasts, fey, and plants), and the planes tied to the natural world.
    You must be trained in Nature to use it for the following general skill actions.
    • Identify Magic, particularly magic of the primal tradition.
    • Learn a Spell from the primal tradition.
  properties:
    category: "Skills"
- id: "non-spellcasters-with-focus-spells"
  name: "Non-Spellcasters with Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells > Non-Spellcasters with Focus Spells"
  description: "If you get focus spells from a class or other source that doesn't grant spellcasting ability, the ability that gives you focus spells also provides your proficiency for your spell attack modifier and spell DC, as well as the magical tradition of your focus spells. Though you can cast your focus spells, you don't qualify for feats and other rules that require you to be a spellcaster or have a spellcasting class feature—those require you to have spell slots."
  properties:
    category: "Spells"
- id: "occultism"
  name: "Occultism"
  source: "pc > Chapter 4: Skills > Skills > Occultism"
  description: |-
    You know a great deal about ancient philosophies, esoteric lore, obscure mysticism, and supernatural creatures. Even if you're untrained in Occultism, you can use it to Recall Knowledge.
    • Recall Knowledge about ancient mysteries; obscure philosophies; creatures of occult significance (like aberrations, spirits, and oozes); and esoteric planes.
    You must be trained in Occultism to use it for the following general skill actions.
    • Decipher Writing on occult topics, including complex metaphysical systems, syncretic principles, obscure philosophies, and incoherent ramblings.
    • Identify Magic, particularly magic of the occult tradition.
    • Learn a Spell from the occult tradition.
  properties:
    category: "Skills"
- id: "overriding-conditions"
  name: "Overriding Conditions"
  source: "pc > Conditions Appendix > Overriding Conditions"
  description: "Some conditions override others. This is always specified in the entry for the overriding condition. When this happens, all effects of the overridden condition are suppressed until the overriding condition ends. The overridden condition's duration continues to elapse, and it might run out while suppressed."
  properties:
    category: "Conditions"
- id: "performance"
  name: "Performance"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: |-
    You are skilled at a form of performance, using your talents to impress a crowd or make a living.
    You must be trained in Performance to use it to Earn Income.
    • Earn Income by staging a performance.
  properties:
    category: "Skills"
- id: "performance-traits"
  name: "Performance Traits"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: |-
    When you use an action that utilizes the Performance skill, it gains one or more traits relevant to the type of performance. The GM might change these depending on the circumstances, but the most common performance-based traits are listed below.
    If you want to be particularly skilled with one type of performance, you can select the Virtuosic Performer skill feat. That feat breaks down some of the performance listed above into specific instrument types, and your GM might allow you to add your own type.
    Performance Additional Traits
    Act or perform comedy Auditory, linguistic, and visual
    Dance Move and visual
    Play an instrument Auditory and manipulate
    Orate or sing Auditory and linguistic
  properties:
    category: "Skills"
- id: "phantasmal-minion-statistics"
  name: "Phantasmal Minion Statistics"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Phantasmal Minion Creature -1
    MEDIUM FORCE MINDLESS
    **Perception.** +0; darkvision
    **Languages.** none (understands its creator)
    **Skills.** Stealth +8
    **Str.** -4, Dex +2, Con +0, Int -5, Wis +0, Cha +0
    **Force Body.** A phantasmal minion's body is made of magical force. It can't use attack actions. Though it has no physical weight, it can move and use Interact actions to do things such as fetch objects, open unstuck or unlocked doors, hold chairs, and clean. It can't pass through solid objects.
    **AC.** 13; Fort +0, Ref +4, Will +0
    **HP.** 4; Immunities disease, mental, non-magical attacks, paralysis, poison, precision, spirit, unconscious; Resistances all damage 5 (except force or ghost touch)
    **Speed.** fly 30 feet
  properties:
    category: "Spells"
- id: "practicing-a-trade"
  name: "Practicing a Trade"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: "You apply the practical benefits of one of your Lore specialties during downtime by practicing your trade. This is most effective for Lore specialties where there's high demand for workers. The GM might increase the DC or determine only low-level tasks are available if you're attempting to use an obscure Lore skill to Earn Income. You might also need specialized tools to accept a job, like mining tools to work in a mine or a merchant's scale to buy and sell valuables in a market."
  properties:
    category: "Skills"
- id: "prepared-spells"
  name: "Prepared Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Prepared Spells"
  description: |-
    If you're a prepared spellcaster—such as a cleric, druid, witch, or wizard—you must spend time each day preparing spells for that day. At the start of your daily preparations, you select a number of spells of different spell ranks, determined by your character level and class. Your spells remain prepared until you cast them or until you prepare spells again.
    Each prepared spell is expended after a single casting, so if you want to cast a particular spell more than once in a day, you need to prepare that spell multiple times. The exception to this rule is for spells with the cantrip trait; once you prepare a cantrip, you can cast it as many times as you want until the next time you prepare spells.
    You might gain an ability that allows you to swap prepared spells or perform other aspects of preparing spells at different times throughout the day, but only your daily preparation counts for the purpose of effects that last until the next time you prepare spells.
  properties:
    category: "Spells"
- id: "ranges-areas-and-targets"
  name: "Ranges, Areas, and Targets"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets"
  description: "Spells with a range can affect targets, create areas, or make things appear only within that range. Most spell ranges are measured in feet, though some can stretch over miles, reach anywhere on the planet, or go even farther!"
  properties:
    category: "Spells"
- id: "reading-spells"
  name: "Reading Spells"
  source: "pc > Chapter 7: Spells > Reading Spells"
  description: |-
    Each spell uses the following format. Entries appear only when applicable, so not all spells will have every entry described here. The spell's name line also lists the type of spell if it's a cantrip or focus spell, as well as the rank.
    SPELL NAME [1 action] SPELL (RANK)
    TRAITS
    **Tradition.** This entry lists the magical traditions the spell belongs to. Some feats or other abilities might add a spell to your spell list even if you don't follow the listed traditions.
    **Cast.** Spells that take longer than a single turn to cast include this entry to list the time required, such as "1 minute." If the spell has a cost, locus, requirements, or a trigger, that information is also listed in this section.
    **Range, Area, and Targets.** This entry lists the range of the spell, the area it affects, and the targets it can affect, if any. If none of these entries are present, the spell affects only the caster.
    **Defense and Duration.** If a spell allows the target to attempt a saving throw or use their AC to defend against it, the type of defense appears here. A Duration entry appears if the spell has one. A spell that doesn't list a duration takes place instantaneously, and anything created by it persists after the spell.
    A horizontal line follows defense and duration, and the effects of the spell are described after this line. This section might also detail the possible results of a saving throw: critical success, success, failure, and critical failure.
    **Heightened (rank).** If the spell has special effects when heightened, those effects appear at the end of the stat block.
  properties:
    category: "Spells"
- id: "religion"
  name: "Religion"
  source: "pc > Chapter 4: Skills > Skills > Religion"
  description: |-
    The secrets of deities, dogma, faith, and the realms of divine creatures both sublime and sinister are open to you. You also understand how magic works, though your training imparts a religious slant to that knowledge. Even if you're untrained in Religion, you can use it to Recall Knowledge.
    • Recall Knowledge about divine agents, the finer points of theology, obscure myths regarding a faith, creatures of religious significance (like celestials, fiends, and undead), and the planes tied to religion.
    You must be trained in Religion to use it for the following general skill actions.
    • Decipher Writing of a religious nature, including allegories, homilies, and proverbs.
    • Identify Magic, particularly magic of the divine tradition.
    • Learn a Spell from the divine tradition.
  properties:
    category: "Skills"
- id: "secret-checks"
  name: "Secret Checks"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs > Secret Checks"
  description: "Sometimes you won't know whether you have succeeded at a skill check. If an action has the secret trait, the GM rolls the check for you and informs you of the effect without revealing the result of the roll or the degree of success. The GM rolls secret checks when your knowledge about the outcome is imperfect, like when you're searching for a hidden creature or object, attempting to deceive someone, translating a tricky bit of ancient text, or remembering some piece of lore. This way, you as the player don't know things that your character wouldn't. This rule is the default for actions with the secret trait, but the GM can choose not to use secret checks if they would rather some or all rolls be public."
  properties:
    category: "Skills"
- id: "setting-triggers"
  name: "Setting Triggers"
  source: "pc > Chapter 7: Spells > Setting Triggers"
  description: |-
    If a spell is meant to respond only to certain events or under certain conditions, it might require you to set a trigger. This is a simple sensory cue that causes the spell to activate. The spell activates as a reaction when the spell's sensor observes something that fits its trigger. Depending on the spell, the trigger might be the presence of a type of creature, such as "red-bearded dwarven men," or it could be an observed action, such as "whenever someone enters the spell's area."
    Disguises and illusions fool the spell as long as they appear to match its parameters. For a spell to detect something visually, the spell's origin point must have line of sight. Darkness doesn't prevent this, but invisibility does, as does a successful Stealth check to Hide (against the spell's DC). For auditory detection, line of sight isn't necessary, though the sound must be audible at the spell's origin point. A Stealth check to Sneak can fool the sensor.
  properties:
    category: "Spells"
- id: "skill-actions"
  name: "Skill Actions"
  source: "pc > Chapter 4: Skills > Skill Actions"
  description: |-
    The actions you can perform with a given skill are sorted into those you can use untrained and those that require you to be trained in the skill. The untrained and trained actions of each skill appear in separate sections within the skill's description.
    Anyone can use a skill's untrained actions, but you can use trained actions only if you have a proficiency rank of trained or better in that skill. A circumstance, condition, or effect might bar you from a skill action regardless of your proficiency rank, and sometimes using a skill in a specific situation might require you to have a higher proficiency rank than the action usually does. For instance, even though a fighter untrained in Arcana could identify a construct with a lucky roll using Arcana to Recall Knowledge, the GM might decide that Recalling Knowledge to determine the spells used to create such a construct is beyond the scope of the fighter's anecdotal knowledge. The GM decides whether a task requires a particular proficiency rank.
  properties:
    category: "Skills"
- id: "skill-checks-and-dcs"
  name: "Skill Checks and DCs"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs"
  description: |-
    When you're actively using a skill, often by performing one of its actions, you might attempt a skill check: rolling a d20 and adding your skill modifier. To determine this modifier, add your attribute modifier for the skill's key attribute, your proficiency bonus for the skill, and any other bonuses and penalties.
    Skill modifier = skill's key attribute modifier + proficiency bonus + other bonuses + penalties
    When noting the modifier on your character sheet, you should write down only the numbers that always apply—typically just your attribute modifier and proficiency bonus at 1st level. At higher levels, you may wear or use items to improve your skills with item bonuses pretty much all the time; you should include those in your calculation, too.
    The GM sets the DC of a skill check. The DCs you're most likely to encounter frequently are the five simple skill DCs below, which are presented here to give you a sense of what number you'll need to roll to succeed at most tasks.
    Task Difficulty Simple DC
    Untrained 10
    Trained 15
    Expert 20
    Master 30
    Legendary 40
    When someone or something tests your skill, they attempt a check against your skill DC, which is equal to 10 plus your skill modifier. A skill DC works like any other DC to determine the effect of an opposing creature's skill action.
  properties:
    category: "Skills"
- id: "skill-descriptions"
  name: "Skill Descriptions"
  source: "pc > Chapter 4: Skills > Skills"
  description: |-
    A brief description of the skill is followed by a list of actions anyone can use, and then the actions you can perform only if you are trained in that skill. Some actions list sample tasks for each rank to give you a better sense of what you can accomplish as your proficiency increases. As the actions of a skill aren't comprehensive, there may be times when the GM asks you to attempt a skill check without using any of the listed actions, or times when the GM asks you to roll using a different key attribute modifier.
    Most skills include entries for success and failure, as well as descriptions of what occurs on a critical success or a critical failure. If either of the critical entries is absent, treat those results as a success or failure, as normal.
  properties:
    category: "Skills"
- id: "skills"
  name: "Skills"
  source: "pc > Chapter 4: Skills"
  description: |-
    A character's acumen in skills can come from all sorts of training, from practicing acrobatic tricks to studying academic topics to rehearsing a performing art. When you create your character and as they advance in level, you have flexibility as to which skills they become better at and when. Some classes depend heavily on certain skills—such as the bard's reliance on Performance—but for most classes, you can choose whichever skills make the most sense for your character's theme and backstory at 1st level, then use their adventure and downtime experiences to inform how their skills should improve as your character levels up.
    A character gains training in certain skills at 1st level: typically two from their background, a small number of predetermined skills from their class, and several skills of your choice granted by their class. This training increases your proficiency ranks for those skills to trained instead of untrained and lets you use more of the skills' actions. Sometimes you might become trained in the same skill from multiple sources, such as if your background granted training in Survival and you took the ranger class, which also grants training in Survival. Each time after the first that you'd become trained in a given skill, you instead allocate the trained proficiency to any other skill of your choice—though if the skill is a Lore skill, the new skill must also be a Lore skill.
  properties:
    category: "Skills"
- id: "society"
  name: "Society"
  source: "pc > Chapter 4: Skills > Skills > Society"
  description: |-
    You understand the people and systems that make civilization run, and you know the historical events that make societies what they are today. Further, you can use that knowledge to navigate the complex physical, societal, and economic workings of settlements. Even if you're untrained in Society, you can use it for the following general skill actions.
    • Recall Knowledge about local history, important personalities, legal institutions, societal structure, and humanoid cultures. The GM might allow Society to apply to other creatures that are major elements of society in your region, such as the draconic nobility in a kingdom of humans ruled by dragons.
    • Subsist in a settlement by finding shelter, scrounging, or begging for food.
    You must be trained in Society to use it to Decipher Writing.
    • Decipher Writing that's a coded message, text written in an incomplete or archaic form, or in some cases, text in a language you don't know.
  properties:
    category: "Skills"
- id: "spell-attacks"
  name: "Spell Attacks"
  source: "pc > Chapter 7: Spells > Spell Attacks"
  description: |-
    Some spells require you to succeed at a spell attack roll to affect the target. This is usually because they require you to precisely aim a ray or otherwise make an accurate attack. A spell attack roll is compared to the target's AC. Spell attack rolls benefit from any bonuses or penalties to attack rolls, including your multiple attack penalty, but not any special benefits or penalties that apply only to weapon or unarmed attacks. Spell attacks don't deal any damage beyond what's listed in the spell description.
    In rare cases, a spell might have you make some other type of attack, such as a weapon Strike. Such attacks use the normal rules and attack bonus for that type of attack.
  properties:
    category: "Spells"
- id: "spell-slots"
  name: "Spell Slots"
  source: "pc > Chapter 7: Spells > Spell Slots"
  description: "Characters of spellcasting classes can cast a number of spells each day; the spells you can cast in a day are referred to as spell slots. At 1st level, a character has only a small number of 1st-rank spell slots per day, but as you advance in level, you gain more spell slots of higher rank. A spell's rank indicates its overall power, from 1 to 10."
  properties:
    category: "Spells"
- id: "spellcasters-with-focus-spells"
  name: "Spellcasters with Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells > Spellcasters with Focus Spells"
  description: "If you are a spellcaster, your focus spells are the same tradition of spell as the class that gave you the focus spell. A bard's are occult, a cleric's are divine, a druid's are primal, a wizard's are arcane, and a witch's are determined by their patron."
  properties:
    category: "Spells"
- id: "spellcasting"
  name: "Spellcasting"
  source: "pc > Chapter 7: Spells"
  description: "With special gestures and utterances, a spellcaster can call forth mystic energies, warp the mind, protect themself against danger, or even create something from nothing. Each class has its own method of learning, preparing, and casting spells, and every individual spell produces a specific effect, so learning new spells gives a spellcaster an increasing array of options to accomplish their goals."
  properties:
    category: "Spells"
- id: "spontaneous-spells"
  name: "Spontaneous Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Spontaneous Spells"
  description: "If you're a spontaneous spellcaster—such as a bard—you choose which spell from your spell repertoire that you're using a spell slot for at the moment you decide to cast it. This provides you with more freedom in your spellcasting, but you have fewer spells in your spell repertoire, as determined by your character level and class. When you make your daily preparations, all your spell slots are refreshed, but you don't get to change the spells in your repertoire."
  properties:
    category: "Spells"
- id: "staging-a-performance"
  name: "Staging a Performance"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
    You perform for an audience to make money. The available audiences determine the level of your task, since more discerning audiences are harder to impress but provide a bigger payout. The GM determines the task level based on the audiences available. Performing for a typical audience of commoners on the street is a level 0 task, but a performance for a group of artisans with more refined tastes might be a 2nd- or 3rd-level task, and ones for merchants, nobility, and royalty are increasingly higher level.
    Your degree of success determines whether you moved your audience and whether you were rewarded with applause or rotten fruit.
  properties:
    category: "Skills"
- id: "stealth"
  name: "Stealth"
  source: "pc > Chapter 4: Skills > Skills > Stealth"
  description: "You are skilled at avoiding detection, allowing you to slip past foes, hide, or conceal an item."
  properties:
    category: "Skills"
- id: "survival"
  name: "Survival"
  source: "pc > Chapter 4: Skills > Skills > Survival"
  description: |-
    You are adept at living in the wilderness, foraging for food and building shelter, and with training you discover the secrets of tracking and hiding your trail. Even if you're untrained, you can still use Survival to Subsist.
    • Subsist in the wild by foraging for food and building shelter.
  properties:
    category: "Skills"
- id: "sustaining-spells"
  name: "Sustaining Spells"
  source: "pc > Chapter 7: Spells > Durations > Sustaining Spells"
  description: "If the spell's duration is \"sustained,\" it lasts until the end of your next turn unless you use the Sustain action on that turn to extend the duration of that spell."
  properties:
    category: "Spells"
- id: "targets"
  name: "Targets"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Targets"
  description: |-
    Some spells allow you to target a creature, an object, or something more specific. The target must be within the spell's range, and you must be able to see it (or otherwise perceive it with a precise sense) to target it. At the GM's discretion, you can attempt to target a creature you can't see. If you fail to target a particular creature, this doesn't change how the spell affects any other targets the spell has.
    If you choose a target that isn't valid, such as if you thought a vampire was a living creature and targeted it with a spell that can target only living creatures, your spell fails to target that creature. If a creature starts out as a valid target but ceases to be one during a spell's duration, the spell typically ends, but the GM might decide otherwise in certain situations. Some spells restrict you to willing targets. A player can declare their character a willing or unwilling target at any time, regardless of turn order or their character's condition (such as when a character is paralyzed, unconscious, or even dead).
    Spells that affect multiple creatures in an area can have both an Area entry and a Targets entry. A spell that has an area but no targets listed usually affects all creatures in the area indiscriminately.
  properties:
    category: "Spells"
- id: "the-summon-trait"
  name: "The Summon Trait"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Spells with the summon trait can conjure creatures, typically ones with a particular trait. Such creatures can be found in books of creatures. Unless noted otherwise, the creature must be common, it gains the summoned trait, and it must appear in an unoccupied space in range large enough to contain it. The highest level of creature the spell can summon depends on the rank of the spell, as listed below. The spell can still summon a creature of a lower level if you so choose. These rules apply only to spells that have the summon trait; other spells that call or conjure items or beings but that don't have the trait, like summon instrument, work as explained in the spell.
    Spell Rank Maximum Creature Level
    1st -1
    2nd 1
    3rd 2
    4th 3
    5th 5
    6th 7
    7th 9
    8th 11
    9th 13
    10th 15
  properties:
    category: "Spells"
- id: "thievery"
  name: "Thievery"
  source: "pc > Chapter 4: Skills > Skills > Thievery"
  description: "You are trained in a particular set of skills favored by thieves and miscreants."
  properties:
    category: "Skills"
- id: "touch-range"
  name: "Touch Range"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Touch Range"
  description: "A spell with a touch range requires you to physically touch the target. You use your unarmed reach to determine whether you can touch the creature. You can usually touch them automatically, though the spell might specify that they can attempt a saving throw or that you must attempt a spell attack roll. If an ability increases the range of a touch spell, start at 0 feet and increase from there."
  properties:
    category: "Spells"
- id: "walls"
  name: "Walls"
  source: "pc > Chapter 7: Spells > Walls"
  description: "Spells that create walls list the depth, length, and height of the wall, also specifying how it can be positioned. Some walls can be shaped; you can manipulate the wall into a form other than a straight line, choosing its contiguous path square by square. The path of a shaped wall can't enter the same space more than once, but it can double back so one section is adjacent to another section of the wall."
  properties:
    category: "Spells"
