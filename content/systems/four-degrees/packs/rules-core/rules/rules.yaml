- id: "athletics"
  name: "Athletics"
  source: "pc > Chapter 4: Skills > Skills > Athletics"
  description: |-
    Athletics allows you to perform deeds of physical prowess. Most Athletics actions let you move about the environment (Climb, High Jump, Long Jump, Swim) or control your opponent's movement in combat (Grapple, Reposition, Shove, Trip, and Disarm).
    Escape: When you use the Escape basic action, you can use your Athletics modifier instead of your unarmed attack modifier.
  properties:
    category: "Skills"
- id: "attack-rolls"
  name: "Attack Rolls"
  source: "pc > Chapter 6: Equipment > Weapons > Attack Rolls"
  description: |-
    When making an attack roll, determine the result by rolling 1d20 and adding your attack modifier for the weapon or unarmed attack you're using. Modifiers for melee and ranged attacks are calculated differently.
    Melee attack roll result = d20 roll + Strength modifier (or optionally Dexterity modifier for a finesse weapon) + proficiency bonus + other bonuses + penalties
    Ranged attack roll result = d20 roll + Dexterity modifier + proficiency bonus + other bonuses + penalties
  properties:
    category: "Equipment"
- id: "attacking-with-a-shield"
  name: "Attacking With a Shield"
  source: "pc > Chapter 6: Equipment > Shields > Attacking With a Shield"
  description: "A shield can be used as a martial weapon for attacks, using the statistics listed for a shield bash on the Martial Melee Weapons table. The shield bash is an option only for shields that weren't designed to be used as weapons. A shield can't have runes added to it. You can also buy and attach a shield boss or shield spikes to a shield to make it a more practical weapon. These can also be found on the Martial Melee Weapons table. These work like other weapons and can even be etched with runes."
  properties:
    category: "Equipment"
- id: "basic-competence"
  name: "Basic Competence"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: "Some performances require you to be more than just charismatic, and if you don't meet the demands of the art form or the audience, the GM might apply a penalty based on the relevant attribute. For example, if you're dancing and have a negative Dexterity modifier, you might take a penalty to your attempt at dancing. Likewise, if you are orating and have a negative Intelligence modifier, you might have to hope your raw Charisma can overcome the penalties from your intellectual shortcomings—or ask someone to help write your speeches!"
  properties:
    category: "Skills"
