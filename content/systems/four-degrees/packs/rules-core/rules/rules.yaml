    Most animals panic in battle unless specifically trained otherwise. When combat begins, they become frightened 4 and fleeing as long as they're frightened. If you successfully Command your Animal using Nature, you can keep it from fleeing, though this doesn't remove its frightened condition. If the animal is attacked or damaged, it returns to frightened 4 and fleeing, with the same exceptions.
    Warhorses and warponies are combat trained. They don't become frightened or fleeing during encounters in this way.
