- id: "basic-competence"
  name: "Basic Competence"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: "Some performances require you to be more than just charismatic, and if you don't meet the demands of the art form or the audience, the GM might apply a penalty based on the relevant attribute. For example, if you're dancing and have a negative Dexterity modifier, you might take a penalty to your attempt at dancing. Likewise, if you are orating and have a negative Intelligence modifier, you might have to hope your raw Charisma can overcome the penalties from your intellectual shortcomings—or ask someone to help write your speeches!"
  properties:
    category: "Skills"
- id: "condition-values"
  name: "Condition Values"
  source: "pc > Conditions Appendix > Condition Values"
  description: "Some conditions have a number after the condition, called a condition value. This value conveys the severity of a condition, and such conditions often give you a bonus or penalty equal to their value. These values can often be reduced by skills, spells, or simply waiting. If a condition value is ever reduced to 0, the condition ends."
  properties:
    category: "Conditions"
- id: "conditions"
  name: "Conditions"
  source: "pc > Conditions Appendix"
  description: "Conditions are persistent. Whenever you're affected by a condition, its effects last until the condition's stated duration ends, the condition is removed, or terms dictated in the condition itself cause it to end."
  properties:
    category: "Conditions"
- id: "crafting"
  name: "Crafting"
  source: "pc > Chapter 4: Skills > Skills > Crafting"
  description: |-
    You can use this skill to create and repair items. Even if you're untrained, you can Recall Knowledge.
    • Recall Knowledge about alchemical reactions, the value of items, engineering, unusual materials, and alchemical or mechanical creatures. The GM determines which creatures this applies to, but it usually includes constructs.
    You must be trained in Crafting to use it to Earn Income.
    • Earn Income by crafting goods for the market.
  properties:
    category: "Skills"
