- id: "alchemical-bombs"
  name: "Alchemical Bombs"
  source: "pc > Chapter 6: Equipment > Gear > Alchemical Gear > Alchemical Bombs"
  description: |-
    Alchemical bombs are consumable weapons that deal damage or produce special effects, and they sometimes deal splash damage. A bomb is a martial thrown weapon with a range increment of 20 feet. It can't benefit from runes, and it doesn't add your Strength modifier to damage despite being a thrown weapon.
    A bomb deals any listed splash damage to the target on a failure, success, or critical success, and to all other creatures within 5 feet of the target on a success or critical success. On a critical failure, the bomb misses entirely, dealing no damage. Add the damage together before applying resistance or weakness, and don't multiply splash damage on a critical hit.
