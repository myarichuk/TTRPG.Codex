- id: "initial-proficiencies"
  name: "Initial Proficiencies"
  source: "pc > Chapter 3: Classes > Reading Class Entries > Initial Proficiencies"
  description: |-
    When you choose your character's class, they gain a set of initial proficiencies. Proficiencies measure your character's ability to perform tasks, use abilities, and succeed at checks. Proficiency ranks range from trained to legendary. For instance, a character who is trained with a longbow can use it effectively, while a person who is legendary with the weapon might be able to split an arrow from 100 paces away!
    Each class entry specifies your character's initial proficiency rank in Perception, saving throws, attacks, defenses, and class DC. You gain the trained proficiency rank in several skills—the exact number depends on your class, and some classes specify certain additional skills that you're trained in. If your class would make you trained in a skill you're already trained in (typically due to your background), you can select another skill to become trained in.
    A proficiency rank can unlock various feats and class features, and it also helps determine the modifier for any check you roll or DC you calculate related to that statistic. If your character is trained in Perception, a saving throw, or another statistic, they gain a proficiency bonus equal to their level + 2, while if they have expert proficiency, they gain a proficiency bonus equal to their level + 4.
    Spellcasting classes grant a proficiency rank for spell attacks and DCs, which are further detailed in each class's entry. These classes rarely use their class DC.
    If something isn't listed in your character's class entry, their proficiency rank in that statistic is untrained unless they gain training from another source. If your character is untrained in something, you add a proficiency bonus of +0 when attempting a check or calculating a DC related to that statistic.
  properties:
    category: "Classes"
- id: "innate-spells"
  name: "Innate Spells"
  source: "pc > Chapter 7: Spells > Innate Spells"
  description: |-
    Certain spells are natural to your character, typically coming from your ancestry or a magic item. They're called innate spells. Innate spells don't let you qualify for abilities that require you to be a spellcaster—those require you to have spell slots. The ability that gives you an innate spell tells you how often you can cast it—usually once per day—and its magical tradition. Innate spells are refreshed during your daily preparations. Innate cantrips are cast at will and automatically heightened as normal for cantrips unless otherwise specified.
    When you gain an innate spell, you become trained in the spell attack modifier and spell DC statistics. At 12th level, these proficiencies increase to expert. Unless noted otherwise, Charisma is your spellcasting attribute modifier for innate spells.
    If you have an innate spell, you can cast it even if it's not of a spell rank you can normally cast. This is especially common for monsters.
    You can't use your spell slots to cast your innate spells, but you might have an innate spell and also be able to prepare or cast the same spell through your class. You also can't heighten innate spells, but some abilities that grant innate spells might give you the spell at a higher rank than its base rank or change the rank at which you cast the spell.
  properties:
    category: "Spells"
- id: "instant-death"
  name: "Instant Death"
  source: "pc > Chapter 8: Playing the Game > Hit Points, Healing, and Dying > Instant Death"
  description: |-
    There are ways in which you can die instantly, without reaching dying 0 first.
    Death Effects
    Some spells and abilities can kill you immediately or bring you closer to death without needing to reduce you to 0 Hit Points first. These abilities have the death trait and usually involve void energy, the antithesis of life, or other effects that target the mind or soul. If you're reduced to 0 Hit Points by a death effect, you're slain instantly without needing to reach dying 4. For instance, the vision of death spell automatically kills those it reduces to 0 Hit Points as terrifying hallucinations cause them to drop dead.
    A death effect might state that it kills you outright, without dealing damage, in which case you die without having to first reach dying 4 or be reduced to 0 Hit Points. For instance, an extremely powerful entity of death can automatically slay creatures who fail their save against its death strike ability.
    Massive Damage
    You die instantly if you ever take damage equal to or greater than double your maximum Hit Points in one blow.
    Heroic Recovery
    If you have at least 1 Hero Point, you can spend all of your remaining Hero Points at the start of your turn or when your dying value would increase. You lose the dying condition entirely and stabilize with 0 Hit Points. You don't gain the wounded condition or increase its value from losing the dying condition in this way, but if you already had that condition, you don't lose it or decrease its value.
  properties:
    category: "Playing the Game"
- id: "intimidation"
  name: "Intimidation"
  source: "pc > Chapter 4: Skills > Skills > Intimidation"
  description: "You bend others to your will using threats. Unlike Deception or Diplomacy, Intimidation is typically a blunt instrument with little room for nuance or care."
  properties:
    category: "Skills"
- id: "item-damage"
  name: "Item Damage"
  source: "pc > Chapter 6: Equipment > Item Damage"
  description: |-
    An item can be broken or destroyed if it takes enough damage. Every item has a Hardness value. Each time an item takes damage, reduce any damage the item takes by its Hardness. The rest of the damage reduces the item's Hit Points. Normally an item takes damage only when a creature is directly attacking it—commonly targeted items include doors and traps. A creature that attacks you doesn't normally damage your armor or other gear, even if it hits you. However, the Shield Block reaction can cause your shield to take damage as you use it to prevent damage to yourself, and some monsters have exceptional abilities that can damage your items.
    An item that takes damage can become broken and eventually destroyed. It becomes broken when its Hit Points are equal to or lower than its Broken Threshold (BT); once its Hit Points are reduced to 0, it is destroyed. A broken item has the broken condition until Repaired above its Broken Threshold. Anything that automatically makes an item broken immediately reduces its Hit Points to its Broken Threshold if the item had more Hit Points than that when the effect occurred. If an item has no Broken Threshold, then it has no relevant changes to its function due to being broken, but it's still destroyed at 0 Hit Points. A destroyed item can't be Repaired.
    An item's Hardness, Hit Points, and Broken Threshold usually depend on the material the item is made of.
  properties:
    category: "Equipment"
- id: "item-level"
  name: "Item Level"
  source: "pc > Chapter 6: Equipment > Item Level"
  description: "Each item has an item level, which represents the item's complexity and any magic used in its construction. Simpler items with a lower level are easier to construct, and you can't Craft items that have a higher level than your own. If an item's level isn't listed, its level is 0. While characters can use items of any level, GMs should keep in mind that allowing characters access to items far above their current level may have a negative impact on the game."
  properties:
    category: "Equipment"
- id: "items-and-sizes"
  name: "Items and Sizes"
  source: "pc > Chapter 6: Equipment > Items and Sizes"
  description: |-
    The Bulk rules in this chapter are for Small and Medium creatures, as most ancestries are these sizes; however, other uncommon or rare ancestries might be larger or smaller and require items specially made for creatures of those sizes. Large creatures can carry more, and smaller creatures can carry less, as noted on the Bulk Conversions table.
    These rules for Bulk limits come up most often when a group tries to load up a mount or animal companion. The rules for items of different sizes tend to come into play when the characters defeat a big creature that has gear, since usually the only creatures of other sizes are creatures under the GM's control.
    In most cases, Small or Medium creatures can wield a Large weapon, though it's unwieldy, giving them the clumsy 1 condition, and the larger size is canceled by the difficulty of swinging the weapon, so it grants no special benefit. Large armor is simply too large for Small and Medium creatures.
  properties:
    category: "Equipment"
- id: "items-of-different-sizes"
  name: "Items of Different Sizes"
  source: "pc > Chapter 6: Equipment > Items and Sizes > Items of Different Sizes"
  description: |-
    Creatures of sizes other than Small or Medium need items appropriate to their size. These items have different Bulk and possibly a different Price. The Differently Sized Items table provides the Price and Bulk conversion for such items.
    Differently Sized Items
    Creature Light Negligible
    Size Price Bulk Becomes Becomes
    Tiny Standard Half* — —
    Small or Med. Standard Standard L —
    Large x2 x2 1 Bulk L
    Huge x4 x4 2 Bulk 1 Bulk
    Gargantuan x8 x8 4 Bulk 2 Bulk
    * An item that would have its Bulk reduced below 1 has
    light Bulk.
    For example, a morningstar sized for a Medium creature has a Price of 1 gp and 1 Bulk, so one made for a Huge creature is 4 gp and 4 Bulk. One made for a Tiny creature still costs 1 gp (due to its intricacy) and has 1/2 Bulk (rounding down to light Bulk). Because the way that a creature treats Bulk and the Bulk of gear sized for it scale the same way, Tiny or Large (or larger) creatures can usually wear and carry about the same amount of gear as a Medium creature.
    Higher-level magic items that cost significantly more than 8 times the cost of a mundane item use their listed Price regardless of size. Precious materials, however, have a Price based on the Bulk of the item, so multiply the Bulk value as described on the Differently Sized Items table, then use the formula in the material's entry to determine the item's Price.
  properties:
    category: "Equipment"
- id: "key-attribute"
  name: "Key Attribute"
  source: "pc > Chapter 4: Skills > Key Attribute"
  description: "Each skill is tied to a key attribute. You add your modifier for this attribute to checks and DCs when using that skill. For example, skulking about the shadows of a city at night with Stealth uses your Dexterity modifier, navigating the myriad personalities and power plays of court politics with Society uses your Intelligence modifier, and so on. If the GM deems it appropriate for a certain situation, however, they might have you use a different attribute modifier for a skill check or when determining your skill DC."
  properties:
    category: "Skills"
- id: "kinds-of-ammunition"
  name: "Kinds of Ammunition"
  source: "pc > Chapter 6: Equipment > Weapons > Weapon Descriptions"
  description: |-
    **Arrow.** These projectiles are the ammunition for bows. The shaft of an arrow is made of wood. It is stabilized in flight by fletching at one end and bears a metal head on the other.
    **Blowgun Dart.** These thin, light darts are typically made of hardwood and stabilized with fletching of down or fur. They are often hollow so they can be used to deliver poison.
    **Bolt.** Shorter than traditional arrows but similar in construction, bolts are the ammunition used by crossbows.
    **Sling Bullet.** These are small metal balls, typically either iron or lead, designed to be used as ammunition in slings.
  properties:
    category: "Equipment"
- id: "languages"
  name: "Languages"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Languages"
  description: |-
    Your ancestry entry states which languages you know at 1st level. Typically, this means you can both speak and read these languages. Having a positive Intelligence modifier grants a number of additional languages equal to your Intelligence modifier. You can choose these languages from those available from your region or ethnicity. Ask your GM if there's a language you want to select.
    The languages presented here are grouped according to how common they are. Languages that are common are regularly encountered, even among those who aren't native speakers. Languages that are uncommon are most frequently spoken by native speakers, but they are also spoken by certain scholars and others interested in the associated cultures.
    Many uncommon languages are spoken by natives of other planes who rarely appear unless summoned. Mortals learning these languages might spend a lifetime without meeting a native speaker.
    It is possible for your character to learn languages later in their adventuring career. Selecting the Multilingual feat, for example, grants a character two new languages chosen from those listed below. If your Intelligence changes later on, you also adjust your number of languages accordingly. Other abilities and effects might grant access to common or uncommon languages, as detailed in their descriptions. Rare or secret languages can only be discovered through play.
  properties:
    category: "Languages"
- id: "learned-spells"
  name: "Learned Spells"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: "A spell you learn is added to your repository of spells, such as a spellbook for a wizard, familiar for a witch, or spell list for a cleric or druid. If you have a spell repertoire, such as a bard, it's not automatically added since you can only know a limited number of spells. Instead, you can select it when you add or swap spells."
  properties:
    category: "Skills"
- id: "learning-rituals"
  name: "Learning Rituals"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Learning Rituals"
  description: "Learning a ritual does not count against any limits on spells in your spell repertoire or on any other normal spellcasting ability. Rituals are never common, though if you look hard, you can probably find someone who can perform an uncommon ritual for you. They may still be unwilling to teach it to you."
  properties:
    category: "Spells"
- id: "light-rule"
  name: "Light"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection > Light"
  description: |-
    There are three levels of light: bright light, dim light, and darkness. The rules assume that all creatures are in bright light unless otherwise noted. A source of light lists the radius in which it sheds bright light, and it sheds dim light to double that radius.
    Bright Light
    In bright light, such as sunlight, creatures and objects can be observed clearly by anyone with average vision or better.
    Dim Light
    Areas in shadow or lit by weak light sources are in dim light. Creatures and objects in dim light have the concealed condition, unless the seeker has darkvision or low-light vision, or a precise sense other than vision.
    Darkness
    A creature or object within darkness is hidden or undetected unless the seeker has darkvision or a precise sense other than vision. A creature without darkvision or another means of perceiving in darkness has the blinded condition while in darkness, though it might be able to see illuminated areas beyond the darkness. If a creature can see into an illuminated area, it can observe creatures within that illuminated area normally. After being in darkness, sudden exposure to bright light might make you dazzled for a short time, as determined by the GM.
  properties:
    category: "Playing the Game"
- id: "line"
  name: "Line"
  source: "pc > Chapter 8: Playing the Game > Area > Line"
  description: "A line shoots forth from you, following a straight path in a direction of your choosing. The line affects each creature whose space it overlaps. Unless a line effect says otherwise, it is 5 feet wide. For example, the lightning bolt spell's area is a 60-foot line that's 5 feet wide."
  properties:
    category: "Playing the Game"
- id: "line-of-effect"
  name: "Line of Effect"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Line of Effect"
  description: "You usually need an unobstructed path to the target of a spell, the origin point of an area, or the place where you create something with a spell."
  properties:
    category: "Spells"
- id: "long-casting-times"
  name: "Long Casting Times"
  source: "pc > Chapter 7: Spells > Casting Spells > Long Casting Times"
  description: "Some spells take minutes or hours to cast. You can't use other actions or reactions while casting such a spell, though at the GM's discretion, you might be able to speak a few sentences. As with other activities that take a long time, these spells have the exploration trait, and you can't cast them in an encounter. If combat breaks out while you're casting one, your spell is disrupted (see Disrupted and Lost Spells below)."
  properties:
    category: "Spells"
- id: "long-durations"
  name: "Long Durations"
  source: "pc > Chapter 7: Spells > Durations > Long Durations"
  description: "If a spell's duration says it lasts until your next daily preparations, on the next day you can refrain from preparing a new spell in that spell's slot. (If you are a spontaneous caster, you can instead expend a spell slot during your preparations.) Doing so extends the spell's duration until your next daily preparations. This effectively Sustains the spell over a long period of time. If you prepare a new spell in the slot (or don't expend a spell slot), the spell ends. You can't do this if the spell didn't come from one of your spell slots. If you are dead or otherwise incapacitated at the 24-hour mark after the time you Cast the Spell or the last time you extended its duration, the spell ends. Spells with an unlimited duration last until counteracted or Dismissed. You don't need to keep a spell slot open for these spells."
  properties:
    category: "Spells"
- id: "long-term-rest"
  name: "Long-Term Rest"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode > Long-Term Rest"
  description: "You can spend an entire day and night resting during downtime to recover Hit Points equal to your Constitution modifier (minimum 1) multiplied by double your level."
  properties:
    category: "Playing the Game"
- id: "lore"
  name: "Lore"
  source: "pc > Chapter 4: Skills > Skills > Lore"
  description: |-
    You have specialized information on a narrow topic. Lore features many subcategories. You might have a Lore skill for any similar narrow subcategory of the skill. Each subcategory counts as its own skill, so applying a skill increase to one Lore subcategory wouldn't increase your proficiency with another, for example.
    Most backgrounds make you trained in a specific subcategory of the Lore skill. The GM determines what other subcategories they'll allow as Lore skills, though these categories are always less broad than any of the other skills that allow you to Recall Knowledge, and they should never be able to take the place of another skill's Recall Knowledge action. For instance, you couldn't choose a Lore so broad that it covers the knowledge spread across several other skills.
    If you're making a check and multiple subcategories of Lore could apply, or a non-Lore skill could apply, you can use whichever skill you prefer. If there's any doubt whether a Lore skill applies to a specific topic or action, the GM decides whether it can be used or not.
    Even if you're untrained in Lore, you can use it to Recall Knowledge.
    • Recall Knowledge about the subject of the Lore skill's subcategory.
    You must be trained in Lore to use it to Earn Income.
    • Earn Income by using your knowledge to practice a trade.
  properties:
    category: "Skills"
- id: "making-attack-rolls"
  name: "Making Attack Rolls"
  source: "pc > Chapter 8: Playing the Game > Checks > Attack Rolls"
  description: |-
    When you use a Strike action or make a spell attack, you attempt a check called an attack roll. Attack rolls take a variety of forms and are often highly variable based on the weapon you are using for the attack, but there are three main types: melee attack rolls, ranged attack rolls, and spell attack rolls. Spell attack rolls work a little bit differently.
    Melee attack rolls use Strength as their attribute modifier by default. If you're using a weapon or attack with the finesse trait, then you can use your Dexterity modifier instead.
    Melee attack roll result = d20 roll + Strength modifier (or optionally Dexterity modifier for a finesse weapon) + proficiency bonus + other bonuses + penalties
    Ranged attack rolls use Dexterity as their attribute modifier.
    Ranged attack roll result = d20 roll + Dexterity modifier + proficiency bonus + other bonuses + penalties
    When attacking with a weapon, whether melee or ranged, you add your proficiency bonus for the weapon you're using. Your class determines your proficiency rank for various weapons. Sometimes, you'll have different proficiency ranks for different weapons or groups of weapons.
    The bonuses you might apply to attack rolls can come from a variety of sources. Circumstance bonuses can come from the aid of an ally or a beneficial situation. Status bonuses are typically granted by spells and other magical aids. The item bonus to attack rolls comes from magic weapons—notably, a weapon's potency rune.
    Penalties to attack rolls come from situations and effects as well. Circumstance penalties come from risky tactics or detrimental circumstances, status penalties come from spells and magic working against you, and item penalties occur when you use a shoddy item. When making attack rolls, two main types of untyped penalties are likely to apply. The first is the multiple attack penalty, and the second is the range penalty. The first applies anytime you make more than one attack action during the course of your turn, and the other applies only with ranged or thrown weapons. Both are described below.
    Multiple Attack Penalty
    The more attacks you make beyond your first in a single turn, the less accurate you become, represented by the multiple attack penalty. The second time you use an attack action during your turn, you take a -5 penalty to your check. The third time you attack, and on any subsequent attacks, you take a -10 penalty to your check. Every check that has the attack trait counts toward your multiple attack penalty, including Strikes, spell attack rolls, certain skill actions like Shove, and many others.
    Some weapons and abilities reduce multiple attack penalties, such as agile weapons, which reduce these penalties to -4 on the second attack or -8 on further attacks.
    Attack Multiple Attack Penalty Agile
    First None None
    Second -5 -4
    Third or subsequent -10 -8
    Always calculate your multiple attack penalty based on the weapon you're using on that attack, not ones you used on previous attacks. For example, let's say you're wielding a longsword in one hand and a shortsword (which has the agile trait) in your other hand, and you make three Strikes with these weapons over the course of your turn. The first Strike you make during your turn has no penalty, no matter what weapon you are using. The second Strike will take either a -5 penalty if you use the longsword or a -4 penalty if you use the shortsword. Your third attack would be a -10 penalty with the longsword and a -8 penalty with the shortsword, no matter what weapon you used for your previous Strikes.
    The multiple attack penalty applies only during your turn, so you don't have to keep track of it if you can perform a Reactive Strike or a similar reaction that lets you make a Strike on someone else's turn.
    Range Penalty
    Ranged and thrown weapons each have a listed range increment, and attacks with them grow less accurate against targets farther away. As long as your target is at or within the listed range increment, also called the first range increment, you take no penalty to the attack roll. If you're attacking beyond that range increment, you take a -2 penalty for each additional increment beyond the first. You can attempt to attack with a ranged weapon or thrown weapon up to six range increments away, but the farther away you are, the harder it is to hit your target.
    For example, the range increment of a crossbow is 120 feet. If you are shooting at a target no farther away than that distance, you take no penalty due to range. If they're beyond 120 feet but no more than 240 feet away, you take a -2 penalty due to range. If they're beyond 240 feet but no more than 360 feet away, you take a -4 penalty due to range, and so on, until you reach the last range increment: beyond 600 feet but no more than 720 feet away, where you take a -10 penalty due to range.
    Compare to AC
    You compare your attack roll to Armor Class (AC), a special type of DC.
  properties:
    category: "Playing the Game"
- id: "making-choices"
  name: "Making Choices"
  source: "pc > Chapter 8: Playing the Game > Making Choices"
  description: |-
    Throughout the game, the GM describes what's happening in the world and then asks the players, "So what do you do?" Exactly what you choose to do, and how the GM responds to those choices, builds a unique story experience. Every game is different, because you'll rarely, if ever, make the same decisions as another group of players. This is true for the GM as well—two GMs running the exact same adventure will put different emphasis and flourishes on the way they present each scenario and encounter.
    Often, your choices have no immediate risk or consequences. If you're traveling along a forest path and come across a fork in the trail, the GM will ask, "Which way do you go?" You might choose to take the right fork or the left. You could also choose to leave the trail, or just go back to town. Once your choice is made, the GM tells you what happens next. Down the line, that choice may impact what you encounter later in the game, but in many cases nothing dangerous happens immediately.
    But sometimes what happens as a result of your choices is less than certain. In those cases, you'll attempt a check.
  properties:
    category: "Playing the Game"
- id: "master-abilities"
  name: "Master Abilities"
  source: "pc > Chapter 3: Classes > Familiars > Master Abilities"
  description: "Master abilities primarily affect you or the magic that passes between you and your familiar."
  properties:
    category: "Classes"
- id: "mature-animal-companions"
  name: "Mature Animal Companions"
  source: "pc > Chapter 3: Classes > Companions > Mature Animal Companions"
  description: |-
    When you advance a young animal companion to a mature animal companion:
    - If your companion is Medium or smaller, it grows by one size.
    - Increase its Strength, Dexterity, Constitution, and Wisdom modifiers by 1.
    - Increase its proficiency rank for Perception and all saving throws to expert. Increase its proficiency ranks in Intimidation, Stealth, and Survival to trained, and if it was already trained in one of those skills from its type, increase its proficiency rank in that skill to expert.
    - Increase its unarmed attack damage from one die to two dice (for instance 1d8 to 2d8)
  properties:
    category: "Classes"
- id: "medicine"
  name: "Medicine"
  source: "pc > Chapter 4: Skills > Skills > Medicine"
  description: |-
    You can patch up wounds and help people recover from diseases and poisons. Treat Wounds is especially useful, allowing your adventuring party to heal up between fights. It can be made more efficient with skill feats like Continual Recovery and Ward Medic.
    Even if you're untrained in Medicine, you can use it to Recall Knowledge.
    • Recall Knowledge about diseases, injuries, poisons, and other ailments. You can use this to perform forensic examinations if you spend 10 minutes (or more, as determined by the GM) checking for evidence such as wound patterns. This is most useful when determining how a body was injured or killed.
  properties:
    category: "Skills"
- id: "mixed-ancestry"
  name: "Mixed Ancestry"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry"
  description: |-
    You can choose a mixed ancestry to represent having two ancestral lines for your character. This doesn't preclude having more than two ancestries in your genealogy, but you'll need to work with your GM if you want to have more than two reflected in the rules. The possible combinations of ancestries are immeasurable, though the half-elf and half-orc heritages below are the most common.
    **Custom Mixed Heritage.** You can work with your GM to create a mixed heritage for an ancestry other than elf or orc. A custom mixed-ancestry heritage is an uncommon heritage. Choose an ancestry to tie to the heritage. You gain any traits of that ancestry and a new trait for your combined ancestry, similar to how the half-elf heritage below grants the "elf" and "half-elf" traits. You also gain low-light vision if the ancestry tied to the heritage has low-light vision or darkvision. The heritage lets you select ancestry feats for the chosen ancestry in addition to those from your base ancestry. The half-elf and half-orc heritages both have special feats, but a custom heritage will need you to work with your GM to create or adapt some.
  properties:
    category: "Ancestries"
- id: "modifiers-and-ac"
  name: "Modifiers and AC"
  source: "pc > Chapter 3: Classes > Familiars > Modifiers and AC"
  description: "For Perception, Acrobatics, and Stealth, you can have your familiar use your spellcasting attribute modifier + your level instead of 3 + your level if it's higher."
  properties:
    category: "Classes"
- id: "movement-types"
  name: "Movement Types"
  source: "pc > Chapter 8: Playing the Game > Movement > Movement Types"
  description: |-
    Creatures soar through the clouds, scale sheer cliffs, and tunnel underfoot. The majority of creatures have a Speed, which is how fast they can move across the ground.
    Some abilities give you different ways to move, such as through the air or underground. Each of these special movement types has its own Speed value. Many creatures have these Speeds naturally, such as a bird having a fly Speed or a fish having a swim Speed. The various types of movement are listed below. Since the Stride action can be used only with your normal Speed, moving using one of these movement types requires using a special action, and you can't Step while using one of these movement types. Since Speed by itself refers to your land Speed, rules text concerning these special movement types specifies the movement types to which it applies. Speeds can be increased or decreased with item, circumstance, and status bonuses and penalties. Penalties can't reduce your Speeds below 5 feet unless stated otherwise.
    Switching from one movement type to another requires ending your action that has the first movement type and using a new action that has the second movement type. For instance, if you Climbed 10 feet to the top of a cliff, you could then Stride forward 10 feet. In some cases, the GM might rule otherwise, especially if you're moving a very short distance using one of the types of movement.
    Speed
    Most characters and monsters have a Speed statistic that indicates how quickly they can move across the ground. This statistic is referred to as land Speed when it's necessary to differentiate it from special Speeds.
    When you use the Stride action, you move a number of feet equal to your Speed. Numerous other abilities also allow you to move, from Crawling to Leaping, and most of them are based on your Speed in some way. Whenever a rule mentions your Speed without specifying a type, it's referring to your land Speed.
    Burrow Speed
    A burrow Speed lets you tunnel through the ground. You can use the Burrow action if you have a burrow Speed. Burrowing doesn't normally leave behind a tunnel unless the ability specifically states that it does. Most creatures need to hold their breath when burrowing, and they might need tremorsense to navigate.
    Climb Speed
    A climb Speed allows you to move up or down inclines and vertical surfaces. Most creatures need to succeed at Athletics checks to Climb, but if you have a climb Speed, you automatically succeed and move up to your climb Speed instead of the listed distance.
    You might still have to attempt Athletics checks to Climb in hazardous conditions, to Climb extremely difficult surfaces, or to cross horizontal planes such as ceilings. You can also choose to roll an Athletics check to Climb rather than accept an automatic success in hopes of getting a critical success. Your climb Speed grants you a +4 circumstance bonus to Athletics checks to Climb.
    If you have a climb Speed, you're not off-guard while you're climbing.
    Fly Speed
    As long as you have a fly Speed, you can use the Fly and Arrest a Fall actions. You can also attempt to Maneuver in Flight if you're trained in the Acrobatics skill.
    Wind conditions can affect how you use the Fly action. In general, moving against the wind uses the same rules as moving through difficult terrain (or greater difficult terrain, if you're also flying upward), and moving with the wind allows you to move 10 feet for every 5 feet of movement you spend (not cumulative with moving straight downward).
    Upward and downward movement are both relative to the gravity in your area; if you're in zero gravity, moving up or down is no different from moving horizontally.
    Swim Speed
    With a swim Speed, you can propel yourself through the water with little impediment. Instead of attempting Athletics checks to Swim, you automatically succeed and move up to your swim Speed instead of the listed distance. Moving up or down is still moving through difficult terrain.
    You might still have to attempt checks to Swim in hazardous conditions or to cross turbulent water. You can also choose to roll an Athletics check to Swim rather than accept an automatic success in hopes of getting a critical success. Your swim Speed grants you a +4 circumstance bonus to Athletics checks to Swim.
    Having a swim Speed doesn't necessarily mean you can breathe in water, so you might still have to hold your breath if you're underwater to avoid drowning.
  properties:
    category: "Playing the Game"
- id: "multiclass-dedications"
  name: "Multiclass Dedications"
  source: "pc > Chapter 3: Classes > Archetypes > Multiclass Dedications"
  description: "All of these archetypes have the multiclass trait. These allow you to diversify your training into another class's specialties. You can't select a multiclass archetype's dedication feat if you are already a member of that class."
  properties:
    category: "Classes"
- id: "multiple-attack-penalty"
  name: "Multiple Attack Penalty"
  source: "pc > Chapter 6: Equipment > Weapons > Attack Rolls > Multiple Attack Penalty"
  description: |-
    If you use an action with the attack trait more than once on the same turn, your attacks after the first take a penalty called a multiple attack penalty. Your second attack takes a -5 penalty, and any subsequent attacks take a -10 penalty.
    The multiple attack penalty doesn't apply to attacks you make when it isn't your turn (such as attacks made as part of a reaction, like Reactive Strike). You can use a weapon with the agile trait to reduce your multiple attack penalty.
  properties:
    category: "Equipment"
- id: "multiple-exposures"
  name: "Multiple Exposures"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Multiple Exposures"
  description: "Multiple exposures to the same curse or disease currently affecting you have no effect. For a poison, however, failing the initial saving throw against a new exposure increases the stage by 1 (or by 2 if you critically fail) without affecting the maximum duration. This is true even if you're within the poison's onset period, though it doesn't change the onset length. If the poison does not have an onset time or it's already elapsed, you are immediately subject to the effects of the new stage."
  properties:
    category: "Playing the Game"
- id: "nature"
  name: "Nature"
  source: "pc > Chapter 4: Skills > Skills > Nature"
  description: |-
    You know about the natural world, and you command and train animals and magical beasts. Even if you're untrained in Nature, you can use it to Recall Knowledge.
    • Recall Knowledge about fauna, flora, geography, weather, the environment, creatures of natural origin (like animals, beasts, fey, and plants), and the planes tied to the natural world.
    You must be trained in Nature to use it for the following general skill actions.
    • Identify Magic, particularly magic of the primal tradition.
    • Learn a Spell from the primal tradition.
  properties:
    category: "Skills"
- id: "nimble-animal-companions"
  name: "Nimble Animal Companions"
  source: "pc > Chapter 3: Classes > Companions > Nimble Animal Companions"
  description: |-
    To advance a mature animal companion to a nimble animal companion:
    - Increase its Dexterity modifier by 2 and its Strength, Constitution, and Wisdom modifiers by 1.
    - Increase its proficiency ranks in Acrobatics to expert.
    - It deals 2 additional damage with its unarmed attacks. Its attacks become magical for the purpose of ignoring resistances.
    - It learns the advanced maneuver for its type.
  properties:
    category: "Classes"
- id: "non-spellcasters-with-focus-spells"
  name: "Non-Spellcasters with Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells > Non-Spellcasters with Focus Spells"
  description: "If you get focus spells from a class or other source that doesn't grant spellcasting ability, the ability that gives you focus spells also provides your proficiency for your spell attack modifier and spell DC, as well as the magical tradition of your focus spells. Though you can cast your focus spells, you don't qualify for feats and other rules that require you to be a spellcaster or have a spellcasting class feature—those require you to have spell slots."
  properties:
    category: "Spells"
- id: "object-immunities"
  name: "Object Immunities"
  source: "pc > Chapter 6: Equipment > Item Damage > Object Immunities"
  description: |-
    Inanimate objects and hazards are immune to bleed, death effects, disease, healing, mental effects, nonlethal attacks, poison, spirit, vitality, void, as well as the doomed, drained, fatigued, paralyzed, sickened, and unconscious conditions. Conscious, thinking items are not immune to mental effects. Many objects are immune to other conditions, at the GM's discretion. For instance, a sword can't move, so it can't take a penalty to its Speed, but a spinning blade trap might be affected.
    Broken
    Broken is a condition that affects objects. An object is broken when damage has reduced its Hit Points below its Broken Threshold. A broken object can't be used for its normal function, nor does it grant bonuses—with the exception of armor. Broken armor still grants its item bonus to AC, but it also imparts a status penalty to AC depending on its category: -1 for broken light armor,
    -2 for broken medium armor, or -3 for broken heavy armor.
    A broken item still imposes penalties and limitations normally incurred by carrying, holding, or wearing it. For example, broken armor would still impose its Dexterity modifier cap, check penalty, and so forth.
    If an effect makes an item broken automatically and the item has more HP than its Broken Threshold, that effect also reduces the item's current HP to the Broken Threshold.
  properties:
    category: "Equipment"
- id: "occultism"
  name: "Occultism"
  source: "pc > Chapter 4: Skills > Skills > Occultism"
  description: |-
    You know a great deal about ancient philosophies, esoteric lore, obscure mysticism, and supernatural creatures. Even if you're untrained in Occultism, you can use it to Recall Knowledge.
    • Recall Knowledge about ancient mysteries; obscure philosophies; creatures of occult significance (like aberrations, spirits, and oozes); and esoteric planes.
    You must be trained in Occultism to use it for the following general skill actions.
    • Decipher Writing on occult topics, including complex metaphysical systems, syncretic principles, obscure philosophies, and incoherent ramblings.
    • Identify Magic, particularly magic of the occult tradition.
    • Learn a Spell from the occult tradition.
  properties:
    category: "Skills"
- id: "other-actions"
  name: "Other Actions"
  source: "pc > Chapter 8: Playing the Game > Actions > Other Actions"
  description: "Sometimes you need to attempt something not already covered by defined actions in the game. When this happens, the rules tell you how many actions you need to spend, as well as any traits your action might have. For example, a spell that lets you switch targets might say you can do so \"by spending a single action, which has the concentrate trait.\" The GM can also use this approach when a character tries to do something that isn't covered in the rules."
  properties:
    category: "Playing the Game"
- id: "other-activities"
  name: "Other Activities"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode > Other Activities"
  description: |-
    Work with your GM if there are other ways you want to spend downtime. You might acquire property, manage a business, become part of a guild, curry favor in a large city, take command of an army, take on an apprentice, start a family, or minister to a flock of the faithful. Though there are efficient options for making money or adjusting your character, it's often better to seek out fun and interesting activities that can open up new opportunities for character building, adventures, or relationships.
    Goals
    You can help guide the course of the campaign by setting long-term goals that take multiple periods of downtime to complete. Talk them through with the GM and the rest of the group. Consider alliances you want to develop further or changes you want to see in the game world.
  properties:
    category: "Playing the Game"
- id: "other-currency"
  name: "Other Currency"
  source: "pc > Chapter 6: Equipment > Coins and Currency > Other Currency"
  description: "Art objects, gems, and raw materials (such as those used for the Craft activity) can be used much like currency: you can sell them for the same Price you can buy them."
  properties:
    category: "Equipment"
- id: "overriding-conditions"
  name: "Overriding Conditions"
  source: "pc > Conditions Appendix > Overriding Conditions"
  description: "Some conditions override others. This is always specified in the entry for the overriding condition. When this happens, all effects of the overridden condition are suppressed until the overriding condition ends. The overridden condition's duration continues to elapse, and it might run out while suppressed."
  properties:
    category: "Conditions"
- id: "perception"
  name: "Perception"
  source: "pc > Chapter 8: Playing the Game > Checks > Perception"
  description: |-
    Perception measures your ability to be aware of your environment. Every creature has Perception, which works with and is limited by a creature's senses. Whenever you need to attempt a check based on your awareness, you'll attempt a Perception check. Your Perception uses your Wisdom modifier, so you'll use the following formula when attempting a Perception check. Perception check result = d20 roll + Wisdom modifier + proficiency bonus + other bonuses + penalties
    Nearly all creatures are at least trained in Perception, so you will almost always add a proficiency bonus to your Perception modifier. You might add a circumstance bonus for advantageous situations or environments and typically get status bonuses from spells or other magical effects. Items can also grant you a bonus to Perception, typically in a certain situation. For instance, a fine spyglass grants a +1 item bonus to Perception when attempting to see something a long distance away. Circumstance penalties to Perception occur when an environment or situation (such as fog) hampers your senses, while status penalties typically come from conditions, spells, and magic effects that foil the senses. You'll rarely encounter item penalties or untyped penalties for Perception.
    Many abilities are compared to your Perception DC to determine whether they succeed. As with any DC based on a modifier, your Perception DC is 10 + your total Perception modifier.
    Perception for Initiative
    Often, you'll roll a Perception check to determine your order in initiative. When you do this, instead of comparing the result against a DC, the GM will put the results for everyone in the encounter in order. The creature with the highest result acts first, the creature with the second-highest result goes second, and so on. Sometimes you may be called on to roll a skill check for initiative instead, but you'll compare results just as if you had rolled Perception.
  properties:
    category: "Playing the Game"
- id: "perception-and-detection"
  name: "Perception and Detection"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection"
  description: "Perception is frequently used for rolling initiative in an encounter, and for the Seek action."
  properties:
    category: "Playing the Game"
- id: "performance"
  name: "Performance"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: |-
    You are skilled at a form of performance, using your talents to impress a crowd or make a living.
    You must be trained in Performance to use it to Earn Income.
    • Earn Income by staging a performance.
  properties:
    category: "Skills"
- id: "performance-traits"
  name: "Performance Traits"
  source: "pc > Chapter 4: Skills > Skills > Performance"
  description: |-
    When you use an action that utilizes the Performance skill, it gains one or more traits relevant to the type of performance. The GM might change these depending on the circumstances, but the most common performance-based traits are listed below.
    If you want to be particularly skilled with one type of performance, you can select the Virtuosic Performer skill feat. That feat breaks down some of the performance listed above into specific instrument types, and your GM might allow you to add your own type.
    Performance Additional Traits
    Act or perform comedy Auditory, linguistic, and visual
    Dance Move and visual
    Play an instrument Auditory and manipulate
    Orate or sing Auditory and linguistic
  properties:
    category: "Skills"
- id: "phantasmal-minion-statistics"
  name: "Phantasmal Minion Statistics"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Phantasmal Minion Creature -1
    MEDIUM FORCE MINDLESS
    **Perception.** +0; darkvision
    **Languages.** none (understands its creator)
    **Skills.** Stealth +8
    **Str.** -4, Dex +2, Con +0, Int -5, Wis +0, Cha +0
    **Force Body.** A phantasmal minion's body is made of magical force. It can't use attack actions. Though it has no physical weight, it can move and use Interact actions to do things such as fetch objects, open unstuck or unlocked doors, hold chairs, and clean. It can't pass through solid objects.
    **AC.** 13; Fort +0, Ref +4, Will +0
    **HP.** 4; Immunities disease, mental, non-magical attacks, paralysis, poison, precision, spirit, unconscious; Resistances all damage 5 (except force or ghost touch)
    **Speed.** fly 30 feet
  properties:
    category: "Spells"
- id: "playing-a-versatile-heritage"
  name: "Playing a Versatile Heritage"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Playing a Versatile Heritage"
  description: |-
    To play a character with a versatile heritage, first select your ancestry, just like you would for any character. You gain Hit Points, size, Speed, attribute boosts and attribute flaws, languages, traits, and other abilities from that ancestry. Then, instead of choosing a heritage from those normally available to that ancestry, apply your chosen versatile heritage. You gain all the features from your versatile heritage, some of which might modify or replace statistics, abilities, or traits from your ancestry.
    Since a versatile heritage is a heritage, you can have only one, and you can't have any other heritage in addition to your versatile heritage.
    Sometimes a versatile heritage might give you an ability that conflicts with an ability from your ancestry. In these cases, you choose which of the conflicting abilities your character has.
    When selecting ancestry feats, you can choose from those available to your ancestry as well as those specific to your versatile heritage.
    Lineage Feats
    Some ancestry feats within a versatile heritage have the lineage trait. These feats specify a physiological lineage your character has—such as the type of hag that birthed a changeling character, or the type of extraplanar entity that influenced a nephilim's birth. You can have only one lineage feat; you can select such a feat only at 1st level, and you can't retrain into or out of this feat.
  properties:
    category: "Ancestries"
- id: "playing-the-class"
  name: "Playing the Class"
  source: "pc > Chapter 3: Classes > Reading Class Entries > Playing the Class"
  description: "The first section of each class describes the interests and tendencies typical of that class, as well as information on how others view them. This can help inspire you as you determine your character's actions and define their personality, but you aren't obligated to play your character as this section describes."
  properties:
    category: "Classes"
- id: "playing-the-game"
  name: "Playing the Game"
  source: "pc > Chapter 8: Playing the Game"
  description: |-
    Before diving into how to play, it's important to understand the game's three modes of play, which determine the pace of your adventure and the specific rules you'll use at a given time. Each mode provides a different pace and presents a different level of risk to your characters. The Game Master (GM) determines which mode works best for the story and controls the transition between them. You'll likely talk about the modes less formally during your play session, simply transitioning between exploration and encounters during the adventure, before heading to a settlement to achieve something during downtime.
    The most intricate of the modes is encounter mode. This is where most of the intense action takes place, and it's most often used for combat or other high-stakes situations. The GM typically switches to encounter mode by calling on the players to "roll for initiative" to determine the order in which all the actors take their turns during the encounter. Time is then divided into a series of rounds, each lasting roughly 6 seconds in the game world. Each round, player characters, other creatures, and sometimes even hazards or events take their turn in initiative order. At the start of a participant's turn, they gain the use of a number of actions (typically 3 in the case of PCs and other creatures) as well as a special action called a reaction. These actions, and what you do with them, are how you affect the world within an encounter.
    In exploration mode, time is more flexible and the play more free-form. Minutes, hours, or even days in the game world pass quickly in the real world, as the characters travel cross-country, explore uninhabited sections of a dungeon, recover from a battle, or roleplay during a social gathering. Often, developments during exploration lead to encounters, and the GM will switch to that mode of play until the encounter ends, before returning to exploration mode.
    The third mode is downtime. During downtime, the characters are at little risk, and the passage of time is measured in days or longer. This is when you might forge a magic sword, research a new spell, or prepare for your next adventure.
    Sections covering each of the modes of play detail how the structure of those modes works during a game session. The remaining rules come up throughout the course of the game.
  properties:
    category: "Playing the Game"
- id: "practicing-a-trade"
  name: "Practicing a Trade"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: "You apply the practical benefits of one of your Lore specialties during downtime by practicing your trade. This is most effective for Lore specialties where there's high demand for workers. The GM might increase the DC or determine only low-level tasks are available if you're attempting to use an obscure Lore skill to Earn Income. You might also need specialized tools to accept a job, like mining tools to work in a mine or a merchant's scale to buy and sell valuables in a market."
  properties:
    category: "Skills"
- id: "prepared-spells"
  name: "Prepared Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Prepared Spells"
  description: |-
    If you're a prepared spellcaster—such as a cleric, druid, witch, or wizard—you must spend time each day preparing spells for that day. At the start of your daily preparations, you select a number of spells of different spell ranks, determined by your character level and class. Your spells remain prepared until you cast them or until you prepare spells again.
    Each prepared spell is expended after a single casting, so if you want to cast a particular spell more than once in a day, you need to prepare that spell multiple times. The exception to this rule is for spells with the cantrip trait; once you prepare a cantrip, you can cast it as many times as you want until the next time you prepare spells.
    You might gain an ability that allows you to swap prepared spells or perform other aspects of preparing spells at different times throughout the day, but only your daily preparation counts for the purpose of effects that last until the next time you prepare spells.
  properties:
    category: "Spells"
- id: "price"
  name: "Price"
  source: "pc > Chapter 6: Equipment > Price"
  description: "Most items in the following tables have a Price, which is the amount of currency it typically takes to purchase that item. An item with a Price of \"—\" can't be purchased. An item with a Price of 0 is normally free, but its value could be higher based on the materials used to create it. Most items can be sold for half their Price, but coins, gems, art objects, and raw materials (such as components for the Craft activity) can be exchanged for their full Price."
  properties:
    category: "Equipment"
- id: "ranges-areas-and-targets"
  name: "Ranges, Areas, and Targets"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets"
  description: "Spells with a range can affect targets, create areas, or make things appear only within that range. Most spell ranges are measured in feet, though some can stretch over miles, reach anywhere on the planet, or go even farther!"
  properties:
    category: "Spells"
- id: "reactions-in-encounters"
  name: "Reactions in Encounters"
  source: "pc > Chapter 8: Playing the Game > Encounter Mode > Reactions in Encounters"
  description: "Your reactions let you respond immediately to what's happening around you. The GM determines whether you can use reactions before your first turn begins, depending on the situation in which the encounter happens. Once your first turn begins, you gain your actions and reaction. You gain 1 reaction per round. You can use a reaction on anyone's turn (including your own), but only when its trigger occurs. If you don't use your reaction, you lose it at the start of your next turn, though you typically then gain a reaction at the start of that turn."
  properties:
    category: "Playing the Game"
- id: "reactions-to-movement"
  name: "Reactions to Movement"
  source: "pc > Chapter 8: Playing the Game > Movement > Tactical Movement > Sidebar: Reactions to Movement"
  description: |-
    Some reactions and free actions are triggered by a creature using an action with the move trait. The most notable example is Reactive Strike (reproduced below). Actions with the move trait can trigger reactions or free actions throughout the course of the distance traveled. Each time you exit a square within a creature's reach, your movement triggers those reactions and free actions (although no more than once per move action for a given reacting creature). If you use a move action but don't move out of a square, the trigger instead happens at the end of that action or ability.
    Some actions, such as Step, specifically state they don't trigger reactions or free actions based on movement.
    REACTIVE STRIKE [reaction]
    **Trigger.** A creature within your reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.
    You lash out at a foe that leaves an opening. Make a melee Strike against the triggering creature. If your attack is a critical hit and the trigger was a manipulate action, you disrupt that action. This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike.
  properties:
    category: "Playing the Game"
- id: "reading-spells"
  name: "Reading Spells"
  source: "pc > Chapter 7: Spells > Reading Spells"
  description: |-
    Each spell uses the following format. Entries appear only when applicable, so not all spells will have every entry described here. The spell's name line also lists the type of spell if it's a cantrip or focus spell, as well as the rank.
    SPELL NAME [1 action] SPELL (RANK)
    TRAITS
    **Tradition.** This entry lists the magical traditions the spell belongs to. Some feats or other abilities might add a spell to your spell list even if you don't follow the listed traditions.
    **Cast.** Spells that take longer than a single turn to cast include this entry to list the time required, such as "1 minute." If the spell has a cost, locus, requirements, or a trigger, that information is also listed in this section.
    **Range, Area, and Targets.** This entry lists the range of the spell, the area it affects, and the targets it can affect, if any. If none of these entries are present, the spell affects only the caster.
    **Defense and Duration.** If a spell allows the target to attempt a saving throw or use their AC to defend against it, the type of defense appears here. A Duration entry appears if the spell has one. A spell that doesn't list a duration takes place instantaneously, and anything created by it persists after the spell.
    A horizontal line follows defense and duration, and the effects of the spell are described after this line. This section might also detail the possible results of a saving throw: critical success, success, failure, and critical failure.
    **Heightened (rank).** If the spell has special effects when heightened, those effects appear at the end of the stat block.
  properties:
    category: "Spells"
- id: "religion"
  name: "Religion"
  source: "pc > Chapter 4: Skills > Skills > Religion"
  description: |-
    The secrets of deities, dogma, faith, and the realms of divine creatures both sublime and sinister are open to you. You also understand how magic works, though your training imparts a religious slant to that knowledge. Even if you're untrained in Religion, you can use it to Recall Knowledge.
    • Recall Knowledge about divine agents, the finer points of theology, obscure myths regarding a faith, creatures of religious significance (like celestials, fiends, and undead), and the planes tied to religion.
    You must be trained in Religion to use it for the following general skill actions.
    • Decipher Writing of a religious nature, including allegories, homilies, and proverbs.
    • Identify Magic, particularly magic of the divine tradition.
    • Learn a Spell from the divine tradition.
  properties:
    category: "Skills"
- id: "removing-afflictions"
  name: "Removing Afflictions"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Removing Afflictions"
  description: |-
    Apart from waiting them out, afflictions can be removed through certain uses of the skills and spells. The Treat Disease and Treat Poison uses of Medicine are commonly used to treat those afflictions.
    The cleanse affliction spell is also available to most spellcasters. Spells that counteract conditions at the source, such as sound body, can also be effective against diseases and poisons that cause those conditions.
    Curses are trickier, requiring solutions that specifically mention them, such as a 4th-rank cleanse affliction or the Break Curse skill feat.
  properties:
    category: "Playing the Game"
- id: "resistance-rule"
  name: "Resistance"
  source: "pc > Chapter 8: Playing the Game > Immunity, Weakness, and Resistance > Resistance"
  description: |-
    If you have resistance to a type of damage, each time you take that type of damage, reduce the amount of damage you take by the listed number (to a minimum of 0 damage).
    Resistance can specify combinations of damage types or other traits. For instance, you might encounter a monster that's resistant to non-magical bludgeoning damage, meaning it would take less damage from bludgeoning attacks that weren't magical, but would take normal damage from your +1 mace (since it's magical) or a non-magical spear (since it deals piercing damage). A resistance also might have an exception. For example, resistance 10 to physical damage (except silver) would reduce any physical damage by 10 unless that damage was dealt by a silver weapon.
    If you have more than one type of resistance that would apply to the same instance of damage, use only the highest applicable resistance value, as described in weakness.
    It's possible to have resistance to all damage. When an effect deals damage of multiple types and you have resistance to all damage, apply the resistance to each type of damage separately. If an attack would deal 7 slashing damage and 4 fire damage, resistance 5 to all damage would reduce the slashing damage to 2 and negate the fire damage entirely.
  properties:
    category: "Playing the Game"
- id: "rest-and-daily-preparations"
  name: "Rest and Daily Preparations"
  source: "pc > Chapter 8: Playing the Game > Exploration Mode > Rest and Daily Preparations"
  description: |-
    You're at your best when you take time to rest and prepare. Once every 24 hours, you can take a period of rest (typically 8 hours), during which you heal naturally, regaining Hit Points equal to your Constitution modifier (minimum 1) times your level, and you might recover from or improve certain conditions. Sleeping in armor results in poor rest that leaves you fatigued. If you go more than 16 hours without resting, you become fatigued (you can't recover from this fatigue until you rest at least 8 continuous hours).
    After you rest, you make your daily preparations, which takes around 1 hour. You can prepare only if you've rested, and only once per day. During preparations:
    • Spellcasters regain spell slots, and prepared spellcasters choose spells to have available that day.
    • Focus Points, abilities that refresh during preparations, and abilities that can be used only a certain number of times per day, including magic item uses, are reset.
    • You don armor and equip weapons and other gear.
    • You invest up to 10 worn magic items to gain their benefits for the day.
  properties:
    category: "Playing the Game"
- id: "retraining"
  name: "Retraining"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode > Retraining"
  description: |-
    Retraining offers a way to alter your character choices, which is helpful when you want to take your character in a new direction or change decisions that didn't meet your expectations. You can retrain feats, skills, and some selectable class features. You can't retrain your ancestry, heritage, background, class, or attribute modifiers. You can't perform other downtime activities while retraining.
    Retraining usually requires you to spend time learning from a teacher, whether that entails physical training, studying at a library, or falling into shared magical trances. Your GM determines whether you can get proper training or whether something can be retrained at all. In some cases, you'll have to pay your instructor. Some abilities can be difficult or impossible to retrain (for instance, witch can retrain their patron only in extraordinary circumstances).
    When retraining, you generally can't make choices you couldn't make when you selected the original option. For instance, you can't replace a skill feat you chose at 2nd level for a 4th-level one, or for one that requires prerequisites you didn't meet at the time you took the original feat. If you don't remember whether you met the prerequisites at the time, ask your GM to make the call. If you cease to meet the prerequisites for an ability due to retraining, you can't use that ability. You might need to retrain several abilities in sequence in order to get all the abilities you want.
    Feats
    You can spend a week of downtime retraining to swap out one of your feats. Remove the old feat and replace it with another of the same type. For example, you could swap a skill feat for another skill feat, but not for a wizard feat.
    Skills
    You can spend a week of downtime retraining to swap out one of your skill increases. Reduce your proficiency rank in the skill losing its increase by one step and increase your proficiency rank in another skill by one step. The new proficiency rank has to be equal to or lower than the proficiency rank you traded away. For instance, if your bard is a master in Performance and Stealth, and an expert in Occultism, you could reduce the character's proficiency in Stealth to expert and become a master in Occultism, but you couldn't reassign that skill increase to become legendary in Performance. Keep track of your level when you reassign skill increases; the level at which your skill proficiencies changed can influence your ability to retrain feats with skill prerequisites.
    You can also spend a week to retrain an initial trained skill you selected during character creation.
    Class Features
    You can change a class feature that required a choice, making a different choice instead. Some, like changing a spell in your spell repertoire, take a week. The GM will tell you how long it takes to retrain larger choices like a druid order or a wizard school—it is always at least a month.
  properties:
    category: "Playing the Game"
- id: "rules-overview"
  name: "Rules Overview"
  source: "pc > Chapter 8: Playing the Game > Rules Overview"
  description: |-
    Modes of Play
    This game presents three main methods of structuring play. Encounter mode is highly structured and is most often used for combat or stressful situations. Everyone in an encounter rolls initiative to determine the order they act, with highest results going first. A participant takes their turn when their initiative comes up. You can Delay to change when you take your turn.
    Exploration mode takes place over minutes or hours. You use your travel Speed if you're moving, and you engage in exploration activities like Avoiding Notice, Detecting Magic, Scouting, or Searching. You can rest for the night while exploring to recover HP and abilities, and make daily preparations at the start of each day.
    Downtime mode takes place over days. You might make money, train, or recover, among other things.
    Actions
    During an encounter, you get 3 actions and 1 reaction per turn. Icons indicate whether your abilities take a single action [1 action], 2 actions [2 actions], 3 actions [3 actions], a reaction [reaction], or a free action [free action]. Reactions have triggers, allowing you to take them whenever they come up. The Ready basic action lets you prepare to use a single action as a reaction. Free actions can have triggers like reactions; a free action with no trigger can be used like a single action, but don't cost any of your actions for the turn.
    The most important actions to learn are the basic actions. Specialty basic actions come up less frequently, and you typically won't look them up until you need them. Speaking normally doesn't take an action.
    Related: Activities, disrupting actions
    Rolling Checks
    An action that can potentially fail requires rolling a check. Roll a d20 (20-sided die) and identify the modifiers, bonuses, and penalties that apply. Then, calculate the result, compare it to the DC (your target number), and determine the degree of success and the effect.
    Most checks are modified by your attribute modifier (Strength, Dexterity, Constitution, Intelligence, Wisdom, or Charisma) and your proficiency modifier (untrained, trained, expert, master, or legendary) for the statistic. You might get a circumstance, status, or item bonus or penalty as well.
    The degrees of success are critical success, success, failure, and critical failure. You get a success if you meet or exceed the DC, or a critical success if you exceed the DC by 10 or more. If your result is lower than the DC, you get a failure, or a critical failure if you failed by 10 or more.
    Related: Flat checks, fortune and misfortune, secret checks
    Effects
    An effect is the rules term for anything that occurs in the game world. Effects might have limited range, and you may need to designate targets or create areas for your effects. Areas include bursts from a single point, cones blasting out from you, emanations surrounding you or another creature, or straight lines.
    Effects that last for a period of time list a duration. These can last a set increment of time, or can end if certain requirements are met. Many effects apply conditions, which measure advantages or impediments like being blinded, frightened, or invisible.
    Movement
    Your Speed governs how far you can move. Stride is an action that has the move trait and allows you to move a number of feet up to your Speed. You may need to Stride multiple times in a turn! Move actions can often trigger reactions or free actions. However, unlike other actions, a move action can trigger reactions not only when you first use the action, but also for every 5 feet you move during that action. The Step action lets you move without triggering reactions, but only 5 feet. Other basic actions with the move trait include Crawl, Drop Prone, and Stand.
    This game measures movement on a grid. Difficult terrain and other types of terrain may impede your movement.
    Creatures can get tactical advantages by careful positioning. The most common are using cover from terrain and other creatures to increase your AC, and flanking, which requires you and an ally to be on the opposite sides of an enemy to reduce the enemy's AC.
    Related: Escape a grab or restraint, falling, forced movement, moving through creatures, special movement modes (burrow, climb, fly, and swim), travel speed outside of encounters
    Attacking
    Strike actions have the attack trait and allow you to attack with a weapon you're wielding or an unarmed attack (such as a fist). If you're using a melee weapon or unarmed attack, your target must be within your reach; if you're attacking with a ranged weapon, your target must be within your range. Ranged weapons get less effective as you exceed their range increments. Striking multiple times in a turn has diminishing returns. A multiple attack penalty applies to each attack after the first.
    Related: Cover, flanking enemies, spell attacks, targeting creatures
    Defenses
    Your Armor Class (AC) is the main DC used for attacks against you. You might also roll a type of check called a saving throw, also called a save, against spells, afflictions, and a wide variety of other effects. There are three kinds of saving throw: Fortitude, Reflex, and Will.
    Damage
    Attacks, spells, and other dangers deal damage. The amount is typically determined by a damage roll, which can use a variety of sizes and numbers of dice.
    Damage reduces the Hit Points (HP) that measure a creature's overall health or an object's durability. A creature might have immunity to damage or effects of certain kinds, a resistance that reduces the damage it takes, or a weakness that increases damage it takes. These are typically keyed to damage types such as slashing damage or fire damage.
    Related: Persistent damage condition
    Spells
    For a spell that requires an attack roll against the target's AC, you'll calculate your spell attack modifier. For one that causes its subject to attempt a saving throw, you'll need your spell DC.
    Related: Dismiss and Sustain basic actions
    Skills
    Skill checks are required for all sorts of other tasks related to adventuring and life in general. Many exploration activities, such as Avoid Notice and Investigate, also use skill checks.
    Perception and Detection
    Your Perception modifier indicates how good you are at noticing things around you. You typically use the Seek basic action to find physical things or the Sense Motive basic action in social situations. While in exploration mode, the Search activity lets you keep an eye out for things around you.
    Four main conditions indicate how well you can pinpoint and target a creature: observed, hidden, undetected, and unnoticed. A creature with the concealed or invisible condition is harder to find and target.
    Related: Light, special senses
  properties:
    category: "Playing the Game"
- id: "savage-animal-companions"
  name: "Savage Animal Companions"
  source: "pc > Chapter 3: Classes > Companions > Savage Animal Companions"
  description: |-
    To advance a mature animal companion to a savage animal companion:
    - If your companion is Medium or smaller, it grows by one size.
    - Increase its Strength modifier by 2 and its Dexterity, Constitution, and Wisdom modifiers by 1.
    - Increase its proficiency rank in Athletics to expert.
    - It deals 3 additional damage with its unarmed attacks. Its attacks become magical for the purpose of ignoring resistances.
    - It learns the advanced maneuver for its type.
  properties:
    category: "Classes"
- id: "secondary-casters"
  name: "Secondary Casters"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Casting Rituals > Secondary Casters"
  description: "Many rituals need additional secondary casters, who also don't need to be able to cast spells. Unlike a primary caster, a secondary caster doesn't need a minimum level or skill proficiency. The Secondary Casters entry, if present, indicates the minimum number of secondary casters required."
  properties:
    category: "Spells"
- id: "secret-check-rolls"
  name: "Secret Check Rolls"
  source: "pc > Chapter 8: Playing the Game > Checks > Sidebars: Flat Checks & Secret Checks > Secret Checks"
  description: |-
    Sometimes you as the player shouldn't know the exact result and effect of a check. In these situations, the rules (or the GM) will call for a secret check. The secret trait appears on anything that uses secret checks. This type of check uses the same formulas you normally would use for that check, but is rolled by the GM, who doesn't reveal the result. Instead, the GM simply describes the information or effects determined by the check's result. If you don't know a secret check is happening (for instance, if the GM rolls a secret Fortitude save against a poison that you failed to notice), you can't use any fortune or misfortune abilities on that check, but if a fortune or misfortune effect would apply automatically, the GM applies it to the secret check. If you know that the GM is attempting a secret check—as often happens with Recall Knowledge or Seek—you can usually activate fortune or misfortune abilities for that check. Just tell the GM, and they'll apply the ability to the check.
    The GM can choose to make any check secret, even if it's not usually rolled secretly. Conversely, the GM can let you roll any check yourself, even if that check would usually be secret. Some groups find it simpler to have players roll all secret checks and just try to avoid acting on any out-of-character knowledge, while others enjoy the mystery.
  properties:
    category: "Playing the Game"
- id: "secret-checks"
  name: "Secret Checks"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs > Secret Checks"
  description: "Sometimes you won't know whether you have succeeded at a skill check. If an action has the secret trait, the GM rolls the check for you and informs you of the effect without revealing the result of the roll or the degree of success. The GM rolls secret checks when your knowledge about the outcome is imperfect, like when you're searching for a hidden creature or object, attempting to deceive someone, translating a tricky bit of ancient text, or remembering some piece of lore. This way, you as the player don't know things that your character wouldn't. This rule is the default for actions with the secret trait, but the GM can choose not to use secret checks if they would rather some or all rolls be public."
  properties:
    category: "Skills"
- id: "selecting-familiar-and-master-abilities"
  name: "Selecting Familiar and Master Abilities"
  source: "pc > Chapter 3: Classes > Familiars > Selecting Familiar and Master Abilities"
  description: "Instead of choosing two abilities only when you gain your familiar as you do with a normal pet, you can choose the two abilities each day during your daily preparations. You can choose from familiar abilities and master abilities. You can choose the pet abilities from the feat as familiar abilities as well. You can't swap out abilities that are innate to your familiar. For example, you couldn't choose not to give a raven familiar flying."
  properties:
    category: "Classes"
- id: "senses"
  name: "Senses"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection > Senses"
  description: |-
    The ways a creature can use Perception depend on what senses it has. The primary concepts you need to know for understanding senses are precise senses, imprecise senses, and the three states of detection a target can be in: observed, hidden, or undetected. Vision, hearing, and scent are three prominent senses, but each has a different degree of acuity.
    Precise Senses
    Average vision is a precise sense—a sense that can be used to perceive the world in nuanced detail. The only way to target a creature without having drawbacks is to use a precise sense. You can usually detect a creature automatically with a precise sense unless that creature is hiding or obscured by the environment, in which case you can use the Seek basic action to better detect the creature.
    Imprecise Senses
    Average hearing is an imprecise sense—it can't detect the full range of detail that a precise sense can. You can usually sense a creature automatically with an imprecise sense, but it has the hidden condition instead of the observed condition. It might be undetected by you if it's using Stealth or is in an environment that distorts the sense, such as a noisy room in the case of hearing. In those cases, you have to use the Seek basic action to detect the creature. At best, an imprecise sense can be used to make an undetected creature (or one you didn't even know was there) merely hidden—it can't make the creature observed.
    Vague Senses
    A character also has many vague senses—ones that can alert you that something is there but aren't useful for zeroing in on it to determine exactly what it is. The most useful of these for a typical character is the sense of smell. At best, a vague sense can be used to detect the presence of an unnoticed creature, making it undetected. Even then, the vague sense isn't sufficient to make the creature hidden or observed.
    When one creature might detect another, the GM almost always uses the most precise sense available.
    The rules assume that a given creature has vision as its only precise sense and hearing as its only imprecise sense. Some characters and creatures, however, have precise or imprecise senses that don't match this assumption. For instance, a character with poor vision might treat that sense as imprecise, an animal with the scent ability can use its sense of smell as an imprecise sense, and a creature with echolocation or a similar ability can use hearing as a precise sense. Such senses are often given special names and appear as "echolocation (precise),""scent (imprecise) 30 feet," etc.
  properties:
    category: "Playing the Game"
- id: "services"
  name: "Services"
  source: "pc > Chapter 6: Equipment > Gear > Services"
  description: |-
    The services listed on Basic Services and Cuisine describe expenditures that can come up during travels and time spent in settlements.
    Basic Services and Cuisine
    Item Price Bulk Hands
    Beverages
    Mug of ale 1 cp L 1
    Keg of ale 2 sp 2 2
    Pot of coffee or tea 2 cp L 1
    Bottle of wine 1 sp L 1
    Bottle of fine wine 1 gp L 1
    Lodging (1 day)
    Floor space 3 cp
    Bed (for 1) 1 sp
    Private room (for 2) 8 sp
    Extravagant suite (for 6) 10 gp
    Meals
    Poor meal 1 cp L 2
    Square meal 3 cp L 2
    Fine dining 1 gp L 2
    Stabling (1 day) 2 cp
    Toll at least 1 cp
    Transportation (per 5 miles)
    Caravan 3 cp
    Carriage 2 sp
    Ferry or riverboat 4 cp
    Ship 6 cp
  properties:
    category: "Equipment"
- id: "setting-triggers"
  name: "Setting Triggers"
  source: "pc > Chapter 7: Spells > Setting Triggers"
  description: |-
    If a spell is meant to respond only to certain events or under certain conditions, it might require you to set a trigger. This is a simple sensory cue that causes the spell to activate. The spell activates as a reaction when the spell's sensor observes something that fits its trigger. Depending on the spell, the trigger might be the presence of a type of creature, such as "red-bearded dwarven men," or it could be an observed action, such as "whenever someone enters the spell's area."
    Disguises and illusions fool the spell as long as they appear to match its parameters. For a spell to detect something visually, the spell's origin point must have line of sight. Darkness doesn't prevent this, but invisibility does, as does a successful Stealth check to Hide (against the spell's DC). For auditory detection, line of sight isn't necessary, though the sound must be audible at the spell's origin point. A Stealth check to Sneak can fool the sensor.
  properties:
    category: "Spells"
- id: "shield-statistics"
  name: "Shield Statistics"
  source: "pc > Chapter 6: Equipment > Shields > Shield Statistics"
  description: |-
    Shields have statistics that follow the same rules as armor: Price, Speed Penalty, and Bulk. See Armor Statistics for the rules for those statistics. Their other statistics are described here.
    AC Bonus
    A shield grants a circumstance bonus to AC, but only when the shield is raised. This requires using the Raise a Shield action.
    Hardness
    Whenever a shield takes damage, the amount of damage it takes is reduced by this amount. This number is particularly relevant for shields because of the Shield Block feat. The rules for Hardness appear in Item Damage.
    HP (BT)
    This column lists the shield's Hit Points (HP) and Broken Threshold (BT). These measure how much damage the shield can take before it's destroyed (its total HP) and how much it can take before being broken and unusable (its BT). These matter primarily for the Shield Block reaction.
  properties:
    category: "Equipment"
- id: "shields"
  name: "Shields"
  source: "pc > Chapter 6: Equipment > Shields"
  description: |-
    Raise a Shield is the action most commonly used with shields. All shields, unless specifically noted or described otherwise, must be strapped to your arm and held in one hand, so you can't hold anything with that hand and Raise a Shield, and you lose the shield's benefits if that hand is no longer free. A buckler, however, doesn't take up your hand, so you can Raise a Shield with a buckler if the hand is free (or, at the GM's discretion, if it's holding a simple, lightweight object that's not a weapon).
    When you have a tower shield raised, you can use the Take Cover action to increase the circumstance bonus to AC to +4. This lasts until the shield is no longer raised, or until any of the normal conditions that end Take Cover, whichever comes first. If you would provide lesser cover against an attack, having your tower shield raised provides standard cover against it (and other creatures can Take Cover as normal using the cover from your shield).
    If you have access to the Shield Block reaction (from your class or from a feat), you can use it while Raising your Shield to reduce the damage you take by an amount equal to the shield's Hardness. Both you and the shield then take any remaining damage.
  properties:
    category: "Equipment"
- id: "shoddy-items"
  name: "Shoddy Items"
  source: "pc > Chapter 6: Equipment > Shoddy Items"
  description: |-
    Improvised or of dubious make, shoddy items are never available for purchase except for in the most desperate of communities. When available, a shoddy item usually costs half the Price of a standard item, though you can never sell one.
    Attacks and checks involving a shoddy item take a -2 item penalty. This penalty also applies to any DCs that a shoddy item applies to (such as the AC provided when wearing shoddy armor, or the DC to break out of shoddy manacles). A shoddy suit of armor also worsens the armor's check penalty by 2. A shoddy item's Hit Points and Broken Threshold are each half that of a normal item of its type.
  properties:
    category: "Equipment"
- id: "shopping-and-crafting"
  name: "Shopping and Crafting"
  source: "pc > Chapter 8: Playing the Game > Downtime Mode > Shopping and Crafting"
  description: |-
    If you're at a location with shops that buy or sell magic items, you can buy, sell, or trade. Ask the GM what types of shopping options are available to you—it can vary greatly depending where you're spending your downtime!
    Because of the complexities of finding shops that are looking for items you want to sell or that offer ones you want to buy, dedicated shopping takes 1 day of downtime. It might take longer if you're selling a large number of goods, expensive items that require a wealthy buyer, or items that aren't in high demand.
    The Price of an item indicates the full cost to buy it. You can sell an item for half its Price. The GM might adjust these once in a while due to supply and demand or the particular merchants you're dealing with.
    Item Crafting
    You can spend downtime to use the Craft skill activity, making new items out of raw materials. Crafting can be an excellent way to refine the gear the party uses, including upgrading items and preparing ones you're likely to need on an upcoming quest.
  properties:
    category: "Playing the Game"
- id: "sign-language-rule"
  name: "Sign Language"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Languages > Sign Language"
  description: "The language entry for most characters lists languages they use to communicate in spoken words. However, you might know the signed languages associated with the languages you know, or how to read lips. You can learn these by taking the Sign Language or Read Lips skill feats, or both. If you are creating a character who is deaf, hard of hearing, or unable to speak, discuss with your GM whether it makes sense for your character to know sign languages or lip reading. If so, your GM might allow you to select one of these feats for free (even if you don't meet the prerequisites) to represent your character concept."
  properties:
    category: "Languages"
- id: "skill-actions"
  name: "Skill Actions"
  source: "pc > Chapter 4: Skills > Skill Actions"
  description: |-
    The actions you can perform with a given skill are sorted into those you can use untrained and those that require you to be trained in the skill. The untrained and trained actions of each skill appear in separate sections within the skill's description.
    Anyone can use a skill's untrained actions, but you can use trained actions only if you have a proficiency rank of trained or better in that skill. A circumstance, condition, or effect might bar you from a skill action regardless of your proficiency rank, and sometimes using a skill in a specific situation might require you to have a higher proficiency rank than the action usually does. For instance, even though a fighter untrained in Arcana could identify a construct with a lucky roll using Arcana to Recall Knowledge, the GM might decide that Recalling Knowledge to determine the spells used to create such a construct is beyond the scope of the fighter's anecdotal knowledge. The GM decides whether a task requires a particular proficiency rank.
  properties:
    category: "Skills"
- id: "skill-checks"
  name: "Skill Checks"
  source: "pc > Chapter 8: Playing the Game > Checks > Skill Checks"
  description: |-
    The game has a variety of skills, from Athletics to Medicine to Occultism. Each grants you a set of related actions that rely on you rolling a skill check. Each skill has a key attribute modifier, based on the scope of the skill in question. For instance, Athletics deals with feats of physical prowess, like swimming and jumping, so its key attribute modifier is Strength. Medicine deals with the ability to diagnose and treat wounds and ailments, so its key attribute modifier is Wisdom. No matter which skill you're using, you calculate a check for it using the following formula.
    Skill check result = d20 roll + the skill's key attribute modifier + proficiency bonus + other bonuses + penalties
    You're unlikely to be trained in every skill. As normal, when using a skill in which you're untrained, your proficiency bonus is +0; otherwise, it equals your level plus 2 for trained, or higher once you become expert or better. The proficiency rank is specific to the skill you're using. Aid from another character or some other beneficial situation may grant you a circumstance bonus. A status bonus might come from a helpful spell or magical effect. Sometimes tools related to the skill grant you an item bonus to your skill checks. Conversely, unfavorable situations might give you a circumstance penalty to your skill check, while harmful spells, magic, or conditions might also impose a status penalty. Using shoddy or makeshift tools might cause you to take an item penalty. Sometimes a skill action can be an attack, and in these cases, the skill check might take a multiple attack penalty.
    When an ability calls for you to use the DC for a specific skill, you can calculate it by adding 10 + your total modifier for that skill.
  properties:
    category: "Playing the Game"
- id: "skill-checks-and-dcs"
  name: "Skill Checks and DCs"
  source: "pc > Chapter 4: Skills > Skill Checks and DCs"
  description: |-
    When you're actively using a skill, often by performing one of its actions, you might attempt a skill check: rolling a d20 and adding your skill modifier. To determine this modifier, add your attribute modifier for the skill's key attribute, your proficiency bonus for the skill, and any other bonuses and penalties.
    Skill modifier = skill's key attribute modifier + proficiency bonus + other bonuses + penalties
    When noting the modifier on your character sheet, you should write down only the numbers that always apply—typically just your attribute modifier and proficiency bonus at 1st level. At higher levels, you may wear or use items to improve your skills with item bonuses pretty much all the time; you should include those in your calculation, too.
    The GM sets the DC of a skill check. The DCs you're most likely to encounter frequently are the five simple skill DCs below, which are presented here to give you a sense of what number you'll need to roll to succeed at most tasks.
    Task Difficulty Simple DC
    Untrained 10
    Trained 15
    Expert 20
    Master 30
    Legendary 40
    When someone or something tests your skill, they attempt a check against your skill DC, which is equal to 10 plus your skill modifier. A skill DC works like any other DC to determine the effect of an opposing creature's skill action.
  properties:
    category: "Skills"
- id: "skill-descriptions"
  name: "Skill Descriptions"
  source: "pc > Chapter 4: Skills > Skills"
  description: |-
    A brief description of the skill is followed by a list of actions anyone can use, and then the actions you can perform only if you are trained in that skill. Some actions list sample tasks for each rank to give you a better sense of what you can accomplish as your proficiency increases. As the actions of a skill aren't comprehensive, there may be times when the GM asks you to attempt a skill check without using any of the listed actions, or times when the GM asks you to roll using a different key attribute modifier.
    Most skills include entries for success and failure, as well as descriptions of what occurs on a critical success or a critical failure. If either of the critical entries is absent, treat those results as a success or failure, as normal.
  properties:
    category: "Skills"
- id: "skills"
  name: "Skills"
  source: "pc > Chapter 4: Skills"
  description: |-
    A character's acumen in skills can come from all sorts of training, from practicing acrobatic tricks to studying academic topics to rehearsing a performing art. When you create your character and as they advance in level, you have flexibility as to which skills they become better at and when. Some classes depend heavily on certain skills—such as the bard's reliance on Performance—but for most classes, you can choose whichever skills make the most sense for your character's theme and backstory at 1st level, then use their adventure and downtime experiences to inform how their skills should improve as your character levels up.
    A character gains training in certain skills at 1st level: typically two from their background, a small number of predetermined skills from their class, and several skills of your choice granted by their class. This training increases your proficiency ranks for those skills to trained instead of untrained and lets you use more of the skills' actions. Sometimes you might become trained in the same skill from multiple sources, such as if your background granted training in Survival and you took the ranger class, which also grants training in Survival. Each time after the first that you'd become trained in a given skill, you instead allocate the trained proficiency to any other skill of your choice—though if the skill is a Lore skill, the new skill must also be a Lore skill.
  properties:
    category: "Skills"
- id: "society"
  name: "Society"
  source: "pc > Chapter 4: Skills > Skills > Society"
  description: |-
    You understand the people and systems that make civilization run, and you know the historical events that make societies what they are today. Further, you can use that knowledge to navigate the complex physical, societal, and economic workings of settlements. Even if you're untrained in Society, you can use it for the following general skill actions.
    • Recall Knowledge about local history, important personalities, legal institutions, societal structure, and humanoid cultures. The GM might allow Society to apply to other creatures that are major elements of society in your region, such as the draconic nobility in a kingdom of humans ruled by dragons.
    • Subsist in a settlement by finding shelter, scrounging, or begging for food.
    You must be trained in Society to use it to Decipher Writing.
    • Decipher Writing that's a coded message, text written in an incomplete or archaic form, or in some cases, text in a language you don't know.
  properties:
    category: "Skills"
- id: "speaking"
  name: "Speaking"
  source: "pc > Chapter 8: Playing the Game > Actions > Basic Actions > Sidebar: Speaking"
  description: "As long as you can act, you can also speak. You don't need to spend any type of action to speak, but because a round represents 6 seconds of time, you can usually speak at most a single sentence or so per round. Special uses of speech, such as attempting a Deception skill check to Lie, require spending actions and follow their own rules. All speech has the auditory trait. If you communicate in some way other than speech, other rules might apply. For instance, using sign language is visual instead of auditory."
  properties:
    category: "Playing the Game"
- id: "special-archetypes"
  name: "Special Archetypes"
  source: "pc > Chapter 3: Classes > Archetypes > Special Archetypes"
  description: "Some archetype feats have the skill trait, allowing you to take them in place of a skill feat rather than a class feat. A skill feat still counts to satisfy the requirement of the dedication. There are also class archetypes that can modify your class's abilities as soon as 1st level. You can never have more than one class archetype."
  properties:
    category: "Classes"
- id: "special-battles"
  name: "Special Battles"
  source: "pc > Chapter 8: Playing the Game > Encounter Mode > Special Battles"
  description: |-
    Mounted Combat
    You can ride some creatures into combat. As noted in the Mount specialty basic action, your mount needs to be willing and at least one size larger than you. Your mount acts on your initiative. You must use the Command an Animal action to get your mount to spend its actions. If you don't, the animal wastes its actions. If you have the Ride general feat, you succeed automatically when you Command an Animal that's your mount.
    For example, if you are mounted on a horse and you make three attacks, your horse would remain stationary since you didn't command it. If you instead spent your first action to Command an Animal and succeeded, you could get your mount to Stride. You could spend your next action to attack or to command the horse to attack, but not both.
    Mounted Attacks
    You and your mount fight as a unit. Consequently, you share a multiple attack penalty. For example, if you Strike and then Command an Animal to have your mount Strike, your mount's attack takes a -5 multiple attack penalty.
    You occupy every square of your mount's space for the purpose of making attacks. If you were a Medium creature on a Large mount, you could attack a creature on one side of your mount, then attack on the opposite side. On a Medium or smaller mount, use the normal reach of an attack. On a Large or Huge mount, you can attack any square adjacent to the mount if you have 5- or 10-foot reach, or any square within 10 feet of the mount (including diagonally) if you have 15-foot reach. Use the adjusted reach for determining flanking and other rules that depend on reach.
    Mounted Defenses
    Attackers can target either you or your mount. An area effect affects both of you as long as you're both in the area. You are in an attacker's reach or range if any square of your mount is within reach or range. Because your mount is larger than you and you share its space, you have lesser cover against attacks targeting you when you're mounted if the mount would be in the way (as determined by the GM).
    Because you can't move your body as freely while you're riding a mount, you take a -2 circumstance penalty to Reflex saves while mounted. Additionally, the only move action you can use is the Mount action to dismount.
    Aerial Combat
    Many monsters can fly, and PCs can use spells and items to gain the ability to fly. Flying creatures have to use the Fly action to move through the air. Performing an especially tricky maneuver might require using Acrobatics to Maneuver in Flight. Creatures might fall from the sky, using the falling rules. At the GM's discretion, some ground-based actions might not work in the air. For instance, a flying creature couldn't Leap.
    Aquatic Combat
    Use these rules for battles in water or underwater:
    • You're off-guard unless you have a swim Speed.
    • You gain resistance 5 to acid and fire.
    • You take a -2 circumstance penalty to your attack roll for bludgeoning or slashing attacks that pass through water.
    • Ranged attacks made by an underwater creature or against an underwater target have their range increments halved.
    • You can't cast fire spells or use actions with the fire trait underwater. As normal for how traits work, any part of the effect that's unrelated to fire still works. For example, an attack with a flaming battle axe could still deal its physical damage, just not its fire damage.
    • At the GM's discretion, some ground-based actions might not work underwater or while floating.
    Drowning and Suffocating
    You can hold your breath for a number of rounds equal to 5 + your Constitution modifier. Reduce your remaining air by 1 round at the end of each of your turns, or by 2 if you attacked or cast any spells that turn. You also lose 1 round worth of air each time you are critically hit or critically fail a save against a damaging effect. If you speak (including Casting a Spell) you lose all remaining air.
    When you run out of air, you fall unconscious and start suffocating. You can't recover from being unconscious and must attempt a DC 20 Fortitude save at the end of each of your turns. On a failure, you take 1d10 damage, and on a critical failure, you die. On each check after the first, the DC increases by 5 and the damage by 1d10; these increases are cumulative. Once your access to air is restored, you stop suffocating and are no longer unconscious (unless you're at 0 Hit Points).
  properties:
    category: "Playing the Game"
- id: "special-senses"
  name: "Special Senses"
  source: "pc > Chapter 8: Playing the Game > Perception and Detection > Special Senses"
  description: |-
    While a human might have a difficult time making creatures out in dim light, an elf can see those creatures just fine. And though elves have no problem seeing on a moonlit night, their vision can't penetrate complete darkness, whereas a dwarf's can. Special senses allow a creature to ignore or reduce the effects of the undetected, hidden, or concealed conditions when it comes to situations that foil average vision.
    Darkvision and Greater Darkvision
    A creature with darkvision or greater darkvision can see perfectly well in areas of darkness and dim light, though such vision is in black and white only. Some forms of magical darkness, such as a 4th-rank darkness spell, block normal darkvision. A creature with greater darkvision, however, can see through even these forms of magical darkness.
    Low-Light Vision
    A creature with low-light vision can see in dim light as though it were bright light, so it ignores the concealed condition due to dim light.
    Scent
    Scent involves sensing creatures or objects by smell, and is usually a vague sense. The range is listed in the ability, and it functions only if the creature or object being detected emits an aroma. If a creature emits a heavy aroma or is upwind, the GM can double or even triple the range of scent abilities used to detect that creature, and the GM can reduce the range if a creature is downwind.
    Tremorsense
    Tremorsense allows a creature to feel the vibrations through a solid surface caused by movement. It is usually an imprecise sense with a limited range (listed in the ability). Tremorsense functions only if the detecting creature is on the same surface as the subject, and only if the subject is moving along (or burrowing through) the surface.
  properties:
    category: "Playing the Game"
- id: "specialized-animal-companions"
  name: "Specialized Animal Companions"
  source: "pc > Chapter 3: Classes > Companions > Specialized Animal Companions"
  description: |-
    Specialized animal companions are more intelligent and engage in more complex behaviors. Most animal companions can have only one specialization. The first time an animal gains a specialization, it also gains the following.
    - Its proficiency rank for unarmed attacks increases to expert.
    - Its proficiency ranks for saving throws and Perception increase to master.
    - Increase its Dexterity modifier by 1 and its Intelligence modifier by 2.
    - Its unarmed attack damage increases from two dice to three dice, and it increases its additional damage with unarmed attacks from 2 to 4 or from 3 to 6.
    - The extra benefit of the specialization listed below.
    Ambusher: In your companion's natural environment, it can use a Sneak action even if it's currently observed. Its proficiency rank in Stealth increases to expert (or master if it was already an expert from its type), and its Dexterity modifier increases by 1. Its proficiency rank for unarmored defense increases to expert.
    Bully: Your companion terrorizes foes with dominance displays and pushes them around the battlefield. Its proficiency ranks for Athletics and Intimidation increase to expert (or master if it was already expert from its type), its Strength modifier increases by 1, and its Charisma modifier increases by 3.
    Daredevil: Your companion joins the fray with graceful leaps and dives. It gains the deny advantage ability, so it isn't off-guard to hidden, undetected, or flanking creatures unless such a creature's level is greater than yours. Its proficiency rank in Acrobatics increases to master, and its Dexterity modifier increases by 1. Its proficiency rank in unarmored defense increases to expert.
    Racer: Your companion races. It gains a +10-foot status bonus to its Speed, swim Speed, or fly Speed (your choice). Its proficiency in Fortitude saves increases to legendary, and its Constitution modifier increases by 1.
    Tracker: Your companion is an incredible tracker. It can move at full Speed while following tracks. Its proficiency rank in Survival increases to expert (or master if it was already an expert from its type), and its Wisdom modifier increases by 1.
    Wrecker: Your companion smashes things. Its unarmed attacks ignore half an object's Hardness. Its Athletics proficiency increases to master, and its Strength modifier increases by 1.
  properties:
    category: "Classes"
- id: "specialty-basic-actions"
  name: "Specialty Basic Actions"
  source: "pc > Chapter 8: Playing the Game > Actions > Basic Actions"
  description: "These actions are useful under specific circumstances. The Arrest a Fall, Burrow, and Fly actions require you to have a special movement type. The climb and swim Speeds use the corresponding actions from the Athletics skill."
  properties:
    category: "Playing the Game"
- id: "spell-attack-rolls"
  name: "Spell Attack Rolls"
  source: "pc > Chapter 8: Playing the Game > Checks > Spell Attack Rolls"
  description: |-
    If you cast spells, you might need to make a spell attack roll. These rolls are usually made when you cast a spell that targets a creature's AC.
    The attribute modifier for a spell attack roll depends on how you gained the spell. If your class grants you spellcasting, use your key attribute modifier (such as Intelligence for a wizard). Innate spells use your Charisma modifier unless the ability that granted them states otherwise. Focus spells and other sources of spells specify which attribute modifier you use for spell attack modifiers in the ability that granted them. If you have spells from multiple sources or traditions, you might use different attribute modifiers for spell attack modifiers for these different sources of spells. For example, a dwarf cleric with the Stonewalker ancestry feat would use her Charisma modifier when casting one with stone from that feat, since it's a divine innate spell, but she would use her Wisdom modifier when casting heal and other spells using her cleric divine spellcasting.
    If you have the ability to cast spells, you'll have a proficiency rank for your spell attack modifier, so you'll always add a proficiency bonus. Spell attack rolls can benefit from circumstance bonuses and status bonuses, though item bonuses to spell attack rolls are rare. Penalties affect spell attack rolls just like any other attack roll—including your multiple attack penalty.
    Calculate a spell attack roll with the following formula. Spell attack roll result = d20 roll + spellcasting attribute modifier + proficiency bonus + other bonuses + penalties
  properties:
    category: "Playing the Game"
- id: "spell-attacks"
  name: "Spell Attacks"
  source: "pc > Chapter 7: Spells > Spell Attacks"
  description: |-
    Some spells require you to succeed at a spell attack roll to affect the target. This is usually because they require you to precisely aim a ray or otherwise make an accurate attack. A spell attack roll is compared to the target's AC. Spell attack rolls benefit from any bonuses or penalties to attack rolls, including your multiple attack penalty, but not any special benefits or penalties that apply only to weapon or unarmed attacks. Spell attacks don't deal any damage beyond what's listed in the spell description.
    In rare cases, a spell might have you make some other type of attack, such as a weapon Strike. Such attacks use the normal rules and attack bonus for that type of attack.
  properties:
    category: "Spells"
- id: "spell-dc"
  name: "Spell DC"
  source: "pc > Chapter 8: Playing the Game > Checks > Spell DC"
  description: "Many times, instead of requiring you to make a spell attack roll, the spells you cast will require those within the area or targeted by the spell to attempt a saving throw against your spell DC to determine how the spell affects them. Calculate it using the following formula. Spell DC = 10 + spellcasting attribute modifier + proficiency bonus + other bonuses + penalties"
  properties:
    category: "Playing the Game"
- id: "spell-slots"
  name: "Spell Slots"
  source: "pc > Chapter 7: Spells > Spell Slots"
  description: "Characters of spellcasting classes can cast a number of spells each day; the spells you can cast in a day are referred to as spell slots. At 1st level, a character has only a small number of 1st-rank spell slots per day, but as you advance in level, you gain more spell slots of higher rank. A spell's rank indicates its overall power, from 1 to 10."
  properties:
    category: "Spells"
- id: "spellcasters-with-focus-spells"
  name: "Spellcasters with Focus Spells"
  source: "pc > Chapter 7: Spells > Focus Spells > Spellcasters with Focus Spells"
  description: "If you are a spellcaster, your focus spells are the same tradition of spell as the class that gave you the focus spell. A bard's are occult, a cleric's are divine, a druid's are primal, a wizard's are arcane, and a witch's are determined by their patron."
  properties:
    category: "Spells"
- id: "spellcasting"
  name: "Spellcasting"
  source: "pc > Chapter 7: Spells"
  description: "With special gestures and utterances, a spellcaster can call forth mystic energies, warp the mind, protect themself against danger, or even create something from nothing. Each class has its own method of learning, preparing, and casting spells, and every individual spell produces a specific effect, so learning new spells gives a spellcaster an increasing array of options to accomplish their goals."
  properties:
    category: "Spells"
- id: "spellcasting-archetypes"
  name: "Spellcasting Archetypes"
  source: "pc > Chapter 3: Classes > Archetypes > Spellcasting Archetypes"
  description: |-
    Some archetypes grant you a substantial degree of spellcasting, albeit delayed compared to a character from a spellcasting class. The spellcasting ability from a spellcasting archetype also allows you to use Cast a Spell activations of items (such as scrolls, staves, and wands).
    Spellcasting archetypes always grant the ability to cast cantrips in their dedication, and then they have a basic spellcasting feat, an expert spellcasting feat, and a master spellcasting feat. These feats share their name with the archetype; for instance, the druid's master spellcasting feat is called Master Druid Spellcasting. All spell slots you gain from spellcasting archetypes are subject to the restrictions within the archetype. For instance, the witch archetype allows you to pick a patron when you take its dedication feat. If you pick patron granting occult spells, the archetype then grants you spell slots you can use only to cast occult spells you prepare as a witch, even if you are a bard with occult spells in your repertoire.
    Basic Spellcasting Feat: Usually available at 4th level, these feats grant a 1st-rank spell slot. At 6th level, they grant you a 2nd-rank spell slot, and if you have a spell repertoire, you can select one spell from your repertoire as a signature spell. At 8th level, they grant you a 3rd-rank spell slot. Archetypes refer to these benefits as the "basic spellcasting benefits."
    Expert Spellcasting Feat: Typically taken at 12th level, these feats make you an expert in spell attack modifier and spell DC and grant you a 4th-rank spell slot. If you have a spell repertoire, you can select a second spell from your repertoire as a signature spell. At 14th level, they grant you a 5th-rank spell slot, and at 16th level, they grant you a 6th-rank spell slot. Archetypes refer to these benefits as the "expert spellcasting benefits."
    Master Spellcasting Feat: Usually found at 18th level, these feats make you a master in spell attack modifier and spell DC and grant you a 7th-rank spell slot. If you have a spell repertoire, you can select a third spell from your repertoire as a signature spell. At 20th level, they grant you an 8th-rank spell slot. Archetypes refer to these benefits as the "master spellcasting benefits."
  properties:
    category: "Classes"
- id: "spellcasting-services"
  name: "Spellcasting Services"
  source: "pc > Chapter 6: Equipment > Gear > Services > Spellcasting"
  description: |-
    Spellcasting services are uncommon. Having a spell cast for you requires finding a spellcaster who knows and is willing to cast it. It's hard to find someone who can cast higher-rank spells, and uncommon spells typically cost at least 100% more, if you can find someone who knows them at all. Spells that take a long time to cast (over 1 minute) usually cost 25% more. You must pay any cost listed in the spell in addition to the Price on the table.
    Spellcasting Services
    Spell Rank Price* Spell Rank Price*
    1st 3 gp 6th 160 gp
    2nd 7 gp 7th 360 gp
    3rd 18 gp 8th 720 gp
    4th 40 gp 9th 1,800 gp
    5th 80 gp
    * Plus any cost required to cast the specific spell.
  properties:
    category: "Equipment"
- id: "spontaneous-spells"
  name: "Spontaneous Spells"
  source: "pc > Chapter 7: Spells > Spell Slots > Spontaneous Spells"
  description: "If you're a spontaneous spellcaster—such as a bard—you choose which spell from your spell repertoire that you're using a spell slot for at the moment you decide to cast it. This provides you with more freedom in your spellcasting, but you have fewer spells in your spell repertoire, as determined by your character level and class. When you make your daily preparations, all your spell slots are refreshed, but you don't get to change the spells in your repertoire."
  properties:
    category: "Spells"
- id: "staging-a-performance"
  name: "Staging a Performance"
  source: "pc > Chapter 4: Skills > General Skill Actions"
  description: |-
    You perform for an audience to make money. The available audiences determine the level of your task, since more discerning audiences are harder to impress but provide a bigger payout. The GM determines the task level based on the audiences available. Performing for a typical audience of commoners on the street is a level 0 task, but a performance for a group of artisans with more refined tastes might be a 2nd- or 3rd-level task, and ones for merchants, nobility, and royalty are increasingly higher level.
    Your degree of success determines whether you moved your audience and whether you were rewarded with applause or rotten fruit.
  properties:
    category: "Skills"
- id: "stealth"
  name: "Stealth"
  source: "pc > Chapter 4: Skills > Skills > Stealth"
  description: "You are skilled at avoiding detection, allowing you to slip past foes, hide, or conceal an item."
  properties:
    category: "Skills"
- id: "step-1-roll-d20"
  name: "Step 1: Roll D20"
  source: "pc > Chapter 8: Playing the Game > Checks > Step 1: Roll D20"
  description: |-
    Start by rolling your d20. You'll then identify all the relevant modifiers, bonuses, and penalties that apply. A modifier can be either positive or negative, but a bonus is always positive, and a penalty is always negative. The sum of all the modifiers, bonuses, and penalties you apply to the d20 roll is called your total modifier for that statistic.
    Attribute Modifier
    Nearly all checks allow you to add an attribute modifier to the roll. Attribute modifiers represent your raw capability. Exactly which attribute modifier you use is determined by what you're trying to accomplish. Usually, a sword swing applies your Strength modifier, whereas remembering the name of the earl's cousin uses your Intelligence modifier.
    Bonuses
    When attempting a check that involves something you have some training in, you will also add your proficiency bonus. This bonus depends on your proficiency rank: untrained, trained, expert, master, or legendary. If you're untrained, your bonus is +0—you must rely on raw talent and any bonuses from the situation. Otherwise, the bonus equals your character's level plus a certain amount depending on your rank. If your proficiency rank is trained, this bonus is equal to your level + 2, and higher proficiency ranks further increase the amount you add to your level.
    Proficiency Rank Proficiency Bonus
    Untrained 0
    Trained Your level + 2
    Expert Your level + 4
    Master Your level + 6
    Legendary Your level + 8
    There are three other types of bonus that frequently appear: circumstance bonuses, item bonuses, and status bonuses. If you have different types of bonuses that would apply to the same roll, you'll add them all. But if you have multiple bonuses of the same type, you can use only the highest bonus on a given roll—they aren't cumulative. For instance, if you have both a proficiency bonus and an item bonus, you add both to your d20 result, but if you have two item bonuses, you add only the higher of the two.
    Circumstance bonuses involve the situation you find yourself in when attempting a check. For instance, using Raise a Shield with a buckler grants you a +1 circumstance bonus to AC. Being behind cover grants you a +2 circumstance bonus to AC.
    Item bonuses are granted by some item that you are wearing or using, either mundane or magical. For example, armor gives you an item bonus to AC, while an expanded alchemist's toolkit grants you an item bonus to Crafting checks when making alchemical items.
    Status bonuses typically come from spells, other magical effects, or something applying a helpful, often temporary, condition to you. For instance, the 3rd-rank heroism spell grants a +1 status bonus to attack rolls, Perception checks, saving throws, and skill checks.
    Penalties
    Penalties work very much like bonuses. You can have circumstance penalties, status penalties, and sometimes even item penalties. Like bonuses of the same type, you take only the worst all of various penalties of a given type. However, you can apply both a bonus and a penalty of the same type on a single roll. For example, if you had a +1 status bonus from a heroism spell but a -2 status penalty from the sickened condition, you'd apply them both to your roll—so heroism still helps even though you're feeling unwell.
    Unlike bonuses, penalties can also be untyped, in which case they won't be classified as "circumstance," "item," or "status." Unlike other penalties, you always add all your untyped penalties together rather than simply taking the worst one. For instance, when you use attack actions, you incur a multiple attack penalty on each attack you make on your turn after the first attack of the turn, and when you attack a target that's beyond your weapon's normal range increment, you incur a range penalty on the attack. Because these are both untyped penalties, if you make multiple attacks at a faraway target, you'd apply both the multiple attack penalty and the range penalty to your roll.
    Once you've identified all your various modifiers, bonuses, and penalties, you move on to the next step.
  properties:
    category: "Playing the Game"
- id: "step-1-roll-damage-dice"
  name: "Step 1: Roll Damage Dice"
  source: "pc > Chapter 8: Playing the Game > Damage Rolls > Step 1: Roll Damage Dice"
  description: |-
    Your weapon, unarmed attack, spell, or even a magic item determines what size and number of dice you roll for damage. For instance, if you're using a normal longsword, you'll roll 1d8. If you're casting a 3rd-rank fireball spell, you'll roll 6d6. Sometimes, especially in the case of weapons, you'll apply modifiers, bonuses, and penalties to the damage.
    Damage rolls for melee weapons and unarmed attacks typically add your Strength attribute modifier.
    Melee damage roll = damage die of weapon or unarmed attack + Strength modifier + bonuses + penalties
    Damage rolls for ranged weapons typically don't add an attribute modifier, though you add your Strength modifier to damage rolls for thrown weapons or half the modifier to damage rolls for ranged weapons with the propulsive trait.
    Ranged damage roll = damage die of weapon (+ Strength modifier for a thrown weapon or half Strength modifier for a propulsive weapon) + bonuses + penalties
    For damage rolls with spells, alchemical bombs, and similar items, you don't add an attribute modifier unless otherwise noted.
    Spell (or similar effect) damage roll = damage die of effect + bonuses + penalties
    As with checks, you might add circumstance, status, or item bonuses to your damage rolls, but if you have multiple bonuses of the same type, you add only the highest bonus of that type. Again like checks, you may also apply circumstance, status, item, and untyped penalties to the damage roll, and again you apply only the greatest penalty of a specific type but apply all untyped penalties together.
    If the combined penalties on an attack would reduce the damage to 0 or below, you still deal 1 damage. Sometimes there are other considerations, described below.
    Adding Damage Dice
    Each weapon lists the damage die used for its damage roll. A standard weapon deals one die of damage, but a magical striking rune can increase the number of dice rolled, as can some special actions and spells. These additional dice use the same die size as the weapon or unarmed attack's normal damage die.
    Counting Damage Dice
    Effects based on a weapon's number of damage dice include only the weapon's damage die plus any extra dice from a striking rune. They don't count extra dice from abilities, critical specialization effects, property runes, weapon traits, or the like.
    Increasing Die Size
    When an effect calls on you to increase the size of your weapon damage dice, instead of using its normal weapon damage dice, use the next larger die, as listed below (so if you were using a d4, you'd use a d6, and so on). If you are already using a d12, the size is already at its maximum. You can't increase your weapon damage die size more than once. 1d4 » 1d6 » 1d8 » 1d10 » 1d12
    Persistent Damage
    Persistent damage is a condition that causes damage to recur beyond the original effect. Like normal damage, it can be doubled or halved based on the results of an attack roll or saving throw. Unlike with normal damage, when you are subject to persistent damage, you don't take it right away. Instead, you take the specified damage at the end of your turns, after which you attempt a DC 15 flat check to see if you recover from the persistent damage. See the persistent damage condition for the complete rules.
    Doubling and Halving Damage
    Sometimes you'll need to halve or double an amount of damage, such as when the outcome of your Strike is a critical hit or when you succeed at a basic Reflex save against a spell. When this happens, you roll the damage normally, adding all the normal modifiers, bonuses, and penalties. Then you double or halve the amount as appropriate. As normal, round down if you halve the damage (though 1 damage halved remains at a minimum of 1 damage).
    When doubling, the GM might allow you to roll the dice twice and double the modifiers, bonuses, and penalties instead of doubling the entire result, but this usually works best for single-target attacks or spells at low levels when you have a small number of damage dice to roll. Benefits you gain specifically from a critical hit, like the extra damage die from the fatal weapon trait, aren't doubled.
  properties:
    category: "Playing the Game"
- id: "step-2-calculate-result"
  name: "Step 2: Calculate Result"
  source: "pc > Chapter 8: Playing the Game > Checks > Step 2: Calculate Result"
  description: "This step is simple. Add up all the various modifiers, bonuses, and penalties you identified in Step 1—this is your total modifier. Next add that to the number that came up on your d20 roll. This total is your check result."
  properties:
    category: "Playing the Game"
- id: "step-2-damage-type"
  name: "Step 2: Damage Type"
  source: "pc > Chapter 8: Playing the Game > Damage Rolls > Step 2: Damage Type"
  description: "Once you've calculated how much damage you deal, you'll need to determine the damage type. The smack of a club deals bludgeoning damage. The shock of a lightning bolt spell deals electricity damage. Sometimes you might apply precision damage, dealing more damage for hitting a creature in a vulnerable spot or when the target is somehow vulnerable."
  properties:
    category: "Playing the Game"
- id: "step-3-apply-immunities-weaknesses-and-resistances"
  name: "Step 3: Apply Immunities, Weaknesses, and Resistances"
  source: "pc > Chapter 8: Playing the Game > Damage Rolls > Step 3: Apply Immunities, Weaknesses, and Resistances"
  description: "Defenses against certain types of damage or effects are called immunities or resistances, while vulnerabilities are called weaknesses. Apply immunities first, then weaknesses, and resistances third."
  properties:
    category: "Playing the Game"
- id: "step-3-compare-to-dc"
  name: "Step 3: Compare to DC"
  source: "pc > Chapter 8: Playing the Game > Checks > Step 3: Compare to DC"
  description: |-
    Whenever you attempt a check, you compare your result against the Difficulty Class (DC) of the check. Your check succeeds if it's equal to or greater than the DC. If you roll anything less than the DC, you fail.
    Sometimes you'll know the DC and make the comparison yourself. Other times, you might not know the DC right away. Swimming across a river would require an Athletics check, but it doesn't have a specified DC—so how will you know if you succeed or fail? You call out your result to the GM and they'll let you know if it's a success, failure, or otherwise. While you might learn the exact DC through trial and error, DCs sometimes change, so asking the GM whether a check is successful is best.
    Getting a DC from a Modifier
    When someone attempts a check against you, you might need to defend with one of your statistics that's normally a modifier, such as your "Reflex DC." Rather than rolling a check of your own, you need to generate a fixed DC based on your modifier. Your DC for a given statistic is 10 + the total modifier for that statistic. So if you have a +4 Reflex save, your Reflex DC is 14.
  properties:
    category: "Playing the Game"
- id: "step-4-degree-of-success"
  name: "Step 4: Degree of Success"
  source: "pc > Chapter 8: Playing the Game > Checks > Step 4: Degree of Success"
  description: |-
    Many times, it's important to determine not only if you succeed or fail, but also how spectacularly you succeed or fail. Exceptional results—either good or bad—can cause you to critically succeed or critically fail at a check.
    Result = number on the d20 + proficiency bonus + attribute modifier + circumstance bonus or penalty + status bonus or penalty + item bonus or penalty + all untyped penalties. If you have more than one bonus or penalty of a particular type, apply only the highest bonus or the worst penalty.
    You critically succeed when the check's result meets or exceeds the DC by 10 or more. If the check is an attack roll, this is also known as a critical hit. You can also critically fail a check. The rules for critical failure—sometimes called a fumble—are the same as those for a critical success, but in the other direction: if you fail a check by 10 or more, that's a critical failure.
    Some actions and abilities have stronger effects on a critical success or failure. For example, a Strike deals double damage on a critical hit. If an effect doesn't list a critical success effect, the critical success effect is the same as the success effect, and the same goes for critical failures.
    Natural 1 and Natural 20
    If you rolled a 20 on the die (a "natural 20"), your result is one degree of success better than it would be by numbers alone. If you roll a 1 on the d20 (a "natural 1"), your result is one degree worse. This means that a natural 20 usually results in a critical success and natural 1 usually results in a critical failure. However, if you were going up against a very high DC, you might get only a success with a natural 20, or even a failure if 20 plus your total modifier is 10 or more below the DC. Likewise, if your modifier for a statistic is so high that adding it to a 1 from your d20 roll exceeds the DC by 10 or more, you can succeed even if you roll a natural 1!
    Certain abilities can change the degree of success on a roll. When resolving such an ability, apply the adjustment from a natural 20 or natural 1 before anything else.
  properties:
    category: "Playing the Game"
- id: "step-4-reduce-hit-points"
  name: "Step 4: Reduce Hit Points"
  source: "pc > Chapter 8: Playing the Game > Damage Rolls > Step 4: Reduce Hit Points"
  description: |-
    Any remaining damage reduces the target's Hit Points on a 1-to-1 basis.
    Nonlethal Attacks
    You can make a nonlethal attack to knock someone out instead of killing them. Weapons with the nonlethal trait (including fists) do this automatically. You take a -2 circumstance penalty to the attack roll when you make a nonlethal attack using a weapon or unarmed attack that doesn't have the nonlethal trait. You also take this penalty when making a lethal attack using a nonlethal weapon. Spells and other effects with the nonlethal trait that reduce a creature to 0 Hit Points knock the creature out instead of killing them.
  properties:
    category: "Playing the Game"
- id: "structure-rule"
  name: "Structure"
  source: "pc > Chapter 8: Playing the Game > Encounter Mode > Structure"
  description: |-
    An encounter is played out in a series of rounds, during which the player characters, adversaries, and other participants in the encounter act in sequence. You roll initiative to determine this order at the start of the encounter and then play through rounds until a conclusion is reached and the encounter ends. The rules in this section assume a combat encounter—a battle—but the general structure can apply to any kind of encounter. Other types of encounters, like social encounters, might use longer rounds or have other modifications to the basic structure.
    Step 1: Roll Initiative
    When the GM calls for it, you'll roll initiative to determine your place in the initiative order, which is the sequence in which the encounter's participants will take their turns. Rolling initiative marks the start of an encounter. More often than not, you'll roll initiative when you enter a battle.
    Typically, you'll roll a Perception check to determine your initiative—the more aware you are of your surroundings, the more quickly you can respond. Sometimes, though, the GM might call on you to roll some other type of check. For instance, if you were Avoiding Notice during exploration, you'd roll a Stealth check. A social encounter could call for a Deception or Diplomacy check. In most cases, you can still use Perception if you prefer.
    The GM rolls initiative for anyone other than the player characters in the encounter. If these include a number of identical creatures, the GM could roll once for the group as a whole and have them take their turns within the group in any order. However, this can make battles less predictable and more dangerous, so the GM might want to roll initiative for some or all creatures individually unless it's too much of a burden.
    Unlike a check, where the result is compared to a DC, the results of initiative rolls are ranked. This ranking sets the order in which the encounter's participants act—the initiative order. The character with the highest result goes first. The second highest follows, and so on until whoever had the lowest result takes their turn last.
    If your result is tied with an enemy's result, the enemy goes first. If your result is tied with another PC's, you can decide between yourselves who goes first when you reach that place in the initiative order. After that, your places in the initiative order usually don't change during the encounter.
    Step 2: Play a Round
    A round begins when the participant with the highest initiative roll result starts their turn, and it ends when the one with the lowest initiative ends their turn. The process of taking a turn is detailed below. Creatures might also act outside their turns with reactions and free actions.
    Step 3: Begin the Next Round
    Once everyone in the encounter has taken a turn, the round is over and the next one begins. Don't roll initiative again; the new round proceeds in the same order as the previous one, repeating the cycle until the encounter ends.
    Step 4: End the Encounter
    When your foes are defeated, some sort of truce is reached, or some other event or circumstance ends the combat, the encounter is over. You and the other participants no longer follow the initiative order, and a more free-form style of play resumes, with the game typically moving into exploration mode. Sometimes, at the end of an encounter, the GM will award Experience Points to the party or you'll find treasure to divvy up.
  properties:
    category: "Playing the Game"
- id: "survival"
  name: "Survival"
  source: "pc > Chapter 4: Skills > Skills > Survival"
  description: |-
    You are adept at living in the wilderness, foraging for food and building shelter, and with training you discover the secrets of tracking and hiding your trail. Even if you're untrained, you can still use Survival to Subsist.
    • Subsist in the wild by foraging for food and building shelter.
  properties:
    category: "Skills"
- id: "sustaining-spells"
  name: "Sustaining Spells"
  source: "pc > Chapter 7: Spells > Durations > Sustaining Spells"
  description: "If the spell's duration is \"sustained,\" it lasts until the end of your next turn unless you use the Sustain action on that turn to extend the duration of that spell."
  properties:
    category: "Spells"
- id: "tactical-movement"
  name: "Tactical Movement"
  source: "pc > Chapter 8: Playing the Game > Movement > Tactical Movement"
  description: |-
    Your movement during encounter mode—and at other times where precise movement matters—depends on the actions and other abilities you use. Whether you Stride, Step, Swim, or Climb, the maximum distance you can move is based on your Speed. Certain feats or magic items can grant you other movement types, allowing you to swiftly burrow, climb, fly, or swim.
    When the rules refer to a "movement cost" or "spending movement," they are describing how many feet of your Speed you must use to move from one point to another. Normally, movement costs the number of feet you're moving. However, sometimes it's harder to move a certain distance due to difficult terrain or other factors. In such a case, you might have to spend a different amount of movement to move from one place to another.
    Grid Movement
    If an encounter involves combat, it's often a good idea to track the movement and relative position of the participants using a battle mat or some other form of grid to display the terrain, and miniatures to represent the combatants. When a character moves on a grid, every 1-inch square of the play area is 5 feet across in the game world. Hence, a creature moving in a straight line spends 5 feet of its movement for every map square traveled. Difficult terrain can make some squares cost more of your movement.
    Diagonal Movement
    Because moving diagonally covers more ground, you count that movement differently. The first square of diagonal movement you make in a turn counts as 5 feet, but the second counts as 10 feet, and your count thereafter alternates between the two. For example, as you move across 4 squares diagonally, you would count 5 feet, then 10, then 5, and then 10, for a total of 30 feet. You track your total diagonal movement across all your movement during your turn, but reset your count at the end of your turn.
    3D Movement
    Most movement in a game can be represented on a flat map. If creatures are flying, swimming, or otherwise moving through three-dimensional space, see the advice under Special Battles.
    Size, Space, and Reach
    Creatures and objects of different sizes occupy different amounts of space. The sizes and the spaces they each take up on a grid are listed in the Size and Reach table (see below). The table also lists the typical reach for creatures of each size, for both tall creatures (most bipeds) and long creatures (most quadrupeds).
    The Space entry lists how many feet on a side a creature's space is, so a Large creature fills a 10-foot-by- 10-foot space, or 4 squares on the grid. (If you need to measure in three dimensions, their space is also 10 feet high.) Sometimes part of a creature extends beyond its space, such as if a giant octopus is grabbing you with its tentacles. In that case, the GM will usually allow attacking the extended portion, even if you can't reach the main creature.
    Size and Reach
    Size Space Reach (Tall) Reach (Long)
    Tiny Less than 5 feet 0 feet 0 feet
    Small 5 feet 5 feet 5 feet
    Medium 5 feet 5 feet 5 feet
    Large 10 feet 10 feet 5 feet
    Huge 15 feet 15 feet 10 feet
    Gargantuan 20 feet or more 20 feet 15 feet
    A Small or larger creature or object takes up at least 1 square on a grid, and creatures of these sizes can't usually share spaces except in situations like a character riding a mount.
    Multiple Tiny creatures can occupy the same square. At least four can fit in a single square, though the GM might determine that even more can fit. Tiny creatures can share a space occupied by a larger creature as well. If a Tiny creature's reach is 0 feet, it must share a space with a creature in order to attack it.
    Moving Through a Creature's Space
    You can move through the space of a willing creature. If you want to move through an unwilling creature's space, you can Tumble Through it. You can't end your turn in a square occupied by another creature, though you can end a move action in its square provided that you immediately use another move action to leave that square. If two creatures end up in the same square by accident, the GM determines which one is forced out of the square (or whether one falls prone).
    Prone and Incapacitated Creatures
    You can share a space with a prone creature if that creature is willing, unconscious, or dead and if it is your size or smaller. The GM might allow you to climb atop the corpse or unconscious body of a larger creature in some situations. A prone creature can't stand up while someone else occupies its space, but it can Crawl to a space where it's able to stand, or it can attempt to Shove the other creature out of the way.
    Creatures of Different Sizes
    In most cases, you can move through the space of a creature three sizes larger than you or larger. This means a Medium creature can move through the space of a Gargantuan creature and a Small creature can move through the space of a Huge or Gargantuan creature. Likewise, a bigger creature can move through the space of a creature three sizes smaller than itself or smaller. You still can't end your movement in a space occupied by a creature.
    Tiny creatures are an exception, just like with sharing a space. They can move through creatures' spaces and can even end their movement there. Similarly, other creatures can move through and end their movement in a Tiny creature's space.
    Objects
    Because objects aren't as mobile as creatures are, they're more likely to fill a space. This means you can't always move through their spaces like you might move through a space occupied by a creature. You might be able to occupy the same square as a statue of your size, but not a wide column. The GM determines whether you can move into an object's square normally, whether special rules apply, or if you are unable to move into the square at all.
    Forced Movement
    When an effect forces you to move, or if you start falling, the distance you move is defined by the effect that moved you, not by your Speed. Forced movement doesn't trigger reactions that are triggered by movement. Some common causes of forced movement include the Reposition and Shove actions of Athletics. In the rare cases where it's unclear whether your movement is voluntary or forced, the GM makes the determination.
    If forced movement would move you into a space you can't occupy—because objects are in the way or because you lack the movement type needed to reach it, for example—you stop moving in the last space you can occupy.
    Usually the creature or effect forcing the movement chooses the path the victim takes. If you're pushed or pulled, you can usually be moved through hazardous terrain, pushed off a ledge, or the like. Abilities that reposition you in some other way can't put you in such dangerous places unless they specify otherwise. In all cases, the GM makes the final call if there's doubt on where forced movement can move a creature.
    Some abilities allow a creature to move while carrying another along with it. This is forced movement for the carried creature. Unless noted otherwise, they both move on the same path while this happens—the carrying creature can't drag its victim through dangers while avoiding them itself, for example.
  properties:
    category: "Playing the Game"
- id: "targets"
  name: "Targets"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Targets"
  description: |-
    Some spells allow you to target a creature, an object, or something more specific. The target must be within the spell's range, and you must be able to see it (or otherwise perceive it with a precise sense) to target it. At the GM's discretion, you can attempt to target a creature you can't see. If you fail to target a particular creature, this doesn't change how the spell affects any other targets the spell has.
    If you choose a target that isn't valid, such as if you thought a vampire was a living creature and targeted it with a spell that can target only living creatures, your spell fails to target that creature. If a creature starts out as a valid target but ceases to be one during a spell's duration, the spell typically ends, but the GM might decide otherwise in certain situations. Some spells restrict you to willing targets. A player can declare their character a willing or unwilling target at any time, regardless of turn order or their character's condition (such as when a character is paralyzed, unconscious, or even dead).
    Spells that affect multiple creatures in an area can have both an Area entry and a Targets entry. A spell that has an area but no targets listed usually affects all creatures in the area indiscriminately.
  properties:
    category: "Spells"
- id: "terrain"
  name: "Terrain"
  source: "pc > Chapter 8: Playing the Game > Movement > Terrain"
  description: |-
    Several types of terrain can complicate your movement by slowing you down, damaging you, or endangering you. Navigating these types of terrain can be challenging, but it can also let you get an advantage over your foes.
    Difficult Terrain
    Difficult terrain is any terrain that impedes your movement, ranging from particularly rough or unstable surfaces to thick ground cover and countless other impediments. Moving into a square of difficult terrain (or moving 5 feet into or within an area of difficult terrain, if you're not using a grid) costs an extra 5 feet of movement. Moving into a square of greater difficult terrain instead costs 10 additional feet of movement. This additional cost is not increased further when moving diagonally. You can't Step into difficult terrain.
    Movement you make while jumping ignores the terrain you're jumping over. Some abilities (such as flight or being incorporeal) allow you to avoid the movement reduction from some types of difficult terrain.
    Ignore Difficult Terrain
    Certain abilities let you ignore difficult terrain. If you can ignore difficult terrain, you can also move through greater difficult terrain at the extra movement cost difficult terrain normally imposes. An ability doesn't let you entirely ignore greater difficult terrain unless the ability specifies otherwise.
    Hazardous Terrain
    Hazardous terrain damages you whenever you move through it. An acid pool and a pit of burning embers are both examples of hazardous terrain. The amount and type of damage depend on the specific hazardous terrain.
    Narrow Surfaces
    A narrow surface is so precariously thin that you need to Balance or risk falling. Even on a success, you are off-guard on a narrow surface. Each time you are hit by an attack or fail a save on a narrow surface, you must succeed at a Reflex save (with the same DC as the Acrobatics check to Balance) or fall.
    Uneven Ground
    Uneven ground is an area unsteady enough that you need to Balance or risk falling prone and possibly injuring yourself, depending on the specifics of the uneven ground. You are off-guard on uneven ground. Each time you are hit by an attack or fail a save on uneven ground, you must succeed at a Reflex save (with the same DC as the Acrobatics check to Balance) or fall prone.
    Inclines
    An incline is an area so steep that you need to Climb using the Athletics skill in order to progress upward. You're off-guard when Climbing an incline.
  properties:
    category: "Playing the Game"
- id: "the-summon-trait"
  name: "The Summon Trait"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Spells with the summon trait can conjure creatures, typically ones with a particular trait. Such creatures can be found in books of creatures. Unless noted otherwise, the creature must be common, it gains the summoned trait, and it must appear in an unoccupied space in range large enough to contain it. The highest level of creature the spell can summon depends on the rank of the spell, as listed below. The spell can still summon a creature of a lower level if you so choose. These rules apply only to spells that have the summon trait; other spells that call or conjure items or beings but that don't have the trait, like summon instrument, work as explained in the spell.
    Spell Rank Maximum Creature Level
    1st -1
    2nd 1
    3rd 2
    4th 3
    5th 5
    6th 7
    7th 9
    8th 11
    9th 13
    10th 15
  properties:
    category: "Spells"
- id: "thievery"
  name: "Thievery"
  source: "pc > Chapter 4: Skills > Skills > Thievery"
  description: "You are trained in a particular set of skills favored by thieves and miscreants."
  properties:
    category: "Skills"
- id: "tiny-creatures-and-flanking"
  name: "Tiny Creatures and Flanking"
  source: "pc > Chapter 8: Playing the Game > Movement > Flanking > Sidebars: Tiny Creatures and Flanking & Avoiding Flanking > Tiny Creatures and Flanking"
  description: |-
    Tiny creatures usually have reach of 0 feet and need to be in a creature's space to attack it. This makes a Tiny creature unable to flank unless it's able to use a weapon with reach or has a melee unarmed attack with reach greater than 0 feet.
    The GM might allow Tiny creatures to flank other Tiny creatures if they're all in the same square, but this is best left for special circumstances and uses the GM's best judgment.
  properties:
    category: "Playing the Game"
- id: "touch-range"
  name: "Touch Range"
  source: "pc > Chapter 7: Spells > Ranges, Areas, and Targets > Touch Range"
  description: "A spell with a touch range requires you to physically touch the target. You use your unarmed reach to determine whether you can touch the creature. You can usually touch them automatically, though the spell might specify that they can attempt a saving throw or that you must attempt a spell attack roll. If an ability increases the range of a touch spell, start at 0 feet and increase from there."
  properties:
    category: "Spells"
- id: "transportation"
  name: "Transportation"
  source: "pc > Chapter 6: Equipment > Gear > Services > Transportation"
  description: "The cost to hire transportation includes standard travel with no amenities. Most transit services provide basic sleeping arrangements, and some provide meals at the rates listed on the table. Arranging transportation into dangerous lands can be more expensive or impossible."
  properties:
    category: "Equipment"
- id: "travel-speed"
  name: "Travel Speed"
  source: "pc > Chapter 8: Playing the Game > Exploration Mode > Travel Speed"
  description: |-
    Depending on how the GM tracks movement, you move in feet or miles based on your character's Speed with the relevant movement type. Typical rates are on the table below.
    Travel Speed
    Feet Miles Miles
    Speed per Minute per Hour per Day
    10 feet 100 1 8
    15 feet 150 1-1/2 12
    20 feet 200 2 16
    25 feet 250 2-1/2 20
    30 feet 300 3 24
    35 feet 350 3-1/2 28
    40 feet 400 4 32
    50 feet 500 5 40
    60 feet 600 6 48
    The rates in the table assume traveling over flat and clear terrain at a determined pace, but one that's not exhausting. Moving through difficult terrain halves the listed movement rate. Greater difficult terrain reduces the distance traveled to one-third the listed amount. If the travel requires a skill check to accomplish, such as mountain climbing or swimming, the GM might call for a check once per hour using the result and the table above to determine your progress.
  properties:
    category: "Playing the Game"
- id: "turns"
  name: "Turns"
  source: "pc > Chapter 8: Playing the Game > Encounter Mode > Turns"
  description: |-
    When it's your turn to act, you can use single actions ([1 action]), short activities ([2 actions] and [3 actions]), reactions ([reaction]), and free actions ([free action]). When you're finished, your turn ends and the character next in the initiative order begins their turn. Sometimes it's important to note when during your turn something happens, so a turn is divided into three steps.
    Step 1: Start Your Turn
    Many things happen automatically at the start of your turn—it's a common point for tracking the passage of time for effects that last multiple rounds. At the start of each of your turns, take these steps in any order you choose:
    • If you created an effect lasting for a certain number of rounds, reduce the number of rounds remaining by 1. The effect ends if the duration is reduced to 0. For example, if you cast a spell that lasts 3 rounds on yourself during your first turn of a fight, it would affect you during that turn, decrease to 2 rounds of duration at the start of your second turn, decrease to 1 round of duration at the start of your third turn, and expire at the start of your fourth turn.
    • You can use 1 free action or reaction with a trigger of "Your turn begins" or something similar.
    • If you're dying, roll a recovery check.
    • Do anything else that is specified to happen at the start of your turn, such as regaining Hit Points from fast healing or regeneration.
    The last step of starting your turn is always the same.
    • Regain your 3 actions and 1 reaction. If you haven't spent your reaction from your last turn, you lose it—you can't "save" actions or reactions from one turn to use during the next turn. Some abilities or conditions (such as quickened, slowed, and stunned) can change how many actions you regain and whether you regain your reaction.
    Step 2: Act
    You can use actions in any order you wish during your turn, but you have to complete one action or activity before beginning another; for example, you can't use a single action in the middle of performing a 2-action activity. What actions you can use often depend on your class features, skills, feats, and items, but there are default actions anyone can use. Some effects might prevent you from acting. If you can't act, you can't use any actions, including reactions and free actions.
    If you begin a 2-action or 3-action activity on your turn, you must be able to complete it on your turn. You can't, for example, begin to High Jump using your final action on one turn and then complete it as your first action on your next turn.
    Once you have spent all 3 of your actions, your turn ends (as described in Step 3) and the next creature's turn begins. You can choose to end your turn early, losing all remaining actions (but not your reaction).
    Step 3: End Your Turn
    Once you've done all the things you want to do with the actions you have available, you reach the end of your turn. Take the following steps in any order you choose. Play then proceeds to the next creature in the initiative order.
    • End any effects that last until the end of your turn. For example, spells with a sustained duration end at the end of your turn unless you used the Sustain a Spell action during your turn to extend them. Some effects caused by enemies might also last through a certain number of your turns, and you decrease the remaining duration by 1 during this step, ending the effect if its duration is reduced to 0.
    • If you have a persistent damage condition, you take the damage at this point. After you take the damage, you can attempt the flat check to end the persistent damage. You then attempt any saving throws for ongoing afflictions. Many other conditions change at the end of your turn, such as the frightened condition decreasing in severity. These take place after you've taken any persistent damage, attempted flat checks to end the persistent damage, and attempted saves against any afflictions.
    • You can use 1 free action or reaction with a trigger of "Your turn ends" or something similar.
    • Resolve anything else specified to happen at the end of your turn.
  properties:
    category: "Playing the Game"
- id: "unarmed-attacks"
  name: "Unarmed Attacks"
  source: "pc > Chapter 6: Equipment > Weapons > Unarmed Attacks"
  description: |-
    Almost all characters start out trained in unarmed attacks. You can Strike with your fist or another body part, calculating your attack and damage rolls in the same way you would with a weapon. Unarmed attacks can belong to a weapon group, and they might have weapon traits. However, unarmed attacks aren't weapons, and effects and abilities that work with weapons never work with unarmed attacks unless they specifically say so.
    The Unarmed Attacks table lists the statistics for an unarmed attack with a fist, though you'll usually use the same statistics for attacks made with any other parts of your body. Certain ancestry feats, class features, and spells give access to special, more powerful unarmed attacks. For instance, a creature with sharp jaws can attack with them. While most unarmed attacks are melee, some, especially those from certain ancestries, might even be ranged, like the leshy's ability to launch hard seedpods. Details for those unarmed attacks are provided in the abilities that grant them.
  properties:
    category: "Equipment"
- id: "using-basic-actions"
  name: "Using Basic Actions"
  source: "pc > Chapter 8: Playing the Game > Actions > Basic Actions"
  description: |-
    Basic actions represent common tasks like moving around, attacking, and helping others. As such, every creature can use basic actions except in some extreme circumstances, and many of those actions are used very frequently. Most notably, you'll use Interact, Step, Stride, and Strike a great deal. Many feats and other actions call upon you to use one of these basic actions or modify them to produce different effects. For example, a more complex action might let you Stride twice, and a large number of activities include a Strike. An action or activity might also modify a basic action, such as having you Stride up to half your Speed.
    Actions that are used less frequently but are still available to most creatures are presented in Specialty Basic Actions. These typically have requirements that not all characters are likely to meet, such as wielding a shield, having a burrow Speed, or falling through the air.
    In addition to the actions in these two sections, there are actions for spellcasting and for using magic items.
    Delay and Ready: If you want to change when you take actions, two basic actions let you do so. Delay shifts your entire turn later in the round, and Ready lets you prepare to take one specific action when a trigger you choose is met.
  properties:
    category: "Playing the Game"
- id: "versatile-heritages"
  name: "Versatile Heritages"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages"
  description: |-
    The most common versatile heritages by far are the half-elf and half-orc ones, usually born to a human parent on one side and either an elf or orc parent on the other. Other individuals are born under far stranger circumstances, such as having a parent who was affected by monstrous, undead, or extraplanar energies. As these circumstances aren't unique to a single ancestry, these heritages—called versatile heritages—are likewise shared by many ancestries.
    Many kinds of versatile heritage exist. Some are born to unusual creatures or arise through specific mundane or supernatural circumstances. Many, however, result from an infusion of extraplanar energy, whether through direct parentage, more distant ancestors, or simply direct exposure to the quintessence of that plane.
    Because the circumstances that give rise to versatile heritages aren't limited to a single ancestry, a versatile heritage can be chosen by a character of nearly any ancestry. Some versatile heritages are more common among some ancestries than others, and some might list additional restrictions specific to that heritage. Your GM may place other restrictions on which ancestries can use a given versatile heritage based on the story and setting.
  properties:
    category: "Ancestries"
- id: "virulent-afflictions"
  name: "Virulent Afflictions"
  source: "pc > Chapter 8: Playing the Game > Afflictions > Virulent Afflictions"
  description: |-
    Afflictions with the virulent trait are harder to remove. You must succeed at two consecutive saves to reduce a virulent affliction's stage by 1. A critical success reduces a virulent affliction's stage by only 1 instead of by 2.
    Affliction Example
    To see how a poison works, let's look at arsenic.
    Arsenic (poison) You can't reduce your sickened condition while affected by arsenic; Saving Throw DC 18 Fortitude; Onset 10 minutes; Maximum Duration 5 minutes; Stage 1 1d4 poison damage and sickened 1 (1 minute); Stage 2 1d6 poison damage and sickened 2 (1 minute); Stage 3 2d6 poison damage and sickened 3 (1 minute)
    If you drank a glass of wine laced with arsenic, you would attempt an initial Fortitude save against the listed DC of 18. If you fail, you advance to stage 1. Because of the onset time, nothing happens for 10 minutes, but once this time passes, you take 1d4 poison damage and become sickened 1. As noted, you're unable to reduce the sickened condition. The interval of stage 1 is 1 minute (as shown in parentheses), so you attempt a new save after 1 minute passes. If you succeed, you reduce the stage by 1, recovering from the poison. If you fail again, the stage increases by 1 to stage 2, and you take 1d6 poison damage and become sickened 2.
    If your initial save against the arsenic was a critical failure, after the onset time, you would advance directly to stage 2. After the 10-minute onset time, you would take 1d6 poison damage and become sickened 2. Succeeding at your second save would reduce the stage by 1 to stage 1, and you'd take only 1d4 poison damage. Failing the second save would increase by 1 again to stage 3.
    If you reach stage 3 of the poison, either by failing while at stage 2 or critically failing while at stage 1, you'd take 2d6 poison damage and be sickened 3. If you failed or critically failed your saving throw while at stage 3, you would repeat the effects of stage 3.
    Since the poison has a maximum duration of 5 minutes, you recover from it once the 5 minutes pass, no matter which stage you're at.
  properties:
    category: "Playing the Game"
- id: "walls"
  name: "Walls"
  source: "pc > Chapter 7: Spells > Walls"
  description: "Spells that create walls list the depth, length, and height of the wall, also specifying how it can be positioned. Some walls can be shaped; you can manipulate the wall into a form other than a straight line, choosing its contiguous path square by square. The path of a shaped wall can't enter the same space more than once, but it can double back so one section is adjacent to another section of the wall."
  properties:
    category: "Spells"
- id: "weakness"
  name: "Weakness"
  source: "pc > Chapter 8: Playing the Game > Immunity, Weakness, and Resistance > Weakness"
  description: |-
    If you have a weakness to a certain type of damage or damage from a certain source, that type of damage is extra effective against you. Whenever you would take that type of damage, increase the damage you take by the value of the weakness. For instance, if you are dealt 2d6 fire damage and have weakness 5 to fire, you take 2d6+5 fire damage.
    If you have a weakness to something that doesn't normally deal damage, such as water, you take damage equal to the weakness value when touched or affected by it. If more than one weakness would apply to the same instance of damage, use only the highest applicable weakness value. This usually only happens when a creature is weak to both a type of damage and a material or trait, such as a cold iron axe cutting a monster that has weakness to cold iron and slashing.
  properties:
    category: "Playing the Game"
- id: "weapon-statistics"
  name: "Weapon Statistics"
  source: "pc > Chapter 6: Equipment > Weapons > Weapon Statistics"
  description: |-
    The tables list the statistics for various melee and ranged weapons that you can purchase, as well as the statistics for striking with a fist (or another basic unarmed attack). The tables present the following weapon statistics. All weapons are level 0 unless noted otherwise.
    Damage
    This entry lists the weapon's damage die and the type of damage it deals: B for bludgeoning, P for piercing, or S for slashing.
    Damage Dice
    Each weapon lists the damage die used for its damage roll. A standard weapon deals one die of damage, but a magical striking rune can increase the number of dice rolled, as can some special actions and spells. These additional dice use the same die size as the weapon or unarmed attack's normal damage die.
    Counting Damage Dice
    Effects based on a weapon's number of damage dice include only the weapon's damage die plus any extra dice from a striking rune. They don't count extra dice from abilities, critical specialization effects, property runes, weapon traits, or the like.
    Increasing Die Size
    When an effect calls on you to increase the size of your weapon damage dice, instead of using its normal weapon damage dice, use the next larger die, as listed below (so if you were using a d4, you'd use a d6, and so on). If you are already using a d12, the size is already at its maximum. You can't increase your weapon damage die size more than once.
    1d4 » 1d6 » 1d8 » 1d10 » 1d12
    Range
    Ranged and thrown weapons have a range increment. Attacks with these weapons work normally up to that distance. Attack rolls beyond a weapon's range increment take a -2 penalty for each additional multiple of that increment between you and the target. Attacks beyond the sixth range increment are impossible.
    For example, a shortbow takes no penalty against a target up to 60 feet away, a -2 penalty against a target beyond 60 feet but up to 120 feet away, and a -4 penalty against a target beyond 120 feet but up to 180 feet away, and so on, up to 360 feet.
    Reload
    While all weapons need some amount of time to get into position, many ranged weapons also need to be loaded and reloaded. This entry indicates how many Interact actions it takes to reload such weapons or draw certain thrown weapons, like shuriken. This can be 0 if drawing ammunition and firing or throwing the weapon are part of the same action. If an item takes 2 or more actions to reload, the GM determines whether they must be performed together as an activity, or you can spend some of those actions during one turn and the rest during your
    next turn.
    An item with an entry of "—" must be drawn to be thrown, which usually takes an Interact action just like drawing any other weapon. Reloading a ranged weapon and drawing a thrown weapon both require a free hand. Switching your grip to free a hand and then to place your hands in the grip necessary to wield the weapon are both included in the actions you spend to reload a weapon.
    Bulk
    This entry gives the weapon's Bulk. A weapon's Bulk is increased or decreased if it's sized for creatures that aren't Small or Medium size.
    Hands
    Some weapons require one hand to wield, and others require two. A few items, such as a longbow, list 1+ for its Hands entry. You can hold a weapon with a 1+ entry in one hand, but the process of shooting it requires using a second to retrieve, nock, and loose an arrow. This means you can do things with your free hand while holding the bow without changing your grip, but the other hand must be free when you shoot. To properly wield a 1+ weapon, you must hold it in one hand and also have a hand free.
    Weapons requiring two hands typically deal more damage. Some one-handed weapons have the two-hand trait, causing them to deal a different size of weapon damage die when used in two hands. In addition, some abilities require you to wield a weapon in two hands. You meet this requirement while holding the weapon in two hands, even if it doesn't require two hands or have the two-hand trait.
    If an action or other ability requires you to use a "two-handed weapon," it applies for any weapon you wield in two hands. Any permanent adjustments to the weapon, such as a rune that can be added to a "one-handed weapon," uses the Hands entry in the weapon table exactly (1+ counts as one-handed for this purpose).
    Group
    A weapon or unarmed attack's group classifies it with similar weapons. Groups affect some abilities and what the weapon does on a critical hit if you have the critical specialization benefits for that weapon or unarmed attack.
    Weapon Traits
    The traits a weapon or unarmed attack has are listed in this entry. Any trait that refers to a "weapon" can also apply to an unarmed attack that has that trait. Traits are described in Weapon Traits.
    Ammunition
    Some entries in the ranged weapons tables are followed by an entry for the type of ammunition that weapon launches. The damage die is determined by the weapon, not the ammunition. Because that and other relevant statistics vary by weapon, ammunition entries list only the name, quantity, Price, and Bulk. Using ammunition destroys it.
  properties:
    category: "Equipment"
- id: "weapon-traits"
  name: "Weapon Traits"
  source: "pc > Chapter 6: Equipment > Weapons > Weapon Traits"
  description: |-
    Weapons and unarmed attacks can have these traits. Weapons crafted and used by a given ancestry (such as the elven curve blade) often have the trait for that ancestry.
    Agile: The multiple attack penalty you take with this weapon on the second attack on your turn is -4 instead of -5, and -8 instead of -10 on the third and subsequent attacks in the turn.
    Attached: An attached weapon must be combined with another piece of gear to be used. The trait lists what type of item the weapon must be attached to. You must be wielding or wearing the item the weapon is attached to in order to attack with it. For example, shield spikes are attached to a shield, allowing you to attack with the spikes instead of a shield bash. An attached weapon is usually bolted onto or built into the item it's attached to, and typically an item can have only one weapon attached to it. An attached weapon can be affixed to an item with 10 minutes of work and a successful DC 10 Crafting check; this includes the time needed to remove the weapon from a previous item, if necessary. Typically the weapon can't be used if the item it's attached to is broken. If an item is destroyed, its attached weapon can usually be salvaged.
    Backstabber: When you hit an off-guard creature, this weapon deals 1 precision damage in addition to its normal damage. The precision damage increases to 2 if the weapon is a +3 weapon.
    Backswing: You can use the momentum from a missed attack with this weapon to lead into your next attack. After missing with this weapon on your turn, you gain a +1 circumstance bonus to your next attack with this weapon before the end of your turn.
    Concealable: This weapon is designed to be inconspicuous or easily concealed. You gain a +2 circumstance bonus to Stealth checks and DCs to hide or conceal a weapon with this trait.
    Deadly: On a critical hit, the weapon adds a weapon damage die of the listed size. Roll this after doubling the weapon's damage. This increases to two dice if the weapon has a greater striking rune and three dice if the weapon has a major striking rune. For instance, a rapier with a greater striking rune deals 2d8 extra piercing damage on a critical hit. An ability that changes the size of the weapon's normal damage dice doesn't change the size of its deadly die.
    Disarm: You can use this weapon to Disarm with the Athletics skill even if you don't have a free hand. This uses the weapon's reach (if different from your own) and adds the weapon's item bonus to attack rolls (if any) as an item bonus to the Athletics check. If you critically fail a check to Disarm using the weapon, you can drop the weapon to take the effects of a failure instead of a critical failure. On a critical success, you still need a free hand if you want to take the item.
    Fatal: The fatal trait includes a die size. On a critical hit, the weapon's damage die increases to that die size instead of the normal die size, and the weapon adds one additional damage die of the listed size.
    Finesse: You can use your Dexterity modifier instead of your Strength modifier on attack rolls using this melee weapon. You still calculate damage using Strength.
    Forceful: This weapon becomes more dangerous as you build momentum. When you attack with it more than once on your turn, the second attack gains a circumstance bonus to damage equal to the number of weapon damage dice, and each later attack gains a circumstance bonus to damage equal to double the number of damage dice.
    Free-Hand: This weapon doesn't take up your hand, usually because it is built into your armor. A free-hand weapon can't be Disarmed. You can use the hand covered by your free-hand weapon to wield other items, perform manipulate actions, and so on. You can't attack with a free-hand weapon if you're wielding anything in that hand or otherwise using that hand. When you're not wielding anything and not otherwise using the hand, you can use abilities that require you to have a hand free as well as those that require you to be wielding a weapon in that hand. Each of your hands can have only one free-hand weapon on it.
    Jousting: The weapon is suited for mounted combat with a harness or similar means. When mounted, if you moved at least 10 feet on the action before your attack, add a circumstance bonus to damage for that attack equal to the number of damage dice for the weapon. In addition, while mounted, you can wield the weapon in one hand, changing the damage die to the listed value. As a part of your action to Mount a creature, you can switch your grip on a jousting weapon to one-handed. After that, changing your grip takes the same actions described in Carrying Items. If you dismount while wielding a jousting weapon one-handed, you can switch to using two hands as part of that action if you have a hand free at that point. If not, you'll still be holding the weapon in one hand, but not wielding it.
    Monk: Many monks learn to use these weapons.
    Nonlethal: Attacks with this weapon are nonlethal, and are used to knock creatures unconscious instead of kill them. You can use a nonlethal weapon to make a lethal attack with a -2 circumstance penalty.
    Parry: This weapon can be used defensively to block attacks. While wielding this weapon, if your proficiency with it is trained or better, you can spend a single action to position your weapon defensively, gaining a +1 circumstance bonus to AC until the start of your next turn.
    Propulsive: You add half your Strength modifier (if positive) to damage rolls with a propulsive ranged weapon. If you have a negative Strength modifier, you add your full Strength modifier instead.
    Ranged Trip: The weapon can be used to Trip with the Athletics skill within the weapon's first range increment. The skill check takes a -2 circumstance penalty. You can add the weapon's item bonus to attack rolls as a bonus to the check. A ranged trip weapon doesn't deal any damage when used to Trip. These weapons are usually thrown.
    Reach: This weapon can be used to attack enemies up to 10 feet away instead of only adjacent enemies. For creatures with reach, the weapon increases their reach by 5 feet.
    Shove: You can use this weapon to Shove with the Athletics skill even if you don't have a free hand. This uses the weapon's reach (if different from your own) and adds the weapon's item bonus to attack rolls as an item bonus to the Athletics check. If you critically fail a check to Shove using the weapon, you can drop the weapon to take the effects of a failure instead of a critical failure.
    Sweep: This weapon makes wide swinging attacks. When you attack with this weapon, you gain a +1 circumstance bonus to your attack roll if you already attempted to attack a different target this turn using this weapon.
    Thrown: You can throw this weapon as a ranged attack; it is a ranged weapon when thrown. You add your Strength modifier to damage as you would for a melee weapon. When this trait appears on a melee weapon, it also includes the range increment. Ranged weapons with this trait use the range increment in the weapon's Range entry.
    Trip: You can use this weapon to Trip with the Athletics skill even if you don't have a free hand. This uses the weapon's reach (if different from your own) and adds the weapon's item bonus to attack rolls as an item bonus to the Athletics check. If you critically fail a check to Trip using the weapon, you can drop the weapon to take the effects of a failure instead of a critical failure.
    Twin: These weapons are used as a pair. When you attack with a twin weapon, you add a circumstance bonus to the damage roll equal to the weapon's number of damage dice if you have previously attacked with a different weapon of the same type this turn. The weapons must be of the same type, but they don't need to have the same runes.
    Two-Hand: This weapon can be wielded with two hands to change its weapon damage die to the indicated value. This change applies to all the weapon's damage dice.
    Unarmed: An unarmed attack uses your body rather than a manufactured weapon. An unarmed attack isn't a weapon, though has a weapon group and might have weapon traits. An unarmed attack can't be Disarmed. It also doesn't take up a hand, though a fist or other grasping appendage generally works like a free-hand weapon.
    Versatile: A versatile weapon can be used to deal a different type of damage than its listed type. This trait indicates the alternate damage type. For instance, a piercing weapon with versatile S can deal piercing or slashing damage. You choose the damage type each time you attack.
    Volley: This ranged weapon is less effective at close distances. Your attacks against targets that are at a distance within the range listed take a -2 penalty.
  properties:
    category: "Equipment"
- id: "wearing-toolkits"
  name: "Wearing Toolkits"
  source: "pc > Chapter 6: Equipment > Gear > Gear Statistics > Wearing Toolkits"
  description: "You can make a toolkit (such as an alchemist's toolkit or healer's toolkit) easier to use by wearing it. This easy access allows you to draw and replace the tools within as part of the action that uses them, rather than needing to Interact to draw them. You can wear up to 2 Bulk of toolkits in this manner; any beyond this limit must be stowed or drawn with an Interact action to use."
  properties:
    category: "Equipment"
- id: "wheelchair-rules"
  name: "Wheelchair Rules"
  source: "pc > Chapter 6: Equipment > Gear > Sidebar: Wheelchair Rules"
  description: |-
    Each wheelchair operates in the following ways.
    Adjustable Seat Belts: These belts strap around your waist, knees, and shins to keep you in the chair if it's thrown, knocked, or handled roughly. You can open and release your belts with an Interact action.
    Bulk Limit: A wheelchair is strong enough to support you and any amount of Bulk you could typically hold or carry. Your total carried Bulk includes all the items you are wearing, carrying, and stowing on your wheelchair. You take the usual effects when there's too much Bulk on you and your wheelchair: if you're carrying an amount of Bulk equal to 5 + your Strength modifier, you're encumbered, and you and your wheelchair can't hold or carry more than 10 + your Strength modifier. The wheelchair's own Bulk doesn't count against your Bulk limit while riding in the wheelchair; it's listed in case you need to carry the wheelchair separately.
    Frame: A wheelchair is typically made from common materials like wood, but they can also be made from steel, other metals, or even rarer materials like dawnsilver. The wheelchairs presented here are made from durable wood.
    Magic: The wheelchair is considered an extension of yourself. Spells or abilities that change your bodily form also apply to the chair, and it transforms with you so long as you're using it. You can choose what appearance this has.
    Movement: While using a wheelchair, you Stride at your normal Speed (listed in your ancestry, with any additional bonuses, penalties, and adjustments applied). You propel a wheelchair by using the hand rims. You can propel the wheelchair even while holding something in your hands, but not if you're restrained or otherwise unable to move your hands freely. You're still affected by difficult terrain and other terrain features. Any effect that would immobilize you, give a penalty to your Speeds, or similar by entangling or hindering your legs applies to the chair as well. You can use all of your actions while in a wheelchair.
    Quick-Righting: If the chair is tipped or you're knocked prone while in the chair, you can right yourself using the Stand action, though in this case you are righting the wheelchair instead. An ally can use an Interact action to help right you, allowing you to Stand as a free action triggered by their Interact action.
  properties:
    category: "Equipment"
- id: "wielding-items"
  name: "Wielding Items"
  source: "pc > Chapter 6: Equipment > Carrying Items > Wielding Items"
  description: "Some abilities require you to wield an item, typically a weapon. You're wielding an item any time you're holding it in the number of hands needed to use it effectively. When wielding an item, you're not just carrying it around—you're ready to use it. Other abilities might require you to be wearing the item, to be holding it, or simply to have it."
  properties:
    category: "Equipment"
- id: "witch-lessons"
  name: "Witch Lessons"
  source: "pc > Chapter 3: Classes > Witch > Class Features"
  description: |-
    A witch's knowledge takes the form of lessons, which you can learn by selecting feats like Basic Lesson or Greater Lesson. Each lesson grants you a hex and teaches your familiar a new spell, adding it to the spells you can prepare using your witch spellcasting. You gain this spell even if it's not on your tradition's spell list.
    Basic Lessons
    Lesson of Dreams: Dreams can be a window to greater insights. You gain the veil of dreams hex, and your familiar learns sleep.
    Lesson of Elements: Natural disasters and inclement weather hold more power than the mightiest creature. You gain the elemental betrayal hex. Your familiar learns your choice of breathe fire, gust of wind, hydraulic push, or pummeling rubble.
    Lesson of Life: Life can be shared. You gain the life boost hex, and your familiar learns spirit link.
    Lesson of Protection: An ounce of protection is worth a pound of cure. You gain the blood ward hex; your familiar learns mystic armor.
    Lesson of Vengeance: Suffer not even the smallest slights. You gain the needle of vengeance hex, and your familiar learns phantom pain.
    Greater Lessons
    Lesson of Mischief: Nothing's wrong with some mischief, now and then. You gain the deceiver's cloak hex, and your familiar learns mad monkeys.
    Lesson of Shadow: A shadow is far from empty—it contains something of the person who casts it. You gain the malicious shadow hex, and your familiar learns chilling darkness.
    Lesson of Snow: Emulate snow, for it can snuff out life despite its gentleness. You gain the personal blizzard hex, and your familiar learns wall of wind.
    Major Lessons
    Lesson of Death: Death is final, yet not as inescapable as it may seem. You gain the curse of death hex, and your familiar learns raise dead.
    Lesson of Renewal: Entropy comes for all, but it can be wound back through effort. You gain the restorative moment hex, and your familiar learns field of life.
  properties:
    category: "Classes"
- id: "young-animal-companions"
  name: "Young Animal Companions"
  source: "pc > Chapter 3: Classes > Companions > Young Animal Companions"
  description: |-
    The following are the base statistics for a young animal companion, the first animal companion most characters get. You adjust these statistics depending on the type of animal you choose. Animal companions calculate their modifiers and DCs just as you do with one difference: the only item bonuses they can benefit from are to Speed and AC (their maximum item bonus to AC is +3). As you gain levels, you might be able to make your companion stronger by advancing it.
    An animal companion's starting statistics are as follows.
    Level: Your animal companion's level is equal to yours.
    Proficiencies: Your animal companion is trained in its unarmed attacks, unarmored defense, barding (a type of armor for animals), all saving throws, Perception, Acrobatics, and Athletics. Animal companions can't use abilities that require greater Intelligence, such as Coerce or Decipher Writing, even if trained in the appropriate skill, unless they have a specialization that allows it.
    Attribute Modifiers: An animal companion begins with base attribute modifiers listed in its stat block.
    Hit Points: Your animal companion has ancestry Hit Points from its type, plus a number of Hit Points equal to 6 plus its Constitution modifier for each level you have.
