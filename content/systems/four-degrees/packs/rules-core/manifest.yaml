description: 'Rules text for the Four Degrees system, generated by a local importer from the player book of the upstream game: the conditions, the rules for their values and overrides, the trait definitions of the glossary, the general and skill feats, the skills chapter (its rules text and the skill actions), the spells chapter (the spellcasting rules, the spells and cantrips of its four lists, the focus spells and focus cantrips of the classes, and the rules and entries of the rituals), and the equipment chapter (the rules of coins, price, bulk, carrying and item damage, the rules of armor, shields and weapons, the armor, shields and weapons with the statistics of the book''s tables, and the gear: the adventuring, alchemical and assistive gear and the barding with their price, Bulk, hands and item level, the rules of hands and of wearing toolkits and of wheelchairs, and the price tables of formulas, services, spellcasting, cost of living and animals as text rows), and the ancestries chapter (the general rules of an ancestry''s entry, the eight ancestries with their statistics and special abilities, their 45 heritages and their 143 ancestry feats; the 4 versatile heritages with their 43 feats and the rules about them), the 40 backgrounds with the rules for choosing one, the rules of languages and of sign language, and the first part of the classes chapter (how a class entry is read, the fighter, the rogue, the bard, the cleric, the druid, the ranger, the witch and the wizard with their class features and a spellcaster''s table of spells per day, the rogue''s four rackets, the bard''s four muses, the cleric''s two doctrines, the druid''s four orders, the witch''s seven patrons (said by what their lessons are about) and her lessons, and the wizard''s seven schools, and their 518 class feats), and the end of the classes chapter (the 16 types of animal companion with their statistics, the rules of advancing a companion, the rules of familiars with their 21 familiar abilities and 10 master abilities, and the 8 multiclass archetypes with their rules and their 57 feats; a few names of the setting are said in plain words, and five archetype feats are named with a synonym of the book''s word), and the rules of play (the chapter on playing the game: the three modes of play, checks, damage, hit points and dying, actions with the 16 basic and 10 specialty basic actions, movement, effects and areas, afflictions, perception and detection, and the encounter, exploration and downtime modes with the 10 exploration activities; 12 of its sidebars that state rules are taken, and the rest are left out). Flavor, names and cross references are removed or reworded.'
