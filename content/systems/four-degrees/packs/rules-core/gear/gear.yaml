- id: "traveler-s-chair"
  name: "Traveler's Chair"
  source: "pc > Chapter 6: Equipment > Gear > Assistive Items"
  description: |-
    A common wheelchair is ideal for everyday use but isn't designed for strenuous activity. These wheelchairs are most common among nonadventurers. Wheelchairs come in a variety of sizes to suit every person regardless of height or body type.
    A traveler's chair is tailored for frequent adventures and travels. The design is sleek and fashionable to provide excellent comfort and support. A traveler's chair has small mechanisms, either made from interlocking wood pieces, clockwork, or other devices, that allow the chair to traverse up or down stairs without any additional difficulty (moving up stairs is still difficult terrain, just like for other characters), and move through other common adventuring terrain without any additional difficulty, such as ladders and uneven ground. Chair storage can be purchased and applied to any wheelchair. This reduces the amount of Bulk the items weigh when stored within the chair, much like a backpack. The first 2 Bulk of items stowed in your chair don't count against your Bulk limit. If you use both chair storage and a backpack at the same time, only 2 Bulk total isn't counted against your limit, much like if you used multiple backpacks or similar items at the same time.
    **Price.** 5 gp
    **Bulk.** 3
    **Hands.** see text
  properties:
    kind: "assistive"
    price: "5 gp"
    bulk: "3"
    hands: "see text"
    variantOf: "Wheelchair"
