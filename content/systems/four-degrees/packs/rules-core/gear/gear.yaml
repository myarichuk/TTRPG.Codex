    **Hands.** 1
  properties:
    kind: "gear"
    price: "1 sp"
    bulk: "L"
    hands: "1"
- id: "healer-s-toolkit"
  name: "Healer's Toolkit"
  source: "pc > Chapter 6: Equipment > Gear > Adventuring Gear"
  description: |-
    This kit of bandages, herbs, and suturing tools is necessary for Medicine checks to Administer First Aid, Treat Disease, Treat Poison, or Treat Wounds. Expanded healer's toolkits provide a +1 item bonus to such checks. If you wear your healer's toolkit, you can draw and replace its tools as part of the action that uses them.
    **Price.** 5 gp
    **Bulk.** 1
    **Hands.** 1 or 2
    **Note.** You can use a toolkit with 1 hand if you're wearing it or 2 if you're holding it. See Wearing Toolkits for details.
  properties:
    kind: "gear"
    price: "5 gp"
    bulk: "1"
    hands: "1 or 2"
- id: "hearing-aid"
  name: "Hearing Aid"
  source: "pc > Chapter 6: Equipment > Gear > Assistive Items"
  description: |-
    A hearing aid is worn in the ear and is made from carved wood, shaped metal, or even small clockwork pieces. The shape of the device aids those who are hard of hearing, and you can wear one or two depending on your hearing loss. You can attach or remove your hearing aids as an Interact action.
    A magical hearing aid has the magical trait. With its curved shape, it hooks over the top and sits behind your ear, with a receiver that fits into the ear opening. The external part of the device detects sound waves and, using magic, transfers them down the receiver and into your ear. You can wear one or two depending on your hearing loss, and you can turn your hearing aids on or off using an Interact action.
    **Price.** 5 sp
  properties:
    kind: "assistive"
    price: "5 sp"
