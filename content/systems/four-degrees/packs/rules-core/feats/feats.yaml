- id: "automatic-knowledge"
  name: "Automatic Knowledge"
  source: "pc > Chapter 5: Feats"
  description: "You know basic facts off the top of your head. Choose a skill you're an expert in that has the Recall Knowledge action and for which you have the Assurance feat. You can use the Recall Knowledge action with that skill as a free action once per round. If you do, you must use Assurance on the skill check."
  properties:
