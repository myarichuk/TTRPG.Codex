- id: "clever-improviser"
  name: "Clever Improviser"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "You've learned how to handle situations when you're out of your depth. You gain the Untrained Improvisation general feat. In addition, you can attempt skill actions that normally require you to be trained, even if you are untrained."
  properties:
    level: 5
    traits: ["human"]
- id: "cling"
  name: "Cling"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "You hang onto a foe to harry them into submission. If your target moves while you're hanging onto it, you can choose to move with the target. The target is released if you choose not to move with it, at the start of your next turn, or if the target Escapes. Attempts to Escape from a Cling are made against your Acrobatics DC, but they end the Cling instead of the conditions normally ended by the Escape action."
  properties:
    level: 9
    actions: "one"
    traits: ["goblin"]
    requirements: "Your last action was a successful Strike and you have a free hand."
    special: "You can use this action without a free hand if your preceding Strike was made with your jaws or a similar unarmed attack you could use to hang on. The GM determines which unarmed attacks apply. Hanging on in this way prevents you from using that unarmed attack."
- id: "cloak-of-poison"
  name: "Cloak of Poison"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You secrete a cloak of concentrated poison that harms any who dare attack you. For 1 minute, any creature that touches you or damages you with an unarmed attack or melee weapon without the reach trait takes 3d6 poison damage."
  properties:
    level: 13
    actions: "two"
    traits: ["leshy", "poison"]
    frequency: "once per day"
- id: "cloud-jump"
  name: "Cloud Jump"
  source: "pc > Chapter 5: Feats"
  description: |-
    You unparalleled athletic skill allows you to jump impossible distances. Triple the distance you jump on a successful Long Jump (so you could jump 90 feet with an Athletics result of 30). When you successfully High Jump, use the distance jumped and distance limit for a Long Jump but don't triple the distance.
    You can jump a distance greater than your Speed by spending additional actions when you Long Jump or High Jump. For each additional action spent, add your Speed to the distance limit.
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Athletics"
- id: "combat-climber"
  name: "Combat Climber"
  source: "pc > Chapter 5: Feats"
  description: "Your techniques allow you to fight as you climb. You're not off-guard while Climbing and can Climb with a hand occupied. You must still use another hand and both legs to Climb."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Athletics"
- id: "communal-crafting"
  name: "Communal Crafting"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can have other PCs help you Craft an item, under your direction. A helper PC rolls a check with a skill in which they're trained. The skill must be Crafting or another skill relevant to the item, as determined by the GM. For example, a PC might use Religion to help you Craft an item with the divine trait or Warfare Lore to help you Craft a weapon. Your roll still determines whether you successfully create the item. Any helper's roll contributes toward reducing the cost of raw materials using the numbers from the Earn Income table; this uses the ally PC's proficiency rank in the skill and their level - 1 for their level.
    Helping PCs must accompany you throughout the Craft activity (preventing them from pursuing other downtime activities) or the benefit is lost. The GM might determine that only a certain number of PCs can help depending on the circumstances.
    Communal Crafting also allows you to take the role of a helper when someone else is crafting, provided they accept your help.
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Crafting"
- id: "confabulator"
  name: "Confabulator"
  source: "pc > Chapter 5: Feats"
  description: "Even when caught in falsehoods, you pile lie upon lie. Reduce the circumstance bonus a target gains for your previous attempts to Create a Diversion or Lie to it from +4 to +2. If you're a master in Deception, reduce the bonus to +1, and if you're legendary, your targets don't get these bonuses at all."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Deception"
- id: "continual-recovery"
  name: "Continual Recovery"
  source: "pc > Chapter 5: Feats"
  description: "You zealously monitor a patient's progress to administer treatment faster. When you Treat Wounds, your patient becomes immune for only 10 minutes instead of 1 hour. This applies only to your Treat Wounds activities, not any other the patient receives."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Medicine"
- id: "cooperative-nature"
  name: "Cooperative Nature"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "The short human life span lends perspective and has taught you from a young age to set aside differences and work with others to achieve greatness. You gain a +4 circumstance bonus on checks to Aid."
  properties:
    level: 1
    traits: ["human"]
- id: "cooperative-soul"
  name: "Cooperative Soul"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "You have developed a soul-deep bond with your comrades and maintain an even greater degree of cooperation with them. If you are at least an expert in the skill you are Aiding, when you roll a failure or critical failure to Aid a skill check, you get a success instead."
  properties:
    level: 9
    traits: ["human"]
- id: "courtly-graces"
  name: "Courtly Graces"
  source: "pc > Chapter 5: Feats"
  description: "You were raised among the nobility or have learned proper etiquette and bearing, allowing you to present yourself as a noble and play games of influence and politics. Unless you are intentionally presenting yourself differently, anyone who speaks with you will assume you are a noble or closely associated with the nobility (such as a prominent servant). You can use Society to Make an Impression on a noble, as well as with Impersonate to pretend to be a type of noble or a specific individual noble. If you use the normal skills in those situations, you receive a +1 circumstance bonus to the check instead."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Society"
- id: "craft-anything"
  name: "Craft Anything"
  source: "pc > Chapter 5: Feats"
  description: "You can find ways to craft just about anything, despite restrictions. As long as you have the appropriate Crafting skill feat (such as Magical Crafting for magic items) and meet the item's level and proficiency requirements, you ignore just about any other requirement, such as being of a specific ancestry or providing spells. If a requirement adds to the item's cost, you must still pay it (including castings of spells that themselves have a cost). You can't ignore requirements of special items that have exclusive means of access and Crafting, such as artifacts. The GM decides whether you can ignore a requirement."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Crafting"
- id: "cuckoo-hag-mother"
  name: "Cuckoo Hag Mother"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: |-
    You are the child of a cuckoo hag, making one of your eyes violet or even black. Your mother's powers over sleep and dreams have given you a degree of resistance to those effects, granting you a +2 circumstance bonus to all saving throws against sleep effects and effects that cause or alter dreams.
    In addition, sleep is more restorative for you. You regain HP equal to your Constitution modifier × double your level (instead of just × your level), and you reduce any drained and doomed conditions you have by 2 instead of by 1.
  properties:
    level: 1
    traits: ["changeling", "lineage"]
- id: "cultural-adaptability"
  name: "Cultural Adaptability"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "During your adventures, you've honed your ability to adapt to the culture of the predominant ancestry around you. You gain the Adopted Ancestry general feat, and you also gain one 1st-level ancestry feat from the ancestry you chose for the Adopted Ancestry feat."
  properties:
    level: 5
    traits: ["halfling"]
- id: "dance-underfoot"
  name: "Dance Underfoot"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You dart under the legs of your enemies in combat. You can end a successful Tumble Through action in a Large or larger enemy's space. Also, when using the Step Lively feat, you can Step into the triggering enemy's space. The enemy must have limbs or otherwise leave you enough room for this maneuver, as determined by the GM. For instance, you could share space with a giant or dragon, but not an ooze."
  properties:
    level: 9
    traits: ["halfling"]
    prerequisites: "Step Lively"
- id: "defy-death"
  name: "Defy Death"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You're exceptionally difficult to kill. The DC of your recovery checks is equal to 9 + your dying value, or 8 + your dying value if you have the Toughness general feat. In addition, whenever someone returns you to life using magic that would normally leave you debilitated for a week (such as raise dead or the resurrect ritual), you don't suffer that condition."
  properties:
    level: 5
    traits: ["orc"]
    prerequisites: "Orc Ferocity"
- id: "defy-the-darkness"
  name: "Defy the Darkness"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "Using ancient dwarven methods developed to fight enemies wielding magical darkness, you've honed your darkvision and sworn not to use such magic yourself. You gain greater darkvision, enabling you to see through magical darkness even if it normally hampers darkvision (such as the darkness created by a 4th-rank darkness spell). You can't cast spells with the darkness trait, use item activations with the darkness trait, or use any other ability with the darkness trait."
  properties:
    level: 5
    traits: ["dwarf"]
    prerequisites: "darkvision"
- id: "demon-blood"
  name: "Demon Blood"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: |-
    Your blood bears the mark of a demon, a living embodiment of sin. Demonic power pulses through your veins and manifests in a different way for each person with this lineage, whether you have webbed fingers and thrive in the water, large hands capable of wrestling larger foes, or some other manifestation. You are trained in Athletics. If you were already trained in Athletics (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain any one common 1st-level skill feat with a prerequisite of trained in Athletics, as reflects the manifestation of your fiendish blood.
  properties:
    level: 1
    traits: ["lineage", "nephilim"]
- id: "devil-blood"
  name: "Devil Blood"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Your lineage descends from devils, conniving schemers. You're as skilled at noticing lies and twisted wordings as you are at constructing them. You are trained in Deception and Legal Lore. If you were already trained in Deception (from your background or class, for example), you instead become trained in a skill of your choice. You also gain the Lie to Me skill feat."
  properties:
    level: 1
    traits: ["lineage", "nephilim"]
- id: "diehard"
  name: "Diehard"
  source: "pc > Chapter 5: Feats"
  description: "It takes more to kill you than most. You die from the dying condition at dying 5, rather than dying 4."
  properties:
    level: 1
    traits: ["general"]
- id: "distracting-shadows"
  name: "Distracting Shadows"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You have learned to remain hidden by using larger folk as a distraction to avoid drawing attention to yourself. You can use creatures that are at least one size larger than you (usually Medium or larger) as cover for the Hide and Sneak actions, though you still can't use such creatures as cover for other uses, such as the Take Cover action."
  properties:
    level: 1
    traits: ["halfling"]
- id: "divine-countermeasures"
  name: "Divine Countermeasures"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You've studied your extraplanar heritage with the intent of better defending yourself, whether against creatures aligned with or opposed to your extraplanar lineage, and you've found that your techniques are equally powerful against celestials, fiends, and other divine entities. You gain a +1 circumstance bonus to all saving throws against divine effects."
  properties:
    level: 9
    traits: ["nephilim"]
- id: "divine-declaration"
  name: "Divine Declaration"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You can call forth a holy or unholy word from the realms beyond to punish your foes. Once per day, you can cast divine decree as a 7th-rank divine innate spell."
  properties:
    level: 17
    traits: ["nephilim"]
- id: "divine-guidance"
  name: "Divine Guidance"
  source: "pc > Chapter 5: Feats"
  description: "You're so immersed in divine scripture that you find meaning and guidance for any situation in your texts. Spend 10 minutes Deciphering Writing on religious scriptures of your deity or philosophy while thinking about a particular problem or conundrum you face, and then attempt a Religion check (DC determined by the GM). If you succeed, you unearth a relevant passage, parable, or aphorism that can help you move forward or change your thinking to help solve your conundrum."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Religion"
- id: "divine-wings"
  name: "Divine Wings"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "With effort, you can call forth magical wings from your back, similar in appearance to those of your extraplanar forebear, whether they be elegantly feathered wings or ominous bat wings. These wings remain for 10 minutes. You gain a fly Speed equal to your Speed while you've manifested your wings."
  properties:
    level: 9
    actions: "two"
    traits: ["divine", "morph", "nephilim"]
    frequency: "once per day"
- id: "dubious-knowledge"
  name: "Dubious Knowledge"
  source: "pc > Chapter 5: Feats"
  description: "You're a treasure trove of information, but not all of it comes from reputable sources. When you fail (but don't critically fail) a Recall Knowledge check using any skill, you learn the correct answer and an erroneous answer, but you don't have any way to differentiate which is which. This can occur as knowing something is significant, but not whether it's good or bad."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in a skill with the Recall Knowledge action"
- id: "dwarven-doughtiness"
  name: "Dwarven Doughtiness"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "You are naturally calm and collected in the face of imminent danger. At the end of your turn, reduce your frightened condition by 2 instead of 1."
  properties:
    level: 1
    traits: ["dwarf"]
- id: "dwarven-lore"
  name: "Dwarven Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    You eagerly absorbed the old stories and traditions of your ancestors, your gods, and your people, studying subjects and techniques passed down for generation upon generation. You gain the trained proficiency rank in Crafting and Religion. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Dwarf Lore.
  properties:
    level: 1
    traits: ["dwarf"]
- id: "dwarven-reinforcement"
  name: "Dwarven Reinforcement"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "You can use your knowledge of engineering and metalwork to temporarily strengthen thick objects and structures. By spending 1 hour working on an item, you can give it a +1 circumstance bonus to its Hardness for 24 hours. If you're a master in Crafting, the bonus is +2, and if you're legendary, the bonus is +3. You can reinforce a portion of a structure, though 1 hour usually reinforces only a door, a few windows, or another section that fits within a 10-foot cube."
  properties:
    level: 5
    traits: ["dwarf"]
    prerequisites: "expert in Crafting"
- id: "dwarven-weapon-familiarity"
  name: "Dwarven Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    Your kin have instilled in you an affinity for hard-hitting weapons, and you prefer these to more elegant arms. You gain access to all uncommon weapons with the dwarf trait. You have familiarity with weapons with the dwarf trait plus the battle axe, pick, and warhammer—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["dwarf"]
- id: "earned-glory"
  name: "Earned Glory"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: |-
    Elves often struggle with underestimating half-elves, and you are experienced at telling stories of your accomplishments to gain their respect. You are trained in Performance. If you would automatically become trained in Performance (from your background or class, for example), you instead become trained in a skill of your choice.
    You gain the Impressive Performance feat. When you attempt a Performance check to Make an Impression on an elf, if you roll a critical failure, you get a failure instead.
  properties:
    level: 1
    traits: ["half-elf"]
- id: "echoes-in-stone"
  name: "Echoes in Stone"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "You pause a moment to attune your senses to the stone around you. Until the start of your next turn, you gain imprecise tremorsense with a range of 20 feet."
  properties:
    level: 9
    actions: "one"
    traits: ["concentrate", "dwarf"]
    requirements: "You are standing on a stone or earthen surface."
- id: "elf-atavism"
  name: "Elf Atavism"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: "Your elven blood runs particularly strong, granting you features far more elven than those of a typical half-elf. You may also have been raised among elves, steeped in your elven ancestors' heritage. You gain the benefits of the elf heritage of your elven parent or ancestors. You typically can't select a heritage that depends on or improves an elven feature you don't have. For example, you couldn't take the Ancient Elf heritage unless your non-elf ancestry also has a lifespan measured in multiple centuries. In these cases, at the GM's discretion, you might gain a different benefit."
  properties:
    level: 1
    traits: ["half-elf"]
    special: "You can take this feat only at 1st level, and you can't retrain out of this feat or into this feat."
- id: "elf-step"
  name: "Elf Step"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "You move in a graceful dance, and even your steps are broad. You Step 5 feet twice."
  properties:
    level: 9
    actions: "one"
    traits: ["elf"]
- id: "elven-lore"
  name: "Elven Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    You've studied traditional elven arts, learning about arcane magic and the world around you. You gain the trained proficiency rank in Arcana and Nature. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Elf Lore.
  properties:
    level: 1
    traits: ["elf"]
- id: "elven-weapon-familiarity"
  name: "Elven Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    You favor bows and other elegant weapons. You gain access to all uncommon weapons with the elf trait. You have familiarity with weapons with the elf trait plus longbows, composite longbows, rapiers, shortbows, and composite shortbows—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["elf"]
- id: "energized-font"
  name: "Energized Font"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "You can focus your mind more quickly thanks to the magic that flows within you. You regain 1 Focus Point, up to your usual maximum."
  properties:
    level: 5
    actions: "one"
    traits: ["gnome"]
    prerequisites: "focus pool, at least one innate spell from a gnome heritage or ancestry feat that shares a tradition with at least one of your focus spells"
    frequency: "once per day"
- id: "eternal-wings"
  name: "Eternal Wings"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Your wings are now a permanent part of your body. You gain the effects of Divine Wings at all times, rather than just once per day for 10 minutes."
  properties:
    level: 17
    traits: ["nephilim"]
    prerequisites: "Divine Wings"
- id: "expeditious-search"
  name: "Expeditious Search"
  source: "pc > Chapter 5: Feats"
  description: "You have a system that lets you search at great speed, finding details and secrets twice as quickly as others can. When Searching, you take half as long as usual to Search a given area. This means that while exploring, you double the Speed you can move while ensuring you've Searched an area before walking into it (up to half your Speed). If you're legendary in Perception, you instead Search areas four times as quickly."
  properties:
    level: 7
    traits: ["general"]
    prerequisites: "master in Perception"
- id: "experienced-professional"
  name: "Experienced Professional"
  source: "pc > Chapter 5: Feats"
  description: "You carefully safeguard your professional endeavors to prevent disaster. When you use Lore to Earn Income, if you roll a critical failure, you instead get a failure. If you're an expert in Lore, you gain twice as much income from a failed check to Earn Income, unless it was originally a critical failure."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Lore"
- id: "experienced-smuggler"
  name: "Experienced Smuggler"
  source: "pc > Chapter 5: Feats"
  description: "You often smuggle things past the authorities. When the GM rolls your Stealth check to see if a passive observer notices a small item you've concealed, the GM uses the number rolled or 10—whichever is higher—as the result of your die roll, adding it to your Stealth modifier to determine your Stealth check result. If you're a master in Stealth, the GM uses the number rolled or 15, and if you're legendary in Stealth, you automatically succeed at hiding a small concealed item from passive observers. This provides no benefits when a creature attempts a Perception check while actively searching you for hidden items."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Stealth"
- id: "experienced-tracker"
  name: "Experienced Tracker"
  source: "pc > Chapter 5: Feats"
  description: "Tracking is second nature to you, and when necessary you can follow a trail without pause. You can Track while moving at full Speed by taking a -5 penalty to your Survival check. If you're a master in Survival, you don't take the -5 penalty. If you're legendary in Survival, you no longer need to roll a new Survival check every hour when tracking, though you still need to roll whenever there are significant changes in the trail."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Survival"
- id: "expert-longevity"
  name: "Expert Longevity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    You've continued to refine the knowledge and skills you've gained through your life. When you choose a skill in which to become trained with Ancestral Longevity, you can also choose a skill in which you are already trained and become an expert in that skill. This lasts until your Ancestral Longevity expires.
    When the effects of Ancestral Longevity and Expert Longevity expire, you can retrain one of your skill increases. The skill increase you gain from this retraining must either make you trained in the skill you chose with Ancestral Longevity or make you an expert in the skill you chose with Expert Longevity.
  properties:
    level: 9
    traits: ["elf"]
    prerequisites: "Ancestral Longevity"
- id: "extraplanar-supplication"
  name: "Extraplanar Supplication"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You call upon divine power to place a benediction upon your allies or a malediction upon your foes. Choose either bless or bane. You can cast the chosen spell once per day as a 1st-rank divine innate spell."
  properties:
    level: 5
    traits: ["nephilim"]
- id: "fascinating-performance"
  name: "Fascinating Performance"
  source: "pc > Chapter 5: Feats"
  description: |-
    When you Perform, compare your result to the Will DC of one observer. If you succeed, the target is fascinated by you for 1 round. If the observer is in a situation that demands immediate attention, such as combat, you must critically succeed to fascinate it and the Perform action gains the incapacitation trait. You must choose which creature you're trying to fascinate before you roll your check, and the target is then temporarily immune for 1 hour.
    If you're an expert in Performance, you can fascinate up to four observers; if you're a master, you can fascinate up to 10 observers; and if you're legendary, you can fascinate any number of observers at the same time.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Performance"
- id: "fast-recovery"
  name: "Fast Recovery"
  source: "pc > Chapter 5: Feats"
  description: "Your body quickly bounces back from afflictions. You regain twice as many Hit Points from resting. Each time you succeed at a Fortitude save against an ongoing disease or poison, you reduce its stage by 2, or by 1 against a virulent disease or poison. Each critical success you achieve against an ongoing disease or poison reduces its stage by 3, or by 2 against a virulent disease or poison. In addition, you reduce the severity of your drained condition by 2 when you rest for a night instead of by 1."
  properties:
    level: 1
    traits: ["general"]
    prerequisites: "Constitution +2"
- id: "feather-step"
  name: "Feather Step"
  source: "pc > Chapter 5: Feats"
  description: "You step carefully and quickly. You can Step into difficult terrain."
  properties:
    level: 1
    traits: ["general"]
    prerequisites: "Dexterity +2"
- id: "ferocious-beasts"
  name: "Ferocious Beasts"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "Since ancient times, the mightiest orc beast tamers would draw out the true fighting spirit of their companion beasts by feeding the creatures a draft incorporating the orc's own blood. All animal companions, pets, familiars, and bonded animals you have gain the Orc Ferocity feat, and gain one reaction per round they can use only for Orc Ferocity. If you have the Undying Ferocity ancestry feat, all animal companions, pets, familiars, and bonded animals you have also gain the benefits of that feat when using the Orc Ferocity reaction."
  properties:
    level: 13
    traits: ["orc"]
    prerequisites: "animal companion, Pet, or Bonded Animal; Orc Ferocity"
- id: "fey-fellowship"
  name: "Fey Fellowship"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: |-
    Your enhanced fey connection (either through your blood or via prolonged contact with their kind) affords you a warmer reception from fey creatures as well as tools to foil their tricks or withstand their magic. You gain a +2 circumstance bonus to both Perception checks and saving throws against fey.
    In addition, whenever you meet a fey creature in a social situation, you can immediately attempt a Diplomacy check to Make an Impression on that creature rather than needing to converse for 1 minute. You take a -5 penalty to the check. If you fail, you can engage in 1 minute of conversation and attempt a new check at the end of that time rather than accepting the failure or critical failure result.
  properties:
    level: 1
    traits: ["gnome"]
- id: "fey-realm-adept"
  name: "Fey Realm Adept"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "Over time your fey magic has grown stronger. You gain invisibility and revealing light as 2nd-rank primal innate spells. You can cast each of these primal innate spells once per day."
  properties:
    level: 9
    traits: ["gnome"]
    prerequisites: "at least one primal innate spell"
- id: "fey-realm-magic"
  name: "Fey Realm Magic"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "Your connection to the fey realm grants you a primal innate spell, much like those of the fey. Choose one cantrip from the primal spell list. You can cast this spell as a primal innate spell at will. A cantrip is heightened to a spell rank equal to half your level rounded up."
  properties:
    level: 1
    traits: ["gnome"]
- id: "fiendish-magic"
  name: "Fiendish Magic"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: |-
    You possess fiendish magic. Choose two of the following spells: disguise magic, false vitality, invisibility, see the unseen, shatter, or paranoia. You can use each of the chosen spells once per day as 2nd-rank divine innate spells.
    Those with soul-eater blood typically take false vitality and see the unseen, those with demon blood typically take paranoia and shatter, and those with devil blood typically take invisibility and disguise.
  properties:
    level: 9
    traits: ["nephilim"]
    prerequisites: "Soul-Eater Blood, Demon Blood, Devil Blood, or another lineage feat associated with fiends"
- id: "fleet"
  name: "Fleet"
  source: "pc > Chapter 5: Feats"
  description: "You move more quickly on foot. Your Speed increases by 5 feet."
  properties:
    level: 1
    traits: ["general"]
- id: "flourish-and-ruin"
  name: "Flourish and Ruin"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You can call upon the vital essence of your spirit to restore life to your allies and call forth vines to ensnare and bludgeon your foes. You can cast field of life and tangling creepers as 6th-rank primal innate spells once per day each."
  properties:
    level: 17
    traits: ["leshy"]
- id: "foil-senses"
  name: "Foil Senses"
  source: "pc > Chapter 5: Feats"
  description: "You are adept at foiling creatures' special senses and cautious enough to safeguard against them at all times. Whenever you use the Avoid Notice, Hide, or Sneak actions, you are always considered to be taking precautions against special senses."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Stealth"
- id: "folksy-patter"
  name: "Folksy Patter"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You are adept at disguising coded messages as folksy idioms. Using slang, jokes, halfling loanwords, and the like, you convey a simple message consisting of three basic words (such as \"Danger assassin flee\" or \"Meet me moonrise\"). Your intended listener can attempt a DC 20 Perception check to discern the message. This DC is reduced by 5 if the listener is a halfling or has Folksy Patter, or by 10 if both apply. Eavesdroppers can also attempt a Perception check against your Deception DC to discern your meaning. Any bonuses or penalties to Perception checks to Sense Motive apply to checks to understand Folksy Patter."
  properties:
    level: 1
    traits: ["halfling"]
- id: "forager"
  name: "Forager"
  source: "pc > Chapter 5: Feats"
  description: |-
    While using Survival to Subsist, if you roll any result worse than a success, you get a success. On a success, you can provide subsistence living for yourself and four additional creatures, and on a critical success, you can take care of twice as many additional creatures. You can choose to support half the number of creatures with a comfortable living.
    Increase the number of additional creatures you feed on a success to eight if you're an expert in Survival, 16 if you're a master, and 32 if you're legendary.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Survival"
- id: "freedom-spirit-blood"
  name: "Freedom Spirit Blood"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Your blood sings with the liberating power of celestials who embody freedom. You gain a +1 circumstance bonus to Escape. When you roll a critical failure on a check to Escape, you get a failure instead, and when you roll a success, you get a critical success instead."
  properties:
    level: 1
    traits: ["lineage", "nephilim"]
- id: "general-training"
  name: "General Training"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "Your adaptability manifests in your mastery of a range of useful abilities. You gain a 1st-level general feat. You must meet the feat's prerequisites, but if you select this feat during character creation, you can select the feat later in the process in order to determine which prerequisites you meet."
  properties:
    level: 1
    traits: ["human"]
    special: "You can select this feat multiple times, choosing a different feat each time."
- id: "glad-hand"
  name: "Glad-Hand"
  source: "pc > Chapter 5: Feats"
  description: "First impressions are your strong suit. When you meet someone in a casual or social situation, you can immediately attempt a Diplomacy check to Make an Impression on that creature rather than needing to converse for 1 minute. If you fail, you can engage in 1 minute of conversation and attempt a new check at the end of that time rather than accepting the failure or critical failure result."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Diplomacy"
- id: "gnome-obsession"
  name: "Gnome Obsession"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "You might have a flighty nature, but when a topic captures your attention, you dive into it headfirst. You gain the Additional Lore feat and the Assurance feat for the chosen Lore. As gnome obsessions can come and go quickly, you can retrain Gnome Obsession to a different Lore subcategory in 1 day of downtime."
  properties:
    level: 1
    traits: ["gnome"]
- id: "gnome-weapon-familiarity"
  name: "Gnome Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: |-
    You favor unusual weapons tied to your people, such as blades with curved and peculiar shapes. You gain access to kukris and all uncommon weapons with the gnome trait. You have familiarity with weapons with the gnome trait plus the glaive and kukri—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["gnome"]
- id: "goblin-lore"
  name: "Goblin Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    You've picked up skills and tales from your goblin community. You gain the trained proficiency rank in Nature and Stealth. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Goblin Lore.
  properties:
    level: 1
    traits: ["goblin"]
- id: "goblin-scuttle"
  name: "Goblin Scuttle"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "You take advantage of your ally's movement to adjust your position. You Step."
  properties:
    level: 1
    actions: "reaction"
    traits: ["goblin"]
    trigger: "An ally ends a move action adjacent to you."
- id: "goblin-song"
  name: "Goblin Song"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    You sing annoying goblin songs, distracting your foes with silly and repetitive lyrics. Attempt a Performance check against the Will DC of a single enemy within 30 feet. This has all the usual traits and restrictions of a Performance check to sing.
    You can affect up to two targets within range if you have expert proficiency in Performance, four if you have master proficiency, and eight if you have legendary proficiency.
    **Critical Success.** The target takes a -1 status penalty to Perception checks and Will saves for 1 minute.
    **Success.** The target takes a -1 status penalty to Perception checks and Will saves for 1 round.
    **Critical Failure.** The target is temporarily immune to Goblin Song for 1 hour.
  properties:
    level: 1
    actions: "one"
    traits: ["goblin"]
- id: "goblin-weapon-familiarity"
  name: "Goblin Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    Others might look upon them with disdain, but you know that the weapons of your people are as effective as they are sharp. You gain access to all uncommon weapons with the goblin trait. You have familiarity with weapons with the goblin trait—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["goblin"]
- id: "grasping-reach"
  name: "Grasping Reach"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You can extend a tangle of vines or tendrils to support your arms and extend your reach. When you wield a melee weapon that requires two hands, doesn't have reach, and deals at least 1d6 damage, you can change between a typical two-handed grip and an extended two-handed grasp using an Interact action. Weapons wielded in your extended grasp gain reach of 10 feet. This grasp is less stable and powerful than a typical grip, reducing the weapon's damage die by 1 step."
  properties:
    level: 1
    traits: ["leshy"]
- id: "group-aid"
  name: "Group Aid"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: |-
    Your upbringing emphasized teamwork, and helping your allies comes naturally to you. After you Aid an ally at a skill check that doesn't have the attack trait, you can also Aid any other ally who attempts the same skill check for the same purpose that round. You do so as a free action rather than a reaction.
    The preparation you did to help must still apply to the other allies, and you can Aid each ally only once. For example, if you helped lift up an ally to Aid them on an Athletics check to scale a wall, you could keep the same posture to give a boost to other allies attempting to scale the wall in the same round.
  properties:
    level: 9
    traits: ["human"]
- id: "group-coercion"
  name: "Group Coercion"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can strong-arm people effectively, even when you don't have them isolated. When you Coerce, you can compare your Intimidation check result to the Will DCs of up to five targets instead of one.
    It's possible to get a different degree of success for each target. The number of targets you can Coerce in a single action increases to 10 if you're an expert, 25 if you're a master, and 50 if you're legendary.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Intimidation"
- id: "group-impression"
  name: "Group Impression"
  source: "pc > Chapter 5: Feats"
  description: "When you Make an Impression, you can compare your Diplomacy check result to the Will DCs of up to 10 targets you conversed with, with no penalty. The number of targets increases to 20 if you're an expert, 50 if you're a master, and 100 if you're legendary."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Diplomacy"
- id: "guiding-luck"
  name: "Guiding Luck"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "Your luck guides you to look the right way and aim your blows unerringly. You can use Halfling Luck twice per day: once in response to its normal trigger, and once when you fail a Perception check or attack roll instead of the normal trigger."
  properties:
    level: 9
    traits: ["halfling"]
    prerequisites: "Halfling Luck"
- id: "hag-claws"
  name: "Hag Claws"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "When you came of age, your fingernails grew long and sharp. You gain a claw unarmed attack that deals 1d4 slashing damage. Your claws are in the brawling group and have the agile, finesse, and unarmed traits."
  properties:
    level: 1
    traits: ["changeling"]
    special: "Hag claws can develop at any point in a changeling's life. You can select this feat anytime you would gain an ancestry feat, but you can't retrain out of it."
- id: "hag-magic"
  name: "Hag Magic"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: |-
    Through your heritage, you can replicate a hag's magic. Choose one common spell of 4th rank or lower from those available to a coven, including the spells contributed to a coven by a hag of your mother's type. You can cast this spell once per day as a 4th-rank occult innate spell.
    Spells available to all covens are augury, charm, clairaudience, clairvoyance, dream message, and illusory disguise. The eligible spells granted by the most prominent types of hag are: Cuckoo Hag nightmare, spellwrack; Iron Hag earthbind, spellwrack; Sea Hag humanoid form, mariner's curse, water walk; Sweet Hag charm, honeyed words, outcast's curse
  properties:
    level: 13
    traits: ["changeling"]
- id: "hag-s-sight"
  name: "Hag's Sight"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "You've nurtured the supernatural abilities gifted by your hag mother, particularly your sight. You gain darkvision."
  properties:
    level: 1
    traits: ["changeling"]
- id: "halfling-lore"
  name: "Halfling Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: |-
    You've dutifully learned how to keep your balance and how to stick to the shadows where it's safe, important skills passed down through generations of halfling tradition. You gain the trained proficiency rank in Acrobatics and Stealth. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Halfling Lore.
  properties:
    level: 1
    traits: ["halfling"]
- id: "halfling-luck"
  name: "Halfling Luck"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "Your happy-go-lucky nature makes it seem like misfortune avoids you, and to an extent, that might even be true. You can reroll the triggering check, but you must use the new result, even if it's worse."
  properties:
    level: 1
    actions: "free"
    traits: ["fortune", "halfling"]
    frequency: "once per day"
    trigger: "You fail a skill check or saving throw."
- id: "halfling-weapon-familiarity"
  name: "Halfling Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: |-
    You favor traditional halfling weapons, so you've learned how to use them more effectively. You gain access to all uncommon weapons with the halfling trait. You have familiarity with weapons with the halfling trait plus the sling and shortsword—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["halfling"]
- id: "halo"
  name: "Halo"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You have a halo of light and goodness that sheds light with the effects of a divine light cantrip. A cantrip is heightened to a spell rank equal to half your level rounded up. You can Sustain to suppress or reestablish the halo."
  properties:
    level: 1
    traits: ["nephilim"]
- id: "hardy-traveler"
  name: "Hardy Traveler"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "There's no journey too far or burden too heavy when you have friends at your side or hope within your heart. Increase your maximum and encumbered Bulk limits by 1. In addition, you gain a +10-foot circumstance bonus to your Speed during overland travel."
  properties:
    level: 9
    traits: ["human"]
- id: "harmlessly-cute"
  name: "Harmlessly Cute"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "Your size and demeanor make it easy for you to convince others that you mean no harm. You gain the Shameless Request skill feat. Additionally, you gain a +1 circumstance bonus to initiative checks when you roll Deception for initiative."
  properties:
    level: 1
    traits: ["leshy"]
- id: "haughty-obstinacy"
  name: "Haughty Obstinacy"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "Your powerful ego makes it harder for others to order you around. If you roll a success on a saving throw against a mental effect that attempts to directly control your actions, you critically succeed instead. If a creature rolls a failure on a check to Coerce you using Intimidation, it gets a critical failure instead (so it can't try to Coerce you again for 1 week)."
  properties:
    level: 1
    traits: ["human"]
- id: "hefty-hauler"
  name: "Hefty Hauler"
  source: "pc > Chapter 5: Feats"
  description: "You can carry more than your frame implies. Increase your maximum and encumbered Bulk limits by 2."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Athletics"
- id: "heroic-presence"
  name: "Heroic Presence"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "The blood of heroes courses through your veins, and you inspire your allies to dig deep and find a new level of resolve. You grant up to 10 willing creatures within 30 feet the effects of a 6th-rank zealous conviction, though the effect automatically ends on a target if you give that target a command they would normally find repugnant. This action has the auditory trait or visual trait, depending on how you inspire your allies."
  properties:
    level: 17
    actions: "one"
    traits: ["emotion", "human", "mental"]
    frequency: "once per day"
- id: "hobnobber"
  name: "Hobnobber"
  source: "pc > Chapter 5: Feats"
  description: "You are skilled at learning information through conversation. The Gather Information exploration activity takes you half as long as normal (typically reducing the time to 1 hour). If you're a master in Diplomacy and roll a critical failure to Gather Information, you get a failure instead. There is still no guarantee that a rumor you learn with Gather Information is accurate."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Diplomacy"
- id: "hold-mark"
  name: "Hold Mark"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: |-
    You bear scars or tattoos enhanced by the mark of your community's prowess. When you select this feat, choose one of the options from the below table. You are trained in the listed skill and gain a +1 status bonus to saves against spells from the listed tradition. You gain a large brand or tattoo in the shape of the chosen emblem or a similar concept, such as a fiery symbol.
    Hold Mark Emblem Skill Tradition
    Fire symbol Diplomacy Arcane
    Skull Survival Primal
    Corpse Religion Divine
    Open hand Intimidation Occult
  properties:
    level: 1
    traits: ["orc"]
- id: "homeward-bound"
  name: "Homeward Bound"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "The connection between you and the fey realm resonates within your body stronger than it does for most gnomes, allowing you to cross the threshold between this world and the fey realm. You gain interplanar teleport as a primal innate spell. You can cast it twice per week. This can be used only to travel back and forth between this world and the fey realm. Due to your body's natural resonance, you can act as a locus for the spell, and you don't require a specially attuned planar key."
  properties:
    level: 17
    traits: ["uncommon", "gnome"]
    frequency: "twice per week"
- id: "illusion-sense"
  name: "Illusion Sense"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: |-
    Your ancestors spent their days cloaked and cradled in illusions, and as a result, sensing illusion magic is second nature to you. You gain a +1 circumstance bonus to both Perception checks and Will saves against illusions.
    When you come within 10 feet of an illusion that can be disbelieved, the GM rolls a secret check for you to disbelieve it, even if you didn't spend an action to Interact with the illusion.
  properties:
    level: 1
    traits: ["gnome"]
- id: "impeccable-crafting"
  name: "Impeccable Crafting"
  source: "pc > Chapter 5: Feats"
  description: "You craft flawless creations with great efficiency. Whenever you roll a success at a Crafting check to make an item of the type you chose with Specialty Crafting, you get a critical success instead."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Crafting, Specialty Crafting"
- id: "impressive-performance"
  name: "Impressive Performance"
  source: "pc > Chapter 5: Feats"
  description: "Your performances inspire admiration and win you fans. You can Make an Impression using Performance instead of Diplomacy. If you spend at least 10 minutes performing in front of an audience, you can Make an Impression targeting up to 10 members of the audience who were there for the whole performance, without taking the normal penalty. The number of targets increases to 20 for a 1-hour performance and 50 for a 2-hour performance."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Performance"
- id: "incredible-ferocity"
  name: "Incredible Ferocity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "Given time to collect yourself after a near-death scrape, you can rebuild your ferocity and withstand additional finishing blows. You can use Orc Ferocity with a frequency of once per hour, rather than once per day."
  properties:
    level: 13
    traits: ["orc"]
    prerequisites: "Orc Ferocity"
- id: "incredible-improvisation"
  name: "Incredible Improvisation"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "A stroke of brilliance gives you a major advantage with a skill despite your inexperience. Gain a +4 circumstance bonus to the triggering skill check."
  properties:
    level: 9
    actions: "free"
    traits: ["human"]
    frequency: "once per day"
    trigger: "You attempt a check using a skill you're untrained in."
- id: "incredible-initiative"
  name: "Incredible Initiative"
  source: "pc > Chapter 5: Feats"
  description: "You react more quickly than others can. You gain a +2 circumstance bonus to initiative rolls."
  properties:
    level: 1
    traits: ["general"]
- id: "incredible-investiture"
  name: "Incredible Investiture"
  source: "pc > Chapter 5: Feats"
  description: "You have an incredible ability to invest more magic items. Increase your limit on invested items from 10 to 12."
  properties:
    level: 11
    traits: ["general"]
    prerequisites: "Charisma +3"
- id: "inspire-imitation"
  name: "Inspire Imitation"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: "Your actions inspire your allies to great achievements. Whenever you critically succeed at a skill check, you automatically qualify to use the Aid reaction when attempting to help an ally using the same skill, even without spending an action to prepare to do so."
  properties:
    level: 5
    traits: ["half-elf"]
- id: "instinctive-obfuscation"
  name: "Instinctive Obfuscation"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "The magic within you manifests as a natural reaction to threats. An illusory double of you appears in your space for a brief moment. The triggering attacker must roll a DC 10 flat check; on a success, the attack targets you normally; if they fail, the attack targets the double and destroys it. The tradition of this action matches the tradition of your gnome ancestry options."
  properties:
    level: 13
    actions: "reaction"
    traits: ["gnome", "illusion", "visual"]
    prerequisites: "at least one arcane or occult innate spell gained from a gnome heritage or gnome ancestry feat"
    frequency: "once per hour"
    trigger: "You are attacked by a foe, but they haven't rolled yet."
- id: "intimidating-glare"
  name: "Intimidating Glare"
  source: "pc > Chapter 5: Feats"
  description: "You can Demoralize with a mere glare. When you do, Demoralize loses the auditory trait and gains the visual trait, and you don't take a penalty if the creature doesn't understand your language."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Intimidation"
- id: "intimidating-prowess"
  name: "Intimidating Prowess"
  source: "pc > Chapter 5: Feats"
  description: "In situations where you can physically menace the target when you Coerce or Demoralize, you gain a +1 circumstance bonus to your Intimidation check and you ignore the penalty for not sharing a language. If your Strength modifier is +5 or higher and you are a master in Intimidation, this bonus increases to +2."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "Strength +3, expert in Intimidation"
- id: "inventor"
  name: "Inventor"
  source: "pc > Chapter 5: Feats"
  description: |-
    You are a genius at Crafting, easily able to determine how things are made and create new inventions. You can spend downtime to invent a common formula that you don't know. This works just like the Craft activity: you spend half the Price of the formula up front, attempt a Crafting check, and on a success either finish the formula by paying the difference or work for longer to decrease the Price. The difference is that you spend the additional time in research, design, and development, rather than in creating an item. Once it's complete, you add the new formula you invented to your formula book.
    The GM might allow you to invent uncommon or rare formulas, typically with an increased DC. You need the Alchemical Crafting feat to invent alchemical formulas and the Magical Crafting feat to invent magical formulas.
  properties:
    level: 2
    traits: ["downtime", "general", "skill"]
    prerequisites: "expert in Crafting"
- id: "iron-fists"
  name: "Iron Fists"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "Your fists have been forged by battle, your naturally tough skin and dense bone further hardened by conflict. Your fist unarmed attacks no longer have the nonlethal trait and gain the shove weapon trait."
  properties:
    level: 1
    traits: ["orc"]
- id: "iron-hag-mother"
  name: "Iron Hag Mother"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "Your mother was an iron hag known for physical prowess, and you have one violet or steel-gray eye. You have thick, sturdy claws made of cold iron that grow naturally from your body. You gain a claw unarmed attack that deals 1d6 slashing damage. Your claws are in the brawling group, have the unarmed and grapple traits, and are cold iron."
  properties:
    level: 1
    traits: ["changeling", "lineage"]
- id: "irrepressible"
  name: "Irrepressible"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You are easily able to ward off attempts to play on your fears and emotions. When you roll a success on a saving throw against an emotion effect, you get a critical success instead. If your heritage is gutsy halfling, when you roll a critical failure on a saving throw against an emotion effect, you get a failure instead."
  properties:
    level: 9
    traits: ["halfling"]
- id: "junk-tinker"
  name: "Junk Tinker"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    You can make useful tools out of even twisted or rusted scraps. When using the Crafting skill to Craft, you can make level 0 items, including weapons and armor, out of junk. This reduces the Price to one-quarter the usual amount but always results in a shoddy item. Shoddy items normally give a penalty, but you don't take this penalty when using shoddy items you made (nor does the worse check penalty of shoddy armor you made apply to you).
    You can also incorporate junk to save money while you Craft any item. This grants you a discount on the item as if you had spent 1 additional day working to reduce the cost, but the item is obviously made of junk. At the GM's discretion, this might affect the item's resale value depending on the buyer's tastes.
  properties:
    level: 1
    traits: ["goblin"]
- id: "kip-up"
  name: "Kip Up"
  source: "pc > Chapter 5: Feats"
  description: "You stand up. This movement doesn't trigger reactions."
  properties:
    level: 7
    actions: "free"
    traits: ["general", "skill"]
    prerequisites: "master in Acrobatics"
- id: "kneecap"
  name: "Kneecap"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "You deliver a punishing blow to an enemy's knee, shin, or other vulnerable anatomy within your reach. Make a melee Strike with a melee weapon or melee unarmed attack. This attack doesn't deal damage. On a hit, the target takes a -10-foot status penalty to its Speed (or a -15-foot status penalty on a critical hit). The penalty lasts for 1 round. This penalty applies only if the target has a land Speed and depends on legs or other targetable appendages to use its land Speed. As with all penalties to Speed, this can't reduce a creature's Speed below 5 feet."
  properties:
    level: 5
    actions: "one"
    traits: ["goblin"]
- id: "lasting-coercion"
  name: "Lasting Coercion"
  source: "pc > Chapter 5: Feats"
  description: "When you successfully Coerce someone, the maximum time they comply increases to a week, still determined by the GM. If you're legendary, the maximum increases to a month."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Intimidation"
- id: "law-guardian-blood"
  name: "Law Guardian Blood"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You trace your lineage to celestials who guard law and virtue within mortals. You gain a +1 circumstance bonus to saves against emotion effects, and if you roll a success on a save against an emotion effect, you get a critical success instead."
  properties:
    level: 1
    traits: ["lineage", "nephilim"]
- id: "legendary-codebreaker"
  name: "Legendary Codebreaker"
  source: "pc > Chapter 5: Feats"
  description: "Your skill with languages and codes is so great that you can decipher information with little more than a quick read through a text. You can Decipher Writing using Society while reading at normal speed. If you slow down and spend the full amount of time that's ordinarily required and roll a success, you get a critical success; if you critically succeed while spending the normal amount of time, you gain a nearly word-for-word understanding of the document."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Society"
- id: "legendary-linguist"
  name: "Legendary Linguist"
  source: "pc > Chapter 5: Feats"
  description: "You're so skilled with languages you can create a pidgin instantly. You can always talk to any creature that has a language—even a language you don't know—by creating a new pidgin language that uses simplified terms and conveys basic concepts. To do so, you must first understand at least what medium of communication the creature uses (speech, sign language, and so on)."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Society, Multilingual"
- id: "legendary-medic"
  name: "Legendary Medic"
  source: "pc > Chapter 5: Feats"
  description: "You've discovered medical breakthroughs or techniques that achieve miraculous results. Once per day for each target, you can spend 1 hour treating that target and attempt a Medicine check to remove a disease or the blinded, deafened, doomed, or drained condition. Use the DC of the disease or of the spell or effect that created the condition. If the effect's source is an artifact, above 20th level, or similarly powerful, increase the DC by 10."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Medicine"
- id: "legendary-negotiation"
  name: "Legendary Negotiation"
  source: "pc > Chapter 5: Feats"
  description: "You can negotiate incredibly quickly in adverse situations. You attempt to Make an Impression and then Request your opponent cease their current activity and engage in negotiations. You take a -5 penalty to your Diplomacy check. Generally, the DC of this check is the creature's Will DC, although your GM may modify it based on the situation. Some creatures may be unable to stop regardless of their personal desires, and even those who agree to parley might ultimately find your arguments lacking and return to violence."
  properties:
    level: 15
    actions: "three"
    traits: ["general", "skill"]
    prerequisites: "legendary in Diplomacy"
- id: "legendary-performer"
  name: "Legendary Performer"
  source: "pc > Chapter 5: Feats"
  description: "Your fame has spread throughout the lands. Creatures who have any listed skill in Society have heard of you and usually have an attitude toward you one step better than normal, depending on your reputation and the creature's disposition. For instance, if you're well-known for cruel and demanding behavior, creatures might be intimidated by you, rather than be friendly toward you. When you Earn Income with Performance, you attract higher-level audiences than your location would allow, as audiences flock to see you. For instance, rulers and angels might travel to your small tower in the woods to hear you perform. Typically, this increases the audiences available to your level or by two levels, whichever is higher."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Performance, Virtuosic Performer"
- id: "legendary-professional"
  name: "Legendary Professional"
  source: "pc > Chapter 5: Feats"
  description: "Your fame has spread throughout the lands (for instance, if you have Warfare Lore, you might be a legendary general or tactician). This works as Legendary Performer above, except you gain higher-level jobs when you Earn Income with Lore."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Lore"
- id: "legendary-sneak"
  name: "Legendary Sneak"
  source: "pc > Chapter 5: Feats"
  description: "You're always sneaking unless you choose to be seen, even when there's nowhere to hide. You can Hide and Sneak even without cover or being concealed. When you employ an exploration tactic other than Avoiding Notice, you also gain the benefits of Avoiding Notice unless you choose not to."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Stealth, Swift Sneak"
- id: "legendary-survivalist"
  name: "Legendary Survivalist"
  source: "pc > Chapter 5: Feats"
  description: "You can survive indefinitely without food or water and can endure severe, extreme, and incredible cold and heat without taking damage from doing so."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Survival"
- id: "legendary-thief"
  name: "Legendary Thief"
  source: "pc > Chapter 5: Feats"
  description: "Your ability to Steal defies belief. You can attempt to Steal something that is actively wielded or that would be extremely noticeable or time consuming to remove (like worn shoes or armor). You must do so slowly and carefully, spending at least 1 minute (and significantly longer for items that are normally time consuming to remove, like armor). Throughout this duration you must have some means of staying hidden, such as the cover of darkness or a bustling crowd. Even if you succeed, if the item is extremely prominent—like a suit of full plate armor—onlookers will quickly notice it's gone after you steal it."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Thievery, Pickpocket"
- id: "lengthy-diversion"
  name: "Lengthy Diversion"
  source: "pc > Chapter 5: Feats"
  description: "When you critically succeed to Create a Diversion, you continue to remain hidden after the end of your turn. This effect lasts for an amount of time that depends on the diversion and situation, as determined by the GM (minimum 1 additional round)."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Deception"
- id: "leshy-glide"
  name: "Leshy Glide"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "Using your own leaves, you can control your descent. You glide slowly toward the ground, 5 feet down and up to 25 feet forward through the air. As long as you spend at least 1 action gliding each round and have not yet reached the ground, you remain in the air at the end of your turn."
  properties:
    level: 5
    actions: "one"
    traits: ["leshy"]
    prerequisites: "leaf leshy heritage or Cat Fall skill feat"
- id: "leshy-lore"
  name: "Leshy Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: |-
    You deeply understand your people's cultural traditions and innate strengths. You gain the trained proficiency rank in Nature and Stealth. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Leshy Lore.
  properties:
    level: 1
    traits: ["leshy"]
- id: "leshy-superstition"
  name: "Leshy Superstition"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You notice spirits that inhabit objects, learning which bring good fortune and which are unlucky. You focus on the power of a lucky object, granting you a +1 circumstance bonus to your saving throw against the triggering effect."
  properties:
    level: 1
    actions: "reaction"
    traits: ["leshy"]
    trigger: "You attempt a saving throw against a spell or magical effect, but haven't rolled yet."
- id: "lie-to-me"
  name: "Lie to Me"
  source: "pc > Chapter 5: Feats"
  description: "You can use Deception to weave traps to trip up anyone trying to deceive you. If you can engage in conversation with someone trying to Lie to you, use your Deception DC if it is higher than your Perception DC to determine whether they succeed. This doesn't apply if you don't have a back-and-forth dialogue, such as when someone attempts to Lie during a long speech."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Deception"
- id: "life-leap"
  name: "Life Leap"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: |-
    You phase through a space that a living creature occupies in a flash, spontaneously appearing on the opposite side of it in a vibrant display of colorful light. You move from your current location to another location that's still adjacent to the same living creature, but on the opposite side or corner of the creature's space. To determine whether a position is valid, use the same rules as for flanking: a line through the center of the two spaces must pass through opposite sides or corners of the creature's space.
    You pass through the creature's life force, appearing in the selected location; this doesn't trigger reactions based on movement. You must be able to see your destination, and you can't move farther than your Speed would allow.
  properties:
    level: 9
    actions: "one"
    traits: ["gnome", "move", "teleportation"]
    requirements: "You must be adjacent to a living creature."
- id: "loud-singer"
  name: "Loud Singer"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "Staying on pitch, proper breath control, and remembering the words are all less important than the real measure of a good singer: volume! The range of your Goblin Song is increased to 60 feet, and you can target one additional enemy when you use it."
  properties:
    level: 5
    traits: ["goblin"]
    prerequisites: "Goblin Song"
- id: "lucky-keepsake"
  name: "Lucky Keepsake"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You have a keepsake that grants you luck. You gain a +1 circumstance bonus to saves against spells and magical effects at all times, not just when you use Leshy Superstition. If you lose the keepsake, you lose the bonus until you designate a new keepsake, typically over the course of a week."
  properties:
    level: 9
    traits: ["leshy"]
    prerequisites: "Leshy Superstition"
- id: "magic-rider"
  name: "Magic Rider"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "Your people used powerful magic to travel between distant worlds in the distant past, and the remnants of that magic make such transportation easier for you. When you are the target of a teleportation spell that transports more than one person, it can affect an additional person beyond the normal limit, chosen by the caster. Additionally, when you're the target of a teleport spell, you and the other targets arrive no farther than 1 mile off target, regardless of distance traveled."
  properties:
    level: 17
    traits: ["elf"]
- id: "magical-crafting"
  name: "Magical Crafting"
  source: "pc > Chapter 5: Feats"
  description: "You can Craft magic items, though some have other requirements. When you select this feat, you gain formulas for four common magic items of 2nd level or lower."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Crafting"
- id: "magical-shorthand"
  name: "Magical Shorthand"
  source: "pc > Chapter 5: Feats"
  description: |-
    Learning spells comes easily to you. When you succeed at Learning a Spell, it takes 10 minutes regardless of the spell's rank. If you would succeed on the check, you critically succeed instead. If you fail, you can try again after a week or after you gain a level, whichever is first.
    You can use downtime to learn and inscribe new spells. This works as if you were using Earn Income with the tradition's associated skill, but instead of gaining money, you choose a spell available to you to learn and gain a discount on learning it, learning it for free if your earned income equals or exceeds its cost.
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Arcana, Nature, Occultism, or Religion"
- id: "march-the-mines"
  name: "March the Mines"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "You march through the earth and lead an ally along. You gain a burrow Speed of 15 feet when you use this activity (if you don't have a higher one), and then you either Stride twice or Burrow twice. You can choose one willing ally adjacent to you at the start of your movement to move with you. That ally ends its movement one square behind you."
  properties:
    level: 13
    actions: "two"
    traits: ["dwarf"]
- id: "martial-experience"
  name: "Martial Experience"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    You've crossed blades with a wide variety of foes wielding a wide variety of weapons, and you've learned the basics of fighting with nearly any of them. When wielding a weapon you aren't proficient with, treat your level as your proficiency bonus.
    At 11th level, you become trained in all weapons.
  properties:
    level: 5
    traits: ["elf"]
- id: "mist-child"
  name: "Mist Child"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "You blend in with unnatural subtlety. When you are concealed or hidden, increase the DC of the flat check to target you to 6 if you're concealed or 12 if you're hidden."
  properties:
    level: 5
    traits: ["changeling"]
- id: "monster-crafting"
  name: "Monster Crafting"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can use the parts of monsters to aid in crafting. You can use the body of a monster to help Craft items, using Survival instead of Crafting for the Craft activity when you do so. If parts of the monster's body are valuable, you can expend them toward the item's raw material cost as well. (The GM makes the determination if the monster's entry doesn't list any valuable materials from its body.)
    If you spend additional days working on the item, reduce the Price using the monster's level instead of your own. Certain items may require specific creatures in their Craft requirement.
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Survival"
- id: "monstrous-peacemaker"
  name: "Monstrous Peacemaker"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: "Your dual human and orc nature has given you a unique perspective, allowing you to bridge the gap between humans and the many intelligent creatures in the world that humans consider monsters. You gain a +1 circumstance bonus to Diplomacy checks against non-humanoid intelligent creatures and against humanoids that are marginalized in human society (at the GM's discretion, but typically at least including giants, goblins, kobolds, and orcs). You also gain this bonus on Perception checks to Sense the Motives of such creatures."
  properties:
    level: 1
    traits: ["half-orc"]
- id: "mountain-s-stoutness"
  name: "Mountain's Stoutness"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    Your hardiness lets you withstand more punishment than most. Increase your maximum Hit Points by your level. When you have the dying condition, the DC of your recovery checks is equal to 9 + your dying value (instead of 10 + your dying value).
    If you also have the Toughness feat, the Hit Points gained from it and this feat are cumulative, and the DC of your recovery checks is equal to 6 + your dying value.
  properties:
    level: 9
    traits: ["dwarf"]
- id: "mountain-strategy"
  name: "Mountain Strategy"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    Dwarves have a long history fighting common foes, and you've mastered the ancient tactics to better face these enemies. You gain a +1 circumstance bonus to damage with weapons and unarmed attacks against creatures with the giant, goblin, or orc trait. If your attack would deal more than one weapon die of damage (as is common at higher levels than 1st), the bonus is equal to the number of weapon dice or unarmed attack dice.
    In addition, if any creature critically succeeds at an attack against you and deals damage to you, you gain your bonus to damage against that creature for 1 minute regardless of whether it has one of the listed traits.
  properties:
    level: 1
    traits: ["dwarf"]
    special: "Your GM can add appropriate creature traits to the ancestral foes list if your character is from a community that commonly fights other types of enemies."
- id: "mournful"
  name: "Mournful"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "Watching your friends age and die fills you with moroseness that protects you against harmful emotions. You gain a +1 circumstance bonus to saving throws against emotion effects. If you roll a success on a saving throw against an emotion effect, you get a critical success instead."
  properties:
    level: 1
    traits: ["elf"]
- id: "multilingual"
  name: "Multilingual"
  source: "pc > Chapter 5: Feats"
  description: "You easily pick up new languages. You learn two new languages, chosen from common languages, uncommon languages, and any others you have access to. You learn an additional language if you are or become a master in Society and again if you are or become legendary."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Society"
    special: "You can select this feat multiple times. Each time, you learn additional languages."
- id: "multitalented"
  name: "Multitalented"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "You've learned to split your focus between multiple classes with ease. You gain a 2nd-level multiclass dedication feat, even if you normally couldn't take another dedication feat until you take more feats from your current archetype."
  properties:
    level: 9
    traits: ["human"]
- id: "natural-ambition"
  name: "Natural Ambition"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "You were raised to be ambitious and always reach for the stars, leading you to progress quickly in your chosen field. You gain a 1st-level class feat for your class. You must meet the prerequisites, but you can select the feat later in the character creation process in order to determine which prerequisites you meet."
  properties:
    level: 1
    traits: ["human"]
- id: "natural-medicine"
  name: "Natural Medicine"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can apply natural cures to heal your allies. You can use Nature instead of Medicine to Treat Wounds, including higher Nature proficiency letting you attempt more difficult checks. It doesn't replace Medicine for uses of the skill other than Treat Wounds or for feat prerequisites.
    If you're in the wilderness, you might have easier access to fresh ingredients, allowing you to gain a +2 circumstance bonus to your check to Treat Wounds using Nature, subject to the GM's determination.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Nature"
- id: "natural-skill"
  name: "Natural Skill"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "Your ingenuity allows you to learn a wide variety of skills. You gain the trained proficiency rank in two skills of your choice."
  properties:
    level: 1
    traits: ["human"]
- id: "nephilim-eyes"
  name: "Nephilim Eyes"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Your eyes can see through darkness with visual acuity akin to that possessed by most extraplanar beings. You gain darkvision."
  properties:
    level: 1
    traits: ["nephilim"]
    prerequisites: "low-light vision"
- id: "nephilim-lore"
  name: "Nephilim Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: |-
    You know the secrets of the planes beyond the world. You gain the trained proficiency rank in either Diplomacy or Intimidation, and Religion. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for a Lore subcategory of a plane to which you trace your lineage.
  properties:
    level: 1
    traits: ["nephilim"]
- id: "nephilim-resistance"
  name: "Nephilim Resistance"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: |-
    You resist energy like your extraplanar predecessors. Choose one of the following energy damage types: acid, cold, electricity, fire, or sonic. You gain resistance 5 to that damage type.
    The damage type typically matches an extraplanar entity associated with your bloodline. For instance, someone with angel blood might choose resistance to cold, while someone with devil blood might choose resistance to fire.
  properties:
    level: 5
    traits: ["nephilim"]
- id: "nimble-crawl"
  name: "Nimble Crawl"
  source: "pc > Chapter 5: Feats"
  description: "You can Crawl incredibly swiftly—up to half your Speed, rather than 5 feet. If you're a master in Acrobatics, you can Crawl at full Speed, and if you're legendary, you aren't off-guard while prone."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Acrobatics"
- id: "nimble-elf"
  name: "Nimble Elf"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "Your muscles are tightly honed. Your Speed increases by 5 feet."
  properties:
    level: 1
    traits: ["elf"]
- id: "nimble-hooves"
  name: "Nimble Hooves"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You possess hooves, ankle wings, or some other feature that hastens your movement. Your Speed increases by 5 feet."
  properties:
    level: 1
    traits: ["nephilim"]
    special: "The Speed increase from this feat isn't cumulative with any Speed increase from other ancestry feats."
- id: "no-cause-for-alarm"
  name: "No Cause for Alarm"
  source: "pc > Chapter 5: Feats"
  description: |-
    You attempt to reduce panic. Attempt a Diplomacy check, comparing it to the Will DC of creatures in a 10-foot emanation around you who are frightened. Each of them is temporarily immune for 1 hour.
    **Critical Success.** Reduce the creature's frightened value by 2.
    **Success.** Reduce the creature's frightened value by 1.
  properties:
    level: 1
    actions: "three"
    traits: ["auditory", "concentrate", "emotion", "general", "linguistic", "mental", "skill"]
    prerequisites: "trained in Diplomacy"
- id: "occult-resistance"
  name: "Occult Resistance"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "Your study of occult practices has shown you how to best defend against them. You gain a +1 circumstance bonus to all saving throws against occult effects."
  properties:
    level: 9
    traits: ["changeling"]
    prerequisites: "expert in Occultism"
- id: "oddity-identification"
  name: "Oddity Identification"
  source: "pc > Chapter 5: Feats"
  description: "When you become aware of a magical effect or see a spell being cast, you can immediately determine if it twists minds (with the mental trait), fights against fortune (with the fortune or misfortune trait), or reveals secrets (with the detection, prediction, revelation, or scrying traits). At the GM's discretion, similar effects can also fall into these categories. When you Identify Magic or Recall Knowledge to learn more about these effects, you can always use Occultism without penalty and gain a +2 circumstance bonus."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Occultism"
- id: "orc-ferocity"
  name: "Orc Ferocity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "Fierceness in battle runs through your blood, and you refuse to fall from your injuries no matter how terrible they may be. You avoid being knocked out and remain at 1 Hit Point, and your wounded condition increases by 1."
  properties:
    level: 1
    actions: "reaction"
    traits: ["orc"]
    frequency: "once per day"
    trigger: "You would be reduced to 0 Hit Points but not immediately killed."
- id: "orc-lore"
  name: "Orc Lore"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: |-
    The hold elders taught you your people's histories, told tales of great athletic feats, and shared with you the hardships your ancestors endured so that you can pass this wisdom down to future generations. You become trained in Athletics and Survival. If you would automatically become trained in one of those skills (from your background or class, for example), you instead become trained in a skill of your choice.
    You also gain the Additional Lore general feat for Orc Lore.
  properties:
    level: 1
    traits: ["orc"]
- id: "orc-sight"
  name: "Orc Sight"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: "Your orc blood grants you the keen vision of your forebears. You gain darkvision, allowing you to see in darkness and dim light just as well as you can in bright light. However, in darkness, you see in black and white only."
  properties:
    level: 1
    traits: ["half-orc"]
    prerequisites: "low-light vision"
    special: "You can take this feat only at 1st level, and you can't retrain out of this feat or into this feat."
- id: "orc-superstition"
  name: "Orc Superstition"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You defend yourself against magic by relying on techniques derived from orc cultural superstitions. You gain a +1 circumstance bonus to your saving throw against the triggering spell or magical effect."
  properties:
    level: 1
    actions: "reaction"
    traits: ["concentrate", "orc"]
    trigger: "You attempt a saving throw against a spell or magical effect, and have not yet rolled."
- id: "orc-weapon-familiarity"
  name: "Orc Weapon Familiarity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: |-
    In combat, you favor the brutal weapons that are traditional for your orc ancestors. You gain access to all uncommon weapons with the orc trait. You have familiarity with weapons with the orc trait plus the falchion and greataxe—for the purposes of proficiency, you treat any of these that are martial weapons as simple weapons and any that are advanced weapons as martial weapons.
    At 5th level, whenever you get a critical hit with one of these weapons, you get its critical specialization effect.
  properties:
    level: 1
    traits: ["orc"]
- id: "otherworldly-acumen"
  name: "Otherworldly Acumen"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    The arcane magic you possess grows in power and complexity. Choose one common 2nd-rank spell from the same tradition as an innate spell you previously gained from another elf ancestry feat (from the arcane list if you have Otherworldly Magic, for example). You can cast that spell as an innate spell once per day, using the same tradition as the list you chose the spell from.
    Your magic is adaptable. By spending 1 day of downtime, you can change the spell you chose to a different common 2nd-rank spell from the same tradition.
  properties:
    level: 9
    traits: ["elf"]
    prerequisites: "at least one innate spell gained from an elf ancestry feat"
- id: "otherworldly-magic"
  name: "Otherworldly Magic"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "Your elven magic manifests as a simple arcane spell, even if you aren't formally trained in magic. Choose one cantrip from the arcane spell list. You can cast this cantrip as an arcane innate spell at will. A cantrip is heightened to a spell rank equal to half your level rounded up."
  properties:
    level: 1
    traits: ["elf"]
- id: "pervasive-superstition"
  name: "Pervasive Superstition"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You steep yourself in superstition and practice ancient orc mental exercises for shrugging off the effects of magic. You gain a +1 circumstance bonus to saving throws against spells and magical effects at all times."
  properties:
    level: 9
    traits: ["orc"]
    prerequisites: "Orc Superstition"
- id: "pet"
  name: "Pet"
  source: "pc > Chapter 5: Feats"
  description: |-
    You have a pet—a Tiny animal of a type you choose, such as a cat, bird, or rodent. It has the minion trait, meaning it gains 2 actions during your turn if you use the Command an Animal action to command it; this replaces the usual effects of Command an Animal, and you don't need to attempt a Nature check. A pet can't take attack actions except to Escape or Force Open.
    **Level.** Your pet's level is equal to yours.
    **Modifiers and AC.** Your pet's save modifiers and AC are equal to yours before applying circumstance or status bonuses or penalties. It uses 3 + your level as its modifier for Perception, Acrobatics, and Stealth, and just your level as its modifier for other skill checks. It doesn't have or use its own attribute modifiers and can never benefit from item bonuses.
    **Hit Points.** Your pet has 5 Hit Points per level.
    **Senses.** Your pet has low-light vision and can gain additional senses from pet abilities.
    **Speed.** Your pet has a Speed of 25 feet. You can choose to instead have an aquatic pet, which breathes in water instead of air and has the aquatic trait, no land Speed, and a swim Speed of 25 feet.
    **Pet Abilities.** When you gain your pet, choose two of the following abilities. If your pet is an animal that naturally has one of these abilities (for instance, an owl has a fly Speed), you must select that ability. Your pet can't be an animal that naturally has more pet abilities than the maximum. In some cases, the GM might add some familiar abilities to the pet abilities you can choose.
    - **Amphibious.** It gains the amphibious trait, allowing it to breathe in both air and water, and has both a land Speed and a swim Speed, each equal to its highest land Speed or swim Speed.
    - **Burrower.** It gains a burrow Speed of 5 feet, allowing it to dig Tiny holes.
    - **Climber.** It gains a climb Speed of 25 feet.
    - **Darkvision.** It gains darkvision.
    - **Echolocation.** Your pet can use hearing as a precise sense within 20 feet.
    - **Fast Movement.** Increase one of the pet's Speeds from 25 feet to 40 feet.
    - **Flier.** It gains a fly Speed of 25 feet.
    - **Manual Dexterity.** It can use up to two of its limbs as if they were hands to perform manipulate actions.
    - **Scent.** Your pet can use scent as an imprecise sense within 30 feet
    - **Tough.** Your pet's max HP increase by 2 per level.
  properties:
    level: 1
    traits: ["general"]
    special: "You can replace a pet or gain a new one by spending 1 week of downtime, releasing any previous pet you have. If you later gain a familiar or other companion that uses the Pet feat, you can immediately retrain this feat."
- id: "pickpocket"
  name: "Pickpocket"
  source: "pc > Chapter 5: Feats"
  description: "You can Steal or Palm an Object that's closely guarded, such as in a pocket, without taking the -5 penalty. You can't steal objects that would be extremely noticeable or time consuming to remove (like worn shoes or armor or actively wielded objects). If you're a master in Thievery, you can attempt to Steal from a creature in combat or otherwise on guard. When doing so, Stealing requires 2 actions instead of 1, and you take a -5 penalty."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Thievery"
- id: "planar-survival"
  name: "Planar Survival"
  source: "pc > Chapter 5: Feats"
  description: "You can Subsist using Survival on different planes, even those without resources or natural phenomena you normally need. For instance, you can forage for food without penalty even if the plane lacks food that could normally sustain you. A success on your check to Subsist also prevents damage done by the plane to you and anyone else you support with Subsist. This applies only to damage dealt by the general conditions of the plane, not smaller hazards."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Survival"
- id: "powerful-leap"
  name: "Powerful Leap"
  source: "pc > Chapter 5: Feats"
  description: "You can jump 5 feet up with a vertical Leap without making a High Jump. You also increase the horizontal distance when you Leap, including as part of a High Jump or Long Jump, by 5 feet."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Athletics"
- id: "prairie-rider"
  name: "Prairie Rider"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You grew up riding your clan's shaggy ponies and riding dogs. You become trained in Nature. If you would automatically become trained in Nature (from your background or class, for example), you instead become trained in a skill of your choice. You also get a +1 circumstance bonus to Command an Animal if the target is a traditional halfling mount, such as a pony or riding dog."
  properties:
    level: 1
    traits: ["halfling"]
- id: "prescient-consumable"
  name: "Prescient Consumable"
  source: "pc > Chapter 5: Feats"
  description: "You can predict which consumables you might need in advance. When using Prescient Planner, you can procure a consumable item from your backpack, instead of a piece of adventuring gear. The consumable item must still be common with a level no higher than half your level, and its Bulk must be low enough that carrying it wouldn't have made you encumbered."
  properties:
    level: 7
    traits: ["general"]
    prerequisites: "Prescient Planner"
- id: "prescient-planner"
  name: "Prescient Planner"
  source: "pc > Chapter 5: Feats"
  description: "You regularly create convoluted plans and contingencies, using your resources to enact them. You take 1 minute to remove your backpack, then carefully remove an item you hadn't previously declared that you purchased—you intuited that you would come to need the item and purchased it at the latest opportunity. The item must be a piece of adventuring gear (from the adventuring gear table or other sources of adventuring gear), and can't be a weapon, armor, alchemical item, magic item, or other treasure. It must be common with a level no higher than half your level, and its Bulk must be low enough that carrying it wouldn't have made you encumbered."
  properties:
    level: 3
    traits: ["general"]
    requirements: "You haven't used this ability since the last time you were able to purchase goods."
    cost: "the Price of the chosen item"
- id: "project-persona"
  name: "Project Persona"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "Where others etch their armor to serve as a conduit for their imaginations, your vivid mind and bold personality allow you to project a more fitting persona over your lackluster armor. You change the shape and appearance of your armor to appear as ordinary or fine clothes of your imagining. The armor's statistics don't change. This effect lasts as long as you remain conscious and are wearing the armor. A creature can disbelieve the illusion by Seeking or touching your armor. The DC equals your Will DC."
  properties:
    level: 5
    actions: "one"
    traits: ["concentrate", "gnome", "illusion", "primal", "visual"]
- id: "quick-climb"
  name: "Quick Climb"
  source: "pc > Chapter 5: Feats"
  description: "When Climbing, you move 5 more feet on a success and 10 more feet on a critical success, up to your Speed. If you're legendary in Athletics, you gain a climb Speed equal to your Speed."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Athletics"
- id: "quick-coercion"
  name: "Quick Coercion"
  source: "pc > Chapter 5: Feats"
  description: "You can bully others with just a few choice implications. You can Coerce a creature after 1 round of conversation instead of 1 minute. You still can't Coerce a creature in the midst of combat, or without engaging in a conversation."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Intimidation"
- id: "quick-disguise"
  name: "Quick Disguise"
  source: "pc > Chapter 5: Feats"
  description: "You can set up a disguise in one-tenth the usual time (generally 1 minute). If you're a master in Deception, you can create a full disguise and Impersonate as a 3-action activity. If you're legendary, it takes a single action."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Deception"
- id: "quick-identification"
  name: "Quick Identification"
  source: "pc > Chapter 5: Feats"
  description: "You can Identify Magic swiftly. You take only 1 minute when using Identify Magic to determine the properties of an item, ongoing effect, or location, rather than 10 minutes. If you're a master, it takes a 3-action activity, and if you're legendary, it takes 1 action."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Arcana, Nature, Occultism or Religion"
- id: "quick-jump"
  name: "Quick Jump"
  source: "pc > Chapter 5: Feats"
  description: "You can use High Jump and Long Jump as a single action instead of 2 actions. If you do, you don't perform the initial Stride (nor do you fail if you don't Stride 10 feet)."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Athletics"
- id: "quick-recognition"
  name: "Quick Recognition"
  source: "pc > Chapter 5: Feats"
  description: "You Recognize Spells swiftly. Once per round, you can Recognize a Spell using a skill in which you're a master as a free action."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Arcana, Nature, Occultism, or Religion; Recognize Spell"
- id: "quick-repair"
  name: "Quick Repair"
  source: "pc > Chapter 5: Feats"
  description: "For you, the Repair activity loses the exploration trait and takes 1 minute instead of 10 minutes. If you're a master in Crafting, it takes 3 actions. If you're legendary, it takes 1 action."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Crafting"
- id: "quick-squeeze"
  name: "Quick Squeeze"
  source: "pc > Chapter 5: Feats"
  description: "You Squeeze 5 feet per round (10 feet on a critical success). If you're legendary in Acrobatics, you Squeeze at full Speed."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Acrobatics"
- id: "quick-swim"
  name: "Quick Swim"
  source: "pc > Chapter 5: Feats"
  description: "You Swim 5 feet farther on a success and 10 feet farther on a critical success, to a maximum of your Speed. If you're legendary in Athletics, you gain a swim Speed equal to your Speed."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Athletics"
- id: "quick-unlock"
  name: "Quick Unlock"
  source: "pc > Chapter 5: Feats"
  description: "You can Pick a Lock using 1 action instead of 2."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Thievery"
- id: "quiet-allies"
  name: "Quiet Allies"
  source: "pc > Chapter 5: Feats"
  description: "You're skilled at moving with a group. When you are Avoiding Notice and your allies Follow the Expert, you and those allies can roll a single Stealth check, using the lowest modifier, instead of rolling separately. This doesn't apply for initiative rolls."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Stealth"
- id: "rampaging-ferocity"
  name: "Rampaging Ferocity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You lash out viciously even as you fend off death. Make a single melee Strike. If this Strike brings a foe to 0 Hit Points, this activation of Orc Ferocity doesn't count against its frequency."
  properties:
    level: 17
    actions: "free"
    traits: ["orc"]
    prerequisites: "Orc Ferocity"
    trigger: "You use Orc Ferocity."
- id: "rapid-mantel"
  name: "Rapid Mantel"
  source: "pc > Chapter 5: Feats"
  description: "You easily pull yourself onto ledges. When you Grab an Edge, you can pull yourself onto that surface and stand. You can use Athletics instead of a Reflex save to Grab an Edge. If you Climb or Leap to within 5 feet beneath the top of an edge, you can pull yourself onto the surface and stand as part of that action."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Athletics"
- id: "razzle-dazzle"
  name: "Razzle-Dazzle"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "You've spent considerable time practicing the manipulation of light, weaponizing your blade's reflection or bolstering the luminosity of magical displays to unconventional heights. Extend the duration of the blinded or dazzled condition you give the target by 1 round."
  properties:
    level: 1
    actions: "free"
    traits: ["gnome"]
    frequency: "once per hour"
    trigger: "You blind or dazzle a creature."
- id: "read-lips"
  name: "Read Lips"
  source: "pc > Chapter 5: Feats"
  description: "You can read lips of others nearby who you can clearly see. The language read must be one that you know. When you're at your leisure, you can do this automatically. In encounter mode or when attempting a more difficult feat of lipreading, you're fascinated and off-guard during each round in which you focus on lip movements, and you must succeed at a Society check (DC determined by the GM) to successfully read someone's lips."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Society"
- id: "reckless-abandon"
  name: "Reckless Abandon"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    Despite a lifetime filled with questionable decisions, you've managed to survive, as though you have uncanny luck that lets you avoid the consequences of your own actions. For the remainder of your turn, if you roll a failure or critical failure on a saving throw against a harmful effect, you get a success instead. Further, if you would take damage from an enemy or hazard this turn you take the minimum possible damage.
    These benefits apply only to harmful effects incurred entirely during your turn in which you activate Reckless Abandon, such as running through a wall of fire. Persistent damage and conditions that were applied prior to your turn proceed normally, and as soon as your turn ends you are subject to the full consequences of any dangers still threatening you.
  properties:
    level: 17
    actions: "free"
    traits: ["fortune", "goblin"]
    frequency: "once per day"
- id: "recognize-spell"
  name: "Recognize Spell"
  source: "pc > Chapter 5: Feats"
  description: |-
    If you are trained in the appropriate skill for the spell's tradition and it's a common spell of 2nd rank or lower, you automatically identify it (you still roll to attempt to get a critical success, but can't get a worse result than success). The highest rank of spell you automatically identify increases to 4 if you're an expert, 6 if you're a master, and 10 if you're legendary. The GM rolls a secret Arcana, Nature, Occultism, or Religion check, whichever corresponds to the tradition of the spell being cast. If you're not trained in the skill, you can't get a result better than failure.
    **Critical Success.** You correctly recognize the spell and gain a +1 circumstance bonus to your saving throw or your AC against it.
    **Success.** You correctly recognize the spell.
    **Failure.** You fail to recognize the spell.
    **Critical Failure.** You misidentify the spell as another spell entirely, of the GM's choice.
  properties:
    level: 1
    actions: "reaction"
    traits: ["general", "secret", "skill"]
    prerequisites: "trained in Arcana, Nature, Occultism, or Religion"
    trigger: "A creature within line of sight casts a spell that you don't have prepared or in your spell repertoire, or a trap or similar object casts such a spell. You must be aware of the casting."
- id: "regrowth"
  name: "Regrowth"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "Your command over your vital essence allows you or an ally to recover from grievous wounds. You can cast regenerate as a 7th-rank primal innate spell once per day."
  properties:
    level: 17
    traits: ["leshy"]
- id: "ride"
  name: "Ride"
  source: "pc > Chapter 5: Feats"
  description: "When you Command an Animal you're mounted on to take a move action (such as Stride), you automatically succeed instead of needing to attempt a check. Any animal you're mounted on acts on your turn, like a minion. If you Mount an animal in the middle of an encounter, it skips its next turn and then acts on your next turn."
  properties:
    level: 1
    traits: ["general"]
- id: "ritual-reversion"
  name: "Ritual Reversion"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You can temporarily revert to a less conspicuous form without diminishing your senses. You take the form of an ordinary specimen of the type of plant or fungus that most closely resembles you, reverting to your body's appearance just before your spirit joined with it. This otherwise has the effects of one with plants, except that your size remains Small."
  properties:
    level: 5
    actions: "two"
    traits: ["leshy", "polymorph", "primal"]
- id: "robust-recovery"
  name: "Robust Recovery"
  source: "pc > Chapter 5: Feats"
  description: "You learned folk medicine to help recover from diseases and poison, and using it diligently has made you especially resilient. When you Treat a Disease or a Poison, or someone else uses one of these actions on you, increase the circumstance bonus granted on a success to +4, and if the result of the patient's saving throw is a success, the patient gets a critical success."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Medicine"
- id: "rock-runner"
  name: "Rock Runner"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "Your innate connection to stone makes you adept at moving across uneven surfaces. You can ignore difficult terrain caused by stone (such as rubble or gravel) and uneven ground made of stone and earth. In addition, when you use the Acrobatics skill to Balance on narrow surfaces or uneven ground made of stone or earth, you aren't off-guard, and when you roll a success at one of these Acrobatics checks, you get a critical success instead."
  properties:
    level: 1
    traits: ["dwarf"]
- id: "rough-rider"
  name: "Rough Rider"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    You are especially good at riding traditional goblin mounts. You gain the Ride feat, even if you don't meet the prerequisites. You gain a +1 circumstance bonus to Nature checks to use Command an Animal on a goblin dog or wolf mount.
    If you gain a wolf as an animal companion, it gains the mount special ability (and if you gain an ability that grants you an animal companion with the mount special ability, you can choose a wolf).
  properties:
    level: 1
    traits: ["goblin"]
- id: "scar-thick-skin"
  name: "Scar-Thick Skin"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "Glorious, storied scars cover and protect much of your body, girding you in fleshly armor that resists any wound weaker than those you have already survived. Your DC on flat checks to end persistent bleed damage is reduced from 15 to 10, or from 10 to 5 after receiving especially appropriate assistance."
  properties:
    level: 5
    traits: ["orc"]
- id: "scare-to-death"
  name: "Scare to Death"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can frighten foes so much, they might die. Attempt an Intimidation check against the Will DC of a living creature within 30 feet of you that you sense or observe and who can sense or observe you. If the target can't hear you or doesn't understand the language you are speaking, you take a -4 circumstance penalty. The creature is temporarily immune for 1 minute.
    **Critical Success.** The target must attempt a Fortitude save against your Intimidation DC. On a critical failure, it dies. On any other result, it becomes frightened 2 and is fleeing for 1 round. The critical failure effect has the death trait.
    **Success.** The target becomes frightened 2.
    **Failure.** The target becomes frightened 1.
    **Critical Failure.** The target is unaffected.
  properties:
    level: 15
    actions: "one"
    traits: ["emotion", "fear", "general", "incapacitation", "skill"]
    prerequisites: "legendary in Intimidation"
- id: "schooled-in-secrets"
  name: "Schooled in Secrets"
  source: "pc > Chapter 5: Feats"
  description: |-
    You notice the signs and symbols that members of mystery cults and other secret societies use to declare their affiliation to fellow members. You can use Occultism in place of Diplomacy to Gather Information about such groups and in place of Deception to Impersonate a member of these groups.
    If you belong to a secret cult, lodge, sect, or similar organization, you automatically recognize members of your group unless they are specifically attempting to conceal their presence from you. They also recognize your standing unless you are specifically concealing it.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Occultism"
- id: "scion-of-many-planes"
  name: "Scion of Many Planes"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "The long and complicated history of your bloodline manifests in your ability to draw power from more planar sources than most other nephilim. Choose one nephilim lineage feat that you do not already possess; you gain that feat and all of its benefits, even if you already took a lineage feat at 1st level."
  properties:
    level: 5
    traits: ["nephilim"]
- id: "sea-hag-mother"
  name: "Sea Hag Mother"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "Your mother was a sea hag, granting you one sea-green or blue eye. You find comfort both in the sea and on the shore. Whenever you roll a success on an Athletics check to Swim, you get a critical success instead. If you end your turn in water without having succeeded at a Swim action that round, you don't sink (but you might still be moved by the current)."
  properties:
    level: 1
    traits: ["changeling", "lineage"]
- id: "seasoned"
  name: "Seasoned"
  source: "pc > Chapter 5: Feats"
  description: "You've mastered the preparation of many types of food and drink. You gain a +1 circumstance bonus to checks to Craft food and drink, including elixirs if you have Alchemical Crafting and potions if you have Magical Crafting. If you are a master in one of the prerequisite skills, this bonus increases to +2."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Alcohol Lore, Cooking Lore, or Crafting"
- id: "seedpod"
  name: "Seedpod"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "Your body produces a nearly endless supply of hard seedpods. You gain a seedpod ranged unarmed attack with a range increment of 30 feet that deals 1d4 bludgeoning damage. On a critical hit, a seedpod bursts, issuing forth a tangle of vegetation that imposes a -10-foot circumstance penalty on the target's Speed until the start of your next turn. Seedpods do not add critical specialization effects."
  properties:
    level: 1
    traits: ["leshy"]
- id: "sense-allies"
  name: "Sense Allies"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "Like many humans raised in a close-knit community, you have always been strongly attuned to the presence of others. Willing allies that you are aware of within 60 feet that would otherwise be undetected by you are instead hidden from you. The flat check for you to target willing allies within 60 feet that are hidden from you is 5 instead of 11."
  properties:
    level: 5
    traits: ["human"]
- id: "shadow-of-the-wilds"
  name: "Shadow of the Wilds"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "It's difficult to notice your passage through wild areas. As long as you're not in an urban environment, you're always considered to be Covering Tracks, even if you chose a different activity in exploration mode."
  properties:
    level: 1
    traits: ["leshy"]
- id: "shadow-self"
  name: "Shadow Self"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You slip from your adversaries' notice and appear to be somewhere else. You become invisible for 1 minute or until you take a hostile action, whichever comes first. Choose a location within 10 feet of you. Until your invisibility ends, you appear to be hidden in that location to anyone trying to find you. If the searcher gets clear evidence that you're not there, they no longer think you're hidden there, but they don't discover your actual location."
  properties:
    level: 17
    traits: ["halfling"]
    prerequisites: "legendary Stealth"
    frequency: "once per hour"
    trigger: "You successfully use Stealth to Hide and become hidden from all your current foes, or use Stealth to Sneak and become undetected to all your current foes."
- id: "shameless-request"
  name: "Shameless Request"
  source: "pc > Chapter 5: Feats"
  description: "You can downplay the consequences or outrageousness of your requests using sheer brazenness and charm. When you Request something, you reduce any DC increases for making an outrageous request by 2, and if you roll a critical failure for your Request, you get a failure instead. While this means you can never cause your target to reduce their attitude toward you by making a Request, they eventually tire of requests, even though they still have a positive attitude toward you."
  properties:
    level: 7
    traits: ["general", "skill"]
    requirements: "master in Diplomacy"
- id: "shield-block"
  name: "Shield Block"
  source: "pc > Chapter 5: Feats"
  description: "You snap your shield in place to ward off a blow. Your shield prevents you from taking an amount of damage up to the shield's Hardness. You and the shield each take any remaining damage, possibly breaking or destroying the shield."
  properties:
    level: 1
    actions: "reaction"
    traits: ["general"]
    trigger: "While you have your shield raised, you would take physical damage (bludgeoning, piercing, or slashing) from an attack."
- id: "sign-language"
  name: "Sign Language"
  source: "pc > Chapter 5: Feats"
  description: |-
    You learn the sign languages associated with the languages you know, allowing you to sign and understand signs. Sign languages typically require both hands to convey more complex concepts, and they are visual rather than auditory.
    Sign language is difficult to understand during combat due to the level of attention needed, unlike basic gestures like pointing at a foe to suggest a target. Sign language is hard to use in areas of low visibility, just like speech is difficult in a noisy environment.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Society"
- id: "skill-training"
  name: "Skill Training"
  source: "pc > Chapter 5: Feats"
  description: "You become trained in the skill of your choice."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "Intelligence +1"
    special: "You can select this feat multiple times, choosing a new skill to become trained in each time."
- id: "skillful-tail"
  name: "Skillful Tail"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You've always had a tail, but with practice, you've learned to use it for more than signaling your mood. You can perform simple Interact actions with your tail, such as opening an unlocked door. Your tail can't perform actions that require fingers or significant manual dexterity, including any action that would require a check to accomplish, and you can't use it to hold items."
  properties:
    level: 5
    traits: ["nephilim"]
- id: "skittering-scuttle"
  name: "Skittering Scuttle"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "You can scuttle farther and faster when maneuvering alongside allies. When you use Goblin Scuttle, you can Stride up to half your Speed instead of Stepping."
  properties:
    level: 9
    traits: ["goblin"]
    prerequisites: "Goblin Scuttle"
- id: "slip-sideways"
  name: "Slip Sideways"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Like many fiends, you have the supernatural ability to teleport yourself to safety. Once per day, you can cast translocate as a 5th-rank divine innate spell."
  properties:
    level: 13
    traits: ["nephilim"]
    prerequisites: "Soul-Eater Blood, Demon Blood, or Devil Blood, or another lineage feat associated with fiends"
- id: "slippery-secrets"
  name: "Slippery Secrets"
  source: "pc > Chapter 5: Feats"
  description: "You elude and evade attempts to uncover your true nature or intentions. When a spell or magical effect tries to read your mind, detect whether you are lying, or reveal your identity, you can attempt a Deception check against the spell or effect's DC. If you succeed, the effect reveals nothing."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Deception"
- id: "solar-rejuvenation"
  name: "Solar Rejuvenation"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "If you rest outdoors for 10 minutes during the day, you regain Hit Points equal to your Constitution modifier × half your level. You gain this benefit in addition to any healing from Treat Wounds. Leshies whose plant nourishment does not rely on photosynthesis require a similarly suitable environment. For example, fungus leshies need dark, damp environments and a pile of decaying plant matter."
  properties:
    level: 9
    traits: ["leshy"]
- id: "soul-eater-blood"
  name: "Soul-Eater Blood"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "Your lineage traces back to a daemon, one of the manifestations of horrific forms of death that devour souls. As a result, you cling tenaciously to the last shreds of your own life force. You gain the Diehard general feat."
  properties:
    level: 1
    traits: ["lineage", "nephilim"]
- id: "speak-with-kindred"
  name: "Speak With Kindred"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "You have a connection with creatures that share your physiology. You can ask questions of, receive answers from, and use the Diplomacy skill with plants and fungi. You gain a +2 circumstance bonus to Diplomacy checks with plants or fungi of your kind. Generally, fungus leshies get this bonus with mushrooms and fungi; gourd leshies with gourds, melons, and similar fruiting plants; leaf leshies with deciduous trees; and vine leshies with vines and climbing plants."
  properties:
    level: 5
    traits: ["leshy"]
- id: "specialty-crafting"
  name: "Specialty Crafting"
  source: "pc > Chapter 5: Feats"
  description: |-
    Your training focused on Crafting one particular kind of item. Select one of the specialties listed below; you gain a +1 circumstance bonus to Crafting checks to Craft items of that type. If you are a master in Crafting, this bonus increases to +2. If it's unclear whether the specialty applies, the GM decides. Some specialties might apply only partially. For example, if you were making a morningstar and had specialty in woodworking, the GM might give you half your bonus because the item requires both blacksmithing and woodworking.
    Specialty Applicable Items
    Alchemy* Alchemical items such as elixirs
    Artistry Fine art, including jewelry
    Blacksmithing Durable metal goods, including metal armor
    Bookmaking Books and paper
    Glassmaking Glass, including glassware and windows
    Leatherworking Leather goods, including leather armor
    Pottery Ceramic goods
    Shipbuilding Ships and boats
    Stonemasonry Stone goods and structures
    Tailoring Clothing
    Weaving Textiles, baskets, and rugs
    Woodworking Wooden goods and structures
    * Requires Alchemical Crafting to Craft.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Crafting"
- id: "spell-devourer"
  name: "Spell Devourer"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You don't just resist magic; you devour it. Whenever you succeed at a saving throw against a spell or magical effect, you gain temporary Hit Points equal to double the spell's rank, or equal to the level if the magical effect isn't a spell. These temporary Hit Points last until the end of your next turn."
  properties:
    level: 13
    traits: ["orc"]
    prerequisites: "Orc Superstition"
- id: "steady-balance"
  name: "Steady Balance"
  source: "pc > Chapter 5: Feats"
  description: "You can keep your balance easily, even in adverse conditions. Whenever you roll a success using the Balance action, you get a critical success instead. You're not off-guard while attempting to Balance on narrow surfaces and uneven ground."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Acrobatics"
- id: "step-lively"
  name: "Step Lively"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You are an expert at avoiding the lumbering footsteps of larger creatures. You Step to another space adjacent to the enemy."
  properties:
    level: 5
    actions: "reaction"
    traits: ["halfling"]
    trigger: "A Large or larger enemy ends a move action adjacent to you."
- id: "stone-bones"
  name: "Stone Bones"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "Your intractable nature can help you shrug off even the most grievous injuries. Attempt a DC 17 flat check. If you are successful, the attack becomes a normal hit."
  properties:
    level: 9
    actions: "reaction"
    traits: ["dwarf"]
    trigger: "You are struck by a critical hit that deals physical damage."
- id: "stonegate"
  name: "Stonegate"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "Earthen barriers no longer impede your progress. You gain magic passage as a 7th-rank divine innate spell that you can cast once per day. Unlike the spell, however, this ability can be used only to open passages through barriers of earth or stone."
  properties:
    level: 17
    traits: ["uncommon", "dwarf"]
    prerequisites: "Stonewalker"
- id: "stonemason-s-eye"
  name: "Stonemason's Eye"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    You understand the intricacies of stonework. You become trained in Crafting. If you're already trained in Crafting, you instead gain the Specialty Crafting skill feat for stonemasonry.
    You also gain a +2 circumstance bonus to Perception checks to notice unusual stonework. This bonus applies to checks to discover mechanical traps made of stone or hidden within stone.
    If you aren't using the Seek action or searching, the GM automatically rolls a secret check for you to notice unusual stonework anyway. This check doesn't gain your normal circumstance bonus.
  properties:
    level: 1
    traits: ["dwarf"]
- id: "stonewalker"
  name: "Stonewalker"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    You have a deep reverence for and connection to stone. You can cast one with stone as a 3rd-rank divine innate spell once per day.
    If you have the Stonemason's Eye feat, you can attempt to find unusual stonework and stonework traps that require legendary proficiency in Perception.
    If you have both Stonemason's Eye and legendary proficiency in Perception, when the GM rolls a secret check for you to notice unusual stonework, you keep your bonus from Stonemason's Eye.
  properties:
    level: 9
    traits: ["dwarf"]
- id: "stonewall"
  name: "Stonewall"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "The strength of stone overcomes you so strongly that it replaces your stout body. You become petrified until the end of the current turn. You don't take any damage from the triggering effect or any other ill effects that couldn't affect stone."
  properties:
    level: 17
    actions: "reaction"
    traits: ["dwarf", "earth", "polymorph"]
    frequency: "once per day"
    trigger: "An enemy or hazard's effect hits you or you fail a Fortitude save against one."
- id: "streetwise"
  name: "Streetwise"
  source: "pc > Chapter 5: Feats"
  description: "You know about life on the streets and feel the pulse of your local settlement. You can use your Society modifier instead of your Diplomacy modifier to Gather Information. In any settlement you frequent regularly, you can use the Recall Knowledge action with Society to know the same sorts of information that you could discover with Diplomacy to Gather Information. The DC is usually significantly higher, but you know the information without spending time gathering it. If you fail to recall the information, you can still subsequently attempt to Gather Information normally."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Society"
- id: "stubborn-persistence"
  name: "Stubborn Persistence"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: "Humans are renowned for their ability to persist through the most grueling of trials that would leave others ready to drop. When you would become fatigued, attempt a DC 17 flat check. On a success, you aren't fatigued. If the fatigued condition has an underlying cause that you don't address, such as lack of rest, you must attempt the check again at an interval determined by the GM until you fail the flat check or address the underlying cause."
  properties:
    level: 13
    traits: ["human"]
- id: "student-of-the-canon"
  name: "Student of the Canon"
  source: "pc > Chapter 5: Feats"
  description: "You've researched many faiths enough to recognize notions about them that are unlikely to be true. If you roll a critical failure at a Religion check to Decipher Writing of a religious nature or to Recall Knowledge about the tenets of faiths, you get a failure instead. When attempting to Recall Knowledge about the tenets of your own faith, if you roll a failure, you get a success instead, and if you roll a success, you get a critical success instead."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Religion"
- id: "subtle-theft"
  name: "Subtle Theft"
  source: "pc > Chapter 5: Feats"
  description: "When you successfully Steal something, observers (creatures other than the creature you stole from) take a -2 circumstance penalty to their Perception DCs to detect your theft. Additionally, if you first Create a Diversion using Deception, taking a single Palm an Object or Steal action doesn't end your undetected condition."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Thievery"
- id: "summon-nephilim-kin"
  name: "Summon Nephilim Kin"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Nephilim > Feats"
  description: "You have a connection to the planes beyond the world, allowing you to summon a divine ally. Choose either summon celestial, summon fiend, or another 5th-rank spell capable of summoning an extraplanar creature appropriate to your lineage. Once per day, you can cast the chosen spell as a 5th-rank divine innate spell, but the creature summoned must be from the same category as your own lineage, such as a creature with the angel trait if you have angel blood."
  properties:
    level: 13
    traits: ["nephilim"]
    prerequisites: "any nephilim lineage feat"
- id: "supernatural-charm"
  name: "Supernatural Charm"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Mixed Ancestry > Feats"
  description: "The elven magic in your blood manifests as a force you can use to become more appealing or alluring. You can cast 1st-rank charm as an arcane innate spell once per day."
  properties:
    level: 5
    traits: ["half-elf"]
- id: "sure-feet"
  name: "Sure Feet"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "Whether keeping your balance or climbing, your feet easily find purchase. If you roll a success on an Acrobatics check to Balance or an Athletics check to Climb, you get a critical success instead. You're not off-guard when you attempt to Balance or Climb."
  properties:
    level: 1
    traits: ["halfling"]
- id: "survey-wildlife"
  name: "Survey Wildlife"
  source: "pc > Chapter 5: Feats"
  description: "You can study details in the wilderness to determine the presence of nearby creatures. You can spend 10 minutes assessing the area around you to find out what creatures are nearby, based on nests, scat, and marks on vegetation. Attempt a Survival check against a DC determined by the GM based on how obvious the signs are. On a success, you can attempt a Recall Knowledge check with a -2 penalty to learn more about the creatures just from these signs. If you're a master in Survival, you don't take the penalty."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Survival"
- id: "sweet-hag-mother"
  name: "Sweet Hag Mother"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Versatile Heritages > Changeling > Feats"
  description: "You are among the most common of changelings—those born to sweet hags—and a vibrant green eye signifies that parentage. Your mother's manipulative nature and versatile voice gives you an edge when deceiving others. You gain the Charming Liar skill feat. If you roll Deception for initiative, foes in that combat encounter that haven't acted yet are off-guard against you."
  properties:
    level: 1
    traits: ["changeling", "lineage"]
- id: "swift-sneak"
  name: "Swift Sneak"
  source: "pc > Chapter 5: Feats"
  description: "You can move your full Speed when you Sneak. You can use Swift Sneak while Burrowing, Climbing, Flying, or Swimming instead of Striding if you have the corresponding movement type."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Stealth"
- id: "telluric-power"
  name: "Telluric Power"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: "You channel strength from the earth beneath your feet to pummel your enemies. When making a melee Strike against a target who is standing on the same earth or stone surface as you are, you gain a circumstance bonus to the damage roll equal to the number of weapon damage dice."
  properties:
    level: 13
    traits: ["dwarf"]
- id: "terrain-expertise"
  name: "Terrain Expertise"
  source: "pc > Chapter 5: Feats"
  description: "Your experience in navigating a certain type of terrain makes you supremely confident while doing so. You gain a +1 circumstance bonus to Survival checks in one of the following types of terrain, chosen when you select this feat: aquatic, arctic, desert, forest, mountain, plains, sky, swamp, or underground."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Survival"
    special: "You can select this feat more than once, choosing a different type of terrain each time."
- id: "terrain-stalker"
  name: "Terrain Stalker"
  source: "pc > Chapter 5: Feats"
  description: |-
    Select one type of difficult terrain from the following list: rubble, snow, or underbrush. While undetected by all non-allies in that type of terrain, you can Sneak without attempting a Stealth check as long as you move no more than 5 feet and do not pass within 10 feet of an enemy during your movement.
    During exploration, this also allows you to automatically approach within 15 feet of other creatures while Avoiding their Notice, as long as they aren't actively Searching or on guard.
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Stealth"
    special: "You can select this feat multiple times. Each time, choose a different type of terrain."
- id: "terrified-retreat"
  name: "Terrified Retreat"
  source: "pc > Chapter 5: Feats"
  description: "When you critically succeed at the Demoralize action, if the target's level is lower than yours, the target is fleeing for 1 round."
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Intimidation"
- id: "thorned-seedpod"
  name: "Thorned Seedpod"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "When your seedpods strike a felling blow, they burst into viciously thorny vines. When you critically succeed at a seedpod Strike, vines twist and stab your foe, dealing 1d4 persistent piercing damage."
  properties:
    level: 9
    traits: ["leshy"]
    prerequisites: "Seedpod"
- id: "titan-slinger"
  name: "Titan Slinger"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You have learned how to use your sling to fell enormous creatures. When you hit on an attack with a weapon of the sling group against a Large or larger creature, increase the size of the weapon damage die by one step."
  properties:
    level: 1
    traits: ["halfling"]
- id: "titan-wrestler"
  name: "Titan Wrestler"
  source: "pc > Chapter 5: Feats"
  description: "You can attempt to Disarm, Grapple, Reposition, Shove, or Trip creatures up to two sizes larger than you, or up to three sizes larger than you if you're legendary in Athletics."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Athletics"
- id: "toppling-dance"
  name: "Toppling Dance"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "While sharing a creature's space using Dance Underfoot, your melee weapons and unarmed attacks gain the trip trait, but only against the creature whose space you share. You can be in the same space as a Large or larger prone creature, even if it's not your ally."
  properties:
    level: 13
    traits: ["halfling"]
    prerequisites: "Dance Underfoot"
- id: "toughness"
  name: "Toughness"
  source: "pc > Chapter 5: Feats"
  description: "Your body can withstand more punishment than most before succumbing. Increase your maximum Hit Points by your level. You reduce the DC of recovery checks by 1."
  properties:
    level: 1
    traits: ["general"]
- id: "train-animal"
  name: "Train Animal"
  source: "pc > Chapter 5: Feats"
  description: |-
    You spend time teaching an animal to do a certain action. You can either select a basic action the animal already knows how to do (typically those listed in the Command an Animal action) or attempt to teach the animal a new basic action. The GM determines the DC of any check required and the amount of time the training takes (usually at least a week). It's usually impossible to teach an animal a trick that uses critical thinking. If you're expert, master, or legendary in Nature, you might be able to train more unusual creatures, at the GM's discretion.
    **Success.** The animal learns the action. If it was an action the animal already knew, you can Command the Animal to take that action without attempting a Nature check. If it was a new basic action, add that action to the actions the animal can take when Commanded, but you must still roll.
    **Failure.** The animal doesn't learn the trick.
  properties:
    level: 1
    traits: ["downtime", "general", "manipulate", "skill"]
    prerequisites: "trained in Nature"
- id: "tree-climber"
  name: "Tree Climber"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "You've spent much of your life among the treetops and have become an expert at quickly and safely climbing them. You gain a climb Speed of 10 feet."
  properties:
    level: 9
    traits: ["elf"]
- id: "trick-magic-item"
  name: "Trick Magic Item"
  source: "pc > Chapter 5: Feats"
  description: |-
    You examine a magic item you normally couldn't use in an effort to fool it and activate it temporarily. For example, this might allow a fighter to cast a spell from a wand or allow a wizard to cast a spell that's not on the arcane list using a scroll. You must know what activating the item does, or you can't attempt to trick it.
    Attempt a check using the skill matching the item's magic tradition, or matching a tradition that has the spell on its list, if you're trying to cast a spell from the item. The relevant skills are Arcana for arcane, Nature for primal, Occultism for occult, Religion for divine, or any of the four for an item that has the magical trait and not a tradition trait. The GM determines the DC based on the item's level (possibly adjusted depending on the item or situation).
    If you activate a magic item that requires a spell attack modifier or spell DC and you don't have proficiency in the relevant statistic, use your level as your proficiency bonus and the highest of your Intelligence, Wisdom, or Charisma modifiers. If you're a master in the appropriate skill for the item's tradition, you instead use the trained proficiency bonus; if you're legendary, you instead use the expert proficiency bonus.
    **Success.** For the rest of the current turn, you can spend actions to activate the item as if you could normally use it.
    **Failure.** You can't use the item or try to trick it again this turn, but you can try again on subsequent turns.
    **Critical Failure.** You can't use the item, and you can't try to trick it again until your next daily preparations.
  properties:
    level: 1
    actions: "one"
    traits: ["general", "manipulate", "skill"]
    prerequisites: "trained in Arcana, Nature, Occultism, or Religion"
- id: "tusks"
  name: "Tusks"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You have particularly long, jagged tusks perfect for tearing meat from bone. You gain a tusks unarmed attack that deals 1d6 piercing damage. Your tusks are in the brawling group and have the finesse and unarmed traits."
  properties:
    level: 1
    traits: ["orc"]
    special: "You can take this feat only at 1st level, and you can't retrain into this feat. You can retrain out of this feat only through drastic measures, such as breaking, filing, or extracting your tusks."
- id: "unburdened-iron"
  name: "Unburdened Iron"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Dwarf > Ancestry Feats"
  description: |-
    You've learned techniques first devised by your ancestors during their ancient wars, allowing you to comfortably wear massive suits of armor. Ignore the reduction to your Speed from any armor you wear.
    In addition, any time you're taking a penalty to your Speed for some other reason (such as from the encumbered condition or from a spell), deduct 5 feet from the penalty. For example, the encumbered condition normally gives a -10-foot penalty to Speed, but this feat would reduce it to a -5-foot penalty. If your Speed is taking multiple penalties, pick only one penalty to reduce.
  properties:
    level: 1
    traits: ["dwarf"]
- id: "unconventional-weaponry"
  name: "Unconventional Weaponry"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Human > Human Ancestry Feats"
  description: |-
    You've familiarized yourself with a particular weapon, potentially from another ancestry or culture. Choose an uncommon simple or martial weapon with a trait corresponding to an ancestry (such as dwarf, goblin, or orc) or that is common in another culture. You gain access to that weapon, and for the purpose of proficiency, you treat it as a simple weapon.
    If you are trained in all martial weapons, you can instead choose an uncommon advanced weapon that has an ancestry's trait or is common in another culture. You gain access to that weapon and have familiarity with that weapon. For the purpose of proficiency, you treat it as a martial weapon.
  properties:
    level: 1
    traits: ["human"]
- id: "undaunted"
  name: "Undaunted"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Leshy > Leshy Ancestry Feats"
  description: "Your spirit has endured many challenges over its long existence. You gain a +1 circumstance bonus to saves against emotion effects. If you roll a success on a saving throw against an emotion effect, you get a critical success instead."
  properties:
    level: 1
    traits: ["leshy"]
- id: "underwater-marauder"
  name: "Underwater Marauder"
  source: "pc > Chapter 5: Feats"
  description: "You've learned to fight underwater. You are not off-guard while in water, and you don't take the usual penalties for using a bludgeoning or slashing melee weapon in water."
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Athletics"
- id: "undying-ferocity"
  name: "Undying Ferocity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Orc > Orc Ancestry Feats"
  description: "You resist death's clutches with supernatural vigor, daring death to claim you while promising that any such attempt will surely fail. When you use Orc Ferocity, you gain temporary Hit Points equal to your level."
  properties:
    level: 9
    traits: ["orc"]
    prerequisites: "Orc Ferocity"
- id: "unfettered-halfling"
  name: "Unfettered Halfling"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You were either pressed into indentured servitude or shackled in a prison, but you've since escaped and have trained to ensure you'll never be caught again. Whenever you roll a success on a check to Escape or a saving throw against an effect that would impose the grabbed, immobilized, or restrained condition on you, you get a critical success instead. Whenever a creature rolls a failure on a check to Grapple you, it gets a critical failure instead."
  properties:
    level: 1
    traits: ["halfling"]
- id: "unhampered-passage"
  name: "Unhampered Passage"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: "You won't allow others to restrain you. You can cast unfettered movement on yourself as a primal innate spell once per day."
  properties:
    level: 9
    traits: ["halfling"]
- id: "unified-theory"
  name: "Unified Theory"
  source: "pc > Chapter 5: Feats"
  description: "You understand the common underpinnings of the four traditions of magic and magical essences, allowing you to understand them all through an arcane lens. Whenever you use a skill action or a skill feat that requires a Nature, Occultism, or Religion check, depending on the magic tradition, you can use Arcana instead. If you would normally take a penalty or have a higher DC for using Arcana on other magic (such as when using Identify Magic), you no longer do so."
  properties:
    level: 15
    traits: ["general", "skill"]
    prerequisites: "legendary in Arcana"
- id: "universal-longevity"
  name: "Universal Longevity"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: "You've perfected your ability to keep up with all the skills you've learned over your long life, so you're almost never truly untrained at a skill. You reflect on your life experiences, changing the skill you selected with Ancestral Longevity (and the skill you selected with Expert Longevity if you have that feat)."
  properties:
    level: 13
    actions: "one"
    traits: ["elf"]
    prerequisites: "Ancestral Longevity"
    frequency: "once per day"
- id: "unmistakable-lore"
  name: "Unmistakable Lore"
  source: "pc > Chapter 5: Feats"
  description: "You never get information about your areas of expertise wrong. When you Recall Knowledge using any Lore subcategory in which you're trained, if you roll a critical failure, you get a failure instead. If you're a master in a Lore subcategory, on a critical success, you gain even more information or context than usual."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Lore"
- id: "untrained-improvisation"
  name: "Untrained Improvisation"
  source: "pc > Chapter 5: Feats"
  description: "You've learned how to handle situations when you're out of your depth. Your proficiency bonus to untrained skill checks is equal to your level -2. This improves to your level -1 at 5th level and your full level at 7th level. This doesn't allow you to use the skill's trained actions."
  properties:
    level: 3
    traits: ["general"]
- id: "unusual-treatment"
  name: "Unusual Treatment"
  source: "pc > Chapter 5: Feats"
  description: |-
    Your medical training extends to less obvious conditions. When you succeed against a DC 20 check to Treat Wounds, you can also reduce the value of one clumsy, enfeebled, or stupefied condition on the patient by 1. If you're able to treat more than one creature at once, choose only one to gain this benefit. A creature can benefit from Unusual Treatment only once per day.
    If the condition results from an affliction, the affliction isn't cured, though the condition is reduced as long as the affliction remains at that stage.
    If you are a master in Medicine, add the drained condition to the list of conditions you can remove if you succeed at a DC 30 check. If you are legendary in Medicine, you reduce the chosen condition by 2 instead of by 1.
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Medicine"
- id: "unwavering-mien"
  name: "Unwavering Mien"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Elf > Ancestry Feats"
  description: |-
    Your mystic control and meditations allow you to resist external influences upon your consciousness. Whenever you are affected by a mental effect that lasts at least 2 rounds, you can reduce the duration by 1 round.
    You still require natural sleep, but you treat your saving throws against effects that would cause you to fall asleep as one degree of success better. This protects only against sleep effects, not against other forms of falling unconscious.
  properties:
    level: 1
    traits: ["elf"]
- id: "vandal"
  name: "Vandal"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    You have a knack for breaking and dismantling things. Putting them back together is the boring part, so you largely don't bother with that. You become trained in Thievery. If you would automatically become trained in Thievery (from your background or class, for example), you instead become trained in a skill of your choice.
    In addition, whenever you hit with a Strike against a trap or an unattended object, you ignore the first 5 points of the object's Hardness.
  properties:
    level: 5
    traits: ["goblin"]
- id: "very-sneaky"
  name: "Very Sneaky"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: |-
    Taller folk rarely pay attention to the shadows at their feet, and you take full advantage of this. You can move 5 feet farther when you take the Sneak action, up to your Speed.
    In addition, as long as you continue to use Sneak actions and succeed at your Stealth check, you don't become observed if you don't have cover or greater cover and aren't concealed at the end of the Sneak action, as long as you have cover or greater cover or are concealed at the end of your turn.
  properties:
    level: 1
    traits: ["goblin"]
- id: "very-very-sneaky"
  name: "Very, Very Sneaky"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Goblin > Ancestry Feats"
  description: "You can move up to your Speed when you use the Sneak action, and you no longer need to have cover or greater cover or be concealed to Hide or Sneak."
  properties:
    level: 13
    traits: ["goblin"]
    prerequisites: "Very Sneaky"
- id: "virtuosic-performer"
  name: "Virtuosic Performer"
  source: "pc > Chapter 5: Feats"
  description: |-
    You have exceptional talent with one type of performance. You gain a +1 circumstance bonus when making a certain type of performance. If you are a master in Performance, this bonus increases to +2. Select one of the following specialties and apply the bonus when attempting Performance checks of that type. If it's unclear whether the specialty applies, the GM decides.
    Specialty Examples
    Acting Drama, pantomime, puppetry
    Comedy Buffoonery, joke telling, limericks
    Dance Ballet, jig
    Keyboards Harpsichord, organ, piano
    Oratory Epic, ode, poetry, storytelling
    Percussion Chimes, drum, gong, xylophone
    Singing Ballad, chant, melody, rhyming
    Strings Fiddle, harp, lute, viol
    Winds Bagpipe, flute, recorder, trumpet
  properties:
    level: 1
    traits: ["general", "skill"]
    prerequisites: "trained in Performance"
- id: "vivacious-conduit"
  name: "Vivacious Conduit"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Gnome > Ancestry Feats"
  description: "Your connection to the fey realm has grown, and its vital energy flows into you rapidly. If you rest for 10 minutes, you regain Hit Points equal to your Constitution modifier × half your level. This is a healing vitality effect and is cumulative with any healing you receive from Treat Wounds."
  properties:
    level: 9
    traits: ["gnome"]
- id: "wall-jump"
  name: "Wall Jump"
  source: "pc > Chapter 5: Feats"
  description: |-
    You can use your momentum from a jump to propel yourself off a wall. If you're adjacent to a wall at the end of a jump (whether performing a High Jump, Long Jump, or Leap), you don't fall as long as your next action is another jump. Your previous jump gives you momentum, letting you use High Jump or Long Jump as a single action, but you don't get to Stride as part of the activity.
    You can use Wall Jump only once in a turn, unless you're legendary in Athletics, in which case you can use it as many times as you can use consecutive jump actions in that turn.
  properties:
    level: 7
    traits: ["general", "skill"]
    prerequisites: "master in Athletics"
- id: "ward-medic"
  name: "Ward Medic"
  source: "pc > Chapter 5: Feats"
  description: "You've studied in large medical wards, treating several patients at once and tending to all their needs. When you use Treat Disease or Treat Wounds, you can treat up to two targets. If you're a master in Medicine, you can treat up to four targets, and if you're legendary, you can treat up to eight targets."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Medicine"
- id: "wary-disarmament"
  name: "Wary Disarmament"
  source: "pc > Chapter 5: Feats"
  description: "If you trigger a device or set off a trap while disarming it, you gain a +2 circumstance bonus to your AC or saving throw against the device or trap. This applies only to attacks or effects triggered by your failed attempt, not to any later ones, such as additional attacks from a complex trap."
  properties:
    level: 2
    traits: ["general", "skill"]
    prerequisites: "expert in Thievery"
- id: "watchful-halfling"
  name: "Watchful Halfling"
  source: "pc > Chapter 2: Ancestries & Backgrounds > Halfling > Ancestry Feats"
  description: |-
    You pay close attention to the people around you, allowing you to more easily notice when they act out of character. You gain a +2 circumstance bonus to Perception checks when using the Sense Motive basic action to notice enchanted or possessed characters. If you aren't actively using Sense Motive on an enchanted or possessed character, the GM rolls a secret check, without your usual circumstance bonus, for you to potentially notice the enchantment or possession anyway.
    In addition to using it for skill checks, you can use the Aid basic action to grant a bonus to another creature's saving throw or other check to overcome enchantment or possession. As usual for Aid, you need to prepare by using an action on your turn to encourage the creature to fight against the effect.
  properties:
    level: 1
    traits: ["halfling"]
- id: "weapon-proficiency"
  name: "Weapon Proficiency"
  source: "pc > Chapter 5: Feats"
  description: "You become trained in all martial weapons. If you were already trained in all martial weapons, you become trained in one advanced weapon of your choice. If you are at least 11th level, you also become an expert in these weapons."
  properties:
    level: 1
    traits: ["general"]
    special: "You can select this feat more than once. Each time you do, you become trained in an advanced weapon."
