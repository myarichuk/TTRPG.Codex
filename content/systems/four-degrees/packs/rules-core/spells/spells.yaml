- id: "hunter-s-luck"
  name: "Hunter's Luck"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You have a preternatural ability to remember details about your foes. Roll the triggering check twice and use the better result."
  properties:
    kind: "focus"
    rank: 2
    actions: "free"
    traits: ["uncommon", "concentrate", "focus", "fortune", "ranger"]
    focusGroup: "Advanced Warden Spells"
