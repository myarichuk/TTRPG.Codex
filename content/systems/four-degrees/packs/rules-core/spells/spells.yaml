- id: "storm-lord"
  name: "Storm Lord"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    The sky above you darkens in a matter of moments, swirling with ominous clouds punctuated by flashes of lighting. When you Cast the Spell and the first time you Sustain it each turn on subsequent rounds, select one of the following effects to occur in the area.
    - **Calm.** No additional effect.
    - **Fog.** Heavy fog rolls in, with the effects of mist.
    - **Rain.** Torrential rain falls from the sky, dousing ordinary flames. Creatures in the area take a -2 circumstance penalty to Acrobatics and Perception checks.
    - **Wind.** Powerful winds buffet the area in all directions. Ranged attacks take a -4 circumstance penalty, and the area is difficult terrain for flying creatures.
    In addition, once per round you can use a single action, which has the concentrate and manipulate traits, to call down a bolt of lightning, striking any target in range that you can see. You deal 10d6 electricity damage to the target; it must attempt a basic Reflex save. On a failure, it is also deafened for 1 round.
  properties:
    kind: "focus"
    rank: 9
    actions: "two"
    traits: ["uncommon", "air", "concentrate", "druid", "electricity", "focus", "manipulate"]
    focusGroup: "Storm Order"
    requirements: "You are outdoors and aboveground."
    area: "100-foot emanation, which includes you"
    duration: "sustained up to 1 minute"
- id: "stormwind-flight"
  name: "Stormwind Flight"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Powerful winds carry you through the air, giving you a fly Speed equal to your Speed. When this spell's duration would end, if you're still flying, you float to the ground, as gentle landing.
    **Heightened (6th).** When you fly using stormwind flight, you ignore difficult terrain from wind.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "air", "concentrate", "druid", "focus", "manipulate"]
    focusGroup: "Storm Order"
    duration: "1 minute"
- id: "stupefy"
  name: "Stupefy"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You dull the target's mind, depending on its Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is stupefied 1 until the start of your next turn.
    **Failure.** The target is stupefied 2 for 1 minute.
    **Critical Failure.** The target is stupefied 3 for 1 minute.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "subconscious-suggestion"
  name: "Subconscious Suggestion"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You implant a subconscious suggestion deep within the target's mind for them to follow when a trigger you specify occurs (as described in Setting Triggers). You suggest a course of action to the target. Your directive must be phrased in such a way as to seem like a logical course of action to the target, and it can't be self-destructive or obviously against the target's self-interest. The target must attempt a Will save.
    **Critical Success.** The target is unaffected and knows you tried to control it.
    **Success.** The target is unaffected and thinks you were talking to them normally, not casting a spell on them.
    **Failure.** The suggestion remains in the target's subconscious until the next time you prepare. If the trigger occurs before then, the target immediately follows your suggestion. The effect has a duration of 1 minute, or until the target has completed a finite suggestion or the suggestion becomes self-destructive or has other obvious negative effects.
    **Critical Failure.** As failure, but the duration is 1 hour.
    **Heightened (9th).** You can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "incapacitation", "linguistic", "manipulate", "mental", "subtle"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
