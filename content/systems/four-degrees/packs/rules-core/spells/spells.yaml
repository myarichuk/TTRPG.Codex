    rank: 6
    actions: "two"
    traits: ["concentrate", "curse", "incapacitation", "manipulate", "polymorph"]
    traditions: ["arcane", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
    duration: "varies"
