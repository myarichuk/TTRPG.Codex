    duration: "varies"
- id: "bit-of-luck"
  name: "Bit of Luck"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You tilt the scales of luck slightly to protect a creature from disaster. When the target would attempt a saving throw, it can roll twice and use the better result. Once it does this, the spell ends. If you cast bit of luck again, any previous bit of luck you cast that's still in effect ends. After a creature has been targeted with bit of luck, it becomes temporarily immune for 24 hours."
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "fortune", "manipulate"]
    focusGroup: "Luck"
    range: "30 feet"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "blazing-bolt"
  name: "Blazing Bolt"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You fire a ray of heat and flame. Make a spell attack roll against a single creature. On a hit, the target takes 2d6 fire damage, and on a critical hit, the target takes double damage.
    For each additional action you use when Casting the Spell, you can fire an additional ray at a different target, to a maximum of three rays targeting three different targets for 3 actions. These attacks each increase your multiple attack penalty, but you don't increase your multiple attack penalty until after you make all the spell attack rolls for blazing bolt. If you spend 2 or more actions Casting the Spell, the damage increases to 4d6 fire damage on a hit, and it still deals double damage on a critical hit.
    **Heightened (+1).** The damage to each target increases by 1d6 for the 1-action version, or by 2d6 for the 2- and 3-action versions.
  properties:
    kind: "spell"
    rank: 2
    traits: ["attack", "concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    castTime: "1 to 3 actions"
    range: "60 feet"
    targets: "1 or more creatures"
    defense: "AC"
- id: "bless"
  name: "Bless"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Blessings from beyond help your companions strike true. You and your allies gain a +1 status bonus to attack rolls while within the emanation. Once per round on subsequent turns, you can Sustain the spell to increase the emanation's radius by 10 feet. Bless can counteract bane."
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["aura", "concentrate", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    area: "15-foot emanation"
    duration: "1 minute"
- id: "blessed-boundary"
  name: "Blessed Boundary"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Manifestations of divine force appear in the hundreds, swirling in a massive, protective sphere. These typically look like spiky fragments, but often take on an appearance themed to the deity of the caster. The sphere is hollow, with the manifestations forming a shell 2 inches deep on the outer edge. You can choose to make the burst smaller, in 5-foot increments, when you cast it. The shell provides cover and can intersect solid terrain without affecting it. The shell deals 7d8 force damage to each creature who intersects with the shell when the sphere's created, or who attempts to move through the shell. The creature also takes the damage at the end of its turn, but only if it didn't already take damage from the shell that turn. The effects are determined by a creature's Reflex save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage, is pushed up to 10 feet in the direction of your choice, and ends its movement.
    **Critical Failure.** The creature takes double damage, is pushed up to 20 feet in the direction of your choice, and ends its movement.
    **Heightened (+1).** The damage increases by 1d8.
  properties:
    kind: "spell"
    rank: 6
    actions: "three"
    traits: ["concentrate", "force", "manipulate", "sanctified"]
    traditions: ["divine"]
    range: "120 feet"
    area: "up to a 60-foot burst"
    defense: "Reflex"
    duration: "1 minute"
- id: "blight"
  name: "Blight"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You twist and stunt plants in the area, causing them to wither. In addition to other dangers from failing plant life, this decreases the crop yield for farms. If you cast this ritual in an area affected by plant growth, blight attempts to counteract plant growth instead of producing its usual effect.
    **Critical Success.** Completely spoil the crop yield in the area, or decrease the yield by half in an area with up to a 1-mile radius.
    **Success.** Decrease the crop yield in the area by half.
    **Failure.** The ritual has no effect.
    **Critical Failure.** The flora in the area changes in an unexpected way, determined by the GM but generally as contradictory to your true desires as possible (for instance, enriching crops when you would prefer to blight them).
  properties:
    kind: "ritual"
    rank: 4
    traits: ["uncommon", "plant", "void"]
    castTime: "1 day"
    secondaryCasters: "1"
    primaryCheck: "Nature (expert)"
    secondaryChecks: "Survival"
    area: "1/2-mile-radius circle centered on you"
    duration: "1 year"
- id: "blindness"
  name: "Blindness"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You blind the target. The effect is determined by the target's Fortitude save. The target then becomes temporarily immune for 1 minute.
    **Critical Success.** The target is unaffected.
    **Success.** The target is blinded until its next turn begins.
    **Failure.** The target is blinded for 1 minute.
    **Critical Failure.** The target is blinded permanently.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "incapacitation", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
- id: "blood-vendetta"
  name: "Blood Vendetta"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You curse the target, punishing it for having the audacity to spill your blood. The target takes 2d6 persistent bleed damage and must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half the persistent bleed damage.
    **Failure.** The target takes the full persistent bleed damage. Until the bleeding stops, the target has weakness 1 to piercing and slashing damage.
    **Critical Failure.** As failure, but the target takes double the persistent bleed damage.
    **Heightened (+2).** The persistent bleed damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 2
    actions: "reaction"
    traits: ["curse"]
    traditions: ["arcane", "divine", "occult"]
    trigger: "A creature deals piercing, slashing, or persistent bleed damage to you"
    requirements: "You can bleed."
    range: "30 feet"
    targets: "the triggering creature"
    defense: "Will"
    duration: "varies"
- id: "blood-ward"
  name: "Blood Ward"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** protection
    Your patron's aegis descends to shield a target from harm. Designate one of the following creature traits: aberration, animal, beast, celestial, construct, dragon, elemental, fey, fiend, fungus, monitor, ooze, plant, or undead. The target gains a +1 status bonus to its saving throws and AC against creatures with that trait.
    **Heightened (5th).** The status bonus increases to +2.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "hex", "manipulate", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    duration: "sustained up to 1 minute"
- id: "blur"
  name: "Blur"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The target's form appears blurry. It becomes concealed. As the nature of this effect still leaves the target's location obvious, the target can't use this concealment to Hide or Sneak."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "visual"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "1 minute"
- id: "breath-of-life"
  name: "Breath of Life"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your blessing revives a creature at the moment of its death. You prevent the target from dying and restore 5d8 Hit Points to the target. You can't use breath of life if the triggering effect was a death effect or an effect that leaves no remains, such as disintegrate.
    **Heightened (+2).** The healing increases by 1d8.
  properties:
    kind: "spell"
    rank: 5
    actions: "reaction"
    traits: ["concentrate", "healing", "vitality"]
    traditions: ["divine"]
    trigger: "A living creature within range would die."
    range: "60 feet"
    targets: "the triggering creature"
- id: "breathe-fire"
  name: "Breathe Fire"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A gout of flame sprays from your mouth. You deal 2d6 fire damage to creatures in the area with a basic Reflex save.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    area: "15-foot cone"
    defense: "basic Reflex"
- id: "cackle"
  name: "Cackle"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "With a quick burst of laughter, you prolong a magical effect you created. You Sustain a spell."
  properties:
    kind: "focus"
    rank: 1
    actions: "free"
    traits: ["uncommon", "concentrate", "focus", "hex", "witch"]
    focusGroup: "Witch Hex Spells"
- id: "call-spirit"
  name: "Call Spirit"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You tear the veil to the afterlife and call a spirit from its final resting place. You must call the spirit by name, and you must provide a connection to the spirit, such as a possession, a garment, or a piece of its corpse. A spirit unwilling to heed your call can attempt a Will save to avoid it; on a critical success, a trickster spirit Impersonates the spirit you meant to call. The DC of the Will save is 2 lower if you haven't met the spirit in life. Either way, the spirit appears as a wispy form of the creature you meant to call. Each minute of the duration, you can ask the spirit a question. It can answer how it pleases or even refuse to answer. If the spirit isn't in the afterlife (such as if it's an undead), all results other than critical failures use the failure effect.
    **Critical Success.** The spirit is particularly cooperative, and even if it has strong reasons to deceive you, it takes a -2 circumstance penalty to its Deception checks.
    **Success.** You call the spirit.
    **Failure.** You fail to call a spirit.
    **Critical Failure.** One or more evil spirits appear and attack.
  properties:
    kind: "ritual"
    rank: 5
    traits: ["uncommon", "spirit"]
    castTime: "1 hour"
    cost: "rare candles and incense worth a total value of 50 gp"
    secondaryCasters: "1"
    primaryCheck: "Occultism (expert) or Religion (expert)"
    secondaryChecks: "Occultism or Religion (whichever isn't used for the primary check)"
    duration: "up to 10 minutes"
- id: "calm"
  name: "Calm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You forcibly calm creatures in the area, soothing them into a nonviolent state; each creature must attempt a Will save.
    **Critical Success.** The creature is unaffected.
    **Success.** Calming urges impose a -1 status penalty to the creature's attack rolls.
    **Failure.** Any emotion effects that would affect the creature are suppressed and the creature can't use hostile actions. If the target is subject to hostility from any other creature, it ceases to be affected by calm.
    **Critical Failure.** As failure, but hostility doesn't end the effect.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "emotion", "incapacitation", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    range: "120 feet"
    area: "10-foot burst"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "canticle-of-everlasting-grief"
  name: "Canticle of Everlasting Grief"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a melody distilled from pure grief, conveying the inevitable loss of everything your target cherishes, audible to only them. The target takes 10d6 mental damage depending on its Will save. A creature cursed by this spell can't benefit from circumstance or status bonuses, for the duration noted in the degree of success.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage, is frightened 1, and is cursed for 1 round.
    **Failure.** The target takes full damage, is frightened 3, and is cursed for 1 week.
    **Critical Failure.** The target takes double damage, is frightened 4, and is cursed for an unlimited duration. While the curse remains, the target's allies are also affected by the curse while within 15 feet of the creature.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["auditory", "concentrate", "curse", "emotion", "fear", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    range: "120 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "captivating-adoration"
  name: "Captivating Adoration"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You become intensely entrancing, and creatures are distracted by you as long as they remain within the area. You can exclude any creatures you choose from the effects. If a creature is in the aura when you Cast the Spell or when it enters the aura for the first time, it must attempt a Will saving throw. If a creature leaves and reenters, it uses the results of its original save.
    **Critical Success.** The creature is unaffected and temporarily immune for 1 hour.
    **Success.** The creature is fascinated with you for its next action, then is temporarily immune for 1 hour.
    **Failure.** The creature is fascinated with you.
    **Critical Failure.** The creature is fascinated with you, and its attitude toward you improves by one step.
    **Heightened (+1).** Increase the size of the emanation by 15 feet.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "aura", "cleric", "concentrate", "emotion", "focus", "manipulate", "mental", "visual"]
    focusGroup: "Passion"
    area: "15-foot emanation"
    defense: "Will"
    duration: "1 minute"
- id: "cataclysm"
  name: "Cataclysm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You call upon the unimaginable power of world-ending cataclysms, ripping a small piece of each cataclysm and combining them together into one horrifically powerful attack. The following effects come down upon all creatures in the area. Treat the resistances of creatures in the area as if they were 10 lower for the purpose of determining the cataclysm's damage. Each creature attempts one basic Reflex save that applies to all five types of damage.
    • Flesh-dissolving acid rain deals 3d10 acid damage.
    • A roaring earthquake shakes and bludgeons creatures on the ground, dealing 3d10 bludgeoning damage.
    • A blast of freezing wind deals 3d10 cold damage.
    • Incredible lightning lashes the area, dealing 3d10 electricity damage.
    • Beating winds churn across the sky, dealing 3d10 bludgeoning damage to creatures flying in the area.
    • An instant tsunami sweeps over creatures in the area, dealing 3d10 bludgeoning damage (doubled for creatures swimming in the area).
    • A massive wildfire burns in a sudden inferno, dealing 3d10 fire damage.
  properties:
    kind: "spell"
    rank: 10
    actions: "two"
    traits: ["acid", "air", "cold", "concentrate", "earth", "electricity", "fire", "manipulate", "water"]
    traditions: ["arcane", "primal"]
    range: "1,000 feet"
    area: "60-foot burst"
    defense: "basic Reflex"
- id: "caustic-blast"
  name: "Caustic Blast"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You fling a large glob of acid that immediately detonates, spraying nearby creatures. Creatures in the area take 1d8 acid damage with a basic Reflex save; on a critical failure, the creature also takes 1 persistent acid damage.
    **Heightened (+2).** The initial damage increases by 1d8, and the persistent damage on a critical failure increases by 1.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["acid", "cantrip", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    area: "5-foot burst"
    defense: "basic Reflex"
- id: "chain-lightning"
  name: "Chain Lightning"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You discharge a powerful bolt of lightning at the target, dealing 8d12 electricity damage. The target must attempt a basic Reflex save. The electricity then arcs to another creature within 30 feet of the first target, jumps to another creature within 30 feet of that target, and so on. You can end the chain at any point. You can't target the same creature more than once, and you must have line of effect to all targets. Roll the damage only once and apply it to each target (halving or doubling as appropriate for its saving throw outcome). The chain ends if any one of the targets critically succeeds at its save.
    **Heightened (+1).** The damage increases by 1d12.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "electricity", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    targets: "1 creature, plus any number of additional creatures"
    defense: "basic Reflex"
- id: "charm"
  name: "Charm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    To the target, your words are honey and your visage seems bathed in a dreamy haze. It must attempt a Will save, with a +4 circumstance bonus if you or your allies recently threatened it or used hostile actions against it.
    You can Dismiss the spell. If you use hostile actions against the target, the spell ends. When the spell ends, the target doesn't necessarily realize it was charmed unless its friendship with you or the actions you convinced it to take clash with its expectations, meaning you could potentially convince the target to continue being your friend via mundane means.
    **Critical Success.** The target is unaffected and aware you tried to charm it.
    **Success.** The target is unaffected but thinks your spell was something harmless instead of charm, unless it identifies the spell (see Identifying Spells).
    **Failure.** The target's attitude becomes friendly toward you. If it was friendly, it becomes helpful. It can't use hostile actions against you.
    **Critical Failure.** The target's attitude becomes helpful toward you, and it can't use hostile actions against you.
    **Heightened (4th).** The duration lasts until your next daily preparations.
    **Heightened (8th).** The duration lasts until your next daily preparations, and you can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "emotion", "incapacitation", "manipulate", "mental", "subtle"]
    traditions: ["arcane", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 hour"
- id: "charming-push"
  name: "Charming Push"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You push at the target's mind to deflect their ire. The target must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes a -1 circumstance penalty to attack rolls and damage rolls against you.
    **Failure.** The target can't use hostile actions against you.
    **Critical Failure.** The target is stunned 1 and can't use hostile actions against you.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "incapacitation", "mental", "wizard"]
    focusGroup: "Mentalism"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "until the start of your next turn"
- id: "charming-touch"
  name: "Charming Touch"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You infuse your target with attraction, causing it to act friendlier toward you. The target attempts a Will save. It gains a +4 circumstance bonus to this save if you or your allies recently threatened or were hostile to it.
    **Critical Success.** The target is unaffected and aware you tried to charm it.
    **Success.** The target is unaffected but thinks your spell was something harmless instead of charming touch, unless it identifies the spell (see Identifying Spells).
    **Failure.** The target's attitude becomes friendly toward you. If it was friendly, it becomes helpful. It can't use hostile actions against you. If you use a hostile action against the target, the spell ends. You can Dismiss the spell. After the spell ends, the target doesn't necessarily realize it was charmed unless its friendship with you or the actions you convinced it to take clash with its expectations. If it doesn't realize you charmed it, you could potentially convince it to continue being your friend via mundane means.
    **Critical Failure.** As failure, but the target is helpful.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "emotion", "focus", "incapacitation", "manipulate", "mental", "subtle"]
    focusGroup: "Passion"
    range: "touch"
    targets: "1 creature that could find you attractive"
    defense: "Will"
    duration: "10 minutes"
- id: "chilling-darkness"
  name: "Chilling Darkness"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shoot an utterly cold ray of darkness tinged with unholy energy. Make a ranged spell attack. The ray deals 5d6 cold damage. If the target has the holy trait, you deal an extra 5d6 spirit damage.
    **Critical Success.** The target takes double damage.
    **Success.** The target takes full damage. If the ray passes through an area of magical light or targets a creature affected by magical light, chilling darkness attempts to counteract the light. If you need to determine whether the ray passes through an area of light, draw a line between yourself and the spell's target.
    **Heightened (+1).** The cold damage increases by 2d6, and the spirit damage against holy creatures increases by 2d6.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["attack", "cold", "concentrate", "darkness", "manipulate", "unholy"]
    traditions: ["divine"]
    range: "120 feet"
    targets: "1 creature"
    defense: "AC"
- id: "clairaudience"
  name: "Clairaudience"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create an invisible floating ear at a location within range (even if it's outside your line of sight or line of effect). It can't move, but you can hear through the ear as if using your normal auditory senses."
  properties:
    kind: "spell"
    rank: 3
    traits: ["concentrate", "manipulate", "scrying"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "500 feet"
    duration: "10 minutes"
- id: "clairvoyance"
  name: "Clairvoyance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create an invisible floating eye at a location within range (even if it's outside your line of sight or line of effect). The eye can't move, but you can see in all directions from that point as if using your normal visual senses."
  properties:
    kind: "spell"
    rank: 4
    traits: ["concentrate", "manipulate", "scrying"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "500 feet"
    duration: "10 minutes"
- id: "cleanse-affliction"
  name: "Cleanse Affliction"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Gentle restorative magic pushes back the effects of toxins and more complex maladies. Choose an affliction on the target, such as a curse, disease, or poison. If it has advanced past stage one, reduce the stage by one. This reduction can be applied only once to a given case of an affliction, with the case ending when it's completely cured. Although the reduction can't occur again, heightened versions of this spell attempt to counteract with each casting.
    **Heightened (3rd).** Attempt to counteract the affliction if it is a disease or poison.
    **Heightened (4th).** Attempt to counteract the affliction if it is a curse, disease, or poison.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "healing", "manipulate"]
    traditions: ["divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
- id: "cleanse-cuisine"
  name: "Cleanse Cuisine"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transform all food and beverages in the area into delicious fare, changing water into wine or another fine beverage, or enhancing the food's taste and ingredients to make it a gourmet treat. You can also choose to remove all toxins and contaminations from the food. This spell doesn't prevent future contamination, natural decay, or spoilage, nor does it make the food any more nutritious.
    **Heightened (+2).** Add another cubic foot to the area, which must be contiguous with the rest.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["divine", "primal"]
    range: "10 feet"
    area: "1 cubic foot"
- id: "clear-mind"
  name: "Clear Mind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You drive mental contamination from the target's mind. Attempt to counteract an effect of your choice imposing one of these conditions on the target: fleeing, frightened, and stupefied. If you failed to counteract the effect but you would have if its counteract rank were 2 lower, instead suppress the effect until the beginning of your next turn. The effect's duration doesn't elapse while it's suppressed. This spell can't counteract or suppress conditions that are part of curses, diseases, or a natural state of the target.
    **Heightened (4th).** Add confused, controlled, and slowed to the list of conditions.
    **Heightened (6th).** As 4th rank, plus add doomed.
    **Heightened (8th).** As 4th rank, plus add doomed and stunned.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "mental"]
    traditions: ["divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
- id: "clinging-ice"
  name: "Clinging Ice"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Freezing sleet and heavy snowfall collect on the target's feet and legs, dealing 1d4 cold damage and other effects depending on its Reflex save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage.
    **Failure.** The target takes full damage and a -5-foot circumstance penalty to its Speeds until the spell ends.
    **Critical Failure.** The target takes double damage and a -10-foot circumstance penalty to its Speeds until the spell ends.
    **Heightened (+1).** The damage increases by 1d4.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cantrip", "cold", "hex", "manipulate", "witch"]
    focusGroup: "Patron Hex Cantrips"
    range: "30 feet"
    targets: "1 creature"
    defense: "Reflex"
    duration: "sustained up to 1 minute"
- id: "cloak-of-shadow"
  name: "Cloak of Shadow"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You drape the target in a mantle of swirling shadows that make it harder to see. The cloak reduces bright light within a 20-foot emanation to dim light. This is a form of magical darkness and can therefore overcome non-magical light or attempt to counteract magical light. The target can use concealed condition gained from the shadows to Hide, though observant creatures can still follow the moving aura of shadow, making it difficult for the target to become completely undetected. The target can use an Interact action to remove the cloak and leave it behind as a decoy, where it remains, reducing light for the rest of the spell's duration. If anyone picks up the cloak after it's been removed by the original target, the cloak evaporates and the spell ends."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "aura", "cleric", "darkness", "focus", "manipulate", "shadow"]
    focusGroup: "Darkness"
    range: "touch"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "collective-memories"
  name: "Collective Memories"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You tap into other mortals' memories, knowledge, legends, tales, and lore about a subject. The subject must be an important person, place, or thing. If the subject is present, increase the degree of success of your primary skill check by one step. If you have only vague information about the subject before attempting the ritual, decrease the degree of success of your primary skill check by one step. These modifiers cancel each other out if you have a subject present with little to no baseline information.
    **Critical Success.** For 1 hour after the ritual ends, you sort through memories that are mostly coherent, emphasizing more accurate or useful information over misremembered knowledge or exaggerated tales.
    **Success.** For 1 hour after the ritual ends, you learn useful information for further inquiry that remains generally incomplete or enigmatic. As is the nature of mortal memory and stories, you are likely to learn multiple contradictory versions.
    **Failure.** You fail to learn any useful legends.
    **Critical Failure.** Your mind becomes overwhelmed with the vast array of knowledge at your disposal. You can't sense or respond to anything in the present for 1 week except to perform necessities like breathing and sleeping. When you recover, however, you can retrain one of your skills into a Lore based on the knowledge of a subject you were accessing, as if you had spent 1 week retraining.
  properties:
    kind: "ritual"
    rank: 7
    traits: ["uncommon"]
    castTime: "1 day"
    cost: "rare incense worth a total value of 300 gp"
    secondaryCasters: "2"
    primaryCheck: "Occultism (master)"
    secondaryChecks: "Performance, Society"
- id: "command"
  name: "Command"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shout a command that's hard to ignore. You can command the target to approach you, run away (as if it had the fleeing condition), release what it's holding, drop prone, or stand in place. It can't Delay or take any reactions until it has obeyed your command. The effects depend on the target's Will save.
    **Success.** The creature is unaffected.
    **Failure.** The creature must spend the first action on its next turn to obey your command.
    **Critical Failure.** The target must use all its actions on its next turn to obey your command.
    **Heightened (5th).** You can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["auditory", "concentrate", "linguistic", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "until the end of the target's next turn"
- id: "commanding-lash"
  name: "Commanding Lash"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "With the threat of more pain, you compel a creature you've recently harmed. You issue a command to the target, with the effects of the spell command. If the target is frightened, stupefied, or taking persistent damage, it takes a -2 circumstance penalty to the save. Regardless of the result, the target is then temporarily immune for 1 hour."
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "cleric", "concentrate", "focus", "linguistic", "manipulate", "mental"]
    focusGroup: "Tyranny"
    requirements: "Your most recent action dealt damage to a target."
    range: "100 feet"
    targets: "a creature you dealt damage to on your most recent action"
    defense: "Will"
    duration: "until the end of the target's next turn"
- id: "commune"
  name: "Commune"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You call upon an unknown, powerful being to answer questions. The being varies depending on the skill used for the primary check.
    - **Nature.** Primal spirits of nature, which know about animals, beasts, fey, fungi, plants, topography, and natural resources within a 3-mile radius.
    - **Occultism.** Planar and other mysterious entities such as elementals, forgotten spirits, and monitors, which know about forgotten knowledge, the planes, obscure secrets, and other esoterica.
    - **Religion.** Divine beings like celestials and fiends that know about the gods they serve and the god's respective purview; these are typically a servitor of your deity if you have one.
    You can ask up to seven questions that could be answered with "Yes" or "No." The entity answers with one-word answers such as "Yes," "No," "Likely", and "Unknown," though its answers always reflect its own agenda and could be deceptive.
    **Critical Success.** You contact a more powerful entity aligned strongly with your interests, possibly even your deity. The entity won't attempt to deceive you, though it still might not know the answers. When it's important to provide clarity, the entity will answer your questions with up to five words, such as "If you leave immediately" or "That was true once."
    **Success.** You can ask your questions and receive answers.
    **Failure.** You fail to contact an appropriate being.
    **Critical Failure.** You are exposed to the enormity of the cosmos and are stupefied 4 for 1 week (can't remove by any means).
  properties:
    kind: "ritual"
    rank: 6
    traits: ["uncommon", "prediction"]
    castTime: "1 day"
    cost: "rare incense worth a total value of 150 gp"
    secondaryCasters: "1"
    primaryCheck: "Nature (master), Occultism (master), or Religion (master)"
    secondaryChecks: "Nature, Occultism, or Religion (whichever is used for the primary check)"
    duration: "up to 10 minutes"
- id: "community-restoration"
  name: "Community Restoration"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "When you use your magic to support your allies, shared strength bolsters you all. You gain 2 temporary Hit Points per rank of the triggering spell, and can grant an equal number divided as you choose among allies affected by the triggering spell. These temporary Hit Points last for 1 minute."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "concentrate", "focus", "healing", "wizard"]
    focusGroup: "Civic Wizardry"
    trigger: "You Cast a Spell from a wizard spell slot, and the spell affects one or more willing allies without damaging them."
- id: "competitive-edge"
  name: "Competitive Edge"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your competitiveness drives you to prove yourself against the opposition. You gain a +1 status bonus to attack rolls and skill checks. If an enemy within 20 feet critically succeeds at an attack roll or skill check, your status bonus increases to +3 for attack rolls or that specific skill check (whichever the foe critically succeeded at) for 1 round.
    **Heightened (7th).** Increase the base bonus to +2 and the increased bonus after an enemy critically succeeds to +4.
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "cleric", "concentrate", "emotion", "focus", "mental"]
    focusGroup: "Ambition"
    duration: "sustained up to 1 minute"
- id: "confusion"
  name: "Confusion"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You befuddle your target with strange impulses, causing it to act randomly. The effects are determined by the target's Will save. You can Dismiss the spell.
    **Critical Success.** The target is unaffected.
    **Success.** The target babbles incoherently and is stunned 1.
    **Failure.** The target is confused for 1 minute. It can attempt a new save at the end of each of its turns to end the confusion.
    **Critical Failure.** The target is confused for 1 minute, with no save to end early.
    **Heightened (8th).** You can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "emotion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 minute"
- id: "consecrate"
  name: "Consecrate"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You consecrate a site to your deity, chanting praises and creating a sacred space. While within the area, worshippers of your deity gain a +1 status bonus to attack rolls, skill checks, saving throws, and Perception checks, and creatures anathema to your deity take a -1 status penalty to those rolls. If your deity's divine sanctification allows you to choose holy or unholy, you can choose to make the consecrated site holy or unholy as well. If the deity's sanctification must be holy or unholy, you must make the site match that sanctification. Strikes made by worshippers of your deity within the area gain the site's sanctification trait, if any.
    **Critical Success.** The consecration succeeds, and it either lasts for 10 years instead of 1 or covers an area with twice the radius. Occasionally, with your deity's favor, this might produce an even more amazing effect, such as a permanently consecrated area or the effect covering an entire cathedral.
    **Success.** The consecration succeeds.
    **Failure.** The consecration fails.
    **Critical Failure.** The consecration fails spectacularly and angers your deity, who sends a sign of displeasure. For at least 1 year, further attempts to consecrate the site fail.
    **Heightened (7th).** The consecrated area also gains the effects of the planar seal spell, but the effect doesn't attempt to counteract teleportation by worshippers of your deity. The cost increases to 200 gp × the spell rank.
  properties:
    kind: "ritual"
    rank: 2
    traits: ["uncommon", "consecration"]
    castTime: "3 days"
    cost: "rare incense and offerings worth a total value of 20 gp × the spell rank"
    secondaryCasters: "2, must be worshippers of your religion"
    primaryCheck: "Religion"
    secondaryChecks: "Crafting, Performance"
    range: "40 feet"
    area: "40-foot-radius burst around an immobile altar, shrine, or fixture of your deity"
    duration: "1 year"
- id: "contingency"
  name: "Contingency"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You prepare a spell that will trigger later. While casting contingency, you also cast another spell of 4th rank or lower with a casting time of no more than 3 actions. This companion spell must be one that can affect you. You must make any decisions for the spell when you cast contingency, such as choosing a damage type for resist energy. During the casting, choose a trigger under which the spell will be cast, using the same restrictions as for the trigger of a Ready action. Once contingency is cast, you can cause the companion spell to come into effect as a reaction with that trigger. It affects only you, even if it would affect more creatures. If you define complicated conditions, as determined by the GM, the trigger might fail. If you cast contingency again, the newer casting supersedes the older.
    **Heightened (8th).** You can choose a spell of 5th rank or lower.
    **Heightened (9th).** You can choose a spell of 6th rank or lower.
    **Heightened (10th).** You can choose a spell of 7th rank or lower.
  properties:
    kind: "spell"
    rank: 7
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane"]
    castTime: "10 minutes"
    duration: "until your next daily preparations"
- id: "control-water"
  name: "Control Water"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "By imposing your will upon the water, you can raise or lower the level of water in the chosen area by 10 feet. Creatures that have the water trait and that are in the area when you Cast the Spell must attempt a Fortitude save, with the effects of the slow spell (and lasting for the duration described in that spell)."
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    area: "50 feet long by 50 feet wide"
    defense: "Fortitude (see text)"
    duration: "1 hour"
- id: "control-weather"
  name: "Control Weather"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You alter the weather, making it calm and normal for the season or choosing up to two effects based on the season.
    - **Spring.** drizzle, heat, hurricane, sleet, thunderstorm, tornado
    - **Summer.** drizzle, downpour, extreme heat, hail, heat
    - **Autumn.** cold weather, fog, mild heat, sleet
    - **Winter.** blizzard, mild cold, extreme cold, thaw
    You can't specifically control the manifestations, such as the exact path of a tornado or the targets of lightning strikes.
    **Critical Success.** You change the weather as desired and can affect a larger area (up to a 5-mile-radius circle), or a longer duration (any number of additional d12 hours, up to 16d12).
    **Success.** You change the weather as desired.
    **Failure.** You fail to change the weather as desired.
    **Critical Failure.** The weather changes in an unanticipated way, determined by the GM but generally as contradictory to your true desires as possible (for instance, a terrible storm emerges when you would prefer good weather).
    **Heightened (9th).** You can create unseasonable weather and contradictory weather effects, such as extreme cold and a hurricane. You can make the weather calm and normal weather for a different season or choose weather effects from any season's list.
  properties:
    kind: "ritual"
    rank: 8
    traits: ["uncommon"]
    castTime: "1 day"
    secondaryCasters: "1"
    primaryCheck: "Nature (master)"
    secondaryChecks: "Survival"
    area: "2-mile-radius circle centered on you"
    duration: "4d12 hours"
- id: "cornucopia"
  name: "Cornucopia"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Vines twine into a wicker horn in your hands, and out spills a single fruit, nut, or similar small bit of produce. A creature who eats the produce with an Interact action regains 1d6+4 HP. The cornucopia, as well as any unconsumed pieces of fruit, wither away at the end of the duration.
    **Heightened (+1).** The cornucopia produces an additional piece of food. A creature can consume any amount of food from the same casting with a single Interact action. Eating six pieces of produce from the cornucopia gives as much nourishment as one square meal for a typical human.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "concentrate", "druid", "focus", "healing", "manipulate", "plant", "vitality"]
    focusGroup: "Leaf Order"
    duration: "10 minutes"
- id: "counter-performance"
  name: "Counter Performance"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your performance protects you and your allies. Roll a Performance check for a type you know—it must be an auditory performance if the trigger was auditory or a visual one for a visual trigger, and this action gains the traits for the type of performance. You and allies in the area can use the better result between your Performance check and the saving throw."
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "bard", "composition", "concentrate", "focus", "fortune", "mental"]
    focusGroup: "Bard Composition Spells"
    trigger: "You or an ally within 60 feet rolls a saving throw against an auditory or visual effect."
    area: "60-foot emanation"
- id: "courageous-anthem"
  name: "Courageous Anthem"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You inspire yourself and your allies with words or tunes of encouragement. You and all allies in the area gain a +1 status bonus to attack rolls, damage rolls, and saves against fear effects."
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "concentrate", "emotion", "mental"]
    focusGroup: "Bard Composition Spells"
    area: "60-foot emanation"
    duration: "1 round"
- id: "cozy-cabin"
  name: "Cozy Cabin"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shape a cabin 20 feet on each side and 10 feet high. This cabin has the structure trait and the same restrictions as magic items that create structures. The walls of the hut are simple and wooden, with small, square glass windows, and it has one wooden door. It doesn't include its own lock, but it has a fastener to which a lock can be applied.
    The interior contains three cots, one chamber pot, and a small fireplace holding a magical fire. The interior is lit with a small magical light that you can light or extinguish at will using a Sustain action. The climate inside the hut is comfortable and allows creatures inside it to withstand most hostile weather conditions, but incredible heat or cold, powerful storms, and winds of hurricane force or greater destroy the hut. Other creatures can freely enter and exit the hut without damaging it, but if you exit the hut, the spell ends. You can Dismiss the spell.
  properties:
    kind: "spell"
    rank: 3
    traits: ["concentrate", "manipulate", "wood"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "30 feet"
    duration: "12 hours"
- id: "create-food"
  name: "Create Food"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create enough food to feed six Medium creatures for a day. This food is bland and unappealing, but it is nourishing. After 1 day, if no one has eaten the food, it decays and becomes inedible. Most Small creatures eat one-quarter as much as a Medium creature (one-sixteenth as much for most Tiny creatures), and most Large creatures eat 10 times as much (100 times as much for Huge creatures and so on).
    **Heightened (4th).** You can feed 12 Medium creatures.
    **Heightened (6th).** You can feed 50 Medium creatures.
    **Heightened (8th).** You can feed 200 Medium creatures.
  properties:
    kind: "spell"
    rank: 2
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "primal"]
    castTime: "1 hour"
    range: "30 feet"
- id: "create-undead"
  name: "Create Undead"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You transform the target into an undead creature with a level up to that allowed in the Creature Creation Rituals table. There are many versions of this ritual, each specific to a particular type of undead (one ritual for all zombies, one for skeletons, one for ghouls, and so on), and the rituals that create rare undead are also rare. Some forms of undead, such as liches, form using their own unique methods and can't be created with a version of create undead.
    **Critical Success.** The target becomes an undead creature of the appropriate type. If it's at least 4 levels lower than you, you can make it a minion. This gives it the minion trait, meaning it can use 2 actions when you command it, and commanding it is a single action that has the auditory and concentrate traits. You can have a maximum of four minions under your control. If it's intelligent and doesn't become a minion, the undead is helpful to you for awakening it, though it's still a horrid and evil creature. If it's unintelligent and doesn't become a minion, you can give it one simple command. It pursues that goal single-mindedly, ignoring any of your subsequent commands.
    **Success.** As critical success, except an intelligent undead that doesn't become your minion is only friendly to you, and an unintelligent undead that doesn't become your minion leaves you alone unless you attack it. It marauds the local area rather than following your command.
    **Failure.** You fail to create the undead.
    **Critical Failure.** You create the undead, but its soul, tortured by your foul necromancy, is full of nothing but hatred for you. It attempts to destroy you.
  properties:
    kind: "ritual"
    rank: 2
    traits: ["uncommon", "unholy"]
    castTime: "1 day"
    cost: "black onyx, see Creature Creation Rituals"
    secondaryCasters: "1"
    primaryCheck: "Arcana (expert), Occultism (expert), or Religion (expert)"
    secondaryChecks: "Religion"
    range: "10 feet"
    targets: "1 dead creature"
- id: "create-water"
  name: "Create Water"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "As you cup your hands, water begins to flow forth from them. You create 2 gallons of water. If no one drinks it, it evaporates after 1 day."
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["arcane", "divine", "primal"]
    range: "0 feet"
- id: "creation"
  name: "Creation"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You conjure a temporary object from magical energy. It must consist of earthen or plant-derived matter (such as wood, paper, brick, or stone) and be 5 cubic feet or smaller. It can't rely on intricate artistry or complex moving parts, never fulfills a cost or the like, and can't be made of precious materials or materials with a rarity of uncommon or higher. It is obviously temporarily conjured, and thus can't be sold or passed off as a genuine item. The spell gains the appropriate trait for the item created, typically earth, plant, or wood.
    **Heightened (5th).** The item is metal and can include common minerals, like feldspar or quartz. The spell gains the metal trait if used to create a metal object.
  properties:
    kind: "spell"
    rank: 4
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    castTime: "1 minute"
    range: "0 feet"
    duration: "1 hour"
- id: "creative-splash"
  name: "Creative Splash"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    A deluge of paint or colorful illusions descend on the area, reflecting your personal creative specialty. Roll 1d4 to determine the color of the illusion. Each creature in the area must succeed at a Will save or take the effect listed on the table for the color.
    1d4 Color Failure Critical Failure
    1 White Dazzled 1 round Dazzled 1 minute
    2 Red Enfeebled 1 for Enfeebled 2 for
    1 round 1 round
    3 Yellow Frightened 1 Frightened 2
    4 Blue Clumsy 1 for 1 round Clumsy 2 for 1
    round
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "illusion", "manipulate", "visual"]
    focusGroup: "Creation"
    range: "30 feet"
    area: "5-foot burst"
    defense: "Will"
    duration: "varies"
- id: "crisis-of-faith"
  name: "Crisis of Faith"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You assault the target's faith, riddling the creature with doubt and mental turmoil that deal 6d6 mental damage, or 6d8 mental damage if it can cast divine spells. The effects are determined by its Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage.
    **Failure.** The target takes full damage; if the target can cast divine spells, it's stupefied 1 for 1 round.
    **Critical Failure.** The target takes double damage, is stupefied 1 for 1 round, and can't cast divine spells for 1 round.
    To many deities, casting this spell on a follower of your own deity without significant cause is anathema.
    **Heightened (+1).** The damage increases by 2d6 (or by 2d8 if the target is a divine spellcaster).
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["divine"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
- id: "cry-of-destruction"
  name: "Cry of Destruction"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your voice booms, smashing what's in front of you. Each creature and unattended object in the area takes 1d8 sonic damage. If you already dealt damage to an enemy this turn with a Strike or spell, increase the damage dice from this spell to d12s.
    **Heightened (+1).** The damage increases by 1d8.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "sonic"]
    focusGroup: "Destruction"
    area: "15-foot cone"
    defense: "basic Fortitude"
- id: "curse-of-death"
  name: "Curse of Death"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** death
    Your patron wraps a hand around your target's heart. The target must attempt a Fortitude saving throw. Regardless of the result, the target is temporarily immune to all curses of death for 1 day.
    **Critical Success.** The target is unaffected.
    **Success.** The target is afflicted with the curse of death at stage 1, and the stage of the curse can't increase beyond stage 1.
    **Failure.** The target is afflicted with the curse of death at stage 1.
    **Critical Failure.** The target is afflicted with the curse of death at stage 2.
    Curse of Death (curse, death, void) This curse ends when the spell ends; Stage 1 4d6 void damage and fatigued (1 round); Stage 2 8d6 void damage and fatigued (1 round); Stage 3 12d6 void damage and fatigued (1 round); Stage 4 death
    **Heightened (+1).** Increase the void damage taken on a success and during the first three stages of the curse by 1d6.
  properties:
    kind: "focus"
    rank: 5
    actions: "two"
    traits: ["uncommon", "concentrate", "curse", "death", "focus", "hex", "manipulate", "void", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
    duration: "sustained up to 1 minute"
- id: "cursed-metamorphosis"
  name: "Cursed Metamorphosis"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transform the target creature into a harmless animal appropriate to the area, with effects based on its Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target's body gains minor features of the harmless animal. Its insides churn as they partially transform, causing it to be sickened 1. When it recovers from the sickened condition, its features revert to normal.
    **Failure.** The target transforms for 1 minute but keeps its mind. If it spends all its actions on its turn concentrating on its original form, it can attempt a Will save to end the effect immediately.
    **Critical Failure.** The target is transformed into the chosen harmless animal, body and mind, for an unlimited duration.
  properties:
