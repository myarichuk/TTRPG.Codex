- id: "sunburst"
  name: "Sunburst"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A powerful globe of searing sunlight explodes in the area, dealing 8d10 fire damage to all creatures in the area, plus an additional 8d10 vitality damage to undead creatures. Each creature in the area must attempt a Reflex save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage.
    **Critical Failure.** The creature takes full damage and becomes blinded permanently.
    If the globe overlaps with an area of magical darkness, sunburst attempts to counteract the darkness effect.
    **Heightened (+1).** The fire damage increases by 1d10, and the vitality damage against undead increases by 1d10.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "fire", "light", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    range: "500 feet"
    area: "60-foot burst"
    defense: "Reflex"
- id: "sure-footing"
  name: "Sure Footing"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You free the target's limbs from ailments that impede mobility. Attempt to counteract an effect of your choice imposing one of these conditions on the target: clumsy, grabbed, or paralyzed. If you didn't counteract the effect, but you would have if its counteract rank were 2 lower, instead suppress the effect until the beginning of your next turn. The effect's duration doesn't elapse while it's suppressed.
    This spell can't counteract or suppress curses, diseases, or conditions that are part of the target's normal state.
    **Heightened (4th).** Add immobilized, restrained, and slowed to the list of conditions.
    **Heightened (6th).** As 4th rank, plus add petrified.
    **Heightened (8th).** As 4th rank, plus add petrified and stunned.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "healing", "manipulate"]
    traditions: ["divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
- id: "sure-strike"
  name: "Sure Strike"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The next time you make an attack roll before the end of your turn, roll it twice and use the better result. The attack ignores circumstance penalties to the attack roll and any flat check required due to the target being concealed or hidden. You are then temporarily immune to sure strike for 10 minutes."
  properties:
    kind: "spell"
    rank: 1
    actions: "one"
    traits: ["concentrate", "fortune"]
    traditions: ["arcane", "occult"]
    duration: "until the end of your turn"
- id: "synaptic-pulse"
  name: "Synaptic Pulse"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You emit a pulsating mental blast that penetrates the minds of all enemies in the area. Each enemy in the area must attempt a Will save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature is stunned 1.
    **Failure.** The creature is stunned 2.
    **Critical Failure.** The creature is stunned for 1 round.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "incapacitation", "manipulate", "mental"]
    traditions: ["occult"]
    area: "30-foot emanation"
    defense: "Will"
    duration: "1 round"
- id: "tailwind"
  name: "Tailwind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The wind at your back pushes you to find new horizons. You gain a +10-foot status bonus to your Speed.
    **Heightened (2nd).** The duration increases to 8 hours.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["air", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    duration: "1 hour"
- id: "talking-corpse"
  name: "Talking Corpse"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You grant the target corpse a semblance of life, which it uses to speak the answers to three questions posed to it. This spell calls on the physical body's latent memories rather than summoning back the deceased's spirit, so the corpse must be mostly intact for the spell to function. The more damage the corpse has taken, the more inaccurate or patchwork its answers are, and it must have a throat and mouth to speak at all. If anyone has previously cast this spell on the corpse in the last week, the spell automatically fails. The corpse can attempt a Will save to resist answering the questions using the statistics of the original creature at its time of death, with the following effects.
    **Critical Success.** The target can lie or refuse to answer, and the target's spirit haunts you for 24 hours, bothering you and causing you to be unable to gain any rest for that time.
    **Success.** The target can provide false information or refuse to answer your questions.
    **Failure.** The target must answer truthfully, but its answers can be brief, cryptic, and repetitive. It can still mislead you or attempt to stall so that the spell's duration runs out before you can ask all your questions.
    **Critical Failure.** As failure, but the target's answers are more direct and less repetitive, though still cryptic. It takes a -2 status penalty to Deception checks to deceive or mislead you.
  properties:
    kind: "spell"
    rank: 4
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["divine", "occult"]
    castTime: "10 minutes"
    range: "touch"
    targets: "1 corpse"
    defense: "Will"
    duration: "10 minutes"
- id: "tangle-vine"
  name: "Tangle Vine"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A vine appears from thin air, flicking from your hand and lashing itself to the target. Attempt a spell attack roll against the target.
    **Critical Success.** The target gains the immobilized condition and takes a -10-foot circumstance penalty to its Speeds for 1 round. It can attempt to Escape against your spell DC to remove the penalty and the immobilized condition.
    **Success.** The target takes a -10-foot circumstance penalty to its Speeds for 1 round. It can attempt to Escape against your spell DC to remove the penalty.
    **Failure.** The target is unaffected.
    **Heightened (2nd).** The effects last for 2 rounds.
    **Heightened (4th).** The effects last for 1 minute.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["attack", "cantrip", "concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "AC"
- id: "tangling-creepers"
  name: "Tangling Creepers"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Dense, twitching creepers sprout from every surface and fill any bodies of water in the area. Any creature moving on the land, or Climbing or Swimming within the creepers, takes a -10-foot circumstance penalty to its Speeds while in the area. Once per round, you can Sustain the spell to make a vine lash out from any square within the expanse of creepers. This vine has a 15-foot reach. Make a melee spell attack roll against the target; on a success, the vine pulls the target into the creepers and makes it immobilized for 1 round or until the creature Escapes (against your spell DC), whichever comes first."
  properties:
    kind: "spell"
    rank: 6
    actions: "three"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    area: "40-foot burst"
    duration: "10 minutes"
- id: "telekinetic-hand"
  name: "Telekinetic Hand"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a floating, magical hand, either invisible or ghostlike, that grasps the target object and levitates it slowly up to 20 feet in any direction. When you Sustain the spell, you can move the object an additional 20 feet. If the object is in the air when the spell ends, the object falls.
    **Heightened (3rd).** You can target an unattended object with a Bulk of 1 or less.
    **Heightened (5th).** The range increases to 60 feet, and you can target an unattended object with a Bulk of 1 or less.
    **Heightened (7th).** The range increases to 60 feet, and you can target an unattended object with a Bulk of 2 or less.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 unattended object of light Bulk or less"
    duration: "sustained"
- id: "telekinetic-haul"
  name: "Telekinetic Haul"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You move the target up to 20 feet, potentially suspending it in midair. When you Sustain the spell, you can do so again, or you can shift your telekinetic focus to a different eligible target within range, moving it instead."
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    targets: "1 unattended object of up to 80 Bulk with no dimension longer than 20 feet"
    duration: "sustained up to 1 minute"
- id: "telekinetic-maneuver"
  name: "Telekinetic Maneuver"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "With a rush of telekinetic power, you move a foe or something they carry. You can attempt to Disarm, Reposition, Shove, or Trip the target using a spell attack roll instead of an Athletics check."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["attack", "concentrate", "force", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "60 feet"
    targets: "1 creature"
- id: "telekinetic-projectile"
  name: "Telekinetic Projectile"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You hurl a loose, unattended object that is within range and that has 1 Bulk or less at the target. Make a spell attack roll against the target's AC. If you hit, you deal 2d6 bludgeoning, piercing, or slashing damage—as appropriate for the object you hurled. No specific traits or magic properties of the hurled item affect the attack or the damage.
    **Critical Success.** You deal double damage.
    **Success.** You deal full damage.
    **Heightened (+1).** The damage increases by 1d6.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["attack", "cantrip", "concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "AC"
- id: "telepathy"
  name: "Telepathy"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You can communicate telepathically with creatures within 30 feet. Once you establish a connection by communicating with a creature, the communication is two-way. You can communicate with only creatures that share a language with you.
    **Heightened (6th).** You can communicate telepathically with creatures using shared mental imagery even if you don't share a language; telepathy loses the linguistic trait.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "linguistic", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    duration: "10 minutes"
- id: "teleport"
  name: "Teleport"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You and the targets are instantly transported to any location within range, as long as you can identify the location precisely both by its position relative to your starting position and by its appearance (or other identifying features). Incorrect knowledge of the location's appearance usually causes the spell to fail, but it could instead lead to teleporting to an unwanted location or some other unusual mishap determined by the GM. Teleport is not precise over great distances. The targets appear at a distance from the intended destination equal to roughly 1 percent of the total distance traveled, in a direction determined by the GM. For short journeys, this lack of precision is irrelevant, but for long distances this could be up to 1 mile.
    **Heightened (7th).** You and the other targets can travel to any location within 1,000 miles.
    **Heightened (8th).** You and the other targets can travel to any location on the same planet. If you travel more than 1,000 miles, you arrive only 10 miles off target.
    **Heightened (9th).** You and the other targets can travel to any location on another planet within the same solar system. If you have accurate knowledge of the location's position and appearance, you arrive on the new planet 100 miles off target.
    **Heightened (10th).** As the 9th-rank version, but you and the other targets can travel to any planet within the same galaxy.
  properties:
    kind: "spell"
    rank: 6
    traits: ["uncommon", "concentrate", "manipulate", "teleportation"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "100 miles"
    targets: "you and up to 4 targets touched, either willing creatures or objects roughly the size of a creature"
- id: "thunderstrike"
  name: "Thunderstrike"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You call down a tendril of lightning that cracks with thunder, dealing 1d12 electricity damage and 1d4 sonic damage to the target with a basic Reflex save. A target wearing metal armor or made of metal takes a -1 circumstance bonus to its save, and if damaged by the spell is clumsy 1 for 1 round.
    **Heightened (+1).** The damage increases by 1d12 electricity and 1d4 sonic.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "electricity", "manipulate", "sonic"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    targets: "1 creature"
    defense: "basic Reflex"
- id: "toxic-cloud"
  name: "Toxic Cloud"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You conjure a poisonous fog. This functions as mist, except the area moves 10 feet away from you each round. A breathing creature that starts its turn in the area takes 6d8 poison damage with a basic Fortitude save. You can Dismiss the spell.
    **Heightened (+1).** The damage increases by 1d8.
  properties:
    kind: "spell"
    rank: 5
    actions: "three"
    traits: ["concentrate", "death", "manipulate", "poison"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    area: "20-foot burst"
    defense: "basic Fortitude"
    duration: "1 minute"
- id: "translate"
  name: "Translate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target can understand the meaning of a single language it is hearing or reading when you Cast the Spell. This doesn't let it understand codes, language couched in metaphor, and the like (subject to GM discretion). If the target can hear multiple languages and knows that, it can choose which language to understand; otherwise, choose one of the languages randomly.
    **Heightened (3rd).** The target can also speak the language.
    **Heightened (4th).** You can target up to 10 creatures, and targets can also speak the language.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    duration: "1 hour"
- id: "translocate"
  name: "Translocate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You instantly transport yourself and any items you're wearing and holding from your current space to an unoccupied space within range you can see. If this would bring another creature with you—even if you're carrying it in an extradimensional container—the spell is lost.
    **Heightened (5th).** The range increases to 1 mile. You don't need to be able to see your destination, as long as you have been there in the past and know its relative location and distance from you. You are then temporarily immune for 1 hour.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "teleportation"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
- id: "tree-of-seasons"
  name: "Tree of Seasons"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You cause a Small tree to instantly sprout in an unoccupied space on the ground. Four seedpods grow from the tree, each filled with the magic of a different one of the four seasons. A creature can Interact to pluck one of the pods, and can then either throw it up to 30 feet as part of the same action or do so with a separate Interact action later. When thrown, a pod explodes in a 5-foot burst, dealing 6d6 damage with a basic Reflex save against your spell DC. The damage type depends on the season of the pod: electricity for spring, fire for summer, poison for autumn, or cold for winter. When the spell ends, the tree withers away and any remaining pods rot, leaving behind non-magical seeds.
    **Heightened (+1).** The burst's damage increases by 1d6.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["primal"]
    range: "60 feet"
    duration: "1 minute"
- id: "true-target"
  name: "True Target"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You delve into the possible futures of the next few seconds to understand all the ways your foe might avoid harm, then cast out that vision to those around you. Designate a creature. The first time each target makes an attack roll against that creature during true target's duration, the attacker rolls twice and uses the better result. The attacker also ignores circumstance penalties to the attack roll and any flat check required due to the designated creature being concealed or hidden."
  properties:
    kind: "spell"
    rank: 7
    actions: "one"
    traits: ["concentrate", "fortune", "prediction"]
    traditions: ["arcane", "occult"]
    range: "60 feet"
    targets: "4 creatures"
    duration: "until the start of your next turn"
- id: "truesight"
  name: "Truesight"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You see things within 60 feet as they actually are. The GM rolls a secret counteract check against any illusion, morph, or polymorph effect in the area, but only for the purpose of determining whether you see through it (for instance, if the check succeeds against a polymorph spell, you can see the creature's true form, but you don't end the polymorph spell)."
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "manipulate", "revelation"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "10 minutes"
- id: "truespeech"
  name: "Truespeech"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target can understand all words regardless of language and also speak the languages of other creatures. When in a mixed group of creatures, each time the target speaks, it can choose a creature and speak in a language that creature understands, even if the target doesn't know what language that is.
    **Heightened (7th).** The duration is 8 hours.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "1 hour"
- id: "umbral-journey"
  name: "Umbral Journey"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You move partially into a plane of shadow, using its warped nature to speed your travels. Each hour, you cover roughly as much ground as you normally would in 3 days. The landmarks are vague and symbolic rather than concrete, leaving you within a mile of your intended destination when you Dismiss the spell or its duration ends."
  properties:
    kind: "spell"
    rank: 5
    traits: ["uncommon", "concentrate", "manipulate", "shadow", "teleportation"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "touch"
    targets: "you and up to 10 willing creatures touched"
    duration: "8 hours"
- id: "uncontrollable-dance"
  name: "Uncontrollable Dance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target is overcome with an all-consuming urge to dance. For the duration of the spell, the target is off-guard and can't use reactions. It also can't use move actions except to dance, using the Stride action to move up to half its Speed.
    **Critical Success.** The target is unaffected.
    **Success.** The spell's duration is 3 rounds, and the target must spend at least 1 action each turn dancing.
    **Failure.** The spell's duration is 1 minute, and the target must spend at least 2 actions each turn dancing.
    **Critical Failure.** The spell's duration is 1 minute, and the target must spend all its actions each turn dancing.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "incapacitation", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "unfathomable-song"
  name: "Unfathomable Song"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Fleeting notes of a strange and unnatural song fill the air, overtaking the mind. Each target must attempt a Will save when you Cast the Spell, and again the first time you Sustain the spell each round. A creature needs to attempt only one save against the song each round, and you have to keep the same targets when you Sustain the spell.
    **Critical Success.** The target is unaffected, can't be affected on subsequent rounds, and is temporarily immune for 1 minute.
    **Success.** The target is unaffected this round, but it can be affected on subsequent rounds.
    **Failure.** Roll 1d4 on the following table.
    **Critical Failure.** Roll 1d4+1 on the following table.
    Result Effect
    1 The target is frightened 2.
    2 The target is confused for 1 round.
    3 The target is stupefied 4 for 1 round.
    4 The target is blinded for 1 round.
    5 The target is stunned for 1 round and stupefied 1 for an unlimited duration.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["auditory", "concentrate", "emotion", "fear", "incapacitation", "manipulate", "mental"]
    traditions: ["occult"]
    range: "120 feet"
    targets: "up to 5 creatures"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "unfettered-movement"
  name: "Unfettered Movement"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You repel hindrances that would affect a creature. While under this spell's effect, the target ignores effects that would give them a circumstance penalty to Speed. When they attempt to Escape an effect that has them immobilized, grabbed, or restrained, they automatically succeed unless the effect is magical and of a higher rank than the unfettered movement spell."
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "primal"]
    range: "touch"
    targets: "1 creature touched"
    duration: "10 minutes"
- id: "unfettered-pack"
  name: "Unfettered Pack"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You free those who travel alongside you from environmental hindrances. Targets don't take circumstance penalties to Speed from vegetation, rubble, winds, or other properties of the environment, and they ignore difficult terrain from such environmental properties.
    **Heightened (9th).** The targets also ignore greater difficult terrain from environmental properties.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["primal"]
    range: "30 feet"
    targets: "up to 10 creatures"
    duration: "1 hour"
- id: "unrelenting-observation"
  name: "Unrelenting Observation"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    This spell grants perfect sight based on scrying, allowing several willing targets to track the exact movements or position of one creature or object. Choose one target creature or object in the area to be tracked. It becomes the sensor for the spell. Up to five willing creatures of your choice in the area can see a ghostly image of this creature or object when it's out of their sight. They can perceive the creature or object perfectly, allowing them to ignore the concealed or invisible condition, though physical barriers still provide cover.
    The tracking creatures can see the tracked creature or object through all barriers other than lead or running water, which block their vision. Distance doesn't matter, though the creature or object might move so far away it becomes too small to perceive. The tracking creatures don't see any of the environment around the target, though they do see any gear a creature is wearing or holding, and they can tell if it removes objects from its person.
    If the target to be tracked is willing, the duration is 1 hour. If they're unwilling, the target must attempt a Will save.
    **Critical Success.** The creature or object is unaffected.
    **Success.** As described, and the duration is 1 minute.
    **Failure.** As described, and the duration is 1 hour.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "manipulate", "scrying"]
    traditions: ["arcane", "occult"]
    range: "100 feet"
    area: "20-foot burst"
    targets: "1 creature or object tracked and up to 5 other willing creatures"
    duration: "varies"
- id: "vampiric-exsanguination"
  name: "Vampiric Exsanguination"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You draw in the blood and life force of other creatures through your outstretched arms. You deal 12d6 void damage to living creatures in the area with a basic Fortitude save.
    You gain temporary Hit Points equal to half the damage a single creature takes from this spell; calculate these temporary Hit Points using the creature that took the most damage. You lose any remaining temporary Hit Points after 1 minute.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "death", "manipulate", "void"]
    traditions: ["arcane", "divine", "occult"]
    area: "30-foot cone"
    defense: "basic Fortitude"
- id: "vampiric-feast"
  name: "Vampiric Feast"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your touch leeches the lifeblood out of a target to empower yourself. You deal 6d6 void damage to the target. You gain temporary Hit Points equal to half the void damage the target takes (after applying resistances and the like). You lose any remaining temporary Hit Points after 1 minute.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "death", "manipulate", "void"]
    traditions: ["arcane", "divine", "occult"]
    range: "touch"
    targets: "1 living creature"
    defense: "basic Fortitude"
- id: "vanishing-tracks"
  name: "Vanishing Tracks"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You obscure the tracks you leave behind. The DC of checks to Track you gains a +4 status bonus or is equal to your spell DC, whichever results in a higher DC.
    **Heightened (2nd).** The duration increases to 8 hours.
    **Heightened (4th).** The duration increases to 8 hours. The spell has a range of 20 feet and targets up to 10 creatures.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["primal"]
    duration: "1 hour"
- id: "vapor-form"
  name: "Vapor Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The target transforms into a vaporous state. In this state, the target is amorphous. It loses any item bonus to AC and all other effects and bonuses from armor, and it uses its proficiency modifier for unarmored defense. It gains resistance 8 to physical damage and is immune to precision damage. It can't cast spells, activate items, or use actions that have the attack or manipulate trait. It gains a fly Speed of 10 feet and can slip through tiny cracks. The target can Dismiss the spell."
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["air", "concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
    duration: "5 minutes"
- id: "veil-of-privacy"
  name: "Veil of Privacy"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You erect protective wards that make the target difficult to detect via magic. Veil of privacy attempts to counteract all detection, revelation, and scrying effects used against the target or the target's gear throughout the duration, counting cantrips as 1st-rank spells for this purpose. Successfully counteracting a spell that targets an area or multiple targets negates the effects for only veil of privacy's target."
  properties:
    kind: "spell"
    rank: 3
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "occult", "primal"]
    castTime: "10 minutes"
    range: "touch"
    targets: "1 creature or object"
    duration: "8 hours"
- id: "ventriloquism"
  name: "Ventriloquism"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Whenever you speak or make any other sound vocally, you can make your vocalization seem to originate from somewhere else within 60 feet, and you can change that apparent location freely as you vocalize. Any creature that hears the sound can attempt to disbelieve your illusion.
    **Heightened (2nd).** The spell's duration increases to 1 hour, and you can also change the tone, quality, and other aspects of your voice. Before a creature can attempt to disbelieve your illusion, it must actively attempt a Perception check or otherwise use actions to interact with the sound.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["auditory", "concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "10 minutes"
- id: "vibrant-pattern"
  name: "Vibrant Pattern"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a pattern of lights that pulses with intensity. Creatures are dazzled while inside the pattern.
    In addition, a creature must attempt a Will saving throw if it's inside the pattern when you cast it, enters the pattern, ends its turn within the pattern, or uses a Seek or Interact action on the pattern. A creature currently blinded by the pattern doesn't need to attempt new saving throws.
    **Success.** The creature is unaffected.
    **Failure.** The creature is blinded by the pattern. If it exits the pattern, it can attempt a new save to recover from the blinded condition at the end of each of its turns, to a maximum duration of 1 minute.
    **Critical Failure.** The creature is blinded for 1 minute.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["illusion", "incapacitation", "manipulate", "subtle", "visual"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    area: "10-foot burst"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "vision-of-death"
  name: "Vision of Death"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You force the target to see a vision of its own death. It takes 8d6 mental damage with a Will save. If the target is reduced to 0 HP by this spell, its vision becomes reality and kills it instantly.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage and is frightened 1.
    **Failure.** The target takes full damage and is frightened 2.
    **Critical Failure.** The target takes double damage, is frightened 4, and is fleeing for as long as it's frightened.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "death", "emotion", "fear", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    targets: "1 living creature"
    defense: "Will"
- id: "vital-beacon"
  name: "Vital Beacon"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Vitality radiates outward from you, allowing others to supplicate and receive healing. Once per round, either you or an ally can use an Interact action to supplicate and lay hands upon you to regain Hit Points. Each time the beacon heals someone, it decreases in strength. It restores 4d10 Hit Points to the first creature, 4d8 Hit Points to the second, 4d6 Hit Points to the third, and 4d4 Hit Points to the fourth, after which the spell ends. You can have only one vital beacon active at a time.
    **Heightened (+1).** The beacon restores one additional die of HP each time it heals, using the normal die size for that step.
  properties:
    kind: "spell"
    rank: 4
    traits: ["concentrate", "healing", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    castTime: "1 minute"
    duration: "until your next daily preparations"
- id: "vitality-lash"
  name: "Vitality Lash"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You demolish the target's corrupted essence with the energy of creation. You deal 2d6 vitality damage with a basic Fortitude save. If the creature critically fails the save, it is also enfeebled 1 until the start of your next turn.
    **Heightened (+1).** The damage increases by 1d6.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    range: "30 feet"
    targets: "1 creature that is undead or otherwise has void healing"
    defense: "basic Fortitude"
- id: "void-warp"
  name: "Void Warp"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You call upon the Void to harm life force. The target takes 2d4 void damage with a basic Fortitude save. On a critical failure, the target is also enfeebled 1 until the start of your next turn.
    **Heightened (+1).** The damage increases by 1d4.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate", "void"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 living creature"
    defense: "basic Fortitude"
- id: "volcanic-eruption"
  name: "Volcanic Eruption"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The ground opens up, spraying a column of lava high into the air in a vertical cylinder, dealing 14d6 fire damage to creatures in the area. The lava rapidly cools and encases creatures in the area. A creature encased in rock is clumsy 1 and takes a -10-foot status penalty to its Speeds. All normal terrain is difficult terrain to a flying creature, and such creatures immediately descend 20 feet the moment they're encased, but they don't take damage from this fall. A creature encased in rock can attempt to Escape against your spell DC to end the effect. Otherwise, the creature remains encased until it takes a total of 50 damage, freeing it from the rock. Additionally, creatures in the area and those within 5 feet of the lava column automatically take 3d6 fire damage from the intense heat, regardless of the results of their saving throws.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage and is encased.
    **Critical Failure.** The creature takes double damage and is encased.
    **Heightened (+1).** The damage in the area increases by 2d6, and the damage from the intense heat increases by 1d6.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "manipulate", "fire"]
    traditions: ["primal"]
    range: "120 feet"
    area: "5-foot radius, 80-foot-tall cylinder"
    defense: "Reflex"
- id: "wails-of-the-damned"
  name: "Wails of the Damned"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You howl a lament of damned souls. Each living enemy in the area takes 8d10 void damage depending on its Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes full damage.
    **Failure.** The creature takes full damage and is drained 1d4.
    **Critical Failure.** The creature takes double damage and is drained 4.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["auditory", "concentrate", "death", "manipulate", "void"]
    traditions: ["divine", "occult"]
    area: "40-foot emanation"
    defense: "Fortitude"
- id: "wall-of-fire"
  name: "Wall of Fire"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You raise a blazing wall that burns creatures passing through it. You create either a 5-foot-thick wall of flame in a straight line up to 60 feet long and 10 feet high, or a 5-foot-thick, 10-foot-radius ring of flame with the same height. The wall stands vertically in either form; if you wish, the wall can be of a shorter length or height. Everything on each side of the wall is concealed from creatures on the opposite side. Any creature that crosses the wall or is occupying the wall's area at the start of its turn takes 4d6 fire damage.
    **Heightened (+1).** The fire damage increases by 1d6.
  properties:
    kind: "spell"
    rank: 4
    actions: "three"
    traits: ["concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    duration: "1 minute"
- id: "wall-of-force"
  name: "Wall of Force"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You form an invisible wall of pure magical force up to 50 feet long and up to 20 feet high. The wall has no discernible thickness. You must create the wall in an unbroken open space so its edges don't pass through any creatures or objects, or the spell is lost. The wall has AC 10, Hardness 30, and 60 Hit Points, and it's immune to critical hits and precision damage. The wall blocks physical effects from passing through it, and because it's made of force, it blocks incorporeal and ethereal creatures as well. Teleportation effects can pass through the barrier, as can visual effects (since the wall is invisible).
    Wall of force is immune to effects of its rank or lower that attempt to counteract it. The wall is automatically destroyed by a disintegrate spell of any rank.
    **Heightened (+2).** The Hit Points of the wall increase by 20.
  properties:
    kind: "spell"
    rank: 6
    actions: "three"
    traits: ["concentrate", "force", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    duration: "1 minute"
- id: "wall-of-ice"
  name: "Wall of Ice"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You sculpt an ice barrier that blocks sight and, once shattered, freezes foes. You create either a 1-foot-thick wall of ice in a straight line up to 60 feet long and 10 feet high (the wall doesn't have to be vertical, but it must be anchored on both sides to a solid surface) or a 1-foot-thick, 10-foot radius hemisphere of ice. The ice that makes up the wall is opaque. If you wish, the wall can be of a smaller length, height, or radius. You must create the wall in an unbroken open space so its edges don't pass through any creatures or objects, or the spell is lost.
    Each 10-foot-by-10-foot section of the wall has AC 10, Hardness 10, and 40 Hit Points, and it's immune to critical hits, cold damage, and precision damage. A section also has weakness 15 to fire; a section of the wall destroyed by fire melts, evaporating into water and steam. A section destroyed by means other than fire leaves behind a chilling mass of ice that is difficult terrain and deals 2d6 cold damage to any creature passing through it.
    **Heightened (+2).** The Hit Points of each section of the wall increase by 10, and the cold damage dealt to creatures crossing a destroyed section increases by 1d6.
  properties:
    kind: "spell"
    rank: 5
    actions: "three"
    traits: ["cold", "concentrate", "manipulate", "water"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    duration: "1 minute"
- id: "wall-of-stone"
  name: "Wall of Stone"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shape a wall of solid stone. You create a 1-inch-thick wall of stone up to 120 feet long, and 20 feet high. You can shape the wall's path, placing each 5 feet of the wall on the border between squares. The wall doesn't need to stand vertically, so you can use it to form a bridge or set of stairs, for example. You must conjure the wall in an unbroken open space so its edges don't pass through any creatures or objects, or the spell is lost. Each 10-foot-by-10-foot section of the wall has AC 10, Hardness 14, and 50 Hit Points, and it's immune to critical hits and precision damage. A destroyed section of the wall can be moved through, but the rubble created from it is difficult terrain.
    **Heightened (+2).** The Hit Points of each section of the wall increase by 15.
  properties:
    kind: "spell"
    rank: 5
    actions: "three"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
- id: "wall-of-thorns"
  name: "Wall of Thorns"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You grow a wall of thorny brambles from the ground. You create a 5-foot-thick wall of brambles and thorns in a straight line up to 60 feet long and 10 feet high. You must create the wall in an unbroken open space so its edges don't pass through any creatures or objects, or the spell is lost. The wall stands vertically. If you wish, the wall can be of a shorter length or height. Everything on each side of the wall has cover from creatures on the opposite side, and the wall's spaces are difficult terrain. For every move action a creature uses to enter at least one of the wall's spaces, that creature takes 3d4 piercing damage.
    Each 10-foot-by-10-foot section of the wall has AC 10, Hardness 10, and 20 Hit Points. It's immune to critical hits and precision damage. A destroyed section can be moved through freely.
    **Heightened (+1).** The Hit Points of each section of the wall increase by 5, and the piercing damage increases by 1d4.
  properties:
    kind: "spell"
    rank: 3
    actions: "three"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "60 feet"
    duration: "1 minute"
- id: "wall-of-wind"
  name: "Wall of Wind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a barrier of gusting winds that hinders anything moving through it. The wall of swirling winds is 5 feet thick, 60 feet long, and 30 feet high. The wall stands vertically, but you can shape its path. Though the wall of wind distorts the air, it does not hamper sight. The wall has the following effects.
    • Ammunition from physical ranged attacks—such as arrows, bolts, sling bullets, and other objects of similar size—can't pass through the wall. Attacks with bigger ranged weapons, such as javelins, take a -2 circumstance penalty to their attack rolls if their paths pass through the wall. Massive ranged weapons and spell effects that don't create physical objects pass through the wall with no penalty.
    • The wall is difficult terrain to creatures attempting to move overland through it. Gases, including creatures in vapor form, can't pass through the wall.
    • A creature that attempts to fly through the wall using a move action must attempt a Fortitude save.
    **Critical Success.** The creature can move through the wall normally this turn.
    **Success.** The flying creature can move through the wall this turn, but the wall is difficult terrain.
    **Failure.** The wall stops the movement of the flying creature, and any remaining movement from its current action is wasted.
    **Critical Failure.** As failure, and the creature is pushed 10 feet away from the wall.
  properties:
    kind: "spell"
    rank: 3
    actions: "three"
    traits: ["air", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    duration: "1 minute"
- id: "warp-mind"
  name: "Warp Mind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You scramble a creature's mental faculties and sensory input. The target must attempt a Will saving throw. Regardless of the result of that save, the target is then temporarily immune for 10 minutes. Warp mind's effects happen instantly, so dispel magic and other effects that counteract spells can't counteract them. However, wish rituals and abilities that can remove non-magical effects can still counteract the effects.
    **Critical Success.** The target is unaffected.
    **Success.** The target spends the first action on its next turn with the confused condition.
    **Failure.** The target is confused for 1 minute.
    **Critical Failure.** The target is confused permanently.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "emotion", "incapacitation", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    targets: "1 creature"
    defense: "Will"
- id: "water-breathing"
  name: "Water Breathing"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The targets can breathe underwater.
    **Heightened (3rd).** The duration is 8 hours.
    **Heightened (4th).** The duration is until your next daily preparations.
  properties:
    kind: "spell"
    rank: 2
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["arcane", "divine", "primal"]
    castTime: "1 minute"
    range: "30 feet"
    targets: "up to 5 creatures"
    duration: "1 hour"
- id: "water-walk"
  name: "Water Walk"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target can walk on the surface of water and other liquids without falling through. It can go underwater if it wishes, but in that case it must Swim normally. This spell doesn't grant the ability to breathe underwater.
    **Heightened (4th).** The spell's range increases to 30 feet, the duration increases to 1 hour, and you can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["arcane", "divine", "primal"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "wave-of-despair"
  name: "Wave of Despair"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You inflict despair on creatures in the area. The effects for each creature are determined by its Will save.
    **Critical Success.** The creature is unaffected.
    **Success.** For 1 round, the creature can't use reactions and must attempt another save at the start of its turn; on a failure, it is slowed 1 for that turn as it sobs uncontrollably.
    **Failure.** As success, but the duration is 1 minute.
    **Critical Failure.** As failure, and the creature is automatically slowed 1 for 1 minute.
    **Heightened (7th).** The area increases to a 60-foot cone.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "emotion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    area: "30-foot cone"
    defense: "Will"
    duration: "1 or more rounds"
- id: "weapon-storm"
  name: "Weapon Storm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You swing a weapon you're holding, and the weapon magically multiplies into duplicates that swipe at all creatures in either a cone or an emanation. This flurry deals four dice of damage to creatures in the area. This damage has the same type as the weapon and uses the same die size. Determine the die size as if you were attacking with the weapon; for instance, if you were wielding a two-hand weapon in both hands, you'd use its two-hand damage die.
    **Critical Success.** The creature is unaffected.
    **Success.** The target takes half damage.
    **Failure.** The target takes full damage.
    **Critical Failure.** The target takes double damage and is subject to the weapon's critical specialization effect.
    **Heightened (+1).** Add another damage die.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    area: "30-foot cone or 10-foot emanation"
    defense: "Reflex"
- id: "wrathful-storm"
  name: "Wrathful Storm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A massive storm cloud forms in the air above the area, spreading rain and gales. The wind imposes a -4 circumstance penalty to physical ranged attacks. The air in the area is greater difficult terrain for flying creatures. When you Cast this Spell and the first time each round you Sustain it on subsequent rounds, you can choose one of the following storm effects. You can't choose the same effect twice in a row.
    - **Blizzard.** The driving snow deals 4d8 cold damage to each creature in or below the storm with no save. Everything in or beneath the cloud is concealed by driving snow and any ground is difficult terrain.
    - **Hail.** Each creature in or below the storm takes 4d10 bludgeoning damage with a basic Fortitude save.
    - **Lightning.** Choose up to 10 creatures in or below the storm to be struck by lightning. Each of them takes 7d6 electricity damage with a basic Reflex save.
    - **Tornado.** A roughly cylindrical whirlwind appears in or below the cloud in a 30-foot radius. Each creature in the whirlwind is thrown 40 feet upward.
    **Heightened (10th).** The range increases to 2,000 feet and the cloud is a 1,000-foot burst.
  properties:
    kind: "spell"
    rank: 9
    actions: "three"
    traits: ["air", "cold", "concentrate", "electricity", "manipulate"]
    traditions: ["primal"]
    range: "800 feet"
    area: "400-foot burst"
    duration: "sustained up to 1 minute"
- id: "zealous-conviction"
  name: "Zealous Conviction"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You bypass your targets' rational minds, instilling them with unshakable conviction and zeal. The targets each gain 12 temporary Hit Points and a +2 status bonus to Will saves against mental effects, as their faith overrides the signals from their own bodies and minds. If you tell a target to do something, it must comply with your request, though if it would normally find the task repugnant, it can attempt a Will save at the end of its turn each round due to the cognitive dissonance. On a success, it ends the spell's effects on itself entirely.
    **Heightened (9th).** The temporary Hit Points increase to 18, and the status bonus to Will saves increases to +3.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "emotion", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    range: "30 feet"
    targets: "up to 10 willing creatures"
    duration: "10 minutes"
