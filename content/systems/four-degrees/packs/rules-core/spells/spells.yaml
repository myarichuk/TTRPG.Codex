    duration: "1 minute"
- id: "darkness-spell"
  name: "Darkness"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a shroud of darkness that prevents light from penetrating or emanating within the area. Light does not enter the area and any non-magical light sources, such as a torch or lantern, do not emanate any light while inside the area, even if their light radius would extend beyond the darkness. This also suppresses magical light of your darkness spell's rank or lower. Light can't pass through, so creatures in the area can't see outside. From outside, it appears as a globe of pure darkness.
    **Heightened (4th).** Even creatures with darkvision (but not greater darkvision) can barely see through the darkness. They treat targets seen through the darkness as concealed.
  properties:
    kind: "spell"
    rank: 2
    actions: "three"
    traits: ["concentrate", "darkness", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "120 feet"
    area: "20-foot burst"
    duration: "1 minute"
- id: "darkvision"
  name: "Darkvision"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You grant yourself supernatural sight in areas of darkness. You gain darkvision.
    **Heightened (3rd).** The spell's range is touch and it targets 1 willing creature.
    **Heightened (5th).** The spell's range is touch and it targets 1 willing creature. The duration is until your next daily preparations.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "1 hour"
- id: "daze"
  name: "Daze"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You push into the target's mind and daze it with a mental jolt. The jolt deals 1d6 mental damage, with a basic Will save. If the target critically fails the save, it is also stunned 1.
    **Heightened (+2).** The damage increases by 1d6.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate", "mental", "nonlethal"]
    traditions: ["arcane", "divine", "occult"]
    range: "60 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 round"
- id: "dazzling-flash"
  name: "Dazzling Flash"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You raise your religious symbol and create a blinding flash of light. Each creature in the area must attempt a Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature is dazzled for 1 round.
    **Failure.** The creature is blinded for 1 round and dazzled for 1 minute. The creature can spend an Interact action rubbing its eyes to end the blinded condition.
    **Critical Failure.** The creature is blinded for 1 round and dazzled for 1 hour.
    **Heightened (3rd).** The area increases to a 30-foot cone.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "light", "manipulate", "visual"]
    focusGroup: "Sun"
    area: "15-foot cone"
    defense: "Fortitude"
- id: "deafness"
  name: "Deafness"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target loses its hearing. It must attempt a Fortitude save, and it is then temporarily immune for 1 minute.
    **Critical Success.** The target is unaffected.
    **Success.** The target is deafened for 1 round.
    **Failure.** The target is deafened for 10 minutes.
    **Critical Failure.** The target is deafened permanently.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
- id: "death-s-call"
  name: "Death's Call"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Seeing another pass from this world invigorates you. You gain temporary Hit Points equal to the triggering creature's level plus your spellcasting attribute modifier. If the triggering creature was undead, double the number of temporary Hit Points you gain. These last for the duration of the spell, and the spell ends if all the temporary Hit Points are depleted earlier."
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "focus"]
    focusGroup: "Death"
    trigger: "A living creature within 20 feet of you dies, or an undead creature within 20 feet of you is destroyed."
    duration: "1 minute"
- id: "deceiver-s-cloak"
  name: "Deceiver's Cloak"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** mischief
    Your patron drapes a cloak of illusion about you, making you appear as another creature of the same body shape with roughly similar height and weight as yourself. This has the effects of 3rd-rank illusory disguise.
    **Heightened (6th).** You can appear as any creature of the same size, even with a completely different body shape.
  properties:
    kind: "focus"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "hex", "illusion", "manipulate", "witch"]
    focusGroup: "Witch Hex Spells"
    duration: "1 hour"
- id: "delusional-pride"
  name: "Delusional Pride"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You make the target overconfident, leading it to ascribe failure to external factors. The target attempts a Will save to determine the spell's duration and is temporarily immune for 24 hours regardless of the save's result.
    **Critical Success.** The target is unaffected.
    **Success.** The duration is 1 round. If the target fails at an attack roll or skill check, it takes a -1 status penalty to attack rolls and skill checks until the end of its turn (or the end of its next turn, if it attempted the roll outside its turn). If the creature fails a second time while taking this penalty, the penalty increases to -2.
    **Failure.** As success, but the duration is 10 minutes.
    **Critical Failure.** As success, but the duration is 24 hours.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "emotion", "focus", "manipulate", "mental"]
    focusGroup: "Confidence"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "desiccate"
  name: "Desiccate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You pull the moisture from the targets' bodies, dealing 10d10 void damage. Creatures made of water (such as water elementals) and plant creatures use the outcome for one degree of success worse than the result of their saving throw. Creatures whose bodies contain no significant moisture (such as earth elementals) are immune to desiccate.
    **Heightened (+1).** The damage increases by 1d10.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "manipulate", "void"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    targets: "any number of living creatures"
    defense: "basic Fortitude"
- id: "destructive-aura"
  name: "Destructive Aura"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Swirling sands of divine devastation surround you, weakening the defenses of all they touch. Reduce the resistances of yourself and creatures in the area by 2.
    **Heightened (+2).** Reduce the resistances by an additional 2.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "aura", "cleric", "concentrate", "focus", "manipulate"]
    focusGroup: "Destruction"
    area: "15-foot emanation"
    duration: "1 minute"
- id: "detect-magic"
  name: "Detect Magic"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You send out a pulse that registers the presence of magic. You receive no information beyond the presence or absence of magic. You can choose to ignore magic you're fully aware of, such as the magic items and ongoing spells of you and your allies.
    You detect illusion magic only if that magic's effect has a lower rank than the rank of your detect magic spell. However, items that have an illusion aura but aren't deceptive in appearance (such as an invisibility potion) typically are detected normally.
    **Heightened (3rd).** You learn the rank or level of the most powerful magical effect the spell detects, as determined by the GM.
    **Heightened (4th).** As 3rd rank, but you also pinpoint the source of the highest-rank magic. Like for an imprecise sense, you don't learn the exact location, but can narrow down the source to within a 5-foot cube (or the nearest if larger than that).
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "detection", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    area: "30-foot emanation"
- id: "detect-poison"
  name: "Detect Poison"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You detect whether a creature is venomous or poisonous, or if an object is poison or has been poisoned. You do not ascertain whether the target is poisonous in multiple ways, nor do you learn the type or types of poison. Certain substances, like lead and alcohol, are poisons and so mask other poisons.
    **Heightened (2nd).** You learn the number and types of poison.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["uncommon", "concentrate", "detection", "manipulate"]
    traditions: ["divine", "primal"]
    range: "30 feet"
    targets: "1 object or creature"
- id: "detect-scrying"
  name: "Detect Scrying"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    By reading trace auras, you detect the presence of scrying effects in the area. If detect scrying is higher rank than a scrying effect, you gain a glimpse of the scrying creature and learn its approximate distance and direction.
    **Heightened (6th).** The duration is until your next daily preparations.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["uncommon", "concentrate", "detection", "manipulate"]
    traditions: ["arcane", "occult"]
    area: "30-foot emanation"
    duration: "1 hour"
- id: "detonate-magic"
  name: "Detonate Magic"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You cause the magic within the target to dissipate in a destructive explosion. You attempt to counteract the target. If the attempt succeeds, an explosion of magical force deals 8d6 force damage with a basic Reflex save. If you successfully counteract the magic of an item, it's deactivated for 1 week (or destroyed on a critical success) and the explosion is a 5-foot emanation from the item. If you successfully counteract a spell, the effect ends and the explosion affects either all creatures in the spell's area or the target of the spell and all creatures in a 5-foot emanation around it."
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    targets: "1 magic item or spell effect"
    defense: "basic Reflex (see text)"
- id: "dinosaur-form"
  name: "Dinosaur Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You channel the primal forces of nature to transform into a Large animal battle form, specifically that of a powerful and terrifying dinosaur. When you Cast this Spell, choose a listed battle form. You can decide the specific type of animal, but this has no effect on the form's Size or statistics. While in this form, you gain the animal and dinosaur traits. You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
    • 15 temporary Hit Points.
    • Low-light vision and imprecise scent 30 feet.
    • One or more unarmed melee attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +16, and your damage bonus is +9. These attacks are Strength based (for the purpose of the enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead.
    • Athletics modifier of +18, unless your own is higher.
    You also gain specific abilities based on the form you choose:
    - **Ankylosaurus.** Speed 25 feet; Melee [1 action] tail (backswing, reach 10 feet), Damage 2d6 bludgeoning; Melee [1 action] foot, Damage 2d6 bludgeoning.
    - **Brontosaurus.** Speed 25 feet; Melee [1 action] tail (reach 15 feet), Damage 2d6 bludgeoning; Melee [1 action] foot, Damage 2d8 bludgeoning.
    - **Deinonychus.** Speed 40 feet; Melee [1 action] talon (agile), Damage 2d4 piercing plus 1 persistent bleed; Melee [1 action] jaws, Damage 1d10 piercing.
    - **Stegosaurus.** Speed 30 feet; Melee [1 action] tail (reach 10 feet), Damage 2d8 piercing.
    - **Triceratops.** Speed 30 feet; Melee [1 action] horn, Damage 2d8 piercing, plus 1d6 persistent bleed on a critical hit; Melee
    [1 action] foot, Damage 2d6 bludgeoning.
    - **Tyrannosaurus.** Speed 30 feet; Melee [1 action] jaws (deadly d12, reach 10 feet), Damage 1d12 piercing; Melee [1 action] tail (reach 10 feet), Damage 1d10 bludgeoning.
    **Heightened (5th).** Your battle form is Huge and your attacks have 15-foot reach, or 20-foot reach if they started with 15-foot reach. You instead gain 20 temporary HP, an attack modifier of +18, a damage bonus of +6, double the damage dice, and Athletics +21.
    **Heightened (7th).** Your battle form is Gargantuan and your attacks have 20-foot reach, or 25-foot reach if they started with 15-foot reach. You instead gain AC = 21 + your level, 25 temporary HP, an attack modifier of +25, a damage bonus of +15, double the damage dice, and Athletics +25.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["primal"]
    duration: "1 minute"
- id: "dirge-of-doom"
  name: "Dirge of Doom"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Enemies within the area are frightened 1. They can't reduce their frightened value below 1 while they remain in the area."
  properties:
    kind: "cantrip"
    rank: 3
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "concentrate", "emotion", "fear", "mental"]
    focusGroup: "Bard Composition Spells"
    area: "30-foot emanation"
    duration: "1 round"
- id: "disappearance"
  name: "Disappearance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You shroud a creature from others' senses. The target becomes invisible, but not merely to vision. The invisibility granted by disappearance applies to all precise senses an observer might have. It's still possible for a creature to find the target by Seeking using various senses, looking for disturbed dust, hearing gaps in the sound spectrum, or finding some other way to discover the presence of a creature that is otherwise undetectable."
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["illusion", "manipulate", "subtle"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "discern-secrets"
  name: "Discern Secrets"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your patron deigns to whisper a few secrets. The target can Recall Knowledge, Seek, or Sense Motive as a free action. The target gains a +1 status bonus to the statistic used for the roll (a skill or Perception) on the roll and as long as you Sustain the spell. The target is temporarily immune to discern secrets for 1 minute.
    **Heightened (5th).** You can target two creatures instead of one.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cantrip", "hex", "manipulate", "witch"]
    focusGroup: "Patron Hex Cantrips"
    range: "30 feet"
    targets: "1 creature"
    duration: "sustained up to 1 minute"
- id: "disguise-magic"
  name: "Disguise Magic"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You alter how an item's or spell's magical aura appears to effects like detect magic. You can hide the auras entirely, have an item register as a common item of lower level, or make a spell register as a common spell of the same or lower rank. You can Dismiss the spell.
    A caster using detect magic or read aura of a higher rank than disguise magic can attempt to disbelieve the illusion using the skill matching the tradition of the spell (Arcana for arcane, Religion for divine, Occultism for occult, or Nature for primal). Further attempts by the same caster get the same result as the initial check to disbelieve.
    **Heightened (2nd).** You can Cast this Spell on a creature, disguising all items and spell effects on it.
  properties:
    kind: "spell"
    rank: 1
    traits: ["concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "30 feet"
    targets: "1 item or spell effect"
    duration: "until your next daily preparations"
- id: "disintegrate"
  name: "Disintegrate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A black tracer bolt flies toward your target, and upon making contact intensifies into a powerful destructive beam. Make a spell attack against the target. If you hit an object or force construct (such as a wall of force), it's destroyed with no save unless it's an artifact or similarly powerful. A single casting can destroy no more than a 10-foot cube of matter.
    If you hit a creature, it takes 12d10 damage (no damage type) with a basic Fortitude save. If you critically hit, the target gets a result one degree of success worse than the outcome of its Fortitude save. A creature reduced to 0 HP is blasted to fine powder; its gear remains.
    **Heightened (+1).** The damage increases by 2d10.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["attack", "concentrate", "manipulate"]
    traditions: ["arcane"]
    range: "120 feet"
    targets: "1 creature, unattended object, or force construct"
    defense: "AC and basic Fortitude"
- id: "dispel-magic"
  name: "Dispel Magic"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You unravel the magic behind a spell or effect. Attempt a counteract check against the target. If you successfully counteract a magic item, it becomes a mundane item of its type for 10 minutes. This doesn't change the item's non-magical properties. If the target is an artifact or similar item, you automatically fail."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "120 feet"
    targets: "1 spell effect or unattended magic item"
- id: "dispelling-globe"
  name: "Dispelling Globe"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create an immobile globe around yourself. It attempts to counteract any spell from outside the globe whose area or targets enter into it, as if the globe were a dispel magic spell 1 rank lower than its actual spell rank. If the counteract attempt succeeds, it prevents only the portion of the spell that would have entered the globe (so if the spell also has targets outside the globe, or part of its area is beyond the globe, those targets or that area are affected normally). You must form the sphere in an unbroken open space, so its edges don't pass through any creatures or objects, or the spell is lost (though creatures can enter the globe after the spell is cast)."
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    area: "10-foot burst centered on one corner of your space"
    duration: "10 minutes"
- id: "disperse-into-air"
  name: "Disperse Into Air"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "After taking the triggering damage, you transform into air. Until the end of the current turn, you can't be attacked or targeted, you don't take up space, you can't act, and any auras or emanations you have are suppressed. At the end of the turn, you re-form in any space you can occupy within 15 feet of where you were when you dispersed. Any auras or emanations you had are restored as long as their duration didn't run out while you were dispersed."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "air", "cleric", "focus", "manipulate", "polymorph"]
    focusGroup: "Air"
    trigger: "You take damage from an enemy or a hazard."
- id: "divine-decree"
  name: "Divine Decree"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You utter a potent litany from your faith, a mandate that harms those who oppose your ideals. You deal 7d10 spirit damage to your enemies in the area; each enemy must attempt a Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage and is enfeebled 2 for 1 minute.
    **Critical Failure.** The creature takes double damage and is enfeebled 2 for 1 minute. If you're on your home plane and the creature is not, the creature is sent back to its home plane. A creature of 10th level or lower must also succeed at a Will save or be paralyzed for 1 minute; if it critically fails, it dies (this is a death effect).
    **Heightened (+1).** The damage increases by 1d10, and the level of creatures that must attempt a second save on a critical failure increases by 2.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "manipulate", "sanctified", "spirit"]
    traditions: ["divine"]
    area: "40-foot emanation"
    defense: "Fortitude"
    duration: "varies"
- id: "divine-immolation"
  name: "Divine Immolation"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Divine flames scour creatures within the area. Creatures take 6d6 fire damage and 2d6 persistent fire damage. The divine power within the flames scorches the spirit as well; a creature takes spirit damage instead of fire damage from divine immolation if that would be more detrimental to the creature (as determined by the GM).
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage and no persistent damage.
    **Failure.** The creature takes full damage and persistent damage.
    **Critical Failure.** The creature takes double damage and double persistent damage.
    **Heightened (+1).** The damage increases by 1d6 and persistent damage increases by 1d6.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "fire", "manipulate", "sanctified", "spirit"]
    traditions: ["divine"]
    range: "120 feet"
    area: "20-foot burst"
    defense: "Reflex"
- id: "divine-inspiration"
  name: "Divine Inspiration"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You infuse a target with spiritual energy, refreshing its magic. If it prepares spells, it recovers one 6th-rank or lower spell it previously cast today and can cast that spell again. If it spontaneously casts spells, it recovers one of its 6th-rank or lower spell slots. If it has a focus pool, it regains its Focus Points, as if it had Refocused."
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["divine"]
    range: "touch"
    targets: "1 willing creature"
- id: "divine-lance"
  name: "Divine Lance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You unleash a beam of divine energy. Make a ranged spell attack against the target's AC. On a hit, the target takes 2d4 spirit damage (double damage on a critical hit).
    **Heightened (+1).** The damage increases by 1d4.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["attack", "cantrip", "concentrate", "manipulate", "sanctified", "spirit"]
    traditions: ["divine"]
    range: "60 feet"
    targets: "1 creature"
    defense: "AC"
- id: "divine-wrath"
  name: "Divine Wrath"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You channel the fury of divinity against your foes. You deal 4d10 spirit damage to enemies in the area, depending on their Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage and is sickened 1.
    **Critical Failure.** The creature takes full damage and is sickened 2; while it's sickened, it's also slowed 1.
    **Heightened (+1).** The damage increases by 1d10.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "sanctified", "spirit"]
    traditions: ["divine"]
    range: "120 feet"
    area: "20-foot burst"
    defense: "Fortitude"
- id: "dizzying-colors"
  name: "Dizzying Colors"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You unleash a swirling multitude of colors that overwhelms creatures based on their Will saves.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature is dazzled for 1 round.
    **Failure.** The creature is stunned 1, blinded for 1 round, and dazzled for 1 minute.
    **Critical Failure.** The creature is stunned for 1 round and blinded for 1 minute.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "illusion", "incapacitation", "manipulate", "visual"]
    traditions: ["arcane", "occult"]
    area: "15-foot cone"
    defense: "Will"
    duration: "1 or more rounds (see below)"
- id: "dominate"
  name: "Dominate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You take command of the target, forcing it to obey you. If you issue an obviously self-destructive order, the target doesn't act until you issue a new order. The effect depends on its Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is stunned 1 as it fights off your commands.
    **Failure.** You control the target. It gains the controlled condition, but it can attempt a Will save at the end of each of its turns. On a success, the spell ends.
    **Critical Failure.** As a failure, but the target receives a new save only if you give it a new order that is against its nature, such as killing its allies.
    **Heightened (10th).** The duration is unlimited.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["uncommon", "concentrate", "incapacitation", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "until your next daily preparations"
- id: "downpour"
  name: "Downpour"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You call forth a torrential downpour, which extinguishes non-magical flames. Creatures in the area are concealed and gain fire resistance 10. Creatures outside the area are concealed to those inside the area. If a creature with weakness to water ends its turn in the area, the downpour triggers its weakness.
    **Heightened (+1).** The fire resistance increases by 2.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "water"]
    focusGroup: "Water"
    range: "120 feet"
    area: "30-foot burst"
    duration: "1 minute"
- id: "dragon-form"
  name: "Dragon Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Calling upon powerful magic, you gain a Large dragon battle form. When you Cast this Spell, choose one type of common dragon or another type to which your GM allows access. While in this form, you gain the dragon trait. You have hands in this battle form and can take manipulate actions. You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
    • 10 temporary Hit Points.
    • Speed 40 feet, fly 100 feet. You gain any of the following Speeds the chosen dragon has, but with the listed amount: burrow 20 feet, climb 40 feet, swim 60 feet.
    • Resistance 10 against the damage type of your Dragon Breath (see below).
    • Darkvision and imprecise scent 60 feet.
    • The following unarmed melee attacks, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +22, and your damage bonus is +6. These attacks are Strength based (for the purpose of the enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead. See below for more on these attacks. Melee
    [1 action] jaws, Damage 2d12 piercing plus 2d6 damage of the same damage type as your Dragon Breath (see below); Melee [1 action] claw (agile), Damage 3d10 slashing; Melee [1 action] tail (reach 10 feet), Damage 3d10 bludgeoning.
    • Athletics modifier of +23, unless your own is higher.
    - **Dragon Breath.** [2 actions] You exhale deadly magical energy in an area, dealing 10d6 damage to each creature in the area with a basic save against your spell DC. The shape, damage type, and save type match that of your chosen dragon's breath. If the chosen dragon's breath can deal more than one type of damage, choose one when you cast dragon form. The shape is a 30-foot cone or a 100-foot line. Once activated, Dragon Breath can't be used again for 1d4 rounds. Dragon Breath has the tradition trait matching the type of dragon and the damage trait matching the type of damage it deals, if applicable.
    - **Tradition Resistance.** If the dragon's magical tradition matches that of your dragon form spell, you gain the listed ability. Arcane resistance 5 against damage from spells; divine resistance 10 to spirit, vitality, and void; occult resistance 10 to mental; primal resistance 5 to physical damage.
    **Heightened (8th).** Your battle form is Huge, you gain a +20-foot status bonus to your fly Speed, and your attacks have 10-foot reach (or 15-foot reach if they previously had 10-foot reach). You instead gain AC = 21 + your level, 15 temporary HP, an attack modifier of +28, a damage bonus of +12, and Athletics +28. Your Dragon Breath deals an additional 4d6 damage.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "1 minute"
- id: "dream-message"
  name: "Dream Message"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You send a message to your target's dream. The message is one-way, up to 1 minute of speech (roughly 150 words). If the target is asleep, they receive the message instantly. If not, they receive it the next time they sleep. As soon as they receive it, the spell ends, and you know the message was sent.
    **Heightened (4th).** You can target up to 10 creatures you know by name and have met in person. You must send the same message to all of them; the spell ends for each creature individually.
  properties:
    kind: "spell"
    rank: 3
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult"]
    castTime: "10 minutes"
    range: "planetary"
    targets: "1 creature you know by name and have met in person"
    duration: "until your next daily preparations"
- id: "dreamer-s-call"
  name: "Dreamer's Call"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You create a vivid, illusory daydream drawn from the images of the target's dreams. The daydream appears in an unoccupied space in range, and you attempt to draw the target toward it.
    **Critical Success.** The target is unaffected.
    **Success.** The target's attention wavers. It becomes fascinated by the daydream.
    **Failure.** The target is fascinated with the daydream and pursues a course of action you choose as its first action after you Cast the Spell: approach the daydream, run away from it (as the fleeing condition), Release what it's holding as an offering, or Drop Prone in obeisance.
    **Critical Failure.** As failure, but the target follows the course of action for as many actions as possible for the spell's duration, and does nothing else.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "illusion", "incapacitation", "manipulate", "mental"]
    focusGroup: "Dreams"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "until the end of the target's next turn"
- id: "dreaming-potential"
  name: "Dreaming Potential"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You draw the target into a lucid dream where it can explore the endless possibilities of its own potential within the ever-changing backdrop of its dreamscape. If it sleeps the full 8 hours uninterrupted, when it wakes, it counts as having spent a day of downtime retraining, though it can't use dreaming potential for any retraining that would require either an instructor or specialized knowledge it can't access within the dream."
  properties:
    kind: "spell"
    rank: 5
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["occult"]
    castTime: "10 minutes"
    range: "touch"
    targets: "1 willing sleeping creature"
    duration: "8 hours"
- id: "duplicate-foe"
  name: "Duplicate Foe"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a temporary duplicate of an enemy to fight on your behalf. The target can attempt a Fortitude save to disrupt the spell. The duplicate appears in an unoccupied space adjacent to the target and has the target's attack modifier, AC, saving throw modifiers, Perception, and skill modifiers, but it has only 70 Hit Points and lacks the target's special abilities, including immunities, resistances, and weaknesses. It has no magic items except weapon potency runes.
    The duplicate gains the minion trait, and it can only Stride and Strike. Its Strikes deal the target's normal damage but don't apply added effects, since it doesn't have special abilities. The spell automatically ends if the duplicate's Hit Points drop to 0.
    The duplicate attacks your enemies to the best of its abilities. You can also try to give it additional instructions; when you Sustain the spell, you can also Command a Minion as part of your action, but the GM determines whether the duplicate follows your command.
    The duplicate is unstable, so each turn after it takes its actions, it loses 4d6 Hit Points. It's not a living creature, and it can never regain its lost Hit Points in any way.
    **Critical Success.** You fail to create a duplicate.
    **Success.** The duplicate deals half damage with its Strikes and the duration is reduced to a maximum of 2 rounds.
    **Failure.** The duplicate works as described.
    **Heightened (+1).** The level of creature you can target increases by 2. The duplicate has 10 more HP.
  properties:
    kind: "spell"
    rank: 7
    actions: "three"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 enemy of level 15 or lower"
    defense: "Fortitude"
    duration: "sustained up to 1 minute"
- id: "earthbind"
  name: "Earthbind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Using the weight of earth, you hamper a target's flight, with effects based on its Fortitude save. If the creature reaches the ground safely, it doesn't take falling damage.
    **Critical Success.** The target is unaffected.
    **Success.** The target falls safely up to 120 feet.
    **Failure.** The target falls safely up to 120 feet. If it hits the ground, it can't Fly, levitate, or otherwise leave the ground for 1 round.
    **Critical Failure.** The target falls safely up to 120 feet. If it hits the ground, it can't Fly, levitate, or otherwise leave the ground for 1 minute.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    targets: "1 flying creature"
    defense: "Fortitude"
    duration: "varies"
- id: "earthquake"
  name: "Earthquake"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shake the ground, topple creatures into fissures, and collapse structures. The GM might add additional effects in certain areas. Cliffs might collapse, causing creatures to fall, or a lake might drain as fissures open up below its surface, leaving a morass of quicksand.
    - **Shaking Ground.** The ground is difficult terrain, and creatures on it take a -2 circumstance penalty to attack rolls, AC, and skill checks.
    - **Fissures.** Each creature on the ground must attempt a Reflex save at the start of its turn to keep its footing and avoid falling into 40-foot-deep fissures that open beneath it. The fissures are permanent, and their sides require successful DC 15 Athletics checks to Climb.
    - **Collapse.** Structures and ceilings might collapse. The GM rolls a flat check for each (DC 16 for a sturdy structure, DC 14 for an average structure and most natural formations, DC 9 for a shoddy structure, all adjusted higher or lower as the GM sees fit). A collapse deals 11d6 bludgeoning damage to each creature caught in it with a basic Reflex save. A creature falls prone unless it critically succeeds and falls into a fissure if it critically fails.
    **Heightened (10th).** You create a massive earthquake that can devastate a settlement. The range increases to half a mile and the area to a quarter-mile burst.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    area: "60-foot burst"
    duration: "1 round"
- id: "earthworks"
  name: "Earthworks"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    With a ripple of earth, you raise small barriers from the ground. The ground in the area becomes difficult terrain. The spell's area is a 5-foot burst if you spent 1 action to cast it, a 10-foot burst if you spent 2 actions, or a 15-foot burst if you spent 3 actions. A creature can Interact to clear the barriers from one 5-foot square adjacent to it.
    **Heightened (4th).** You pull the barriers to float in the air, causing the spell to function as difficult terrain for flying creatures.
  properties:
    kind: "focus"
    rank: 1
    traits: ["uncommon", "concentrate", "earth", "focus", "manipulate", "wizard"]
    focusGroup: "Civic Wizardry"
    castTime: "1 to 3 actions"
    range: "60 feet"
    area: "5-foot burst or more"
    duration: "1 minute"
- id: "eclipse-burst"
  name: "Eclipse Burst"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A globe of freezing darkness explodes in the area, dealing 8d10 cold damage to creatures in the area, plus an additional 8d4 void damage to living creatures. Each creature in the area must attempt a Reflex save.
    If the globe overlaps with an area of magical light or affects a creature affected by magical light, eclipse burst attempts to counteract the light effect.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage.
    **Critical Failure.** The creature takes double damage and becomes blinded by the darkness for an unlimited duration.
    **Heightened (+1).** The cold damage increases by 1d10 and the void damage against the living increases by 1d4.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["cold", "concentrate", "darkness", "manipulate", "void"]
    traditions: ["arcane", "divine", "primal"]
    range: "500 feet"
    area: "60-foot burst"
    defense: "Reflex"
- id: "electric-arc"
  name: "Electric Arc"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    An arc of lightning leaps from one target to another. Each target takes 2d4 electricity damage with a basic Reflex save.
    **Heightened (+1).** The damage increases by 1d4.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "electricity", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 or 2 creatures"
    defense: "basic Reflex"
- id: "elemental-betrayal"
  name: "Elemental Betrayal"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** elements
    Your patron uses its superior command of the elements, empowering them to undermine your foe. When you Cast this Spell, choose air, earth, metal, fire, water, or wood. The target gains weakness 2 to that trait.
    **Heightened (+2).** Increase the weakness by 1.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "hex", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    duration: "sustained up to 1 minute"
- id: "elemental-form"
  name: "Elemental Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You call upon the power of the planes to transform into a Medium elemental battle form. When you Cast this Spell, choose a listed element. While in this form, you gain the corresponding trait and the elemental trait. You have hands in this battle form and can take manipulate actions. You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 19 + your level. Ignore your armor's check penalty and Speed reduction.
    • 10 temporary Hit Points.
    • Darkvision.
    • One or more unarmed melee attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +18, and your damage bonus is +9. These are Dexterity based (air, fire, or metal) or Strength based (earth, water, or wood). If your corresponding unarmed attack modifier is higher, you can use it instead.
    • Acrobatics (air, fire, or metal) or Athletics (earth, water, or wood) modifier of +20; ignore this change if your own modifier is higher.
    You gain specific abilities based on the element you choose:
    - **Air.** fly 80 feet, movement doesn't trigger reactions; Melee [1 action] gust, Damage 1d4 bludgeoning.
    - **Earth.** Speed 20 feet, burrow 20 feet; Melee [1 action] boulder, Damage 2d10 bludgeoning.
    - **Fire.** Speed 50 feet; fire resistance 10, weakness 5 to cold and 5 to water; Melee [1 action] tendril, Damage 1d8 fire plus 1d4 persistent fire.
    - **Metal.** Speed 40 feet, fly 20 feet; Melee [1 action] blade (versatile piercing), Damage 1d8 slashing plus 1d4 electricity.
    - **Water.** Speed 20 feet, swim 60 feet; fire resistance 5; Melee [1 action] wave, Damage 1d12 bludgeoning, and you can spend an action immediately after a hit to push the target 5 feet with the effects of a successful Shove.
    - **Wood.** Speed 20 feet, climb 30 feet; Melee [1 action] branch, Damage 2d10 bludgeoning.
    **Heightened (6th).** Your battle form is Large and your attacks have 10-foot reach. You instead gain AC = 22 + your level, 15 temporary HP, an attack modifier of +23, a damage bonus of +13, and Acrobatics or Athletics +23.
    **Heightened (7th).** Your battle form is Huge and your attacks have 15-foot reach. You instead gain AC = 22 + your level, 20 temporary HP, an attack modifier of +25, a damage bonus of +11, double the number of damage dice (including persistent damage), and Acrobatics or Athletics +25.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "embed-message"
  name: "Embed Message"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You specify a trigger and a message up to 25 words long. When the specified trigger occurs within 30 feet of the target, illusory text of your message circles the target accompanied by a disembodied voice. You can choose a language you know for the text and speech, and can choose what the voice sounds like. Once the message is completed, the spell ends.
    **Heightened (4th).** You can add a simple sensory component to emphasize the message, such as an odor, visual effect, or physical sensation. This addition is obviously illusory and part of the message, lasting only while the message is being read.
    **Heightened (6th).** As 4th rank, but you can choose how many times the spell repeats the message before it ends; there is no limit to the number of repetitions.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 object or willing creature"
    duration: "unlimited"
- id: "enduring-might"
  name: "Enduring Might"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your own might mingles with divine power to protect you from harm. You gain resistance equal to 8 plus your Strength modifier against all damage from the triggering attack or effect.
    **Heightened (+1).** The resistance increases by 2.
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "focus", "manipulate"]
    focusGroup: "Might"
    trigger: "An attack or effect would deal damage to you."
- id: "energy-absorption"
  name: "Energy Absorption"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You're used to mitigating the damage done by bombs, siege engines, and magical artillery. You gain resistance 15 to your choice of acid, cold, electricity, or fire damage from the triggering effect. The resistance applies only to the triggering effect's initial damage.
    **Heightened (+1).** The resistance increases by 5.
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "focus", "wizard"]
    focusGroup: "Battle Magic"
    trigger: "An effect would deal acid, cold, electricity, or fire damage to you."
- id: "energy-aegis"
  name: "Energy Aegis"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You protect the target with a powerful, long-lasting energy barrier. The target gains resistance 5 to acid, cold, electricity, fire, force, sonic, vitality, and void damage.
    **Heightened (9th).** The resistances increase to 10.
  properties:
    kind: "spell"
    rank: 7
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "1 minute"
    range: "touch"
    targets: "1 creature"
    duration: "until your next daily preparations"
- id: "enfeeble"
  name: "Enfeeble"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You sap the target's strength, depending on its Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is enfeebled 1 until the start of your next turn.
    **Failure.** The target is enfeebled 2 for 1 minute.
    **Critical Failure.** The target is enfeebled 3 for 1 minute.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
    duration: "varies"
- id: "enlarge"
  name: "Enlarge"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Bolstered by magical power, the target grows to size Large. Its equipment grows with it but returns to natural size if removed. The creature is clumsy 1. Its reach increases by 5 feet (or by 10 feet if it started out Tiny), and it gains a +2 status bonus to damage rolls on melee Strikes. This spell has no effect on a Large or larger creature.
    **Heightened (4th).** The creature instead grows to size Huge. The status bonus to melee damage is +4 and the creature's reach increases by 10 feet (or 15 feet if the creature started out Tiny). The spell has no effect on a Huge or larger creature.
    **Heightened (6th).** Choose either the 2nd-rank or 4th-rank version of this spell and apply its effects to up to 10 willing creatures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 willing creature"
    duration: "5 minutes"
- id: "enlarge-companion"
  name: "Enlarge Companion"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your animal companion grows much larger, towering over its foes in battle. Your animal companion becomes Large, gaining the effects of a 2nd-rank enlarge spell.
    **Heightened (4th).** Your animal companion instead becomes Huge, gaining the benefits of a 4th-rank enlarge spell.
  properties:
    kind: "focus"
    rank: 2
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "manipulate", "polymorph", "ranger"]
    focusGroup: "Advanced Warden Spells"
    range: "30 feet"
    targets: "your animal companion"
    duration: "1 minute"
- id: "entangling-flora"
  name: "Entangling Flora"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Plants and fungi burst out or quickly grow, entangling creatures. All surfaces in the area are difficult terrain. Each round that a creature starts its turn in the area, it must attempt a Reflex save. On a failure, it takes a -10-foot circumstance penalty to its Speeds until it leaves the area, and on a critical failure, it's also immobilized for 1 round. Creatures can attempt to Escape to remove these effects."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    area: "all squares in a 20-foot burst"
    duration: "1 minute"
- id: "enthrall"
  name: "Enthrall"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your words fascinate your targets. You speak or sing without interruption throughout the casting and duration. Targets who notice your speech or song might give their undivided attention; each target must attempt a Will save. The GM might grant a circumstance bonus (to a maximum of +4) if the target is of an opposing religion, ancestry, or political leaning, or is otherwise unlikely to agree with what you're saying.
    Each creature that comes within range has to attempt a save when you Sustain the spell. If you're speaking, enthrall gains the linguistic trait.
    **Critical Success.** The target is unaffected and notices that you tried to use magic.
    **Success.** The target needn't pay attention but doesn't notice you tried to use magic (it might notice others are enthralled).
    **Failure.** The target is fascinated with you. It can attempt another Will save if it witnesses actions or speech with which it disagrees. If it succeeds, it's no longer fascinated and is temporarily immune for 1 hour. If the target is subject to a hostile act, or if another creature succeeds at a Diplomacy or Intimidation check against it, the fascination ends immediately.
    **Critical Failure.** As failure, but the target can't attempt a save to end the fascination if it disagrees with you.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["auditory", "concentrate", "emotion", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    targets: "all creatures in range"
    defense: "Will"
    duration: "sustained"
- id: "environmental-endurance"
  name: "Environmental Endurance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shield the target against dangerous temperatures. Choose severe cold or heat. The target is protected from the temperature you chose (but not extreme cold or heat).
    **Heightened (3rd).** The target is protected from severe cold and severe heat.
    **Heightened (5th).** The target is protected from severe cold, severe heat, extreme cold, and extreme heat.
  properties:
    kind: "spell"
    rank: 2
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "primal"]
    castTime: "10 minutes"
    range: "touch"
    targets: "1 willing creature"
    duration: "until your next daily preparations"
- id: "ephemeral-tracking"
  name: "Ephemeral Tracking"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You can look at currents in the air and water and see tracks that you can follow just as you would on land. You can use Survival to Track through both air and water, noticing aerial or aquatic \"tracks\" of all creatures who passed nearby in the last hour. It's more difficult to Track in this way: the DC to Track through air or water is always at least 30, or higher after precipitation or wind (in the air) or heavy tides or currents (in the water). It's possible to Cover Tracks against this spell, but creatures might not realize they need to do so."
  properties:
    kind: "focus"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "manipulate", "ranger"]
    focusGroup: "Master Warden Spells"
    duration: "1 hour"
- id: "eradicate-undeath"
  name: "Eradicate Undeath"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    A massive deluge of life energy causes the undead to fall apart. Each undead creature in the area takes 4d12 vitality damage.
    **Heightened (+1).** The damage increases by 1d12.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "vitality"]
    focusGroup: "Death"
    area: "30-foot cone"
    defense: "basic Fortitude"
- id: "everlight"
  name: "Everlight"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The gemstone you touch glows, spreading bright light with a color of your choice in a 20-foot radius (and dim light for the next 20 feet). The spell ends immediately if the gemstone is broken."
  properties:
    kind: "spell"
    rank: 2
    actions: "three"
    traits: ["concentrate", "light", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "a gemstone worth 6 gp or more"
    duration: "unlimited"
- id: "evil-eye"
  name: "Evil Eye"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your patron's resentment manifests in a baleful, envious gaze. The target becomes sickened 1 if it fails a Will save (or sickened 2 on a critical failure). This condition value can't be reduced below 1 while the spell is active and you can see the target."
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cantrip", "curse", "hex", "manipulate", "witch"]
    focusGroup: "Patron Hex Cantrips"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "execute"
  name: "Execute"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You point at a creature and invoke the demise of all things. The target takes 70 void damage with a basic Fortitude save. If the target is undead or otherwise has void healing, the spell loses the death and void traits and gains the vitality trait, and the target takes 70 vitality damage with a basic Fortitude save.
    **Heightened (+1).** The damage increases by 10.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "death", "manipulate", "void"]
    traditions: ["divine", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "basic Fortitude"
- id: "fabricated-truth"
  name: "Fabricated Truth"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Choose a single statement you want the targets to believe. The fact could be narrow, such as "a dragon is circling overhead and wants to kill me"; wide-reaching, such as "all humanoids are disguised abominations"; or conceptual, such as "if I don't live a kinder life, I'll be punished in the afterlife." The targets' experiences color how they react to this "truth" and how their behavior changes. If the statement changes what they perceive, they treat the change as a sudden revelation.
    The effect of the spell depends on the targets' Will saves. If a target is already affected by fabricated truth, your spell tries to counteract it. If the counteract check fails, the outcome of the target's saving throw can't be worse than a success.
    **Critical Success.** The target doesn't believe the statement, and it knows you tried to trick it.
    **Success.** The target doesn't believe the statement or realize you tried to trick it.
    **Failure.** The target believes the statement for 1 week.
    **Critical Failure.** The target believes the statement with unlimited duration.
  properties:
    kind: "spell"
    rank: 10
    actions: "three"
    traits: ["concentrate", "incapacitation", "manipulate", "mental"]
    traditions: ["occult"]
    range: "100 feet"
    targets: "up to 5 creatures"
    defense: "Will"
    duration: "varies"
- id: "face-in-the-crowd"
  name: "Face in the Crowd"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    While in a crowd of roughly similar creatures, your appearance becomes bland and nondescript. You gain a +2 status bonus to Deception and Stealth checks to go incognito among the crowd, and you ignore difficult terrain caused by the crowd. This counts as setting up a disguise for the Impersonate use of Deception and you add your level even if you're untrained.
    **Heightened (3rd).** The spell gains a range of 10 feet and can target up to 10 creatures.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate", "visual"]
    focusGroup: "Cities"
    duration: "1 minute"
- id: "falling-stars"
  name: "Falling Stars"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You reach into the skies and call down an array of falling stars that explode upon colliding with the ground. Choose for the falling stars to be airbursts (sonic), asteroids (fire), comets (cold), or plasma (electricity). The spell gains the trait of the falling star type you chose. The four stars' central 10-foot bursts can't overlap. Each falling star deals 6d10 bludgeoning damage to each creature in the 10-foot burst at the center of its area of effect before exploding, dealing 14d6 energy damage of the type you chose to each creature in its 40-foot burst. A creature in any of the areas attempts one basic Reflex save against the spell no matter how many overlapping explosions it's caught in and can take each type of damage only once.
    **Heightened (+1).** The bludgeoning damage increases by 1d10, and the energy damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    area: "4 40-foot bursts"
    defense: "basic Reflex"
- id: "false-vision"
  name: "False Vision"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create a false image that fools any attempts to scry on an area. Any scrying spell sees, hears, smells, and otherwise detects whatever you wish within the area, rather than what is actually in the area. You can Sustain the spell each round to change the illusion as you desire, including playing out a complex scene. If the scrying spell is of a higher rank than false vision, the scryer can attempt a Perception check to disbelieve the illusion, though even if they're successful, they can't learn what's truly going on in the area."
  properties:
    kind: "spell"
    rank: 5
    traits: ["uncommon", "concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "touch"
    area: "100-foot burst"
    duration: "until your next daily preparations"
- id: "false-vitality"
  name: "False Vitality"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You augment your flesh with the energies typically used to manipulate the undead. You gain 10 temporary Hit Points.
    **Heightened (+1).** The temporary Hit Points increase by 3.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    duration: "8 hours"
- id: "fatal-aria"
  name: "Fatal Aria"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You perform music so perfect that the target may die of joy or sorrow. Once targeted, the creature becomes temporarily immune for 1 minute. The effect of the spell depends on the target's level and current Hit Points.
    16th or Lower The target dies instantly.
    17th If the target has 50 Hit Points or fewer, it dies instantly; otherwise, it drops to 0 Hit Points and becomes dying 1.
    18th or Higher The target takes 50 damage. If this brings it to 0 Hit Points, it dies instantly.
  properties:
    kind: "focus"
    rank: 10
    actions: "one"
    traits: ["uncommon", "bard", "composition", "concentrate", "death", "emotion", "focus", "mental"]
    focusGroup: "Bard Composition Spells"
    range: "30 feet"
    targets: "1 creature"
- id: "fear-spell"
  name: "Fear"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You plant fear in the target; it must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is frightened 1.
    **Failure.** The target is frightened 2.
    **Critical Failure.** The target is frightened 3 and fleeing for 1 round.
    **Heightened (3rd).** You can target up to five creatures.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "emotion", "fear", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "feet-to-fins"
  name: "Feet to Fins"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target's feet transform into fins, improving mobility in the water but reducing it on land. The target gains a swim Speed equal to its normal land Speed, but its land Speed becomes 5 feet.
    **Heightened (6th).** The spell lasts until your next daily preparations.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate", "morph"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 willing creature"
    duration: "10 minutes"
- id: "field-of-life"
  name: "Field of Life"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A field of life energy fills the area, exuding warmth and rejuvenating those within. Each living creature that starts its turn in the area regains 1d8 Hit Points, and any undead creature that starts its turn in the area takes 1d8 vitality damage.
    **Heightened (8th).** The healing and damage increase to 1d10.
    **Heightened (9th).** The healing and damage increase to 1d12.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    range: "30 feet"
    area: "20-foot burst"
    duration: "sustained up to 1 minute"
- id: "fiery-body"
  name: "Fiery Body"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You become living flame, giving you fire immunity, resistance 10 to precision damage, and weakness 5 to cold and to water. Any creature that touches you or damages you with an unarmed attack or non-reach melee weapon takes 3d6 fire damage.
    Your unarmed attacks deal an additional 1d4 fire damage, and your fire spells deal one additional die of fire damage (of the same damage die the spell uses). You can cast ignition as an innate spell; the casting is reduced from 2 actions to 1.
    In fire form, you have a fly Speed of 40 feet and don't need to breathe.
    **Heightened (9th).** Creatures touching you take 4d6 fire damage instead of 3d6, your unarmed attacks deal an additional 2d4 fire damage, and you have a fly Speed of 60 feet.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "fire", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "figment"
  name: "Figment"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create a simple illusory sound or vision. A sound adds the auditory trait to the spell and the sound can't include intelligible words or elaborate music. A vision adds the visual trait, can be no larger than a 5-foot cube, and is clearly crude and undetailed if viewed from within 15 feet. When you Cast or Sustain the Spell, you can attempt to Create a Diversion with the illusion, gaining a +2 circumstance bonus to your Deception check. If the attempt fails against a creature, that creature disbelieves the figment."
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "illusion", "manipulate", "subtle"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    duration: "sustained"
- id: "fire-ray"
  name: "Fire Ray"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    A blazing band of fire arcs through the air, lighting your opponent and the ground they stand upon on fire. Make a spell attack roll against the target's AC. The ray deals 2d6 fire damage on a hit (or double damage on a critical hit). On any result other than a critical failure, the ground in the target's space catches fire, dealing 1d6 fire damage to each creature that ends its turn in one of the squares.
    **Heightened (+1).** The ray's initial damage increases by 2d6, and the fire damage dealt by the burning space increases by 1d6.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "attack", "cleric", "concentrate", "fire", "focus", "manipulate"]
    focusGroup: "Fire"
    range: "60 feet"
    targets: "1 creature"
    defense: "AC"
    duration: "until the end of the target's next turn"
- id: "fire-shield"
  name: "Fire Shield"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a hovering shield made of fire. As long as the shield persists, its heat grants you cold resistance 5 and makes you immune to mild and severe environmental cold. You can Raise a Shield with the fire shield as a normal shield to gain a +1 circumstance bonus to AC. You can use the Shield Block reaction with the fire shield, which has Hardness 10, is immune to fire, and has 40 HP (with no Broken Threshold), and its Hardness is halved against effects that have the water trait. If you Shield Block a melee attack that is either an unarmed attack or made by an adjacent attacker, the attacker takes 2d6 fire damage.
    **Heightened (+2).** The cold resistance increases by 5, the HP increase by 10, and the fire damage increases by 1d6.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "fireball"
  name: "Fireball"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A roaring blast of fire detonates at a spot you designate, dealing 6d6 fire damage.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "500 feet"
    area: "20-foot burst"
    defense: "basic Reflex"
- id: "flame-barrier"
  name: "Flame Barrier"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You swiftly deflect incoming flames. The target gains fire resistance 15 against the triggering effect.
    **Heightened (+2).** The resistance increases by 5.
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "focus"]
    focusGroup: "Fire"
    trigger: "An effect would deal fire damage to you or an ally within range."
    range: "60 feet"
    targets: "one creature that would take fire damage from the triggering effect"
- id: "fleet-step"
  name: "Fleet Step"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You gain a +30-foot status bonus to your Speed."
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "flicker"
  name: "Flicker"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You flicker quickly between your current plane and another. You gain resistance 5 to all damage, except force. At the end of each of your turns, you automatically teleport 10 feet in a random direction, as determined by the GM. You can Sustain the spell to teleport in this way.
    **Heightened (+2).** The resistance increases by 3.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "teleportation"]
    traditions: ["arcane", "occult"]
    duration: "1 minute"
- id: "floating-flame"
  name: "Floating Flame"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a fire that burns without fuel and moves to your commands. The flame deals 3d6 fire damage to each creature in the square in which it appears, with a basic Reflex save. When you Sustain this spell, you can levitate the flame up to 10 feet. It then deals damage to each creature whose space it shared at any point during its flight. This uses the same damage and save, and you roll the damage once each time you Sustain. A given creature can take damage from floating flame only once per round.
    **Heightened (+1).** The damage increases by 1d6.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 5-foot square"
    defense: "Reflex"
    duration: "sustained up to 1 minute"
- id: "fly"
  name: "Fly"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target can soar through the air, gaining a fly Speed equal to its Speed or 20 feet, whichever is greater.
    **Heightened (7th).** The duration increases to 1 hour.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 creature"
    duration: "5 minutes"
- id: "forbidding-ward"
  name: "Forbidding Ward"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You ward an ally against the attacks and hostile spells from the target enemy. The target ally gains a +1 status bonus to Armor Class and saving throws against the target enemy's attacks, spells, and other effects.
    **Heightened (6th).** The status bonus increases to +2.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate"]
    traditions: ["divine", "occult"]
    range: "30 feet"
    targets: "1 ally and 1 enemy"
    duration: "sustained up to 1 minute"
- id: "force-barrage"
  name: "Force Barrage"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You fire a shard of solidified magic toward a creature that you can see. It automatically hits and deals 1d4+1 force damage. For each additional action you use when Casting the Spell, increase the number of shards you shoot by one, to a maximum of three shards for 3 actions. You choose the target for each shard individually. If you shoot more than one shard at the same target, combine the damage before applying bonuses or penalties to damage, resistances, weaknesses, and so forth.
    **Heightened (+2).** You fire one additional shard with each action you spend.
  properties:
    kind: "spell"
    rank: 1
    traits: ["concentrate", "force", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "1 to 3 actions"
    range: "120 feet"
    targets: "1 creature"
- id: "force-bolt"
  name: "Force Bolt"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You fire an arrow-shaped bolt of force, one of the most common and reliable forms of battle magic. It automatically hits and deals 1d4+1 force damage to the target.
    **Heightened (+2).** The damage increases by 1d4+1.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "force", "manipulate", "wizard"]
    focusGroup: "Battle Magic"
    range: "30 feet"
    targets: "1 creature"
- id: "foresight"
  name: "Foresight"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You gain a sixth sense that warns you of danger that might befall the target of the spell. If you choose a creature other than yourself as the target, you create a psychic link through which you can inform the target of danger. This link is a mental effect. Due to the amount of information this spell requires you to process, you can't have more than one foresight spell in effect at a time. Casting foresight again ends the previous foresight. While foresight is in effect, the target gains a +2 status bonus to initiative rolls and isn't off-guard against undetected creatures or when flanked. In addition, you gain the following reaction. Foresight [reaction] Trigger The target of foresight defends against a hostile creature or other danger; Effect If the hostile creature or danger forces the target to roll dice (a saving throw, for example), the target rolls twice and uses the higher result, and this spell gains the fortune trait. But if the hostile creature or danger is rolling against the target (an attack roll or skill check, for example), that hostile creature or danger rolls twice and uses the lower result, and this spell gains the misfortune trait."
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "manipulate", "mental", "prediction"]
    traditions: ["arcane", "divine", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "1 hour"
- id: "fortify-summoning"
  name: "Fortify Summoning"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "As you call a creature to your side, your magic transforms its body, heightening its ferocity and fortifying its resilience. The target gains a +1 status bonus to all checks and DCs (including its AC) for the duration of its summoning, up to 1 minute."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "wizard"]
    focusGroup: "The Boundary"
    range: "30 feet"
    targets: "1 creature you summoned"
- id: "fortissimo-composition"
  name: "Fortissimo Composition"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Muse.** maestro
    You call upon your muse to greatly increase the benefits you provide with your courageous anthem, rallying anthem, or song of strength composition. If your next action is to cast one of these compositions, attempt a Performance check. The DC is usually the highest Will DC of the composition's targets, but the GM can assign a different DC based on the circumstances. The effect of your composition depends on the result of your check.
    **Critical Success.** The status bonus from your composition increases to +3.
    **Success.** The status bonus from your composition increases to +2.
    **Failure.** Your composition provides only its normal bonus of +1, but you don't spend the Focus Point for casting this spell.
  properties:
    kind: "focus"
    rank: 4
    actions: "free"
    traits: ["uncommon", "bard", "concentrate", "focus", "spellshape"]
    focusGroup: "Bard Composition Spells"
- id: "freeze-time"
  name: "Freeze Time"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You temporarily stop time for everything but yourself, allowing you to use several actions in what appears to others to be no time at all. Immediately after casting freeze time, you can use up to 9 actions in 3 sets of up to 3 actions each. After each set of actions, 1 round passes, but for only you, effects specifically targeting or affecting you, and effects that you create during the stoppage. All other creatures and objects are invulnerable to your attacks, and you can't target or affect them with anything. Once you have finished your actions, time begins to flow again for the rest of the world. If you created an effect with a duration that extends beyond freeze time's duration, such as wall of fire, it immediately affects others again, but it doesn't have any of the effects that happen only when you first Cast the Spell."
  properties:
    kind: "spell"
    rank: 10
    actions: "three"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
- id: "frostbite"
  name: "Frostbite"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    An orb of biting cold coalesces around your target, freezing its body. The target takes 2d4 cold damage with a basic Fortitude save. On a critical failure, the target also gains weakness 1 to bludgeoning until the start of your next turn.
    **Heightened (+1).** The damage increases by 1d4 and the weakness on a critical failure increases by 1.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "cold", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "60 feet"
    targets: "1 creature"
    defense: "basic Fortitude"
- id: "gate"
  name: "Gate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You tear open a rift to another plane, creating a portal that creatures can travel through in either direction. This portal is vertical and circular, with a radius of 40 feet. The portal appears at a location of your choice on the destination plane, assuming you have a clear idea of both the destination's location on the plane and what the destination looks like. If you attempt to create a gate into or out of the realm of a deity or another similarly powerful being, that being can prevent the gate from forming."
  properties:
    kind: "spell"
    rank: 10
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate", "teleportation"]
    traditions: ["arcane", "divine", "occult"]
    range: "120 feet"
    duration: "sustained up to 1 minute"
- id: "geas"
  name: "Geas"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You enforce a magic rule on a willing target, forcing it to either perform or refrain from carrying out a certain act. A geas to perform an act is usually conditional, such as, "Always offer hospitality to strangers seeking a place to stay". An unconditional geas to perform a certain act doesn't require the target to perform that act exclusively, though it must prioritize the task above all leisurely pursuits. The most common geas to refrain from carrying out an act is a specification to avoid violating a contract. In those cases, the secondary caster usually takes charge of making sure the wording of the contract is attuned correctly with the ritual's magic. Because the target is willing, geas can have a duration that lasts for as long as the target agrees to. If the target is unable to fulfill the geas, it becomes sickened 1, and the sickened condition increases by 1 for each consecutive day it is prevented from following the geas, to a maximum of sickened 4. The sickened condition ends immediately when it follows the geas again; it can't remove the sickened condition in any other way. Only powerful magic such as a wish ritual can remove the effects of geas from a willing target.
    **Critical Success.** The geas succeeds, and the target receives a +1 status bonus to skill checks that directly uphold the geas (at the GM's discretion).
    **Success.** The geas succeeds.
    **Failure.** The geas fails.
    **Critical Failure.** The geas fails, and you are instead affected by the geas you were attempting to place on the target. You are considered an unwilling target, so the geas can be counteracted with a cleanse affliction spell.
    **Heightened (5th).** You can use geas on an unwilling creature; it can attempt a Will save to negate the effect. If the target fails this Will save, the geas lasts up to 1 week. A cleanse affliction spell can counteract a geas on an unwilling creature, in addition to powerful magic such as a wish ritual. A clever unwilling creature can subvert the geas by contriving situations that prevent it from complying, but in that case it becomes sickened (as described above).
    **Heightened (7th).** As 5th rank, but the geas lasts for up to 1 year on an unwilling creature.
    **Heightened (9th).** As 5th rank, but the geas lasts for a duration you choose (even unlimited) on an unwilling creature.
  properties:
    kind: "ritual"
    rank: 3
    traits: ["uncommon", "curse", "mental"]
    castTime: "1 day"
    secondaryCasters: "1"
    primaryCheck: "Arcana (expert), Occultism (expert), or Religion (expert)"
    secondaryChecks: "Society or Legal Lore"
    range: "10 feet"
    targets: "1 creature of a level no greater than double the geas ritual's rank"
    duration: "see text"
- id: "gecko-grip"
  name: "Gecko Grip"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Tiny clinging hairs sprout across the creature's hands and feet, offering purchase on nearly any surface. The target gains a climb Speed equal to its Speed.
    **Heightened (5th).** The duration increases to 1 hour.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "gentle-landing"
  name: "Gentle Landing"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You raise a magical updraft to arrest a fall. The target's fall slows to 60 feet per round, and the portion of the fall during the spell's duration doesn't count when calculating falling damage. If the target reaches the ground while the spell is in effect, it takes no damage from the fall. The spell ends as soon as the target lands."
  properties:
    kind: "spell"
    rank: 1
    actions: "reaction"
    traits: ["air", "concentrate"]
    traditions: ["arcane", "primal"]
    trigger: "A creature within range is falling."
    range: "60 feet"
    targets: "1 falling creature"
    duration: "1 minute"
- id: "ghostly-carrier"
  name: "Ghostly Carrier"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create a Tiny, semi-corporeal figure with a form you choose. It hovers near you for the duration. When you Cast a Spell that has a range of touch, you can have the carrier move within range, deliver the spell to a creature there, and return to you. If the carrier must attempt a spell attack roll, it uses your normal bonuses. The carrier has your AC and saves, but it is destroyed by any damage."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    duration: "1 minute"
- id: "ghostly-weapon"
  name: "Ghostly Weapon"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The target weapon becomes translucent and ghostly, and it can affect material and incorporeal creatures and objects. It gains the effects of the ghost touch property rune, meaning it is magical if it wasn't already, is especially effective against incorporeal creatures, and can be wielded by a corporeal or incorporeal creature."
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 weapon that is either unattended or wielded by you or a willing ally"
    duration: "5 minutes"
- id: "glimpse-the-truth"
  name: "Glimpse the Truth"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Divine insight lets you see things as they are, unveiled by attempts to magically cloak the truth. The GM attempts a secret counteract check against each illusion that is at least partially within the area. Instead of counteracting the illusion, you see through it (for instance, if the check succeeds against an illusory disguise spell, you see the creature's true form but illusory disguise doesn't end). Each time a new illusion comes into the aura during the duration of the spell, the GM attempts a secret counteract check for that illusion.
    **Heightened (7th).** You can allow everyone within range of the emanation to see through any illusions you succeed against, not just yourself.
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "aura", "cleric", "focus", "manipulate", "revelation"]
    focusGroup: "Truth"
    area: "30-foot emanation"
    duration: "1 round"
- id: "goblin-pox"
  name: "Goblin Pox"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your touch afflicts the target with goblin pox, an irritating allergenic rash. The target must attempt a Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is sickened 1.
    **Failure.** The target is afflicted with goblin pox at stage 1.
    **Critical Failure.** The target is afflicted with goblin pox at stage 2.
    Goblin Pox (disease) Level 1; Creatures that have the goblin trait and goblin dogs are immune; Stage 1 sickened 1 (1 round); Stage 2 sickened 1 and slowed 1 (1 round); Stage 3 sickened 1 and the creature can't reduce its sickened value below 1 (1 day)
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "disease", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 creature"
    defense: "Fortitude"
- id: "gouging-claw"
  name: "Gouging Claw"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You temporarily morph your limb into a clawed appendage. Make a melee spell attack roll against your target's AC. If you hit, you deal your choice of 2d6 slashing damage or 2d6 piercing damage, plus 2 persistent bleed damage. On a critical success, you deal double damage and double bleed damage.
    **Heightened (+1).** The damage increases by 1d6 and the persistent bleed damage increases by 1.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["attack", "cantrip", "concentrate", "manipulate", "morph"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 creature"
    defense: "AC"
- id: "gravity-weapon"
  name: "Gravity Weapon"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You build up gravitational force and funnel it into your blows, leading to more powerful attacks with blade and bow alike. On your first weapon Strike each round, you gain a status bonus to damage equal to twice the number of weapon damage dice."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "ranger"]
    focusGroup: "Initiate Warden Spells"
    duration: "1 minute"
- id: "grease"
  name: "Grease"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You conjure grease, choosing an area or target.
    - **Area.** All solid ground in the area is covered with grease. Each creature standing on the greasy surface must succeed at a Reflex save or an Acrobatics check against your spell DC or fall prone. Creatures using an action to move onto the greasy surface during the spell's duration must attempt either a Reflex save or an Acrobatics check to Balance. A creature that Steps or Crawls doesn't have to attempt a check or save.
    - **Target.** If you Cast the Spell on an unattended object, anyone trying to pick up the object must succeed at an Acrobatics check or Reflex save against your spell DC to do so. If you target an attended object, the creature that has the object must attempt an Acrobatics check or Reflex save. On a failure, the holder or wielder takes a -2 circumstance penalty to all checks that involve using the object; on a critical failure, the holder or wielder releases the item. The object lands in an adjacent square of the GM's choice. If you Cast this Spell on a worn object, the wearer gains a +2 circumstance bonus to Fortitude saves against attempts to grapple them.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    area: "4 contiguous 5-foot squares or"
    targets: "1 object of 1 Bulk or less"
    duration: "1 minute"
- id: "grim-tendrils"
  name: "Grim Tendrils"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Tendrils of darkness curl out from your fingertips and race through the air. You deal 2d4 void damage and 1 persistent bleed damage to living creatures in the line. Each living creature in the line must attempt a Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half the void damage and no persistent bleed damage.
    **Failure.** The creature takes full damage.
    **Critical Failure.** The creature takes double void damage and double persistent bleed damage.
    **Heightened (+1).** The void damage increases by 2d4, and the persistent bleed damage increases by 1.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate", "void"]
    traditions: ["arcane", "occult"]
    area: "30-foot line"
    defense: "Fortitude"
- id: "guidance"
  name: "Guidance"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You ask for the guidance of supernatural entities, granting the target a +1 status bonus to one attack roll, Perception check, saving throw, or skill check the target attempts before the duration ends. The target chooses which roll to use the bonus on before rolling. If the target uses the bonus, the spell ends. Either way, the target is then temporarily immune for 1 hour."
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["cantrip", "concentrate"]
    traditions: ["divine", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    duration: "until the start of your next turn"
- id: "gust-of-wind"
  name: "Gust of Wind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A violent wind issues forth from your palm, blowing from the point where you are when you Cast the Spell to the line's opposite end. The wind extinguishes small non-magical fires, disperses fog and mist, blows objects of light Bulk or less around, and pushes larger objects. Large or smaller creatures in the area must attempt a Fortitude save. Large or smaller creatures that later move into the gust must attempt the save on entering.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature can't move against the wind.
    **Failure.** The creature is knocked prone. If it was flying, it takes the effects of critical failure instead.
    **Critical Failure.** The creature is pushed 30 feet in the wind's direction, knocked prone, and takes 2d6 bludgeoning damage.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["air", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    area: "60-foot line"
    defense: "Fortitude"
    duration: "until the start of your next turn"
- id: "hallucination"
  name: "Hallucination"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target consistently detects one thing as another, can't detect something that's there, or detects something that's not there, though it doesn't alter their beliefs. You choose which of these effects applies, and you determine the specifics of the hallucination. For example, you could make the target see all elves as humans, be unable to detect the presence of their brother, see their beloved good luck charm on their person even when it isn't, or see a tower in the center of town.
    The target can attempt an initial Will save, with effects below. They also receive a Will save to disbelieve the hallucination every time they Seek or directly interact with the hallucination. For example, the target could attempt to disbelieve the hallucination each time they interacted with an elf, bumped into their brother accidentally, tried to check their charm, or studied the tower. The target can attempt to disbelieve with a large circumstance bonus in situations determined by the GM, such as if the target attempted to climb the nonexistent tower.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature perceives what you chose until it disbelieves, but it knows what the hallucination is.
    **Failure.** The creature perceives what you chose until it disbelieves.
    **Critical Failure.** The creature perceives what you chose until it disbelieves, and it trusts its false senses, taking a -4 circumstance penalty to saves to disbelieve.
    **Heightened (6th).** Choose to either target up to 10 creatures or change the spell's duration to until your next daily preparations.
    **Heightened (8th).** Choose to either target any number of creatures or change the spell's duration to unlimited.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["illusion", "incapacitation", "manipulate", "mental", "subtle"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    duration: "1 hour"
- id: "hand-of-the-apprentice"
  name: "Hand of the Apprentice"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You take advantage of one of the most fundamental lessons of magic to levitate and propel your weapon. You hurl a held melee weapon with which you are trained at the target, making a spell attack roll. On a success, you deal the weapon's damage as if you had hit with a melee Strike, but add your spellcasting attribute modifier to damage, rather than your Strength modifier. On a critical success, you deal double damage, and you add the weapon's critical specialization effect. Regardless of the outcome, the weapon flies back to you and returns to your hand."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "attack", "focus", "manipulate", "wizard"]
    focusGroup: "Unified Magical Theory"
    range: "500 feet"
    targets: "1 creature"
    defense: "AC"
- id: "harm"
  name: "Harm"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You channel void energy to harm the living or heal the undead. If the target is a living creature, you deal 1d8 void damage to it, and it gets a basic Fortitude save. If the target is a willing undead creature, you restore that amount of Hit Points. The number of actions you spend when Casting this Spell determines its targets, range, area, and other parameters.
    [1 action] The spell has a range of touch.
    [2 actions] (concentrate) The spell has a range of 30 feet. If you're healing an undead creature, increase the Hit Points restored by 8.
    [3 actions] (concentrate) You disperse void energy in a 30-foot emanation. This targets all living and undead creatures in the area.
    **Heightened (+1).** The amount of healing or damage increases by 1d8, and the extra healing for the 2-action version increases by 8.
  properties:
    kind: "spell"
    rank: 1
    traits: ["manipulate", "void"]
    traditions: ["divine"]
    castTime: "1 to 3 actions"
    range: "varies"
    targets: "1 living creature or 1 willing undead creature"
- id: "haste"
  name: "Haste"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Magic empowers the target to act faster. It gains the quickened condition and can use the extra action each round for only Strike and Stride actions.
    **Heightened (7th).** You can target up to 6 creatures.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    duration: "1 minute"
- id: "heal"
  name: "Heal"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You channel vital energy to heal the living or damage the undead. If the target is a willing living creature, you restore 1d8 Hit Points. If the target is undead, you deal that amount of vitality damage to it, and it gets a basic Fortitude save. The number of actions you spend when Casting this Spell determines its targets, range, area, and other parameters.
    [1 action] The spell has a range of touch.
    [2 actions] (concentrate) The spell has a range of 30 feet. If you're healing a living creature, increase the Hit Points restored by 8.
    [3 actions] (concentrate) You disperse vital energy in a 30-foot emanation. This targets all living and undead creatures in the burst.
    **Heightened (+1).** The amount of healing or damage increases by 1d8, and the extra healing for the 2-action version increases by 8.
  properties:
    kind: "spell"
    rank: 1
    traits: ["healing", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    castTime: "1 to 3 actions"
    range: "varies"
    targets: "1 willing living creature or 1 undead creature"
- id: "heal-animal"
  name: "Heal Animal"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You heal an animal's wounds, restoring 1d8 Hit Points to the target. The number of actions spent Casting this Spell determines its effect.
    [1 action] The spell has a range of touch.
    [2 actions] (concentrate) The spell has a range of 30 feet and restores an additional 8 Hit Points to the target.
    **Heightened (+1).** The amount of healing increases by 1d8, and the additional healing for the 2-action version increases by 8.
  properties:
    kind: "focus"
    rank: 1
    traits: ["uncommon", "druid", "focus", "healing", "manipulate", "vitality"]
    focusGroup: "Animal Order"
    castTime: "1 to 2 actions"
    range: "touch or 30 feet (see text)"
    targets: "1 willing living animal"
- id: "heal-companion"
  name: "Heal Companion"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You heal your animal companion's wounds. You restore 1d10 Hit Points to your animal companion. The number of actions you spend Casting this Spell determines range and other parameters.
    [1 action] (manipulate) The spell has a range of touch.
    [2 actions] (concentrate, manipulate) The spell has a range of 30 feet and restores an additional 8 Hit Points to the target.
    **Heightened (+1).** The amount of healing increases by 1d10, and the additional healing for the 2-action version increases by 8.
  properties:
    kind: "focus"
    rank: 1
    traits: ["uncommon", "focus", "healing", "ranger", "vitality"]
    focusGroup: "Initiate Warden Spells"
    castTime: "1 or 2 actions"
    range: "touch or 30 feet"
    targets: "your animal companion"
- id: "healer-s-blessing"
  name: "Healer's Blessing"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your words bless a creature with an enhanced connection to vital energy. When the target regains Hit Points from a healing vitality spell, it regains 2 additional Hit Points.
    The target regains additional Hit Points from healer's blessing only the first time it regains HP from a given healing spell, so a spell that heals the creature repeatedly over a duration would restore additional Hit Points only once, when they are first healed.
    **Heightened (+1).** The additional healing increases by 2 HP.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "concentrate", "focus"]
    focusGroup: "Healing"
    range: "30 feet"
    targets: "1 willing living creature"
    duration: "1 minute"
- id: "heroism"
  name: "Heroism"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You unlock the target's inner heroism, granting it a +1 status bonus to attack rolls, Perception checks, saving throws, and skill checks.
    **Heightened (6th).** The status bonus increases to +2.
    **Heightened (9th).** The status bonus increases to +3.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "hidden-mind"
  name: "Hidden Mind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Powerful wards hide a creature from magic that would spy on it or affect its mind. The target gains a +4 status bonus to saves against mental effects. Hidden mind attempts to counteract any detection, revelation, and scrying effects as if its spell rank were 1 higher than its actual rank. On a success, the effect functions normally except that it detects nothing about the target and its possessions. For instance, detect magic would still detect other magic in the area, but not any magic on the target."
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    duration: "until your next daily preparations"
- id: "holy-light"
  name: "Holy Light"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shine a blazing ray of light tinged with holy energy. Make a ranged spell attack. The ray deals 5d6 fire damage. If the target has the unholy trait, you deal an extra 5d6 spirit damage.
    **Critical Success.** The target takes double damage.
    **Success.** The target takes full damage. If the light passes through an area of magical darkness or targets a creature affected by magical darkness, holy light attempts to counteract the darkness. If you need to determine whether the light passes through an area of darkness, draw a line between yourself and the spell's target.
    **Heightened (+1).** The fire damage increases by 2d6, and the spirit damage against unholy creatures increases by 2d6.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["attack", "concentrate", "fire", "holy", "light", "manipulate"]
    traditions: ["divine", "primal"]
    range: "120 feet"
    targets: "1 creature"
    defense: "AC"
- id: "honeyed-words"
  name: "Honeyed Words"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Falsehoods pass your lips as smoothly as silk. You gain a +4 status bonus to Deception checks to Lie and against Perception checks to discern if you are telling the truth, and you add your level even if untrained. If the implausibility of your lies prompts a circumstance penalty or a DC increase, reduce that penalty by half or increase it by half."
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["occult"]
    duration: "10 minutes"
- id: "house-of-imaginary-walls"
  name: "House of Imaginary Walls"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You mime an invisible 10-foot-by-10-foot wall adjacent to you and within your reach. The wall is solid to those creatures that don't disbelieve it, even incorporeal creatures. You and your allies can voluntarily believe the wall exists to continue to treat it as solid, for instance to climb onto it. A creature that disbelieves the illusion is temporarily immune to your house of imaginary walls for 1 minute. The wall doesn't block creatures that didn't see your visual performance, nor does it block objects. The wall has AC 10, Hardness equal to double the spell's rank, and HP equal to quadruple the spell's rank."
  properties:
    kind: "cantrip"
    rank: 5
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "illusion", "manipulate", "visual"]
    focusGroup: "Bard Composition Spells"
    range: "touch"
    duration: "1 round"
- id: "howling-blizzard"
  name: "Howling Blizzard"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Freezing winds extend from your hands, pushing away from you with great force. If you Cast this Spell with 2 actions, it has an area of a 60-foot cone; if you Cast this Spell with 3 actions, it has a range of 500 feet and an area of a 30-foot burst. Each creature in the area takes 10d6 cold damage with a basic Reflex save. Snowdrifts and icy gales fill the area until the start of your next turn, making the area difficult terrain.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 5
    traits: ["air", "cold", "concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    castTime: "2 to 3 actions"
    area: "varies"
    defense: "basic Reflex"
- id: "humanoid-form"
  name: "Humanoid Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transform your appearance to that of a Small or Medium humanoid, such as a dwarf, elf, goblin, halfling, human, or orc. You gain the humanoid trait in addition to your other traits while in this form, as well as any trait related to the creature's kind (such as goblin or human). If this transformation reduces your size, it reduces your reach accordingly (typically to 5 feet). This transformation doesn't change your statistics in any way, and you don't gain any special abilities of the humanoid form you assume. You can still wear and use your gear, which changes size (if necessary) to match your new form. If items leave your person, they return to their usual size.
    Humanoid form grants you a +4 status bonus to Deception checks to pass as a generic member of the chosen ancestry, and you add your level even if you're untrained, but you can't make yourself look like a specific person. If you want to Impersonate an individual, you still need to create a disguise, though the GM won't factor in the difference in ancestry when determining the DC of your Deception check. You can Dismiss this spell.
    **Heightened (3rd).** You gain darkvision or low-light vision if the form you assume has that ability.
    **Heightened (5th).** You can take on the appearance of a Large humanoid. If this increases your size, you gain the effects of the enlarge spell.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
