- id: "hunter-s-vision"
  name: "Hunter's Vision"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your target glows with a magical aura visible only to you and those who follow your lead. Your target is visible to you and others sharing your Hunt Prey benefits even if it wouldn't normally be due to lighting or the concealed or invisible conditions, though cover from opaque objects still blocks your sight. You ignore the flat check against the target due to the concealed condition, and the target isn't automatically hidden from you due to darkness or being invisible."
  properties:
    kind: "focus"
    rank: 5
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "ranger"]
    focusGroup: "Peerless Warden Spells"
    range: "30 feet"
    targets: "1 hunted prey"
    duration: "10 minutes"
- id: "hurtling-stone"
  name: "Hurtling Stone"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You evoke a magical stone and throw it, with divine guide to your aim. The stone deals 2d6 bludgeoning damage depending on your spell attack roll against the target's AC.
    **Critical Success.** The target takes double damage and you can push it up to 10 feet.
    **Success.** The target takes full damage and you can push it up to 5 feet.
    **Heightened (+1).** The stone's damage increases by 1d6.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "attack", "cleric", "earth", "focus", "manipulate"]
    focusGroup: "Earth"
    range: "60 feet"
    targets: "1 creature"
    defense: "AC"
- id: "hydraulic-push"
  name: "Hydraulic Push"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You call forth a powerful blast of pressurized water that bludgeons the target and knocks it back. Make a ranged spell attack roll.
    **Critical Success.** The target takes 6d6 bludgeoning damage and is knocked back 10 feet.
    **Success.** The target takes 3d6 bludgeoning damage and is knocked back 5 feet.
    **Heightened (+1).** The bludgeoning damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["attack", "concentrate", "manipulate", "water"]
    traditions: ["arcane", "primal"]
    range: "60 feet"
    targets: "1 creature or unattended object"
    defense: "AC"
- id: "hydraulic-torrent"
  name: "Hydraulic Torrent"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A swirling torrent of water manifests along a straight line, battering creatures and unattended objects in its path and possibly pushing them away from you. The torrent deals 8d6 bludgeoning damage. Each creature in the area must attempt a basic Fortitude save; unattended objects automatically fail. Creatures and objects that fail are also knocked back 5 feet (10 feet on a critical failure).
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["primal"]
    area: "60-foot line"
    defense: "Fortitude"
- id: "hymn-of-healing"
  name: "Hymn of Healing"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your glorious singing mends wounds and provides a temporary respite from harm. The target gains fast healing 2. When you Cast the Spell and the first time each round you Sustain the Spell, the target gains 2 temporary Hit Points, which last for 1 round.
    **Heightened (+1).** The fast healing and temporary Hit Points each increase by 2.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "bard", "composition", "concentrate", "focus", "healing", "vitality"]
    focusGroup: "Bard Composition Spells"
    range: "30 feet"
    targets: "you or 1 ally"
    duration: "sustained up to 4 rounds"
- id: "hypercognition"
  name: "Hypercognition"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You rapidly catalog and collate information relevant to your current situation. You can instantly use up to 6 Recall Knowledge actions as part of Casting this Spell. For these actions, you can't use any special abilities, reactions, or free actions that trigger when you Recall Knowledge."
  properties:
    kind: "spell"
    rank: 3
    actions: "one"
    traits: ["concentrate"]
    traditions: ["occult"]
- id: "hypnotize"
  name: "Hypnotize"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a cloud of mesmerizing patterns and colors that hovers in the air. Creatures are dazzled while inside the cloud. In addition, a creature must attempt a Will saving throw if it is inside the cloud when you cast it, when it enters the cloud, when it ends its turn within the cloud, or if it uses a Seek or Interact action on the cloud. A creature currently fascinated by hypnotize doesn't attempt new saves.
    **Success.** The target is unaffected.
    **Failure.** The target is fascinated by the cloud.
    **Critical Failure.** The target is fascinated by the cloud. While it remains fascinated, it can't use reactions.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["illusion", "manipulate", "subtle", "visual"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    area: "10-foot burst"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "ignite-ambition"
  name: "Ignite Ambition"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You strengthen the target's ambition, increase its resentment of its allies, and make its allegiances more susceptible to change. It must attempt a Will save.
    **Critical Success.** The target is unaffected and realized you attempted to influence its reaction with magic.
    **Success.** The target takes a -1 status penalty to its defenses against the triggering effect. This penalty is -2 if the target is being encouraged to advance its own ambitions. The target doesn't realize you Cast the Spell on it.
    **Failure.** As success, but the status penalty is -4 if the target is being encouraged to advance its own ambitions.
    **Critical Failure.** As success, but the creature automatically follows a suggestion that advances its own ambitions.
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "emotion", "focus", "mental", "subtle"]
    focusGroup: "Ambition"
    trigger: "You or an ally in range attempt to use a mental effect to convince a creature to do something (such as a Coerce, Request, or a suggestion spell)."
    range: "60 feet"
    targets: "one creature being influenced"
    defense: "Will"
- id: "ignition"
  name: "Ignition"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You snap your fingers and point at a target, which begins to smolder. Make a spell attack roll against the target's AC, dealing 2d4 fire damage on a hit. If the target is within your melee reach, you can choose to make a melee spell attack with the flame instead of a ranged spell attack, which increases all the spell's damage dice to d6s.
    **Critical Success.** The target takes double damage and 1d4 persistent fire damage.
    **Success.** The target takes full damage.
    **Heightened (+1).** The initial damage increases by 1d4 and the persistent fire damage on a critical hit increases by 1d4.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["attack", "cantrip", "concentrate", "fire", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "AC"
- id: "ill-omen"
  name: "Ill Omen"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target is struck with misfortune, which throws it off balance. The target must attempt a Will save.
    **Success.** The target is unaffected.
    **Failure.** The first time during the duration that the target attempts an attack roll or skill check, it must roll twice and use the worse result.
    **Critical Failure.** Every time during the duration that the target attempts an attack roll or skill check, it must roll twice and use the worse result.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "curse", "manipulate", "misfortune"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 round"
- id: "illusory-creature"
  name: "Illusory Creature"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an illusory image of a Large or smaller creature. It generates the appropriate sounds, smells, and feels believable to the touch. If you and the image are ever farther than 500 feet apart, the spell ends.
    The image can't speak, but you can use your actions to speak through the creature, with the spell disguising your voice as appropriate. You might need to attempt a Deception or Performance check to mimic the creature, as determined by the GM. This is especially likely if you're trying to imitate a specific person and engage with someone that person knows. In combat, the illusion can use 2 actions per turn, which it uses when you Sustain the spell. It uses your spell attack modifier for attack rolls and your spell DC for its AC. Its saving throw modifiers are equal to your spell DC - 10. It is substantial enough that it can flank other creatures. If the image is hit by an attack or fails a save, the spell ends.
    The illusion can cause damage by making the target believe the illusion's attacks are real, but it cannot otherwise directly affect the physical world. If the illusory creature hits with a Strike, the target takes 3d4 mental damage. The illusion's Strikes are nonlethal. If the damage doesn't correspond to the image of the monster—for example, if an illusory Large dragon deals only 5 damage—the GM might allow the target to attempt an immediate Perception check to disbelieve the spell. Any relevant resistances and weaknesses apply if the target thinks they do, as judged by the GM. For example, if the illusion wields a warhammer and attacks a creature resistant to bludgeoning damage, the creature would take less mental damage. However, illusory damage does not deactivate regeneration or trigger other effects that require a certain damage type. The GM should track illusory damage dealt by the illusion.
    Any creature that touches the image or uses the Seek action to examine it can attempt to disbelieve your illusion. When a creature disbelieves the illusion, it recovers from half the damage it had taken from it (if any) and doesn't take any further damage from it.
    **Heightened (+1).** The damage of the image's Strikes increases by 1d4, and the maximum size of creature you can create increases by one (to a maximum of Gargantuan).
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["auditory", "concentrate", "illusion", "manipulate", "olfactory", "visual"]
    traditions: ["arcane", "occult"]
    range: "500 feet"
    duration: "sustained"
- id: "illusory-disguise"
  name: "Illusory Disguise"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an illusion that causes the target to appear as another creature of the same body shape, and with roughly similar height (within 6 inches) and weight (within 50 pounds). The disguise is typically good enough to hide their identity, but not to impersonate a specific individual. The spell changes their appearance and voice, but not mannerisms. You can change the appearance of its clothing and worn items, such as making its armor look like a dress. Held items are unaffected, and any worn item removed from the creature returns to its true appearance. Casting illusory disguise counts as setting up a disguise for the Impersonate use of Deception; it ignores any circumstance penalties the target might take for disguising itself as a dissimilar creature, gives a +4 status bonus to Deception checks to prevent others from seeing through the disguise, and lets the target add its level to such Deception checks even if untrained. You can Dismiss this spell.
    **Heightened (3rd).** The target can appear as any creature of the same size, even a specific individual. You must have seen an individual to replicate its appearance, and must have heard its voice to replicate its voice.
    **Heightened (4th).** You can target up to 10 willing creatures. If you target multiple creatures, you can choose a different disguise for each target, but none can impersonate a specific individual. You can Dismiss each disguise individually or all collectively.
    **Heightened (7th).** As 4th, but you can choose disguises that impersonate specific individuals. You must have seen an individual to replicate its appearance, and must have heard its voice to replicate its voice.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "visual"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 willing creature"
    duration: "1 hour"
- id: "illusory-object"
  name: "Illusory Object"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an illusory visual image of a stationary object. The entire image must fit within the spell's area. The object appears to animate naturally, but it doesn't make sounds or generate smells. For example, water would appear to pour down an illusory waterfall, but it would be silent.
    Any creature that touches the image or uses the Seek action to examine it can attempt to disbelieve your illusion.
    **Heightened (2nd).** Your image makes appropriate sounds, generates normal smells, and feels right to the touch. The spell gains the auditory and olfactory traits. The duration increases to 1 hour.
    **Heightened (5th).** As the 2nd-rank version, but the duration is unlimited.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "visual"]
    traditions: ["arcane", "occult"]
    range: "500 feet"
    area: "20-foot burst"
    duration: "10 minutes"
- id: "illusory-scene"
  name: "Illusory Scene"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You craft an imaginary scene that includes up to 10 discrete creatures or objects of various sizes, all of which must be within the spell's area. These elements generate appropriate sounds and smells, and they feel right to the touch. Elements of an illusory scene are incapable of speech. Unlike with the illusory creature spell, creatures in your scene lack combat abilities and statistics. Your scene doesn't include changes to the environment around it, though you can place your scene within the illusory environment of a mirage spell.
    When you create the scene, you can choose to have it be static or follow a program. Though a static scene is stationary, it includes basic natural movement. For example, wind blowing on an illusory piece of paper would rustle it. A program can be up to 1 minute long and repeats when finished. For instance, you could create a scene of two orcs fighting each other, and the fight would go the same way for each repetition. If you create a loop, the two fighters end up in the same place at the start of the scene and at the end of it, but you can smooth the program so it's hard to tell when the loop ends and begins. Anyone observing the scene for more than a few minutes almost always notices it looping. You're unable to alter the program after you create the illusion.
    Any creature that touches any part of the image or uses the Seek action to examine it can attempt to disbelieve your illusion. If they interact with a portion of the illusion, they disbelieve only that portion. They disbelieve the entire scene only on a critical success.
    **Heightened (6th).** Creatures or objects in your scene can speak. You must speak the specific lines for each actor when creating your program. The spell disguises your voice for each actor.
    **Heightened (8th).** As the 6th-rank version, and the duration is unlimited.
  properties:
    kind: "spell"
    rank: 5
    traits: ["auditory", "concentrate", "illusion", "manipulate", "olfactory", "visual"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "500 feet"
    area: "30-foot burst"
    duration: "1 hour"
- id: "impaling-briars"
  name: "Impaling Briars"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    The ground within the area transforms into a mass of dangerous briars that assault and impede your foes. When you Cast the Spell and the first time you Sustain it each turn on subsequent rounds, select one of the following effects to occur in the area.
    - **Ensnare.** The briars clump around your foes, attempting to hold them in place. A foe within the area (or flying at most 20 feet above the area) must attempt a Reflex save. On a failure, it takes a -10-foot circumstance penalty to all Speeds for 1 round, and on a critical failure, it is immobilized for 1 round unless it Escapes.
    - **Impede.** The briars twist and writhe, making the entire area difficult terrain.
    - **Wall.** A wall of thorns appears in the area, lasting for 1 round. The wall is greater difficult terrain instead of difficult terrain.
    In addition, once per round you can direct the briars to impale any target in the area (or flying up to 20 feet above the area) that you can see by using a single action, which has the concentrate and manipulate traits. Make a spell attack roll. On a success, the target takes 10d6 piercing damage and takes a -10-foot circumstance penalty to all Speeds for 1 round; on a critical success, the target is immobilized for 1 round unless it Escapes.
  properties:
    kind: "focus"
    rank: 8
    actions: "three"
    traits: ["uncommon", "concentrate", "druid", "focus", "manipulate", "plant", "wood"]
    focusGroup: "Leaf Order"
    area: "ground within a 100-foot emanation"
    duration: "sustained up to 1 minute"
- id: "impaling-spike"
  name: "Impaling Spike"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You conjure a spike that thrusts up from the earth beneath a target creature, potentially impaling it. The spike is made of cold iron and deals 8d6 piercing damage. The target must attempt a Reflex save.
    **Critical Success.** The target dodges the spike and is unaffected.
    **Success.** The target is struck by the spike and takes half damage.
    **Failure.** The target is impaled through a leg or another nonvital body part. The creature takes full damage and, if it's standing on solid ground, becomes immobilized. It can attempt to Escape (the DC is your spell DC). While it remains impaled, it takes damage from any weakness to cold iron it has at the end of each of its turns.
    **Critical Failure.** As failure, but the creature is impaled through a vital organ or its center of mass, taking double damage, and it is off-guard as long as it's impaled.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "metal"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Reflex"
    duration: "1 minute"
- id: "implosion"
  name: "Implosion"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You crush the target by causing it to collapse in on itself, dealing 75 damage. The first time each round you Sustain the spell, you must choose a new target to be subject to the same effect; the same creature can never be targeted more than once with a single casting of this spell. You also can't affect more than one creature per turn with implosion. You can't target a creature that's incorporeal, gaseous, or liquid, or otherwise lacking a solid form.
    **Heightened (+1).** The damage increases by 10.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 corporeal creature"
    defense: "basic Fortitude"
    duration: "sustained up to 1 minute"
- id: "indestructibility"
  name: "Indestructibility"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You sever yourself from cause and effect. For the duration of the spell, you are immune to any effect or damage that would harm you, excluding effects caused by artifacts, deific power, and similarly powerful sources. You can selectively allow yourself to be affected by anything you're willing to have affect you."
  properties:
    kind: "spell"
    rank: 10
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "until the start of your next turn"
- id: "infuse-vitality"
  name: "Infuse Vitality"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You empower attacks with vital energy. The number of targets is equal to the number of actions you spent casting this spell. Each target's unarmed and weapon Strikes deal an extra 1d4 vitality damage. (This damage typically damages only undead.) If you have the holy trait, you can add that trait to this spell and to the Strikes affected by the spell.
    **Heightened (3rd).** The damage increases to 2d4 damage.
    **Heightened (5th).** The damage increases to 3d4 damage.
  properties:
    kind: "spell"
    rank: 1
    traits: ["concentrate", "manipulate", "vitality"]
    traditions: ["divine"]
    castTime: "1 to 3 actions"
    range: "30 feet"
    targets: "1 to 3 willing creatures"
    duration: "1 minute"
- id: "insect-form"
  name: "Insect Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You envision a simple bug and transform into a Medium animal battle form. When you Cast this Spell, choose a listed battle form. You can decide the specific type of animal (such as a ladybug or scarab for beetle), but this has no effect on the form's Size or statistics. While in this form, you gain the animal trait. You can Dismiss this spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 18 + your level. Ignore your armor's check penalty and Speed reduction.
    • 10 temporary Hit Points.
    • Low-light vision.
    • One or more attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +13, and your damage bonus is +2. These attacks are Strength based (for the purpose of the enfeebled condition). If your unarmed attack modifier is higher, you can use it instead.
    • Athletics modifier of +13, unless your own is higher.
    You gain specific abilities based on the form you choose:
    - **Ant.** Speed 30 feet, climb 30 feet; Melee [1 action] mandibles, Damage 2d6 bludgeoning.
    - **Beetle.** Speed 25 feet; Melee [1 action] mandibles, Damage 2d10 bludgeoning.
    - **Centipede.** Speed 25 feet, climb 25 feet; darkvision; Melee [1 action] mandibles, Damage 1d8 piercing plus 1d4 persistent poison.
    - **Mantis.** Speed 40 feet; imprecise scent 30 feet; Melee [1 action] foreleg, Damage 2d8 piercing.
    - **Scorpion.** Speed 40 feet; darkvision, imprecise tremorsense 60 feet; Melee [1 action] stinger, Damage 1d8 piercing plus 1d4 persistent poison; Melee [1 action] pincer (agile), Damage 1d6 bludgeoning.
    - **Spider.** Speed 25 feet, climb 25 feet; darkvision; Melee [1 action] fangs, Damage 1d6 piercing plus 1d4 persistent poison; Ranged [1 action] web (range increment 20 feet), Damage immobilizes the target for 1 round or until it Escapes.
    **Heightened (4th).** Your battle form is Large, and your attacks have 10-foot reach. You instead gain 15 temporary HP, attack modifier +16, damage bonus +6, and Athletics +16.
    **Heightened (5th).** Your battle form is Huge, and your attacks have 15-foot reach. You instead gain 20 temporary HP, attack modifier +18, damage bonus +2 and double damage dice (including persistent damage), and Athletics +20.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "interdisciplinary-incantation"
  name: "Interdisciplinary Incantation"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You gather the embers of another caster's spell, using your understanding of unified magic to pick apart their formulas and incantations well enough to imitate the spell yourself, if only for a short time. Until the end of your next turn, you can Cast the triggering Spell by expending a wizard spell slot of the same rank. That caster's spells can't trigger your interdisciplinary incantation again for 24 hours."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "concentrate", "focus", "wizard"]
    focusGroup: "Unified Magical Theory"
    trigger: "A creature within 30 feet casts an arcane spell."
- id: "interplanar-teleport"
  name: "Interplanar Teleport"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You and your allies traverse the barriers between planes of existence. The targets move to another plane. You must know the destination plane exists and use a magic planar key created from material from that plane as a locus for the spell. While the planar keys for most prominent planes are uncommon, just like the spell interplanar teleport, more obscure planes and demiplanes often have rare or possibly even unique planar keys. The spell is highly imprecise, and you appear 1d20×25 miles from the last place one of the targets (of your choice) was located the last time that target traveled to the plane. If it's the first time traveling to a particular plane for all targets, you appear at a random location on the plane. Interplanar teleport doesn't provide a means of return travel, though casting interplanar teleport again allows you to return to your previous plane unless there are extenuating circumstances."
  properties:
    kind: "spell"
    rank: 7
    traits: ["uncommon", "concentrate", "manipulate", "teleportation"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "10 minutes"
    requirements: "You have a planar key for the destination plane, used as a locus"
    range: "5 feet"
    targets: "up to 8 willing creatures"
- id: "invisibility"
  name: "Invisibility"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Illusions bend light around the target, rendering it invisible. This makes it undetected to all creatures, though the creatures can attempt to find the target, making it hidden to them instead. If the target uses a hostile action, the spell ends after that hostile action is completed.
    **Heightened (4th).** The spell lasts 1 minute, but it doesn't end if the target uses a hostile action.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["illusion", "manipulate", "subtle"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "invisibility-cloak"
  name: "Invisibility Cloak"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You become invisible, with the same restrictions as the 2nd-rank invisibility spell.
    **Heightened (6th).** The duration increases to 10 minutes.
    **Heightened (8th).** The duration increases to 1 hour.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "focus", "illusion", "manipulate", "wizard"]
    focusGroup: "Mentalism"
    duration: "1 minute"
- id: "invoke-spirits"
  name: "Invoke Spirits"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Ragged apparitions of the dead rise to stalk the living. They deal 2d4 mental damage and 2d4 void damage to each living creature in the area, with a basic Will save. Additionally, creatures that critically fail the save are frightened 2 and are fleeing for 1 round. On subsequent rounds, the first time you Sustain the spell each round, you can move the area up to 30 feet within the range of the spell. Living creatures in the new area must attempt saves with the same effects as above, except that critically failing doesn't make them flee.
    **Heightened (+2).** The mental damage and void damage each increase by 1d4.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "emotion", "fear", "manipulate", "mental", "void"]
    traditions: ["arcane", "divine", "occult"]
    range: "120 feet"
    area: "10-foot burst"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "item-facade"
  name: "Item Facade"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You make the target object look and feel as though it were in much better or worse physical condition. When you Cast this Spell, decide whether you want to make the object look decrepit or perfect. An item made to look decrepit appears broken and shoddy. An intact item made to look better appears as though it's brand new and highly polished or well maintained. A broken item appears to be intact and functional. Destroyed items can't be affected by this spell. A creature that Interacts with the item can attempt to disbelieve the illusion.
    **Heightened (2nd).** The duration is 24 hours.
    **Heightened (3rd).** The duration is unlimited.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "visual"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 object no more than 10 feet by 10 feet by 10 feet"
    duration: "1 hour"
- id: "jump"
  name: "Jump"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your legs surge with strength, ready to leap high and far. You jump 30 feet in any direction without touching the ground. You must land on a space of solid ground within 30 feet of you, or else you fall after using your next action.
    **Heightened (3rd).** The range becomes touch, the target changes to one touched creature, and the duration becomes 1 minute, allowing the target to jump as described whenever it takes the Leap action.
  properties:
    kind: "spell"
    rank: 1
    actions: "one"
    traits: ["manipulate", "move"]
    traditions: ["arcane", "primal"]
- id: "knock"
  name: "Knock"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You make the target easier to open. Knock grants a +4 status bonus to any creature that tries to open the target door, lock, or container with an Athletics or a Thievery check. You can attempt a Thievery check to open the target as part of casting knock, and you add your level even if you're untrained.
    Knock counteracts lock.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 door, lock, or container"
    duration: "1 minute"
- id: "know-the-enemy"
  name: "Know the Enemy"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You quickly remind yourself of useful information. Use a Recall Knowledge action, rolling the appropriate skill check to identify the triggering creature's abilities. You can roll your check twice and use the better result."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "focus", "fortune", "manipulate"]
    focusGroup: "Knowledge"
    trigger: "You roll initiative and can see a creature, you succeed at an attack roll against a creature, or a creature fails a saving throw against one of your spells."
- id: "know-the-way"
  name: "Know the Way"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    In your mind's eye, you magically reorient yourself. You immediately know which direction is north (if it exists at your current location), and you can choose a location you were at within the last 24 hours and learn what direction it lies.
    **Heightened (3rd).** You can choose a location you were at within the last week.
    **Heightened (7th).** You can choose a location you were at regardless of how long ago you were there.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "detection", "manipulate"]
    traditions: ["divine", "occult", "primal"]
- id: "laughing-fit"
  name: "Laughing Fit"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target is overtaken with uncontrollable laughter. It must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is plagued with uncontrollable laugher. It can't use reactions.
    **Failure.** The target is slowed 1 and can't use reactions.
    **Critical Failure.** The target falls prone and can't use actions or reactions for 1 round. It then takes the effects of a failure.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "emotion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 living creature"
    defense: "Will"
    duration: "sustained"
- id: "levitate"
  name: "Levitate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You defy gravity and levitate the target 5 feet off the ground. You can Sustain the spell to move the target up or down 10 feet. A creature floating in the air from levitate takes a -2 circumstance penalty to attack rolls. A floating creature can spend an Interact action to stabilize itself and negate this penalty for the remainder of its turn. If the target is adjacent to a fixed object or terrain of suitable stability, it can move across the surface by climbing (if the surface is vertical, like a wall) or crawling (if the surface is horizontal, such as a ceiling). The GM determines which surfaces can be climbed or crawled across."
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 unattended object or willing creature"
    duration: "5 minutes"
- id: "life-boost"
  name: "Life Boost"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** life
    Life force from your patron floods into the target, ensuring they can continue doing your patron's will for just a little longer. The target gains fast healing 2.
    **Heightened (+1).** The fast healing increases by 2.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "healing", "hex", "manipulate", "vitality", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    duration: "4 rounds"
- id: "light-spell"
  name: "Light"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an orb of light that sheds bright light in a 20-foot radius (and dim light for the next 20 feet) in a color you choose. If you create the light in the same space as a willing creature, you can attach the light to the creature, causing it to float near that creature as it moves. You can Sustain the spell to move the light up to 60 feet; you can attach or detach it from a creature as part of this movement.
    You can Dismiss the spell. If you Cast the Spell while you already have four light spells active, you must choose one of the existing spells to end.
    **Heightened (4th).** The orb sheds light in a 60-foot radius (and dim light for the next 60 feet).
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "light", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "120 feet"
    duration: "until your next daily preparations"
- id: "lightning-bolt"
  name: "Lightning Bolt"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A bolt of lightning strikes outward from your hand, dealing 4d12 electricity damage with a basic Reflex save.
    **Heightened (+1).** The damage increases by 1d12.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "electricity", "manipulate"]
    traditions: ["arcane", "primal"]
    area: "120-foot line"
    defense: "basic Reflex"
- id: "liminal-doorway"
  name: "Liminal Doorway"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You draw a chalk doorway on an unbroken surface, which opens into an extradimensional space. Any creature treating the drawing as an actual door can Interact to touch the doorknob and pass through. The warped, chalk-drawn room beyond the door is 20 feet in width, depth, and height. The space is unadorned and empty, with chalk lines indicating the corners of the walls.
    If the drawing is scrubbed away, the underlying surface is broken, or a creature attempts to enter the space that would put it over capacity, the space begins to collapse. The space ejects one creature at random each round, depositing it on the nearest open ground, until all creatures are returned outside.
  properties:
    kind: "spell"
    rank: 4
    traits: ["uncommon", "concentrate", "extradimensional", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "touch"
    duration: "8 hours"
- id: "lingering-composition"
  name: "Lingering Composition"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Muse.** maestro
    You add a flourish to your composition to extend its benefits. If your next action is to cast a cantrip composition with a duration of 1 round, attempt a Performance check. The DC is usually a standard-difficulty DC of a level equal to the highestlevel target of your composition, but the GM can assign a different DC based on the circumstances. The effect depends on the result of your check.
    **Critical Success.** The composition lasts 4 rounds.
    **Success.** The composition lasts 3 rounds.
    **Failure.** The composition lasts 1 round, but you don't spend the Focus Point for casting this spell.
  properties:
    kind: "focus"
    rank: 1
    actions: "free"
    traits: ["uncommon", "bard", "concentrate", "focus", "spellshape"]
    focusGroup: "Bard Composition Spells"
- id: "localized-quake"
  name: "Localized Quake"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You shake the earth, toppling nearby creatures. Choose whether the spell's area is a 15-foot emanation or a 15-foot cone when you cast it. Each creature in the area standing on solid ground takes 4d6 bludgeoning damage with a basic Reflex saving throw. A creature that fails its save also falls prone.
    **Heightened (+1).** Increase the damage by 2d6.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "earth", "focus", "manipulate"]
    focusGroup: "Earth"
    area: "15-foot emanation or 15-foot cone"
    defense: "basic Reflex"
- id: "locate"
  name: "Locate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You learn the direction to the target (if you picked a specific object, such as "my mother's sword") or the nearest target (if you picked a type of object, such as "swords"). If the target is a specific object, you must have observed it directly with your own senses. If it's a type of object, you still need to have an accurate mental image of the type of object. If there's lead or running water between you and the target, this spell can't locate the object. This means you might find a type of object farther away if the nearest one is behind lead or running water.
    **Heightened (5th).** You can target a specific creature or ancestry instead of an object, but you must have met or seen up close the creature or ancestry you want to target.
  properties:
    kind: "spell"
    rank: 3
    traits: ["uncommon", "concentrate", "detection", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    castTime: "10 minutes"
    range: "500 feet"
    targets: "1 specific object or type of object"
    duration: "sustained"
- id: "lock"
  name: "Lock"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target's latch mechanism clinks shut, held fast by unseen magical wards. When you magically lock a target, you set an Athletics and Thievery DC to open it equal to your spell DC or the base lock DC with a +4 status bonus, whichever is higher. Any key or combination that once opened a lock affected by this spell does not do so for the duration of the spell, though the key or combination does grant a +4 circumstance bonus to checks to open the door.
    If the target is opened, the spell ends. Assuming the target is not barred or locked in some additional way, you can unlock and open it with an Interact action during which you touch the target. This does not end the spell. You can Dismiss this spell at any time and from any distance.
    **Heightened (2nd).** The duration is unlimited, but you must expend 6 gp worth of precious metals as an additional cost.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "touch"
    targets: "1 lock, or a door or container with a latch"
    duration: "until your next daily preparations"
- id: "loremaster-s-etude"
  name: "Loremaster's Etude"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Muse.** enigma
    You call upon your muse's deep mysteries, granting the target a greater ability to think and recall information. Roll the triggering Recall Knowledge skill check twice and use the higher result.
  properties:
    kind: "focus"
    rank: 1
    actions: "free"
    traits: ["uncommon", "bard", "composition", "focus", "fortune", "manipulate"]
    focusGroup: "Bard Composition Spells"
    trigger: "You or an ally within range attempts a skill check to Recall Knowledge"
    range: "30 feet"
    targets: "you or the triggering ally"
- id: "lucky-break"
  name: "Lucky Break"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Reroll the saving throw and use the better result. You then become temporarily immune for 10 minutes."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "focus", "fortune"]
    focusGroup: "Luck"
    trigger: "You fail, but don't critically fail, a saving throw."
- id: "mad-monkeys"
  name: "Mad Monkeys"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Magical monkey spirits fill the area as they pile and climb on top of one another. Because the monkeys are magical spirits, they can't be attacked or hurt. Casting calm or a similar effect over the monkeys makes them docile, causing them to cease making mischief for the duration of mad monkeys.
    Choose the kind of mischief your monkeys make when you Cast the Spell. They produce the effect listed for that mischief when you Cast the Spell and the first time each round when you Sustain the spell. The first time each round when you Sustain the spell, you can move the area of the monkeys by 5 feet.
    - **Flagrant Burglary.** The monkeys try to Steal any one item from one creature in the area. Use your spell DC - 10 as the monkeys' Thievery modifier. Their attempt relies more on distraction than subtlety, so the victim knows what item the monkeys were trying to take and whether it was taken. Getting a stolen item from the monkeys—even for the caster—requires Stealing it from them or Disarming them, using your spell DC. When the spell ends, any stolen items fall to the ground in any square of the spell's area you choose.
    - **Raucous Din.** The monkeys screech loudly, potentially deafening creatures in the spell's area. Each creature in the spell's area must attempt a Fortitude save.
    **Critical Success.** The creature is unaffected and is temporarily immune for 10 minutes.
    **Success.** The creature is unaffected.
    **Failure.** The creature is deafened for 1 round.
    **Critical Failure.** The creature is deafened for 1 minute.
    - **Tumultuous Gymnastics.** The monkeys jump and climb all over creatures in the spell's area, interfering with complex movements. Each creature in the spell's area must attempt a Reflex save.
    **Critical Success.** The creature is unaffected and is temporarily immune for 10 minutes.
    **Success.** The creature is unaffected.
    **Failure.** For 1 round, the creature must succeed at a DC 5 flat check whenever it attempts a manipulate action. If it fails this check, the action is disrupted.
    **Critical Failure.** As failure, but the monkeys cling to the creature tenaciously, and the effect lasts until the spell ends, even if the creature leaves the spell's area.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["primal"]
    range: "30 feet"
    area: "5-foot burst"
    duration: "sustained up to 1 minute"
- id: "magic-hide"
  name: "Magic Hide"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your animal companion grows a thicker hide, matted fur, or a harder shell, granting it a +1 status bonus to AC."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "manipulate", "ranger"]
    focusGroup: "Initiate Warden Spells"
    range: "30 feet"
    targets: "your animal companion"
    duration: "1 minute"
- id: "magic-passage"
  name: "Magic Passage"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a visible tunnel through the wall in the chosen area, replacing the area with empty space. If the wall is thicker than 10 feet, the tunnel ends 10 feet in. Even a small layer of metal in the wall prevents this spell from functioning. This spell doesn't reduce the integrity of the structure. When the spell ends, anyone inside the tunnel is shunted to the nearest exit.
    **Heightened (7th).** The tunnel can be up to 20 feet deep. The areas of the wall that contain your tunnel's entrance appear completely normal (unless viewed with truesight or a similar effect), despite the tunnel's existence. The tunnel's entrance functions as a solid wall, but you can specify a password or a trigger, allowing creatures to enter freely.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["uncommon", "concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "touch"
    area: "5-foot-wide, 10-foot-tall, 10-foot-deep section of wooden, plaster, or stone wall"
    duration: "1 hour"
- id: "magic-s-vessel"
  name: "Magic's Vessel"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "A creature becomes a divine receptacle for pure magical energy. The target gains a +1 status bonus to saving throws. Each time you Cast a Spell from your spell slots, you automatically Sustain this spell and grant its target resistance to damage from spells equal to the spell's rank, until the start of your next turn."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate"]
    focusGroup: "Magic"
    range: "touch"
    targets: "1 creature"
    duration: "sustained up to 1 minute"
- id: "malicious-shadow"
  name: "Malicious Shadow"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** shadow
    Your patron warps the target's shadow into a deadly form, such as strangling hands, a dangerous weapon, harrying runes, or the like. The shadow moves along with the target, always remaining within reach. When you Cast the Spell, and each time you Sustain it, the shadow Strikes the target. The shadow's Strikes are melee spell attacks that deal 2d10 damage. You choose the type of damage (bludgeoning, piercing, or slashing) when you Cast the Spell. The shadow uses and contributes to your multiple attack penalty. The shadow doesn't take up space, grant flanking, or have any other attributes a creature would. The shadow can't make any attacks other than its Strike.
    The shadow vanishes if the target ceases to cast a shadow (usually if it moves into complete darkness or light). If another effect is controlling the target's shadow when you cast malicious shadow, you can attempt to counteract that effect to temporarily take control of the shadow for malicious shadow's duration.
    **Heightened (+2).** The Strike damage increases by 1d10.
  properties:
    kind: "focus"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "hex", "manipulate", "shadow", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    defense: "AC"
    duration: "sustained up to 1 minute"
- id: "malignant-sustenance"
  name: "Malignant Sustenance"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You embed a seed of void energy in an undead creature, restoring its unnatural vigor over time. The target gains fast healing 7.
    **Heightened (+1).** The fast healing increases by 2.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "void"]
    focusGroup: "Undeath"
    range: "touch"
    targets: "1 willing undead creature"
    duration: "1 minute"
- id: "manifestation"
  name: "Manifestation"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You spin secrets from the fundaments of magic, shaping them into a power with nearly unlimited potential. You duplicate a spell of 9th rank or lower of the tradition from which you cast manifestation, or a spell of 7th rank or lower from any tradition. Though you can normally choose only spells that are common or to which you have access, the GM might allow broader options."
  properties:
    kind: "spell"
    rank: 10
    actions: "three"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
- id: "mariner-s-curse"
  name: "Mariner's Curse"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You afflict the target with the curse of the roiling, unforgiving sea. The target must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target becomes sickened 1. Reducing its sickened condition to 0 ends the curse.
    **Failure.** The target becomes sickened 1 and can't reduce its sickened condition below 1 while the curse remains. The curse can be lifted by 4th-rank cleanse affliction or similar magic. Whenever the target is sickened and on the water at least a mile from shore, it is also slowed 1.
    **Critical Failure.** As failure, but the target becomes sickened 2.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "curse", "manipulate"]
    traditions: ["arcane", "occult", "primal"]
    range: "touch"
    targets: "1 creature"
    defense: "Will"
- id: "marvelous-mount"
  name: "Marvelous Mount"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You conjure a Large fantastical creature to serve as a mount for the target. The mount is the target's minion, has a Speed of 40 feet, and can bear the target with any carried possessions. It can't carry any other creature. The mount uses the target's AC and saves, but it's destroyed if it takes more than 10 damage at one time, ending the spell.
    **Heightened (3rd).** The mount can walk on water, but it must end its turn on solid ground or sink.
    **Heightened (4th).** The mount has a Speed of 60 feet and can walk on water.
    **Heightened (5th).** The mount has a Speed of 60 feet and can walk on water. It also has a fly Speed of 60 feet, but it must end its turn on a surface or fall.
    **Heightened (6th).** The mount has a Speed and fly Speed of 80 feet.
  properties:
    kind: "spell"
    rank: 2
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "10 minutes"
    range: "30 feet"
    targets: "one creature"
    duration: "8 hours"
- id: "mask-of-terror"
  name: "Mask of Terror"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target appears to be a gruesome and terrifying creature. The effect is unique to each observer, so a human viewing the target might see a demon with bloody fangs, but a demon observing the target might see a glowing angelic visage.
    When any creature attempts a hostile action against the target, the creature must attempt a Will save. It is then temporarily immune until the end of its next turn.
    **Success.** The creature is unaffected.
    **Failure.** The creature becomes frightened 2 before using its action.
    **Critical Failure.** The creature becomes frightened 2, and its action fails and is wasted.
    **Heightened (8th).** You can target up to 5 creatures. If a creature uses a hostile action or reaction that affects multiple targets simultaneously, it needs to attempt only one save against mask of terror.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "emotion", "fear", "illusion", "manipulate", "mental", "visual"]
    traditions: ["arcane", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    duration: "1 minute"
- id: "massacre"
  name: "Massacre"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You unleash a wave of death to snuff out the life force of those in its path. Each living creature of 17th level or lower in the line must attempt a Fortitude save. If the damage from massacre reduces a creature to 0 Hit Points, that creature dies instantly. If massacre doesn't kill even a single creature, the void energy hungrily turns backward toward you, dealing an additional 30 void damage to every living creature in the line (even those above 17th level) and 30 void damage to you.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes 9d6 void damage.
    **Failure.** The creature takes 100 void damage.
    **Critical Failure.** The creature dies.
    **Heightened (10th).** The spell can affect living creatures up to 19th level. Increase the damage to 10d6 on a success, and to 115 on a failure.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "death", "manipulate", "void"]
    traditions: ["arcane", "divine", "primal"]
    area: "60-foot line"
    defense: "Fortitude"
- id: "mending"
  name: "Mending"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You repair the target item. You restore 5 Hit Points per spell rank to the target, potentially removing the broken condition if this repairs it past the item's Broken Threshold. You can't replace lost pieces or repair an object that's been completely destroyed.
    **Heightened (2nd).** You can target a non-magical object of 1 Bulk or less.
    **Heightened (3rd).** You can target a non-magical object of 2 Bulk or less, or a magical object of 1 Bulk or less.
  properties:
    kind: "spell"
    rank: 1
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "10 minutes"
    range: "touch"
    targets: "non-magical object of light Bulk or less"
- id: "message"
  name: "Message"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You mouth words quietly, but instead of coming out of your mouth, they're transferred directly to the ears of the target. While others can't hear your words any better than if you normally mouthed them, the target can hear your words as if they were standing next to you. The target can give a brief response as a reaction, or as a free action on their next turn if they wish, but they must be able to see you and be within range to do so. If they respond, their response is delivered directly to your ear, just like the original message.
    **Heightened (3rd).** The spell's range increases to 500 feet.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["auditory", "cantrip", "concentrate", "illusion", "linguistic", "mental", "subtle"]
    traditions: ["arcane", "divine", "occult"]
    range: "120 feet"
    targets: "1 creature"
    duration: "see below"
- id: "metamorphosis"
  name: "Metamorphosis"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Harnessing your mastery of transformative magic, you hide forms within forms. You transform yourself into any form you could choose with a polymorph spell in your spell repertoire or that you could prepare of 8th-rank or lower (including any 8th-rank or lower heightened versions of spells you know). You gain 40 temporary Hit Points rather than the amount normally granted by the form.
    You can Sustain the spell to enter a new form you haven't used during this metamorphosis. This replenishes your temporary Hit Points from this spell.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "migration"
  name: "Migration"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The targets naturally take on animal forms most fitting their movement and environment. Each target gains a land, burrow, climb, fly, and swim Speed of 40 feet, and can transform into a Tiny or Small animal most appropriate for a given movement and environment. It also gains immunity to mild, severe, and extreme cold and heat, along with any other immunities common to the local wildlife, at the GM's discretion. In exploration mode, a target can move much faster, at a travel Speed of 20 miles per hour.
    A target can't Strike, cast spells, or use most manipulate actions in animal form, but it can resume its normal shape by Sustaining the spell. It can Sustain the spell again to resume animal form.
  properties:
    kind: "spell"
    rank: 8
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["primal"]
    castTime: "10 minutes"
    range: "20 feet"
    targets: "you and up to 5 willing creatures"
    duration: "8 hours"
- id: "mind-probe"
  name: "Mind Probe"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You cast your thoughts through a creature's mind, sifting for information. You access the target's memories and knowledge unless it fends you off with a Will save.
    **Success.** The target is unaffected.
    **Failure.** Each round of the spell's duration, you can Sustain the spell to ask a different question and attempt to uncover the answer. For each question, the target can attempt a Deception check against your spell DC; if the target succeeds, you don't learn the answer, and on a critical success, the target gives you a false answer that you believe is truthful Once you've asked the target a given question, asking it again, even with a separate casting of mind probe, produces the same result.
    **Critical Failure.** As failure, and the target takes a -4 circumstance penalty to Deception checks against your questions.
  properties:
    kind: "spell"
    rank: 5
    traits: ["uncommon", "concentrate", "linguistic", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "mind-reading"
  name: "Mind Reading"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    With a cursory mental touch, you attempt to read the target's mind. It must attempt a Will save. The target then becomes temporarily immune to your mind reading for 1 hour.
    **Critical Success.** The target perceives vague surface thoughts from you when you Cast the Spell.
    **Success.** You find out whether the target's Intelligence modifier is higher than, equal to, or lower than yours.
    **Failure.** You perceive vague surface thoughts from the target when you Cast the Spell, and you find out whether its Intelligence is higher than, equal to, or lower than yours.
    **Critical Failure.** As failure, and for the duration of the spell, you can Sustain the spell to detect the target's surface thoughts again. The target doesn't receive any additional saves.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "detection", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 round or sustained up to 1 minute"
- id: "mindlink"
  name: "Mindlink"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You link your mind to the target's mind and mentally impart to that target an amount of information in an instant that could otherwise be communicated in 10 minutes."
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "touch"
    targets: "1 willing creature"
- id: "mirage"
  name: "Mirage"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an illusion that causes natural terrain to look, sound, feel, and smell like a different kind of terrain. This doesn't disguise any structures or creatures in the area.
    Any creature that touches the illusion or uses the Seek action to examine it can attempt to disbelieve your illusion.
    **Heightened (5th).** Your image can also disguise structures or create illusory structures (but still doesn't disguise creatures).
  properties:
    kind: "spell"
    rank: 4
    traits: ["uncommon", "concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "occult", "primal"]
    castTime: "10 minutes"
    range: "500 feet"
    area: "50-foot burst"
    duration: "until your next daily preparations"
- id: "mislead"
  name: "Mislead"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You turn yourself invisible and create an illusory duplicate of yourself. When you Sustain the spell, you can mentally dictate a course of action for your duplicate to follow that round. Your duplicate acts as though it had your full number of actions, though it can't actually affect anything in the environment. Both the duplicate and your invisibility persist for the spell's duration. Performing a hostile action doesn't end mislead's invisibility, just like a 4th-rank invisibility spell. A creature that determines the duplicate is an illusion doesn't necessarily know you're invisible, and one that can see your invisible form doesn't necessarily know your duplicate is an illusion.
    If you Cast a Spell, attack, or otherwise interact with another creature, as a part of that action you can attempt a Deception check against observers' Perception DCs to convince them your duplicate used that action. This doesn't fool anyone who's aware your duplicate is an illusion, nor does it work if the attack obviously couldn't have come from the duplicate. For instance, if you fired a ray, you could make it look like it came from the duplicate as long as the duplicate was positioned appropriately, but if you attacked with a sword and your duplicate was across the room from the target, your Deception check would automatically fail.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate"]
    traditions: ["arcane", "occult"]
    duration: "sustained up to 1 minute"
- id: "mist"
  name: "Mist"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You call forth a cloud of mist. All creatures within the mist become concealed, and all creatures outside the mist become concealed to creatures within it. You can Dismiss the cloud."
  properties:
    kind: "spell"
    rank: 2
    actions: "three"
    traits: ["concentrate", "manipulate", "water"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    area: "20-foot burst"
    duration: "1 minute"
- id: "moment-of-renewal"
  name: "Moment of Renewal"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "The targets experience a day's worth of recovery in an instant. Any detrimental effects that would be gone after 24 hours end, though this doesn't shorten the duration of any active spells affecting the targets. The targets regain Hit Points and recover from conditions as if they had taken 24 hours of rest, but they do not make their daily preparations again or gain any benefits of rest other than healing. The targets are then temporarily immune for 1 day."
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "healing", "manipulate"]
    traditions: ["divine", "primal"]
    range: "touch"
    targets: "up to 6 creatures"
- id: "monstrosity-form"
  name: "Monstrosity Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transform into the shape of a legendary monster, assuming a Huge battle form. When you Cast this Spell, choose phoenix, cave worm, or sea serpent. While in this form, you gain the beast trait (for phoenix) or the animal trait (for cave worm or sea serpent). You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 20 + your level. Ignore your armor's check penalty and Speed reduction.
    • 20 temporary Hit Points.
    • Darkvision.
    • One or more unarmed melee attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +28, and you use the listed damage. These attacks are Strength based (for the purpose of the enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead.
    • Athletics modifier of +30, unless your own is higher.
    You gain specific abilities based on the monster you choose:
    - **Cave Worm.** Speed 40 feet, burrow 30 feet, swim 20 feet; Melee [1 action] jaws (reach 10 feet), Damage 2d12+20 piercing; Melee [1 action] stinger (agile, reach 10 feet), Damage 2d8+15 piercing plus 2d6 persistent poison; Melee
    [1 action] body (reach 10 feet) Damage 2d8+20 bludgeoning; Inexorable You automatically recover from the paralyzed, slowed, and stunned conditions at the end of each of your turns. You're also immune to being immobilized and ignore difficult terrain and greater difficult terrain.
    - **Phoenix.** Speed 30 feet, fly 90 feet; Melee [1 action] beak (reach 15 feet), Damage 2d6+12 piercing plus 2d4 fire and 2d4 persistent fire; Melee [1 action] talon (agile, reach 15 feet), Damage 2d8+12 slashing; Shroud of Flame (aura, fire, primal) 20 feet. You gain an aura of fire that extends out from you. A creature that enters or ends its turn within the aura takes 2d6 fire damage. A creature can take this damage only once per turn. You can activate or deactivate this aura with a Sustain action.
    - **Sea Serpent.** Speed 20 feet, swim 90 feet; Melee [1 action] jaws (reach 15 feet), Damage 2d12+20 piercing; Melee
    [1 action] tail (reach 25 feet), Damage 2d8+20 bludgeoning; Spine Rake [2 actions] (move) You extend your spines and Swim or Stride. Each creature you're adjacent to at any point during your movement takes 4d8+10 slashing damage (basic Reflex against your spell DC).
    **Heightened (9th).** You instead gain AC = 22 + your level, 25 temporary HP, attack modifier +31, increase damage by one damage die, and Athletics +33.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "1 minute"
- id: "moon-frenzy"
  name: "Moon Frenzy"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A feral aspect overcomes the targets, filling them with strength and ferocity. Targets gain 5 temporary Hit Points, a +10-foot status bonus to their Speeds, and weakness 5 to silver. They also grow vicious fangs and claws, which are unarmed attacks. The fangs deal 2d8 piercing damage; the claws deal 2d6 slashing damage and have the agile and finesse traits. The targets use their highest weapon or unarmed attack proficiency with these attacks, and if they have weapon specialization or greater weapon specialization, they add this damage as well. On a critical hit with one of these unarmed attacks, the creature struck takes 1d4 persistent bleed damage. The targets can't use concentrate actions unless those actions also have the rage trait, with the exception of Seek. A creature can attempt to end the spell's effect on itself by using a single action, which has the rage trait, to attempt a Will save against your spell DC; on a success, it ends the spell's effect on itself.
    If a target is in the light of a full moon, it also grows by one size if it were Medium or smaller. This increases the reach of a Medium or Tiny creature by 5 feet.
    **Heightened (6th).** The temporary Hit Points increase to 10, the silver weakness to 10, and the damage dealt by the attacks to three dice.
    **Heightened (10th).** The temporary Hit Points increase to 20, the silver weakness to 20, and the damage dealt by the attacks to four dice.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "morph"]
    traditions: ["primal"]
    range: "30 feet"
    targets: "up to 5 willing creatures"
    duration: "1 minute"
- id: "moonbeam"
  name: "Moonbeam"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You shine a ray of moonlight. Make a spell attack roll. The beam of light deals 2d6 fire damage. This is silver damage for the purposes of weaknesses, resistances, and the like.
    **Critical Success.** The beam deals double damage, and the target is dazzled for 1 minute.
    **Success.** The beam deals full damage, and the target is dazzled for 1 round.
    **Heightened (+1).** The ray's damage increases by 1d6.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "attack", "cleric", "concentrate", "fire", "focus", "light", "manipulate"]
    focusGroup: "Moon"
    range: "120 feet"
    targets: "1 creature"
    defense: "AC"
- id: "mountain-resilience"
  name: "Mountain Resilience"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target's skin hardens like the stone of a mountain face. It gains resistance 5 to physical damage, except adamantine. Each time the target is hit by a bludgeoning, piercing, or slashing attack, mountain resilience's duration decreases by 1 minute.
    **Heightened (6th).** The resistance increases to 10.
    **Heightened (8th).** The resistance increases to 15.
    **Heightened (10th).** The resistance increases to 20.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 creature"
    duration: "20 minutes"
- id: "mystic-armor"
  name: "Mystic Armor"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You ward yourself with shimmering magical energy, gaining a +1 item bonus to AC and a maximum Dexterity modifier of +5. While wearing mystic armor, you use your unarmored proficiency to calculate your AC.
    **Heightened (4th).** You gain a +1 item bonus to saving throws.
    **Heightened (6th).** The item bonus to AC increases to +2, and you gain a +1 item bonus to saving throws.
    **Heightened (8th).** The item bonus to AC increases to +2, and you gain a +2 item bonus to saving throws.
    **Heightened (10th).** The item bonus to AC increases to +3, and you gain a +3 item bonus to saving throws.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    duration: "until your next daily preparations"
- id: "mystic-beacon"
  name: "Mystic Beacon"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "The next damaging or healing spell the target casts before the start of your next turn deals damage or restores Hit Points as if the spell were heightened 1 rank higher than its actual rank. This applies only to initial healing or damage when the spell is cast, not any ongoing effects. The spell otherwise functions at its actual rank. Once the target casts the spell, mystic beacon ends."
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate"]
    focusGroup: "Magic"
    range: "30 feet"
    targets: "1 willing creature"
    duration: "until the start of your next turn"
- id: "nature-incarnate"
  name: "Nature Incarnate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The primal power of the world flows through you. You transform into an incarnation of nature, either a green man or a kaiju. Your battle form is Medium for a green man or Gargantuan (30-foot-by-30-foot space) for a kaiju. While in this form, you gain the plant trait (for a green man) or the beast trait (for a kaiju). You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 25 + your level. Ignore your armor's check penalty and Speed reduction.
    • 30 temporary Hit Points.
    • Darkvision.
    • One or more attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +34, and you use the listed damage. These attacks are Strength based (for the purpose of the enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead.
    • Athletics modifier of +36, unless your own is higher.
    You gain specific abilities based on the incarnation you choose:
    - **Green Man.** Speed 40 feet, climb 40 feet; Melee [1 action] vines (reach 30 feet, versatile P), Damage 6d8+12 bludgeoning; Ranged [1 action] thorns (range 100 feet), Damage 6d6+6 piercing; Green Caress (aura, primal) 60 feet. Enemies other than plants must succeed at a Fortitude save against your spell DC or become clumsy 1 for 1 round (clumsy 2 on a critical failure).
    - **Kaiju.** Speed 50 feet; resistance 5 to physical damage; Melee [1 action] jaws (reach 30 feet), Damage 6d10+10 piercing; Melee [1 action] claws (agile, reach 30 feet), Damage 6d8+8 slashing; Melee [1 action] foot (agile, reach 15 feet), Damage 6d6+10 bludgeoning; Unstoppable You are immune to being immobilized and ignore difficult terrain and greater difficult terrain; Trample [3 actions] You move up to double your Speed and move through the spaces of Huge or smaller creatures, trampling each creature whose space you enter. A trampled creature takes foot damage with a basic Reflex save against your spell DC.
  properties:
    kind: "spell"
    rank: 10
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["primal"]
    duration: "1 minute"
- id: "nature-s-bounty"
  name: "Nature's Bounty"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    A palm-sized raw fruit or vegetable of your choice appears in your open hand. A creature can consume the food with an Interact action to regain 3d10+12 Hit Points and be nourished as if it had eaten a meal. If uneaten, the food crumbles to dust after 1 minute.
    **Heightened (+1).** The Hit Points restored increase by 6.
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate", "plant", "vitality"]
    focusGroup: "Nature"
    requirements: "You have a free hand."
- id: "nature-s-pathway"
  name: "Nature's Pathway"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You step into a living tree with a trunk big enough for you to fit inside it and instantly teleport to any tree within 5 miles that also has a sufficiently large trunk. Once you enter the first tree, you instantly know the rough locations of other sufficiently large trees within range and can exit from the original tree, if you prefer. You can't carry extradimensional spaces with you; if you attempt to do so, the spell fails.
    **Heightened (6th).** The tree you exit can be up to 50 miles away.
    **Heightened (8th).** The tree you exit can be up to 500 miles away.
    **Heightened (9th).** The tree you exit can be anywhere on the same planet.
  properties:
    kind: "spell"
    rank: 5
    traits: ["uncommon", "concentrate", "manipulate", "mental", "plant", "teleportation"]
    traditions: ["primal"]
    castTime: "1 minute"
- id: "needle-of-vengeance"
  name: "Needle of Vengeance"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** vengeance
    A long, jagged needle jabs into the target foe's psyche whenever it tries to attack a creature your patron holds in special regard. Name yourself or one of your allies. The target takes 2 mental damage any time it uses a hostile action against the named creature, with a basic Will save.
    **Heightened (+1).** Increase the damage by 2.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "focus", "hex", "manipulate", "mental", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 enemy"
    defense: "basic Will"
    duration: "sustained up to 1 minute"
- id: "never-mind"
  name: "Never Mind"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You drastically reduce the target's mental faculties. The target must attempt a Will save. The effects of this curse can be removed only through effects that target curses.
    **Critical Success.** The target is unaffected.
    **Success.** The target is stupefied 2 for 1 round.
    **Failure.** The target is stupefied 4 with an unlimited duration.
    **Critical Failure.** The target's intellect is permanently reduced below that of an animal, and it treats its Charisma, Intelligence, and Wisdom modifiers as -5. It loses all class abilities that require mental faculties, including all spellcasting. If the target is a PC, they become an NPC under the GM's control.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "curse", "incapacitation", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "nightmare"
  name: "Nightmare"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You send disturbing nightmares to your target. The next time the target falls asleep, it must attempt a Will save. If you know the target only by name and have never met them, the target gets a +4 circumstance bonus to the Will save.
    **Critical Success.** The target is unaffected and is temporarily immune for 1 week.
    **Success.** The target has the nightmares but has no adverse effects other than unpleasant memories.
    **Failure.** The target has the nightmares and awakens fatigued.
    **Critical Failure.** The target has the nightmares, awakens fatigued, and is drained 2 until it is no longer fatigued.
  properties:
    kind: "spell"
    rank: 4
    traits: ["concentrate", "illusion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "planetary"
    targets: "1 creature you know by name"
    defense: "Will"
    duration: "1 day"
- id: "noise-blast"
  name: "Noise Blast"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A cacophonous noise blasts out, dealing 2d10 sonic damage. Each creature must attempt a Fortitude save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage and is deafened for 1 round.
    **Critical Failure.** The creature takes double damage, is deafened for 1 minute, and is stunned 1.
    **Heightened (+1).** The damage increases by 1d10.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "sonic"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    area: "10-foot burst"
    defense: "Fortitude"
- id: "nudge-fate"
  name: "Nudge Fate"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    The barest spin of your patron's spool is enough to alter fate. When the target fails an attack roll, skill check, or saving throw and a +1 status bonus would turn a critical failure into a failure, or failure into a success, you grant the target a +1 status bonus to the check retroactively, changing the outcome appropriately. The spell then ends.
    If you cast nudge fate while a previous casting of this hex is still in effect, the previous effect ends.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cantrip", "concentrate", "hex", "witch"]
    focusGroup: "Patron Hex Cantrips"
    range: "30 feet"
    targets: "1 creature"
    duration: "1 minute"
- id: "oaken-resilience"
  name: "Oaken Resilience"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target's skin becomes tough, with a consistency like bark or wood. The target gains resistance 2 to bludgeoning and piercing damage and weakness 3 to fire. After the target takes fire damage, it can Dismiss the spell as a free action triggered by taking the damage; doing so doesn't reduce the fire damage the target was dealt.
    **Heightened (+2).** The resistances increase by 2, and the weakness increases by 3.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 willing creature"
    duration: "10 minutes"
- id: "ode-to-ouroboros"
  name: "Ode to Ouroboros"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your ode staves off death. The target's dying condition remains 1 below the value at which it dies. This doesn't help prevent death from effects that kill the target without increasing its dying condition, such as disintegrate and death effects."
  properties:
    kind: "focus"
    rank: 5
    actions: "reaction"
    traits: ["uncommon", "bard", "composition", "concentrate", "focus"]
    focusGroup: "Bard Composition Spells"
    trigger: "A creature's dying condition would reach the value at which they would die."
    range: "60 feet"
    targets: "the triggering creature"
- id: "one-with-plants"
  name: "One With Plants"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You can either transform into a plant or merge with plant matter. While transformed, you can't move or affect anything outside the plant, but you can cast spells as long as they don't require line of effect beyond the plant. You can Dismiss this spell.
    - **Merge with Plants.** The spell's duration is 10 minutes. While casting the spell, you must touch a plant with enough volume to fit you and your possessions or the spell is disrupted. While merged, you can hear, but not see, what's going on outside the plant. If the plant takes damage while you're inside it, you're expelled from the plant and take 10d6 damage. Magic passage expels you without dealing damage. The spell ends if you're ever outside the plant.
    - **Turn into a Plant.** The spell's duration is 8 hours. You become a Large plant—typically a tree. Perception checks don't reveal your true nature, but a successful Nature or Survival check against your spell DC reveals that you appear to be a plant that is strangely new to the area. While in this form, you can observe everything around you, using your normal senses. As a plant, your AC is 20, and only status bonuses, status penalties, circumstance bonuses, and circumstance penalties affect you. Any successes and critical successes you roll on Reflex saves are failures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "polymorph", "wood"]
    traditions: ["primal"]
    duration: "10 minutes or 8 hours"
- id: "one-with-stone"
  name: "One With Stone"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You can either transform into a stone or merge with stone. This spell has the same effects as one with plants, but lets you merge with or turn into stone. A stone you turn into has AC 23. You can Dismiss this spell."
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "earth", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "10 minutes or 8 hours"
- id: "outcast-s-curse"
  name: "Outcast's Curse"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You afflict the target with a curse that makes its presence abrasive and off-putting. The target must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** For 10 minutes, the target must roll twice and use the worse result whenever attempting a Deception, Diplomacy, Intimidation, or Performance check, and creatures they encounter have an initial attitude toward them of one step worse (for instance, unfriendly instead of indifferent).
    **Failure.** As success, but the effect is permanent.
    **Critical Failure.** As failure, and creatures that the target encounters have an initial attitude toward them of two steps worse.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "curse", "manipulate", "mental", "misfortune"]
    traditions: ["arcane", "divine", "occult"]
    range: "touch"
    targets: "1 creature"
    defense: "Will"
- id: "overstuff"
  name: "Overstuff"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Huge amounts of food and drink fill the target. It receives a full meal's worth of nourishment and must attempt a Fortitude save. A target sickened by this spell takes a -10-foot status penalty to its Speed until it's no longer sickened.
    **Critical Success.** The target is unaffected.
    **Success.** The target is sickened 1, but if it spends an action to end the condition, it succeeds automatically.
    **Failure.** The target is sickened 1.
    **Critical Failure.** The target is sickened 2.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate"]
    focusGroup: "Indulgence"
    range: "30 feet"
    targets: "1 living creature"
    defense: "Fortitude"
- id: "overwhelming-presence"
  name: "Overwhelming Presence"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You surround yourself with supernatural splendor, appearing to be a god or similarly majestic being, with an appearance, regalia, and iconography of your choice. Targets must attempt a Will save. Regardless of the outcome, the target is then temporarily immune for 1 minute.
    **Critical Success.** The target is unaffected.
    **Success.** The target must pay tribute to you two times. Paying tribute requires that the target spend a single action, which has either the move trait (as they bow) or manipulate trait (as they offer up a token). They must pay tribute at least once on each of their turns, if possible. While affected, the target is fascinated by you and can't use hostile actions against you.
    **Failure.** As success, but the target must pay tribute six times.
    **Critical Failure.** As failure, but the target must spend all its actions paying tribute, and they cannot take other actions until the tribute is fully paid.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["auditory", "concentrate", "incapacitation", "manipulate", "mental", "visual"]
    traditions: ["divine", "occult"]
    area: "40-foot burst"
    targets: "any number of creatures"
    defense: "Will"
    duration: "until full tribute is paid"
- id: "paralyze"
  name: "Paralyze"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You block the target's motor impulses before they can leave its mind, freezing the target in place. The target must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is stunned 1.
    **Failure.** The target is paralyzed for 1 round.
    **Critical Failure.** The target is paralyzed for 4 rounds. At the end of each of its turns, it can attempt a new Will save to reduce the remaining duration by 1 round, or end it entirely on a critical success.
    **Heightened (7th).** You can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "incapacitation", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "paranoia"
  name: "Paranoia"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You cause the target to see all other creatures as dire threats. The target is stricken by intense paranoia toward all creatures around it and must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target believes everyone it sees is a potential threat. It becomes unfriendly to all creatures to which it wasn't already hostile, even those that were previously allies. It treats no one as an ally. The spell ends after 1 round.
    **Failure.** As success, but the effect lasts 1 minute.
    **Critical Failure.** As failure, except the target believes that everyone it sees is a mortal enemy. It uses its reactions and free actions against everyone, regardless of whether they were previously its allies, as determined by the GM. It otherwise acts as rationally as it normally does and likely prefers to attack creatures that are actively attacking or hindering it over those leaving it alone.
    **Heightened (6th).** You can target up to 5 creatures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "mental"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 minute"
- id: "patron-s-puppet"
  name: "Patron's Puppet"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "At your unspoken plea, your patron temporarily assumes control over your familiar. You Command your familiar, allowing it to take its normal actions this turn. Your Command does not have the auditory or concentrate traits; your patron simply moves its agent directly."
  properties:
    kind: "focus"
    rank: 1
    actions: "free"
    traits: ["uncommon", "focus", "hex", "witch"]
    focusGroup: "Witch Hex Spells"
    trigger: "Your turn begins."
- id: "peaceful-bubble"
  name: "Peaceful Bubble"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    An opaque shell of drifting, iridescent runes covers the area, creating a bubble. You can choose to make the burst smaller, in 10-foot increments. The runes don't block travel, but those inside the bubble can't perceive those outside it and vice versa. Detection and scrying effects are likewise blocked.
    Creatures sleeping within the bubble are immune to dreams sent by spells. Those sleeping 8 hours reduce their doomed condition by 2 instead of 1.
  properties:
    kind: "spell"
    rank: 4
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "touch"
    area: "100-foot burst"
    duration: "24 hours"
- id: "peaceful-rest"
  name: "Peaceful Rest"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The targeted corpse doesn't decay, nor can it be transformed into an undead. If the corpse is subject to a spell that requires the corpse to have died within a certain amount of time (for example, raise dead), do not count the duration of peaceful rest against that time. This spell also prevents ordinary bugs and pests (such as maggots) from consuming the body.
    **Heightened (5th).** The spell's duration is unlimited, but the spell takes one more action to cast and requires a cost (embalming fluid worth 6 gp).
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 corpse"
    duration: "until your next daily preparations"
- id: "perfected-body"
  name: "Perfected Body"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your body's perfection keeps you just a little bit healthier than most. You get a failure if you rolled a critical failure or a success if you rolled a failure."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "focus"]
    focusGroup: "Perfection"
    trigger: "You fail or critically fail a saving throw against an effect that has the morph, poison, or polymorph trait, or that would make you clumsy, doomed, enfeebled, petrified, or sickened."
- id: "perfected-mind"
  name: "Perfected Mind"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You meditate upon perfection to remove all distractions from your mind. Attempt a new Will save against one mental effect currently affecting you that required a Will save. Use the result of this new save to determine the outcome of the mental effect, unless the new save would have a worse result than the original save, in which case nothing happens. You can use perfected mind against a given effect only once."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "concentrate", "focus"]
    focusGroup: "Perfection"
- id: "personal-blizzard"
  name: "Personal Blizzard"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** snow
    Your patron's breath becomes a blizzard of obscuring, scouring ice that follows your target. The target attempts a Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes 1d6 cold damage, and the spell ends.
    **Failure.** The target takes 1d6 cold damage and 1d6 persistent cold damage. The persistent damage automatically ends when the spell ends. It is concealed to other creatures, and other creatures are concealed to it.
    **Critical Failure.** As failure, but both the cold damage and the persistent cold damage are 2d6.
    **Heightened (+1).** The cold damage and persistent cold damage increase by 1 (2 on a critical failure).
  properties:
    kind: "focus"
    rank: 3
    actions: "one"
    traits: ["uncommon", "cold", "focus", "hex", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
    duration: "sustained up to 1 minute"
- id: "pest-form"
  name: "Pest Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transform into the battle form of a Tiny animal, such as a cat, insect, lizard, or rat. You can decide the specific type of animal (such as a rat or praying mantis), but this has no effect on your Size or statistics. While in this form, you gain the animal trait, and you can't make Strikes. You can Dismiss the spell.
    You gain the following statistics and abilities:
    • AC = 15 + your level. Ignore your armor's check penalty and Speed reduction.
    • Speed 20 feet.
    • Weakness 5 to physical damage. (If you take physical damage in this form, you take 5 additional damage.)
    • Low-light vision and imprecise scent 30 feet.
    • Acrobatics and Stealth modifiers of +10, unless your own is higher; Athletics modifier -4.
    **Heightened (4th).** You can turn into a flying creature, such as a bird, which grants you a fly Speed of 20 feet.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    duration: "10 minutes"
- id: "pet-cache"
  name: "Pet Cache"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You open your cloak or create a gap with your hands, drawing the target into a pocket dimension just large enough for its basic comfort. No other creature can enter this extradimensional space, and the target can bring along objects only if they were designed to be worn by a creature of its kind. The space has enough air, food, and water to sustain the target for the duration.
    You can Dismiss the spell. The spell also ends if you die or enter an extradimensional space. When the spell ends, the target reappears in the nearest unoccupied space (outside of any extradimensional space you may have entered).
  properties:
    kind: "spell"
    rank: 1
    actions: "one"
    traits: ["extradimensional", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature that is your companion"
    duration: "8 hours"
- id: "petrify"
  name: "Petrify"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target's body slowly turns into a stone statue. The target must attempt a Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is slowed 1 for 1 round as stone begins to form on their body.
    **Failure.** The target is slowed 1 and must attempt a Fortitude save at the end of each of its turns; this ongoing save has the incapacitation trait. On a failed save, the slowed condition increases by 1 (or 2 on a critical failure) as stone growths creep across their body. A successful save reduces the slowed condition by 1. When a creature becomes fully unable to act due to the slowed condition from petrify, the spell then ends in a flash of gray light, leaving the target petrified permanently as they become a statue. The spell also ends if the slowed condition is removed, which causes the stone to break off harmlessly.
    **Critical Failure.** As failure, but the target is initially slowed 2.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "120 feet"
    targets: "1 creature made of organic material"
    defense: "Fortitude"
    duration: "varies"
- id: "phantasmagoria"
  name: "Phantasmagoria"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You fill the targets' minds with endless images, like countless dreams and lives colliding with each other. The onrushing information deals 16d6 mental damage to each target, depending on its Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage and can't use reactions until the start of your next turn.
    **Failure.** The target takes full damage and is confused until the start of your next turn.
    **Critical Failure.** The target takes double damage and is confused for 1 minute.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["concentrate", "death", "illusion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    targets: "any number of creatures"
    defense: "Will"
- id: "phantasmal-calamity"
  name: "Phantasmal Calamity"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A vision of apocalyptic destruction fills the mind of each creature in the area. The vision deals 11d6 mental damage (basic Will save). On a critical failure, the creature must also succeed at a Reflex save or believe it's trapped (stuck in a fissure, adrift at sea, or some other fate in keeping with its vision). If it fails the second save, it's also stunned for 1 minute.
    It can attempt a new Will save at the end of each of its turns, and on a success, it disbelieves the illusion and recovers from the stunned condition.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "500 feet"
    area: "30-foot burst"
    defense: "Will"
- id: "phantasmal-minion"
  name: "Phantasmal Minion"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You summon a phantasmal minion (see Phantasmal Minion Statistics). The minion is roughly the shape of a humanoid. You can choose to have it be invisible or have an ephemeral appearance, but it's obviously a magical effect, not a real creature."
  properties:
    kind: "spell"
    rank: 1
    actions: "three"
    traits: ["concentrate", "manipulate", "summon"]
    traditions: ["arcane", "occult"]
    range: "60 feet"
    duration: "sustained"
- id: "phantom-pain"
  name: "Phantom Pain"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Illusory pain wracks the target, dealing 2d4 mental damage and 1d4 persistent mental damage with a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes full initial damage but no persistent damage, and the spell ends immediately.
    **Failure.** The target takes full initial and persistent damage, and the target is sickened 1. If the target recovers from being sickened, the persistent damage ends and the spell ends.
    **Critical Failure.** As failure, but the target is sickened 2.
    **Heightened (+1).** The damage increases by 2d4 and the persistent damage by 1d4.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "mental", "nonlethal"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "1 minute"
- id: "phase-familiar"
  name: "Phase Familiar"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your patron momentarily recalls your familiar to the ether, shifting it from its solid, physical form into a ghostly version of itself. Against the triggering damage, your familiar gains resistance 5 to all damage and is immune to precision damage.
    **Heightened (+1).** Increase the resistance by 2.
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "focus", "hex", "manipulate", "witch"]
    focusGroup: "Witch Hex Spells"
    trigger: "Your familiar would take damage."
    range: "60 feet"
    targets: "your familiar"
- id: "pied-piping"
  name: "Pied Piping"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your performance enraptures listeners, compelling them to follow you. Each creature within the emanation must attempt a Will save when you Cast the Spell or the first time they enter the area, after which they become temporarily immune for 1 day. Once per turn, you can Sustain the composition to increase the emanation's radius by 5 feet. You can Dismiss the spell.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature is fascinated with you.
    **Failure.** The creature is fascinated by you and uses all its actions to move toward you and compliment your performance. This effect ends if a hostile action is used against the affected creature.
    **Critical Failure.** The target gains the minion trait and is controlled by you. This effect ends if a hostile action is used against the affected creature, or if you direct the creature to use any action that causes it harm.
  properties:
    kind: "focus"
    rank: 10
    actions: "two"
    traits: ["uncommon", "bard", "composition", "concentrate", "focus", "incapacitation", "mental", "sonic"]
    focusGroup: "Bard Composition Spells"
    area: "5-foot emanation"
    defense: "Will"
    duration: "1 minute"
- id: "pinpoint"
  name: "Pinpoint"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You learn the name of the target's exact location (including the building, community, and country) and plane of existence. You can target a creature only if you've seen it in person, have one of its significant belongings, or have a piece of its body, such as a lock of hair. To target an object, you must have touched it or have a fragment of it. Pinpoint automatically overcomes protections against detection effects of lower rank than this spell, even if they would normally have a chance to block it."
  properties:
    kind: "spell"
    rank: 8
    traits: ["uncommon", "concentrate", "detection", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    castTime: "10 minutes"
    range: "unlimited"
    targets: "1 creature or object"
- id: "planar-displacement"
  name: "Planar Displacement"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You draw a ritual circle, and when the ritual is complete, you shift all creatures in the area to a different plane of existence. The skill you use for the primary check must be one that can be used to make a Recall Knowledge check about the intended destination.
    A secondary caster can be located at the exact site of the destination, instead of with you at the point of origin. If a secondary caster at the destination succeeds at its check and you roll a success, the ritual is a critical success instead.
    **Critical Success.** You arrive on the intended plane at the last place one of the targets (of your choice) was located the last time the target traveled to that plane. If it's the first time traveling to a particular plane for all targets, you appear at a random location on the plane. The circle remains active for 1 minute, during which time any creature the ritual transported can return to the origin point with a single action, which has the concentrate trait.
    **Success.** As critical success, but you arrive 1d10×25 miles from your destination.
    **Failure.** Your attempt is unsuccessful.
    **Critical Failure.** The ritual fails, and the GM determines whether you travel to the wrong plane or are barred from planar travel for 1 week.
  properties:
    kind: "ritual"
    rank: 7
    traits: ["uncommon", "teleportation"]
    castTime: "1 day"
    cost: "rare incense, precious metals, and purified chalk worth 500 gp"
    requirements: "planar key for the destination plane used as a locus"
    secondaryCasters: "2"
    primaryCheck: "Arcana (master), Nature (master), Occultism (master), or Religion (master)"
    secondaryChecks: "Lore (related to the destination plane), Survival"
    range: "20 feet"
    area: "20-foot burst"
- id: "planar-palace"
  name: "Planar Palace"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You grow an extradimensional demiplane consisting of a spacious dwelling with a single entrance. The entrance connects to the plane where you Cast the Spell, appearing anywhere within the spell's range as a faint, shimmering, vertical rectangle 5 feet wide and 10 feet high. You designate who can enter when you Cast the Spell. Once inside, you can shut the entrance, making it invisible. You and the creatures you designated can reopen the door at will. Inside, the demiplane appears to be a mansion featuring a magnificent foyer and numerous opulent chambers. The mansion can have any floor plan you imagine as you Cast the Spell, provided it fits within a space 40 feet wide, 40 feet deep, and 30 feet tall. While the entrance to the mansion is closed, effects from outside the mansion fail to penetrate it, and vice versa, except for interplanar teleport, which can be used to enter the mansion. You can use scrying magic and similar effects to observe the outside only if they're capable of crossing planes.
    A staff of up to 24 servants attends to anyone within the mansion. These are like the servant created by the phantasmal minion spell, though they're visible, with an appearance you determine during casting. The mansion is stocked with enough food to serve a nine-course banquet to 150 people.
  properties:
    kind: "spell"
    rank: 7
    traits: ["uncommon", "concentrate", "extradimensional", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    range: "30 feet"
    duration: "until your next daily preparations"
- id: "planar-seal"
  name: "Planar Seal"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You create a visible magical barrier that attempts to counteract teleportation effects and planar travel into or out of the area, including items that allow access to extradimensional spaces. Planar seal tries to counteract any attempt to summon a creature into the area but doesn't stop the creature from departing when the summoning ends."
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "120 feet"
    area: "60-foot burst"
    duration: "until your next daily preparations"
- id: "planar-servitor"
  name: "Planar Servitor"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You call upon a deity (or other divine power) to grant you aid in the form of a divine servitor of your deity's choice, with a level no greater than double the ritual's spell rank. The secondary casters explain what sort of assistance you need and why you need it; if the task is incredibly fitting to the deity, the GM can grant a circumstance bonus to the secondary Diplomacy check or rule that the check is automatically a critical success. If you use the ritual without good reason, the result is automatically a critical failure.
    If the ritual succeeds, you must offer the servitor payment depending on factors such as the duration and danger of the task. Payment always costs at least as much as a consumable item of the creature's level, and often costs as much as a permanent magic item of the creature's level to persuade a creature to fight alongside you. Your offerings should align with the personal tastes of the deity.
    You can alternatively name a being native to the deity's realm that you know personally, with the same level restriction. Such a creature might request something they personally want as payment.
    **Critical Success.** The deity sends a servitor, and the servitor's payment costs only half as much as normal. If you ask for a particular servitor by name, the deity is likely to send that servitor unless the servitor is busy.
    **Success.** Your deity sends a servitor.
    **Failure.** Your deity does not send a servitor.
    **Critical Failure.** The deity is offended and sends a sign of displeasure or possibly even a servitor to scold or attack you, depending on your deity's nature. A deity might also opt to strip divine powers from its followers who participated until they atone.
  properties:
    kind: "ritual"
    rank: 5
    traits: ["uncommon"]
    castTime: "1 day"
    cost: "rare incense and offerings worth a total value of 2 gp × the spell rank × the target's level, see text for more details"
    secondaryCasters: "2"
    primaryCheck: "Religion (expert)"
    secondaryChecks: "Diplomacy"
    duration: "see text"
- id: "planar-tether"
  name: "Planar Tether"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You stitch the target to its current plane. While the target is affected by planar tether, the spell attempts to counteract any teleportation effect that would move the target, or any effect that would transport it to a different plane. Planar tether's duration is determined by the target's Will save.
    **Critical Success.** The target is unaffected.
    **Success.** The duration is 1 minute.
    **Failure.** The duration is 10 minutes.
    **Critical Failure.** The duration is 1 hour.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "plant-form"
  name: "Plant Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Taking inspiration from verdant creatures, you transform into a Large plant battle form. When you Cast this Spell, choose a listed battle form. You can substitute a similar specific plant to turn into (such as a pitcher plant instead of a flytrap), but this has no effect on the form's Size or statistics. While in this form, you gain the plant trait. You can Dismiss the spell.
    You gain the following statistics and abilities regardless of which battle form you choose:
    • AC = 19 + your level. Ignore your armor's check penalty and Speed reduction.
    • 12 temporary Hit Points.
    • Resistance 10 to poison.
    • Low-light vision.
    • One or more unarmed melee attacks specific to the battle form you choose, which are the only attacks you can Strike with. You're trained with them. Your attack modifier is +17, and your damage bonus is +11. These attacks are Strength based (for the purpose of the enfeebled condition, for example). If your unarmed attack modifier is higher, you can use it instead.
    • Athletics modifier of +19, unless your own is higher.
    You gain specific abilities based on the plant you choose:
    - **Arboreal.** Speed 30 feet; Melee [1 action] branch (reach 15 feet), Damage 2d10 bludgeoning; Melee [1 action] foot, Damage 2d8 bludgeoning; you can speak in this form.
    - **Flytrap.** Speed 15 feet; resistance 10 to acid; Melee [1 action] leaf (reach 10 feet), Damage 2d8 piercing, and you can spend an action after a hit to Grab the target.
    **Heightened (6th).** Your battle form is Huge, and the reach of your attacks increases by 5 feet. You instead gain AC = 22 + your level, 24 temporary HP, attack modifier +21, damage bonus +16, and Athletics +22.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "polymorph", "wood"]
    traditions: ["primal"]
    duration: "1 minute"
- id: "plant-growth"
  name: "Plant Growth"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You cause the plants within the area to be healthier and more fruitful. In addition to other benefits of healthy plants, this increases the crop yield for farms, depending on your success. If you cast it in the area of a blight, plant growth attempts to counteract the blight instead of producing its usual effect.
    **Critical Success.** Double the crop yield in the area, or increase the area to a 1-mile radius.
    **Success.** Increase the crop yield in the area by one-third.
    **Failure.** The ritual has no effect.
    **Critical Failure.** The flora in the area changes in an unanticipated way, determined by the GM but generally as contradictory to your true desires as possible (for instance, blighting crops when you would prefer to enrich them).
  properties:
    kind: "ritual"
    rank: 4
    traits: ["uncommon", "plant", "vitality", "wood"]
    castTime: "1 day"
    secondaryCasters: "1"
    primaryCheck: "Nature (expert)"
    secondaryChecks: "Farming Lore or Survival"
    area: "1/2-mile-radius circle centered on you"
    duration: "1 year"
- id: "possession-spell"
  name: "Possession"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You send your mind and soul into the target's body, attempting to take control. The target must attempt a Will save. If you want to exert less control over the target, you can choose to use the effects of any degree of success more favorable to the target. While you're possessing a target, your own body is unconscious and can't wake up normally. You can sense everything the possessed target does. You can Dismiss this spell. If the possessed body dies, the spell ends and you must succeed at a Fortitude save against your spell DC or be paralyzed for 1 hour, or 24 hours on a critical failure. If the spell ends during an encounter, you act just before the possessed creature's initiative.
    **Critical Success.** The target is unaffected.
    **Success.** You possess the target but can't control it. You ride along in the body while the spell lasts.
    **Failure.** You possess the target and take partial control of it. You no longer have a separate turn; instead, you might control the target. At the start of each of the target's turns, it attempts another Will save. If it fails, it's controlled by you on that turn; if it succeeds, it chooses its own actions; and if it critically succeeds, it forces you out and the spell ends.
    **Critical Failure.** You possess the target fully, and it can only watch as you manipulate it like a puppet. The target is controlled by you.
    **Heightened (9th).** The duration is 10 minutes, and you can physically enter the creature's body, protecting your physical body while the spell lasts.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["uncommon", "concentrate", "incapacitation", "manipulate", "mental", "possession"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 living creature"
    defense: "Will"
    duration: "1 minute"
- id: "precious-metals"
  name: "Precious Metals"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your deity blesses base metals to transform them into precious materials. The metal in the target transforms from its normal metal into cold iron, copper, gold, iron, silver, or steel. If the spell's rank is 8th or higher, add adamantine and dawnsilver to the options. If you transform an object into copper, gold, or silver, its Hardness is reduced to 1. Otherwise, its Hardness is increased to 10 if it was lower. An item transmuted in this way deals damage according to its new material. For example, a steel sword transmuted to cold iron would deal additional damage to a creature with a weakness to cold iron. It can have other effects of the new material at the GM's discretion.
    This change is clearly magical and temporary, so the item's monetary value doesn't change; you couldn't transmute copper coins to gold and use them to purchase something.
    **Heightened (+1).** If you increase the Hardness of the object, the new Hardness is 2 higher.
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate", "metal"]
    focusGroup: "Wealth"
    range: "touch"
    targets: "1 metal shield or weapon, 1 suit of metal armor, or up to 1 Bulk of metal material (such as coins or metal-tipped ammunition)"
    duration: "1 minute"
- id: "prestidigitation"
  name: "Prestidigitation"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The simplest magic does your bidding. You can perform simple magical effects for as long as you Sustain the spell. Each time you Sustain the spell, you can choose one of four options.
    - **Cook.** Cool, warm, or flavor 1 pound of nonliving material.
    - **Lift.** Slowly lift an unattended object of light Bulk or less 1 foot off the ground.
    - **Make.** Create a temporary object of negligible Bulk, made of congealed magical substance. The object looks crude and artificial and is extremely fragile—it can't be used as a tool, weapon, or locus or cost for a spell.
    - **Tidy.** Color, clean, or soil an object of light Bulk or less. You can affect an object of 1 Bulk with 10 rounds of concentration, and a larger object at 1 minute per Bulk. Prestidigitation can't deal damage or cause adverse conditions. Any actual change to an object (beyond what is noted above) persists only as long as you Sustain the spell.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "10 feet"
    targets: "1 object (cook, lift, or tidy only)"
    duration: "sustained"
- id: "primal-call"
  name: "Primal Call"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: "This functions as planar servitor except you craft a faerie circle and call an animal, beast, fey, fungus, or plant from within 100 miles."
  properties:
    kind: "ritual"
    rank: 6
    traits: ["uncommon"]
    castTime: "1 day"
    cost: "faerie circle ingredients worth a total value of 1 gp × the spell rank × the target's level"
    secondaryCasters: "4"
    primaryCheck: "Nature (master)"
    secondaryChecks: "Crafting, Diplomacy, Survival"
    range: "100 miles"
    targets: "1 animal, beast, fey, fungus, or plant"
    duration: "see text"
- id: "primal-summons"
  name: "Primal Summons"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You enhance a summoned creature with the power of the elements. If your next action is to cast either summon animal or summon plant or fungus, choose air, earth, fire, metal, water, or wood; the creature you summon gains the corresponding abilities.
    - **Air.** The creature gains a fly Speed of 60 feet.
    - **Earth.** The creature gains a burrow Speed of 20 feet, reduces its land Speed by 10 feet (minimum 5 feet), and gains resistance 5 to physical damage.
    - **Fire.** The creature's Strikes deal 1d6 extra fire damage, and it gains resistance 10 to fire and weakness 5 to cold and water.
    - **Metal.** The creature's Strikes deal 1d6 extra electricity damage, and it gains resistance 5 to electricity.
    - **Water.** The creature gains a swim Speed of 60 feet, can spend 1 action after a melee attack to attempt a Shove (ignoring multiple attack penalty), and gains resistance 5 to fire.
    - **Wood.** The creature gains a climb Speed of 30 feet and resistance 2 to bludgeoning and piercing damage.
  properties:
    kind: "focus"
    rank: 6
    actions: "free"
    traits: ["uncommon", "concentrate", "druid", "focus"]
    focusGroup: "Druid Order Spells"
- id: "project-image"
  name: "Project Image"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You project an illusory image of yourself. You must stay within range of the image, and if at any point you can't see the image, the spell ends. Whenever you Cast a Spell other than one whose area is an emanation, you can cause the spell effect to originate from either yourself or the image. Because the image is an illusion, it can't benefit from spells, though visual manifestations of the spell appear. The image has the same AC and saves as you. If it is hit by an attack or fails a save, the spell ends.
    **Heightened (+2).** The maximum duration you can Sustain the spell increases to 10 minutes.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "illusion", "manipulate", "mental"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    duration: "sustained up to 1 minute"
- id: "protection"
  name: "Protection"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You ward a creature against harm. The target gains a +1 status bonus to Armor Class and saving throws.
    **Heightened (3rd).** You can choose to have the benefits also affect all your allies in a 10-foot emanation around the target.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["divine", "occult"]
    range: "touch"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "protective-wards"
  name: "Protective Wards"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You expand a ring of glyphs that shields your allies. You and any allies in the area gain a +1 status bonus to AC. Each time you Sustain the spell, the emanation's radius increases by 5 feet, to a maximum of 30 feet."
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "aura", "focus", "manipulate", "wizard"]
    focusGroup: "Ars Grammatica"
    area: "5-foot emanation centered on you"
    duration: "sustained up to 1 minute"
- id: "protector-s-sacrifice"
  name: "Protector's Sacrifice"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You protect your ally by suffering in their stead. Reduce the damage the ally would take by 3. You redirect this damage to yourself, but your immunities, weaknesses, resistances and so on do not apply.
    You aren't subject to any conditions or other effects of whatever damaged your ally (such as poison from a venomous bite). Your ally is still subject to those effects even if you redirect all of the triggering damage to yourself.
    **Heightened (+1).** The damage you redirect increases by 3.
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "cleric", "focus", "manipulate"]
    focusGroup: "Protection"
    trigger: "An ally within 30 feet takes damage."
    range: "30 feet"
- id: "protector-s-sphere"
  name: "Protector's Sphere"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    A protective aura emanates out from you, safeguarding you and your allies. You gain resistance 3 to all damage. Your allies also gain this resistance while in the aura.
    **Heightened (+1).** The resistance increases by 1.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "aura", "cleric", "concentrate", "focus", "manipulate"]
    focusGroup: "Protection"
    area: "15-foot emanation"
    duration: "sustained up to 1 minute"
- id: "pulse-of-civilization"
  name: "Pulse of Civilization"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You tap into the zeitgeist of any settlements in range. You learn the names of the settlements. On all Lore checks to Recall Knowledge about those settlements or to Gather Information in or about those settlements, you gain a +2 status bonus and use your level as your proficiency bonus even if you're untrained. When you Cast the Spell, you can immediately Recall Knowledge about one of the settlements using its Lore skill, which benefits from the bonus. If you cast pulse of civilization again, any previous casting ends.
    **Heightened (5th).** The range is 100 miles.
    **Heightened (7th).** The range is 500 miles and the bonus is +3.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "scrying"]
    focusGroup: "Cities"
    range: "25 miles"
    duration: "8 hours"
- id: "pummeling-rubble"
  name: "Pummeling Rubble"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A spray of heavy rocks flies through the air in front of you. The rubble deals 2d4 bludgeoning damage to each creature in the area. Each creature must attempt a Reflex save.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes half damage.
    **Failure.** The creature takes full damage and is pushed 5 feet away from you.
    **Critical Failure.** The creature takes double damage and is pushed 10 feet away from you.
    **Heightened (+1).** The damage increases by 2d4.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    area: "15-foot cone"
    defense: "Reflex"
- id: "punishing-winds"
  name: "Punishing Winds"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Violent winds and a powerful downdraft fill the area, forming a cyclone. All flying creatures in the area descend 40 feet. The entire area is greater difficult terrain for Flying creatures, and difficult terrain for creatures on the ground or Climbing. Any creature that ends its turn Flying within the area descends 20 feet. Any creature pushed into a surface by this spell's winds takes bludgeoning damage as though it had fallen.
    The squares at the outside vertical edges of the cylinder prevent creatures from leaving. These squares are greater difficult terrain, and a creature attempting to push through must succeed at an Athletics check or Acrobatics check to Maneuver in Flight against your spell DC to get through. A creature that fails ends its current action but can try again.
  properties:
    kind: "spell"
    rank: 8
    actions: "three"
    traits: ["air", "concentrate", "manipulate"]
    traditions: ["primal"]
    range: "100 feet"
    area: "30-foot radius, 100-foot-tall cylinder"
    duration: "sustained up to 1 minute"
- id: "pushing-gust"
  name: "Pushing Gust"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Giving the air a push, you buffet the target with a powerful gust of wind; it must attempt a Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target is pushed 5 feet away from you.
    **Failure.** The target is pushed 10 feet away from you.
    **Critical Failure.** The target is pushed 10 feet away from you and knocked prone.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "air", "cleric", "concentrate", "focus", "manipulate"]
    focusGroup: "Air"
    range: "500 feet"
    targets: "1 creature"
    defense: "Fortitude"
- id: "quandary"
  name: "Quandary"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You transport the target into an extraplanar puzzle room of mysterious origin, locking them there. Once each turn as a single action, the target can attempt an Occultism check, Perception check, or Thievery check against your spell DC to solve the puzzle. Teleportation effects can't carry the target outside the puzzle room unless they can also traverse the planes, such as interplanar teleport. When the spell ends, the target returns to the space it occupied when it was banished, or to the nearest space if the original is now filled.
    **Critical Success.** The target solves the puzzle and escapes.
    **Success.** The target is on the right path to the solution. If it was already on the right path, it solves the puzzle and escapes.
    **Failure.** The target makes no progress toward a solution.
    **Critical Failure.** The target makes no progress and, if it was on the right path, it no longer is.
  properties:
    kind: "spell"
    rank: 8
    actions: "two"
    traits: ["concentrate", "extradimensional", "manipulate", "teleportation"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    targets: "1 creature"
    duration: "sustained"
- id: "raise-dead"
  name: "Raise Dead"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You attempt to call forth the dead creature's soul, requiring the creature's body to be present and relatively intact. The creature must have died within the past 3 days. If the creature's time has come (at the GM's discretion), or if the creature doesn't wish to return to life, this spell automatically fails, but the cost isn't consumed in the casting.
    If the spell is successful, the creature returns to life with 1 Hit Point, no spells prepared or spell slots available, no points in any pools or any other daily resources, and still with any long-term debilitations of the old body. The time spent beyond death leaves the target temporarily debilitated, making it clumsy 2, drained 2, and enfeebled 2 for 1 week; these conditions can't be removed or reduced by any means until the week has passed. The creature is also permanently changed by its time in the afterlife, such as a slight personality shift, a streak of white in the hair, or a strange new birthmark.
    **Heightened (7th).** The maximum level of the target increases to 15. The cost increases to the target's level (minimum 1) × 400 gp.
    **Heightened (8th).** The maximum level of the target increases to 17. The cost increases to the target's level (minimum 1) × 800 gp.
    **Heightened (9th).** The maximum level of the target increases to 19. The cost increases to the target's level (minimum 1) × 1,600 gp.
    **Heightened (10th).** The maximum level of the target increases to 21. The cost increases to the target's level (minimum 1) × 3,200 gp.
  properties:
    kind: "spell"
    rank: 6
    traits: ["uncommon", "concentrate", "healing", "manipulate"]
    traditions: ["divine"]
    castTime: "10 minutes"
    cost: "gemstones worth a total value of the target's level (minimum 1) × 200 gp"
    range: "10 feet"
    targets: "1 dead creature of 13th level or lower"
- id: "rallying-anthem"
  name: "Rallying Anthem"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Your song moves allies to protect themselves more effectively. You and all allies in the area gain a +1 status bonus to AC and saving throws, as well as resistance equal to half the spell's rank to physical damage."
  properties:
    kind: "cantrip"
    rank: 2
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "concentrate", "emotion", "mental"]
    focusGroup: "Bard Composition Spells"
    area: "60-foot emanation"
    duration: "1 round"
- id: "ranger-s-bramble"
  name: "Ranger's Bramble"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You cause plants in the area to entangle your foes, with the effects of entangling flora. A creature that critically fails the save takes 2d4 persistent bleed damage in addition to being immobilized. Escaping your bramble doesn't end the bleed damage.
    **Heightened (+1).** The bleed damage on a critical failure increases by 1d4.
  properties:
    kind: "focus"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "manipulate", "plant", "ranger"]
    focusGroup: "Master Warden Spells"
    range: "100 feet"
    area: "all squares that contain plants in a 5-foot burst"
    duration: "1 minute"
- id: "read-aura"
  name: "Read Aura"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You focus on the target object, opening your mind to perceive magical auras. When the casting is complete, you know whether that item is magical. You or anyone you advise about the aura gains a +2 circumstance bonus to Identify Magic on the item. If the object is illusory, you detect this only if the effect's rank is lower than the rank of your read aura spell.
    **Heightened (3rd).** You can target up to 10 objects.
    **Heightened (6th).** You can target any number of objects.
  properties:
    kind: "cantrip"
    rank: 1
    traits: ["cantrip", "concentrate", "detection", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "1 minute"
    range: "30 feet"
    targets: "1 object"
- id: "read-fate"
  name: "Read Fate"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You attempt to learn more about the target's fate in the short term, usually within the next day for most prosaic creatures, or the next hour or less for someone likely to have multiple rapid experiences, such as someone actively adventuring.
    You learn a single enigmatic word connected to the creature's fate in that time frame. Fate is notoriously inscrutable, and the word isn't necessarily meant to be taken at face value, so the meaning is often clear only in hindsight. The GM rolls a secret DC 6 flat check. If the creature's fate is too uncertain, or on a failed flat check, the spell yields the word "inconclusive." Either way, the creature is then temporarily immune for 24 hours.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "prediction"]
    focusGroup: "Fate"
    range: "30 feet"
    targets: "1 creature other than you"
- id: "read-omens"
  name: "Read Omens"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You peek into the future. Choose a particular goal or activity you plan to engage in within 1 week, or an event you expect might happen within 1 week. You learn a cryptic clue or piece of advice that could help with the chosen event, often in the form of a rhyme or omen."
  properties:
    kind: "spell"
    rank: 4
    traits: ["uncommon", "concentrate", "manipulate", "prediction"]
    traditions: ["divine", "occult"]
    castTime: "10 minutes"
- id: "rebuke-death"
  name: "Rebuke Death"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You snatch creatures from the jaws of death, restoring them without the strain of a typical close call. You can spend 1 to 3 actions Casting this Spell, and you can target a number of creatures equal to the actions spent. Each target regains 3d6 Hit Points. If the target had the dying condition, coming back from dying due to this healing doesn't increase its wounded condition.
    **Heightened (+1).** Increase the healing by 1d6.
  properties:
    kind: "focus"
    rank: 4
    traits: ["uncommon", "cleric", "focus", "healing", "manipulate", "vitality"]
    focusGroup: "Healing"
    castTime: "1 to 3 actions"
    area: "20-foot emanation"
    targets: "1 living creature per action spent to Cast this Spell"
- id: "regenerate"
  name: "Regenerate"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    An infusion of vital energy grants a creature continuous healing. The target temporarily gains regeneration 15, which restores 15 Hit Points to it at the start of each of its turns. While it has regeneration, the target can't die from taking Hit Point damage and its dying condition can't increase to a value that would kill it (this stops most creatures' dying condition at dying 3), though if its wounded value becomes 4 or higher, it stays unconscious until its wounds are treated. If the target takes acid or fire damage, its regeneration deactivates until after the end of its next turn.
    Each time the creature regains Hit Points from regeneration, it also regrows one damaged or ruined organ (if any). During the spell's duration, the creature can also reattach severed body parts by spending an Interact action to hold the body part to the area it was severed from.
    **Heightened (9th).** The regeneration increases to 20.
  properties:
    kind: "spell"
    rank: 7
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    range: "touch"
    targets: "1 willing living creature"
    duration: "1 minute"
- id: "remake"
  name: "Remake"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You fully re-create an object from nothing, even if the object was destroyed. To do so, you must be able to picture the object in your mind. The remnant of the item can be small or insignificant (even a speck of dust that remains from disintegrate is enough). The spell fails if your imagination relied on too much guesswork; if the object would be too large to fit in a 5-foot cube; if the object still exists and you were simply not aware of it; or if the object is an artifact, has a level over 20, or has similar vast magical power.
    The item reassembles in perfect condition. Even if your mental image was of a damaged or weathered object, the new one is in this perfected form. If the object was magical, this spell typically restores its constant magical properties, but not any temporary ones, such as charges or one-time uses. An item with charges or uses per day has all of its uses expended when remade, but it replenishes them normally thereafter.
  properties:
    kind: "spell"
    rank: 10
    traits: ["uncommon", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    castTime: "1 hour"
    cost: "a remnant of the item"
    range: "5 feet"
- id: "repulsion"
  name: "Repulsion"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You manifest an aura that prevents creatures from approaching you. When casting the spell, you can make the area any radius you choose, up to 40 feet. A creature must attempt a Will save if it's within the area when you Cast the Spell or as soon as it enters the area while the spell is in effect. Once a creature has attempted the save, it uses the same result for that casting of repulsion. Any restrictions on a creature's movement apply only if it voluntarily moves toward you; if you move closer to a creature, it doesn't then need to move away.
    **Critical Success.** The creature's movement is not restricted.
    **Success.** The creature treats each square in the area as difficult terrain when moving closer to you.
    **Failure.** The creature can't move closer to you within the area.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["aura", "concentrate", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult"]
    area: "emanation up to 40 feet"
    defense: "Will"
    duration: "1 minute"
- id: "resist-energy"
  name: "Resist Energy"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A shield of elemental energy protects a creature against one type of energy damage. Choose acid, cold, electricity, fire, or sonic damage. The target and its gear gain resistance 5 against the damage type you chose.
    **Heightened (4th).** The resistance increases to 10, and you can target up to two creatures.
    **Heightened (7th).** The resistance increases to 15, and you can target up to five creatures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 creature"
    duration: "10 minutes"
- id: "restorative-moment"
  name: "Restorative Moment"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Lesson.** renewal
    Your patron weaves the threads of time around the target, giving them some of the benefits of a day's passage. The target decreases the values of any doomed and drained conditions it has by 1 and can immediately attempt one saving throw against each affliction it has with a stage length of 1 day or less. The target is then temporarily immune for 1 day.
  properties:
    kind: "focus"
    rank: 5
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "hex", "manipulate", "witch"]
    focusGroup: "Witch Hex Spells"
    range: "30 feet"
    targets: "1 creature"
- id: "resurrect"
  name: "Resurrect"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You attempt to call forth the target's soul and return it to its body. This requires the target's body to be present and relatively intact. The target must have died within the past year. If the target's time has come or the target doesn't wish to return, this ritual automatically fails, but you discover this after the successful Religion check and can end the ritual without paying the cost.
    **Critical Success.** You resurrect the target. They return to life with full Hit Points and the same spells prepared and points in their pools they had when they died, and still suffering from any long-term debilitations of the old body. The target meets an agent of their deity during the resurrection who inspires them, granting them a +1 status bonus to attack rolls, Perception, saving throws, and skill checks for 1 week. The target is also permanently changed in some way by their time in the afterlife, such as gaining a slight personality shift, a streak of white in the hair, or a strange new birthmark.
    **Success.** As critical success, except the target returns to life with 1 Hit Point and no spells prepared or points in any pools, and still is affected by any long-term debilitations of the old body. Instead of inspiring them, the character's time beyond death has left them temporarily debilitated. The target is clumsy 1, drained 1, and enfeebled 1 for 1 week; these conditions can't be removed or reduced by any means until the week has passed.
    **Failure.** Your attempt is unsuccessful.
    **Critical Failure.** Something goes horribly wrong—an evil spirit possesses the body, the body transforms into a special kind of undead, or some worse fate befalls the target.
    **Heightened (6th).** You can resurrect a target of up to 12th level, and the base cost is 125 gp.
    **Heightened (7th).** You can use resurrect even with only a small portion of the body; the ritual creates a new body on a success or critical success. The target must have died within the past decade. The ritual requires four secondary casters, each of whom must be at least half the target's level. The target can be up to 14th level, and the base cost is 200 gp.
    **Heightened (8th).** As 7th rank, but the target can be up to 16th level and the base cost is 300 gp.
    **Heightened (9th).** You can use resurrect even without the body as long as you know the target's name and have touched a portion of its body at any time. The target must have died within the past century, and it doesn't gain the negative conditions on a success. The ritual requires eight secondary casters, each of whom must be at least half the target's level. The target can be up to 18th level, and the base cost is 600 gp.
    **Heightened (10th).** As 9th rank, except it doesn't matter how long ago the target died. The ritual requires 16 secondary casters, each of whom must be at least half the target's level. The target can be up to 20th level, and the ritual's base cost is 1,000 gp.
  properties:
    kind: "ritual"
    rank: 5
    traits: ["uncommon", "healing"]
    castTime: "1 day"
    cost: "gemstones worth a total value of 75 gp × the target's level"
    secondaryCasters: "2"
    primaryCheck: "Religion (expert)"
    secondaryChecks: "Medicine, Society"
    range: "10 feet"
    targets: "1 dead creature of up to 10th level"
- id: "retributive-pain"
  name: "Retributive Pain"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "You vengefully reflect your pain upon your tormentor. The target takes mental damage equal to half the triggering damage."
  properties:
    kind: "focus"
    rank: 4
    actions: "reaction"
    traits: ["uncommon", "cleric", "focus", "manipulate", "mental", "nonlethal"]
    focusGroup: "Pain"
    trigger: "A creature in range damages you."
    range: "30 feet"
    targets: "the triggering creature"
    defense: "basic Fortitude"
- id: "retrocognition"
  name: "Retrocognition"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Opening your mind to mental echoes, you gain impressions from past events that occurred in your current location. Retrocognition reveals psychic impressions from events that occurred over the course of the last day throughout the first minute of the duration, followed by impressions from the next day back the next minute, and so on. These echoes don't play out like a vision but instead reveal impressions of emotions and metaphors that provide cryptic clues and details of the past. If you witness a traumatic or turbulent event through an impression, the spell ends unless you succeed at a Will save with a DC of at least 30 and possibly as much as 50, depending on the severity of the event. The GM determines whether an event is traumatic and chooses the DC.
    **Heightened (8th).** You gain impressions of events that occurred over the previous year for each minute you concentrate, instead of the previous day, though the details diminish, making it harder to distinguish impressions from all but the most major events.
    **Heightened (9th).** You gain impressions of events that occurred over the previous century for each minute you concentrate, instead of the previous day, though the details diminish, making it almost impossible to distinguish impressions from all but the most major events.
  properties:
    kind: "spell"
    rank: 7
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult"]
    castTime: "1 minute"
    duration: "sustained"
- id: "revealing-light"
  name: "Revealing Light"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A wave of magical light washes over the area. You choose the appearance of the light, such as colorful, heatless flames or sparkling motes. A creature affected by revealing light is dazzled. If the creature was invisible, it becomes concealed instead. If the creature was already concealed for any other reason, it is no longer concealed.
    **Critical Success.** The target is unaffected.
    **Success.** The light affects the creature for 2 rounds.
    **Failure.** The light affects the creature for 1 minute.
    **Critical Failure.** The light affects the creature for 10 minutes.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "light", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "120 feet"
    area: "10-foot burst"
    defense: "Reflex"
    duration: "varies"
- id: "revival"
  name: "Revival"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "A burst of healing energy soothes living creatures and temporarily rouses those recently slain. All living targets regain 10d8+40 Hit Points. You return any number of dead targets to life temporarily, with the same effects and limitations as raise dead. The raised creatures have a number of temporary Hit Points equal to the Hit Points you gave living creatures, but no normal Hit Points. The raised creatures can't regain Hit Points or gain temporary Hit Points in other ways, and once revival's duration ends, they lose all temporary Hit Points and die. Revival can't resurrect creatures killed by disintegrate or a death effect. It has no effect on undead."
  properties:
    kind: "spell"
    rank: 10
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "vitality"]
    traditions: ["divine", "primal"]
    range: "30 feet"
    targets: "dead creatures and living creatures of your choice within range"
    duration: "sustained up to 1 minute"
- id: "rewrite-memory"
  name: "Rewrite Memory"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You alter the target's memories by erasing a memory, enhancing a memory's clarity, altering a memory, or adding a false memory. The target can attempt a Will save to resist the spell.
    **Critical Success.** The target is unaffected and realizes you tried to alter its memory.
    **Success.** The target is unaffected but thinks your spell was something harmless instead of rewrite memory, unless it identifies the spell.
    **Failure.** During the first 5 minutes of the spell's duration, you can Sustain the spell to modify a memory once each round. When you do, you imagine up to 6 seconds of memory to modify, to a maximum of 5 continuous minutes of memory. Any memories you've altered remain changed as long as the spell is active. If the target moves out of range before the 5 minutes is up, you can't alter any further memories.
    **Heightened (6th).** You can Cast the Spell on a willing target to suppress all memory of a particular topic, detailed in 50 words or fewer. The effect is permanent, and it patches these omissions with an indistinct haze.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate", "mental"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "unlimited"
- id: "ring-of-truth"
  name: "Ring of Truth"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You designate an area in which lies are revealed. Creatures in the area also take a -2 status penalty to Deception checks. Each time a creature in the area speaks a true statement, the soft ring of a bell sounds in the area. Creatures are aware of the magic; therefore, they can avoid answering questions to which they would normally respond with a lie, or they can be evasive as long as they remain within the boundaries of the truth. If a creature is in the area when the spell is cast or later enters the area, that creature attempts a Will save. It uses the results of this initial save if it leaves and reenters the area.
    **Critical Success.** The target is so convincing that the bell rings even if they lie.
    **Success.** If the target lies and succeeds at their Deception check against all targets, the bell still rings.
    **Failure.** The bell accurately sees through their deception and will never ring if they lie.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["uncommon", "concentrate", "detection", "manipulate", "mental"]
    traditions: ["divine", "occult"]
    range: "30 feet"
    area: "20-foot burst"
    defense: "Will"
    duration: "10 minutes"
- id: "rune-of-observation"
  name: "Rune of Observation"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You inscribe an invisible eye-shaped rune in the air, creating a sensor as clairvoyance. When created, this eye must be in your line of sight.
    Each time the spell's duration ends, you can spend 1 Focus Point as a free action to extend the duration for another hour, though as normal, it ends immediately during your next daily preparations.
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "wizard"]
    focusGroup: "Ars Grammatica"
    range: "500 feet"
    duration: "1 hour"
- id: "rune-trap"
  name: "Rune Trap"
  source: "pc > Chapter 7: Spells > Spell Lists > Rituals > Rituals"
  description: |-
    You create a magical trap by binding a hostile spell into a rune. As part of performing this ritual, you also Cast a Spell to store in the rune. The stored spell must take 3 actions or fewer to cast, have a hostile effect, and target one creature or have an area. You can set a password, a trigger, or both for the rune. Any creature that moves, opens, or touches the target container or enters the target area that doesn't speak the password or that matches the trigger activates the rune, releasing the harmful spell within.
    Once a spell is stored in the rune, the rune gains all the traits of that spell. If the stored spell targets one or more creatures, it targets the creature that set off the rune. If it has an area, that area is centered on the creature that set off the rune. The rune is a magical trap, using your spell DC for both the Perception check to notice it and the Thievery check to disable it; both checks require the creature attempting them to be trained in order to succeed. You can Dismiss the rune you create with this ritual so long as you can see it.
    **Critical Success.** You create a particularly effective rune, granting a +2 circumstance bonus to the DC to notice and disable the rune.
    **Success.** You create the rune successfully.
    **Failure.** You fail to create the rune.
    **Critical Failure.** The rune backfires, dealing 4d6 force damage per rank of the rune's spell to you, the secondary caster, and all creatures within 10 feet of the ritual's area.
  properties:
    kind: "ritual"
    rank: 3
    traits: ["uncommon"]
    castTime: "1 hour"
    cost: "pigments and oils worth a total value of 5 gp × the rank of the spell to be stored"
    secondaryCasters: "1"
    primaryCheck: "Arcana (expert), Nature (expert), Occultism (expert), or Religion (expert) as determined by the tradition of spell cast in the ritual"
    secondaryChecks: "Crafting"
    range: "touch"
    targets: "1 object or a 10-foot-by-10-foot area"
- id: "runic-body"
  name: "Runic Body"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Glowing runes appear on the target's body. All its unarmed attacks become +1 striking unarmed attacks, gaining a +1 item bonus to attack rolls and increasing the number of damage dice to two.
    **Heightened (6th).** The unarmed attacks are +2 greater striking.
    **Heightened (9th).** The unarmed attacks are +3 major striking.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "runic-weapon"
  name: "Runic Weapon"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The weapon glimmers with magic as temporary runes carve down its length. The target becomes a +1 striking weapon, gaining a +1 item bonus to attack rolls and increasing the number of weapon damage dice to two.
    **Heightened (6th).** The weapon is +2 greater striking.
    **Heightened (9th).** The weapon is +3 major striking.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 weapon that is unattended or wielded by a willing creature"
    duration: "1 minute"
- id: "safe-passage"
  name: "Safe Passage"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You make passage through the area safe for a brief amount of time. Anyone passing through the area gains the following benefits against harmful effects of the terrain and environment, including environmental damage, hazardous terrain, and hazards in the area. The spell grants a +2 status bonus to AC and saves against such effects, and resistance 5 to all damage from such effects. Furthermore, the spell prevents anything in the area that's prone to collapse, such as a rickety bridge or an unstable ceiling, from collapsing, except under extreme strain that would collapse a normal structure of its type.
    Safe passage protects only against harm, not inconvenience, and it doesn't reduce difficult terrain, remove the concealed condition caused by precipitation, or the like, nor does it protect against creatures within the spell's area.
    **Heightened (5th).** The granted resistance increases to 10, and the area can be 120 feet long.
    **Heightened (8th).** The granted resistance increases to 15, and the area can be 500 feet long.
  properties:
    kind: "spell"
    rank: 3
    actions: "three"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "divine", "primal"]
    range: "touch"
    area: "10-foot-wide, 10-foot-tall, 60-foot-long section of terrain"
    duration: "sustained up to 1 minute"
- id: "safeguard-secret"
  name: "Safeguard Secret"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You ensure a secret remains safe from prying spies. Choose one piece of information that at least some of the targets know, such as "the location of the stolen treasure" or "the password to enter the guild house." The spell grants those who know the piece of knowledge you have chosen a +4 status bonus to skill checks (typically Deception checks) to conceal this knowledge, to saving throws against spells that specifically attempt to obtain this knowledge from them, and to effects that would force them to reveal it.
    If you Cast this Spell again, any previous safeguard secret you had cast ends.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "focus", "manipulate", "mental"]
    focusGroup: "Secrecy"
    range: "30 feet"
    targets: "you and any number of willing allies"
    duration: "1 hour"
- id: "sanctuary"
  name: "Sanctuary"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You ward a creature with protective energy that deters attacks. Creatures attempting to attack the target must attempt a Will save each time. If the target uses a hostile action, the spell ends.
    **Critical Success.** Sanctuary ends.
    **Success.** The creature can attempt its attack and any other attacks against the target this turn.
    **Failure.** The creature can't attack the target and wastes the action. It can't attempt further attacks against the target this turn.
    **Critical Failure.** The creature wastes the action and can't attempt to attack the target for the rest of sanctuary's duration.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["divine", "occult"]
    range: "touch"
    targets: "1 creature"
    duration: "1 minute"
- id: "savor-the-sting"
  name: "Savor the Sting"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You inflict pain upon the target and revel in their anguish. This deals 1d4 mental damage and 1d4 persistent mental damage; the target must attempt a Will save. As long as the target is taking persistent damage from this spell, you gain a +1 status bonus to attack rolls and skill checks against the target.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes half damage and no persistent damage.
    **Failure.** The target takes full initial and persistent damage.
    **Critical Failure.** The target takes double initial and persistent damage.
    **Heightened (+1).** The initial damage increases by 1d4 and the persistent damage increases by 1d4.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "focus", "manipulate", "mental", "nonlethal"]
    focusGroup: "Pain"
    range: "touch"
    targets: "1 creature"
    defense: "Will"
- id: "scholarly-recollection"
  name: "Scholarly Recollection"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Speaking a short prayer as you gather your thoughts, you're blessed to find yourself pointed in the right direction. The GM rolls the triggering check twice and uses the better result."
  properties:
    kind: "focus"
    rank: 1
    actions: "reaction"
    traits: ["uncommon", "cleric", "concentrate", "focus", "fortune"]
    focusGroup: "Knowledge"
    trigger: "You attempt a Perception check to Seek, or you attempt a skill check to Recall Knowledge with a skill you're trained in."
- id: "scouting-eye"
  name: "Scouting Eye"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create an invisible, floating eye, 1 inch in diameter, at a location you can see within 500 feet. It sees in all directions with your normal visual senses and continuously transmits what it sees to you.
    The first time you Sustain the spell each round, you can either move the eye up to 30 feet, seeing only things in front of the eye, or move it up to 10 feet, seeing everything in all directions around it. There is no limit to how far from you the eye can move, but the spell ends immediately if you and the eye ever cease to be on the same plane of existence. You can attempt Seek actions through the eye if you want to attempt Perception checks with it. Any damage dealt to the eye destroys it and ends the spell.
  properties:
    kind: "spell"
    rank: 5
    traits: ["concentrate", "manipulate", "scrying"]
    traditions: ["arcane", "divine", "occult"]
    castTime: "1 minute"
    range: "see text"
    duration: "sustained"
- id: "scramble-body"
  name: "Scramble Body"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your magic throws the creature's biology into disarray, inducing nausea, fever, and other unpleasant conditions.
    **Success.** The target is unaffected.
    **Failure.** The target becomes sickened 1.
    **Critical Failure.** The target becomes sickened 2 and slowed 1 as long as it's sickened.
  properties:
    kind: "focus"
    rank: 1
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "manipulate", "wizard"]
    focusGroup: "Protean Form"
    range: "30 feet"
    targets: "1 living creature"
    defense: "Fortitude"
- id: "scrying-spell"
  name: "Scrying"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You magically spy on a creature of your choice. Scrying works like clairvoyance, except that the image you receive is less precise, insufficient for teleport and similar spells. Instead of creating an eye in a set location within 500 feet, you instead create an eye that manifests just above the target. You can choose a target either by name or by touching one of its possessions or a piece of its body. If you haven't met the target in person, scrying's DC is 2 lower, and if you are unaware of the target's identity (perhaps because you found an unknown creature's fang at a crime scene), the DC is instead 10 lower.
    The effect of scrying depends on the target's Will save.
    **Critical Success.** The spell fails and the target is temporarily immune for 1 week. The target also gains a glimpse of you and learns its rough distance and direction from you.
    **Success.** The spell fails and the target is temporarily immune for 1 day.
    **Failure.** The spell succeeds.
    **Critical Failure.** The spell succeeds, and the eye follows the target if it moves, traveling up to 60 feet per round.
  properties:
    kind: "spell"
    rank: 6
    traits: ["uncommon", "concentrate", "manipulate", "scrying"]
    traditions: ["arcane", "occult"]
    castTime: "10 minutes"
    range: "planetary"
    targets: "1 creature"
    defense: "Will"
    duration: "sustained up to 10 minutes"
- id: "see-the-unseen"
  name: "See the Unseen"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Your gaze pierces through illusions and finds invisible creatures and spirits. You can see invisible creatures as though they weren't invisible, although their features are blurred, making them concealed and difficult to identify. You can also see incorporeal creatures, like ghosts, phased through an object from within 10 feet of an object's surface as blurry shapes seen through those objects. Subtler clues also grant you a +2 status bonus to checks you make to disbelieve illusions.
    **Heightened (5th).** This spell has a duration of 8 hours.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "revelation"]
    traditions: ["arcane", "divine", "occult"]
    duration: "10 minutes"
- id: "seize-soul"
  name: "Seize Soul"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You trap the target's soul in the item before the soul can pass on to the afterlife. The item used to contain the soul can be anything as long as it's of the appropriate value. The item has AC 16 and its normal Hardness and HP. Destroying (not just breaking) an item or counteracting seize soul releases the soul to the afterlife. While the soul is in the item, the target can't be returned to life through any means, even powerful magic such as a wish ritual. If the item is destroyed or seize soul is counteracted on the item, the soul is freed. An item can't hold more than one soul, and any attempt wastes the spell.
    You can also target an item that has had a soul trapped in it with a second casting of seize soul, which destroys the item and either releases the soul or relocates it to a different item, whichever you choose. This fails if the target is an artifact or the trapped soul is a creature of 19th level or higher.
  properties:
    kind: "spell"
    rank: 9
    actions: "two"
    traits: ["uncommon", "concentrate", "manipulate", "unholy"]
    traditions: ["divine", "occult"]
    requirements: "item worth at least the target's level × 100 gp"
    range: "30 feet"
    targets: "1 creature that died within the last minute"
    duration: "unlimited"
- id: "sending"
  name: "Sending"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You send the creature a mental message of 25 words or fewer, and it can respond immediately with its own message of 25 words or fewer."
  properties:
    kind: "spell"
    rank: 5
    actions: "three"
    traits: ["concentrate", "manipulate", "mental"]
    traditions: ["arcane", "divine", "occult"]
    range: "planetary"
    targets: "1 creature you know well"
- id: "shadow-blast"
  name: "Shadow Blast"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shape shadow substance into a blast. Choose acid, bludgeoning, cold, electricity, fire, force, piercing, slashing, sonic, or spirit damage, and choose a 30-foot cone, a 15-foot burst within 120 feet, or a 50-foot line. The blast deals 6d8 damage of the type you chose to each creature in the area.
    **Heightened (+1).** The damage increases by 1d8.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "shadow"]
    traditions: ["divine", "occult"]
    range: "varies"
    area: "varies"
    defense: "basic Reflex or Will (target's choice)"
- id: "shape-stone"
  name: "Shape Stone"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You shape the stone into a rough shape of your choice. The shaping process is too crude to produce intricate parts, fine details, moving pieces, or the like. Any creatures standing atop the stone when you reshape it must each attempt a Reflex save or Acrobatics check.
    **Success.** The creature is unaffected.
    **Failure.** The creature falls prone atop the stone.
    **Critical Failure.** The creature falls off the stone (if applicable) and lands prone.
  properties:
    kind: "spell"
    rank: 4
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "cube of stone 10 feet across or smaller"
- id: "shape-wood"
  name: "Shape Wood"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You shape the wood into a rough shape of your choice. The shaping power is too crude to produce with intricate parts, fine details, moving pieces, or the like. You can't use this spell to enhance the value of the wooden object you are shaping."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "an unworked piece of wood up to 20 cubic feet in volume"
- id: "share-life"
  name: "Share Life"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You forge a temporary link between the target's life essence and your own. The target takes half damage from all effects that deal Hit Point damage, and you take the remainder of the damage. When you take damage through this link, you don't apply any resistances, weaknesses, or other abilities you have to that damage; you simply take that amount of damage. The spell ends if the target is ever more than 30 feet away from you. If either you or the target is reduced to 0 Hit Points, any damage from this spell is resolved and then the spell ends."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["divine"]
    range: "30 feet"
    targets: "1 creature"
    duration: "10 minutes"
- id: "shared-nightmare"
  name: "Shared Nightmare"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Merging minds with the target, you swap distressing visions. One of you will become confused, based on the target's Will save.
    **Critical Success.** You are confused for 1 round.
    **Success.** At the start of your next turn, you spend your first action with the confused condition, then act normally.
    **Failure.** The target spends the first action of each of its turns confused. The duration is 1 minute.
    **Critical Failure.** The target is confused. The duration is 1 minute.
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "cleric", "concentrate", "emotion", "focus", "incapacitation", "manipulate", "mental"]
    focusGroup: "Nightmares"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "varies"
- id: "shatter"
  name: "Shatter"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A high-frequency sonic attack shatters a nearby object. You deal 2d10 sonic damage to the object, ignoring the object's Hardness if it is 4 or lower.
    **Heightened (+1).** The damage increases by 1d10, and the Hardness the spell ignores increases by 2.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "sonic"]
    traditions: ["occult", "primal"]
    range: "30 feet"
    targets: "1 unattended object"
- id: "shield"
  name: "Shield"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You raise a magical shield of force. This counts as using the Raise a Shield action, giving you a +1 circumstance bonus to AC until the start of your next turn, but it doesn't require a hand to use.
    While the spell is in effect, you can use the Shield Block reaction with your magic shield. The shield has Hardness 5. You can use the spell's reaction to reduce damage from any spell or magical effect, even if it doesn't deal physical damage. After you use Shield Block, the spell ends and you can't cast it again for 10 minutes.
    **Heightened (+2).** The shield's Hardness increases by 5.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["cantrip", "concentrate", "force"]
    traditions: ["arcane", "divine", "occult"]
    duration: "until the start of your next turn"
- id: "shifting-form"
  name: "Shifting Form"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You change your body to better suit the moment. You gain one of the following abilities of your choice. You can Dismiss this spell.
    • You gain a 20-foot status bonus to your Speed.
    • You gain a climb or swim Speed equal to half your Speed.
    • You gain darkvision.
    • You gain a pair of claws. These are agile finesse unarmed attacks that deal 1d8 slashing damage.
    • You gain scent 60 feet (imprecise).
  properties:
    kind: "focus"
    rank: 4
    actions: "one"
    traits: ["uncommon", "concentrate", "focus", "morph", "wizard"]
    focusGroup: "Protean Form"
    duration: "1 minute"
- id: "shrink"
  name: "Shrink"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You warp space to make a creature smaller. The target shrinks to become Tiny in size. Its equipment shrinks with it but returns to its original size if removed. The creature's reach changes to 0 feet. This spell has no effect on a Tiny creature.
    **Heightened (6th).** The spell can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "polymorph"]
    traditions: ["arcane", "primal"]
    range: "30 feet"
    targets: "1 willing creature"
    duration: "5 minutes"
- id: "shroud-of-night"
  name: "Shroud of Night"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    Your patron blankets the target's eyes in darkness. If you cast this hex on a willing ally (for instance, one with light blindness), the ally can choose which result it gets without rolling.
    **Success.** The target is unaffected.
    **Failure.** The target is shrouded in murky darkness. It treats bright light as dim light, and unless it has greater darkvision, all creatures are concealed to it.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cantrip", "darkness", "hex", "manipulate", "witch"]
    focusGroup: "Patron Hex Cantrips"
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
    duration: "sustained up to 1 minute"
- id: "sigil"
  name: "Sigil"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You harmlessly place your unique magical sigil, which is about 1 square inch in size, on the targeted creature or object. The mark can be visible or invisible, and you can change it from one state to another by using an Interact action to touch the target. The mark can be scrubbed or scraped off with 5 minutes of work. If it's on a creature, it fades naturally over the course of a week. The time before the mark fades increases depending on your heightened rank.
    **Heightened (3rd).** The sigil instead fades after 1 month.
    **Heightened (5th).** The sigil instead fades after 1 year.
    **Heightened (7th).** The sigil never fades.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "manipulate"]
    traditions: ["arcane", "divine", "occult", "primal"]
    range: "touch"
    targets: "1 creature or object"
    duration: "unlimited (see below)"
- id: "silence"
  name: "Silence"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    The target makes no sound, preventing creatures from noticing it using hearing alone. The target can't use sonic attacks, nor can it use auditory actions. This also prevents the target from casting spells due to the magical words involved in casting, with the exception of subtle spells.
    **Heightened (4th).** The spell creates an aura in a 10-foot emanation around the touched creature, silencing all sound in or passing through it. While within the aura, creatures are subject to the same effects as the target. Depending upon the position of the effect, a creature might notice the lack of sound reaching it (blocking off the noise coming from a party, for example).
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["illusion", "manipulate", "subtle"]
    traditions: ["divine", "occult"]
    range: "touch"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "sleep-spell"
  name: "Sleep"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    Each creature in the area becomes drowsy, possibly nodding off. A creature that falls unconscious from this spell doesn't fall prone or release what it's holding. This spell doesn't prevent creatures from waking up due to a successful Perception check, limiting its utility in combat.
    **Critical Success.** The creature is unaffected.
    **Success.** The creature takes a -1 status penalty to Perception checks for 1 round.
    **Failure.** The creature falls unconscious. If it's still unconscious after 1 minute, it wakes up automatically.
    **Critical Failure.** The creature falls unconscious. If it's still unconscious after 1 hour, it wakes up automatically.
    **Heightened (4th).** The creatures fall unconscious for 1 round on a failure or 1 minute on a critical failure. They fall prone and release what they're holding, and they can't attempt Perception checks to wake up. When the duration ends, the creature is sleeping normally instead of automatically waking up.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "incapacitation", "manipulate", "mental", "sleep"]
    traditions: ["arcane", "occult"]
    range: "30 feet"
    area: "5-foot burst"
    defense: "Will"
- id: "slither"
  name: "Slither"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A mass of snakes made of shadow rise up to capture creatures in the area. Each creature in the area when you Cast the Spell takes 3d6 piercing damage and 1d6 persistent poison damage from a biting snake, and it's grabbed or restrained depending on its Reflex save. A creature that ends its turn in the area must also attempt this save, even if it's already grabbed or restrained by the snakes. You can Dismiss the spell.
    **Success.** The creature is unaffected.
    **Failure.** The creature takes full damage and is grabbed by a snake. The snakes' Escape DC is equal to your spell DC. A creature can attack a snake to release the creature. A snake's AC is equal to your spell DC, and it's destroyed if it takes 12 or more damage at once. New snakes continually regrow as long as the spell lasts, so destroying snakes doesn't prevent slither from capturing more creatures.
    **Critical Failure.** As failure, but the creature takes double damage and is restrained by a snake.
    **Heightened (+2).** The persistent poison damage increases by 1d6 and snake HP increases by 6.
  properties:
    kind: "spell"
    rank: 5
    actions: "three"
    traits: ["concentrate", "manipulate", "shadow"]
    traditions: ["arcane", "occult"]
    range: "120 feet"
    area: "20-foot burst"
    defense: "Reflex"
    duration: "1 minute"
- id: "slow"
  name: "Slow"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You dilate the flow of time around the target, slowing its actions.
    **Critical Success.** The target is unaffected.
    **Success.** The target is slowed 1 for 1 round.
    **Failure.** The target is slowed 1 for 1 minute.
    **Critical Failure.** The target is slowed 2 for 1 minute.
    **Heightened (6th).** You can target up to 10 creatures.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["arcane", "occult", "primal"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Fortitude"
    duration: "varies"
- id: "song-of-marching"
  name: "Song of Marching"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You maintain a brisk performance that keeps allies on the move. You and your allies in the area can Hustle for the spell's duration, in addition to your other exploration activities (your exploration activity is Sustaining this spell). You and your allies then become temporarily immune for 1 day.
    If you enter an encounter while performing this song, you can use your Performance modifier for the initiative roll. You and your affected allies also receive a +1 status bonus to that initiative roll.
    **Heightened (6th).** You can Sustain the Spell for up to 2 hours.
    **Heightened (9th).** You can Sustain the Spell for up to 4 hours.
  properties:
    kind: "cantrip"
    rank: 3
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "concentrate", "mental"]
    focusGroup: "Bard Composition Spells"
    area: "60-foot emanation"
    duration: "sustained up to 1 hour"
- id: "song-of-strength"
  name: "Song of Strength"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    **Muse.** warrior
    You bolster your allies' physical strength with a hearty exhortation. You and your allies gain a +1 status bonus to Athletics checks and to their DCs against Athletics skill actions such as Disarm, Reposition, Shove, and Trip.
  properties:
    kind: "cantrip"
    rank: 1
    actions: "one"
    traits: ["uncommon", "bard", "cantrip", "composition", "concentrate", "emotion", "mental"]
    focusGroup: "Bard Composition Spells"
    area: "60-foot emanation"
    duration: "1 round"
- id: "soothe"
  name: "Soothe"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You grace the target's mind, boosting its mental defenses and healing its wounds. The target regains 1d10+4 Hit Points when you Cast the Spell and gains a +2 status bonus to saves against mental effects for the duration.
    **Heightened (+1).** The amount of healing increases by 1d10+4.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "emotion", "healing", "manipulate", "mental"]
    traditions: ["occult"]
    range: "30 feet"
    targets: "1 willing creature"
    duration: "1 minute"
- id: "soothing-ballad"
  name: "Soothing Ballad"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You draw upon your muse to soothe your allies. Choose one of the following three effects:
    • The spell attempts to counteract fear effects on the targets.
    • The spell attempts to counteract effects imposing paralysis on the targets.
    • The spell restores 7d8 Hit Points to the targets.
    **Heightened (+1).** When used to heal, soothing ballad restores 1d8 more Hit Points.
  properties:
    kind: "focus"
    rank: 7
    actions: "two"
    traits: ["uncommon", "bard", "composition", "concentrate", "emotion", "focus", "healing", "manipulate", "mental"]
    focusGroup: "Bard Composition Spells"
    range: "30 feet"
    targets: "you and up to 9 allies"
- id: "soothing-mist"
  name: "Soothing Mist"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You call forth a magical mist that envelops a creature. The mist restores 2d8 Hit Points to a target living creature and ends one source of persistent acid, bleed, fire, poison, or void damage affecting it. If the creature is taking persistent damage from multiple sources, you select which one is removed. Against an undead target, you deal 2d8 vitality damage (basic Fortitude save); if it fails the save, it also takes 2 persistent vitality damage.
    **Heightened (+1).** The amount of healing (or damage to an undead target) increases by 1d8, and the persistent vitality damage to an undead creature increases by 1.
  properties:
    kind: "focus"
    rank: 2
    actions: "two"
    traits: ["uncommon", "concentrate", "focus", "healing", "manipulate", "ranger", "vitality"]
    focusGroup: "Advanced Warden Spells"
    range: "30 feet"
    targets: "1 willing living creature or 1 undead creature"
- id: "soothing-words"
  name: "Soothing Words"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: |-
    You attempt to calm the target by uttering soothing words in a calm and even tone. The target gains a +1 status bonus to Will saving throws. This bonus increases to +2 against emotion effects.
    In addition, when you Cast this Spell, you can attempt to counteract one emotion effect on the target.
    **Heightened (5th).** The bonus to saves increases to +2, or +3 against emotion effects.
  properties:
    kind: "focus"
    rank: 1
    actions: "one"
    traits: ["uncommon", "cleric", "concentrate", "emotion", "focus", "mental"]
    focusGroup: "Family"
    range: "30 feet"
    targets: "1 ally"
    duration: "1 minute"
- id: "sound-body"
  name: "Sound Body"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You send a surge of healing energy to restore the target's body. Attempt to counteract an effect of your choice imposing one of these conditions on the target: blinded, dazzled, deafened, enfeebled, or sickened. If you didn't counteract the effect, but you would have if its counteract rank were 2 lower, instead suppress the effect until the beginning of your next turn. The effect's duration doesn't elapse while it's suppressed. This spell can't counteract or suppress curses, diseases, or conditions that are part of the target's normal state.
    **Heightened (4th).** Add drained and slowed to the list of conditions.
    **Heightened (6th).** As 4th rank, plus add petrified.
    **Heightened (8th).** As 4th rank, plus add petrified and stunned.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "vitality"]
    traditions: ["divine", "occult", "primal"]
    range: "touch"
    targets: "1 willing creature"
- id: "speak-with-animals"
  name: "Speak With Animals"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "You can ask questions of, receive answers from, and use the Diplomacy skill with animals. The spell doesn't make them more friendly than normal. Cunning animals are likely to be terse and evasive, while less intelligent ones often make inane comments."
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate"]
    traditions: ["primal"]
    duration: "1 hour"
- id: "speak-with-plants"
  name: "Speak With Plants"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You can ask questions of and receive answers from plants and fungi, but the spell doesn't make them more friendly or intelligent than normal. Most normal plants and fungi have a distinctive view of the world around them, so they don't recognize details about creatures or know anything about the world beyond their immediate vicinity. Cunning plant or fungus monsters are likely to be terse and evasive, while less intelligent ones often make inane comments.
    **Heightened (4th).** The duration is 8 hours.
  properties:
    kind: "spell"
    rank: 3
    actions: "two"
    traits: ["concentrate", "manipulate", "plant", "wood"]
    traditions: ["divine", "occult", "primal"]
    duration: "1 hour"
- id: "speak-with-stones"
  name: "Speak With Stones"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You can ask questions of and receive answers from natural or worked stone. While stone is not intelligent, you speak with the natural spirits of the stone, which have a personality colored by the type of stone, as well as by the type of structure the stone is part of, for worked stone. A stone's perspective, perception, and knowledge give it a worldview different enough from a human's that it doesn't consider the same details important. Stones can mostly answer questions about creatures that touched them in the past and what is concealed beneath or behind them.
    **Heightened (6th).** The duration is 8 hours.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "earth", "manipulate"]
    traditions: ["divine", "occult", "primal"]
    duration: "1 hour"
- id: "spellwrack"
  name: "Spellwrack"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You cause any spells cast on the target to spill out their energy in harmful surges. The target must attempt a Will save.
    **Critical Success.** The target is unaffected.
    **Success.** Whenever the target becomes affected by a spell with a duration, the target takes 2d12 persistent force damage. Each time it takes persistent force damage from spellwrack, it reduces the remaining duration of spells affecting it by 1 round. Only a successful Arcana check against your spell DC can help the target recover from the persistent damage; the curse and the persistent damage end after 1 minute.
    **Failure.** As success, but the curse and persistent damage do not end on their own.
    **Critical Failure.** As failure, but the persistent force damage is 4d12.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "curse", "force", "manipulate"]
    traditions: ["arcane", "divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "Will"
- id: "spider-sting"
  name: "Spider Sting"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You magically duplicate a spider's venomous sting. You deal 1d4 piercing damage to the touched creature and afflict it with spider venom. The target must attempt a Fortitude save.
    **Critical Success.** The target is unaffected.
    **Success.** The target takes 1d4 poison damage.
    **Failure.** The target is afflicted with spider venom at stage 1.
    **Critical Failure.** The target is afflicted with spider venom at stage 2.
    Spider Venom (poison) Level 1; Maximum Duration 4 rounds; Stage 1 1d4 poison damage and enfeebled 1 (1 round); Stage 2 1d4 poison damage and enfeebled 2 (1 round)
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "manipulate", "poison"]
    traditions: ["arcane", "primal"]
    range: "touch"
    targets: "1 creature"
    defense: "Fortitude"
- id: "spiral-of-horrors"
  name: "Spiral of Horrors"
  source: "pc > Chapter 7: Spells > Spell Lists > Focus Spells"
  description: "Shades and spirits howl and whirl around you in a display that strikes fear into the hearts of all who witness it. Enemies in the area are frightened 1 and can't reduce their frightened value below 1 for the spell's duration."
  properties:
    kind: "focus"
    rank: 4
    actions: "two"
    traits: ["uncommon", "aura", "concentrate", "emotion", "fear", "focus", "manipulate", "mental", "wizard"]
    focusGroup: "The Boundary"
    area: "30-foot emanation"
    duration: "sustained up to 1 minute"
- id: "spirit-blast"
  name: "Spirit Blast"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You concentrate ethereal energy and attack a creature's spirit, dealing 16d6 spirit damage with a basic Fortitude save.
    **Heightened (+1).** The damage increases by 2d6.
  properties:
    kind: "spell"
    rank: 6
    actions: "two"
    traits: ["concentrate", "manipulate", "spirit"]
    traditions: ["divine", "occult"]
    range: "30 feet"
    targets: "1 creature"
    defense: "basic Fortitude"
- id: "spirit-link"
  name: "Spirit Link"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You form a spiritual link with another creature, taking in its pain. When you Cast this Spell and at the start of each of your turns, if the target is below maximum Hit Points, it regains 2 Hit Points (or the difference between its current and maximum Hit Points, if that's lower). You lose as many Hit Points as the target regained. This is a spiritual transfer, so no effects apply that would increase the Hit Points the target regains or decrease the Hit Points you lose. This transfer also ignores any temporary Hit Points you or the target have. Since this effect doesn't involve vitality or void energy, spirit link works even if you or the target is undead. While the duration persists, you gain no benefit from regeneration or fast healing. You can Dismiss this spell, and if you're ever at 0 Hit Points, spirit link ends automatically.
    **Heightened (+1).** The number of Hit Points transferred each time increases by 2.
  properties:
    kind: "spell"
    rank: 1
    actions: "two"
    traits: ["concentrate", "healing", "manipulate", "spirit"]
    traditions: ["divine", "occult"]
    range: "30 feet"
    targets: "1 willing creature"
    duration: "10 minutes"
- id: "spiritual-armament"
  name: "Spiritual Armament"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    You create a ghostly, magical echo of one weapon you're wielding or wearing and fling it. Attempt a spell attack roll against the target's AC, dealing 2d8 damage on a hit (or double damage on a critical hit). The damage type is the same as the chosen weapon (or any of its types for a versatile weapon). The attack deals spirit damage instead if that would be more detrimental to the creature (as determined by the GM). This attack uses and contributes to your multiple attack penalty. After the attack, the weapon returns to your side. If you sanctify the spell, the attacks are sanctified as well.
    Each time you Sustain the spell, you can repeat the attack against any creature within 120 feet.
    **Heightened (+2).** The damage increases by 1d8.
  properties:
    kind: "spell"
    rank: 2
    actions: "two"
    traits: ["concentrate", "manipulate", "sanctified", "spirit"]
    traditions: ["divine", "occult"]
    range: "120 feet"
    targets: "1 creature"
    defense: "AC"
    duration: "sustained up to 1 minute"
- id: "spiritual-guardian"
  name: "Spiritual Guardian"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: |-
    A Medium guardian made of magical force appears in an unoccupied space in range. The spiritual guardian is translucent and wields a ghostly echo of one weapon you're wielding or wearing. If you have a deity, the guardian takes the form of one of your deity's attendants or servitors. If you sanctify the spell, the guardian's attacks are sanctified as well.
    Creatures can move through the guardian's space but can't end their movement in it. You and your allies can flank with the guardian. The guardian doesn't have any other attributes a creature would normally have, aside from 50 Hit Points that it can't recover by any means and that it can lose only when protecting a creature (see below).
    When you Cast the Spell and each time you Sustain it, you can have the guardian move to any unoccupied space within 120 feet of you and either attack or protect.
    - **Attack.** The guardian makes a melee spell attack against an adjacent creature, dealing 3d8 damage on a hit (or double damage on a critical hit). The damage type is the same as the chosen weapon (or any of its types for a versatile weapon). The attack deals spirit damage instead if that would be more detrimental to the creature (as determined by the GM). This attack uses and contributes to your multiple attack penalty.
    - **Protect.** The guardian protects a creature of your choice. Each time the chosen creature would take damage and the guardian is adjacent to it, the guardian takes the first 10 damage instead of the ally. This protection lasts until you command the guardian to attack or to protect a different creature, or the guardian is destroyed.
    **Heightened (+2).** The guardian's damage increases by 1d8, and its Hit Points increase by 20.
  properties:
    kind: "spell"
    rank: 5
    actions: "two"
    traits: ["concentrate", "manipulate", "sanctified", "spirit"]
    traditions: ["divine"]
    range: "120 feet"
    duration: "sustained up to 1 minute"
- id: "stabilize"
  name: "Stabilize"
  source: "pc > Chapter 7: Spells > Spell Lists > Spells"
  description: "Life energy shuts death's door. The target loses the dying condition, though it remains unconscious at 0 Hit Points."
  properties:
    kind: "cantrip"
    rank: 1
    actions: "two"
    traits: ["cantrip", "concentrate", "healing", "manipulate", "vitality"]
