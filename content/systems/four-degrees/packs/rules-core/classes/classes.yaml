    features:
      - name: "Ancestry and Background"
        level: 1
        description: "In addition to what you get from your class at 1st level, you have the benefits of your selected ancestry and background."
      - name: "Attribute Boosts"
        level: 1
        description: |-
          In addition to what you get from your class at 1st level, you have four free boosts to different attribute modifiers.
          At 5th level and every 5 levels thereafter, you get four free boosts to different attribute modifiers. If an attribute modifier is already +4 or higher, it takes two boosts to increase it; you get a partial boost, and must boost that attribute again at a later level to increase it by 1.
      - name: "Initial Proficiencies"
        level: 1
        description: |-
          **Perception.** Trained in Perception.
          **Saving throws.** Trained in Fortitude. Trained in Reflex. Expert in Will.
          **Skills.** Trained in Nature. Trained in one skill determined by your druidic order. Trained in a number of additional skills equal to 2 plus your Intelligence modifier.
          **Attacks.** Trained in simple weapons. Trained in unarmed attacks.
          **Defenses.** Trained in light armor. Trained in medium armor. Trained in unarmored defense.
          **Spells.** Trained in spell attack modifier. Trained in spell DC.
          **Class DC.** Trained in druid class DC.
        adds: [{ to: skills, entries: [nature], rank: trained }, { to: perception, rank: trained }, { to: weapons, entries: [simple, unarmed], rank: trained }, { to: armor, entries: [light, medium, unarmored], rank: trained }, { to: spellAttack, rank: trained }, { to: spellDc, rank: trained }, { to: classDc, rank: trained }, { to: saves, entries: [wis], rank: expert }]
      - name: "Druid Spellcasting"
        level: 1
        description: |-
          The power of the wild world flows through you. You are a spellcaster and can cast spells of the primal tradition using the Cast a Spell activity. As a druid, your spellcasting incantations might be pleas to the environment around you or the invocation of ancient vows; your hands might sway like willows or curl into clawlike shapes as your gestures direct your magic.
          At 1st level, you can prepare two 1st-rank spells and five cantrips each morning from the common spells on the primal spell list, or from other primal spells to which you gain access and learn via Learn a Spell. Prepared spells remain available to you until you cast them or until you prepare your spells again. The number of spells you can prepare each day is called your spell slots.
          As you increase in level as a druid, the number of spells you can prepare each day increases, as does the highest rank of spell you can cast, as shown in the Druid Spells per Day table.
          Some of your spells require you to attempt a spell attack to see how effective they are, or have your enemies roll against your spell DC (typically by attempting a saving throw). Since your key attribute is Wisdom, your spell attack modifier and spell DC use your Wisdom modifier.
          **Heightening Spells.**
          When you get spell slots of 2nd rank and higher, you can fill those slots with stronger versions of lower-rank spells. This increases the spell's rank, heightening it to match the spell slot. Many spells have specific improvements when they are heightened to certain ranks.
          **Cantrips.**
          Some of your spells are cantrips. A cantrip is a special type of spell that doesn't use spell slots. You can cast a cantrip at will, any number of times per day. A cantrip is always automatically heightened to half your level rounded up—this is usually equal to the highest rank of druid spell slot you have. For example, as a 1st-level druid, your cantrips are 1st-rank spells, and a 5th-level druid's are 3rd rank.
      - name: "Anathema"
        level: 1
        description: |-
          As stewards of the natural order, druids find affronts to nature anathema. If you repeatedly perform these acts, you lose your magical abilities from the druid class, including your druid spellcasting and the benefits of your order. These abilities can be regained only if you demonstrate your repentance with an atone ritual. The following acts are anathema to all druids.
          **Anathema.** despoil natural places, consume more natural resources than you require to live comfortably, teach the druids' secret language to non-druids.
          Your choice of druidic order adds further anathema, as detailed in the order's entry.
      - name: "Druidic Order"
        level: 1
        description: |-
          Upon becoming a druid, you align yourself with a druidic order, which grants you a class feat, an order spell, and an additional trained skill tied to your order. While you'll always be a member of your initial order, it's not unheard of for a druid to request to study with other orders in search of greater understanding of the natural world, and PC druids are among the most likely to blend the powers of different orders.
          Order spells are a type of focus spell. It costs 1 Focus Point to cast a focus spell, and you start with a focus pool of 1 Focus Point. You refill your focus pool during your daily preparations, and you can regain 1 Focus Point by spending 10 minutes using the Refocus activity to commune with local nature spirits or otherwise tend to the wilderness in a way befitting your order.
          Focus spells are automatically heightened to half your level rounded up, much like cantrips. Focus spells don't require spell slots, and you can't cast them using spell slots. Certain feats give you more focus spells. The maximum Focus Points your focus pool can hold is equal to the number of focus spells you have, but can never be more than 3 points.
          **Order Skill.** You become trained in the listed skill. If you're already trained in that skill, you become trained in a different skill of your choice.
          **Druid Feat.** You gain this 1st-level druid feat.
          **Order Spell.** You automatically gain the listed order spell at 1st level.
          **Anathema.** Add this anathema to those for all druids.
      - name: "Shield Block"
        level: 1
        description: "You gain the Shield Block general feat, a reaction that lets you reduce damage with your shield."
        adds: [{ to: feats, entries: [shield-block] }]
      - name: "Voice of Nature"
        level: 1
        description: "You gain your choice of the Animal Empathy or Plant Empathy druid feat."
      - name: "Druid Language"
        level: 1
        description: "You know a secret language known only within druid orders, in addition to any languages you know through your ancestry. It is a melodic and tonal language sounding more like animal calls than a spoken tongue, and its alphabet involves fractals and spirals, like the arrangement of a seashell's chambers, a snowflake's crystals, or a fern's fronds. Teaching it to non-druids is anathema."
      - name: "Druid Feats"
        level: 2
        description: "At 2nd level and every even-numbered level, you gain a druid class feat."
      - name: "Skill Feats"
        level: 2
        description: "At 2nd level and every 2 levels thereafter, you gain a skill feat. Skill feats have the skill trait. You must be trained or better in the corresponding skill to select a skill feat."
      - name: "Perception Expertise"
        level: 3
        description: "You remain alert to threats around you. Your proficiency rank for Perception increases to expert."
        adds: [{ to: perception, rank: expert }]
      - name: "General Feats"
        level: 3
        description: "At 3rd level and every 4 levels thereafter, you gain a general feat."
      - name: "Fortitude Expertise"
        level: 3
        description: "Adventures have made your physique more hardy. Your proficiency rank for Fortitude saves increases to expert."
        adds: [{ to: saves, entries: [con], rank: expert }]
      - name: "Skill Increases"
        level: 3
        description: "At 3rd level and every 2 levels thereafter, you gain a skill increase. You can use this increase either to increase your proficiency rank to trained in one skill you're untrained in, or to increase your proficiency rank in one skill in which you're already trained to expert. At 7th level, you can use skill increases to increase your proficiency rank to master in a skill in which you're already an expert, and at 15th level, you can use them to increase your proficiency rank to legendary in a skill in which you're already a master."
      - name: "Ancestry Feats"
        level: 5
        description: "In addition to the ancestry feat you started with, you gain an ancestry feat at 5th level and every 4 levels thereafter. The ancestry feats available to you are those of your ancestry."
      - name: "Reflex Expertise"
        level: 5
        description: "You've honed your ability to dodge dangers. Your proficiency rank for Reflex saves increases to expert."
        adds: [{ to: saves, entries: [dex], rank: expert }]
      - name: "Expert Spellcaster"
        level: 7
        description: "Your command of primal forces has deepened, empowering your spells. Your proficiency ranks for spell attack modifier and spell DC increase to expert."
        adds: [{ to: spellAttack, rank: expert }, { to: spellDc, rank: expert }]
      - name: "Weapon Expertise"
        level: 11
        description: "You've improved your combat skill. Your proficiency rank for simple weapons and unarmed attacks increases to expert."
        adds: [{ to: weapons, entries: [simple, unarmed], rank: expert }]
      - name: "Wild Willpower"
        level: 11
        description: "Your primal will, like that of the greatest beast, can't be tamed. Your proficiency rank for Will saves increases to master. When you roll a success at a Will save, you get a critical success instead."
        adds: [{ to: saves, entries: [wis], rank: master }]
      - name: "Medium Armor Expertise"
        level: 13
        description: "You've learned to defend yourself better against attacks. Your proficiency ranks for light armor, medium armor, and unarmored defense increase to expert."
        adds: [{ to: armor, entries: [light, medium, unarmored], rank: expert }]
      - name: "Weapon Specialization"
        level: 13
        description: "You inflict great injuries with the weapons you know best. You deal 2 additional damage with weapons and unarmed attacks in which you are an expert. This damage increases to 3 if you're a master, and to 4 if you're legendary."
      - name: "Master Spellcaster"
        level: 15
        description: "Primal magic answers your command. Your proficiency ranks for spell attack modifier and spell DC increase to master."
        adds: [{ to: spellAttack, rank: master }, { to: spellDc, rank: master }]
      - name: "Legendary Spellcaster"
        level: 19
        description: "You have developed an unparalleled rapport with the magic of nature. Your proficiency ranks for spell attack modifier and spell DC increase to legendary."
        adds: [{ to: spellAttack, rank: legendary }, { to: spellDc, rank: legendary }]
      - name: "Primal Hierophant"
        level: 19
        description: "You command the most potent forces of primal magic and can cast a spell of truly incredible power. You gain a single 10th-rank spell slot and can prepare a spell in that slot using druid spellcasting. Unlike with other spell slots, you can't use 10-rank slots with abilities that give you more spell slots or that let you cast spells without expending spell slots. You don't gain more 10th-rank spells as you level up, but you can take the Hierophant's Power feat to gain a second slot."
- id: "fighter-class"
  name: "Fighter"
  source: "pc > Chapter 3: Classes > Fighter"
  properties:
    hp: 10
    keyAttribute: "str|dex"
    boosts: ["str|dex"]
    savingThrows: ["wis"]
    extraSkills: 3
    features:
      - name: "Ancestry and Background"
        level: 1
        description: "In addition to what you get from your class at 1st level, you have the benefits of your selected ancestry and background."
      - name: "Attribute Boosts"
        level: 1
        description: |-
          In addition to what you get from your class at 1st level, you have four free boosts to different attribute modifiers.
          At 5th level and every 5 levels thereafter, you get four free boosts to different attribute modifiers. If an attribute modifier is already +4 or higher, it takes two boosts to increase it; you get a partial boost and must boost that attribute again at a later level to increase it by 1.
      - name: "Initial Proficiencies"
        level: 1
        description: |-
          **Perception.** Expert in Perception.
          **Saving throws.** Expert in Fortitude. Expert in Reflex. Trained in Will.
          **Skills.** Trained in your choice of Acrobatics or Athletics. Trained in a number of additional skills equal to 3 plus your Intelligence modifier.
          **Attacks.** Expert in simple weapons. Expert in martial weapons. Trained in advanced weapons. Expert in unarmed attacks.
          **Defenses.** Trained in all armor. Trained in unarmored defense.
          **Class DC.** Trained in fighter class DC.
        adds: [{ to: weapons, entries: [advanced], rank: trained }, { to: armor, entries: [unarmored, light, medium, heavy], rank: trained }, { to: classDc, rank: trained }, { to: perception, rank: expert }, { to: saves, entries: [con, dex], rank: expert }, { to: weapons, entries: [simple, martial, unarmed], rank: expert }]
      - name: "Reactive Strike"
        level: 1
        description: |-
          Ever watchful for weaknesses, you can quickly attack foes that leave an opening in their defenses. You gain the Reactive Strike reaction.
          **Reactive Strike (reaction).**
          **Trigger.** A creature within your reach uses a manipulate action or a move action, makes a ranged attack, or leaves a square during a move action it's using.
          You lash out at a foe that leaves an opening. Make a melee Strike against the triggering creature. If your attack is a critical hit and the trigger was a manipulate action, you disrupt that action. This Strike doesn't count toward your multiple attack penalty, and your multiple attack penalty doesn't apply to this Strike.
      - name: "Fighter Feats"
        level: 1
        description: "At 1st level and every even-numbered level, you gain a fighter class feat."
      - name: "Shield Block"
        level: 1
        description: "You gain the Shield Block general feat, a reaction that lets you reduce damage with your shield."
      - name: "Skill Feats"
        level: 2
        description: "At 2nd level and every 2 levels thereafter, you gain a skill feat. Skill feats have the skill trait. You must be trained or better in the corresponding skill to select a skill feat."
      - name: "Bravery"
        level: 3
        description: "Having faced countless foes and the chaos of battle, you have learned how to stand strong in the face of fear. Your proficiency rank for Will saves increases to expert. When you roll a success at a Will save against a fear effect, you get a critical success instead. In addition, anytime you gain the frightened condition, reduce its value by 1."
        adds: [{ to: saves, entries: [wis], rank: expert }]
      - name: "General Feats"
        level: 3
        description: "At 3rd level and every 4 levels thereafter, you gain a general feat."
      - name: "Skill Increases"
        level: 3
        description: |-
          At 3rd level and every 2 levels thereafter, you gain a skill increase. You can use this increase to either become trained in one skill you're untrained in or become an expert in one skill in which you're already trained.
          At 7th level, you can use skill increases to become a master in a skill in which you're already an expert, and at 15th level, you can use them to become legendary in a skill in which you're already a master.
      - name: "Ancestry Feats"
        level: 5
        description: "In addition to the ancestry feat you started with, you gain an ancestry feat at 5th level and every 4 levels thereafter. The ancestry feats available to you are those of your ancestry."
      - name: "Fighter Weapon Mastery"
        level: 5
        description: "Hours spent training with your preferred weapons, learning and developing new combat techniques, have made you particularly effective with your weapons of choice. Choose one weapon group. Your proficiency rank increases to master with the simple weapons, martial weapons, and unarmed attacks in that group, and to expert with the advanced weapons in that group. You gain access to the critical specialization effects of all weapons and unarmed attacks for which you have master proficiency."
      - name: "Battlefield Surveyor"
        level: 7
        description: "Whether taking stock of an enemy army or simply standing guard, you excel at observing your foes. Your proficiency rank for Perception increases to master. In addition, you gain a +2 circumstance bonus to Perception checks for initiative, making you faster to react during combat."
        adds: [{ to: perception, rank: master }]
      - name: "Weapon Specialization"
        level: 7
        description: "You've learned how to inflict greater injuries with the weapons you know best. You deal 2 additional damage with weapons and unarmed attacks in which you're an expert. This damage increases to 3 if you're a master, and 4 if you're legendary."
      - name: "Battle Hardened"
        level: 9
        description: "Your experience in battle helps protect you against magic and toxins alike. Your proficiency rank for Fortitude saves increases to master. When you roll a success on a Fortitude save, you get a critical success instead."
        adds: [{ to: saves, entries: [con], rank: master }]
      - name: "Combat Flexibility"
        level: 9
        description: "You can prepare your tactics to suit different situations. When you make your daily preparations, you gain one fighter feat of 8th level or lower that you meet the prerequisites for and don't already have. You can use that feat until your next daily preparations."
      - name: "Armor Expertise"
        level: 11
        description: "You have spent so much time in armor that you know how to make the most of its protection. Your proficiency ranks for light, medium, and heavy armor, as well as for unarmored defense, increase to expert. You gain the armor specialization effects of medium and heavy armor."
        adds: [{ to: armor, entries: [light, medium, heavy, unarmored], rank: expert }]
      - name: "Fighter Expertise"
        level: 11
        description: "Your practiced techniques have made you even more formidable. Your proficiency rank for your fighter class DC increases to expert."
        adds: [{ to: classDc, rank: expert }]
      - name: "Weapon Legend"
        level: 13
        description: |-
          You've learned fighting techniques that apply to all armaments, and you've developed unparalleled skill with your favorite weapons. Your proficiency ranks for simple weapons, martial weapons, and unarmed attacks increase to master. Your proficiency rank for advanced weapons increases to expert.
          You can select one weapon group and increase your proficiency ranks to legendary for all simple weapons, martial weapons, and unarmed attacks in that weapon group, and to master for all advanced weapons in that weapon group.
        adds: [{ to: weapons, entries: [simple, martial, unarmed], rank: master }, { to: weapons, entries: [advanced], rank: expert }]
      - name: "Greater Weapon Specialization"
        level: 15
        description: "Your damage from weapon specialization increases to 4 with weapons and unarmed attacks in which you're an expert, 6 if you're a master, and 8 if you're legendary."
      - name: "Improved Flexibility"
        level: 15
        description: "Your extensive experience gives you even greater ability to adapt to each day's challenges. When you use combat flexibility, you can gain two fighter feats instead of one. While the first feat must still be 8th level or lower, the second feat can be up to 14th level, and you can use the first feat to meet the prerequisites of the second feat. You must meet all of the feats' prerequisites."
      - name: "Tempered Reflexes"
        level: 15
        description: "Practiced reflexes let you find safety even in the face of cataclysmic explosions. Your proficiency rank for Reflex saves increases to master. When you roll a success on a Reflex save, you get a critical success instead."
        adds: [{ to: saves, entries: [dex], rank: master }]
      - name: "Armor Mastery"
        level: 17
        description: "Your skill with armor improves further. Your proficiency ranks for light, medium, and heavy armor, as well as for unarmored defense, increase to master."
        adds: [{ to: armor, entries: [light, medium, heavy, unarmored], rank: master }]
      - name: "Versatile Legend"
        level: 19
        description: "You are nigh-unmatched with any weapon. Your proficiency ranks for simple weapons, martial weapons, and unarmed attacks increase to legendary, and your proficiency rank for advanced weapons increases to master. Your proficiency rank for your fighter class DC increases to master."
        adds: [{ to: weapons, entries: [simple, martial, unarmed], rank: legendary }, { to: weapons, entries: [advanced], rank: master }, { to: classDc, rank: master }]
- id: "rogue-class"
  name: "Rogue"
  source: "pc > Chapter 3: Classes > Rogue"
  properties:
    hp: 8
    keyAttribute: "dex"
    boosts: ["dex"]
    savingThrows: ["con"]
    extraSkills: 7
    features:
      - name: "Ancestry and Background"
        level: 1
        description: "In addition to what you get from your class at 1st level, you have the benefits of your selected ancestry and background."
      - name: "Attribute Boosts"
        level: 1
        description: |-
          In addition to what you get from your class at 1st level, you have four free boosts to different attribute modifiers.
          At 5th level and every 5 levels thereafter, you get four free boosts to different attribute modifiers. If an attribute modifier is already +4 or higher, it takes two boosts to increase it; you get a partial boost, and must boost that attribute again at a later level to increase it by 1.
      - name: "Initial Proficiencies"
        level: 1
        description: |-
          **Perception.** Expert in Perception.
          **Saving throws.** Trained in Fortitude. Expert in Reflex. Expert in Will.
          **Skills.** Trained in Stealth. Trained in one or more skills determined by your rogue's racket. Trained in a number of additional skills equal to 7 plus your Intelligence modifier.
          **Attacks.** Trained in simple weapons. Trained in martial weapons. Trained in unarmed attacks.
          **Defenses.** Trained in light armor. Trained in unarmored defense.
