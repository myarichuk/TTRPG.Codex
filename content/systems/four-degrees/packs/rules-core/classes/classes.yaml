        adds: [{ to: saves, entries: [dex], rank: expert }]
      - name: "Signature Spells"
        level: 3
        description: "Experience allows you to cast some spells more flexibly. For each spell rank you have access to, choose one spell of that rank to be a signature spell. You don't need to learn heightened versions of signature spells separately; instead, you can heighten these spells freely. If you've learned a signature spell at a higher rank than its minimum, you can also cast all its lower-rank versions without learning those separately. If you swap out a signature spell, you can choose a replacement signature spell of the same spell rank at which you learned the previous spell. You can also retrain specifically to change a signature spell to a different spell of that rank without swapping any spells; this takes as much time as retraining a spell normally does."
      - name: "Skill Increases"
        level: 3
        description: |-
          At 3rd level and every 2 levels thereafter, you gain a skill increase. You can use this increase to either become trained in one skill you're untrained in or become an expert in one skill in which you're already trained.
          At 7th level, you can use skill increases to become a master in a skill in which you're already an expert, and at 15th level, you can use them to become legendary in a skill in which you're already a master.
      - name: "Ancestry Feats"
        level: 5
        description: "In addition to the ancestry feat you started with, you gain an ancestry feat at 5th level and every 4 levels thereafter. The ancestry feats available to you are those of your ancestry."
      - name: "Expert Spellcaster"
        level: 7
