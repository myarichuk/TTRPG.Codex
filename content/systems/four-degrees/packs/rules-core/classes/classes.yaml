      - { level: 14, cantrips: 5, slots: "3/3/3/3/3/3/3", maxRank: 7, spells: 21 }
      - { level: 15, cantrips: 5, slots: "3/3/3/3/3/3/3/2", maxRank: 8, spells: 23 }
      - { level: 16, cantrips: 5, slots: "3/3/3/3/3/3/3/3", maxRank: 8, spells: 24 }
      - { level: 17, cantrips: 5, slots: "3/3/3/3/3/3/3/3/2", maxRank: 9, spells: 26 }
      - { level: 18, cantrips: 5, slots: "3/3/3/3/3/3/3/3/3", maxRank: 9, spells: 27 }
      - { level: 19, cantrips: 5, slots: "3/3/3/3/3/3/3/3/3/1", maxRank: 10, spells: 28 }
      - { level: 20, cantrips: 5, slots: "3/3/3/3/3/3/3/3/3/1", maxRank: 10, spells: 28 }
    features:
      - name: "Ancestry and Background"
        level: 1
        description: "In addition to what you get from your class at 1st level, you have the benefits of your selected ancestry and background."
      - name: "Attribute Boosts"
        level: 1
        description: |-
          In addition to what you get from your class at 1st level, you have four free boosts to different attribute modifiers.
          At 5th level and every 5 levels thereafter, you get four free boosts to different attribute modifiers. If an attribute modifier is already +4 or higher, it takes two boosts to increase it; you get a partial boost, and must boost that attribute again at a later level to increase it by 1.
      - name: "Initial Proficiencies"
        level: 1
        description: |-
          **Perception.** Trained in Perception.
          **Saving throws.** Trained in Fortitude. Trained in Reflex. Expert in Will.
          **Skills.** Trained in one skill determined by your patron. Trained in a number of additional skills equal to 3 plus your Intelligence modifier.
          **Attacks.** Trained in simple weapons. Trained in unarmed attacks.
          **Defenses.** Untrained in all armor. Trained in unarmored defense.
          **Spells.** Trained in spell attack modifier. Trained in spell DC.
          **Class DC.** Trained in witch class DC.
        adds: [{ to: perception, rank: trained }, { to: weapons, entries: [simple, unarmed], rank: trained }, { to: armor, entries: [unarmored], rank: trained }, { to: spellAttack, rank: trained }, { to: spellDc, rank: trained }, { to: classDc, rank: trained }, { to: saves, entries: [wis], rank: expert }]
      - name: "Patron"
        level: 1
        description: |-
          You weren't born with the power to cast spells, nor have you spent years dedicated to worship, study, or uncovering mystical secrets. Your magic instead has been gifted to you by a potent being, one who knows that by empowering you so, you'll further the being's agenda in the world, whatever it may be. This entity is typically mysterious and distant, revealing little of their identity and motivations. They make their will known to you in abstract signs such as omens, dreams, or similar subtleties rather than words.
          Rather than interacting with you directly, your patron works through a familiar—a mystical creature that teaches you, serves as the conduit for your patron's magic, and maybe even keeps an eye on you to ensure you're furthering your patron's nebulous ends.
          At 1st level, choose your patron, which determines your spellcasting tradition and grants you the skill for that tradition of magic, your first witch's lesson and a unique familiar ability.
          When your patron first makes contact, they usually reveal little more of themself than glimpses or specific manifestations—you might see eyes from the shadows of the forest or hear a wordless voice echoing across the frozen tundra before your familiar makes itself known. Your patron's true identity might be a powerful entity, or perhaps multiple such figures working in tandem, but that identity is for you to attempt to discover as you learn more of your patron's lessons. Some patrons are multifaceted, appearing in different guises, and granting different powers to different witches. In some cases, the witch may know of their patron's identity, but have some other aspect shrouded in uncertainty; they might know their patron's name but not motive, or perhaps even if they know the patron's identity, they have been cursed to never reveal it to others.
          Your patron determines the following.
          **Spell List.** You use this magical tradition and spell list.
          **Patron Skill.** You become trained in the skill associated with your patron's magical tradition.
          **Initial Lesson.** This is the first lesson your patron teaches you and is unique to your patron.
          **Familiar Ability.** One of your familiar's two bonus abilities is always the one listed here, a mark of your patron's indelible influence. The benefit can occur only once per round when you Cast or Sustain a hex, and you can choose whether it occurs before or after the effects of Casting or Sustaining the hex.
      - name: "Witch Spellcasting"
        level: 1
        description: |-
          Using your familiar as a conduit, your patron provides you the power to cast spells. You are a spellcaster, and you can cast spells of your patron's tradition using the Cast a Spell activity. As a witch, when you cast spells, your incantations might rhyme, your gestures might be as simple as an ominous pointing finger or a complex folk sign, and your familiar might even echo your words or movements slightly as your patron's magic surges.
          At 1st level, you can prepare up to two 1st-rank spells and five cantrips each morning from the spells your familiar knows. Prepared spells remain available to you until you cast them or until you prepare your spells again. The number of spells you can prepare each day is called your spell slots.
          As you increase in level as a witch, the number of spells you can prepare each day increases, as does the highest rank of spell you can cast, as shown in the Witch Spells per Day table.
          Some of your spells require you to attempt a spell attack to see how effective they are, or have your enemies roll against your spell DC (typically by attempting a saving throw). Since your key attribute is Intelligence, your spell attack modifier and spell DC use your Intelligence modifier.
          **Heightening Spells.**
          When you get spell slots of 2nd-rank and higher, you can fill those slots with stronger versions of lower-rank spells. This increases the spell's rank, heightening it to match the spell slot. Many spells have specific improvements when they are heightened to certain ranks.
          **Cantrips.**
          Some of your spells are cantrips. A cantrip is a special type of spell that doesn't use spell slots. You can cast a cantrip at will, any number of times per day. A cantrip is always automatically heightened to half your level rounded up—this is usually equal to the highest rank of witch spell slot you have. For example, as a 1st-level witch, your cantrips are 1st-rank spells, and as a 5th-level witch, your cantrips are 3rd-rank spells.
          **Familiar.**
          Your patron has sent you a familiar, a mystical creature that teaches you magic and facilitates your spells. This familiar follows the rules for familiars, though as it's a direct conduit between you and your patron, it's more powerful than typical familiars. Your familiar gains two additional familiar abilities: one of these is a unique ability based on your patron and is always selected, and the other is an additional familiar ability that can be selected daily as normal. Your familiar gains another extra ability at 6th, 12th, and 18th levels.
          Spells: Your familiar is the source and repository of the spells your patron has bestowed upon you, and you must commune with your familiar to prepare your spells each day using your witch spellcasting. Your familiar starts off knowing 10 cantrips, five 1st-rank spells, and one additional spell determined by your patron's initial lesson. You choose these spells from the common spells of the tradition determined by your patron or from other spells of that tradition you gain access to.
          Each time you gain a level, your patron teaches your familiar two new spells of any rank for which you have spell slots, chosen from common spells of your tradition or others you gain access to. Feats can also grant your familiar additional spells.
          Learning Spells: Your familiar can learn new spells independently of your patron. It can learn any spell on your tradition's spell list by physically consuming a written version of that spell over the course of 1 hour. This can be a scroll of that spell, or you can prepare a written version using the Learn a Spell exploration activity. You and your familiar can use the Learn a Spell activity to teach your familiar a spell from another witch's familiar. Both familiars must be present for the entirety of the activity, the spell must be on your spellcasting tradition's spell list, and you must pay the usual cost for that activity, typically in the form of an offering to the other familiar's patron. You can't prepare spells from another witch's familiar.
          Undying: If your familiar dies, your patron replaces it during your next daily preparations. The new familiar might be a duplicate or reincarnation of your former familiar or a new entity altogether, but it knows the same spells your former familiar knew regardless. Your familiar's death doesn't affect any spells you have already prepared.
      - name: "Hex Spells"
        level: 1
        description: |-
          As a favored agent of your patron, you can invoke their power for a more direct magical intervention. A hex is a spell shaped by your patron and sent to you through your familiar, rather than an ability you use directly. Your patron expects you to advance its interests and does not take kindly to repeated requests for aid; as such, you can use only one hex each turn, and any attempts to use a second hex on that turn fail and the actions are lost.
          Hex spells are a type of focus spell. It costs 1 Focus Point to cast a focus spell, and you start with a focus pool of 1 Focus Point. You refill your focus pool during your daily preparations, and you can regain 1 Focus Point by spending 10 minutes using the Refocus activity to commune with your familiar.
          Focus spells are automatically heightened to half your level rounded up, much like cantrips. Focus spells don't require spell slots, and you can't cast them using spell slots. Certain feats give you more focus spells. The maximum Focus Points your focus pool can hold is equal to the number of focus spells you have, but it can never be more than 3 points.
          You learn your choice of the patron's puppet hex or phase familiar hex, which let you command your familiar or defend it from harm, respectively. You learn most other hexes from witch lessons.
          **Hex Cantrips.**
          Hex cantrips are special hexes that don't cost Focus Points, so you can cast them as often as you like, though you can still use only one hex each turn. Hex cantrips are in addition to the cantrips you choose with witch spellcasting and aren't counted toward your prepared cantrips.
          You gain a hex cantrip determined by your choice of patron.
      - name: "Skill Feats"
        level: 2
        description: "At 2nd level and every 2 levels thereafter, you gain a skill feat. You must be trained or better in the corresponding skill to select a skill feat."
      - name: "Witch Feats"
        level: 2
        description: "At 2nd level and every 2 levels thereafter, you gain a witch class feat."
      - name: "General Feats"
        level: 3
        description: "At 3rd level and every 4 levels thereafter, you gain a general feat."
      - name: "Skill Increases"
        level: 3
        description: |-
          At 3rd level and every 2 levels thereafter, you gain a skill increase. You can use this increase either to increase your proficiency rank to trained in one skill you're untrained in, or to increase your proficiency rank in one skill in which you're already trained to expert.
          At 7th level, you can use skill increases to increase your proficiency rank to master in a skill in which you're already an expert, and at 15th level, you can use them to increase your proficiency rank to legendary in a skill in which you're already a master.
      - name: "Ancestry Feats"
        level: 5
        description: "In addition to the ancestry feat you started with, you gain an ancestry feat at 5th level and every 4 levels thereafter. The ancestry feats available to you are those of your ancestry."
      - name: "Magical Fortitude"
        level: 5
        description: "Your patron's power boosts your physical resiliency. Your proficiency rank for Fortitude saves increases to expert."
        adds: [{ to: saves, entries: [con], rank: expert }]
      - name: "Expert Spellcaster"
        level: 7
        description: "You've learned to better control the power your patron has granted you. Your proficiency ranks for spell attack modifier and spell DC increase to expert."
        adds: [{ to: spellAttack, rank: expert }, { to: spellDc, rank: expert }]
      - name: "Reflex Expertise"
        level: 9
        description: "You've developed a knack for dodging danger. Your proficiency rank for Reflex saves increases to expert."
        adds: [{ to: saves, entries: [dex], rank: expert }]
      - name: "Perception Expertise"
        level: 11
        description: "You remain alert to threats around you. Your proficiency rank for Perception increases to expert."
        adds: [{ to: perception, rank: expert }]
      - name: "Weapon Expertise"
        level: 11
        description: "Through sheer experience, you've improved your technique with your weapons. Your proficiency ranks for simple weapons and unarmed attacks increase to expert."
        adds: [{ to: weapons, entries: [simple, unarmed], rank: expert }]
      - name: "Defensive Robes"
        level: 13
        description: "The flow of magic through your spellcasting and your defensive training combine to help you get out of the way before an attack. Your proficiency rank in unarmored defense increases to expert."
        adds: [{ to: armor, entries: [unarmored], rank: expert }]
      - name: "Weapon Specialization"
        level: 13
        description: "You can inflict greater injuries with the weapons you know. You deal 2 additional damage with weapons and unarmed attacks in which you are an expert. This damage increases to 3 if you're a master and 4 if you're legendary."
      - name: "Master Spellcaster"
        level: 15
        description: "You've achieved mastery over your patron's magic. Your proficiency ranks for spell attack modifier and spell DC increase to master."
        adds: [{ to: spellAttack, rank: master }, { to: spellDc, rank: master }]
      - name: "Will of the Pupil"
        level: 17
        description: "Communion with your familiar has steeled your mental fortitude. Your proficiency rank for Will saves increases to master. When you roll a success on a Will save, you get a critical success instead."
        adds: [{ to: saves, entries: [wis], rank: master }]
      - name: "Legendary Spellcaster"
        level: 19
        description: "You've perfected your command of the magic your patron provides. Your proficiency ranks for spell attack modifier and spell DC increase to legendary."
        adds: [{ to: spellAttack, rank: legendary }, { to: spellDc, rank: legendary }]
      - name: "Patron's Gift"
        level: 19
        description: "Your patron grants you the power to command incredible works of magic. You gain a single 10th-rank spell slot and can prepare a spell in that slot using witch spellcasting. Unlike with other spell slots, you can't use 10th-rank slots with abilities that give you more spell slots or that let you cast spells without expending spell slots. You don't gain more 10th-rank spells as you level up, but you can take the Patron's Truth feat to gain a second slot."
