      - { level: 16, cantrips: 5, slots: "3/3/3/3/3/3/3/3", maxRank: 8, spells: 24 }
      - { level: 17, cantrips: 5, slots: "3/3/3/3/3/3/3/3/2", maxRank: 9, spells: 26 }
      - { level: 18, cantrips: 5, slots: "3/3/3/3/3/3/3/3/3", maxRank: 9, spells: 27 }
      - { level: 19, cantrips: 5, slots: "3/3/3/3/3/3/3/3/3/1", maxRank: 10, spells: 28 }
