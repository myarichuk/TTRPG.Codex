        adds: [{ to: spellAttack, rank: expert }, { to: spellDc, rank: expert }]
      - name: "Fortitude Expertise"
        level: 9
        description: "Your physique has grown hardy in your adventures. Your proficiency rank for Fortitude saves increases to expert."
        adds: [{ to: saves, entries: [con], rank: expert }]
      - name: "Performer's Heart"
        level: 9
        description: "The greatest performances require an understanding of your own mind and flawless concentration. Your proficiency rank for Will saves increases to master. When you roll a success on a Will save, you get a critical success instead."
        adds: [{ to: saves, entries: [wis], rank: master }]
      - name: "Bard Weapon Expertise"
        level: 11
        description: "You have become thoroughly adept with bardic weapons. Your proficiency rank for martial weapons, simple weapons, and unarmed attacks increases to expert. When you critically succeed at an attack roll using one of these weapons or an unarmed attack while one of your compositions is active, you apply the critical specialization effect for that weapon or unarmed attack."
