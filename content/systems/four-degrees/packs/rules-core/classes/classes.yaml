        adds: [{ to: perception, rank: expert }]
      - name: "Weapon Expertise"
        level: 11
        description: "Through sheer experience, you've improved your technique with your weapons. Your proficiency ranks for simple weapons and unarmed attacks increase to expert."
        adds: [{ to: weapons, entries: [simple, unarmed], rank: expert }]
      - name: "Defensive Robes"
        level: 13
        description: "The flow of magic and your training combine to help you avoid attacks. Your proficiency rank in unarmored defense increases to expert."
        adds: [{ to: armor, entries: [unarmored], rank: expert }]
      - name: "Weapon Specialization"
        level: 13
        description: "You've learned how to inflict greater injuries with the weapons you know best. You deal an additional 2 damage with weapons and unarmed attacks in which you are an expert. This damage increases to 3 if you're a master, and 4 if you're legendary."
      - name: "Master Spellcaster"
        level: 15
        description: "You command superlative spellcasting ability. Your proficiency ranks for spell attack modifier and spell DC increase to master."
        adds: [{ to: spellAttack, rank: master }, { to: spellDc, rank: master }]
      - name: "Prodigious Will"
        level: 17
        description: "Your mind is simply too complex and sophisticated to be tampered with. Your proficiency rank for Will saves increases to master. When you roll a success at a Will save, you get a critical success instead."
        adds: [{ to: saves, entries: [wis], rank: master }]
      - name: "Archwizard's Spellcraft"
        level: 19
        description: "You command the most potent arcane magic and can cast a spell of truly incredible power. You gain a single 10th-rank spell slot and can prepare a spell in that slot using wizard spellcasting. Unlike with other spell slots, you can't use 10th-rank slots with abilities that give you more spell slots or that let you cast spells without expending spell slots. You don't gain more 10th-rank spells as you level up, but you can take the Archwizard's Might feat to gain a second slot."
      - name: "Legendary Spellcaster"
        level: 19
        description: "You are a consummate spellcaster, blending both arcane theory and practical spellcraft. Your proficiency ranks for spell attack modifier and spell DC increase to legendary."
        adds: [{ to: spellAttack, rank: legendary }, { to: spellDc, rank: legendary }]
