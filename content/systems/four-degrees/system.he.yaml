  listDescriptions:
    cantrips: רק המסורת של המקצוע שלך, עד המספר שבטבלת המקצוע. לחשון מיקוד נכנס ללחשים שיכולת מעניקה.
    spells: הלחשים שאתה מכיר או מכין. רק המסורת של המקצוע שלך, לא גבוהים מהתא הגבוה ביותר שלך, עד המספר שבטבלת המקצוע.
    focusSpells: לחשי מיקוד שיכולת מקצוע, כשרון או מסדר מעניקים. הם אינם צורכים תאים; מאגר המיקוד נמצא במקצוע.
    grantedSpells: לחשים ולחשונים שיכולת מעניקה לך מחוץ לרשימת המקצוע (לחש של מוזה, לחשון של יצירה). הם אינם נספרים בלחשים שלך.
