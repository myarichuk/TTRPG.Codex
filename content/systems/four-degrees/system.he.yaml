name: ארבע רמות הצלחה
compatibility: d20 עם ארבע רמות הצלחה
description: >-
  מערכת d20 עם ארבע רמות הצלחה. רמות המיומנות (ממיומן ועד אגדי) שוות לדרגה ועוד 2, 4, 6 או 8;
  התכונות נבנות מהגברות; לתנאים יש ערך, וחלקם מביאים איתם תנאים אחרים;
  כל התקפה נוספת באותו תור פחות סבירה לפגוע.

