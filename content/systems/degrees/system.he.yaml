name: ארבע דרגות
compatibility: d20 עם ארבע דרגות הצלחה
description: >-
  מערכת d20 עם ארבע דרגות הצלחה. הדרגות (מאומן ועד אגדי) שוות לרמה ועוד 2, 4, 6 או 8;
  התכונות נבנות מהגברות; לתנאים יש ערך, וחלקם מביאים איתם תנאים אחרים;
  כל התקפה נוספת באותו תור פחות סבירה לפגוע.

