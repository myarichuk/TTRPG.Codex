# yaml-language-server: $schema=https://raw.githubusercontent.com/myarichuk/TTRPG.Codex/main/docs/schema/system.schema.json
# The mechanics of the Forged in the Dark SRD (December 2017) as data: dice pools from action dots, position and effect set
# by the GM, stress that overflows into trauma, harm in levels that push up, heat and wanted level, a crew sheet, and clocks
# and faction status owned by the campaign. The SRD's rules text ships as the pack in packs/srd-fitd-2017 (generated by
# tools/Codex.ContentImport, `fitd` command). This system carries no setting: the SRD names none for you to use.
#
# Not bundled with the app (content/systems/bundled.txt): it is released as its own archive, installed from the About page.
id: fitd-srd
name: Forged in the Dark SRD
version: 2017.12
compatibility: Forged in the Dark
description: >-
  The system reference document behind a family of dice-pool games about daring scoundrels and the crews they run:
  action ratings in dots, a d6 per dot, a result read off the highest die, stress you spend to resist consequences, harm
  and trauma that wear characters down, and a crew with a tier, a reputation, heat and a wanted level. Rules only; the
  setting, playbooks and crew types of any one published game are not part of it.
license:
  name: CC-BY-3.0
  url: https://creativecommons.org/licenses/by/3.0/legalcode
  attribution: >-
    This work is based on Blades in the Dark (found at http://www.bladesinthedark.com/), product of One Seven Design,
    developed and authored by John Harper, and licensed for our use under the Creative Commons Attribution 3.0 Unported
    license (http://creativecommons.org/licenses/by/3.0/).
  sourceUrl: https://bladesinthedark.com/
  modified: true
  notices:
    - >-
      This system definition describes the SRD's mechanics as data. It is not affiliated with or endorsed by One Seven
      Design, and it contains nothing from the Blades in the Dark book beyond what the SRD itself contains.

setting:
  summary: >-
    Scoundrels band into a crew, take dangerous scores against richer and more powerful factions, and pay for every
    success in stress, harm, heat and entanglements. The system presumes no particular world: the campaign supplies it.
  genres: [heist, crime, caper]
  tone: [tense, desperate, daring]
  themes: [ambition and its price, loyalty under pressure, the consequences of success]
  factions: [rival criminal crews, the law, guilds and noble houses, secretive cults]
  play: [the crew plans a score, the score goes wrong, the fallout is dealt with in downtime]
  notes: Crew types, playbooks, heritages and backgrounds are for each game or campaign to define.

ai:
  creature: foe
  creatureExamples: [constable, gang boss, thug, informant]
  advancementChoices: [an extra special ability, an extra action dot, crew upgrades]
  advancementChanges: [action dots, special abilities, crew tier]
  bookShape: >-
    a short rulebook of a crime-caper game: chapters that follow the cycle of a score (planning, engagement, payoff,
    downtime), a clear plain voice that speaks to the players and the GM, worked examples set apart in boxes, and
    summary pages of the rolls
  playerBookShape: >-
    a players' guide to a criminal underworld: its crews and factions, the places a score may take them, written in
    the world's own voice with nothing addressed to the GM

entityTypes:
  - { type: rule, label: Rule, pluralLabel: Rules, folder: rules, fields: [{ key: category, label: Chapter, type: Text }, { key: order, label: Order, type: Number }], filterFields: [category] }
  - { type: action, label: Action, pluralLabel: Actions, folder: actions, fields: [{ key: attribute, label: Attribute, type: Text }], summaryFields: [attribute], filterFields: [attribute] }
  - { type: trauma, label: Trauma condition, pluralLabel: Trauma conditions, folder: trauma }
  - { type: special-ability, label: Special ability, pluralLabel: Special abilities, folder: special-abilities, playerFacing: true }
  - { type: crew-ability, label: Crew special ability, pluralLabel: Crew special abilities, folder: crew-abilities }
  - { type: crew-upgrade, label: Crew upgrade, pluralLabel: Crew upgrades, folder: crew-upgrades, fields: [{ key: cost, label: Upgrade boxes, type: Number }] }
  # Items are the table's own: the SRD gives no item list, so a campaign writes the items its scoundrels carry.
  - { type: item, label: Item, pluralLabel: Items, folder: items, playerFacing: true, fields: [{ key: load, label: Load, type: Number }] }

conditions: [Retired, Dead, Less effect, Reduced dice, Needs help]

conditionEffects:
  Reduced dice:
    modifiers: [{ target: '@pools', amount: -1, source: Harm }]

sheetKinds:
  - kind: scoundrel
    label: Scoundrel
    role: player

    keyedLists:
      # Action ratings: twelve actions in three attributes, each a number of dots (at most two at the start of play).
      - key: actions
        label: Actions
        itemFields: [{ key: rating, type: Number, min: 0, max: 4, display: dots }]
        keys:
          - { key: hunt,     label: Hunt,     group: insight }
          - { key: study,    label: Study,    group: insight }
          - { key: survey,   label: Survey,   group: insight }
          - { key: tinker,   label: Tinker,   group: insight }
          - { key: finesse,  label: Finesse,  group: prowess }
          - { key: prowl,    label: Prowl,    group: prowess }
          - { key: skirmish, label: Skirmish, group: prowess }
          - { key: wreck,    label: Wreck,    group: prowess }
          - { key: attune,   label: Attune,   group: resolve }
          - { key: command,  label: Command,  group: resolve }
          - { key: consort,  label: Consort,  group: resolve }
          - { key: sway,     label: Sway,     group: resolve }

    lists:
      - key: abilities
        label: Special abilities
        type: special-ability
      # Load is chosen when a score starts; items are ticked when used, not chosen in advance.
      - key: items
        label: Items
        type: item
        itemFields: [{ key: used, type: Boolean, default: false }]
        rules:
          - { check: "LoadUsed <= LoadMax", key: Actor.Rule.Load, message: "more load used than the chosen load allows ({LoadMax})." }

    values:
      # An attribute's rating is the number of its actions with at least one dot.
      - { key: insight, formula: "count(where(actions, a => a.group == 'insight'), a => a.rating >= 1)" }
      - { key: prowess, formula: "count(where(actions, a => a.group == 'prowess'), a => a.rating >= 1)" }
      - { key: resolve, formula: "count(where(actions, a => a.group == 'resolve'), a => a.rating >= 1)" }
      # Light 1-3, normal 4-5, heavy 6 (7-9 is encumbered, which is not a load anyone chooses).
      - { key: load,     input: true, options: [light, normal, heavy], default: normal }
      - { key: LoadMax,  formula: "load == 'light' ? 3 : load == 'heavy' ? 6 : 5" }
      - { key: LoadUsed, formula: "sum(where(items, i => i.used), i => i.load)" }

    tracks:
      # The SRD speaks of "your last stress box" without counting them; nine is the usual sheet's track.
      - key: stress
        label: Stress
        max: 9
        display: boxes
        # The last box marked: a trauma, stress clears, and the player circles one of the SRD's trauma conditions.
        overflow: { into: trauma, by: 1, then: reset, ask: { who: player, choices: [Cold, Haunted, Obsessed, Paranoid, Reckless, Soft, Unstable, Vicious] } }
      - key: trauma
        label: Trauma
        max: 4
        display: boxes
        # The fourth trauma condition: the character retires or goes to prison.
        thresholds: [{ atOrAbove: 4, condition: Retired }]
      # Harm: text in slots, by level. A full level pushes new harm up a level; past level 3 is fatal.
      - key: harm
        label: Harm
        display: slots
        holds: { type: text }
        levels:
          - { level: 1, slots: 2, condition: Less effect }
          - { level: 2, slots: 2, condition: Reduced dice }
          - { level: 3, slots: 1, condition: Needs help }
        whenFull: pushUp
        beyond: { condition: Dead }
      # Armor: standard, heavy and special, one box each; all are restored when the next load is chosen.
      - { key: armor,         label: Armor,         max: 1, display: boxes }
      - { key: heavy_armor,   label: Heavy armor,   max: 1, display: boxes }
      - { key: special_armor, label: Special armor, max: 1, display: boxes }
      # Coin on hand is worth carrying up to four; more is spent or goes to the stash. The stash decides how a retired
      # character ends up (0-10 poor, 11-20 meager, 21-39 modest, 40 fine).
      - { key: coin,  label: Coin,  min: 0, max: 4, display: boxes }
      - { key: stash, label: Stash, min: 0, max: 40 }
      # The experience tracks have no length in the SRD's text; these are the usual sheet's boxes.
      - { key: xp_insight,  label: Insight experience,  max: 6, display: boxes }
      - { key: xp_prowess,  label: Prowess experience,  max: 6, display: boxes }
      - { key: xp_resolve,  label: Resolve experience,  max: 6, display: boxes }
      - { key: xp_playbook, label: Playbook experience, max: 8, display: boxes }

    layout:
      - { section: Actions, widgets: [{ widget: table, key: actions, groupBy: group, columns: [rating] }, { widget: values, keys: [insight, prowess, resolve] }, { widget: roll, roll: action }, { widget: roll, roll: resistance }] }
      - { section: Condition, widgets: [{ widget: track, key: stress }, { widget: track, key: trauma }, { widget: track, key: harm }, { widget: track, key: armor }, { widget: track, key: heavy_armor }, { widget: track, key: special_armor }] }
      - { section: Abilities, widgets: [{ widget: list, key: abilities }] }
      - { section: Load, widgets: [{ widget: values, keys: [load, LoadUsed, LoadMax] }, { widget: list, key: items, columns: [used] }] }
      - { section: Advancement, widgets: [{ widget: track, key: xp_insight }, { widget: track, key: xp_prowess }, { widget: track, key: xp_resolve }, { widget: track, key: xp_playbook }] }
      - { section: Coin, widgets: [{ widget: track, key: coin }, { widget: track, key: stash }] }

  # The crew is a second sheet kind, with its own tracks.
  - kind: crew
    label: Crew
    role: shared
    lists:
      - key: abilities
        label: Crew special abilities
        type: crew-ability
      - key: upgrades
        label: Crew upgrades
        type: crew-upgrade
    values:
      - { key: tier, input: true, default: 0 }
      # Turf is held up to six pieces; each lowers the reputation needed to advance by one.
      - { key: turf, input: true, default: 0 }
      - { key: hold, input: true, options: [weak, strong], default: strong }
    tracks:
      # Heat 9 is a wanted level and the heat clears; what went past nine stays.
      - { key: heat, label: Heat, max: 9, display: boxes, overflow: { into: wanted, by: 1, then: carry } }
      - { key: wanted, label: Wanted level, max: 4, display: boxes }
      - { key: rep, label: Reputation, max: "12 - turf", display: boxes }
      - { key: coin, label: Coin, min: 0 }
    layout:
      - { section: Standing, widgets: [{ widget: values, keys: [tier, turf, hold] }, { widget: track, key: rep }, { widget: track, key: coin }] }
      - { section: Heat, widgets: [{ widget: track, key: heat }, { widget: track, key: wanted }] }
      - { section: Abilities, widgets: [{ widget: list, key: abilities }, { widget: list, key: upgrades }] }

# State that belongs to the campaign, not to any sheet.
campaign:
  clocks:
    # The SRD's sizes: a complex obstacle is 4 segments, a more complicated one 6, a daunting one 8.
    segments: [4, 6, 8]
    visibility: [gm, players]
  tables:
    - key: factions
      label: Faction status
      itemFields: [{ key: status, type: Number, min: -3, max: 3, default: 0 }]

rolls:
  # An action roll: a die per dot, plus bonus dice from inputs. Keep the highest; with no dice, roll two and keep the
  # lowest. Two or more sixes are a critical (never on the zero-dice roll). Position and effect come from the GM and are
  # carried on the result for the consequences.
  - key: action
    label: Action roll
    pool: "actions[input.action].rating + input.bonusDice + modifiers('@pools')"
    die: d6
    zeroDice: { roll: 2, keep: lowest }
    keep: { highest: 1 }
    inputs:
      - { key: action, from: roller }
      - { key: bonusDice, from: roller, default: 0, label: "Assist, push or bargain" }
      - { key: position, from: gm, options: [controlled, risky, desperate], default: risky }
      - { key: effect, from: gm, options: [limited, standard, great], default: standard }
    outcomes:
      - { name: critical, when: "!zeroDice && count(dice, d => d == 6) >= 2" }
      - { name: full,     when: "kept == 6" }
      - { name: partial,  when: "kept >= 4" }
      - { name: bad }
    carries: [position, effect]
  # Resisting a consequence: a die per point of the attribute; stress costs six minus the highest die, and a critical
  # clears one instead.
  - key: resistance
    label: Resistance roll
    pool: "score(input.attribute)"
    die: d6
    zeroDice: { roll: 2, keep: lowest }
    keep: { highest: 1 }
    inputs: [{ key: attribute, from: roller, options: [insight, prowess, resolve] }]
    outcomes:
      - { name: critical, when: "!zeroDice && count(dice, d => d == 6) >= 2" }
      - { name: resisted }
    then:
      - { when: "outcome == 'critical'", intents: [{ adjust: { track: stress, by: -1 } }] }
      - { when: "outcome != 'critical'", intents: [{ adjust: { track: stress, by: "6 - kept" } }] }
  # A group action: everyone involved rolls the action; the best result counts, and the leader takes a stress for each
  # participant whose result was bad.
  - key: group
    label: Group action
    participants: { from: gm, roll: action }
    result: best
    then:
      - { intents: [{ adjust: { actor: leader, track: stress, by: "count(results, r => r.outcome == 'bad')" } }] }

events:
  # Helping: the helper takes a stress, the roller gets a die (the roll's bonusDice input).
  assist:
    - { intents: [{ adjust: { actor: ev.helper, track: stress, by: 1 } }] }
  # Harm is written into a free slot of its level; the track pushes it up when the level is full.
  harm:
    - { intents: [{ mark: { track: harm, level: ev.level, text: ev.text } }] }
  roll:
    # A desperate action roll marks experience in the action's attribute.
    - { when: "ev.definition == 'action' && ev.inputs.position == 'desperate'", intents: [{ mark: { track: "'xp_' + actions[ev.inputs.action].group" } }] }
  sessionEnd:
    # Each experience trigger the table answers yes to marks one playbook experience.
    - { intents: [{ adjust: { track: xp_playbook, by: "count(ev.answers, a => a)" } }] }
  tick:
    # Clocks fill segment by segment; a full clock says so in the session log.
    - { target: campaign.clocks, intents: [{ adjust: { clock: ev.clock, by: ev.by } }] }
