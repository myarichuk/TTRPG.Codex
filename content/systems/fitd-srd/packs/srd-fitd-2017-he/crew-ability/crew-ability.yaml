- id: second-story
  name: קומה שנייה
  description: |-
    כאשר אתה מבצע חדירה חשאית, אתה מקבל **+1d** ל**הטלת הפתיחה**.
- id: war-dogs
  name: כלבי מלחמה
  description: |-
    כאשר אתה במלחמה (מעמד פלג של -3), הצוות שלך אינו סובל מ-1 אחיזה פחות, ולדמויות השחקנים עדיין יש שתי פעילויות בזמן הפנוי במקום אחת בלבד.
- id: accord
  name: ברית
  description: |-
    לפעמים חברים טובים כמו שטח. אתה רשאי להתייחס עד שלושה **מעמדות פלג של +3** שבאחיזתך כאילו הם **שטח**.

    > אם המעמד משתנה, אתה מאבד את השטח עד שהמעמד יחזור להיות +3. לא משנה כמה שטח באחיזתך (מיכולת זו או מכל מקור אחר), עלות ה**מוניטין** המזערית להעלאת הדרג שלך היא תמיד 6.
- id: fiends
  name: שדים
  description: |-
    פחד טוב כמו כבוד. אתה רשאי לספור כל **רמת מבוקש** כאילו היא **שטח**.

    > **רמת המבוקש** המרבית היא 4. לא משנה כמה שטח באחיזתך (מיכולת זו או מכל מקור אחר), עלות ה**מוניטין** המזערית להעלאת הדרג שלך היא תמיד 6.
- id: predators
  name: טורפים
  description: |-
    כאשר אתה משתמש בתוכנית חשאית או מתעתעת כדי לבצע רצח, קבל **+1d** ל**הטלת הפתיחה**.

    > יכולת זו חלה כשמטרת המבצע היא רצח. היא אינה חלה על מבצעים חשאיים או מתעתעים אחרים שאתה מנסה ושבמקרה כוללים הרג.
- id: anointed
  name: משוחים
  description: |-
    אתה מקבל **+1d** להטלות **התנגדות** מול איומים על-טבעיים. אתה מקבל **+1d** להטלות החלמה כשיש לך פציעה על-טבעית.
- id: all-hands
  name: כולם לעבודה
  description: |-
    במהלך ה**זמן הפנוי**, אחד מה**מקורבים** שלך רשאי לבצע פעילות בזמן הפנוי עבור הצוות כדי **להשיג נכס**, **להפחית** **חום**, או לעבוד על **פרויקט ארוך טווח**.
- id: deadly
  name: קטלניים
  description: |-
    כל דמות שחקן רשאית להוסיף +1 לדירוג הפעולה **ציד**, **התגנבות** או **קטטה** (עד דירוג מרבי של 3).

    > כל שחקן רשאי לבחור את הפעולה שהוא מעדיף (לא כולכם צריכים לבחור באותה פעולה). אם אתה בוחר ביכולת זו בזמן יצירת הדמות והצוות הראשונית, היא גוברת על המגבלה הרגילה לדירוגי פעולה בתחילת המשחק.
- id: death-veil
  name: צעיף המוות
  description: |-
    הודות לניסיון שנרכש בעמל או לטקס אוקולטי, אתה אינך צובר **חום** נוסף כשיש הרג במבצע.
- id: patron
  name: פטרון
  description: |-
    כאשר אתה מעלה את ה**דרג** שלך, זה עולה חצי מ**המטבעות** שהיה עולה בדרך כלל.

    > מי הפטרון שלך? למה הוא עוזר לך?
- id: high-society
  name: החברה הגבוהה
  description: |-
    הכול תלוי במי שאתה מכיר. קבל **-1 חום** בזמן הפנוי ו-**+1d** ל**איסוף מידע** על העילית של העיר.
- id: forged-in-the-fire
  name: מחושלים באש
  description: |-
    כל דמות שחקן התקשחה מניסיון אכזרי. אתה מקבל **+1d** להטלות **התנגדות**.

    > יכולת זו חלה על דמויות השחקנים בצוות. היא אינה מקנה קשיחות מיוחדת למקורבים שלך.
- id: synchronized
  name: מסונכרנים
  description: |-
    כאשר אתה מבצע **פעולה קבוצתית**, אתה רשאי לספור כמה 6 מהטלות שונות כהצלחה **קריטית**.

    > לדוגמה, ליריק מובילה פעולה קבוצתית של **התאמה** לשדה הרוחות כדי להתגבר על הגנה קסומה על דלתן של האחיות דימר. אמילי, השחקנית של ליריק, מטילה ומקבלת **6**, וגם מאט! מכיוון שלצוות יש יכולת מסונכרנים, שני ה-**6** הנפרדים שלהם נחשבים להצלחה **קריטית** בהטלה.
- id: no-traces
  name: בלי עקבות
  description: |-
    כאשר אתה שומר על מבצע שקט או גורם לו להיראות כתאונה, אתה מקבל מחצית מערך ה**מוניטין** של היעד (עיגול כלפי מעלה) במקום אפס. כשאתה מסיים את הזמן הפנוי עם אפס **חום**, קבל **+1** **מוניטין**.

    > יש לקוחות רבים שמעריכים מבצעים שקטים. יכולת זו מתגמלת אותך על שמירת פרופיל נמוך.
- id: pack-rats
  name: אוגרים
  description: |-
    המאורה שלך היא ערימה של חפצים גנובים. כשאתה מטיל כדי **להשיג נכס**, קבל **+1d**.

    > יכולת זו יכולה להעיד שהפריט שאתה צריך אכן נמצא בערימת הדברים שלך, או שיש לך עוד שאריות וחפצים להתמקח איתם.
- id: just-passing-through
  name: סתם עוברים
  description: |-
    במהלך ה**זמן הפנוי**, קבל **-1 חום**. כשה**חום** שלך הוא 4 או פחות, אתה מקבל **+1d** להונות אנשים כשאתם מעבירים את עצמכם כאזרחים רגילים.
