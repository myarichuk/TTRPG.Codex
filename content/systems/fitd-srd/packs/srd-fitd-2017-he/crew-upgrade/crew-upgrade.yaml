- id: training
  name: הכשרה
  description: |-
    אם יש לך שדרוג הכשרה, אתה מרוויח 2 נקודות ניסיון (במקום 1) כשאתה מתאמן במסלול ניסיון מסוים בזמן הפנוי (**בינה**, **כושר**, **נחישות**, או ניסיון פלייבוק). שדרוג זה למעשה עוזר לך להתקדם מהר יותר. ראה **התקדמות** למידע נוסף.  *אם יש לך הכשרת בינה, כשאתה מתאמן בבינה בזמן הפנוי, אתה מסמן 2 נקודות ניסיון במסלול **בינה** (במקום 1 בלבד). אם יש לך הכשרת פלייבוק, אתה מסמן 2 נקודות ניסיון במסלול ניסיון הפלייבוק שלך כשאתה מתאמן.*
- id: rigging
  name: אבזור
  description: |-
    אתה מקבל 2 עומס חינם בשתיים מקטגוריות הציוד (נשק, מכשירים, אספקה, אביזרים, מסמכים וכלים).
- id: vault
  name: כספת
  description: |-
    במאורה שלך יש כספת מאובטחת, שמגדילה את קיבולת האחסון של **מטבעות** ל-8. שדרוג שני מגדיל את הקיבולת ל-16.  חלק נפרד בכספת יכול לשמש כתא מעצר.
- id: carriage-house
  name: בית כרכרות
  description: |-
    יש לך כרכרה, חיות משא למשוך אותה, ורפת. שדרוג שני משפר את הכרכרה בשריון ובסוסים גדולים ומהירים יותר.
- id: workshop
  name: סדנה
  description: |-
    במאורה שלך יש סדנה המצוידת בכלים לטכנאות ולאלכימיה, וכן ספרייה קטנה של ספרים, מסמכים ומפות. אתה יכול להשלים פרויקטים ארוכי טווח עם נכסים אלה בלי לצאת מהמאורה.
- id: camouflage
  name: הסוואה
  description: |-
    כלי הרכב שלך מוסתרים לחלוטין כשהם במנוחה. הם משתלבים בסביבה, או נראים ככלי רכב אזרחי משעמם (לבחירתך).
- id: composed
  name: קור רוח
  description: |-
    כל דמות שחקן מקבלת **+1 משבצת לחץ**. פתיחת שדרוג זה עולה שלושה שדרוגים, לא אחד בלבד.
- id: hidden-lair
  name: מאורה נסתרת
  description: |-
    המאורה שלך נמצאת במקום סודי ומוסוותת כדי להסתיר אותה מהעין. אם המאורה שלך מתגלה, השתמש בשתי פעילויות בזמן הפנוי ושלם **מטבעות** כדרג שלך כדי להעביר אותה ולהסתיר אותה שוב.
- id: secure-lair
  name: מאורה מאובטחת
  description: |-
    במאורה שלך יש מנעולים, אזעקות ומלכודות כדי לסכל פולשים. שדרוג שני משפר את ההגנות וכולל אמצעים כישופיים שפועלים נגד רוחות. *אתה יכול להטיל את דרג הצוות שלך אם האמצעים האלה עומדים אי פעם במבחן, כדי לראות עד כמה הם מסכלים פולש.*
- id: prison-contacts
  name: קשרים בכלא
  description: |-
    הדרג שלך גבוה למעשה ב-+1 בכלא. *זה נחשב לכל גורם הקשור לדרג בכלא, כולל הטלת המאסר.*
- id: quarters
  name: מגורים
  description: |-
    המאורה שלך כוללת מגורים לצוות. בלי שדרוג זה, כל דמות שחקן ישנה במקום אחר, והיא חשופה לסכנה כשהיא עושה זאת.
- id: quality
  name: איכות
  description: |-
    **כל שדרוג משפר את דירוג האיכות** של כל פריטי דמויות השחקנים מאותו סוג, מעבר לאיכות שנקבעת לפי הדרג של הצוות ופריטים משובחים. אתה יכול לשפר את האיכות של **מסמכים**, **אביזרים** (כולל אביזרי פריצה ואביזרי טיפוס), **מכשירים** כישופיים, **אספקה** להסוואה, **כלים** (כולל כלי הרס וכלי טכנאות), ו**נשק**. *כלומר, אם הדרג שלך הוא 0, עם מפתחות מנעול משובחים (+1) ושדרוג איכות לאביזרים (+1), אתה יכול להתמודד שווה בשווה מול מנעול באיכות דרג II.*
- id: cohort
  name: מקורב
  description: |-
    מקורב הוא כנופיה או דמות מומחה יחידה בשליטת שה״מ שעובדת עבור הצוות שלך. לכל הפרטים על מקורבים, ראה את הסעיפים הבאים.
- id: elite-cohorts-specify-type
  name: מקורבי עילית (ציין סוג)
  description: |-
    כל המקורבים שלך מהסוג שצוין מקבלים **+1d** להטלות איכות לפעולות קשורות.
- id: mastery
  name: מומחיות
  description: |-
    לצוות שלך יש גישה להכשרה ברמת מאסטר. אתה רשאי להעלות את דירוגי הפעולה של דמויות השחקנים ל-4 (עד שתפתח שדרוג זה, דירוגי הפעולה של דמויות השחקנים מוגבלים ל-3). פתיחת שדרוג זה עולה ארבע משבצות שדרוג.
- id: hardened
  name: קשוח
  description: |-
    כל דמות שחקן מקבלת **+1** **משבצת** **טראומה**. פתיחת שדרוג זה עולה שלושה שדרוגים, לא אחד בלבד. *זה יכול להחזיר למשחק דמות עם 4 **טראומה** אם תרצה.*
- id: boat-house
  name: בית סירות
  description: |-
    יש לך סירה, מזח על נתיב מים, וצריף קטן לאחסון ציוד שיט. שדרוג שני משפר את הסירה בשריון ובקיבולת מטען גדולה יותר.
- id: underground-maps-and-passkeys
  name: מפות תת-קרקעיות ומפתחות מעבר
  description: |-
    יש לך מעבר קל בתעלות התת-קרקעיות, במנהרות ובמרתפים של העיר.
