- id: obsessed
  name: אובססיבי
  description: |-
    אתה שבוי בקסמו של דבר אחד: פעילות, אדם, אידיאולוגיה.
- id: soft
  name: רך לב
  description: |-
    אתה מאבד את החדות שלך; אתה נעשה סנטימנטלי, פסיבי, עדין.
- id: reckless
  name: פזיז
  description: |-
    אתה כמעט אינך מתחשב בביטחונך או באינטרסים שלך.
- id: vicious
  name: אכזרי
  description: |-
    אתה מחפש הזדמנויות לפגוע באנשים, גם בלי סיבה טובה.
- id: haunted
  name: רדוף
  description: |-
    אתה שקוע לעתים קרובות בהזיות, חי מחדש זוועות מהעבר, רואה דברים.
- id: unstable
  name: לא יציב
  description: |-
    מצבך הרגשי הפכפך. אתה יכול להתפרץ בזעם באחת, ליפול ליאוש, לפעול בפזיזות או לקפוא במקומך.
- id: paranoid
  name: פרנואיד
  description: |-
    אתה מדמיין סכנה בכל מקום; אתה אינך יכול לסמוך על אחרים.
- id: cold
  name: קר
  description: |-
    פניות רגשיות וקשרים חברתיים אינם מרגשים אותך.
