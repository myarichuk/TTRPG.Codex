- id: a-little-something-on-the-side
  name: משהו קטן בצד
  description: |-
    בסוף כל שלב של זמן פנוי, אתה מרוויח **+2 מטמון**.

    > מכיוון שהכסף הזה מגיע בסוף הזמן הפנוי, לאחר שכל הפעולות בזמן הפנוי נפתרו, אינך יכול להוציא אותו מהמטמון שלך ולהוציא אותו על פעילויות נוספות עד שלב הזמן הפנוי הבא שלך.
- id: alchemist
  name: אלכימאי
  description: |-
    כשאתה **ממציא** או **יוצר** יצירה בעלת מאפיינים *אלכימיים*, אתה מקבל **+1 רמת תוצאה** להטלה שלך (**1-3** הופך ל-**4/5**, וכן הלאה). אתה מתחיל עם נוסחה מיוחדת אחת שכבר ידועה לך.

    > בצע את הליך ההמצאה יחד עם שה״מ כדי להגדיר את הנוסחה האלכימית המיוחדת הראשונה שלך.
- id: ambush
  name: מארב
  description: |-
    כשאתה תוקף מהסתר או מפעיל מלכודת, אתה מקבל **+1d** להטלה שלך.

    > היכולת הזו נהנית מהכנה, אז אל תשכח שאפשר לעשות אותה בפלאשבק.
- id: analyst
  name: אנליסט
  description: |-
    בזמן הפנוי, אתה מקבל **שני סימונים** לחלק בין כל שעוני הפרויקטים ארוכי הטווח שעוסקים בחקירה או בלימוד של נוסחה או תוכנית תכנון חדשה.
- id: arcane-fighter
  name: לוחם מיסטי
  description: |-
    אתה יכול להחדיר לידיים, לנשק הקרב שלך או לכלים שלך אנרגיית רוחות. אתה מקבל **עוצמה** בקרב נגד העל-טבעי.

    > כשאתה מחדיר בעצמך אנרגיה מיסטית, איך אתה עושה זאת? איך נראית האנרגיה כשהיא מתגלה?
- id: arcane-mind
  name: תודעה מיסטית
  description: |-
    אתה תמיד מודע לישויות על-טבעיות הנמצאות בקרבתך. קח **+1d** בכל פעם שאתה מבצע **איסוף מידע** על העל-טבעי בכל דרך.
- id: artificer
  name: ממציא
  description: |-
    כשאתה **ממציא** או **יוצר** יצירה בעלת מאפייני *מלאכת-ניצוץ*, אתה מקבל **+1 רמת תוצאה** להטלה שלך (**1-3** הופך ל-**4/5**, וכן הלאה). אתה מתחיל עם תוכנית תכנון מיוחדת אחת שכבר ידועה לך.

    > בצע את הליך ההמצאה יחד עם שה״מ כדי להגדיר את תוכנית מלאכת-הניצוץ הראשונה שלך.
- id: battleborn
  name: נולד לקרב
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להפחית פציעה מהתקפה בקרב או כדי **להתאמץ יותר** במהלך קרב.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה "מפחית פציעה", הכוונה שרמת הפציעה שאתה מתמודד איתה כרגע יורדת באחת. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: bodyguard
  name: שומר ראש
  description: |-
    כשאתה **מגן** על חבר צוות, קח **+1d** להטלת ההתנגדות שלך. כשאתה מבצע איסוף מידע כדי לצפות איומים אפשריים במצב הנוכחי, אתה מקבל **+1 השפעה**.

    > תמרון שיתוף הפעולה "להגן" מאפשר לך לספוג תוצאה במקום חבר צוות. אם תבחר להתנגד לתוצאה הזו, היכולת הזו נותנת לך +1d להטלת ההתנגדות שלך. בנוסף, כשאתה קורא מצב כדי לבצע איסוף מידע על סכנות נסתרות או על תוקפים אפשריים, אתה מקבל +1 השפעה, כלומר מידע מפורט יותר.
- id: calculating
  name: מחושב
  description: |-
    בזכות התכנון הקפדני שלך, בזמן הפנוי אתה יכול לתת לעצמך או לחבר צוות אחר **+1 פעילות בזמן הפנוי**.

    > אם שכחת להשתמש ביכולת הזו בזמן הפנוי, אתה עדיין יכול להפעיל אותה במהלך המבצע ולחזור בפלאשבק לזמן הפנוי הקודם שבו התרחשה הפעילות הנוספת.
- id: connected
  name: בעל קשרים
  description: |-
    בזמן הפנוי, אתה מקבל **+1 רמת תוצאה** כשאתה **משיג משאב** או **מפחית חום**.

    > מערך הקשרים שלך בעולם התחתון יכול לשמש להשאלת משאבים, ללחץ על ספק כדי שייתן לך עסקה טובה יותר, להפחדת עדים וכן הלאה.
- id: daredevil
  name: נועז
  description: |-
    כשאתה מטיל פעולה **נואשת**, אתה מקבל **+1d** להטלה שלך אם אתה גם לוקח **-1d** לכל הטלות ההתנגדות נגד תוצאות הפעולה שלך.

    > היכולת המיוחדת הזו היא הימור קטן. קוביית הבונוס עוזרת לך, אבל אם אתה סובל מתוצאות, כנראה יהיה יקר יותר להתנגד להן. אבל היי, אתה נועז, אז אין בעיה, נכון?
- id: expertise
  name: מומחיות
  description: |-
    בחר אחד מדירוגי הפעולה שלך. כשאתה מוביל פעולה קבוצתית באמצעות הפעולה הזו, אתה יכול לסבול 1 לחץ לכל היותר, בלי קשר למספר ההטלות שנכשלו.

    > היכולת המיוחדת הזו טובה לכיסוי על הצוות שלך. אם כולם גרועים בפעולה המועדפת עליך, אינך צריך לדאוג שתסבול הרבה לחץ כשאתה מוביל את הפעולה הקבוצתית שלהם.
- id: focused
  name: ממוקד
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להתנגד לתוצאה של הפתעה או של פגיעה נפשית (פחד, בלבול, איבוד עקבות אחרי מישהו) או כדי **להתאמץ יותר** בקרב מרחוק או במעקב.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה "מתנגד לתוצאה" מהסוג המתאים, אתה נמנע ממנה לגמרי. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
