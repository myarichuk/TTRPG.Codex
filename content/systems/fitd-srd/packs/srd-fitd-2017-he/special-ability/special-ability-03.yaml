- id: savage
  name: פראי
  description: |-
    כשאתה משחרר אלימות פיזית, היא מפחידה במיוחד. כשאתה מפעיל **פיקוד** על מטרה מפוחדת, קח **+1d**.

    > אתה מטיל פחד על הסובבים אותך כשאתה נעשה אלים. התגובה שלהם תלויה באדם. יש שיברחו ממך, יש שיתרשמו, ויש שיגיבו באלימות. שה״מ שופט את התגובה של כל דמות שה״מ.
    >
    > בנוסף, כשאתה מפעיל **פיקוד** על מי שמושפע מפחד (מהיכולת הזו או מכל סיבה אחרת), קח +1d להטלה שלך.
- id: scout
  name: סייר
  description: |-
    כשאתה מבצע איסוף מידע כדי לגלות את מיקומה של מטרה, אתה מקבל **+1 השפעה**. כשאתה מתחבא בעמדה מוכנה או משתמש בהסוואה, אתה מקבל **+1d** להטלות כדי למנוע גילוי.

    > "מטרה" יכולה להיות אדם, יעד, מקום מארב טוב, חפץ וכן הלאה.
- id: shadow
  name: צל
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להתנגד לתוצאה של גילוי או של אמצעי אבטחה, או כדי **להתאמץ יותר** למעשה אתלטיקה או התגנבות.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה "מתנגד לתוצאה" מהסוג המתאים, אתה נמנע ממנה לגמרי. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: sharpshooter
  name: צלף
  description: |-
    אתה יכול **להתאמץ יותר** כדי לבצע אחד מאלה: *לבצע התקפה מרחוק במרחק קיצוני מעבר למקובל לנשק - לשחרר מטח ירי מהיר כדי לדכא את האויב.*

    > כשאתה מתאמץ יותר כדי להפעיל את היכולת הזו, אתה עדיין מקבל אחד מהיתרונות הרגילים של התאמצות (+1d, +1 השפעה וכדומה) בנוסף ליכולת המיוחדת.
    >
    > השימוש הראשון ביכולת הזו מאפשר לך לנסות ירי צלפים למרחקים ארוכים שאחרת היה בלתי אפשרי עם נשק חם פרימיטיבי טיפוסי. השימוש השני מאפשר לך לשמור על קצב ירי יציב בקרב (מספיק כדי "לדכא" כנופיה קטנה של עד שישה אנשים), במקום לעצור לטעינה איטית או להשליך נשק אחרי כל ירייה. כשאויב מדוכא, הוא מהסס לתמרן או לתקוף (בדרך כלל זה מצריך הטלת מזל כדי לראות אם הוא מצליח).
- id: strange-methods
  name: שיטות מוזרות
  description: |-
    כשאתה **ממציא** או **יוצר** יצירה בעלת מאפיינים *מיסטיים*, קבל **+1 רמת תוצאה** להטלה שלך (**1-3** הופך ל-**4/5**, וכן הלאה). אתה מתחיל עם תוכנית תכנון מיסטית אחת שכבר ידועה לך.

    > בצע את הליך ההמצאה יחד עם שה״מ כדי להגדיר את תוכנית התכנון המיסטית הראשונה שלך.
- id: subterfuge
  name: ערמומיות
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להתנגד לתוצאה של חשד או שכנוע, או כדי **להתאמץ יותר** בתחבולות.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה "מתנגד לתוצאה" מהסוג המתאים, אתה נמנע ממנה לגמרי. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: supernatural-ward
  name: הגנה על-טבעית
  description: |-
    כשאתה מבצע **הרס** באזור באמצעות חומרים מיסטיים, ומשחית אותו לכל שימוש אחר, הוא הופך לשנוא או למפתה עבור העל-טבעי (לבחירתך).

    > אם אתה הופך אזור לשנוא על העל-טבעי, הם יעשו הכול כדי להימנע ממנו, ויסבלו ייסורים אם יאולצו להיכנס אליו. אם אתה הופך אזור למפתה לרוחות, הן יחפשו אותו וישהו בו, ויסבלו ייסורים אם יאולצו לעזוב. הקסם הזה נמשך כמה ימים על שטח בגודל חדר קטן. ישויות חזקות במיוחד או מוכנות עשויות להטיל את האיכות שלהן או את העוצמה המיסטית שלהן כדי לראות עד כמה הן מצליחות להתנגד לקסם.
- id: the-devils-footsteps
  name: צעדי השטן
  description: |-
    אתה יכול **להתאמץ יותר** כדי לבצע אחד מאלה: *לבצע מעשה אתלטיקה שגובל בעל-אנושי - לתמרן כדי לבלבל את האויבים כך שיתקפו זה את זה בטעות.*

    > כשאתה מתאמץ יותר כדי להפעיל את היכולת הזו, אתה עדיין מקבל אחד מהיתרונות הרגילים של התאמצות (+1d, +1 השפעה וכדומה) אם אתה מבצע הטלה, בנוסף ליכולת המיוחדת.
    >
    > אם אתה מבצע מעשה אתלטי (ריצה, התגלגלות, שיווי משקל, טיפוס וכן הלאה) שגובל בעל-אנושי, אתה עשוי לטפס על משטח חלק שאין בו אחיזה טובה, להתגלגל בבטחה מנפילה של שלוש קומות, לזנק למרחק מדהים וכן הלאה.
    >
    > אם אתה מתמרן כדי לבלבל את האויבים, הם תוקפים זה את זה לרגע לפני שהם מבינים את טעותם. שה״מ עשוי לבצע הטלת מזל כדי לראות עד כמה הם פוגעים זה בזה או מפריעים זה לזה.
- id: tough-as-nails
  name: קשוח כברזל
  description: |-
    עונשי הפציעה קלים ברמה אחת (אך פציעה ברמה 4 עדיין קטלנית).

    > עם היכולת הזו, פציעה ברמה 3 אינה משביתה אותך; במקום זאת אתה לוקח -1d להטלות שלך (כאילו הייתה פציעה ברמה 2). פציעה ברמה 2 משפיעה עליך כאילו הייתה ברמה 1 (השפעה מופחתת). פציעה ברמה 1 אינה משפיעה עליך כלל (אבל אתה עדיין רושם אותה בדף שלך, ועליך להחלים כדי לרפא אותה). רשום את הפציעה ברמתה המקורית - לצורך ריפוי, חלה רמת הפציעה המקורית.
- id: trust-in-me
  name: סמוך עליי
  description: |-
    אתה מקבל **+1d** מול מטרה שיש לך איתה קשר אינטימי.

    > היכולת הזו אינה רק לאינטראקציות חברתיות. כל פעולה יכולה לקבל את הבונוס. "אינטימי" נתון להגדרה שלך ושל הקבוצה, ואין הכרח שהכוונה לאינטימיות רומנטית בלבד.
- id: vengeful
  name: נקמני
  description: |-
    אתה מקבל **טריגר ניסיון** נוסף: *נקמת במי שפגע בך או במי שאכפת לך ממנו.* אם הצוות שלך עזר לך לנקום, סמן גם ניסיון לצוות.
- id: vigorous
  name: מלא חיים
  description: |-
    אתה מחלים מפציעה מהר יותר. מלא לצמיתות אחד ממקטעי שעון ההחלמה שלך. קח **+1d** להטלות טיפול רפואי.

    > שעון ההחלמה שלך הופך לשעון של 3, ואתה מקבל קוביית בונוס כשאתה מחלים.
- id: warded
  name: מוגן
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להתנגד לתוצאה על-טבעית, או כדי **להתאמץ יותר** כשאתה מתמודד עם כוחות מיסטיים או משתמש בהם.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה מתנגד לתוצאה, היכולת הזו מבטלת או מקטינה את חומרתה. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: weaving-the-web
  name: טוויית הרשת
  description: |-
    אתה מקבל **+1d** ל**היכרויות** כשאתה מבצע איסוף מידע על מטרה למבצע. אתה מקבל **+1d** ל**הטלת הפתיחה** של אותו מבצע.

    > רשת הקשרים שלך בעולם התחתון תמיד יכולה לשמש כדי להשיג בינה לעבודה - אפילו כשאנשי הקשר שלך לא מודעים לכך שהם עוזרים לך.
