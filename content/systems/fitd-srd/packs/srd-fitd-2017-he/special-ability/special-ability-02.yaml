- id: foresight
  name: ראיית הנולד
  description: |-
    פעמיים בכל מבצע אתה יכול **לסייע** לחבר צוות בלי לשלם לחץ. תאר איך התכוננת לכך.

    > אתה יכול לספר על אירוע בעבר שעוזר לחבר הצוות שלך עכשיו, או להסביר איך צפית את המצב הזה ותכננת מראש תגובה מועילה שאתה חושף עכשיו.
- id: fortitude
  name: חוסן
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי להתנגד לתוצאה של עייפות, חולשה או השפעות כימיות, או כדי **להתאמץ יותר** כשאתה עובד במיומנות טכנית או מטפל בחומרים אלכימיים.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה "מתנגד לתוצאה" מהסוג המתאים, אתה נמנע ממנה לגמרי. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: infiltrator
  name: מסתנן
  description: |-
    אתה אינך מושפע מ**איכות** או מ**דרג** כשאתה עוקף אמצעי אבטחה.

    > היכולת הזו מאפשרת לך להתמודד עם אויבים בדרג גבוה יותר בתנאים שווים. כשאתה פורץ כספת, פורץ מנעול או מתגנב על פני שומרי עילית, רמת ההשפעה שלך לעולם אינה מופחתת בגלל דרג עליון או רמת איכות עליונה של היריבים שלך.
    >
    > האם אתה פורץ כספות מפורסם? האם מספרים סיפורים על איך חמקת מתחת לאפם של שני מפקחים ראשיים, או שהכישרונות יוצאי הדופן שלך עדיין לא התגלו?
- id: iron-will
  name: רצון ברזל
  description: |-
    אתה חסין מפני האימה שישויות על-טבעיות מסוימות מטילות במבט. כשאתה מבצע **הטלת התנגדות** עם **נחישות**, קח **+1d**.

    > עם היכולת הזו, אתה לא קופא ולא נמלט כשאתה ניצב מול כל סוג של ישות על-טבעית או אירוע אוקולטי מוזר.
- id: leader
  name: מנהיג
  description: |-
    כשאתה מפעיל **פיקוד** על **מקורבים** בקרב, הם ממשיכים להילחם גם כשהיו אמורים **להישבר** (הם לא יוצאים מהקרב כשהם סובלים פציעה ברמה 3). הם מקבלים **+1 השפעה** ו-**1 שריון**.

    > היכולת הזו הופכת את המקורבים שלך ליעילים יותר בקרב ומאפשרת להם גם להתנגד לפציעה באמצעות שריון. כל עוד אתה מוביל אותם, הם לא יפסיקו להילחם עד שיסבלו פציעה קטלנית (רמה 4) או עד שתורה להם להפסיק. מה אתה עושה כדי לעורר אומץ כזה בקרב?
- id: like-looking-into-a-mirror
  name: כמו להסתכל במראה
  description: |-
    אתה תמיד יודע מתי מישהו משקר לך.

    > היכולת הזו פועלת בכל המצבים ללא הגבלה. היא עוצמתית מאוד, אבל גם קצת קללה. אתה רואה דרך כל שקר, אפילו השקרים החביבים.
- id: mastermind
  name: מוח מתכנן
  description: |-
    אתה יכול לנצל את **השריון המיוחד** שלך כדי **להגן** על חבר צוות, או כדי **להתאמץ יותר** כשאתה מבצע איסוף מידע או עובד על פרויקט ארוך טווח.

    > כשאתה משתמש ביכולת הזו, סמן את משבצת השריון המיוחד בדף הפלייבוק שלך. אם אתה מגן על חבר צוות, היכולת הזו מבטלת או מקטינה את חומרת התוצאה או הפציעה שחבר הצוות שלך מתמודד איתה. אינך חייב להיות נוכח כדי להשתמש ביכולת הזו — אמור איך התכוננת למצב הזה בעבר. אם אתה משתמש ביכולת הזו כדי להתאמץ יותר, אתה מקבל אחד מהיתרונות (+1d, +1 השפעה, פעולה למרות פציעה קשה) אבל אינך לוקח 2 לחץ. השריון המיוחד שלך מתחדש בתחילת הזמן הפנוי.
- id: mesmerism
  name: היפנוט
  description: |-
    כשאתה מפעיל **שכנוע** על מישהו, אתה יכול לגרום לו לשכוח שזה קרה עד הפעם הבאה שהוא יתקשר איתך.

    > זיכרון הקורבן "מטשטש" את הזמן החסר, ולכן אין בכך חשד שהוא שכח משהו. כשאתה מתקשר איתו בפעם הבאה, הוא זוכר הכול בבירור, כולל את ההשפעה המוזרה של היכולת הזו.
- id: mule
  name: סבל
  description: |-
    מגבלות העומס שלך גבוהות יותר. קל: 5. רגיל: 7. כבד: 8.

    > היכולת הזו מצוינת אם אתה רוצה ללבוש שריון כבד ולשאת נשק כבד בלי למשוך הרבה תשומת לב. מכיוון שהציוד המדויק שלך נקבע תוך כדי מבצע, עומס גדול יותר נותן לך גם יותר אפשרויות להיות יצירתי כשאתה מתמודד עם בעיות במהלך מבצע.
- id: not-to-be-trifled-with
  name: אין להתעסק איתי
  description: |-
    אתה יכול **להתאמץ יותר** כדי לבצע אחד מאלה: *לבצע מעשה כוח פיזי שגובל בעל-אנושי - להתמודד בקרב מגע עם כנופיה קטנה בתנאים שווים.*

    > כשאתה מתאמץ יותר כדי להפעיל את היכולת הזו, אתה עדיין מקבל אחד מהיתרונות הרגילים של התאמצות (+1d, +1 השפעה וכדומה) בנוסף ליכולת המיוחדת.
    >
    > אם אתה מבצע מעשה שגובל בעל-אנושי, אתה עשוי לשבור נשק מתכת בידיים חשופות, להפיל סוס דוהר, להרים משקל עצום וכן הלאה. אם אתה מתמודד עם כנופיה קטנה בתנאים שווים, אתה אינך סובל מהשפעה מופחתת בגלל קנה מידה מול כנופיה קטנה (עד שישה אנשים).
- id: reflexes
  name: רפלקסים
  description: |-
    כשיש שאלה מי פועל ראשון, התשובה היא אתה.

    > היכולת הזו נותנת לך את היוזמה ברוב המצבים. לדמויות שה״מ מאומנות במיוחד עשויים להיות רפלקסים גם כן, אבל חוץ מזה אתה תמיד הראשון לפעול, ואתה יכול להפריע לכל מי שמנסה להקדים אותך. היכולת הזו בדרך כלל אינה מבטלת את הצורך לבצע הטלת פעולה שהיית צריך לבצע בכל מקרה, אבל היא עשויה לשפר את העמדה או ההשפעה שלך.
- id: ritual
  name: טקס
  description: |-
    אתה מכיר את השיטות המיסטיות לביצוע כישוף טקסים. אתה יכול לבצע **עיון** בטקס אוקולטי (או ליצור חדש) כדי לזמן השפעה או ישות על-טבעית. אתה מתחיל עם טקס אחד שכבר למדת.

    > בלי היכולת המיוחדת הזו, לימוד ותרגול של טקסים משאירים אותך חשוף לגמרי לכוחות שאליהם אתה פונה. מאמצים כאלה אינם מומלצים.
- id: rooks-gambit
  name: מהלך הצריח
  description: |-
    קח **2 לחץ** כדי להטיל את דירוג הפעולה הטוב ביותר שלך בזמן שאתה מבצע פעולה אחרת. אמור איך אתה מתאים את המיומנות שלך לשימוש הזה.

    > זו יכולת "אשף בכל תחום". אם אתה רוצה לנסות הרבה סוגי פעולות ועדיין להטיל מאגר קוביות טוב, זו היכולת המיוחדת בשבילך.
- id: saboteur
  name: חבלן
  description: |-
    כשאתה מבצע **הרס**, העבודה שלך שקטה בהרבה ממה שהיא אמורה להיות, והנזק מוסתר היטב מפני בדיקה שטחית.

    > אתה יכול לקדוח חורים בדברים, להמיס חפצים בחומצה ואפילו להשתמש בחומר נפץ משתיק, והכול יהיה שקט מאוד וקשה מאוד לזיהוי.
