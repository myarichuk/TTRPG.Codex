- id: the-core-system-the-game-structure
  name: מבנה המשחק
  description: |-
    ל*Blades in the Dark* יש מבנה משחק בן ארבעה חלקים. כברירת מחדל המשחק נמצא ב**משחק חופשי**: הדמויות מדברות זו עם זו, הולכות למקומות, עושות דברים ומטילות קוביות לפי הצורך.

    כשהקבוצה מוכנה, היא בוחרת *מטרה* למבצע הבא ואחר כך בוחרת סוג של *תוכנית*. זה מפעיל את *הטלת הפתיחה* (שקובעת את המצב בתחילת המבצע), ואז המשחק עובר לשלב ה**מבצע**.

    במהלך המבצע הדמויות השחקניות פועלות מול המטרה: הן מטילות קוביות, מתגברות על מכשולים, קוראות לפלאשבקים ומשלימות את המבצע (בהצלחה או בלעדיה). כשהמבצע מסתיים, המשחק עובר לשלב ה**זמן הפנוי**.

    בשלב הזמן הפנוי שה״מ מפעיל את המערכות של *שלל*, *חום* ו*סבכים* כדי לקבוע את כל תוצאות הלוואי של המבצע. אחר כך כל דמות שחקנית מקבלת את *פעולות הזמן הפנוי* שלה, למשל להתמסר ליצר שלה כדי להסיר לחץ או לעבוד על פרויקט ארוך טווח. כשכל פעולות הזמן הפנוי הושלמו, המשחק חוזר ל**משחק חופשי** והמחזור מתחיל מחדש.

    השלבים הם מודל מושגי שנועד לעזור לך לארגן את המשחק. הם אינם מבנים נוקשים שמגבילים את האפשרויות שלך (ולכן הם מוצגים ככתמי דיו חסרי קצוות חדים). חשוב על השלבים כעל תפריט אפשרויות שמתאים לכל דבר שאתה מנסה להשיג במשחק. כל שלב מתאים למטרה אחרת.

- id: the-faction-game-claims
  name: תביעות
  description: |-
    על דף הצוות יש מפה של תביעות שאפשר להשתלט עליהן. מפת התביעות מציגה מסלול ברירת מחדל לסוג הצוות שלך. בדרך כלל כדאי להשתלט על תביעות בסדר מסודר, לפי השבילים היוצאים מהמשבצת המרכזית, המאורה של הצוות.

    *עם זאת, אתה יכול לנסות להשתלט על כל תביעה במפה שלך*, תוך התעלמות מהשבילים (או אפילו לחפש תביעה מיוחדת שאינה במפה שלך), אבל מבצעים כאלה יהיו תמיד קשים במיוחד ויצריכו מאמצים יוצאי דופן כדי לגלות ולהשיג את התביעה.

- id: the-faction-game-claims-losing-a-claim
  name: אובדן תביעה
  description: |-
    פלג אויב עשוי לנסות להשתלט על תביעה שהצוות שלך מחזיק בה. אתה יכול להילחם כדי להגן עליה, או לנהל משא ומתן עם הפלג, לפי המצב. אם אתה מאבד תביעה, אתה מאבד את כל היתרונות שלה. אם המאורה שלך אבדה, אתה מאבד את היתרונות של כל התביעות שלך עד שתשחזר את המאורה או תקים מאורה חדשה. כדי לשחזר מאורה או להקים מאורה חדשה, בצע מבצע שמטרתו לעשות זאת.

- id: the-faction-game-claims-seizing-a-claim
  name: כיבוש תביעה
  description: |-
    כל תביעה כבר נמצאת בשליטת פלג כלשהו. כדי להשיג תביעה לעצמך, אתה צריך לקחת אותה ממישהו אחר. כדי לכבוש תביעה, אמור לשה״מ על איזו תביעה במפה שלך הצוות שלך מתכוון להשתלט. שה״מ יפרט את התביעה עם מיקום ותיאור, ויגיד לך איזה פלג שולט בה כרגע. לחלופין שה״מ עשוי להציע לך בחירה בין כמה אפשרויות, אם יש כאלה.

    אם אתה בוחר להתעלם משבילי המפה בעת כיבוש תביעה, שה״מ עשוי להגיד לך שעליך לחקור ולאסוף מידע כדי לגלות תביעה מהסוג הזה לפני שתוכל לנסות לכבוש אותה.

    בצע את המבצע כמו כל **מבצע** אחר, ואם הצלחת, אתה כובש את התביעה והפלג שהיה היעד מאבד אותה.

    כיבוש תביעה הוא התקפה חמורה על פלג, ובדרך כלל גורר -2 מעמד פלג מול היעד, ואולי +1 מעמד מול אויביו.

    ברגע שכבשת תביעה, אתה נהנה מהיתרון הרשום שלה כל עוד אתה מחזיק בה. חלק מהתביעות נחשבות **שטח**. אחרות מעניקות לצוות יתרונות מיוחדים, כמו קוביות בונוס בנסיבות מסוימות, **מטבעות** נוספים שנכנסים לאוצר הצוות, או הזדמנויות חדשות לפעולה.

- id: the-faction-game-development
  name: התפתחות
  description: |-
    כדי לטפס בסולם ולפתח את הצוות שלך, אתה צריך **מוניטין**. **מוניטין** הוא מדד של השפעה והערכה. כשאתה צובר מספיק **מוניטין**, הפלגים האחרים לוקחים אותך ברצינות רבה יותר ואתה מושך את התמיכה שנדרשת כדי להתפתח ולצמוח.

    כשאתה משלים מבצע, הצוות שלך מרוויח **2 מוניטין**. אם מטרת המבצע היא מדרג גבוה מדרג הצוות שלך, אתה מקבל **+1 מוניטין** לכל דרג של הפרש. אם מטרת המבצע היא מדרג נמוך יותר, אתה מקבל **-1 מוניטין** לכל דרג של הפרש (מינימום אפס).

    אתה צריך **12 מוניטין** כדי למלא את מד ה**מוניטין** שבדף הצוות. כשאתה ממלא את המד, בצע אחד מאלה:

    * אם האחיזה שלך חלשה, היא נעשית חזקה. **אפס את המוניטין שלך לאפס**.
    * אם האחיזה שלך חזקה, אתה יכול לשלם כדי להעלות את דרג הצוות שלך באחד. זה עולה **מטבעות** בגובה **הדרג החדש x 8**. כל עוד מד ה**מוניטין** שלך מלא, אתה לא מרוויח **מוניטין** חדש (12 הוא המקסימום). אחרי ששילמת והעלית את הדרג, **אפס את המוניטין שלך לאפס** ו**הורד את האחיזה שלך לחלשה**.

- id: the-faction-game-faction-status
  name: מעמד הפלגים
  description: |-
    ה**מעמד** של הצוות שלך מול כל פלג מציין עד כמה אוהבים אתכם או שונאים אתכם. המעמד מדורג בין -3 ל־+3, כאשר אפס (ניטרלי) הוא מעמד ההתחלה כברירת מחדל. אתה עוקב אחרי המעמד שלך מול כל פלג בדף הפלגים.

    כשאתה יוצר את הצוות שלך, אתה מקצה כמה דירוגי מעמד חיוביים ושליליים כדי לשקף היסטוריה אחרונה. אחר כך הדירוגים משתנים עם הזמן לפי המעשים שלך במשחק.

- id: the-faction-game-faction-status-faction-status-changes
  name: שינויי מעמד הפלגים
  description: |-
    כשאתה מבצע מבצע, אתה מקבל -1 או -2 מעמד מול פלגים שנפגעים ממעשיך. אתה עשוי גם לקבל +1 מעמד מול פלג שהמבצע שלך עוזר לו. (אם אתה שומר על המבצע שקט לגמרי, המעמד שלך לא משתנה.) המעמד שלך עשוי להשתנות גם אם אתה עושה טובה לפלג או מסרב לאחת מדרישותיו.

- id: the-faction-game-faction-status-faction-status-levels
  name: רמות מעמד הפלגים
  description: |-
    * **+3: בעלי ברית.** הפלג הזה יעזור לך גם אם זה לא האינטרס שלו. הוא מצפה שתעשה את אותו הדבר למענו.
    * **+2: ידידותי.** הפלג הזה יעזור לך אם זה לא יוצר לו בעיות חמורות. הוא מצפה שתעשה את אותו הדבר.
    * **+1: מועיל.** הפלג הזה יעזור לך אם זה לא גורם לו בעיות או עלות משמעותית. הוא מצפה לאותו דבר ממך.
    * **0: ניטרלי**
    * **-1: מפריע.** הפלג הזה יחפש הזדמנויות לגרום לך צרות (או להרוויח מהמזל הרע שלך) כל עוד זה לא גורם לו בעיות או עלות משמעותית. הוא מצפה לאותו דבר ממך.
    * **-2: עוין.** הפלג הזה יחפש הזדמנויות לפגוע בך כל עוד זה לא יוצר לו בעיות חמורות. הוא מצפה שתעשה את אותו הדבר, ונוקט אמצעי זהירות נגדך.
    * **-3: מלחמה.** הפלג הזה יטרח לפגוע בך גם אם זה לא האינטרס שלו. הוא מצפה שתעשה את אותו הדבר, ונוקט אמצעי זהירות נגדך. כשאתה במלחמה עם פלג כלשהו (או כמה פלגים), הצוות שלך סופג +1 **חום** מכל מבצע, מאבד זמנית 1 אחיזה, והדמויות השחקניות מקבלות רק פעולת זמן פנוי אחת במקום שתיים. אתה יכול לסיים מלחמה על ידי חיסול האויב או על ידי משא ומתן להסכמה הדדית שקובעת דירוג מעמד חדש.

    > אם לצוות שלך יש אחיזה חלשה כשאתה יוצא למלחמה, אובדן האחיזה הזמני גורם לך לאבד דרג אחד. כשהמלחמה נגמרת, החזר את דרג הצוות שלך לרמה שהייתה לפני המלחמה.

- id: the-faction-game-hold
  name: אחיזה
  description: |-
    בסולם הפלגים, ליד מספרי הדרגים, מופיעה אות שמציינת את עוצמת ה**אחיזה** של כל פלג. אחיזה מייצגת עד כמה פלג מסוגל לשמור על מקומו הנוכחי בסולם. W מציינת אחיזה **חלשה**. S מציינת אחיזה **חזקה**. הצוות שלך מתחיל באחיזה **חזקה** ב**דרג 0**.

- id: the-faction-game-tier
  name: דרג
  description: |-
    כל פלג בולט מדורג לפי **דרג**, מדד של עושר, השפעה והיקף. בראש הסולם נמצאים הפלגים מדרג V ו־VI, כוחות העל האמיתיים של העיר. הצוות שלך מתחיל בדרג 0.

    תשתמש בדירוג הדרג שלך כדי להטיל קוביות כשאתה משיג נכס, וכן בכל הטלת מזל שבה רמת הכוח וההשפעה הכוללת של הצוות היא התכונה העיקרית. והחשוב מכול: הדרג שלך קובע את **רמת האיכות** של הפריטים שלך ואת האיכות וה**היקף** של הכנופיות שהצוות שלך מעסיק, ובכך גם את גודל האויב שאתה יכול לצפות להתמודד איתו.

- id: the-faction-game-tier-gang-scale-by-tier
  name: גודל הכנופיה לפי דרג
  description: |-
    * **דרג V**. כנופיות עצומות. (80 איש)
    * **דרג IV**. כנופיות גדולות מאוד. (40 איש)
    * **דרג III**. כנופיות גדולות. (20 איש)
    * **דרג II**. כנופיות בינוניות. (12 איש)
    * **דרג I**. כנופיות קטנות. (3-6 אנשים)
    * **דרג 0**. 1 או 2 אנשים

- id: the-faction-game-turf
  name: שטח
  description: |-
    דרך נוספת לתרום להתפתחות הצוות היא לרכוש **שטח**. כשאתה כובש ומחזיק בטריטוריה, אתה יוצר בסיס יציב יותר ל**מוניטין** שלך. כל חלק של שטח שאתה תובע מייצג תמיכה מופשטת בצוות (לעיתים קרובות תוצאה של הפחד שאתה מטיל על התושבים באותו שטח).

    השטח מסומן במד ה**מוניטין** שלך (ראה את הדוגמה למטה). כל חלק של שטח שאתה מחזיק מפחית באחד את מחיר ה**מוניטין** של ההתפתחות. כלומר, אם יש לך 2 שטח, אתה צריך 10 **מוניטין** כדי להתפתח. אם יש לך 4 שטח, אתה צריך 8 **מוניטין** כדי להתפתח. **אתה יכול להחזיק לכל היותר 6 שטח.** כשאתה מתפתח ומאפס את ה**מוניטין** שלך, **אתה שומר את הסימונים של כל השטח שאתה מחזיק.**

    ---

    *אם אתה מחזיק ב־3 חלקי שטח, אתה צריך רק 9 **מוניטין** כדי להתפתח, במקום 12.*

    | **מוניטין** |          |          |          |          |          |          |     |          |          |          |          |          |          | **שטח** |
    | ------- | -------- | -------- | -------- | -------- | -------- | -------- | --- | -------- | -------- | -------- | -------- | -------- | -------- | -------- |
    |         | ○ | ○ | ○ | ○ | ○ | ○ |     | ○ | ○ | ○ | ⊗ | ⊗ | ⊗ |          |

    *כשאתה מתפתח, תמחק את 9 סימוני ה**מוניטין**, אבל תשמור את 3 סימוני השטח. סמן שטח בצד ימין, כדי להראות את ה״תקרה״ של כמות ה**מוניטין** שנדרשת.*

    ---

    כמו כן, כשאתה רוכש שטח, אתה מרחיב את היקף **שטחי הציד** של הצוות שלך.

- id: the-faction-game-turf-reducing-hold
  name: הפחתת אחיזה
  description: |-
    אתה רשאי לבצע מבצע שמטרתו המפורשת להפחית את האחיזה של פלג אחר, אם אתה יודע איפה הוא פגיע. אם המבצע מצליח, הפלג שהיה היעד מאבד 1 רמת אחיזה. אם האחיזה שלו חלשה והיא יורדת, הפלג מאבד 1 דרג ונשאר חלש.

    כשפלג נמצא במלחמה, הוא מאבד זמנית 1 אחיזה.

    גם הצוות שלך יכול לאבד אחיזה, לפי אותם כללים. אם הצוות שלך בדרג 0 עם אחיזה חלשה ואתה מאבד אחיזה מכל סיבה שהיא, המאורה שלך נתונה לאיום מצד אויביך או מצד פלג שמבקש להרוויח מהמזל הרע שלך.

- id: the-score
  name: המבצע
  description: |-
    *רצח בשכר, סחיטה אכזרית, טקסים אפלים, עסקאות אסורות, הברחות, גניבה בצללים: הסיכויים האחרונים שנותרו לאלה שנדחקו לשוליים ושוללים מהם את הפריבילגיות של האליטה המושחתת והטורפנית.*

    ב*Blades in the Dark* אנחנו משחקים כדי לגלות אם צוות צעיר של דמויות יכול לשגשג בעולם התחתון, ושגשוג זה תלוי במעשי הפשע שלהם, שאנחנו קוראים להם **מבצעים**.

    מבצע הוא פעולה אחת עם מטרה מסוימת: *לפרוץ לאחוזה של לורד, לחסל את הדיפלומט, להבריח חפץ מוזר לתוך העיר* וכדומה. בדרך כלל מבצע ייפול לאחת משלוש קטגוריות:

    * **פעילות פלילית**, שנקבעת לפי סוג הצוות שלך. חיסול, פריצה, עסקת יצר אסורה וכדומה.
    * כיבוש **תביעה** שאתה בוחר מתוך **מפת התביעות** של הצוות שלך. תביעות עוזרות לצוות שלך לגדול ולהתפתח.
    * **משימה מיוחדת** או מטרה שנקבעת על ידי השחקנים (כמו להשיג חפץ נדיר שיעצים את אחד הטקסים של הלוחש).

    מבצע יכול להיות ארוך ומסובך או קצר ולעניין. אולי יהיו הרבה הטלות וצרות, ואולי רק כמה פעולות כדי להכריע אותו. *שחקו כדי לגלות מה יקרה!* מבצע לא חייב למלא כל פעם מפגש משחק שלם. תנו לו להיות באורך שהוא.

    הדמויות השחקניות יכולות להתחיל מבצע חדש על ידי בחירת מטרה (למשל מתוך התביעות שלהן או מרשימת הפלגים), על ידי פנייה ללקוח פוטנציאלי ובקשת עבודה, או על ידי פנייה של דמות לא שחקנית שצריכה לשכור צוות למשימה.

    מבצע מורכב מכמה מרכיבי מפתח, שמפורטים בפרק הזה: **תכנון ופתיחה**, **פלאשבקים** ו**עבודת צוות**.
