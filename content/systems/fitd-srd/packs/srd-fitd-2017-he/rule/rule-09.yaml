- id: payoff
  name: שלל
  description: |-
    לאחר מבצע, הדמויות עושות חשבון עם ההכנסה מהפעולה. מבצע מוצלח מניב גם **מוניטין** וגם **מטבעות**.

    הצוות מרוויח 2 **מוניטין** על כל מבצע כברירת מחדל. אם יעד המבצע גבוה ממך בדרג, קבל **+1** **מוניטין** **על כל דרג שהוא גבוה יותר**. אם יעד המבצע נמוך ממך בדרג, אתה מקבל **-1** **מוניטין** **על כל דרג שהוא נמוך יותר** (מינימום אפס).

    > אם הצוות שלך הוא דרג I ואתה מבצע בהצלחה מבצע נגד יעד מדרג III, אתה מרוויח 4 **מוניטין** (2 **מוניטין**, ועוד 2 **מוניטין** על יעד הגבוה ממך בשני דרגים). אם הצוות שלך הוא דרג III ואתה משלים מבצע נגד יעד מדרג I, אתה מרוויח 0 **מוניטין** (2 מוניטין, פחות 2 מוניטין על היעד שדרגו נמוך יותר).

    אם אתה שומר על הפעולה בשקט מוחלט, כך שאיש אינו יודע עליה, אתה מרוויח אפס **מוניטין**. סמן את המוניטין במעקב ה**מוניטין** שבדף הצוות.

    הצוות מרוויח **מטבעות** לפי אופי הפעולה ו/או השלל שהוא תפס:

    * **2 מטבעות**: עבודה קטנה; כמה ארנקים מלאים.
    * **4 מטבעות**: עבודה צנועה; תיבת ברזל.
    * **6 מטבעות**: מבצע רגיל; שלל הגון.
    * **8 מטבעות**: מבצע גדול; שלל רציני.
    * **10+ מטבעות**: מבצע מרכזי; שלל מרשים.

    רשום את ה**מטבעות** בדף הצוות, או חלק אותם בין חברי הצוות כראות עיניך.

    ברוב הרובעים יש ראשי פשע שמצפים מצוותים קטנים לשלם מעין מעשר מהמבצעים שלהם. שאל את שה״מ אם יש ראש פשע שעליך לשלם לו. **הפחת **מטבעות** השווים לדרג הצוות שלך +1** כשאתה משלם מעשר לראש פשע או לארגון גדול יותר. *אם אתה אמור לשלם לראש פשע ואינך משלם, פתח שעון לסבלנות שלו שאוזלת. סמן בו מקטע בכל פעם שאינך משלם. בכל פעם שהוא מתמלא, אתה מאבד 1 ממעמד הפלג מולם.*

    אתה יכול לביים סצנה ולשחק פגישה עם לקוח או פטרון ששילם לצוות, אם יש בה משהו מעניין לחקור. אם לא, פשוט דלג על זה והמשך לחלק הבא של הזמן הפנוי.

    שה״מ, בשום אופן אל תתעלל בשחקנים בעניין השלל. אל תגיד שהלקוח שיקר ואין תגמול, או שהפגישה לקבלת התשלום היא בעצם מלכודת, או דברים כאלה. אלה מרכיבי יסוד של סיפורת פשע, אבל ב*Blades* לדמויות כבר יש מספיק בעיות שמגיעות מכל כיוון. כשמגיע הזמן לשלם, פשוט תן להם את מה שהרוויחו.
- id: planning-engagement
  name: תכנון ופתיחה
  description: |-
    הצוות שלך מקדיש זמן לתכנון כל מבצע. הם מתכנסים סביב פנס מהבהב במאורה שלהם, מביטים במפות משורבטות, לוחשים מזימות ותחבולות, מתקוטטים על הגישה הטובה ביותר, מקוננים על הסכנות הצפויות ומשתוקקים לערימות של מטבעות.

    אבל אתם, השחקנים, לא צריכים לעסוק בתכנון הפרטני. הדמויות מטפלות בו מחוץ למסך. כל מה שעליכם לעשות הוא לבחור **איזה סוג תוכנית** הדמויות *כבר תכננו*. אין צורך להתייגע על כל הפרטים הקטנים ולנסות לכסות מראש כל אפשרות, כי **הטלת הפתיחה** (המפורטת בחלק הבא) היא שקובעת בסופו של דבר כמה צרות מחכות לכם כשהתוכנית יוצאת לדרך. *אין תוכנית מושלמת.* אי אפשר לצפות הכול. המערכת מניחה שבכל פעולה יש תמיד גורמים לא ידועים וצרות, גדולות או קטנות; אתם פשוט צריכים להפיק את המיטב.

    יש שש תוכניות שונות, ולכל אחת **פרט** חסר שעליכם לספק (ראו את הרשימה להלן). כדי "לתכנן פעולה", פשוט בחרו את התוכנית וספקו את הפרט. אז שה״מ **יחתוך אל הפעולה** ברגעים הראשונים של המבצע.

    * התקפה - לפגוע באלימות ביעד. *פרט: נקודת ההתקפה.*
    * הונאה - לפתות, להערים או לתמרן. *פרט: שיטת ההונאה.*
    * התגנבות - לחדור בלי להיראות. *פרט: נקודת ההסתננות.*
    * אוקולט - לעסוק בכוח על-טבעי. *פרט: השיטה הסודית.*
    * חברתי - לנהל משא ומתן, להתמקח או לשכנע. *פרט: הקשר החברתי.*
    * הובלה - להעביר מטען או אנשים דרך סכנה. *פרט: המסלול והאמצעים.*
- id: planning-engagement-engagement-roll
  name: הטלת פתיחה
  description: |-
    ברגע שהשחקנים בוחרים תוכנית ומספקים את הפרט שלה, שה״מ (שליט המבוך) חותך אל הפעולה: הוא מתאר את הסצנה כשהצוות מתחיל את המבצע ופוגש את המכשול הראשון. אבל איך זה נקבע? האופן שבו שה״מ מתאר את מצב הפתיחה יכול להשפיע מאוד על מידת הפשטות או הצרות של המבצע. במקום לצפות משה״מ "לצדוק" בכל פעם, אנחנו משתמשים בהטלת קוביות. זו **הטלת הפתיחה**.

    הטלת הפתיחה היא **הטלת מזל** שמתחילה עם **1d למזל גרידא**. שנה את מאגר הקוביות לפי יתרונות או חסרונות גדולים שחלים.
- id: planning-engagement-engagement-roll-engagement-roll
  name: הטלת פתיחה
  description: |-
    ⏣ **1d** למזל גרידא.

    ⊕ **+1d** על כל **יתרון גדול**.

    ⊖ **-1d** על כל **חיסרון גדול**.

    * **הצלחה קריטית**: תוצאה יוצאת דופן. *כבר התגברת על המכשול הראשון ואתה בעמדה מבוקרת לקראת מה שיבוא.*
    * **6**: תוצאה טובה. *אתה בעמדה מבוקרת כשהפעולה מתחילה.*
    * **4/5**: תוצאה מעורבת. *אתה בעמדה מסוכנת כשהפעולה מתחילה.*
    * **1-3**: תוצאה גרועה. *אתה בעמדה נואשת כשהפעולה מתחילה.*

    ---

    > המכשולים הראשונים בבית המכשפות הם המנעולים הערמומיים והמלכודות הקסומות שלהן. הטלת הפתיחה מציבה אותנו על הגג מחוץ לחלון, כשהדמויות מנסות לפרוץ בשקט ובזהירות אל עליית הגג.
    >
    > הדמויות בעטו בדלת ופרצו אל חדר הכניסה של מאורת הכנופיה, עם נשק שלוף, אל תוך מערבולת הקרב מול השומרים הראשונים.
    >
    > הדמויות שוחחו בנימוס במסיבה ותמרנו כדי לזכות בשיחה פרטית עם לורד רב עוצמה. כשקבוצת צעירים אצילים מתרחקת מצידו, הדמויות ניגשות ופותחות איתו בשיחה.

    אם השחקנים רוצים לכלול הכנה מיוחדת או הערכות ערמומית, הם יכולים לעשות זאת באמצעות **פלאשבקים** במהלך המבצע. לוקח זמן להתרגל לזה. בהתחלה שחקנים עלולים להירתע, מחשש שאתה מדלג על דברים חשובים שהם רוצים לעשות. אבל לקפוץ ישר אל הפעולה של המבצע יעיל הרבה יותר, אחרי שמתרגלים. כשהם רואים את המצב שבו הם נמצאים, ה"תכנון" שלהם בפלאשבקים יהיה ממוקד ושימושי, ולא סתם ניחושים על נסיבות ואירועים שאולי בכלל לא יתרחשו.
- id: planning-engagement-engagement-roll-how-long-does-it-last
  name: כמה זמן זה נמשך?
  description: הטלת הפתיחה קובעת את עמדת הפתיחה של פעולות הדמויות. כמה זמן זה נמשך? האם המצב נשאר נואש? לא. ברגע שהפעולות הראשונות נפתרו, אתה פועל לפי התהליך הרגיל לקביעת עמדה בשאר ההטלות במהלך המבצע. הטלת הפתיחה היא קיצור דרך מהיר לפתיחת העניינים ולהתחלת הפעולה, ואין לה השפעה מעבר לכך.
- id: planning-engagement-engagement-roll-major-advantages-disadvantages
  name: יתרונות / חסרונות גדולים
  description: |-
    * האם הפעולה נועזת או מעזה במיוחד? קבל **+1d**. האם הפעולה מורכבת מדי או תלויה בגורמים רבים? קבל **-1d**.
    * האם **פרט התוכנית** חושף פגיעוּת של היעד או פוגע בו במקום החלש ביותר שלו? קבל **+1d**. האם היעד חזק ביותר מול הגישה הזו, או שיש לו הגנות מיוחדות או הכנות מיוחדות? קבל **-1d**.
    * האם **חברים או אנשי קשר** שלך יכולים לסייע או להעניק בינה לפעולה הזו? קבל **+1d**. האם **אויבים או יריבים** מתערבים בפעולה? קבל **-1d**.
    * האם יש **גורמים אחרים** שתרצה לשקול? אולי יעד בדרג נמוך יותר יעניק לך +1d. אולי יעד בדרג גבוה יותר יעניק לך -1d. אולי יש מצב ברובע שהופך את הפעולה לקלה או לקשה יותר.

    הטלת הפתיחה מניחה שהדמויות ניגשות אל היעד בחוכמה מרבית, בהינתן התוכנית והפרט שסיפקו, ולכן אין צורך לשחק תימרוני גישוש זהירים, אמצעי זהירות מיוחדים או שאר פעולות כבדות ונטולות אקשן. הטלת הפתיחה מכסה את כל זה. הדמויות כבר בפעולה, מול המכשול הראשון: על הגג, פורצות מנעול של חלון; בועטות בדלת מאורת הכנופיה היריבה; מתמרנות כדי לדבר עם לורד במסיבת מסכות; וכן הלאה.

    אל תבצע את הטלת הפתיחה ואז תתאר את הדמויות *מתקרבות* אל היעד. ההתקרבות היא בדיוק מה שהטלת הפתיחה פותרת. חתוך אל הפעולה שנוצרת *בגלל* ההתקרבות הראשונית הזו, אל המכשול החמור הראשון בדרכן.
- id: planning-engagement-engagement-roll-outcomes
  name: תוצאות
  description: |-
    תוצאת הטלת הפתיחה קובעת את **העמדה** של פעולות הדמויות הראשונות כשחותכים אל המבצע המתנהל. **1-3** משמעו עמדה נואשת. **4/5** היא עמדה מסוכנת. **6** מניב עמדה מבוקרת. ו**הצלחה קריטית** מעבירה את הפעולה אל מעבר למכשול הראשון, עמוק יותר אל תוך המבצע.

    לא משנה כמה נמוך הדרג שלך או כמה אתה נחות ביכולת, עמדה נואשת היא הדבר הגרוע ביותר שיכול לצאת מהשילוב של תוכנית + פרט + פתיחה. המערכת בנויה כך כדי שלתכנון תהיה חשיבות, אבל בלי לדרוש הרבה אופטימיזציה או קטנוניות. גם אם אתה פזיז וקופץ פנימה ומסתכן, אי אפשר להיכוות קשה מדי. ויותר מזה, אולי אתה אפילו רוצה את ההטלות הנואשות האלה כדי להרוויח לדמויות עוד ניסיון, מה שעוזר להניע דמויות מתחילות אל ההתקדמות.

    כשאתה מתאר את המצב אחרי ההטלה, השתמש בפרטי היעד כדי לצייר תמונה של עמדת הדמויות. איך כנופיה מוזרה ואוקולטית עשויה להציב פורצים בעמדה נואשת? איך קצבים אלימים וחסרי רחמים עשויים להציג איום מסוכן בפני בריונים תוקפים? איך לורד יהיר ומתנפח עשוי להציג הזדמנות מבוקרת לנוכל מתמרן? נצל את ההזדמנות כדי להראות שאויבי הדמויות מסוכנים ובעלי יכולת, ואל תציג הטלת פתיחה גרועה ככישלון של הדמויות, אחרת הן לא יסמכו על השיטה בעתיד. נכון, המצב מתחיל נואש כאן מול האוקולטיסטים המצמררים, אבל אתם בדיוק סוג הדמויות שנועזות מספיק כדי להתמודד איתם. בואו נתחיל.
- id: planning-engagement-flashbacks
  name: פלאשבקים
  description: |-
    החוקים אינם מבחינים בין פעולות שמבוצעות ברגע הנוכחי לבין פעולות שבוצעו בעבר. כשמבצע מתנהל, אתה יכול להפעיל **פלאשבק** כדי להטיל על פעולה מהעבר שמשפיעה על מצבך הנוכחי. אולי שכנעת את סמל המשמר של הרובע לבטל את הסיור הלילה, ולכן אתה מטיל **שכנוע** כדי לראות איך זה הלך.

    שה״מ קובע **מחיר בלחץ** כשאתה מפעיל פעולת פלאשבק.

    * **0** **לחץ**: פעולה רגילה שהייתה לך אליה הזדמנות קלה. *הקאטר **התחברה** עם חברתה כדי להסכים להגיע מראש למשחק הקוביות ולזנק פתאום כבעלת ברית מפתיעה.*
    * **1** **לחץ**: פעולה מורכבת או הזדמנות לא סבירה. *ההאונד **הסתיר בעדינות** את אקדחיו במחבוא ליד שולחן הקלפים כדי שיוכל להחזיר אותם אחרי הבדיקה בדלת הכניסה.*
    * **2** **(או יותר) לחץ**: פעולה משוכללת שכללה הזדמנויות מיוחדות או תלות באירועים. *הוויספר כבר **עיינה** בהיסטוריה של הנכס ולמדה על רוח רפאים שידוע שהיא רודפת את מזח התעלה העתיק שלו - רוח רפאים שאפשר לכפות עליה לחשוף את מקום הכספת הנסתרת.*

    אחרי שהמחיר שולם, פעולת פלאשבק מטופלת בדיוק כמו כל פעולה אחרת. לפעמים היא תכלול הטלת פעולה, כי יש בה סכנה או צרה. לפעמים פלאשבק יכלול הטלת מזל, כי אנחנו רק צריכים לגלות עד כמה טוב (או כמה, או כמה זמן, וכן הלאה). ולפעמים פלאשבק לא יצריך הטלה כלל, כי אפשר פשוט לשלם את הלחץ והדבר מושג.

    אם פלאשבק כולל פעילות של **זמן פנוי**, שלם 1 **מטבעות** או 1 **מוניטין** עבורו, במקום לחץ.

    אחד השימושים הטובים ביותר לפלאשבק הוא כשה**הטלת הפתיחה** משתבשת. אחרי ששה״מ מתאר את הצרה שבה אתה נמצא, אתה יכול לקרוא לפלאשבק להכנה מיוחדת שעשית "ליתר ביטחון" למקרה של דבר כזה. כך ה"תכנון בפלאשבק" שלך יהיה ממוקד בבעיות ש*קורות*, ולא בבעיות ש*עלולות* לקרות.
- id: planning-engagement-flashbacks-limits-of-flashbacks
  name: גבולות הפלאשבק
  description: |-
    פלאשבק אינו מסע בזמן. הוא אינו יכול "לבטל" דבר שזה עתה התרחש ברגע הנוכחי. למשל, אם מפקחת מעמתת אותך על גניבות אחרונות של חפצים אוקולטיים כשאתה במסיבה של הגבירה, אינך יכול לקרוא לפלאשבק כדי לחסל את המפקחת בלילה הקודם. היא כאן עכשיו, חוקרת אותך - זה כבר נקבע בסיפור. אתה *יכול* לקרוא לפלאשבק שמראה שהדלפת למפקחת בכוונה כדי שתעמת אותך במסיבה - כדי שתוכל לנצל את ההזדמנות להרשים את הגבירה בקור רוחך ובעוז שלך.

    #### דוגמאות לפלאשבק

    > "אני רוצה פלאשבק לקודם באותו לילה, שבו אני מתגנב אל האורוות ומאכיל את כל העיזים שלהם בעשב אש כדי שישתגעו ויווצרו הסחת דעת לחדירה שלנו."
    >
    > "הא! יפה. טוב, זה נשמע קצת מסובך, להתעסק עם עיזים עקשניות וכל זה... 1 לחץ."
    >
    > "להטיל התגנבות כדי להסתנן ולהניח אותו?"
    >
    > "לא. האבטחה של אורוות העיזים שלהם היא נער אורווה שבדרך כלל ישן בכל מקרה. אתה יכול להימנע מתשומת ליבו בקלות."
    >
    > "אז זה פשוט עובד?"
    >
    > "אה... לא כל כך מהר. כשתרצה שההסחה תפגע, נטיל הטלת מזל כדי לראות כמה פרוע יוצא תימרון עיזי עשב האש. שלוש קוביות."
    >
    > ---
    >
    > "הטלת הפתיחה היא... **2**. נראה שהמצב נואש עבורך! הממ. טוב, אז אתה בתוך המתחם של הכנופיה בנמל, מחליק דרך הצללים ליד כמה מכלי אחסון מתכתיים ענקיים. ואז כל האורות החשמליים נדלקים. דלת המחסן המתכתית הגדולה נפתחת בגלגול, ואתה שומע עגלה כבדה נכנסת בשער. נראה שהם מקבלים משלוח כרגע, ויש חבורה של חברי כנופיה בחוץ כדי לקבל אותו. עוד רגע הם עליך. מה אתה עושה?"
    >
    > "רגע, אני רוצה פלאשבק."
    >
    > "טוב, על מה?"
    >
    > "אה. משהו... מועיל? לעזאזל, אני לא יודע מה זה יכול להיות. למישהו יש רעיונות?"
    >
    > "אה, מה אם התחברת אתמול עם חבריך הסוורים והם פטפטו על המשלוח הזה, אז ביקשנו מהם להתקין בו פצצה."
    >
    > "וואו, זה מצחיק. אבל קצת מטורף. נניח 2 לחץ על זה?"
    >
    > "נשמע טוב. אבל בוא נטיל את הטלת ההיכרויות הזו ונראה אם חבריך הסוורים הציבו דרישות או סיבכו משהו עבורך. אחר כך נצטרך לגלות עד כמה הפצצה עובדת. מי היה אחראי על זה?"
    >
    > "אני. אטיל טכנאות כדי לכוון את הנתיך בדיוק. מקווה."
- id: planning-engagement-giving-up-on-a-score
  name: ויתור על מבצע
  description: כשאתה מוותר על מבצע, אתה עובר ל**זמן פנוי**. פעל לפי שלבי הזמן הפנוי המוצגים בפרק הבא. בדרך כלל לא יהיה לך **שלל** כלל, כי לא השגת דבר. עדיין תתמודד עם **חום** ו**סבכים** כרגיל.
- id: planning-engagement-item-loadouts
  name: ציוד לפעולה
  description: אחרי שהתוכנית והפרט נקבעו, כל שחקן בוחר את **העומס** של דמותו. זה מציין כמה ציוד היא נושאת בפעולה. אין צורך לבחור פריטים בודדים, אלא רק את הכמות המרבית שתהיה זמינה להם במהלך הפעולה.
- id: planning-engagement-linked-plans
  name: תוכניות מקושרות
  description: |-
    לפעמים נראה שפעולה דורשת כמה תוכניות המקושרות זו לזו. תרחיש נפוץ הוא צוות שרוצה גישה דו-כיוונית. "אתם יוצרים הסחה בטברנה, וכשישלחו לשם בריונים, אנחנו נפרוץ למאורה שלהם." יש שתי דרכים לטפל בזה.

    1. ההסחה היא **מהלך הכנה** שחבר צוות מבצע כחלק מהתוכנית. מהלך הכנה מוצלח יכול לשפר את **העמדה** של חברי הצוות (ואולי לקזז הטלת פתיחה גרועה) או להעניק השפעה גדולה יותר. מהלך הכנה כושל עלול ליצור צרות לחלק השני של התוכנית - תוצאה קלה היא להעניק להטלת הפתיחה -1d. *אם זה הגיוני, חבר הצוות שביצע את ההכנה יכול לחזור בהדרגה אל הפעולה הראשית ולהצטרף לצוות מאוחר יותר, כדי שלא יצטרך לשבת ולחכות.*
    2. ההסחה היא תוכנית, פתיחה ופעולה משלה, ותוצאתה יוצרת את ההזדמנות לתוכנית עתידית. השתמש באפשרות הזו כשהחלק הראשון של התוכנית נחוץ כדי שהחלק הבא יתאפשר בכלל. למשל, אפשר לבצע תוכנית התגנבות כדי לגנוב חפץ ממוזיאון הקדמונים, ואחר כך להשתמש בחפץ הזה בתוכנית אוקולט כדי לקדש מקדש לאל הנשכח שלכם. במקרה כזה אתה עובר לזמן פנוי (ולשלל, ל**חום**, וכן הלאה) אחרי החלק הראשון של התוכנית, כרגיל.

    כל אחת מהגישות טובה. בדרך כלל זו שאלה של עניין. האם רעיון התוכנית המקושרת מעניין מספיק כשלעצמו כדי לשחק אותו רגע אחר רגע? האם הוא הכרחי כדי שהתוכנית השנייה תהיה הגיונית? אם כן, הפוך אותו למבצע נפרד. אם לא, פשוט השתמש במהלך הכנה.
- id: planning-engagement-the-detail
  name: הפרט
  description: כשאתה בוחר תוכנית, אתה מספק **פרט** חסר, כמו נקודת ההתקפה, הקשר החברתי וכדומה. אם אינך יודע את הפרט, אתה יכול לבצע **איסוף מידע** בדרך כלשהי כדי לגלות אותו.
- id: progress-clocks
  name: שעוני התקדמות
  description: |-
    **שעון התקדמות** הוא עיגול המחולק למקטעים (ראו דוגמאות מימין). צייר שעון התקדמות כשאתה צריך לעקוב אחר מאמץ מתמשך מול מכשול או אחר התקרבותה של צרה קרובה.

    *מתגנבים אל מגדל המשמר של השוטרים? צור שעון שעוקב אחר רמת הכוננות של השומרים המסיירים. כשהדמויות סובלות מתוצאות של הצלחות חלקיות או הטלות שהחטיאו, מלא מקטעים בשעון עד שהאזעקה מופעלת.*

    בדרך כלל, ככל שהבעיה מורכבת יותר, כך יהיו יותר מקטעים בשעון ההתקדמות.

    מכשול מורכב הוא שעון בן 4 מקטעים. מכשול מורכב יותר הוא שעון בן 6. מכשול מאיים הוא שעון בן 8 מקטעים.

    כשאתה יוצר שעון, עשה אותו על **המכשול,** לא על השיטה. השעונים לחדירה צריכים להיות "סיורים פנימיים" ו"המגדל", ולא "להתגנב על פני השומרים" או "לטפס על המגדל". הסיורים והמגדל הם המכשולים - הדמויות יכולות לנסות להתגבר עליהם בדרכים שונות.

    אפשר לפרק איומי אויב מורכבים לכמה "שכבות", לכל אחת שעון התקדמות משלה. למשל, במפקדה של כנופיות הרציף עשויים להיות שעון "אבטחת היקף", שעון "שומרים פנימיים" ושעון "אבטחת משרד". הצוות יצטרך לעבור את שלוש השכבות כדי להגיע אל הכספת האישית של ראש הכנופיה ואל הרכוש שבתוכה.

    זכור ששעון עוקב אחר התקדמות. הוא משקף את המצב בסיפור, כדי שהקבוצה תוכל להעריך איך היא מסתדרת. שעון הוא כמו מד מהירות ברכב. הוא *מראה* את מהירות הרכב - הוא אינו קובע אותה.
- id: progress-clocks-danger-clocks
  name: שעוני סכנה
  description: שה״מ (שליט המבוך) יכול להשתמש בשעון כדי לייצג סכנה מתפתחת, כמו חשד שגובר במהלך פיתוי, קרבת הרודפים במרדף או רמת הכוננות של שומרים מסיירים. במקרה כזה, כשמתרחש סיבוך, שה״מ מסמן מקטע אחד, שניים או שלושה בשעון, לפי רמת התוצאה. כשהשעון מלא, הסכנה מתממשת - השומרים צדים את החודרים, מפעילים אזעקה, משחררים את הכלבים וכן הלאה.
- id: progress-clocks-faction-clocks
  name: שעוני פלגים
  description: |-
    לכל פלג יש מטרה ארוכת טווח. כשלדמויות יש **זמן פנוי**, שה״מ (שליט המבוך) מקדם את שעוני הפלגים שמעניינים אותן. כך העולם סביב הדמויות דינמי, ודברים קורים בלי קשר ישיר אליהן, משנים את המצב הכולל בעיר ויוצרים הזדמנויות ואתגרים חדשים.

    הדמויות יכולות גם להשפיע ישירות על שעוני הפלגים של דמויות שה״מ, לפי המשימות והמבצעים שהן מבצעות. דנו בפרויקטים ידועים של פלגים שהן עשויות לסייע להם או להפריע להם, ושקלו גם איך פעולה של הדמויות עשויה להשפיע על שעוני הדמויות של שה״מ, בין אם השחקנים התכוונו לכך ובין אם לא.
