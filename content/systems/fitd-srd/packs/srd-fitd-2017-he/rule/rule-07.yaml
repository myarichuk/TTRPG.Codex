- id: entanglements
  name: סבכים
  description: |-
    הצוות שלך לא צמח משום מקום הלילה. יש לך היסטוריה מורכבת של טובות, התחייבויות, חובות והבטחות שהביאה אותך למקום שבו אתה היום. כדי לשקף זאת, אחרי כל מבצע אתה מטיל קוביות כדי לגלות איזה **סבך** מגיע לדפוק על הדלת. סבך יכול להיות צוות יריב שרוצה להפגין כוח (ולדרוש **מטבעות**), חוקר ממשמר העיר שבונה תיק נגד הצוות שלך (אבל מוכן לשוחד), או אפילו תשומת הלב של רוח נקמנית.

    אחרי שהשלל וה**חום** נקבעו, שה״מ (שליט המבוך) מייצר סבך לצוות לפי הרשימות שלהלן. מצא את העמודה שמתאימה לרמת ה**חום** הנוכחית של הצוות. אחר כך הטל מספר קוביות השווה ל**רמת המבוקש** שלו, והשתמש בתוצאה כדי לבחור איזה סוג סבך מתממש. *אם **רמת המבוקש** היא אפס, הטל שתי קוביות ושמור את התוצאה הנמוכה.*

    ---

    | תוצאה | **חום** **0-3**                    | **חום** **4-5**             | **חום** **6**                   |
    | :----: | :--------------------------------- | :-------------------------- | :------------------------------ |
    |  1-3   | צרות מהכנופיה או החשודים הרגילים | צרות מהכנופיה או תשאול | מעבר צד או חקירה        |
    |  4-5   | יריבים או מתים חסרי מנוחה             | תגמול או מתים חסרי מנוחה   | תשומת לב שטנית או הפגנת כוח |
    |   6    | שיתוף פעולה                        | הפגנת כוח                   | מעצר                          |

    ---

    הכנס את הסבך למשחק מיד, או המתן לרגע מתאים. לדוגמה, אם יצא לך הסבך *חקירה*, אפשר לחכות עד שאחת הדמויות תפנק את היצר שלה, ואז לומר ששוטרים תפסו אותה כשהייתה שקועה בהנאותיו.

    הסבכים מתממשים במלואם לפני שלדמויות השחקנים יש הזדמנות להימנע מהם. כשסבך נכנס למשחק, תאר את המצב אחרי שהסבך כבר התממש. הדמויות מתמודדות איתו מנקודה זו — הן לא יכולות ליירט אותו ולנטרל אותו לפני שקרה. מטרת המנגנון היא לתמצת הרבה מהדברים המורכבים שמתרחשים ברקע חייהן של הדמויות כדי ליצור להן צרות. סבכים הם המחיר של עסקים בעולם התחתון — צוות טוב לומד להתגלגל עם המכות ולבחור את הקרבות שלו.

    הסבכים מפורטים בחלקים הבאים. לכל אחד יש רשימה של דרכים אפשריות להיפטר ממנו. אם אתה רוצה שהסבכים יהיו בעיה רגעית לצוות, היצמד לדרכי הפתרון המוצעות והמשך לחלק הבא של הזמן הפנוי. אם אתה רוצה לצלול ולחקור את הסבך לפרטיו, בנה את הסצנה ושחק את האירוע במלואו, ועקוב אחרי הפעולות והתוצאות לאן שיובילו.
- id: entanglements-arrest
  name: מעצר
  description: |-
    מפקח מציג בפני שופט תיק ראיות כדי להתחיל להעמיד את הצוות שלך לדין. הוא שולח יחידה לעצור אתכם (כנופיה ששווה לפחות ב**קנה המידה** שלה ל**רמת המבוקש** שלך). שלם להם **מטבעות** השווים ל**רמת המבוקש** שלך +3, מסור מישהו למעצר (זה מנקה את ה**חום** שלך), או נסה לחמוק מתפיסה.

    > אלה דופקת על התריסים של החלון. "טוב, צאו החוצה ונעשה את זה בשקט!" נשמע כמו הסמל הקירח. כשאתה מציץ, אתה רואה יחידה של כעשרים שוטרים, מצוידים לקרב. הסמל ממלמל בשקט, כך שרק אתם בפנים שומעים: "או שאולי טעיתי בכתובת?" הוא מכחכח בגרונו וממתין שיופיעו מטבעות.
- id: entanglements-cooperation
  name: שיתוף פעולה
  description: פלג עם מעמד +3 מבקש ממך טובה. הסכם לעשות אותה, או שתפסיד 1 **מוניטין** לכל דרג של הפלג הידידותי, או שתאבד **1 מעמד** מולו. אם אין לך פלג עם מעמד +3, אתה נמנע מסבכים בשלב זה.
- id: entanglements-demonic-notice
  name: תשומת לב שטנית
  description: שד ניגש לצוות עם הצעה אפלה. קבל את העסקה שלו, התחבא עד שיאבד עניין (הפסד 3 **מוניטין**), או התמודד איתו בדרך אחרת.
- id: entanglements-flipped
  name: מעבר צד
  description: אחד מיריבי הדמויות דואג לכך שאחד מאנשי הקשר שלך, מהפטרונים, מהלקוחות, או קבוצת לקוחות שלך, יחליפו נאמנות בגלל ה**חום** שעליך. הם נאמנים עכשיו לפלג אחר.
- id: entanglements-gang-trouble
  name: צרות מהכנופיה
  description: אחת הכנופיות שלך (או מקורבים אחרים) גורמת צרות בגלל החסרונות שלה. אתה יכול לאבד כבוד (הפסד **מוניטין** השווה לדרג שלך +1), להפוך אחד מחברי הכנופיה לדוגמה ומופת, או להתמודד עם תגמול מצד הצד שנפגע.
- id: entanglements-interrogation
  name: חקירה
  description: |-
    השוטרים אוספים אחת מהדמויות כדי לחקור אותה על פשעי הצוות. *איך הצליחו לתפוס אותך?* או שתשלם להם 3 **מטבעות**, או שהם יכו אותך (**פציעה ברמה 2**) ואתה תספר להם מה שהם רוצים לדעת (**+3** **חום**). אתה יכול **להתנגד** לכל אחת מהתוצאות האלה בנפרד.

    > יש שחקנים ששונאים כשהדמות שלהם נתפסת! פשוט אמור להם שזה לגמרי רגיל לנוכל של העולם התחתון. אתה מבלה זמן בתוך הכלא ומחוצה לו, נחקר ומוטרד על ידי החוק. זה לא סוף העולם. אבל עכשיו, כשאתה בחדר החקירות, איזה סוג של אדם אתה? האם אתה מדבר? האם אתה מתייצב מולם? האם אתה עושה עסקה?
- id: entanglements-questioning
  name: תשאול
  description: |-
    השוטרים תופסים חבר צוות שהוא דמות שאינה שחקן, או אחד מאנשי הקשר של הצוות, כדי לתשאל אותו על פשעיכם. *את מי הם חושבים שהכי קל ללחוץ?* הטל **הטלת מזל** כדי לראות כמה הוא מדבר (**1-3**: **+2** **חום**, **4/5**: **+1** **חום**), או שלם לשוטרים 2 **מטבעות**.

    > הטל 2d לאדם רגיל כדי לראות כמה טוב הוא שומר על שתיקה. אם הוא טיפוס מנוסה מהעולם התחתון או איש קשוח, תן לו 3d או 4d במקום. אם הוא רך או אם יש לו נאמנות כלשהי לחוק, תן לו 1d או 0d.
- id: entanglements-reprisals
  name: תגמול
  description: פלג אויב עושה מהלך נגדך (או נגד חבר, איש קשר או ספק של היצר שלך). שלם להם (1 **מוניטין** ו-1 **מטבעות**) לכל דרג של האויב כהתנצלות, אפשר להם להתעסק איתך או עם שלך, או החזר מלחמה והראה להם מי הבוס.
- id: entanglements-rivals
  name: יריבים
  description: פלג ניטרלי מפגין כוח. הוא מאיים עליך, על חבר, על איש קשר או על אחד מספקי היצר שלך. הפסד (1 **מוניטין** או 1 **מטבעות**) לכל דרג של היריב, או התייצב מולו ואבד **1 מעמד** מולו.
- id: entanglements-show-of-force
  name: הפגנת כוח
  description: פלג שיש לך איתו מעמד שלילי עושה מהלך נגד נכסיך. תן לו 1 **תביעה** או צא למלחמה (רד למעמד -3). אם אין לך תביעות, **אבד 1 אחיזה** במקום זאת.
- id: entanglements-the-usual-suspects
  name: החשודים הרגילים
  description: 'השוטרים תופסים מישהו בשולי הצוות שלך. שחקן אחד מציע חבר או ספק של היצר כאדם שהכי סביר שייקחו. הטל **הטלת מזל** כדי לגלות אם הוא עומד בתשאול (**1-3**: **+2 חום**, **4/5:** פציעה ברמה 2), או שלם להם 1 **מטבעות**.'
- id: entanglements-unquiet-dead
  name: מתים חסרי מנוחה
  description: |-
    רוח סוררת נמשכת אליך — אולי זה קורבן מהעבר? שכור את שירותיו של אוקולטיסט כדי לנסות להשמיד או לגרש אותה, או התמודד איתה בעצמך.

    > הם יכולים לשכור דמות שאינה שחקן באמצעות פעילות הזמן הפנוי **השגת נכס**. הטל את רמת האיכות של הדמות כהטלת מזל כדי לראות כמה טוב היא מתמודדת עם הרוח.
- id: fortune-roll
  name: הטלת מזל
  description: |-
    הטלת מזל היא כלי שבו שה״מ (שליט המבוך) יכול להשתמש כדי להימנע מקבלת החלטה בעצמו. אתה משתמש בהטלת מזל בשתי דרכים שונות:

    **כשאתה צריך לקבוע מה קורה במצב שהדמויות אינן מעורבות בו ישירות** ואינך רוצה פשוט להכריע בתוצאה.

    > שתי כנופיות יריבות נלחמות. איך זה מסתיים? שה״מ מטיל הטלת מזל לכל אחת מהן. אחת מקבלת תוצאה טובה, אך השנייה מקבלת השפעה מוגבלת. שה״מ מחליט שהכנופיה הראשונה משתלטת על חלק מהשטח של יריבותיה, אך סובלת מכמה פציעות במהלך הקטטה.

    **כשתוצאה אינה ודאית**, אך אין הטלה אחרת שמתאימה למצב.

    > תוך כדי שוד בבית המלאכה של אלכימאי, קרוס נתפס בידי רוח נקמנית. כשהשליטה בגופו מחליקה, קרוס חוטף בקבוק שיקוי אקראי ושותה אותו. האם התערובת הכמוסה תשפיע על הרוח? האם היא תרעיל את נוק למוות? מי יודע? שה״מ מטיל הטלת מזל כדי לראות איך זה יסתיים.

    כשאתה מטיל הטלת מזל אתה יכול להעריך **כל דירוג מאפיין** כדי לקבוע את מאגר הקוביות של ההטלה.

    * כשפלג עושה פעולה עם תוצאה לא ודאית, אפשר להשתמש בדירוג **הדרג** שלו להטלת מזל.
    * כשכנופיה פועלת באופן עצמאי, השתמש בדירוג **האיכות** שלה להטלת מזל.
    * כשכוח על-טבעי מתממש עם תוצאות לא ודאיות, אפשר להשתמש ב**עוצמה** שלו להטלת מזל.
    * כשדמות **אוספת מידע**, אפשר להטיל הטלת מזל באמצעות **דירוג הפעולה** שלה כדי לקבוע את כמות המידע שהיא מקבלת.

    אם אין מאפיין שמתאים, הטל 1d לפי מזל טהור או בנה מאגר קוביות (מאחת עד ארבע) לפי המצב שלפניך. אם שני צדדים עומדים זה מול זה ישירות, הטל הטלת מזל לכל צד כדי לראות איך הוא מצליח, ואז הערך את תוצאת המצב בהשוואה בין רמות הביצוע שלהם.

    הטלת מזל היא גם כלי טוב שעוזר לשה״מ לנהל את כל החלקים הנעים של העולם. לפעמים הטלה מהירה מספיקה כדי לענות על שאלה או לעורר רעיון למה שיקרה הלאה.

    דוגמאות נוספות להטלות מזל:

    * הדמויות מציתות מלחמה בין שני פלגים, ואז יושבות בצד ומסתכלות בזיקוקים. איך זה מסתיים? האם אחד הצדדים שולט? האם שניהם נחלשים בגלל הסכסוך? הטל כמה הטלות מזל כדי לגלות.
    * מחלה מוזרה מתפשטת בעיר. עד כמה פוגעת ההתפרצות ברובע שטוף פשע? שה״מ מקצה עוצמה למגפה הכמוסה, ומטיל הטלת מזל כדי לשפוט את היקף ההדבקה.
    * הצייד תופס עמדה טובה ויורה כצלף בראש כנופיה כשהוא נכנס למשרדו. הטלת **ציד** מבוקרת מצליחה, אבל האם השפעה גדולה מספיקה כדי להרוג מיד ראש כנופיה מנוסה? במקום ליצור שעון התקדמות לאורך חייו, שה״מ מחליט להשתמש בהטלת מזל פשוטה עם ה"קשיחות" שלו כמאפיין, כדי לראות אם ייתכן שישרוד את ההתקפה. ההטלה היא **4/5**: הכדור מחטיא את הלב, אבל פוגע בו בריאה — זו פציעה אנושה. הוא על סף מוות, ונותרו לו רק שעות לחיות, אלא אם הכנופיה שלו תצליח להביא אליו רופא מומחה בזמן.
    * מפקחים בונים תיק נגד צוות הדמויות. כמה מהר הראיות שלהם יביאו למעצרים? **רמת המבוקש** של הצוות נחשבת ליתרון משמעותי עבור המפקחים.
    * הדמויות מתעמתות בקטטה עם קפטנית ותיקה של ציידי שדים ועם הצוות שלה. גאות הקרב מתהפכת לטובת הדמויות, וחברי צוות רבים נהרגים. אחד השחקנים שואל אם הקפטנית תיכנע כדי לחסוך את חיי שאר צוותה. שה״מ אינו בטוח. עד כמה הציידת הוותיקה הזו קרת לב? היא הביטה בשדים ענקיים בלי למצמץ... האם נשאר בה משהו אנושי? שה״מ מטיל הטלת מזל של 2d עבור "רגשות אנושיים" כדי לראות אם נשאר ניצוץ של חמלה בלבה. אם כן, אולי אחת הדמויות תוכל להטיל **היכרויות**, **שכנוע** או **פיקוד** כדי לגרום לה לסגת.
- id: fortune-roll-fortune-roll
  name: הטלת מזל
  description: |-
    ⏣ *1d* לכל דירוג **מאפיין**.

    ⊕ *+1d* לכל **יתרון משמעותי**.

    ⊖ *-1d* לכל **חיסרון משמעותי**.

    * **קריטית**: תוצאה יוצאת דופן / השפעה גדולה קיצונית.
    * **6**: תוצאה טובה / השפעה רגילה, הצלחה מלאה.
    * **4/5**: תוצאה מעורבת / השפעה מוגבלת, הצלחה חלקית.
    * **1-3**: תוצאה רעה / השפעה חלשה, מועטה.
- id: gathering-information
  name: איסוף מידע
  description: |-
    זרימת המידע משה״מ (שליט המבוך) אל השחקנים על העולם הבדוי חשובה מאוד במשחק תפקידים. כברירת מחדל, שה״מ מספר לשחקנים מה הדמויות שלהם קולטות, חושדות ומנחשות. אבל מתרחש יותר מדי מכדי לומר *הכול* — זה היה לוקח נצח וגם משעמם. לשחקנים יש כלי שמאפשר להם לחקור את העולם הבדוי ביסודיות רבה יותר.

    כשאתה רוצה לדעת משהו מסוים על העולם הבדוי, הדמות שלך יכולה **לאסוף מידע**. שה״מ ישאל אותך **איך** הדמות שלך אוספת את המידע (או איך למדה אותו בעבר).

    אם זה ידע כללי, שה״מ פשוט יענה על שאלותיך. אם יש מכשול לגילוי התשובה, נדרשת הטלת פעולה. אם זה לא ידע כללי אבל אין מכשול, הטלת מזל פשוטה קובעת את איכות המידע שאתה אוסף.

    כל ניסיון לאסוף מידע לוקח זמן. אם המצב מאפשר, אתה יכול לנסות שוב אם לא קיבלת בהתחלה את כל המידע שרצית. אבל לעתים קרובות ההזדמנות חולפת, ותקבל רק הזדמנות אחת להטיל על אותה שאלה.

    כמה שאלות לדוגמה מופיעות בתחתית דף הדמות. שה״מ תמיד עונה ביושר, אבל ברמת פירוט שמתאימה לרמת ההשפעה.

    הפעולות הנפוצות ביותר לאיסוף מידע הן **לסקור** את המצב כדי לגלות או לצפות מה קורה, ו**לעיין** באדם כדי להבין מה הוא מתכוון לעשות או מה הוא באמת חושב.

    לפעמים תצטרך למקם את עצמך לפני שתוכל לאסוף מידע. לדוגמה, ייתכן שתצטרך **להתגנב** תחילה למקום מסתור טוב ורק אחר כך **לעיין** בחברי הכת כשהם מבצעים את הטקס האפל שלהם.
- id: gathering-information-examples-questions
  name: דוגמאות ושאלות
  description: |-
    * אתה יכול **להתאים** את עצמך כדי לראות הדים של פעילות רוחות אחרונה. *האם רוחות חדשות היו כאן? איך אמצא את באר הרוחות שקוראת להן? ממה כדאי לי לחשוש?*
    * אתה יכול **לפקד** על ברמן מקומי שיספר לך מה הוא יודע על הפגישות הסודיות שמתקיימות בחדר האחורי שלו. *מה באמת קורה כאן? מה הוא באמת מרגיש לגבי זה? האם הוא חלק מהקבוצה הסודית?*
    * אתה יכול **ליצור היכרויות** עם חבר בעל קשרים כדי ללמוד סודות על אויב, יריב או בעל ברית פוטנציאלי. *מה הם מתכוונים לעשות? מה אפשר לחשוד לגבי המניעים שלהם? איך אוכל לגלות מנוף להשפיע עליהם?*
    * אתה יכול **לצוד** שליח ברחבי העיר, כדי לגלות מי מקבל שקי מטבעות ממדובר מומחה. *לאן החבילה מגיעה בסוף? איך אוכל לברר מי חתם על החבילה בבניין העירייה?*
    * אתה יכול **לעיין** בספרים עתיקים ואפלים כדי לגלות סוד כמוס. *איך אוכל לנטרל את רונות ההגנה? האם מישהו יחוש אם הן ינוטרלו?*
    * או שאתה יכול **לעיין** באדם כדי לקרוא את כוונותיו ורגשותיו. *מה הוא באמת מרגיש? איך אוכל לגרום לו לבטוח בי?*
    * אתה יכול **לסקור** אחוזה כדי לתכנן שוד. *מהי נקודת חדירה טובה? מה הסכנה כאן?*
    * או שאתה יכול **לסקור** מצב טעון כשאתה פוגש כנופיה אחרת. *מה באמת קורה כאן? האם הם עומדים לתקוף אותנו?*
    * אתה יכול **לשכנע** לורד רב עוצמה במסיבה שיגלה את תוכניותיו לעתיד. *מה הוא מתכוון לעשות? איך אוכל לגרום לו לחשוב שאני שותף טוב למיזם הזה?*
    * או שאתה יכול **לשכנע** את שומר הראש שלו להתוודות בפניך על אירועים אחרונים. *איפה הוא היה לאחרונה? עם מי הוא נפגש?*
