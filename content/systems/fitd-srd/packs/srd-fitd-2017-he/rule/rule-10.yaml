- id: progress-clocks-linked-clocks
  name: שעונים מקושרים
  description: |-
    אפשר ליצור שעון שפותח שעון אחר ברגע שהוא מתמלא. למשל, שה״מ (שליט המבוך) יכול ליצור שעון מקושר בשם "לכוד" אחרי שהשעון "כוננות" מתמלא. כשאתה נלחם בלוחם ותיק, אפשר שיהיה לו שעון ל"הגנה" שלו ואחריו שעון מקושר ל"פגיע". כשאתה מתגבר על שעון "הגנה", אתה יכול לנסות להתגבר על שעון "פגיע" ולהביס אותו. אתה יכול להשפיע על שעון "הגנה" באלימות בקרב סכינים, או להחליש את ההגנה שלו בהונאה אם יש לך הזדמנות. כמו תמיד, דרך הפעולה נתונה בידי השחקנים ובפרטי הסיפור שמתנהל.
- id: progress-clocks-long-term-project
  name: פרויקט ארוך טווח
  description: |-
    יש פרויקטים שייקחו זמן רב. פרויקט ארוך טווח רגיל (כמו להרכיב יכולת חדשה למכשיר) הוא שמונה מקטעים. פרויקטים ארוכי טווח באמת (כמו יצירת סם מעצבים חדש) יכולים להיות שניים, שלושה ואפילו ארבעה שעונים, שמייצגים את כל שלבי הפיתוח, הבדיקה וההשלמה הסופית. הוסף שעונים או הפחת מהם לפי פרטי המצב ומורכבות הפרויקט.

    פרויקט ארוך טווח הוא פתרון כולל לכל מטרה חריגה של שחקן, כולל דברים שעוקפים או משנים רכיבים של המכניקה או של העולם.
- id: progress-clocks-mission-clocks
  name: שעוני משימה
  description: |-
    שה״מ (שליט המבוך) יכול ליצור שעון למשימה שמוגבלת בזמן, כדי לייצג את חלון ההזדמנות שיש לכם להשלים אותה. אם הספירה לאחור נגמרת, המשימה מבוטלת או משתנה: המטרה בורחת, בני הבית מתעוררים לבוקר, וכן הלאה.
- id: progress-clocks-racing-clocks
  name: שעוני מרוץ
  description: |-
    צור שני שעונים מנוגדים כדי לייצג מרוץ. אולי לדמויות השחקנים יש שעון התקדמות בשם "בריחה" ולשוטרים יש שעון בשם "מכותרים". אם הדמויות משלימות את השעון שלהן לפני ששעון השוטרים מתמלא, הן נמלטות. אחרת הן מכותרות ולא יכולות לברוח. אם שניהם מושלמים באותו זמן, הדמויות נמלטות אל המאורה שלהן, אבל השוטרים הרודפים מחכים בחוץ!

    אפשר להשתמש בשעוני מרוץ גם לסכנה סביבתית. אולי הדמויות מנסות להשלים את שעון "חיפוש" כדי למצוא את תיבת הכספת באונייה הטובעת לפני ששה״מ ממלא את שעון "טביעה" והכלי שוקע.
- id: progress-clocks-simple-obstacles
  name: מכשולים פשוטים
  description: |-
    לא כל מצב וכל מכשול דורשים שעון. השתמש בשעונים כשהמצב מורכב או רב-שכבתי וצריך לעקוב אחריו לאורך זמן; אחרת, הכרע את תוצאת הפעולה בהטלה אחת.

    בהמשך מופיעות דוגמאות לשעוני התקדמות.
- id: progress-clocks-tug-of-war-clocks
  name: שעוני משיכת חבל
  description: |-
    אפשר ליצור שעון שאירועים יכולים גם למלא *וגם* לרוקן, כדי לייצג מצב של התנדנדות הלוך ושוב. אפשר ליצור שעון "מהפכה!" שמראה מתי הפליטים מתחילים להתפרע בגלל יחס גרוע. חלק מהאירועים יעלו את השעון וחלקם יורידו אותו. כשהוא מתמלא, המהפכה מתחילה. שעון משיכת חבל מתאים גם למלחמת שטחים מתמשכת בין שני צוותים או פלגים.
- id: resistance-and-armor
  name: התנגדות ושריון
  description: |-
    כשהדמות שלך סובלת מתוצאה שאינך אוהב, אתה יכול לבחור להתנגד לה. פשוט אמור לשה״מ (שליט המבוך): "לא, אני לא חושב. אני מתנגד לזה." ההתנגדות תמיד יעילה באופן אוטומטי: שה״מ יגיד לך אם חומרת התוצאה קטנה או שאתה נמנע ממנה לגמרי. אחר כך תבצע **הטלת התנגדות** כדי לראות כמה לחץ הדמות שלך סובלת בגלל ההתנגדות.

    אתה מטיל באמצעות אחת מה**תכונות** של הדמות (**בינה**, **כושר** או **נחישות**). שה״מ בוחר את התכונה לפי אופי התוצאות:

    * **בינה**: תוצאות של הונאה או של הבנה.
    * **כושר**: תוצאות של מאמץ גופני או פציעה.
    * **נחישות**: תוצאות של מאמץ נפשי או כוח רצון.

    הדמות שלך סובלת **6 לחץ** כשהיא מתנגדת, **פחות תוצאת הקובייה הגבוהה ביותר בהטלת ההתנגדות**. כלומר, אם הטלת **4**, תסבול 2 לחץ. אם הטלת **6**, לא תסבול לחץ בכלל. אם קיבלת תוצאה **הצלחה קריטית**, אתה גם **מנקה 1 לחץ**.

    > הדמות של איאן, סיילס, נמצאת ב**קטטה** נואשת עם כמה דו-קרבנים, ואחד מהם פוגע בו בחרבו. מכיוון שהעמדה נואשת, שה״מ גורם לפציעה קשה (בכפוף לגורמים אחרים). הוא אומר לאיאן לרשום בדף הדמות של סיילס פציעה ברמה 3, "דקירה בבטן". איאן מחליט להתנגד לפציעה. שה״מ אומר שאם יתנגד, הוא יכול להפחית את הפציעה ברמה אחת. איאן מטיל 3d עבור התכונה **כושר** של סיילס ומקבל **5**. סיילס סובל 1 לחץ והפציעה יורדת לרמה 2, "חתך בצלעות".

    בדרך כלל הטלת התנגדות **מפחיתה את החומרה** של תוצאה. אם אתה עומד לסבול פציעה קטלנית, למשל, הטלת התנגדות תוריד אותה לפציעה קשה. או אם קיבלת סיבוך כשהתגנבת אל האחוזה, ושה״מ התכוון לסמן שלושה סימונים בשעון "כוננות", הוא יסמן רק שניים (או אולי אחד) אם התנגדת לסיבוך.

    **אתה יכול להטיל נגד תוצאה מסוימת פעם אחת בלבד.**

    לשה״מ יש גם אפשרות לקבוע שהדמות שלך **נמנעת לגמרי** מהתוצאה. למשל, אתה בקרב חרבות והתוצאה היא שמפילים את הנשק מידיך. כשאתה מתנגד, שה״מ אומר שאתה נמנע מהתוצאה לגמרי: אתה שומר על האחיזה בנשק שלך.

    **בהתאמה בין תוצאות שרק מופחתות לתוצאות שנמנעים מהן, שה״מ קובע את הטון הכללי של המשחק שלכם.** במשחק נועז יותר, רוב התוצאות יימנעו. במשחק קודר יותר, רוב התוצאות יופחתו בלבד בעזרת ההתנגדות.

    שה״מ רשאי גם לאיים בכמה תוצאות בבת אחת, ואז השחקן בוחר להתנגד לאילו מהן (ומטיל עבור כל אחת).

    > "היא דוקרת אותך ואז קופצת מהמרפסת. פציעה ברמה 2, ואתה מאבד את ההזדמנות לתפוס אותה בלחימה."
    >
    > "אני אתנגד לאובדן ההזדמנות ואחזיק בה בזמן שהיא תוקפת. היא יכולה לדקור אותי, אבל אני לא רוצה לתת לה לברוח."

    אחרי שהחלטת להתנגד לתוצאה ולהטיל, אתה סובל את הלחץ שנקבע. אי אפשר להטיל קודם, לראות כמה לחץ תסבול ואז להחליט אם להתנגד.
- id: resistance-and-armor-armor
  name: שריון
  description: |-
    אם יש לך סוג של **שריון** שחל על המצב, אתה יכול לסמן משבצת שריון כדי להפחית תוצאה או להימנע ממנה, במקום להטיל התנגדות.

    > סיילס סובל פציעה ברמה 2, "חתך בצלעות", והקרב עוד לא נגמר, ולכן איאן מחליט להשתמש בשריון של סיילס כדי להפחית את הפציעה. הוא מסמן את משבצת השריון והפציעה הופכת לרמה 1, "חבורה". אילו סיילס היה לובש שריון כבד, הוא היה יכול לסמן משבצת שריון שנייה ולהפחית את הפציעה שוב, לאפס.

    כשמשבצת שריון מסומנת, אי אפשר להשתמש בה שוב עד שהיא משוחזרת. כל השריון שלך משוחזר כשאתה בוחר את ה**עומס** שלך למבצע הבא.
- id: resistance-and-armor-death
  name: מוות
  description: |-
    יש כמה דרכים שבהן דמות מתה:

    * אם היא סובלת פציעה קטלנית ברמה 4 ואינה מתנגדת לה, היא מתה. *לפעמים זו בחירה שהשחקן רוצה לעשות, כי הוא מרגיש שלא הגיוני שהדמות תשרוד או שמתאים שהדמות שלו תמות כאן.*
    * אם היא צריכה לרשום פציעה ברמה 3 וכבר מלאה, היא סובלת תוצאה הרת אסון, שיכולה להיות מוות פתאומי (לפי הנסיבות).

    כשהדמות שלך מתה, יש לך אפשרויות:

    * אתה יכול ליצור נוכל חדש לשחק בו. אולי תקדם את אחד מחברי הכנופיה שאינם דמויות שחקן לדמות שחקן, או תיצור דמות חדשה לגמרי שמצטרפת לצוות.
- id: resistance-and-armor-resistance-roll
  name: הטלת התנגדות
  description: |-
    ⏣ **1d** על כל דירוג של **תכונה**.

    אתה **מפחית** את השפעות התוצאה או **נמנע** מהן (שה״מ בוחר).

    **סבול 6 **לחץ** פחות תוצאת הקובייה הגבוהה ביותר.**

    **קריטית**: נקה 1 לחץ.
- id: rituals
  name: טקסים
  description: |-
    לבצע טקס פירושו להיכנס למגע עם הכוחות התהומיים האלה ולהפציר בהם למלא את רצונך. זו פרקטיקה שאינה נטולת סיכון ניכר.
- id: rituals-finding-a-ritual-source
  name: מציאת מקור לטקס
  description: |-
    דמות עם היכולת המיוחדת **טקס** מתחילה עם טקס אחד מוכר, שכבר נלמד (ענה על השאלות שלהלן כדי ליצור אותו). כדי ללמוד טקס חדש, הדמות צריכה קודם למצוא **מקור**. אפשר להשיג מקור כשלל ממבצע, אולי בגניבת ספר טקסים כשהצוות שלכם שודד את מוזיאון העתיקות. אפשר גם להשיג מקור כמטרה של פרויקט ארוך טווח: בהיכרויות עם חברים מבין חברי כת, בעיון בכתבים עתיקים או בדרך אחרת שתמצא.
- id: rituals-learning-a-ritual
  name: לימוד טקס
  description: |-
    אחרי שנמצא מקור הטקס, אתה יכול לצאת לפרויקט ארוך טווח כדי ללמוד אותו. רוב הטקסים דורשים שעון התקדמות של 8 מקטעים ללימוד. השחקן ושה״מ (שליט המבוך) עונים על שאלות על הטקס כדי להגדיר מה הוא יעשה במשחק ומה נדרש כדי לבצע אותו (ראה בהמשך). השחקן רושם את התשובות בהערות שלו לעיון בעתיד.
- id: rituals-learning-a-ritual-example-ritual-answers
  name: דוגמה לתשובות על טקס
  description: |-
    > שחקן: "הטקס מגן על אדם כך שרוחות הרפאים של קורבנותיו לא יוכלו למצוא אותו. זה מוזר כי... כל עוד ההגנה במקומה, האדם מדי פעם בוכה דמעות של דם שחור."
    >
    > שה״מ: "הוצא פעולת זמן פנוי כדי להכין תערובת של טבק, עשן חלומות ואפר שריפה של אחד הקורבנות, שאותה המטרה מעשנת. אתה סובל לפחות 3 לחץ כשאתה מבצע את הטקס, וזו תהיה איכותו להטלת מזל כשרוח מאתגרת אותו, אז אולי כדאי לך לסבול יותר לחץ כדי להפוך אותו לעוצמתי יותר."
    >
    > שחקן: "הבנתי. הפחד החדש שלי הוא מה יקרה אם הרוחות יגלו מאין הגיעה ההגנה ויפנו את נקמתן נגדי במקום."
- id: rituals-learning-a-ritual-ritual-questions
  name: שאלות הטקס
  description: |-
    1. שה״מ (שליט המבוך) שואל: **"מה הטקס עושה ובמה הוא מוזר?"** השחקן עונה.
    2. השחקן שואל: **"מה עליי לעשות כדי לבצע את הטקס, ומה מחירו?"** שה״מ עונה. ביצוע טקס דורש לפחות פעולת זמן פנוי אחת וגורם **לחץ** למבצע לפי **העוצמה** שלו. אם ביצוע הטקס מסוכן או בעייתי בדרך כלשהי, הוא דורש הטלת פעולה (בדרך כלל **התאמה**). לטקס יכולות להיות גם עלויות נוספות, כמו קורבן, פריט נדיר, תחילתו של שעון התקדמות מעורר חרדה וכדומה.
    3. שה״מ שואל: **"איזו אמונה או פחד חדשים מטביעה בך הידיעה על הטקס הזה ועל הכוחות הנסתרים הנלווים אליו?"** השחקן עונה.
- id: rituals-performing-a-ritual
  name: ביצוע טקס
  description: |-
    כדי לבצע טקס, חייבת להיות לך היכולת המיוחדת **טקס**, ואז עליך לפעול לפי השיטה שנקבעה בתשובות לשאלות הטקס. רוב הטקסים לוקחים **פעולת זמן פנוי אחת** להשלמה, אף ששה״מ (שליט המבוך) רשאי לדרוש שתיים (או יותר) לטקסים חזקים מאוד או מרחיקי לכת. יש טקסים שאפשר לבצע חלקית בזמן הפנוי ולהוציא אותם במלואם מאוחר יותר לפי רצון, בהשלמת הלחש האחרון או פעולת הטקס האחרונה. במקרה כזה פשוט רשום שהטקס "מוכן" ואפשר לשחרר אותו בהמשך.

    כשאתה מבצע טקס, אתה סובל כמות של **לחץ** כפי שנקבעה בשאלות הטקס, לפי **העוצמה** של הכוחות שהופעלו. שה״מ משתמש בעוצמה כ*קו מנחה* לקביעת מחיר הלחץ: הוא יכול להיות גבוה או נמוך יותר לפי שיקול דעתו, כדי לתאר טוב יותר את אופי הטקס. יש תביעות ויכולות מיוחדות שמפחיתות גם הן את מחיר הלחץ של ביצוע טקסים (כמו תביעת **האובליסק הקדמון** של הכת).

    **טקסים לוקחים זמן לביצוע.** השתמש בדוגמאות המשך בטבלת העוצמה כדי להפחית את מחיר הלחץ לפי הזמן הנדרש, בדרך כלל לא פחות משעה.

    שה״מ רשאי גם **לסמן שעון התקדמות** כשאתה מבצע טקס, כדי לקדם את סדר היום של כוח או ישות נסתרים, או כדי להראות התקרבות מתמדת של תוצאה אפלה שנובעת משימוש בטקס.

    אם ביצוע הטקס מסוכן או בעייתי, בצע **הטלת פעולה** (בדרך כלל **התאמה**) כדי לראות אם יתממשו תוצאות לא נעימות. אם להשפעת הטקס אין ודאות, יש לבצע **הטלת מזל** כדי לראות עד כמה הוא מתממש. מכיוון שטקס הוא פעילות של זמן פנוי, אתה יכול להוציא **מטבעות** 1 תמורת 1 כדי להעלות את רמת התוצאה בהטלת המזל שלך (זה מייצג הוצאה על חומרי טקס יקרים או נדירים). אם טקס הוא גם מסוכן וגם לא ודאי, אפשר לדרוש את שתי ההטלות.

    כל ביצוע של טקס הוא אירוע ייחודי, ולא תמיד יפעל באותה דרך. שה״מ או השחקנים יכולים לדרוש סבב שאלות כדי לקבוע טקס מחדש. טקסים הם דרך להכניס למשחק מגוון רחב של השפעות נסתרות. השתמש בזהירות! אם הגזמת, ענו שוב על השאלות כדי לקבוע מוזרות ומחירים חדשים כשהדברים יצאו משליטה. הכוחות התהומיים אינם צעצוע ואין לראות בהם מקור כוח אמין או בטוח.
- id: setting-position-effect
  name: קביעת עמדה והשפעה
  description: |-
    שה״מ (שליט המבוך) קובע עמדה והשפעה להטלת פעולה באותו זמן, אחרי שהשחקן אומר מה הוא עושה ובוחר את הפעולה שלו. בדרך כלל **מסוכנת / רגילה** היא ברירת המחדל, ומשתנה לפי הפעולה שנעשית, עוצמת היריבים וגורמי ההשפעה.

    היכולת לקבוע עמדה והשפעה כמשתנים בלתי תלויים נותנת לך תשע צירופים לבחירה, כדי לתאר מגוון רחב של נסיבות בסיפור.

    *למשל, אם דמות ניצבת לבדה מול כנופיית אויבים קטנה, המצב יכול להיות:*

    * *היא נלחמת בכנופיה ישירות, ממהרת לתוכה וחובטת בפראות ב**קטטה**. במקרה זה האיום מהכוח הגדול מנמיך את העמדה שלה כדי לציין סיכון גדול יותר, וגודל הכנופיה מפחית את ההשפעה שלה (נואשת / מוגבלת).*
    * *היא נלחמת בכנופיה מנקודת חנק, כמו סמטה צרה שבה המספרים שלהם לא יכולים להכריע אותה בבת אחת. כמה מהם לא מאיימים עליה בבת אחת, ולכן הסיכון שלה דומה לקרב אחד על אחד, אבל עדיין יש הרבה אויבים להתמודד איתם, ולכן ההשפעה שלה מופחתת (מסוכנת / מוגבלת).*
    * *היא לא נלחמת בכנופיה, אלא מנסה לתמרן סביבה ולברוח. היא עדיין מאוימת מהתקפות רבות, ולכן העמדה שלה גרועה יותר, אבל אם השטח פתוח והכנופיה לא יכולה לכתר אותה בקלות, ההשפעה שלה על הבריחה לא מופחתת (נואשת / רגילה). אם היה לה אמצעי בריחה מיידי (כמו קפיצה על כרכרה דוהרת), ההשפעה שלה אפילו יכולה לגדול (נואשת / גדולה).*
    * *הכנופיה עוד לא מודעת אליה: היא התמקמה בעמדת צלף על גג סמוך. היא יורה באחד מהם. המספרים הגדולים שלהם אינם גורם, ולכן ההשפעה שלה לא מופחתת, והיא אינה בסכנה מיידית (מבוקרת / גדולה). אולי במקום זאת היא רוצה לירות מטח אש מדכאת על הכנופיה כולה, ואז גודלם משפיע (מבוקרת / מוגבלת). אם הכנופיה בכוננות לצרות אפשריות, העמדה שלה מסוכנת יותר (מסוכנת / גדולה). אם הכנופיה התריעה על צלף, ההשפעה יכולה לרדת עוד, כשהם מתפזרים ונחבאים (מסוכנת / מוגבלת). אם הכנופיה מצליחה לארגן אש מכסה בזמן שהיא נסוגה לעמדה בטוחה, המצב גרוע עוד יותר לנוכל שלנו (נואשת / מוגבלת).*
