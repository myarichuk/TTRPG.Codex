- id: stress-trauma-pushing-yourself
  name: להתאמץ יותר
  description: |-
    אתה יכול להשתמש בלחץ כדי להתאמץ יותר ולהגיע לביצוע טוב יותר. על כל בונוס שתבחר מהרשימה, קבל **2 לחץ** (כל בונוס אפשר לבחור פעם אחת בלבד לכל פעולה):

    * הוסף **+1d** להטלה שלך. (אפשר להשתמש בזה בהטלת פעולה, בהטלת זמן פנוי או בכל הטלה אחרת שבה מאמץ נוסף יעזור לך)
    * הוסף **+1 דרגה** להשפעה שלך.
    * פעל גם כשאתה חסר יכולת פעולה.
- id: stress-trauma-stress
  name: לחץ
  description: |-
    לדמויות השחקנים ב-*Blades in the Dark* יש מאגר מיוחד שנקרא **לחץ**. כשהן סובלות מתוצאה שהן לא רוצות לקבל, הן יכולות לקבל לחץ במקומה. תוצאת **הטלת ההתנגדות** קובעת כמה לחץ יעלה להימנע מתוצאה רעה.

    *בזמן קרב סכינים, הדמות של דניאל, קרוס, נדקרת בחזה. דניאל מטיל את דירוג **הכושר** שלו כדי להתנגד, ומקבל **2**. ההתנגדות לתוצאה עולה 6 לחץ פחות 2 (תוצאת הטלת ההתנגדות). דניאל מסמן 4 לחץ ומתאר איך קרוס שורד.*

    *שה״מ פוסק שהפציעה קטנה בזכות הטלת ההתנגדות, אך לא נמנעת לגמרי. קרוס סובל מפציעה ברמה 2 ("פצע בחזה") במקום פציעה ברמה 3 ("ריאה מנוקבת").*
- id: stress-trauma-trauma
  name: טראומה
  description: |-
    כשדמות שחקן מסמנת את משבצת הלחץ האחרונה שלה, היא סובלת מרמה אחת של **טראומה**. כשאתה מקבל **טראומה**, הקף בעיגול אחד מ**מצבי הטראומה** שלך, כמו *קר*, *פזיז*, *לא יציב* ועוד. כולם מתוארים בסעיף הבא.

    כשאתה סובל מ**טראומה**, אתה יוצא מהמשחק. אתה "נשאר מאחור למות" או נופל מהעימות הנוכחי בדרך אחרת, ורק חוזר אחר כך, מזועזע ומרוקן. כשאתה חוזר, **יש לך אפס לחץ** והיצר שלך סופק עד הזמן הפנוי הבא.

    **מצבי טראומה הם קבועים**. הדמות שלך רוכשת את מוזרות האופי החדשה שהמצב מציין, ויכולה להרוויח ניסיון (xp) כשהיא משתמשת בה כדי לגרום צרות. **כשאתה מסמן את מצב הטראומה הרביעי שלך**, הדמות שלך לא יכולה להמשיך כנוכל נועז. עליך לפרוש אותה לחיים אחרים או לשלוח אותה לכלא כדי שתיקח את האשמה על **רמת המבוקש** של הצוות.
- id: teamwork-do-we-have-to-use-teamwork
  name: האם חייבים להשתמש בעבודת צוות?
  description: תמרוני עבודת צוות הם אפשרויות ולא חובה. כל דמות עדיין יכולה לבצע פעולות לבד כרגיל במהלך מבצע. אם הדמות שלך לא יכולה לתקשר עם שאר הצוות או לתאם איתו את פעולותיה, אתה לא יכול להשתמש בתמרוני עבודת צוות ולא ליהנות מהם.
- id: teamwork-teamwork
  name: עבודת צוות
  description: |-
    כשצוות דמויות השחקנים עובד יחד, עומדים לרשות הדמויות ארבעה **תמרוני עבודת צוות** מיוחדים. הם רשומים בתחתית דפי הפלייבוק של הדמויות כדי להזכיר אותם לשחקנים. ארבעת התמרונים הם:

    * **סיוע** לדמות שחקן אחרת שמטילה פעולה.
    * הובלת **פעולה קבוצתית**.
    * **הגנה** על חבר צוות.
    * **הכנה** של דמות שתמשיך את הפעולה שלך.
- id: teamwork-teamwork-assist
  name: סיוע
  description: |-
    כשאתה מסייע לשחקן אחר שמטיל, תאר מה הדמות שלך עושה כדי לעזור. קבל 1 לחץ ותן לו **+1d** להטלה. ייתכן שתסבול גם מתוצאות שיקרו בגלל ההטלה, בהתאם לנסיבות. רק דמות אחת יכולה לסייע להטלה נתונה. *אם אתה באמת רוצה לעזור ומישהו אחר כבר מסייע, שקול לבצע במקום זאת תמרון של **הכנה**.*

    דמות יכולה לסייע לפעולה קבוצתית, אבל רק אם היא לא משתתפת בה ישירות. אתה מחליט איזו דמות בפעולה הקבוצתית מקבלת את קובייה הבונוס.
- id: teamwork-teamwork-lead-a-group-action
  name: הובלת פעולה קבוצתית
  description: |-
    כשאתה מוביל פעולה קבוצתית, אתה מתאם כמה חברי צוות כדי להתמודד יחד עם בעיה. תאר איך הדמות שלך מובילה את הצוות במאמץ מתואם. האם אתה נוהם פקודות, נותן אותות יד שקטים או מספק השראה כריזמטית?

    כל דמות שחקן שמעורבת מטילה **הטלת פעולה** (באותה פעולה) ו**הצוות סופר את התוצאה הטובה ביותר היחידה** כמאמץ הכולל של כל מי שהטיל. עם זאת, הדמות שמובילה את הפעולה הקבוצתית מקבלת **1 לחץ** על כל דמות שחקן שהטילה** 1-3** כתוצאה הטובה ביותר שלה.

    > כך עושים את סצנת "כולנו מתגנבים לבניין". כל מי שרוצה להתגנב מטיל את פעולת ההתגנבות שלו, והתוצאה הטובה ביותר נחשבת לכל הצוות. המוביל סובל מלחץ בעבור כל מי שהצליח רע. קשה לכסות על הפיגרים.

    **תוצאת הפעולה הקבוצתית חלה על כל מי שהטיל.** אם אתה לא מטיל, הדמות שלך לא נהנית מהשפעות הפעולה.

    הדמות שלך לא חייבת להיות מיומנת במיוחד בפעולה הנדונה כדי להוביל פעולה קבוצתית. התמרון הזה עוסק במנהיגות, לאו דווקא ביכולת. אתה יכול גם להוביל את **המקורבים** של הצוות שלך בפעולה קבוצתית. הטל **פיקוד** אם אתה מכוון את מאמציהם, או הטל את דירוג הפעולה המתאימה אם אתה משתתף לצדם. המקורב מטיל את רמת **האיכות** שלו.
- id: teamwork-teamwork-protect
  name: הגנה
  description: |-
    אתה נכנס לעמוד מול תוצאה שאחד מחבריך לצוות היה סובל ממנה אחרת. **אתה סובל ממנה במקומו. אתה יכול להטיל התנגדות כדי להתנגד לה כרגיל.** תאר איך אתה מתערב.

    > כך עושים את "אני אקפוץ מול הכדור". אתה מכסה על חבר צוות וסובל מכל פציעה או תוצאה שנותרו אחרי שהטלת התנגדות. זה כואב, עולה לחץ ועלול להשאיר אותך במצב רע. אבל היי, אתה גיבור.
- id: teamwork-teamwork-set-up
  name: הכנה
  description: |-
    כשאתה מבצע פעולת הכנה, יש לך השפעה עקיפה על מכשול. אם הפעולה שלך משיגה את התוצאה המיועדת, כל חבר צוות שממשיך את התמרון שלך מקבל **+1 רמת השפעה** או **עמדה משופרת** להטלה שלו. אתה בוחר את היתרון בהתאם לאופי פעולת ההכנה שלך.

    > כך עושים את סצנת "אני אסית את תשומת הלב". אתה מטיל **שכנוע** כדי להסיח את דעתו של שוטר בקסמיך, ואז כל חבר צוות שממשיך בפעולת **התגנבות** כדי לחמוק על פניו יכול לקבל עמדה משופרת. זה פחות מסוכן כי אתה מושך את תשומת לבו של השומר.

    זו דרך טובה לתרום למבצע כשאין לך דירוג טוב בפעולה הנדונה. פעולת הכנה ממולחת מאפשרת לך לעזור לצוות בעקיפין. כמה פעולות המשך יכולות לנצל את ההכנה שלך (כולל מי ש**מוביל** פעולה קבוצתית), כל עוד זה הגיוני בעלילה.

    מכיוון שפעולת הכנה יכולה להגדיל את ההשפעה של פעולות ההמשך, היא שימושית גם כשהצוות מתמודד עם התנגדות קשה שיש לה יתרונות באיכות, בקנה מידה ו/או בעוצמה. גם אם דמויות השחקנים מצטמצמות לאפס השפעה בגלל חסרונות במצב, פעולת ההכנה מספקת בונוס שמאפשר השפעה מוגבלת.

    > דמויות השחקנים ניצבות מול כרכרה משוריינת כבדה שחסינה לנשקן. אלדו משתמש ב**הרס** כפעולת הכנה כדי לשחרר חלק מהשריון בעזרת המנוף שלו, ונותן לפעולות ההמשך +1 השפעה, ועובר מאפס השפעה להשפעה מוגבלת.
- id: the-basics-playing-a-session
  name: קיום מפגש
  description: |-
    מפגש של *Blades in the Dark* דומה לפרק בסדרת טלוויזיה. יש אירוע ראשי אחד או שניים, ואולי כמה אלמנטים של עלילות צד, שכולם משתלבים בסדרה מתמשכת. מפגש משחק יכול להימשך בין שעתיים לשש שעות, בהתאם להעדפות הקבוצה.

    במהלך מפגש, צוות הנוכלים עובד יחד כדי לבחור מבצע להשלים, ואז הם מטילים כמה הטלות קוביות כדי לקפוץ לפעולה של המבצע המתנהל. דמויות השחקנים מבצעות פעולות, סובלות מתוצאות ומסיימות את המבצע (בהצלחה או בכישלון). אחר כך לצוות יש זמן פנוי, שבו הוא מתאושש, מקדם פרויקטי צד ומתמסר ליצרים שלו. אחרי הזמן הפנוי, השחקנים שוב מחפשים הזדמנות חדשה או יוצרים מטרות ושאיפות משלהם, ואנחנו משחקים כדי לגלות מה יקרה הלאה.
- id: the-basics-the-characters
  name: הדמויות
  description: הדמויות מנסות לפתח את הצוות שלהן בביצוע מבצעים ובהתמודדות עם איומים מצד אויביהן.
- id: the-basics-the-crew
  name: הצוות
  description: נוסף על יצירת דמויות, תיצרו גם את הצוות, בבחירת סוג המפעל הפלילי שמעניין אתכם לחקור.
- id: the-basics-the-game
  name: המשחק
  description: '*Blades in the Dark* הוא משחק על קבוצת דמויות נועזות שבונות צוות יוזם. אנחנו משחקים כדי לגלות אם הצוות הצעיר יכול לשגשג בין האיומים הרבים שמקיפים אותו.'
- id: the-basics-the-game-master
  name: שליט המבוך
  description: |-
    שליט המבוך (שה״מ) מקים את העולם הדינמי סביב הדמויות. שה״מ מגלם את כל הדמויות שאינן דמויות שחקנים בעולם, ונותן לכל אחת רצון קונקרטי ושיטת פעולה מועדפת.

    שה״מ עוזר לארגן את שיחת המשחק כך שתפנה אל האלמנטים המעניינים של המשחק. שה״מ אינו אחראי על העלילה ואינו צריך לתכנן אירועים מראש. הוא מציג לשחקנים הזדמנויות מעניינות, ואז עוקב אחר שרשרת הפעולות והתוצאות לאן שהיא מובילה.
- id: the-basics-the-players
  name: השחקנים
  description: |-
    כל שחקן יוצר דמות ועובד עם שאר השחקנים כדי ליצור את הצוות שהדמויות שלהם שייכות אליו. כל שחקן שואף להביא את דמותו לחיים כדמות מעניינת ונועזת שפורצת באומץ אל מעבר לביטחון ולאמצעים הנוכחיים שלה.

    השחקנים עובדים יחד עם שליט המבוך כדי לקבוע את הטון והסגנון של המשחק, בהכרעות שיקול דעת לגבי המכניקה, הקוביות והתוצאות של פעולות. השחקנים לוקחים אחריות כשותפים ליצירת המשחק עם שה״מ.
- id: the-core-system-judgment-calls
  name: הכרעות שיקול דעת
  description: |-
    כשמשחקים, תקבלו כמה הכרעות מפתח. כולם תורמים, אבל בכל אחת מהן או השחקנים או שה״מ מקבלים את המילה האחרונה:

    * אילו פעולות הן פתרון סביר לבעיה? *האם אפשר לשכנע את האדם הזה? האם צריך להוציא כלים ולטכנא את המנעול הישן והחלוד הזה, או שאפשר גם לפתוח אותו בעדינות ובשקט?* לשחקנים יש את המילה האחרונה.
    * עד כמה פעולה נתונה מסוכנת ועד כמה היא יעילה בנסיבות האלה? *עד כמה זה מסוכן? האם אפשר לשכנע את האדם הזה מעט מאוד או הרבה מאוד?* לשה״מ יש את המילה האחרונה.
    * אילו תוצאות מוטלות כדי לממש את הסכנות בנסיבות נתונות? *האם הנפילה הזאת מהגג שוברת לך את הרגל? האם השוטרים רק נעשים חשדנים, או שכבר לכדו אותך?* לשה״מ יש את המילה האחרונה.
    * האם המצב הזה דורש הטלת קוביות, ואיזו? *האם הדמות שלך במצב שמאפשר לה להטיל פעולה, או שעליה קודם להטיל התנגדות כדי להשיג יוזמה?* לשה״מ יש את המילה האחרונה.
    * אילו אירועים בעלילה תואמים את מניעי הניסיון להתקדמות של הדמות והצוות? *האם הבעת את אמונותיה, דחפיה, מורשתה או רקעה של הדמות שלך? אתה אומר לנו.* לשחקנים יש את המילה האחרונה.
- id: the-core-system-rolling-the-dice
  name: הטלת הקוביות
  description: |-
    *Blades in the Dark* משתמש בקוביות בנות שש פאות. אתה מטיל כמה קוביות בבת אחת וקורא את **התוצאה הגבוהה ביותר היחידה**.

    * אם הקובייה הגבוהה ביותר היא **6**, זו **הצלחה מלאה**, והדברים מסתדרים. אם הטלת יותר מ-**6** אחד, זו **הצלחה קריטית**, ואתה מקבל יתרון נוסף.
    * אם הקובייה הגבוהה ביותר היא **4 או 5**, זו **הצלחה חלקית**: אתה עושה את מה שניסית לעשות, אבל יש תוצאות: צרות, פציעה, השפעה מופחתת וכן הלאה.
    * אם הקובייה הגבוהה ביותר היא **1-3**, זה **כישלון**. הדברים משתבשים. כנראה שלא תשיג את מטרתך, ותסבול גם מסיבוכים.

    *אם אי פעם תצטרך להטיל אך יש לך אפס קוביות (או פחות), הטל שתי קוביות וקח את התוצאה הנמוכה ביותר היחידה. אי אפשר להטיל **הצלחה קריטית** כשיש לך אפס קוביות.*

    כל מערכות הקוביות במשחק הן ביטויים של הפורמט הבסיסי הזה. כשאתה רק לומד את המשחק, תמיד אפשר "לצמצם" בחזרה להטלה פשוטה כדי לשפוט איך הדברים מתנהלים. את החוק המדויק אפשר לבדוק אחר כך כשיש זמן.

    כדי ליצור מאגר קוביות להטלה, תשתמש ב**מאפיין** (כמו **עדינות** או **כושר** שלך, או הדרג של הצוות שלך) ותיקח קוביות כמספר ה**דירוג** שלו. בדרך כלל תגיע לקובייה אחת עד ארבע. אפילו קובייה אחת טובה למדי במשחק הזה: סיכוי של 50% להצלחה. המאפיינים הנפוצים ביותר הם **דירוגי הפעולה** של דמויות השחקנים. שחקן עשוי להטיל קוביות לפי דירוג הפעולה **קטטה** שלו כשהוא נלחם באויב, למשל.

    יש ארבעה סוגי הטלות שתשתמשו בהם לרוב במשחק:

    * **הטלת פעולה**. כשדמות שחקן מנסה פעולה מסוכנת או בעייתית, אתה מבצע הטלת פעולה כדי לגלות איך זה הולך. הטלות פעולה, ההשפעות שלהן והתוצאות שלהן מניעות את רוב המשחק.
    * **הטלת זמן פנוי**. כשדמויות השחקנים נחות אחרי עבודה, הן יכולות לבצע פעילויות זמן פנוי בביטחון יחסי. אתה מבצע הטלות זמן פנוי כדי לראות כמה הן משיגות.
    * **הטלת מזל**. שה״מ יכול לבצע הטלת מזל כדי להסיר מעצמו את ההחלטה ולהשאיר דבר מה בידי המקרה. *עד כמה נאמנה דמות שה״מ? עד כמה המגפה מתפשטת? כמה ראיות נשרפות לפני שהשוטרים פורצים את הדלת?*
    * **הטלת התנגדות**. שחקן יכול לבצע הטלת התנגדות כשהדמות שלו סובלת מתוצאה שאינה לרוחו. ההטלה אומרת לנו כמה לחץ הדמות שלו סובלת כדי להפחית את חומרת התוצאה. *כשאתה מתנגד לפציעה "רגל שבורה", אתה מקבל קצת לחץ ועכשיו זו רק "קרסול נקוע".*
