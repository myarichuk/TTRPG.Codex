- id: crafting
  name: יצירה
  description: |-
    בזמן פנוי יכולה דמות שחקן לעסוק ב**טכנאות** עם חומרים וכלים מיוחדים: להפיק **אלכימיקלים** מוזרים, **לבנות** (או **לשנות**) **פריטים**, **ליצור מתקני מכאנקסם** או לקסום כלים וכלי נשק **מאגיים**. השיטה זהה פחות או יותר בכל אחד מהאופנים, והפרטים משתנים לפי אופיו של הפרויקט.
- id: crafting-crafting
  name: יצירה
  description: |-
    כדי ליצור משהו, הקדש **פעילות בזמן פנוי** אחת להטלת **טכנאות** שתקבע את **רמת האיכות** של הפריט שתפיק. רמת האיכות הבסיסית שווה לדרג של הצוות שלך, ותוצאת ההטלה משנה אותה (התוצאות בסעיף הבא).

    התוצאות מבוססות על דרג הצוות משום שהוא מעיד על איכות סביבת העבודה והחומרים שעומדים לרשותך. *אם אתה עובד עם שדרוג **הסדנה** של הצוות, דרג הצוות האפקטיבי שלך גבוה בדרג אחד להטלה זו.*
- id: crafting-crafting-crafting-roll
  name: הטלת יצירה
  description: |-
    ⏣ **1d** על כל נקודת פעולה ב**טכנאות**.

    ⊕ **+1** איכות על כל **מטבע** שהוצא.

    ⊕ **+1** איכות עבור שדרוג הצוות **סדנה**.

    * **קריטית**: רמת האיכות היא דרג +2.
    * **6**: רמת האיכות היא דרג +1.
    * **4/5**: רמת האיכות שווה לדרג.
    * **1-3**: רמת האיכות היא דרג -1.

    ---

    שליט המבוך (שה״מ) קובע **איכות מינימלית** שיש להגיע אליה כדי ליצור את הפריט, לפי **העוצמה** של ההשפעות שהפריט מפיק. שה״מ משתמש בעוצמה כ*קו מנחה* בלבד: הוא רשאי להעלות או להוריד את האיכות כדי לתאר טוב יותר את אופי הפרויקט. אפשר ליצור פריט באיכות *גבוהה* יותר אם השחקן רוצה לנסות.

    אתה רשאי להוציא **מטבעות** ביחס של 1 ל-1 כדי להעלות את רמת האיכות הסופית של ההטלה (כך אפשר לעבור את דרג +2).
- id: crafting-crafting-drawbacks
  name: חסרונות
  description: |-
    ליצירה או לשינוי יכול להיות חיסרון אחד או יותר, לפי בחירת שה״מ.

    * **מורכב**. תצטרך ליצור אותו בכמה שלבים, ושה״מ יאמר לך כמה. כל שלב דורש פעילות בזמן פנוי אחת והטלת יצירה אחת.
    * **בולט**. היצירה לא עוברת בלי שישימו לב אליה. קבל **+1** **חום** אם משתמשים בה, בכל מספר פעמים, במבצע.
    * **מתכלה**. ליצירה יש מספר מוגבל של שימושים (לכל אלכימיקל חייב להיות חיסרון זה, בדרך כלל שימוש אחד).
    * **נדיר**. יצירה זו דורשת פריט או חומר נדיר כשיוצרים אותה.
    * **לא אמין**. כשאתה משתמש בפריט, הטל הטלת מזל (לפי **האיכות** שלו) כדי לראות עד כמה הוא מתפקד היטב.
    * **הפכפך**. הפריט מפיק למשתמש תופעת לוואי מסוכנת או מטרידה, שמציין שה״מ. תופעת לוואי היא תוצאה, ואפשר שהמשתמש **עמד בהתנגדות** אליה.
- id: crafting-crafting-modifying-an-item
  name: שינוי פריט
  description: |-
    הוספת תכונה או פונקציה נוספת לפריט פשוטה יותר מיצירת דבר חדש. אין צורך להמציא נוסחה או תוכנית מיוחדת. הטל הטלת יצירה כדי לשנות פריט (האיכות הבסיסית של פריט ששינית שווה לדרג הצוות שלך, כרגיל).

    * שינוי פשוט ושימושי דורש איכות של דרג +1. *רובה שמתפרק לשני חלקים כדי להסתירו בקלות.*
    * שינוי משמעותי דורש איכות של דרג +2. *חיזוק הקנה ועומס אבק השריפה באקדח כדי שיירה רחוק יותר.*
    * שינוי מאגי, מכאנקסמי או אלכימי דורש איכות של דרג +3. *פגיון שיכול לפגוע בשד. מעטפת חשמלית לסירה שדוחה פולשים או רוחות. בגדים מצופים כימיקלים שמסווים אותך מפני טורפי ארצות המוות.*

    לפריטים ששונו, כמו ליצירות מיוחדות, עשויים להיות **חסרונות**.
- id: crafting-inventing
  name: המצאה
  description: |-
    כדי להמציא נוסחה לתרכובת אלכימית חדשה או תוכנית לפריט חדש שתכננת, עליך לעשות **עיון** בו כ**פרויקט ארוך טווח**. רוב הנוסחאות והתוכניות החדשות ידרשו שעון התקדמות של 8 מקטעים כדי להמציא וללמוד אותן. השחקן ושה״מ עונים על שאלות על ההמצאה כדי להגדיר מה היא תעשה במשחק ומה נדרש כדי ליצור אותה (ראה להלן). השחקן רושם את התשובות בהערותיו לעיון עתידי.
- id: crafting-inventing-creation-questions
  name: שאלות היצירה
  description: |-
    1. שליט המבוך (שה״מ) שואל: **"איזה סוג של יצירה זו ומה היא עושה?"** השחקן עונה. יצירה יכולה להיות רגילה, אלכימית, מאגית או מכאנקסמית. אם לדמות יש יכולת מיוחדת מתאימה (**אלכימאי**, **אומן מכשירים**, **שיטות מוזרות**), היא מקבלת בונוסים בהמצאה וביצירה של סוגי יצירות מסוימים.
    2. השחקן שואל: **"מהי רמת האיכות המינימלית של הפריט הזה?"** שה״מ עונה, כשהוא נעזר ב**עוצמה** של ההשפעות שהפריט מפיק כקו מנחה.
    3. שה״מ שואל: **"איזה היבט נדיר, מוזר או בעייתי בנוסחה או בתוכנית הזו הותיר אותה בצל, הרחק משימוש נפוץ?**" השחקן עונה.
    4. השחקן שואל: **"אילו חסרונות יש לפריט הזה, אם יש?"** שה״מ עונה בבחירת חיסרון אחד או יותר מרשימת החסרונות, או באמירה שאין כאלה.

    דמות עם היכולות המיוחדות **אלכימאי**, **אומן מכשירים** או **שיטות מוזרות** ממציאה ולומדת נוסחה מיוחדת אחת כשהיא לוקחת את היכולת (אין צורך להקדיש זמן ללמוד אותה).

    משהמצאת נוסחה או תוכנית, אפשר **ליצור** אותה בפעילות בזמן פנוי (ראה **יצירה**, להלן). איש אחר לא יוכל ליצור המצאה זו אלא אם ילמד את התוכנית שלך כפרויקט ארוך טווח. אם השגת נוסחה או תוכנית שהמציא טכנאי אחר, אתה יכול ללמוד ליצור אותה בהשלמת פרויקט ארוך טווח.

    אלכימיקלים נפוצים (ראה **יצירות לדוגמה** למידע נוסף) ופריטים רגילים אינם דורשים נוסחאות או תוכניות מיוחדות. כל אחד רשאי לנסות ליצור אותם לפי הוראות הזמינות לכל.
- id: crew-creation-assign-crew-upgrades
  name: הקצאת שדרוגי הצוות
  description: |-
    שדרוג הוא נכס יקר ערך שעוזר לצוות בדרך כלשהי, כמו סירה או כנופיה (התיאורים המלאים בסעיפים הבאים). לכל סוג צוות יש שני **שדרוגים** שנבחרו מראש ומתאימים לו (כמו **אימון** **כושר** ו**כנופיה** של בריונים לצוות הבראבוס).

    אתה מוסיף לצוות החדש **שני שדרוגים נוספים** (כך שיהיו לך ארבעה שדרוגים בסך הכול בתחילת המשחק). אפשר לבחור מהשדרוגים הייחודיים לסוג הצוות שלך או מהשדרוגים הכלליים שבדף הצוות.

    כשאתה מקצה את שני השדרוגים, שליט המבוך (שה״מ) יספר לך על שני פלגים שהבחירות שלך משפיעות עליהם:

    * פלג אחד עזר לך להשיג שדרוג. הוא מחבב אותך, ואתה מקבל **+1 מעמד** מולו. לפי בחירתך, הוצא 1 **מטבע** כדי להחזיר לו טובה וקבל במקום זאת **+2 מעמד** מולו.
    * פלג אחד נפגע כשהשגת שדרוג. הוא לא מחבב אותך, ואתה מקבל **-2 מעמד** מולו. לפי בחירתך, הוצא 1 **מטבע** כדי לפייס אותו וקבל במקום זאת **-1 מעמד** מולו.

    בעתיד תוכל להשיג עוד שדרוגים בהרוויית ניסיון
- id: crew-creation-choose-a-crew-type
  name: בחירת סוג צוות
  description: |-
    בכל משחק המבוסס על להבים צריכים להיות סוגי צוות שמתאימים לעולמו ולרעיון המרכזי שלו. אלה יכולים להיות ארגונים, כנופיות, ספינות, מבצרים וכדומה. שלוש עד שש אפשרויות הן כמות טובה.

    סוג הצוות קובע באילו מבצעים תתמקד, וגם אילו יכולות מיוחדות יהיו זמינות כדי לתמוך בסוג כזה של פעולה. סוג הצוות אינו נועד להגביל: צוות של מבריחים עשוי לפעמים לסחוט דמי חסות או למכור סחורה אסורה, אך הפעילות המרכזית של סוג הצוות היא הדרך השכיחה ביותר שבה הוא מרוויח **מטבעות** וניסיון להתקדמות.

    כמו פלייבוק של דמות, סוג הצוות הוא גם הדרך שבה מכירים אתכם בעולם התחתון. הפלגים והמוסדות הפליליים רואים בכם "מתנקשים" או "כת" וכדומה, ויתייחסו אליכם בהתאם.

    הצוות שלך מתחיל עם 2 **מטבעות** בקופתו (שאריות החסכונות של הדמויות). אתה בדרג **0**, עם **אחיזה חזקה** ו-**0** **מוניטין**.
- id: crew-creation-choose-a-favorite-contact
  name: בחירת איש קשר מועדף
  description: |-
    עיין ברשימת אנשי הקשר האפשריים בדף הצוות. בחר איש קשר אחד שהוא חבר קרוב, בעל ברית ותיק או שותף לפשע. שליט המבוך (שה״מ) יספר לך על שני פלגים שבחירתך משפיעה עליהם:

    * פלג אחד ידידותי גם הוא לאיש הקשר הזה, ואתה מקבל **+1 מעמד** מולו.
    * פלג אחד עוין את איש הקשר הזה, ואתה מקבל **-1 מעמד** מולו.

    לפי בחירתך, הפלגים האלה מתעניינים באיש הקשר עוד יותר, ולכן אתה מקבל **+2** ו-**-2 מעמד** במקום זאת.
- id: crew-creation-choose-a-special-ability
  name: בחירת יכולת מיוחדת
  description: |-
    עיין ביכולות המיוחדות של הצוות שלך ובחר אחת. אם אינך מצליח להחליט, בחר את הראשונה ברשימה: היא ממוקמת שם כברירת מחדל טובה. חשוב לבחור יכולת מיוחדת שכולם מתלהבים ממנה. תוכל להשיג עוד יכולות מיוחדות בעתיד בהרוויית ניסיון.

    בדיוק כמו בחירת סוג הצוות, המוניטין, המאורה ושטחי הציד, בחירת יכולת מיוחדת היא הזדמנות נוספת לצמצם את המשחק לטווח אפשרויות מוגדר יותר. יש כאן הרבה חומר לעבוד איתו, וזה עוזר לצאת לדרך בהתחלה חזקה כבר מהרגע הראשון.
- id: crew-creation-choose-an-initial-reputation-lair
  name: בחירת מוניטין ראשוני ומאורה
  description: |-
    הצוות שלך הוקם זה עתה ורכש מאורה. בהינתן הקבוצה הזו של דמויות והעלילות שעברו, איזה **מוניטין** ראשוני יהיה לכם בקרב פלגי העולם התחתון? בחר אחד מהרשימה מימין (או צור משלך).

    * שאפתן
    * אלים
    * נועז
    * מכובד
    * מקצועי
    * ממולח
    * חמקמק
    * מוזר

    אתה מרוויח ניסיון כשאתה מחזק את המוניטין של הצוות, ולכן ראה בזה רמז נוסף לסוג הפעולה שאתה רוצה במשחק. האם תהיה שאפתן עד כדי פזיזות ותתמקד ביעדים בדרג גבוה יותר? האם תיקח על עצמך מבצעים נועזים שאחרים רואים בהם משימה מסוכנת מדי? האם מעניינים אותך המוזר והמשונה?

    דבר גם על המקום שבו הצוות מקים את **המאורה** שלו. אתה מתחיל בדרג 0, ולכן זה כנראה מקום צנוע מאוד או נטוש.
- id: crew-creation-cohort-harm-healing
  name: פציעת מקורבים והחלמה
  description: |-
    מקורבים סובלים מפציעות בדומה לדמויות שחקן. מקורב יכול לסבול מארבע רמות של פציעה:

    * **מוחלש.** למקורב יש השפעה מופחתת.
    * **פגוע.** המקורב פועל באיכות מופחתת (-1d).
    * **שבור.** המקורב לא יכול לעשות דבר עד שיחלים.
    * **מת.** המקורב הושמד.

    כל המקורבים שלך מחלימים בזמן הפנוי. אם הנסיבות מאפשרות החלמה, כל מקורב מסיר רמת פציעה אחת (או שתי רמות פציעה במקום זאת, אם דמות שחקן מקדישה פעילות בזמן פנוי כדי לעזור לו להתאושש).

    אם מקורבים הושמדו, אפשר להחליפם. הוצא **מטבעות** השווים לדרג שלך +2 כדי לשקם אותם, ובנוסף שתי פעילויות בזמן פנוי כדי לגייס חברי כנופיה חדשים או לשכור מומחה חדש.
- id: crew-creation-cohorts
  name: מקורבים
  description: |-
    **מקורב** הוא **כנופיה** או **מומחה** שעובדים בשביל הצוות שלך. כדי לגייס מקורב חדש, הוצא **שני שדרוגים** וצור אותו לפי התהליך שלהלן.
- id: crew-creation-cohorts-creating-a-gang
  name: יצירת כנופיה
  description: |-
    בחר **סוג כנופיה** מהרשימה שלהלן:

    * **מלומדים**: חוקרים, ממציאים, אוקולטיסטים וכימאים.
    * **רמאים**: נוכלים, מרגלים ואנשי חברה.
    * **נודדים**: ימאים, עגלונים ומלקטי שאריות בארצות המוות.
    * **מתגנבים**: סיירים, חודרים וגנבים.
    * **בריונים**: רוצחים, קטנים ופועלי כוח.

    לכנופיה יש **קנה מידה** ו**איכות** השווים לדרג הנוכחי של הצוות שלך. הם עולים בקנה מידה ובאיכות כשהצוות שלך עולה בדרג.

    > אם הצוות שלך בדרג 0, הכנופיה שלך באיכות 0 ובקנה מידה 0 (1 או 2 אנשים). כשהצוות שלך בדרג II, הכנופיה שלך באיכות 2 ובקנה מידה 2 (12 אנשים).

    שדרוגי צוות מסוימים מוסיפים לכנופיה את התכונה "עילית", שנותנת לה +1d כשהיא מטילה עבור סוג מסוים. *כך, אם אתה בדרג I ויש לך כנופיה של בריונים עילית (+1d), הם יטילו 2d כשינסו להרוג מטרה.*
- id: crew-creation-cohorts-creating-an-expert
  name: יצירת מומחה
  description: |-
    רשום את **סוג** המומחה (תחום המומחיות המסוים שלו). הוא יכול להיות *רופא*, *חוקר*, *אוקולטיסט*, *מתנקש*, *מרגל* וכדומה.

    למומחה יש **איכות** השווה לדרג הנוכחי של הצוות שלך +1. קנה המידה שלו הוא תמיד אפס (1 אדם). המומחים שלך עולים באיכות כשהצוות שלך עולה בדרג.
- id: crew-creation-cohorts-edges-flaws
  name: יתרונות ופגמים
  description: |-
    כשאתה יוצר מקורב, תן לו **יתרון** אחד או שניים ומספר שווה של **פגמים**.

    **יתרונות**

    * **מאיים:** המקורב מטיל אימה במראהו ובמוניטין שלו.
    * **עצמאי:** אפשר לסמוך על המקורב שיקבל החלטות טובות ויפעל ביוזמתו שלו בהיעדר פקודות ישירות.
    * **נאמן:** אי אפשר לשחד את המקורב או להפוך אותו נגדך.
    * **עיקש:** המקורב לא יירתע ממשימה.

    **פגמים**

    * **בעל עקרונות:** למקורב יש אתיקה או ערכים שהוא לא יבגוד בהם.
    * **פראי:** המקורב אלים וחסר רחמים יתר על המידה.
    * **לא אמין:** המקורב לא תמיד זמין, בגלל התחייבויות אחרות, קהות חושים מיצריו וכדומה.
    * **פרוע:** המקורב שיכור, מופקר וצעקני.
