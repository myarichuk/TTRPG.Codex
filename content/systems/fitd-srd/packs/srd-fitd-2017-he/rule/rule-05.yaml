- id: crew-creation-cohorts-modifying-a-cohort
  name: שינוי מקורבים
  description: |-
    אתה יכול להוסיף **סוג נוסף** לכנופיה או למומחה אם תבזבז שני שדרוגי הצוות. כשמקורבים מבצעים פעולות שהסוגים שלהם חלים עליהן, הם משתמשים בדירוג האיכות המלא שלהם. אחרת, האיכות שלהם היא אפס. למקורבים יכולים להיות עד שני סוגים.
- id: crew-creation-cohorts-using-a-cohort
  name: שימוש במקורבים
  description: |-
    כשאתה שולח מקורבים להשיג מטרה, הטל את **האיכות** שלהם כדי לראות איך זה מסתיים. לחלופין, דמות שחקן יכולה לפקח על המהלך בכך שתוביל **פעולה קבוצתית**. אם אתה מכווין את המקורבים בפקודות, הטל **פיקוד**. אם אתה משתתף בפעולה לצד המקורבים, הטל את הפעולה המתאימה. איכות היריבים ביחס לאיכות המקורבים משפיעה על העמדה ועל ההשפעה של הפעולה.

    > צוות המוכרים של דמויות השחקנים רוצה לסלק כנופיה יריבה מהסמטה שבה הם מוכרים סמים. הם שולחים את כנופיית הבריונים שלהם לגרש את הפולשים. שה״מ מטיל 2d לאיכות הבריונים, ומקבל **3**. שעה אחר כך הבריונים חוזרים מוכים ומדממים. אחד מהם מסתכל בלחיים סמוקות: "החבר׳ה האלה קשוחים, בוס." (שה״מ גורם פציעה למקורבים, והם נכשלו במטרתם.)
    >
    > למחרת ראש הצוות חוזר ומוביל פעולה קבוצתית, ומטילה 3d ב**קטטה** לצד 2d של הבריונים. הפעם ראש הצוות מקבלת **6**: הם מרביצים לכנופיה השנייה מכות רצח ושולחים אותה לדרכה (לפחות לעת עתה).
- id: crew-creation-crew-creation-summary
  name: סיכום יצירת צוות
  description: |-
    **1** **בחר סוג צוות.** סוג הצוות קובע את מטרת הקבוצה, את היכולות המיוחדות שלה ואת דרך ההתקדמות שלה.

    אתה מתחיל ב**דרג 0**, עם **אחיזה חזקה** ו-0 **מוניטין**. אתה מתחיל עם 2 **מטבעות**.

    **2** **בחר מוניטין התחלתי ומאורה.** בחר איך פלגי העולם התחתון רואים אותך: *שאפתן—אכזרי—נועז—מכובד—מקצועי—ממולח—עדין—מוזר.* הסתכל במפה ובחר רובע שבו תמקם את המאורה. תאר את המאורה.

    **3** **קבע את שטחי הציד שלך.** הסתכל במפה ובחר רובע שבו תמקם את שטחי הציד שלך. החלט איך להתמודד עם הפלג שתובע את האזור.

    * שלם להם 1 **מטבעות**.
    * שלם להם 2 **מטבעות**. קבל **+1 מעמד**.
    * אל תשלם דבר. קבל **-1 מעמד**.

    **4** **בחר יכולת מיוחדת.** הן בעמודה האפורה שבאמצע דף הצוות. אם אינך מצליח להחליט, בחר את היכולת הראשונה ברשימה. היא ממוקמת שם כי היא אפשרות ראשונה טובה.

    **5** **הקצה שדרוגי צוות.** לצוות שלך יש שני שדרוגים שנבחרו מראש. בחר שניים נוספים. אם לצוות שלך יש מקורבים, פעל לפי ההליך ליצירתם. רשום את שינויי מעמד הפלגים בעקבות השדרוגים שלך:

    * פלג אחד עזר לך להשיג שדרוג. קבל **+1 מעמד** מולו. או שלם 1 **מטבעות** כדי לקבל **+2 מעמד** במקום זאת.
    * פלג אחד נפגע כשהשגת שדרוג. קבל **-2 מעמד** מולו. או שלם 1 **מטבעות** כדי לקבל **-1 מעמד** במקום זאת.

    **6** **בחר איש קשר מועדף.** סמן את מי שהוא חבר קרוב, בעל ברית ותיק או שותף לפשע. רשום את שינויי מעמד הפלגים הקשורים לאיש הקשר שלך:

    * פלג אחד ידידותי לאיש הקשר שלך. קבל **+1 מעמד** מולו.
    * פלג אחד עוין לאיש הקשר שלך. קבל **-1 מעמד** מולו.

    אם תרצה, אתה יכול להגביר את עוצמת היחסים של הפלגים עם איש הקשר שלך ולקבל **+2** ו-**-2 מעמד** במקום זאת.
- id: crew-creation-establish-your-hunting-grounds
  name: קביעת שטחי הציד שלך
  description: |-
    הצוות שלך חדש לגמרי, אבל כבר בחרת חלק קטן מרובע כ**שטחי הציד** שלך. זה האזור שבו אתה נוהג לבצע מבצעים, ואתה מכיר אותו היטב. שטחי הציד שלך לא חייבים להיות באותו רובע עם המאורה. האזור קטן, רק שלושה או ארבעה גושי בניינים, אבל זו עדיין פלישה לשטחו של מישהו. העיר כולה מחולקת בין פלגים גדולים וחזקים יותר. שליט המבוך יגיד לך איזה פלג תובע את האזור, ואז אתה מחליט איך להתמודד איתו:

    * שלם להם. תן להם 1 **מטבעות** בתמורה לכך שיפנו לך מקום לעבוד.
    * שלם לפלג 2 **מטבעות** כאות כבוד וקבל **+1 מעמד** מולו.
    * שמור על הכסף שלך וקבל **-1 מעמד** מול אותו פלג.

    שטחי הציד שלך מתאימים לסוג מסוים של מבצע פלילי. לכל סוג צוות יש רשימה של סוגי מבצעים לשטחי הציד שלו. למשל, לרוצחים שכירים יש *תאונה*, *היעלמות*, *רצח* או *כופר* כאפשרויות. בחר אחד מסוגי המבצעים האלה כהעדפה שלך.

    כשאתה מתכונן לבצע מבצע מהסוג המועדף עליך בשטחי הציד שלך, אתה מקבל **+1d** להטלות **איסוף מידע** ו**פעילות זמן פנוי** נוספת חינם שתתרום למבצע הזה. זה יכול לעזור לך לגלות הזדמנות, להשיג נכס שתצטרך למשימה, למצוא לקוח מתאים וכן הלאה.

    כשאתה משיג **שטח**, אתה מרחיב גם את גודלם ו/או סוגם של שטחי הציד שלך. פרט את האזור החדש ו/או את השיטות בעזרת שליט המבוך.
- id: crew-playbook
  name: פלייבוק הצוות
  description: |-
    **תיאור קצר של הצוות**

    אתם רוצחים מקצועיים. מוות הוא העסק שלכם.

    **הוסף טריגר לניסיון. כשאתה משחק בצוות הזה, אתה מרוויח ניסיון כשאתה מבצע בהצלחה מבצע מכמה סוגים מסוימים.** כמה דוגמאות: רצח, כופר, סחיטה בכוח, חבלה, אספקה או מכירה של סחורה, ריגול, גניבה, השגת סחורה אסורה או מקורות חדשים.

    *הוסף שאלות כדי להתאים את הצוות אישית. במה הצוות נבדל מצוותים דומים אחרים?*
- id: crew-playbook-contacts
  name: אנשי קשר
  description: |-
    רשימה של חמישה אנשי קשר אפשריים לצוות, עם תיאור של כל אחד. כמה אפשרויות: ראש כנופיה, מתווך עסקאות, אציל, צייד ראשים, סוחר, נפח, רופא, ראש רובע, בעל פונדק, אקדמאי, אוקולטיסט, שופט, חובב, חוקר דרכים, אספן, סוחר נשק, סוחר סמים, אנרכיסט או פועל נמל.

    שאלות יכולות לכלול איך אתה מכיר את החבר, מה הוא עשה בשבילך, מה אתה עושה בשבילו ואיזה סוג של יחסים יש ביניכם.
- id: crew-playbook-crew-special-abilities
  name: יכולות מיוחדות של הצוות
  description: |-
    צור שבע יכולות מיוחדות לצוות שלך. הנה כמה דוגמאות.
- id: crew-playbook-crew-upgrades
  name: שדרוגי הצוות
  description: |-
    רשימה של חמישה שדרוגים ייחודיים לצוות. כמה דוגמאות:
- id: crew-playbook-crew-upgrades-make-a-claim-map-for-the-crew
  name: מפת תביעות לצוות
  description: |-
    דוגמאות לתביעות:

    **שטח**: אתה צריך מוניטין אחד פחות כדי לעלות בדרג (מקס׳ 6).

    **רשומות העיר**: אתה מקבל **+1d** ל**הטלת הפתיחה** בתוכניות **התגנבות**. *אתה יכול להשתמש בשרטוטים ובמסמכים אחרים כדי לקבוע גישה טובה לחדירות.*

    **זהויות כיסוי**: אתה מקבל **+1d** ל**הטלת הפתיחה** בתוכניות **הונאה** ו**תוכניות חברתיות**. *זהויות בדויות עוזרות לבלבל את היריבים.*

    **מבצע כיסוי**: אתה מקבל **-2** **חום** לכל מבצע. *הכיסוי של עסק לגיטימי עוזר להסיט חלק מה**חום** מצד רשויות החוק.*

    **שליח**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים לקוחות ממעמד גבוה. *איש הקשר המקושר היטב הזה יעזור לסדר שלל טוב יותר מלקוחות עשירים.*

    **מתווך**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים לקוחות ממעמד נמוך. *הסוכן המכובד הזה יעזור לסדר שלל טוב יותר מלקוחות עניים יותר.*

    **מרפאה**: אתה מקבל **+1d** להטלות טיפול ריפוי. *במרפאה יש גם מיטות להחלמה ממושכת.*

    **מלשינים**: אתה מקבל **+1d** לאיסוף מידע לקראת מבצע. *העיניים והאוזניים שלך ברחובות תמיד מחפשות מטרות חדשות.*

    **סחיטת הגנה**: בכל רגע בזמן הפנוי, הטל קוביות כמספר הדרג שלך. אתה מרוויח **מטבעות** כתוצאה הגבוהה ביותר, פחות ה**חום** שלך. *חלק מהתושבים מפחדים ממך ישלמו בשמחה על "הגנה".*

    **חדרי אימון**: המקורבים שלך מסוג מסוים מקבלים **+1 קנה מידה**. *אימון נוסף מאפשר להם להילחם כמו כנופיה גדולה יותר.*

    **מאורת יצרים**: בכל רגע בזמן הפנוי, הטל קוביות כמספר הדרג שלך. אתה מרוויח **מטבעות** כתוצאה הגבוהה ביותר, פחות ה**חום** שלך.

    **גביעי קורבנות**: אתה מקבל **+1 מוניטין** לכל מבצע. *השמועה על ה"אוסף" המחריד שלך מתפשטת, והאומץ שלך מעלה את המוניטין שלך בעולם התחתון.*

    **בורות קרב**: בזמן הפנוי, הטל קוביות כמספר הדרג שלך. אתה מרוויח **מטבעות** כתוצאה הגבוהה ביותר, פחות ה**חום** שלך. *התושבים אוהבים להמר את המטבעות שהרוויחו בקושי על ספורט הדמים שאתה מארח.*

    **מקבל גנובות ברחוב**: אתה מקבל **+2** **מטבעות** בשלל ממבצעים שמערבים מטרות ממעמד נמוך. *מומחה יודע למצוא אוצר בתוך האשפה שאתה שודד מקורבנותיך העניים.*

    **אזרחים מבוהלים**: אתה מקבל **+2** **מטבעות** בשלל ממבצעים שמערבים קרב או סחיטה. *התושבים המפוחדים מביאים לך מס בכל פעם שאתה פוגע. הם לא רוצים להיות הבאים בתור.*

    **מחסנים**: אתה מקבל **+1d** להטלות **השגת נכס**. *יש לך מקום לאחסן את כל השלל שאתה צובר אחרי הקרבות. הוא יכול להועיל כשלעצמו או לשמש לסחר חליפין כשצריך.*

    **מזבח עתיק**: אתה מקבל **+1d** ל**הטלת הפתיחה** בתוכניות **אוקולטיות**. *ברכתו איתך.*

    **מגדל עתיק**: אתה מקבל **+1d** ל**היכרויות** עם ישויות מאגיות במקום.

    **קופת קורבנות**: אתה מקבל **+2** **מטבעות** בשלל ממבצעים שמערבים פעולות אוקולטיות. *התושבים המפוחדים מביאים לך מס כשאתה מקיים את הנהגים האפלים שלך. הם לא רוצים להיות הבאים בתור.*

    **שוחד מקומי**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים הפגנת כוח או חיי חברה. *כמה פקידי עיר חולקים כספי שוחד עם מי שמראים שהם שחקנים בזירה.*

    **תצפיתנים**: אתה מקבל **+1d** ל**ציד** או ל**סקירה** בשטח שלך.

    **מקום יוקרה**: **+1d** להטלות **היכרויות** ו**שכנוע** במקום. *משי, ציורים וקריסטל מרשימים את הלקוחות.*

    **מצבור עודפים**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים מכירה או אספקה של סחורה. *יש לך שפע סחורה, שממלא לך את הכיסים מדי פעם.*

    **נקודת מסירה סמויה**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים ריגול או חבלה. *נקודת חילופין נסתרת מושלמת שווה את המטבעות הנוספים ללקוחות בררנים.*

    **חדר חקירות**: אתה מקבל **+1d** ל**פיקוד** ול**שכנוע** במקום. *עסק מחריד, אבל יעיל.*

    **מקבל גנובות נאמן**: אתה מקבל **+2** **מטבעות** ב**שלל** ממבצעים שמערבים פריצה או שוד. *דרושים עין מיומנת וקשרים טובים כדי להפיץ סחורה גנובה.*

    **שבילים סודיים**: אתה מקבל **+1d** ל**הטלת הפתיחה** בתוכניות **התגנבות**. *אולי יש לך גישה לתעלות תת-קרקעיות נשכחות, למעברי גגות או לנתיב אחר לבחירתך.*

    **פונדק**: אתה מקבל **+1d** להטלות **היכרויות** ו**שכנוע** במקום. *קצת משקאות ושיחה ידידותית יכולים לעשות הרבה.*

    **עסק צד**: בכל רגע בזמן הפנוי, הטל קוביות כמספר הדרג שלך. אתה מרוויח **מטבעות** כתוצאה הגבוהה ביותר, פחות ה**חום** שלך. *איזה סוג של עסק לגיטימי זה? איך משלמים לך בסתר?*
- id: crew-playbook-favored-operations
  name: מבצעים מועדפים
  description: |-
    רשימה של סוגי מבצעים שהצוות יכול לבצע. כמה אפשרויות: רצח, כופר, סחיטה, חבלה, השגה, הקדשה, קורבן, מכירה, אספקה, הפגנת כוח, חיי חברה, פריצה, ריגול, שוד, הברחת נשק, הברחת סחורה אסורה או הברחת נוסעים.
- id: crew-playbook-starting-upgrades
  name: שדרוגים התחלתיים
  description: |-
    * שדרוג ראשון
    * שדרוג שני
- id: downtime
  name: זמן פנוי
  description: |-
    אחרי שהצוות מסיים מבצע (בהצלחה או בכישלון), הוא לוקח זמן להתאושש, להתארגן מחדש ולהתכונן למבצע הבא. שלב זה במשחק נקרא **זמן פנוי**.

    לזמן הפנוי יש שתי מטרות במשחק:

    * ראשית, זו הפסקה לשחקנים. במהלך הפעולה של המבצע דמויות השחקנים תמיד תחת איום, דוהרות ממכשול למכשול ברצף עתיר אנרגיה. הזמן הפנוי נותן להן רגע של הפוגה כדי לנשום ולהירגע מעט, להתמקד ברכיבים השקטים והנינוחים יותר של המשחק, ולחקור היבטים אישיים של הדמויות שלהן.
    * שנית, המעבר לשלב חדש במשחק מסמן מעבר בין המכניקות הדרושות. יש חוקים מיוחדים שמשמשים רק בשלב הזמן הפנוי, ולכן הם נשארים "מחוץ לדרך" בשאר חלקי המשחק. כשאנחנו עוברים לזמן פנוי, אנחנו שולפים ארגז כלים אחר ופותרים את הזמן הפנוי במונחים שלו, ואחר כך חוזרים לשלבים הממוקדים יותר בפעולה.

    הזמן הפנוי מחולק לארבעה חלקים, שנפתרים לפי הסדר:
    1. **שלל**. הצוות מקבל את הפרסים שלו ממבצע שהושלם בהצלחה.
    2. **חום**. הצוות צובר חשד ותשומת לב מצד החוק ומצד בעלי הכוח בעיר בעקבות המבצע האחרון שלו.
    3. **סבכים**. הצוות מתמודד עם צרות מצד הפלגים היריבים, מצד החוק ומצד העיר הרדופה עצמה.
    4. **פעילויות זמן פנוי**. דמויות השחקנים מתמסרות ליצרים שלהן כדי להפחית לחץ, עובדות על פרויקטים ארוכי טווח, מחלימות מפציעות וכן הלאה.

    אחרי שפעילויות הזמן הפנוי נפתרות, המשחק חוזר למשחק חופשי, והקבוצה יכולה להתקדם אל המבצע הבא שלה.
- id: downtime-activities
  name: פעילויות זמן פנוי
  description: |-
    בין מבצעים הצוות שלך מבלה בחופשיות, ודואג לצרכים אישיים ולפרויקטי צד. אלה נקראים **פעילויות זמן פנוי** (ראה את הרשימה למטה). בשלב הזמן הפנוי יש לכל דמות שחקן זמן ל**שתי פעילויות זמן פנוי**. *כשאתם במלחמה, יש לכל דמות שחקן זמן לאחת בלבד.*

    * השגת נכס
    * פרויקט ארוך טווח
    * החלמה
    * הפחתת חום
    * אימון
    * התמסרות ליצר

    אתה יכול לבחור באותה פעילות יותר מפעם אחת. אתה יכול לנסות רק פעולות שאתה בעמדה להשלים. אם פעילות תלויה בפעולה אחרת, פתור קודם את הפעולה ההיא.

    דמות שחקן יכולה לפנות זמן ליותר משתי פעילויות, תמורת מחיר. **כל פעילות נוספת מהרשימה עולה** **1** **מטבעות** או **1** **מוניטין**. זה משקף את הזמן ואת ניקוז המשאבים כשאתה "מחוץ לשעון" ולא מרוויח ממבצע. כשאתה משלים מבצע חדש, אתה מתאפס ומקבל שוב שתי פעילויות "חינם".

    הפעילויות ברשימת הזמן הפנוי מוגבלות; פעולות רגילות אינן מוגבלות. בזמן הפנוי אתה עדיין יכול ללכת למקומות, לעשות דברים, להטיל הטלות פעולה, לאסוף מידע, לשוחח עם דמויות אחרות וכן הלאה. במילים אחרות, רק פעילויות ש*ברשימה* מוגבלות.

    בכל פעילות זמן פנוי, קבל **+1d** להטלה אם **חבר** או **איש קשר** עוזר לך. אחרי ההטלה אתה יכול לבזבז **מטבעות** כדי לשפר את רמת התוצאה. **הגדל את רמת התוצאה באחת על כל **מטבעות** שמבזבזים.** כך שתוצאה של **1-3** הופכת ל-**4** או ל-**5**, תוצאה של **4/5** הופכת ל-**6**, ו-**6** הופך ל**הצלחה קריטית**.

    **שליט המבוך:** אם שחקן לא מצליח להחליט איזו פעילות זמן פנוי לבחור, הצע לו רעיון לפרויקט ארוך טווח. אתה יודע במה השחקן מתעניין ומה הוא אוהב. הצע פרויקט שיתקדם לכיוון מהנה עבורו.

    > "זוכר את החזון המוזר שהיה לך במזבח של האלים הנשכחים? כן, אתה רוצה להגיע לעומקו של העניין? בסדר, התחל פרויקט ארוך טווח, שישה מקטעים, בשם... 'אווירת אלים מוזרה'. מה אתה עושה כדי לעבוד על זה?"
- id: downtime-activities-acquire-asset
  name: השגת נכס
  description: |-
    השג שימוש זמני ב**נכס**:

    * **פריט** מיוחד אחד או סט של פריטים רגילים (מספיק לכנופיה בקנה המידה של הדרג שלך).
    * **מקורבים** (מומחה או כנופיה).
    * **רכב**.
    * **שירות**. הובלה מידי מבריח או נהג, שימוש במחסן לאחסון זמני, ייצוג משפטי וכן הלאה.

    "שימוש זמני" הוא תקופת שימוש משמעותית אחת שהגיונית לנכס, בדרך כלל משך מבצע אחד. אפשר גם להשיג נכס ל"המתנה" לשימוש בעתיד. למשל, אתה יכול לשכור כנופיה שתשמור על המאורה שלך, והיא תישאר עד אחרי הקרב הרציני הראשון, או עד שיעבור שבוע והיא תאבד עניין.

    כדי להשיג את הנכס, הטל את הדרג של הצוות. התוצאה קובעת את **האיכות** של הנכס שאתה מקבל, כשהדרג של הצוות הוא הבסיס. **1-3**: דרג -1, **4/5**: דרג, **6**: דרג +1, **הצלחה קריטית**: דרג +2. אתה יכול לבזבז **מטבעות** כדי להעלות את תוצאת ההטלה הזו מעבר ל**הצלחה קריטית**, בעלות של **2** **מטבעות** על כל דרג נוסף.

    שליט המבוך יכול לקבוע רמת **איכות מינימלית** שחובה להשיג כדי להשיג נכס מסוים. למשל, אם אתה רוצה להשיג סט מדים ומסכות של סוהרים, תצטרך להשיג נכס מדרג IV. תוצאה נמוכה יותר לא תספיק.

    אם אתה משיג את אותו נכס שוב, אתה מקבל **+1d** להטלה. אם אתה ממשיך להשיג מחדש נכס בכל פעם שמשתמשים בו, אתה למעשה יכול לשכור אותו ללא הגבלת זמן.

    תרכיבים אלכימיים, רעלים, פצצות ומתקנים מסוכנים מוגבלים מאוד. כשאתה משיג אחד מהפריטים האלה (במקום ליצור אותו בעצמך), אתה מקבל **+2** **חום**.

    אם אתה רוצה להשיג נכס באופן קבוע, אתה יכול לקבל אותו כשדרוג הצוות או לעבוד עליו כ**פרויקט ארוך טווח** כדי להקים השגה קבועה.

    > זמירה הלוחשת היא דו-קרבנית בסגנון האירווי, והיא רוצה להוסיף חרב משובחת לפריטים הקבועים שלה. השחקנית שלה פותחת פרויקט ארוך טווח: "להחזיר את חרב המשפחה שלי מחנות המשכון". שליט המבוך אומר שזה שעון של 8 (היא יכולה לעבוד עליו באמצעות **היכרויות** או **שכנוע** של בעל חנות המשכון, או אולי בהטלת רמת החיים שלה כדי לייצג תשלומים קטנים).
- id: downtime-activities-indulge-vice
  name: התמסרות ליצר
  description: |-
    בקר אצל **ספק היצר** שלך כדי להקל על **הלחץ**. ראה פרטים בסעיף הבא.
- id: downtime-activities-indulging-your-vice
  name: התמסרות ליצר שלך
  description: |-
    כשאתה מתמסר ליצר שלך, אתה מנקה מעט לחץ ממד הלחץ של הדמות שלך. ספר איך הדמות שלך מתמסרת ליצר שלה, כולל באיזה **ספק יצר** היא משתמשת כדי לספק את צרכיה. ההתמסרות הזו לוקחת זמן, ולכן אפשר לעשות אותה רק כשיש לצוות **זמן פנוי**. לחלופין, אתה יכול לבחור לשחרר את הדמות כך ש"תאבד את עצמה ביצר שלה" במהלך מפגש משחק, ולאפשר לה להתמסר מחוץ למצלמה בזמן שאתה משחק דמות שחקן אחרת. חבר כנופיה, חבר או איש קשר של הצוות יכולים להיווצר כדמות חלופית למשחק, וכך להעשיר את נוף דמויות השחקנים.

    אתה מטיל כדי לגלות כמה הקלה בלחץ הדמות שלך מקבלת. הטלת יצר היא כמו הטלת התנגדות בהיפוך: במקום לקבל רמות לחץ, אתה מנקה רמות לחץ. יעילות ההתמסרות שלך תלויה בדירוג התכונה הגרוע ביותר של הדמות שלך. התכונה החלשה ביותר שלה (**בינה**, **כושר** או **נחישות**) היא זו שנתונה ביותר לשליטת היצר.

    בצע **הטלת תכונה** באמצעות דירוג התכונה הנמוך ביותר של הדמות שלך (אם יש שוויון, זה בסדר, פשוט השתמש בדירוג הזה). **נקה לחץ כתוצאת הקובייה הגבוהה ביותר.**
- id: downtime-activities-indulging-your-vice-ignoring-your-vice
  name: התעלמות מהיצר שלך
  description: |-
    אם אינך מתמסר ליצר שלך בשלב זמן פנוי, או שאינך יכול, אתה מקבל לחץ כמספר ה**טראומות** שלך. אם אין לך **טראומה**, אתה חופשי להתעלם מהיצר שלך. אין לו אחיזה בך (עדיין).
