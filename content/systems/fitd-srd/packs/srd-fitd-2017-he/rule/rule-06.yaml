- id: downtime-activities-indulging-your-vice-overindulgence
  name: הגזמה ביצר
  description: |-
    אם הטלת היצר שלך מנקה יותר דרגות לחץ מכפי שסימנת, אתה מגזים. יצר אינו הרגל אמין שאפשר לשלוט בו. הוא סיכון, וכזה שיכול להניע את הדמות שלך לפעול נגד טובתה שלה.

    כשאתה מגזים, אתה מקבל החלטה גרועה בגלל היצר שלך, בעת השגתו או תחת השפעתו. כדי להביא את תוצאת ההחלטה הגרועה אל המשחק, בחר הגזמה מהרשימה:

    * **מושך צרות**. בחר או הטל **סבך** נוסף.
    * **התרברבות** במעלליך. **+2** **חום**.
    * **אבוד**. הדמות שלך נעלמת לכמה שבועות. שחק בדמות אחרת עד שהדמות הזו תחזור מהשתכרותה. כשהדמות חוזרת, היא גם החלימה מכל פציעה שהייתה לה.
    * **מנותק**. הספק הנוכחי שלך מפסיק לספק לך. מצא מקור חדש ליצר שלך.

- id: downtime-activities-indulging-your-vice-roleplaying-xp
  name: משחק תפקידים וניסיון
  description: |-
    יחד עם המורשת והרקע של הדמות שלך, היצר שלה מספר לנו איזה אדם היא. האובססיה הזו משפיעה על המניעים, המטרות וההתנהגות שלה. כשאתה חושב מה הדמות שלך עשויה לעשות או לומר בהמשך, תמיד אפשר להיעזר ביצר שלה כדי להגיע לרעיון. יתרון נוסף: כשאתה משחק לפי אופיו של היצר של הדמות, אתה מרוויח ניסיון בסוף המפגש.

- id: downtime-activities-long-term-project
  name: פרויקט ארוך טווח
  description: |-
    כשאתה עובד על פרויקט ארוך טווח (חדש לגמרי או קיים כבר), תאר מה הדמות שלך עושה כדי לקדם את שעון הפרויקט, והטל אחת מהפעולות שלך. סמן מקטעים בשעון לפי התוצאה: **1-3**: מקטע אחד, **4/5**: שני מקטעים, **6**: שלושה מקטעים, **הצלחה קריטית**: חמישה מקטעים.

    פרויקט ארוך טווח יכול לכלול מגוון רחב של פעילויות, כמו מחקר של טקס עלום, חקירת תעלומה, רכישת אמונו של מישהו, חיזור אחר חבר או איש קשר חדש, שינוי היצר של הדמות שלך, וכן הלאה.

    לפי מטרת הפרויקט, שה״מ יאמר לך אילו שעונים ליצור ויציע דרך שבה תוכל להתקדם.

    כדי לעבוד על פרויקט, ייתכן שתצטרך קודם להשיג את האמצעים לבצע אותו, וזה עשוי להיות פרויקט בפני עצמו. לדוגמה, אולי תרצה להתיידד עם חבר במועצת העיר, אבל אין לך שום קשר אליו. תוכל לעבוד קודם על פרויקט של **היכרויות** בחוגים שלו, כדי שתהיה לך הזדמנות לפגוש אחד מהם. אחרי שזה הושג, תוכל להתחיל פרויקט חדש כדי ליצור יחסי ידידות.

- id: downtime-activities-npc-faction-downtime
  name: זמן פנוי של דמויות שה״מ ושל פלגים
  description: |-
    גם דמויות שה״מ ופלגים עושים דברים כשלדמויות השחקנים יש זמן פנוי. שה״מ (שליט המבוך) **מקדם את שעוני הפרויקטים שלהם** ובוחר תמרון אחד או שניים לזמן פנוי לכל פלג שמעניין אותו כרגע. בחר כל תמרון שהגיוני שהפלג הזה יבצע. לדוגמה:

    * לתבוע תביעה או להגדיל אחיזה, להפוך אויב לפגיע, או להקטין את האחיזה של אויב פגיע.
    * לאסוף מידע על דמויות השחקנים (ייתכן שדמות שחקן תתנגד בהטלה) או על נושא אחר.
    * להשיג מטרה לטווח קצר שהם בעמדה להשיג.
    * לרכוש נכס חדש.
    * לדרוש טובה מפלג אחר.
    * להפעיל לחץ פוליטי או איומים כדי לכפות על מישהו את ידו.

    **שה״מ:** בחר תמרוני זמן פנוי וקדם שעונים לפלגים שמעניינים אותך כרגע. אל תדאג לשאר. מאוחר יותר, כשתפנה את תשומת לבך לפלג שהזנחת זמן מה, תן לו כמה שלבי זמן פנוי וכמה סימוני שעון פרויקט כדי "להשלים פערים" עם מה שקורה עכשיו.

    אם אינך בטוח עד כמה לקדם שעון של פלג, הטל הטלת מזל כשהדרג שלו הוא התכונה הבסיסית, והתאם אותה מעלה או מטה לפי ההתנגדות או הנסיבות. סמן מקטע 1 לתוצאה 1-3, 2 מקטעים לתוצאה 4/5, 3 מקטעים לתוצאה 6, או 5 מקטעים ל**הצלחה קריטית**.

    כשפלגים עושים דברים שידועים בעולם התחתון, **ספר לשחקנים על כך** דרך אחד מ**החברים** שלהם, מ**אנשי הקשר** שלהם או מ**ספקי היצר** שלהם. שמועות וקטעי רכילות כאלה יכולים להוביל למבצעים והזדמנויות עתידיים עבור דמויות השחקנים.

- id: downtime-activities-npc-faction-downtime-downtime-activities-summary
  name: סיכום פעולות זמן פנוי
  description: |-
    *הוסף ***+1d*** להטלה שלך אם ***חבר*** או ***איש קשר*** מסייע בפעולת הזמן הפנוי שלך.*

    #### רכישת נכס

    הטל את **דרג** הצוות. התוצאה מורה על *איכות* הנכס:

    * **הצלחה קריטית**: דרג +2.
    * **6**: דרג +1.
    * **4/5**: דרג.
    * **1-3**: דרג -1.

    *פריטים מסוימים דורשים תוצאת איכות מינימלית כדי לרכוש אותם. כדי להעלות את התוצאה מעבר לקריטית, אפשר להוציא **2 מטבעות** על כל +1 בונוס דרג.*

    #### פרויקט ארוך טווח

    עבוד על **פרויקט ארוך טווח**, אם יש לך האמצעים.

    סמן מקטעים בשעון לפי התוצאה:

    * **הצלחה קריטית**: חמישה סימונים.
    * **6**: שלושה סימונים.
    * **4/5**: שני סימונים.
    * **1-3**: סימון אחד.

    #### החלמה

    קבל **טיפול** כדי לסמן את **שעון הריפוי** שלך (כמו פרויקט ארוך טווח). *כשאתה ממלא שעון, כל פציעה יורדת ברמה אחת.*

    #### הורדת חום

    אמור איך אתה מפחית את ה**חום** על הצוות והטל את הפעולה שלך. הפחת **חום** לפי רמת התוצאה:

    * **הצלחה קריטית**: נקה חמישה **חום**.
    * **6**: נקה שלושה **חום**.
    * **4/5**: נקה שניים **חום**.
    * **1-3**: נקה **חום** אחד.

    #### אימון

    **סמן 1 ניסיון** (בתכונה או בפלייבוק שלך). הוסף **+1** ניסיון אם יש לך שדרוג הצוות המתאים. *אפשר לאמן מסלול ניסיון מסוים פעם אחת בלבד בכל זמן פנוי.*

    #### יצר

    בקר אצל **ספק היצר** שלך כדי להפיג **לחץ**. הטל מספר קוביות שווה ל**תכונה הנמוכה ביותר** שלך. נקה לחץ השווה לתוצאת הקובייה הגבוהה ביותר. אם אתה מנקה יותר דרגות לחץ מכפי שסימנת, אתה ***מגזים*** (ראה בהמשך). *אם אינך נוהג ביצר שלך בזמן הפנוי, או שאינך יכול, אתה לוקח לחץ השווה ל**טראומה** שלך.*

    ---

    **הגזמה**: קיבלת החלטה גרועה בגלל היצר שלך, בעת השגתו או תחת השפעתו. מה עשית?

    * **מושך צרות**: *אולי אויב עקב אחריך עד ספק היצר שלך ואתה הנחת לשמירה שלך לרדת.* בחר או הטל **סבך** נוסף.
    * **התרברבות**: אולי אתה מתרברב במעלליך. הצוות לוקח **+2 חום**.
    * **אבוד**: שחק בדמות אחרת עד שהדמות הזו תחזור מהשתכרותה.
    * **מנותק**: הספק הנוכחי שלך מפסיק לספק לך. מצא מקור חדש ליצר שלך.

- id: downtime-activities-recover
  name: החלמה
  description: |-
    כשאתה מחלים, אתה מבקש טיפול ומרפא את הפציעות שלך. אולי תבקר אצל רופא שיתפור את פצעיך וירגיע את נפשך במדע האנטומיה, או אצל מכשפה המתמחה בקמעות ריפוי ובאלכימיה מחזקת. אם אין לך איש קשר או דמות שחקן אחרת שיכולים לתת טיפול, אפשר להשתמש בפעולה **רכישת נכס** כדי לקבל גישה למרפא שיעניק שירות לצוות כולו.

    החלמה היא כמו פרויקט ארוך טווח. המרפא שלך מטיל (**טכנאות** לדמות שחקן עם היכולת המיוחדת **רופא**, או רמת **האיכות** של דמות שה״מ) ואז אתה מסמן מספר מקטעים ב**שעון הריפוי** שלך. **1-3**: מקטע אחד, **4/5**: שני מקטעים, **6**: שלושה מקטעים, **הצלחה קריטית**: חמישה מקטעים.

    כשאתה ממלא את שעון הריפוי, הורד כל פציעה בדף שלך ברמה אחת, ואז נקה את השעון. אם נותרו לך מקטעים לסמן, הם "עוברים הלאה".

    > לקרוס יש שתי פציעות: "רגל ימין מרוסקת" ברמה 3 ו"מוכה" ברמה 1. בזמן הפנוי הוא מקבל טיפול מקוולין, מכשפה שהיא חברה של ויספר מהצוות. קוולין מרפאת מוכשרת, ולכן שה״מ קובע שאיכות 2 הגיונית. השחקן מטיל 2d להחלמה ומקבל **6**: שלושה מקטעים בשעון הריפוי. הוא מחליט להוציא 1 **מטבע** כדי לשפר את התוצאה ל**הצלחה קריטית** ולקבל חמישה מקטעים במקום זאת. ארבעה מקטעים ממלאים את השעון: כל הפציעות של קרוס יורדות ברמה אחת, ואז הוא מנקה את השעון ומסמן עוד מקטע אחד. הפציעה שלו ברמה 3, "רגל ימין מרוסקת", יורדת לפציעה ברמה 2. הפציעה שלו ברמה 1, "מוכה", יורדת לאפס ונעלמת. נשארת לקרוס פציעה אחת בדף: "רגל שבורה" ברמה 2.

    אתה יכול לרפא את עצמך אם יש לך היכולת המיוחדת **רופא**, אבל אתה לוקח 2 לחץ כשאתה עושה זאת. אפשר גם לבחור פשוט להתאמץ ולנסות להחלים בלי טיפול כלשהו. במקרה כזה קח 1 לחץ והטל 0d.

    שים לב: הדמות המחלימה היא זו שנוקטת את פעולת ההחלמה. ריפוי של מישהו אחר אינו עולה למרפא פעולת זמן פנוי.

    בכל פעם שאתה סובל פציעה חדשה, נקה את כל הסימונים בשעון הריפוי שלך.

- id: downtime-activities-reduce-heat
  name: הורדת חום
  description: |-
    אמור מה הדמות שלך עושה כדי להפחית את רמת ה**חום** של הצוות, והטל הטלת פעולה. אולי תקיים **היכרויות** עם חברה שלך שהיא קצינה, והיא תסדר שכמה דוחות מפלילים של המשמר ייעלמו. או אולי תפעיל **פיקוד** על פחדם של תושבי המקום, כך שיחששו להלשין.

    הפחת **חום** לפי התוצאה: **1-3**: אחד, **4/5**: שניים, **6**: שלושה, **הצלחה קריטית**: חמישה.

- id: downtime-activities-stress-relief
  name: הפגת לחץ
  description: |-
    הדמויות שלך הן אנשים מיוחדים. הן מתריסות נגד בעלי הכוח ומעזות לטרוף את מי שנחשבים לעליונים עליהן. הן דוחפות את עצמן רחוק יותר מכפי שאנשים רגילים מוכנים ללכת. אבל זה כרוך במחיר. חייהן הם חיים של לחץ מתמיד. בלית ברירה, כל אחת מהן פונה לפיתוי של **יצר** כדי להתמודד.

    היצר של דמות הוא האובססיה שלה. אבל יחד עם ההתמכרות הזו מגיעה הפגת לחץ והיכולת לעמוד שוב באתגר המכריע של חייה הנועזים.

- id: downtime-activities-train
  name: אימון
  description: כשאתה מקדיש זמן לאימון, **סמן 1 ניסיון** במסלול הניסיון להתקדמות ב**תכונה** או ב**פלייבוק**. אם נפתח שדרוג האימון המתאים של הצוות, סמן **+1 ניסיון** (2 בסך הכול). ראה **שדרוגי הצוות** למידע נוסף. *אפשר לאמן מסלול ניסיון מסוים פעם אחת בלבד בכל זמן פנוי.*

- id: downtime-activities-vice-roll
  name: הטלת יצר
  description: |-
    ⏣ הטל מספר קוביות שווה לדירוג **התכונה הנמוכה ביותר** שלך.

    נקה לחץ השווה לתוצאת הקובייה הגבוהה ביותר. אם אתה מנקה יותר דרגות לחץ מכפי שסימנת, אתה ***מגזים***. *אם אינך נוהג ביצר שלך בזמן הפנוי, או שאינך יכול, אתה לוקח לחץ השווה ל**טראומה** שלך.*

- id: effect
  name: השפעה
  description: |-
    ב*Blades in the Dark* אתה משיג מטרות באמצעות פעולות ובהתמודדות עם תוצאות. אבל כמה פעולות נדרשות כדי להשיג מטרה מסוימת? זה תלוי ב**רמת ההשפעה** של הפעולות שלך. שה״מ שופט את רמת ההשפעה לפי הפרופילים שלהלן. איזה מהם מתאים ביותר לפעולה הנוכחית: **גדולה**, **רגילה** או **מוגבלת**? כל רמת השפעה מצביעה על השאלות שיש לענות עליהן בהשפעה הזו, ועל מספר המקטעים לסימון אם אתה משתמש ב**שעון התקדמות**.

    | רמות השפעה |                                                                                                                  | סימונים |
    | ------------: | :--------------------------------------------------------------------------------------------------------------- | :---: |
    |     **גדולה** | *אתה משיג יותר מהרגיל. איך המאמץ הנוסף מתבטא? מאיזה יתרון נוסף אתה נהנה?*         |   3   |
    |  **רגילה** | *אתה משיג את מה שנצפה ממנו כ"רגיל" בפעולה הזו. האם זה מספיק, או שנשאר עוד מה לעשות?*        |   2   |
    |   **מוגבלת** | *אתה משיג השפעה חלקית או חלשה. איך ההשפעה שלך מצטמצמת? איזה מאמץ נשאר כדי להשיג את המטרה?* |   1   |

- id: effect-assessing-factors
  name: הערכת גורמים
  description: 'כדי להעריך את רמת ההשפעה, התחל מתחושת בטן לפי המצב. אחר כך, אם צריך, העריך שלושה גורמים שעשויים לשנות את רמת ההשפעה: **עוצמה**, **היקף** ו**איכות**. אם לדמות השחקן יש יתרון בגורם מסוים, שקול רמת השפעה גבוהה יותר. אם יש לה חיסרון, שקול רמת השפעה מופחתת.'

- id: effect-assessing-factors-potency
  name: עוצמה
  description: גורם העוצמה מביא בחשבון חולשות מסוימות, השקעת זמן נוסף או נטילת סיכון גדול יותר, או את השפעת כוחות עלומים. מתגנב נחשב עוצמתי יותר אם כל האורות כבויים והוא נע בחושך.

- id: effect-assessing-factors-quality-tier
  name: איכות/דרג
  description: |-
    איכות מייצגת את יעילותם של כלים, כלי נשק או משאבים אחרים, ובדרך כלל היא מסוכמת בדרג. **פריטים משובחים** נחשבים כבונוס של +1 באיכות, ומצטברים עם הדרג.

    *ת'ורן פורצת את המנעול של מקום מסתור בבעלות כנופיה הידועה בעיסוקיה העלומים. הצוות שלה הוא דרג I ויש לה כלי פריצה משובחים, ולכן היא בפועל דרג II. הכנופיה העלומה היא דרג III. ת'ורן נחותה באיכות, ולכן ההשפעה שלה על המנעול תהיה מוגבלת.*

- id: effect-assessing-factors-scale
  name: היקף
  description: |-
    היקף מייצג את מספר היריבים, גודל השטח המכוסה, תחום ההשפעה וכדומה. היקף גדול יותר יכול להיות יתרון או חיסרון, לפי המצב. בקרב, יותר אנשים זה טוב יותר. בחדירה חשאית, יותר אנשים הם מכשול.

    כשמביאים בחשבון גורמים, רמת ההשפעה עשויה לרדת מתחת למוגבלת ולהגיע ל**השפעה אפסית**, או לעלות מעבר לגדולה ולהגיע ל**השפעת קיצון**.

    אם יכולת מיוחדת של דמות שחקן נותנת "+1 השפעה", היא נכנסת לתוקף *אחרי* ששה״מ העריך את רמת ההשפעה. לדוגמה, אם הגעת להשפעה אפסית, בונוס ה-+1 השפעה מהיכולת **שומר ראש** של הקאטר יעלה אותו להשפעה מוגבלת.

    זכור גם שדמות שחקן יכולה **להתאמץ יותר** (לקחת 2 לחץ) כדי לקבל +1 השפעה בפעולה שלה.

    לא כל גורם יחול בכל מצב. גם אין צורך בחשבון מדויק בכל פעם. השתמש בגורמים כדי לגבש שיקול דעת חזק יותר, ואל תרגיש מחויב אליהם.

- id: effect-consequences
  name: תוצאות
  description: כשדמות שחקן סובלת השפעה מצד אויב או ממצב מסוכן, זה נקרא **תוצאה**. תוצאות הן הצד השני של ההשפעות. לדמויות השחקנים יש השפעה על העולם סביבן, והן סובלות תוצאות בתמורה בגלל הסיכונים שהן ניצבות בפניהם.

- id: effect-trading-position-for-effect
  name: החלפת עמדה בהשפעה
  description: |-
    אחרי שהגורמים נשקלו ושה״מ הכריז על רמת ההשפעה, ייתכן ששחקן ירצה להחליף עמדה בהשפעה, או להפך. לדוגמה, אם הוא עומד להטיל הטלה מסוכנת בהשפעה רגילה (התרחיש הנפוץ ביותר, בדרך כלל), הוא עשוי לרצות במקום זאת לנסות את מזלו ולהטיל הטלה נואשת אבל בהשפעה גדולה.

    החלפה כזו אינה כלולה בגורמי ההשפעה כי היא אינה מרכיב ששה״מ צריך להעריך כשהוא קובע את רמת ההשפעה. אבל אחרי שהרמה נקבעה, תמיד אפשר להציע לשחקן את ההחלפה אם היא הגיונית במצב.

    *"אני מתגנב על פני החצר וקופץ מעל החומה, מתחבא בצללים ליד מזח התעלה והגונדולה."*

    *"אני לא חושב שתצליח לחצות בריצה מהירה אחת. היקף החצר הוא גורם כאן, ולכן ההשפעה שלך תהיה מוגבלת. נניח שאתה מגיע עד אמצע החצר בפעולה הזו, ואז תצטרך להתגנב דרך החצי השני של המרחב (ודרך שאר השומרים שם) כדי להגיע לצד השני."*

    *"לא הבנתי שזה רחוק כל כך. הממ. טוב, מה אם אני פשוט רץ הכי מהר שאני יכול. אפשר להגיע עד הסוף אם אני מטיל הטלה נואשת?"*

    *"כן, נשמע לי טוב!"*
