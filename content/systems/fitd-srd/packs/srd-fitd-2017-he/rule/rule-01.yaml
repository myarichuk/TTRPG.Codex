- id: action-roll
  name: הטלת פעולה
  description: |-
    כשדמות שחקן עושה משהו מאתגר, אנחנו מטילים **הטלת פעולה** כדי לראות איך זה יסתיים. פעולה היא מאתגרת אם יש בדרך למטרת הדמות מכשול שהוא מסוכן או בעייתי בצורה כלשהי. אנחנו לא מטילים הטלת פעולה אלא אם הדמות עומדת במבחן. אם הפעולה היא משהו שאנחנו מצפים שהדמות פשוט תשלים, אין צורך בהטלת פעולה.

    *לכל קבוצת משחק יהיו רעיונות משלה לגבי המשמעות של ״מאתגר״. זה טוב! כך נקבעים הטון והסגנון של סדרת ה-Blades שלכם.*

    כדי לבצע הטלת פעולה אנחנו עוברים שישה שלבים. במשחק עצמו הם זורמים זה לתוך זה, אבל כאן נפרק כל אחד מהם לשם בהירות.

    * השחקן מצהיר על **מטרת** הפעולה.
    * השחקן בוחר את **דירוג הפעולה**.
    * שה״מ קובע את **העמדה** של ההטלה.
    * שה״מ קובע את **רמת ההשפעה** של הפעולה.
    * מוסיפים **קוביות בונוס**.
    * השחקן מטיל את הקוביות ואנחנו שופטים את התוצאה.
- id: action-roll-1-the-player-states-their-goal
  name: "1. השחקן מצהיר על מטרתו"
  description: |-
    המטרה שלך היא התוצאה הממשית שהדמות שלך תשיג כשתתגבר על המכשול העומד בפניה. בדרך כלל מטרת הדמות ברורה מההקשר, אבל כשצריך, תפקידו של שה״מ לשאול ולהבהיר אותה.

    *״אתה מכה אותו בפנים, נכון? בסדר... מה אתה רוצה להשיג מזה? אתה רוצה להוציא אותו מהמשחק, או רק לסדר אותו קצת כדי שיעשה מה שאתה רוצה?״*
- id: action-roll-2-the-player-chooses-the-action-rating
  name: "2. השחקן בוחר את דירוג הפעולה"
  description: |-
    השחקן בוחר איזה **דירוג פעולה** להטיל, בהתאם למה שהדמות שלו עושה בסצנה. אם אתה רוצה להטיל את פעולת **קטטה** שלך, היכנס לקרב. אם אתה רוצה להטיל את פעולת **פיקוד** שלך, תן פקודות למישהו. אי אפשר להטיל דירוג של פעולה מסוימת אלא אם הדמות שלך מבצעת אותה כרגע בתוך הסיפור.
- id: action-roll-3-the-gm-sets-the-position
  name: "3. שה״מ קובע את העמדה"
  description: |-
    אחרי שהשחקן בוחר את הפעולה שלו, שה״מ קובע את **העמדה** של ההטלה. העמדה מייצגת עד כמה הפעולה עלולה להיות מסוכנת או בעייתית. יש שלוש עמדות: **מבוקרת**, **מסוכנת** ו**נואשת**. כדי לבחור עמדה, שה״מ בוחן את תיאורי העמדות שלהלן ובוחר את זו שמתאימה ביותר למצב שלפניו.

    **כברירת מחדל, הטלת פעולה היא מסוכנת.** לא היית מטיל אם לא היה כרוך בכך סיכון. אם המצב נראה מסוכן יותר, הפוך אותה לנואשת. אם הוא נראה פחות מסוכן, הפוך אותה למבוקרת.
- id: action-roll-4-the-gm-sets-the-effect-level
  name: "4. שה״מ קובע את רמת ההשפעה"
  description: |-
    שה״מ מעריך את **רמת ההשפעה** הסבירה של הפעולה, בהתחשב בגורמי המצב. בעיקרון, רמת ההשפעה אומרת לנו ״כמה״ הפעולה הזאת יכולה להשיג: האם תהיה לה השפעה **מוגבלת**, **רגילה** או **גדולה**?

    *בחירות שה״מ לגבי רמת ההשפעה והעמדה יכולות להיות מושפעות מאוד מבחירת דירוג הפעולה של השחקן. אם שחקן רוצה לנסות להכיר חבר חדש באמצעות **הרס** של משהו... ובכן, אולי זה אפשרי, אבל לא יהיה מופרך שה״מ יאמר שזו הטלה נואשת ושההשפעה כנראה מוגבלת. נראה ש**היכרויות** מתאימה לזה הרבה יותר. השחקנים חופשיים תמיד לבחור את הפעולה שהם מבצעים, אבל זה לא אומר שכל הפעולות צריכות להיות מסוכנות או חזקות באותה מידה.*
- id: action-roll-5-add-bonus-dice
  name: "5. הוספת קוביות בונוס"
  description: |-
    בדרך כלל אפשר לקבל שתי קוביות בונוס להטלת הפעולה שלך (יכולות מיוחדות מסוימות עשויות להעניק לך קוביות בונוס נוספות).

    עבור קובייה אחת, אפשר לקבל **סיוע** מחבר צוות. הוא לוקח 1 נקודת לחץ, אומר איך הוא עוזר לך, ונותן לך +1d.

    עבור קובייה נוספת, אתה יכול **להתאמץ יותר** (לקחת 2 נקודות לחץ) או לקבל **עסקת שטן** (אי אפשר לקבל קוביות בשני המקרים, זה האחד או השני).
- id: action-roll-5-add-bonus-dice-the-devils-bargain
  name: עסקת השטן
  description: |-
    דמויות השחקנים ב-*Blades* הן נוכלים פזיזים הכורעים תחת יצרים הרסניים, והן לא תמיד פועלות לטובתן. כדי לשקף זאת, שה״מ או כל שחקן אחר יכולים להציע לך קובייה נוספת אם תקבל עסקת שטן. עסקאות שטן נפוצות כוללות:

    * נזק צדדי, פגיעה לא מכוונת.
    * הקרבת **מטבעות** או פריט.
    * בגידה בחבר או באדם אהוב.
    * פגיעה ברגשות של פלג או הכעסתו.
    * פתיחה ו/או קידום של שעון בעייתי.
    * הוספת **חום** לצוות בגלל ראיות או עדים.
    * סבל מפציעה.

    עסקת השטן מתרחשת בלי קשר לתוצאת ההטלה. אתה סוגר את העסקה, משלם את המחיר ומקבל את קובייה הנוספת.

    עסקת השטן היא תמיד בחירה חופשית. אם אחת מהן לא מוצאת חן בעיניך, פשוט דחה אותה (או הצע איך לשנות אותה כדי שתשקול לקבל אותה). תמיד אפשר פשוט להתאמץ יותר כדי לקבל את הקובייה הזאת.

    אם יש צורך, לשה״מ יש את המילה האחרונה לגבי אילו עסקאות שטן תקפות.
- id: action-roll-6-roll-the-dice-and-judge-the-result
  name: "6. מטילים את הקוביות ושופטים את התוצאה"
  description: |-
    אחרי שנקבעו המטרה, דירוג הפעולה, העמדה וההשפעה, מוסיפים קוביות בונוס ומטילים את מאגר הקוביות כדי לקבוע את התוצאה. (את קבוצות התוצאות האפשריות, לפי עמדה, תמצא בסעיפים הבאים.)

    הטלת הפעולה עושה בשבילך עבודה רבה. היא אומרת לך עד כמה הדמות מבצעת את הפעולה היטב ועד כמה חמורות התוצאות שלה. הדמות עשויה להצליח בפעולה בלי שום תוצאות (ב-**6**), או להצליח אבל לסבול מתוצאות (ב-**4/5**), או שהכול פשוט ישתבש (ב-**1-3**).

    ב-**1-3**, שה״מ מחליט אם לפעולת הדמות יש השפעה כלשהי, או אם היא בכלל מתרחשת. בדרך כלל הפעולה פשוט נכשלת לגמרי, אבל בנסיבות מסוימות יכול להיות הגיוני או מעניין יותר שתהיה לפעולה השפעה כלשהי גם בתוצאה של **1-3**.

    בכל אחת מתוצאות **4/5** ו-**1-3** מופיעות **תוצאות** מוצעות עבור הדמות. ככל שהעמדה שלך גרועה יותר, כך התוצאות חמורות יותר. שה״מ יכול להטיל תוצאה אחת או יותר מאלה, בהתאם לנסיבות הטלת הפעולה. לדמויות השחקנים יש היכולת להימנע מתוצאות שהן סובלות מהן או להפחית את חומרתן באמצעות **התנגדות**.

    כשאתה מספר את הפעולה אחרי ההטלה, שה״מ והשחקן משתפים פעולה כדי לומר מה קורה על המסך. *ספר לנו איך אתה קופץ אל הגג השני. ספר לנו מה אתה אומר למפקחת כדי לשכנע אותה. שה״מ יספר לנו איך היא מגיבה. כשאתה מתמודד עם הלוחם של האבנט האדום, איך נראה סגנון הלחימה שלך? וכן הלאה.*
- id: action-roll-action-roll-summary
  name: סיכום הטלת פעולה
  description: |-
    * שחקן או שה״מ קוראים להטלה. בצע **הטלת פעולה** כשהדמות מבצעת פעולה מסוכנת או בעייתית.
    * השחקן בוחר את **דירוג הפעולה** להטלה. בחר את הפעולה שמתאימה למה שהדמות עושה בסיפור.
    * שה״מ קובע את **העמדה** ואת **רמת ההשפעה** של הפעולה. בחירת העמדה וההשפעה מושפעת מאוד מבחירת הפעולה של השחקן.
    * מוסיפים עד שתי קוביות בונוס. 1) **סיוע** מחבר צוות. 2) **להתאמץ יותר** (לקחת 2 נקודות לחץ) או לקבל **עסקת שטן**.
    * מטילים את מאגר הקוביות ושופטים את התוצאה. השחקנים ושה״מ מספרים את הפעולה יחד. לשה״מ יש את המילה האחרונה לגבי מה שקורה, והוא מטיל תוצאות כנדרש לפי העמדה ותוצאת ההטלה.
- id: action-roll-action-roll-summary-action-roll
  name: הטלת פעולה
  description: |-
    ⏣ **1d** על כל נקודה בדירוג **הפעולה**.

    ⊕ **+1d** אם יש לך **סיוע**.

    ⊕ **+1d** אם אתה **מתאמץ יותר** -או- מקבל **עסקת שטן**.

    #### מבוקרת

    *אתה פועל בתנאים שלך. אתה מנצל יתרון מכריע.*

    * **קריטי**: אתה מצליח עם **השפעה מוגברת**.
    * **6**: אתה מצליח.
    * **4/5**: אתה מהסס.
        - נסוג ונסה גישה אחרת, או
        - אחרת, אתה מצליח עם תוצאה קלה: מתרחש **סיבוך קל**, ההשפעה שלך **מופחתת**, אתה סובל מ**פציעה קלה יותר**, אתה מוצא את עצמך בעמדה **מסוכנת**.
    * **1-3**: אתה מועד.
        - התעקש וגם נצל הזדמנות **מסוכנת**, או
        - נסוג ונסה גישה אחרת.

    #### מסוכנת

    *אתה מתעמת חזיתית. אתה פועל תחת אש. אתה לוקח סיכון.*

    * **קריטי**: אתה מצליח עם **השפעה מוגברת**.
    * **6**: אתה מצליח.
    * **4/5**: אתה מצליח, אבל יש תוצאה: אתה סובל מ**פציעה**, מתרחש **סיבוך**, ההשפעה שלך **מופחתת**, אתה מוצא את עצמך בעמדה **נואשת**.
    * **1-3**: העניינים מידרדרים. אתה סובל מ**פציעה**, מתרחש **סיבוך**, אתה מוצא את עצמך בעמדה **נואשת**, אתה **מאבד את ההזדמנות הזאת**.

    #### נואשת

    *אתה חורג מיכולותיך. אתה בצרות רציניות.*

    * **קריטי**: אתה מצליח עם **השפעה מוגברת**.
    * **6**: אתה מצליח.
    * **4/5**: אתה מצליח, אבל יש תוצאה: אתה סובל מ**פציעה קשה**, מתרחש **סיבוך חמור**, ההשפעה שלך **מופחתת**.
    * **1-3**: זו התוצאה הגרועה ביותר. אתה סובל מ**פציעה קשה**, מתרחש **סיבוך חמור**, אתה **מאבד את ההזדמנות הזאת** לפעולה.
- id: action-roll-double-duty-rolls
  name: הטלות בעלות תפקיד כפול
  description: |-
    מכיוון שדמויות שאינן שחקנים לא מטילות עבור הפעולות שלהן, הטלת פעולה ממלאת שני תפקידים: **היא קובעת את תוצאת הפעולה של דמות השחקן ושל כל דמות שאינה שחקן המעורבת בה**. הטלה אחת אומרת לנו איך הפעולות האלה משפיעות זו על זו ואילו תוצאות נובעות מכך. ב-**6**, דמות השחקן מנצחת וההשפעה שלה מתממשת. ב-**4/5**, זו תוצאה מעורבת: גם דמות השחקן וגם הדמות שאינה שחקן משיגות את ההשפעה שלהן. ב-**1-3**, הדמות שאינה שחקן מנצחת וההשפעה שלה מתממשת כתוצאה על דמות השחקן.
- id: actions-attributes-action-ratings
  name: דירוגי פעולה
  description: |-
    במשחק יש 12 **פעולות** שדמויות השחקנים משתמשות בהן כדי להתגבר על מכשולים.

    * התאמה
    * פיקוד
    * היכרויות
    * עדינות
    * ציד
    * התגנבות
    * קטטה
    * עיון
    * סקירה
    * שכנוע
    * טכנאות
    * הרס

    לכל פעולה יש דירוג (מאפס עד 4) שאומר לך כמה קוביות להטיל כשאתה מבצע את הפעולה הזאת. דירוגי פעולה אינם מייצגים רק מיומנות או הכשרה, ואתה חופשי לתאר *איך* הדמות שלך מבצעת את הפעולה בהתאם לאופי שלה. אולי הדמות שלך טובה ב**פיקוד** כי יש בה שקט מפחיד, ודמות אחרת מטיחה פקודות ומאיימת על אנשים בנוכחות צבאית שלה.

    אתה בוחר איזו פעולה לבצע כדי להתגבר על מכשול, על ידי תיאור מה שהדמות שלך עושה. פעולות שמתאימות פחות למצב עשויות להיות פחות יעילות ועשויות להעמיד את הדמות בסכנה גדולה יותר, אבל עדיין אפשר לנסות אותן. בדרך כלל, כשאתה מבצע פעולה, תבצע **הטלת פעולה** כדי לראות איך זה יסתיים.
- id: actions-attributes-action-roll
  name: הטלת פעולה
  description: |-
    אתה מבצע **הטלת פעולה** כשהדמות שלך עושה משהו שעלול להיות מסוכן או בעייתי. התוצאות האפשריות של הטלת הפעולה תלויות ב**עמדה** של הדמות שלך. יש שלוש עמדות: **מבוקרת**, **מסוכנת** ו**נואשת**. אם אתה בעמדה **מבוקרת**, התוצאות האפשריות פחות חמורות. אם אתה בעמדה **נואשת**, התוצאות עלולות להיות קשות. אם אתה איפשהו באמצע, העמדה **מסוכנת**, שנחשבת בדרך כלל לעמדת ״ברירת המחדל״ של רוב הפעולות.

    אם אין סכנה או בעיה באופק, אתה לא מבצע הטלת פעולה. ייתכן שתבצע הטלת **מזל** או הטלת **זמן פנוי**, או ששה״מ פשוט יגיד כן, ואתה משיג את מטרתך.
- id: actions-attributes-actions
  name: פעולות
  description: |-
    כפי שאתה רואה, פעולות רבות חופפות לאחרות. זה בכוונה. כשחקן, אתה בוחר איזו פעולה להטיל, על ידי אמירה של מה הדמות שלך עושה. אפשר לנסות **הרס** על מישהו באמצע קרב? בטח! שה״מ אומר לך מה העמדה ורמת ההשפעה של הפעולה שלך בנסיבות האלה. כפי שנאמר, **קטטה** *עשויה* להיות טובה יותר (פחות מסוכנת או יעילה יותר), בהתאם למצב (לפעמים היא לא תהיה טובה יותר).
- id: actions-attributes-attribute-ratings
  name: דירוגי תכונה
  description: |-
    במערכת המשחק יש שלוש **תכונות** שדמויות השחקנים משתמשות בהן כדי להתנגד לתוצאות רעות: **בינה**, **כושר** ו**נחישות**. לכל תכונה יש דירוג (מאפס עד 4) שאומר לך כמה קוביות להטיל כשאתה משתמש בתכונה הזאת.

    דירוג כל תכונה שווה למספר הנקודות ב**עמודה הראשונה** שמתחת לתכונה (ראה את הדוגמאות, מימין). ככל שהדמות שלך מאוזנת יותר בקבוצת פעולות מסוימת, כך דירוג התכונה שלה גבוה יותר.
- id: actions-attributes-resistance-roll
  name: הטלת התנגדות
  description: |-
    כל תכונה מתנגדת לסוג אחר של סכנה. אם דוקרים אותך, למשל, אתה מתנגד לפציעה הגופנית באמצעות דירוג **הכושר** שלך. הטלות התנגדות תמיד מצליחות, כלומר אתה מקטין או מסיט את התוצאה הרעה, אבל ככל שההטלה שלך טובה יותר, כך היא עולה פחות **לחץ** כדי להפחית את הסכנה או להימנע ממנה.

    כשלאויב יש יתרון גדול, תצטרך לבצע הטלת התנגדות לפני שתוכל לבצע פעולה משלך. לדוגמה, כשאתה מתמודד עם לוחם חרב מומחה, היא מפילה את חרבך מידך לפני שתוכל לתקוף. אתה צריך לבצע הטלת התנגדות כדי לשמור על אחיזה בלהב שלך אם אתה רוצה לתקוף אותה. או שאולי אתה עומד מול רוח רפאים עוצמתית ומנסה **להתאים** את עצמך אליה כדי לשלוט בפעולותיה. אבל לפני שתוכל לבצע הטלה משלך, עליך להתנגד להשתלטות של הרוח.

    שה״מ שופט את רמת האיום של האויבים ומשתמש בהטלות התנגדות ״מקדימות״ אלה לפי הצורך כדי לשקף את יכולותיהם של יריבים מסוכנים במיוחד.
- id: actions-attributes-resistance-roll-example-action-attribute-ratings
  name: דוגמאות לדירוגי פעולה ותכונה
  description: |-
    #### **בינה**

    | פעולה | דירוג |
    | :-- | :-- |
    | **ציד** | ●○○○ |
    | **עיון** | ○○○○ |
    | **סקירה** | ○○○○ |
    | **טכנאות** | ○○○○ |

    לדמות הזאת יש דירוג פעולה של 1 ב**ציד**. דירוג תכונת **הבינה** שלה הוא 1 (העמודה הראשונה של הנקודות).

    #### **כושר**

    | פעולה | דירוג |
    | :-- | :-- |
    | **עדינות** | ○○○○ |
    | **התגנבות** | ●○○○ |
    | **קטטה** | ●●○○ |
    | **הרס** | ○○○○ |

    יש לה גם **התגנבות** 1 ו**קטטה** 2. דירוג תכונת **הכושר** שלה הוא 2.

    #### **נחישות**

    | פעולה | דירוג |
    | :-- | :-- |
    | **התאמה** | ●●○○ |
    | **פיקוד** | ●○○○ |
    | **היכרויות** | ○○○○ |
    | **שכנוע** | ●○○○ |
