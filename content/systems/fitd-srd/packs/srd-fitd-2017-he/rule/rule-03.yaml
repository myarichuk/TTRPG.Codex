- id: character-playbook-short-descriptor-of-character
  name: תיאור קצר של הדמות
  description: |-
    כאן בא תיאור באורך בינוני של הדמות. ציין באילו פעילויות היא עוסקת בדרך כלל.

    **כאן יש לכלול את מקורות הניסיון של הדמויות.** בסוף המפגש סמן ניסיון אם התמודדת עם אתגר באמצעות: כאן מוסיפים רשימה קצרה של שיטות או פעולות. דוגמאות אפשריות: אלימות, כפייה, ידע, קסם אישי, תעוזה, חישוב, הונאה, השפעה, התגנבות, התחמקות, מיומנות טכנית, כאוס, מעקב או כוחות אוקולטיים.
- id: character-playbook-short-descriptor-of-character-starting-actions
  name: פעולות פתיחה
  description: |-
    |      |     |          |          |          |                  |
    | :------: | --- | :------: | :------: | :------: | :--------------- |
    | ● |     | ● | ○ | ○ | פעולה ראשית   |
    | ● |     | ○ | ○ | ○ | פעולה משנית |
- id: character-playbook-special-abilities
  name: יכולות מיוחדות
  description: בחר שבע יכולות מיוחדות לפלייבוק שלך. הנה כמה דוגמאות.
- id: character-playbook-starting-builds
  name: מבני פתיחה
  description: |-
    *אם אתה רוצה הכוונה בחלוקת ארבע נקודות הפעולה ההתחלתיות וביכולת המיוחדת, השתמש באחת מהתבניות האלה.*

    **דוגמה 1.** 4 נקודות פעולה מחולקות ועוד יכולת מיוחדת

    **דוגמה 2.** 4 נקודות פעולה מחולקות ועוד יכולת מיוחדת

    **דוגמה 3.** 4 נקודות פעולה מחולקות ועוד יכולת מיוחדת

    **דוגמה 4.** 4 נקודות פעולה מחולקות ועוד יכולת מיוחדת
- id: characters-characters
  name: דמויות
  description: |-
    כל דמות שחקן בקיאה בכל מעשי הנוכלות השונים המיוצגים ב**פעולות** של המשחק. כולן יכולות לנהל **קטטה** בקרב סכינים, לבצע **התגנבות** בצללים, לבצע **התאמה** לאנרגיה מוזרה, ליצור **היכרויות** עם אנשי קשר כדי להשיג מידע, וכן הלאה.

    כמובן, יהיו לך גם התמחויות ומיומנויות, התכונות שהופכות את הדמות שלך ליעילה באופן ייחודי. אולי תרצה את היכולת לכפות ציות על רוחות רפאים ולהעביר אנרגיה מיסטית דרך גופך, או אולי תרצה לתמרן את רשת העולם התחתון לטובתך ולראות סכנה לפני שהיא מכה, או אולי פשוט תרצה להיות הלוחם הקטלני ביותר בלהב. בפרק זה תלמד ליצור נוכל ייחודי משלך ולבחור את היכולות שמתאימות לסגנון המשחק שאתה מעדיף.
- id: coin-and-stash-coin
  name: מטבעות
  description: |-
    **מטבעות** הם מדד מופשט למזומנים ולנכסים נזילים.

    הסכומים הקטנים שדמויות שחקן משתמשות בהם בחיי היומיום אינם נרשמים. אם דמות רוצה להוציא כסף כדי להשיג מטרה קטנה (לשחד שוער), השתמש ב**איכות אורח החיים** של הדמות להטלת מזל.
- id: coin-and-stash-monetary-values
  name: ערכים כספיים
  description: |-
    * **1 מטבעות**: ארנק גדוש בחתיכות כסף. שכר שבועי.
    * **2 מטבעות**: נשק משובח. הכנסה שבועית של עסק קטן. יצירת אמנות משובחת. סט בגדי יוקרה.
    * **4 מטבעות**: תיק גדוש כסף. שכר חודשי.
    * **6 מטבעות**: תכשיט מעודן. משא כבד של חתיכות כסף.
    * **8 מטבעות**: הכנסה חודשית טובה של עסק קטן. כספת קטנה גדושה במטבעות וברכוש יקר ערך. סחורת יוקרה נדירה מאוד.
    * **10 מטבעות**: מימוש נכס משמעותי: כרכרה ועזים, סוס, שטר בעלות על נכס קטן.

    יותר מ-4 **מטבעות** הם סכום לא מעשי להחזיק בהישג יד. עליך להוציא את העודף או להניח אותו ב**מטמון** שלך (ראה בהמשך). צוות יכול גם לאחסן 4 **מטבעות** במאורה שלו, כברירת מחדל. אם הוא משדרג ל**כספת**, הוא יכול להרחיב את מאגריו ל-**8** ואחר כך ל-**16** **מטבעות**. כל **מטבעות** מעבר למגבלה חייבים להיות מוצאים בהקדם האפשרי (בדרך כלל לפני המבצע הבא) או מחולקים בין חברי הצוות.

    יחידה אחת של **מטבעות** בחתיכות כסף או במטבע גדול אחר תופסת משבצת פריט אחת ב**עומס** שלך כשאתה נושא אותה.
- id: coin-and-stash-monetary-values-coin-use
  name: שימוש במטבעות
  description: |-
    * הוצא 1 **מטבעות** כדי לקבל **פעילות** נוספת ב**זמן הפנוי**.
    * הוצא 1 **מטבעות** כדי להעלות את רמת התוצאה של הטלת **פעילות בזמן הפנוי**.
    * הוצא **מטבעות** כדי להימנע מ**סבכים** מסוימים של הצוות.
    * הנח **מטבעות** ב**מטמון** של הדמות שלך כדי לשפר את אורח חייה ואת נסיבותיה כשהיא פורשת. ראה בסעיף הבא.
    * הוצא **מטבעות** כשאתה מקדם את ה**דרג** של הצוות שלך.
- id: coin-and-stash-stash-retirement
  name: מטמון ופרישה
  description: |-
    כשאתה מסמן את ה**טראומה** האחרונה של הדמות שלך והיא פורשת, כמות ה**מטבעות** שהצליחה לצבור במטמון קובעת את גורלה. מד המטמון שלך נמצא בדף הדמות.

    * **מטמון 0-10:** **נפש מסכנה.** אתה מסיים ברחוב, שקוע ביצר ובסבל.
    * **מטמון 11-20: דל.** בקתה זעירה משלך.
    * **מטמון 21-39: סביר.** בית או דירה פשוטים, עם כמה נוחויות קטנות. ייתכן שתנהל מסבאה או עסק קטן.
    * **מטמון 40: מצוין.** בית או דירה מרוהטים היטב, עם כמה מותרות. ייתכן שתנהל עסק בינוני.

    בנוסף, כל שורה מלאה של מטמון (10 **מטבעות**) מציינת את **רמת האיכות של אורח חייה של הדמות**, מאפס (חיי רחוב) עד ארבע (מותרות).

    > קרוס רוצה קצת זמן לבד עם חבר חדש פוטנציאלי, אבל אינו יכול לקחת אותו למאורה הנסתרת שבה הוא גר, אז מה עושים? ריאן, השחקן של קרוס, אומר שהוא רוצה לשכור חדר נחמד לערב, ולכן שליט המבוך (שה״מ) מבקש הטלת מזל לפי דירוג אורח החיים של קרוס כדי לראות איזה סוג חדר קרוס מצליח להשיג.
- id: coin-and-stash-stash-retirement-removing-coin-from-your-stash
  name: הוצאת מטבעות מהמטמון
  description: אם אתה רוצה למשוך **מטבעות** מהמטמון שלך, אתה יכול לעשות זאת, בעלות מסוימת. הדמות שלך מוכרת חלק מנכסיה והשקעותיה כדי להשיג מזומן מהיר. **על כל 2 מטמון שהוצאת, אתה מקבל 1 **מטבעות** במזומן.**
- id: consequences-and-harm
  name: תוצאות ופציעות
  description: |-
    פעולות אויב, נסיבות רעות או תוצאת הטלה יכולים להטיל **תוצאות** על דמות שחקן. יש חמישה סוגים (מימין).

    נסיבות מסוימות עשויות להוביל לתוצאה אחת או יותר, בהתאם למצב. שליט המבוך (שה״מ) קובע את התוצאות, בהתאם לעלילה ולסגנון ולאווירה שקבעה קבוצת המשחק.
- id: consequences-and-harm-complication
  name: סיבוך
  description: |-
    תוצאה זו מייצגת צרה, סכנה גוברת או איום חדש. שליט המבוך (שה״מ) יכול להציג בעיה מיידית שנובעת מהפעולה כאן ועכשיו: החדר עולה באש, אתה מפורק מנשקך, הצוות מקבל +1 **חום** מראיות או מעדים, אתה מאבד מעמד מול פלג, המטרה מתחמקת ממך ועכשיו זה מרדף, תגבורת מגיעה, וכן הלאה.

    או שה״מ יכול במקום זאת למלא מקטעים בשעון עבור הסיבוך. אולי יש שעון לרמת ההכוננות של השומרים באחוזה. או שה״מ יוצר שעון חדש לחשדנות של אורחי האצולה במסיבת המסכות ומקדם אותו. מלא מקטע אחד בשעון עבור סיבוך קל או שני מקטעים עבור סיבוך רגיל.

    **סיבוך חמור** קשה יותר: תגבורת מקיפה אותך ולוכדת אותך, החדר עולה באש וקורות תקרה נופלות חוסמות את הדלת, הנשק שלך נשבר, הצוות סובל +2 **חום**, המטרה בורחת מחוץ לטווח הראייה, וכן הלאה. מלא שלושה מקטעים בשעון עבור סיבוך חמור.

    **אל תטיל סיבוך שמבטל הטלה מוצלחת.** אם דמות שחקן מנסה לתפוס אויב בפינה ומקבלת **4/5**, אל תאמר שהאויב בורח. ההטלה של השחקן הצליחה, ולכן האויב נלכד... אולי הדמות צריכה להאבק בו כדי להעמיד אותו במקום, ובמהלך המהומה האויב חוטף את האקדח שלה.
- id: consequences-and-harm-harm
  name: פציעה
  description: |-
    תוצאה זו מייצגת חולשה ממושכת (או מוות). כשאתה סובל מפציעה, רשום בדף הדמות שלך את הפגיעה המסוימת בדרגה השווה לדרגת הפציעה שסבלת. אם אתה סובל מ**פציעה קלה**, רשום אותה בשורה התחתונה. אם אתה סובל מ**פציעה בינונית**, כתוב אותה בשורה האמצעית. אם אתה סובל מ**פציעה קשה**, רשום אותה בשורה העליונה. ראה דוגמאות לפציעות ואת מד הפציעות בהמשך.

    הדמות שלך סובלת מההשפעה המצוינת בסוף השורה אם פציעה אחת או כל הפציעות הרשומות בשורה זו חלות על המצב הנוכחי. כך, אם יש לך את הפציעות "מותש" ו"מוכה" בשורה התחתונה, תסבול מהשפעה מופחתת כשתנסה לברוח מהשוטרים. כשאתה נפגע מפציעה בשורה העליונה (פציעה קשה, דרגה 3), הדמות שלך חסרת יכולת פעולה ואינה יכולה לעשות דבר אלא אם מישהו אחר עוזר לך או שאתה **מתאמץ יותר** כדי לבצע את הפעולה.

    אם אתה צריך לסמן דרגת פציעה אבל השורה כבר מלאה, הפציעה עולה לשורה שמעליה. כך, אם סבלת פציעה רגילה (דרגה 2) אבל אין לך משבצות פנויות בשורה השנייה, תצטרך לרשום פציעה קשה (דרגה 3) במקום. אם אזלו לך המשבצות בשורה העליונה ואתה צריך לסמן שם פציעה, הדמות שלך סובלת **תוצאה קטסטרופלית וקבועה** (איבוד גפה, מוות פתאומי וכדומה, בהתאם לנסיבות).

    ---

    #### פציעה

    | דרגה | פציעה | השפעה |
    | :--: | :-- | :--: |
    | 3 | *רגל ימין מרוסקת* | זקוק לעזרה |
    | 2 | | -1D |
    | 1 | *מותש*, *מוכה* | השפעה מופחתת |

    *לדמות זו יש שלוש פציעות: "רגל ימין מרוסקת" (דרגה 3) וכן "מותש" ו"מוכה" (דרגה 1). אם תסבול פציעה נוספת בדרגה 1, היא תעלה לדרגה 2. אם תסבול פציעה נוספת בדרגה 3, היא תעלה לדרגה 4: קטלנית.*
- id: consequences-and-harm-harm-harm-examples
  name: דוגמאות לפציעות
  description: |-
    **קטלנית (4)**: *התחשמלות, טביעה, דקירה בלב.*

    **קשה (3)**: *מוחזק על יתד, רגל שבורה, ירי בחזה, כוויות קשות, מבוהל.*

    **בינונית (2)**: *תשוש, חתך עמוק בזרוע, זעזוע מוח, בפאניקה, מאוהב.*

    **קלה (1)**: *מוכה, מותש, מוסח, מפוחד, מבולבל.*

    פציעה כמו "מותש" או "תשוש" יכולה להיות תוצאת גיבוי טובה אם שום דבר אחר אינו מאיים על דמות שחקן (למשל כשהיא מבלה את כל הלילה ב**עיון** בספרים ישנים, בחיפוש אחר רמזים לנקודות התורפה של אויבה לפני שיכה).
- id: consequences-and-harm-lost-opportunity
  name: הזדמנות אבודה
  description: תוצאה זו מייצגת שינוי בנסיבות. הייתה לך הזדמנות להשיג את מטרתך בפעולה זו, אבל היא חומקת. כדי לנסות שוב אתה צריך גישה חדשה, בדרך כלל סוג פעולה חדש או שינוי בנסיבות. אולי ניסית לנהל **קטטה** עם האצילה כדי ללכוד אותה במרפסת, אבל היא מתחמקת מהתמרון שלך וקופצת מחוץ להישג ידך. אם אתה רוצה ללכוד אותה עכשיו תצטרך לנסות דרך אחרת, אולי ב**שכנוע** שלה בקסם הנוכלי שלך.
- id: consequences-and-harm-reduced-effect
  name: השפעה מופחתת
  description: תוצאה זו מייצגת ביצוע פגום. הפעולה של דמות השחקן אינה יעילה כפי שציפתה. פגעת בו, אבל זו רק פציעת בשר. היא מקבלת את ההזמנה המזויפת, אבל תשגיח עליך כל הערב. אתה מצליח לטפס על הקיר, אבל זה איטי, ואתה רק באמצע הדרך. תוצאה זו מורידה למעשה את רמת ההשפעה של פעולת דמות השחקן ברמה אחת אחרי שכל שאר הגורמים נלקחו בחשבון.
- id: consequences-and-harm-worse-position
  name: עמדה גרועה יותר
  description: תוצאה זו מייצגת אובדן שליטה במצב. הפעולה מביאה אותך לעמדה מסוכנת יותר. אולי אתה מצליח לקפוץ אל הגג הבא, רק כדי למצוא את עצמך תלוי בקצות האצבעות. לא נכשלת, אבל גם עוד לא הצלחת. אתה יכול לנסות שוב ולהטיל מחדש בעמדה החדשה, הגרועה יותר. זו תוצאה טובה לבחירה כדי להראות פעולה שמסלימה. מצב יכול לעבור ממבוקרת, למסוכנת, לנואשת, ככל שהפעולה מתפתחת ודמות השחקן שוקעת עמוק יותר ויותר בצרות.
