- id: gathering-information-examples-questions-gather-information
  name: איסוף מידע
  description: |-
    *שאל שאלה והטל הטלת פעולה או הטלת מזל. שה״מ עונה לך בכנות, ורמת הפירוט תלויה ברמת ההשפעה.*

    **גדולה**: אתה מקבל פרטים יוצאי דופן. המידע שלם, ושאלות המשך עשויות להרחיב לתחומים קשורים או לחשוף יותר ממה שקיווית.

    **רגילה**: אתה מקבל פרטים טובים. אפשר לשאול שאלות הבהרה ושאלות המשך.

    **מוגבלת**: אתה מקבל מידע חלקי או לא שלם. יידרש עוד איסוף מידע כדי לקבל את כל התשובות.
- id: gathering-information-investigation
  name: חקירה
  description: |-
    יש שאלות מורכבות מדי מכדי לענות עליהן מיד בהטלת איסוף מידע אחת. למשל, אולי תרצה לגלות את רשת נתיבי ההברחה של סחורה אסורה בעיר. במקרים כאלה שה״מ (שליט המבוך) יאמר לך להתחיל **פרויקט ארוך טווח** שתעבוד עליו במהלך **הזמן הפנוי**.

    אתה עוקב אחר פרויקט החקירה באמצעות שעון התקדמות. כשהשעון מתמלא, יש בידך הראיות הדרושות כדי לשאול כמה שאלות על נושא החקירה, כאילו הייתה לך השפעה גדולה.
- id: heat
  name: חום
  description: |-
    העיר מלאה בעיניים סקרניות ובמלשינים. כל מה שתעשה עלול להיראות, ותמיד נשארות ראיות. כדי לשקף זאת, הצוות שלך צובר **חום** כשהוא מבצע פשעים. לאחר מבצע או עימות עם יריב, הצוות שלך סופג **חום** לפי אופי הפעולה:

    * **0 חום**: חלק ושקט; חשיפה נמוכה.
    * **2 חום**: מבוקר; חשיפה רגילה.
    * **4 חום** : רועש ותוהו ובוהו; חשיפה גבוהה.
    * **6 חום**: פראי; חשיפה הרסנית.

    הוסף +1 **חום** על יעד בעל פרופיל גבוה או קשרים טובים. הוסף +1 **חום** אם האירוע התרחש בשטח עוין. הוסף +1 **חום** אם אתם במלחמה עם פלג אחר. הוסף +2 **חום** אם היה הרג מעורב (בין שהצוות ביצע אותו ובין שלא — גופות מושכות תשומת לב).

    אתה מסמן את רמות ה**חום** במעקב ה**חום** שבדף הצוות.

    ---

    |                                                                 **חום**                                                                 |                     **רמת מבוקש**                     |
    | :--------------------------------------------------------------------------------------------------------------------------------------: | :------------------------------------------------------: |
    | ⊗ ⊗ ⊗ ○ ○ ○ ○ ○ ○ | □ □ □ □ |

    ---

    כשרמת ה**חום** שלך מגיעה ל-9, אתה מקבל **רמת מבוקש** ומנקה את ה**חום** (עודף **חום** "גולש" הלאה, כך שאם ה**חום** שלך היה 7 וספגת 4 **חום**, תתחיל מחדש עם 2 **חום** מסומנים).

    ככל ש**רמת המבוקש** שלך גבוהה יותר, התגובה כשהחוק פועל נגדך חמורה יותר (יישלח נגדך כוח בעל **איכות** ו**היקף** גבוהים יותר).

    בנוסף, **רמת המבוקש** שלך משפיעה על חומרת ה**סבכים** שהצוות שלך נתקל בהם לאחר מבצע.
- id: heat-incarceration
  name: מאסר
  description: |-
    הדרך היחידה להפחית את **רמת המבוקש** של הצוות שלך היא מאסר. כשאחד מחברי הצוות שלך, מחבריו, אנשי הקשר שלו, או אויב שהפלילו אותו, מורשע ונכלא בגין פשעים הקשורים לצוות שלך, **רמת המבוקש** שלך יורדת ב-1 ואתה מנקה את ה**חום**.

    המאסר עשוי לנבוע מחקירה ומעצר בידי השוטרים, או מכך שמישהו מסגיר את עצמו ולוקח על עצמו את האשמה בפשעי הצוות.

    חומרת עונש המאסר תלויה ב**רמת המבוקש** שלך:

    * **רמת מבוקש 4**: מאסר עולם או הוצאה להורג.
    * **רמת מבוקש 3**: שנה או שנתיים.
    * **רמת מבוקש 2**: כמה חודשים.
    * **רמת מבוקש 1**: חודש או חודשיים.
    * **רמת מבוקש 0**: כמה שבועות. או שהשוטרים מכים אותך כדי ללמד אותך לקח (סבול פציעה ברמה 3, ללא הטלת התנגדות — הם ממשיכים עד שאתה פצוע).

    המאסר משפיל ואכזרי. המוניטין של הצוות שלך הוא ההגנה האמיתית היחידה שלך בפנים. כשאתה מרצה את עונשך, הטל **הטלת מאסר** כשהדרג של הצוות שלך הוא מאגר הקוביות.
- id: heat-incarceration-incarceration-roll
  name: הטלת מאסר
  description: |-
    * **הצלחה קריטית**: אתה עושה לעצמך שם בפנים. אתה מקבל **+3** **מוניטין** לצוות שלך, **1 תביעת כלא** ו**+1 מעמד הפלג** מול פלג שסייעת לו בזמן שריצית את עונשך.
    * **6**: אתה מרצה את עונשך היטב. הצוות שלך מקבל **1 תביעת כלא** ו**+1 מעמד הפלג** מול פלג שסייעת לו בזמן שריצית את עונשך.
    * **4/5**: אתה מסתתר מתחת לרדאר ומרצה את עונשך בלי תקריות.
    * **1-3**: זה נורא. אתה סובל מרמה אחת של טראומה מהחוויה.
- id: heat-prison-claims-allied-claim
  name: תביעת בעל ברית
  description: |-
    אחד מבעלי בריתך בפנים דואג שהפלג שלו יעניק לך טובה. קח תביעה לצוות שלך מסוג צוות אחר. אתה לא יכול לקחת שטח באמצעות תביעה זו.
- id: heat-prison-claims-cell-block-control
  name: שליטה באגף
  description: |-
    לצוות שלך יש אגף שלם תחת שליטתו המוחלטת, כולל הסוהרים. אתה אף פעם לא סופג **טראומה** ממאסר.
- id: heat-prison-claims-claims-prison
  name: 'תביעות: כלא'
  description: |-
    |              |          |            |          |              |          |                    |
    | :--------------: | :------: | :--------: | :------: | :----------: | :------: | :----------------: |
    | השפעה על שחרור | ― | הברחות  | ― | תביעת בעל ברית |          | שליטה באגף |
    |     ❘     |          |  ❘  |          |   ❘   |          |      ❘      |
    |   שוחד לסוהרים   | ― | **כלא** | ― | שוחד לסוהרים | ― |    תביעת בעל ברית    |
    |     ❘     |          |  ❘  |          |   ❘   |          |      ❘      |
    |     קשוח     | ― | הברחות  | ― | תביעת בעל ברית | ― |    תביעת בעל ברית    |
- id: heat-prison-claims-guard-payoff
  name: שוחד לסוהרים
  description: |-
    כמה סוהרים נמצאים אצלך על הרשימה. קח +1d להטלת הדרג שלך כשחבר בצוות שלך נכלא.
- id: heat-prison-claims-hardcase
  name: קשוח
  description: |-
    המוניטין שלך כאסיר קשוח מחזק את תדמית הצוות שלך. כשהצוות שלך מעלה דרג, זה עולה 2 **מטבעות** פחות מהרגיל.
- id: heat-prison-claims-parole-influence
  name: השפעה על שחרור
  description: |-
    אפשר להפעיל לחצים פוליטיים מסוגים שונים על השופטים ועל מנהל הכלא שמפקחים על עונשי המאסר. בעזרת תביעה זו אתה תמיד יכול לסדר שהות קצרה יותר בכלא, כאילו **רמת המבוקש** שלך נמוכה ב-1. כך, אם **רמת המבוקש** שלך הייתה 3 כשנכנסת, תבלה מאחורי סורגים רק כמה חודשים (שווה ערך לרמה 2) במקום שנה שלמה.
- id: heat-prison-claims-smuggling
  name: הברחות
  description: |-
    אתה מסדר ערוצי הברחה בפנים. יש לך **+2 עומס** בזמן שאתה כלוא (כשאתה מתחיל מאפס כאסיר). אם תיקח תביעה זו פעמיים, יהיה לך 4 עומס בזמן שאתה מרצה את עונשך באיירונהוק. בנוסף, אתה יכול לבחור לשאת **מטבעות** במקום עומס לצורך שוחד או השגת נכסים בזמן שאתה בכלא. אתה יכול לאפס את הפריטים בציוד הכלא שלך בכל פעם שלצוות שלך יש זמן פנוי.
- id: magnitude
  name: עוצמה
  description: |-
    לישויות ולאנרגיות על-טבעיות יש מגוון רחב של השפעות ורמות כוח. כדי לעזור לשה״מ (שליט המבוך) לשפוט כוחות אלה באופן עקבי, קיים סולם **עוצמה**. ראה את טבלת העוצמה הראשית מימין. העוצמה מודדת את רמת האיכות של רוח רפאים או שד, או של היבטים שונים של כוח מסתורי: התחום שלו, ההיקף, המשך, הטווח והכוח. בכל פעם שאתה צריך להעריך ישות או כוח, השתמש בסולם העוצמה כקו מנחה כדי לשפוט כיצד הם משתווים לדוגמאות שבטבלה.

    אפשר להשתמש בעוצמה של ישות או כוח כמאגר קוביות ל**הטלת מזל** כדי לראות כמה השפעה יש להם, אם זה לא ברור או וודאי.

    > שד ים מזמן גל מוחץ ברציף התעלה שבו הדמויות המשתתפות מנחיתות את סירתן. עד כמה זה פוגע בכלי השיט ובצוות? ברור שזה יהיה רע להם, אבל האם הם רק טובעים או שהם נהרסים וטובעים מיד? שה״מ מטיל הטלת מזל עם 6d (העוצמה של השד). ב-**1-3**, לגל יש השפעה קטנה בלבד (לגל עצום), והסירה נמלאת מים ומתחילה לשקוע. ב-**4-5**, לגל יש השפעה מופחתת: הוא מציף את הסירה לגמרי וזורק חלק מהדמויות והמטען שלהן אל המים. ב-**6**, לגל יש השפעה מלאה: הוא מטביע את הסירה מיד וגורר את הצוות והמטען למטה. ב**הצלחה קריטית**, הסירה טובעת, וגם הצוות והמטען נפגעים קשות משברי עץ מעופפים ומהכוח המוחץ של הגל.

    אפשר לחבר רמות עוצמה כדי לתאר שילוב של השפעות, או פשוט להתמקד בתכונה מרכזית אחת בהערכת העוצמה ולהתעלם מהאחרות, גם אם הן מופיעות בסולם. הן *לא תמיד* מצטברות.

    > בדוגמה שלמעלה, השד יצר כוח בעוצמה 6, ושה״מ כלל את תחום ההשפעה שלו "בחינם" כחלק מהכוח. לדעתו, גל עצום ברציף אמור להשפיע על הסירות ועל הצוותים שנמצאים שם.
    >
    > במפגש אחר, לחש רוצה לבצע טקס שישחרר הוריקן על פני המחוז כולו. שה״מ אומר שזו השפעה משמעותית מאוד, ולכן הוא מחבר שתי רמות עוצמה: *כוח 6* ו*טווח 5*. כדי ליצור כוח הרסני כזה, הלחש יסבול 11 לחץ! שה״מ מציע פשרה: הטקס ייקח כמה שעות, ולכן עלות הלחץ תופחת ל-8, אבל חלק מהאנשים באזור המושפע עשויים להבין מה קורה ולברוח לפני שהסערה המלאה תכה.*

    טבלת העוצמה נועדה ככלי שיעזור לשה״מ לקבל החלטות שיפוט. היא לא נועדה להיות הגבלה נוקשה או נוסחה מתמטית שתחליף את החלטות השיפוט האלה. השתמש ברמות כ*קו מנחה* לקביעת מספר עוצמה שנראה לך מתאים.

    אפשר להשתמש בטבלה זו גם כמדריך ל**רמת איכות** כשדמות **משיגה נכס** או יוצרת **אלכימיה** או **מתקן**.
