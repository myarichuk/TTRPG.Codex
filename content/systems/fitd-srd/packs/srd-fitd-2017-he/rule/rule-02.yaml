- id: advancement-crew-advancement
  name: התקדמות הצוות
  description: |-
    בסוף המפגש עבור על מקורות הניסיון של הצוות וסמן 1 ניסיון לצוות על כל סעיף שהתרחש במהלך המפגש. אם סעיף התרחש כמה פעמים או באופן משמעותי, סמן עליו 2 ניסיון לצוות. מקורות הניסיון של הצוות הם:

    * **מקור הניסיון הייחודי לצוות שלך.** למשל, אצל המבריחים הוא *״בצעו מבצע הברחה או השיגו לקוחות חדשים או מקורות חדשים לסחורה אסורה.״* אם הצוות השלים בהצלחה מבצע שמתאים למקור הזה, סמן ניסיון.
    * **התמודד עם אתגרים שמעל למעמדך הנוכחי.** אם התעמתם עם דרגים גבוהים יותר או עם יריבים מסוכנים יותר, סמן על כך ניסיון.
    * **חזק את המוניטין של הצוות או פתח מוניטין חדש.** עבור על המוניטין של הצוות. האם עשיתם משהו כדי לקדם אותו? סמן ניסיון גם אם פיתחתם לצוות מוניטין חדש.
    * **הבע את המטרות, המניעים, הקונפליקט הפנימי או הטבע המהותי של הצוות.** זה סעיף רחב מאוד! בעצם, האם קרה משהו שהדגיש את המרכיבים המיוחדים שהופכים את הצוות שלך לייחודי?

    **כשאתה ממלא את מד ההתקדמות של הצוות**, נקה את הסימונים וקח **יכולת מיוחדת** חדשה או סמן **שתי משבצות שדרוג של הצוות**.

    > למשל, כשצוות של מתנקשים מרוויח התקדמות לצוות, הוא יכול לקחת יכולת מיוחדת חדשה, כמו **טורפים**. או לסמן שני שדרוגים, כמו **אנשי קשר באירונהוק** ו**אימון** **נחישות**.

    ספר איך השגתם את היכולת החדשה או את השדרוגים של הצוות. *מאיפה זה הגיע? איך זה הופך לחלק חדש בצוות?*
- id: advancement-crew-advancement-profits
  name: רווחים
  description: |-
    בכל פעם שהצוות מתקדם, **כל דמות שחקן מקבלת מטמון** השווה לדרג הצוות+2, כדי לייצג את הרווחים שהצוות הפיק בזמן פעילותו.
- id: advancement-pc-advancement
  name: התקדמות דמות שחקן
  description: |-
    כל שחקן עוקב אחר נקודות הניסיון (**ניסיון**) שהדמות שלו מרוויחה.

    במהלך מפגש המשחק, סמן ניסיון:

    * כשאתה מבצע **הטלת פעולה נואשת**. סמן 1 ניסיון בתכונה של הפעולה שהטלת. למשל, אם הטלת פעולת **קטטה** נואשת, אתה מסמן ניסיון ב**כושר**. כשאתה מטיל במסגרת **פעולה קבוצתית** שהיא נואשת, אתה מסמן ניסיון גם כן.

    בסוף המפגש עבור על **מקורות הניסיון** שבגיליון הדמות שלך. על כל אחד מהם סמן 1 ניסיון אם הוא התרחש כלל, או 2 ניסיון אם הוא התרחש הרבה במהלך המפגש. מקורות הניסיון הם:

    * **מקור הניסיון הייחודי לפלייבוק שלך.** למשל, אצל החותך הוא *״התמודד עם אתגר באלימות או בכפייה.״* כדי ״להתמודד עם אתגר״, הדמות שלך צריכה לנסות להתגבר על מכשול או איום קשה. אין חשיבות לשאלה אם הפעולה מצליחה או לא. אתה מקבל ניסיון בכל מקרה.
    * **הבעת את אמונותיך, מניעיך, מורשתך או רקעך.** האמונות והמניעים של הדמות שלך הם שלך להגדיר, ממפגש למפגש. אתה מוזמן לספר עליהם לקבוצה כשאתה מסמן ניסיון.
    * **התמודדת עם עניינים הקשורים ליצר שלך או לטראומות שלך.** סמן על כך ניסיון אם היצר שלך פיתה אותך לפעולה רעה או אם מצב טראומה גרם לך צרות. מתן דרור ליצר בלבד אינו נחשב להתמודדות איתו (אלא אם כן **הגזמת בו**).

    אתה רשאי לסמן ניסיון של סוף מפגש בכל מדי הניסיון שתרצה (כל תכונה או מד הניסיון של הפלייבוק).

    כשאתה ממלא מד ניסיון, נקה את כל הסימונים וקח **התקדמות**. כשאתה לוקח התקדמות ממד הפלייבוק, אתה רשאי לבחור **יכולת מיוחדת** נוספת. כשאתה לוקח התקדמות מתכונה, אתה רשאי להוסיף **נקודת פעולה** נוספת לאחת הפעולות שתחת התכונה הזו.

    > נדיה משחקת כלב ציד. בסוף המפגש היא עוברת על מקורות הניסיון שלה ומספרת לקבוצה כמה ניסיון היא מקבלת. היא הטילה במהלך המפגש שתי פעולות **ציד** נואשות, ולכן סימנה 2 ניסיון במד הניסיון של **בינה**. היא התמודדה עם כמה אתגרים בעזרת מעקב או אלימות, ולכן היא מסמנת על כך 2 ניסיון. היא הביעה את מורשתה האירובית פעמים רבות במגעים עם החגורות האדומות, ולכן היא לוקחת על כך 2 ניסיון. היא גם הציגה את אמונות הדמות שלה, אבל 2 ניסיון הוא המקסימום לקטגוריה הזו, ולכן היא לא מקבלת עוד. היא לא התמודדה עם היצר שלה או עם הטראומות שלה, ולכן אין על כך ניסיון. זה 4 ניסיון בסוף המפגש. היא מחליטה לשים את כולם במד הניסיון של **בינה**. זה ממלא את המד, ולכן היא מוסיפה נקודת פעולה חדשה ב**ציד**.

    אפשר להרוויח ניסיון גם על ידי **אימון** בזמן הפנוי. כשאתה מתאמן, סמן ניסיון באחת התכונות שלך או בפלייבוק. אפשר להתאמן על מד ניסיון מסוים פעם אחת בלבד בכל שלב של זמן פנוי.
- id: character-creation-assign-four-action-dots
  name: חלק ארבע נקודות פעולה
  description: |-
    הפלייבוק שלך מתחיל עם שלוש נקודות פעולה שכבר מונחות בו. אתה מקבל להוסיף עוד ארבע נקודות (כך שיהיו לך שבע בסך הכול). בתחילת המשחק אף דירוג פעולה לא יכול לעלות על שתי נקודות (אלא אם יכולת מיוחדת קובעת אחרת). חלק את ארבע הנקודות שלך כך:

    * שים נקודה אחת בכל פעולה שלדעתך משקפת את **המורשת** של הדמות שלך.
    * שים נקודה אחת בכל פעולה שלדעתך משקפת את **הרקע** של הדמות שלך.
    * חלק שתי נקודות נוספות איפה שתרצה (הדירוג המרבי הוא 2, זכור).
- id: character-creation-character-creation-summary
  name: סיכום יצירת דמות
  description: |-
    **1** **בחר פלייבוק.** הפלייבוק שלך מייצג את המוניטין של הדמות, את היכולות המיוחדות שלה ואת דרך ההתקדמות שלה.

    **2** **בחר מורשת.** פרט את בחירתך בהערה על חיי המשפחה שלך. *למשל: כורי עפרות, כיום פליטי מלחמה.*

    **3** **בחר רקע.** פרט את בחירתך בהיסטוריה הספציפית שלך. *למשל: עבודה: צייד, מורד.*

    **4** **חלק ארבע נקודות פעולה.** אסור שפעולה כלשהי תתחיל ביצירת הדמות בדירוג גבוה מ-2. *(אחרי היצירה אפשר לקדם דירוגי פעולה עד 3. כשאתה פותח את ההתקדמות ״אומנות״ לצוות שלך, אפשר לקדם פעולות עד דירוג 4.)*

    **5** **בחר יכולת מיוחדת.** הן בעמודה האפורה שבאמצע גיליון הדמות. אם אינך מצליח להחליט, בחר את היכולת הראשונה ברשימה. היא מוצבת שם כבחירה ראשונה טובה.

    **6** **בחר חבר קרוב ויריב.** סמן את מי שהוא חבר קרוב, בעל ברית ותיק, קרוב משפחה או אהוב (המשולש שפונה כלפי מעלה). סמן אחד שהוא יריב, אויב, אהוב שנדחה, שותף שנבגד וכדומה (המשולש שפונה כלפי מטה).

    **7** **בחר את היצר שלך.** בחר את סוג היצר המועדף עליך, פרט אותו בתיאור קצר וציין את שמו ומיקומו של ספק היצר שלך.

    **8** **רשום שם, כינוי ומראה.** בחר שם, כינוי (אם אתה משתמש בו), וכתוב כמה מילים שמתארות את המראה שלך. דוגמאות מופיעות בסעיפים הקודמים.
- id: character-creation-choose-a-background
  name: בחר רקע
  description: |-
    **הרקע** של הדמות שלך מתאר מה היא עשתה לפני שהצטרפה לצוות. בחר רקע ואז כתוב עליו פרט ייחודי לדמות שלך.
- id: character-creation-choose-a-heritage
  name: בחר מורשת
  description: |-
    **המורשת** של הדמות שלך מתארת מאיפה שושלת המשפחה שלה. כשאתה בוחר מורשת, כתוב פרט על חיי המשפחה שלך בשורה שמעליה.
- id: character-creation-choose-a-special-ability
  name: בחר יכולת מיוחדת
  description: |-
    עיין ביכולות המיוחדות של הפלייבוק שלך ובחר אחת מהן. אם אינך מצליח להחליט איזו לבחור, קח את הראשונה ברשימה, כי היא מוצבת שם כבחירת מחדל טובה.
- id: character-creation-choose-a-special-ability-special-armor
  name: שריון מיוחד
  description: |-
    חלק מהיכולות המיוחדות מתייחסות ל**שריון המיוחד** שלך. בכל גיליון דמות יש שלוש משבצות למעקב אחר השימוש בשריון (רגיל, כבד ומיוחד). אם יש לך יכולות שמשתמשות בשריון המיוחד, סמן את המשבצת שלו כשאתה מפעיל אחת מהן. אם אין לך יכולות מיוחדות שמשתמשות בשריון מיוחד, אינך יכול להשתמש במשבצת השריון הזו כלל.
- id: character-creation-choose-one-close-friend-and-one-rival
  name: בחר חבר קרוב אחד ויריב אחד
  description: |-
    לכל פלייבוק יש רשימה של דמויות מנהל שהדמות שלך מכירה. בחר מהרשימה אחת שקשורה אליה בקשר קרוב (חבר טוב, אהוב, קרוב משפחה וכדומה). סמן את המשולש שפונה כלפי מעלה לצד שמה. אחר כך בחר דמות מנהל נוספת ברשימה שהיא היריבה או האויבת שלך. סמן את המשולש שפונה כלפי מטה לצד שמה.
- id: character-creation-choose-your-vice
  name: בחר את היצר שלך
  description: |-
    כל דמות שבויה בידי יצר כלשהו, שבו היא מתפנקת כדי להתמודד עם לחץ. בחר יצר מהרשימה ותאר אותו בשורה שמעליה עם הפרטים הספציפיים, ועם שמו ומיקומו של **ספק היצר** שלך.

    * **אמונה**: אתה מסור לכוח בלתי נראה, לאל נשכח, לאב קדמון וכדומה.
    * **הימורים**: אתה משתוקק למשחקי מזל, להימורים על אירועי ספורט וכדומה.
    * **פאר**: תצוגות יקרות או מתהדרות של עושר.
    * **מחויבות**: אתה מסור למשפחה, למטרה, לארגון, לצדקה וכדומה.
    * **הנאה**: סיפוק מאהובים, אוכל, משקאות, סמים, אמנות, תיאטרון וכדומה.
    * **קהות חושים**: אתה מחפש שכחה בשימוש מופרז בסמים, בשתייה לשוכרה, בקבלת מכות רצח בזירות הלחימה וכדומה.
    * **מוזרות**: אתה מתנסה בתמציות מוזרות, מתרועע עם רוחות סוררות, מקיים טקסים או איסורים משונים וכדומה.
- id: character-creation-create-playbooks
  name: צור פלייבוקים
  description: |-
    פלייבוק הוא הכינוי שלנו לגיליון שמכיל את כל החוקים הספציפיים לשחק סוג מסוים של דמות במשחק מבוסס Blades. למשל, אפשר ליצור פלייבוק בשם **חייל**, עם יכולות מיוחדות הקשורות לקרב, או פלייבוק בשם **רופא**, עם יכולות מיוחדות הקשורות לרפואת שדה.

    כשאתה בוחר פלייבוק, אתה בוחר סט של **יכולות מיוחדות** (שנותנות לדמות שלך דרכים לעקוף את החוקים בכמה אופנים) וסט של **מקורות ניסיון** (שקובעים איך אתה מרוויח ניסיון להתקדמות הדמות). אבל כל פלייבוק מייצג נוכל בנשמתו. לחותך יש יכולות מיוחדות הקשורות בלחימה, אבל זה לא אומר שהוא ״הלוחם״ של המשחק. כל סוג דמות יכול להילחם היטב. חשוב על הפלייבוק שלך כעל תחום התמקדות והעדפה, ולא כעל סט כישורים ייחודי.

    בגלל זה אנחנו קוראים להם ״פלייבוקים״ ולא ״מקצועות דמות״ או ״ארכיטיפים״. אתה בוחר את סט דירוגי הפעולה ההתחלתיים והיכולות המיוחדות שעומדים לרשות הדמות שלך, אבל אינך מגדיר את מהותה הבלתי משתנה או את טבעה האמיתי. הדמות שלך תגדל ותשתנה עם הזמן; מי שהיא תהפוך להיות הוא חלק מהכיף שבמשחק.

    אחרי שבחרת פלייבוק, בצע את השלבים הבאים כדי להשלים את הדמות שלך.
- id: character-creation-loadout
  name: ציוד למבצע
  description: |-
    יש לך גישה לכל ה**פריטים** שבגיליון הדמות שלך. לכל מבצע, החלט מה יהיה **העומס** של הדמות שלך. במהלך המבצע אתה רשאי לומר שלדמות שלך יש פריט בהישג יד על ידי סימון המשבצת של הפריט שברצונך להשתמש בו, עד מספר פריטים השווה לעומס שבחרת. העומס שלך קובע גם את מהירות התנועה שלך ואת מידת בולטותך:

    * **עומס 1-3**: **קל.** *אתה מהיר יותר ופחות בולט; אתה משתלב בין האזרחים.*
    * **עומס 4/5**: **רגיל.** *אתה נראה כמו נוכל, מוכן לצרות.*
    * **עומס 6**: **כבד.** *אתה איטי יותר. אתה נראה כמו סוכן במשימה.*
    * **עומס 7-9**: **עמוס מדי.** *אתה כורע תחת המשא ואינך יכול לעשות דבר מלבד לנוע לאט מאוד.*

    יכולות מיוחדות מסוימות (כמו יכולת **פרד** של החותך או הציוד של המתנקש) מעלות את מגבלות העומס.

    חלק מהפריטים נחשבים לשני פריטים לעניין העומס (יש להם שתי משבצות מחוברות). *פריטים בכתב נטוי אינם נספרים בעומס שלך.*

    אין צורך לבחור פריטים מסוימים עכשיו. עבור על הפריטים האישיים שלך ועל תיאורי הפריטים הרגילים.
- id: character-creation-record-your-name-alias-look
  name: רשום שם, כינוי ומראה
  description: |-
    בחר שם לדמות שלך מרשימת הדוגמאות, או צור שם משלך. אם הדמות שלך משתמשת בכינוי או בשם חיבה בעולם התחתון, רשום אותו. רשום כמה מילים מעוררות שמתארות את המראה של הדמות שלך (דוגמאות מופיעות בסעיפים הבאים).
- id: character-creation-review-your-details
  name: עבור על הפרטים שלך
  description: |-
    עיין בפרטים שבגיליון הדמות שלך, בעיקר ב**מקורות הניסיון** של הפלייבוק שלך (כמו ״קבל ניסיון כשאתה מתמודד עם אתגר בידע או בכוח כישוף״, למשל) וב**פריטים המיוחדים** שעומדים לרשות דמות מהסוג שלך (כמו מסכת הרוחות של הלוחש, למשל). אתה מתחיל עם גישה לכל הפריטים שבגיליון שלך, ולכן אל תדאג לבחור דברים מסוימים. תחליט מה הדמות שלך נושאת מאוחר יותר, כשתהיה בעבודה.

    זהו! הדמות שלך מוכנה למשחק. כשתתחילו את המפגש הראשון, שה״מ ישאל אותך כמה שאלות על מי אתה, על השקפת עולמך או על אירועים מהעבר. אם אינך יודע את התשובות, המצא אותן. או בקש רעיונות מהשחקנים האחרים.
- id: character-playbook-character-items
  name: פריטי הדמות
  description: |-
    הוסף רשימה של חמישה פריטים ייחודיים שהם משובחים (איכות +1), קלים (עומס מופחת), נדירים או ספציפיים בדרך אחרת לדמות הזו.

    כמה דוגמאות: כלי נשק, בגדים, כלי כישוף, כלים מיוחדים, ציוד מותאם אישית, חיות מחמד מוכשרות או חפצים על-טבעיים.
- id: character-playbook-friends-rivals
  name: חברים, יריבים
  description: |-
    כאן באה רשימה של חמישה חברים או יריבים אפשריים, עם תיאור של כל אחד. כמה אפשרויות: מרגל, צייד ראשים, מתאגרף, רוצח קר, סחטן, רופא, מתנקש, זקיף, רוקח, כוהנת, אציל, פקיד עירייה, קצין, מפקח, קבצן, מנעולן, מנהיג כנופיה, סוחר סמים, בעל טברנה, זונה, אסיר לשעבר, מתווך מידע, משרת, ארכיונאי או ישות על-טבעית.

    השאלות יכולות לכלול איך אתה מכיר את החבר, מה הוא עשה בשבילך, מה אתה עושה בשבילו ואיזה סוג של קשר יש לכם.
