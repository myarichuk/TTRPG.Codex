- id: skirmish
  name: קטטה
  description: |-
    כאשר אתה מבצע **קטטה**, אתה סוגר על יעד בקרב מגע כך שלא יוכל להימלט בקלות.

    *אתה יכול להתקוטט או להיאבק איתו. אתה יכול לחתוך ולקצץ. אתה יכול לתפוס עמדה בקרב ולשמור עליה באחיזה איתנה. אתה יכול לנסות להילחם בדו-קרב רשמי (אך אולי עדיף עדינות).*
- id: hunt
  name: ציד
  description: |-
    כאשר אתה מבצע **ציד**, אתה עוקב בקפידה אחר יעד.

    *אתה יכול לעקוב אחר יעד או לגלות את מיקומו. אתה יכול לטמון מארב. אתה יכול לתקוף בירי מדויק מרחוק. אתה יכול לנסות להפעיל את נשקך בקרב מגע (אך אולי עדיף קטטה).*
- id: study
  name: עיון
  description: |-
    כאשר אתה מבצע **עיון**, אתה בוחן פרטים ומפרש ראיות.

    *אתה יכול לאסוף מידע ממסמכים, מעיתונים ומספרים. אתה יכול לערוך מחקר בנושא אזוטרי. אתה יכול לנתח אדם מקרוב כדי לזהות שקרים או רגשות אמיתיים. אתה יכול לנסות לבחון אירועים כדי להבין מצב דחוף (אך אולי עדיף סקירה).*
- id: sway
  name: שכנוע
  description: |-
    כאשר אתה מבצע **שכנוע**, אתה משפיע בעורמה, בקסם או בטיעון.

    *אתה יכול לשקר באופן משכנע. אתה יכול לשכנע מישהו לעשות מה שאתה רוצה. אתה יכול להציג טיעון משכנע שאין לו תשובה ברורה. אתה יכול לנסות להטעות אנשים כדי שיחבבו אותך או ישמעו בקולך (אך אולי עדיף היכרויות או פיקוד).*
- id: wreck
  name: הרס
  description: |-
    כאשר אתה מבצע **הרס**, אתה משחרר כוח פראי.

    *אתה יכול לנפץ דלת או קיר בקורנס, או להשתמש בחומר נפץ לאותה מטרה. אתה יכול להשתמש בכאוס או בחבלה כדי ליצור הסחה או להתגבר על מכשול. אתה יכול לנסות להכריע אויב בקרב בכוח גולמי (אך אולי עדיף קטטה).*
- id: finesse
  name: עדינות
  description: |-
    כאשר אתה מבצע **עדינות**, אתה משתמש בתמרון מיומן או בהטעיה דקה.

    *אתה יכול לכייס מישהו. אתה יכול לשלוט בכלי רכב או להנחות חיית רכיבה. אתה יכול להילחם בדו-קרב רשמי מול יריב באמנויות לחימה אלגנטיות. אתה יכול לנסות להשתמש באמנויות האלה בקרב כאוטי (אך אולי עדיף קטטה). אתה יכול לנסות לפרוץ מנעול (אך אולי עדיף טכנאות).*
- id: survey
  name: סקירה
  description: |-
    כאשר אתה מבצע **סקירה**, אתה בוחן את המצב וצופה את התוצאות.

    *אתה יכול לזהות סימנים מובהקים לצרה לפני שהיא מתרחשת. אתה יכול לגלות הזדמנויות או חולשות. אתה יכול לקלוט את המניעים או הכוונות של אדם. אתה יכול לנסות לאתר נקודה טובה למארב (אך אולי עדיף ציד).*
- id: consort
  name: היכרויות
  description: |-
    כאשר אתה מבצע **היכרויות**, אתה מתרועע עם חברים ואנשי קשר.

    *אתה יכול להשיג גישה למשאבים, למידע, לאנשים או למקומות. אתה יכול לעשות רושם טוב או לכבוש מישהו בקסם ובסגנון שלך. אתה יכול ליצור חברים חדשים או להתחבר למורשת או לרקע שלך. אתה יכול לנסות לתמרן את חבריך בלחץ חברתי (אך אולי עדיף שכנוע).*
- id: command
  name: פיקוד
  description: |-
    כאשר אתה מבצע **פיקוד**, אתה מחייב ציות מהיר.

    *אתה יכול להפחיד או לאיים כדי לקבל מה שאתה רוצה. אתה יכול להוביל כנופיה בפעולה קבוצתית. אתה יכול לנסות להפעיל אנשים בפקודות כדי לשכנע אותם (אך אולי עדיף היכרויות).*
- id: attune
  name: התאמה
  description: |-
    כאשר אתה מבצע **התאמה**, אתה פותח את דעתך לכוח כישופי.

    *אתה יכול לתקשר עם רוח רפאים. אתה יכול לנסות לחוש מעבר לראייה כדי להבין טוב יותר את מצבך (אך אולי עדיף סקירה).*
- id: prowl
  name: התגנבות
  description: |-
    כאשר אתה מבצע **התגנבות**, אתה נע במיומנות ובשקט.

    *אתה יכול להתגנב על פני שומר או להסתתר בצללים. אתה יכול לרוץ ולקפוץ על פני הגגות. אתה יכול לתקוף מישהו מתוך מסתור בדקירה בגב או במכה באלה. אתה יכול לנסות לארוב לקורבן באמצע קרב (אך אולי עדיף קטטה).*
- id: tinker
  name: טכנאות
  description: |-
    כאשר אתה מבצע **טכנאות**, אתה מתעסק במכשירים ובמנגנונים.

    *אתה יכול ליצור מתקן חדש או לשנות פריט קיים. אתה יכול לפרוץ מנעול או לפצח כספת. אתה יכול לנטרל אזעקה או מלכודת. אתה יכול להפוך לטובתך את המכשירים המכניים והאלקטרופלסמיים ברחבי העיר. אתה יכול לנסות להשתמש במומחיות הטכנית שלך כדי לשלוט בכלי רכב (אך אולי עדיף עדינות).*
