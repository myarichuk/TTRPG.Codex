name: The usual suspects
description: 'The cops grab someone in the periphery of your crew. One player volunteers a friend or vice purveyor as the person most likely to be taken. Make a **fortune roll** to find out if they resist questioning (**1-3**: **+2 heat**, **4/5:** level 2 harm), or pay them off with 1 **coin**.'
