id: deadly
type: crew-ability
name: Deadly
description: >-
  Each PC may add +1 action rating to **Hunt**, **Prowl**, or **Skirmish** (up to a max rating of 3).


  > Each player may choose the action they prefer (you don't all have to choose the same one). If you take this ability during initial character and crew creation, it supersedes the normal starting limit for action ratings.
source: Crew playbook > Crew special abilities > Deadly
tags:
- example
properties:
  members:
    options:
    - name: Hunt
      modifiers:
      - target: actions.hunt
        amount: 1
    - name: Prowl
      modifiers:
      - target: actions.prowl
        amount: 1
    - name: Skirmish
      modifiers:
      - target: actions.skirmish
        amount: 1
    choose:
      id: deadly
      label: Deadly
      count: 1
