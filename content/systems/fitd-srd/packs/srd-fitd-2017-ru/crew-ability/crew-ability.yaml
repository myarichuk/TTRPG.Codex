- id: second-story
  name: Второй этаж
  description: |-
    Когда вы проводите тайное проникновение, вы получаете **+1d** к **броску завязки**.
- id: war-dogs
  name: Псы войны
  description: |-
    Когда вы воюете (статус фракции -3), ваша команда не получает -1 к контролю, а персонажи игроков всё равно получают два действия свободного времени вместо одного.
- id: accord
  name: Союз
  description: |-
    Иногда друзья стоят территории. Вы можете считать до трёх имеющихся у вас **статусов фракций +3** так, будто это **территория**.

    > Если ваш статус меняется, вы теряете эту территорию, пока он снова не станет +3. Сколько бы территории вы ни держали (от этого умения или иначе), минимальная цена **репутации** для повышения вашего ранга всегда равна 6.
- id: fiends
  name: Изверги
  description: |-
    Страх не хуже уважения. Вы можете считать каждый **уровень розыска** так, будто это **территория**.

    > Максимальный **уровень розыска** равен 4. Сколько бы территории вы ни держали (от этого умения или иначе), минимальная цена **репутации** для повышения вашего ранга всегда равна 6.
- id: predators
  name: Хищники
  description: |-
    Когда вы используете скрытный план или план с обманом, чтобы совершить убийство, берите **+1d** к **броску завязки**.

    > Это умение действует, когда цель дела убийство. Оно не действует на другие скрытные операции и операции с обманом, в которых убийство случается попутно.
- id: anointed
  name: Помазанники
  description: |-
    Вы получаете **+1d** к броскам **сопротивления** сверхъестественным угрозам. Вы получаете **+1d** к броскам лечения, когда у вас сверхъестественный вред.
- id: all-hands
  name: Все при деле
  description: |-
    Во время **свободного времени** один из ваших **подручных** может выполнить действие свободного времени для команды: **добыть ресурс**, **снизить** **жар** или заняться **долгосрочным проектом**.
- id: deadly
  name: Смертоносные
  description: |-
    Каждый персонаж игрока может добавить +1 к рейтингу действия **Охота**, **Подкрадывание** или **Схватка** (максимум до рейтинга 3).

    > Каждый игрок может выбрать действие по своему вкусу (не обязательно, чтобы все выбрали одно и то же). Если вы берёте это умение при первоначальном создании персонажей и команды, оно отменяет обычный стартовый предел рейтингов действий.
- id: death-veil
  name: Покров смерти
  description: |-
    Благодаря тяжким урокам или тайному ритуалу вы не получаете лишнего **жара**, когда на деле кого-то убивают.
- id: patron
  name: Покровитель
  description: |-
    Когда вы повышаете свой **ранг**, это стоит вдвое меньше **монет**, чем обычно.

    > Кто ваш покровитель? Почему он вам помогает?
- id: high-society
  name: Высшее общество
  description: |-
    Всё решают нужные знакомства. Во время свободного времени получайте **-1 жар** и **+1d** к **сбору сведений** об элите города.
- id: forged-in-the-fire
  name: Закалённые огнём
  description: |-
    Каждого персонажа игрока закалил жестокий опыт. Вы получаете **+1d** к броскам **сопротивления**.

    > Это умение относится к персонажам игроков в команде. Ваши подручные от него не становятся выносливее.
- id: synchronized
  name: Слаженность
  description: |-
    Когда вы совершаете **групповое действие**, вы можете засчитать несколько 6 из разных бросков как **критический** успех.

    > Например, Лирик возглавляет групповое действие: **Настройка** на призрачное поле, чтобы преодолеть магическую защиту на двери сестёр Диммер. Эмили, игрок Лирик, бросает кубы и выбрасывает **6**, и Мэтт тоже! Поскольку у команды есть Слаженность, две отдельные **6** засчитываются как **критический** успех броска.
- id: no-traces
  name: Без следов
  description: |-
    Когда вы проводите операцию тихо или делаете так, что она выглядит несчастным случаем, вы получаете половину значения **репутации** цели (с округлением вверх) вместо нуля. Когда вы заканчиваете свободное время с нулевым **жаром**, получайте **+1** **репутации**.

    > Многие клиенты ценят тихие операции. Это умение вознаграждает вас за скромность.
- id: pack-rats
  name: Барахольщики
  description: |-
    Ваше логово завалено краденым добром. Когда вы бросаете кубы, чтобы **добыть ресурс**, берите **+1d**.

    > Это умение может означать, что нужная вам вещь действительно нашлась в вашей куче хлама, а может означать, что у вас есть лишние мелочи для обмена.
- id: just-passing-through
  name: Мы тут проездом
  description: |-
    Во время **свободного времени** получайте **-1 жар**. Когда ваш **жар** равен 4 или меньше, вы получаете **+1d**, чтобы обманывать людей, выдавая себя за обычных горожан.
