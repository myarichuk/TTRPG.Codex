- id: foresight
  name: Предвидение
  description: |-
    Два раза за дело вы можете **помочь** товарищу по команде, не платя стрессом. Опишите, как вы к этому подготовились.

    > Вы можете рассказать о событии в прошлом, которое помогает вашему товарищу сейчас, или объяснить, как вы предвидели эту ситуацию и заранее продумали полезный запасной план, который раскрываете теперь.
- id: fortitude
  name: Стойкость
  description: |-
    Вы можете потратить свою **особую броню**, чтобы сопротивляться последствию усталости, слабости или химического воздействия или чтобы **поднажать** при работе, требующей технического мастерства, или при обращении с алхимическими веществами.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы «сопротивляетесь последствию» подходящего вида, вы полностью его избегаете. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: infiltrator
  name: Проникновение
  description: |-
    На вас не влияют **качество** и **Ранг**, когда вы обходите меры безопасности.

    > Это умение позволяет вам на равных тягаться с противниками более высокого Ранга. Когда вы взламываете сейф, вскрываете замок или крадётесь мимо элитной охраны, ваш уровень эффекта никогда не снижается из-за превосходящего Ранга или уровня качества противодействия.
    >
    > Вы знаменитый взломщик сейфов? Рассказывают ли люди, как вы проскользнули под носом у двух старших инспекторов, или ваши исключительные таланты ещё не раскрыты?
- id: iron-will
  name: Железная воля
  description: |-
    Вы невосприимчивы к ужасу, который некоторые сверхъестественные существа внушают одним своим видом. Когда вы совершаете **бросок сопротивления** с использованием **Воли**, берите **+1d**.

    > С этим умением вы не цепенеете и не бежите при встрече с любым сверхъестественным существом или странным оккультным событием.
- id: leader
  name: Предводитель
  description: |-
    Когда вы отдаёте **Приказ** **подручным** в бою, они продолжают сражаться, даже если иначе **сломались** бы (их не выводят из строя при вреде уровня 3). Они получают **+1 эффект** и **1 броню**.

    > Это умение делает ваших подручных эффективнее в бою и позволяет им сопротивляться вреду с помощью брони. Пока вы ведёте их, они не прекратят сражаться, пока не получат смертельный вред (уровня 4) или пока вы не прикажете остановиться. Что вы делаете, чтобы вдохновить такую храбрость в бою?
- id: like-looking-into-a-mirror
  name: Как в зеркало глядеть
  description: |-
    Вы всегда можете определить, когда вам лгут.

    > Это умение работает во всех ситуациях без ограничений. Оно очень сильное, но и немного проклятие. Вы видите насквозь любую ложь, даже добрую.
- id: mastermind
  name: Вдохновитель
  description: |-
    Вы можете потратить свою **особую броню**, чтобы **защитить** товарища по команде или чтобы **поднажать**, когда вы собираете сведения или работаете над долгосрочным проектом.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы защищаете товарища, это умение отменяет или смягчает последствие или вред, с которым он сталкивается. Вам не нужно присутствовать, чтобы использовать это умение: скажите, как вы подготовились к этой ситуации в прошлом. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: mesmerism
  name: Гипноз
  description: |-
    Когда вы оказываете **Влияние** на кого-то, вы можете сделать так, что он забудет об этом до тех пор, пока в следующий раз не встретится с вами.

    > Память жертвы «замазывает» пропущенное время, поэтому то, что она что-то забыла, не вызывает подозрений. Когда вы в следующий раз встретитесь с жертвой, она ясно вспомнит всё, включая странное действие этого умения.
- id: mule
  name: Вьючная лошадь
  description: |-
    Ваши пределы ноши выше. Лёгкая: 5. Обычная: 7. Тяжёлая: 8.

    > Это умение отлично подходит, если вы хотите носить тяжёлую броню и тяжёлое оружие, не привлекая лишнего внимания. Поскольку ваше точное снаряжение определяется на ходу во время операции, большая ноша также даёт вам больше возможностей для творчества при решении проблем во время дела.
- id: not-to-be-trifled-with
  name: С ним шутки плохи
  description: |-
    Вы можете **поднажать**, чтобы сделать одно из следующего: *совершить подвиг физической силы на грани сверхчеловеческого — на равных вступить в ближний бой с небольшой бандой.*

    > Когда вы поднажимаете, чтобы задействовать это умение, вы всё равно получаете одно из обычных преимуществ нажима (+1d, +1 эффект и так далее) в дополнение к особому умению.
    >
    > Если вы совершаете подвиг на грани сверхчеловеческого, вы можете, например, голыми руками сломать металлическое оружие, повалить скачущую лошадь, поднять огромный вес и так далее. Если вы вступаете в бой с небольшой бандой на равных, вы не получаете сниженный эффект из-за масштаба против небольшой банды (до шести человек).
- id: reflexes
  name: Рефлексы
  description: |-
    Когда возникает вопрос, кто действует первым, ответ: вы.

    > Это умение даёт вам инициативу в большинстве ситуаций. Некоторые специально обученные НИП тоже могут обладать рефлексами, но в остальных случаях вы всегда действуете первым и можете перебить любого, кто пытается вас опередить. Это умение обычно не отменяет необходимость делать бросок действия, который вам иначе пришлось бы сделать, но может улучшить вашу позицию или эффект.
- id: ritual
  name: Ритуал
  description: |-
    Вы знаете тайные методы совершения ритуальной магии. Вы можете **Изучить** оккультный ритуал (или создать новый), чтобы призвать сверхъестественный эффект или существо. Вы начинаете игру, уже зная один ритуал.

    > Без этого особого умения изучение и практика ритуалов оставляют вас совершенно беззащитным перед силами, которых вы молите. Такие занятия не рекомендуются.
- id: rooks-gambit
  name: Гамбит ладьи
  description: |-
    Получите **2 стресса**, чтобы бросить ваш лучший рейтинг действия, выполняя другое действие. Скажите, как вы приспосабливаете своё мастерство к этому случаю.

    > Это умение «на все руки мастера». Если вы хотите пробовать много разных видов действий и при этом иметь хороший пул кубов для броска, это особое умение для вас.
- id: saboteur
  name: Диверсант
  description: |-
    Когда вы занимаетесь **Разрушением**, ваша работа гораздо тише, чем должна быть, а ущерб очень хорошо скрыт от беглого осмотра.

    > Вы можете сверлить отверстия, плавить вещи кислотой и даже использовать приглушённую взрывчатку, и всё это будет очень тихо и крайне трудно заметить.
