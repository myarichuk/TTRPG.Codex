- id: a-little-something-on-the-side
  name: Небольшой приработок
  description: |-
    В конце каждой фазы свободного времени вы получаете **+2 к заначке**.

    > Эти деньги приходят в конце свободного времени, после того как разыграны все его занятия, поэтому вы не можете взять их из заначки и потратить на дополнительные занятия до следующей фазы свободного времени.
- id: alchemist
  name: Алхимик
  description: |-
    Когда вы **изобретаете** или **создаёте** творение с *алхимическими* свойствами, вы получаете **+1 уровень результата** к броску (**1-3** становится **4/5** и так далее). Вы начинаете игру, уже зная одну особую формулу.

    > Пройдите с Мастером порядок изобретения, чтобы определить вашу первую особую алхимическую формулу.
- id: ambush
  name: Засада
  description: |-
    Когда вы нападаете из укрытия или захлопываете ловушку, вы получаете **+1d** к броску.

    > Это умение выигрывает от подготовки, так что не забывайте, что подготовиться можно во флэшбэке.
- id: analyst
  name: Аналитик
  description: Во время свободного времени вы получаете **две отметки**, которые можно распределить между любыми часами долгосрочных проектов, связанных с расследованием или изучением новой формулы или плана конструкции.
- id: arcane-fighter
  name: Мистический боец
  description: |-
    Вы можете наделять свои руки, оружие ближнего боя или инструменты энергией духов. Вы получаете **мощь** в бою против сверхъестественного.

    > Когда вы наполняете себя тайной энергией, как вы это делаете? Как выглядит эта энергия, когда проявляется?
- id: arcane-mind
  name: Мистический разум
  description: Вы всегда чувствуете присутствие сверхъестественных существ рядом с собой. Берите **+1d**, когда вы любым способом осуществляете **сбор сведений** о сверхъестественном.
- id: artificer
  name: Искусник
  description: |-
    Когда вы **изобретаете** или **создаёте** творение со свойствами *искрового мастерства*, вы получаете **+1 уровень результата** к броску (**1-3** становится **4/5** и так далее). Вы начинаете игру, уже зная одну особую конструкцию.

    > Пройдите с Мастером порядок изобретения, чтобы определить вашу первую конструкцию искрового мастерства.
- id: battleborn
  name: Рождённый для боя
  description: |-
    Вы можете потратить свою **особую броню**, чтобы уменьшить вред от атаки в бою или чтобы **поднажать** во время схватки.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы «уменьшаете вред», то уровень вреда, с которым вы сейчас столкнулись, снижается на один. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: bodyguard
  name: Телохранитель
  description: |-
    Когда вы **защищаете** товарища по команде, берите **+1d** к броску сопротивления. Когда вы собираете сведения, чтобы предугадать возможные угрозы в текущей ситуации, вы получаете **+1 эффект**.

    > Приём командной игры «защитить» позволяет вам принять последствие за товарища. Если вы решаете сопротивляться этому последствию, это умение даёт вам +1d к броску сопротивления. Кроме того, когда вы оцениваете обстановку, чтобы собрать сведения о скрытых опасностях или возможных нападающих, вы получаете +1 эффект, а это значит более подробные сведения.
- id: calculating
  name: Расчётливый
  description: |-
    Благодаря тщательному планированию во время свободного времени вы можете дать себе или другому участнику команды **+1 занятие в свободное время**.

    > Если вы забыли применить это умение во время свободного времени, вы всё равно можете задействовать его во время дела и вернуться во флэшбэке к предыдущему свободному времени, когда проводилось это дополнительное занятие.
- id: connected
  name: Со связями
  description: |-
    Во время свободного времени вы получаете **+1 уровень результата**, когда **добываете ресурс** или **снижаете жар**.

    > Ваши подпольные связи можно использовать, чтобы одолжить ресурсы, надавить на торговца ради лучшей цены, запугать свидетелей и так далее.
- id: daredevil
  name: Сорвиголова
  description: |-
    Когда вы совершаете **отчаянное** действие, вы получаете **+1d** к броску, если при этом берёте **-1d** к любым броскам сопротивления последствиям вашего действия.

    > Это особое умение — небольшая азартная игра. Дополнительный куб помогает вам, но если вы получите последствия, сопротивляться им, скорее всего, будет дороже. Но вы же сорвиголова, так что ничего страшного, верно?
- id: expertise
  name: Мастерство
  description: |-
    Выберите один из ваших рейтингов действий. Когда вы возглавляете групповое действие этим действием, вы можете получить не более 1 стресса, независимо от числа проваленных бросков.

    > Это особое умение хорошо подходит, чтобы прикрывать команду. Если все остальные плохи в вашем любимом действии, вам не нужно беспокоиться о том, что вы получите много стресса, возглавляя их групповое действие.
- id: focused
  name: Сосредоточенный
  description: |-
    Вы можете потратить свою **особую броню**, чтобы сопротивляться последствию внезапности или душевного вреда (страх, смятение, потеря из виду человека) или чтобы **поднажать** в дальнем бою или при выслеживании.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы «сопротивляетесь последствию» подходящего вида, вы полностью его избегаете. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
