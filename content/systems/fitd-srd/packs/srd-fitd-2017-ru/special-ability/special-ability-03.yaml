- id: savage
  name: Дикарь
  description: |-
    Когда вы применяете физическое насилие, это особенно пугает. Когда вы отдаёте **Приказ** напуганной цели, берите **+1d**.

    > Вы внушаете страх окружающим, когда становитесь жестоким. Как они отреагируют, зависит от человека. Одни убегут от вас, другие будут впечатлены, третьи ответят насилием. Реакцию конкретного НИП определяет Мастер.
    >
    > Кроме того, когда вы отдаёте **Приказ** тому, кто охвачен страхом (от этого умения или иначе), берите +1d к броску.
- id: scout
  name: Разведчик
  description: |-
    Когда вы собираете сведения, чтобы узнать местонахождение цели, вы получаете **+1 эффект**. Когда вы прячетесь в подготовленной позиции или используете маскировку, вы получаете **+1d** к броскам, чтобы остаться незамеченным.

    > «Целью» может быть человек, место назначения, хорошее место для засады, предмет и так далее.
- id: shadow
  name: Тень
  description: |-
    Вы можете потратить свою **особую броню**, чтобы сопротивляться последствию обнаружения или мер безопасности или чтобы **поднажать** ради подвига ловкости или скрытности.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы «сопротивляетесь последствию» подходящего вида, вы полностью его избегаете. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: sharpshooter
  name: Меткий стрелок
  description: |-
    Вы можете **поднажать**, чтобы сделать одно из следующего: *совершить дальнюю атаку на предельной дистанции, превышающей обычную для оружия — обрушить шквал скорострельного огня, чтобы подавить противника.*

    > Когда вы поднажимаете, чтобы задействовать это умение, вы всё равно получаете одно из обычных преимуществ нажима (+1d, +1 эффект и так далее) в дополнение к особому умению.
    >
    > Первое применение этого умения позволяет вам пытаться делать дальние снайперские выстрелы, которые иначе были бы невозможны с типичным примитивным огнестрельным оружием. Второе позволяет вам поддерживать устойчивый темп стрельбы в бою (достаточный, чтобы «подавить» небольшую банду до шести человек), вместо того чтобы останавливаться на медленную перезарядку или бросать оружие после каждого выстрела. Когда противник подавлен, он неохотно маневрирует или атакует (обычно для этого требуется бросок удачи, чтобы проверить, сможет ли он).
- id: strange-methods
  name: Странные методы
  description: |-
    Когда вы **изобретаете** или **создаёте** творение с *тайными* свойствами, получите **+1 уровень результата** к броску (**1-3** становится **4/5** и так далее). Вы начинаете игру, уже зная одну тайную конструкцию.

    > Пройдите с Мастером порядок изобретения, чтобы определить вашу первую тайную конструкцию.
- id: subterfuge
  name: Уловки
  description: |-
    Вы можете потратить свою **особую броню**, чтобы сопротивляться последствию подозрений или убеждения или чтобы **поднажать** ради обмана.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы «сопротивляетесь последствию» подходящего вида, вы полностью его избегаете. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: supernatural-ward
  name: Сверхъестественный оберег
  description: |-
    Когда вы устраиваете **Разрушение** в месте с помощью тайных веществ, делая его непригодным для любого другого использования, оно становится ненавистным или притягательным для сверхъестественного (на ваш выбор).

    > Если вы делаете место ненавистным для сверхъестественного, оно сделает всё, чтобы его избегать, и будет мучиться, если его заставят войти. Если вы делаете место притягательным для духов, они будут стремиться туда и задерживаться, и будут мучиться, если их заставят уйти. Этот эффект длится несколько дней на площади размером с небольшую комнату. Особенно могущественные или подготовленные существа могут бросать своё качество или тайную силу, чтобы проверить, насколько хорошо они способны сопротивляться эффекту.
- id: the-devils-footsteps
  name: Поступь дьявола
  description: |-
    Вы можете **поднажать**, чтобы сделать одно из следующего: *совершить подвиг ловкости на грани сверхчеловеческого — маневрировать так, чтобы сбить врагов с толку и они по ошибке напали друг на друга.*

    > Когда вы поднажимаете, чтобы задействовать это умение, вы всё равно получаете одно из обычных преимуществ нажима (+1d, +1 эффект и так далее), если делаете бросок, в дополнение к особому умению.
    >
    > Если вы совершаете подвиг ловкости (бег, кувырки, равновесие, лазание и так далее) на грани сверхчеловеческого, вы можете, например, взобраться по отвесной поверхности без хороших зацепок, безопасно кувыркнуться при падении с высоты трёх этажей, перепрыгнуть поразительное расстояние и так далее.
    >
    > Если вы маневрируете, чтобы сбить врагов с толку, они какое-то время нападают друг на друга, пока не поймут свою ошибку. Мастер может сделать бросок удачи, чтобы определить, насколько сильно они навредят друг другу или помешают.
- id: tough-as-nails
  name: Крепкий орешек
  description: |-
    Штрафы от вреда на один уровень мягче (хотя вред уровня 4 по-прежнему смертелен).

    > С этим умением вред уровня 3 не выводит вас из строя; вместо этого вы берёте -1d к броскам (как при вреде уровня 2). Вред уровня 2 действует на вас как вред уровня 1 (меньший эффект). Вред уровня 1 на вас не действует (но вы всё равно записываете его на лист и должны выздороветь, чтобы его вылечить). Записывайте вред с исходным уровнем: для лечения действует исходный уровень вреда.
- id: trust-in-me
  name: Доверься мне
  description: |-
    Вы получаете **+1d** против цели, с которой у вас близкие отношения.

    > Это умение не только для общения. Бонус может получить любое действие. «Близкие» отношения определяете вы и группа; это не обязательно только романтическая близость.
- id: vengeful
  name: Мстительный
  description: 'Вы получаете дополнительный **триггер опыта**: *вы отплатили тому, кто навредил вам или тому, о ком вы заботитесь.* Если вам помогла в этом команда, отметьте также опыт команды.'
- id: vigorous
  name: Живучий
  description: |-
    Вы быстрее оправляетесь от вреда. Навсегда закрасьте одно из делений ваших часов лечения. Берите **+1d** к броскам лечения.

    > Ваши часы лечения становятся часами на 3 деления, и вы получаете дополнительный куб при выздоровлении.
- id: warded
  name: Под защитой
  description: |-
    Вы можете потратить свою **особую броню**, чтобы сопротивляться сверхъестественному последствию или чтобы **поднажать**, когда вы противостоите тайным силам или используете их.

    > Когда вы используете это умение, отметьте клетку особой брони на листе плейбука. Если вы сопротивляетесь последствию, это умение отменяет его или смягчает его тяжесть. Если вы используете это умение, чтобы поднажать, вы получаете одно из преимуществ (+1d, +1 эффект, действовать несмотря на тяжёлый вред), но не получаете 2 стресса. Ваша особая броня восстанавливается в начале свободного времени.
- id: weaving-the-web
  name: Плетение паутины
  description: |-
    Вы получаете **+1d** к **Знакомствам**, когда собираете сведения о цели для дела. Вы получаете **+1d** к **броску завязки** для этой операции.

    > Ваша сеть подпольных связей всегда может быть использована, чтобы получить представление о деле, даже когда ваши знакомые не знают, что помогают вам.
