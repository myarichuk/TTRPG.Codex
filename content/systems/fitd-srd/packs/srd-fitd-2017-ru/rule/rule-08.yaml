- id: gathering-information-examples-questions-gather-information
  name: СБОР СВЕДЕНИЙ
  description: |-
    *Задайте вопрос и сделайте бросок действия или бросок удачи. Мастер (GM) честно отвечает вам, а степень подробности ответа зависит от уровня эффекта.*


    **Большой**: вы получаете исключительно подробные сведения. Информация полная, а уточняющие вопросы могут привести к смежным темам или раскрыть больше, чем вы надеялись.


    **Стандартный**: вы получаете хорошие подробности. Можно задавать уточняющие и дополнительные вопросы.


    **Ограниченный**: вы получаете неполные или частичные сведения. Чтобы узнать всё, придётся продолжить поиски.
- id: gathering-information-investigation
  name: Расследование
  description: |-
    Некоторые вопросы слишком сложны, чтобы ответить на них сразу одним броском сбора сведений. Например, вы хотите выяснить, как устроена сеть контрабандных маршрутов в городе. В таких случаях Мастер (GM) предложит начать **долгосрочный проект**, над которым вы работаете в **свободное время**.


    Вы отслеживаете проект расследования с помощью часов прогресса. Когда часы заполнены, у вас есть доказательства, чтобы задать несколько вопросов по предмету расследования так, как если бы у вас был большой эффект.
- id: heat
  name: Жар
  description: |-
    В городе полно любопытных глаз и осведомителей. Всё, что вы делаете, могут увидеть, и всегда остаются улики. Чтобы отразить это, ваша команда накапливает **жар** по мере совершения преступлений. После дела или столкновения с противником команда получает **жар** в зависимости от характера операции:


    * **0 жара**: гладко и тихо; низкая заметность.
    * **2 жара**: сдержанно; стандартный уровень заметности.
    * **4 жара** : шумно и хаотично; высокая заметность.
    * **6 жара**: дико; разрушительная заметность.


    Добавьте +1 **жар** за громкую или влиятельную цель. Добавьте +1 **жар**, если всё случилось на вражеской территории. Добавьте +1 **жар**, если вы воюете с другой фракцией. Добавьте +2 **жара**, если не обошлось без убийства (убивала команда или нет — трупы привлекают внимание).


    Уровень **жара** вы отмечаете на шкале **жара** в листе команды.


    ---


    |                                                                 **Жар**                                                                 |                     **Уровень розыска**                     |
    | :--------------------------------------------------------------------------------------------------------------------------------------: | :------------------------------------------------------: |
    | ⊗ ⊗ ⊗ ○ ○ ○ ○ ○ ○ | □ □ □ □ |


    ---


    Когда ваш уровень **жара** достигает 9, вы получаете **уровень розыска** и обнуляете **жар** (лишний **жар** «переносится», так что если у вас было 7 **жара** и вы получили 4 **жара**, после сброса у вас отмечено 2 **жара**).


    Чем выше ваш **уровень розыска**, тем серьёзнее ответ, когда закон принимается за вас (против вас вышлют силы более высокого **качества** и **масштаба**).


    Кроме того, ваш **уровень розыска** влияет на тяжесть **хвостов**, которые ждут вашу команду после дела.
- id: heat-incarceration
  name: Заключение
  description: |-
    Единственный способ снизить **уровень розыска** команды — заключение. Когда член вашей команды, друг, контакт или подставленный враг осуждён и заключён в тюрьму за преступления, связанные с вашей командой, ваш **уровень розыска** снижается на 1, а **жар** обнуляется.


    Заключение может стать итогом расследования и ареста стражами порядка или тем, что кто-то сдаётся сам и берёт на себя вину за преступления команды.


    Суровость тюремного срока зависит от вашего **уровня розыска**:


    * **Уровень розыска 4**: пожизненное или казнь.
    * **Уровень розыска 3**: год или два.
    * **Уровень розыска 2**: несколько месяцев.
    * **Уровень розыска 1**: месяц или два.
    * **Уровень розыска 0**: несколько недель. Либо констебли устраивают вам взбучку в назидание (вы получаете вред 3 уровня, бросок сопротивления не допускается — они бьют, пока вы не окажетесь ранены).


    Заключение бесчеловечно и жестоко. Единственная настоящая защита внутри — известность вашей команды. Когда вы отбываете срок, сделайте **бросок заключения**, взяв в качестве пула кубов ранг вашей команды.
- id: heat-incarceration-incarceration-roll
  name: БРОСОК ЗАКЛЮЧЕНИЯ
  description: |-
    * **Критический успех**: вы создаёте себе имя внутри. Ваша команда получает **+3** **репутации**, **1 тюремное притязание** и **+1 к статусу фракции** у фракции, которой вы помогали, пока отбывали срок.
    * **6**: вы отбываете срок достойно. Ваша команда получает **1 тюремное притязание** и **+1 к статусу фракции** у фракции, которой вы помогали, пока отбывали срок.
    * **4/5**: вы не высовываетесь и отбываете срок без происшествий.
    * **1-3**: это ужасно. Вы получаете один уровень травмы от пережитого.
- id: heat-prison-claims-allied-claim
  name: Союзное притязание
  description: |-
    Один из ваших союзников внутри договаривается, чтобы его фракция оказала вам услугу. Возьмите для вашей команды притязание из другого типа команды. Территорию с этим притязанием взять нельзя.
- id: heat-prison-claims-cell-block-control
  name: Власть над камерным блоком
  description: |-
    Ваша команда полностью контролирует камерный блок, включая охрану. Вы никогда не получаете **травму** от заключения.
- id: heat-prison-claims-claims-prison
  name: "ПРИТЯЗАНИЯ: ТЮРЬМА"
  description: |-
    |              |          |            |          |              |          |                    |
    | :--------------: | :------: | :--------: | :------: | :----------: | :------: | :----------------: |
    | Влияние на условно-досрочное | ― | Контрабанда  | ― | Союзное притязание |          | Власть над камерным блоком |
    |     ❘     |          |  ❘  |          |   ❘   |          |      ❘      |
    |   Подкуп охраны   | ― | **ТЮРЬМА** | ― | Подкуп охраны | ― |    Союзное притязание    |
    |     ❘     |          |  ❘  |          |   ❘   |          |      ❘      |
    |     Закоренелый зэк     | ― | Контрабанда  | ― | Союзное притязание | ― |    Союзное притязание    |
- id: heat-prison-claims-guard-payoff
  name: Подкуп охраны
  description: |-
    Несколько тюремных охранников у вас на содержании. Берите +1d к броску ранга, когда член вашей команды оказывается в заключении.
- id: heat-prison-claims-hardcase
  name: Закоренелый зэк
  description: |-
    Ваша репутация крутого арестанта укрепляет образ команды. Когда ваша команда повышает ранг, это стоит на 2 **монеты** меньше обычного.
- id: heat-prison-claims-parole-influence
  name: Влияние на условно-досрочное
  description: |-
    На магистратов и начальника тюрьмы, которые решают судьбу приговорённых, можно оказывать разного рода политическое давление. С этим притязанием вы всегда можете добиться более короткого срока, как если бы ваш **уровень розыска** был на 1 ниже. Так, если при заходе в тюрьму ваш **уровень розыска** был 3, вы проведёте за решёткой лишь несколько месяцев (как при уровне 2), а не целый год.
- id: heat-prison-claims-smuggling
  name: Контрабанда
  description: |-
    Вы налаживаете контрабандные каналы внутри. Пока вы в заключении, у вас **+2 ноши** (отсчёт для заключённого начинается с нуля). Если вы берёте это притязание дважды, то в заключении в Айронхуке у вас будет 4 ноши. Кроме того, вы можете взять с собой **монеты** вместо ноши — для взяток или получения ресурсов в тюрьме. Вы можете менять предметы в вашем тюремном наборе всякий раз, когда у вашей команды наступает свободное время.
- id: magnitude
  name: Величина
  description: |-
    У сверхъестественных существ и сил очень разные эффекты и уровни мощи. Чтобы Мастеру (GM) было проще судить о них последовательно, предусмотрена шкала **величины**. См. сводную таблицу величин справа. Величина измеряет уровень качества призрака или демона либо разные стороны тайной силы: её область, масштаб, длительность, дальность и мощь. Когда нужно оценить существо или силу, используйте шкалу величины как ориентир, чтобы судить, как оно соотносится с примерами в таблице.


    Вы можете использовать величину существа или силы как пул кубов для **броска удачи**, чтобы узнать, насколько велик её эффект, если это не очевидно или не определено.


    > Морской демон вызывает сокрушительную волну у канального причала, где персонажи игроков высаживаются с лодки. Насколько сильно это повредит судну и команде? Очевидно, им придётся плохо, но они просто начнут тонуть или судно сразу разобьёт и потопит? Мастер делает бросок удачи, используя 6d (величину демона). При **1-3** у волны лишь небольшой эффект (для огромной волны): судно набирает воду и начинает тонуть. При **4-5** у волны меньший эффект: судно полностью захлёстывает, а часть персонажей и груза смывает за борт. При **6** у волны полный эффект: судно мгновенно тонет и утаскивает под воду команду и груз. При **критическом успехе** судно тонет, а команду и груз к тому же тяжело ранят летящие обломки и сокрушительная сила волны.


    Вы можете складывать уровни величины, чтобы описать сочетание эффектов, или просто сосредоточиться на одной ключевой черте, игнорируя остальные, даже если они есть на шкале величины. Они не *всегда* складываются.


    > В примере выше демон создал мощь величины 6, а Мастер включил её область действия «бесплатно» как часть силы. Огромная волна у причала, по его суждению, должна задеть тамошние лодки и их команды.
    >
    > В другой игровой сессии Шёпот хочет провести ритуал, который обрушит ураган на весь район. Мастер говорит, что это очень значительный эффект, поэтому складывает два уровня величины: *мощь 6* и *дальность 5*. Чтобы создать такую разрушительную силу, Шёпот получит 11 стресса! Мастер предлагает компромисс: ритуал займёт несколько часов, поэтому цена в стрессе снижается до 8, но некоторые люди в зоне действия могут понять, что происходит, и бежать до того, как грянет вся буря.*


    Таблица величин — это инструмент, помогающий Мастеру принимать решения. Она не должна быть жёстким ограничением или математической формулой, заменяющей такие решения. Используйте уровни как *ориентир*, чтобы назначить число величины, которое кажется вам подходящим.


    Эту таблицу можно использовать и как ориентир **уровня качества**, когда персонаж **добывает ресурс** или создаёт **алхимическое средство** или **устройство**.
- id: magnitude-area-scale
  name: ОБЛАСТЬ/МАСШТАБ
  description: |-
    |       0       |         1          |              2              |         3         |        4         |          5          |           6           |
