    |   Чулан    |    Небольшая комната    | Большая комната и несколько комнат | Небольшое здание  | Большое здание |    Городской квартал     |                       |
    | 1 или 2 человека | Небольшая банда (3-6) |     Средняя банда (12)      | Большая банда (20) | Огромная банда (40) | Массивная банда (80) | Колоссальная банда (160) |
