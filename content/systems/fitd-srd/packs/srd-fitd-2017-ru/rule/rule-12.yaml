- id: the-core-system-the-game-structure
  name: Структура игры
  description: |-
    В *Blades in the Dark* игра строится из четырёх частей. По умолчанию игра идёт в режиме **свободной игры**: персонажи разговаривают друг с другом, ходят по городу, что-то делают и совершают броски, когда это нужно.

    Когда группа готова, она выбирает *цель* для следующей операции, а затем тип *плана*. Это запускает *бросок завязки* (он задаёт ситуацию в начале операции), после чего игра переходит в фазу **дела**.

    Во время дела персонажи игроков приступают к цели: совершают броски, преодолевают препятствия, обращаются к флэшбэкам и доводят операцию до конца (успешно или нет). Когда дело закончено, игра переходит в фазу **свободного времени**.

    Во время свободного времени Мастер (GM) обращается к системам *добычи*, *жара* и *хвостов*, чтобы определить все последствия дела. Затем каждый персонаж получает свои *занятия в свободное время*: например, предаётся пороку, чтобы снять стресс, или работает над долгосрочным проектом. Когда все занятия в свободное время завершены, игра возвращается к **свободной игре**, и цикл начинается заново.

    Фазы — это условная модель, которая помогает организовать игру. Они не задуманы как жёсткие рамки, ограничивающие ваш выбор (поэтому их и изображают бесформенными кляксами туши без чётких границ). Воспринимайте фазы как меню вариантов, из которого можно выбрать то, что подходит вашей цели в игре. Каждая фаза годится для своей задачи.
- id: the-faction-game-claims
  name: Притязания
  description: |-
    На листе каждой команды есть карта притязаний, которые можно захватить. На карте притязаний показан типовой маршрут для вашего типа команды. Обычно притязания захватывают по порядку, следуя по путям от центральной клетки — логова команды.

    *Однако вы можете попытаться захватить любое притязание на своей карте*, не следуя путям (или даже поискать особое притязание, которого нет на вашей карте), но такие операции всегда особенно трудны, и чтобы найти такое притязание и добиться своего, потребуются исключительные усилия.
- id: the-faction-game-claims-losing-a-claim
  name: Потеря притязания
  description: Вражеская фракция может попытаться захватить притязание, которым владеет ваша команда. В зависимости от ситуации вы можете сражаться, чтобы удержать его, или договориться с этой фракцией. Если вы теряете притязание, вы теряете все его преимущества. Если потеряно ваше логово, вы теряете преимущества всех своих притязаний, пока не восстановите логово или не обустроите новое. Чтобы восстановить логово или обустроить новое, проведите для этого дело.
- id: the-faction-game-claims-seizing-a-claim
  name: Захват притязания
  description: |-
    Каждое притязание уже находится под контролем какой-либо фракции. Чтобы получить его себе, придётся отнять его у другого. Чтобы захватить притязание, скажите Мастеру (GM), какое притязание на вашей карте команда собирается взять. Мастер опишет притязание: назовёт место, даст описание и скажет, какая фракция сейчас им владеет. Либо, если есть подходящие варианты, Мастер может предложить вам выбрать из нескольких.

    Если вы решили не следовать путям на карте при захвате притязания, Мастер может сказать, что вам нужно сначала провести расследование и собрать сведения, чтобы найти притязание такого типа, и лишь потом пытаться его захватить.

    Проведите операцию как любое другое **дело**: если вы добьётесь успеха, вы захватываете притязание, а фракция, на которую вы нацелились, его теряет.

    Захват притязания — серьёзное нападение на фракцию. Обычно он приводит к -2 к статусу у этой фракции и, возможно, к +1 к статусу у её врагов.

    Как только вы захватываете притязание, вы пользуетесь указанным в нём преимуществом, пока удерживаете его. Некоторые притязания считаются **территорией**. Другие дают команде особые преимущества: например, бонусные кубы в определённых обстоятельствах, дополнительные **монеты** в казну команды или новые возможности для действий.
- id: the-faction-game-development
  name: Развитие
  description: |-
    Чтобы подняться по лестнице и развить свою команду, вам нужна **репутация**. **Репутация** — это мера влияния и известности. Когда вы накапливаете достаточно **репутации**, другие фракции начинают относиться к вам серьёзнее, и вы привлекаете поддержку, нужную для развития и роста.

    Когда вы завершаете дело, команда получает **2 репутации**. Если цель дела выше вашей команды по рангу, вы получаете **+1 репутации** за каждый ранг разницы. Если цель дела ниже рангом, вы получаете **-1 репутации** за каждый ранг разницы (но не меньше нуля).

    Чтобы заполнить шкалу **репутации** на листе команды, нужно **12 репутации**. Когда вы заполняете шкалу, сделайте одно из следующего:

    * Если ваш контроль слабый, он становится сильным. **Сбросьте репутацию до нуля**.
    * Если ваш контроль сильный, вы можете заплатить, чтобы повысить ранг команды на один. Это стоит **монет** в размере **нового ранга × 8**. Пока шкала **репутации** заполнена, новая **репутация** не начисляется (максимум 12). Когда вы заплатили и повысили ранг, **сбросьте репутацию до нуля** и **понизьте контроль до слабого**.
- id: the-faction-game-faction-status
  name: Статус фракции
  description: |-
    **Статус** вашей команды у каждой фракции показывает, насколько вас любят или ненавидят. Статус оценивается от -3 до +3; нейтральный, нулевой статус — начальный по умолчанию. Статус у каждой фракции вы отмечаете на листе фракций.

    При создании команды вы назначаете несколько положительных и отрицательных значений статуса, отражающих недавнюю историю. Дальше значения будут меняться в зависимости от ваших действий в игре.
- id: the-faction-game-faction-status-faction-status-changes
  name: Изменения статуса фракции
  description: Когда вы проводите операцию, вы получаете -1 или -2 к статусу у фракций, которым ваши действия вредят. Вы также можете получить +1 к статусу у фракции, которой ваша операция помогает. (Если вы проведёте операцию совершенно тихо, ваш статус не изменится.) Статус может измениться и тогда, когда вы оказываете услугу фракции или отказываетесь выполнить её требование.
- id: the-faction-game-faction-status-faction-status-levels
  name: Уровни статуса фракции
  description: |-
    * **+3: Союзники.** Эта фракция поможет вам, даже если ей это невыгодно. Она ждёт от вас того же.
    * **+2: Дружественная.** Эта фракция поможет вам, если это не создаст ей серьёзных проблем. Она ждёт от вас того же.
    * **+1: Благожелательная.** Эта фракция поможет вам, если это не создаст ей проблем и не потребует значительных затрат. Она ждёт от вас того же.
    * **0: Нейтральная**
    * **-1: Мешающая.** Эта фракция будет искать случая насолить вам (или нажиться на вашей беде), пока это не создаёт ей проблем и не требует значительных затрат. Она ждёт от вас того же.
    * **-2: Враждебная.** Эта фракция будет искать случая навредить вам, пока это не создаёт ей серьёзных проблем. Она ждёт от вас того же и принимает против вас меры предосторожности.
    * **-3: Война.** Эта фракция будет из кожи вон лезть, чтобы навредить вам, даже если ей это невыгодно. Она ждёт от вас того же и принимает против вас меры предосторожности. Пока вы воюете с любым числом фракций, ваша команда получает +1 **жара** от дел, временно теряет 1 уровень контроля, а персонажи игроков получают лишь одно занятие в свободное время вместо двух. Закончить войну можно, уничтожив врага или договорившись о взаимном соглашении и установив новое значение статуса.

    > Если в начале войны у вашей команды слабый контроль, из-за временной потери контроля вы теряете один ранг. Когда война закончится, верните команде тот ранг, который был до войны.
- id: the-faction-game-hold
  name: Контроль
  description: На лестнице фракций рядом с номерами рангов стоит буква, обозначающая силу **контроля** каждой фракции. Контроль показывает, насколько хорошо фракция способна удерживать своё нынешнее место на лестнице. W обозначает **слабый** контроль. S обозначает **сильный** контроль. Ваша команда начинает с **сильным** контролем на **ранге 0**.
- id: the-faction-game-tier
  name: Ранг
  description: |-
    Каждая заметная фракция имеет **ранг** — меру богатства, влияния и масштаба. На высшем уровне стоят фракции ранга V и VI — настоящие властители города. Ваша команда начинает с ранга 0.

    Рангом вы будете пользоваться, бросая кубы при приобретении ресурса, а также при любом броске удачи, где главным показателем служит общая мощь и влияние вашей команды. Но важнее всего то, что ваш ранг определяет **уровень качества** ваших предметов, а также качество и **масштаб** банд, которые нанимает ваша команда, а значит, и то, с врагами какого размера вы сможете справиться.
- id: the-faction-game-tier-gang-scale-by-tier
  name: Масштаб банд по рангам
  description: |-
    * **ранг V**. Огромные банды. (80 человек)
    * **ранг IV**. Крупнейшие банды. (40 человек)
    * **ранг III**. Большие банды. (20 человек)
    * **ранг II**. Средние банды. (12 человек)
    * **ранг I**. Малые банды. (3-6 человек)
    * **ранг 0**. 1 или 2 человека
- id: the-faction-game-turf
  name: Территория
  description: |-
    Ещё один способ способствовать развитию команды — приобрести **территорию**. Когда вы захватываете и удерживаете земли, вы создаёте более устойчивую основу для своей **репутации**. Каждый участок территории, который вы заявили своим, означает условную поддержку команды (нередко это следствие страха, который вы внушаете горожанам на этой территории).

    Территория отмечается на шкале **репутации** (см. пример ниже). Каждый удерживаемый участок территории снижает на единицу **репутацию**, необходимую для развития. Так, если у вас 2 территории, для развития нужно 10 **репутации**. Если у вас 4 территории, нужно 8 **репутации**. **Вы можете удерживать не более 6 территорий.** Когда вы развиваетесь и сбрасываете **репутацию**, **отметки всех удерживаемых территорий остаются.**

    ---

    *Если вы удерживаете 3 участка территории, для развития вам нужно всего 9 **репутации** вместо 12.*

    | **Репутация** |          |          |          |          |          |          |     |          |          |          |          |          |          | **Территория** |
    | ------- | -------- | -------- | -------- | -------- | -------- | -------- | --- | -------- | -------- | -------- | -------- | -------- | -------- | -------- |
    |         | ○ | ○ | ○ | ○ | ○ | ○ |     | ○ | ○ | ○ | ⊗ | ⊗ | ⊗ |          |

    *Когда вы развиваетесь, вы стираете 9 отметок **репутации**, но сохраняете 3 отметки территории. Отмечайте территорию справа, чтобы показать «потолок» того, сколько **репутации** нужно.*

    ---

    Кроме того, когда вы приобретаете территорию, расширяются **охотничьи угодья** вашей команды.
- id: the-faction-game-turf-reducing-hold
  name: Снижение контроля
  description: |-
    Вы можете провести операцию специально для того, чтобы снизить контроль другой фракции, если знаете, в чём она уязвима. Если операция удаётся, целевая фракция теряет 1 уровень контроля. Если её контроль слабый и падает, фракция теряет 1 ранг и остаётся со слабым контролем.

    Когда фракция воюет, она временно теряет 1 уровень контроля.

    Ваша команда тоже может терять контроль по тем же правилам. Если ваша команда имеет ранг 0 и слабый контроль, а вы по любой причине теряете контроль, ваше логово оказывается под угрозой со стороны врагов или фракции, желающей нажиться на вашей беде.
- id: the-score
  name: Дело
  description: |-
    *Убийства по найму, жестокое вымогательство, тёмные ритуалы, незаконные сделки, контрабандные рейсы, воровство в тени — единственные шансы для тех, кого оттеснили на обочину и лишили привилегий, доступных продажной и хищной элите.*

    В *Blades in the Dark* мы играем, чтобы узнать, сумеет ли начинающая команда персонажей преуспеть в преступном мире, а их процветание зависит от преступных предприятий, которые мы называем **делами**.

    Дело — это отдельная операция с определённой целью: *ограбить особняк лорда, убить дипломата, тайно ввезти в город странный артефакт* и так далее. Обычно дело относится к одной из трёх категорий:

    * **Преступная деятельность**, определяемая типом вашей команды. Убийство, кража со взломом, незаконная торговля пороками и тому подобное.
    * Захват **притязания**, которое вы выбираете на **карте притязаний** своей команды. Притязания помогают команде расти и развиваться.
    * **Особое задание** или цель, которую определяют игроки (например, добыть редкий артефакт, чтобы усилить один из ритуалов Шёпота).

    Дело может быть долгим и запутанным или коротким и простым. В нём может быть много бросков и неприятностей, а может хватить и нескольких действий. *Играйте, чтобы узнать, что будет!* Дело не обязано каждый раз занимать целую игровую сессию. Пусть оно длится столько, сколько длится.

    Персонажи игроков могут завести новое дело, выбрав цель (например, из своих притязаний или из списка фракций), обратившись к возможному клиенту с просьбой о работе или получив весточку от персонажа Мастера, которому нужно нанять команду для работы.

    Дело состоит из нескольких ключевых элементов, подробно описанных в этой главе: **планирования и завязки**, **флэшбэков** и **командной работы**.
