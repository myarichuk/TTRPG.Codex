- id: entanglements
  name: Хвосты
  description: |-
    Ваша команда возникла не сегодня вечером. За спиной у вас сложная история услуг, обязательств, долгов и обещаний, которые привели вас туда, где вы сейчас. Чтобы это отразить, после каждого дела вы бросаете кубы и выясняете, какой **хвост** о себе напоминает. Хвостом может стать соперничающая команда, которая решила показать силу (и потребовать **монеты**), сыщик Городской стражи, собирающий дело против вашей команды (но готовый взять взятку), или даже внимание мстительного призрака.

    Когда определены добыча и **жар**, Мастер (GM) создаёт хвост для команды по спискам ниже. Найдите столбец, который соответствует текущему уровню **жара** команды. Затем бросьте число кубов, равное её **уровню розыска**, и по результату броска выберите, какой именно хвост даёт о себе знать. *Если **уровень розыска** равен нулю, бросьте два куба и возьмите наименьший результат.*

    ---

    | РЕЗУЛЬТАТ | **Жар** **0-3**                        | **Жар** **4-5**                    | **Жар** **6**                          |
    | :----: | :--------------------------------- | :-------------------------- | :------------------------------ |
    |  1-3   | Неприятности с бандой или Обычные подозреваемые | Неприятности с бандой или Расспросы | Переманены или Допрос        |
    |  4-5   | Соперники или Беспокойные мертвецы | Месть или Беспокойные мертвецы | Внимание демона или Демонстрация силы |
    |   6    | Сотрудничество                        | Демонстрация силы               | Арест                          |

    ---

    Введите хвост в игру сразу или подождите подходящего момента. Например, если выпал хвост *Допрос*, можно дождаться, когда кто-то из персонажей игроков предастся пороку, и сказать, что констебли схватили его, пока он был поглощён удовольствиями.

    Хвосты проявляются полностью ещё до того, как у персонажей игроков появится шанс их избежать. Когда хвост вступает в игру, опишите ситуацию уже после того, как он проявился. Персонажи разбираются с ним с этого момента: перехватить хвост и обезвредить его до того, как он сработает, нельзя. Смысл механики в том, чтобы свернуть в одну деталь множество сложных событий на заднем плане жизни персонажей и создавать им неприятности. Хвосты — плата за ведение дел в преступном мире: хорошая команда учится держать удар и выбирать, с кем сражаться.

    Хвосты подробно описаны в следующих разделах. У каждого есть список возможных способов от него избавиться. Если вы хотите, чтобы хвост был для команды мимолётной проблемой, придерживайтесь предложенных способов решения и переходите к следующей части свободного времени. Если хотите погрузиться в хвост и изучить его подробно, поставьте сцену и разыграйте событие целиком, следуя за действиями и последствиями, куда бы они ни привели.
- id: entanglements-arrest
  name: Арест
  description: |-
    Инспектор передаёт магистрату дело с уликами, чтобы начать судебное преследование вашей команды. Он посылает отряд, чтобы вас арестовать (банду, по **масштабу** не меньшую вашего **уровня розыска**). Откупитесь **монетами** в количестве, равном вашему **уровню розыска** +3, выдайте кого-нибудь для ареста (это сбросит ваш **жар**) или попробуйте уйти от захвата.

    > Дубинка стучит в ставни окна. «Ну всё, выходите по-тихому!» Похоже, это лысый сержант. Выглянув, вы видите отряд человек в двадцать констеблей, готовых к драке. Сержант бормочет себе под нос так, чтобы слышали только вы внутри: «Или, может, я ошибся адресом?» Он откашливается и ждёт, когда появятся монеты.
- id: entanglements-cooperation
  name: Сотрудничество
  description: Фракция со статусом +3 просит вас об одолжении. Согласитесь выполнить его, потеряйте 1 **репутацию** за каждый Ранг дружественной фракции или потеряйте **1 пункт статуса** с ней. Если у вас нет фракции со статусом +3, сейчас вы избегаете хвостов.
- id: entanglements-demonic-notice
  name: Внимание демона
  description: К команде приходит демон с тёмным предложением. Примите его сделку, спрячьтесь, пока он не потеряет интерес (потеряйте 3 **репутации**), или разберитесь с ним иначе.
- id: entanglements-flipped
  name: Переманены
  description: Один из соперников персонажей игроков устраивает так, что один из ваших контактов, покровителей, клиентов или группа ваших покупателей переходит на другую сторону из-за **жара**, который на вас висит. Теперь они верны другой фракции.
- id: entanglements-gang-trouble
  name: Неприятности с бандой
  description: Одна из ваших банд (или других подручных) создаёт проблемы из-за своих недостатков. Вы можете потерять лицо (потеряйте **репутацию** в количестве, равном вашему Рангу +1), наказать одного из членов банды в назидание остальным или столкнуться с местью обиженной стороны.
- id: entanglements-interrogation
  name: Допрос
  description: |-
    Офицеры хватают одного из персонажей игроков, чтобы допросить его о преступлениях команды. *Как им удалось вас поймать?* Либо откупитесь от них 3 **монетами**, либо они вас изобьют (**вред 2 уровня**), и вы расскажете им всё, что они хотят знать (**+3** **жара**). Вы можете **сопротивляться** каждому из этих последствий отдельно.

    > Некоторым игрокам очень не нравится, когда их персонажа берут в плен! Просто скажите им, что для проходимца из преступного мира это совершенно нормально. Вы то и дело оказываетесь в тюрьме и выходите из неё, вас допрашивает и донимает закон. Это не конец света. Но вот вы в допросной: что вы за человек? Вы заговорите? Дадите отпор? Заключите сделку?
- id: entanglements-questioning
  name: Расспросы
  description: |-
    Стража хватает неигрового члена вашей команды или одного из контактов команды, чтобы расспросить его о ваших преступлениях. *Кого они считают самым уязвимым?* Сделайте **бросок удачи**, чтобы узнать, как много он выболтает (**1-3**: **+2** **жара**, **4/5**: **+1** **жар**), либо откупитесь от констеблей 2 **монетами**.

    > Бросьте 2d для обычного человека, чтобы узнать, как хорошо он молчит. Если это опытный житель преступного мира или кто-то крепкий, дайте ему 3d или 4d. Если он мягкотелый или хранит какую-то верность закону, дайте ему 1d или 0d.
- id: entanglements-reprisals
  name: Месть
  description: Вражеская фракция делает ход против вас (или вашего друга, контакта или поставщика порока). Заплатите им (1 **репутацию** и 1 **монету**) за каждый Ранг врага в качестве извинения, позвольте им портить жизнь вам и вашим близким или дайте отпор и покажите им, кто здесь главный.
- id: entanglements-rivals
  name: Соперники
  description: Нейтральная фракция демонстрирует свою силу. Она угрожает вам, другу, контакту или одному из ваших поставщиков порока. Потеряйте (1 **репутацию** или 1 **монету**) за каждый Ранг соперника либо дайте им отпор и потеряйте **1 пункт статуса** с ними.
- id: entanglements-show-of-force
  name: Демонстрация силы
  description: Фракция, с которой у вас отрицательный статус, делает ход против ваших владений. Отдайте им 1 **притязание** или начните войну (статус падает до -3). Если у вас нет притязаний, вместо этого **потеряйте 1 пункт контроля**.
- id: entanglements-the-usual-suspects
  name: Обычные подозреваемые
  description: 'Стража хватает кого-то из окружения вашей команды. Один из игроков называет друга или поставщика порока как человека, которого скорее всего возьмут. Сделайте **бросок удачи**, чтобы выяснить, выдержит ли он допрос (**1-3**: **+2 жара**, **4/5:** вред 2 уровня), либо откупитесь от них 1 **монетой**.'
- id: entanglements-unquiet-dead
  name: Беспокойные мертвецы
  description: |-
    Неупокоенный дух тянется к вам — возможно, это чья-то прошлая жертва? Наймите окультиста, чтобы он попытался уничтожить или изгнать его, или разберитесь с ним сами.

    > Они могут нанять неигрового персонажа с помощью свободного времени **получить ресурс**. Бросьте уровень качества этого персонажа как бросок удачи, чтобы узнать, как хорошо он справится с духом.
- id: fortune-roll
  name: Бросок удачи
  description: |-
    Бросок удачи — это инструмент, с помощью которого Мастер (GM) может переложить решение на кубы. Бросок удачи используется двумя способами.

    **Когда нужно определить ход ситуации, в которой персонажи игроков напрямую не участвуют**, и вы не хотите просто назначить исход.

    > Две соперничающие банды сражаются. Чем это кончится? Мастер делает бросок удачи за каждую из них. У одной хороший результат, но у другой ограниченный эффект. Мастер решает, что первая банда захватывает часть территории соперников, но получает в стычке несколько ран.

    **Когда исход неясен**, но никакой другой бросок к ситуации не подходит.

    > Пока Кросс обшаривает мастерскую алхимика, в него вселяется мстительный призрак. Когда контроль над телом ускользает, Кросс хватает первый попавшийся флакон с зельем и выпивает его. Подействует ли тайное варево на дух? Отравит ли оно Нока насмерть? Кто знает? Мастер делает бросок удачи, чтобы узнать, чем всё закончится.

    Делая бросок удачи, вы можете взять **любой рейтинг показателя**, чтобы определить пул кубов броска.

    * Когда фракция совершает действие с неясным исходом, для броска удачи можно использовать её рейтинг **Ранга**.
    * Когда банда действует самостоятельно, используйте для броска удачи её рейтинг **качества**.
    * Когда сверхъестественная сила проявляется с неясными последствиями, для броска удачи можно использовать её **величину**.
    * Когда персонаж игрока **собирает сведения**, можно сделать бросок удачи по его **рейтингу действия**, чтобы определить, сколько сведений он получит.

    Если ни один показатель не подходит, бросьте 1d на чистое везение или составьте пул кубов (от одного до четырёх) по ситуации. Если две стороны прямо противостоят друг другу, сделайте бросок удачи за каждую, чтобы узнать, как у них идут дела, а затем оцените исход ситуации, сравнив уровни их результатов.

    Бросок удачи также помогает Мастеру управлять множеством движущихся частей мира. Иногда быстрого броска достаточно, чтобы ответить на вопрос или подкинуть идею, что может случиться дальше.

    Другие примеры бросков удачи.

    * Персонажи игроков разжигают войну между двумя фракциями, а потом сидят и смотрят на фейерверк. Чем это кончится? Победит ли одна из сторон? Станут ли обе уязвимы из-за конфликта? Сделайте несколько бросков удачи, чтобы узнать.
    * По городу расползается странная болезнь. Насколько сильно эпидемия бьёт по криминальному району? Мастер назначает тайной чуме величину и делает бросок удачи, чтобы оценить степень заражения.
    * Гончая выбирает хорошую позицию и делает снайперский выстрел по главарю банды, когда тот входит в свой кабинет. Контролируемый бросок **Охоты** успешен, но хватит ли большого эффекта, чтобы мгновенно убить закалённого главаря? Вместо того чтобы вести часы его смертности, Мастер решает использовать простой бросок удачи с его «выносливостью» в качестве показателя, чтобы узнать, может ли он пережить нападение. Выпадает **4/5**: пуля мимо сердца, но попадает в лёгкое — рана смертельная. Он на пороге смерти, и жить ему всего несколько часов, если только его банда не успеет доставить к нему опытного лекаря.
    * Инспекторы собирают дело против команды персонажей игроков. Как быстро улики приведут к арестам? **Уровень розыска** команды считается для инспекторов крупным преимуществом.
    * Персонажи игроков сталкиваются в стычке с командой и капитаншей опытных охотников на демонов. Битва складывается в пользу персонажей игроков, многие члены команды убиты. Один из игроков спрашивает, сдастся ли капитанша, чтобы сохранить жизнь остальным. Мастер не уверен. Насколько хладнокровна эта опытная охотница? Она смотрела в глаза гигантским демонам, не дрогнув... осталось ли в ней что-то человеческое? Мастер делает бросок удачи 2d на «человеческие чувства», чтобы узнать, теплится ли в её сердце искра сострадания. Если да, возможно, кто-то из персонажей игроков сделает бросок **Знакомств**, **Влияния** или **Приказа**, чтобы заставить её отступить.
- id: fortune-roll-fortune-roll
  name: БРОСОК УДАЧИ
  description: |-
    ⏣ *1d* за каждую единицу рейтинга **показателя**.

    ⊕ *+1d* за каждое **крупное преимущество**.

    ⊖ *-1d* за каждый **крупный недостаток**.

    * **Критический успех**: Исключительный результат / Большой, предельный эффект.
    * **6**: Хороший результат / Стандартный, полный эффект.
    * **4/5**: Смешанный результат / Ограниченный, частичный эффект.
    * **1-3**: Плохой результат / Слабый, малый эффект.
- id: gathering-information
  name: Сбор сведений
  description: |-
    Поток сведений от Мастера (GM) к игрокам о вымышленном мире очень важен в ролевой игре. По умолчанию Мастер рассказывает игрокам, что их персонажи воспринимают, подозревают и чувствуют интуитивно. Но происходит слишком много всего, чтобы говорить *обо всём*: это заняло бы вечность и было бы скучно. У игроков есть инструмент, чтобы глубже исследовать вымышленный мир.

    Когда вы хотите узнать что-то конкретное о вымышленном мире, ваш персонаж может **собрать сведения**. Мастер спросит, **как** ваш персонаж добывает эти сведения (или как он узнал их в прошлом).

    Если это общеизвестно, Мастер просто ответит на ваши вопросы. Если на пути к ответу есть препятствие, требуется бросок действия. Если это не общеизвестно, но препятствий нет, качество собранных сведений определяет простой бросок удачи.

    Каждая попытка собрать сведения занимает время. Если ситуация позволяет, вы можете попробовать снова, если с первого раза получили не все нужные сведения. Но часто возможность мимолётна, и на конкретный вопрос бросок можно сделать только один раз.

    Примеры вопросов приведены внизу листа персонажа. Мастер всегда отвечает честно, но с уровнем подробности, зависящим от уровня эффекта.

    Чаще всего для сбора сведений используют **Осмотр** ситуации, чтобы выявить или предугадать происходящее, и **Изучение** человека, чтобы понять, что он собирается делать или о чём он на самом деле думает.

    Иногда сначала нужно занять позицию, и только потом можно собирать сведения. Например, вам может понадобиться сперва использовать **Подкрадывание**, чтобы добраться до хорошего укрытия, а затем **Изучение**, чтобы понаблюдать за культистами во время их тёмного ритуала.
- id: gathering-information-examples-questions
  name: Примеры и вопросы
  description: |-
    * Вы можете применить **Настройку**, чтобы увидеть отголоски недавней активности духов. *Были ли здесь новые призраки? Как найти источник духов, который их призывает? Чего мне следует опасаться?*
    * Вы можете применить **Приказ** к местному трактирщику, чтобы он рассказал, что знает о тайных встречах в его задней комнате. *Что здесь на самом деле происходит? Что он на самом деле об этом чувствует? Входит ли он в эту тайную группу?*
    * Вы можете использовать **Знакомства** и обратиться к влиятельному другу, чтобы узнать секреты врага, соперника или возможного союзника. *Что они собираются делать? Что можно заподозрить об их мотивах? Как найти рычаг, чтобы ими манипулировать?*
    * Вы можете применить **Охоту**, чтобы выследить курьера по городу и узнать, кто получает мешки с монетами от мастера дуэлей. *Где посылка оказывается в итоге? Как выяснить, кто расписался за посылку в городской ратуше?*
    * Вы можете применить **Изучение** к древним и малоизвестным книгам, чтобы раскрыть тайну магии. *Как отключить охранные руны? Почувствует ли кто-нибудь, что они отключены?*
    * Или вы можете применить **Изучение** к человеку, чтобы прочесть его намерения и чувства. *Что он на самом деле чувствует? Как заставить его мне доверять?*
    * Вы можете применить **Осмотр** к господскому дому, чтобы разведать его перед ограблением. *Где лучше всего проникнуть внутрь? В чём здесь опасность?*
    * Или вы можете применить **Осмотр** к напряжённой ситуации при встрече с другой бандой. *Что здесь на самом деле происходит? Не собираются ли они на нас напасть?*
    * Вы можете применить **Влияние** к могущественному лорду на приёме, чтобы он раскрыл свои планы. *Что он собирается делать? Как заставить его думать, что я хороший партнёр в этом предприятии?*
    * Или вы можете применить **Влияние** к его телохранителю, чтобы тот поделился с вами недавними событиями. *Где он бывал в последнее время? С кем он встречался?*
