- id: stress-trauma-pushing-yourself
  name: Поднажать
  description: |-
    Вы можете потратить стресс, чтобы поднажать и выжать из себя больше. За каждый бонус из списка ниже получите **2 стресса** (каждый бонус можно выбрать один раз для одного действия):

    * Добавьте **+1d** к своему броску. (Это можно сделать для броска действия, броска свободного времени или любого другого броска, где лишние усилия помогут)
    * Добавьте **+1 уровень** к своему эффекту.
    * Действуйте, даже когда вы выведены из строя.

- id: stress-trauma-stress
  name: Стресс
  description: |-
    У персонажей игроков в *Blades in the Dark* есть особый запас, называемый **стрессом**. Когда персонаж терпит последствие, которое не хочет принимать, он может получить стресс вместо него. Результат **броска сопротивления** определяет, сколько стресса стоит избежать плохого исхода.

    *Во время драки на ножах персонажа Дэниела, Кросса, пырнули в грудь. Дэниел бросает кубы по рейтингу **Сноровки**, чтобы сопротивляться, и получает **2**. Сопротивление последствиям стоит 6 стресса минус 2 (результат броска сопротивления). Дэниел отмечает 4 стресса и описывает, как Кросс выживает.*

    *Мастер (GM) решает, что бросок сопротивления уменьшает вред, но не отменяет его полностью. Кросс получает вред 2-го уровня («Рана в груди») вместо вреда 3-го уровня («Пробитое лёгкое»).*

- id: stress-trauma-trauma
  name: Травма
  description: |-
    Когда PC отмечает последнюю клетку стресса, он получает один уровень **травмы**. Получив **травму**, обведите одно из своих **состояний-травм**, например *Холодный*, *Безрассудный*, *Неуравновешенный* и так далее. Все они описаны в следующем разделе.

    Когда вы получаете **травму**, вы выбываете из игры. Вас «оставили умирать» или иным образом убрали из текущего конфликта, и вы вернётесь позже, потрясённым и измотанным. Когда вы возвращаетесь, **у вас нулевой стресс**, а ваш порок удовлетворён до следующего свободного времени.

    **Состояния-травмы остаются навсегда**. Ваш персонаж приобретает новую черту характера, которую задаёт состояние, и может зарабатывать опыт, устраивая с её помощью неприятности. **Когда вы отмечаете четвёртое состояние-травму**, ваш персонаж больше не может быть дерзким проходимцем. Вы должны отправить его доживать другую жизнь или посадить в тюрьму, чтобы он взял на себя вину за **уровень розыска** команды.

- id: teamwork-do-we-have-to-use-teamwork
  name: "Обязательно ли действовать сообща?"
  description: |-
    Приёмы совместной работы необязательны, это лишь возможности. Каждый персонаж по-прежнему может действовать в одиночку, как обычно, во время операции. Если ваш персонаж не может общаться с остальной командой или как-то согласовывать с ней действия, вы не можете использовать приёмы совместной работы и получать от них выгоду.

- id: teamwork-teamwork
  name: Совместная работа
  description: |-
    Когда команда PC работает вместе, персонажам доступны четыре особых **приёма совместной работы**. Они перечислены внизу листов плейбуков, чтобы игроки о них помнили. Вот эти четыре приёма:

    * **Помочь** другому PC, который совершает бросок действия.
    * Возглавить **групповое действие**.
    * **Защитить** товарища по команде.
    * **Подготовить** персонажа, который закрепит успех вашего действия.

- id: teamwork-teamwork-assist
  name: Помочь
  description: |-
    Когда вы помогаете другому игроку, который совершает бросок, опишите, что делает ваш персонаж. Получите 1 стресс и дайте ему **+1d** к броску. Вы также можете получить любые последствия этого броска, в зависимости от обстоятельств. Помочь с одним броском может только один персонаж. *Если вам очень хочется помочь, а кто-то уже помогает, подумайте о приёме **подготовки**.*

    Персонаж может помочь с групповым действием, но только если сам не участвует в нём напрямую. Вы решаете, какой персонаж в групповом действии получит дополнительный куб.

- id: teamwork-teamwork-lead-a-group-action
  name: Возглавить групповое действие
  description: |-
    Когда вы возглавляете групповое действие, вы координируете нескольких членов команды, чтобы они вместе справились с проблемой. Опишите, как ваш персонаж ведёт команду в согласованном усилии. Вы рявкаете приказы, подаёте тихие знаки рукой или вдохновляете харизмой?

    Каждый вовлечённый PC совершает **бросок действия** (по одному и тому же действию), и **команда засчитывает единственный лучший результат** как общее усилие для всех, кто бросал. Однако персонаж, возглавляющий групповое действие, получает **1 стресс** за каждого PC, у которого лучший результат — ** 1-3**.

    > Так проходит сцена «мы все пробираемся в здание». Каждый, кто хочет пробраться внутрь, бросает кубы по действию «Подкрадывание», и лучший результат засчитывается всей команде. Предводитель получает стресс за каждого, у кого вышло плохо. Прикрывать отстающих нелегко.

    **Результат группового действия распространяется на всех, кто бросал.** Если вы не бросаете кубы, ваш персонаж не получает эффектов этого действия.

    Вашему персонажу не обязательно быть особенно искусным в нужном действии, чтобы возглавить групповое действие. Этот приём о лидерстве, а не обязательно об умении. Вы также можете возглавить **подручных** своей команды групповым действием. Бросайте **Приказ**, если направляете их усилия, или кубы по подходящему рейтингу действия, если действуете рядом с ними. Подручные бросают кубы по своему уровню **качества**.

- id: teamwork-teamwork-protect
  name: Защитить
  description: |-
    Вы выходите вперёд и принимаете на себя последствие, которое иначе досталось бы вашему товарищу. **Вы терпите его вместо него. Вы можете бросить сопротивление, как обычно.** Опишите, как вы вмешиваетесь.

    > Так проходит сцена «я прыгну под пулю». Вы прикрываете товарища и терпите любой вред или последствия, которые остались после вашего броска сопротивления. Это больно, стоит стресса и может поставить вас в тяжёлое положение. Но вы же герой.

- id: teamwork-teamwork-set-up
  name: Подготовить
  description: |-
    Когда вы совершаете подготовительное действие, вы косвенно влияете на препятствие. Если ваше действие дало задуманный результат, любой член команды, который закрепит ваш приём, получает для своего броска **+1 уровень эффекта** или **улучшенную позицию**. Выгоду выбираете вы, исходя из природы вашего подготовительного действия.

    > Так проходит сцена «я отвлеку их». Вы бросаете **Влияние**, чтобы очаровать констебля и отвлечь его, и тогда любой товарищ, который воспользуется этим и совершит действие **Подкрадывание**, чтобы пройти мимо, может получить улучшенную позицию. Так менее рискованно, ведь вы отвлекаете внимание стража.

    Это хороший способ внести вклад в операцию, когда у вас нет высокого рейтинга в нужном действии. Умная подготовка позволяет помогать команде косвенно. Несколькими последующими действиями можно воспользоваться вашей подготовкой (в том числе тем, кто **возглавляет** групповое действие), пока это имеет смысл в происходящем.

    Поскольку подготовительное действие может повысить эффект последующих действий, оно полезно и тогда, когда команде противостоит сильный противник, у которого есть преимущества в качестве, масштабе и (или) потенции. Даже если PC из-за невыгодной ситуации сведены к нулевому эффекту, подготовка даёт бонус, который позволяет добиться ограниченного эффекта.

    > PC столкнулись с тяжело бронированной каретой, которой их оружие не страшно. Алдо использует **Разрушение** как подготовительное действие: он отдирает ломом часть брони, и последующие действия получают +1 эффект, то есть от нулевого эффекта переходят к ограниченному.

- id: the-basics-playing-a-session
  name: Игровая сессия
  description: |-
    Сессия *Blades in the Dark* похожа на серию телесериала. В ней одно-два главных события и, возможно, побочные сюжетные линии, и всё это вписывается в продолжающийся сериал. Игровая сессия может длиться от двух до шести часов, в зависимости от предпочтений группы.

    Во время сессии команда проходимцев вместе выбирает дело, которое нужно провернуть, а затем делает несколько бросков кубов, чтобы ворваться в действие идущего дела. PC совершают действия, терпят последствия и завершают операцию (успехом или провалом). Затем у команды наступает свободное время: она восстанавливается, занимается побочными проектами и предаётся порокам. После свободного времени игроки снова ищут новую возможность или создают собственные цели и затеи, и мы играем, чтобы узнать, что будет дальше.

- id: the-basics-the-characters
  name: Персонажи
  description: |-
    Персонажи пытаются развить свою команду, проворачивая дела и противостоя угрозам со стороны врагов.

- id: the-basics-the-crew
  name: Команда
  description: |-
    Помимо персонажей, вы создадите и команду, выбрав, какое преступное предприятие вам интересно исследовать.

- id: the-basics-the-game
  name: Игра
  description: |-
    *Blades in the Dark* — игра о группе дерзких персонажей, создающих предприимчивую команду. Мы играем, чтобы узнать, сможет ли начинающая команда процветать среди множества угроз, которые её окружают.

- id: the-basics-the-game-master
  name: Мастер
  description: |-
    Мастер (GM) создаёт живой мир вокруг персонажей. Мастер играет за всех неигровых персонажей мира, наделяя каждого конкретным желанием и излюбленным способом действовать.

    Мастер помогает организовать разговор за столом, чтобы он был направлен на самое интересное в игре. Мастер не отвечает за историю и не обязан планировать события заранее. Он предлагает игрокам интересные возможности, а затем следует цепочке действий и последствий, куда бы она ни вела.

- id: the-basics-the-players
  name: Игроки
  description: |-
    Каждый игрок создаёт персонажа и вместе с остальными игроками создаёт команду, к которой принадлежат их персонажи. Каждый игрок старается воплотить своего персонажа как интересного, дерзкого героя, который смело тянется за пределы своей нынешней безопасности и возможностей.

    Игроки вместе с Мастером (GM) задают тон и стиль игры, принимая решения по механике, кубам и последствиям действий. Игроки несут ответственность как соавторы игры вместе с Мастером.

- id: the-core-system-judgment-calls
  name: Судейские решения
  description: |-
    Играя, вы будете принимать несколько ключевых судейских решений. Вносят вклад все, но последнее слово в каждом случае остаётся либо за игроками, либо за Мастером (GM):

    * Какие действия разумны как решение проблемы? *Можно ли убедить этого человека? Надо ли доставать инструменты и возиться с этим старым ржавым замком или его можно тихо вскрыть изящно?* Последнее слово за игроками.
    * Насколько опасно и насколько действенно данное действие в этих обстоятельствах? *Насколько это рискованно? Можно ли убедить этого человека совсем немного или очень сильно?* Последнее слово за Мастером.
    * Какие последствия применяются, чтобы воплотить опасности данных обстоятельств? *Сломаете ли вы ногу при падении с крыши? Констебли лишь заподозрят неладное или уже загнали вас в ловушку?* Последнее слово за Мастером.
    * Требует ли ситуация броска кубов, и какого именно? *Может ли ваш персонаж совершить бросок действия или ему сначала нужно сделать бросок сопротивления, чтобы перехватить инициативу?* Последнее слово за Мастером.
    * Какие события истории соответствуют условиям получения опыта для развития персонажа и команды? *Выразили ли вы убеждения, стремления, происхождение или прошлое своего персонажа? Скажете нам вы.* Последнее слово за игроками.

- id: the-core-system-rolling-the-dice
  name: Бросок кубов
  description: |-
    В *Blades in the Dark* используются шестигранные кубы. Вы бросаете сразу несколько и смотрите на **единственный наивысший результат**.

    * Если наивысший куб показывает **6**, это **полный успех**: всё идёт хорошо. Если выпало больше одной **6**, это **критический успех**: вы получаете дополнительное преимущество.
    * Если наивысший куб показывает **4 или 5**, это **частичный успех**: вы делаете то, что пытались, но есть последствия: неприятности, вред, меньший эффект и так далее.
    * Если наивысший куб показывает **1-3**, это **провал**. Всё идёт плохо. Скорее всего, вы не достигаете цели, и к тому же получаете осложнения.

    *Если вам нужно бросить кубы, но у вас ноль (или меньше) кубов, бросьте два куба и возьмите единственный наименьший результат. Если у вас ноль кубов, **критический успех** выпасть не может.*

    Все системы бросков в игре строятся по этому базовому образцу. Пока вы только изучаете игру, вы всегда можете «свернуть» всё до простого броска, чтобы решить, как идут дела. Точное правило можно найти позже, когда будет время.

    Чтобы собрать пул кубов для броска, вы используете **черту** (например, **Изящество**, **Сноровку** или ранг вашей команды) и берёте число кубов, равное её **рейтингу**. Обычно у вас получается от одного до четырёх кубов. Даже один куб в этой игре неплох: шанс успеха 50%. Чаще всего вы используете **рейтинги действий** персонажей игроков. Например, игрок может бросать кубы по рейтингу действия **Схватка**, когда его персонаж сражается с врагом.

    Чаще всего в игре используются четыре вида бросков:

    * **Бросок действия**. Когда PC пытается совершить опасное или хлопотное действие, вы делаете бросок действия, чтобы узнать, чем это кончится. Броски действий, их эффекты и последствия движут большей частью игры.
    * **Бросок свободного времени**. Когда PC отдыхают после дела, они могут заниматься делами свободного времени в относительной безопасности. Вы делаете броски свободного времени, чтобы узнать, сколько им удалось сделать.
    * **Бросок удачи**. Мастер может сделать бросок удачи, чтобы снять с себя решение и положиться на случай. *Насколько предан неигровой персонаж? Как далеко распространяется чума? Сколько улик сгорит, прежде чем констебли вышибут дверь?*
    * **Бросок сопротивления**. Игрок может сделать бросок сопротивления, когда его персонаж терпит последствие, которое ему не нравится. Бросок показывает, сколько стресса получает персонаж, чтобы смягчить тяжесть последствия. *Когда вы сопротивляетесь вреду «Сломанная нога», вы получаете немного стресса, и теперь это только «Растянутая лодыжка».*
