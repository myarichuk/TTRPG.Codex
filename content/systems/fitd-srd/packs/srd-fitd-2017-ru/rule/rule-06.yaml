- id: downtime-activities-indulging-your-vice-overindulgence
  name: Перебор
  description: |-
    Если ваш бросок порока снимает больше уровней стресса, чем у вас было отмечено, вы перебираете. Порок — не надёжная и управляемая привычка. Это риск, и он может толкнуть вашего персонажа на поступки себе во вред.

    Когда вы перебираете, вы совершаете промах из-за своего порока: при его удовлетворении или под его влиянием. Чтобы ввести последствия этого решения в игру, выберите перебор из списка:

    * **Нажить неприятности**. Выберите или бросьте дополнительный **хвост**.
    * **Хвастовство** своими подвигами. **+2** **жара**.
    * **Пропал**. Ваш персонаж исчезает на несколько недель. Играйте другим персонажем, пока этот не вернётся из запоя. Когда ваш персонаж возвращается, он также залечил весь свой вред.
    * **Иссяк источник**. Ваш нынешний поставщик перестаёт вам отпускать. Найдите новый источник для своего порока.
- id: downtime-activities-indulging-your-vice-roleplaying-xp
  name: Отыгрыш и опыт
  description: |-
    Вместе с происхождением и прошлым порок персонажа говорит нам, что он за человек. Эта одержимость влияет на его мотивы, цели и поведение. Когда вы размышляете, что персонаж мог бы сделать или сказать дальше, всегда можно обратиться к его пороку, чтобы подсказать себе идею. А в качестве бонуса, если вы играете в соответствии с природой порока своего персонажа, вы получаете опыт в конце сессии.
- id: downtime-activities-long-term-project
  name: Долгосрочный проект
  description: |-
    Когда вы работаете над долгосрочным проектом (новым или уже начатым), опишите, что делает ваш персонаж, чтобы продвинуть часы проекта, и бросьте одно из своих действий. Отметьте деления на часах по результату: **1-3**: одно деление, **4/5**: два деления, **6**: три деления, **критический успех**: пять делений.

    Долгосрочный проект может охватывать самые разные занятия: исследование тайного ритуала, расследование загадки, завоевание чьего-то доверия, сближение с новым другом или контактом, смена порока вашего персонажа и так далее.

    Исходя из цели проекта, Мастер (GM) скажет вам, какие часы создать, и предложит способ, которым вы можете продвигаться.

    Чтобы взяться за проект, вам, возможно, сначала придётся обзавестись средствами для него, а это само может быть проектом. Например, вы хотите подружиться с членом Городского совета, но никак с ним не связаны. Сначала вы можете взяться за проект по **Знакомствам** в их кругах, чтобы получить возможность встретиться с одним из них. Когда это удастся, можно начать новый проект, чтобы наладить дружеские отношения.
- id: downtime-activities-npc-faction-downtime
  name: Свободное время НПС и фракций
  description: |-
    НПС и фракции тоже чем-то заняты, пока у персонажей игроков свободное время. Мастер (GM) **продвигает их часы проектов** и выбирает один-два манёвра свободного времени для каждой фракции, которая его сейчас интересует. Выбирайте любой манёвр, который имеет смысл для этой фракции. Например:

    * Захватить притязание или усилить контроль, сделать врага уязвимым или ослабить контроль уязвимого врага.
    * Собрать сведения о персонажах игроков (им может противостоять бросок игрока) или о другом предмете.
    * Достичь краткосрочной цели, которая им по силам.
    * Заполучить новый ресурс.
    * Призвать на помощь долг другой фракции.
    * Давить политически или угрожать, чтобы вынудить кого-то действовать.

    **Мастер:** выбирайте манёвры свободного времени и продвигайте часы для тех фракций, которые вас интересуют прямо сейчас. Об остальных не беспокойтесь. Позже, когда вы обратите внимание на фракцию, которую давно игнорировали, дайте ей сразу несколько фаз свободного времени и отметок на часах проектов, чтобы она «догнала» текущие события.

    Если вы не уверены, насколько продвинуть часы фракции, сделайте бросок удачи, взяв за основу её ранг и изменив его в плюс или минус в зависимости от противодействия или обстоятельств. Отметьте 1 деление при результате 1-3, 2 деления при 4/5, 3 деления при 6 или 5 делений при **критическом успехе**.

    Когда фракции делают то, что становится известно в криминальном мире, **расскажите об этом игрокам** через одного из их **друзей**, **контактов** или **поставщиков порока**. Эти слухи и обрывки сплетен могут привести к будущим делам и возможностям для персонажей игроков.
- id: downtime-activities-npc-faction-downtime-downtime-activities-summary
  name: СВОДКА ПО СВОБОДНОМУ ВРЕМЕНИ
  description: |-
    *Добавьте ***+1d*** к броску, если ***друг*** или ***контакт*** помогает вам в занятии свободного времени.*

    #### ЗАПОЛУЧИТЬ РЕСУРС

    Бросьте **ранг** команды. Результат определяет *качество* ресурса:

    * **Критический успех**: ранг +2.
    * **6**: ранг +1.
    * **4/5**: ранг.
    * **1-3**: ранг -1.

    *Для некоторых предметов нужен минимальный результат качества. Чтобы поднять результат выше критического, вы можете потратить **2 монеты** за каждый +1 к рангу.*

    #### ДОЛГОСРОЧНЫЙ ПРОЕКТ

    Работайте над **долгосрочным проектом**, если у вас есть средства.

    Отметьте деления на часах по результату:

    * **Критический успех**: пять отметок.
    * **6**: три отметки.
    * **4/5**: две отметки.
    * **1-3**: одна отметка.

    #### ВОССТАНОВЛЕНИЕ

    Получите **лечение**, чтобы продвинуть свои **часы исцеления** (как долгосрочный проект). *Когда вы заполняете часы, каждый вред снижается на один уровень.*

    #### СНИЗИТЬ ЖАР

    Скажите, как вы снижаете **жар** команды, и бросьте своё действие. Снизьте **жар** по уровню результата:

    * **Критический успех**: снимите пять **жара**.
    * **6**: снимите три **жара**.
    * **4/5**: снимите два **жара**.
    * **1-3**: снимите один **жар**.

    #### ТРЕНИРОВКА

    **Отметьте 1 опыта** (в атрибуте или в плейбуке). Добавьте **+1** опыта, если у вас есть подходящее улучшение команды. *Каждую шкалу опыта можно тренировать один раз за свободное время.*

    #### ПОРОК

    Навестите своего **поставщика порока**, чтобы снять **стресс**. Бросьте столько кубов, сколько у вас **самый низкий атрибут**. Снимите стресс, равный наивысшему результату на кубах. Если вы снимаете больше уровней стресса, чем у вас было отмечено, вы ***перебираете*** (см. ниже). *Если вы не предаётесь своему пороку во время свободного времени или не можете этого сделать, вы получаете стресс, равный вашей **травме**.*

    ---

    **Перебор**: вы совершили промах из-за своего порока: при его удовлетворении или под его влиянием. Что вы сделали?

    * **Нажить неприятности**: *Возможно, враг выследил вас у поставщика порока, а вы потеряли бдительность.* Выберите или бросьте дополнительный **хвост**.
    * **Хвастовство**: возможно, вы хвастаетесь своими подвигами. Команда получает **+2 жара**.
    * **Пропал**: играйте другим персонажем, пока этот не вернётся из запоя.
    * **Иссяк источник**: ваш нынешний поставщик перестаёт вам отпускать. Найдите новый источник для удовлетворения своего порока.
- id: downtime-activities-recover
  name: Восстановление
  description: |-
    Когда вы восстанавливаетесь, вы ищете лечения и залечиваете свой вред. Вы можете сходить к лекарю, который зашьёт ваши раны и успокоит ваш разум знанием анатомии, или к ведьме, которая специализируется на целебных чарах и восстанавливающей алхимии. Если у вас нет контакта или другого персонажа игрока, способного вас лечить, вы можете использовать занятие **заполучить ресурс**, чтобы получить доступ к целителю, который сможет обслужить всю команду.

    Восстановление похоже на долгосрочный проект. Ваш целитель бросает кубы (**Механика** для персонажа игрока с особым умением **Лекарь** или уровень **качества** для НПС), а затем вы отмечаете деления на своих **часах исцеления**. **1-3**: одно деление, **4/5**: два деления, **6**: три деления, **критический успех**: пять делений.

    Когда вы заполняете часы исцеления, снизьте каждое повреждение в вашем листе на один уровень, затем очистите часы. Если остались деления для отметки, они «переходят» дальше.

    > У Кросса две раны: «Раздробленная правая нога» 3-го уровня и «Побит» 1-го уровня. В свободное время он получает лечение у Квеллин, ведьмы, подруги Шёпота из его команды. Квеллин — умелая целительница, поэтому Мастер говорит, что качество 2 уместно. Игрок бросает 2d на восстановление и выбрасывает **6**: три деления на часах исцеления. Он решает потратить 1 **монету**, чтобы улучшить результат до **критического успеха** и получить пять делений вместо трёх. Четыре деления заполняют часы: весь вред Кросса снижается на один уровень, затем он очищает часы и отмечает ещё одно деление. Его вред 3-го уровня «Раздробленная правая нога» снижается до вреда 2-го уровня. Его вред 1-го уровня «Побит» снижается до нуля и исчезает. На листе Кросса остаётся одна рана: «Сломанная нога» 2-го уровня.

    Вы можете лечить себя, если у вас есть особое умение **Лекарь**, но тогда вы получаете 2 стресса. Вы также можете просто перетерпеть и попытаться исцелиться без лечения — в этом случае получите 1 стресс и бросайте 0d.

    Учтите: восстановление выполняет сам восстанавливающийся персонаж. Лечение другого не отнимает у лекаря занятие свободного времени.

    Каждый раз, когда вы получаете новый вред, очищайте все отметки на своих часах исцеления.
- id: downtime-activities-reduce-heat
  name: Снизить жар
  description: |-
    Скажите, что делает ваш персонаж, чтобы снизить уровень **жара** команды, и сделайте бросок действия. Возможно, вы устраиваете **Знакомства** с подругой-офицером, и она добивается, чтобы несколько изобличающих рапортов Стражи исчезли. Или вы наводите страх **Приказом** на местных жителей, чтобы они боялись доносить.

    Снизьте **жар** по результату: **1-3**: на один, **4/5**: на два, **6**: на три, **критический успех**: на пять.
- id: downtime-activities-stress-relief
  name: Снятие стресса
  description: |-
    Ваши персонажи — особая порода. Они бросают вызов власть имущим и смеют охотиться на тех, кого принято считать выше себя. Они заходят дальше, чем готовы заходить обычные люди. Но у этого есть цена. Их жизнь — это постоянный стресс. Неизбежно каждый поддаётся соблазну **порока**, чтобы справиться с ним.

    Порок персонажа — его одержимость. Но вместе с этим потаканием приходит облегчение стресса и способность снова встретить огромные трудности своей дерзкой жизни.
- id: downtime-activities-train
  name: Тренировка
  description: |-
    Когда вы тратите время на тренировку, **отметьте 1 опыта** на шкале опыта для развития **атрибута** или **плейбука**. Если у вас открыто подходящее улучшение команды «Тренировка», отметьте **+1 опыта** (всего 2). Подробнее см. **Улучшения команды**. *Каждую шкалу опыта можно тренировать только один раз за свободное время.*
- id: downtime-activities-vice-roll
  name: БРОСОК ПОРОКА
  description: |-
    ⏣ Бросьте столько кубов, сколько у вас **самый низкий атрибут**.

    Снимите стресс, равный наивысшему результату на кубах. Если вы снимаете больше уровней стресса, чем у вас было отмечено, вы ***перебираете***. *Если вы не предаётесь своему пороку во время свободного времени или не можете этого сделать, вы получаете стресс, равный вашей **травме**.*
- id: effect
  name: Эффект
  description: |-
    В *Blades in the Dark* вы достигаете целей, совершая действия и сталкиваясь с последствиями. Но сколько действий нужно для достижения конкретной цели? Это зависит от **уровня эффекта** ваших действий. Мастер (GM) определяет уровень эффекта по профилям ниже. Какой из них лучше всего подходит к действию — **большой**, **стандартный** или **ограниченный**? Каждый уровень эффекта указывает вопросы, на которые нужно ответить для этого эффекта, а также сколько делений отмечать, если вы используете **часы прогресса**.

    | Уровни эффекта |                                                                                                                  | Отметки |
    | ------------: | :--------------------------------------------------------------------------------------------------------------- | :---: |
    |     **БОЛЬШОЙ** | *Вы достигаете большего, чем обычно. Как проявляются дополнительные усилия? Какую дополнительную выгоду вы получаете?*         |   3   |
    |  **СТАНДАРТНЫЙ** | *Вы достигаете того, что мы ожидали бы как «нормальное» для этого действия. Этого достаточно или осталось что-то ещё сделать?*        |   2   |
    |   **ОГРАНИЧЕННЫЙ** | *Вы достигаете частичного или слабого эффекта. Чем ослаблено ваше воздействие? Какие усилия остаются для достижения цели?* |   1   |
- id: effect-assessing-factors
  name: Оценка факторов
  description: |-
    Чтобы оценить уровень эффекта, сначала положитесь на чутьё в данной ситуации. Затем, если нужно, оцените три фактора, которые могут изменить уровень эффекта: **мощь**, **масштаб** и **качество**. Если у персонажа игрока преимущество по данному фактору, рассмотрите более высокий уровень эффекта. Если недостаток — сниженный уровень эффекта.
- id: effect-assessing-factors-potency
  name: Мощь
  description: |-
    Фактор мощи учитывает особые слабости, дополнительное время или больший риск, а также влияние тайных сил. Проникающий тем мощнее, чем полнее погашен свет и чем в большей темноте он движется.
- id: effect-assessing-factors-quality-tier
  name: Качество/Ранг
  description: |-
    Качество отражает действенность инструментов, оружия или других ресурсов, обычно выраженную рангом. **Тонкие предметы** считаются как +1 к качеству и складываются с рангом.

    *Шип вскрывает замок убежища банды, известной своими делами с оккультизмом. Её команда — I ранга, и у неё отличные отмычки, так что фактически она II ранга. Оккультная банда — III ранга. Шип уступает по качеству, поэтому её эффект на замок будет ограниченным.*
- id: effect-assessing-factors-scale
  name: Масштаб
  description: |-
    Масштаб отражает число противников, размер охваченной области, широту влияния и тому подобное. Больший масштаб может быть как преимуществом, так и недостатком в зависимости от ситуации. В бою больше людей — лучше. При проникновении больше людей — помеха.

    При учёте факторов уровень эффекта может быть снижен ниже ограниченного, что даёт **нулевой эффект**, или повышен выше большого, что даёт **экстремальный эффект**.

    Если особое умение персонажа игрока даёт «+1 к эффекту», оно вступает в силу *после* того, как Мастер оценил уровень эффекта. Например, если у вас получился нулевой эффект, +1 к эффекту от умения **Телохранитель** Головореза поднимет его до ограниченного эффекта.

    Помните также, что персонаж игрока может **поднажать** (получить 2 стресса), чтобы получить +1 к эффекту своего действия.

    Не каждый фактор применим к каждой ситуации. И вести точный подсчёт каждый раз не нужно. Используйте факторы, чтобы принимать более уверенные решения, но не считайте себя связанным ими.
- id: effect-consequences
  name: Последствия
  description: |-
    Когда персонаж игрока терпит эффект от врага или опасной ситуации, это называется **последствием**. Последствия — спутники эффектов. Персонажи игроков влияют на окружающий мир, а взамен терпят последствия от рисков, с которыми сталкиваются.
- id: effect-trading-position-for-effect
  name: Обмен позиции на эффект
  description: |-
    После того как факторы учтены и Мастер (GM) объявил уровень эффекта, игрок может захотеть обменять позицию на эффект или наоборот. Например, если он собирается сделать рискованный бросок со стандартным эффектом (самый частый случай), он может вместо этого испытать удачу и сделать отчаянный бросок, но с большим эффектом.

    Такой обмен не входит в факторы эффекта, потому что это не то, что Мастер должен оценивать, назначая уровень эффекта. Но когда уровень назначен, вы всегда можете предложить игроку такой обмен, если он уместен в ситуации.

    *«Я Подкрадываюсь через двор и перемахиваю через стену, прячась в тени у канальной пристани с гондолой».*

    *«Не думаю, что ты сможешь пересечь двор одним быстрым рывком. Масштаб двора здесь фактор, так что твой эффект будет ограниченным. Скажем, этим действием ты доберёшься до середины, а потом тебе придётся Подкрадываться через другую половину (и остальных стражников там), чтобы достичь другой стороны».*

    *«Я не думал, что это так далеко. Хм. Ладно, а если я просто побегу изо всех сил? Смогу ли я добраться до конца, если сделаю отчаянный бросок?»*

    *«Да, меня устраивает!»*
