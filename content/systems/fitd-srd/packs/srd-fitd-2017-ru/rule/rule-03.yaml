- id: character-playbook-short-descriptor-of-character
  name: Краткое описание персонажа
  description: |-
    Здесь средний по объёму рассказ о персонаже. Укажите, чем он обычно занимается.

    **Здесь укажите условия получения опыта для этого персонажа.** В конце сессии отметьте опыт, если вы справились с трудностью так: вставьте сюда короткий список способов или действий. Например: насилие, принуждение, знания, обаяние, дерзость, расчёт, обман, влияние, скрытность, уклонение, технические навыки, хаос, выслеживание или оккультные силы.
- id: character-playbook-special-abilities
  name: Особые умения
  description: Выберите семь особых умений для вашего плейбука. Вот несколько примеров.
- id: character-playbook-starting-builds
  name: Стартовые сборки
  description: |-
    *Если вам нужна подсказка, как распределить четыре стартовые точки действий и выбрать особое умение, возьмите один из этих шаблонов.*

    **Пример 1.** 4 точки действий и особое умение

    **Пример 2.** 4 точки действий и особое умение

    **Пример 3.** 4 точки действий и особое умение

    **Пример 4.** 4 точки действий и особое умение
- id: characters-characters
  name: Персонажи
  description: |-
    Каждый персонаж игрока владеет всеми видами тёмных дел, которые представлены **действиями** игры. Все они умеют вести **Схватку** в поножовщине, **Подкрадываться** в тени, входить в **Настройку** на странную энергию, заводить **Знакомства** с нужными людьми ради сведений и так далее.

    Конечно, у вас будут и своя специализация, и свои навыки: то, что делает вашего персонажа особенно эффективным. Возможно, вы хотите уметь подчинять призраков и пропускать через своё тело тайную энергию. Или хотите использовать сеть связей преступного мира себе на пользу и замечать опасность до удара. Или просто хотите быть самым смертоносным бойцом с клинком. В этой главе вы узнаете, как создать своего уникального проходимца и выбрать умения, подходящие вашему стилю игры.
- id: coin-and-stash-coin
  name: Монеты
  description: |-
    **Монеты** — это абстрактная мера наличных денег и ликвидного имущества.

    Мелочь, которую персонажи игроков тратят в повседневной жизни, не учитывается. Если персонаж хочет потратиться ради небольшой цели (подкупить привратника), бросьте бросок удачи по **качеству образа жизни** персонажа.
- id: coin-and-stash-monetary-values-coin-use
  name: Как тратить монеты
  description: |-
    * Потратьте 1 **монету**, чтобы получить дополнительное **занятие** в **свободное время**.
    * Потратьте 1 **монету**, чтобы повысить уровень результата броска **занятия в свободное время**.
    * Потратьте **монеты**, чтобы избежать некоторых **хвостов** команды.
    * Положите **монеты** в **заначку** вашего персонажа, чтобы улучшить его образ жизни и обстоятельства после ухода на покой. См. следующий раздел.
    * Потратьте **монеты**, когда повышаете **Ранг** вашей команды.
- id: coin-and-stash-monetary-values
  name: Ценность в монетах
  description: |-
    * **1 монета**: полный кошелёк серебряных монет. Недельное жалованье.
    * **2 монеты**: хорошее оружие. Недельный доход небольшого предприятия. Произведение искусства. Комплект роскошной одежды.
    * **4 монеты**: сумка, полная серебра. Месячное жалованье.
    * **6 монет**: изысканное украшение. Тяжёлая ноша серебряных монет.
    * **8 монет**: хороший месячный доход небольшого предприятия. Небольшой сейф с деньгами и ценностями. Очень редкий предмет роскоши.
    * **10 монет**: продажа крупного имущества: кареты с козами, лошади, документа на небольшую недвижимость.

    Хранить при себе больше 4 **монет** непрактично. Излишек нужно потратить или положить в **заначку** (см. ниже). Кроме того, команда по умолчанию может хранить 4 **монеты** в своём логове. Если она улучшит его до **хранилища**, запас можно увеличить до **8**, а затем до **16** **монет**. Любые **монеты** сверх предела нужно потратить как можно скорее (обычно до следующего дела) или раздать участникам команды.

    Одна единица **монет** в серебре или другой крупной валюте занимает одну ячейку предметов вашей **ноши**, когда вы её несёте.
- id: coin-and-stash-stash-retirement-removing-coin-from-your-stash
  name: Как снять монеты с заначки
  description: |-
    Если вы хотите достать **монеты** из заначки, это можно сделать, но недёшево. Ваш персонаж продаёт часть имущества и вложений, чтобы быстро получить наличные. **За каждые 2 снятых с заначки вы получаете 1 **монету** наличными.**
- id: coin-and-stash-stash-retirement
  name: Заначка и уход на покой
  description: |-
    Когда вы отмечаете последнюю **травму** персонажа и он уходит на покой, его судьбу определяет количество **монет**, которые ему удалось отложить. Шкала заначки есть в листе вашего персонажа.

    * **Заначка 0-10:** **Бедняга.** Вы оказываетесь в канаве, погрязнув в пороках и нищете.
    * **Заначка 11-20: Скудно.** Крошечная лачуга, которую вы можете назвать своей.
    * **Заначка 21-39: Скромно.** Простой дом или квартира с небольшими удобствами. Возможно, вы держите таверну или небольшое дело.
    * **Заначка 40: Хорошо.** Обставленный дом или квартира с несколькими предметами роскоши. Возможно, вы ведёте дело среднего размера.

    Кроме того, каждый полный ряд заначки (10 **монет**) означает **уровень качества образа жизни персонажа**: от нулевого (жизнь на улице) до четвёртого (роскошь).

    > Кросс хочет побыть наедине с новым другом, но не может привести его в тайное логово, где живёт. Что делать? Райан, игрок Кросса, говорит, что хочет снять хорошую комнату на вечер, и Мастер (GM) просит бросок удачи по уровню образа жизни Кросса, чтобы узнать, какого качества комнату Кросс сможет себе позволить.
- id: consequences-and-harm-complication
  name: Осложнение
  description: |-
    Это последствие означает неприятности, растущую опасность или новую угрозу. Мастер (GM) может ввести немедленную проблему, вытекающую из действия прямо сейчас: комната загорается, вас обезоруживают, команда получает +1 **жар** от улик или свидетелей, вы теряете статус у фракции, цель уходит от вас и начинается погоня, прибывает подкрепление и так далее.

    Или Мастер может вместо этого заполнить деление часов осложнения. Допустим, есть часы уровня тревоги охраны в поместье. Или Мастер создаёт новые часы подозрительности знатных гостей на маскараде и заполняет в них деление. Заполните одно деление на часах для мелкого осложнения или два деления для стандартного осложнения.

    **Серьёзное осложнение** тяжелее: подкрепление окружает вас и загоняет в ловушку, комната горит, а упавшие балки перекрывают дверь, ваше оружие ломается, команда получает +2 **жар**, цель скрывается из виду и так далее. Заполните три деления на часах для серьёзного осложнения.

    **Не накладывайте осложнение, которое перечёркивает удачный бросок.** Если персонаж игрока пытается загнать врага в угол и выбрасывает **4/5**, не говорите, что враг сбегает. Бросок игрока удался, так что враг в углу... возможно, персонажу приходится заламывать его, и в потасовке враг хватает свой пистолет.
- id: consequences-and-harm-harm-harm-examples
  name: Примеры вреда
  description: |-
    **Смертельный (4)**: *Убит током, Утонул, Ударен в сердце.*

    **Тяжёлый (3)**: *Насажен на острое, Сломана нога, Прострелена грудь, Сильно обожжён, В ужасе.*

    **Умеренный (2)**: *Измотан, Глубокий порез руки, Сотрясение, В панике, Соблазнён.*

    **Лёгкий (1)**: *Избит, Обессилен, Рассеян, Напуган, Растерян.*

    Вред вроде «Обессилен» или «Измотан» может стать хорошим запасным последствием, если больше ничто не угрожает персонажу игрока (например, когда он всю ночь **Изучает** старые книги, ища слабости врага до его удара).
- id: consequences-and-harm-harm
  name: Вред
  description: |-
    Это последствие означает долговременную немощь (или смерть). Когда вы получаете вред, запишите в листе персонажа конкретную травму, соответствующую уровню полученного вреда. Если вы получили **лёгкий вред**, запишите его в нижний ряд. Если **умеренный вред**, запишите в средний ряд. Если **тяжёлый вред**, запишите в верхний ряд. Примеры вреда и шкалу вреда см. ниже.

    Ваш персонаж получает штраф, указанный в конце ряда, если какой-либо вред или весь вред, записанный в этом ряду, относится к текущей ситуации. Так, если у вас в нижнем ряду вред «Обессилен» и «Избит», вы получите меньший эффект, когда попытаетесь убежать от стражников. Когда вас сковывает вред из верхнего ряда (тяжёлый вред, уровень 3), ваш персонаж выведен из строя и ничего не может сделать без помощи другого или без того, чтобы вы **поднажали** ради этого действия.

    Если нужно отметить уровень вреда, а ряд уже заполнен, вред переходит в ряд выше. Так, если вы получили стандартный вред (уровень 2), но во втором ряду нет свободных мест, вам придётся записать тяжёлый вред (уровень 3). Если места закончились и в верхнем ряду, а вред нужно отметить там, ваш персонаж получает **катастрофическое необратимое последствие** (потеря конечности, внезапная смерть и так далее, по обстоятельствам).

    ---

    #### ВРЕД

    | Уровень | Вред | Эффект |
    | :--: | :-- | :--: |
    | 3 | *Раздроблена правая нога* | Нужна помощь |
    | 2 | | -1D |
    | 1 | *Обессилен*, *Избит* | Меньший эффект |

    *У этого персонажа три вреда: «Раздроблена правая нога» (уровень 3) и «Обессилен» с «Избит» (уровень 1). Если он получит ещё один вред уровня 1, тот перейдёт на уровень 2. Если получит ещё один вред уровня 3, тот перейдёт на уровень 4: смертельный.*
- id: consequences-and-harm-lost-opportunity
  name: Упущенная возможность
  description: |-
    Это последствие означает смену обстоятельств. У вас была возможность достичь цели этим действием, но она ускользает. Чтобы попробовать снова, нужен новый подход — обычно другое действие или изменившиеся обстоятельства. Допустим, вы пытались вступить в **Схватку** со знатной дамой, чтобы запереть её на балконе, но она уходит от вашего манёвра и отпрыгивает. Чтобы всё же загнать её в угол, придётся найти другой путь — например, **Повлиять** на неё своим плутовским обаянием.
- id: consequences-and-harm-reduced-effect
  name: Меньший эффект
  description: |-
    Это последствие означает ухудшенный результат. Действие персонажа игрока не так эффективно, как он рассчитывал. Вы попали по нему, но это лишь царапина. Она принимает поддельное приглашение, но весь вечер будет следить за вами. Вы можете взобраться на стену, но дело идёт медленно: вы лишь на полпути. По сути, это последствие снижает уровень эффекта действия персонажа игрока на один после учёта всех остальных факторов.
- id: consequences-and-harm-worse-position
  name: Худшая позиция
  description: |-
    Это последствие означает потерю контроля над ситуацией: действие заводит вас в более опасную позицию. Допустим, вы перепрыгиваете на соседнюю крышу, но повисаете на кончиках пальцев. Вы не провалились, но и не преуспели. Можно попробовать снова, перебросив кубы уже в новой, худшей позиции. Это хороший выбор последствия, чтобы показать нарастающее действие. Ситуация может пройти путь от контролируемой к рискованной и к отчаянной, пока развивается действие, а персонаж игрока увязает в неприятностях всё глубже.
- id: consequences-and-harm
  name: Последствия и вред
  description: |-
    Действия врагов, плохие обстоятельства или исход броска могут навлечь на персонажа игрока **последствия**. Их пять типов (справа).

    Одно и то же обстоятельство может привести к одному или нескольким последствиям, в зависимости от ситуации. Последствия определяет Мастер (GM), исходя из происходящего в вымысле, а также из стиля и тона, заданных игровой группой.
