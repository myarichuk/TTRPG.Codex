- id: advancement-crew-advancement
  name: Развитие команды
  description: |-
    В конце сессии просмотрите триггеры опыта команды и отметьте 1 опыт команды за каждый пункт, который сработал за сессию. Если пункт сработал несколько раз или особенно значимо, отметьте за него 2 опыта команды. Триггеры опыта команды таковы:

    * **Триггер опыта, свой для вашей команды.** Например, у Контрабандистов это *«Проведите контрабандную операцию или найдите новых клиентов или источники контрабанды».* Если команда успешно завершила операцию по такому триггеру, отметьте опыт.
    * **Столкнитесь с вызовами выше вашего нынешнего положения.** Если вы схватились с более высокими рангами или с более опасными противниками, отметьте за это опыт.
    * **Укрепите репутацию команды или создайте новую.** Вспомните репутацию команды. Сделали ли вы что-нибудь, чтобы её поддержать? Отметьте опыт и в том случае, если вы создали команде новую репутацию.
    * **Выразите цели, стремления, внутренний конфликт или суть команды.** Этот пункт очень широкий! По сути, случилось ли что-нибудь, что подчеркнуло особенности, делающие вашу команду уникальной?

    **Когда вы заполните шкалу развития команды**, сотрите отметки и возьмите новое **особое умение** или отметьте **две клетки улучшения команды**.

    > Например, когда команда Убийц получает развитие, она может взять новое особое умение, скажем, **Хищники**. Или отметить два улучшения, например **Контакты в Железном Крюке** и **Тренировка** **воли**.

    Скажите, как команда получила это новое умение или улучшения. *Откуда оно взялось? Как оно становится новой частью команды?*
- id: advancement-crew-advancement-profits
  name: Прибыль
  description: |-
    Каждый раз, когда команда получает развитие, **каждый игровой персонаж получает заначку** в размере ранга команды+2: это прибыль, которую команда приносит в ходе своей работы.
- id: advancement-pc-advancement
  name: Развитие игровых персонажей
  description: |-
    Каждый игрок ведёт учёт очков опыта (**опыта**), которые зарабатывает его персонаж.

    Во время игровой сессии отмечайте опыт:

    * Когда вы делаете **отчаянный бросок действия**. Отметьте 1 опыт в атрибуте для действия, которое вы бросали. Например, если вы бросаете отчаянное действие **Схватка**, вы отмечаете опыт в **Сноровке**. Если вы бросаете в **групповом действии**, которое отчаянное, вы тоже отмечаете опыт.

    В конце сессии просмотрите **триггеры опыта** на листе персонажа. За каждый из них отметьте 1 опыт, если он сработал хотя бы раз, или 2 опыта, если он срабатывал за сессию много раз. Триггеры опыта таковы:

    * **Триггер опыта, свой для вашего плейбука.** Например, у Головореза это *«Справьтесь с проблемой насилием или принуждением».* Чтобы «справляться с проблемой», ваш персонаж должен попытаться преодолеть серьёзное препятствие или угрозу. Неважно, удалось действие или нет. Опыт вы получаете в любом случае.
    * **Вы выразили свои убеждения, стремления, происхождение или прошлое.** Убеждения и стремления вашего персонажа определяете вы сами, от сессии к сессии. Не стесняйтесь рассказывать о них группе, когда отмечаете опыт.
    * **Вы боролись с проблемами из-за своего порока или травм.** Отметьте за это опыт, если порок толкнул вас на дурной поступок или если состояние-травма доставило вам неприятности. Простое потакание пороку не считается борьбой с ним (если только вы не **злоупотребили** им).

    Опыт в конце сессии можно отмечать на любых шкалах опыта по вашему выбору (на любом атрибуте или на шкале опыта плейбука).

    Когда вы заполняете шкалу опыта, сотрите все отметки и возьмите **развитие**. Когда вы берёте развитие со шкалы плейбука, вы можете выбрать дополнительное **особое умение**. Когда вы берёте развитие с шкалы атрибута, вы можете добавить **ещё одну точку действия** к одному из действий этого атрибута.

    > Надя играет Ищейкой. В конце сессии она просматривает свои триггеры опыта и сообщает группе, сколько опыта получает. За сессию она сделала два отчаянных броска действия **Охота**, поэтому отметила 2 опыта на шкале опыта **Рассудка**. Она справилась с несколькими проблемами выслеживанием или насилием, так что отмечает за это 2 опыта. Она много раз проявляла своё ируванское происхождение в делах с Красными Кушаками, поэтому берёт за это 2 опыта. Она также показала убеждения своего персонажа, но 2 опыта — максимум для этого пункта, так что больше она не получает. С пороком и травмами она не боролась, поэтому опыта за это нет. Всего в конце сессии выходит 4 опыта. Она решает вложить их все в шкалу опыта **Рассудка**. Шкала заполняется, и она добавляет новую точку действия в **Охоту**.

    Опыт можно заработать и **тренировкой** в свободное время. Когда вы тренируетесь, отметьте опыт в одном из своих атрибутов или в плейбуке. Каждую шкалу опыта можно тренировать только один раз за фазу свободного времени.
- id: character-creation-assign-four-action-dots
  name: Распределите четыре точки действий
  description: |-
    В вашем плейбуке уже расставлены три точки действий. Вы добавляете ещё четыре точки (всего получится семь). В начале игры ни одно действие не может иметь больше двух точек (если только особое умение не говорит иного). Распределите свои четыре точки так:

    * Поставьте одну точку в любое действие, которое, по-вашему, отражает **происхождение** вашего персонажа.
    * Поставьте одну точку в любое действие, которое, по-вашему, отражает **прошлое** вашего персонажа.
    * Поставьте ещё две точки куда пожелаете (помните, что максимальный рейтинг равен 2).
- id: character-creation-character-creation-summary
  name: Создание персонажа вкратце
  description: |-
    **1** **Выберите плейбук.** Ваш плейбук задаёт репутацию персонажа, его особые умения и то, как он развивается.

    **2** **Выберите происхождение.** Уточните выбор заметкой о жизни своей семьи. *Например, рудокопы, а теперь беженцы от войны.*

    **3** **Выберите прошлое.** Уточните выбор своей конкретной историей. *Например, Труд: охотник, мятежник.*

    **4** **Распределите четыре точки действий.** При создании персонажа ни одно действие не может начинаться с рейтинга выше 2. *(После создания рейтинги действий можно повышать до 3. Когда ваша команда откроет развитие «Мастерство», вы сможете повышать действия до рейтинга 4.)*

    **5** **Выберите особое умение.** Они находятся в сером столбце посередине листа персонажа. Если не можете решить, выберите первое умение в списке: оно стоит там как хороший первый вариант.

    **6** **Выберите близкого друга и соперника.** Отметьте того, кто близкий друг, давний союзник, родственник или возлюбленный (треугольник вершиной вверх). Отметьте того, кто соперник, враг, брошенный возлюбленный, преданный партнёр и так далее (треугольник вершиной вниз).

    **7** **Выберите свой порок.** Выберите предпочитаемый вид порока, уточните его коротким описанием и укажите имя и место жительства своего поставщика порока.

    **8** **Запишите имя, прозвище и внешность.** Выберите имя, прозвище (если оно у вас есть) и запишите несколько слов о своей внешности. Примеры даны в предыдущих разделах.
- id: character-creation-choose-a-background
  name: Выберите прошлое
  description: |-
    **Прошлое** вашего персонажа описывает, чем он занимался до того, как присоединился к команде. Выберите прошлое и запишите подробность о нём, которая относится именно к вашему персонажу.
- id: character-creation-choose-a-heritage
  name: Выберите происхождение
  description: |-
    **Происхождение** вашего персонажа описывает, откуда родом его семья. Когда вы выбираете происхождение, запишите на строке выше подробность о жизни своей семьи.
- id: character-creation-choose-a-special-ability
  name: Выберите особое умение
  description: |-
    Просмотрите особые умения своего плейбука и выберите одно. Если не можете решить, какое взять, берите первое в списке: оно стоит там как хороший вариант по умолчанию.
- id: character-creation-choose-a-special-ability-special-armor
  name: Особая броня
  description: |-
    Некоторые особые умения упоминают вашу **особую броню**. На каждом листе персонажа есть набор из трёх клеток для учёта использования брони (стандартной, тяжёлой и особой). Если у вас есть умения, использующие особую броню, отметьте её клетку, когда задействуете одно из них. Если у вас нет особых умений, использующих особую броню, то эту клетку брони вы не можете использовать вовсе.
- id: character-creation-choose-one-close-friend-and-one-rival
  name: Выберите близкого друга и соперника
  description: |-
    В каждом плейбуке есть список NPC, которых знает ваш персонаж. Выберите из списка того, с кем у вас близкие отношения (хороший друг, возлюбленный, родственник и так далее). Отметьте треугольник вершиной вверх рядом с его именем. Затем выберите другого NPC из списка, который ваш соперник или враг. Отметьте треугольник вершиной вниз рядом с его именем.
- id: character-creation-choose-your-vice
  name: Выберите свой порок
  description: |-
    Каждый персонаж подвластен тому или иному пороку, которому предаётся, чтобы справляться со стрессом. Выберите порок из списка и опишите его на строке выше: с подробностями, именем и местом жительства вашего **поставщика порока**.

    * **Вера**: вы преданы незримой силе, забытому богу, предку и так далее.
    * **Азарт**: вас тянет к играм на удачу, ставкам на состязания и так далее.
    * **Роскошь**: дорогое или показное изобилие.
    * **Долг**: вы преданы семье, делу, организации, благотворительности и так далее.
    * **Удовольствия**: наслаждение любовниками, едой, выпивкой, дурманом, искусством, театром и так далее.
    * **Забытьё**: вы ищете беспамятства в злоупотреблении дурманом, пьянстве до упаду, избиении до полусмерти на боевых аренах и так далее.
    * **Странное**: вы экспериментируете со странными эссенциями, водите знакомство с беглыми духами, соблюдаете причудливые ритуалы или запреты и так далее.
- id: character-creation-create-playbooks
  name: Создайте плейбуки
  description: |-
    Плейбуком мы называем лист со всеми особыми правилами для игры за определённый тип персонажа в игре на основе Blades. Например, вы можете создать плейбук **Солдат** с особыми умениями, связанными с боем, или плейбук **Медик** с особыми умениями, связанными с полевой медициной.

    Выбирая плейбук, вы выбираете набор **особых умений** (они дают вашему персонажу способы по-разному нарушать правила) и набор **триггеров опыта** (они определяют, как вы зарабатываете опыт для развития персонажа). Но каждый плейбук в душе представляет проходимца. У Головореза есть особые умения, связанные с боем, но это не значит, что он «боец» в игре. Любой тип персонажа может хорошо драться. Считайте плейбук областью интересов и предпочтений, а не уникальным набором навыков.

    Поэтому мы называем их «плейбуками», а не «классами персонажей» или «архетипами». Вы выбираете набор начальных рейтингов действий и особых умений, доступных вашему персонажу, но не определяете его неизменную сущность или истинную природу. Ваш персонаж будет расти и меняться со временем; то, кем он станет, — часть удовольствия от игры.

    Выбрав плейбук, выполните шаги ниже, чтобы завершить персонажа.
- id: character-creation-loadout
  name: Снаряжение
  description: |-
    Вам доступны все **предметы** с вашего листа персонажа. Для каждой операции решите, какой будет **ноша** вашего персонажа. Во время операции вы можете сказать, что нужный предмет у персонажа под рукой, отметив клетку этого предмета, но не больше предметов, чем равна выбранная ноша. Ноша также определяет вашу скорость передвижения и заметность:

    * **Ноша 1-3**: **лёгкая.** *Вы быстрее и менее заметны; вы сливаетесь с горожанами.*
    * **Ноша 4/5**: **обычная.** *Вы выглядите как проходимец, готовый к неприятностям.*
    * **Ноша 6**: **тяжёлая.** *Вы медленнее. Вы выглядите как оперативник на задании.*
    * **Ноша 7-9**: **перегруженная.** *Вы перегружены и не можете делать ничего, кроме очень медленного движения.*

    Некоторые особые умения (например, **Вьючный мул** Головореза или Оснастка Убийцы) повышают пределы ноши.

    Некоторые предметы считаются за два предмета по ноше (у них две соединённые клетки). *Предметы, выделенные курсивом, в вашу ношу не входят.*

    Выбирать конкретные предметы сейчас не нужно. Просмотрите свои личные предметы и описания стандартных предметов.
- id: character-creation-record-your-name-alias-look
  name: Запишите имя, прозвище и внешность
  description: |-
    Выберите имя для своего персонажа из списка примеров или придумайте своё. Если в преступном мире ваш персонаж пользуется прозвищем или кличкой, запишите её. Запишите несколько ярких слов, описывающих внешность персонажа (примеры даны в следующих разделах).
- id: character-creation-review-your-details
  name: Просмотрите подробности
  description: |-
    Просмотрите подробности на своём листе персонажа, особенно **триггеры опыта** своего плейбука (например, «Получите опыт, когда справитесь с проблемой знаниями или тайной силой») и **особые предметы**, доступные персонажу вашего типа (например, маску духа у Шёпота). Вам с самого начала доступны все предметы с вашего листа, поэтому не переживайте о выборе конкретных вещей: что персонаж несёт с собой, вы решите позже, уже на деле.

    Вот и всё! Ваш персонаж готов к игре. Когда вы начнёте первую сессию, Мастер (GM) задаст вам несколько вопросов о том, кто вы, каковы ваши взгляды или некоторые события прошлого. Если вы не знаете ответов, придумайте их. Или попросите идей у других игроков.
- id: character-playbook-character-items
  name: Предметы персонажа
  description: |-
    Добавьте список из пяти особых предметов, которые либо Отличные (+1 к качеству), либо лёгкие (уменьшают ношу), либо редкие, либо иным образом свойственны именно этому персонажу.

    Вот несколько примеров: оружие, одежда, тайные приспособления, специализированные инструменты, особое снаряжение, толковые питомцы или сверхъестественные предметы.
- id: character-playbook-friends-rivals
  name: Друзья, соперники
  description: |-
    Здесь указывается список из пяти возможных друзей или соперников с описанием каждого. Вот некоторые варианты: шпион, охотник за головами, кулачный боец, хладнокровный убийца, вымогатель, лекарь, наёмный убийца, часовой, аптекарь, жрица, дворянин, городской писарь, офицер, инспектор, нищий, взломщик замков, главарь банды, торговец дурманом, хозяин таверны, проститутка, острожник, торговец сведениями, слуга, архивариус или сверхъестественная сущность.

    В вопросах можно уточнить, откуда вы знаете друга, что он сделал для вас, что вы делаете для него и какие у вас отношения.
