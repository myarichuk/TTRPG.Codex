- id: magnitude-tier-quality-force
  name: "РАНГ И КАЧЕСТВО / СИЛА"
  description: |-
    |   0    |     1      |    2     |     3      |      4       |      5       |       6        |
    | :----: | :--------: | :------: | :--------: | :----------: | :----------: | :------------: |
    | Плохое | Приемлемое | Хорошее  |  Отличное  | Превосходное | Безупречное  |  Легендарное   |
    | Слабая | Умеренная  |  Сильная | Серьёзная  |    Мощная    | Подавляющая  | Сокрушительная |
- id: payoff
  name: Добыча
  description: |-
    После дела персонажи подводят итоги дохода от операции. Успешное дело приносит и **репутацию**, и **монеты**.

    По умолчанию команда получает 2 **репутации** за дело. Если цель дела выше вас по рангу, получите **+1** **репутации** **за каждый ранг выше**. Если цель ниже рангом, вы получаете **-1** **репутации** **за каждый ранг ниже** (минимум ноль).

    > Если ваша команда имеет ранг I и успешно проворачивает дело против цели ранга III, вы получаете 4 **репутации** (2 **репутации**, +2 **репутации** за цель на два ранга выше вас). Если ваша команда имеет ранг III и завершает дело против цели ранга I, вы получаете 0 **репутации** (2 репутации, -2 репутации за цель более низкого ранга).

    Если вы держите операцию в полной тайне, так что о ней никто не узнает, вы получаете ноль **репутации**. Отметьте репутацию на шкале **репутации** в листе команды.

    Команда получает **монеты** в зависимости от характера операции и (или) захваченной добычи:

    * **2 монеты**: мелкая работа; несколько туго набитых кошельков.
    * **4 монеты**: небольшая работа; денежный ящик.
    * **6 монет**: стандартное дело; приличная добыча.
    * **8 монет**: крупное дело; серьёзная добыча.
    * **10+ монет**: крупнейшее дело; внушительная добыча.

    Запишите **монеты** в лист команды или поделите их между членами команды, как сочтёте нужным.

    В большинстве районов есть криминальные авторитеты, которые ждут, что небольшие команды будут отчислять им десятину с дел. Спросите Мастера (GM), есть ли босс, которому вам следует платить. **Вычтите **монеты** в количестве, равном рангу вашей команды +1**, когда платите десятину боссу или более крупной организации. *Если вы должны платить боссу, но не платите, запустите часы, отсчитывающие, как у него иссякает терпение. Делайте на них деление каждый раз, когда не платите. Каждый раз, когда они заполняются, вы теряете 1 пункт статуса фракции у этого босса.*

    Вы можете сыграть сцену встречи с клиентом или покровителем, который платит команде, если там есть что-то интересное. Если нет, просто пропустите её и переходите к следующей части свободного времени.

    Мастер, ни в коем случае не издевайтесь над игроками, когда речь о добыче. Не говорите, что клиент солгал и награды не будет. Или что встреча для оплаты на самом деле ловушка и так далее. Такое — основа криминальной литературы, но в *Blades* у персонажей и без того хватает проблем со всех сторон. Когда дело доходит до оплаты, просто дайте им то, что они заработали.
- id: planning-engagement
  name: Планирование и завязка
  description: |-
    Ваша команда тратит время на планирование каждого дела. Они собираются вокруг мерцающего фонаря в своём логове, склоняются над наспех набросанными картами, шёпотом строят замыслы и хитрости, спорят о лучшем подходе, сетуют на грозящие опасности и мечтают о стопках монет.

    Но вам, игрокам, не нужно заниматься скрупулёзным планированием. Персонажи делают это за кадром. Всё, что от вас требуется, — выбрать, **какой тип плана** персонажи *уже составили*. Не нужно переживать из-за мелочей и пытаться заранее предусмотреть все случайности, ведь именно **бросок завязки** (о нём в следующем разделе) в конечном счёте решает, насколько вам придётся туго, когда план приходит в движение. *Идеальных планов не бывает.* Всего не учесть. Эта система исходит из того, что в любой операции всегда есть неизвестные факторы и неприятности, крупные или мелкие; вам остаётся лишь выкручиваться как можно лучше.

    Существует шесть планов, у каждого есть недостающая **деталь**, которую вам нужно назвать (см. список ниже). Чтобы «спланировать операцию», просто выберите план и назовите деталь. Затем Мастер (GM) **переходит к действию**: первые мгновения операции разворачиваются на глазах.

    * Нападение — совершить насилие над целью. *Деталь: точка атаки.*
    * Обман — заманить, провести или обвести вокруг пальца. *Деталь: способ обмана.*
    * Скрытность — проникнуть незамеченным. *Деталь: точка проникновения.*
    * Оккультизм — вступить в контакт со сверхъестественной силой. *Деталь: тайный метод.*
    * Переговоры — договариваться, торговаться или убеждать. *Деталь: связь в обществе.*
    * Перевозка — провезти груз или людей сквозь опасность. *Деталь: маршрут и средства.*
- id: planning-engagement-engagement-roll
  name: Бросок завязки
  description: |-
    Когда игроки выбрали план и назвали его деталь, Мастер (GM) переходит к действию: описывает сцену, в которой команда начинает операцию и сталкивается с первым препятствием. Но как это определяется? То, как Мастер опишет начальную ситуацию, может сильно повлиять на то, насколько простой или хлопотной окажется операция. Вместо того чтобы ждать от Мастера, что он каждый раз «угадает», мы используем бросок кубов. Это **бросок завязки**.

    Бросок завязки — это **бросок удачи**, который начинается с **1d за чистое везение**. Измените пул кубов с учётом крупных преимуществ или недостатков.
- id: planning-engagement-engagement-roll-engagement-roll
  name: "БРОСОК ЗАВЯЗКИ"
  description: |-
    ⏣ **1d** за чистое везение.

    ⊕ **+1d** за каждое **крупное преимущество**.

    ⊖ **-1d** за каждый **крупный недостаток**.

    * **Критический успех**: исключительный результат. *Вы уже преодолели первое препятствие и находитесь в контролируемой позиции для того, что будет дальше.*
    * **6**: хороший результат. *В начале действия вы в контролируемой позиции.*
    * **4/5**: смешанный результат. *В начале действия вы в рискованной позиции.*
    * **1-3**: плохой результат. *В начале действия вы в отчаянной позиции.*

    ---

    > Первые препятствия у дома ведьм — хитрые замки и магические ловушки. Бросок завязки отправляет нас на крышу за окном, где персонажи пытаются тихо и осторожно проникнуть на чердак.
    >
    > Персонажи выбили дверь и ворвались в переднюю комнату логова банды, сверкая оружием, прямо в водоворот схватки с первыми охранниками.
    >
    > Персонажи вежливо общались на приёме, маневрируя, чтобы переговорить с глазу на глаз с могущественным лордом. Когда группа молодых дворян отходит от него, персонажи подходят и заводят с ним беседу.

    Если игроки хотят включить особую подготовку или хитрую заготовку, они могут сделать это с помощью **флэшбэков** во время дела. К этому нужно привыкнуть. Поначалу игроки могут упираться, опасаясь, что вы пропускаете важное, что они хотят сделать. Но когда вы привыкнете, сразу прыгать в гущу дела получается намного эффективнее. Увидев ситуацию, в которой они оказались, игроки будут «планировать» во флэшбэках целенаправленно и с пользой, а не просто гадать об обстоятельствах и событиях, которых может и не случиться.
- id: planning-engagement-engagement-roll-how-long-does-it-last
  name: Как долго это длится?
  description: Бросок завязки определяет начальную позицию для действий персонажей. Как долго она сохраняется? Остаётся ли ситуация отчаянной? Нет. Как только начальные действия разрешены, вы следуете обычному порядку определения позиции для всех остальных бросков во время дела. Бросок завязки — это быстрый короткий путь, чтобы начать и запустить действие; после этого он ни на что не влияет.
- id: planning-engagement-engagement-roll-major-advantages-disadvantages
  name: Крупные преимущества / недостатки
  description: |-
    * Эта операция особенно смелая или дерзкая? Получите **+1d**. Эта операция слишком сложная или зависит от многих факторов? Получите **-1d**.
    * Открывает ли **деталь плана** уязвимость цели или бьёт по её самому слабому месту? Получите **+1d**. Цель сильнее всего именно против такого подхода, или у неё есть особая защита или особая подготовка? Получите **-1d**.
    * Могут ли какие-либо ваши **друзья или контакты** помочь в этой операции или подсказать что-то? Получите **+1d**. Мешают ли операции какие-либо **враги или соперники**? Получите **-1d**.
    * Есть ли какие-либо **другие обстоятельства**, которые вы хотите учесть? Возможно, цель более низкого ранга даст вам +1d. Возможно, цель более высокого ранга даст вам -1d. Возможно, ситуация в районе делает операцию более или менее хитрой.

    Бросок завязки исходит из того, что персонажи подходят к цели настолько умно, насколько могут, учитывая выбранные ими план и деталь, поэтому нам не нужно разыгрывать осторожное прощупывание, особые меры предосторожности и прочее тягучее бездействие. Бросок завязки охватывает всё это. Персонажи уже в действии и стоят перед первым препятствием: на крыше, вскрывая замок окна; выбивая дверь в логово соперничающей банды; маневрируя, чтобы поговорить с лордом на маскараде, и так далее.

    Не делайте бросок завязки, а затем не описывайте, как персонажи *подходят* к цели. Именно подход и разрешает бросок завязки. Перейдите к действию, которое возникает *из-за* этого первоначального подхода, — к первому серьёзному препятствию на их пути.
- id: planning-engagement-engagement-roll-outcomes
  name: Исходы
  description: |-
    Исход броска завязки определяет **позицию** для первых действий персонажей, когда мы переходим к делу в разгаре. Результат **1-3** означает отчаянную позицию. **4/5** — рискованную. **6** даёт контролируемую позицию. А **критический успех** уносит действие за первое препятствие, глубже в дело.

    Как бы низок ни был ваш ранг и насколько бы вас ни превосходили, отчаянная позиция — худшее, что может получиться из процесса «план + деталь + завязка». Так задумано, чтобы планирование имело значение, но не требовало долгой оптимизации и придирок. Даже если вы безрассудно броситесь в бой и положитесь на удачу, сильно обжечься не получится. К тому же вам, возможно, даже захочется этих отчаянных бросков, чтобы персонажи получали больше опыта, а это помогает начинающим персонажам набрать ход в развитии.

    Описывая ситуацию после броска, используйте особенности цели, чтобы нарисовать позицию персонажей. Чем странная оккультная банда может создать отчаянную позицию для взломщиков? Чем жестокие и беспощадные мясники могут создать рискованную угрозу для нападающих головорезов? Чем тщеславный и напыщенный лорд может создать контролируемую возможность для манипулятора-проходимца? Воспользуйтесь случаем, чтобы показать, насколько опасны и способны враги персонажей: не подавайте плохой бросок завязки как неудачу персонажей, иначе в будущем игроки не будут доверять этому приёму. Да, здесь всё начинается отчаянно, против жутких оккультистов, но вы как раз из тех персонажей, у кого хватит дерзости с ними схватиться. Приступим.
- id: planning-engagement-flashbacks
  name: Флэшбэки
  description: |-
    Правила не различают действия, совершённые в настоящий момент, и действия, совершённые в прошлом. Когда операция идёт, вы можете вызвать **флэшбэк**, чтобы сделать бросок за действие в прошлом, влияющее на вашу нынешнюю ситуацию. Возможно, вы уговорили сержанта районной Стражи отменить сегодняшний патруль, и вы делаете бросок **Влияния**, чтобы узнать, как это прошло.

    Когда вы запускаете действие флэшбэка, Мастер (GM) назначает **цену в стрессе**.

    * **0** **стресса**: обычное действие, для которого у вас была лёгкая возможность. *Резак ***свела знакомства*** с подругой, чтобы заранее договориться прийти на игру в кости и внезапно выскочить неожиданным союзником.*
    * **1** **стресс**: сложное действие или маловероятная возможность. *Гончий **изящно спрятал** свои пистолеты возле карточного стола, чтобы забрать их после обыска у входа.*
    * **2** **(или больше) стресса**: продуманное действие, потребовавшее особых возможностей или запасных вариантов. *Шёпот уже **изучила** историю этого поместья и узнала о призраке, который, как известно, обитает у его древнего канального причала, — призраке, которого можно заставить выдать место потайного хранилища.*

    После уплаты цены в стрессе действие флэшбэка обрабатывается как любое другое. Иногда оно потребует броска действия, потому что тут есть опасность или трудности. Иногда флэшбэк потребует броска удачи, потому что нужно просто выяснить, насколько хорошо (или сколько, или как долго и так далее). А иногда флэшбэк вообще не требует броска: достаточно заплатить стресс, и дело сделано.

    Если флэшбэк связан с действием **свободного времени**, заплатите за него 1 **монету** или 1 **репутации** вместо стресса.

    Один из лучших случаев для флэшбэка — когда **бросок завязки** прошёл плохо. После того как Мастер опишет, в какую беду вы попали, вы можете запросить флэшбэк к особой подготовке, которую вы сделали «на всякий случай», если случится что-то подобное. Так ваше «планирование во флэшбэках» будет сосредоточено на проблемах, которые *действительно возникли*, а не на тех, что *могли бы* возникнуть.
- id: planning-engagement-flashbacks-limits-of-flashbacks
  name: Пределы флэшбэков
  description: |-
    Флэшбэк — это не путешествие во времени. Он не может «отменить» то, что только что произошло в настоящем. Например, если инспектор допрашивает вас о недавних кражах оккультных артефактов, когда вы на приёме у Леди, вы не можете запросить флэшбэк, чтобы убить инспектора накануне вечером. Она здесь, сейчас, допрашивает вас, и это установлено в вымышленном мире. Но вы *можете* запросить флэшбэк, показывающий, что вы намеренно навели инспектора на себя, чтобы она сама подошла к вам на приёме, и вы смогли воспользоваться случаем и впечатлить Леди своим апломбом и дерзостью.

    #### примеры флэшбэков

    > «Я хочу флэшбэк на более раннюю часть ночи: я пробираюсь в конюшни и скармливаю всем их козлам огненную траву, чтобы они взбесились и устроили отвлекающий шум для нашего проникновения».
    >
    > «Ха! Здорово. Ладно, это звучит довольно хитро, с этими норовистыми козлами... 1 стресс».
    >
    > «Мне бросать Подкрадывание, чтобы прокрасться и подложить её?»
    >
    > «Нет. Охрана их козлятника — это конюх, который обычно и так спит. Ты легко останешься незамеченным».
    >
    > «То есть просто получается?»
    >
    > «Э-э... не так быстро. Когда ты захочешь, чтобы отвлекающий шум сработал, сделаем бросок удачи, чтобы выяснить, насколько безумным получится Манёвр с Козлами и Огненной Травой. Три куба».
    >
    > ---
    >
    > «Бросок завязки... **2**. Похоже, для вас ситуация отчаянная! Хм. Ладно, вы внутри территории банды в доках и крадётесь по теням рядом с огромными металлическими цистернами. Но тут вспыхивают все электрические лампы. Большая металлическая дверь склада откатывается, и вы слышите, как через ворота въезжает тяжёлая повозка. Похоже, им как раз привозят груз, и куча членов банды вышла его встречать. Они вот-вот окажутся прямо на вас. Что делаете?»
    >
    > «Погоди, я хочу флэшбэк».
    >
    > «Хорошо, на что?»
    >
    > «Э-э. Что-нибудь... полезное? Чёрт, не знаю, что это может быть. Есть идеи?»
    >
    > «О, а что если вчера ты свёл знакомства с друзьями-докерами, и они проболтались об этой поставке, так что мы заминировали груз».
    >
    > «Ох, это просто бесподобно. Но чуточку безумно. Наверное, 2 стресса за это?»
    >
    > «Годится. Но давай сделаем этот бросок Знакомств и посмотрим, не выдвинули ли твои друзья-докеры требований и не усложнили ли тебе что-нибудь. Потом выясним, как хорошо сработала бомба. Кто за неё отвечал?»
    >
    > «Я. Брошу Механику, чтобы выставить запал как надо. Надеюсь».
- id: planning-engagement-giving-up-on-a-score
  name: Отказ от дела
  description: Когда вы отказываетесь от дела, вы переходите к **свободному времени**. Следуйте фазам свободного времени из следующей главы. Обычно **добыча** будет нулевой, ведь вы ничего не добились. **Жар** и **хвосты** вас всё равно настигнут, как обычно.
- id: planning-engagement-item-loadouts
  name: Набор предметов
  description: Когда план и деталь определены, каждый игрок выбирает **ношу** своего персонажа. Она показывает, сколько снаряжения персонаж берёт на операцию. Выбирать отдельные предметы не нужно, достаточно назвать максимум, который будет доступен во время действия.
- id: planning-engagement-linked-plans
  name: Связанные планы
  description: |-
    Иногда операция словно требует нескольких связанных планов. Типичный случай — команда, которая хочет атаковать с двух сторон. «Вы устраиваете отвлекающий манёвр в таверне, и когда они пошлют туда головорезов, мы вломимся в их логово». Есть два способа с этим справиться.

    1. Отвлекающий манёвр — это **подготовительный манёвр**, который член команды выполняет в рамках плана. Успешный подготовительный манёвр может улучшить **позицию** товарищей (возможно, компенсируя плохой бросок завязки) или дать больший эффект. Неудачный подготовительный манёвр может создать проблемы для второй части плана; простое последствие — штраф -1d к броску завязки. *Если это уместно, член команды, выполнявший подготовку, может вернуться в основную операцию и присоединиться к команде позже, чтобы не сидеть без дела и не ждать.*
    2. Отвлекающий манёвр — это отдельные план, завязка и операция, исход которых создаёт возможность для будущего плана. Используйте этот вариант, когда первая часть плана необходима, чтобы вторая вообще могла произойти. Например, вы можете выполнить план скрытности, чтобы выкрасть артефакт из Музея Древних, а позже использовать этот артефакт в оккультном плане, чтобы освятить храм вашего забытого бога. В таком случае после первой части плана вы, как обычно, переходите к свободному времени (и к добыче, **жару** и так далее).

    Подойдёт любой вариант. Обычно всё решает интерес. Достаточно ли интересна идея связанного плана, чтобы разыгрывать её по моментам? Нужна ли она, чтобы второй план вообще имел смысл? Если да, сделайте её отдельной операцией. Если нет, просто используйте подготовительный манёвр.
- id: planning-engagement-the-detail
  name: Деталь
  description: Выбирая план, вы называете недостающую **деталь**, например точку атаки, связь в обществе и так далее. Если вы не знаете деталь, вы можете каким-то образом **собрать сведения**, чтобы её выяснить.
- id: progress-clocks
  name: Часы прогресса
  description: |-
    **Часы прогресса** — это круг, разделённый на деления (примеры см. справа). Нарисуйте часы прогресса, когда нужно отслеживать продолжающиеся усилия против препятствия или приближение надвигающихся неприятностей.

    *Пробираетесь в сторожевую башню констеблей? Сделайте часы, отслеживающие уровень тревоги патрулирующей стражи. Когда персонажи терпят последствия из-за частичных успехов или провалов, закрашивайте деления на часах, пока не поднимется тревога.*

    Как правило, чем сложнее проблема, тем больше делений в часах прогресса.

    Сложное препятствие — это часы на 4 деления. Более запутанное препятствие — часы на 6. Грозное препятствие — часы на 8 делений.

    Создавая часы, привязывайте их к **препятствию**, а не к способу. Часы для проникновения должны называться «Внутренние патрули» и «Башня», а не «Прокрасться мимо стражи» или «Взобраться на башню». Патрули и башня — это препятствия; персонажи могут пытаться одолеть их разными способами.

    Сложные вражеские угрозы можно разбить на несколько «слоёв», у каждого из которых свои часы прогресса. Например, у штаб-квартиры портовых банд могут быть часы «Охрана периметра», «Внутренняя стража» и «Охрана кабинета». Команде придётся пройти все три слоя, чтобы добраться до личного сейфа босса банды и его ценностей.

    Помните, что часы отслеживают прогресс. Они отражают вымышленную ситуацию, чтобы группа могла оценить, как у неё идут дела. Часы подобны спидометру в машине. Они *показывают* скорость транспорта, но не определяют её.
- id: progress-clocks-danger-clocks
  name: Часы опасности
  description: |-
    Мастер (GM) может использовать часы, чтобы показать нарастающую опасность: растущее подозрение во время соблазнения, приближение преследователей в погоне или уровень тревоги патрулирующей стражи. В этом случае, когда происходит осложнение, Мастер делает на часах одно, два или три деления, в зависимости от уровня последствия. Когда часы заполнены, опасность воплощается: стража выслеживает нарушителей, поднимает тревогу, спускает собак и так далее.
- id: progress-clocks-faction-clocks
  name: Часы фракций
  description: |-
    У каждой фракции есть долгосрочная цель. Когда у персонажей наступает **свободное время**, Мастер (GM) продвигает вперёд часы фракций, которые их интересуют. Так мир вокруг персонажей оказывается живым: происходит то, с чем они не связаны напрямую, меняя общую обстановку в городе и создавая новые возможности и трудности.

    Персонажи также могут напрямую влиять на часы фракций NPC своими миссиями и делами. Обсудите известные проекты фракций, которым они могли бы помочь или помешать, и подумайте, как операция персонажей может повлиять на часы NPC, намеренно или нет.
