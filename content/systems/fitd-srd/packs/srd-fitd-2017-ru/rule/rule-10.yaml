- id: progress-clocks-linked-clocks
  name: Связанные часы
  description: |-
    Вы можете создать часы, которые открывают другие часы, когда заполняются. Например, Мастер (GM) может завести связанные часы «В ловушке» после того, как заполнятся часы «Тревога». Когда вы сражаетесь с опытным воином, у неё могут быть часы «Защита», а за ними связанные часы «Уязвима». Как только вы одолеете часы «Защита», вы сможете попытаться одолеть часы «Уязвима» и победить её. Вы можете влиять на часы «Защита» насилием в схватке на ножах или снижать её защиту обманом, если представится случай. Как всегда, способ действия выбирают игроки, а ход дела определяют подробности вымысла.
- id: progress-clocks-long-term-project
  name: Долгосрочный проект
  description: |-
    Некоторые проекты занимают много времени. Простой долгосрочный проект (например, смастерить новую функцию для устройства) занимает восемь делений. По-настоящему долгие проекты (например, создание нового синтетического наркотика) могут занимать двое, трое или даже четверо часов, отражающих все стадии разработки, испытаний и окончательного завершения. Добавляйте или убирайте часы в зависимости от подробностей ситуации и сложности проекта.

    Долгосрочный проект хорошо подходит для любой необычной цели игрока, в том числе для всего, что обходит или меняет элементы механики или сеттинга.
- id: progress-clocks-mission-clocks
  name: Часы задания
  description: |-
    Мастер (GM) может завести часы для задания, ограниченного по времени, чтобы показать, сколько у вас есть времени на его выполнение. Если отсчёт закончится, задание срывается или меняется: цель уходит, домочадцы просыпаются на новый день и так далее.
- id: progress-clocks-racing-clocks
  name: Часы-гонка
  description: |-
    Создайте двое противоборствующих часов, чтобы изобразить гонку. У персонажей игроков могут быть часы «Побег», а у констеблей часы «Загнаны в угол». Если персонажи заполнят свои часы раньше, чем констебли заполнят свои, они уйдут. Иначе их загонят в угол, и бежать они не смогут. Если обе пары часов заполнятся одновременно, персонажи доберутся до своего логова, но снаружи их уже ждут сыщики!

    Часы-гонку можно использовать и для опасности окружающей среды. Возможно, персонажи пытаются заполнить часы «Поиск», чтобы найти сейф на тонущем корабле, пока Мастер заполняет часы «Затонул», и судно не уходит на дно.
- id: progress-clocks-simple-obstacles
  name: Простые препятствия
  description: |-
    Не каждой ситуации и не каждому препятствию нужны часы. Используйте часы, когда ситуация сложная или многослойная и за чем-то нужно следить с течением времени; в остальных случаях определяйте итог действия одним броском.

    Ниже приведены примеры часов прогресса.
- id: progress-clocks-tug-of-war-clocks
  name: Часы-перетягивание
  description: |-
    Вы можете создать часы, которые события и заполняют, *и* опустошают, чтобы показать ситуацию с перевесом то в одну, то в другую сторону. Например, часы «Революция!» показывают, когда беженцы начнут бунтовать из-за плохого обращения. Одни события будут добавлять делений, другие убавлять. Когда часы заполнятся, начнётся революция. Часы-перетягивание также прекрасно подходят для затяжной войны за территорию между двумя командами или фракциями.
- id: resistance-and-armor
  name: Сопротивление и броня
  description: |-
    Когда ваш персонаж терпит последствие, которое вам не нравится, вы можете выбрать сопротивление. Просто скажите Мастеру (GM): «Нет, не думаю. Я сопротивляюсь». Сопротивление всегда срабатывает автоматически: Мастер скажет, ослабло ли последствие или вы избежали его полностью. Затем вы делаете **бросок сопротивления**, чтобы узнать, сколько стресса получит ваш персонаж в результате сопротивления.

    Бросок делается по одному из **атрибутов** вашего персонажа (**Рассудок**, **Сноровка** или **Воля**). Атрибут выбирает Мастер, исходя из природы последствий:

    * **Рассудок**: последствия обмана или понимания.
    * **Сноровка**: последствия физического напряжения или травм.
    * **Воля**: последствия душевного напряжения или проверки силы воли.

    Ваш персонаж получает **6 стресса** за сопротивление, **минус наивысший результат куба в броске сопротивления**. Так что если вы выбросили **4**, вы получите 2 стресса. Если выбросили **6**, не получите стресса вовсе. Если у вас **критический успех**, вы также **снимаете 1 стресс**.

    > Персонаж Иана, Сайлас, ввязался в отчаянную **Схватку** с несколькими дуэлянтами, и один из них попадает по нему мечом. Поскольку позиция была отчаянной, Мастер наносит тяжёлый вред (с поправкой на прочие обстоятельства). Он велит Иану записать в лист Сайласа вред 3-го уровня, «Удар в живот». Иан решает сопротивляться. Мастер говорит, что при сопротивлении вред можно снизить на один уровень. Иан бросает 3d по атрибуту **Сноровка** Сайласа и выбрасывает **5**. Сайлас получает 1 стресс, а вред снижается до 2-го уровня, «Порез по рёбрам».

    Обычно бросок сопротивления **снижает тяжесть** последствия. Например, если вы вот-вот получите смертельный вред, бросок сопротивления снизит его до тяжёлого. Или если вы получили осложнение, пока пробирались в особняк, и Мастер собирался отметить три деления на часах «Тревога», при сопротивлении она отметит только два (а может, и одно).

    **Против одного и того же последствия можно бросать только один раз.**

    Мастер также вправе постановить, что ваш персонаж **полностью избегает** последствия. Например, вы деретесь на мечах, и последствие в том, что вас обезоруживают. Когда вы сопротивляетесь, Мастер говорит, что вы вовсе избегаете этого последствия: оружие остаётся у вас в руке.

    **Решая, какие последствия лишь ослабляются, а какие устраняются совсем, Мастер задаёт общий тон вашей игры.** Для более дерзкой игры большинство последствий будут устраняться. Для более жёсткой большинство последствий при сопротивлении лишь ослабляются.

    Мастер также может пригрозить сразу несколькими последствиями, и тогда игрок выбирает, каким из них сопротивляться (и делает бросок для каждого).

    > «Она бьёт вас ножом и прыгает с балкона. Вред 2-го уровня, и вы упускаете возможность поймать её в бою».
    >
    > «Я сопротивляюсь упущенной возможности: хватаю её в тот момент, когда она бьёт. Пусть ударит меня, но уйти я ей не дам».

    Если вы решили сопротивляться последствию и бросили кубы, вы получаете указанный стресс. Нельзя сначала бросить кубы, посмотреть, сколько стресса вы получите, а потом решать, сопротивляться или нет.
- id: resistance-and-armor-armor
  name: Броня
  description: |-
    Если у вас есть вид **брони**, подходящий к ситуации, вы можете отметить клетку брони, чтобы ослабить последствие или избежать его, вместо того чтобы бросать на сопротивление.

    > Сайлас получает вред 2-го уровня, «Порез по рёбрам», а бой ещё не окончен, поэтому Иан решает использовать броню Сайласа, чтобы ослабить вред. Он отмечает клетку брони, и вред становится вредом 1-го уровня, «Ушиб». Если бы Сайлас носил тяжёлую броню, он мог бы отметить вторую клетку брони и снова ослабить вред, до нуля.

    Когда клетка брони отмечена, использовать её снова нельзя, пока она не восстановлена. Вся ваша броня восстанавливается, когда вы выбираете **ношу** на следующее дело.
- id: resistance-and-armor-death
  name: Смерть
  description: |-
    Персонаж может погибнуть несколькими способами:

    * Если он получает смертельный вред 4-го уровня и не сопротивляется ему, он погибает. *Иногда игрок сам хочет такого исхода: ему кажется, что персонажу нелогично выжить, или что здесь для него самое подходящее место умереть.*
    * Если нужно записать вред 3-го уровня, а эта строка уже заполнена, персонаж терпит катастрофическое последствие, которое может означать внезапную смерть (в зависимости от обстоятельств).

    Когда ваш персонаж погибает, у вас есть варианты:

    * Вы можете создать нового проходимца. Возможно, вы «повысите» одного из безымянных членов банды до персонажа игрока или создадите совершенно нового персонажа, который присоединится к команде.
- id: resistance-and-armor-resistance-roll
  name: БРОСОК СОПРОТИВЛЕНИЯ
  description: |-
    ⏣ **1d** за каждую единицу рейтинга **Атрибута**.

    Вы **ослабляете** последствие или **избегаете** его (выбирает Мастер (GM)).

    **Получите 6 **Стресса** минус наивысший результат куба.**

    **Критический успех**: снимите 1 стресс.
- id: rituals
  name: Ритуалы
  description: |-
    Совершить ритуал значит войти в соприкосновение с этими силами бездны и воззвать к ним, чтобы они исполнили вашу волю. Это занятие, сопряжённое со значительным риском.
- id: rituals-finding-a-ritual-source
  name: Поиск источника ритуала
  description: |-
    Персонаж с особым умением **Ритуал** начинает с одним известным ритуалом, уже изученным (чтобы создать его, ответьте на вопросы ниже). Чтобы изучить новый ритуал, персонаж должен сначала найти **источник**. Источник можно получить как добычу с дела: например, вы крадёте книгу ритуалов, когда ваша команда грабит Музей древностей. Источник можно получить и как цель долгосрочного проекта: общаясь с друзьями-культистами, изучая древние тексты или другим способом, который вы придумаете.
- id: rituals-learning-a-ritual
  name: Изучение ритуала
  description: |-
    Когда источник ритуала найден, вы можете взяться за долгосрочный проект по изучению ритуала. Для большинства ритуалов нужны часы прогресса на 8 делений. Игрок и Мастер (GM) отвечают на вопросы о ритуале, чтобы определить, что он делает в игре и что нужно для его совершения (см. ниже). Игрок записывает эти ответы в свои заметки, чтобы обращаться к ним впоследствии.
- id: rituals-learning-a-ritual-example-ritual-answers
  name: Пример ответов о ритуале
  description: |-
    > Игрок: «Ритуал оберегает человека так, что призраки его жертв не могут его найти. Странность в том, что, пока оберег действует, человек порой плачет чёрной кровью».
    >
    > Мастер: «Потратьте действие свободного времени, чтобы приготовить смесь из табака, сонного дыма и пепла из крематория, взятого у жертвы, которую цель затем выкуривает. Вы получаете не менее 3 стресса, когда совершаете ритуал; это будет его качество для броска удачи, когда ему бросит вызов дух, так что вы можете захотеть взять больше стресса, чтобы сделать его сильнее».
    >
    > Игрок: «Понял. Мой новый страх в том, что будет, если духи выяснят, откуда взялся оберег, и обратят свою месть на меня».
- id: rituals-learning-a-ritual-ritual-questions
  name: Вопросы о ритуале
  description: |-
    1. Мастер (GM) спрашивает: **«Что делает ритуал и в чём его странность?»** Отвечает игрок.
    2. Игрок спрашивает: **«Что я должен сделать, чтобы совершить ритуал, и какова его цена?»** Отвечает Мастер. Ритуал требует как минимум одного занятия свободного времени и наносит заклинателю **стресс** в соответствии со своей **величиной**. Если совершение ритуала опасно или хлопотно, нужен бросок действия (обычно **Настройка**). У ритуала могут быть и дополнительные издержки: жертва, редкий предмет, запуск зловещих часов прогресса и так далее.
    3. Мастер спрашивает: **«Какое новое верование или какой страх вселяет в вас знание об этом ритуале и сопутствующих ему оккультных силах?»** Отвечает игрок.
- id: rituals-performing-a-ritual
  name: Совершение ритуала
  description: |-
    Чтобы совершить ритуал, у вас должно быть особое умение **Ритуал**, и вы должны следовать способу, описанному ответами на вопросы о ритуале. Большинство ритуалов требуют **одного занятия свободного времени**, хотя Мастер (GM) может потребовать два (или больше) занятия для очень могущественных или далеко идущих ритуалов. Некоторые ритуалы можно частично совершить в свободное время, а потом полностью проявить в любой момент, завершив последнее заклинание или ритуальное действие. В таком случае просто сделайте пометку, что ритуал «подготовлен» и может быть высвобожден позже.

    Когда вы совершаете ритуал, вы получаете количество **стресса**, определённое вопросами о ритуале, в соответствии с **величиной** вовлечённых сил. Мастер использует величину как *ориентир* для стоимости в стрессе; она может быть выше или ниже по его усмотрению, чтобы лучше передать природу ритуала. Некоторые притязания и особые умения также снижают стоимость ритуала в стрессе (например, притязание культа **Древний обелиск**).

    **Ритуалы совершаются небыстро.** Используйте примеры длительности из таблицы величин, чтобы снизить стоимость в стрессе в зависимости от затраченного времени, как правило, не меньше часа.

    Мастер также может **отметить деление на часах прогресса**, когда вы совершаете ритуал: чтобы продвинуть замысел тайной силы или существа или показать неуклонное приближение мрачного исхода, ставшего следствием применения ритуала.

    Если ритуал опасен или хлопотен, сделайте **бросок действия** (обычно **Настройка**), чтобы узнать, проявятся ли неприятные последствия. Если действие ритуала неопределённо, нужно сделать **бросок удачи**, чтобы узнать, насколько хорошо он проявится. Поскольку ритуал это занятие свободного времени, вы можете тратить **монеты** по 1 за 1, чтобы повысить уровень результата броска удачи (это означает расход дорогих или редких ритуальных материалов). Если ритуал и опасен, и неопределён, могут потребоваться оба броска.

    Каждое совершение ритуала это уникальное событие, и он может действовать каждый раз по-разному. Мастер или игроки могут потребовать новый круг вопросов, чтобы определить ритуал заново. Ритуалы позволяют ввести в игру самые разнообразные тайные эффекты. Используйте их осторожно! Если вы зашли слишком далеко, вернитесь к вопросам, чтобы определить новую странность и новые издержки, если всё вышло из-под контроля. Силы бездны не игрушки, и считать их надёжным или безопасным источником могущества нельзя.
- id: setting-position-effect
  name: Определение позиции и эффекта
  description: |-
    Мастер (GM) определяет позицию и эффект для броска действия одновременно, после того как игрок скажет, что он делает, и выберет своё действие. Обычно по умолчанию берётся сочетание **рискованная / стандартный**, которое меняется в зависимости от используемого действия, силы противодействия и факторов эффекта.

    Возможность определять позицию и эффект как независимые переменные даёт девять сочетаний на выбор, чтобы передать самые разные обстоятельства вымысла.

    *Например, если персонаж в одиночку выходит против небольшой вражеской банды, ситуация может быть такой:*

    * *Она сражается с бандой в лоб, врываясь в их гущу и яростно рубя направо и налево в дикой **Схватке**. В этом случае угроза со стороны большего числа врагов снижает её позицию, показывая больший риск, а размер банды уменьшает её эффект (отчаянная / ограниченный).*
    * *Она сражается с бандой из узкого места, например из тесного переулка, где враги не могут навалиться на неё разом. Ей не угрожают сразу несколько противников, так что риск такой же, как в поединке один на один, но врагов всё равно много, поэтому её эффект уменьшен (рискованная / ограниченный).*
    * *Она не сражается с бандой, а пытается проскользнуть мимо и уйти. Ей по-прежнему угрожают атаки многих врагов, поэтому позиция хуже, но если местность открытая и банда не может легко её окружить, эффект побега не уменьшается (отчаянная / стандартный). Если бы у неё было под рукой средство для мгновенного бегства (например, прыжок на несущуюся карету), эффект мог бы даже возрасти (отчаянная / большой).*
    * *Банда ещё не знает о ней: она устроилась снайпером на соседней крыше. Она стреляет в одного из них. Их численное превосходство не играет роли, так что эффект не уменьшается, и прямой опасности для неё нет (контролируемая / большой). Возможно, вместо этого она хочет дать залп подавляющего огня по всей банде, и тогда их размер учитывается (контролируемая / ограниченный). Если банда настороже в ожидании неприятностей, её позиция опаснее (рискованная / большой). Если банда знает о снайпере, эффект может уменьшиться ещё сильнее, так как они разбегаются и прячутся (рискованная / ограниченный). Если банда может организовать прикрывающий огонь, пока отходит в безопасное место, нашей проходимице приходится ещё хуже (отчаянная / ограниченный).*
