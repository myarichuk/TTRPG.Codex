- id: action-roll
  name: Бросок действия
  description: |-
    Когда персонаж игрока делает что-то непростое, мы делаем **бросок действия**, чтобы узнать, чем всё закончится. Действие непростое, если на пути к цели персонажа стоит препятствие, которое чем-то опасно или создаёт трудности. Бросок действия делается только тогда, когда персонаж подвергается испытанию. Если мы ожидаем, что персонаж просто справится с задуманным, бросок действия не нужен.

    *У каждой игровой группы будет своё представление о том, что значит «непростое». Это хорошо! Именно оно задаёт тон и стиль вашей серии Blades.*

    Чтобы сделать бросок действия, мы проходим шесть шагов. В игре они сливаются друг с другом, но здесь для ясности разберём каждый отдельно.

    * Игрок называет **цель** действия.
    * Игрок выбирает **рейтинг действия**.
    * Мастер (GM) определяет **позицию** для броска.
    * Мастер определяет **уровень эффекта** действия.
    * Добавьте **бонусные кубы**.
    * Игрок бросает кубы, и мы оцениваем результат.
- id: action-roll-1-the-player-states-their-goal
  name: "1. Игрок называет свою цель"
  description: |-
    Ваша цель — это конкретный результат, которого достигнет ваш персонаж, преодолев препятствие. Обычно цель персонажа ясна из контекста, но при необходимости Мастер (GM) должен спросить и уточнить её.

    *«Ты бьёшь его в лицо, верно? Хорошо... чего ты хочешь этим добиться? Вырубить его или просто слегка избить, чтобы он сделал, что тебе нужно?»*
- id: action-roll-2-the-player-chooses-the-action-rating
  name: "2. Игрок выбирает рейтинг действия"
  description: |-
    Игрок выбирает, какой **рейтинг действия** бросать, исходя из того, что его персонаж делает в сцене. Если вы хотите бросать **Схватку**, ввяжитесь в драку. Если хотите бросать **Приказ**, отдайте кому-нибудь распоряжение. Нельзя бросать рейтинг действия, если ваш персонаж в данный момент не выполняет это действие в вымышленном мире.
- id: action-roll-3-the-gm-sets-the-position
  name: "3. Мастер определяет позицию"
  description: |-
    Когда игрок выбрал действие, Мастер (GM) определяет **позицию** для броска. Позиция показывает, насколько опасным или хлопотным может оказаться действие. Есть три позиции: **контролируемая**, **рискованная** и **отчаянная**. Чтобы выбрать позицию, Мастер смотрит на описания позиций ниже и берёт ту, что лучше всего подходит к ситуации.

    **По умолчанию бросок действия рискованный.** Вы бы не бросали кубы, если бы риска не было. Если ситуация кажется опаснее, сделайте бросок отчаянным. Если менее опасной, сделайте его контролируемым.
- id: action-roll-4-the-gm-sets-the-effect-level
  name: "4. Мастер определяет уровень эффекта"
  description: |-
    Мастер (GM) оценивает вероятный **уровень эффекта** этого действия с учётом обстоятельств ситуации. По сути, уровень эффекта говорит нам, «сколько» может совершить это действие: будет ли эффект **ограниченным**, **стандартным** или **большим**?

    *На выбор Мастера для уровня эффекта и позиции может сильно влиять выбор игроком рейтинга действия. Если игрок хочет завести нового друга с помощью **Разрушения**... что ж, возможно, это и получится, но Мастер вполне вправе сказать, что бросок отчаянный и эффект, скорее всего, ограниченный. Для такого дела куда лучше подошли бы **Знакомства**. Игроки всегда вольны выбирать, какое действие совершать, но это не значит, что все действия должны быть одинаково рискованными или результативными.*
- id: action-roll-5-add-bonus-dice
  name: "5. Добавьте бонусные кубы"
  description: |-
    Обычно вы можете получить два бонусных куба к броску действия (некоторые особые умения могут давать дополнительные бонусные кубы).

    За один бонусный куб вы можете получить **помощь** от товарища по команде. Он получает 1 стресс, говорит, как именно помогает вам, и даёт вам +1d.

    За другой бонусный куб вы можете либо **поднажать** (получить 2 стресса), либо принять **сделку с дьяволом** (кубы за то и другое сразу получить нельзя: либо одно, либо другое).
- id: action-roll-5-add-bonus-dice-the-devils-bargain
  name: Сделка с дьяволом
  description: |-
    Персонажи игроков в *Blades* — безрассудные проходимцы, зависимые от разрушительных пороков, и действуют они не всегда в своих интересах. Чтобы это отразить, Мастер (GM) или любой другой игрок может предложить вам бонусный куб, если вы примете сделку с дьяволом. Вот типичные сделки с дьяволом:

    * Побочный ущерб, непреднамеренный вред.
    * Пожертвовать **монетами** или предметом.
    * Предать друга или близкого человека.
    * Оскорбить или разгневать фракцию.
    * Запустить и (или) продвинуть неприятные часы.
    * Добавить команде **жар** из-за улик или свидетелей.
    * Получить вред.

    Сделка с дьяволом вступает в силу независимо от исхода броска. Вы заключаете сделку, платите цену и получаете бонусный куб.

    Сделка с дьяволом — всегда свободный выбор. Если предложение вам не нравится, просто откажитесь (или предложите, как его изменить, чтобы вы могли его принять). Вместо этого вы всегда можете просто поднажать ради того же бонусного куба.

    Если потребуется, последнее слово о том, какие сделки с дьяволом допустимы, остаётся за Мастером.
- id: action-roll-6-roll-the-dice-and-judge-the-result
  name: "6. Бросьте кубы и оцените результат"
  description: |-
    Когда цель, рейтинг действия, позиция и эффект определены, добавьте все бонусные кубы и бросьте пул кубов, чтобы узнать исход. (Наборы возможных исходов по позициям приведены в следующих разделах.)

    Бросок действия делает за вас много работы. Он показывает, насколько хорошо справился персонаж, и насколько серьёзны для него последствия. Он может справиться с действием без всяких последствий (при **6**), может справиться, но понести последствия (при **4/5**), а может, всё пойдёт наперекосяк (при **1-3**).

    При **1-3** Мастер решает, даёт ли действие персонажа хоть какой-то эффект и происходит ли оно вообще. Обычно действие просто проваливается полностью, но в некоторых обстоятельствах может быть логичнее или интереснее, чтобы оно дало некоторый эффект даже при результате **1-3**.

    У каждого исхода **4/5** и **1-3** есть список предлагаемых **последствий** для персонажа. Чем хуже ваша позиция, тем тяжелее последствия. Мастер может применить одно или несколько из них, в зависимости от обстоятельств броска действия. Персонажи могут избежать последствий или смягчить их тяжесть, **сопротивляясь** им.

    Когда вы описываете действие после броска, Мастер и игрок вместе рассказывают, что происходит в сцене. *Расскажите нам, как вы перемахиваете на другую крышу. Расскажите, что вы говорите инспектору, чтобы её убедить. Мастер расскажет, как она отреагирует. Какой у вас стиль боя, когда вы стоите против дуэлянта из Красных Поясов? И так далее.*
- id: action-roll-action-roll-summary
  name: Краткое описание броска действия
  description: |-
    * Игрок или Мастер (GM) требует бросок. Делайте **бросок действия**, когда персонаж совершает опасное или хлопотное действие.
    * Игрок выбирает **рейтинг действия** для броска. Выбирайте действие, которое соответствует тому, что персонаж делает в вымышленном мире.
    * Мастер определяет **позицию** и **уровень эффекта** действия. На выбор позиции и эффекта сильно влияет выбор действия игроком.
    * Добавьте до двух бонусных кубов. 1) **Помощь** товарища по команде. 2) **Поднажать** (получить 2 стресса) или принять **сделку с дьяволом**.
    * Бросьте пул кубов и оцените исход. Игроки и Мастер вместе описывают действие. Последнее слово о том, что происходит, за Мастером, и он налагает последствия в соответствии с позицией и результатом броска.
- id: action-roll-action-roll-summary-action-roll
  name: БРОСОК ДЕЙСТВИЯ
  description: |-
    ⏣ **1d** за каждую точку рейтинга **действия**.

    ⊕ **+1d**, если у вас есть **помощь**.

    ⊕ **+1d**, если вы **поднажали** -или- приняли **сделку с дьяволом**.

    #### КОНТРОЛИРУЕМАЯ

    *Вы действуете на своих условиях. Вы пользуетесь явным преимуществом.*

    * **Критический успех**: вы делаете это с **повышенным эффектом**.
    * **6**: вы делаете это.
    * **4/5**: вы колеблетесь.
        - Отступите и попробуйте другой подход, или
        - сделайте это, но с небольшим последствием: возникает **незначительное осложнение**, у вас **сниженный эффект**, вы получаете **лёгкий вред**, вы оказываетесь в **рискованной** позиции.
    * **1-3**: вы запинаетесь.
        - Продолжайте, воспользовавшись **рискованной** возможностью, или
        - отступите и попробуйте другой подход.

    #### РИСКОВАННАЯ

    *Вы идёте лоб в лоб. Вы действуете под огнём. Вы рискуете.*

    * **Критический успех**: вы делаете это с **повышенным эффектом**.
    * **6**: вы делаете это.
    * **4/5**: вы делаете это, но есть последствие: вы получаете **вред**, возникает **осложнение**, у вас **сниженный эффект**, вы оказываетесь в **отчаянной** позиции.
    * **1-3**: всё идёт плохо. Вы получаете **вред**, возникает **осложнение**, вы оказываетесь в **отчаянной** позиции, вы **упускаете эту возможность**.

    #### ОТЧАЯННАЯ

    *Вы замахнулись на то, что вам не по силам. У вас серьёзные неприятности.*

    * **Критический успех**: вы делаете это с **повышенным эффектом**.
    * **6**: вы делаете это.
    * **4/5**: вы делаете это, но есть последствие: вы получаете **тяжёлый вред**, возникает **серьёзное осложнение**, у вас **сниженный эффект**.
    * **1-3**: худший исход. Вы получаете **тяжёлый вред**, возникает **серьёзное осложнение**, вы **упускаете эту возможность** действовать.
- id: action-roll-double-duty-rolls
  name: Броски с двойной нагрузкой
  description: |-
    Поскольку NPC не бросают кубы за свои действия, бросок действия выполняет двойную работу: **он разрешает и действие персонажа игрока, и действия всех вовлечённых NPC**. Один бросок показывает, как эти действия сталкиваются и какие наступают последствия. При **6** персонаж игрока побеждает и получает свой эффект. При **4/5** исход смешанный: эффект получают и персонаж игрока, и NPC. При **1-3** побеждает NPC, и его эффект становится последствием для персонажа игрока.
- id: actions-attributes-action-ratings
  name: Рейтинги действий
  description: |-
    В игре есть 12 **действий**, которыми персонажи игроков преодолевают препятствия.

    * Настройка
    * Приказ
    * Знакомства
    * Изящество
    * Охота
    * Подкрадывание
    * Схватка
    * Изучение
    * Осмотр
    * Влияние
    * Механика
    * Разрушение

    У каждого действия есть рейтинг (от нуля до 4), который показывает, сколько кубов бросать, когда вы выполняете это действие. Рейтинги действий отражают не только умение или подготовку: вы вольны описывать, *как* ваш персонаж выполняет действие, исходя из того, что он за человек. Возможно, ваш персонаж хорош в **Приказе**, потому что в нём есть пугающая неподвижность, а другой персонаж лает команды и внушает страх военной выправкой.

    Вы выбираете, какое действие совершить, чтобы преодолеть препятствие, описывая, что делает ваш персонаж. Действия, плохо подходящие к ситуации, могут быть менее эффективными и подвергать персонажа большей опасности, но попробовать их всё равно можно. Обычно, когда вы совершаете действие, вы делаете **бросок действия**, чтобы узнать, чем всё закончится.
- id: actions-attributes-action-roll
  name: Бросок действия
  description: |-
    Вы делаете **бросок действия**, когда ваш персонаж делает что-то потенциально опасное или хлопотное. Возможные результаты броска зависят от **позиции** вашего персонажа. Есть три позиции: **контролируемая**, **рискованная** и **отчаянная**. Если вы в **контролируемой** позиции, возможные последствия менее серьёзны. Если в **отчаянной**, последствия могут быть тяжёлыми. Если вы где-то посередине, позиция **рискованная**: обычно её считают «стандартной» для большинства действий.

    Если нет ни опасности, ни трудностей, бросок действия не делается. Вы можете сделать **бросок удачи** или бросок в **свободное время**, либо Мастер (GM) просто скажет «да», и вы достигнете своей цели.
- id: actions-attributes-actions
  name: Действия
  description: |-
    Как видите, многие действия пересекаются с другими. Так и задумано. Игрок сам выбирает, какое действие бросать, говоря, что делает его персонаж. Можно ли применить **Разрушение** к противнику во время драки? Конечно! Мастер (GM) называет позицию и уровень эффекта вашего действия в этих обстоятельствах. Как сказано выше, **Схватка** *может* подойти лучше (менее рискованно или результативнее), в зависимости от ситуации (иногда не подойдёт).
- id: actions-attributes-attribute-ratings
  name: Рейтинги атрибутов
  description: |-
    В игровой системе есть три **атрибута**, которыми персонажи игроков сопротивляются дурным последствиям: **Рассудок**, **Сноровка** и **Воля**. У каждого атрибута есть рейтинг (от нуля до 4), который показывает, сколько кубов бросать, когда вы используете этот атрибут.

    Рейтинг каждого атрибута равен числу точек в **первом столбце** под этим атрибутом (см. примеры справа). Чем разностороннее ваш персонаж в данном наборе действий, тем выше его рейтинг атрибута.
- id: actions-attributes-resistance-roll
  name: Бросок сопротивления
  description: |-
    Каждый атрибут сопротивляется своему виду опасности. Например, если вас ударили ножом, вы сопротивляетесь физическому вреду своим рейтингом **Сноровки**. Броски сопротивления всегда удаются: вы уменьшаете или отводите дурной исход, но чем лучше бросок, тем меньше **стресса** стоит смягчить или избежать опасности.

    Когда у противника большое преимущество, вам придётся сделать бросок сопротивления, прежде чем вы сможете совершить собственное действие. Например, в дуэли с мастером клинка она обезоруживает вас раньше, чем вы успеваете ударить. Вам нужно сделать бросок сопротивления, чтобы удержать клинок, если вы хотите атаковать её. Или вы столкнулись с могучим призраком и пытаетесь **Настроиться** на него, чтобы управлять его действиями. Но прежде чем сделать собственный бросок, вы должны сопротивляться овладению со стороны духа.

    Мастер (GM) оценивает уровень угрозы противников и использует такие «упреждающие» броски сопротивления по необходимости, чтобы отразить возможности особенно опасных врагов.
- id: actions-attributes-resistance-roll-example-action-attribute-ratings
  name: ПРИМЕР РЕЙТИНГОВ ДЕЙСТВИЙ И АТРИБУТОВ
  description: |-
    #### **Рассудок**

    | Действие | Рейтинг |
    | :-- | :-- |
    | **Охота** | ●○○○ |
    | **Изучение** | ○○○○ |
    | **Осмотр** | ○○○○ |
    | **Механика** | ○○○○ |

    У этого персонажа рейтинг действия **Охота** равен 1.  Его рейтинг атрибута **Рассудок** равен 1 (первый столбец точек).

    #### **Сноровка**

    | Действие | Рейтинг |
    | :-- | :-- |
    | **Изящество** | ○○○○ |
    | **Подкрадывание** | ●○○○ |
    | **Схватка** | ●●○○ |
    | **Разрушение** | ○○○○ |

    Также у него **Подкрадывание** 1 и **Схватка** 2.  Его рейтинг атрибута **Сноровка** равен 2.

    #### **Воля**

    | Действие | Рейтинг |
    | :-- | :-- |
    | **Настройка** | ●●○○ |
    | **Приказ** | ●○○○ |
    | **Знакомства** | ○○○○ |
    | **Влияние** | ●○○○ |
