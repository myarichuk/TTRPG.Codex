- id: crew-creation-cohorts-modifying-a-cohort
  name: Изменение подручных
  description: |-
    Вы можете добавить банде или эксперту **дополнительный тип**, потратив два улучшения команды. Когда подручные совершают действия, к которым относятся их типы, они используют свой полный рейтинг качества. В остальных случаях их качество равно нулю. У одних подручных может быть не больше двух типов.
- id: crew-creation-cohorts-using-a-cohort
  name: Использование подручных
  description: |-
    Когда вы посылаете подручных достичь цели, бросайте их **качество**, чтобы узнать, как всё прошло. Либо один из персонажей игроков может руководить манёвром, возглавив **групповое действие**. Если вы направляете подручных приказами, бросайте **Приказ**. Если вы участвуете в действии вместе с подручными, бросайте подходящее действие. Качество противников по сравнению с качеством подручных влияет на позицию и эффект действия.

    > Команда Лоточников, которой управляют персонажи игроков, хочет выгнать из переулка конкурирующую банду, мешающую им торговать наркотиками. Они посылают свою банду Головорезов вышвырнуть чужаков. Мастер (GM) бросает 2d за качество Головорезов и получает **3**. Через час Головорезы возвращаются избитые и в крови. Один из них смущённо говорит: «Эти парни крепкие, босс». (Мастер наносит подручным вред, и цель не достигнута.)
    >
    > На следующий день босс команды возвращается и возглавляет групповое действие: она бросает свои 3d в **Схватке** вместе с 2d Головорезов. На этот раз у босса выпадает **6**: они задают другой банде хорошую трёпку и прогоняют её (по крайней мере пока).
- id: crew-creation-crew-creation-summary
  name: "Создание команды: кратко"
  description: |-
    **1** **Выберите тип команды.** Тип команды определяет цель группы, её особые умения и то, как она развивается.

    Вы начинаете с **Ранга 0**, **сильным контролем** и 0 **репутации**. У вас есть 2 **монеты**.

    **2** **Выберите начальную репутацию и логово.** Выберите, как вас видят другие фракции преступного мира: *Амбициозные — Жестокие — Дерзкие — Честные — Профессиональные — Смекалистые — Тонкие — Странные.* Посмотрите на карту и выберите район, где будет ваше логово. Опишите логово.

    **3** **Определите свои охотничьи угодья.** Посмотрите на карту и выберите район, где будут ваши охотничьи угодья. Решите, как поступить с фракцией, которая претендует на эту область.

    * Заплатите ей 1 **монету**.
    * Заплатите ей 2 **монеты**. Получите **+1 статус**.
    * Не платите ничего. Получите **-1 статус**.

    **4** **Выберите особое умение.** Оно находится в сером столбце посередине листа команды. Если не можете решить, выберите первое умение в списке. Оно поставлено туда как хороший первый вариант.

    **5** **Распределите улучшения команды.** У вашей команды уже выбраны два улучшения. Выберите ещё два. Если у команды есть подручные, создайте их по описанной процедуре. Запишите изменения статуса фракций из-за ваших улучшений:

    * Одна фракция помогла вам получить улучшение. Получите **+1 статус** с ней. Или потратьте 1 **монету** и получите вместо этого **+2 статус**.
    * Одной фракции навредило ваше получение улучшения. Получите **-2 статус** с ней. Или потратьте 1 **монету** и получите вместо этого **-1 статус**.

    **6** **Выберите любимого контакта.** Отметьте того, кто ваш близкий друг, давний союзник или соучастник. Запишите изменения статуса фракций, связанные с вашим контактом:

    * Одна фракция дружелюбна к вашему контакту. Получите **+1 статус** с ней.
    * Одна фракция недружелюбна к вашему контакту. Получите **-1 статус** с ней.

    По желанию вы можете усилить отношения фракций с вашим контактом и вместо этого получить **+2** и **-2 статус**.
- id: crew-creation-establish-your-hunting-grounds
  name: Определите свои охотничьи угодья
  description: |-
    Ваша команда совсем новая, но вы уже выбрали небольшую часть района в качестве своих **охотничьих угодий**. Это область, которую вы обычно выбираете целью для дел, и вы хорошо её знаете. Охотничьи угодья не обязаны находиться в том же районе, что и логово. Область невелика, всего три-четыре городских квартала, но она всё равно кому-то мешает. Весь город поделён между более крупными и сильными фракциями. Мастер (GM) скажет, какая фракция претендует на эту область, а вы решите, как с ней поступить:

    * Откупитесь. Отдайте ей 1 **монету**, чтобы она позволила вам работать.
    * Заплатите фракции 2 **монеты** в знак уважения и получите **+1 статус** с ней.
    * Оставьте деньги себе и получите **-1 статус** с этой фракцией.

    Ваши охотничьи угодья подходят для определённого вида преступных операций. У каждого типа команды есть список разных видов операций для охотничьих угодий. Например, у Убийц варианты такие: *Несчастный случай*, *Исчезновение*, *Убийство* или *Выкуп*. Выберите один из этих видов операций как предпочтительный.

    Когда вы готовитесь провести операцию предпочтительного вида на своих охотничьих угодьях, вы получаете **+1d** к любым броскам **сбора сведений** и бесплатное дополнительное **занятие в свободное время**, чтобы помочь этой операции. Оно может помочь найти возможность, добыть ресурс, нужный для работы, подыскать подходящего клиента и так далее.

    Когда вы получаете **территорию**, вы также расширяете размер и/или тип своих охотничьих угодий. Опишите новую область и/или методы с помощью Мастера.
- id: crew-playbook
  name: Плейбук команды
  description: |-
    **Краткое описание команды**

    Вы профессиональные убийцы: смерть — ваше ремесло.

    **Добавьте условие получения опыта. Когда вы играете за эту команду, вы получаете опыт, успешно проведя операцию нескольких определённых видов.** Вот несколько примеров: убийство, выкуп, битва за вымогательство, саботаж, поставка или продажа товара, шпионаж, кража, приобретение новой контрабанды или источников.

    *Добавьте вопросы, чтобы сделать команду личной. Чем эта команда отличается от других похожих команд?*
- id: crew-playbook-contacts
  name: Контакты
  description: |-
    Список из пяти возможных контактов для команды с описанием каждого. Вот несколько вариантов: босс банды, посредник в сделках, дворянин, охотник за головами, торговец, кузнец, врач, глава квартала, владелец таверны, учёный, оккультист, магистрат, дилетант, исследователь, коллекционер, торговец оружием, торговец наркотиками, анархист или докер.

    Вопросы могут быть такими: откуда вы знаете друга, что он для вас сделал, что вы делаете для него и какие у вас отношения.
- id: crew-playbook-crew-special-abilities
  name: Особые умения команды
  description: |-
    Придумайте семь особых умений для своей команды. Вот несколько примеров.
- id: crew-playbook-crew-upgrades
  name: Улучшения команды
  description: |-
    Список из пяти улучшений, свойственных этой команде. Несколько примеров:
- id: crew-playbook-crew-upgrades-make-a-claim-map-for-the-crew
  name: Составьте карту притязаний для команды
  description: |-
    Примеры притязаний:

    **Территория**: вам нужно на одну репутацию меньше, чтобы повысить ранг (максимум 6).

    **Городские архивы**: вы получаете **+1d** к **броску завязки** для **скрытных** планов. *Чертежи и другие документы помогут выбрать хороший подход к проникновению.*

    **Подставные личности**: вы получаете **+1d** к **броску завязки** для планов **обмана** и **общения**. *Ложные личности сбивают противников с толку.*

    **Прикрытие**: вы получаете **-2** **жара** за дело. *Прикрытие законного предприятия помогает отвести часть **жара** от стражей порядка.*

    **Посланник**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны состоятельные клиенты. *Этот влиятельный посредник поможет добиться лучшей добычи от богатых клиентов.*

    **Посредник**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны небогатые клиенты. *Этот уважаемый агент поможет добиться лучшей добычи от бедных клиентов.*

    **Лазарет**: вы получаете **+1d** к броскам лечения. *В лазарете есть и койки для долгого выздоровления.*

    **Осведомители**: вы получаете **+1d** к сбору сведений для дела. *Ваши глаза и уши на улицах всегда высматривают новые цели.*

    **Рэкет**: в любой момент свободного времени бросьте число кубов, равное вашему рангу. Вы зарабатываете **монеты**, равные наибольшему результату, минус ваш **жар**. *Некоторые местные вас до смерти боятся и охотно платят за «защиту».*

    **Тренировочные залы**: ваши подручные определённого типа получают **+1 масштаб**. *Дополнительная подготовка позволяет им драться как более крупная банда.*

    **Притон порока**: в любой момент свободного времени бросьте число кубов, равное вашему рангу. Вы зарабатываете **монеты**, равные наибольшему результату, минус ваш **жар**.

    **Трофеи жертв**: вы получаете **+1 репутации** за дело. *Слух о вашей жуткой «коллекции» расходится, и ваша смелость повышает репутацию в преступном мире.*

    **Бойцовские ямы**: в свободное время бросьте число кубов, равное вашему рангу. Вы зарабатываете **монеты**, равные наибольшему результату, минус ваш **жар**. *Местные любят проигрывать с трудом заработанные монеты на кровавых зрелищах, которые вы устраиваете.*

    **Уличный скупщик**: вы получаете **+2** **монеты** в добыче за дела, где замешаны небогатые цели. *Эксперт найдёт сокровище в хламе, который вы забираете у бедных жертв.*

    **Запуганные горожане**: вы получаете **+2** **монеты** в добыче за дела, где замешаны битва или вымогательство. *Испуганные местные несут вам дань, когда вы наносите удар. Они не хотят быть следующими.*

    **Склады**: вы получаете **+1d** к броскам **добычи ресурса**. *У вас есть место для всей разной добычи, которая остаётся после ваших сражений. Она может пригодиться сама по себе или для обмена, когда понадобится.*

    **Древний алтарь**: вы получаете **+1d** к **броску завязки** для **оккультных** планов. *Его благословение с вами.*

    **Древняя башня**: вы получаете **+1d** к **Знакомствам** с тайными сущностями на месте.

    **Жертвенник**: вы получаете **+2** **монеты** в добыче за дела, где замешаны оккультные операции. *Испуганные местные несут вам дань, когда вы совершаете свои тёмные обряды. Они не хотят быть следующими.*

    **Местные взятки**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны демонстрация силы или светское общение. *Несколько городских чиновников делятся взятками с теми, кто показал, что играет на этой сцене.*

    **Наблюдатели**: вы получаете **+1d** к **Охоте** или **Осмотру** на своей территории.

    **Роскошное заведение**: **+1d** к броскам **Знакомств** и **Влияния** на месте. *Шёлк, картины и хрусталь производят впечатление на клиентов.*

    **Запасной тайник**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны продажа или поставка товара. *У вас избыток товара, и время от времени он набивает ваши карманы.*

    **Скрытый тайник для передач**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны шпионаж или саботаж. *Идеальное скрытое место обмена стоит лишних монет для разборчивых клиентов.*

    **Допросная**: вы получаете **+1d** к **Приказу** и **Влиянию** на месте. *Жуткое дело, но действенное.*

    **Верный скупщик**: вы получаете **+2** **монеты** **добычи** за дела, где замешаны кража со взломом или грабёж. *Чтобы сбыть краденое, нужны намётанный глаз и хорошие связи.*

    **Тайные ходы**: вы получаете **+1d** к **броску завязки** для **скрытных** планов. *У вас может быть доступ к давно забытым подземным каналам, крышам-переходам или другому пути по вашему выбору.*

    **Таверна**: вы получаете **+1d** к броскам **Знакомств** и **Влияния** на месте. *Немного выпивки и дружеская беседа многое решают.*

    **Побочный бизнес**: в любой момент свободного времени бросьте число кубов, равное вашему рангу. Вы зарабатываете **монеты**, равные наибольшему результату, минус ваш **жар**. *Что это за законный бизнес? Как вы получаете деньги тайно?*
- id: crew-playbook-favored-operations
  name: Излюбленные операции
  description: |-
    Список видов операций, которые может проводить команда. Вот несколько вариантов: убийство, выкуп, вымогательство, саботаж, приобретение, освящение, жертвоприношение, продажа, поставка, демонстрация силы, светское общение, кража со взломом, шпионаж, грабёж, контрабанда оружия, контрабанда товаров или контрабанда пассажиров.
- id: crew-playbook-starting-upgrades
  name: Начальные улучшения
  description: |-
    * Первое улучшение
    * Второе улучшение
- id: downtime
  name: Свободное время
  description: |-
    После того как команда завершает дело (успешно или нет), у неё есть время восстановиться, перегруппироваться и подготовиться к следующей операции. Эта фаза игры называется **свободным временем**.

    Свободное время служит в игре двум целям:

    * Во-первых, это передышка для игроков. Во время дела персонажи всегда под угрозой и несутся от препятствия к препятствию в напряжённой череде событий. Свободное время даёт им отсрочку, чтобы перевести дух и немного расслабиться: заняться более спокойными сторонами игры, а также исследовать личные стороны своих персонажей.
    * Во-вторых, переход к новой фазе игры сигнализирует, что нужны другие механики. Есть особые правила, которые используются только в свободное время, поэтому в остальных частях игры они «убраны с глаз». Когда мы переходим к свободному времени, мы достаём другой набор инструментов и разрешаем свободное время по его собственным правилам, а затем возвращаемся к более насыщенным действием фазам игры.

    Свободное время делится на четыре части, которые разрешаются по порядку:
    1. **Добыча**. Команда получает награду за успешно завершённое дело.
    2. **Жар**. Команда накапливает подозрения и внимание закона и городских властей в результате своего последнего дела.
    3. **Хвосты**. Команда сталкивается с неприятностями от соперничающих фракций, закона и самого призрачного города.
    4. **Занятия в свободное время**. Персонажи предаются порокам, чтобы снять стресс, работают над долгосрочными проектами, оправляются от ран и так далее.

    После того как занятия в свободное время разрешены, игра возвращается к свободной игре, и группа может двигаться к следующему делу.
- id: downtime-activities
  name: Занятия в свободное время
  description: |-
    Между делами ваша команда проводит время на свободе, занимаясь личными нуждами и побочными проектами. Это называется **занятиями в свободное время** (см. список ниже). В фазу свободного времени у каждого персонажа есть время на **два занятия**. *Когда вы на войне, у каждого персонажа есть время только на одно.*

    * Раздобыть ресурс
    * Долгосрочный проект
    * Восстановление
    * Снижение жара
    * Тренировка
    * Предаться пороку

    Вы можете выбрать одно и то же занятие несколько раз. Пробовать можно только те действия, которые вы в состоянии выполнить. Если занятие зависит от другого действия, сначала разрешите это действие.

    Персонаж может найти время больше чем на два занятия, но не бесплатно. **Каждое дополнительное занятие из списка стоит** **1** **монету** или **1** **репутации**. Это отражает время и расход ресурсов, пока вы «не на службе» и не зарабатываете на деле. Когда вы завершаете новое дело, счётчик сбрасывается, и у вас снова два «бесплатных» занятия.

    Занятия из списка свободного времени ограничены, обычные действия нет. В свободное время вы всё равно можете ходить куда угодно, что-то делать, совершать броски действия, собирать сведения, разговаривать с другими персонажами и так далее. Иначе говоря, ограничены только занятия, которые *есть в списке*.

    Для любого занятия в свободное время получайте **+1d** к броску, если вам помогает **друг** или **контакт**. После броска вы можете потратить **монеты**, чтобы улучшить уровень результата. **Повышайте уровень результата на один за каждую потраченную **монету**.** Так, результат **1-3** становится **4** или **5**, результат **4/5** становится **6**, а **6** становится **критическим успехом**.

    **Мастер (GM):** если игрок не может решить, какое занятие выбрать, предложите ему идею долгосрочного проекта. Вы знаете, что интересует игрока и что ему нравится. Предложите проект, который пойдёт в интересном для него направлении.

    > «Помните то странное видение у алтаря забытых богов? Хотите докопаться до сути? Хорошо, начните долгосрочный проект на шесть делений под названием... "Странное ощущение от богов". Что вы делаете, чтобы продвинуть его?»
- id: downtime-activities-acquire-asset
  name: Раздобыть ресурс
  description: |-
    Получите во временное пользование **ресурс**:

    * Один особый **предмет** или набор обычных предметов (достаточно для банды вашего ранга).
    * **Подручных** (эксперта или банду).
    * **Транспорт**.
    * **Услугу**. Перевозку от контрабандиста или водителя, использование склада для временного хранения, юридическое представительство и так далее.

    «Временное пользование» означает один значимый период использования, подходящий для ресурса, обычно длительность одного дела. Ресурс также можно получить «про запас» для будущего использования. Например, вы можете нанять банду охранять своё логово, и она останется до первого серьёзного боя или пока не пройдёт неделя и ей не наскучит.

    Чтобы раздобыть ресурс, бросайте ранг команды. Результат показывает **качество** полученного ресурса, где за основу берётся ранг команды. **1-3**: ранг -1, **4/5**: ранг, **6**: ранг +1, **критический успех**: ранг +2. Вы можете тратить **монеты**, чтобы поднять результат этого броска выше **критического успеха**, по **2** **монеты** за каждый дополнительный уровень ранга.

    Мастер (GM) может задать **минимальный уровень качества**, который нужно получить, чтобы раздобыть определённый ресурс. Например, если вы хотите получить набор униформы и масок Стражей, вам нужен ресурс ранга IV. Меньший результат не подойдёт.

    Если вы снова раздобываете тот же ресурс, вы получаете **+1d** к броску. Если вы каждый раз заново добываете ресурс после его использования, то фактически можете арендовать его бессрочно.

    Алхимические средства, яды, бомбы и опасные устройства строго ограничены. Когда вы раздобываете один из таких предметов (а не создаёте его сами), вы получаете **+2** **жара**.

    Если вы хотите получить ресурс насовсем, вы можете либо получить его как улучшение команды, либо работать над ним как над **долгосрочным проектом**, чтобы наладить постоянное снабжение.

    > Замира Шёпот — дуэлянтка в ируврианском стиле и хотела бы добавить хороший меч к своим постоянным предметам. Её игрок начинает долгосрочный проект: «Вернуть мой фамильный меч из ломбарда». Мастер говорит, что это часы на 8 делений (она может работать над этим, **Знакомясь** или **Влияя** на владельца ломбарда, или, может быть, бросая свой уровень жизни, что отражает небольшие выплаты).
- id: downtime-activities-indulge-vice
  name: Предаться пороку
  description: |-
    Посетите своего **поставщика порока**, чтобы снять **стресс**. Подробности в следующем разделе.
- id: downtime-activities-indulging-your-vice
  name: Предаваясь пороку
  description: |-
    Когда вы предаётесь пороку, вы снимаете часть стресса с шкалы стресса своего персонажа. Скажите, как ваш персонаж предаётся пороку, включая то, какого **поставщика порока** он использует, чтобы удовлетворить свои нужды. Это занимает время, поэтому делать это можно, только когда у команды есть **свободное время**. Либо вы можете отпустить своего персонажа «погрузиться в порок» на время игровой сессии, позволив ему предаваться пороку за кадром, пока вы играете другим персонажем. Член банды, друг или контакт команды может быть создан как запасной персонаж для игры, что делает картину персонажей полнее.

    Вы бросаете кубы, чтобы узнать, сколько стресса снимается у вашего персонажа. Бросок порока похож на бросок сопротивления наоборот: вы не получаете уровни стресса, а снимаете их. Эффективность пристрастия зависит от худшего рейтинга атрибута вашего персонажа. Именно его самое слабое качество (**Рассудок**, **Сноровка** или **Воля**) больше всего во власти порока.

    Сделайте **бросок атрибута** по самому низкому рейтингу атрибута вашего персонажа (если рейтинги равны, ничего страшного: просто используйте этот рейтинг). **Снимите стресс, равный наибольшему результату на кубе.**
- id: downtime-activities-indulging-your-vice-ignoring-your-vice
  name: Игнорирование порока
  description: |-
    Если вы не предаётесь пороку или не можете этого сделать в фазу свободного времени, вы получаете стресс, равный вашей **травме**. Если у вас нет **травмы**, вы вольны игнорировать порок. Он над вами пока не властен.
