- id: crafting
  name: Создание предметов
  description: |-
    Во время свободного времени персонаж игрока может **поработать с механикой**, используя особые материалы и инструменты, чтобы получать странные **алхимические составы**, **собирать** (или **улучшать**) **предметы**, **создавать искровые** устройства или зачаровывать **тайные** орудия и оружие. Система для каждого способа схожа, а подробности зависят от природы проекта.
- id: crafting-crafting
  name: Создание
  description: |-
    Чтобы создать что-либо, потратьте одно **действие в свободное время** и сделайте бросок **Механики**, чтобы определить **уровень качества** изготовленного предмета. Базовый уровень качества равен рангу вашей команды и меняется в зависимости от результата броска (результаты приведены в следующем разделе).

    Результат зависит от ранга команды, потому что ранг показывает общее качество мастерской и материалов, которые вам доступны. *Если вы работаете с улучшением команды **Мастерская**, ваш эффективный ранг для этого броска на единицу выше.*
- id: crafting-crafting-crafting-roll
  name: БРОСОК СОЗДАНИЯ
  description: |-
    ⏣ **1d** за каждую точку действия **Механика**.

    ⊕ **+1** к качеству за каждую потраченную **монету**.

    ⊕ **+1** к качеству за улучшение команды **Мастерская**.

    * **Критический успех**: уровень качества равен рангу +2.
    * **6**: уровень качества равен рангу +1.
    * **4/5**: уровень качества равен рангу.
    * **1-3**: уровень качества равен рангу -1.

    ---

    Мастер (GM) задаёт **минимальный уровень качества**, который нужно достичь, чтобы создать предмет, исходя из **величины** производимых им эффектов. Величина служит Мастеру лишь *ориентиром* для уровня качества: он может назначить его выше или ниже по своему усмотрению, чтобы лучше передать суть проекта. Предмет можно создать и *более высокого* качества, если игрок хочет попытаться.

    Вы можете тратить **монеты** 1 к 1, чтобы повысить итоговый уровень качества по результату броска (так качество может подняться выше ранга +2).
- id: crafting-crafting-drawbacks
  name: Изъяны
  description: |-
    У создания или улучшения может быть один или несколько изъянов, которые выбирает Мастер (GM).

    * **Сложный**. Его придётся создавать в несколько этапов; сколько именно, скажет Мастер. На каждый этап нужны одно действие в свободное время и один бросок создания.
    * **Приметный**. Это создание не остаётся незамеченным. Получите **+1** **жара**, если его используют в деле, сколько бы раз ни было.
    * **Расходуемый**. У этого создания ограниченное число применений (у всех алхимических составов должен быть этот изъян, обычно одно применение).
    * **Редкий**. Для создания нужен редкий предмет или материал.
    * **Ненадёжный**. Когда вы используете предмет, сделайте бросок удачи (по его **качеству**), чтобы узнать, как он сработал.
    * **Нестабильный**. Предмет вызывает у пользователя опасный или неприятный побочный эффект, который определяет Мастер. Побочный эффект является последствием, и ему можно **сопротивляться** (результат «выдержано»).
- id: crafting-crafting-modifying-an-item
  name: Улучшение предмета
  description: |-
    Добавить предмету свойство или дополнительную функцию проще, чем создавать новое. Вам не нужно изобретать особую формулу или чертёж. Сделайте бросок создания, чтобы улучшить предмет (базовое качество улучшаемого предмета, как обычно, равно рангу вашей команды).

    * Простое полезное улучшение требует качества «ранг +1». *Винтовка, которая разбирается на две части, чтобы её легче было спрятать.*
    * Существенное улучшение требует качества «ранг +2». *Усиленный ствол и увеличенный заряд пороха, чтобы оружие стреляло дальше.*
    * Тайное, искровое или алхимическое улучшение требует качества «ранг +3». *Кинжал, способный ранить демона. Корпус лодки под током, чтобы отпугивать абордажников или призраков. Одежда, пропитанная составами, которые скрывают вас от хищников пустошей.*

    Улучшенные предметы, как и особые создания, могут иметь **изъяны**.
- id: crafting-inventing
  name: Изобретение
  description: |-
    Чтобы изобрести формулу нового алхимического состава или чертёж нового предмета собственной разработки, вам нужно провести **Изучение** как **долгосрочный проект**. Для большинства новых формул и чертежей понадобятся часы на 8 делений, чтобы изобрести и освоить их. Игрок и Мастер (GM) отвечают на вопросы об изобретении, определяя, что оно будет делать в игре и что нужно для его создания (см. ниже). Игрок записывает эти ответы в заметки на будущее.
- id: crafting-inventing-creation-questions
  name: Вопросы о создании
  description: |-
    1. Мастер (GM) спрашивает: **«Что это за создание и что оно делает?»** Игрок отвечает. Создание может быть обычным, алхимическим, тайным или искровым. Если у персонажа игрока есть подходящее особое умение (**Алхимик**, **Артефактор**, **Странные методы**), он получает бонусы при изобретении и создании некоторых видов созданий.
    2. Игрок спрашивает: **«Каков минимальный уровень качества этого предмета?»** Мастер отвечает, ориентируясь на **величину** эффектов, которые производит предмет.
    3. Мастер спрашивает: **«Какая редкая, странная или неудобная особенность этой формулы или чертежа удерживала её в безвестности, вдали от общего употребления?»** Игрок отвечает.
    4. Игрок спрашивает: **«Какие изъяны есть у этого предмета, если есть?»** Мастер отвечает, выбирая один или несколько изъянов из списка или заявляя, что их нет.

    Персонаж игрока с особым умением **Алхимик**, **Артефактор** или **Странные методы** при получении умения изобретает и осваивает одну особую формулу (ему не нужно тратить время на её освоение).

    Когда вы изобрели формулу или чертёж, вы можете **создавать** по ним предмет, тратя действие в свободное время (см. **Создание** выше). Никто другой не может создавать это изобретение, пока не освоит ваш чертёж как долгосрочный проект. Если вы получили формулу или чертёж, изобретённые другим мастером, вы можете научиться создавать по ним предметы, завершив долгосрочный проект.

    Обычные алхимические составы (подробнее см. **Образцы созданий**) и простые предметы не требуют особых формул или чертежей. Любой может попробовать их создать по общедоступным инструкциям.
- id: crew-creation-assign-crew-upgrades
  name: Назначьте улучшения команды
  description: |-
    Улучшение — это ценный ресурс, который чем-то помогает команде, например лодка или банда (полные описания см. в следующих разделах). У каждого типа команды есть два заранее выбранных **улучшения**, подходящих ей (например, **Тренировка** **сноровки** и **банда** Громил для команды Бравы).

    К ним вы добавляете **два дополнительных улучшения** для новой команды (всего в начале будет четыре улучшения). Выбирать можно из улучшений, доступных вашему типу команды, или из общих улучшений на листе команды.

    Когда вы назначаете два улучшения, Мастер (GM) сообщит вам о двух фракциях, на которые влияет ваш выбор:

    * Одна фракция помогла вам получить улучшение. Вы ей нравитесь, и вы получаете **+1 статус** с ней. По желанию потратьте 1 **монету**, чтобы отблагодарить её, и получите вместо этого **+2 статус** с ней.
    * Одну фракцию вы обошли при получении улучшения. Вы ей не нравитесь, и вы получаете **-2 статус** с ней. По желанию потратьте 1 **монету**, чтобы её умилостивить, и получите вместо этого **-1 статус** с ней.

    В будущем вы сможете получать новые улучшения, зарабатывая опыт
- id: crew-creation-choose-a-crew-type
  name: Выберите тип команды
  description: |-
    В каждой игре на основе Blades должны быть типы команд, подходящие её сеттингу и замыслу. Это могут быть организации, банды, корабли, укрепления и так далее. Хорошо, когда вариантов от трёх до шести.

    Тип команды определяет, на каких делах вы сосредоточитесь, а также набор особых умений, поддерживающих такие действия. Тип команды не должен быть ограничением — команда контрабандистов может иногда заниматься вымогательством или продавать краденое, — но основное занятие этого типа остаётся самым частым способом заработать **монеты** и опыт для развития.

    Как и плейбук персонажа, тип команды определяет, как вас знают в преступном мире. Преступные фракции и учреждения считают вас «убийцами» или «культом» и так далее и обращаются с вами соответственно.

    В казне вашей команды вначале 2 **монеты** (остатки сбережений персонажей игроков). У вас **ранг 0**, **сильный контроль** и **0** **репутации**.
- id: crew-creation-choose-a-favorite-contact
  name: Выберите любимый контакт
  description: |-
    Просмотрите список возможных контактов на листе команды. Выберите одного контакта: близкого друга, давнего союзника или сообщника. Мастер (GM) расскажет о двух фракциях, на которые влияет ваш выбор:

    * Одна фракция тоже дружит с этим контактом, и вы получаете **+1 статус** с ней.
    * Одна фракция не ладит с этим контактом, и вы получаете **-1 статус** с ней.

    По желанию эти фракции могут относиться к контакту ещё серьёзнее, и тогда вы получаете **+2** и **-2 статус** вместо этого.
- id: crew-creation-choose-a-special-ability
  name: Выберите особое умение
  description: |-
    Посмотрите на особые умения вашей команды и выберите одно. Если не можете решить, берите первое в списке: оно поставлено туда как хороший вариант по умолчанию. Важно выбрать особое умение, которое нравится всем. В будущем вы сможете получить больше особых умений, зарабатывая опыт.

    Как и выбор типа команды, репутации, логова и охотничьих угодий, выбор особого умения — ещё один шанс сузить игру до более конкретного круга возможностей. Это даёт много материала для работы и помогает с самого начала направить игру в сильную сторону.
- id: crew-creation-choose-an-initial-reputation-lair
  name: Выберите начальную репутацию и логово
  description: |-
    Ваша команда только что образовалась и обзавелась логовом. Какую начальную **репутацию** вы имели бы среди фракций преступного мира, учитывая этих персонажей и их прежние похождения? Выберите одну из списка справа (или придумайте свою).

    * Амбициозная
    * Беспощадная
    * Дерзкая
    * Благородная
    * Профессиональная
    * Расчётливая
    * Тонкая
    * Странная

    Вы получаете опыт, когда укрепляете репутацию команды, так что считайте это ещё одной подсказкой, какие действия вы хотите видеть в игре. Будете ли вы безрассудно амбициозны, целясь в цели более высокого ранга? Возьмётесь ли за дерзкие дела, которые другие считают слишком рискованными? Вас привлекает странное и необычное?

    Также обсудите, где команда устроит своё **логово**. Вы начинаете с ранга 0, так что это, скорее всего, очень скромное или заброшенное место.
- id: crew-creation-cohort-harm-healing
  name: Вред подручным и их исцеление
  description: |-
    Подручные получают вред так же, как персонажи игроков. Подручные могут получить вред четырёх уровней:

    * **Ослаблены.** У подручных меньший эффект.
    * **Подорваны.** Подручные действуют с пониженным качеством (-1d).
    * **Выведены из строя.** Подручные ничего не могут делать, пока не оправятся.
    * **Мёртвы.** Подручные уничтожены.

    Все ваши подручные лечатся во время свободного времени. Если обстоятельства позволяют восстановиться, каждые подручные снимают один уровень вреда (или два уровня, если персонаж игрока тратит действие в свободное время, помогая им прийти в себя).

    Если подручные уничтожены, их можно заменить. Потратьте **монеты** в количестве, равном рангу +2, чтобы восстановить их, и два действия в свободное время, чтобы набрать новых членов банды или нанять нового эксперта.
- id: crew-creation-cohorts
  name: Подручные
  description: |-
    **Подручные** — это **банда** или **эксперт**, работающие на вашу команду. Чтобы нанять новых подручных, потратьте **два улучшения** и создайте их по процессу ниже.
- id: crew-creation-cohorts-creating-a-gang
  name: Создание банды
  description: |-
    Выберите **тип банды** из списка ниже:

    * **Адепты**: учёные, механики-самоучки, оккультисты и химики.
    * **Грачи**: мошенники, шпионы и светские львы.
    * **Бродяги**: моряки, кучера и сборщики добычи в пустошах.
    * **Лазутчики**: разведчики, проникатели и воры.
    * **Громилы**: убийцы, драчуны и чернорабочие.

    **Масштаб** и **качество** банды равны текущему рангу вашей команды. Они растут, когда команда поднимается в ранге.

    > Если ваша команда имеет ранг 0, банда имеет качество 0 и масштаб 0 (1 или 2 человека). Когда команда достигает ранга II, банда имеет качество 2 и масштаб 2 (12 человек).

    Некоторые улучшения команды добавляют банде свойство «Элита», которое даёт +1d, когда она бросает кубы для определённого типа. *Так, если вы имеете ранг I и банду элитных Громил (+1d), они бросают 2d, когда пытаются убить цель.*
- id: crew-creation-cohorts-creating-an-expert
  name: Создание эксперта
  description: |-
    Запишите **тип** эксперта (его конкретную область знаний). Он может быть *врачом*, *сыщиком*, *оккультистом*, *убийцей*, *шпионом* и так далее.

    **Качество** эксперта равно текущему рангу вашей команды +1. Его масштаб всегда равен нулю (1 человек). Качество ваших экспертов растёт, когда команда поднимается в ранге.
- id: crew-creation-cohorts-edges-flaws
  name: Сильные стороны и слабости
  description: |-
    Когда вы создаёте подручных, дайте им одну или две **сильные стороны** и столько же **слабостей**.

    **Сильные стороны**

    * **Устрашающие:** подручные наводят ужас видом и репутацией.
    * **Самостоятельные:** подручным можно доверять принимать хорошие решения и действовать по своей инициативе, когда нет прямых приказов.
    * **Преданные:** подручных нельзя подкупить или настроить против вас.
    * **Упорные:** подручных не отвратить от задачи.

    **Слабости**

    * **Принципиальные:** у подручных есть этика или ценности, которых они не предадут.
    * **Дикие:** подручные чрезмерно жестоки и беспощадны.
    * **Ненадёжные:** подручные не всегда доступны из-за других обязательств, одурманенности пороками и тому подобного.
    * **Необузданные:** подручные пьяны, распутны и горласты.
