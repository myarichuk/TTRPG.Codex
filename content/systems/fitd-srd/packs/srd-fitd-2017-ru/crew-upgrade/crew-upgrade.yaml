- id: training
  name: Обучение
  description: |-
    Если у вас есть улучшение «Обучение», вы получаете 2 опыта (вместо 1), когда во время свободного времени тренируете соответствующую шкалу опыта (**Рассудок**, **Сноровка**, **Воля** или опыт плейбука). Это улучшение по сути помогает развиваться быстрее. Подробнее см. **Развитие**.  *Если у вас есть «Обучение рассудка», то когда вы тренируете Рассудок во время свободного времени, вы отмечаете 2 опыта на шкале **Рассудок** (вместо 1). Если у вас есть «Обучение плейбука», вы отмечаете 2 опыта на шкале опыта плейбука, когда тренируетесь.*
- id: rigging
  name: Снаряжение
  description: |-
    Вы получаете 2 свободные единицы ноши в двух из категорий снаряжения (оружие, орудия, припасы, снасти, документы и инструменты).
- id: vault
  name: Хранилище
  description: |-
    В вашем логове есть надёжное хранилище, которое увеличивает вместимость для **монет** до 8. Второе улучшение увеличивает вместимость до 16.  Отдельная часть хранилища может служить камерой для задержанных.
- id: carriage-house
  name: Каретный сарай
  description: |-
    У вас есть карета, тягловые животные для неё и конюшня. Второе улучшение усиливает карету бронёй и более крупными, быстрыми лошадьми.
- id: workshop
  name: Мастерская
  description: |-
    В вашем логове есть мастерская, оснащённая инструментами для механики и алхимии, а также небольшая библиотека книг, документов и карт. С этими ресурсами вы можете вести долгосрочные проекты, не покидая логова.
- id: camouflage
  name: Камуфляж
  description: |-
    Ваш транспорт в покое отлично замаскирован. Он сливается с окружением или выглядит как неприметный гражданский экипаж (на ваш выбор).
- id: composed
  name: Выдержка
  description: |-
    Каждый персонаж игрока получает **+1 клетку стресса**. Чтобы открыть это улучшение, нужны три улучшения, а не одно.
- id: hidden-lair
  name: Скрытое логово
  description: |-
    Ваше логово находится в тайном месте и замаскировано, чтобы скрыть его от глаз. Если логово раскрыли, потратьте два действия свободного времени и заплатите **монеты** в размере вашего ранга, чтобы перенести его и снова спрятать.
- id: secure-lair
  name: Защищённое логово
  description: |-
    В вашем логове есть замки, сигнализация и ловушки, чтобы остановить незваных гостей. Второе улучшение усиливает защиту тайными мерами, действующими против духов. *Вы можете бросить кубы по рангу вашей команды, если эти меры когда-нибудь будут испытаны, чтобы узнать, насколько хорошо они остановят незваного гостя.*
- id: prison-contacts
  name: Тюремные связи
  description: |-
    Ваш ранг в тюрьме фактически на +1 выше. *Это относится ко всему, что зависит от ранга в тюрьме, включая бросок заключения.*
- id: quarters
  name: Жилые помещения
  description: |-
    В вашем логове есть жилые помещения для команды. Без этого улучшения каждый персонаж игрока спит где-то в другом месте и уязвим, когда спит.
- id: quality
  name: Качество
  description: |-
    **Каждое улучшение повышает рейтинг качества** всех предметов этого типа у персонажей игроков сверх качества, заданного рангом команды и отличными предметами. Вы можете повысить качество **документов**, **снастей** (охватывают взломщицкие снасти и снасти для лазания), тайных **орудий**, **припасов** для обмана, **инструментов** (охватывают инструменты подрывника и механика) и **оружия**. *Так, если у вас ранг 0, отличные отмычки (+1) и улучшение «Качество» для снастей (+1), вы сможете на равных тягаться с замком ранга II.*
- id: cohort
  name: Подручный
  description: |-
    Подручные это банда или один эксперт, персонаж Мастера, который работает на вашу команду. Все подробности о подручных см. в следующих разделах.
- id: elite-cohorts-specify-type
  name: Элитные подручные (укажите тип)
  description: |-
    Все ваши подручные указанного типа получают **+1d** к броскам качества для связанных действий.
- id: mastery
  name: Мастерство
  description: |-
    Ваша команда получает доступ к обучению мастерского уровня. Вы можете повысить рейтинги действий ваших персонажей игроков до 4 (пока вы не откроете это улучшение, рейтинги действий персонажей игроков ограничены 3). Чтобы открыть это улучшение, нужны четыре клетки улучшений.
- id: hardened
  name: Закалка
  description: |-
    Каждый персонаж игрока получает **+1** **клетку** **травмы**. Чтобы открыть это улучшение, нужны три улучшения, а не одно. *Это может вернуть в игру персонажа с 4 **травмами**, если вы того пожелаете.*
- id: boat-house
  name: Лодочный сарай
  description: |-
    У вас есть лодка, причал на водном пути и небольшой сарай для хранения лодочных припасов. Второе улучшение усиливает лодку бронёй и большей грузовместимостью.
- id: underground-maps-and-passkeys
  name: Подземные карты и пропуска
  description: |-
    Вы легко проходите по подземным каналам, туннелям и подвалам города.
