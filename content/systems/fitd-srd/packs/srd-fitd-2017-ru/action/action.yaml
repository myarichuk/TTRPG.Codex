- id: skirmish
  name: Схватка
  description: |-
    Когда вы совершаете действие **Схватка**, вы связываете цель ближним боем, так что ей непросто вырваться.

    *Вы можете драться или бороться с ней. Вы можете рубить и колоть. Вы можете захватить или удержать позицию в бою. Вы можете попытаться сразиться на формальной дуэли (но лучше подойдёт Изящество).*
- id: hunt
  name: Охота
  description: |-
    Когда вы совершаете действие **Охота**, вы старательно выслеживаете цель.

    *Вы можете следовать за целью или выяснить, где она. Вы можете устроить засаду. Вы можете атаковать издалека меткой стрельбой. Вы можете попытаться пустить в ход огнестрельное оружие в рукопашной (но лучше подойдёт Схватка).*
- id: study
  name: Изучение
  description: |-
    Когда вы совершаете действие **Изучение**, вы вникаете в подробности и толкуете улики.

    *Вы можете собирать сведения из документов, газет и книг. Вы можете исследовать малоизвестный предмет. Вы можете внимательно изучать человека, чтобы уловить ложь или истинные чувства. Вы можете попытаться разобрать события, чтобы понять острую ситуацию (но лучше подойдёт Осмотр).*
- id: sway
  name: Влияние
  description: |-
    Когда вы совершаете действие **Влияние**, вы воздействуете на людей хитростью, обаянием или доводами.

    *Вы можете убедительно лгать. Вы можете уговорить кого-то сделать то, что вам нужно. Вы можете привести столь веский довод, что возразить нечего. Вы можете попытаться обманом добиться чьей-то привязанности или послушания (но лучше подойдут Знакомства или Приказ).*
- id: wreck
  name: Разрушение
  description: |-
    Когда вы совершаете действие **Разрушение**, вы даёте волю дикой силе.

    *Вы можете проломить дверь или стену кувалдой или сделать то же самое взрывчаткой. Вы можете устроить хаос или диверсию, чтобы отвлечь внимание или преодолеть препятствие. Вы можете попытаться подавить врага в бою одной лишь грубой силой (но лучше подойдёт Схватка).*
- id: finesse
  name: Изящество
  description: |-
    Когда вы совершаете действие **Изящество**, вы действуете ловкими руками или тонким отвлекающим манёвром.

    *Вы можете обчистить чей-то карман. Вы можете управлять транспортом или направлять верховое животное. Вы можете сразиться с противником на формальной дуэли, применяя изящные боевые искусства. Вы можете попытаться применить эти искусства в хаотичной свалке (но лучше подойдёт Схватка). Вы можете попытаться вскрыть замок (но лучше подойдёт Механика).*
- id: survey
  name: Осмотр
  description: |-
    Когда вы совершаете действие **Осмотр**, вы наблюдаете за обстановкой и предугадываете исходы.

    *Вы можете заметить признаки беды до того, как она случится. Вы можете обнаружить возможности или слабые места. Вы можете угадать мотивы или намерения человека. Вы можете попытаться найти хорошее место для засады (но лучше подойдёт Охота).*
- id: consort
  name: Знакомства
  description: |-
    Когда вы совершаете действие **Знакомства**, вы общаетесь с друзьями и контактами.

    *Вы можете получить доступ к ресурсам, сведениям, людям или местам. Вы можете произвести хорошее впечатление или расположить к себе кого-то обаянием и стилем. Вы можете завести новых друзей или обратиться к своему происхождению или прошлому. Вы можете попытаться манипулировать друзьями с помощью общественного давления (но лучше подойдёт Влияние).*
- id: command
  name: Приказ
  description: |-
    Когда вы совершаете действие **Приказ**, вы добиваетесь быстрого повиновения.

    *Вы можете запугивать или угрожать, чтобы получить желаемое. Вы можете возглавить банду в групповом действии. Вы можете попытаться отдавать людям распоряжения, чтобы их убедить (но лучше подойдут Знакомства).*
- id: attune
  name: Настройка
  description: |-
    Когда вы совершаете действие **Настройка**, вы открываете разум тайной силе.

    *Вы можете говорить с призраком. Вы можете попытаться воспринять то, что за пределами зрения, чтобы лучше понять своё положение (но лучше подойдёт Осмотр).*
- id: prowl
  name: Подкрадывание
  description: |-
    Когда вы совершаете действие **Подкрадывание**, вы умело и бесшумно перемещаетесь.

    *Вы можете прокрасться мимо стражника или спрятаться в тени. Вы можете бегать и прыгать по крышам. Вы можете напасть на кого-то из укрытия, ударив в спину или дубинкой. Вы можете попытаться подстеречь жертву посреди боя (но лучше подойдёт Схватка).*
- id: tinker
  name: Механика
  description: |-
    Когда вы совершаете действие **Механика**, вы возитесь с устройствами и механизмами.

    *Вы можете создать новое приспособление или переделать существующую вещь. Вы можете вскрыть замок или взломать сейф. Вы можете отключить сигнализацию или ловушку. Вы можете обратить себе на пользу часовые и электроплазменные устройства города. Вы можете попытаться применить технические знания, чтобы управлять транспортом (но лучше подойдёт Изящество).*
