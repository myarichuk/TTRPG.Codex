- id: obsessed
  name: Одержимый
  description: |-
    Вас пленяет что-то одно: занятие, человек, идеология.
- id: soft
  name: Мягкосердечный
  description: |-
    Вы теряете хватку: становитесь сентиментальным, пассивным, мягким.
- id: reckless
  name: Безрассудный
  description: |-
    Вы мало заботитесь о собственной безопасности и своих интересах.
- id: vicious
  name: Жестокий
  description: |-
    Вы ищете случая причинить людям боль, даже без всякой причины.
- id: haunted
  name: Преследуемый
  description: |-
    Вы часто погружаетесь в грёзы, заново переживаете прошлые ужасы, видите то, чего нет.
- id: unstable
  name: Неуравновешенный
  description: |-
    Ваше душевное состояние переменчиво. Вы можете мгновенно впасть в ярость или отчаяние, поступить импульсивно или застыть.
- id: paranoid
  name: Параноик
  description: |-
    Вам повсюду мерещится опасность; вы не можете доверять другим.
- id: cold
  name: Холодный
  description: |-
    Вас не трогают ни эмоциональные призывы, ни социальные узы.
