# Hebrew display text for the Forged in the Dark SRD system. MACHINE-DRAFTED, not yet reviewed by a native speaker.
# Terms: docs/i18n-glossary.md ("Forged in the Dark SRD"). Keys, ids and rules stay English; only display text is here.
# The sheet's own labels (sheet kinds, tracks, keyed-list rows, layout sections) have no translation section on main, so every
# word the sheet or the roller can show goes under `values`, which the UI looks up by the English word (case-insensitive).
name: Forged in the Dark SRD
compatibility: Forged in the Dark
description: >-
  מסמך עזר למשפחת משחקים מבוססי קוביות על נוכלים נועזים ועל הצוותים שהם מנהלים: דירוגי פעולה בנקודות, d6 לכל נקודה,
  תוצאה הנקראת מהקובייה הגבוהה ביותר, לחץ שאפשר להוציא כדי לעמוד בפני תוצאות, פציעות וטראומות שמשחקות בדמויות,
  וצוות עם דרג, מוניטין, חום ורמת מבוקש. חוקים בלבד; העולם, הפלייבוקים וסוגי הצוותים של כל משחק מפורסם אינם חלק ממנו.

setting:
  summary: >-
    נוכלים מתלכדים לצוות, יוצאים למבצעים מסוכנים נגד פלגים עשירים וחזקים מהם, ומשלמים על כל הצלחה בלחץ, בפציעות,
    בחום ובסבכים. המערכת אינה מניחה עולם מסוים: את העולם מביא הקמפיין.
  genres: [שוד, פשע, מבצע נועז]
  tone: [מתוח, נואש, נועז]
  themes: [שאפתנות ומחירה, נאמנות תחת לחץ, תוצאות ההצלחה]
  factions: [צוותי פשע יריבים, החוק, גילדות ובתי אצולה, כתות סודיות]
  play: [הצוות מתכנן מבצע, המבצע משתבש, התוצאות מטופלות בזמן הפנוי]
  notes: סוגי צוותים, פלייבוקים, מורשות ורקעים נקבעים בכל משחק או קמפיין.

entityTypes:
  rule:
    label: חוק
    pluralLabel: חוקים
    fields:
      category: { label: פרק }
      order: { label: סדר }
  action:
    label: פעולה
    pluralLabel: פעולות
    fields:
      attribute: { label: תכונה }
  trauma:
    label: מצב טראומה
    pluralLabel: מצבי טראומה
  special-ability:
    label: יכולת מיוחדת
    pluralLabel: יכולות מיוחדות
  crew-ability:
    label: יכולת מיוחדת של הצוות
    pluralLabel: יכולות מיוחדות של הצוות
  crew-upgrade:
    label: שדרוג הצוות
    pluralLabel: שדרוגי הצוות
    fields:
      cost: { label: משבצות שדרוג }
  item:
    label: פריט
    pluralLabel: פריטים
    fields:
      load: { label: עומס }

conditions:
  Retired: פרש
  Dead: מת
  Less effect: השפעה מופחתת
  Reduced dice: קוביות מופחתות
  Needs help: זקוק לעזרה

maxSuffix: מקס׳

sheetRules:
  messages:
    "more load used than the chosen load allows ({LoadMax}).": נעשה שימוש בעומס גדול מזה שהעומס שנבחר מאפשר ({LoadMax}).
    "an action rating is above {actionCap}.": דירוג פעולה גבוה מ-{actionCap}.

