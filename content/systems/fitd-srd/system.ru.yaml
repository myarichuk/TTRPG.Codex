# Russian display text for the Forged in the Dark SRD system. MACHINE-DRAFTED, not yet reviewed by a native speaker.
# Terms: docs/i18n-glossary.md ("Forged in the Dark SRD"). Keys, ids and rules stay English; only display text is here.
# The sheet's own labels (sheet kinds, tracks, keyed-list rows, layout sections) have no translation section on main, so every
# word the sheet or the roller can show goes under `values`, which the UI looks up by the English word (case-insensitive).
name: Forged in the Dark SRD
compatibility: Forged in the Dark
description: >-
  Справочный документ к семейству игр на кубах о дерзких проходимцах и командах, которыми они управляют: рейтинги действий
  в точках, d6 за каждую точку, результат по наивысшему кубу, стресс, который можно потратить, чтобы сопротивляться
  последствиям, вред и травмы, постепенно ломающие персонажей, и команда с рангом, репутацией, жаром и уровнем розыска.
  Только правила; сеттинг, плейбуки и типы команд любой отдельной игры в него не входят.

setting:
  summary: >-
    Проходимцы собираются в команду, берутся за опасные дела против более богатых и могущественных фракций и платят за каждый
    успех стрессом, вредом, жаром и осложнениями. Система не предполагает конкретного мира: его приносит кампания.
  genres: [ограбление, криминал, авантюра]
  tone: [напряжённый, отчаянный, дерзкий]
  themes: [амбиции и их цена, верность под давлением, последствия успеха]
  factions: [соперничающие преступные команды, закон, гильдии и знатные дома, тайные культы]
  play: [команда планирует дело, дело идёт не по плану, последствия разбираются в свободное время]
  notes: Типы команд, плейбуки, происхождение и прошлое определяет каждая игра или кампания.

entityTypes:
  rule:
    label: Правило
    pluralLabel: Правила
    fields:
