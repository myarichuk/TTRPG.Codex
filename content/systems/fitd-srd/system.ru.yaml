    pluralLabel: Состояния-травмы
  special-ability:
    label: Особое умение
    pluralLabel: Особые умения
  crew-ability:
    label: Особое умение команды
    pluralLabel: Особые умения команды
  crew-upgrade:
    label: Улучшение команды
    pluralLabel: Улучшения команды
    fields:
      cost: { label: Клетки улучшения }
  item:
    label: Предмет
    pluralLabel: Предметы
    fields:
      load: { label: Ноша }

conditions:
  Retired: Ушёл на покой
  Dead: Мёртв
  Less effect: Меньший эффект
  Reduced dice: Меньше кубов
