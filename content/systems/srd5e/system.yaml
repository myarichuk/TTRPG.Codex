# Fifth Edition SRD - a data-driven system definition for TTRPG.Codex.
#
# The rules text this system's packs carry comes from the System Reference Document 5.2.1 by
# Wizards of the Coast LLC under CC-BY-4.0 (see license below and content/systems/srd5e/packs/*/manifest.yaml).
# The SRD licence grants no trademark rights, so the system is named after the document and
# describes itself only as "5E compatible", exactly as the SRD's legal page permits.
id: srd5e
name: Fifth Edition SRD (5.2.1)
version: 5.2.1
compatibility: 5E compatible
description: >-
  The 2024 revision of the fifth-edition rules as published in the System Reference Document 5.2.1:
  twelve classes with one subclass each, nine species, four backgrounds, seventeen feats, 339 spells
  and 340 creatures.
license:
  name: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/legalcode
  sourceUrl: https://www.dndbeyond.com/srd
  modified: true
  attribution: >-
    This work includes material from the System Reference Document 5.2.1 ("SRD 5.2.1") by Wizards of the
    Coast LLC, available at https://www.dndbeyond.com/srd. The SRD 5.2.1 is licensed under the Creative
    Commons Attribution 4.0 International License, available at
    https://creativecommons.org/licenses/by/4.0/legalcode.

attributes:
  - { key: str, label: Strength,     abbreviation: STR, default: 10, min: 1, max: 30, modifier: half-minus-five }
  - { key: dex, label: Dexterity,    abbreviation: DEX, default: 10, min: 1, max: 30, modifier: half-minus-five }
  - { key: con, label: Constitution, abbreviation: CON, default: 10, min: 1, max: 30, modifier: half-minus-five }
  - { key: int, label: Intelligence, abbreviation: INT, default: 10, min: 1, max: 30, modifier: half-minus-five }
  - { key: wis, label: Wisdom,       abbreviation: WIS, default: 10, min: 1, max: 30, modifier: half-minus-five }
  - { key: cha, label: Charisma,     abbreviation: CHA, default: 10, min: 1, max: 30, modifier: half-minus-five }

resources:
  - { key: HP,     label: Hit Points,           maxKey: HP_Max, default: 10, isPrimary: true }
  - { key: TempHP, label: Temporary Hit Points, default: 0 }

actorFields:
  - { key: level,            label: Level,              type: Number,          defaultValue: 1, min: 1, max: 20, category: General }
  - { key: class,            label: Class,              type: EntityReference, targetEntityType: class,      category: General }
  - { key: subclass,         label: Subclass,           type: EntityReference, targetEntityType: subclass,   category: General }
  - { key: species,          label: Species,            type: EntityReference, targetEntityType: species,    category: General }
  - { key: background,       label: Background,         type: EntityReference, targetEntityType: background, category: General }
  - key: alignment
    label: Alignment
    type: Dropdown
    category: General
    options: [Lawful Good, Neutral Good, Chaotic Good, Lawful Neutral, Neutral, Chaotic Neutral, Lawful Evil, Neutral Evil, Chaotic Evil, Unaligned]
  - { key: originFeat,       label: Origin Feat,        type: EntityReference, targetEntityType: feat,       category: General, description: "Your background grants a specific origin feat." }
  - { key: armorClass,       label: Armor Class,        type: Number,  defaultValue: 10, category: Combat }
  - { key: armorClassMisc,   label: Other Armor Class Bonuses, type: Number, defaultValue: 0, category: Combat, description: "Magic or spell effects that are not an item you carry." }
  - { key: speed,            label: Speed (feet),       type: Number,  defaultValue: 30, category: Combat, description: "Copied from your species when you choose it; change it here for features that alter it." }
  - { key: size,             label: Size,               type: Dropdown, category: Combat, options: [Tiny, Small, Medium, Large, Huge, Gargantuan] }
  - { key: darkvision,       label: Darkvision (feet),  type: Number,  defaultValue: 0, category: Combat, description: "Copied from your species when you choose it." }
  - { key: notes,            label: Notes,              type: LongText, category: Notes }

conditions:
  [Blinded, Charmed, Deafened, Exhaustion, Frightened, Grappled, Incapacitated, Invisible,
   Paralyzed, Petrified, Poisoned, Prone, Restrained, Stunned, Unconscious]

# Character-sheet rules. Every rule here is data: a homebrew system can drop, relax or replace any
# of them, and a campaign can downgrade "strict" to "warn" or "off" under Settings > House rules.
sheetRules:
  enforcement: strict
  attributes:
    # Players choose point buy or the standard array (the SRD's "random generation" is the DM
    # entering rolled scores by hand: the DM always has the manual method).
    methods: [point-buy, standard-array]
    default: point-buy
    max: 20
    pointBuy: { budget: 27, min: 8, max: 15, costs: { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 } }
    standardArray: [15, 14, 13, 12, 10, 8]
    bonuses:
      label: Background bonuses
      fromField: background
      property: abilityScores
      allocations: [[2, 1], [1, 1, 1]]
    # Feats that raise scores (Ability Score Improvement, Grappler, the epic boons) say how in their
    # own data: abilityIncrease points, abilityIncreaseOptions (none listed: any score) and a cap.
    increases:
      label: Ability score increases
      fromList: feats
      property: abilityIncrease
      optionsProperty: abilityIncreaseOptions
      capProperty: abilityIncreaseCap
  derived:
    - { key: proficiencyBonus, label: Proficiency Bonus, formula: "2 + (level - 1) / 4", category: Combat }
    - { key: initiative,       label: Initiative,        formula: "mod(dex)",             category: Combat }
  constraints:
    - field: subclass
      where:
        - { property: class, equalsField: class, message: "that subclass belongs to another class." }
    - field: originFeat
      where:
        - { property: category, equals: origin, message: "only an origin feat can go here." }
        - { property: id, equalsPropertyOfField: { field: background, property: feat }, message: "your background grants a different origin feat." }
  lists:
    - key: cantrips
      label: Cantrips
      description: Cantrips known. Only your class's cantrips, up to the number in your class table.
      targetEntityType: spell
      category: Spellcasting
      where:
        - { property: level, equals: 0, message: "that is not a cantrip." }
        - { property: classes, containsNameOfField: class, message: "not on your class's spell list." }
      maxCount: { lookup: { field: class, table: spellcasting, byField: classLevel, column: cantrips } }
    - key: spells
      label: Prepared spells
      description: Spells of level 1 and up. Only your class's list, no higher than your highest spell slot, up to your prepared-spells count.
      targetEntityType: spell
      category: Spellcasting
      where:
        - { property: level, gte: 1, message: "cantrips go in the cantrips list." }
        - { property: classes, containsNameOfField: class, message: "not on your class's spell list." }
        - { property: level, lteLookup: { field: class, table: spellcasting, byField: classLevel, column: maxSpellLevel }, message: "above the highest spell level you can cast." }
      maxCount: { lookup: { field: class, table: spellcasting, byField: classLevel, column: preparedSpells } }
    # Spells a feature hands you outside your class list: a subclass's always-prepared spells, Magic
    # Initiate, a species' lineage spells, Blessed Warrior, Mystic Arcanum. They are not prepared, so
    # they take no class limit; the DM checks where each one came from.
    - key: grantedSpells
      label: Granted spells
      description: Spells a feature gives you outside your class's list (subclass spells, Magic Initiate, species lineage, Mystic Arcanum). They don't count against your prepared spells.
      targetEntityType: spell
      category: Spellcasting
    - key: feats
      label: Feats
      description: General and epic-boon feats gained from class features. Origin feats come from your background; fighting styles have their own list.
      targetEntityType: feat
      category: Feats
      where:
        - { property: category, in: [general, epic-boon], message: "origin feats come from your background and fighting styles have their own list." }
        - { property: minLevel, lteField: level, message: "you are not high enough level for it." }
      maxCount: { lookup: { field: class, table: featSlots, byField: classLevel, column: slots } }
      repeatableProperty: repeatable
    - key: fightingStyles
      label: Fighting styles
      description: Fighting-style feats from class features such as the Fighter's Fighting Style, and a Champion's Additional Fighting Style.
      targetEntityType: feat
      category: Feats
      where:
        - { property: category, equals: fighting-style, message: "that is not a fighting style." }
      maxCount:
        lookup: { field: class, table: featSlots, byField: classLevel, column: styles }
        also: [{ field: subclass, table: featSlots, byField: classLevel, column: styles }]
    - key: extraOriginFeats
      label: Extra origin feats
      description: An origin feat beyond your background's, such as the one a Human's Versatile trait gives.
      targetEntityType: feat
      category: Feats
      where:
        - { property: category, equals: origin, message: "only an origin feat can go here." }
      maxCount: { fromField: { field: species, property: extraOriginFeats } }

  # Hit points and armor class follow the rules while a sheet's hpMode / acMode allow it (new characters
  # do; imported creatures and older sheets keep the numbers typed in). Hit points: the first level takes
  # the class's full hit die, later levels its average (or a roll), each plus the Constitution modifier.
  hitPoints:
    key: HP_Max
    currentKey: HP
    attribute: con
    dieProperty: hitDie
    modes: [average, rolled, manual]
    default: average
    perLevelBonus: { field: species, property: hitPointsPerLevel }

  # Choosing a species copies its speed, size and Darkvision onto the sheet once; later edits stay.
  inherits:
    - field: species
      appliedKey: speciesApplied
      copy: { speed: speed, size: size, darkvision: darkvision }

  # Saving throws follow the first class, skills your picks plus the background's. Expertise is a second
  # tick on a skill you are proficient in.
  skills:
    label: Skills
    bonusKey: proficiencyBonus
    list:
      - { key: acrobatics,      label: Acrobatics,      attribute: dex }
      - { key: animal-handling, label: Animal Handling, attribute: wis }
      - { key: arcana,          label: Arcana,          attribute: int }
      - { key: athletics,       label: Athletics,       attribute: str }
      - { key: deception,       label: Deception,       attribute: cha }
      - { key: history,         label: History,         attribute: int }
      - { key: insight,         label: Insight,         attribute: wis }
      - { key: intimidation,    label: Intimidation,    attribute: cha }
      - { key: investigation,   label: Investigation,   attribute: int }
      - { key: medicine,        label: Medicine,        attribute: wis }
      - { key: nature,          label: Nature,          attribute: int }
      - { key: perception,      label: Perception,      attribute: wis }
      - { key: performance,     label: Performance,     attribute: cha }
      - { key: persuasion,      label: Persuasion,      attribute: cha }
      - { key: religion,        label: Religion,        attribute: int }
      - { key: sleight-of-hand, label: Sleight of Hand, attribute: dex }
      - { key: stealth,         label: Stealth,         attribute: dex }
      - { key: survival,        label: Survival,        attribute: wis }
    passives:
      - { key: passivePerception,    label: Passive Perception,    skill: perception }
      - { key: passiveInsight,       label: Passive Insight,       skill: insight }
      - { key: passiveInvestigation, label: Passive Investigation, skill: investigation }

  spellcasting:
    bonusKey: proficiencyBonus
    saveBase: 8

  # Warnings, not rules: a feat or feature may grant training the class lacks.
  proficiencies:
    armorTraining: { light: Light Armor, medium: Medium Armor, heavy: Heavy Armor, shield: Shields }

  # Armor class: body armor's base plus Dexterity (to its cap), or the best unarmored formula (the class
  # may bring its own); then shields, magic items and fighting styles add their bonuses.
  armorClass:
    key: armorClass
    unarmored: "10 + mod(dex)"
    bonusLists: [feats, fightingStyles]

  inventory:
    key: inventory
    label: Equipment
    types: [equipment, magic-item]

  # Multiclassing: "class" is the first class, the others are listed with their levels, and "level"
  # stays the character level (proficiency bonus, feat minimums). Lookups above read each class's
  # own row through classLevel; lists accept an entry any one class allows and add the limits up.
  multiclass:
    key: multiclass
    label: Additional classes
    classField: class
    levelField: level
    classLevelKey: classLevel
    prerequisitesProperty: multiclassPrerequisites
    requireForFirstClass: true
    subclassField: subclass
    subclassLevel: 3

  # Slots are tracked during play as resources (slots_1 / slots_1_Max ...), spent at the table and
  # refilled by rests. One spellcasting class uses its own table; several combine into the
  # multiclass spellcaster table: all levels in full casters plus half (rounded up) in half casters.
  slotPools:
    - key: slots
      label: Spell slots
      field: class
      byField: classLevel
      table: spellcasting
      column: slots
      casterTypeProperty: casterType
      excludeCasterTypes: [pact, none]
      recoversOn: [Long Rest]
      combine:
        weights: { full: 1, half: 0.5 }
        rounding: up
        table: ["2", "3", "4/2", "4/3", "4/3/2", "4/3/3", "4/3/3/1", "4/3/3/2", "4/3/3/3/1", "4/3/3/3/2",
                "4/3/3/3/2/1", "4/3/3/3/2/1", "4/3/3/3/2/1/1", "4/3/3/3/2/1/1", "4/3/3/3/2/1/1/1", "4/3/3/3/2/1/1/1",
                "4/3/3/3/2/1/1/1/1", "4/3/3/3/3/1/1/1/1", "4/3/3/3/3/2/1/1/1", "4/3/3/3/3/2/2/1/1"]
    - key: pact
      label: Pact slots
      field: class
      byField: classLevel
      table: spellcasting
      column: slots
      slotLevelColumn: maxSpellLevel
      casterTypeProperty: casterType
      includeCasterTypes: [pact]
      recoversOn: [Short Rest, Long Rest]

dice:
  initiative: 1d20
  check: 1d20
  initiativeBonus: initiative      # the derived field added to the roll
  initiativeTieBreak: dex          # ties go to the higher score

# What the table does with hit points. Every part is optional data, so a homebrew system can drop
# death saves or add a rest of its own.
vitals:
  temporaryResource: TempHP
  down:
    condition: Unconscious          # a character at 0 hit points
    deadCondition: Dead
    stableCondition: Stable
    instantDeathAtMax: true         # damage left over at 0 that equals the maximum kills outright
    nonPlayersDieAtZero: true       # monsters and NPCs die at 0 unless the DM says otherwise
  deathSaves: { die: 1d20, successOn: 10, successesToStabilize: 3, failuresToDie: 3, criticalSuccess: 20, criticalFailure: 1 }
  damage:
    types: [acid, bludgeoning, cold, fire, force, lightning, necrotic, piercing, poison, psychic, radiant, slashing, thunder]
    resistancesField: resistances
    immunitiesField: immunities
    vulnerabilitiesField: vulnerabilities
  exhaustion: { key: Exhaustion, maxLevel: 6, condition: Exhaustion }
  hitDice: { key: HitDice, levelField: level, classField: class, dieProperty: hitDie, creatureDiceProperty: hitDice, attribute: con }
  rests:
    - { name: Short Rest, spendHitDice: true }
    - { name: Long Rest, restores: [HP], clears: [TempHP], hitDiceRegain: half, exhaustionDelta: -1 }

entityTypes:
  - type: class
    label: Class
    pluralLabel: Classes
    folder: classes
    icon: swords
    summaryFields: [hitDie, primaryAbility]
    fields:
      - { key: hitDie,              label: Hit Die,                 type: Text }
      - { key: primaryAbility,      label: Primary Ability,         type: Text }
      - { key: savingThrows,        label: Saving Throws,           type: TagList }
      - { key: armorProficiencies,  label: Armor Training,          type: TagList }
      - { key: weaponProficiencies, label: Weapon Proficiencies,    type: TagList }
      - { key: skillChoices,        label: Skill Proficiencies,     type: Text }
      - { key: startingEquipment,   label: Starting Equipment,      type: LongText }
      - { key: multiclassing,       label: Multiclassing,           type: LongText }
      - { key: unarmoredDefense,    label: Unarmored Defense,       type: Text, description: "Armor class formula used while wearing no armor, such as 10 + mod(dex) + mod(con)." }
      - { key: unarmoredDefenseShield, label: Unarmored Defense Allows a Shield, type: Boolean }
      - { key: multiclassPrerequisites, label: Multiclass Prerequisites, type: TagList, description: "Options like \"STR 13+\" or \"DEX 13+, WIS 13+\"; meeting any one is enough." }
      - { key: subclasses,          label: Subclasses,              type: TagList }
      - { key: casterType,          label: Spellcasting,            type: Text }
      - { key: spellcastingAbility, label: Spellcasting Ability,    type: Text, description: "The ability spell save DCs and attack bonuses use." }
      - { key: features,            label: Class Features,          type: Collection, description: "One row per feature: level, name, description." }
      - { key: spellcasting,        label: Spellcasting Table,      type: Collection, description: "One row per level: cantrips, preparedSpells, maxSpellLevel, slots." }
      - { key: featSlots,           label: Feat Slots,              type: Collection, description: "One row per level: slots (ability-score-improvement or boon feats) and styles (fighting styles) you have by then." }

  - type: subclass
    label: Subclass
    pluralLabel: Subclasses
    folder: subclasses
    icon: swords
    summaryFields: [class, summary]
    filterFields: [class]
    fields:
      - { key: class,    label: Class,    type: EntityReference, targetEntityType: class }
      - { key: summary,  label: Summary,  type: Text }
      - { key: features, label: Features, type: Collection }
      - { key: featSlots, label: Feat Slots, type: Collection, description: "Extra class-granted feats this subclass adds, by level (a Champion's second fighting style)." }

  - type: species
    label: Species
    pluralLabel: Species
    folder: species
    icon: users
    summaryFields: [size, speed]
    fields:
      - { key: creatureType, label: Creature Type, type: Text }
      - { key: size,         label: Size,          type: Text }
      - { key: speed,        label: Speed,         type: Number }
      - { key: darkvision,   label: Darkvision (feet), type: Number }
      - { key: hitPointsPerLevel, label: Hit Points per Level, type: Number, description: "Added to every level's hit points (Dwarven Toughness)." }
      - { key: extraOriginFeats, label: Extra Origin Feats, type: Number, description: "Origin feats beyond the background's (Human's Versatile)." }
      - { key: traits,       label: Traits,        type: Collection }
      - { key: lineages,     label: Lineages,      type: Collection }

  - type: background
    label: Background
    pluralLabel: Backgrounds
    folder: backgrounds
    icon: scroll
    summaryFields: [feat]
    fields:
      - { key: abilityScores,      label: Ability Scores,      type: TagList }
      - { key: feat,               label: Feat,                type: EntityReference, targetEntityType: feat }
      - { key: skillProficiencies, label: Skill Proficiencies, type: TagList }
      - { key: toolProficiency,    label: Tool Proficiency,    type: Text }
      - { key: equipment,          label: Equipment,           type: LongText }

  - type: feat
    label: Feat
    pluralLabel: Feats
    folder: feats
    icon: sparkles
    summaryFields: [category, prerequisites]
    filterFields: [category]
    fields:
      - { key: category,      label: Category,      type: Dropdown, options: [origin, general, fighting-style, epic-boon] }
      - { key: prerequisites, label: Prerequisites, type: Text }
      - { key: minLevel,      label: Minimum Level, type: Number }
      - { key: repeatable,    label: Repeatable,    type: Boolean }
      - { key: armorClassBonus,        label: Armor Class Bonus,      type: Number, description: "Added to armor class." }
      - { key: armorClassRequiresArmor, label: Bonus Needs Worn Armor, type: Boolean }
      - { key: abilityIncrease,        label: Ability Score Points,   type: Number,  description: "Points this feat adds to ability scores." }
      - { key: abilityIncreaseOptions, label: Abilities It Can Raise, type: TagList, description: "Leave empty for any ability." }
      - { key: abilityIncreaseCap,     label: Raises Scores Up To,    type: Number }

  - type: spell
    label: Spell
    pluralLabel: Spells
    folder: spells
    icon: flame
    summaryFields: [level, school]
    filterFields: [level, school, classes]
    fields:
      - { key: level,         label: Level,         type: Number }
      - key: school
        label: School
        type: Dropdown
        options: [Abjuration, Conjuration, Divination, Enchantment, Evocation, Illusion, Necromancy, Transmutation]
      - { key: castingTime,   label: Casting Time,  type: Text }
      - { key: range,         label: Range,         type: Text }
      - { key: components,    label: Components,    type: TagList }
      - { key: material,      label: Material,      type: Text }
      - { key: duration,      label: Duration,      type: Text }
      - { key: concentration, label: Concentration, type: Boolean }
      - { key: ritual,        label: Ritual,        type: Boolean }
      - { key: classes,       label: Classes,       type: TagList }
      - { key: damageType,    label: Damage Type,   type: Text }
      - { key: higherLevel,   label: Using a Higher-Level Spell Slot, type: LongText }

  - type: monster
    label: Creature
    pluralLabel: Creatures
    folder: monsters
    icon: skull
    actorBlueprint: true
    hitPointsProperty: hitPoints
    attributeProperties: { strength: str, dexterity: dex, constitution: con, intelligence: int, wisdom: wis, charisma: cha }
    summaryFields: [challengeRating, creatureType, size]
    filterFields: [challengeRating, creatureType, size]
    playerFacing: false
    fields:
      - { key: size,            label: Size,             type: Text, category: Profile }
      - { key: creatureType,    label: Type,             type: Text, category: Profile }
      - { key: alignment,       label: Alignment,        type: Text, category: Profile }
      - { key: armorClass,      label: Armor Class,      type: Number, category: Defenses }
      - { key: hitPoints,       label: Hit Points,       type: Number, category: Defenses }
      - { key: hitDice,         label: Hit Dice,         type: Text, category: Defenses }
      - { key: speed,           label: Speed,            type: Text, category: Defenses }
      - { key: strength,        label: Strength,         type: Number, category: Ability scores }
      - { key: dexterity,       label: Dexterity,        type: Number, category: Ability scores }
      - { key: constitution,    label: Constitution,     type: Number, category: Ability scores }
      - { key: intelligence,    label: Intelligence,     type: Number, category: Ability scores }
      - { key: wisdom,          label: Wisdom,           type: Number, category: Ability scores }
      - { key: charisma,        label: Charisma,         type: Number, category: Ability scores }
      - { key: challengeRating, label: Challenge Rating, type: Text, category: Profile }
      - { key: xp,              label: XP,               type: Number, category: Profile }
      - { key: senses,          label: Senses,           type: Text, category: Senses and skills }
      - { key: languages,       label: Languages,        type: Text, category: Senses and skills }
      - { key: skills,          label: Skills,           type: Text, category: Senses and skills }
      - { key: savingThrows,    label: Saving Throws,    type: Text, category: Defenses }
      - { key: resistances,     label: Resistances,      type: TagList, category: Defenses }
      - { key: immunities,      label: Immunities,       type: TagList, category: Defenses }
      - { key: vulnerabilities, label: Vulnerabilities,  type: TagList, category: Defenses }
      - { key: gear,            label: Gear,             type: Text, category: Senses and skills }
      - { key: traits,          label: Traits,           type: Collection, category: Traits and actions }
      - { key: actions,         label: Actions,          type: Collection, category: Traits and actions }
      - { key: bonusActions,    label: Bonus Actions,    type: Collection, category: Traits and actions }
      - { key: reactions,       label: Reactions,        type: Collection, category: Traits and actions }
      - { key: legendaryActions, label: Legendary Actions, type: Collection, category: Traits and actions }

  - type: condition
    label: Condition
    pluralLabel: Conditions
    folder: conditions
    icon: skull
    fields: []

  - type: equipment
    label: Equipment
    pluralLabel: Equipment
    folder: equipment
    icon: layers
    summaryFields: [category, cost]
    filterFields: [category]
    fields:
      - { key: category,   label: Category,       type: Text }
      - { key: cost,       label: Cost,           type: Text }
      - { key: weight,     label: Weight (lb),    type: Number }
      - { key: damage,     label: Damage,         type: Text }
      - { key: properties, label: Properties,     type: TagList }
      - { key: mastery,    label: Weapon Mastery, type: Text }
      - { key: armorClass, label: Armor Class,    type: Text }
      - { key: armorType,  label: Armor Type,     type: Dropdown, options: [light, medium, heavy, shield] }
      - { key: armorBase,  label: Armor Base AC,  type: Number, description: "Armor class while wearing it, before Dexterity." }
      - { key: armorDexCap, label: Dexterity Cap, type: Number, description: "Most Dexterity bonus it allows. 0: none. Empty: no limit." }
      - { key: armorClassBonus, label: Armor Class Bonus, type: Number, description: "Added to armor class while equipped (a shield, a magic item)." }
      - { key: strength,   label: Strength Minimum, type: Number }
      - { key: stealth,    label: Stealth Disadvantage, type: Boolean }

  - type: magic-item
    label: Magic Item
    pluralLabel: Magic Items
    folder: magic-items
    icon: gem
    summaryFields: [rarity, category]
    filterFields: [rarity, category]
    fields:
