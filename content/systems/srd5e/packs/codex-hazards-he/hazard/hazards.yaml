- id: homebrew-cursed-doorway
  name: 'פתח מקולל'
  description: 'קשת אבן מגולפת בדוגמה של עיניים. היא מזמזמת חרישית, וכל מי שעובר דרכה בלי לומר את המילה הנכונה מרגיש שמישהו צופה בו מהצד השני.'
  properties:
    trigger: 'יצור עובר דרך הקשת בלי לומר בקול את המילה שלה.'
    duration: 'מיידי'
    detect:
    - id: arch
      name: 'הדוגמה'
      action: 'עיון'
      check: Arcana
      dc: 15
      text: 'בחינת הקשת חושפת את הקללה בגילוף.'
    disarm:
    - id: unravel
      name: 'פירוק הקללה'
      action: 'פעולה'
      check: Arcana
      dc: 17
      after: arch
    effect: 'היצור מטיל זריקת הצלה. בכישלון הוא סופג את הנזק ונשאר מבוהל מהקשת עד השחר הבא; בהצלחה הוא סופג חצי נזק ואינו מבוהל.'
    reset: 'הקללה מופעלת מחדש עם השחר הבא.'
    methods:
    - name: 'אמירת המילה'
      check: History
      dc: 15
      text: 'מי שחקר את בוני הקשת יכול להסיק את המילה, או למצוא אותה במקום אחר בחורבה. אז הקשת אינה מזיקה.'
    - name: 'ביטול הקסם'
      check: Spellcasting
      dc: 17
      text: 'לחש שמסיים קסם, שמוטל על הקשת, מסיים את הקללה לצמיתות.'

- id: homebrew-flooding-room
  name: 'חדר מוצף'
  description: 'חדר עם דלת אחת הנעולה מבחוץ, ורצפה של סורגי ברזל. ברגע שהדלת נסגרת, מים מתחילים לזרום פנימה מהקירות.'
  properties:
    trigger: 'הדלת נסגרת, בגלל משקל על לוח הרצפה או בגלל מנוף בצד השני.'
    duration: 'עד שהחדר מתמלא או שהתעלות נחסמות'
    detect:
    - id: plate
      name: 'לוח הרצפה'
      action: 'עיון'
      check: Investigation
      dc: 15
      text: 'בחינת החדר חושפת את הלוח, את המנוף ואת התעלות.'
    disarm:
    - id: jam
      name: 'חסימת הלוח'
      action: 'פעולה'
      check: Thieves' Tools
      dc: 15
      after: plate
    effect: 'שטף המים הראשון מפיל יצורים. כל יצור בחדר מטיל זריקת הצלה, וסופג את הנזק בכישלון וחצי ממנו בהצלחה. אחר כך החדר פועל בתור משלו (ראו את סדר הפעולות) עד שהוא מתמלא או שהתעלות נחסמות.'
    reset: 'המים מתנקזים דרך הסורגים בתוך שעה, והדלת עולה שוב. מנוף בחוץ מפעיל את המלכודת מחדש.'
    routine:
    - name: 'המים עולים'
      description: 'המים עולים ברגל אחת. בגובה החזה התנועה עולה כפליים. כשהמים מעל ראשו של יצור, הוא שוחה או נחנק לפי הכללים הרגילים.'
    - name: 'גל'
      description: 'כל סבב שלישי גל דוחף את כל מה שבחדר אל הקירות. כל יצור מטיל שוב זריקת הצלה, וסופג חצי מהנזק בכישלון ושום נזק בהצלחה.'
    methods:
    - name: 'חסימת התעלות'
      check: Thieves' Tools
      dc: 15
      text: 'להגיע לתעלה מתחת למים לוקח פעולה אחת ובדיקה אחת. כל תעלה חסומה, מתוך ארבע, עוצרת חמישית מהמים.'
    - name: 'פריצת הדלת'
      check: Strength
      dc: 20
      text: 'הדלת עשויה ברזל וכבדה. כמה יצורים יכולים לעזור, בדיקה אחת לכל אחד.'
