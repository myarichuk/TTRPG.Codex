- id: wall-of-force
  flavor: >-
    Hedge-wizards call it a window that forgot to be glass. Nothing walks through it, not dust, not doubt, and not the cat that tried once and was politely refused. Clever casters hang it in the air like a shelf for ideas that refuse to move.
- id: wall-of-ice
  flavor: >-
    Frost-sorcerers like to brag that their walls can out-argue a fire. The ice stings like a dare, and what is left behind after a breach is a sheet of air so frigid it bites the lungs of anyone who stumbles through.
- id: wall-of-stone
  flavor: >-
    Quarry-folk swear this is just rock that learned to obey a voice. It bridges gorges, builds ramps where none belong, and stays put for as long as the caster keeps a steady mind, which is more loyalty than most mountains show.
- id: wall-of-thorns
  flavor: >-
    Gardeners of the wild places grow this sort of hedge when they are cross with the world. It is all tangled brush and needle-sharp spikes, a thicket that does not care who it scratches, and it hides whatever lies behind a curtain of green.
- id: warding-bond
  flavor: >-
    The rings are cheap enough to pawn and costly enough to make the pawnbroker nervous. Two willing wearers become a single cautious unit, joined by a thread that tugs whenever one of them takes a blow and does not break easily.
- id: water-breathing
  flavor: >-
    Reed-cutters have long known that a short hollow stem lets a person breathe below the waves. Fishfolk find the trick a little insulting, since they never needed reeds, but they accept a loan of the stalk for the occasional dinner party.
- id: water-walk
  flavor: >-
    A bit of cork turns almost any surface into a floor. Mud, slush, sand that drinks boots, even molten rock can be crossed as if it were a dance floor. The trick lies in knowing when to sink, because the lake remembers every mistake.
- id: web
  flavor: >-
    Spinners in the old colleges lecture on this while picking silk from their sleeves. A sticky mass of webbing fills a stretch of hallway and holds whoever blunders in, though it goes up in a sulphurous flash if anyone brings a torch.
- id: weird
  flavor: >-
    The illusion is simple: it shows each person the thing they fear most, then lets their own imagination do the rest. Those who fail become frightened, and their nightmares grow a little worse with each new look, until someone wakes them in earnest.
- id: wind-walk
  flavor: >-
    Cloud-herders have a saying that the sky is only the earth turned upside down. Their method needs a candle, plenty of patience, and a willingness to become a wisp of vapor, drifting above the treetops and looking down on the bickering villages.
- id: wind-wall
  flavor: >-
    A wall of wind stands up out of the grass like an impatient doorman. It bats fog away, sends loose papers spiraling skyward, and bounces arrows off course, though the boulders of giants stroll right through as if embarrassed for everyone.
- id: wish
  flavor: >-
    Every scholar warns that the mightiest words a mortal can speak are the ones that cost the most to say. Said lightly, they may bend reality exactly as hoped, or they may shrug, twist the phrasing into a joke, and send the bill to the speaker.
- id: word-of-recall
  flavor: >-
    Priests of a certain stripe keep one favorite door in their temple and nowhere else. A caster with friends close at hand is pulled home to that sanctified spot, though an unprepared caster finds only silence and a puzzled sexton.
- id: zone-of-truth
  flavor: >-
    Some courts hang a circle of silence in the great hall and call it a courtesy. Those who step inside find their tongues reluctant to shape a deliberate lie, though the clever ones learn to dodge questions with graceful evasions that still tell no falsehood.
