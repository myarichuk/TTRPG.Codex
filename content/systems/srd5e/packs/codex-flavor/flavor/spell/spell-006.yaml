- id: fireball
  flavor: >-
    A bead of orange light drifts from a caster's fingertip and blooms into a roar when it meets a crowd that should have stayed further away. The old colleges call it the honest spell, since no one needs a second explanation. Smoke rolls off the scorched stones long after the cheering stops.
- id: flame-blade
  flavor: >-
    A slender length of fire grows out of a plain stick in a caster's hand, humming like a kettle that has opinions. It is a tidy trick for a traveler who would rather not carry a torch. The blade never warms the glove that holds it, which the river-folk find suspicious.
- id: flame-strike
  flavor: >-
    A column of heat drops out of a clear sky onto whoever has been loitering in the wrong courtyard. Some hedge-wizards insist it is a sermon in fire, though the scorched cobbles suggest a more practical argument. Anyone standing nearby learns to look up before accepting any invitation.
- id: flaming-sphere
  flavor: >-
    A ball of banked red coal rolls along after its maker like a dog that has learned to sulk. It bumps into furniture with an apologetic crackle and gives off just enough heat to make the cook nervous. Few household pets are as hard to ignore.
- id: flesh-to-stone
  flavor: >-
    A slow grey tide creeps through a stubborn body, turning skin and bone into the sort of stone that garden statues are made from. Old sculptors whisper that the craft is cruel and lovely. The victim keeps every expression they had, which is either a mercy or an insult.
- id: floating-disk
  flavor: >-
    A flat plate of shimmering force hovers at waist height, obediently carrying whatever has been stacked on it. Quartermasters of the old caravans considered it the finest servant ever invented, mostly because it never complained about the weight. It is a thoroughly dull marvel, and that is exactly the point.
- id: fly
  flavor: >-
    A sudden lightness lifts the caster off the floor and sets them drifting like a leaf on a warm breeze. Hedge-wizards describe the feeling as being briefly forgiven by gravity. Most who try it discover that the sky is roomier than the maps suggested.
- id: fog-cloud
  flavor: >-
    A pale bank of mist rolls out of nowhere and swallows the nearby hedges, lanterns and any good intentions. Smugglers of the coast swear by it, since a fog that thick makes every stranger look like a friend or a rival, and rarely both. Visibility becomes a rumor, and footsteps become suggestions.
- id: forbiddance
  flavor: >-
    A ward of quiet pressure settles over a doorway, and it does not care who wants through. Ward-makers of the old colleges insist the trick lies in choosing the boundary with care. Anyone who ignores the warning tends to regret it on the stairs.
- id: forcecage
  flavor: >-
    A box of invisible force closes about a creature with the neatness of a well-made drawer. Its walls are clear and hard, so the captive and the world can watch each other, a cruel sort of courtesy. Jailers who value both security and conversation tend to favor it.
- id: foresight
  flavor: >-
    A thin thread of knowing settles over a person and whispers little warnings about the next few moments. Diviners of the old colleges describe it as hearing the house settle before the roof falls in. Those who rely on it too much tend to become very good at waiting.
- id: freedom-of-movement
  flavor: >-
    A loose ribbon of warm protection wraps the limbs and lets stiff joints move as though the world had been oiled. Escape artists and tavern dancers both swear by it, and old chains tend to sulk in corners. Nothing about the feeling is dramatic, which is precisely why it is so reassuring.
- id: freezing-sphere
  flavor: >-
    Cold gathers in a caster's palm until it is dense with frost, then leaves the hand with a crack like a breaking pond. Winter-hedgers consider it a polite way to end an argument. The sphere then shatters in a burst of glittering shards.
- id: gaseous-form
  flavor: >-
    The body loosens its grip on itself and drifts like smoke, slipping through gaps no sensible door would allow. Scholars of the mist-trades describe the sensation as a rumor that happens to have arms. Returning to solid form is the part everyone remembers most vividly.
- id: gate
  flavor: >-
    A tall doorway of silver light opens in mid-air, and through it one can glimpse a distant hall where the air smells of rain. Travel-minded scholars of the old colleges treat the threshold with great respect, because the other side has its own opinions about visitors.
- id: geas
  flavor: >-
    A compelling promise, half oath and half headache, binds a stubborn mind to a single errand. Old ledgers from the courts describe it as the most sensible way to ruin a holiday. The mind grumbles, the body marches, and the errand gets done.
- id: gentle-repose
  flavor: >-
    A calm hush settles over a body that has been waiting for burial, keeping it fresh and quiet until the right day comes. River-folk undertakers say little about it in front of families. It is a kindness with a clock inside it.
- id: giant-insect
  flavor: >-
    A chitinous shape crawls out of the soil at the caster's bidding, all mandibles and clicking patience. Stable-keepers tell tales of its use, though they tend to avoid saying what happened to the tax collector. Whoever commands one learns that bugs make a surprisingly loyal workforce.
- id: glibness
  flavor: >-
    A smooth, warm confidence settles over the tongue, making every word sound better than it has any right to. Traveling salesmen of the old roads would have paid well for it. The effect fades quickly, leaving only a faint taste of honey and doubt.
- id: globe-of-invulnerability
  flavor: >-
    A shimmering dome of pale light wraps a small area and turns away the lesser magics that dare to touch it. Engineers of wary cities treat it as a portable hall of shields and sell fakes to the impatient. The calm inside it is oddly contagious.
- id: glyph-of-warding
  flavor: >-
    A faint sigil is etched into stone or metal, quiet as a sleeping cat until someone disturbs it. Locksmiths and archivists speak of it with the sort of respect usually reserved for bad tempers. The reaction, when it comes, is loud, bright and never subtle.
- id: goodberry
  flavor: >-
    A handful of plump berries appears in a caster's hand, cool and sweet, as if the hedgerow had been waiting. Foragers of the hill-towns say a single one can feed a tired walker, though they still prefer bread. It tastes faintly of summer, which is an odd thing to carry in winter.
- id: grease
  flavor: >-
    A slick film spreads across a patch of floor or a ladder rung, quietly making every step a small negotiation. Innkeepers of the old roads have strong opinions about its use in their stairwells. Anyone who slips on it tends to remember the lesson longer than the bruise.
- id: greater-invisibility
  flavor: >-
    A figure fades from sight by degrees, leaving only a faint outline that the eye keeps wanting to correct. Thieves' guilds of the old cities consider it a professional courtesy, and innkeepers consider it an insult to the bill. Even ordinary chores, such as pouring tea, do nothing to break the spell.
- id: greater-restoration
  flavor: >-
    A gentle warmth moves through a weary body and clears away the lingering marks of old misfortune. Healers from many traditions say it resembles spring cleaning for the soul, though they admit the soul is much harder to dust. The relief is quiet, thorough and entirely earned.
