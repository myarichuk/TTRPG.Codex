- id: aboleth
  flavor: >-
    משהו עצום מחכה במימיהם השחורים של בורות מים שקועים, יצור שחושב בזרמים איטיים וסבלניים. תודעתו נשלחת החוצה בלי קול, ומי שהיא נוגעת בהם מגלים שזיכרונותיהם נקראים בשקט כמו פנקס חשבונות. חוקית כמו גאות ושפל, היא שומרת את משרתיה קרוב ואינה שוכחת דבר ששווה לקחת.
- id: adult-black-dragon
  flavor: >-
    הדרקון השחור תובע לעצמו ביצות וחורבות שקועות, שם האוויר מסריח מרקב ומים עומדים. קשקשיו שותים את האור, ונשיפתו ענן מסתובב שאוכל ארד ועצם כאחד. הוא אכזרי בלי טקסים, מסוג העריצים שרואים בכפרי הביצה לא יותר מפנקסי מעשרות.
- id: adult-blue-dragon
  flavor: >-
    הדרקונים הכחולים שולטים בעמקים היבשים שבהם סערות מתכנסות בלי גשם. הבוגר מבני מינו הוא קושר מזימות סבלני, שחופר מתחת לדיונות כדי לצפות בשיירות ולקחת את מה שהוא רואה כמגיע לו. כשהוא סוף סוף עולה, השמיים מרעישים והדיונות נוצצות בזכוכית מותכת.
- id: adult-brass-dragon
  flavor: >-
    הדרקונים מן הפליז הם הפטפטנים של השממות החרוכות בשמש, והם מאושרים ביותר כשמישהו מקשיב להם מספרים סיפור. הבוגר נהנה מחידות, משירים עתיקים ומשמועות חמימות של פייטנים נודדים. כעסו מהיר ובוהק כמו גפרור שנדלק, והוא דועך מהר כמו שהתלקח.
- id: adult-bronze-dragon
  flavor: >-
    הדרקונים מן הארד שומרים על קווי חוף ועל שפכי נהרות, ומסיירים לאורך החוף כאילו הים עצמו שכר אותם. הבוגר יציב והוגן, מסוג אלה שיקשיבו לתלונת דייג לפני שיחליטו משהו. שאגתו מתגלגלת מעל המים כמו רעם, ומי שמתנהג לא יפה בגאות לומד לשתוק.
- id: adult-copper-dragon
  flavor: >-
    הדרקונים מן הנחושת הם שובבות שצמחו לה כנפיים, והבוגר לוקח את הבדיחות שלו ברצינות. הוא מתיישב על צוקים ועל מחשופי סלע, ומדגר תוכניות לסדר מחדש את הריהוט של אדונים יריבים או להחביא את הפרה היקרה של העיירה במערה. צחוקו גבוה ושמח, ואף פעם לא ברור אם המתיחות שלו יסתיימו בסעודה או בהרס.
- id: adult-gold-dragon
  flavor: >-
    הדרקונים מן הזהב הם השומרים הגדולים והאיטיים בדיבורם של ממלכות עתיקות, והבוגר נושא את הכבוד הזה כמו גלימה מלכותית. הוא מסתכל על מלחמות ועל חתונות מרחוק, ומציע עצות שלפעמים אינן רצויות אבל אף פעם אינן קלות דעת. אשו גאות חמה וזהובה, והוא שומר אותה לאלה שמאיימים על הארץ.
- id: adult-green-dragon
  flavor: >-
    הדרקונים הירוקים אורבים ביערות עתיקים שבהם החופה מסתירה כל סוד. הבוגר הוא קושר מזימות שמעדיף עסקאות בלחש על מלחמה גלויה, וקולו מחליק אל מחשבותיו של המאזין כמו משב קר. נשיפתו ענן ירוק חונק, ואין דבר שהוא אוהב יותר מלראות יריבים משתעלים בדרכם להסכם שמיטיב עם הדרקון.
- id: adult-red-dragon
  flavor: >-
    הדרקונים האדומים מקננים בפסגות געשיות ובמערות עמוסות אוצרות, שם חום האדמה תואם את מזגם. הבוגר גאה ותאב בצע, מסוג העריצים שסופרים את מטבעותיהם פעמיים ואחר כך סופרים את מטבעות שכניהם. כשהוא עולה לשמיים, עשנו נשאר מעל העמק זמן רב אחרי שהלך.
- id: adult-silver-dragon
  flavor: >-
    הדרקונים מן הכסף הם הנוודים של מעברי ההרים הגבוהים, ואוספים סיפורים כמו שאחרים אוספים מטבעות. הבוגר נהנה מחידות על הגורל, ולעתים קרובות מופיע בקצה מחנה כדי לשאול שאלות שמובילות את המטיילים למקום מועיל. כפרו קור חד ובהיר, והוא שונא לראות הבטחה שנשברה יותר משהוא שונא כל להב.
