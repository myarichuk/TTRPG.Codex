- id: gray-ooze
  flavor: >-
    רפשים אפורים מחליקים דרך סדקים במרתפים ובביבים ישנים, ומשאירים אחריהם קרום חיוור בכל מקום שעברו בו. הם ממיסים אבזמים, להבים ומגפיים באותה אדישות סבלנית, ונדמה שאין להם שום דעה על אף אחד מהם. ציידים לומדים לשאת איתם אש ומקל עץ, ולהקשיב לקול היניקה הרטוב לפני שהרצפה זזה.
- id: green-dragon-wyrmling
  flavor: >-
    גור דרקון ירוק הוא יצור צעיר ורברבן, שמשוכנע שהקשקשים שלו הופכים אותו לחכם מכל יצור בכל ביצה. הוא שומר אוצר של מטבעות גנובים ליד נהר איטי, ומתמקח רק אחרי שכבר החליט לנצח. הנשיפה שלו מסריחה מריקבון ומעלים כתושים, והסוף שליד המאורה שלו תמיד מצהיב.
- id: green-hag
  flavor: >-
    מכשפות ירוקות מקימות את בריתותיהן בחלקי היער הרקובים, שם המים עומדים והציפורים הפסיקו לשיר. הן יודעות לחקות בכי של ילד או קול של שכן היטב מספיק כדי למשוך את הרשלנים אל הסוף. בני הכפר אומרים שמכשפה שהודו לה כראוי תחדל להטריד אותם, אף שמעולם לא מצאו מכשפה שאפשר לסמוך עליה שתגיד זאת.
- id: grick
  flavor: >-
    הגריק הוא יצור רזה בצבע אפור-חום שנצמד לקירות צוקים ונראה כמו גוש סלע רטוב עד שהוא זז. המקור הקמור שלו מהיר, אבל הוא מעדיף להמתין בסדק ולתת למחושים להחליט. מטיילים שעוברים מתחת לגרם בשתיקה הם לעיתים נדירות אלה שמספרים מה קרה אחר כך.
- id: griffon
  flavor: >-
    גריפונים מקננים על צוקים גבוהים שבהם הרוח חזקה מספיק כדי להסתיר את קריאותיהם. ראשיהם ורגלי החזית שלהם הם של ציפור גדולה, והם נושאים את טרפם אל הפסגות בגאווה כמו כל דגל. רועים ברחבי ארץ הגבעות מספרים לילדיהם שגריפון ייקח כבשה אם יוכל ורועה אם יצטרך.
- id: grimlock
  flavor: >-
    גרימלוקים הם ציידים חיוורים ועיוורים שחיים במערות זמן רב כל כך עד שהם כבר לא מתגעגעים לשמש. הם שומעים חלוק שנופל מקצה האולם, ומוצאים את טרפם לפי קול נשימתו. אלות העצם שלהם מגולפות ממה שהמערה זנחה, והם קוברים את מתיהם באותם מנהרות שבהן הם מגדלים את צעיריהם.
- id: guard
  flavor: >-
    שומרים הם אנשים רגילים שקיבלו חנית, מגן ולוח משמרות. רובם היו מעדיפים להיות בבית עם מגפיים מושלכות, והם אומרים זאת לכל מי ששואל יפה. נאמנותו של שומר נמשכת בדרך כלל אל האנשים ששילמו משכורת, אל בן הדוד בעמדה הסמוכה ואל ארוחת ערב חמה וטובה.
- id: guard-captain
  flavor: >-
    קפטן שומרים הוא מי שמחליט איזו מחומות העיר צריכה תיקון קודם ואיזה שער אפשר להשאיר בלי משמר לערב אחד. חרבות שכורות ומיליציה נשבעת כאחת עונות לשריקתו של קפטן, וקפטן טוב יכול לנקוב בשמה של כל משפחה ברשימת המשמרות. שריונו מצוחצח, רומחיו נספרים פעמיים בכל בוקר, ומזגו נשמר לעצמו.
- id: guardian-naga
  flavor: >-
    נאגות שומרות הן חכמות בעלות גוף נחש ששומרות על ספריות עתיקות ועל דלתות אטומות, ומדקלמות את השבועות שנשבעו מזמן. סבלנותן מפורסמת בקרב מי שלומדים איתן, וזעמן איטי אך יסודי. מלומדים שפגשו אחת מהן נוטים לדבר עליה בלחש, כאילו היא עדיין מקשיבה.
- id: half-dragon
  flavor: >-
    חצי-דרקון הוא מה שקורה כשקו דם של דרקון משוטט אל כפר ושומר משהו מאבי אבותיו, בדרך כלל ברק של קשקשים לאורך הזרועות ומזג כמו כבשן מכוסה. הם גאים בדם ונזהרים מלהישפט בגללו. רובם לומדים מוקדם שקל יותר ללבוש מורשת מאשר להסתיר אותה.
