- id: cockatrice
  flavor: >-
    הקוקטריס הוא יצור קטן ומנוצה, מוזרות קטנה עם כנפי עוף, טפרים של משהו עתיק בהרבה ומבט שעדיף לא לבחון. אנשי החווה שומרים מרחק זהיר מהקן שלו, ואומרים לילדים ללכת לאט ליד לול התרנגולות. למרות כל האיום, הוא יצור של הרגלים, שמסתפק בעיקר בנקירת גרגרים ובגערה בכל מי שמתקרב מדי.
- id: commoner
  flavor: >-
    אזרח פשוט הוא פשוט כל מי שעובד בשדות, מתקן את הרשתות או שומר על הלחם חם בתנור של הכפר. הם אלה שמכירים את הדרכים, את מזג האוויר ואת הרכילות לפני שהאדונים מכירים, ורק לעתים רחוקות הם עושים מזה עניין. רוב ההרפתקנים מתחילים את דרכם בהקשבה לאחד מהם, ורובם מסיימים בחרטה שלא הקשיבו יותר.
- id: constrictor-snake
  flavor: >-
    הנחש החונק הוא נחש כבד ושרירי של גדות נהרות וסלעים שהשמש חיממה, סבלני מספיק לחכות בוקר שלם עד שארוחה תתקרב אליו מעצמה. הוא צד בכך שהוא מתפתל סביב הטרף ומהדק, והוא שוחה בקלות כמו שהוא זוחל, ולכן כפרי דייגים עצבניים מסירות חתירה אחרי רדת החשכה. הסבלנות שלו אגדית, אבל תזמון טוב עוד יותר.
- id: copper-dragon-wyrmling
  flavor: >-
    גור דרקון הנחושת הוא דרקון קטן ושובב של גבעות ואפיקים יבשים, שלא מפסיק לבחון כל מה שהוא מצליח להגיע אליו. הוא אוהב חידות, מתיחות ואת הפרצוף של מטייל כשחידה נפתרה מהר מדי. מתחת להקנטות הוא נדיב למדי, ומוכן למסור מטבע או רמז לכל מי שמצליח להצחיק אותו.
- id: couatl
  flavor: >-
    הקואטל הוא נחש מנוצה של שמי המרומים, בוהק בצבעים וממולח במילים. מי שפוגש אחד מקבל לא פעם הרצאה עדינה על כנות, שנמסרת בחום רב יותר מזה שרוב האנשים מצליחים להפגין סביב שולחן ארוחת ערב. הוא מהיר לרפא פצועים ואיטי לסלוח על כל אכזריות שבוצעה לנגד עיניו, והנוצות שהוא משיר נראות זוהרות קלות לזמן מה.
- id: crab
  flavor: >-
    הסרטן קטן ועטוף בשריון של קונכייה שהמלח שייף, ומתרוצץ לאורך מישורי הגאות והשפל ושומר עין חדה על כל מה שמתעכב יותר מדי ליד המחילה שלו. דייגים בעיירות המים הרדודים למדו לבדוק ברשתות שלהם אם יש בהן צבתות צובטות, אף שרוב הסרטנים רוצים רק קטע שקט של חול רטוב. הוא נושם גם אוויר וגם מים, מה שהופך אותו לשכן עיקש לכל מי שמנסה לגרש אותו.
- id: crocodile
  flavor: >-
    צייד נהר ארוך ונמוך, ששוכב כל כך דומם ליד הגדה שאפשר לטעות בו לבול עץ שנפל, עד שמשהו רשלני מתקרב לקצה המים. הלסתות שלו כבדות מספיק כדי לגרור חיה בוגרת למטה ולהחזיק אותה שם, ובני הנהר למדו מזמן להרחיק את הכביסה ואת העזים שלהם מהקנים. סבלני וקר דם, הוא מאושר ביותר במקום שבו הבוץ חם והדגים בשפע.
- id: cultist
  flavor: >-
    חסידי הכת מהסוג הזה הם לרוב בעלי חנויות, פקידים או איכרים מקומיים, שזר בגלימה עם ברדס הבטיח להם משהו טוב יותר. הם לובשים עור פשוט ונושאים מגל לעתים קרובות יותר מחרב, ונוטים להיעלם מכיכר הכפר אחרי רדת החשכה. הדרשות שלהם קצרות, האמונה שלהם רועשת, והסכינים שלהם חדות יותר ממה שמישהו ציפה.
- id: cultist-fanatic
  flavor: >-
    פעם היה שומר מרתף שקט, אבל קנאי הכת הזה בער בהתמסרות כל כך עזה ששכניו חדלו לשאול למה בדיוק הוא מתמסר. הוא נושא להב שמזמזם קלות כשהוא מדבר על אדוניו, ויש לו הרגל לקרוא לטובות קטנות נסים. בין הכתות הקטנות שמתכנסות בקפלות נשכחות, הוא זה שלעולם לא ישן ולעולם לא מפקפק.
- id: darkmantle
  flavor: >-
    הדארקמנטל תלוי מתקרות מערות כמו פיסת בד רטוב מקופלת, וממתין עד שמשהו חם עובר מתחתיו. הוא נופל במשקל דביק פתאומי ועוטף את קורבנו בתכריך שחור כדיו, ומאותו רגע אפילו נושא הלפיד האמיץ ביותר מגלה שהאור לא מגיע רחוק. כורים במנהרות העמוקות אומרים שהוא פחות יצור ויותר כתם קדרות שבמקרה נע.
