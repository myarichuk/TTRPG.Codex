- id: ancient-red-dragon
  flavor: >-
    אפר שוכן על כל פסגה שהדרקון האדום הקדמון תבע לעצמו, והסלע שמתחתיו תמיד חמים. הוא שולט בפחד ובחנופה במידה שווה, ומצווה על יצורים קטנים ממנו בקול שגורם לברכיהם להתכופף לפני שהם מבינים מדוע. האש שלו היא אסון בקנה מידה עצום, והסיפורים הישנים על ערים בוערות נלחשים בפחד דווקא עליו.
- id: ancient-silver-dragon
  flavor: >-
    היסטוריונים של הפסגות הגבוהות מסרבים לא פעם לכתוב על הדרקון הכסוף הקדמון, כי הוא מתקן את דבריהם בדיוק מצמרר. הוא צפה בשושלות הצפון קוברות את מתיהן ובונות ערים חדשות מאותה אבן קפואה. הליכותיו אצילות וטובות, אך נשיפת הקור שהוא יכול לשחרר אכזרית דיה לעצור צבא באמצע צעד.
- id: ancient-white-dragon
  flavor: >-
    לקרח זיכרון ארוך, והדרקון הלבן הקדמון הקדיש את כל שלטונו ללמד אותו סבלנות חדשה. מאורתו תחת קרחון שנאנח ונסדק בכל פעם שהוא מתעורר, ואת הטונדרה המושלגת הוא רואה כשטח ציד שמעולם לא טרח לחלוק. נשיפת הקור שלו מקפיאה נהרות באמצע זרימתם, והמטיילים ששרדו את המעבר נשבעים שהקרח עצמו כאילו הקשיב.
- id: animated-armor
  flavor: >-
    שריון עומד בפינת אולם נשכח, פרקיו נוקשים ומצחיה ריקה מכל שכל שראוי להזכיר. מישהו קשר אותו פעם לחובה פשוטה, והקשר שרד את כמעט כל מי שזוכר את הפקודה. הוא נע בסבלנות כבדה ורועשת, וכפפות הברזל שלו מרוצות בהחלט לנופף בכל נשק שנמסר להן.
- id: animated-flying-sword
  flavor: >-
    להב חסר בעלים תלוי באוויר של נשקייה שקטה, מסתובב לאט כאילו הוא מחפש את היד שאחזה בו פעם. מי שהקסים אותו נתן לו תכלית אחת ואפס סבלנות לכל דבר מעבר לה. הוא ננעץ במסיגי גבול בשריקה דקה ונלהבת, ומשום מה הוא שמח כל פעם שהוא מוצא מטרה.
- id: animated-rug-of-smothering
  flavor: >-
    שטיח ארוג שאיזה בעל מלאכה משועמם תפר עם לב רעב ואז השאיר מוטל בחדר מדרגות. הציצית שלו מתפתלת כמו יד סבלנית, והוא נופל על כל מי שרשלן מספיק לדרוך על הדוגמה הצבעונית שלו. הקורבנות מתארים את החוויה כחמה, חשוכה ובלתי ידידותית בעליל.
- id: ankheg
  flavor: >-
    חקלאי השפלה מאשימים כל שדה שקרס ביצור שחופר מתחתיו. הוא לועס חרסית וסלע יסוד ומשאיר מעברים חלקים שנשארים פתוחים זמן רב אחרי שהיצור הלך. כשהוא פורץ מן האדמה, לסתותיו הנקשות אוחזות בטרף וירק החומצה שלו ממיס כל מה שאינו יכול לבלוע.
- id: ankylosaurus
  flavor: >-
    רועה רחב ושריוני שנע ביערות שרכים כמו עגלה משוריינת איטית. זנבו הכבד מסתיים בפקעת עצם שיכולה להעיף טורף דוהר הצידה. רוב המטיילים הנבונים נותנים לו מרווח רחב ומניחים לו לסיים ללעוס בשלווה.
- id: ape
  flavor: >-
    מטפס רחב כתפיים שחי בצמרות הג'ונגל ובמצוקים סלעיים. קופי האדם סקרנים כלפי זרים, ויצפו מן הענפים זמן רב לפני שיבחרו צד. כשהם חשים צפופים, הם מטיחים אבנים בכוונה מפתיעה, ומעט מטיילים שוכחים את הפגישה הראשונה.
- id: archelon
  flavor: >-
    צב ים עצום שהשריון שלו יכול היה לחסות כפר דייגים קטן. הוא ישן כשהוא נסחף בזרמים חמים, ועולה אל פני המים לעתים כה נדירות שמלחים מחליפים אותו בשונית. כשהוא רעב, הוא נוגס בלסת חזקה דיה לנפץ קורת עץ של ספינה.
