- id: druid
  flavor: >-
    הדרואידים שומרים על ההסכמים השקטים והעתיקים בין המקומות הפראיים לבין האנשים שחיים לידם, והם סבלניים בהרבה מהמתיישבים שהם מייעצים להם. דרואיד יכול לזמן סערה של קוצים או להעיר שתיל משנתו, ורובם מעדיפים לדבר על מחלוקת עד סופה מאשר להילחם בה. מי שחצה אותם לומד שהזיכרון של דרואיד לעלבון ארוך כמו זה של אלון ותיק.
- id: dryad
  flavor: >-
    דריאדה קשורה לעץ גדול אחד, ומצבי הרוח שלה עולים ויורדים עם בריאותו של היער שהיא שומרת עליו. יש לה קול שמסוגל להרגיע סייח מבוהל או לשכנע נוסע לשכוח את הדרך הביתה. חוטבי עצים שמכבדים את העצים הקדומים כמעט לא נפגעים, אבל מי שכורת חורשה לעצי הסקה שמע, כך אומרים, לחישה מן הקליפה שהלכה אחריו עד הבית.
- id: dust-mephit
  flavor: >-
    מפיטי האבק הם מקימי צרות קטנים בעלי כנפיים, שנולדו מחצץ של מקומות יבשים, ונראה שהם נהנים מכל פיסת צרה שהם מעוררים. הם מתעופפים בענני חול דק, מסנוורים כל מי שמתקרב מדי ומתעטשים בצווחה קטנה ושמחה. כשאחד מהם מושמד, הוא מתפוצץ בנשיפת אבק שמפזרת את כל מה שסביבו, וצחוקו של המפיט נשאר באוויר זמן רב אחרי שהלך.
- id: eagle
  flavor: >-
    עיטים רוכבים על האוויר החם מעל צוקים גבוהים ומביטים בעמקים בעיניים חדות מספיק כדי לזהות עכבר שדה מן השמיים. הם מגינים אכזריים על קניהם וצוללים על כל מה שמתקרב מדי, אבל רוב הזמן הם פשוט חגים וממתינים. רועים באזור ההרים מכבדים אותם, וכמה מהם שרים שירים עתיקים על העוף שהחזיר פעם ילד אבוד הביתה.
- id: earth-elemental
  flavor: >-
    יסודן אדמה הוא גוש כבד של סלע ואדמה דחוסה, שמתעורר כשמטרידים את הסלע העמוק. הוא נע לאט דרך האדמה המוצקה בלי להשאיר מנהרה מאחוריו, ואז מגיח ליד צוות כורים מופתע עם שני אגרופים כסלעים. חומות ושערים הם אויביו הטבעיים, וכורים ששומעים חריקה נמוכה מתחת לנעליהם יודעים לעזוב את המכרה מיד.
- id: efreeti
  flavor: >-
    האפריט הוא רוח גאה של להבות, שנוצרה בארצות כבשן שבהן השמיים נשארים אדומים בלי להתקרר לעולם. מזגו לוהט כעורו, והוא לוקח עלבון לשושלתו ברצינות רבה יותר משהוא לוקח הפרת הבטחה. חכמים טיפשים לא מעטים ניסו לכפות עליו להעניק להם טובה, ומצאו שהאפריט שמח להגשים משאלה, ואז משקיע זמן רב כדי לוודא שהמחיר שולם באפר.
- id: elephant
  flavor: >-
    פילים נעים על פני הערבות בשורות ארוכות ואיטיות בהובלת הזקנה שבהם, וכל אחד מהם משגיח על האחרים בקשב שקט. זכר שחש צפיפות או התגרות יכול לתקוף במהירות מפתיעה, ושיניו הגדולות יכולות לבקוע את דופנה של עגלה. מטיילים שפוגשים עדר בדרך נוטים לזכור שזיכרון החיה ארוך כמידת קוצר רוחה.
- id: elk
  flavor: >-
    האייל נושא כתר של קרניים עצומות שנראות כבדות מדי לצוואר הדק שמתחתיהן. עדרים רועים באחו הגבוה בקיץ, חולקים את הרוח ומשגיחים על כל רכס מפני זאבים. כשמגיעה עונת הייחום, הזכרים מתנגשים בקול נפץ שהדהודו בכל העמק, והמנצח הוא מי שעדיין עומד על רגליו כשהשני נסוג לבסוף.
- id: erinyes
  flavor: >-
    אריניס היא אוכפת מכונפת של חוזים קרים, דמות שגובה חובות באיום מנומס ובחיוך שלעולם אינו מגיע לעיניה. היא נושאת סליל של חבל מכושף שמחזיק בכל מה שנתפס בו, וחרבה נושכת בלהב צונן. מי שחותם את שמו על הסכם עם בית הדין של שטן חוקי נוטה ללמוד שהניירת חשובה, ושהיא תמיד שם כשמגיע מועד הפירעון.
- id: ettercap
  flavor: >-
    האטרקאפ הוא יצור שפוף ושעיר שבונה קורים דביקים במפרצי עצים עתיקים ובאסמים הרוסים. הוא ערמומי מספיק כדי להקים מלכודות ואכזרי מספיק כדי ליהנות מהן, ושומר ערימת עצמות ליד הקורים האהובים עליו כמעין גביע קודר. ציידים שמתעמקים מדי בשטחו מספרים ששמעו קול משיכה רך רגע לפני שהמשי מתהדק.
