- id: pirate
  flavor: >-
    בכל נמל יש כמה שודדי ים שמעדיפים קסם אישי על פני חרבות, וזה אחד מהדוגמאות המשכנעות יותר. שישה פגיונות תלויים על רצועת עור, ולכל אחד מהם סיפור על האיש שממנו נלקח. הקסם שלו גורם לזרים למסור את הארנקים שלהם לפני שהם מבינים שביקשו מהם משהו בכלל.
- id: pirate-captain
  flavor: >-
    קפטן שודדי הים לובש מעיל שנתפר משלושה חילות ים שונים וחיוך שהוציא אותו מכל גרדום. דו-קרב הוא לא כישרון אצלו אלא תחביב, והקפטן מסתער ביד אחת בעוד הוא מרים את הכובע ביד השנייה. הצוות עוקב אחריו בגלל חלק השלל, ונשאר בגלל הסיפורים, שלפחות חציים נכונים.
- id: pit-fiend
  flavor: >-
    שטן בור הוא מעין פקיד תופתי עם מוטת כנפיים תואמת, והוא רואה בכל חוזה עלבון אישי שיש ליישב לטובתו. עורו עבה ומצולק, והשוט שלו אינו קישוט בלבד. בני-תופת זוטרים עולים ויורדים לפי גחמתו, ואילו אורחים שבאים לסחור יוצאים בדרך כלל עם תנאים שהם לא זוכרים שהסכימו להם.
- id: planetar
  flavor: >-
    קורן ובלי למהר, הפלנטר תלוי באוויר כמו מנורה ששכחה איך נופלים. כנפיו מתנופפות לאט, וכל מילה שהוא אומר כאילו מכניסה אור לפינות החשוכות של החדר. בני תמותה שפוגשים אחד כאלה מוצאים את עצמם מתוודים על דברים שתכננו לשמור בסוד, אבל היצור רואה בווידויים האלה חסד ולא פרס.
- id: plesiosaurus
  flavor: >-
    מלחים שרואים צורה ארוכת צוואר גולשת מתחת לגלים מחליטים בדרך כלל שלא ראו כלום. היצור הוא חיית ים סבלנית שמתגלגלת במפרצים עמוקים על ארבע גפיו החותרות, ומרימה את ראשו רק כדי לנשוך את מה שמתקרב אליו יותר מדי. הוא עוצר את נשימתו הרבה יותר זמן מכל דייג, ולמד שהמים הרדודים מספקים לו את הארוחות הקלות ביותר.
- id: polar-bear
  flavor: >-
    הרחק בצפון, במקום שבו הקרח פוגש מים פתוחים, דוב לבן ייכנס לים בשלווה כאילו הוא צועד על מישור קפוא. הוא צד כלבי ים מצפים הסחף, שוחה כשראשו הרחב מורם גבוה, ואינו שם לב במיוחד לקור שהיה עוצר חיות חלשות ממנו. ציידים שפוגשים אחד מהם לומדים מהר שהסבלנות שלו גרועה יותר מהמזג.
- id: pony
  flavor: >-
    פונים הם סוג החיה שכל כפר מחזיק ואיש אינו כותב עליה שירים. זה קטן ועקשן, עם פרווה פרועה והרגל לעצור במקום בקצה כל גשר שהוא לא סומך עליו. פרסותיו קשות ממזגו, ונערי האורווה לומדים לכבד זאת לפני שהם לומדים כל דבר אחר.
- id: priest
  flavor: >-
    בכל קהילה יש כומר שיודע אילו משפחות חבות אילו חובות ואילו גגות צריכים תיקון לפני החורף. זה התרגל לתפקיד לאורך עונות רבות של שירות שקט, וזיכרונו חד כשמדובר בעלבונות ועינו חדה אף יותר כשמדובר בכסף. כשצרה מגיעה לקהילה, הכומר עונה בלהבה, באלה כבדה ובקול שנשמע היטב לרוחב הכיכר.
- id: priest-acolyte
  flavor: >-
    השוליה היא זו שמטאטאת את המזבח, נושאת את הנרות וזוכרת כל שם ברשימת התורמים. צעירה, רצינית וקצת מפוחדת מהכמרים הבכירים, ובכל זאת היא שומרת אלה בהישג יד ויודעת להשתמש באש הקדושה להגנתה כשדרך כפרית נעשית מסוכנת. רובם היו מעדיפים לטפח גן מאשר להילחם, ורובם עושים זאת היטב.
- id: pseudodragon
  flavor: >-
    הפסאודודרקון הוא בן דוד ערמומי קטן של התולעים הגדולות, קטן מספיק כדי לשבת על כתף וחכם מספיק כדי לשמור סודות. הוא מבין את השפה המשותפת היטב אך אינו מסוגל להוציא מילה, ולכן הוא מתקשר בנפנוף זנב ובמבט מכוון. חכמים רבים מחזיקים אחד כבן לוויה, אם כי היצור מחליט בדרך כלל מי ראוי לאמון לפני שמישהו אחר מחליט.
