- id: riding-horse
  flavor: >-
    סוס רכיבה הוא החיה שנושאת שליחים, רופאים וכל מי שאין לו כוח ללכת ברגל. יש לו צעד יציב, עין צלולה וסבלנות מועטה לשטויות. סייסים אומרים לא פעם שסוס טוב הוא סוס שבוטח ברוכבו, ורוכב חכם הוא מי שלעולם אינו נותן לו סיבה לפקפק בו.
- id: roc
  flavor: >-
    הרוק הוא עוף שרואה בהרים מדף קינון פרטי, ועיניו חדות מספיק לקרוא מכתב מן העננים. הוא יכול להרים שור מהמרעה, כבשה מהדיר או מלח מסיפון אם הרוח לא לטובתו. מי שראו את צילו חוצה עמק אומרים שהשמיים כמו מתעממים, כאילו האור נטה קרוב יותר כדי להקשיב.
- id: roper
  flavor: >-
    בפינות האפלות של מערות נראה הרופר כמו נטיף אבן אפור לא יותר, ובדיוק כך הוא אוהב שמתעלמים ממנו. כשנוסע בלתי זהיר נשען קרוב מדי, תריסר חוטים דביקים נורים החוצה וגוררים את הפתי כלפי מעלה, אל פה מלא שיניים משוננות. כורים שמבחינים בעמוד סלע גבשושי באופן חשוד לומדים לדפוק עליו במכוש לפני שהם מניחים עליו יד.
- id: rust-monster
  flavor: >-
    מפלצת החלודה היא אוכלת נבלות בעלת שש רגליים שמריחה ברזל ממרחק רב ואינה יכולה לעמוד בפני ארוחה ממנו. אין לה עניין בזהב או באבני חן, רק במתכת שתלויה על חגורות ויושבת על שריונות. נוסע שרואה את מחושיה הנוצתיים מתעוותים לעבר חרב צריך לסגת בשקט ולקוות שהלהב זול מספיק כדי להפסיד אותו.
- id: saber-toothed-tiger
  flavor: >-
    הרבה לפני החוות הראשונות הלך נמר שן-חרב בשולי הערבות בהליכה כמו עשן, וגפיו הקדמיות הכבדות נבנו כדי להפיל טרף גדול. ניביו ארוכים מספיק כדי להיראות טקסיים, אף שהם משרתים מטרה מעשית. עדרים שרעו בקרבת אזור הציד שלו למדו להתפזר למראה הראשון של אגף צהבהב נע בין הקנים.
- id: sahuagin-warrior
  flavor: >-
    שודדי הים האלה הם ציידים בעלי פני דג שנעים עם הזרמים בלהקות מלחמה מאורגנות ורואים בעולם שמעל המים מזווה מלא. לוחמיהם לובשים שריון צדפים ונושאים חניתות דוקרניות, והם מתמקחים עם כרישים בשלווה כמו חקלאי שמתמקח על שוורים. עיירות חוף שמבחינות בסנפיר חותך את פתח הנמל נועלות את שעריהן ומדליקות כל פנס שיש להן.
- id: salamander
  flavor: >-
    סלמנדרות הן יצורים של אש חיה שנסחפים בין כבשנים ופתחי הר געש, זוהרים כמו גחלים שלמדו לזוז. גופן ארוך ושרירי, והן מתפתלות סביב טרפן עד שהחום הופך את שריון השבוי לכלוב לוהט. נפחים שחותמים הסכם עם אחת מהן מוצאים אותה נדיבה רק עד שהתנאים מוקראים בקול.
- id: satyr
  flavor: >-
    סאטירים הם יצורי פייה פראיים עם רגלי עז וכישרון למוזיקה שגורם לשומעים לשכוח את מטלותיהם. הם יהירים, חדי לשון ואוהבים ללעוג לכל מי שלוקח את עצמו ברצינות רבה מדי. סאטיר ינגן מנגינה עליזה כדי להוביל נוסעים מחוץ לשביל, ואז יצחק בקול כשיבינו שהדרך נעלמה מאחוריהם.
- id: scorpion
  flavor: >-
    העקרב הוא צייד קטן ומשוריין שמעדיף סלעים יבשים, את הצל שמתחת לבולי עץ שנפלו ואת סדקי הקירות הישנים. צבתותיו נועדו לאחיזה, ואילו הזנב המסולסל נושא עוקץ שאינו עומד ביחס לגודל החיה. נוודי מדבר מנערים את מגפיהם בכל בוקר, הרגל שהציל לא מעט נוסעים מנומנמים.
- id: scout
  flavor: >-
    הצופים הם השקטים שהולכים לפני כל להקה וחוזרים עם חדשות שאיש אחר לא היה יכול לאסוף. הם נצמדים לקו העצים, קוראים בבוץ את חלוף הזרים ונושאים קשת ארוכה שנדיר שהיא עוזבת את אחיזתם. רובם מעדיפים להישאר בלתי נראים מאשר להיות מוערצים, וצופה טוב הוא מי שאיש אינו מוצא את מחנהו.
