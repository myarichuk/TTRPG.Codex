- id: gibbering-mouther
  flavor: >-
    הפה המפטפט הוא ערימה של פיות, עיניים ובשר רטוב שנסחפת על קרקע ביצתית ומלמלת בתריסר קולות שבורים בבת אחת. מי ששומע את הפטפוט מאבד את חוט המחשבה של עצמו, ומטייל מתנודד עלול למצוא את עצמו צועד היישר אל הפיות הממתינים. חכמי המכללות הישנות מונים אותו בין מטרדי הביצות, וזו מילה נדיבה למי שבולע את מה שהוא נושך.
- id: glabrezu
  flavor: >-
    הגלברזו הוא בן-תופת מתנשא של צבתות מוחצות וערמומיות, מסוג הסוחרים שמציעים עסקה יפה ואז קוראים בקול, בהנאה, את האותיות הקטנות. הצבתות שלו מחזיקות שבוי מפרכס חזק, בעוד הלחשים שלו מפרקים את רצונו של השבוי, וכמעט אי אפשר להפתיע אותו. מזמנים שמעלים אחד מהמישורים התחתונים לא נהנים בדרך כלל מהתנאים שהסכימו להם, והמכללות הישנות מחזיקות רשימות ארוכות של אלה שניסו.
- id: gladiator
  flavor: >-
    הגלדיאטור נלחם בזירות מכוסות חול למען המון שרוצה ריגושים ומחזה, איש מקצוע מאומן שהוא איש הצגות לא פחות מאשר חייל. מטחי החניתות שלו מדויקים, והכאת מגן בעיתוי נכון יכולה להפיל יריב על הגב באמצע נאום מפואר. מארגני הקרבות מספרים להמון שהגלדיאטור נלחם למען התהילה, אבל רוב הלוחמים שם בשביל השכר והסיכוי לצאת בחיים.
- id: gnoll-warrior
  flavor: >-
    הגנול הלוחם הוא פורע ראש-צבוע שנלחם בקשת מגולפת מעצם ובעליצות פראית ששולחת כפריים מבוהלים בורחים. להקות גנולים נודדות בקלות, שודדות מישורים יבשים ומבצרים נטושים, וכל ניצחון מסתיים ביללה שנשמעת לאורך העמק. סיירים טוענים שהלהקות הולכות אחרי המנהיג שלהן לפי הריח, וזה כנראה הדבר היחיד שהן לוקחות ברצינות.
- id: goat
  flavor: >-
    העז היא מטרד יציב-רגליים של מדרונות וכרי מרעה סלעיים, המסוגלת לטפס על סלעים שנראים בלתי אפשריים לכל בעל ארבע רגליים. רוב העזים הן סתם עקשניות, אבל כמה מהן נעשות נועזות מספיק כדי להפיל רועה מן המדרון בנגיחה, וסיפורי הכפר מציגים את הגרועות שבהן כנבלים. ובכל זאת, עז טובה נותנת חלב ויש לה דעה על כל שער בקהילה.
- id: goblin-boss
  flavor: >-
    ראש הגובלינים הוא מנהיג קטן וחד לשון ששולט בחבורת לוחמים בנפנוף ידיים, בערמה ובדחיפה בעיתוי הנכון. רוב הזמן הוא עומד מאחורי שומרי הראש שלו ונותן להם לספוג את המכה הראשונה, הרגל ששמר על צווארו שלם ביותר מקרב מכוער אחד. מנהלי שיירות למדו לשלם את המכס שלו בלי להתווכח, כי הראש תמיד זוכר פנים במהירות.
- id: goblin-minion
  flavor: >-
    הגובלין הנלווה הוא החבר הקטן והמתכלה ביותר בחבורת פורעים, נושא קומץ פגיונות והרבה מאוד אנרגיה עצבנית. הוא מתגנב לאורך גדרות חיות וגגות, בתקווה לחמוק מעל השומרים ולחטוף כל מה שנשאר ללא השגחה. הממונים עליו כמעט אף פעם לא לומדים את שמו, והוא מעדיף שכך יהיה, כי שמות נוטים למשוך צרות.
- id: goblin-warrior
  flavor: >-
    הגובלין הלוחם הוא עמוד השדרה של רוב להקות המלחמה של הגובלינים, חייל קטן וחצוף עם שריון עור, מגן מהוהה וקשת קצרה תלויה על גבו. הוא נלחם בשורות מרופטות, צועק עלבונות על אויביו ומסתמך על המספרים כדי לפצות על קומתו הקטנה. כשהוא בוחר בין קרב ארוך ליציאה מהירה, הגובלין בדרך כלל בוחר ביציאה וקורא לה טקטיקה.
- id: gold-dragon-wyrmling
  flavor: >-
    גור דרקון הזהב הוא דרקון צעיר בעל קשקשים בוהקים ורצועת כבוד שהמבוגרים ממנו מוצאים מקסימה ומטרידה כאחד. נשיפת האש שלו היא תעלול נאה בפסטיבלים, אך הגור מכוון אותה בזהירות לעבר מי שהיה גס רוח, ונשיפת ההחלשה שלו משאירה אויבים מתנודדים בחילופי המהלומות הבאים. האוצר שלו קטן, בעיקר מטבעות ותכשיטים מצוחצחים, והוא מעדיף להלוות טובה על פני לנהל חשבון.
- id: gorgon
  flavor: >-
    הגורגון הוא יציר כפיים מצופה ארד שנבנה כדי לשמור על קברים עתיקים וכספות אטומות, מכונה שאין לה מטרה מלבד פקודותיה. הנשיפה שלו הופכת בשר לסלע במשך כמה רגעים, לקח קודר שגרם לאנשי המחצבות להתרחק היטב. חכמי המכללות הישנות עדיין מתווכחים מי בנה אותו ולמה, אבל השאלה חשובה לגורגון פחות מהפולש שלפניו.
