- id: adult-white-dragon
  flavor: >-
    דרקונים לבנים רודפים את קרחונים וביצות קפואות, שם הקור שלהם אמין יותר מכל דרך. הבוגר הוא צייד גס, שנהנה מההנאות הפשוטות של המרדף ומהשקט האיטי שבא אחריו. נשיפתו מקפיאה אגמים עד היסוד, והקרח שהוא משאיר מאחור נראה כמעט כפסל שיצר מישהו סבלני ואכזרי.
- id: air-elemental
  flavor: >-
    יסודן אוויר הוא מערבולת רוח שניתן לה מעין רצון עיקש, והוא נסחף בחצרות פתוחות כאילו השמיים שלו. אין לו עניין באכזריות לשמה, אבל הוא יכול להעיף נוסע חסר זהירות לצד השני של הדרך בנשיפה אחת. כשהוא שואג, הקול הוא רעם, ואבק מתרומם אחריו בספירלה.
- id: allosaurus
  flavor: >-
    האלוזאורוס הוא צייד בעל לסתות עצומות מהמישורים הקדומים, שנבנה להתפרצויות פתאומיות ולא למרדפים ארוכים. נשיכתו כבדה מספיק כדי לרסק עצם, וגפיו הקדמיות הטפרניות קורעות כל מה שמועד בדרכו. אין בו רוע, רק רעב ותחכום צר ומעשי, שיודע איפה הטרף צפוי להתכנס.
- id: ancient-black-dragon
  flavor: >-
    הדרקון השחור הקדמון עתיק יותר מדרכי הביצה ומרוב השמות שבהם מתארים אותן, והוא הטביע עמקים שלמים כדי ליצור את מאורתו. קשקשיו בצבע צפחה רטובה, ונשיפתו יכולה להמיס חומת מבצר במטח אחד. קרטוגרפים משאירים את שטחו ריק, וזה כנראה מתאים לכולם.
- id: ancient-blue-dragon
  flavor: >-
    הדרקון הכחול הקדמון, סבלני מעבר לכל חשבון בן תמותה, שולט באגנים היבשים זמן רב יותר ממה שיש לאגנים שמות. הוא חופר מתחת לחולות וממתין שסופה תיענה לרצונו, ואז שולח ברק דרך הדיונות כמו מסר שנכתב באש. התנהגותו קרירה ואדיבה, אבל כל אדיבות היא חוזה עם תנאים.
- id: ancient-brass-dragon
  flavor: >-
    מעט יצורים במדבר זוכרים תקופה שבה הדרקון הפליז הקדמון לא סיפר סיפורים מתחת לדיונות. קולו חם ומשועשע בלי סוף, והוא מוכן להחליף סיפור בסיפור בנכונות שבה הוא מחליף זהב. אש מתגלגלת מלסתותיו כשהוא משתעמם, אבל הוא כמעט לא נשאר בטל זמן רב, כי חידה טובה תמיד מושכת אותו בחזרה.
- id: ancient-bronze-dragon
  flavor: >-
    במקום שבו מפות הנמל הישנות נגמרות והים הפתוח מתחיל, הדרקון הארד הקדמון מקיים משמרת ארוכה ושקדנית. הוא שומר על החוף כמו מגדלור ששומר על הים, יציב ובוהק ובלתי אפשרי להתעלם ממנו. מחיאות הרעם שלו יכולות לשטח שורת סירות, אבל הוא מעדיף לדחוף את העבריין בעדינות בחזרה לחוף ולתת לגאות ללמד את הלקח.
- id: ancient-copper-dragon
  flavor: >-
    הדרקון הנחושת הקדמון, פיקח מעבר לגבולות הרגילים של דרקונים, רואה בעולם כולו חידה שנבנתה לשעשוע שלו. הוא סידר מחדש פרדסים שלמים רק כדי לראות איך החקלאים יגיבו, והשאיר התנצלות מנומסת ליד כל אחד מהם. נשיפת החומצה שלו היא ענן מסיס ירוק-זהוב, אבל צחוקו הוא שמטריד באמת את מי שחצה אותו.
- id: ancient-gold-dragon
  flavor: >-
    איש לא הכתיר את הדרקון הזהב הקדמון והוא אינו נתון לשום כס, ובכל זאת הוא מתנהג כמו היועץ החכם ביותר שחצר כלשהי יכולה לייחל לו. פסקיו מגיעים לאט ונדירים הם המקרים שבהם הם מתהפכים, כי ראה אימפריות קמות ונופלות הרבה לפני שרוב החוקרים למדו את שמותיהן. כשהוא פורש כנפיים, האור השופע על הארץ חם וזהוב, ואף עד אינו שוכח את המראה.
- id: ancient-green-dragon
  flavor: >-
    דבר ביער אינו צומח בלי הסכמתו, והדרקון הירוק הקדמון החליט מזמן שכל שורש שייך לו. מוחו נשלח אל מחשבותיהם של מלכים וזקני כפרים כאחד, ודוחף אותם להחלטות ששרתו רעב סבלני ועתיק מאוד. נשיפת הרעל שלו מתגלגלת מעל צמרות העצים כמו ערפל שזוכר כל שם שחנק אי פעם.
