- id: giant-scorpion
  flavor: >-
    העקרב הענק מחכה מתחת לסלעי המדבר כשצבתותיו מקופלות, יצור סבלני כמו מהנדס, שיודע בדיוק עד לאן מגיע זנבו. הארס שלו חזק מספיק להאט את לבו של מטייל חסון, ולכן שומרי שיירות בארצות היבשות תולים פעמונים על פני המחנה. העקרב לא צד לשם ספורט; הוא פשוט לוקח כל מה שמשוטט קרוב מדי לחול.
- id: giant-seahorse
  flavor: >-
    סוס הים הענק נסחף במים רדודים וחמימים ובתעלות שבין שוניות, זקוף ולא ממהר, עד שמשהו מטריד את המים. כשהוא טוען קדימה, עוצמת המכה כבדה בהרבה ממה שגופו העדין מרמז, והדייגים למדו שהנדנוד הרגוע של סוס ים אינו סימן לרחמים. אמני החוף מציירים אותם עונדים כתרי אלמוגים, דיוקן מחמיא שמעטים מאלה שפגשו אחד כזה ראו אי פעם.
- id: giant-shark
  flavor: >-
    הכריש הענק הוא טורף ענקי של ים פתוח, ארוך עד כדי כך שצוות הסירה חש בצל עובר מתחתיו עוד לפני שהוא רואה את הסנפיר. נשיכתו הרת אסון, ותיאבונו מתחדד ברגע שמופיע דם במים. שירי נמל ישנים מזהירים שכריש שהקיף פעם אחת יקיף שוב, וקברניט נבון פונה אל החוף.
- id: giant-spider
  flavor: >-
    העכביש הענק טווה את מלכודותיו בין עצים עתיקים ובין פירי מכרות נטושים, חוטים דקים עד כדי כך שמטיילים נכנסים בהם לפני שהם מבחינים. חוטבי עצים בכפרי ההרים מסמנים את קווי הרשת בבד בהיר, הרגל שהציל לא מעט חיים. נשיכתו נושאת רעל איטי, והיצור מסתפק בלחכות עד שהטרף שלו מפסיק להיאבק.
- id: giant-toad
  flavor: >-
    הקרפדה הענקית מתכופפת בביצות קנים ובמעברות בוציים, צורה רחבה ונפוחה שנראית כמעט מצחיקה עד שהיא קופצת. הבליעה שלה היא החלק שמפחיד את ילדי הכפר יותר מכול, שכן היצור שומר את שללו בחיים בתוך הבטן זמן מה, והסיפורים על בטנה אינם נעימים. אנשי הביצה מרחיקים את הבקר שלהם מהקנים עם רדת הערב ולעולם אינם רוחצים לבדם.
- id: giant-venomous-snake
  flavor: >-
    הנחש הארסי הענק הוא צייד חלק ופסים כהים של גדות נהרות וביצות סבוכות, זריז בהרבה ממה שסלילי גופו הכבדים מרמזים. הוא תוקף ממרחק בטוח, עובדה שלימדה כמה חקלאים זהירים ללכת לאורך הגדה עם מקל ארוך. ארסו איטי וקודר, ומרפאות הצמחים הזקנות מחזיקות תרופה מרה מוכנה לכל בית שליד המים.
- id: giant-vulture
  flavor: >-
    הנשר הענק מקיף מעל שדות קרב ועיירות גוססות, אוכל נבלות סבלני שנדמה כמגיע עוד לפני שהצרה מגיעה. הנקירה שלו משאירה אחריה חולי, ולכן אפילו שריטה קטנה עלולה להשאיר מטייל מסוחרר וחמוץ זמן רב. חוקרי המכללות הישנות מתווכחים אם הוא חיה או משהו גרוע ממנה, והנשרים מעולם לא הביעו דעה.
- id: giant-wasp
  flavor: >-
    הצרעה הענקית תלויה באוויר מעל פרדסים ושדות חציר, וכנפיה מטושטשות ומשמיעות קול כמו מסור רחוק. מגדלי דבורים בעמק מדברים עליה באימה מיוחדת, משום שהיצור מטפל בקן שלו בזעם שמעט כוורות שורדות. עוקצה מהיר וארסה נשאר, ולכן מי שננעץ בו עוקץ צריך לשבת מיד ולחכות שהנפיחות תחלוף.
- id: giant-weasel
  flavor: >-
    הסמור הענק הוא צייד חלק וממולח של משוכות ושל אסמים, מהיר מספיק להחליק דרך פער שאינו גדול יותר ממגף. חקלאים מאשימים אותו בתרנגולות שנעלמו ובכבש שנעלם מדי פעם, אף שלעתים נדירות רואים אותו בשטח הפתוח. שיניו קטנות אך חדות מאוד, והיצור מגלה עניין רב יותר בלכוד ארוחה בפינה מאשר בלהילחם עליה.
- id: giant-wolf-spider
  flavor: >-
    עכביש הזאב הענק צד בלי רשת, וממהר על פני שטח פתוח במהירות שגורמת לצופים לפקפק בעיניהם. הוא חי במחילות מתחת לבולי עץ שנפלו ובגדות אדמה יבשות, ויוצא בשעת דמדומים לארוב לכל דבר קטן מספיק כדי לשאת. עשבונאים שומרים צנצנת מארסו להקלת כאבים, אף שהנשיכה עצמה רחוקה מלהיות עדינה.
