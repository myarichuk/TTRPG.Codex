- id: mage
  flavor: >-
    קוסמים הם חוקרים שהרחיקו בלימוד הכוחות הארקאניים יותר מרוב האנשים, ולרוב אין להם בושה להוכיח זאת. קוסם עשוי ללבוש מעיל פשוט ולשאת שרביט אחד בלבד, אבל כמה מילים שנבחרו היטב יהפכו פונדק שקט לשדה אש. אנשי עיירות השוק מכבדים אותם, בעיקר מפני שקוסם מוטרד זוכר כל עלבון ומשיב עליו בריבית.
- id: magma-mephit
  flavor: >-
    מפיטי מאגמה הם שדונים קטנים ומעשנים של סלע געשי, שמתרוצצים בלי הפסקה בסדקי הר לוהט. הם קופצים מבריכות לבה כדי לירוק נשיפה לוהטת על כורים חולפים, וצוחקים בהיסטריה כשהלהבות אוחזות במגפיו של מישהו. גופם עצמו מפצפץ כשמכים בו, ותושבי המערות הנבונים מחזיקים דלי מים קרים מוכן לפיצוץ הבלתי נמנע.
- id: magmin
  flavor: >-
    המגמינים הם גופי להבה קטנים ועליזים, שרוקדים בגחלי כבשנים ובפתחי אדים געשיים ושמחים לכל בלגן שאפשר להצית. מגעם מעלה עשן בבגדים ובקורות עץ, ולכן עדיף לפגוש מגמין במרחק זרוע, ודלי מים ביד. הם זוהרים הכי חזק כשהם מרוצים, ונפח זועף אחד נשבע שמגמין שמח הוא היחיד שכדאי להחזיק ליד המפוח.
- id: mammoth
  flavor: >-
    ממותות הן ענקיות שעירות של הצפון הקפוא, שצועדות בשלג עם חטים ארוכים כתורן של ספינת מפרשים. העדרים נעים לאט ובשלווה, אבל זכר בהסתערות הוא כוח מועך, והוא יפרוץ דרך גדר בלי להרהר פעמיים. ציידים שמכבדים את גודלן משאירים בדרך כלל את העדר במנוחה, שהרי הזקנות זוכרות כל שביל וכל קו עצים.
- id: manticore
  flavor: >-
    למנטיקור פני אדם זעופים, גוף של אריה וזנב זרוע קוצים דוקרניים שהוא יכול לזרוק על טרפו. קולו הוא גרגור אכזרי, והוא אוהב לשחק עם נוסעים לפני שהוא מזנק עליהם מלמעלה בכנפיים שמטילות צל ארוך. ניצולים נשבעים לא פעם שהוא חשב בזמן שלחם, אי נוחות שרוב הלוחמים היו מעדיפים להימנע ממנה.
- id: marilith
  flavor: >-
    המרילית היא שד ענק בעל שש זרועות, שכל אחת אוחזת בלהב אחר, והיא נעה בחן של רקדנית שמסתיר מוח עז ומחושב. מחציתה התחתונה מתפתלת כנחש ויכולה לכרוך אויב באחיזה מוחצת בזמן שהלהבים מתנופפים. מי שנלחם באחת לא שוכח בקלות את מראה מערבולת הלהבים הנוצצים, וקפטן נבון מתפלל שהיצור משתעמם.
- id: mastiff
  flavor: >-
    מסטיפים הם כלבים גדולים ונאמנים עם לחיים כבדות ונביחה עמוקה שיכולה להבהיל פורץ עוד לפני שנשלף להב. משפחות חווה מעריכות אותם כשומרים, ומסטיף טוב יפיל מסיג גבול ויחזיק אותו במקום עד שתגיע עזרה. נאמנותו יציבה, אף שלפעמים הוא מקמץ פנים במטבח אם נדמה לו ששכחו מהתבשיל.
- id: medusa
  flavor: >-
    למדוזה יש כתר של נחשים חיים במקום שיער, ומבט שיכול להפוך מתגרה אמיץ לאבן. היא מחזיקה חצר שיש מלאה בפסלים, והיא די גאה באוסף שלה, אך אינה סובלת מבקרים שבוהים יותר מדי זמן. נוסעים פיקחים מביאים מגן מלוטש ולעולם אינם פוגשים את עיניה ישירות, וזה חוסך הרבה צרות.
- id: merfolk-skirmisher
  flavor: >-
    בני ים מתכתשים הם לוחמים קלים ומהירים מן השוניות, חמושים בחנית דוקרנית שנדמה כאילו היא עפה בחזרה אל היד אחרי כל זריקה. הם נושמים אוויר ומים כאחד, ולכן הם מתגנבים אל החוף לפשוט על כפרי דייגים ונעלמים בחזרה מתחת לגלים לפני שמישהו מספיק לכנס קהל. שומרי הנמל רוטנים שמתכתש אחד הוא מטרד, ושתריסר מהם הם מצור שאין חומת ים שתעמוד בו.
- id: merrow
  flavor: >-
    המרואים הם יצורי ים גדולי גוף עם חלק תחתון דמוי דג, שיניים משוננות ומזג שמתאים לסערה. הם אורבים במים הרדודים והקרים של מערות חוף, ומושכים מטה סירות חסרות מזל בצלצלים מכופפים. כפרי דייגים משאירים דג מומלח על הסלעים כקורבן שלום, והמרו מקבל אותו בהתנהמות ובחיוך רעב.
