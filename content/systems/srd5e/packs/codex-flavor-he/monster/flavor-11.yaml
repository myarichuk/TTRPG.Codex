- id: ettin
  flavor: >-
    שני ראשים שלעולם אינם מסכימים על דבר חולקים גוף עצום אחד, והזוג מבלה את ימיו הערים בוויכוח לאן ללכת. אנשי הגבעות משאירים לו את דירי הבקר, כי היצור נעלב מכל דבר שנראה כמו גדר ויהרוס את השורה כולה מתוך קנאה. מי שראו אותו נלחם מספרים שהראשים צועקים לסירוגין, והוויכוח אינו מאט אף פעם את תנופת הגרזן.

- id: fire-elemental
  flavor: >-
    קשר של להבה חיה הצף בין כבשנים ואחים, בוער ברעב יציב וסבלני ששום מפוח לא תשביע. חכמי המכללות הישנות מתווכחים אם הוא יצור או מזג אוויר בפני עצמו, שהרי אין לו פנים ואין לו קצה ברור. אנשי השיירות מרחיקים ממנו את המנורות, והנפחים הנבונים אינם מניחים לו להתקרב לפחמים שלהם.

- id: fire-giant
  flavor: >-
    ענקי האש מקימים את ממלכותיהם באולמות געשיים, שם הם חוטבים להבים הזוהרים כשקיעה ושופטים את נתיניהם בסבלנות של ברזל. חוקם נוקשה וגאוותם לוהטת מכל כבשן, ולכן אתגר מצד יצור קטן מהם נענה בחרב ולא בצחוק. מי ששורד דו-קרב עם אחד מהם מגלה לא פעם שהאדמה החרוכה תחתיו עדיין מעלה עשן.
  
- id: flesh-golem
  flavor: >-
    הגולם נבנה משרידים ישנים, טלאי של חלקים שאינם תואמים המוחזקים בתפרים ובניצוץ של חיים שאולים. יוצרו רצה משרת שלא יתעייף לעולם, וקיבל משרת שזוכר את הידיים שממנן נבנה ומתרעם כשאומרים לו מה לעשות. האש היא חולשתו היחידה, ולכן שומר נבון לעולם אינו נושא לפיד בקרבתו ומחזיק בהישג יד קול רגוע.

- id: flying-snake
  flavor: >-
    נחש דק עם דשי עור לאורך צדיו, המרחף מענף לענף בביטחון רב מחן. מדריכי ג׳ונגל מספרים שהוא מבלה את רוב חייו בצמרות, צונח על טרף שעובר מלמטה ושוחה הרחק לפני שמישהו מספיק להצליף בו. נשיכתו מטרד יותר משהיא איום, אם כי הרעל עוקץ דיו כדי לגרום למטייל להצטער על הטיול.

- id: frog
  flavor: >-
    צפרדע חומה קטנה היושבת על עלה נימפיאה, מסוג היצורים שגורמים לכל הבריכה להישמע בהירה יותר כשהם מקרקרים. אנשי הבריכה מתעלמים ממנה על פי רוב, אך ילדים שמנסים לתפוס אחת לומדים מהר שהיא קופצת רחוק מכפי שציפו. שירתה הוא פלא לילי של הביצה, ותזכורת עדינה לכך שגם היצור הקטן ביותר יכול להיות הבעלים של פיסת מים.

- id: frost-giant
  flavor: >-
    ענקי הכפור מקימים את אולמותיהם על מדפי קרחונים, שם הרוח שרה תמיד והשלג אינו נמס לעולם. בהפשרה הם לוקחים מכפרי השפלה כל מה שהם רוצים, ומשאירים כפור על המשקופים כמעין כרטיס ביקור קר. אכזריותם סבלנית והומורם יבש, והם שמחים לתת למטייל לקפוא בזמן שהם סופרים את הכבשים.

- id: gargoyle
  flavor: >-
    הגרגויל, המעוצב מסלע חי, מתיישב על מדפים גבוהים וממתין שמשהו טיפשי יעבור מתחתיו. כנפיו האבניות נראות כקישוט עד שהן נפרשות בנקישה כשל צפחה נשברת, ואז היצור באוויר ובמצב רוח רע. אנשי העיר למדו לנעול את התריסים מוקדם, שהרי גרגויל במצב רוח רע יצנח מגג בלי להתריע.

- id: gelatinous-cube
  flavor: >-
    חומת ג׳לי שקופה ורועדת סוחפת לאיטה במנהרות הישנות, בולעת מטבעות שנפלו, עצמות וכל דבר אחר שהושאר מוטל. גופה שקוף כל כך שאפשר לראות את האומללים צפים בתוכה, רגועים ומופתעים, זמן רב לפני שמישהו חושב לעזור. גילדות ההרפתקנים תולות עליה מודעות, והמודעות מסתיימות תמיד באותה תחינה: שחפצי הערך יישארו הרחק מהרצפה.

- id: ghast
  flavor: >-
    גהול שהפך אכזרי ונרקב יותר, והגאסט נושא סירחון כה סמיך שכדאי להימנע מלנשום בקרבתו. חופרי קברים אומרים לפעמים שהריח מגיע מעט לפני היצור, מה שנותן לזהירים רגע לברוח. מי ששומעים את צחוקו הנמוך אחרי רדת החשכה נוטים להשאיר את דלתותיהם נעולות.
