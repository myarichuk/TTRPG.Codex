- id: horned-devil
  flavor: >-
    שדי הקרניים הם בריונים גבוהים בעלי גב אדום, שצועדים במבנה ונהנים לראות אחרים נרתעים. בזנבם יש קרס שיודע להעניש יריב מקרוב, וזריקות האש שלהם מדויקות ובלתי סלחניות. יצורים כאלה הם המנהלים הבינוניים חסרי הרחמים של המסדרים האפלים שלהם, והם מדברים על רחמים כמו פקיד שמדבר על מזג האוויר.
- id: hunter-shark
  flavor: >-
    כרישי הציד מסיירים במים העמוקים והחמימים שמעבר לשונית, שם הם גדולים מכדי שרוב הטורפים יטרחו איתם. יש להם סיבה אחת, נוראה, לשם שיצא להם: אחרי שטעמו דם, הם לא יעצרו עד שהזרם ישקוט. סירות דייגים לומדות להחזיק את הרשתות נמוך ואת הקולות שקטים.
- id: hydra
  flavor: >-
    ההידרה היא ענק של ביצות עם הרבה צוואריים, וכל אחד מהם נגמר בראש נושך שנראה כאילו יש לו דעה משלו. חתכו אחד, ומהר מאוד הגדם מתכסה במשהו חדש, מה שהפך את היצור למבחן קבוע לכל גיבור שניסה אי פעם להיות מסודר. ציידים לומדים שהדרך הבטוחה היחידה לסיים את הוויכוח היא באש.
- id: hyena
  flavor: >-
    הצבועים צוחקים בדרכם הצורמת, והצליל נישא על פני השיחים הרחק אל תוך הלילה. הם צדים בלהקות רופפות ויעקבו אחרי מטייל פצוע זמן ארוך וסבלני. הצחוק שלהם, יותר מהשיניים, הוא מה שמשאיר מדורות דולקות עד שעה מאוחרת בסבך.
- id: ice-devil
  flavor: >-
    שטן הקרח הוא יצור סבלני ושנון לשון, שמעדיף חוזים על פני קרב ורואה במבט קר סוג של נימוס. הוא נושא חנית לבנה וארוכה שמכסה בכפור את האוויר סביבה, ומקים חומות קרח כדי שעסקאות לא יופרו. מי שחותם עם אחד מהם נוטה לגלות את האותיות הקטנות רק כשהצינה מתחילה לחדור.
- id: ice-mephit
  flavor: >-
    מפיטי הקרח נסחפים במעברי הרים קרים כמו פיסות כפור משוחררות, ומקשקשים שטויות לכל מי שמתקרב מדי. הם נושפים ערפל על השביל כדי להסתיר את הצחקוקים שלהם, ואז פולטים משב קפוא שמשאיר מטיילים נוקשים ונעלבים. כשאחד מהם מתנפץ לבסוף, הוא מתפוצץ בענן קר וחד, ולכן הנבונים שומרים מרחק סביר מגופתו המכוסה קרח.
- id: imp
  flavor: >-
    השדונים הם נוכלים זעירים ורעי לב שנהנים לראות אנשים פיקחים עושים מעצמם צחוק. הם לובשים צורה של חולדה, עורב או עכביש כשזה נוח להם, ולעולם לא מתעייפים מלחישות ערמומיות ומעקיצות מורעלות. שכירי חרב כמעט לא שמים לב ליצור, עד שנוכחותו הבלתי נראית כבר גנבה את המטבעות מכיסיהם.
- id: incubus
  flavor: >-
    האינקובוס לובש פנים יפות וקול של קטיפה, מעטים המטיילים שמנחשים שהזר האדיב בפונדק הוא רשע סבלני ותחבולן. הוא מבלה את הערבים בזריעת ספק וסיוטים חסרי שינה בלב חולמים, והקללות שהוא משאיר אחריו נמשכות הרבה אחרי שהכוס האחרונה התרוקנה. מי שמתעורר תשוש וקודר מאשים בדרך כלל את המזל הרע שלו, ולעולם לא את האורח היפה שישב ליד מיטתו.
- id: invisible-stalker
  flavor: >-
    העוקב הבלתי נראה הוא משב רוח שקיבל מטרה עיקשת, צייד סבלני שמרחף בלי שיראו אותו עד שהטרף שלו חש משיכה פתאומית. מלחים שנתקעו בסערה מתארים שאגה שבאה משום מקום, ואחריה מערבולת אבק ורסס שאוחזת ברגליהם וטורפת אותם מאיזון. מלומדי המכללות הישנות אומרים שהוא נשמע ללחש שקרא לו, ושהוא כמעט לא שוכח טינה אחרי שהרוח התהפכה.
- id: iron-golem
  flavor: >-
    גולם הברזל הוא זקיף עצום של מתכת מסומרת, שנבנה כדי לשמור על פתח אחד ולהתעלם מכל טיעון שמבקש ממנו לזוז הצידה. אגרופיו מצלצלים כמו פעמונים שהוכו, וכשהוא נושף, נשימתו הירוקה והחולנית תלויה מעל החצר זמן רב אחרי שהקרב נגמר. אלה שבנו דברים כאלה נעלמו, והותירו אחריהם רק את המתכת ואת נאמנות עיקשת לפתח שנועדה לשמור עליו.
