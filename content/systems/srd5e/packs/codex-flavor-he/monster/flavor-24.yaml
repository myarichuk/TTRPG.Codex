- id: pteranodon
  flavor: >-
    פטרנודונים מקננים על צוקים שלצד הים ומרחפים על זרמי האוויר החמים שמעל הגלים, ועורפיהם הארוכים תופסים את הרוח כמו מפרש. הם אינם ציידים מבריקים, אבל הם סבלניים: הם צוללים על להקות דגים ונושאים כל מה שהצליחו לתפוס. להקה שנחה על כף סלע נראית כמעט שלווה, עד הרגע שבו אחד מהם מסתובב באוויר ומקורו פעור.
- id: purple-worm
  flavor: >-
    מתחת לגבעות יש מנהרה רחבה דיה לעגלה, ובקצה השני שלה חיה התולעת הסגולה. היא נעה בסלע מוצק בקלות שבה נהר זורם בסחף, ומשאירה אחריה חלל ריק שהאנשים בסביבה נזהרים ממנו דורות. חכמים שראו את פיה הפעור עדיין חלוקים אם היא צדה לפי קול, לפי ריח או סתם לפי מזלו הרע של המטייל.
- id: quasit
  flavor: >-
    הקוואזיטים הם יצורים קטנים וחמוצי פנים שמחליקים החוצה מסדקים בטבעות זימון ישנות וסוגים צרות למי שפתח אותן. הם לובשים כל צורה שמשעשעת אותם, בדרך כלל משהו פרוותי וחמוד, ונעלמים במהירות כשהקרב מתהפך. קוסם כפרי שמחזיק אחד כמשרת מגלה במהרה שהיצור דואג לנוחותו שלו הרבה יותר מאשר לפקודות של מישהו.
- id: rakshasa
  flavor: >-
    בן התופת הזה לובש פנים יפות כמו סוחר שלובש מעיל טוב, ומצפה שכל מי שהוא פוגש ישמע בקולו. סבלנותו אינה נגמרת והחוזים שלו מחייבים, אבל האותיות הקטנות תמיד מיטיבות עם מי שכתב אותן. חצרות ברחבי הארצות הישנות שכרו אותו ליועץ, וגילו מאוחר מדי שהעצה נועדה לתועלתו שלו.
- id: rat
  flavor: >-
    עכברושים הולכים לכל מקום שבו יש לחם, וכך הם נוהגים מאז שיש אסמים לשדוד. עכברוש בודד כמעט אינו איום, אבל ביוב מלא בהם מרוקן מזווה מהר יותר מכל גנב. טבחים לומדים לכסות את הקמח ולשמור על הילדים קרוב, כי העכברושים סבלניים, מוכשרים במציאת סדקים ותמיד רעבים.
- id: raven
  flavor: >-
    עורבים הם ציפורים פקחיות שנאספות במקום שבו יש מוות, ואוהבות לאסוף חפצים נוצצים לקן. העורב הזה למד לחקות את הקולות ששמע במחנה, לחישה פה וצפצוף שם, עד שהשומעים לא תמיד יכולים להבחין בין הציפור לאדם שהיא מחקה. סיפורים עתיקים בכפרי ההרים אומרים שעורב שקורא למטייל בשמו עומד להביא חדשות רעות.
- id: red-dragon-wyrmling
  flavor: >-
    גור דרקון הוא דרקון שעוד לא הרוויח את הזכות להיות גאה, אף שהוא בהחלט מנסה. קשקשיו בצבע של גחלים מכוסות באפר, והוא כבר למד שכל ערימה של דבר יקר ראויה לשמירה בשיניים ובכעס. כפריים ששומעים פצפוץ בגבעות עם דמדומים צריכים לנעול את הדלתות ולקוות שהחיה הצעירה עדיין חמדנית מכדי להתעסק בהם.
- id: reef-shark
  flavor: >-
    כרישי שונית מסיירים במים הרדודים והחמים שבהם האלמוגים שוברים את הגלים, ונעים במשפחות רופפות שצדות יחד. הם סקרנים יותר מאשר אכזריים, ורוב הצוללים שפוגשים אחד מהם רואים רק צל שמחליק לאורך קצה השונית. הדייגים לומדים מהר, עם זאת, שכריש שטעם דם חוזר עם חבריו ומתעלם מכל צעקה שמגיעה מהסירה.
- id: remorhaz
  flavor: >-
    החופר הזה חי במקום שבו הקור עמוק ביותר, ועם זאת הוא נושא חום משלו בתוך גוף ארוך ומפוצל, כמו תנור שלמד לזחול. הוא חותר דרך קרח ואבן בסבלנות שמפחידה את הכורים, ועולה בענן אדים בכל מקום שבו הסלע מתחמם. ניצולים מתארים את האוויר לידו כרוטט, וריחו משהו בין ברזל לוהט ללחם חרוך.
- id: rhinoceros
  flavor: >-
    הקרנף הוא אוכל עשב כבד וקצר ראייה שסומך על קרנו הרבה יותר מאשר על עיניו. כשמניחים לו, הוא משוטט בערבה בקצב שלו ומתעלם מכל מה שאינו מריח כיריב או כסכנה. אבל ברגע שהוא מחליט לדהור, נדמה שהמישור כולו רועד, והרועים האמיצים ביותר לומדים לסור מדרכו.
