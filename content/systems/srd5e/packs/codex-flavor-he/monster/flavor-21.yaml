- id: mimic
  flavor: >-
    רוב המטיילים מניחים שהארגז עטור הברזל בפינת הפונדק הוא סתם רהיט. המימיק חי על ההנחה הזאת זמן רב יותר ממה שכל פונדקאי זוכר, ולובש צורת דלתות, חביות וארגזי אוצר בעודו ממתין בסבלנות שכמעט נראית מנומסת. פניו דביקים עד כדי כך שמי שנשען קרוב מדי עלול לא לעזוב לעולם.
- id: minotaur-of-baphomet
  flavor: >-
    שומרי מקדש אסור בעלי קרניים הם לעיתים נדירות חברה עליזה, ולזה יש כובד של זקיף ששכח למה הוצב. הוא גבוה ממשקוף הדלת ומניף חרב-רומח שחורה בלהט קודר ובלי למהר. חסידי הכת טוענים שהחיה לעולם לא מתעייפת, אבל הכתמים על המזבח שלה מרמזים אחרת.
- id: minotaur-skeleton
  flavor: >-
    מישהו בנה פעם את השלד הזה מעצמות שור ומטינה, והוא צועד באותו מבוך מאז. צלעותיו מקשקשות בכל צעד כבד, וגולגולתו עדיין מורידה את הראש אל פולשים כאילו הקרניים עוד שם. הוא חוקי ושיטתי ומציית לפקודות הישנות בלי לשאול, ולכן הוא סוהר אמין עד כדי אי נוחות.
- id: mummy
  flavor: >-
    תחבושות הכרוכות היטב סביב אבל ישן מחזיקות את המומיה על רגליה זמן רב אחרי שהגוף היה אמור להרפות. היא נעה לאט בקריפטות יבשות, ואגרופיה הרקובים עדיין נאמנים לשבועה שקשרה אותה לקבר. לעיתים די במבט אחד בלתי מצמץ כדי לגרום לשודדי קברים לברוח, והם כמעט אף פעם לא עוצרים לתהות על מה היא שמרה.
- id: mummy-lord
  flavor: >-
    בעוד מתי המשחה הפשוטים יותר קהים ומשרכים רגליים, אדון המומיות זוכר כל מה שלמד בחייו. הוא דובר כמה שפות, מנהל רישום קפדני של כל עלבון, ומייעץ לקברים שהוא שומר בדיוק של מלומד. גנבים שמחליטים ששתיקתו היא חולשה לומדים את ההבדל מקיר של משרתים עטופים וצופים.
- id: nalfeshnee
  flavor: >-
    משהו בין קוף ענק לעריץ נפוח, הנלפשני יושב על עושר משלו של עסקאות רעבות. קולו רך והגיוני, מה שהופך את הבטחותיו למסוכנות עוד יותר. שדים פחותים מביאים לו מס מן הבורות הרחוקים, והוא גומל להם בנדיבות משועממת ומתירנית שמרגישה כמעט כמו איום.
- id: night-hag
  flavor: >-
    כפופה וסבלנית, מכשפת הלילה מנהלת פנקס קטן של כל עסקה שנכרתה בפינות שקטות של העולם. היא עוטה פנים אדיבות כשהיא מבקרת עריסות ומיטות חולים, וכמעט אף פעם לא תופסים אותה בלי מילה מתוקה מוכנה. חבורותיה נפגשות במקום שבו האש כבר דעכה, ומשתפות סודות שעולים יותר מכל מטבע.
- id: nightmare
  flavor: >-
    נועל גחלים ועטוף זוהר מהסס, סוס הסיוט דוהר בכפרים ישנים עם ברכת רוכב או עם קללת רוכב. עיניו בוערות כפחם, ובמקום שבו פרסותיו נוגעות באוויר נשארת הארה קלושה. סוסנים שניסו לאלף אחד מהם נמצאים בבוקר שלמחרת כשהם בוהים בקורות התקרה ומחייכים.
- id: noble
  flavor: >-
    בכל עיר חשובה יש אציל שמאמין שהנמל ומחסני התבואה שייכים למשפחתו בזכות. הוא לבוש שריון חזה מלוטש מתחת לגלימת קטיפה, ומחייך בשיניים שמעולם לא חסרה להן ארוחת ערב. את רוב המחלוקות שלו הוא מסדר במילה פיקחית, אך הוא מחזיק רפיר לאותם מקרים נדירים שבהם המילים מכזיבות אותו.
- id: ochre-jelly
  flavor: >-
    הג׳לי האוקר נוטף מהצד התחתון הלח של גשרים ישנים, ומהווה גוש איטי וחמוץ שמתייחס לכל סדק כאל ארוחה. הוא זולג במעלה קירות ולאורך תקרות, ומשאיר אחריו ניחוח של חומץ ומתכת מאוכלת. דייגים שראו אחד בסוף נוטים להתרחק היטב מן הגדה זמן רב אחר כך.
