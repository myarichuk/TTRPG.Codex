- id: blink-dog
  flavor: >-
    כלבי הבהוב הם כלבי ציד מעולם הפייה, שנראים כמי שקופצים מסבך אחד לסבך הבא, והציידים שעוקבים אחריהם מוצאים בדרך כלל רק קווצות של פרווה כסופה. הלהקות שלהם ידועות בנימוסיהן: הן חולקות את הטרף וממתינות בנימוס בקצה קרחת היער עד שנוסע יעבור. מעטים שוכחים באיזו מהירות כשכוש ידידותי של זנב הופך להיעלמות פתאומית.
- id: blood-hawk
  flavor: >-
    נץ דם הוא עוף דורס קטן בעל כנפיים בצבע חלודה ומבט בלתי נח וחסר רחמים. ציידים משתמשים בו כמו שאחרים משתמשים בשריקה: משחררים את העוף לחוג למעלה, ועיניים חדות למטה עושות את השאר. הוא פיקח מכפי שגודלו מרמז, ואיכרים המגדלים תרנגולות לומדים להקשיב לשקט הפתאומי שמבשר את בואו של אחד כזה.
- id: blue-dragon-wyrmling
  flavor: >-
    גור הדרקון הכחול הוא דרקון צעיר של מישורים יבשים ודיונות חרוכות, וקשקשיו בצבע של סערה הנראית מרחוק. הוא סבלני כדרכם של יצורים שמצפים לחיות יותר מכל מי שעשה להם עוול, ומנהל פנקסים קפדניים של טובות שחייבים לו. צעיר ככל שיהיה, הוא כבר מעדיף עסקה שנחתמה לטובתו על פני כל קרב שהוא עלול להפסיד.
- id: boar
  flavor: >-
    חזיר בר הוא מחפש מזון חסון וזיפני גב, יושב יערות אלונים ושפכי נהרות, שנוטה לחטט בעלי הכותרת יותר מאשר להתגרות בריב. כשהוא לכוד, הוא הופך ליצור אחר לגמרי, כולו כתפיים וניבים מושפלים. חוטבי עצים לומדים מוקדם להרחיק ככל האפשר חזירה רוטנת ולעולם לא לעמוד בינה ובין גוריה.
- id: bone-devil
  flavor: >-
    שטן עצמות הוא בן-תופת גבוה ומשוריין קוצים בחצרות תופתיות מסודרות, שם הדרגה נמדדת באורך הקוצים ובניקיון הקר של החוזים. הוא יצור של עסקאות מדויקות, ונהנה לראות בן תמותה מבין מאוחר מדי איזה סעיף חתם עליו. סבלנותו נוראה, וזנבו הקוצני, שבו הוא משתמש כשוט, כמעט אף פעם לא מחטיא את הנקודה.
- id: brass-dragon-wyrmling
  flavor: >-
    גור הדרקון מפליז חי בארץ חמה ופתוחה ומדבר יותר ממה שרוב הדרקונים היו רואים בו נימוס. הוא אוהב סיפורים, שירים ואת קול עצמו הנישא מעל דיונה, ויחליף סיפור תמורת סיפור בלי שום מהומה על מי חייב למי. נוסעים שפוגשים אחד כזה יוצאים בדרך כלל עם הוראות דרך, בדיחה וריח קלוש של מתכת חמה.
- id: bronze-dragon-wyrmling
  flavor: >-
    גור הדרקון מארד מבלה בחופים ובנהרות ירוקים ואיטיים, ושומר על כפרי דייגים שהחליט להגן עליהם. הוא לוקח את חובותיו ברצינות, אולי ברצינות רבה מדי, וידוע שריחף מעל נמל במשך בוקר אפור וארוך בלי לומר מילה. מלחים אומרים שסבלנותו היא הסיבה היחידה שחלק מהסירות חוזרות, וזה מבחינת הדרקון הסדר סביר לחלוטין.
- id: brown-bear
  flavor: >-
    דוב חום הוא נודד רחב כתפיים של יערות הרים ושל אחו גבוהים, שמתנהל בין שיחי פירות יער באווירה של חיה שמעולם לא מיהרה לשום מקום. רובם מעדיפים שיעזבו אותם במנוחה, ורובם ייענו לנוסע שמרעיש מספיק כדי שישימו לב אליו. אמהות עם גורים הן עניין אחר לגמרי, והנבונים נותנים להן מרחב רב.
- id: bugbear-stalker
  flavor: >-
    הבאגבר העוקב הוא החבר השקט במשפחה שעירה ורעת מזג, צייד שמעדיף את שולי הנתיב המוצלים על פני הדרך הפתוחה. הוא לומד את הרגלי טרפו עוד לפני שהוא מראה את עצמו, ושלליו שמורים בשורות מסודרות שמפחידות גם את בני דודיו. עוקבים בשפלה מדברים עליו בלחש, כאילו דיבור בקול רם עלול להחזיר אותו.
- id: bugbear-warrior
  flavor: >-
    הבאגבר הלוחם הוא הגרסה הרועשת והקדמית של בני משפחתו, בנוי כחבית עם זרועות שמתאימות לה. הוא אוהב צעקה טובה לפני קרב וארוחה טובה אחריו, ואין לו סבלנות למי שקורא לו איטי. הלוחמים מסוגו שומרים על קוד גס משלהם, שעוסק בעיקר בשאלה מי מקבל את החלק הגדול ביותר מכל מה שנלקח.
