- id: ogre
  flavor: >-
    האוג׳ר המקומי הוא מסוג השכנים שמשאילים עגלה ומחזירים רק את הגלגלים. הוא רועש, חמדן וקל להעליבו, ולכן הוא בחירה גרועה לכל ויכוח על הכיכר האחרונה. הוא סוחב על כתף אחת אלה גדולה וקשרית ועל השנייה צרור רומחים, ומאמין בנחישות שכל דבר ראוי אפשר לנצח בצעקות חזקות יותר.
- id: ogre-zombie
  flavor: >-
    קשה להרוג אוג׳רים, והזומבי שלהם הפך את הקושי הזה לגאווה קודרת. בשרו מדלדל מגוף ענק ומתנודד, ובכל זאת הוא ממשיך לגרור אלה זמן רב אחרי שהשכל אבד. מי שראו אותו קם אחרי מכה קטלנית מספרים שהענק המת נראה כמעט נבוך, כאילו שכח איך שוכבים.
- id: oni
  flavor: >-
    בעל קרניים ורחב כתפיים, האוני מנהל פנקס קפדני של חובות ועונשים, וגובה את שניהם בחיוך. הוא מחלים מפצעים שהיו מפילים יצור קטן ממנו, והוא תלוי באוויר בקלות שבה הוא הולך. שליטים ושופטים מצאו אותו שימושי, אבל מי ששוכר אחד צריך לצפות שהחשבון ישולם במלואו, בסופו של דבר.
- id: otyugh
  flavor: >-
    אין דבר אמין יותר בביוב מיצור שמעדיף רקב על לחם טרי, והאוטיג הוא הדוגמה השלטת. גופו הגדול יושב בערימות פסולת, וזרועותיו מנפות את שאריות העיר שמעליו. הוא מדבר רק במחשבות שנלחצות לתוך מוחם של המאזינים הקרובים, בדרך כלל בטרוניה על ריח המאורה שלו עצמו.
- id: owl
  flavor: >-
    כשהוא יושב בחלל של אלון, הינשוף צופה בשביל בדממה שמערערת גם את איכר הנועז ביותר. כנפיו כמעט שאינן משמיעות קול, ולכן עכבר אינו יודע שראו אותו עד שהטפרים נסגרים. יש בציפור הזאת כבוד שקט, והיא מרוצה להשאיר את שאר העולם ליצורים רעשניים יותר.
- id: owlbear
  flavor: >-
    ציידים ביערות הגבוהים נותנים לדוב-ינשוף מרחב רחב, כי גופו של דוב ומזגו גרוע יותר. ראשו הינשופי מסתובב בצעקת יללה פגועה בכל פעם שמשהו חודר לטריטוריה שלו. הוא כמעט אינו צד לשעשוע, אך יקרע גדר בלי לעצור לבדוק מי מאחוריה.
- id: panther
  flavor: >-
    הפנתר הוא הצל שזז כשאיש אינו מסתכל, חומק בין קנים ועולה על גזעים כמעט בלי רשרוש. הוא צד בקצה המחנה ונעלם לפני שהפנס מוצא אותו. לדברי הלוכדים, פרוותו בצבע צפחה רטובה, ואף פעם לא בזבז צעד.
- id: pegasus
  flavor: >-
    בעל כנפיים לבנות ועדין, הפגסוס הוא מסוג היצורים שכותבים עליהם שירים, דבר שמביך אותו קלות. הוא יישא ילד אבוד הביתה מעבר לנהר או אביר פצוע מזירת קרב, ולא יבקש בתמורה אלא מילה רכה. פרוותו נוצצת באור הבוקר, וכמעט אינו מרשה לאיש לגעת בעורפו בלי שהרוויח קודם את האמון הזה.
- id: phase-spider
  flavor: >-
    יש עכבישים שאורגים רשתות, אבל עכביש המעבר אורג את עצמו אל מחוץ לעולם הרגיל. הוא חומק בין המוצק לבלתי נראה, מופיע על תקרה רק כדי להימוג אל הסלע רגע אחר כך. ציידים שעקבו אחר עקבותיו מדווחים שהשביל פשוט נפסק, כאילו העכביש החליט שהחדר אינו שווה עוד את הטרחה.
- id: piranha
  flavor: >-
    פיראנה אחת בקושי שווה מבט שני, אבל הנהר כמעט אף פעם לא שולח רק אחת. הן נעות בהמון כסוף ונוצץ, ופונות לשכשוך במהירות שגורמת לילדים הצולים במים לצאת מהר מאוד. דייגים למדו שפיסת בשר ישן מושכת אותן מהר, והלקח הזה עדיף שיילמד מהגדה.
