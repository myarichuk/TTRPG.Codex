- id: ghost
  flavor: >-
    רוחו של מי שמת עם עניינים לא גמורים. רוח הרפאים נסחפת דרך קירות ורצפות כאילו היו וילונות. היא זוכרת מעט מחייה, אבל היא זוכרת בדיוק מי עשה לה עוול, וממשיכה לחזור כדי לומר לו זאת בקול כמו רוח קרה. מי שמבקש ממנה בנימוס לספר את סיפורה זוכה לפעמים למילה טובה יותר, אף שהרוח רחוקה מלהיות בדרך כלל במצב רוח נדיב.
- id: ghoul
  flavor: >-
    הגול הוא דבר מת ורעב שמשוטט בשדות קרב עתיקים ובקברים בודדים וגורד באדמה בחיפוש אחר ארוחה. הטפרים שלו ארוכים דיים כדי לתפוס עמוד גדר, ובנשיכתו יש מתיקות חולנית שנדבקת לגרון. שומרי שיירות לומדים מוקדם שהגול מסוכן ביותר כשהוא מעמיד פני נוסע ישן על הדרך.
- id: giant-ape
  flavor: >-
    גבוה מדלת אסם ובנוי כמו מפולת, קוף האדם הענק מעדיף צוק שקט על פני קרב, אף שהוא נלחם כשמתגרים בו. רועי ההרים משאירים אותו במנוחה והוא משיב להם טובה, וחולק איתם מדף של פירות בר בשתיקה עליזה. מי שמרגיז אותו לומד שהוא יכול להטיל סלע מעבר לעמק בדיוק מפתיע ובחוש הומור חד להפתיע.
- id: giant-badger
  flavor: >-
    גירית בגודל של כלב גדול, שחופרת מנהרות מתחת לגדרות חיות ורואה בכל מחילה שהיא מוצאת עלבון אישי. האיכרים מתלוננים על החורים, אבל הם מתלוננים בשקט יותר אחרי שראו אותה מבריחה שועל בחזרה מעבר לשדה. מזגה קצר, לסתותיה חזקות, ואיש עוד לא שכנע אותה לוותר על ארוחה.
- id: giant-bat
  flavor: >-
    גדול כמו כלב ציד וכמעט שקט כמוהו, העטלף הענק לן במערות ונותן להדים שלו לעשות את ההסתכלות במקומו. כורים לומדים להקשיב לציוץ הקלוש שקודם לכנפיים, ולומדים להשאיר את המנורות דולקות במעברים עמוקים. הוא אינו צייד להוט, אבל עטלף רעב במנהרה חשוכה יכול להיות נועז להפתיע.
- id: giant-boar
  flavor: >-
    חזיר בר בגודל של סוס עגלה. החזיר הענק דוהר בראש מושפל ובניבים מוכנים להעיף הצידה כל מה שבדרכו. זעמו גובר ככל שהוא מדמם, ולכן חזיר פצוע מסוכן יותר מכל חזיר בריא, עובדה שציידים לומדים בדרך הקשה. הכפריים זורעים את שדותיהם בצדו הרחוק של היער ומשאירים את הביצה לחזירים.
- id: giant-centipede
  flavor: >-
    צייד מפולח באורך זרועו של אדם גבוה. מרבה הרגליים הענק חי מתחת לגזעים רקובים ובסדקים של חומות ישנות. הוא מהיר יותר משהוא נראה, וצולל על הרצפות ועל הקירות בשקשוק רגליים כמו של עלים יבשים שנישאים ברוח לאורך שביל. נשיכתו משאירה כאב חד ומתמשך, והנוסע הזהיר מנער את מגפיו ואת מצעיו לפני שהוא פורש לישון.
- id: giant-constrictor-snake
  flavor: >-
    נחש עבה כחבית וסבלני כגבעה ישנה. החונק הענק מחכה בקנים שליד הנהר עד שמשהו חם עובר לידו. ברגע שלולייניו נסגרים הוא אינו ממהר; הוא פשוט מהדק, נשימה אחר נשימה, עד שלטרפו לא נשאר דבר להיאבק בו. אנשי הנהר מספרים לילדיהם שמי שרואה קשקשים חיוורים על הבוץ צריך ללכת הביתה בדרך הארוכה.
- id: giant-crab
  flavor: >-
    סרטן ברוחב שולחן אוכל, שחי בבריכות גאות ובמפרצים רדודים וממתין שם קבור למחצה בחול לרשת רשלנית. דייגים מתקנים את רשתותיהם בזהירות ליד הסלעים, שכן סרטן שאוחז ברגל לעתים רחוקות מרפה לפני שהגאות מתהפכת. שריונו משמש שריון יפה, ולכן לנפחים המקומיים יש עניין שקט בכל סרטן שמשוטט אל המים הרדודים.
- id: giant-crocodile
  flavor: >-
    תנין גדול דיו לטרוף סוס בנגיסה אחת. התנין הענק שולט במקטעים האיטיים של הביצה ואינו סובל דבר שצף. הוא יכול לשכב ללא תנועה מתחת לבוץ זמן רב יותר מסבלנותו של דייג, ואז לפרוץ בפרץ של התזה ושרירים. הכפריים חותרים בסירותיהם בזוגות ולעולם אינם משלשלים יד במים, לקח שהנהר מלמד לעתים קרובות מספיק.
