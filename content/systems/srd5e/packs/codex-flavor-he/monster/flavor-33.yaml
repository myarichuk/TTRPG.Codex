- id: white-dragon-wyrmling
  flavor: >-
    גור דרקון לבן הוא יצור צעיר ורברבן, גאה בקשקשיו החיוורים ולהוט להוכיח שהם קשים יותר ממה שהם נראים. הוא אוהב קרחונים, אגמי טונדרה ואת השלג המקרים שמשתרע על פני מעבר צפוני. נשיפת הקור שלו מרושעת יותר משהיא תכליתית, והוא די אוהב להקפיא כל דבר שמרגיז אותו קצת.
- id: wight
  flavor: >-
    הוייט היה פעם אדם עם שם, טינה ושליחות שלא הושלמה, והטינה היא שהחזיקה אותו על רגליו. הוא עדיין לובש שריון עור מסומר, ונושא חרב וקשת בסבלנות קברים של זקיף ששכח את המלחמה. מגעו גונב חום וכוח מן החיים, והוא שונא את השמש מסיבות שהוא כבר לא זוכר.
- id: will-o-wisp
  flavor: >-
    האור הזה מתנודד מעל ביצות ואדמות רטובות, מהבהב ומקפץ כאילו יש לו לאן ללכת ואין לו שום כוונה להגיע. מטיילים שהולכים אחריו נוטים להתחרט על סקרנותם, וזה בדיוק העניין. אנשי הביצה הוותיקים משאירים על הבוץ מנחות קטנות כדי לפייס אותו, אף שאיש לא הצליח להוכיח שהמנחות עוזרות במשהו.
- id: winter-wolf
  flavor: >-
    זאב החורף הוא צייד גדול וחלק פרווה לבנה, שרואה בשדות השלג את המטבח הפרטי שלו. נשימתו מגיעה קודם כערפל קר ואחר כך כמשהו גרוע ממנו, סוחפת קרחת יער ומשאירה את העשב נוקשה וכסוף. ענקים ידועים כמי שמחזיקים יצורים אלה ככלבי ציד, וזה אומר הרבה מאוד על הענקים.
- id: wolf
  flavor: >-
    הציידים האפורים של ארץ האורנים הגבוהה נעים במשפחות שחולקות פנקס אחד של טינות ותיאבון אחד. יללתם נישאת מעבר לעמקים קפואים הרבה לפני שמטייל רואה את הצללים בין הגזעים. רועים בעמקים הישנים אומרים שהלהקה תמיד יודעת איזה טלה חלש ביותר, ורק לעתים רחוקות היא טועה.
- id: worg
  flavor: >-
    הורגים הם זאבים שלימדו אותם להקשיב, וזה גרוע יותר מזאב שרק צד. בני גובלינים רוכבים עליהם אל השקעים הרטובים של היער, ונדמה שהחיות נהנות מחברת האכזריות של אדוניהן. עיניהם זוהרות באור יודע ומחמיץ כשמטייל סוטה קרוב מדי למדורה.
- id: wraith
  flavor: >-
    רוח מוות היא מה שנשאר כשטינה שורדת את הגוף שאליו הייתה קשורה. היא נסחפת דרך קירות וחדרי שינה כאילו היו וילונות כבדים, ומשאירה אחריה משב קר וטעם קלוש של ברזל. מנהגי הקבורה העתיקים של כמה עיירות הרים קיימים בעיקר כדי להשקיט את הרוחות האלה, ולא תמיד הם מצליחים.
- id: wyvern
  flavor: >-
    הוויברן הוא דרקון כמו שהשועל הוא זאב: שאפתנות קטנה יותר, תיאבון חד יותר. הוא צד מצוקים גבוהים, צונח על עזים ועל מטיילים בקול נפנוף של כנפיים עוריות וזנב שמסתיים בעוקץ דוקרני. ארסו משאיר את הקורבן איטי לזמן מה, וזה בדרך כלל כל הזמן שהוויברן צריך.
- id: xorn
  flavor: >-
    הזורן נע דרך אבן מוצקה כמו שחיין באגם חמים, והסלע שמאחוריו נשאר שלם. כורים ששומעים נקישה רכה בקירות לומדים מהר להניח את הזהב שלהם במקום אחר. יש לו פה מלא שיניים ואפס עניין להסביר את עצמו.
- id: young-black-dragon
  flavor: >-
    הדרקון השחור הצעיר השתקע בביצה שמימיה בטעם חלודה והקנים בה חיוורים. קשקשיו מבריקים כצפחה רטובה, והוא למד שביצה סבלנית היא מזווה שלעולם אינו מתרוקן. מטיילים שנכנסים למים בלי להיזהר חוזרים לפעמים בדמות סיפורים שהצפרדעים מספרות.
