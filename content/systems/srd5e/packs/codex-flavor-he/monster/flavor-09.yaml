- id: death-dog
  flavor: >-
    כלב מוות נראה כמו צייד כחוש ושעיר עד שלסתותיו נפערות וריח של ריקבון ישן מתגלגל החוצה. הצמד הזה רץ יחד בגבעות השחורות ומקיף את מחנהו של מטייל, עד שאחד מהם זורק את עצמו קדימה והשני נושך מהצד. זאבים ורועים כאחד נותנים להם מרחק רב, כי נשיכה אחת מהם משאירה פצע שאינו נסגר לגמרי.
- id: deer
  flavor: >-
    צבאים נעים בשולי היער בחן שגורם להם להיראות כמעט כצפים, ומניפים את זנבותיהם הלבנים בסימן הסכנה הראשון. רובם מעדיפים לברוח מלהילחם, אך אייל מבוהל ישפיל את ראשו וינגח כל מה שחוסם את דרכו. כפריים בהרים מגלפים מעצמותיהם מחטים ומעורם כפפות רכות, ועדיין משאירים את הזקנים בשקט.
- id: deva
  flavor: >-
    דווה יורדת מהשמיים בכנפיים כמו מפרשים מקופלים ובאור שגורם לצללים להתכווץ מדרכה. השליחים האלה מאמצים את מטרתם של העשוקים ונושאים אלה שמצלצלת כמו פעמון כשהיא פוגעת. מי שנלחמו בדווה אומרים לא פעם שזה היה פחות קרב ויותר חשבון נפש, ושהיצור נראה מצטער על כל מכה שנאלץ להנחית.
- id: dire-wolf
  flavor: >-
    זאב האימים הוא מה שקורה כשזאב רגיל גדל יותר מדי בשביל הסיפורים שמספרים עליו ואז מתחיל לעמוד בהם. הלהקה שלו נעה כיצור אחד על פני השלג ומובילה מטיילים אל העיקול בדרך שבו מחכה המארב. אמהות בעמקי הצפון תולות פעמונים על השערים עם רדת החשכה, והפעמונים מצלצלים חזק יותר מכל קרן ציידים.
- id: djinni
  flavor: >-
    ג׳יני הוא רוח של אוויר נע, שאינו כפוף לאדון מלבד שעשועיו שלו, והוא יכול להיות נדיב או אכזר לפי חוכמתו של מי שפונה אליו. הוא מגיע ברוח פתאומית שמגביהה חול לעמודים מסתובבים ומשאירה סוחרים אוחזים בכובעיהם. סוחרים ותיקים עדיין מתמקחים עם השמיים על טובה, ומדברים בזהירות, כי הבטחה שניתנה לג׳יני נשכחת ממנו לעתים נדירות.
- id: doppelganger
  flavor: >-
    דופלגנגר לובש את פניהם של אנשים שפגש, ולובש אותם היטב עד שחברים הם לעתים האחרונים להבחין בהבדל. הוא מעדיף ללמוד את קורבנותיו זמן רב לפני שהוא נכנס לתמונה, ולומד את הרגליהם ואת פחדיהם עד שהוא מסוגל לדבר בקולם. כשהוא נחשף, צורתו האמיתית היא יצור חיוור וחלק גפיים עם עיניים שנדמה שאינן ממצמצות לעולם.
- id: draft-horse
  flavor: >-
    סוסי משא הם בעלי חיים רחבים וסבלניים שגודלו כדי למשוך מה שישבור חיה פחותה מהם. פרסותיהם כבדות מספיק כדי לטלטל ציר של עגלה כשהם רומסים, ויש להם מזג שליו שסובל כמעט הכול מלבד צעקות גסות. איכרים בכפרי השפלה אומרים לא פעם שסוס משא טוב חורש שדה בחצי מהזמן שהעגלון מבלה בלהתלונן.
- id: dragon-turtle
  flavor: >-
    צב הדרקון נושא על גבו הר של שריון מכוסה צדפות, ומלחים שטועים בו כאי נוטים להצטער על הנחיתה. נשיפתו היא ענן קיטור לוהט שמסוגל לקלף צבע מקורת ספינה, ולסתותיו יכולות לפצל סירת משוטים לשניים. אנשי הים מספרים על ערים שנבנו על עצמות אבותיו, אף שאיש מעולם לא מצא את הערים.
- id: dretch
  flavor: >-
    דרץ׳ הוא בן-תופת קטן ובעל כרס, עם עור אפור וצחנה שמגיעה הרבה לפניו. היצורים האלה משרתים כל אדון אכזר שיקבל אותם, בדרך כלל כמלקטי פסולת, כצופים או כטרדנים שאיש אינו מצליח להיפטר מהם. הם ממלמלים זה לזה בדיבור מחשבתי משותף שנשמע גם לאוזניים סמוכות, וצוחקים כשמישהו נחנק.
- id: drider
  flavor: >-
    חצי עכביש וחצי משהו שפעם הלך זקוף, הדריידר הוא יצור מר עם טינה עזה כלפי העולם שיצר אותו. גופו התחתון מזדחל על תקרות וקירות בקלות מטרידה, ומבטו נוטה להתעכב על כל מי שפעם הסתכל עליו מלמעלה. מערות וחורבות אפלות הן ביתו האהוב, והוא נמנע מהשמש כאילו האור עצמו הוא עלבון.
