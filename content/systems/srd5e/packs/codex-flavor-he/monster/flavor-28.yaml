- id: stone-golem
  flavor: >-
    גולם אבן הוא שומר מגולף מגרניט ואותיות רונים, שנוצר כדי לשמור על צורה אחת ולמלא את דברי יוצרו עד האות האחרונה. רוב הלחשים שמופנים אליו נשמטים מעליו כמו גשם, ואגרופיו הכבדים פוגעים בכוח שמבקיע אבן ועצם כאחת. צעדיו האיטיים והכבדים נשמעים הרבה לפני בואו, ומילת פקודה אחת מספיקה כדי לעצור אותו או לשלוח אותו לנדוד.
- id: storm-giant
  flavor: >-
    ענקי סערה מקימים אולמות על צוקי ים וקוראים את מזג האוויר הקרב בעננים בקלות שבה אחרים קוראים מכתב. חרבותיהם מתיזות ברקים, ומחץ אחד מסוגל להכות אויב מרוחק ולהשאיר אותו המום, ולכן רוב אנשי הים נותנים לחוף שלהם מרחב רחב. ובכל זאת הם נדיבים כלפי סוחרים ישרים, וענק סערה יכול להיות ידיד נאמן לכל ספינה שמכבדת את הים.
- id: succubus
  flavor: >-
    סוקובוס הוא בן-תופת שנושא פנים יפות כדי לזכות באמון, ויכול ללבוש צורה צנועה יותר כשנמאס לו מההערצה. קולו רך ומגעו צורב, ומי שהוקסמו על ידיו עלולים לגלות שכוחם נשחק עם כל הבטחה שנלחשה. מי שרואים מבעד לחיוך בורחים לרוב עוד לפני שהם מגלים מה הוא רוצה מהם.
- id: swarm-of-bats
  flavor: >-
    נחיל עטלפים הוא ענן רותח של כנפיים ושיני מחט, שנשפך מפי מערה עם רדת הערב וחוסם לרגע את הירח. אף עטלף בודד אינו מפחיד במיוחד, אבל מאה מהם יכולים להשאיר נוסע פצוע וכושל בתוך רגעים, ולכן הנבונים משאירים את הלפידים דולקים ואת ראשם מכוסה.
- id: swarm-of-crawling-claws
  flavor: >-
    שפע של אצבעות כרותות וידיים רצות מתקבץ במסדרון של קריפטה, גורר את עצמו לאורך קירות ותקרות כגוש אחד חסר מנוחה. אין לו רצון משלו שמישהו הצליח לקרוא, רק רעב לתפוס, לאחוז ולמשוך מטה כל מה שמתקרב. מלומדים קרים אומרים שאלה שרידיהם של מאה שודדי קברים קטנים, שכל אחד מהם עדיין מושיט יד לעוד חופן אדמה.
- id: swarm-of-insects
  flavor: >-
    חיפושיות, קרדיות וצרעות נעות כגל חום אחד בין סבך קנים, וזמזומם נישא רחוק מכפי שהיה צריך. כל חרק חלש לבדו, אבל יחד הם מכסים נוסע בתוך רגעים ומוצאים כל חריץ בשריון. ציידי פרוות לומדים ללכת לאט, לנשום דרך בד ולא להתעכב ליד בול עץ רקוב.
- id: swarm-of-piranhas
  flavor: >-
    הבהוב של קשקשי כסף הופך נהר איטי לבריכה רותחת, כשלהקת דגים זעירים נסגרת על כל מה שמתיז מים בשוליה. הנחיל נע כיצור אחד רעב, חולף בין העשבים ולאורך שורשי העצים הטבועים. אנשי הנהר אומרים שהמים משתתקים רגע לפני שהנשיכות מתחילות, והחכמים מרחיקים את ידיהם מהזרם.
- id: swarm-of-rats
  flavor: >-
    גל אפור ורוחש של עכברושים נשפך ממרתף שקרס, מטפס זה על גב זה בשטיח נע של פרווה ושיניים. לבדו היה כל עכברוש נמלט מפני עקב מגף, אבל דחוסים יחד הם דוחקים קדימה וממלאים כל פינה שהם מגיעים אליה. למנהלי המרתפים בעיירות הישנות יש אמרה: עכברוש אחד הוא מטרד, ומאה הם חשבון נפש.
- id: swarm-of-ravens
  flavor: >-
    ענן שחור של עורבים קורע את הדרך מעל ביצה, וקול כנפיים רבות והמולה צורמת של קריאות עולים ממנו כמו פעמון אזהרה. כל ציפור פיקחת דיה לחטוף אבזם גלימה או טבעת נוצצת מנוסע רשלן, והנחיל נע כמוח אחד. הרועים אומרים שהקול לבדו מספיק כדי לגרום לאדם לאבד את יציבותו, ולכן הם נועלים את דלתותיהם כשהשמיים מחשיכים.
- id: swarm-of-venomous-snakes
  flavor: >-
    עשרות נחשים מפוספסים מתכרכמים לגוש מתנחש, חולפים בין קנים ועל מדרגות שקועות בלחישה יבשה שאינה פוסקת לגמרי. הנחיל פוגע כאחד, וכל ניב קטן מטפטף ארס שצורב בדמו של כל מי שעומד במקום זמן רב מדי. מוכרי עשבים בעיירות הביצה מוכרים קמעות נגדם, אף שאיש מעולם לא הוכיח שהם עובדים.
