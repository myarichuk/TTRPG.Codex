- id: tarrasque
  flavor: >-
    הר משוריין של חיה מתנשא מתוך הגבעות, עורו המצולע חרוץ כצפחה ישנה ולסתותיו פעורות דיו לבלוע עגלה שלמה. קסם מחליק מעל שריונו, ושאגתו יכולה להשכיב שורה שלמה של חיילים עוד לפני שהגיעו לחומה. חוקרים שעיינו בעצמותיהם של יצורים כאלה אומרים שהדבר אינו מת באמת, אלא רק מסרב להישאר מת.
- id: tiger
  flavor: >-
    צייד מפוספס חולף בעשב הגבוה בלי קול, עיניו הענבריות נעוצות בעדר בקצה אחו הנהר. הנמרים הם ארבים סבלניים, שממתינים לצעד מועד או לפרט בודד שנשאר מאחור, ואז מכים במכה כבדה אחת שמטה את הטרף מיציבותו. משהתבצע ההרג, החתול חומק בחזרה אל צללי הסבך, והעדר לעולם אינו יודע מה לקח את אחד משלו.
- id: tough
  flavor: >-
    בכל עיירת שיירות יש כמה כאלה: גברים ונשים בעור מרופט ששומרים על הדרך תמורת כסף ולא שואלים יותר מדי שאלות. הבריון נושא אלה לקרב צמוד וקשת צולבת כבדה לצדה השני של העגלה, והוא נלחם הכי טוב לצד חברים. הם אינם אכזריים בדרך כלל, אבל הם בהחלט לא רכים, ונאמנותם נמשכת בדיוק כל עוד המשכורת מגיעה.
- id: tough-boss
  flavor: >-
    ראש חבורה גסה לובש שריון שרשראות שראה קרבות רבים ונושא פטיש מלחמה עבה מחריצים ישנים. הוא מכוון את אנשיו בצעקות קצרות ובסימני יד, כך שהם נלחמים כיחידה אחת וסוגרים פערים לפני שאויב יספיק לברוח. מי ששרד פגישה איתו אומר שהקשת הצולבת שלו יציבה כמו שזעמו קצר.
- id: treant
  flavor: >-
    עץ עתיק מתנשא גבוה מאולם כפר, קליפתו עמוקה מרוב טחב וענפיו רוחשים בקולות היער. שומרים כאלה מתעוררים לכעס לאט, אך משהתעוררו הם יכולים לקרוא מן האדמה עצים צעירים שילחמו לצדם. אנשי היער מניחים מתנות קטנות בשורשיו ומדברים בשקט, כי מעט דברים בחורשה עתיקים או סבלניים ממנו.
- id: triceratops
  flavor: >-
    אוכל עשב גדול וקרני משתרך בין מישורי השרכים, וצווארון העצם שלו מקשקש כשהוא מנמיך שלוש קרני מצח ארוכות לעבר כל מי שמעז לחצות את דרכו. הוא אינו צייד, אבל יצור במשקל כזה לא באמת צריך להיות. חיות קטנות ממנו נסוגות הצידה בזהירות קלה, והשוורים הוותיקים יסתערו על כל מה שניצב בינם לבין המים.
- id: troll
  flavor: >-
    אכזר אפור ענק מסתובב בין המעברים והגשרים, זרועותיו הארוכות כמעט נוגעות בברכיו ופצעיו נסגרים עוד בזמן שהם מדממים. הטרולים קהי חשיבה אך עיקשים, והם פוגשים קרב בשמחה של ילד בסעודה. מטיילים שפוגשים אחד נושאים לפידים וזפת, אף כי איש מהם אינו מסכים עם רעהו על מה שבאמת מסיים טרול.
- id: troll-limb
  flavor: >-
    זרוע כרותה, עדיין מגרדת באצבעות אפורות קהות, מתעוותת מעצמה בבוץ שבמאורת טרול. היא גוררת את עצמה לעבר הגוף החם הקרוב ביותר ומכה בכוח מפתיע, ובדרך היא מאחה את בשרה הקרוע. אם משאירים אותה לבד מספיק זמן היא עשויה לנבול, אבל המעטים חסרי המזל שראו אחת מתחדשת אומרים שהיא אינה מפסיקה לנסות באמת.
- id: tyrannosaurus-rex
  flavor: >-
    טורף ענק צועד אל מחוץ ליער השרכים, וגולגולתו העצומה מלאה בשיני פגיון ארוכות כאמת ידו של אדם. זרועותיו הקטנות חסרות תועלת לתפיסה, אבל לסתותיו וזנבו הכבד יכולים לנעוץ ולשבור כל מה שיבחר. עדרים מתפזרים למשמע הצעד הראשון הרועם, ואפילו שאר הזוחלים הגדולים מותירים לו מרחק רב.
- id: unicorn
  flavor: >-
    סוס לבן בעל קרן ספירלית עומד בשולי יער עלי כסף, פרוותו בהירה כל כך שנדמה כאילו היא זוהרת בדמדומים. יצורים כאלה נראים לעיתים נדירות ונגשים אליהם עוד פחות, שכן אומרים שהם בוחנים את לבם של הקרבים אליהם. מי שזוכה באמונם מגלה שהחד-קרן מדבר רק במחשבות עדינות, וישמור על מטייל פצוע באור נוצץ.
