- id: wereboar-hybrid
  flavor: >-
    הכלאיים הזה הולך זקוף על רגליים עבות ונושא את ראשו נמוך, ובלסתו שאינה נסגרת עד הסוף מתעקלים ניבים של חזיר בר. הוא בנוי לסערה קדימה, וזורק רומח באותה הנאה זעופה שבה הוא מסיר דלת מציריה בכתפו. בני הכפר אומרים שהצרות תמיד מגיעות בצורה הזו, ואת שאר הלילה מבלים בסידור הבלגן.
- id: wererat-human
  flavor: >-
    בפינה של הטברנה הוא נראה רגיל לגמרי, אבל איש-החולדה הזה מחזיק קשת יד מתחת למעיל ופנקס חובות בראש. נימוסיו מדויקים, כליו מחמירים עוד יותר, ונאמנותו שייכת למי ששילם בזמן. השכונה קוראת לו סוחר הגון, אך מי שעשו איתו עסקים יוצאים בדרך כלל עניים קצת יותר, ושקטים בהרבה.
- id: wererat-hybrid
  flavor: >-
    חצי אדם וחצי חולדה, לכלאיים הזה חוטם צר, שפם שרוטט למשמע ריח לא נכון וידיים זריזות שמוצאות כיסים לפני שבעליהם שמים לב. הוא נע על קצות האצבעות ומטפס על קירות כאילו הוא יוצא לטיול. כלאיים כאלה כמעט לא נראים בשמש, ואיש עדיין לא מצא דרך מנומסת לשאול למה.
- id: wererat-rat
  flavor: >-
    החולדה הזו גדולה מעט מאלה שבאסם, והיא ערמומית מהן בהרבה. היא חומקת למרתפים, לאורך הכרכובים ובין סדקי חומות ישנות, ומשאירה אחריה ריח קלוש של פחד ושל תבואה שנשפכה. מי שהבחינו בה ברגע הלא נכון נשבעים שעיניה השחורות והקטנות יודעות את שמם.
- id: weretiger-human
  flavor: >-
    איש-הנמר הזה שומר על עצמו ומעדיף קשת ארוכה על שיחה ארוכה. בכפר הוא צייד שקט עם פנים סבלניות ועין טובה, מהסוג שמבחין מי יוצא מהפונדק ומתי. הוא עונה לשאלות בנימוס ואינו מניח לאיש להתקרב מספיק כדי ללמוד לאן הוא הולך עם רדת הערב.
- id: weretiger-hybrid
  flavor: >-
    גבוה ממשקוף וחגור פסים כמו צרור צללים, הכלאיים נע בשקט שגורם לסובבים אותו להרגיש פתאום שמסתכלים עליהם. הוא יכול לטפס במדרון בלי להשמיע קול ואז לקפוא בתוך כתם עשב גבוה עד שכמעט שוכחים ממנו. החיוך של הנמר הוא הדבר האחרון שרבים מהמטיילים זוכרים, לפני שהם מגלים שהשביל שמאחוריהם ריק.
- id: weretiger-tiger
  flavor: >-
    בצורת נמר היצור הזה הוא דמות ארוכה של זהב ושחור המחליקה בין הקנים כמו עשן. כפותיו אינן משאירות עקבות בבוץ רטוב, וזנבו מתנופף רק כשהוא מרוצה, מה שקורה לעתים רחוקות. צדים שעוקבים אחריו מוצאים בדרך כלל רק חמימות קלושה על סלע והרגשה שמשהו עדיין צופה בהם.
- id: werewolf-human
  flavor: >-
    רוב הזמן איש-הזאב הזה נראה כמו נוסע חסר מנוח, קשת ארוכה על גבו והרגל להגיע בדיוק כשהאש נדלקת. הוא מתחבר לבני מינו וצד בזוגות, אחד מושך תשומת לב והשני תוקף מבין העצים. את עיניו קשה לקרוא, אבל הזאב שבתוכו אף פעם אינו רחוק מפני השטח.
- id: werewolf-hybrid
  flavor: >-
    הכלאיים עומד זקוף על שתי רגליים, מתנשא מעל רוב המשקופים ונושא את כתפיו כמו איל ברזל. פניו חצי זאב וחצי משהו סבלני וקודר, והקשת הארוכה שבידיו היא יותר נימוס מאשר העדפה. בסביבה נודף ריח של פרווה רטובה וברזל, והכלבים משתתקים כאילו נזכרו במשהו עתיק משמם.
- id: werewolf-wolf
  flavor: >-
    זה זאב במובן הישן של המילה, צנום ומהיר ובטוח בדרכו בין העצים. פרוותו אפורה מנומרת שנעלמת על רקע הקליפה, ויללתו נישאת מעבר לגבעות עוד לפני שהאור דעך. רועים ששומעים אותה סופרים לפעמים את הצאן פעמיים, והזאב, בתורו, סופר גם אותם.
