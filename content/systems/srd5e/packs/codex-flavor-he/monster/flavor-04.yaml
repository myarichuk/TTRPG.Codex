- id: archmage
  flavor: >-
    חכם שטיפס לפסגת המכללות הישנות ומאז מסרב לרדת. בספריית המגדל יש יותר ספרים משבעליה טרח אי פעם לספור. אורחים שמקישים בנימוס מקבלים כוס תה, אף שהתה הוא לעיתים נדירות הדבר המסוכן ביותר בחדר.
- id: assassin
  flavor: >-
    רוצח שכיר שמעדיף להישאר בלתי נראה עד הרגע שבו זה חשוב. מתנקשים עובדים למי שמשלם את השכר, ולא משאירים זכר לשיטותיהם מלבד להב מורעל. המוניטין שלהם כה קודר שבכל עיר נועלים את הדלתות עם רדת החשכה.
- id: awakened-shrub
  flavor: >-
    שיח שדרואיד חולף שכנע אותו לחשוב בעצמו, ומאז הוא לא מפסיק לרכל. הענפים שלו דקים והעלים מעטים, אבל הוא זוכר כל מילה טובה וכל בעיטה חסרת מחשבה. גננים שרוצים גדר חיה שקטה צריכים לשמור את מזמרות הגיזום שלהם לצמח אחר.
- id: awakened-tree
  flavor: >-
    אלון עתיק ששיר של דרואיד העיר אותו, והוא לא חזר לישון מאז. הגזע שלו חורק כמו דלת ברוח, והשורשים נגררים לאט על צלע הגבעה בזמן שהוא משוטט. כפרים לאורך דרכו מניחים לו מנחות של לחם טרי, בתקווה שימשיך ללכת.
- id: axe-beak
  flavor: >-
    עוף שאינו עף, בגודל סוס פוני, עם מקור שנראה כמו גרזן קטן. רועים לומדים מהר שרגליו הארוכות מותירות מאחור סוס דוהר, ושמזגו גרוע מתיאבונו. שיירות חונות הרחק מהקינים שלו, והנבונים שבהן קושרים את אוהליהם היטב.
- id: azer-sentinel
  flavor: >-
    שומר רחב גוף מלהבה חיה, חצוב ממשהו דמוי אבן שחורה ומואר מבפנים. בעליו מציבים אותו לשמור על כבשני הנפחות ועל אוצרותיהם, והוא אינו ממצמץ, אינו ישן ואינו מקבל שוחד. מי שמתקרב לעמדתו בכוונות עוינות ירגיש את החום לפני שיראה את הפטיש.
- id: baboon
  flavor: >-
    להקה של הפרימטים החכמים האלה נעה יחד, וכל חבר בה שומר על גבם של האחרים. הם רועשים, מהירים ומאורגנים הרבה יותר ממה שצופה מקרי מצפה. בבון בודד נראה לעיתים נדירות, ולכן רוב הסיפורים עליהם עוסקים בכנופיה שלמה.
- id: badger
  flavor: >-
    חופר עקשן עם פנים מפוספסות ומזג שמחזיק מעמד יותר מרוב הציידים. גיריות חופרות מחילות עמוקות מתחת לגדרות חיות ומגינות עליהן בעוז מפתיע. חקלאים מתלוננים על החורים שהן משאירות בשדות, ובכל זאת מעטים רוצים להסתכסך עם אחת מהן.
- id: balor
  flavor: >-
    עריץ מתנשא ובעל קרניים, עטוף להבות, ששוט האש שלו יכול לגרור אביר מהאוכף. גם כשהוא מושמד, אפרו מתכנס שוב בבור רחוק כלשהו וקם מחדש, גדול וזועם יותר מקודם. ראשי כת שמזמנים אחד כזה לא נשארים בחיים מספיק זמן כדי לנהל משא ומתן מחדש.
- id: bandit
  flavor: >-
    סוג זול של צרה שאפשר למצוא בדרכים שקטות, בדרך כלל לא לבד. שודדים רעבים לעיתים קרובות יותר משהם אכזריים, והם נוטים לברוח כשאיכר סביר מופיע עם פנס ושנאה. המיומנות הגדולה שלהם היא לגרום לפרד משא להיראות יקר ערך מכפי שהוא באמת.
