- id: giant-eagle
  flavor: >-
    ציפור גאה של הצוקים הגבוהים, שהעיט הענק משגיח בה על העמקים ולפעמים צונח כדי לעזור למי שנקלע לצרה. נוצותיו נוצצות באור זהוב קלוש, וקולו נישא מעל הגבעות כמו פעמון שלא שותק לגמרי. רועים שחולצו ממדף סלע מספרים את הסיפור בכבוד, וחלקם משאירים קערת חלב על הסלע כאות תודה.
- id: giant-elk
  flavor: >-
    קרניים רחבות מעגלה ופרווה בצבע שלג טרי: האייל הענק עובר ביער כמו הבטחה שקטה שמתקיימת. אנשי היער מדברים עליו בהערצה, ומי שפוגש אותו בקרחת יער מוצא לפעמים שדאגותיו קלות יותר זמן רב. הוא לא ישא רוכב ולא יניח לצוד אותו, והחכמים משאירים לו שביל ללכת בו בשלום.
- id: giant-fire-beetle
  flavor: >-
    חיפושית בגודל חתול, עם שני בלוטות זוהרות שמאפשרות לה לצוד במנהרות חשוכות בקלות כמו באור שמש מלא. כורים מעריכים אותן בגלל האור ופוחדים מהן בגלל החום, שהרי חיפושית שמרגישה לכודה נושכת ומשאירה כוויה קטנה. הזוהר שלהן יציב ועליז, ושומרי המנורות הוותיקים טוענים שהוא חברה טובה יותר ממרבית האנשים ששוכרים אותם.
- id: giant-frog
  flavor: >-
    צפרדע רחבה דיה למלא עגלת יד, שאורבת בביצות ובבריכות רדודות וממתינה לאייל רשלן שיתקרב מספיק כדי להיבלע. רועים מחזיקים כלבים קשורים בחבל קצר ליד המים, וילדים לומדים מוקדם שהתזה בקנים אינה תמיד דג. היא יושבת דוממת לגמרי עד שהיא מכה, ואז חוצה ביצה בקפיצה אחת.
- id: giant-goat
  flavor: >-
    עז עם קרניים כמו ברזל מסולסל ואופי של שור עיקש, שהעז הענקית היא בעלת המרעה הגבוה וכל מה שבו. רועים מורידים את עדריהם לעמק לפני השלגים הראשונים, כי העז שמחה לטפס על מצוק ולהשליך ממנו יריב. הנגיחה שלה היא מקור גאווה וחבורות, וידוע שהפילה סוחר נודד היישר מנתיב הררי.
- id: giant-hyena
  flavor: >-
    גדול מכל סוס עגלה, הצבוע הענק מתגורר בעשב היבש שבו חונות שיירות. צחוקו נישא רחוק יותר מצלו, ורועים לומדים לשמוע אותו לפני שהם רואים אותו. מרגע שהקורבן מדמם, החיה מתעוררת בזעם שמחזיר אותה אל הקרב.
- id: giant-lizard
  flavor: >-
    לטאה ענקית היא מטפסת סבלנית שנאחזת במצוקים ובחומות חרבות, ואצבעות הקשקשים שלה נתלות במשטחים שאף יצור שפוי לא היה סומך עליהם. מתיישבי מדבר שומרים עין ערנית על הבנייה אחרי רדת החשכה, כי הלטאה צדה מארב מלמעלה. זו חיה פשוטה שאין לה עניין בחידות, רק בארוחה החמה הקרובה ביותר.
- id: giant-octopus
  flavor: >-
    התמנון הענק חי במים הקרים והחשוכים שמתחת למצוקי ים ולשלדי ספינות, ושמונה זרועותיו עוטפות קיל של סירה בקלות כמו רגל של דייג. מלחים ששרדו מפגש מתארים קודם כול את הדיו, ענן שחור שהופך את הים לחדר עיוור. אנשי דיג משאירים בחוף מנחות של דג מלוח, שזה או כבוד או שוחד מעשי מאוד.
- id: giant-owl
  flavor: >-
    ינשוף ענק הוא שליח שמימי שנשאר ביערות עתיקים ובנקודות תצפית גבוהות, ומתבונן בעולם בסבלנות שנראית כמעט אדיבה. הוא לא מדבר אף שפה שמבקריו משתמשים בה, ובכל זאת מבין כל מילה שנאמרת מתחת לענף שלו, וידוע שהוא מכוון נוסעים תועים. קוסמי גדר במכללות הישנות אומרים שינשוף שיושב קרוב מודד את המאזין, ורק לעתים רחוקות הם טועים.
- id: giant-rat
  flavor: >-
    עכברוש ענק הוא בערך בגודל חתול גדול, עם זנב ארוך וחשוף והרגל לנוע בכנופיות דרך ביובים, מחסני תבואה ותחתית של גשרים ישנים. כל אחד לחוד הוא מטרד, ויחד הם הסיבה שדלתות מרתפים ננעלות. אנשי העיר אומרים לילדים שעכברוש שעוצר להסתכל עליך סופר דרכי מילוט.
