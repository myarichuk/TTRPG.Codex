- id: sea-hag
  flavor: >-
    מכשפות ים רודפות את המים הרדודים והקרים, במקום שבו סירות דיג נסחפות קרוב מדי לשוניות. עורן חלק וירוק, ופניהן מראות יופי רק למי שעוד לא הביט בהן היטב. מלחים שזיהו אחת מהן על פני המים מגלים בדרך כלל, מאוחר מדי, שהקול היפה שייך למשהו שרוצה לראות אותם טובעים.
- id: seahorse
  flavor: >-
    סוסי ים נסחפים ביערות האצות, זנבותיהם כרוכים היטב סביב עשב הים, ונראים כמו הדבר הכי פחות מאיים במים. גופם הקטן יודע לזנק בזרם מהר יותר ממה שגודלם מרמז, והם אינם יכולים לנשום בשום מקום מלבד מתחת לגלים. צוללנים שראו אחד מהם נאחז בשונית נשבעים לא פעם שהוא הביט בהם בחזרה.
- id: shadow
  flavor: >-
    צל הוא מה שנשאר כשהחום האחרון נעלם מאדם ורק קווי המתאר נותרו לשוטט. הוא מחליק לאורך קירות מרתפים ומתחת לדלתות, מחפש את הפינות העמומות שבהן האור ויתר, ואין לו תיאבון אלא לחיוניות. מי שהוא נוגע בו נשאר לעיתים רחוקות מי שהיה, ומשקי הבית הנבונים מדליקים את המנורות עד שעה מאוחרת.
- id: shambling-mound
  flavor: >-
    תל מתנועע הוא ערימה של ריקבון ועשב ביצה שלמדה ללכת, וריח האדמה הרטובה שלו מקדים אותו הרבה לפני שהוא נראה לעין. המחושים שלו מפצפצים מברק אגור מסערות שהוא שתה, ויצור שנתפס בחיבוקו נמשך לאט אל תוך המסה הספוגה. מי שחוצה ביצה אחרי סופת רעמים עושה טוב אם יביט בקנים לפני שידרוך עליהם.
- id: shield-guardian
  flavor: >-
    שומר מגן הוא יציר כפיים גבוה של לוחות מסומרים, שנבנה כדי לשמור על קבר או על כספת של קוסם כפרי. הוא נשמע רק לעונד הקמע הקשור אליו, וכשהאדם הזה נפגע הוא צועד פנימה בנצנוץ בהיר של כוח וסופג את המכה. המתכת שלו נשחקת לאט, ושומר מוכה יתפור את עצמו לא פעם מחדש בעוד הקרב נמשך.
- id: shrieker-fungus
  flavor: >-
    הצווחנית היא פטרייה סגולה ונמוכה הפורחת במערות לחות, ושם היא יושבת בסבלנות וממתינה שדבר מה בוהק או חי יתקרב. כשהיא חשה לפיד או נוסע חולף היא פותחת ביללה חודרת הנישאת במנהרות ומושכת כל יצור רעב בסביבה. אנשי המערות אומרים שהצווחה היא האזהרה הכנה היחידה בחושך, ורובם למדו ללכת על קצות האצבעות לידה.
- id: silver-dragon-wyrmling
  flavor: >-
    גור דרקון כסף הוא דרקון צעיר עם קשקשים כמו מטבעות מלוטשים, ולמרות שיניו החדות הוא סקרן יותר מאכזר. נשיפת הקור שלו יכולה להקפיא יצור במקומו, וקורבן מבולבל עלול להישאר חסר יכולת פעולה בעוד הגור מתעסק בשלל. האוצר הוא גאוותו הראשונה ומקור התלונות האהוב עליו, ולכן מבקרים בקן כסף עושים טוב לשמור את המטבעות בכיסים.
- id: skeleton
  flavor: >-
    שלד הוא המסגרת החשופה של מי שנקבר עם חרב, וכל תודעה שחיה בו שתקה מזמן. הוא מקרקש החוצה מגל קבורה או מקריפטה שקועה בקריאת נקרומנסר, ונושא להב חלוד וקשת בנאמנות רבה מהיגיון. החיוך שלו אינו משתנה, וזה החלק הכי פחות מטריד בפגישה עם אחד כזה בבית קברות חשוך.
- id: solar
  flavor: >-
    סולאר הוא שליח זוהר של השמיים העליונים, לוחם שחרבו הזהובה עפה מידו וחוזרת מעצמה. הוא שומע כל שקר שנאמר בטווח שמיעה, ויכול לקום שוב אחרי המוות בגוף חדש, אף על פי שרוב מי שפגשו אחד זוכרים רק את הזעם. קשתו עשויה אור ויכולה לפגוע מעבר לעמק, ולכן אין לסמוך על בריחה נקייה ממבטו.
- id: specter
  flavor: >-
    ספקטר הוא הצורה החיוורת והאבלה של אדם שרגעיו האחרונים עברו עליו בטינה מרה, והוא נסחף דרך אבן בקלות שבה עובר דרך וילון. אור שמש מחליש אותו, ובמקומות עמומים הוא נעשה נועז ושולח יד קרה שמנקזת חום וכוח מכל מי שהיא נוגעת בו. קורבנותיו מגלים לא פעם שמשהו יצא מהם בשקט ולא שב.
