- id: bandit-captain
  flavor: >-
    ראש חבורת שודדי דרכים, שדואג שהחשבונות יהיו ישרים והשלל נספר עד הפרוטה. הקפטנים נושאים אקדח וחרב מעוקלת, ומדפים מהלומות יותר משהם מתרברבים, וזה אומר משהו. סוחרים בדרך המסחר משלמים את המכס בלי להתווכח, אחרת הם משלמים מחיר גרוע יותר אחר כך.
- id: barbed-devil
  flavor: >-
    שטן בעל קרניים, שעורו הקוצני קורע כל מי שטיפש מספיק לאחוז בו. שטנים קוצניים סבלניים ולא פזיזים, ומעדיפים לנעוץ אסיר במקומו ולתת לקוצים לנהל את הוויכוח. מי שחוקר עניינים כאלה אומר שהם שמחים לחכות בזמן שהשבוי מתעייף מעצמו.
- id: basilisk
  flavor: >-
    צייד דמוי לטאה שמבטו הופך בשר חי לאבן אפורה וקרה. הוא מקים את מאורתו במרתפים חרבים ובבורות חצץ, שם עומדים בשורות שקטות פסלי האבן של קורבנותיו הקודמים. מי ששורד מפגש כזה מספר עליו רק על פני ארוחת ערב ארוכה.
- id: bat
  flavor: >-
    יונק קטן בעל כנפיים שתלוי הפוך במערות חשוכות וישן במשך שעות הבוקר המוארות. עטלפים מנווטים בעזרת צליל ומגע, ולכן הם כמעט אינם מתנגשים בשום דבר חשוב. נושאי הפנסים נוטים למצוא את הרפרוף שלהם מבהיל יותר מהנשיכה.
- id: bearded-devil
  flavor: >-
    בריון זיפני ומזוקן שנושא גלייב ארוך ותשוקה לפצעים שאינם נסגרים. שטנים מזוקנים מתאספים בחוליות ומתרגלים כמו חיילים על רחבת מסדרים עגומה. לפי המסורת שלהם, פצע ששווה להעניק הוא פצע שממשיך לכאוב הרבה אחרי שהקרב נגמר.
- id: behir
  flavor: >-
    נחש ארוך בעל רגליים רבות וחיבה לברק שמנצנץ לאורך קשקשיו. הוא מתפתל מעל צוקים ומעברי הרים, נופל על מטיילים וסוחט אותם עד שהאוויר עוזב את ריאותיהם. סיפורים ישנים אומרים שבמאורתו מצויים עצמותיהם של שיירות שלמות, אם כי את העצמות כמעט אף פעם לא סופרים.
- id: berserker
  flavor: >-
    לוחם שנלחם הכי טוב כשהקרב כבר הפך מכוער. ברסרקרים צובעים את פניהם ושרים שירי מלחמה לפני הקרב, ואז גוברים בעוז ככל שפצעיהם נפתחים. כפרים לאורך נהרות הצפון למדו לירא את החצוצרה שקוראת להם לקרב.
- id: black-bear
  flavor: >-
    מחפש מזון רחב גב שמטפס על עצים בקלות שבה הוא חוצה נחל. דובים שחורים מעדיפים פירות יער ודגים על פני קרב, אבל אם עם גוריה תגרום לכל מי שהתקרב להצטער על כך. מטיילים שפוגשים אחד מהם מוזהרים לדבר בקול רגוע, לסגת לאט ולשאת משהו רועש.
- id: black-dragon-wyrmling
  flavor: >-
    דרקון צעיר שהכריז על ביצה כשלו וכבר גאה מאוד בצחנה. קשקשיו בצבע צפחה רטובה, והוא יורק חומצה על כל מי שמפריע לארוחת הערב שלו. גורי דרקונים גדלים לאט, מה שנותן לאנשי הסביבה זמן רב לעבור למקום אחר.
- id: black-pudding
  flavor: >-
    ערימה מבריקה של ריר כהה ורועד, שמחליקה דרך ביבים וסדקי מרתפים. מגעו אוכל עור, ברזל ועץ כאחד, ולכן הרפתקנים שנלחמים באחד מהם נוטים לצאת עם ציוד מרוסק. כל מכה שנוחתת עליו עלולה לפצל אותו לשני פודינגים קטנים יותר, שכל אחד מהם רעב מקודמו.
