- id: jackal
  flavor: >-
    תנים מתגנבים בלהקות על פני אדמת שיחים, זריזים ופרועי פרווה, ועיניהם תמיד פקוחות לפיסת בשר שנשכחה או לטלה שתעה מהעדר. הם קטנים ונועזים, מתרוצצים במעגלים רפויים כדי לעייף את הטרף, ונדיר שהם אמיצים לבדם. רועי ההרים אומרים בלי הרבה התלהבות: תן אחד הוא מטרד, שניים הם הלוויה.
- id: killer-whale
  flavor: >-
    אורקות הן ציידות שחורות-לבנות וחלקלקות, המשוטטות בימים הקרים בקבוצות משפחה צפופות ונעות בדיוק שנראה כמעט מוכן מראש. מלחים בנתיבי הצפון מספרים על סנפיר גב החותך את הגלים, ורגעים אחר כך נשמעת חבטת זנב אדירה. דייגים ששומעים את קריאות הנקישה שלהן לומדים להוריד את הרשתות בשקט ולחתור לחוף.
- id: knight
  flavor: >-
    אבירים הם חיילים מקצועיים הנשבעים לדגלו של אדון, והטובים שבהם מתעניינים פחות בתהילה ויותר בחוזה נקי. השריון שלהם חורק בצעידה, ומגן מכוסה שקעים מספר על כל דו-קרב שנוצח. אדון נבון מחזיק אחד לצדו, אף שהאביר ישמח לקבל הצעה שנייה אם המעסיק הראשון יתברר כמשעמם.
- id: kobold-warrior
  flavor: >-
    קובולדים הם בני קשקשים קטנים המחשיבים את עצמם ליורשים הראויים של דרקונים עתיקים, והם שומרים על המנהרות שלהם במלכודות ערמומיות ובהשתפכות רמה. לוחם השבט נושא קומץ פגיונות לזריקה ונלחם בקהל, כי קובולד בודד מסולק בקלות. הם שונאים שמש בוהקת, שמכווצת להם את העיניים וגורמת להם לרטון, והם נשבעים בקול רם שהכול קנוניה.
- id: kraken
  flavor: >-
    הקראקן הוא אימת ים עצומה שגופה ההררי עולה אל פני המים רק לעתים נדירות, והמלחים שראו אחד מהם כמעט אינם חיים לתאר אותו כראוי. זרועותיו יכולות לגרור ספינה מתחת לגלים, והדיו השחור שהוא מפזר משאיר צוותים עיוורים ומתנודדים על הסיפון. חכמים חקרו את זרועותיו, אך אינם מצליחים להסכים אם החיה רעבה, כועסת או סתם סקרנית.
- id: lamia
  flavor: >-
    ללמיה יש פלג גוף עליון של אישה בעלת תווים עדינים ופלג גוף תחתון של נחש, והיא משתמשת בקולה החם כדי לשדל סודות מן הלא זהירים. טפריה חדים, ומגעה משאיר אימה חמוצה ומתמשכת שנדבקת לקורבן זמן רב אחרי שהסתיימה הסעודה. קוסמי גדרות מתווכחים מאות שנים אם אפשר לכפר על יצור כזה, והלמיה מוצאת את הוויכוח משעשע מאוד.
- id: lemure
  flavor: >-
    למורים הם קליפות חסרות דעת ומגשששות של נשמות ארורות, איטיות וקודרות, המשוטטות בשדות נוראים וממלמלות אל שלוליות של זוהמה. הם אינם יכולים לדבר, אך מבינים כל פקודה שנובחים עליהם, ולכן שדים קטנים וסוהרים מוצאים בהם שימוש רב. כל אחד נושא את החרטה האיטית שלו, והמתבונן הציני יציין שלמור כמעט אף פעם אינו מתעצב זמן רב.
- id: lich
  flavor: >-
    ליץ׳ הוא קוסם שהמיר את התמותה באחיזה בעולם, וקשה למצוא אחיזה חזקה מזו שהוא מחזיק בה. קולו יבש כמגילת קלף ישנה, והוא מדבר על יריבים קדומים בבוז משועשע של מי ששרד את כולם. מאורתו עמוסה בגופות רזרביות ובצנצנות המכילות שברי נשמה שאולי יצטרך אם גופו הנוכחי ייהרס.
- id: lion
  flavor: >-
    אריות הם חתולים גאים של המישורים הפתוחים, הצדים בקבוצות ושוכבים נמוך בעשב הגבוה עד שהעדר מתרשל. מנהיג הלהקה שואג כדי לגרום לטרף לברוח, ויתר המשפחה סוגרת עליו בכפות סבלניות ומיומנות. ציידי הארץ היבשה מעריצים את אומץ הבהמה, אך גם משגיחים בה בזהירות כשהרוח מתחלפת.
- id: lizard
  flavor: >-
    לטאה היא יצור קטן וסבלני המתחמם על אבנים חמות ומטפס על קירות בקלילות, בעל דם קר ברובו אדיש לעולם. ילדים תופסים אותן בכפות ידיים מקופלות, וחקלאים זקנים טוענים שלטאה על הקיר פירושה שמזג האוויר ישתפר. היא נצמדת לתקרות בלי מאמץ, והיא תנשוך אם לוחצים עליה, אף שהנשיכה כואבת לא יותר מצביטה.
