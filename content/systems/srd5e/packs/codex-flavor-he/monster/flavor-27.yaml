- id: sphinx-of-lore
  flavor: >-
    ספינקס הידע הוא אריה בעל כנפי ציפור וסבלנותו של ספרן, והוא מוכן להחליף חידות וסודות תמורת תשובה שמוצאת חן בעיניו. שאגתו יכולה להשאיר את הנוסע האמיץ ביותר מתנודד על רגליו, ואף עין מגלה עתידות ואף לחש הקסמה אינם מסוגלים לקרוא את מחשבותיו.

- id: sphinx-of-valor
  flavor: >-
    ספינקס האומץ, בעל גוף אריה וכנפי נשר, שומר על שערי שדות קרב עתיקים בשאגה שיכולה לפזר צבאות שלמים. טפריו יכולים לבקוע מגן במכה אחת, ומי שמבקש לעבור חייב קודם להוכיח את ערכו בקרב, או לשוב על עקבותיו בבושת פנים.

- id: sphinx-of-wonder
  flavor: >-
    ספינקס הפלא שובב ובעל גוף חתול, והוא אוהב מתנות פיקחיות ושמח לעזור למי שמצחיק אותו. המצאותיו ולחשיו הבהירים משתבשים לפעמים, והוא מהיר להוסיף מעט מזל למאמציו של חבר או להגן על בן לוויה מפני פגע.

- id: spider
  flavor: >-
    עכבישים מהסוג הזה הם ציידים הטווים רשתות משי על פני פרצות ביער ופתחי מערות, וממתינים ורגליהם קפוצות לצדם. הם נעים בתוך המשי שלהם בלי להיתפס, ומרגישים כל רעד ששולח הארוחה המפרפרת לאורך החוטים, ורעלם, אף שאינו חזק, משאיר את הטרף איטי דיו כדי לגרור אותו משם.

- id: spirit-naga
  flavor: >-
    נאגה רוח היא רוח הרפאים בעלת גוף הנחש של כושף שמכר את נשמתו למשהו אפל, ופניה האנושיים עדיין עוטים חיוך אכזרי קלות. היא שומרת על מקדשים הרוסים בשממה, וכל מי שטיפש דיו להפריע לה ימצא את נשיכתה ארסית ואת קרן הנקרוט שלה צוננת. אומרים שאפילו עצמותיה לוחשות סודות, אף שרוב מי ששומעים אותם אינם חיים מספיק זמן כדי לחזור עליהם.

- id: sprite
  flavor: >-
    ספרייטים הם בני פייה זעירים בעלי כנפי שפירית וידיים זריזות ושובבות, והם מרפרפים ביער בשליחויות שאיש אינו מבין עד הסוף. הם נושאים חרבות דקות כמחט וקשתות שיכולות לגרום לעובר אורח להתאהב בהם ללא תקנה לרגע, והם יכולים להיעלם מן העין מתי שהם רוצים. סקרנותם ללב של זר חדה דיה כדי לקרוא רגשות בבירור, אף שבני הפייה עצמם כמעט אינם מספרים מה גילו.

- id: spy
  flavor: >-
    מרגל הוא איש מקצוע שקט שמוכר סודות למרבה במחיר, ונע בין המונים וגגות בקלות מנוסה שגורמת לרודפים לאבד את העקבות. נשקיו נקיים והרעל שלו תמיד בהישג יד, וחתך אחד מלהב מורעל יכול להותיר יעד המום זמן מספיק כדי לחמוק.

- id: steam-mephit
  flavor: >-
    מפיט קיטור הוא יסודן קטן ועליז של ערפל רותח, כולו חום לח ובטחון שורק, והוא נוטה להתפוצץ לאדים כשמכים בו. הקיטור שלו יכול לצרוב את פניו של נוסע חולף, ומי שנושם אותו מגלה שרגליו איטיות ושכלו מעורפל לזמן קצר. רובם רעשנים יותר מאשר מזיקים, אך את הצליל השורק והבהיר שהם משמיעים כשהם מתפוצצים קשה לשכוח.

- id: stirge
  flavor: >-
    סטירג׳ הוא אימה בעלת כנפי עטלף ומקור ארוך כמחט, והוא צד בכך שהוא מרחף בשקט מעל מחנות ישנים עד שהוא מוצא צוואר חם להיצמד אליו. משנצמד, הוא שותה לשובע ואפשר לנתקו רק במשיכה מכוונת, ומשאיר את מארחו חיוור, קר וחלש.

- id: stone-giant
  flavor: >-
    ענקי אבן בונים את בתיהם בתוך פני ההרים ומתייחסים לשיפועים כאל גן של סלעים מסודרים בקפידה. הם בעלי מלאכה סבלניים ושומרים ערניים, וענק אבן יטיל סלע על כל פולש שמגיע בלי הזמנה. מיומנותם בסלע עדינה כל כך שענק יכול להסיט קליע שנזרק בחזרה אל מי שזרק אותו, והחכמים ניגשים אליהם כאל שותפים לעסקה ולא כאל יריבים.
