- id: warhorse-skeleton
  flavor: >-
    כמה מפקדי שדה גידלו את סוס הקרב בשביל ההסתערות, וההסתערות שרדה את כל מי שחתם עליה. מה שנשאר הוא רכב גרמי שעדיין שומר על השורות בשדה קר, פרסותיו נקשות בתחושת סדר עיקשת. הרוכב שלו לעולם לא חוזר, ולכן הוא פשוט דוהר לעבר כל מה שנצטווה לרמוס בפעם האחרונה.
- id: warrior-infantry
  flavor: >-
    בכל חיל מצב יש כמה כאלה, בעיקר מהסיבה הפשוטה שחנית ושורה של חברים זולות יותר מגיבור. הלוחם סומך על השכנים שלו בשורה ועומד קרוב אליהם עד כדי כך שמכה באחד הופכת למכה בכולם. אין לו הרבה מלבד חולצת שרשראות, חנית והרגל עיקש של לא לצאת מהמערך.
- id: warrior-veteran
  flavor: >-
    ותיקים כמוהו שרדו את רוב מי שאימן אותם, ונשארה בהם ההרגל להחזיק את הסנטר נמוך ואת הלהב מוכן. שריון הפלטות שלו מעוך בתריסר מקומות, וכל שקע הוא סיפור שהלוחם לא יספר. בין שהוא מניף את החרב הגדולה ובין שהוא מכוון את קשת הצלב הכבדה, קשה לפגוע בו וקשה עוד יותר להפתיע אותו.
- id: water-elemental
  flavor: >-
    יסודן מים הוא פחות יצור ויותר החלטה פתאומית של האגם. הוא זורם דרך סדקים צרים מחוט, ואז מתרומם כדי לקפל מטייל חסר מזל לתוך גופו הסוער ולהחזיק בו עד שהנשימה תאזל. מי ששורד את החיבוק שלו נוטה לתאר את הקור כגרוע שבכול, ואת הדממה כמקום שני צמוד.
- id: weasel
  flavor: >-
    הסמור הוא צרור קטן של טינה ושל תזמון טוב, מסוגל להתחמק דרך פרצה בגדר חיה ולצאת מהצד השני לפני שמישהו סיים לצעוק. הוא מטפס על כל דבר שיש בו סדק, ויושב להתבונן בעיניים בורקות ולא מתרשמות. האיכרים סובלים אותם בגלל העכברים, והעכברים משלימים איתם מסיבות שאיש מעולם לא הסביר.
- id: werebear-bear
  flavor: >-
    בצורת הדוב היצור הזה עצום, ומטפס על עצים בסבלנות קלילה של מי שהיער שייך לו. ליבו טוב, ולפעמים הוא משאיר דבש ליד השביל בשביל מטיילים שנראים לו אבודים. אבל כעסו עולה מהר כשהיער נפגע, ואז אין בו שום טוב.
- id: werebear-human
  flavor: >-
    לבוש בצמר פשוט ונושא זוג גרזני יד, איש-הדוב הזה יכול לעבור כקוצץ עצים בעל לב רחב. נימוסיו סבלניים וצחוקו קל, אך הידיים המחוספסות וההפסקות הארוכות לפני כל תשובה מספרות סיפור אחר. מעטים מי שפוגשים אותו בככר הכפר ומנחשים במה הוא הופך כשהירח מלא.
- id: werebear-hybrid
  flavor: >-
    באמצע הדרך בין שתי הצורות, ההכלאה עומדת זקופה על רגליים אחוריות חזקות, וראש דוב מוכתר בפרווה חומה עבה. זו הצורה שנבחרת לעבודה קשה, בין שמדובר בסחיבת גזע שנפל ובין שבהנפת גרזן יד על שודד שנשאר יותר מדי. קולו יוצא נמוך וגס, אבל כוונתו ברורה לכל מי שמוכן להקשיב.
- id: wereboar-boar
  flavor: >-
    לחזיר הבר הקטן הזה יש מזג שלא מתאים בכלל לגודלו, והחטים הן רק תחילת הצרות. הוא נחר מעל פירות שנפלו ומחטט בסבך, ואז מסתובב אל כל צייד שמתקרב יותר מדי. העקשנות שלו מפורסמת בכפרים שניסו לגדר אותו, ותיאבון הקונדס שלו גדול בהרבה ממה שנראה.
- id: wereboar-human
  flavor: >-
    לבוש לציד ונושא צרור רומחים, איש-החזיר הזה נראה כמו שודד זעוף שהיה ער עד מאוחר. צחוקו רועם, מחמאותיו גסות, ויש לו הרגל לירוק בין משפט למשפט. מי שחולק איתו שולחן לומד מהר להרחיק את היין הטוב ולהשאיר את המגפיים ליד הדלת.
