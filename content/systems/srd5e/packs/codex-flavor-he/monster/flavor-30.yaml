- id: vampire-bat
  flavor: >-
    עטלף שחור קטן נופל מקורות התקרה של אחוזה שקטה, ובמקום שבו כנפיו מלטפות את האוויר מתיישב קור בחדר. העטלף הוא ערפד אציל בצורתו הקטנה ביותר, שמחליק מתחת לתריסים ודרך חורי מנעולים כדי להשקיף על בני הבית ישנים. עיניו עתיקות וערמומיות, והוא חוזר לצורתו האמיתית רק אחרי שבחר קורבן.

- id: vampire-familiar
  flavor: >-
    משרת רזה ומהיר עומד ליד כתפו של אדונו, לבוש בד כהה ונאה וחגור חגורת סכינים לזריקה. המשרתים האלה קשורים לערפד בדם ובחוט של ראייה משותפת שמאפשר לאדון לראות דרך עיניהם. הם נעים במהירות לא טבעית, מחליקים לאורך קירות ועל גגות, ולעולם אינם מתעייפים מהמשימה.

- id: vampire-mist
  flavor: >-
    ערפל אפור נסחף נמוך מעל הקברים, סמיך כצמר רטוב וקר מספיק כדי להקפיא את הנשימה. בתוכו ערפד יכול לחמוק דרך סדקים צרים כחוט, לחלחל מתחת לדלתות ולתוך פינות צפופות שאדם נבון לא היה מציץ בהן. הערפל אינו מדבר, אבל הוא צופה בסבלנות שמרגישה כמעט כמו רעב.

- id: vampire-spawn
  flavor: >-
    דמות כחושה עם אצבעות לבנות ארוכות וחיוך רעב מטפסת מתוך בור שנחפר זה עתה, ומנערת את האדמה מתכריך אפור. הצאצאים הם צאצאיו של ערפד גדול יותר, שנוצרו מאלה שנשאבו ונקברו. הם מטפסים על קירות כמו עכבישים ואוחזים בשני טפרים, ומושכים את קורבנותיהם קרוב לנשיכה שמשאירה אחריה חולשה קרה ומחלתית.

- id: vampire-vampire
  flavor: >-
    אציל חיוור במעיל בעל צווארון גבוה עומד בראש שולחן אוכל ארוך, ועיניו קולטות את אור הנרות כמו מטבעות. ערפדים מהסוג הזה חיו מאות שנים, למדו את החצרות של ערים רחוקות ואת הרגלי המשרתים בהן. הם מארחים מקסימים ואויבים נוראים, והם רואים בכל קרב הזמנה ולא איום.

- id: venomous-snake
  flavor: >-
    נחש קטן בצבע זית מתוח על סלע ששמש חיממה ליד הנחל, ולשונו טועמת את האוויר לקראת הארוחה הבאה. הנשיכה שלו מהירה והארס שלו עז ליצור כה קטן, ולכן חכם לשמור מרחק מכבד. אנשי הביצות אומרים לא פעם: ככל שהנחש קטן יותר, החום בא מהר יותר.

- id: violet-fungus
  flavor: >-
    אשכול של קני חישה סגולים נובט משקע לח, ונוטה לאט לעבר כל חום שנע בסביבה. לצמח אין עיניים ואין מחשבות הראויות לאזכור, רק סבלנות איטית ומגע שמרקיב כל מה שהוא נאחז בו. מלקטי עשבים שאיבדו לו כפפה חוזרים הביתה בדרך כלל מסריחים מעובש, ואינם חוזרים לקחת את השאר.

- id: vrock
  flavor: >-
    שד מכונף בגודל סוס עגלה צונח משמים צהובים כגופרית, וראשו דמוי הנשר מוכתר בקוצי עצם. כנפיו מכות בקול של מפרשים נקרעים, וידיו הצפורניות קורעות כל מה שבהישג. כשהוא צווח, האוויר מסריח מריקבון, ומי שנושמים את הנבגים מוצאים לעתים קרובות שגפיהם כבדות ואיטיות.

- id: vulture
  flavor: >-
    אוכל נבלות בעל צוואר קירח משייט גבוה מעל המישור, רוכב על האוויר החם בלי תנופת כנף אחת. הנשרים סבלניים, מגושמים ברגליים ולגמרי לא מוטרדים מריח המוות. איפה שאחד נוחת, אחרים מגיעים מהר, ולהקה קטנה יכולה לקלף פגר עד העצם לפני שהצהריים ייגמרו.

- id: warhorse
  flavor: >-
    סוסי קרב מגודלים למשקל ולעצבים, ולסוס הזה יש מהם בשפע. הוא עומד יציב ליד המטפל שלו, אבל זרים שפוסעים בדרכו מוצאים אותו הרבה פחות סבלני. הפרסות הן הטיעון האהוב עליו, והוא מניף אותן כמו זוג פטישים כבדים.
