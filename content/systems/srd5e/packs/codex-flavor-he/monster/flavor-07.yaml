- id: bulette
  flavor: >-
    הבולט הוא אימה חופרת ומשוריינת, שנעה באדמה רכה כמו דג במים ועולה אל פני השטח רק כשהוא מתכוון לאכול. גבו מצופה לוחות כמו מגן, ולסתותיו רחבות מספיק לבלוע עז שלמה. חקלאים שליד שדות הציד שלו לומדים להרגיש את האדמה רועדת, עוד לפני שרכס הלוחות פורץ מבעד לעפר.
- id: camel
  flavor: >-
    הגמל הוא חיה סבלנית של מישורים צחיחים ומלחות, יציב על רגליו ואדיש לחום שהיה מפיל סוס. הדבשות שלו אוגרות מזון לעונות רעב, ועיניו בעלות הריסים הארוכים נותנות לו מבט של אי-הסכמה קלה, שמטיילים רבים מתקשים לסלוח עליו. אנשי השיירות מעריכים אותו יותר כמעט מכל חיה אחרת, אף שבשקט הם מודים שיש לו חוש הומור.
- id: cat
  flavor: >-
    החתול הוא צייד קטן ובטוח בעצמו, שלמד לחיות לצד בני אדם בתנאים שלו. הוא ישן בחלונות שטופי שמש, מטפס על כל מה שיש ממנו נוף, ורואה ברוב כללי הבית הצעות של יצורים איטיים ממנו. עכברים באסם מכירים היטב את תחושת תשומת הלב שלו, וכך גם הבעלים, שלעולם לא נראה שהם באמת הבעלים שלו.
- id: centaur-trooper
  flavor: >-
    חייל הקנטאור הוא לוחם של ערבות הגבהים, שילוב של סוס ורוכב קשוח שנלחם למען האנשים שנשבע להגן עליהם. שריונו מטופח, חניתו משומנת היטב, והנימוסים שלו טובים משל רוב הקטטנים בבתי המשתה. כפרי הגבול ישנים בשקט יותר כשאחד הרוכבים האלה שומר מן הגבעות, אף שהוא יתעקש שהקרדיט מגיע לסוסים.
- id: chain-devil
  flavor: >-
    שטן השרשראות הוא סוהר זועף בדרגות התופת, כבול בברזל מקרקש ונושא תמיד אורך של שרשרת בשביל מי שסטה מהתלם. הוא משרת את הבני-תופת הבכירים ממנו בממושמעות זעופה, ודואג להזכיר לנשמות נמוכות ממנו באיזו קלות אפשר להדק אחיזה. מי ששמע את קשקוש שרשראותיו במסדרון חשוך לא שוכח בקלות את הצליל.
- id: chimera
  flavor: >-
    הכימרה היא שלוש חיות שנתפרו לגוף אחד רע מזג, עם ראש אריה, מסה של עז וכנפי דרקון שמעולם לא למדו לשתף פעולה. כל ראש מתווכח על הארוחה שלו, והתוצאה היא צייד מהיר, עצבני ומתפזר בקלות. רועים מחזיקים את העדרים מאחורי גדרות גבוהות ואת הכלבים קרוב אליהם, כי איש עוד לא ראה את התיאבון של כימרה מקשיב לעצות.
- id: chuul
  flavor: >-
    הצ׳ול הוא שיקוץ ארוך גפיים ממים כהים ומליחים, כולו צבתות ושערות חישה שנסחפות בעכירות כמו שאלה שאיש לא רצה שישאלו. הוא שומר את גביעי הציד שלו מוסתרים מתחת לשריון גבו, ויש לו חיבה למעמקים שאור השמש לא מגיע אליהם. צוללנים שעובדים ליד מימיו נוהגים להשאיר את המנורות דולקות ולהחזיק את העיניים על החוף.
- id: clay-golem
  flavor: >-
    גולם החימר הוא דמות ענקית שנלחצה מאדמה רטובה וקיבלה תכלית מדברים זהירים של בעל מלאכה, עם צעד חורק ופנים שאינן משתנות לעולם. הוא עושה בדיוק את מה שנוצר לעשות ושום דבר מעבר, וזה מנחם את יוצריו ומדאיג את כל השאר. אחרי שעיצובו הושלם הוא כמעט לא מדבר, ושתיקתו נשמעת בדרך כלל כמו פסק דין.
- id: cloaker
  flavor: >-
    הגלימן הוא נודד שטוח וכהה גב, שתלוי בצללים וממתין לרגע המתאים לצנוח על מטיילים בלתי זהירים. בצדו התחתון יש פה מלא שיניים וזנב של קוצים עוקצים, שהוא מתייחס אליהם בביטחון הקליל של יצור שמעולם לא התחרט. יש חוקרים הסבורים שהגלימן פשוט משועמם, ואחרים סבורים שהוא היצור הסבלני ביותר שחי בחושך.
- id: cloud-giant
  flavor: >-
    ענק הענן חי גבוה מעל השפלה, במגדלי שיש חיוורים שנראים כסחופים בין העננים. נימוסיו אדיבים וסקרנותו עצומה, והוא מודד את ענייניהם של בני העמים הקטנים בסבלנות שעלולה להרגיש כהתנשאות. אורחים שמטפסים אל אולמותיו מקבלים בדרך כלל משתה, שיחה ארוכה והבנה ברורה עד כמה קטנים צרותיהם שלהם.
