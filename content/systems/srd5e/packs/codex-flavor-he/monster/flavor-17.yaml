- id: harpy
  flavor: >-
    הארפיות מקננות על צוקי ים ובמגדלים שבורים בחופים נשכחים, ושרות מעל הסלעים עד שהרוח נושאת את שירן לכל עמק שלמטה. השיר מתוק לאוזניו של כל מי ששומע אותו, ומלחים שהולכים אחריו נוטים לסיים בין הגלים. זרועותיהן הנוצות מהירות וטפריהן רשלניים, ולכן לקורבנות ההארפיה כמעט אין הזדמנות להתחרט על ההקשבה.
- id: hawk
  flavor: >-
    נצים צדים מגבהי האוויר וצוללים בצווחה שמקפיאה ציפורים קטנות בתוך הגדר החיה. נץ לא טורח עם בני אדם, אלא אם הם נושאים משהו ששווה לגנוב, כמו כריך או טבעת נוצצת. מאלפי נצים מדברים על סבלנות כאילו הייתה סוג של מזג אוויר.
- id: hell-hound
  flavor: >-
    כלבי גיהינום רצים בלהקות לאורך הקצוות השרופים של העולם, וכמעט אינם נראים בלי נשימת הגחלים שלהם. פרוותם הסבוכה בצבע גחלים מתקררות, והם נצמדים זה לזה כדי שאף כלב לא ייתפס לבדו. מספרים שהיו פעם להקת ציד של אדון כלשהו, אם כי הסיפור משתנה בכל מדורה שמספרים אותו סביבה.
- id: hezrou
  flavor: >-
    הברוטים הכבדים האלה, בעלי פני הקרפדה, באים מהמעמקים התחתונים ביותר של המקומות הגרועים ביותר, ונושאים סירחון שנדבק לכל חדר שהם נכנסים אליו. הם לא נלחמים בחן; הם נלחמים במהלומות מוחצות ובהרבה רעש. חוקרי עניינים כאלה מציינים שהזרו שנהרג פשוט נוצר מחדש במקום אחר, וזו אולי הנחמה היחידה שמוצאים בחברתו.
- id: hill-giant
  flavor: >-
    ענקי גבעות הם בני עם עצומים וכבדי מחשבה שמעדיפים את המקומות הגבוהים, שם הרוח נקייה והכבשים בשפע. הם לעיתים נדירות אכזריים לשם האכזריות, אבל הם כמעט לא חושבים על מה שנרמס בדרך לארוחת הערב. האלה של ענק גבעות היא בדרך כלל עץ צעיר שלם, מקוצץ בידי בעליו ונשמר משיקולים סנטימנטליים.
- id: hippogriff
  flavor: >-
    להיפוגריפים יש ראש ורגליים קדמיות של נשר וגוף של סוס, מה שהופך אותם למראה מוזר בכל אחו. הם בעלי חיים גאים שיסבלו רוכב רק אחרי שהחליטו שהוא שווה את הטרחה. הצעירים נבהלים בקלות, והיפוגריף מבוהל באוויר הפתוח הוא סכנה לכל הסובבים.
- id: hippopotamus
  flavor: >-
    היפופוטמים מבלים את חום אחר הצהריים שקועים בנהרות חומים ואיטיים, ורק עיניהם ואוזניהם מציצות מעל המים. הם אינם בעלי החיים הידידותיים שהם נראים מן הגדה, והמלחים נותנים להם מרחק רב. אחד גדול יכול לעצור את נשימתו זמן רב מאוד, וכך הוא נוהג להפתיע את מי שדג בקרבת מקום.
- id: hobgoblin-captain
  flavor: >-
    קפטני הובגובלינים הם אלה שזוכרים פקודות, סופרים את הרמחים ודואגים שהקשתים לא מתבטלים בצל. השריון שלהם טוב והנימוסים שלהם גרועים יותר, והם מצפים שגובלינים פחותים יצדיעו לפני שמדברים אליהם. מי ששירת תחת אחד מהם לומד להשפיל את הראש עד שהקפטן מסיים לצעוק.
- id: hobgoblin-warrior
  flavor: >-
    לוחמי הובגובלינים מתורגלים בשורות ומאומנים לסגור שורות במשמעת של מכונה מטופחת. הם נושאים חרב ביד אחת וקשת ביד השנייה, ושמחים להשתמש בכל אחת מהן לאותה מטרה. רובם גדלו מתוך ידיעה שמגן שימושי רק כשמי שלידו עומד איתן.
- id: homunculus
  flavor: >-
    הומונקולוס הוא יצור קטן עשוי ידי אדם, תפור על ידי כושף שרצה משרת שלעולם לא יתווכח. הוא מרחף קרוב לאדונו, מקשיב בתשומת לב שקטה וחדה, ומדווח כל מילה בקול דק. הנשיכה שלו אינה מסוכנת כשלעצמה, אבל הוא ערמומי מספיק להשאיר קורבן ישנוני ושרוע באבק.
