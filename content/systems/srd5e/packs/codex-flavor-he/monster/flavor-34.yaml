- id: young-blue-dragon
  flavor: >-
    שיירות המדבר לומדות לזהות את הדרקון הכחול הצעיר לפי הנקישה באוויר שלפני סערה. את פנקסיו הוא מנהל בחול, סופר כל מס בדיוק נורא, ומצפה שכל חוב ישולם בזמן. מי שמתמקח איתו מגלה שהתנאים נכתבים בהגינות, ושהאותיות הקטנות הן תמיד שלו.
- id: young-brass-dragon
  flavor: >-
    דרקוני הפליז הם הפטפטנים שבין הדרקונים הצעירים, והם יאכלו למטייל את האוזניים בדיבורים לפני שיחליטו אם לאכול גם את השאר. הם אוספים שירים, בדיחות ורכילות כמו שאחרים אוספים מטבעות. נשיפת השינה שלהם נחשבת דרך גסה לסיים שיחה, אבל הצעירים מתעקשים שזו רק נימוס.
- id: young-bronze-dragon
  flavor: >-
    ימאים בחוף האפור אומרים שדרקון ארד שומר על נמל כל עוד מישהו זוכר, בלי לבקש מטבע בתמורה. הוא שוחה בקלות כמו שהוא עף, ורואה באונייה טובעת עניין של כבוד ולא שלל להצלה. כשהוא מתקן קפטן עקשן, פיצוץ של נשיפתו מטיל את הקפטן שרוע על הסיפון, והלקח נשכח לעיתים נדירות.
- id: young-copper-dragon
  flavor: >-
    דרקוני הנחושת רואים בכל עימות חידה שיש לפתור בבדיחה ובמלכודת נסתרת. הם מטפסים על קירות סלע תלולים בהנאה של ילד על סולם, ומשאירים חידות חרוטות על האבנים שהם עוברים לידן. מנהלי שיירות מספרים על צעיר אחד שהחליף פעם כל שק מלח בחלוקי נחל, ואחר כך כתב התנצלות בחרוזים.
- id: young-gold-dragon
  flavor: >-
    חכמי החצרות הישנות מתארים את דרקון הזהב הצעיר כדיפלומט סבלני עם תנור במקום חזה. הוא מעדיף לנצח בוויכוחים באולם הגדול, אך ייכנס בשמחה לשדה בוער כדי להציל את בקר האיכר. דברו נחשב מחייב, ואומרים שקשקשיו המוזהבים זורחים בעוצמה רבה ביותר כשהוא דובר אמת.
- id: young-green-dragon
  flavor: >-
    נזירי היער לוחשים שהדרקון הירוק הצעיר לבש פעם את פניו של שכן, לפני שהשכן נעלם בשקט. הוא אוגר סודות בלהיטות רבה יותר ממטבעות, ומוכר אותם תמורת טובות שקושרות את הסוחר לכל חייו. הרעל שלו איטי ונימוסיו מושלמים, מה שהופך אותו לאורח המסוכן יותר בארוחת הערב.
- id: young-red-dragon
  flavor: >-
    אוצרות זהב נוטים למשוך אליהם דרקונים אדומים צעירים כמו שמנורות מושכות עשים, והדרקון כמעט אף פעם לא שמח לחלוק את האור. הוא יהיר לגבי קרניו, מתעצבן מהר, ואוהב להכריז על בואו בעמוד של חום. כפרי ההרים לומדים מוקדם לנעול את הדלתות ולהסתיר את כלי הכסף הטובים ביותר שלהם.
- id: young-silver-dragon
  flavor: >-
    הארכיונאים אומרים שהדרקון הכסוף הצעיר מנהל תיעוד מדויק יותר של העמק מאשר העמק עצמו. הוא מקריא מכתבים ישנים לרועים חולפים ומתקן את התאריכים שלהם באנחה סבלנית ועייפה במקצת. כשהוא כועס, האוויר סביב כנפיו הופך לכפור, ואפילו ההיסטוריון העקשן ביותר לומד להסכים במהירות.
- id: young-white-dragon
  flavor: >-
    ציידי הצפון שופטים דרקון לבן צעיר פחות לפי שנינותו ויותר לפי הכפור שהוא משאיר על כל מה שהוא נוגע בו. הוא לא חכם במיוחד ואין לו סבלנות לחידות, ולכן הוא מעדיף מארב על פני שיחה. מאורתו היא בדרך כלל ערוץ קפוא שבו הקרח זוהר בכחול קלוש, והעצמות הפזורות על רצפתו כמעט אף פעם לא נקיות עד תום.
- id: zombie
  flavor: >-
    זומבים הם השאריות המגושמות והמתעכבות של מוות שלא הסתיים עד הסוף. הם משתרכים לעבר החיים בהתמדה לא ממהרת, כמעט אדיבה, ויכולים לספוג מספר מפתיע של מכות לפני שהם נעצרים סוף סוף. כפריים נועלים את שעריהם ומכניסים את כלביהם פנימה, כי הכישרון האמיתי היחיד של זומבי הוא הסירוב לשכב.
