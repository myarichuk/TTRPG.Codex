- id: ability-score-improvement
  name: 'שיפור ערכי יכולת'
  flavor: >-
    שנים של לקחים קשים משאירות את חותמן, ולפעמים החותם הוא מוח חד יותר או זרוע יציבה יותר. מאמנים קוראים לזה פריחה מאוחרת; ותיקים פשוט קוראים לזה עוד שנה של בקרים שבהם סוחבים דברים כבדים.
- id: alert
  name: 'דרוך'
  flavor: >-
    אנשים ששומעים צרה מתקרבת לפני שהיא מראה את פניה תמיד נחשבו בעיני מפקדי המשמר הוותיקים יותר מכל חרב. ראש מהיר בתחילת קרב יכול להכריע מי פועל ראשון ומי רק מגיב.
- id: archery
  name: 'קשתות'
  flavor: >-
    בכל כפר יש אדם אחד שמסוגל לפצל קשר מרחוק, ושאר הכיכר מסכימה בשקט לא להתווכח איתו. ציידים, גובי מכס וקשתים משועממים כאחד רואים בקשת יציבה סוג של שפה כנה.
- id: boon-of-combat-prowess
  name: 'מתת כושר לחימה'
  flavor: >-
    פטרון של מלחמה, זקן מכדי לגלות את שמו, הצמיד פעם אגודל חם אל פרק ידו של חייל. מאז החטאות שלו נעשו נדירות, וגם פחות סופיות מבעבר.
- id: boon-of-dimensional-travel
  name: 'מתת מסע בין ממדים'
  flavor: >-
    לא כל פתח בנוי מאבן או מעץ, וזה שנפתח עבור נודד נוטה להופיע באמצע קרב. מי שנושא את המתנה הזאת לומד לצעוד הצידה מתוך צרה ולנחות היכן שהתכוון, רוב הזמן.
- id: boon-of-fate
  name: 'מתת הגורל'
  flavor: >-
    המזל הוא רכלן, וידוע שהוא לוחש לעקשנים מסוימים שמסרבים להפסיק לשאול שאלות. מי ששומע אותו לומד לדחוף תוצאה מעט, בין שזו מכת יריב ובין הימור של חבר, והדחיפה תמיד חוזרת מאוחר יותר.
- id: boon-of-irresistible-offense
  name: 'מתת התקפה בלתי ניתנת לעצירה'
  flavor: >-
    יש מתנות שמגיעות עם מבט מכוון ואזהרה שמהמקבל ייצפה להשתמש בהן. ברגע שמכה מושלמת נוחתת, השריון והעור העבה שמתחתיו מפסיקים להיות חשובים, ומדריכי אימונים ותיקים נשבעו שמכות כאלה גורמות לעקשנות להיראות טיפשית.
- id: boon-of-spell-recall
  name: 'מתת היזכרות בלחשים'
  flavor: >-
    קסם דולף מעט מכל לחש, כמו חום מכבשן, ורוב מטילי הלחשים מקבלים את ההפסד כמחיר המקצוע. המתנה הזאת סותמת חלק מהדליפות, כך שלעיתים לחש לא עולה דבר בדרכו החוצה.
- id: boon-of-the-night-spirit
  name: 'מתת רוח הלילה'
  flavor: >-
    הלילה אינו ריק, וכל מי שבילה שעות ארוכות במרתף שחור יודע שלחושך יש משקל משלו וחברה משלו. מי שמקבל את המתנה הזאת גולש אל האפלה בקלות שבה חתול גולש מתחת לדלת, וברוב הלהבים אין במה לנשוך.
- id: boon-of-truesight
  name: 'מתת ראיית אמת'
  flavor: >-
    הרבה עיניים מנומסות. הן מקבלות את הצורות שלפניהן כפשוטן וכמעט אינן מביטות מעבר להסוואה. מתנה שרואה דרך צבע, מסכות ושקרי חצר היא ברכה מעורבת, שכן האמת שהיא חושפת נדירות נוחה.
- id: defense
  name: 'הגנה'
  flavor: >-
    שריון הוא הבטחה שקשה יהיה לפגוע בלובש אותו, וצורף טוב יודע שההבטחה טובה רק כמו מי ששומר עליה. חיילים שמתאמנים ללבוש אותו היטב נעים כאילו הפלדה היא עור שני ולא נטל.
- id: grappler
  name: 'מתאבק'
  flavor: >-
    עיירות הנהר מסדרות את רוב הוויכוחים באחיזה ולא באגרוף, והמתאבקים שלהן יגידו לכם שיד סבלנית מנצחת יד מהירה. ברגע שמישהו תפוס, הוא לומד מהר כמה מעט מקום נשאר לפרפר.
- id: great-weapon-fighting
  name: 'לחימה בנשק כבד'
  flavor: >-
    להב דו-ידני מתגמל סבלנות וכבוד עקשני מסוים לאחיזה. נפחים במפעלי ההרים אומרים שנשק כבד טוב רוצה להתנפנף עד הסוף, והמאסטרים הוותיקים הסכימו שחצי תנופה נחפזת היא ברזל מבוזבז.
- id: magic-initiate
  name: 'מחונן בקסם'
  flavor: >-
    מטילי לחשים מתחילים בדרך כלל עם ספר שאול ומורה עקשן שהתעקש על לחש קטן אחד לפני כל לחש גדול. השיעורים נשארים עם האדם הרבה אחרי שההרצאות נשכחו, והלחש הראשון שנלמד הוא בדרך כלל זה שהוא עדיין מטיל כשדברים משתבשים.
- id: savage-attacker
  name: 'תוקף פראי'
  flavor: >-
    יש רגע בעימות שבו הלהב כבר מצא את מטרתו, והשאלה היחידה שנותרה היא כמה חזק הוא ייכנס. לוחמי רחוב ותיקים שלימדו את התכסיס הזה אהבו לומר שהניסיון השני באותה מכה הוא זה שנחשב.
- id: skilled
  name: 'מיומן'
  flavor: >-
    רבים מכירים מקצוע אחד היטב, אבל אלה שנושאים שלושה בתרמיל כמעט אינם בטלים. פחחים ומורים מסכימים שכמה מיומנויות שנבחרו היטב הן גשר שימושי בין שני חדרים שונים מאוד.
- id: two-weapon-fighting
  name: 'לחימה בשני נשקים'
  flavor: >-
    להב שני ביד החלשה אינו עניין של פלדה נוספת אלא של קצב, והלוחמים ששולטים בו נעים כמו אנשים שהתאמנו לדבר בשתי הידיים. כשחתך ההמשך נוחת, יש מאחוריו מעט יותר מהתנופה של הראשון.
