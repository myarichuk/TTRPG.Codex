- id: barbarian
  name: 'ברברי'
  flavor: >-
    ברברים הם אלה שעונים לתופים כשהדם עוד לוהט מהקרב הקודם. הזעם שלהם הוא גאות שעולה ממקום שמתחת למחשבה, ואנשי הנהר נשבעים שהאדמה עצמה משתתקת כשהוא נפרץ. רובם לומדים ללבוש את האש הזאת בלי לתת לה ללבוש אותם, וזה קשה יותר ממה שנשמע.
- id: bard
  name: 'בארד'
  flavor: >-
    בארדים אוספים שירים כמו שעורבנים אוספים דברים נוצצים, ויחליפו סוד תמורת בית טוב ומקום חם ליד האח. מילותיהם נושאות סוג של אומץ שאול, שעובר מיד ליד בקהל עד שהפוחדים מזדקפים מעט. שאלו בארד איפה למד את המקצוע, ותקבלו שלוש עיירות, קטטת פונדק ושקר אחד לפחות.
- id: cleric
  name: 'כוהן'
  flavor: >-
    כוהנים הם האנשים שהכפר קורא להם כשילד חם מקדחת או כשקבר צריך ברכה שנאמרת כראוי. הם מחזיקים באמונה שדורשת סבלנות ויד יציבה, מתווכחים על דוקטרינה בארוחת הערב ואז יושבים ליד החולים כל הלילה. סוג מסוים של כוהנים אומר שכוחם הוא הלוואה ממשהו גדול מהם, והמלווים לעולם אינם ממהרים לגבות.
- id: druid
  name: 'דרואיד'
  flavor: >-
    דרואידים שומרים על ההסכמים העתיקים עם הגדר החיה והעמק, וסופרים את העונות לפי האופן שבו הציפורים משנות את שירתן. רבים מהם אוהבים בעלי חיים עד גבול הגסות, וכמה מהם יכולים להיכנס לעור של שועל או לנוצות של נץ למשך אחר צהריים. אנשי הנהר משאירים להם לחם בקצה היער, והיער, בדרכו, מחזיר טובה.
- id: fighter
  name: 'לוחם'
  flavor: >-
    לוחמים החליטו מוקדם שחיים קשים עדיף לבזבז בתועלת, ואימנו את גופם עד שהאימון הפך לאינסטינקט. הם מכירים כל סוג של להב ושריון, ובדרך כלל יאמרו לכם איזה מהם ייכשל ראשון. יש היוצאים למלחמה תמורת כסף, יש למען מטרה, וכמה פשוט אינם מסוגלים לשבת כשמישהו אחר מניף חרב.
- id: monk
  name: 'נזיר'
  flavor: >-
    נזירים מאמנים את הגוף עד שהוא נעשה כלי, ואת הכלי עד שהוא נעשה סוג של שקט. המשמעת שלהם בנויה על נשימה ושיווי משקל, והם יכולים להפוך אגרוף חשוף או מקל פשוט למשהו שמאסטר חרבות יכבד. המנזרים שלהם יושבים במקומות גבוהים שבהם הרוח רועשת והפעמונים נדירים, והאורחים עוזבים לא פעם עם יותר שאלות משהגיעו.
- id: paladin
  name: 'פלדין'
  flavor: >-
    פלדינים נשבעים שבועה עוד לפני שהם מרימים מגן, והשבועה היא החלק שמעיר אותם בלילות. הם נושאים מגע מרפא שנגמר מהר ממה שהיו רוצים, ולכן לומדים להוציא אותו בזהירות. כל שוטר עיר יספר את סיפור האביר שהחזיק את השער, וכל גרסה מחמיאה למספר קצת יותר מאשר לאביר.
- id: ranger
  name: 'סייר'
  flavor: >-
    סיירים הולכים בקצוות האדמה המיושבת, במקום שבו המפות מפסיקות להועיל והציידים מתחילים להקשיב. הם קוראים עקבות כמו שאחרים קוראים מכתבים, ויש להם הרגל לדעת איפה אתם נמצאים לפני שהחלטתם להיכנס. רובם מעדיפים שיעזבו אותם במנוחה, אבל כפר בצרה ימצא אותם מהר יותר מכל שליח.
- id: rogue
  name: 'נוכל'
  flavor: >-
    נוכלים מתפרנסים מהפער בין מה שאנשים מצפים לו לבין מה שהם באמת רואים. הם פותחים מנעולים, כיסים ויכוחים בשלווה שווה, ומנהלים פנקס פרטי של טובות שחייבים להם בכמה ערים בו זמנית. אולמות הגילדות מעמידים פנים שאינם מכירים אותם, וזה מתאים לכולם, שהרי נוכל שאיש אינו ממש רואה הוא גם נוכל שאיש אינו ממש תופס.
- id: sorcerer
  name: 'קוסם'
  flavor: >-
    קוסמים נולדו עם ניצוץ שאף בית ספר לא לימד אותם להדליק, והניצוץ נוהג להופיע באמצע ויכוח. הקסם שלהם חם וקרוב לעור, ולכן נודף מהם לעיתים ריח קל של אוזון או קינמון, תלוי מי מספר. משפחות ותיקות מנסות לפעמים לתבוע קוסם כשלהן, והקוסמים נוטים לענות על התביעה בתאונה מרהיבה.
- id: warlock
  name: 'מכשף'
  flavor: >-
    מכשפים כרתו הסכם עם משהו שחי בסדקים שבין התשובות, והתנאים מעולם לא היו נדיבים כפי שנראה בשיחה הראשונה. הכוח מגיע אליהם בשברים קטנים וחדים, כל אחד סוד שמרגיש כמו מתנה עד שהוא מתחיל לגרד. החברים דואגים, הפטרונים מחייכים, והפנקס בראש המכשף מתארך מעט בכל עונה.
- id: wizard
  name: 'אשף'
  flavor: >-
    אשפים הם התלמידים שלא הפסיקו לרשום הערות, וספרי הלחשים שלהם אישיים כמו יומנים ומסוכנים פי שניים. כל ספר מועתק, מוער ונתון לוויכוח בשוליים עד שהוא הופך למפה של מוחו של בעליו. הקולג׳ים הישנים עדיין מלמדים את אותם הרגלים זהירים: תאוריה נבחנת לפני שסומכים עליה, ואין מאמינים ללחש עד שנכתב פעמיים.
