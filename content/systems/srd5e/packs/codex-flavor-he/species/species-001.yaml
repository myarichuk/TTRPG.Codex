- id: dragonborn
  name: 'דם דרקון'
  flavor: >-
    קשקשים לוכדים את אור המנורות בעיירות הגבעות, ובעלי דם הדרקון שנושאים אותם נוטים להיות הראשונים לדבר בסעודה. אבותיהם השאירו בשושלת נשימה לוהטת, וכל דור מגלה בה צבע אחר. יש הלובשים את הירושה בגאווה, ואחרים בהרמת כתפיים ובמקטרת ארוכה מאוד.
- id: dwarf
  name: 'גמד'
  flavor: >-
    אבן היא השיחה היחידה שגמד מוצא כנה לחלוטין, ובני ההרים יגידו לכם זאת מעל הספל השני. הם שומרים על יציבות הלב לאורך חורפים ארוכים וטינות ארוכות מהם, ומוח עקשן נחשב לרכוש משפחתי. ידיהם מבחינות בין סלע טוב לרע במגע בלבד.
- id: elf
  name: 'אלף'
  flavor: >-
    האלפים של החורשות הישנות שומרים על לוח שנה איטי יותר משל שכניהם, וסופרים עונות לפי פריחתו של עץ מסוים. הם מסתדרים בלי שינה ושוקעים במדיטציה רגועה שמשאירה אותם ערים לצפות בכוכבים מסתובבים. זקניהם אומרים שהשנינות החדה ביותר היא זו שאינה ממהרת, וילדיהם לומדים להקשיב לפני שהם מדברים.
- id: gnome
  name: 'ננס'
  flavor: >-
    ננסים קטנים בקומה וגדולים בסקרנות, ובבתי המלאכה שלהם נוטה להתנגן תקתוק של מנגנוני שעון. ננסי היער מחליפים רכילות עם הציפורים, ואילו אנשי הסלע מתקנים גלגלי שיניים שלעולם אינם נעצרים. מעטים מהם מסוגלים לעמוד בפני שאלה חכמה, ועוד פחות מהם יודו שטעו בעניין מכונה.
- id: goliath
  name: 'גוליית'
  flavor: >-
    הגולייתים נושאים בעצמותיהם את זיכרון ענקי ההרים, והפסגות הגבוהות עדיין מרגישות להם כמו בית. יש שנדמה שמנערים מכה כאילו אבן רק נגעה בהם, ואחרים עונים לאתגר בסלע שנזרק. שאלו כל אחד מהם על אבותיו וצפו לסיפור ארוך ושמח.
- id: halfling
  name: 'זוטון'
  flavor: >-
    הזוטונים שומרים על אח חמה ועל דלת פתוחה, ורובם מעדיפים ארוחה טובה על ריב גדול. יש להם כישרון להחליק הצידה מצרות ונטייה עקשנית לקום שוב כשהפחד מפיל אותם. בקשה נענית לרוב בחיוך, בארוחה חמה ובטובה שכבר נעשתה.
- id: human
  name: 'בן-אנוש'
  flavor: >-
    בני-האנוש הם חסרי המנוחה, תמיד בונים דרך חדשה או מוניטין חדש לפני שהקודם הספיק להתקרר. כישרונותיהם מתפזרים לכל כיוון, מה שהופך אותם טובים כמעט בכל דבר שניסו פעם אחת. שאלו אדם במה הוא הכי טוב, והתשובה היא בדרך כלל שלושה דברים, כל אחד בביטחון שווה.
- id: orc
  name: 'אורק'
  flavor: >-
    אורקים נשפטים לעיתים קרובות לפי הסיפורים הרועשים ביותר עליהם, שרק לעיתים רחוקות כוללים את הסבלנות הארוכה של זקניהם. הם ידועים בהתפרצות אנרגיה עזה בקרב ובסירוב משונה להישאר על הקרקע כשהמאבק כמעט הסתיים. שיריהם מעדיפים ידיים יציבות, שבועות כנות וסוג של סיבולת שהופך חורף קשה לקצר.
- id: tiefling
  name: 'זד'
  flavor: >-
    הזדים נושאים אות קלוש של שושלת שבכפרים הישנים כמעט לא דיברו עליה בקול. מתנותיהם נוטות ללשון מהירה, לכישרון לקסמים קטנים ומוזרים ולרוגע שמטריד את מי שציפו לצעקות. רובם מעדיפים להישפט לפי מעשיהם ולא לפי צורת קרניהם.
