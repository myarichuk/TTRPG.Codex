- id: geas
  flavor: >-
    הבטחה כופה, חצי שבועה וחצי כאב ראש, אוזקת מוח עקשן למשימה אחת. פנקסים ישנים של בתי הדין מתארים אותה כדרך המושכלת ביותר להרוס חג. המוח רוטן, הגוף צועד, והמשימה מתבצעת.
- id: gentle-repose
  flavor: >-
    דממה שקטה יורדת על גוף שמחכה לקבורה, ושומרת עליו רענן ושקט עד שיגיע היום הנכון. חברי חברות הקבורה שעל שפת הנהר כמעט אינם מדברים על כך בפני המשפחות. זו חסד עם שעון בתוכו.
- id: giant-insect
  flavor: >-
    צורה מצופה כיטין זוחלת מן האדמה לפי רצון המטיל, כולה לסתות וסבלנות מקישה. מגדלי סוסים מספרים סיפורים על השימוש בה, אך נוטים להימנע מלומר מה עלה בגורלו של גובה המסים. מי שמפקד על אחד כזה לומד שחרקים הם כוח עבודה נאמן להפליא.
- id: glibness
  flavor: >-
    ביטחון חלק וחם מתיישב על הלשון, והופך כל מילה לנעימה יותר משמגיע לה. סוחרים נודדים בדרכים הישנות היו משלמים הרבה תמורתו. האפקט דועך מהר ומשאיר רק טעם קלוש של דבש וספק.
- id: globe-of-invulnerability
  flavor: >-
    כיפה נוצצת של אור חיוור עוטפת פינה קטנה ודוחה את הקסמים הקטנים שמעזים לגעת בה. מהנדסי ערים זהירות רואים בה היכל מגנים נייד, ומוכרים זיופים לחסרי הסבלנות. השלווה שבפנים מדבקת באופן מוזר.
- id: glyph-of-warding
  flavor: >-
    סימן קלוש חרוט באבן או במתכת, שקט כחתול רדום עד שמישהו מפריע לו. מנעולנים וארכיונאים מדברים עליו בכבוד שבדרך כלל שמור למזג רע. התגובה, כשהיא מגיעה, רועשת, בהירה ולעולם אינה עדינה.
- id: goodberry
  flavor: >-
    חופן גרגרים שמנמנים מופיע בכף ידו של המטיל, קרירים ומתוקים, כאילו הגדר החיה חיכתה. מלקטי גבעות העיירות אומרים שגרגר אחד מספיק להאכיל הולך עייף, אף שהם עדיין מעדיפים לחם. טעמו קלוש של קיץ, מטען מוזר לשאת בחורף.
- id: grease
  flavor: >-
    ציפוי חלקלק נמרח על פיסת רצפה או על שלב סולם, והופך כל צעד למשא ומתן קטן. בעלי פונדקים בדרכים הישנות נוקטים עמדות נחרצות על השימוש בו במדרגות שלהם. מי שמחליק עליו זוכר את הלקח זמן רב יותר מן החבורה.
- id: greater-invisibility
  flavor: >-
    דמות נמוגה מן העין מעט מעט, ונשאר רק קו מתאר קלוש שהעין שבה ומנסה לתקן. גילדות הגנבים של הערים הישנות רואות בכך נימוס מקצועי, ובעלי הפונדקים רואים בכך עלבון לחשבון. אפילו מטלות רגילות, כמו מזיגת תה, אינן שוברות את הלחש.
- id: greater-restoration
  flavor: >-
    חמימות עדינה עוברת בגוף עייף ומנקה את סימני המזל הרע הישנים שנותרו בו. מרפאים ממסורות רבות אומרים שזה כמו ניקיון אביב לנשמה, אך מודים שקשה הרבה יותר לנגב אבק מנשמה. ההקלה שקטה, יסודית ומגיעה בהחלט.
- id: guardian-of-faith
  flavor: >-
    זקיף חיוור של אור מתהווה באוויר ומסרב לזוז, ומציע את הסבלנות שרק אדם אדוק יכול להעריך באמת. מי שמתקרב מדי לומד מהר שמבטו עוקץ באש קדושה. שומרי מקדשים ותיקים נשבעים שהיצור לא מצמץ אף פעם.
- id: guards-and-wards
  flavor: >-
    ערפל נאגר במסדרונות, דלתות ננעלות בנקישה, וכל גרם מדרגות מצמיח סבך של חוטים דביקים. אורות שובבים רוקדים בפינות בעוד משב נאנח בגלריה. מי שמכיר את הסיסמה יכול לעבור חופשי, מה שהמועצות הישנות רואות כעלבון סביר.
- id: guidance
  flavor: >-
    דחיפה קטנה מקול יציב, שמועברת מיד ליד כמו מטבע שאול. לכל מלאכה שתיבחר, המסייעים חשים בהירות פתאומית של מטרה, כאילו מרפק ידידותי נגע בכתפם. כשפי גדר מלמלים שהלחש עובד הכי טוב על מי שכבר החליט כמעט לנסות.
- id: guiding-bolt
  flavor: >-
    חנית של אור לבן יוצאת מקצות אצבעות המטיל ומתחקה אחר מטרתה כיונת דואר שמסרבת להיות מוסחת. היא פוגעת בקול פעמון מוכה, והזוהר נדבק למוכה ומסמן אותו לכל בעלי הברית שבאים אחריה. יש הקוראים לזה הדרך המנומסת ביותר להצביע.
- id: gust-of-wind
  flavor: >-
    דחיפת אוויר מגיעה משום מקום ומתגלגלת על פני החצר כמו שוטר ארמון חסר סבלנות שמפנה את המרפסת. נרות נחנקים, גלימות מצליפות, ואבק מטפס אל קורות הגג. מלחים נשבעים שלרוח יש כיוון אהוב, אף שהמטיל בדרך כלל מחליט במקומה.
- id: hallow
  flavor: >-
    קדושה או טומאה, האדמה נכבשת בשקט. האוויר שוקט, הדשא נדם, וזמזום קלוש של כוונה נשאר מעל האבנים הרבה אחרי שנרות הטקס כבו עד תומם. מי שחש שם אי נוחות, בדרך כלל אומרים לו שאלה רק השכנים.
- id: hallucinatory-terrain
  flavor: >-
    אחו הופך לביצה בעיני כל המביט, ומדרון עדין לובש פני מצוק. שדות ודרכים לובשים צלליות חדשות בלי לשנות אבן אחת. נוסעים זהירים עדיין בודקים את הקרקע במגף, והחכמים בודקים פעמיים.
- id: harm
  flavor: >-
    חבורה של אור אפור פורחת מתחת לעור וממשיכה להתפשט גם אחרי שהיד הורמה. הפצע הישן אינו מחלים אלא מצטמק לצורה קטנה יותר. מרפאים שראו זאת פעם אחת נעשים מתעניינים מאוד במניעה.
- id: haste
  flavor: >-
    כל תנועה מזנקת לקצב מהיר יותר, כאילו הגוף מצא נשימה שנייה וזוג רגליים רזרבי. העצבים שרים והרפלקסים מתהדקים. החשבון מגיע מאוחר יותר, כשנמנום כבד ופתאומי מתגלגל על כל החבורה.
- id: heal
  flavor: >-
    אור חם נשפך דרך גוף פצוע ומנקה את ערפל הרעל ואת עמעום העיוורון והחרשות. פצעים נקשרים בקצב שמעורר אי נוחות אצל הצופים. ספקנים נוטים להפסיק להתווכח ברגע שהצבע חוזר ללחיים.
