- id: instant-summons
  flavor: >-
    ספיר אחד מחזיק הבטחה: חפץ יקר יחזור הביתה ברגע שיקראו בשמו ויימעך האבן. התכשיט נצרך בעסקה, ולכן כל זימון דורש אבן חדשה וארנק סבלני. גנבים שלומדים את הטריק נוהגים לשמור את אבני החן שלהם בכיסים חזקים במיוחד.
- id: invisibility
  flavor: >-
    רעלה דקה של כסף מחליקה על חבר עד שרק כוונותיו נותרות גלויות לעין חדה. האפקט עדין, ונוטה להיקרע ברגע שהנושא עושה מהלך נועז. שחקני במה, חתולים ומשוררים גרועים ניסו כולם לחקות אותו, בהצלחה משתנה.
- id: irresistible-dance
  flavor: >-
    דחף פתאומי לפזז תופס אויב באמצע תוכנית קודרת, ועד מהרה מגפיו מתופפים לחן עליז שמעולם לא הסכים לו. כבודו מתנדנד ורגליו נעות בהתלהבות מגוחכת, וכל מכה שלו נוחתת מחוץ לקצב. הפייטנים הוותיקים אומרים שריקוד טוב מעולם לא היה קרב הוגן.
- id: jump
  flavor: >-
    קלילות שוכנת ברגליו של חבר מסכים, כאילו ביקשו מכוח המשיכה בנימוס לצאת לחופשה קצרה. כל נתירה מעבירה אותו מעל תעלות, ארגזים ולפעמים גם עז נבהלת. קופצי הגדרות של עיירות הנהר נשבעים בו, בעיקר כי קל יותר לסלוח להם על הנחיתות.
- id: knock
  flavor: >-
    נקישה חדה אחת נשמעת ממנעול, בריח או מוט עיקש, והסגירה הישנה מוותרת באנחה עייפה. הקול נישא מעבר לגבעות ומודיע לכל הסובבים שדלת נפתחה היכן שלא היה צריך. מנעולנים בעיירות הנהר רואים בכך עלבון אישי.
- id: legend-lore
  flavor: >-
    דממה יורדת וזיכרון נפרש מן האוויר, עמוס בשמועות ובמעללים גדולים של שם מפורסם. הפרטים מגיעים בחידות ובסטיות מהנושא, כאילו העבר גאה מכדי לדבר בפשטות. חכמים שנעזרים בו מחזיקים עיפרון חד וחיוך חשדני.
- id: lesser-restoration
  flavor: >-
    חום עדין עובר בידיו של חבר ומפיג את הערפל שמעיב על עיניו, אוזניו, איבריו או דמו. ההקלה מהירה ושקטה, כמו חלון שנפתח אחרי חורף ארוך. מרפאים שמעדיפים עבודה שקטה על נאומים נוטים לבחור בלחש הזה.
- id: levitate
  flavor: >-
    יצור או חפץ חופשי מתרומם מן הרצפה כאילו יד נעלמה החליטה שהגיע הזמן לרחף. אפשר להוביל אותו מעלה ומטה, והוא זוחל קדימה רק כשהוא דוחף קירות או תקרות. כשהקסם דועך הוא שוקע ברכות, ונראה פגוע במקצת.
- id: light
  flavor: >-
    זוהר חיוור פורח על חפץ נבחר וצובע את הקירות הסמוכים בכל צבע שהקוסם מעדיף. כשפני הגדר קוראים לו הנוחות הזולה ביותר במקצוע, כי הוא כמעט לא דורש מהארנק דבר. כיסוי הזוהר בבד משתיק אותו מיד, והישנוניים מודים על כך.
- id: lightning-bolt
  flavor: >-
    נפץ של אש לבנה זינק מידו של הקוסם וקורע קו ארוך ובהיר באוויר. כל מי שנקלע לנתיבו מקבל שיעור חד ומקפיץ שיער בחשמל, והאוויר אחריו מריח מרעם וצמר חרוך. כוהנים של מסדרים מסוימים, שחיים לצד הסערה, רואים בו את הטיעון הישר ביותר בעולם.
- id: locate-animals-or-plants
  flavor: >-
    לחישה עולה מן הדשא והעלים ומצביעה אל היצור הקרוב ביותר מהסוג שנבחר. ציידים ואספני צמחים סומכים מימים ימימה על החוש הזה כדי למצוא ציפורים, חיות ושורשים עקשנים. הוא מגלה היכן החיים מסתתרים, אך לעולם לא למה בחרו להסתתר.
- id: locate-creature
  flavor: >-
    משיכה כמו חוט דיג נקשרת בחזה ומצביעה אל פנים מוכרות או אל סוג מוכר של חיה. המשיכה נחלשת אם הטרף לובש עור של זר, והיא נפסקת לגמרי אם עופרת עומדת בדרך. עוקבי עקבות נשבעים שזו המצפן העקשן ביותר שנשאו אי פעם.
- id: locate-object
  flavor: >-
    חוט של אינטואיציה מושך אל מזכרת שזכרו או אל החפץ הקרוב ביותר מסוג נתון. מפתח סדוק, חרב משובחת או כובע אהוב אפשר לשלוף מתוך ערפל שוק הומה. המחפשים אומרים שהלחש פועל בעיקר כשהחזיקו את הדבר פעם, מספיק קרוב כדי לזכור את משקלו.
- id: longstrider
  flavor: >-
    קפיציות נוספת מתיישבת בצעדיו של חבר, והדרך כאילו מתקצרת תחת מגפיו. שליחים, עולי רגל וכל מי שמאחר לארוחת ערב מעריכים את החסד הצנוע הזה מדור לדור. האפקט נעים ושקט, מן הברכות שאיש אינו חושב להודות עליהן עד שהמסע נגמר.
- id: mage-armor
  flavor: >-
    שכבה נוצצת של קסם מגן עוטפת נפש מסכימה שעדיין לא לבשה שריון חזה. היא מעניקה תחושת ביטחון יציבה, אך קונכייה של מתכת אמיתית תמיד תהיה משכנעת יותר. חייטים של המועצות הוותיקות מתלוננים שהיא הורסת גזרת גלימה מצוינת.
- id: mage-hand
  flavor: >-
    יד רפאים מרחפת לעין ומבצעת מטלות קטנות ובזהירות, בדרכו של משרת מנומס מאוד. היא יכולה לסובב בריח, לשפוך מבקבוקון או להביא מכתב ממגירה, אך אינה יכולה להכות או לשאת משא כבד. החניכים מעריצים אותה, בעיקר כי היא אף פעם לא מתמרמרת על הכלים המלוכלכים.
- id: magic-circle
  flavor: >-
    עמוד גבוה של אור מזמזם עולה במקום שבו רונות זוהרות מסמנות את הרצפה, ואוטם את החלל מפני אורחים לא קרואים מסוימים. יצורי מרום, יסודנים, יצורי פייה, שיקוצים ואל-מתים חסרי מנוחה מוצאים כולם את המחסום לא מסביר פנים. כמה שומרים הופכים את ההיגיון שלו, כדי שהאורחים שבפנים יישארו במקומם.
- id: magic-jar
  flavor: >-
    גוף דומם שוקע בתרדמת, והנשמה מחליקה החוצה ומתמקמת באבן חן, בגביש או בכלי שרידים קטן. משם היא יכולה לנדוד מעט ולהציץ בזר סמוך, בתקווה למצוא בית חדש ונוח. אשפים שמנסים זאת כמעט אף פעם אינם חוזרים לאותו גוף עם אותן דעות.
- id: magic-missile
  flavor: >-
    שלושה חצים זוהרים של כוח צרוף מזמזמים לקיום ונורים אל מטרות שבחר הקוסם. הם תמיד פוגעים, ולכן הם החביבים על תלמידים עצבניים ומורים עקשנים במיוחד. כל חץ מגיע באותו הרגע, והקורבנות נשארים להתווכח מי נפגע ראשון.
- id: magic-mouth
  flavor: >-
    פני אבן או גרגויל מגולף מקבלים לפתע קול, ואומרים הודעה מוכנה בכל פעם שמופיע סימן נבחר. המילים יוצאות בטון של הקוסם עצמו, כאילו המדבר עומד ממש מאחורי הפסל. אשפים שובבים משתמשים בו להודעות קבלת פנים, לאזהרות חמורות ולעלבון מתוזמן היטב מדי פעם.
