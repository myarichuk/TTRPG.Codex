- id: conjure-woodland-beings
  flavor: >-
    רוחות טבע מרפרפות סביב המטיל כענן פרוע, זוהרות כניצוצות בגדר חיה שהרוח מטלטלת, ותופסות בכל מי שנקלע לריקוד שלהן. יצור שנלכד במערבולת חש לחץ פתאומי של כוח פראי, אם כי מוח זריז יכול לחמוק מן הגרוע שבו. אנשי הגדרות החיות נשבעים שהרוחות לא אוהבות פולשים לבושי שריון.
- id: contact-other-plane
  flavor: >-
    לחישה ממקום אחר נוגעת בתודעתו של המטיל, ונושאת עמה את קולה של תבונה עתיקה מעבר לשמיים. מוחות כאלה הם חברה מסוכנת, והקשר עלול להשאיר את מחשבותיו של החוקר סדוקות כמו זכוכית ישנה. מי שחוזר בשלום מקבל קומץ תשובות קצרות וחדות, לעיתים רק מילה אחת.
- id: contagion
  flavor: >-
    מגע אחד משאיר פריחה חולנית מתחת לעור, מחלה שמתפשטת בדם כמו ריקבון בקורת עץ ישנה. גופו של הקורבן מנהל קרב ארוך ואומלל. המחלה נמשכת ימים, ואכזריותה הגדולה ביותר נוחתת על התכונה שהמטיל נקב בשמה.
- id: contingency
  flavor: >-
    לחש מוכן מחכה בשקט במילואים, ממתין לגורם מפעיל שהמטיל בחר מראש. מטיל שמתכנן בקפידה יכול לגרום להגנה פשוטה לקפוץ למקומה בדיוק ברגע הנדרש, כמו מלכודת שהוצבה בחשכה. החוקרים מתווכחים אם ראיית הנולד היא חוכמה או פחד בנימוסים טובים יותר.
- id: continual-flame
  flavor: >-
    להבה קטנה פורחת על פני חפץ, בהירה די הצורך כדי לקרוא לאורה בחדר גדול, אך קרה למגע ולעולם אינה רעבה לדלק. אפשר לכסות אותה או להסתיר אותה מאחורי אהיל, אבל שום נשיפה חונקת ושום שפיכת מים לא יכבו אותה. יצרני מנורות מן הדור הישן קינאו זה מכבר בסבלנותה.
- id: control-water
  flavor: >-
    נהרות ושלוליות נענים לרצון אחד, מתרוממים לחומות, נמשכים למערבולות, או שוקעים ומותירים אבנים חשופות ובוץ. תנועת יד חדה יכולה להפוך נמל למלכודת או שיטפון להפשרה עדינה. ריכוז יציב מחזיק את הכול, והמים חוזרים בזעף לצורתם הטבעית ברגע שהריכוז נשבר.
- id: control-weather
  flavor: >-
    עננים מתכופפים לרצון אחד מעל פיסת כפר רחבה, והמטיל יכול לשכנע שמש, גשם או רוח להיכנס למצבי רוח חדשים. השמיים נעים בעל כורחם, ורק במשך זמן רב. הלחש מסתיים אם המטיל נכנס פנימה, שכן השמיים עונים רק למי שעומד תחתיהם.
- id: counterspell
  flavor: >-
    מילה חדה של סירוב חותכת את לחשו החצי-גמור של מטיל אחר, ושולחת את ניצוץ הלחש החוצה בשריקה חלושה. הניסיון לא תמיד מסוכל, שכן היעד יכול להתנגד במשיכה עקשנית של רצון. האנרגיה שהושקעה בלחש שנכשל פשוט אובדת, בזבוז שאיש אינו יכול להשיב.
- id: create-food-and-water
  flavor: >-
    מזון פשוט מופיע יש מאין, צנוע ומשביע, בצורת כל מנה שהמטיל חפץ בה, לצד מים נקיים שנשפכים לכדים או לכלים. הלחמים והתבשילים לא יחזיקו מעמד, ולכן עדיף לאכול את הסעודה מיד, כל עוד היא חמה. מטיילים מעולם לא התלוננו על הטעם, רק על חוסר התיבול.
- id: create-or-destroy-water
  flavor: >-
    מים באים והולכים לפי רצונו של המטיל: דלי שמתמלא מאין, או גשם של טיפות שיורד דרך חלקת אוויר קטנה וכובה אש. כשהקסם פועל בכיוון ההפוך, הוא שואב מים מכד או מפזר גוש ערפל.
- id: create-undead
  flavor: >-
    רק אחרי רדת החשכה אפשר להעיר את המתים, וכמה גוויות קמות כגרורי רגליים רעבים הנענים לפקודות שהמטיל ממלמל. כל אחד מהם נושא את הדממה הקשה של הקבר, ורוח קרה כאילו מלווה את המשרתים החדשים בכל מקום שבו הם הולכים.
- id: creation
  flavor: >-
    קווצות צל מתקבצות לדבר שנראה מוצק, מעץ, מבד, מאבן או ממתכת, כל מה שהמטיל מצליח לצייר בבהירות בדמיונו. יצירות שבריריות דועכות מהר יותר מיצירות איתנות, וחומר הצל לעולם אינו שוכח לגמרי מאין בא.
- id: cure-wounds
  flavor: >-
    חום זורם דרך מגע אחד ותופר מחדש עור קרוע ושריר חבול, והגוף מתאושש מהר יותר ממה שנראה אפשרי. ידיים מיומנות מבהירות את הזוהר, ואפילו מגע מגושם מביא מעט הקלה.
- id: dancing-lights
  flavor: >-
    קומץ אורות, בצורת לפידים או פנסים או כדורים מרחפים, מתנודד באוויר, ואפשר לשכנע אותו להתקפל יחד לדמות אנושית מעורפלת. היא צועדת בחן נוצץ ורצה בקלילות על הגגות כמו חתול שצד עכברים.
- id: darkness
  flavor: >-
    דיו שנשפך לאוויר, כדור של קדרות שבולע את אור הלפיד בשלמותו. גם עיניים חדות שרגילות לעמעום לא מוצאות בתוכו דבר לאחוז בו, וכיסוי פשוט של בד או ברזל יכול לחנוק אותו. קוסמי הכפר אוהבים להסתיר מאחוריו את התגנבותם.
- id: darkvision
  flavor: >-
    יש יצרני פנסים שנשבעים שהחושך הוא רק שמועה שמפיצים אנשים שמעולם לא למדו לכווץ את העיניים. חוש שאול, שנלחץ אל עיניו של חבר מרצון, מאפשר לו לקרוא שלטי פונדק מוצלים בקלות של צהריים.
- id: daylight
  flavor: >-
    קוסמי הכפר קוראים לזה צהריים שאולים. כדור בהיר עולה מעל הכיכר ושופך אור לבן וחם על כל אבן מרוצפת, והיצורים שארבים בעלטה הרגילה מתגנבים החוצה לחפש חושך קריר יותר.
- id: death-ward
  flavor: >-
    מרפאים עקשנים מלמדים כלל פשוט: הגוף עלול ליפול, אבל החוט האחרון מחזיק. סימן קטן שנלחץ אל חזהו של חבר קונה נשימה אמיצה אחת, לפני שהקבר יתבע את שלו.
- id: delayed-blast-fireball
  flavor: >-
    חוט בהיר של אור צהוב קופץ מן המטיל ותלוי באוויר כחרוז זוהר, חם וסבלני. מי שרשלן מספיק לגעת בו מגלה שהוא רעב לחום, וככל שהוא ממתין, כך הוא בולע יותר אש לפני הפריחה הרועמת האחרונה.
- id: demiplane
  flavor: >-
    חוקרים זהירים בחנויות מגילות צפופות מתארים דלת שנפתחת אל מקום שאינו מופיע על שום מפה. מאחורי המסגרת הצללית ממתין חדר פשוט של אבן או עץ, מטואטא וריק, מוכן לכל מה שמטייל יבחר להשאיר בתוכו.
