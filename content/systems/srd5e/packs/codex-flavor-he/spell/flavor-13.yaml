- id: prismatic-wall
  flavor: >-
    יריעת אור אנכית, שעוברת בין שבעה צבעים, עולה במקום שבו עמד קודם אוויר ריק. השכבות נחצות לפי הסדר, אחת בכל פעם, וכל אחת תובעת דבר אחר ממי שמעז לעבור. מגע בה גורם לעצבים לזמזם, והזוהר בהיר עד כדי כך שהוא צורב את העיניים הסמוכות.
- id: private-sanctum
  flavor: >-
    קובייה של שקט שנחצבה מן העולם, עם קירות שבולעים קולות וערפל שאינו מניח למבט לחדור. קרטוגרפים ושכנים רכלנים כאחד מוצאים שהמקום פשוט אינו שם כשהם מחפשים אותו. הטלה חוזרת על אותו מקום במשך שנה של בקרים הופכת את השקט לקבוע.
- id: produce-flame
  flavor: >-
    להבה קטנה יושבת בכף היד הפתוחה, בהירה דיה כדי לקרוא לאורה אך חסרת חום לגמרי. בעליה יכול להשליך פס של אש על יריב או על דלת נעולה, והניצוצות אף פעם אינם בדיוק במקום שציפו להם. חוגי הדרואידים הישנים קוראים לה אח שמסרב להישאר במקומו.
- id: programmed-illusion
  flavor: >-
    סצנה מתורגלת מראש ואז מושארת להמתין, שקטה ובלתי נראית, לרמז שלה. כשהגורם המפעיל מגיע סוף סוף, ההופעה פורצת לחיים בדיוק כפי שנכתבה, ואז נעלמת ומתמרמרת זמן מה עד שתוכל לשחק שוב. מי שדוחף אותה פוגש הד חלול שמסגיר את התעלול.
- id: project-image
  flavor: >-
    כפיל חיוור של המטיל צועד החוצה ומדבר בקולו, עם אותה הרגל לעצור לפני שקר. הוא משוטט למרחקים שהמטיל ראה פעם, וכל עין שהוא פוגש רואה פנים מוכרות. מכה אותו והוא מתפוגג, ומשאיר את הדובר האמיתי תוהה לאן נעלם האמון.
- id: protection-from-energy
  flavor: >-
    נצנוץ דק נח על הגוף המסכים ומסיט את הגרוע שבכוח אחד שנבחר: כפור, להבה, חומצה, ניצוץ או שאגת הרעם העמוקה. המטיל בוחר את היסוד לפני שהלחש תופס, והמגן זוכר את הבחירה עד שהוא דועך. נפחים ומלחים נשבעים בו כאחד.
- id: protection-from-evil-and-good
  flavor: >-
    צלוחית מים קדושים נשפכת על נפש מסכימה אחת וחותמת הגנה מפני יצורים מסוימים שחומקים פנימה ממקום אחר. אורחים מסוג העולם הלא נכון מוצאים את המוגן קשה למגע, ולחישותיהם מחליקות מעליו כמו גשם. ההגנה נמשכת רק כל עוד המטיל שומר עליה בדעה מיושבת.
- id: protection-from-poison
  flavor: >-
    מגע פשוט מסיים את המחלה בדם, כאילו הגוף רק חיכה לרשות להקיא אותה. לזמן מה אחר כך הבשר מתנגד למנה הבאה והקיבה מתחזקת. עשבונאי רובע הנהר נשבעים שהאפקט עקשן יותר ממה שכל תווית על בקבוק מוכנה להודות.
- id: purify-food-and-drink
  flavor: >-
    מילה ממלמלת הופכת מרק מקולקל לדבר שטבח לא יתבייש להגיש. הרקבון מתנתק בענן קטן ומשאיר את הלחם פריך והיין צלול. פקחי השוק נהגו לבדוק את הלחם פעמיים בכל זאת, ובצדק.
- id: raise-dead
  flavor: >-
    יהלום בגודל שזיף נמס אל הפצע, ונשימה חוזרת לגוף שהיה דומם ימים. החזרה אינה התעוררות עדינה. המוחזרים צועדים בכבדות שבועות, ושיווי המשקל והאומץ שלהם חוזרים לאט.
- id: ray-of-enfeeblement
  flavor: >-
    קרן דקה של אור אפור שוקעת בעצמות המטרה ומשאירה את השרירים כמו נייר רטוב. המועצות הישנות מלמדות אותה כשיעור אכזרי בסבלנות, שכן הקורבן ממשיך לנסות לנער מעליו את החולשה. כל ניסיון כושל להתאושש רק נותן לקרן עוד הזדמנות לנשוך.
- id: ray-of-frost
  flavor: >-
    פס כחול-לבן של קור יוצא מאצבעות המטיל ונוחת בפצפוץ של כפור. בני הנהר טוענים שהצינה נשארת ברגליו של יצור זמן רב אחרי שהעקיצה דועכת, והופכת כל צעד לוויכוח קטן. תגרנים אוהבים אותה בריבים, שכן רגל קפואה מסיימת יותר מחלוקות מנאום ארוך.
- id: ray-of-sickness
  flavor: >-
    קרן ירקרקה מחליקה מקצות האצבעות ומוצאת את מטרתה בשריקה לא נעימה. תחושת החולי שהיא משאירה היא מהסוג שהופך קיבה זמן רב אחרי שהמכה נחתה. רוקחים מתלוננים שריחה החמוץ נדבק למעילים, מחיר הוגן ללחש קטנוני כל כך.
- id: regenerate
  flavor: >-
    חמימות ירוקה איטית זוחלת בגוף מוכה וקושרת בשר מהר מכל משחה. פחחים מסובבים גלגל קטן מפליז כדי להחזיק את האפקט, והאיחוי נמשך זמן רב אחרי שהחולה קם על רגליו. אומרים שאפילו אצבעות אבודות צומחות מחדש, מה שהופך את החשבון מהמרפא לעניין אחר לגמרי.
- id: reincarnate
  flavor: >-
    נוסע מת מקבל גוף חדש והזדמנות שנייה לחיים, אף שלעתים נדירות עם אותם פנים. הנשמה מגיעה עם זיכרונותיה שלמים, מה שנוטה להפוך שיחות בפונדק למביכות לזמן מה. מרפאי עיר הביצות מתעקשים שהצורה החדשה מתאימה לנשמה יותר מכפי שהישנה התאימה לה אי פעם.
- id: remove-curse
  flavor: >-
    מגע זהיר מתיר כל כישוף שדבק ביצור או בחפץ אחד, כמו קשר שמתרופף באצבעות סבלניות. תכשיטים מקוללים הם עניין אחר, שכן הכישוף נשאר במקומו גם אחרי שהקשר עם הבעלים נותק. אספנים נבונים מחזיקים בהישג יד זוג כפפות רזרבי לרגע הזה.
- id: resilient-sphere
  flavor: >-
    בועה זגוגית נסגרת בקול נקישה על יצור או חפץ קטן, מזמזמת בשקט ומנערת מעליה כל מכה מבחוץ. דבר אינו עובר את עורה, לא פלדה, לא ניצוצות ולא לחש ערמומי של יריב. מי שבפנים עדיין נושם, מה שהפך אותה לחביבה על נוסעים חרדים ועל שחקני שחמט זהירים מאוד.
- id: resistance
  flavor: >-
    בן לוויה מסכים מתייצב במילה רכה ובנצנוץ קלוש, מוכן לספוג מכה בלי להירתע. כל פגיעה פוגשת חומה עבה מעט יותר, בתנאי שהמטיל נוקב בסוג הצרה הנכון. תופרי גלימות מוכרים זה זמן רב חיקוי זול של התעלול, ואיש מעולם לא ביקש מהם להפסיק.
- id: resurrection
  flavor: >-
    יהלום מתפורר לאפס בכף היד, ודמות שמתה מזמן שואבת שוב את נשימתה הראשונה. פצעים קטלניים נסגרים, איברים אבודים חוזרים וכל ארס ישן בדם נשטף. החזרה היא מכה קשה, והמוחזר נשאר מגושם וקצר רוח עד שהגוף נזכר איך להיות חי.
- id: reverse-gravity
  flavor: >-
    חצץ מפוזר, כובעים תועים וציפורים נבהלות עולים יחד, כאילו השמיים החליטו למשוך אליהם בחזרה. כל מי שאין לו אחיזה איתנה מרחף כלפי מעלה עד שהוא פוגש תקרה או נתלה בקצה, ממתין שהכבידה תשוב להיגיון.
