- id: moonbeam
  flavor: >-
    עמוד של אור חיוור יורד מרקיע כוכבים צונן ונח על פיסת אחו כמו אוהל כסוף. יצורים שנתפסו תחתיו מרגישים את הזוהר מושך בהם, והדרואיד יכול להוביל את העמוד על פני השדה בתנועות איטיות ומדודות.
- id: move-earth
  flavor: >-
    עפר, חול וחימר נענים ליד איטית ומדודה, עולים לגבעות או שוקעים לתעלות כאילו הארץ שינתה את דעתה. אפשר להקים חומות או לשטח אותן, והנוף החדש נראה כאילו תמיד היה שם, ושותק בהתרסה.
- id: nondetection
  flavor: >-
    יצור או חפץ קטן נעטפים ברעלה שקטה שעיני הצופים בבדולח מחליקות מעליה. את הרעלה משלמים באבקת יהלום, שנצרכת עם הנעילה של ההגנה, והמנבאים מתלוננים שכדורי הבדולח שלהם מראים להם רק רהיטים ריקים.
- id: pass-without-trace
  flavor: >-
    הילה אפורה ורכה יורדת על חבורה קטנה, ועקבות רגליה פשוט חדלים להופיע באבק שמאחוריה. צדים שסומכים על עקבות מוצאים אדמה חשופה, וחיות היער כאילו שוכחות שמישהו עבר שם בכלל.
- id: passwall
  flavor: >-
    פתח מסודר בצורת דלת נפער בקיר של עץ, טיח או אבן, ונשאר פתוח מספיק זמן כדי שנוסע זהיר יצעד דרכו. כשהוא נסגר, המשטח מתאחה בלי סדק, ושומר בצד השני נשאר לגרד בראשו.
- id: phantasmal-force
  flavor: >-
    פיסת צמר גפן קטנה היא כל מה שהאשף צריך כדי לארוג תמונה בראשו של מישהו. הקורבן רואה גשר, חיה או קיר ערפל, ומאמין בכל לבו. את השאר עושה המוח שלו, וממציא סיבה לכל דבר מוזר שקורה.
- id: phantasmal-killer
  flavor: >-
    בכל מוח יש גלריה פרטית של הפחדים הגרועים ביותר, והלחש הזה צועד בה בלי הזמנה. התמונה נבנית רק עבור בעליה, מעוצבת מהצללים שהוא מפחד מהם יותר מכול. יש קורבנות שמתעוררים מהחזון מזועזעים, ויש כאלה שלעולם אינם חדלים לשמוע את צעדי הרגליים שמעולם לא היו.
- id: phantom-steed
  flavor: >-
    רעמה שחורה כדיו, פרסות שתופפות על לא כלום, ואוכף שנתפר מעשן. קוסמי השדות קוראים לזה דרך זולה לחצות עמק, והם צודקים. הסוס דוהה בנימוס כשזמנו נגמר, ומשאיר לרוכב רגע לרדת לפני שהאדמה כאילו מושכת בכתפיה ומסלקת אותו.
- id: planar-ally
  flavor: >-
    עסקה עם משהו עצום ורחוק, בדרך כלל במחיר של מטבעות או טובות. הישות שולחת שליח נאמן שחב לה שירות, והשליח חופשי לקבוע את מחירו. כוהנים זקנים אומרים שהעסקאות היקרות ביותר הן אלה שמשלמים עליהן במשימות ולא בזהב.
- id: planar-binding
  flavor: >-
    קל לתאר כבילה של יצור זר וקשה מאוד לבצע אותה, ולכן המועצות הקדומות מתעקשות על תכשיט כמחיר. היצור חייב להישאר קבוע במקומו בזמן שהמילים נאמרות, ורק גאוותו העיקשת יכולה להתנגד. כשהוא נכנע, הוא משרת בצייתנות זעופה, ומעקם כל פקודה לכיוון מטרותיו שלו.
- id: plane-shift
  flavor: >-
    מעגל של ידיים שלובות, מוט מפוצל שמזמזם מרחק שאול, וזעזוע שמשאיר את הקיבה מאחור. נוסעים מספרים שהיעד מגיע בחלקים: קודם ריח, אחר כך צבע שאין לו שם בבית, ואז האדמה. הנבונים שביניהם תמיד אורזים זוג מגפיים נוסף.
- id: plant-growth
  flavor: >-
    גדרות חיות מתעבות לחומות, שורשים מבצבצים בין אבני הריצוף, והפרדס נושא פרי כבד מכפי שכל חקלאי ראוי לו. אנשי הנהר הזקנים אומרים שהירוקים זוכרים מי העיר אותם. סבך צפוף הוא מחסום מצוין, והתבואה שמחה בו.
- id: poison-spray
  flavor: >-
    ענן אד חולני, ירקרק וחיוור ומתוק קלות, נסחף אל מטרה מבוהלת. אנשי המעבדה טוענים שהאדים הם כימיה פשוטה, והאקדמאים במגדליהם חולקים בקול רם. כך או כך, הקורבן טועם מתכת הרבה אחרי שהשיעול פסק.
- id: polymorph
  flavor: >-
    פקעת נכרכת סביב הנושא, ומשהו זר מתפתל בתוכה. היצור שומר על לבו ועל זיכרונותיו, אבל צורתו שייכת לחיה שבחר המטיל. הציוד שלו שוקע בגוף החדש ופוסק להיות משהו שאדם יכול להשתמש בו.
- id: power-word-heal
  flavor: >-
    מילה אחת של איחוי, שנאמרת בקול הנשמע כמו מים חמימים על אבנים. פצעים נסגרים, הרעל מתנקז, והרעד בגפיים פשוט נפסק. אפילו דמות שחוחה מתיישרת במידה מספקת כדי לעמוד ולהתמודד עם היום.
- id: power-word-kill
  flavor: >-
    הברה אחת של פקודה צרופה, והלב פשוט חדל להחליט לפעום. החלשים נופלים בלי קול, ומותירים לחופר הקברים רק לסדר. קורבנות חסונים יותר סובלים סערה של כאב פנימי לפני שהם משתתקים.
- id: power-word-stun
  flavor: >-
    מחשבה נלחצת שטוחה, כמו עלה בין דפים, והמוח משתתק. יצורים חזקי גוף מנערים מעצמם את המכה, רק כדי לגלות שרגליהם שכחו את ייעודן. המוח המסונוור מטפס בחזרה קצת יותר בכל תור, עד שהערפל מתפוגג.
- id: prayer-of-healing
  flavor: >-
    ליטניה ארוכה ומלמולה, שנאמרת בחבורה קטנה של מאמינים, שירות שבו איש אינו מסתכל בשעון. הנפיחויות שלהם דוהות, נשימתם נעשית קלה יותר, והם יוצאים מהחדר בצעד קליל. מי שכבר זכו לברכה פעם אחת צריכים לישון את עייפותם לפני שהמילים יפעלו שוב.
- id: prestidigitation
  flavor: >-
    התעלולים הקטנים שכל חניך לומד ראשונים: מטר ניצוצות, משב רוח, נר שמדליק את עצמו ואז מתחרט. ספלים מתחממים או מתקררים לפי בקשה, וכתם עיקש נמוג לאפס. מעט אדונים טורחים לכתוב את התעלולים האלה, ולכן המורים פשוט קוראים להם מטלות.
- id: prismatic-spray
  flavor: >-
    שמונה פסי אור צבעוני נפתחים כמניפה בחרוט, וכל אחד מהם צרה מסוג אחר. אחד צורב כמו פליז לוהט, אחד מסריח מרקב חמוץ, ואחד הופך יצור לפסל קשיח של אבן אפורה. מעט צופים אמיצים מספיק כדי לעמוד בדרכו.
