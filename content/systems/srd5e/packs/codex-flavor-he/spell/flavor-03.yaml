- id: charm-person
  flavor: >-
    מבט נעים, חיוך חם ומחמאה בעיתוי הנכון יכולים להפוך זר לחבר למשך לחש אחד. החבר החדש שמח על החברה, ומסרב באורח תמוה לשמוע מילה רעה על המטיל. בטברנות שבשכונות בני הנהר מתווכחים מזה זמן רב אם זה נימוס או שובבות.
- id: chill-touch
  flavor: >-
    מגע קר כאבן מרתף משאיר אחריו כאב אפור, והפצע מסרב להיסגר לזמן מה. עוסקי הקבורה נשבעים שהקור מגיע ממקום עמוק הרבה מתחת לאדמה, שבו המתים מחזיקים מזג אוויר משלהם.
- id: chromatic-orb
  flavor: >-
    כדור קטן של אנרגיה אצורה נזרק לעבר יעד, וצבעו מכריז איזה סוג של צרות הוא מתכוון לגרום. חומצה שורקת, רעל מחמיץ, כפור נושך, להבה מתלקחת ורעם מטלטל את השיניים. לפעמים הכדור לא מצליח להתאפק ומחפש יעד שני, ואיש אינו בטוח לגמרי מדוע.
- id: circle-of-death
  flavor: >-
    אנרגיה אפלה מתפשטת בגלים מנקודה אחת שנבחרה, ושואבת צבע וחום מכל מה שנקלע לתחומה. עשב מחוויר לחום, נרות מעומעמים והחיים מרגישים לפתע מבוגרים יותר מכפי שהיו בארוחת הבוקר. מרפאים וחופרי קברים מסכימים שזה לחש נורא, ויעיל מאוד.
- id: clairvoyance
  flavor: >-
    חיישן קלוש מכדי שמישהו ישים לב אליו מרחף אל מקום שהמטיל מכיר היטב, ומה שהוא קולט זורם חזרה כאילו המטיל עומד שם. סופרים ממצפי כוכבים רחוקים כיוונו את הלחש בעזרת קרן משובצת אבני חן או עין זכוכית, ונשבעו שהחיישן מעדיף חדרים מוכרים.
- id: clone
  flavor: >-
    עותק של גוף גדל לאט בכלי אטום, שקט וריק עד לרגע שנקבע. כשהמקור נופל, הגוף החלופי יוצא החוצה כשפניו כבר מחכות לתורן. פילוסופים מתווכחים מזה דורות אם העותק יורש את החובות, ועורכי הדין עדיין לא הכריעו.
- id: cloudkill
  flavor: >-
    ערפל ירוק-צהוב וחולני מתגלגל החוצה מנקודה נבחרת ושוקע על כל מה שמתחתיו, סמיך עד כדי כך שהעיניים דומעות והגרונות נחנקים. עיירות כרייה חוששות מאדים דומים כבר מאות שנים, ולכן אלכימאים זהירים שומרים ללחש שם קודר.
- id: color-spray
  flavor: >-
    קורט חול צבעוני נזרק לאוויר ומתפרץ בהבזקי אור מסנוורים. מי שנקלע למניפת הזוהר נשאר מכווץ עיניים ומצמץ, ואינו רואה כמעט דבר עד שההבזק דועך. אמני רחוב מקנאים בתעלול הזה מזה זמן רב, אף שלעולם לא יודו שהשאילו אותו ממישהו.
- id: command
  flavor: >-
    מילה אחת, בטון הנכון, יכולה לגרום לשומע עיקש לצעוד קדימה, לכרוע ברך או פשוט לעצור. סמלי תרגיל ומארחים לחוצים מעריכים שניהם את התעלול, והוא עובד הכי טוב כשהדובר נשמע כמי שמצפה לציות.
- id: commune
  flavor: >-
    שיחה שקטה עם מי שעתיק בהרבה מכל פעמון מקדש, שמגיעים אליה דרך ענן קטורת מתוקה ובקשה שנלחשת. התשובות חוזרות כמילים בודדות וקצרות, ושואל נבון לומד לנסח כל שאלה כך שאי אפשר יהיה להפוך תשובה של כן או לא נגדו.
- id: commune-with-nature
  flavor: >-
    טקס שקט מאפשר לדרואיד להקשיב לארץ, והארץ עונה בשפת הרוח, השורשים והמים. שאלות על מה שמעבר לרכס הבא נענות בתחושה רכה ובטוחה של השטח. מתבודדים אומרים שהתשובות נחלשות בכל מקום שבו אבן ומכונות דחקו את הירוק.
- id: comprehend-languages
  flavor: >-
    לשונות זרות מאבדות לזמן מה את הערפל שלהן, ודיבור שרגע קודם היה גיבוב הברות מתיישב לכדי הגיון פשוט. גם דפים משורבטים מוסרים את משמעותם, אך רק לקורא שנוגע בנייר. צפנים וקודים, לעומת זאת, שומרים על סודותיהם, כי להבין מילים זה לא כמו לראות מבעד לשקר מחוכם.
- id: compulsion
  flavor: >-
    קהל צופים מגלה שהקרקע מתחת לרגליו נוטה לכיוון אחד, כאילו גאות חמה עטפה אותו. לא גוררים אותם בשלשלאות, ובכל זאת כל צעד נשען על ההכוונה. רבים מנערים את הלחש מעליהם ברגע שתחושת העצמי העקשנית שלהם חוזרת.
- id: cone-of-cold
  flavor: >-
    נשימה של חורף נשפכת ומתגלגלת על פני טריז רחב של אוויר פתוח, ומשאירה כפור על כל מה שהיא נוגעת בו. מי שנקלע לדרכה עלול להפוך לפסל נוצץ, ונשאר כך עד שחום כלשהו מפתה אותו בחזרה לחיים. אשפי שוליים זקנים אומרים שהשקט שאחרי הוא החלק הגרוע ביותר.
- id: confusion
  flavor: >-
    מחשבות מתפזרות כמו ציפורי דרור שנבהלו בתוך חבורת עוברים ושבים, וכל אחת נודדת לה בדרכה המשונה. יש שעומדים בהבעה ריקה, יש שמועדים סביב עצמם, וכמה מכים בכל מה שקרוב אליהם. בטברנות של הרובע הישן עדיין מתווכחים אם ההשפעה הזאת היא קללה או חסד.
- id: conjure-animals
  flavor: >-
    להקה של חיות רפאים מתכנסת מן המקומות הפראיים, זאבים או נחשים או ציפורים, דמויותיהן מרצדות כמו אדי נשימה בבוקר קר. הן בלתי מוחשיות ועוברות דרך אבן ופלדה, ובכל זאת יודעות לדחוק אויב לפינה גרועה בסבלנות מצמררת.
- id: conjure-celestial
  flavor: >-
    עמוד של אור לבן יורד משמיים שאינם בדיוק אלה שמעל לראש, ומאיר מגדל צר של אוויר שבו מתגבשת נוכחות בהירה. מי שעומד בתוכו מרגיש חום שוקע לתוך עצמותיו, ואחרים נצרבים בזוהר שגורם לעיניים לדמוע. עדים נשבעים שהשמיים שמו לב.
- id: conjure-elemental
  flavor: >-
    רוח של אבן, להבה, סופה או גאות תלויה באוויר, וצורתה רופפת וכמו רפאים. טבעה קובע את נשיכתה, בין אם זה היבהוב ברק, פעיית רעם מתגלגלת, התפרצות אש בהירה או צינה שחודרת עד העצם. מי שמשוטט קרוב מדי עלול להימשך אל מבחן של זריזות.
- id: conjure-fey
  flavor: >-
    רוח חיוורת ושובבה מתגבשת בכל דמות שהמטיל בחר, כולה קרניים וניצוצות. היא עשויה להכות בטפר של לחץ נפשי, ולהותיר את הנפגע מזועזע ומבוהל לזמן מה. זה מרגיש פחות כמו זימון ויותר כמו ביקור לא מוזמן של שכן שמעולם לא למד לדפוק בדלת.
- id: conjure-minor-elementals
  flavor: >-
    רוחות קטנות של היסודות מסתחררות סביב המטיל בטבעת רופפת, ומבזיקות בכפור, באש, בברק או בחומצה לפי מה שהרגע דורש. כל מכה שנוחתת על אויב בתוך הטבעת נושאת עוקץ חד נוסף, והאדמה שם הופכת בוגדנית לכל מי שינסה לחצות אותה בריצה.
