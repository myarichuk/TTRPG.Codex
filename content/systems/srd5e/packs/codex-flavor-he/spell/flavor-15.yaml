- id: silent-image
  flavor: >-
    תמונה מצוירת קמה ומהלכת, ובכל זאת לא נשמע צעד אחד. הדמות אינה אלא צורה מלאכותית, וכל מי שדוחף אותה ירגיש רק אוויר ויבין את התעלול. להטוטני במה קוראים לזה הדרך הזולה ביותר לגרום לקהל להאמין בדרקון.
- id: simulacrum
  flavor: >-
    גוש שלג מעוצב ונושם עליו עד שהוא קם על רגליו, זהה בדיוק לחיה או לאדם כפי שהיו ברגע היצירה. זהו העתק שאינו יודע ליאות, בעל לב קר. היוצר חייב לשמור על גופו השביר בעזרת אבנים יקרות, או לראות אותו נמס לשלולית.
- id: sleep
  flavor: >-
    דממה מנמנמת של קסם מתגלגלת על פיסת אדמה ומשכיבה את שומעיה כמו חיטה לפני רוח כבדה. בעלי עפעפיים כבדים שוקעים בשינה העמוקה ביותר בחייהם, ואילו העקשנים רק מהנהנים במקומם. אלפים, שאינם זקוקים לשינה כזו, מנערים אותה מעליהם בפיהוק שנראה כמעט גס.
- id: sleet-storm
  flavor: >-
    שפע אפור וקפוא ממלא עמוד אוויר גבוה, הופך את הקרקע לזכוכית חלקלקה וחונק כל להבה גלויה. מי שמתהלך בו מגלה שהמגפיים מחליקים והשיווי משקל אובד. נוסעים נבונים משאירים את המעילים רכוסים ואת הפנסים רחוק מהשוליים.
- id: slow
  flavor: >-
    האוויר מסמיך את עצמו מעל קומץ דמויות חסרות מזל, שנעות כאילו הן הולכות בתוך סירופ חמים. איבריהן כבדים, הרפלקסים שלהן נתקעים, וכל מכה שהן מנסות להנחית מגיעה באיחור ובמעט מגושמות. אפילו מטיל מיומן עלול לשבש תנועה, שהרי יד מואטת נעה בקצב של זפת עתיקה.
- id: sorcerous-burst
  flavor: >-
    קרן של כישוף גולמי יוצאת מאצבעות המטיל ומחפשת מטרה בחוסר סבלנות של כלב רעב. היא גורמת את סוג הנזק שהמטיל מעדיף, אם זה כפור, להבה, ריקבון או חבטת רעם. מדי פעם הניצוץ בוער חזק מהצפוי, ופוחזי הפונדק נשבעים שזה כישרון.
- id: spare-the-dying
  flavor: >-
    יד המונחת על גוף גוסס יכולה לעכב לזמן מה את קצה המוות האפור. היצור אינו מתעורר ואינו מתרפא, אבל נשימתו מתייצבת והחושך הגרוע ביותר נסוג. מרפאים בעיירות הנהר אומרים שזהו החסד השקט ביותר שאפשר לתת.
- id: speak-with-animals
  flavor: >-
    לזמן קצר, אנשי היער בעלי הפרווה והנוצות הופכים לשותפי שיחה שוטפים. לרוב החיות לא אכפת מפוליטיקה או משירה, אך הן ישמחו לספר מה ראו, הרחרחו או מעדו עליו לאחרונה. סיירים רואים בשיחות כאלה סוג של חילופי רכילות שכנים, שימושיים ברובם וחסרי נימוס מעט.
- id: speak-with-dead
  flavor: >-
    גופה מקבלת כוח לחיקוי קצר וחורק של עצמה הקודם, ומסוגלת לענות על קומץ שאלות. מתים הם לעיתים נדירות עדים טובים, שהרי הם יודעים רק מה שידעו כשליבם חדל לפעום. תשובותיהם יוצאות קטועות, מעורפלות או חוזרות על עצמן בעקשנות, ואויבו של המת לא יקבל ממנו אלא שתיקה זעופה.
- id: speak-with-plants
  flavor: >-
    דברים בעלי שורשים מקבלים קול לזמן מה, ויכולים לדווח מה נגע בהם בדרכו ואם ירד גשם על עליהם. אפשר לשכנע סבכים וקוצים להיפתח או להסתבך, ולכופף את האדמה לנוחות הנוסע. צמחים אינם יכולים ללכת, אך הם מסוגלים לנופף בענפיהם לאות עזרה.
- id: spider-climb
  flavor: >-
    ברק דביק ואוחז שוכן על כפות הידיים והרגליים של בן לוויה מוכן, ומאפשר לו לטפס על קירות ולזחול על תקרות רק בעזרת אומץ ליבו. זה נראה כאילו מישהו שאל את האחיזה של עכביש. החלק הטוב ביותר הוא שהידיים נשארות פנויות, ויש בהן מקום לאבוקה ולפגיון.
- id: spike-growth
  flavor: >-
    הקרקע שמתחת לפיסת דשא מצמיחה יבול של קוצים קשים, שנראה טבעי לגמרי עד שמישהו דורך בו. כל צעד בסבך גורר דקירה חדה מהרשלנים. עוקבי עקבות שמכירים את מקצועם לומדים לקרוא בעלים רמז לכך שמשהו אינו כשורה.
- id: spirit-guardians
  flavor: >-
    רוחות חיוורות ומשגיחות מרחפות בטבעת רחבה סביב מטיל מסור, ולובשות מראה של פיות או של זוהר כשהמטיל אדיב, ומראה של בני תופת כשאינו כזה. אויבים שנדחקים אל תוך הטבעת מרגישים את רגליהם כבדות, ואור צורב או קור קברים קורע בהם, לפי נטיות לבו של המטיל.
- id: spiritual-weapon
  flavor: >-
    להב רפאים, אלה או פטיש מתממשים באוויר ומזמזמים בשקיקה זריזה וסבלנית. אפשר לשלוח אותם לחתור אל אויב ולהכות בכוח שנשמע כמו פעמון. כל ביקור נוסף הוא מכה חדשה, אמינה כמו פקיד שאינו שוכח חשבון.
- id: starry-wisp
  flavor: >-
    גרגר של אור כוכבים שועט מידו של המטיל ועוקץ את מטרתו בניצוץ קר ובהיר. הזוהר נשאר אחר כך כמו זנב של שביט, וכל מי שמנסה לחמוק מגלה שקל לזהות אותו.
- id: stinking-cloud
  flavor: >-
    ענן ערפל צהוב וחולני פורח במקום שבחר המטיל, ומריח כמו חבית של ביצים נשכחות. מי שנושם אותו משתנק, מתמוטט ומוצא עצמו חולה מכדי לפעול. האדים נשארים עד שרוח חזקה מגרשת אותם, והמראה הזה הוא המבורך ביותר לכל מי שבסביבה.
- id: stone-shape
  flavor: >-
    האבן נכנעת ליד יציבה ומתרככת לפסל, לנשק, לארגז או למעבר קטן ומסודר בקיר. גילדות הבנאים היו בוכות למראה, שכן אף אזמל אינו יכול להתחרות במהירות השינוי. התוצאה נושאת צירים ובריח, אך פרטי מנגנוני שעון עדינים נשארים מחוץ להישג ידה.
- id: stoneskin
  flavor: >-
    עור של אבן אפורה מתפשט תחת מגען של בן ברית מוכן, והופך חרבות, אלות וראשי חיצים לקשקוש עמום. ההשפעה עבה וכבדה, והיא כולה מתנת המטיל, אף שמחירה הוא אבקת יהלום טחונה דק מספיק כדי לנצנץ. לוחמים שניסו אותה מדווחים על שלווה נוחה ועל הליכה ללא חבורות בתוך הקרב.
- id: storm-of-vengeance
  flavor: >-
    ענן סערה סוער תופח מעל הארץ וגורר רעם, גשם חומצי, ברד וברקים על פני הנוף במצעד גדול. יצורים שמתחתיו מתנודדים תחת קול הרעם הראשון, ואז סובלים מאורע מזג אוויר אכזרי אחד אחרי השני. דרואידים שקוראים לסופות כאלה אומרים שלשמיים זיכרון ארוך לעלבונות.
- id: suggestion
  flavor: >-
    ביטוי רך ומשכנע מחליק אל ראשו של השומע ומתיישב בו כמו חתול בחיק חם. השומע חש דחף לעשות בדיוק כפי שנאמר לו, והדחף נמשך עד שמישהו מנער את המחשבה ממנו במכה. אנשי חצר נשבעים שטיפת דבש עושה יותר מנימה קפדנית.
