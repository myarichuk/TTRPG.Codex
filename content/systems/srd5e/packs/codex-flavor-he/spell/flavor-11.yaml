- id: magic-weapon
  flavor: >-
    להב פשוט או אלה מקבלים זמזום קלוש כשיד יציבה מפתה אותם להיות יותר ממה שהם. המתכת שומרת את החוד השאול בחן עקשני, ונפחים זקנים נשבעים שהיא זוכרת את צורתה של כל מכה טובה.
- id: magnificent-mansion
  flavor: >-
    דלת נוצצת תלויה באוויר, צנועה למראה, ופותחת אל חדרים שאין להם שום עסק להימצא מאחוריה. בפנים הרהיטים משובחים, הלחם חם, והמארח אדיב ללא דופי לכל מי שמנגב את המגפיים.
- id: major-image
  flavor: >-
    תמונה משכנעת של סוס, של פעמון או של אציל זועף אפשר להעלות לעין כול, כולל צלילים וריחות. היא דועכת כשריכוזו של יוצרה מתרופף, ואינה יכולה לנשוך, לחתוך או לתלוש כיס, גם אם היא נראית אמיתית ככל שתהיה.
- id: mass-cure-wounds
  flavor: >-
    גל של אור חם מתגלגל החוצה מנקודה נבחרת, ומוצא בבת אחת קהל שלם של פצועים. חבלות נסגרות, חתכים מתאחים, ואפילו השריטות העקשניות שנשארו מקרב ארוך מרגישות את מגעו של גאות עדינה.
- id: mass-heal
  flavor: >-
    שיטפון של אנרגיה מרפאה נשפך מהמרפא ושוטף כל פצוע וחולה בסביבה. הוא נדיב כמו שטבח טוב נדיב בתבשיל, ורעל, מחשבה מעורפלת והשקט הצלצולי של חירשות מתנקזים החוצה אחריו.
- id: mass-healing-word
  flavor: >-
    משפט קצר ומהוקצע עובר מעל ההמון כמו משב חם, וכל חבול וחבוט מרגיש יציב מעט יותר. כוהנים רבים שומרים אותו בהישג יד לאותן תגרות שנגמרות כשכולם נראים קצת גרוע משהיו.
- id: mass-suggestion
  flavor: >-
    דחיפה עדינה מגיעה בקול שנשמע כמו חבר ותיק, ושתריסר מאזינים מוצאים את הרעיון סביר לגמרי. המועצות העתיקות מלמדות שהדחיפה חייבת להישמע כנה וחסרת מזיקה, אחרת כל העניין הופך לבדיחה גרועה שמתהפכת על בעליה.
- id: maze
  flavor: >-
    זר מחייך נעלם אל תוך מבוך שקופל פנימה על עצמו, כיס של שום מקום שבו הקירות מסתדרים מחדש כרצונם. הנשמה הלכודה עשויה לשוטט עידנים לפני שתיתקל ביציאה, והסיפורים הישנים מתעקשים שהדרך החוצה דורשת תחכום ולא כוח.
- id: meld-into-stone
  flavor: >-
    נוסע נדחק לתוך גרניט כאילו היה חמאה חמה, ואז נשאר רק גרגר הסלע השקט. שם למטה העולם עמום ורחוק, והאבן שומרת את סודה בסבלנותו של דבר שממתין כבר עידנים.
- id: mending
  flavor: >-
    אבזם שבור או תפר שנפער אפשר למשוך חזרה יחד בכמה מילים סבלניות ובזוג אבני מגנט כהות. התיקון אינו משאיר תפר שאפשר למצוא, ואורחים ומכרכי ספרים כאחד ידועים כמי שמתרעמים על כמה מעט עבודה נשארת להראות.
- id: message
  flavor: >-
    לחישה מחליקה לאורך חוט של אוויר ונוחתת באוזן אחת מסוימת, בלי שיתר החדר יהיה חכם יותר. התשובה חוזרת בשקט כמוה, מלמול שנודד רק עד כמה שהדובר מתכוון, אפילו דרך חומות אבן שבדרך כלל היו בולעות כל מילה.
- id: meteor-swarm
  flavor: >-
    ארבע אבנים בוערות קורעות את דרכן משמיים קרים ומפלחות את האוויר מעל שדה הקרב בגשם של רעם מותך. במקום שבו הן פוגעות האדמה לוהטת והעשן מתגלגל בטבעות כבדות, והחכמים ששרדו קוראים לזה הרצאה קצרה שהשמיים נשאו בעוצמה מלאה.
- id: mind-blank
  flavor: >-
    תודעה מרצון נקפלת אל חדר נעול בלי חלונות, וסקרנותם של מרגלים וקוראי מחשבות מקשקשת על הדלת ללא תועלת. הרגשות שותקים, מחשבות פרטיות נשארות פרטיות, ואפילו הכישוף הגדול ביותר אינו מוצא במה לאחוז.
- id: mind-spike
  flavor: >-
    מחט של לחץ פסיוני מחליקה לתוך גולגולת אחת ומשאירה אחריה כאב חד ובהיר. המטיל יכול אז להרגיש לאן הקורבן משוטט, חוט קלוש שמושך על פני מפת מחשבותיו עד שהקשר מתפרם ודועך.
- id: minor-illusion
  flavor: >-
    צליל קטן, הבהוב של אור נר או רישום צבוע של חתול אפשר להעלות במקום לרגע אחד. עיניים קפדניות יכולות לפענח את הטריק, אבל השוליה שיוצר פעמון משכנע תמיד פופולרי במסיבות.
- id: mirage-arcane
  flavor: >-
    רצועה של מישור משעמם אפשר להלביש כביצה, ואפיק יבש יכול להתחזות לדרך חלקה בלי תו שקרי אחד. נוסעים צועדים לתוך הקנים, המגפיים שוקעים, ומעבר שרוף שמש הופך לשקר יפהפה.
- id: mirror-image
  flavor: >-
    שלושה העתקים נוצצים של המטיל צצים לחיים, לכל אחד חיוך שונה קצת והרגל לסטות הצידה רגע לפני שהאמיתי זז. תוקפים מנופפים אל השתקפויות ומקללים את האוויר הריק, בזמן שהדמות האמיתית ממשיכה ללכת.
- id: mislead
  flavor: >-
    כפיל של המטיל עומד לעין כול בזמן שהמטיל נעלם מהעין, והכפיל מדבר, מניע ידיים ומרחף סביב כמו שחקן משועמם על במת חזרות. זה פיתיון חכם, כזה שמחזיק רק עד שמישהו מחליט להכות.
- id: misty-step
  flavor: >-
    נשיפה של ערפל כסוף עוטפת את המטיל לפעימת לב, וכשהיא מתפזרת הוא עומד במקום אחר לגמרי. אגדות הפונדק גורסות שהטריק עובד הכי טוב כשהיעד נבחר מראש, אף שאיש מעולם לא הוכיח זאת.
- id: modify-memory
  flavor: >-
    תודעה מסודרת מחדש בעדינות, כמו פקיד שמערבב ארון תיקים ומשאיר כמה מגירות עמוסות בניירות הלא נכונים. מי שהיה בצד המקבל נוטה לזכור את אחר הצהריים כטשטוש נעים, והטשטוש הזה הוא בדיוק העניין.
