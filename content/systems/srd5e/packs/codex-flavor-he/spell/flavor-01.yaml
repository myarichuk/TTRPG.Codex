- id: acid-arrow
  flavor: >-
    פס ירוק של אור בעל ריח חד יוצא מכף ידו של המטיל, ומתפזר בהתזה של נוזל עוקצני במקום שבו הוא נוחת. מורים בבתי הספר הזולים משתמשים בטריק כדי להמחיש נקודה, והצריבה נשארת הרבה אחרי שההתזה התייבשה.
- id: acid-splash
  flavor: >-
    בועה של אדים ירוקים וחמוצים מתנפחת מעל נקודה שנבחרה ומתפוצצת בטבעת של טיפות שורקות. שוליות בשורות האחוריות לומדים אותו ראשונים, בדרך כלל במקרה, ומעולם לא שיפר ארוחת ערב אחת.
- id: aid
  flavor: >-
    רצועת בד לבן הקשורה לכתפיהם של כמה מתנדבים יכולה לגרום לחבורה עייפה להרגיש אמיצה יותר ממה שמגיע לה. רופאי השדה של עם הנהר נשבעים במנהג הזה, ואף אחד לא שואל למה הקשרים האלה נועדו.
- id: alarm
  flavor: >-
    פעמון וחוט כסף שומרים על פתח, חלון או משטח רצפה ומחכים לרגל לא רצויה. אשפים כפריים קוראים לזה נאמנות זולה, כי היא לעולם לא נרדמת ולא מרכלת.
- id: alter-self
  flavor: >-
    עיצוב מחדש מהיר של זימים, קרומי שחייה או פנים שאולות, שמחזיק מעמד כל עוד המטיל מצליח לשמור על קור רוחו. התוצאות מוזרות בארוחת הערב, אבל המועצות הישנות טוענות שתחפושת טובה שווה כמה היכרויות מביכות.
- id: animal-friendship
  flavor: >-
    פיסת מזון קטנה ומבט יציב יכולים לזכות בלבה של חיית בר, לפחות ליום אחד. החיה נוטה לסלוח על הדקירה הראשונה בקלות רבה יותר מאשר על השנייה, ולוכדי הפרוות הוותיקים יודעים זאת.
- id: animal-messenger
  flavor: >-
    יצור קטן עם הודעה מקופלת מתחת לנוצותיו יוצא בדהרה קלה לעבר מקום שהמטיל ביקר בו פעם. הוא נושא את המילים אל הזר הנכון בעיר הנכונה, וזה יותר ממה שרוב השליחים מצליחים לעשות, והוא לא עוצר בדרך לרכל.
- id: animal-shapes
  flavor: >-
    מעגל של חברים מוכנים משיל את קווי המתאר שלו ולובש צורה של חיה גדולה יותר, ושומר על זיכרונותיו ועל דעותיו. הגופים השאולים מסורבלים עם ידיים וכלים, והחכמים משאירים את שעוני הכיס שלהם בבית.
- id: animate-dead
  flavor: >-
    עצמות או גופה קמים בסבלנות חלולה ומשועממת, וממתינים לקול שמחזיק ברצועה. המועצות הישנות רואות בזה מטלה עגומה, והמומחים הטובים ביותר שומרים רישום של כל משרת שהקימו.
- id: animate-objects
  flavor: >-
    כוסות תה, כיסאות ועמודי גדר מתעוררים ומצמיחים רגליים לא שוות, להוטים למשימה. הם רצים אחרי המטיל כמו כנופיית פועלים שלא קיבלו שכר, ומתפרקים חזרה לגרוטאות רגילות ברגע שמכים אותם לחתיכות.
- id: antilife-shell
  flavor: >-
    כיפה קלושה ונוצצת של אוויר חי מרחיקה בנימוס את קהל הבשר והדם, בזמן שהעצמות והחרס מתהלכים בחופשיות. דרואידי החורשות הקדומות רואים בזה חומה מנומסת, אלא שאורח שייכנס בדרך הלא נכונה יפר את השקט מיד.
- id: antimagic-field
  flavor: >-
    בועה שקטה של כלום מקיפה את המטיל, וכל קסם בתוכה משתתק כמיתר חתוך. מלומדים מתווכחים שנים על השאלה אם השקט הוא מתנה או גניבה, והוויכוחים נשארים לא מוכרעים.
- id: antipathy-sympathy
  flavor: >-
    קללה שקטה של משיכה או דחייה, קשורה לחפץ אחד ומכוונת לסוג שלם של יצורים. מלומדים זהירים מתעקשים שהבחירה בין אהבה לשנאה היא ההחלטה היחידה האמיתית בלחש, ושאר הדברים הם רק ניירת.
- id: arcane-eye
  flavor: >-
    עין זכוכיתית של אור שנאסף מרחפת באוויר ומשוטטת לאן שתשומת הלב של המטיל נודדת. היא רואה לכל הכיוונים בבת אחת, מה שהופך אותה לרגל מצוינת ולאורח נורא.
- id: arcane-hand
  flavor: >-
    יד רפאים גדולה של כוח נוצץ נפרשת לצד המטיל ומעתיקה כל תנועה, כמו שוליה משועמם שמחקה את מורהו. היא יכולה לדחוף, להצמיד או לסחוט, והיא שמחה במיוחד כשיש לה משהו לעשות.
- id: arcane-lock
  flavor: >-
    דלת סגורה או תיבה חתומה רוכשים אחיזה קסומה ועיקשת שמפתחות רגילים ומנופי ברזל לא יכולים להתווכח איתה. המטיל עשוי לשמור רשימה קצרה של אנשים שמורשים לעבור, ומילה שנאמרת בקול יכולה לפתוח את המנעול לרגע לפני שהוא נסגר שוב.
- id: arcane-sword
  flavor: >-
    להב רפאים מרחף באוויר, חרב זעירה של כוונה טהורה, שצוללת אל אויב שנבחר ואז ממתינה לתורה הבא. הפייטנים מעריצים את הפעלולים שלה, והאשפים מעמידים פנים שהם לא שמים לב.
- id: arcanists-magic-aura
  flavor: >-
    ריבוע קטן של משי שנלחץ על יצור מוכן או על חפץ מונח משקר למי שקורא את הקסם. המשתמשים בו אוהבים לומר שזו תחפושת לנשמה, אם כי רובם רק רוצים תחפושת טובה.
- id: astral-projection
  flavor: >-
    גופות שוכבות מקופלות בשינה שקטה, בזמן שבעליהן נודדים אל ים חיוור ואין-סופי של מחשבה. חוט כסוף אחד קושר כל נווד חזרה לביתו, והטקסטים העתיקים מזהירים שחוט שנקרע הוא הדבר היחיד שגרוע יותר מלהיות אבוד שם.
- id: augury
  flavor: >-
    השקט משתרר על החדר בזמן שעד בלתי נראה שוקל את הדרך הצפויה ופוסק את דינו במילה אחת. התשובה טובה רק כמו המקלות, העצמות והקלפים שנשאו אותה, והחכמים משלמים את האגרה כדי לשמור על כנות האותות.
