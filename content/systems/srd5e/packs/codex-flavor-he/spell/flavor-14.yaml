- id: revivify
  flavor: >-
    מגע חטוף מחזיר גופה טרייה מעבר לסף, אך הנשמה השבה מגיעה רועדת וחבולה בקצוותיה. חופרי הקברים אומרים שהיהלום שמשמש לתעלול אינו נראה עוד לעולם, והם יודעים על מה הם מדברים. מה שחסר נשאר חסר, ולכן אל לאיש לבקש בחזרה את שאר הגוף.
- id: rope-trick
  flavor: >-
    חבל פשוט מרים את קצהו אל קורות הגג, עד שהוא תלוי ישר כקו אנך. למעלה נפתח פתח שאיש אינו רואה, אל חדר דחוס שאינו מופיע באף מפה. מי שבפנים יכול להציץ אל הרחוב דרך הסדק, אך שום להב, חץ או מזל רע אינם יכולים לחצות אותו.
- id: sacred-flame
  flavor: >-
    אור חיוור יורד מלמעלה כפנס המשתלשל על חבל, ותופס את היעד בכל מקום שבו הוא מסתתר. מחסה כמעט שאינו מגן, כי הזוהר מוצא כל סדק שחומה או משוכה משאירות פתוח. כוהנים מסוימים קוראים לזה שיעור בענווה למי שבטח בגדר איתנה.
- id: sanctuary
  flavor: >-
    רסיס של מראה חותם הבטחת הגנה על בעל ברית, והופך עיניים עוינות אל מטרות אחרות. לא מעט תוקפים אמיצים מוצאים את עצמם מהססים ברגע המכריע, כי מכה לא בטוחה עלולה לנחות דווקא על זר. הקסם נשבר ברגע שהמוגן מכה בחזרה, וכך החסדים נשארים הוגנים.
- id: scorching-ray
  flavor: >-
    שלושה פסי אש בוהקים זינקו מכף יד אחת, וכל אחד מהם צד את מטרתו כמו כלב שהשתחרר מהרצועה. אשפי שוליים אוהבים אותו נגד המון, כי אפשר לפזר חופן קרניים מהבהבות על פני כמה אויבים. תאי לחשים חזקים יותר מוסיפים פס נוסף למטח, והרעש רק מתגבר.
- id: scrying
  flavor: >-
    בריכה שקטה או גביש מלוטש מציגים פנים רחוקות, ובעל הפנים האלה חש לפתע עקצוץ בעורף. מי שחלק ארוחה עם הנצפה או שמר חפץ לזכרו מוצא את הקשר קל יותר לעקוב אחריו, ובעלי המקצוע ניצלו זאת מימים ימימה.
- id: searing-smite
  flavor: >-
    מכת נשק משאירה סימן לוהט שנדבק לפצע ומסרב לכבות. כל פעימת לב מביאה התלקחות חום חדשה, שהקורבן חייב לנער מעליו בעקשנות צרופה. נפחים בעיר העתיקה טוענים שהלהבים הטובים ביותר הם אלה ששומרים את הסימן אחר כך.
- id: secret-chest
  flavor: >-
    תיבה קטנה גולשת אל מחוץ לעולם אל שכבה נסתרת של האוויר, וממתינה שבעליה יקרא לה הביתה. המפתח היחיד הוא שכפול זעיר העשוי מאותו חומר יקר, ולכן גנב שמצא אותו ראשון כבר ניצח.
- id: see-invisibility
  flavor: >-
    דברים נסתרים מאבדים את הגלימה שלהם לזמן מה, והחדר נראה לפתע צפוף מדמויות שהיו שם כל הזמן. רוחות רפאים חולפות בקווי מתאר חיוורים, והצד השני של הצעיף נראה כערפל שנלכד בתוך מנורה. גנבים שונאים את הלחש כמעט כמו שהם שונאים אור נרות.
- id: seeming
  flavor: >-
    קהל אורחים יכול להתלבש בפנים שאולות, וכל אחד לובש רעיון אחר של הגינות. חייטים ותופרות כאחד אינם אוהבים את התעלול, כי עין חדה או לחי שנוקרים בה חושפות את הצבע שמתחת. הוא מחזיק מעמד לאורך תקופה נאה של שובבות, מספיק לצרות ולא מספיק לכבוד.
- id: sending
  flavor: >-
    חוט מחשבה נמתח ממוח אחד לאחר ונושא כמה מילים קצרות מעל יבשה וים. המקבל שומע את המילים בתוך ראשו ויכול להשיב מיד, אף שמסרים מעטים הולכים לאיבוד. אנשים חכמים יודעים שתשובה משאירה דלת פתוחה, והמקבל רשאי לנעול אותה בפני כל זר.
- id: sequester
  flavor: >-
    חפץ נבחר או יצור מוכן נקפל לתוך דממה שהזמן אינו נוגע בה, ונעלם מעיני כל מי שמציץ ומחטט. הישנים בתוכה אינם מזדקנים ואינם רעבים, והם מתעוררים רק כשהאות המוסכם מופיע לבסוף. בעלים נבונים בוחרים את הטריגר בקפידה, כי תנאי שדומה לחידה עלול לשרוד את סבלנותם של כולם.
- id: shapechange
  flavor: >-
    קווי המתאר של המטיל מתרופפים ונוצרים מחדש כיצור שחקר מקרוב, פרווה או קשקשים מגיעים בתורם. ותיקים מזהירים שהגוף החדש בא עם חוסן שאול, וכרית של מרץ רזרבי דועכת כשהצורה נשלפת. מטילים נבונים בוחרים צורה שלא תפתח ריב עם השכנים.
- id: shatter
  flavor: >-
    רעם פתאומי מתפרץ מנקודה נבחרת ומזעזע כל מה שנתפס בטווחו. זכוכית שרה, פעמונים מצלצלים, ואבן ועץ רגילים רועדים כאילו סערה נלכדה בצנצנת. שענים וסתתים מסכימים שהקול אינו כלום לעומת מה שהוא עושה לעצבים של גולם עקשן.
- id: shield
  flavor: >-
    לוח דק של כוח בלתי נראה נתפס במקומו בדיוק כשהמכה נוחתת. אשפי שוליים קוראים לו הביטוח הזול ביותר במקצוע, כי הוא דורש רק תנועת אצבעות ושנינות מהירה. כל מה שתקף את המטיל מחליק הצידה, וטילי הקסם הקטנים פשוט מתאדים עליו.
- id: shield-of-faith
  flavor: >-
    שדה נוצץ מתיישב על בעל ברית נבחר ומציע שולי ביטחון עקשניים מול להבים וטפרים. סופרים זקנים אומרים שהשדה נראה כמו מים מתנודדים, אך רוב האנשים מבחינים בו רק כשלהב מחליק ממנו. מגילה מגולגלת שתחובה בחגורה מספיקה כדי שמגן מתוח ירגיש אמיץ.
- id: shillelagh
  flavor: >-
    אלה פשוטה או מקל, שאנשי הנהר ליטשו בימים עברו, צומחים בידי הדרואיד לעץ סמיך יותר ולמזג חד יותר. העץ מזמזם בקול חלוש, וכל מכה מצלצלת כרעם רחוק. כשהאחיזה מתרופפת, העץ שוב שותק, כמו כלב שסיים לנבוח.
- id: shining-smite
  flavor: >-
    להב שזה עתה פגע במטרתו נדלק לפתע באור שנראה בא ממקום שמעבר לשמיים. הקורבן זוהר כפנס בערפל, וכל מכה שמכוונת אליו מוצאת מטרה קלה יותר. גלימות וצללים אינם מועילים, כי הזוהר מסגיר כל מי שמנסה להסתתר.
- id: shocking-grasp
  flavor: >-
    פצפוץ קופץ מכף יד חשופה ורוקד על עורו של מי שלא התמזל מזלו שנגעו בו. הניצוצות גורמים לשרירי היעד לקפוץ, ותנועת רגליו מתפרקת. מטילי לחשונים במועצות העתיקות אהבו אותו בגלל הטרטור הנקי והרע-מזג שלו.
- id: silence
  flavor: >-
    כדור של שקט מתיישב על נקודה נבחרת ובולע כל פעמון, צעקה וציוץ שבתוכו. מי שעומד בתוכו מוצא את אוזניו מלאות צמר גפן, ודיבור מסוג הטלת לחשים פשוט אינו יוצא מהשפתיים. כוהני מסדרים שקטים מעדיפים אותו לשמירות לילה, וגנבים מעדיפים אותו לכל השאר.
