- id: healing-word
  flavor: >-
    מילה אחת מהירה, ממלמלת כמו הרגעה לסוס עצבני, והחבורות מתחילות לשכוך. זו עזרה שאפשר להעניק באמצע ויכוח בלי שאיש ישים לב להפרעה. חובשי שדה אוהבים אותה בדיוק בגלל זה, וכך גם מי ששונא לעמוד בתור.
- id: heat-metal
  flavor: >-
    להב או שריון מתחילים לזהור בצבע של שקיעה, והמתכת מתקתקת ונאנחת כשהיא מתחממת. מי שאוחז בה לומד מהר שהאחיזה חשובה פחות מהרצון להרפות. נפחים רואים בזה רמאות, וגנבים רואים בזה שיעור מצוין.
- id: hellish-rebuke
  flavor: >-
    אש ירוקה ומרושעת מתלקחת מעל מי שזה עתה היכה. זו תשובה שנמסרת בעיתוי מושלם, מהסוג שגורם לתוקף לייחל שבחר מטרה שקטה יותר. הלהבות מדיפות ריח קלוש של פלפל ושל החלטות גרועות.
- id: heroes-feast
  flavor: >-
    סעודה מופיעה על חלקת דשא מישורית, גדושה בבשרים צלויים, בלחם שעדיין מהביל ובפירות שנראים כאילו נקטפו הבוקר. אומרים שמי שמתיישב לאכול קם יציב יותר, אמיץ יותר, וקשה בהרבה לערער. הקערה שמאפשרת את כל זה, למרבה הצער, נצרכת בתהליך.
- id: heroism
  flavor: >-
    חמימות יציבה נקבעת בחזה ומסלקת את הרעד מהברכיים. הפחד גולש מהעור כמו גשם מגלימה טובה, ובתחילת כל תור מופיעה כרית קטנה של עקשנות. פייטנים כותבים על זה שירים, בדרך כלל גרועים.
- id: hex
  flavor: >-
    קללה קטנה וזדונית נתפסת ביצור כמו קוץ בגרב. כל מכה שהמטיל מנחית נושאת עוקץ חמוץ נוסף, והמזל של היעד מחליק בדיוק ברגעים הלא נוחים. מכשפים רואים בה טינה ארוכת טווח שנכתבה, אגב, בדיו.
- id: hideous-laughter
  flavor: >-
    מישהו בקהל נתקף התקף צחקוקים כה חזק שהברכיים נוטשות אותו. הצחוק בלתי רצוני ולא ממש מכובד, והמסכן מנסה לקום ושוב מפסיד בוויכוח עם כוח המשיכה. קשה לרחם על מי שמתנשף בעליזות כזאת על הרצפה.
- id: hold-monster
  flavor: >-
    יצור בכל גודל קופא באמצע צעד, והשרירים שלו מסרבים לכל פקודה של המוח שלו עצמו. העיניים עדיין זזות, וזה איכשהו גרוע יותר. קוסמים בעלי חוש הומור מחזיקים תוכנית גיבוי למפגש מביך בדיוק כזה.
- id: hold-person
  flavor: >-
    המפרקים ננעלים, ודמוי אדם עומד דומם כמו בובה בחלון ראווה, מסוגל לצפות בחדר אך לא להצטרף אליו. הגאווה היא הראשונה לדעוך, ואחריה הסבלנות. ותיקי המקצוע אומרים שהדממה קשה יותר לנשיאה מצעקה.
- id: holy-aura
  flavor: >-
    הילה זהובה ורכה נפרשת מהמטיל ומתיישבת על אלה שהוא בוחר להגן עליהם. אויבים מגלים שהמהלומות שלהם נעשות מגושמות והביטחון שלהם מתנדנד. יצורי חושך שמעזים לפגוע במוגנים נפגשים בסחרחורת פתאומית ומבחילה.
- id: hunters-mark
  flavor: >-
    סמל כסוף קלוש נצמד לטרף, ונראה רק למי ששם אותו. עקבות מופיעים בבהירות רבה יותר, והשביל כאילו נוטה אל הטרף המסומן. אנשי יער אומרים שהאות לעולם אינו מתעייף, רק הצייד.
- id: hypnotic-pattern
  flavor: >-
    סרטי צבע מתפתלים באוויר לפעימת לב אחת ואז נעלמים, ומשאירים קהל שבוהה בלא כלום. מי שהביט בהם יתר על המידה מתנדנד בעדינות ושוכח מה התכוון לעשות. בדרך כלל מספיקים דקירה חדה, צעקה או סטירה כדי להעיר אותם.
- id: ice-knife
  flavor: >-
    שבב כפור משונן עוזב את היד כמו נטיף קרח שנזרק ונועץ שיניים ביעד. ברגע שהוא פוגע, השבב מתפרץ בממטר רסיסי קור שעוקץ כל מי שעומד קרוב. קוסמי חורף רואים בזה טיעון מסודר בעד מרחב אישי.
- id: ice-storm
  flavor: >-
    ברד יורד בעמוד שואג ומכה את האדמה לבוץ חלקלק ומחורץ שמכשיל כל מי שטיפש מספיק כדי לרוץ. הקור חודר דרך המעילים והקול כמו אלף פרקי אצבעות על גג פח. איכרים שראו את זה פעם מעדיפים לשמוע על זה בתוך הבית.
- id: identify
  flavor: >-
    שלווה קרירה כפנינה יורדת על החפץ, וההיסטוריה שלו נפרשת כמו סרט. תכונות נסתרות וקללות שקטות עולות אחת אחת ומציגות את עצמן בנימוס. חכמים שבילו קריירה שלמה במרדף אחרי סודות כאלה קוראים לזה סוג הרכילות המספק ביותר.
- id: illusory-script
  flavor: >-
    הדיו לובש כאן עור נסתר, כך שדף אחד יכול לומר דבר אחד לכותבו ודבר אחר לכל קורא סקרן. המועצות הוותיקות סוחרות בתעלולים האלה כמו ברכילות, והממולחים שביניהן מחביאים אותם בתוך אותיות פשוטות. מי שקורא את רשימותיו של זר לעולם אינו חושד במלכודת שבשוליים.
- id: imprisonment
  flavor: >-
    אכזריות סבלנית שוכנת בלחש הזה, שבו אויב נקפל לכדור אטום, לשקט כבול, לאבן חן זעירה או לכלא חלומות ישן. הסוהרים הקדמונים קראו לזה קבר שזוכר את דיירו. מי שפותח תא כזה מוצא בדרך כלל את מזכרת הסוהר עצמו מחכה בפנים.
- id: incendiary-cloud
  flavor: >-
    חבורה מעושנת של גחלים מתגלגלת על שדה הקרב, בולעת צעקות וצובעת את השמיים בצבע של תה ישן. אפר מרחף כעש איטי ומתיישב על גלימות, שיער ותוכניות מלאות תקווה. מי שעומד בתוכה לומד שהעשן אינו תמיד החלק העדין של האש.
- id: inflict-wounds
  flavor: >-
    מגע קר שזוכר כל קבר שעבר לידו מלטף את העור ומבקש מהגוף לזכור גם הוא. הוורידים מתהדקים, הצבע נשאב, והפצע מרגיש עתיק יותר מהיד שגרמה לו. כוהנים מהסוג השקט אומרים שהמתים מחזיקים בטינות הטובות ביותר.
- id: insect-plague
  flavor: >-
    ענן מזמזם של ארבה מתרומם משום מקום והופך אחו רגיל לטפט קודר של כנפיים. הנחיל נע לאן שהוא רוצה, נדבק לגלימות ומקשה אפילו על האמיצים ביותר להישאר בשקט. איכרים בסיפורים הישנים האשימו בזה מזג אוויר רע, אף שלמזג האוויר לא היה כל קשר.
