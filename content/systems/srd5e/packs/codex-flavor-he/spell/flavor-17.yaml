- id: unseen-servant
  flavor: >-
    בפינה ריקה מתגבש כתם של כוח בלתי נראה, צייתן וחסר מחשבה, מוכן להביא, לשאת ולסדר. הוא אינו יכול לדבר, אינו יכול להשיב מכה, ובקושי מרים כיכר לחם, אבל הוא אף פעם לא מתמרמר על המטלות. עקרות בית מוטרדות בכל מקום מטילות אותו רק כדי להרחיק את האבק.
- id: vampiric-touch
  flavor: >-
    יד עטופה בצל נשלחת קדימה ושותה מעט חיים ממי שהיא נוגעת בו. הקורבן חש כאב קר המתפשט באיבריו, והקוסם חש חום שוטף בחזרה את פצעיו. העוסקים באמנות הזאת אינם אורחים רצויים במשתאות, אבל לעולם אין להם מחסור בחברה.
- id: vicious-mockery
  flavor: >-
    שורת עלבונות, מכוונת בדיוק כמו שצריך, חומקת דרך האוזניים ונתקעת במוח כמו קוץ. מחשבות היעד נתפסות בקרסים, והמכות שלו יוצאות פרועות ורחוקות מהמטרה. בעלי לשון בטברנות מנסים כבר דורות להשתוות לגרסה האכזרית ביותר, ורובם עדיין מפסידים.
- id: vitriolic-sphere
  flavor: >-
    כדור חומצה זוהר חולף אל נקודה שהקוסם בחר ומתפרץ כמו צלוחית של משהו מגעיל שנפלה על הרצפה. מי שנתפס בהתזה מסתנן ומתכסה שלפוחיות, והכוויה ממשיכה לכרסם בו גם אחרי שההלם הראשון חלף. אלכימאים מתייחסים לחומר הזה בכבוד רב, ובחשדנות רבה לא פחות.
- id: wall-of-fire
  flavor: >-
    יריעת להבות עולה ממשטח מוצק, רעבה ובוהקת, ואף יצור שפוי אינו רוצה לגעת בה. כל מי שעובר בשטחה נתפס בגל לוהט של חום, והחומה שומרת על פניה הבוהקות מופנות אל מה שמתקרב. שומרי האח אומרים שאש טובה יודעת מתי להיות עקשנית.
- id: wall-of-force
  flavor: >-
    קוסמי הגדרות קוראים לה חלון ששכח להיות זכוכית. שום דבר לא עובר בה, לא אבק, לא ספקות, ולא החתול שניסה פעם אחת וסורב בנימוס. קוסמים פיקחים תולים אותה באוויר כמו מדף לרעיונות שמסרבים לזוז.
- id: wall-of-ice
  flavor: >-
    קוסמי הכפור אוהבים להתפאר שהחומות שלהם מנצחות אש בוויכוח. הקרח עוקץ כמו אתגר, ומה שנשאר אחרי פריצה הוא יריעת אוויר קפוא כל כך שהיא נוגסת בריאותיו של כל מי שמועד דרכה.
- id: wall-of-stone
  flavor: >-
    אנשי המחצבות נשבעים שזו פשוט סלע שלמד לציית לקול. היא מגשרת על קניונים, בונה כבשים במקומות שאינם שייכים להם, ונשארת במקומה כל עוד הקוסם שומר על מוח יציב, וזו נאמנות רבה מזו של רוב ההרים.
- id: wall-of-thorns
  flavor: >-
    גננים של המקומות הפראיים מגדלים גדר חיה כזו כשהם כועסים על העולם. הכול בה סבך סבוך וקוצים חדים כמחטים, סבך שלא אכפת לו את מי הוא שורט, והוא מסתיר את כל מה שמאחורי מסך של ירק.
- id: warding-bond
  flavor: >-
    הטבעות זולות מספיק כדי למשכן, ויקרות מספיק כדי לגרום לבעל המשכון להילחץ. שני לובשים מסכימים הופכים ליחידה זהירה אחת, קשורה בחוט שמתוח בכל פעם שאחד מהם סופג מכה, ואינו נקרע בקלות.
- id: water-breathing
  flavor: >-
    קוצרי קנים יודעים מאז ומתמיד שגבעול חלול קצר מאפשר לאדם לנשום מתחת לגלים. אנשי הדגים רואים בתעלול קצת עלבון, כי מעולם לא נזקקו לקנים, אבל הם מסכימים לקבל גבעול בהשאלה לארוחת ערב חגיגית מדי פעם.
- id: water-walk
  flavor: >-
    פיסת שעם הופכת כמעט כל משטח לרצפה. בוץ, שלג מותך, חול שבולע מגפיים, ואפילו סלע מותך אפשר לחצות כאילו היה רחבת ריקודים. הסוד טמון בידיעה מתי לשקוע, כי האגם זוכר כל טעות.
- id: web
  flavor: >-
    טוויי המשי במועצות הישנות מרצים על זה כשהם מנקים חוטי משי משרוולי הגלימה. מסה דביקה של קורים ממלאת קטע במסדרון ותופסת את מי שהסתבך לתוכה, אם כי היא עולה בלהבה גופריתית ברגע שמישהו מביא לפיד.
- id: weird
  flavor: >-
    האשליה פשוטה: היא מראה לכל אחד את הדבר שהוא חושש ממנו יותר מכול, ואז מניחה לדמיון שלו לעשות את השאר. מי שנכשל נתקף בהלה, והסיוטים שלו מחמירים מעט עם כל מבט חדש, עד שמישהו מעיר אותו באמת.
- id: wind-walk
  flavor: >-
    רועי העננים אומרים שהשמים אינם אלא הארץ הפוכה. השיטה שלהם דורשת נר, הרבה סבלנות ונכונות להפוך לפקעת אדים, להיסחף מעל צמרות העצים ולהביט מלמעלה על הכפרים המתקוטטים.
- id: wind-wall
  flavor: >-
    חומה של רוח עומדת מעל הדשא כמו שוער חסר סבלנות. היא מגרשת ערפל, שולחת ניירות פזורים מערבולת כלפי מעלה, ומסיטה חצים מנתיבם, אם כי סלעי הענקים מטיילים דרכה כאילו התביישו בשביל כולם.
- id: wish
  flavor: >-
    כל מלומד מזהיר שהמילים האדירות ביותר שבן תמותה יכול לומר הן אלה שהאמירה שלהן עולה הכי ביוקר. אם אומרים אותן בקלות, הן עשויות לכופף את המציאות בדיוק כפי שקיווית, או שהן ימשכו בכתפיים, יעקמו את הניסוח לבדיחה וישלחו את החשבון אל הדובר.
- id: word-of-recall
  flavor: >-
    כוהנים מסוג מסוים שומרים דלת אחת אהובה במקדשם ואין עוד כמותה. קוסם שחבריו בהישג יד נמשך הביתה אל המקום המקודש הזה, ואילו קוסם לא מוכן מוצא רק שקט ושמש מבולבל.
- id: zone-of-truth
  flavor: >-
    בתי משפט מסוימים תולים מעגל של שתיקה באולם הגדול וקוראים לזה נימוס. מי שנכנס אליו מגלה שלשונו מסרבת לעצב שקר מכוון, אם כי הפיקחים לומדים לחמוק משאלות בעורמה חיננית שעדיין אינה כוללת שקר.
