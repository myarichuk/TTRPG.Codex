- id: find-traps
  flavor: >-
    זמזום שקט משתרר באוויר וחושף שמשהו ערמומי ואכזרי הוכן כדי לנשוך. סכנות טבעיות נשארות דוממות, כי הזמזום מתעניין רק במלאכת מחשבת. הוא לא מציע מפה, רק אזהרה ותחושה גסה איזה סוג של בלגן מחכה שם.
- id: finger-of-death
  flavor: >-
    יד מורה, מבט קר ולחישה של אבק קברים, וחיוניותו של הקורבן נשאבת ממנו בסחף. מי ששורד לעתים קרובות מצטער על כך, והמתים חסרי המזל נוטים לקום שוב ולחכות לפקודה חדה.
- id: fire-bolt
  flavor: >-
    גרגר אש כתום זינק מקצות האצבעות, חוצה את החדר במהירות ומדליק כל מה שהיה מספיק מטופש להיות מוטל שם. סמרטוטים, ארגזים ושלטי עץ ישנים נתפסים מהר, ולכן בעלי פונדקים נבונים מחזיקים דליים ליד הדלפק.
- id: fire-shield
  flavor: >-
    להבות דקיקות עוטפות את הגוף בהילה חיה, והלובש בוחר אם היא תזהר בחום או בקור. מי שמכה מטווח קרוב מקבל בתגובה קול פצפוץ רועם במיוחד.
- id: fire-storm
  flavor: >-
    סופת להבות נופלת משום מקום ומסדרת את עצמה בצורה קוביתית לפי בחירת המטיל, כמו ילד שמסדר קוביות צעצוע. מי שנקלע פנימה מחפש מחסה בבהלה, וקש מפוזר ווילונות יבשים עולים באש מיד.
- id: fireball
  flavor: >-
    חרוז של אור כתום נסחף מקצה אצבעו של קוסם ופורח בשאגה כשהוא פוגש קהל שהיה צריך להישאר רחוק יותר. המועצות הישנות קוראות לו הלחש הישר, כי איש אינו זקוק להסבר נוסף. עשן מתגלגל מהאבנים החרוכות הרבה אחרי שהתשואות נפסקו.
- id: flame-blade
  flavor: >-
    להב אש דק צומח ממקל פשוט ביד הקוסם, ומזמזם כמו קומקום שיש לו דעות. זה תעלול מסודר למי שמעדיף לא לסחוב לפיד. הלהב לעולם אינו מחמם את הכפפה שאוחזת בו, וזה מה שבני הנהרות חושדים בו.
- id: flame-strike
  flavor: >-
    עמוד חום נופל משמיים בהירים על מי שהסתובב בחצר הלא נכונה. כמה קוסמי שוליים מתעקשים שזו דרשה באש, אך אבני הריצוף החרוכות מרמזות על טיעון מעשי יותר. מי שעומד בקרבת מקום לומד להסתכל למעלה לפני שהוא מקבל כל הזמנה.
- id: flaming-sphere
  flavor: >-
    כדור של גחלים אדומות מכוסות מתגלגל אחרי יוצרו כמו כלב שלמד לשתוק בעלבון. הוא מתנגש ברהיטים בפצפוץ מתנצל ופולט בדיוק מספיק חום כדי להלחיץ את הטבח. מעט חיות בית קשות כל כך להתעלם מהן.
- id: flesh-to-stone
  flavor: >-
    גאות אפורה איטית זוחלת דרך גוף עקשן והופכת עור ועצם לסוג האבן שממנו עשויים פסלי גינה. פסלים ותיקים לוחשים שהאומנות הזו אכזרית ויפהפייה כאחת. הקורבן שומר על כל הבעה שהייתה לו, וזה או רחמים או עלבון.
- id: floating-disk
  flavor: >-
    צלחת שטוחה של כוח נוצץ מרחפת בגובה המותן ונושאת בצייתנות כל מה שנערם עליה. מחסנאי השיירות הוותיקות ראו בה את המשרת המשובח ביותר שהומצא, בעיקר כי מעולם לא התלוננה על המשקל. זה פלא משעמם עד אימה, ובדיוק זו הנקודה.
- id: fly
  flavor: >-
    קלילות פתאומית מרימה את המטיל מהרצפה ומרחפת בו כעלה ברוח חמימה. קוסמי שוליים מתארים את התחושה כסליחה קצרה מצד הכבידה. רוב מי שמנסה מגלה שהשמיים רחבי ידיים יותר ממה שהמפות רמזו.
- id: fog-cloud
  flavor: >-
    גוש ערפל חיוור מתגלגל משום מקום ובולע את הגדרות החיות הסמוכות, את הפנסים ואת כל הכוונות הטובות. מבריחי החוף נשבעים בו, כי ערפל כה סמיך הופך כל זר לחבר או ליריב, ולעתים נדירות לשניהם. הראות הופכת לשמועה, והצעדים להצעות.
- id: forbiddance
  flavor: >-
    מגן של לחץ שקט מתיישב על פתח, והוא אינו שואל מי רוצה לעבור. בוני המגנים של המועצות הישנות מתעקשים שהתחכום טמון בבחירה זהירה של הגבול. מי שמתעלם מהאזהרה נוטה להצטער על כך על המדרגות.
- id: forcecage
  flavor: >-
    תיבה של כוח בלתי נראה נסגרת סביב יצור בסדר של מגירה מוצלחת. קירותיה שקופים וקשים, כך שהשבוי והעולם יכולים לצפות זה בזה, סוג אכזרי של נימוס. סוהרים שמעריכים גם ביטחון וגם שיחה נוטים להעדיף אותו.
- id: foresight
  flavor: >-
    חוט דק של ידיעה מתיישב על אדם ולוחש אזהרות קטנות על הרגעים הקרובים. מגידי עתידות של המועצות הישנות מתארים זאת כמו לשמוע את הבית נרגע לפני שהגג קורס. מי שנסמך על כך יותר מדי נעשה מומחה גדול בהמתנה.
- id: freedom-of-movement
  flavor: >-
    סרט רפוי של הגנה חמימה נכרך סביב הגפיים ומאפשר למפרקים נוקשים לנוע כאילו העולם שומן. אמני התחמקות וריקדניות פונדקים כאחד נשבעים בו, וכבלים ישנים נוטים להתכנס בפינות ולהתעצב. שום דבר בתחושה אינו דרמטי, ובדיוק משום כך היא מרגיעה כל כך.
- id: freezing-sphere
  flavor: >-
    קור מצטבר בכף ידו של הקוסם עד שהוא מתעבה לכדי כפור, ואז עוזב את היד בקול נפץ כמו קרח בבריכה שנסדק. מכשפי החורף רואים בו דרך מנומסת לסיים ויכוח. הכדור מתנפץ אחר כך בפרץ של רסיסים נוצצים.
- id: gaseous-form
  flavor: >-
    הגוף מרפה את אחיזתו בעצמו ונסחף כעשן, חומק דרך סדקים שדלת הגיונית לא הייתה מרשה. חוקרי מלאכת הערפל מתארים את התחושה כשמועה שבמקרה יש לה ידיים. החזרה לצורה מוצקה היא החלק שכולם זוכרים בבהירות הרבה ביותר.
- id: gate
  flavor: >-
    פתח גבוה של אור כסוף נפתח באוויר, ודרכו אפשר להציץ אל אולם רחוק שבו האוויר מריח מגשם. חוקרי המועצות הישנות שאוהבים לנדוד מתייחסים לסף בכבוד רב, כי לצד השני יש דעות משלו על אורחים.
