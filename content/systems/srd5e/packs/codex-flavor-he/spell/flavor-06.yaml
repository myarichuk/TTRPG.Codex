- id: earthquake
  flavor: >-
    האדמה זוכרת כל טינה שנתנו לה, והיום היא סוגרת חשבון. האבן נאנחת, נסדקת בחיוכים ארוכים, והמגדלים הישנים נוטים אל מי שעומד הכי קרוב לשבר.
- id: eldritch-blast
  flavor: >-
    חוט בהיר וקשה של צליל וזדון נפלט מידו של המטיל, והיעד כמעט אף פעם לא רואה אותו מגיע. קוסמי הכפר במועצות הישנות קוראים לו הלחש הישר, כי הוא לא מבקש דבר ומבטיח רק את העקיצה.
- id: elementalism
  flavor: >-
    נשימה של מזג אוויר, קורט עפר וענן עשן, והכול לפי רצון המטיל. ילדי הכפר מתים על זה, ובעלי הפונדקים מקווים שזה יישאר כך, כי כוס מים מפוסלת אף פעם לא פיכחת כפי שהיא נראית.
- id: enhance-ability
  flavor: >-
    מגע של יד יציבה, עם קצת פרווה או נוצה בכיס למזל, והמשימה העיקשת כאילו מתכופפת לעבר מי שביקש. איש לא קורא לזה רמאות, אבל מי שזה עוזר לו נראה מרוצה מעצמו למדי.
- id: enlarge-reduce
  flavor: >-
    כל מה שהגוף לובש ונושא גדל או מתכווץ יחד איתו, וכך הפתחים הם הדאגה הקטנה ביותר של כולם. יש שרואים בתעלול חסד, אחרים בבדיחה גסה, ומי שאינו מסכים נוטה להתווכח על כך בקול רם.
- id: ensnaring-strike
  flavor: >-
    להב הצייד עדיין מזמזם כשחבלים ירוקים מתפתלים מתוך המכה ונמתחים חזק. מנחשים נשבעים שהגפנים בוחרות את טרפן בקפידה, והטרף, לזכותו, בדרך כלל נאבק בהן ברוח אמיתית.
- id: entangle
  flavor: >-
    האחו עצמו מסתער על הפולשים, ומעלה סבך של גבעולים ושורשים אוחזים על חלקת אדמה. מי שנתפס ברשת הירוקה מגלה שרגליו פתאום מסרבות לשתף פעולה, והצמחים שמחים להמשיך לעשות לו חברה עד שיצליח להשתחרר.
- id: enthrall
  flavor: >-
    קול שנשמע כמו אמבט חם והבטחה מתוקה נשפך החוצה וגורם לקהל לשכוח לבדוק את הכיסים. מי שכבר נלחם לצד הדובר חסין, וזו נחמה או אזהרה, תלוי באיזה צד עומד המאזין.
- id: etherealness
  flavor: >-
    קצותיו של המטיל מחווירים ומדקקים, והוא גולש הצידה אל הגבול האפור שבו העולם עדיין חצי גמור. שם הקולות עמומים, הקירות המוצקים הם בעיקר שמועה, וחזרה רשלנית עלולה להפיל נוסע לתוך הרהיטים של מישהו אחר.
- id: expeditious-retreat
  flavor: >-
    נקישה מהירה של העקבים והמטיל פשוט נמצא במקום אחר, ומשאיר אחריו ריח קלוש של שעווה חמה וכמה צופים מוטרדים. חכמים מתווכחים אם זו בריחה או סתם התחלה מוקדמת, והרצים של יריד השוק שומרים את דעתם לעצמם.
- id: eyebite
  flavor: >-
    דיו נקווה בעיני המטיל, ומבט אחד מספיק כדי להפיל מאזין נבחר ללא הכרה או לשלוח אותו בצרחות על פני השדות. סיפורים מהסוג הזה מלאים באזהרות, וגם זה אינו יוצא דופן.
- id: fabricate
  flavor: >-
    חומר גלם הוא סבלן, והאומנות הזו מבקשת ממנו להפוך למשהו חדש, כמו שער מגזע שנפל או שק ארוג מערימת קנים. היצירה המוגמרת טובה רק כמו החומר שממנו יצאה, ולכן היוצר הזהיר בוחר היטב.
- id: faerie-fire
  flavor: >-
    קווי מתאר נוצצים פורחים על כל מה שבחלקה הנבחרת, והופכים תיקים נסתרים וערימות חביות לתמרורים זוהרים לכל מי שיש לו קו ראייה פתוח. הצבעים הם כחול, ירוק או סגול, והזוהר בהיר מספיק כדי שהסתתרות בצללים תהפוך לבדיחה גרועה למדי.
- id: faithful-hound
  flavor: >-
    כלב שמירה רפאים טופף אל פינה ריקה, גלוי רק ליוצרו, ושומר על עמדתו בסבלנות שרוב השומרים בני האדם יכולים רק לקנא בה. כל מי שמתקרב בלי הסיסמה הנכונה מקבל קבלת פנים רועשת ובלתי ניתנת לטעות, והשכנים מתעוררים ותוהים מדוע.
- id: false-life
  flavor: >-
    לגימה קטנה של משקה זול, מילה ממלמלת, והמטיל חש גל של חיוניות עיקשת, שאינה בדיוק בריאות. הרוקחים קוראים לזה כוח שאול, והוא דועך באותה מהירות שבה הגיע.
- id: fear
  flavor: >-
    חומת אימה קרה נשפכת החוצה במניפה מתרחבת, ואפילו הפנים האמיצות ביותר מחווירות כשהצינה מוצאת אותן. מי שבורח לא עוצר להסביר את עצמו, ומי שצופה מרחוק בטוח נשבע שהלילה נעשה שקט יותר.
- id: feather-fall
  flavor: >-
    יד עדינה נשלחת אל האוויר ומבקשת מגוף צונח להאט, כאילו השמיים נזכרו פתאום בנימוסים. כוח המשיכה מתלונן אך מסכים, והנחיתה שבאה אחר כך רכה מספיק כדי שכל הנפילה תיראה כמו תוכנית הגיונית.
- id: find-familiar
  flavor: >-
    דמות קטנה בעלת עיניים ערמומיות פוסעת מתוך ענן עשן קטורת ומתיישבת ליד מרפקו של המחזיק החדש שלה. כל מלווה כזה הוא ריגול, מבקר, ומסרב בתוקף להישאר מחוץ לחלקים הטובים של כל הרפתקה.
- id: find-steed
  flavor: >-
    בהמת רכיבה מעולם אחר מגיעה בהבזק אור, במבט נאמן ובסבלנות שנראית כאילו חיכתה מאז ומעולם. צורתה חיה גדולה והגיונית לפי בחירת המטיל, ומה שלא תהיה מהותה, ליצור אין שום עניין להיות קישוט סרק של מישהו.
- id: find-the-path
  flavor: >-
    חוט של כיוון נפרש בתוך הראש, קלוש בהתחלה ואז בטוח, ומצביע אל מקום שהמחפש מכיר היטב. צמתי דרכים חדלים להיות הימור, שכן החוט תמיד יודע איזה מפגש הולך הכי ישר, והמחפש לומד את פני השטח בלי לבקש עזרה מזר.
