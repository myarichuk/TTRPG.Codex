- id: summon-dragon
  flavor: >-
    תכשיט נוצץ החרוט בדמות קשקשים יכול לקרוא לרוחו של דרקון מתוך החשכה הרחבה. היא מגיעה כעשן וכקשב חד, ונאמנה כל עוד המטיל מותח את החוט. קוסמי שדות אומרים שלרוח תמיד יש נקמות משלה, ולכן מזמן נבון נותן לה רק פקודות פשוטות.
- id: sunbeam
  flavor: >-
    חנית של אור לבן זינקה מכף ידו של המטיל והותירה שביל חרוך בכל מה שניצב בדרכה. מי שנתפס בזוהרה מצמץ, מתנדנד ומאבד את ראייתו לרגע, כאילו בהה ישר בצהריים. המועצות הישנות נהגו להשתמש בה כדי לבייש שקרנים באולמות הומים.
- id: sunburst
  flavor: >-
    אור שמש פורח החוצה מנקודה נבחרת, כמו מנורה שנפלה במרתף מלא אבק, והבוהק צורב כל מה שהוא נוגע בו. מי שנתפס בהבזק מועד נבוך, עיניו דומעות ואינן שימושיות לזמן מה. בני הנהר אומרים שאבן השמש שמזינה אותו נשארת חמימה זמן רב אחרי שהאור כבר נעלם.
- id: symbol
  flavor: >-
    סמל מזיק חרות ברצפה, בקיר או במכסה, וממתין בסבלנות ליד או לנעל שלא נזהרו. מי שמפעיל אותו נקלע לפרץ של כל חורבן שהסופר בחר, והסמל דוהה אחר כך כמו כפור. שומרי כספות ותיקים קוראים להם המלכודות הישרות ביותר, כי הן אינן מזהירות איש.
- id: telekinesis
  flavor: >-
    המחשבה לבדה הופכת לזוג ידיים בלתי נראות, המרימות אבן, עגלה או דלת עקשנית בלי שאצבע תזוז. המטיל יכול לדחוף יצור לאורך הרצפה או להחזיק להב באוויר, ולהחליף אחיזה מתי שיחפוץ. מורים מזהירים שמוח עייף משלח ידיים מגושמות, ולכן ריכוז יציב חשוב מכוח.
- id: telepathic-bond
  flavor: >-
    שתי ביצים סדוקות, מוצמדות זו לזו בלחישה, טווות חוט של מחשבה משותפת בין חוג קטן של חברים מוכנים. כל תודעה שומעת את האחרות בלי שפה משותפת, וכך מלח ואיש אשכולות יכולים סוף סוף להחליף בדיחות. לרוב הקשר גורם לאנשים לדבר אחד על השני, מה שבני הנהר מוצאים מקסים ומתיש כאחד.
- id: teleport
  flavor: >-
    קפיצה פתאומית בבטן, הבזק של ריחות זרים, והמטיל עומד במקום אחר. חברים שמניחים יד על המטיל מגיעים איתו, ומי שמתנגד אינו נגרר. מי שזוכר את היעד לא נכון נוחת לעיתים קרובות במקום לח ובלתי נכון, מה שהמועצות הישנות מכנות שיעור בענווה.
- id: teleportation-circle
  flavor: >-
    סימני גיר המצוירים בטבעת קטנה מתעוררים והופכים לפתח נוצץ שנשאר רק לרגע קצר לפני שהוא דוהה. מי שצועד דרכו מופיע במעגל קבוע שהמטיל מכיר היטב, והמסע מריח קלות מאוזון ומלכה ישנה. חוקרים זהירים מעתיקים את רצף הסימנים פעמיים, כי קו מרוח יכול לשלוח את המטיילים למקום שאיש לא ציפה לו.
- id: thaumaturgy
  flavor: >-
    פלא קטן הוא תעלול מצוין למסיבה באולם עמום. המטיל יכול לגרום לעיניים לזרוח באופן מוזר, להפוך קול לשאגה או לגרום ללהבות נרות לרקוד בצבעים משונים. כוהנים מסוג מסוים משתמשים בתעלולים האלה כדי להטריד ספקנים, וזה בכנות החלק הטוב ביותר בעבודה.
- id: thunderwave
  flavor: >-
    רעם פורץ מן המטיל לכל הכיוונים בבת אחת, מרעיד חלונות ושיניים רופפות כאחד. מי שנקלע בדרכו נדחף לאחור ונופל פרקדן, וכל מה שלא קשור גולש איתו. מטיילים אומרים שאפשר לשמוע את הבום מעבר לגבעה הבאה.
- id: time-stop
  flavor: >-
    העולם משתתק, כל עלה נופל קפא באוויר, ורק המטיל ממשיך לנוע. כמה צעדים נינוחים בין ההמון הקפוא מרגישים כמו גניבה של דבר שאיש לא יתגעגע אליו. חכמים מזהירים שאת הרגע הגנוב צריך להחזיר לפני שמישהו מבחין בפער, ואחרת החשבון מגיע בדרך אחרת.
- id: tiny-hut
  flavor: >-
    כיפה צנועה של כוח נוצץ מתרוממת מעל המטיל וחבריו, בית נעים לא גדול מעגלה. מי שכבר בפנים יכול לצאת ולבוא כרצונו, אך כל השאר מוצאים את הקירות סגורים בעקשנות. לוחמים ותיקים נשבעים שהאוויר בפנים נשאר חם באופן מפתיע.
- id: tongues
  flavor: >-
    נגיעה קלה בגרון, וכל מילה מדוברת או תנועת יד מהירה של סימנים הופכות למשמעות ברורה לשומע. המתנה פועלת לשני הכיוונים, כך שכל מי שיודע ולו שפה אחת יכול להבין גם את הדובר. אומרים שהשליחים משלמים עליה ביוקר, והמועצות עדיין מתווכחות אם זו רמאות.
- id: transport-via-plants
  flavor: >-
    עץ גדול או גדר חיה הופכים לפתח, ומתחברים לצמח רחוק שהמטיל ראה בעבר. כל אחד יכול לצעוד לתוך האחד ולצאת מהשני בצעד קצר בלבד. גננים שמבחינים בזרם אוויר פתאומי בשורשים נוהגים להעמיד פנים שלא ראו דבר.
- id: tree-stride
  flavor: >-
    המטיל מחליק אל תוך גזע אחד ויוצא מגזע אחר מאותו מין, עלים מלטפים את פניו. רק עצים חיים בעובי דומה משמשים פתחים, ולכן היער הופך לדרך נסתרת. חורש שמכיר כל אלון בעמק יכול להיעלם משיפוע אחד ולהופיע בשיפוע הבא.
- id: true-polymorph
  flavor: >-
    שינוי מוזר בולע יצור נבחר או חפץ דומם ומעצב אותו מחדש למשהו אחר. הצורה החדשה יכולה להיות חיה, שדון או ערימת חבל, והעצמי הישן ממתין בשקט בפנים עד שהשינוי מסתיים. חוקרים מתווכחים אם שינוי כזה משאיר את הנשמה שלמה, מה שהופך לשיחת ארוחת ערב משמימה.
- id: true-resurrection
  flavor: >-
    זמן רב אחרי שהגוף התקרר, מגע יכול למשוך את הרוח בחזרה אל גוף שלם שוב. פצעים נסגרים, רעלים מתנקזים, וגפיים אבודות צומחות כאילו לא אבדו מעולם. כמה שומרי קברים אומרים שזה המעשה הנדיב ביותר שכוהן מסוג מסוים יכול לעשות, וגם היקר ביותר.
- id: true-seeing
  flavor: >-
    קורט אבקת פטריות מאובקת, שנמרחת על העיניים, מאפשר לחבר מוכן לראות דרך האשליות הערמומיות ביותר. דלתות נסתרות, יצורים בלתי נראים וצורות הלובשות פנים של אחר מאבדים את כוחם להטעות. מבריחים ותיקים שילמו היטב על כך, וכמה עדיין משלמים.
- id: true-strike
  flavor: >-
    לפעימת לב חולפת נדמה שנשק המטיל יודע בדיוק היכן יעמוד היעד. המכה מונחית בתובנה ולא בשרירים, והיא יכולה לבעור בקרינה בוהקת במקום בלהב הרגיל שלה. סייפים באולמות הסיף קוראים לזה רמאות, ואז מבקשים ללמוד אותו.
- id: tsunami
  flavor: >-
    חומת מי ים אדירה מתרוממת מנקודה נבחרת וגולשת קדימה בסבלנות נוראה. כל מה שבדרכה נחבט ונגרר, ונשאר כלוא במים המסתחררים עד שהגל מרפה. כפרי דייגים בחוף עדיין מספרים על הגל שבא בלי אזהרה, אף שאיש אינו מסכים מי קרא לו.
