- id: aura-of-life
  flavor: >-
    זוהר חם בעל שולי זהב מתפשט מהמטיל, מייצב את החולים ודוחה את מגעו האפור של הריקבון. ותיקים מלמדים שהזוהר נמשך רק כל עוד עקשנותו של נושאו מחזיקה מעמד, וזה שקר ששווה להאמין בו.

- id: awaken
  flavor: >-
    טקס סבלני של שרטוט מסלולים זוהרים בתוך אבן חן יקרה מעניק לדבר בעל שורשים או עלווה תבונה וכמה מילים. היצור המתעורר בדרך כלל חביב, קצת מבולבל, ודבוק מאוד לפנים החביבות הראשונות שהוא רואה.

- id: bane
  flavor: >-
    דממה של מזל רע יורדת על קבוצה קטנה של אויבים, וכל מאמץ וכל החלטה שלהם נעשים כבדים מעט יותר. מכשפים וכוהנים מסכימים שהתעלול עובד הכי טוב כשהקורבנות בדיוק התפארו במיומנותם.

- id: banishment
  flavor: >-
    אויב מחליק החוצה מהעולם, אל כיס תפל וחסר סכנה של אין-מקום, שם הוא עומד מסוחרר ואינו יכול לפעול. רוב היצורים חוזרים כשהלחש דוהה, אם כי יצורים מזן פראי יותר מגיעים לפעמים למקום אחר לגמרי.

- id: barkskin
  flavor: >-
    נגיעה הופכת את עורו של חבר מרצון לקליפה קשוחה ומסוקסת, כפי שאלון זקן עשוי להיראות אילו החליט להיות לוחם. סיירי היערות העמוקים אומרים שהקליפה סבלנית וחכמה, אבל היא לא סולחת על אש.

- id: beacon-of-hope
  flavor: >-
    פנס שמואר על עמוד גבוה נראה מעבר לעמק שלם, והפנס הזה בוער יציב יותר מרוב האחרים. מי שעומד תחתיו נעשה עקשן מול פחד ואימה, וכל ריפוי שמגיע אליהם נקלט במלואו. קוסמי שוליים נשבעים שהוא שומר על גוף דועך בצד הזה של הקבר.

- id: befuddlement
  flavor: >-
    יש מוחות שחכמים מדי לטובתם, והלחש הזה הוא התרופה שהמועצות הישנות שמרו לאלה. פיצוץ ממוקד של כוח נפשי משאיר את הקורבן מביט בריקנות אל הקיר, וחסר יכולת לחבר לחש אחד. חכמים אומרים שההתאוששות מגיעה לאט, מחשבה עקשנית אחת בכל פעם.

- id: bestow-curse
  flavor: >-
    מגע שמשאיר כתם שאי אפשר לשטוף, והקורבן מרגיש אותו שוקע לתוך העצמות כמו לחות בקירות ישנים. ידיים מגושמות, מזל חמוץ, הרגל להסיט את המבט ממראות: הקללה בוחרת בעצמה את סוג הנבזות שלה, וכוהנים עתיקים הזהירו שעסקאות שנעשו עם קסם כזה לרוב אינן מסתיימות נקי.

- id: black-tentacles
  flavor: >-
    גפיים שחורות כעץ הובנה דוחפות מבעד לאבני המרצפת ומתפתלות סביב כל מי שטיפש דיו לעמוד על הכתם הזה. חבל חלקלק, ידיים אוחזות ואובדן פתאומי של אחיזה ברגליים: כל אלה עולים בראש. מלומדים מתעקשים שהדברים מזומנים ולא גדלים, וזה מעולם לא מנע מאיש לאחל שנשאר בבית.

- id: blade-barrier
  flavor: >-
    קיר של להבים מזמזמים מסתחרר ונוצר במקום שבו פעם היה נתיב, וחותך בלי רחמים כל מה שמנסה לעבור דרכו. אבן מתעלמת ממנו, אבל פלדה נלעסת, ולכן הוא פופולרי בקרב השועממים והזהירים כאחד. מדריכים מלמדים אותו כשיעור במתיחת קו ואז סירוב להתווכח עליו.

- id: bless
  flavor: >-
    כמה מילים שנלחשות מעל קבוצת בני לוויה נותנות להם תחושה של מזל לרגע, כאילו הגורל התעניין בהם. המכות שלהם נוחתות מעט מדויקות יותר, ושכלם עומד מעט איתן יותר מול תרמית. כוהנים נשבעים שההשפעה נובעת יותר מיציבה טובה מכל אל מסוים, אם כי איש מעולם לא בדק את הטענה.

- id: blight
  flavor: >-
    קמילה עוברת בתוך יצור חי כמו כפור דרך פריחה מאוחרת, ומשאירה ריקבון אפור במקום שבו עמד ירק. צמחים נובלים ראשונים ומהר ביותר, מה שהופך את הלחש למועדף על מי שמתרעם על גנים ועל האנשים שמטפלים בהם.

- id: blindness-deafness
  flavor: >-
    דממה פתאומית או חושך פתאומי, לפי בחירת המטיל, והקורבן נותר מגשש בעולם בחושים הלא נכונים. בכל תור מגיע סיכוי נוסף לנער את זה, וזה נוטה להפוך את הסובל לדרמטי בכל העניין.

- id: blink
  flavor: >-
    לפי גחמתה של הקובייה, מטילים מסוימים נעלמים מהעולם הרגיל ומהבהבים אל מקום אפור וחצי נראה, שבו הרחובות האמיתיים הם רק צללים. הם חודרים דרך קירות ובין רגעים, וחוזרים עם סיפורים שאיש לא באמת מאמין להם.

- id: blur
  flavor: >-
    קווי המתאר של הנושא מתרככים כמו דמות שנראית מבעד לזכוכית מנוטפת גשם, כך שמכות וחיצים מוצאים את הפיסה הלא נכונה של אוויר. רק מי שיכול לראות בחושים מעבר לראייה אינו מתרשם, והם נוטים להיות מתנשאים בצורה בלתי נסבלת בגלל זה.

- id: burning-hands
  flavor: >-
    לשון להבה דקה יוצאת מקצות האצבעות במניפה, שורפת כל מה שעומד בדרכה ומציתה ניירות ובדים יבשים. מטילים שומרים דלי קרוב, כי הלחש מצוין בהצתה ודל בכיבוי.

- id: call-lightning
  flavor: >-
    סערה מתכנסת מתחת לשמיים שהיו שקטים לפני רגע, והמטיל יכול למשוך ברק מתחתית הענן. כל מה שנתפס מתחתיו מקבל תזכורת מפצפצת למי שאחראי על מזג האוויר. דרואידים של החורשות העתיקות רואים בזה מוצא אחרון, כי לסערות יש נטייה להתעלם מהוראות.

- id: calm-emotions
  flavor: >-
    שקט מתגלגל מעל קהל כמו גאות הנסוגה, והצעקות נדמות מהפנים הקרובות ביותר למרכז. הכעס מתקרר, הבהלה משתחררת מאחיזתה, והרצון העקשני להילחם יוצא לזמן מה. דיפלומטים מסוג מסוים שומרים אותו בקרבתם, כי חדר רגוע הוא חדר שמקשיב.

- id: chain-lightning
  flavor: >-
    ברק פוגע פעם אחת ואז מסרב להפסיק, וקופץ מגוף לגוף כמו שמועה עם רגליים. כל קורבן חדש חש את ההלם, וריח השיער השרוף נשאר הרבה אחרי שהשמיים שקטים שוב. קוסמי סופה אומרים שזה מזג האוויר החברותי ביותר שהם יצרו אי פעם.

- id: charm-monster
  flavor: >-
    קול רך ומבט יציב יכולים לגרום כמעט לכל יצור להרגיש שהמטיל הוא החברה הנעימה ביותר בעולם. היצור המוקסם הולך אחריו בסבלנות זגוגית עד שמשהו מנער אותו החוצה. מאלפי חיות פרס רואים בזה את הדרך הזולה ביותר לשמור על מזג בשליטה.
