- id: detect-evil-and-good
  flavor: >-
    עקצוץ אדוק עובר על העור כשחברה לא ראויה מתקרבת. כל צל, רוח או מת חסר מנוחה שאורב בסביבה מתגלה כמשיכה קלושה, כמו מחט מצפן שמסתובבת במרתף.
- id: detect-magic
  flavor: >-
    האוויר בחדר קריאה ישן מעקצץ כשקסם של מישהו עדיין מרחף בקרבת מקום. הילות קלושות של צבע פורחות מעל דברים שנראים רגילים לגמרי, וחוקר סבלני יכול ללמוד איזו אסכולה ארגה אותם בראשונה.
- id: detect-poison-and-disease
  flavor: >-
    עשבונאי זהיר מרחרח את החדר לפני שהוא נוגע בספל. ריחות מרירים של ארס, נבגים ומחלה זוחלת מצלצלים כפעמונים קטנים, וכל אחד מהם מגלה לבעליו איזה סוג של צרה מחכה בחשיכה.
- id: detect-thoughts
  flavor: >-
    קוראי מחשבות בחדרים האחוריים של אכסניות מסוימות אוהבים לומר שהמון הוא לחש אחד ארוך. כשמכוונים אליו מקרוב, הלחש מתפרק לקולות קטנים ובודדים, ועם קצת סבלנות המאזין יכול לקלוט מה הקרוב ביותר אליו רוצה יותר מכול.
- id: dimension-door
  flavor: >-
    צעד זריז הצידה דרך מארג העולם, ופתאום המטייל עומד במרפסת בצדה השני של העיר. בין היציאה להגעה אין דבר מלבד צמרמורת של אוויר קר, וצניחה כושלת פירושה מעיכה כואבת של כוח בלתי נראה.
- id: disguise-self
  flavor: >-
    תחפושת היא מלאכה, ושחקני בתי התיאטרון הישנים יודעים ללבוש פנים של זר כמו מעיל שאול. האשליה קורסת תחת מגע מקרוב, ולכן מוטב ללובש לקוות שאיש לא יבחן את התפרים מקרוב מדי.
- id: disintegrate
  flavor: >-
    קרן אזמרגד צרה נשלפת מקצות האצבעות ונושאת כוח רעב ושקט. כל מה שהיא פוגעת בו מתנודד תחת מכת עוצמה גולמית, או נמוג לאבק אפור דק שנסחף ברוח ומשאיר אחריו רק ריח קלוש של חריכה.
- id: dispel-evil-and-good
  flavor: >-
    מגן קצר של אור חיוור שוכן על כתפי המטיל, והיצורים שנולדו במישורים אחרים נרתעים ממנו. ידיים שמונחות על אחוז דיבוק או על מבוהל יכולות לשבור את אחיזתה של רוח או של בן-תופת, ומילה חדה יכולה לשלוח פולש בחזרה למקום שבו הוא שייך.
- id: dispel-magic
  flavor: >-
    נקישת אצבעות חדה שולחת אדווה קרה דרך זוהר הקסם. לחשים קלים מתפרקים באוויר, ואילו העיקשים צריכים לעמוד במבחן מיומנותו של המטיל לפני שהם נכנעים.
- id: dissonant-whispers
  flavor: >-
    מנגינה שאיש אחר אינו שומע חומקת אל גולגולתו של הקורבן, חמוצה וצורמת, כמו פעמון שנקשו בו בצליל הלא נכון. המאזין נרתע ואז מועד הרחק מהזמר, כאילו הצליל עצמו הוא שפת תהום.
- id: divination
  flavor: >-
    עולי רגל בערי המקדש העתיקות נהגו לטפס בסולם של עשן כדי להפנות שאלה אחת אל השמיים. התשובה מגיעה כפתגם ממלמל או כחידה עם שיניים, והחכמים לומדים שהשמיים משתתקים כשלוחצים עליהם יותר מדי.
- id: divine-favor
  flavor: >-
    ברכה שקטה שוכנת באחיזת הנשק וגורמת לכל מכה להדהד באור לבן וצלול. הפלדה נשארת פלדה, אבל לאורך להבה היא נושאת שמש קטנה כל עוד התפילה מחזיקה.
- id: divine-smite
  flavor: >-
    מכת הפלאדין נוחתת בהבזק פתאומי, ובאוויר נשמע קול כשל זכוכית דקה שנסדקת. בני-תופת ומתים חסרי מנוחה מרגישים את המכה חודרת עמוק יותר, כי האור צורב בעוז הרב ביותר במקום שבו הרשע שתל שורשים.
- id: divine-word
  flavor: >-
    מילה אחת, נאמרת בשקט ובזהירות, נושאת משקל של פסק דין. כל מאזין שאין לו כוח לנער אותה מעליו מזדעזע עד העצמות, וכל אורח ממישור אחר מושלך בחזרה למקומו.
- id: dominate-beast
  flavor: >-
    חיה בעלת לב פראי וחשדן משתתקת תחת יד שמכירה את שפתה. חוט של מחשבה שקטה נמתח ביניהם, וכך ההוראות עוברות בלי צליל, והחיה עושה כמיטב יכולתה.
- id: dominate-monster
  flavor: >-
    דברים גדולים ומסוכנים יותר קשה לתבוע, והקשר דורש רצון חזק יותר כדי לעצב אותו. משנכפף היצור לרצון המטיל, פקודות שקטות רצות לאורך הקשר, והמפלצת צייתנית עד שהקשר מתרופף או עד שהיא נודדת אל עיסוקיה האפלים.
- id: dominate-person
  flavor: >-
    מבטו של זר נמשך רגע ארוך מדי, ואז העיניים נעשות רכות וצייתניות, כאילו יד חמה נחה על כתפו. הקשר מחזיק כל עוד שניהם עומדים תחת אותו שמיים, אם כי מכה חדה או לב סורר יכולים להרפות אותו.
- id: dragons-breath
  flavor: >-
    האש של פלפל חריף נארזת בבעל ברית מרצון לזמן קצר. לא משנה איזה יסוד בוחר המטיל, להבה, כפור, ניצוצות, ארס חמוץ או ריר מאכל, בעל הברית יכול לנשוף אותו בחרוט שמתגלגל על כל מי שעומד קרוב מדי.
- id: dream
  flavor: >-
    שליח גולש לטראנס ומרחף בדמיונו של ישן, נושא מילים ומעצב נופים מחול וזיכרון. הישן מתעורר כשהתמונה עדיין זוהרת מאחורי עיניו, ואם ההודעה נעשתה מאיימת, ההתעוררות מביאה איתה צמרמורת של אימה.
- id: druidcraft
  flavor: >-
    מילים הלוחשות לרוחות הטבע מפיקות מן האדמה הסמוכה פלאים קטנים ולא מזיקים. ניצן נפתח, עלה נוטה אל משב רוח רך, נר מתלקח לחיים, או שיר יער קלוש נסחף בקרחת.
