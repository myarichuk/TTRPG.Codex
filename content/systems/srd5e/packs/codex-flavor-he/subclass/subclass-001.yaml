- id: champion
  name: 'אלוף'
  flavor: >-
    אלופים מתייחסים לזירה ולשדה הקרב כאל מגרש מבחן אחד. המכות שלהם נוחתות בחדות שעליה מדברים ותיקי הטורנירים בלחש, וגופם נדמה כמנער פצעים שהיו מפילים לוחמים פחות. היכן שאחרים רואים קהל, האלוף רואה כתר שמחכה שיזכו בו.
- id: circle-of-the-land
  name: 'מעגל האדמה'
  flavor: >-
    מעגלים מסוג זה מקיימים את טקסיהם תחת השמיים הפתוחים, היכן שאבני עמידה ועצים עתיקים מסמנים את הקרקע הקדושה. כל שומר לומד את מצבי הרוח של סוג אחד של ארץ, בין אם אדמות בור יבשות, שממות קפואות, יערות ממוזגים או יער גשם לח, ושואל מעט ממזג הארץ הזאת. זקני כפרים מבקשים מהם לא פעם עצה בענייני מחלת צמחים, מזג אוויר רע והעונה הנכונה לזריעה.
- id: college-of-lore
  name: 'קולג׳ הידע'
  flavor: >-
    חוקרי הקולג׳ים הישנים סבורים שסיפור טוב שווה יותר מחרב, אף שהם נדירות אומרים זאת לבעל החרב. החברים אוספים עובדות כמו שעורבנים אוספים דברים נוצצים, מכרכים מאובקים, מטקסים שנזכרים למחצה ומסיפורי סבתות. הם גם נהנים לנקב את יהירותם של לורדים, שהרי בדיחה בעיתוי הנכון מסלקת עריץ באותה נקיות כמו כל טיעון.
- id: draconic-sorcery
  name: 'קסם דרקוני'
  flavor: >-
    יש מתנות שמגיעות בעקבות דרקון, פירור אקראי של כוח עתיק שהוריש תולעת גוססת או שנספג מאוצר שמעולם לא התקרר כראוי. דמם של הקוסמים האלה נושא חום מתכתי קלוש, ועורם מקבל ברק כמו של קשקשים קשים. שושלת, שמועה או סתם מזל רע יכולים כולם להסביר את השינוי.
- id: evoker
  name: 'מטיל כוחות'
  flavor: >-
    מטילי הכוחות לומדים את האמנויות הרועשות, אלה שמביאות כפור מר, להבה צורבת, רעם מתגלגל וחומצה שאוכלת ברזל. חלקם הופכים לתותחנים של מצור בצבאות החזקים, וזורים חורבן על פני שדה לפני שהאויב מספיק להתקרב. אחרים בוחרים צד בשקט רב יותר, מגינים על כפרים מפני פושטים, או פשוט גובים מהמרבה במחיר את הסערות שלהם.
- id: fiend-patron
  name: 'פטרון שטן'
  flavor: >-
    הסכם שנכרת עם משהו מלמטה תמיד מגיע עם פנקס חשבונות, והישות שבצד השני מנהלת את ספריה בדם. פטרונים מסוג זה מלווים כוח, חסד וקצת מזל גנוב, אם כי מטרותיהם נוטות לחורבן, והמכשף צריך להחליט עד כמה ללכת אחריהם. רבים מגלים שהמחיר משולם בוויתורים קטנים הרבה לפני החשבון הסופי.
- id: hunter
  name: 'צייד'
  flavor: >-
    ציידים משוטטים בקצוות האדמה המיושבת ועוקבים אחרי כל מה שמאיים על החוות והיערות שמעבר לגדר האחרונה. הם לומדים את נקודות התורפה של הטרף בהתבוננות צמודה, וקוראים את חולשות החיה בקלות שבה חקלאי קורא את השמיים. המלאכה שלהם מגינה גם על המקומות הפראיים וגם על האנשים שחיים לידם.
- id: life-domain
  name: 'תחום החיים'
  flavor: >-
    מרפאים המשרתים את אמנויות הריפוי רואים בכל פצע ויכוח קטן עם המוות, ולרוב הם מנצחים. ידיהם מתחממות בזוהר יציב כשהם עובדים, והחולים אומרים לעיתים קרובות אחר כך שהחדר מריח כמו גשם על דשא טרי. עיירות חקלאים, מיטות חולים ושדות קרב מכירים את עבודתם, ומעטים שואלים מניין בא הכישרון.
- id: oath-of-devotion
  name: 'שבועת המסירות'
  flavor: >-
    אבירים שנוטלים את הנדר הזה רואים בדברם מחייב כמו פלדה, ומתייחסים להבטחה שהופרה כאל הפשע הגרוע מכולם. רבים נושאים על מגניהם סמלי כנפיים, קידה אל יצורי אור שנאמר עליהם שהם משגיחים על אנשים ישרים. יש חמורי סבר עד כדי פגם, אך הממלכה ישנה בשקט רב יותר כשהם עומדים במשמר.
- id: path-of-the-berserker
  name: 'דרך הברסרקר'
  flavor: >-
    ברסרקרים נותנים לגאות האדומה לשאת אותם. הזעם מרים אותם אל סערת מכות, והם מתייחסים לשצף הקרב כאל שיבה הביתה ולא כאל זוועה. לחברים קשה לפעמים לקרוא להם בחזרה כשהקרב נגמר, והאויבים לומדים מהר שברסרקר אינו מרגיש פחד בלב הקרב.
- id: thief
  name: 'גנב'
  flavor: >-
    בכל מגדל חרב יש תיבה נעולה וכמה סיפורים שאיש אינו רוצה שיסופרו, והגנב בא לגבות את שניהם. אצבעות זריזות פותחות מנעולים וכיסים כאחד, וצעד קל נושא אותו במעלה קירות תלולים ופני גגות. קשה להחזיק אנשים כאלה זמן רב, ותכשיטי הקסם שהם שולפים מוצאים לא פעם את דרכם אל שולחן צפוף.
- id: warrior-of-the-open-hand
  name: 'לוחם היד הפתוחה'
  flavor: >-
    נזירי האסכולה הזאת נלחמים בלי נשק ורואים בגופם את הכלי המשובח ביותר שבבעלותם. הם יכולים לדחוף בריון דוהר חזרה לרוחב החצר, להוציא יריב משיווי משקל, או לאחות את פצעיהם בדופק של כוח פנימי. שלוותם ידועה, ונאמר שהמשמעת שלהם גורמת לסלע הקשה ביותר להיראות רך.
