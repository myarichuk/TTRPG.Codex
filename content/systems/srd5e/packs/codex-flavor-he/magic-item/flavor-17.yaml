- id: ring-of-jumping
  flavor: >-
    נחושת בוהקת מתעקלת ללולאה בצורת ארנבת מזנקת, רגליה אסופות באמצע הזינוק. ציידים, שליחים ואקרובטי גגות מגלים שקפיצה פתאומית נושאת אותם הרחק מעבר למה שרגליהם לבדן היו מסוגלות להן. הקסם שלה פשוט ונלהב, והיא כמעט אינה דורשת יותר מכיפוף מהיר של היד.
- id: ring-of-mind-shielding
  flavor: >-
    טבעת פיוטר כהה וחלקה, עם תפר כסוף חלש, מונעת ממחשבות סקרניות להיכנס לראשו של עונדה. מרגלים ראשיים ושומרי חדרים שקטים מחבבים אותה, כי אף קורא מחשבות אינו יכול לדעת מה הם באמת חושבים. סיפורים רומזים שנשמה החתומה בתוך הטבעת עשויה לשמור סודותיה שנים רבות.
- id: ring-of-protection
  flavor: >-
    רצועת פלדה פשוטה נושאת ספיר קטן ועמום, שתופס את האור רק כשהעונד עומד איתן. שומרים, מנהיגי שיירות וחוקרים עצבניים עונדים אותה בשביל התחושה הצנועה אך האמינה שלהב או קללה יתקשו מעט יותר למצוא את מטרתם.
- id: ring-of-regeneration
  flavor: >-
    קוורץ ורדרד חיוור, משובץ בטבעת זהב דקה, מרגיש חמים קלות על העור, כמו תחבושת מרפא. מנתחי שדה וציידי הרים מעריכים אותה על הריפוי האיטי והיציב שהיא נותנת כשהם חבולים או פצועים הרחק מעזרה. מספרים שהיא יכולה לפתות גפה אבודה לשוב ולהתקיים, אם כי מעטים ניסו.
- id: ring-of-resistance
  flavor: >-
    צבע אבן החן רומז לאלמנט שהרצועה מגנה מפניו, כמו פנינה לחומצה או גרנט לאש. מוכרים בעיירות נמל ובמעברי הרים סוחרים בהן כמתנות נבונות למטיילים שמצפים לצרות. גם מכה קשה מהאלמנט הזה משאירה לעונד רק שרוול חרוך או יד כואבת לעדות.
- id: ring-of-shooting-stars
  flavor: >-
    רצועה כחולה כהה מחזיקה ניצוצות כסף שנסחפים על פניה כמו שמי חורף קטנים. נודדים וצוותי משמר לילה משתמשים בנצנוצה כדי לקרוא את הדרכים שלפניהם, והבזקיה הבהירים יותר יכולים להבהיל או לפזר חבורת אויבים. ניצוציה דועכים בחזרה אל המתכת רק כשהעונד שותק ונח.
- id: ring-of-spell-storing
  flavor: >-
    טבעת זהב כהה ועבה, ובעומק אבנה כמו מסתחרר אור צבעוני קלוש, כאילו היא מלאה נשימה. קוסמים משאירים אותה על שולחנות ובכיסים, ולחשים נופלים לתוכה לשמירה עד שמישהו ראוי קורא להם לצאת.
- id: ring-of-spell-turning
  flavor: >-
    מתכת שחורה מצוחצחת נושאת קווים בוהקים כמראה, שמתנודדים כמו מים על פני הרצועה. לוחמי דו-קרב ויועצי חצר שחוששים מכישוף עוין מעריכים אותה, שכן רוב הלחשים העוינים מחליקים ממנה או מתקפלים חזרה אל מטילם. הסיפורים הישנים משבחים את עונדיה על שהפכו את רוח הקללה עצמה נגד מי שהטיל אותה.
- id: ring-of-swimming
  flavor: >-
    טבעת אמייל כחולה חיוורת נושאת דוגמת גלים קטנה שנדמה שהיא זורמת בכל פעם שהעונד מזיז יד. צוללי פנינים וצוותי מעבורות מעדיפים אותה בגלל החתירה הבטוחה, דמוית הדגים, שהיא מעניקה בזרמים עמוקים. יש האומרים שהמים עצמם נעשים קצת ידידותיים יותר לכל מי שעונד אותה.
- id: ring-of-telekinesis
  flavor: >-
    רצועת ברזל בגוון ורוד מחזיקה גביש שקוף קטן שתמיד נדמה שהוא מרחף מעט מעל משבצתו. חוצבי אבן, בוני גשרים וגנבים ערמומיים חולמים על האחיזה השקטה שהיא מציעה, ועל האופן שבו אבן או כלי שנפל יכולים לצוף על פני החדר ברצון בלבד.
