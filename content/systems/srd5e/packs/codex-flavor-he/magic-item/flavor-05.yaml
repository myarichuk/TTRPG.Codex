- id: cloak-of-elvenkind
  flavor: >-
    גלימה בירוק ואפור עמומים, ארוגה רכה כל כך שהיא משתיקה כל צעד ומעממת את הברק של עין צופה. שומרי יער שמעריכים התקרבות שקטה מורישים לא פעם גלימות כאלה במשפחתם. מי שעוטה אחת מהן חומק על פני אוזניים חדות ועיניים חדות יותר, כאילו הצללים הם קרובי משפחתו.
- id: cloak-of-protection
  flavor: >-
    גלימה כבדה מצמר כהה כשזיף, ושולי הכיפול שלה רקומים ברצועה פשוטה של קשרי כסף. זקיפים מעיירות הגבול לובשים אותה במשמרות לילה ארוכות, בטוחים שהבד יסיט מכה תועה וישקיט את הנפש מפני בהלה פתאומית. אחיות זקנות אומרות שהקשרים קושרים מעט מזל טוב לכל צעד.
- id: cloak-of-the-bat
  flavor: >-
    גלימה אפלולית עם שוליים מסולסלים, כאילו היא שומרת בתוכה מעט מהלילה. בדמדומים ובצללים הלובש אוחז בקצותיה ומרחף על כנפי בד עוריות. יש לובשים שמקפלים את עצמם לצורה קטנה מכונפת, ושומרים על חריפות דעתם ועל קסמם בזמן שהם מפרפרים באוויר.
- id: cloak-of-the-manta-ray
  flavor: >-
    גלימה גמישה בכחול מנומר ובכסף חיוור, וקצותיה פרושים כמו כנפי יצור ים מרחף. צוללנים שלובשים אותה נושמים במים עמוקים בקלות כמו באוויר פתוח. דייגי החוף מתעקשים שהבד עדיין מריח קלות מלח וצמחי ים.
- id: crystal-ball
  flavor: >-
    כדור בדולח פשוט עם שפה כסופה קלושה, מן הירושות שיושבות על אדן האח וממתינות שאורח ישאל עליהן. מבט אל עומקו יכול לגלות חדרים ופנים רחוקים, אם כי התמונה אף פעם אינה יציבה לגמרי. מיסטיקנים מעיירות הנהר מספרים זה לזה על שראו אהוב מבעד לצעיף של ערפל.
- id: crystal-ball-of-mind-reading
  flavor: >-
    כדור בדולח ללא פגם, קריר למגע, שמחזיק את ההשתקפויות העמומות של חדרים רחוקים. המביט יכול להסתכל אל מקום מרוחק ואז להאזין למחשבות של העומדים ליד העדשה. חכמי המכללות הישנות מזהירים שתובנה כזאת משאירה את הנפש פתוחה לרווחה מול הפגיעה בה עצמה.
- id: crystal-ball-of-telepathy
  flavor: >-
    כדור זכוכית חלק בעריסת ברונזה, ופניו מעורפלים קלות מבפנים. דרכו יכול המשתמש לדבר עם מוחות שהוא רואה מרחוק, ולדחוף אחד מהם לבחירה. מי שמשתמש בו הופך לזהיר במילותיו, כי הזכוכית שומרת זיכרון קלוש של כל לחישה.
- id: crystal-ball-of-true-seeing
  flavor: >-
    כדור בדולח חיוור עם לב מעונן שמתבהר בכל פעם שיד יציבה נוגעת בו. המביט דרכו, חוזה, רואה צורות אמיתיות גם במקום שבו אשליות וצללים מעמידים פנים אחרות. טווח ראייתו מוגבל, אבל בתוך המעגל הזה שום דבר נסתר לא נשאר מוסתר זמן רב.
- id: cube-of-force
  flavor: >-
    קובייה קטנה, לא גדולה מקצה אצבע, וכל פאה בה חרוטה בסמל אחר בדיו אדום כהה. לחיצה על פאה משחררת התפרצות קצרה של קסם מגן: הגנה קטנה, מחסה איתן, או חומת אור חיוור שמסרבת לכל מכה. בעלי מלאכה קוראים לה צעצוע העקשן ביותר שנוצר מעולם.
- id: cubic-gate
  flavor: >-
    קובייה ממתכת אפורה וחדגונית בעלת שש פאות, כל אחת מסומנת בסמל אחר והומה בעוצמה חסרת מנוח. לחיצה על פאה פותחת פתח אל התחום שהיא מצביעה עליו, ולחיצה כפולה מעבירה את הבאים לידך. משתמשים נבונים שומרים מטען רזרבי בהישג יד, כי הצד השני כמעט אף פעם אינו מסודר.
