- id: trident-of-fish-command
  flavor: >-
    קלשון של ארד מכסף, עם שלוש שיניים שתופסות את האור כמו קשקשי דגים, וידית שהמלח שיפשף אותה עד חלקלקות. מי שנושא אותו יכול לכופף חיה שוחה לרצונו במחשבה נחושה אחת. דייגים בחוף האפור לוחשים שפעם קרא לבנק דגים שלם אל הרשתות.
- id: universal-solvent
  flavor: >-
    צינורית זכוכית דקה ובה נוזל חלבי חריף הריח, חתומה בשעווה שאף פעם לא ממש מתייבשת. שפיכה קטנה ממנו פותרת את הדבק העקשן ביותר, אפילו מהסוג שמשמש לחתימת מכתבים אסורים. סוחרים בשווקי הנמל נשבעים שהצינורית לעולם לא מתרוקנת, אבל אף אחד מהם לא שואל מי ממלא אותה.
- id: vicious-weapon
  flavor: >-
    להב או ידית פשוטים, מושחזים מעבר לכל נוחות, והקצה שלהם נראה תמיד רעב מעט יותר מהיד שמחזיקה בהם. כל מכה נושאת איתה גל של רשעות שרוכב על המהלומה וחודר עמוק יותר מכפי שהיה צריך.
- id: vorpal-sword
  flavor: >-
    להב בהיר של פלדה חיוורת שמזמזם חרישית כשמניפים אותו, ואיזונו מושלם כל כך שנדמה שהוא מכוון את עצמו. לוחמי דו-קרב מדברים עליו בקול שקט, כי מכה אחת שנבחרה היטב יכולה לסיים קרב שאף מיומנות לא הייתה מנצחת בו.
- id: wand-of-binding
  flavor: >-
    שרביט דק מעץ אש חיוור, מכוסה בקצהו ברזל מוכתם, ומשטחו חרוט בסלילי חבל קשור. תנועת פרק יד אחת יכולה לנעוץ חיה או אדם במקומם, נוקשים ומביטים בחלל ריק. סוהרים תולים את שלהם על ווים ליד הדלת, כי דממה יכולה להיות אכזרית וגם רחמנית.
- id: wand-of-enemy-detection
  flavor: >-
    מוט דק של עץ אש חיוור שמתעוות לעבר צרות לפני שמישהו אחר שם לב אליהן. קוסמי שדות אומרים שהוא מזמזם חרישית כשאויב נסתר מתקרב, והזמזום הזה הציל לא מעט נוסעים בביצות הקנים. הוא משתתק ברגע שיד אחרת אוחזת בו.
- id: wand-of-fear
  flavor: >-
    שרביט חיוור בצבע עצם, כרוך בחבל בצבע חלודה ישנה, שנשא פעם מאמן קשוח שסמך על צעקות יותר מאשר על חרבות. מילה קצרה וחדה מקצהו יכולה לגרום לאויב לברוח או לצנוח על ברכיו. חיילים ותיקים קוראים לו שרביט הבריון, ואינם טועים לגמרי.
- id: wand-of-fireballs
  flavor: >-
    שרביט שחור מעץ אלון, עם קצה מזכוכית מעושנת, חם למגע גם בחורף. בעליו יכול לשלוף ממנו פרץ להבה בהיר, ועם מעט מאמץ נוסף הפיצוץ מתחזק, כמו כבשן מוסק שיוצא קולו כשזורקים לתוכו עוד פחם. בקולג׳ים עתיקים נשבעים שהוא מתעצבן כשכמעט נגמר בו הכוח.
- id: wand-of-lightning-bolts
  flavor: >-
    אורך של עץ אפור כאפר, חגור בטבעות נחושת שמזמזמות חרישית למגע. נקודות של אור כחול מפצפץ קופצות מקצהו, מתפצלות באוויר בקו מחוספס ושורפות כל מה שעומד בדרכן. פועלי רציף נשבעים שאחד כזה פילח פעם תורן של ספינה בזמן סערה.
- id: wand-of-magic-detection
  flavor: >-
    שרביט פשוט מעץ ערבה, ועל גבו סליל של חוט כסף, קטן מספיק כדי להחליק לתוך שרוול. נושאו יכול למשוך ממנו נצנוץ קלוש שחושף היכן חפצים מכושפים ושרידי כישוף נמצאים בסביבה, כמו מנורה הנראית מבעד לזכוכית מכוסת כפור. חניכים בבתי הספר הישנים נושאים לעתים קרובות שרביט כזה ככלי ראשון.
