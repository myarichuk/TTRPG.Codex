- id: dagger-of-venom
  flavor: >-
    להב דק בברק ירוק-שחור, שחודו טופח בידי כימאי סבלני שמעולם לא רצה תודה. הרעל שהוא נושא נדבק לפלדה כמו ערפל נהר, והפצע שהוא משאיר נוטה להתעכב זמן רב אחרי שהקרב נגמר.
- id: dancing-sword
  flavor: >-
    חרב ארוכה שמסרבת להישאר ביד, ומעדיפה לרחף מעל רצפת הדו-קרב ולבחור לעצמה מטרות. נפחים מאסכולה עיקשת מסוימת טוענים שלמדה את התעלול מלהקת אנפות מבוהלת.
- id: decanter-of-endless-water
  flavor: >-
    בקבוק נמוך וסגור בפקק שמקשקש בצורה משכנעת גם כשהוא ריק, מסוג הבדיחות שקוסמי גדרות אוהבים לחזור עליהן. שלוף את הפקק והוא פולט מים מתוקים או מלוחים, מהתזה אדיבה ועד שטף מתפרץ שמפיל כל מה שניצב בדרכו.
- id: deck-of-illusions
  flavor: >-
    קופסה מרופטת של קלפים מצוירים, רובם יצורים ושניים משקפים את פניו של מי שמעז להביט. מי שערבב כראוי וזרק לעפר קלף, מזמן מפלצת רפאים שמעמידה פנים שהיא מסוכנת, אף שאינה יכולה לנשוך אף אחד באמת.
- id: defender
  flavor: >-
    נשק פשוט וישר מכל סוג של קרב פנים אל פנים, אף שחוש ההומור של יוצרו מתגלה בתעלול נסתר. אוחזו יכול להעביר כוח מהלהב אל הגנה יציבה יותר, ולהמיר עוצמת מכה בעמידה איתנה כשהקרב נהיה מרושע.
- id: demon-armor
  flavor: >-
    שריון מברזל שחור חרוט בפרצופים מחייכים, וכפפותיו הטפורות להוטות לקרב. מי שלובש אותו קולט שפה של בורות התהום, אבל הרתמה לעולם לא באמת מרפה, והשדים מגלים בלובש עניין חמוץ.
- id: dimensional-shackles
  flavor: >-
    אזיקי ברזל כבדים שמתרופפים או מתהדקים לפי מידת הכבול, ונהוג להשתמש בהם על מי שכבר המום מכדי להתנגד. אמני בריחה מהאקדמיות הישנות אומרים שהמפתח הבטוח היחיד נמצא אצל מי שנעל אותם, ושבוי עיקש עדיין עשוי לנסות להשתחרר.
- id: dragon-orb
  flavor: >-
    גלובוס גביש שערפל סוער בתוכו, ורשעה עתיקה של דרקון מעורבבת בזכוכית. מי שמביט בו זמן רב מגלה שהכדור אוחז ברצונו, לוחש עצות אפלות ומציע טובות קטנות, בעוד העשן שלו מתרומם בצורת כנפיים.
- id: dragon-scale-mail
  flavor: >-
    קשקשים חופפים שנחתכו מעורו של דרקון אחד, כל אחד מצוחצח עד שהוא נוצץ כזכוכית צבעונית. לפעמים דרקון מעניק את קשקשיו שהשיר, ולפעמים צייד סבלני משמר את עורה של חיה שנפלה, אבל בכל מקרה הלובשים מעריכים את השריון יותר מזהב.
- id: dragon-slayer
  flavor: >-
    להב פשוט ומאוזן היטב, שחודו כמו מזמזם כשמפלצת קשקשים מתקרבת. ציידים ותיקים נשבעים שהפלדה זוכרת כל תנין-כנף שפילחה, והם שומרים אותה משומנת לקראת הבא שיחצה את דרכם.
