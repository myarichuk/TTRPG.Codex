- id: berserker-axe
  flavor: >-
    הנפח שחישל את הגרזן הזה היה כועס, וזה ניכר בכל חריץ שבלהב. חודו נועץ עמוק והקת שוכבת בכף היד כאילו שם מקומה, ובכך בדיוק היא אוחזת בבעליה. מי שנוטל אותה מתחבב עליה, ואחר כך נעשה חסר מנוח בכל פעם שהלהב עוזב את אחיזתו.
- id: boots-of-elvenkind
  flavor: >-
    סנדלרי היער תופרים את המגפיים הרכים האלה מעור חיוור ששותה כל קול. מי שנועל אותם חולף באולם הומה כמו שמועה, ומגיע לפני שמישהו חשב להקשיב. פורצים ומרגלים משלמים לפעמים הון תועפות על זוג, אך גם סיירים ישרים מעריכים אותם לא פחות.
- id: boots-of-levitation
  flavor: >-
    סנדלר אחד נשבע שהמגפיים האלה הם סוליות רגילות שנתפרה לבטנתן קצת רוח עקשנית. מי שנועל אותם לומד להתרומם מהרצפה כרצונו ולהישאר תלוי באוויר, כמו עפיפון על חוט סבלני. מטפסים מעריכים אותם מאוד, אבל השמועה אומרת שהזוג הראשון נעשה בשביל מלומד זקן ומקפיד.
- id: boots-of-speed
  flavor: >-
    בעיירות החופשיות אומרים שליחים מהירים שזוג עקבים טוב עדיף על סוס טוב. במגפיים האלה מסתתר תכסיס חכם בעקב, נקישה חדה שמכפילה את הצעד, וכל מי שרודף אחרי הרץ מגלה שרגליו מאכזבות אותו. אם דוחקים בהם יותר מדי, הקסם מתעצבן עד שהנועל נח כראוי.
- id: boots-of-striding-and-springing
  flavor: >-
    פחחים נודדים מתלוננים שזוג מגפיים לא צריך לעשות כל כך הרבה. המגפיים האלה שומרים על קצב צעידה יציב של הנוסע, לא משנה כמה כבד התרמיל וכמה כבד המעיל המשוריין. מדי פעם הם מזנקים בשמחה ומעבירים את הנועל מעל תעלה או גזע נפול.
- id: boots-of-the-winterlands
  flavor: >-
    המגפיים המפרוותיים האלה נתפרו בידיים שמעולם לא סמכו על הקיץ, והם נשארים צמודים ונעימים גם כשהכפור מטפס במדרגות. ציידי פרוות ותיקים נשבעים שהסוליות זוכרות כל שלג שחצו. ההליכה על שלג דחוס הופכת לריקוד שקט.
- id: bowl-of-commanding-water-elementals
  flavor: >-
    קערת חרס פשוטה שמתעוררת לחיים ברגע שממלאים אותה מים ומישהו עומד קרוב מספיק כדי לדבר. המים מתרוממים לדמות בעלת פנים קרות וסבלניות, והיא מצייתת עד שהעבודה נגמרת או שמשלחים אותה הביתה. טבחים בחוף אומרים שהקערה זוכרת כל גאות ושפל שהחזיקה.
- id: bracers-of-archery
  flavor: >-
    חפתי עור גמיש, רקומים בדוגמאות זעירות של חיצים, אהובים על קשתים שרוצים שיד המיתר שלהם תשיר. קוסמי שדה טוענים שהעור עבד במרתף בצלע גבעה שבו הרוח לא הפסיקה לשרוק. נדמה שכל חץ שנשלח דרכם נושא מעט כוח כוונה נוסף.
- id: bracers-of-defense
  flavor: >-
    מגני אמה פשוטים עטורי פלדה, שנדמה כי הם מזמזמים בקול חלוש בכל פעם שאין שריון על הלובש. דו-קרב ותיקים מעדיפים אותם בלילות שבהם הם רוצים לנוע בחופשיות ולא להיקבר תחת שריון לוחות. המתכת שומרת על דממה רגועה ומתבוננת, כאילו היא מחכה ללהב שלעולם לא מגיע.
- id: brazier-of-commanding-fire-elementals
  flavor: >-
    מחם ברזל שחור משריפה סביב שפתו, שמתעורר כשמישהו עומד קרוב מספיק כדי ללחוש פקודה עתיקה. להבה מתקבצת לדמות בעלת עיני גחלים וקול מתפצפץ, והיא עונה למזמן שלה עד שמשחררים אותה או עד שהיא כלה בעצמה. האפר בקערה נשאר חם זמן רב אחר כך.
