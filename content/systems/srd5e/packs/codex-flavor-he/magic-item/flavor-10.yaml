- id: helm-of-brilliance
  flavor: >-
    קסדת טקסים משובצת אבני חן בארבעה צבעים, וכל אבן לוכדת סוג אחר של אור, עד שנדמה שהחובש עטוף בזריחה קטנה ופרטית שלו. חרשי השריון אומרים שהאבנים מתפוררות לאבק כשעוקרים אותן, והחכמים שכתבו עליה הקפידו שלא לנקוב בשם של אף בעלים.
- id: helm-of-comprehending-languages
  flavor: >-
    קסדת ברזל פשוטה עם מצחייה מזכוכית מלוטשת, וחובשה מסוגל לעקוב אחר נאומים בלשונות שאיש סביב השולחן לא דיבר מעולם. שליחים וסופרי רציפים מעריכים אותה מאוד, אף שטבח חד לשון העיר פעם שקסדה שמבינה את כולם שומעת גם כל תלונה.
- id: helm-of-telepathy
  flavor: >-
    קסדת כסף קרירה, ורפידתה הפנימית שחוקה וחלקה מידיהם של תריסר בעלים, שכל אחד מהם התעקש שהוא שומע את מחשבות חבריו. קוראי מחשבות ביריד היו משלמים הון תועפות על אחת כזאת, והמכללות הישנות מקפידות על כלל נוקשה: לא להשאיל קסדה כזאת למי שיש לו חשבון לא סגור.
- id: helm-of-teleportation
  flavor: >-
    קסדת ארד מבריקה ועל ציצתה שלוש אבנים כחולות קטנות, וכל אחת מהן מחזיקה מעט מהרצון חסר המנוחה של החובש להיות במקום אחר. שליחים ומפות כאחד חושקים בה, אך קוסמי שוליים מזהירים שההגעות מגיעות לפעמים בסדר קצת שגוי, עם המגפיים קודם.
- id: holy-avenger
  flavor: >-
    חרב ארוכה עם להב של זהב לבן, ידית עטופה חוט שנהב, ובראש הנצרה אבן חיוורת אחת שזוהרת כשהחרב שלופה. שומרי המכללות הישנות משגיחים עליה בקפידה רבה, וכמה אגדות טוענות שאורה החיוור משיב יצורי צללים אל החשכה.
- id: horn-of-blasting
  flavor: >-
    קרן פליז ארוכה עם פעמון מתרחב ופיה רחב, ומתכתה מכוסה שקעים מכל ניסיונותיהם של רברבנים להפיק את הצליל הרם ביותר. כורים ומעבורנים מחזיקים אחת כאזהרה, שכן ידוע שהקרן התפוצצה בידי מי שתקע בה יותר מדי פעמים.
- id: horn-of-valhalla
  flavor: >-
    קרן מעוקלת, יצוקה מאחת ממתכות שונות, שקוראת לרוחות לוחמים מאולם גיבורים רחוק כשצלילה מהדהד מעל שדה. מי שזימנו אותן אומרים שהרוחות מנומסות עד שהקרב מתחיל, ואז הן רק נאמנות, חסרות פחד ורועשות מאוד.
- id: horseshoes-of-a-zephyr
  flavor: >-
    ארבע פרסות ברזל חיוורות שמרימות סוס מעט מעל האדמה, ואינן משאירות סימן פרסות בבוץ, בחול או בשלג. שליחי מישורי הנהר נשבעים שהפרסות גורמות לסוס להרגיש קל כעלה, וגילדות הסוסים הוותיקות מחשיבות אותן חכמות מדי לעבודה ישרה.
- id: horseshoes-of-speed
  flavor: >-
    ארבע פרסות ארד כהות עם קצוות מתפתלים, וכל אחת חרוטה בפס קווים זהובים שנראים כמו רוח שנתפסה באמצע דהירה. מתחרים ביריד הישן היו מוכרים את האוכף שלהם בעד סט אחד, ולנערי האורווה יש אמרה שסוס שנועל אותן ינצח אפילו את הצל של עצמו.
- id: immovable-rod
  flavor: >-
    מטה הברזל הזה נושא כפתור בקצהו האחד, ומרגע שלוחצים עליו הוא נאחז במקומו בעקשנות כמו הר שאוחז בצורתו. מודדים וחבלנים מוצאים אותו שימושי לגשרים ולמדפים מביכים, אף שמי שמנסים להזיז אותו נוטים להתלונן על המשא.
