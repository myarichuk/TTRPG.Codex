- id: periapt-of-proof-against-poison
  flavor: >-
    אבן חן שחורה ומבריקה תלויה בקצה שרשרת כסף דקה, ותופסת את האור כמו מים עמוקים. רוקחים זקנים החזיקו תליונים כאלה קרוב אליהם כשטיפלו בשורשים מרים, והאמינו שהאבן הכהה דוחה כל נשימה חמוצה וכל טיפה מזוהמת.
- id: periapt-of-wound-closure
  flavor: >-
    חוטי כסף ואדום שזורים יחד יוצרים את התליון הדק הזה, וקשריו הדוקים כל כך עד שנדמה כי יש בהם דופק משלהם. רופאי שדה במבצרי ההרים נשבעו בקמעות כאלה, וטענו שלב עקשן מסרב לוותר כשאחד מהם קרוב.
- id: philter-of-love
  flavor: >-
    נוזל בגוון ורד שמבעבע קלות, ובאמצעו צפה בועה אחת בצורת לב. שותים בפונדקים הישנים נשבעים שהפנים הראשונות שפוגשים אחר כך נראות זוהרות בחום שקשה להתנער ממנו.
- id: pipes-of-haunting
  flavor: >-
    חלילים חיוורים כעצם, מלוטשים חלק בידיים רבות, משמיעים צליל דק שנשאר תלוי בקורות הגג הרבה אחרי הנשיפה האחרונה. שחקני במה בעיירות הנהר מספרים על קהלים שנמלטו מהאולם, בטוחים ששמעו את שמותיהם נלחשים בין הקנים.
- id: pipes-of-the-sewers
  flavor: >-
    זוג חלילי פח מעוכים, ירוקים מחלודה וחמימים מרוב אחיזה. צדי עכברושים שעובדים מתחת לרחובות השוק אומרים שהנחילים החורקים מתאספים עם הצליל הראשון, נעים כמו גאות שנענית רק למנגינה.
- id: plate-armor-of-etherealness
  flavor: >-
    שריון לוחות חרוט בספירלות דקות של כסף, מעובד בעדינות כזו שנדמה כי המתכת נושמת עם לובשה. אבירים ששבו משדות האפר אומרים שהפלדה נעשית קלושה בקצותיה, כאילו הלובש כבר עבר חצי דרך דלת סגורה.
- id: portable-hole
  flavor: >-
    בד משי שחור, מקופל קטן דיו להיכנס לכיס, ונפרש בלחישה כשמנערים אותו. קוסמי שדות נשבעים שהוא מכיל מלאי של מרתף שלם, אם כי איש מעולם לא הציץ אל תוך הפה האפל וחזר עם תיאור ברור.
- id: potion-of-animal-friendship
  flavor: >-
    נוזל חום ובוצי מכיל פיסות שצפות כל אימת שמטים את הבקבוק, ומראות שערת חפרפרת, שבב של כנף עש וסלסול קליפה. רועים במרעות הגבוהים טוענים שהשתייה גורמת לחיות הבר להרכין ראש ולהתקרב, סקרניות מה יש לחלוק.
- id: potion-of-clairvoyance
  flavor: >-
    נוזל צהבהב נושא בתוכו צורה קלושה של עין, שמסתובבת אחר מבטו של כל מי שמציץ פנימה. סופרים בחצרות הגבול אומרים שמוטב לצקת אותו לספל בזהירות, כי העין הפקוחה נוטה לנדוד אל מי ששותה.
- id: potion-of-climbing
  flavor: >-
    שכבות חומות, כסופות ואפורות שוכנות בבקבוק, ושום נענוע לא יערבב אותן. כורים בכפרי הגבעות שותים אותו לפני שמטפסים על פני מצוק, בבטחה שהצוקים שבבקבוק ישאילו להם אחיזה.
