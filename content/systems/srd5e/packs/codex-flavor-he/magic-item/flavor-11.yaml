- id: instant-fortress
  flavor: >-
    בתוך פסלון אדמנטיום בגודל כף יד מחכה מגדל למילת פקודה אחת. משהוא נפרש, קירותיו האפורים כאבן ניצבים גבוהים ושלמים, וכל מה שעמד בדרכו נדחף הצידה בנימוס. רוב הבעלים רואים בו מבצר לערב הנדיר שבו הדרך הפתוחה הופכת עוינת.
- id: ioun-stone
  flavor: >-
    כל אבן היא תכשיט חלק וזגוגי, בצורת מנסרה נטויה או שן קצרה, וצבעה של כל אחת הוא חתימתה הפרטית. מי ששומרים אותן נוהגים לתת להן לשוט לאט מעל הראש כמו ירחים זעירים. המכללות הישנות מתווכחות בלי סוף אם האבנים חושבות, או רק מתעצבנות.
- id: iron-bands
  flavor: >-
    כדור ברזל חלוד, לא גדול משזיף, מסתיר בתפרים שלו סבך של רצועות מתכת מפותלות. כשזורקים אותו ביד יציבה הוא מתפוצץ באמצע הטיסה ועוטף את מטרתו בקשר מקרקש, שאוחז חזק עד שהזורק בוחר להתירו. מבריחים וסוהרים כאחד מעריכים אותו על כמה שהוא עושה את עבודתו בצורה מסודרת.
- id: iron-flask
  flavor: >-
    פקק הצלוחית הזאת עשוי פליז, וכלי הברזל מצולק בידי בעלים שמעולם לא סמכו לגמרי על מה ששמרו בתוכו. כל מי שפתח אחת מדווח על שקט צפוף וגפריתי, שנדמה שנמשך לנצח. אספנים זהירים מסמנים כל צלוחית בשם שהם מקווים לא לקרוא בקול לעולם.
- id: javelin-of-lightning
  flavor: >-
    לכידון הדק הזה יש קת מעץ מילה כהה, כרוכה בחוט נחושת, וראשו מזמזם חרישית לפני כל זריקה. כשזורקים אותו בתנועת פרק יד הוא יכול להתפצל לפס מתפצפץ שפוגע ישר דרך קהל אויבים. ציידים שנושאים אותו נוטים להרחיק את חבריהם במרחק בטוח.
- id: lantern-of-revealing
  flavor: >-
    פנס פליז בעל מכסה, שבוער ביציבות על טיפת שמן בלבד, ואורו צלול מספיק להראות מה שהיה צריך להישאר נסתר. דברים שמסתתרים מעיניים רגילות כאילו מנצנצים אל תוך הגלוי בתוך זוהרו. מטיילים שומרים יד על המכסה, כי הורדתו מרככת את הזוהר לקראת שינה.
- id: luck-blade
  flavor: >-
    קצה הלהב מלוטש עד כדי כך שנדמה שהוא שותף לבדיחה פרטית עם בעליו. אומרים שבעלי המזל מנצחים בוויכוחים ובקרבות צמודים כאחד, ומטבע כסף זעיר שנטבע בידית משמש להם תזכורת. התעלול האהוב על החרב הוא הזדמנות חדשה, המוצעת בשקט כשההטלה הראשונה של הגורל משתבשת.
- id: mace-of-disruption
  flavor: >-
    ראשה הברזלי בעל הצלעות חרוט בטבעות אור חיוורות, והיא מזמזמת בכל פעם שהיא חשה דבר שלא היה צריך ללכת על האדמה. נגד אל-מתים ובני-תופת היא מכה בפולס של זוהר שיכול להשאיר אויב מוחלש רועד עד היסוד. הזוהר נדבק לאוחז בה גם במנוחה.
- id: mace-of-smiting
  flavor: >-
    כפתורי ברזל כבדים מכתירים את האלה הזאת, וידיתה כרוכה בחבל אפור עמום שמתחמם ביד. מכות שנוחתות נקי זוכות בנקישת כוח שמהדהדת בכל המטרה, ויציר מלאכה יתפרק מהתפרים. מהנדסים שמתקנים מנגנוני שעון שומרים אחת קרוב, בעיקר כדי ליישב חשבונות.
- id: mace-of-terror
  flavor: >-
    אלת ברזל כהה עם ראש כאגרוף קפוץ, ונדמה שלחישה קלה נפלטת ממנה בכל פעם שמניפים אותה מול המון. כשהנשק משחרר את אימתו, אויבים סמוכים חשים דחף לשים ביניהם לבין האוחז בו כמה שיותר מרחב. אוחזיה מייחלים לעיתים לנשק שקט יותר.
