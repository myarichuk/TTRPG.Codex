- id: wind-fan
  flavor: >-
    מניפת משי מצוירת עם צלעות של במבוק, ובקפליה ענני שמיים חיוורים וציפורים נסחפות. כשמנפנפים בה בתנועת פרק כף היד, היא מעוררת משב פתאומי שיכול להפיל נר או לשלוח כובע בריחוף. למניפות מסוג זה יש נטייה להיקרע ברגע הגרוע ביותר.
- id: winged-boots
  flavor: >-
    מגפי עור חומים וגמישים עם תפרי זהב דהויים, שחוקים בעקב מחיים שלמים של שליחויות נחפזות. ברגע שקושרים אותם, צעדו של הנועל נעשה קל, כאילו האוויר הושיט יד לעזרה. מי שנעל אותם מתארים עלייה מסחררת וחוסר רצון מוזר לרדת בחזרה.
- id: wings-of-flying
  flavor: >-
    מעטפת נסיעות כבדה מצמר ירוק עמוק, ואבזמה בצורת ציפור כסופה בטיסה. בתנועת יד מנוסה הבד נפתח ומתרומם, ונפרש לזוג כנפיים רחבות ונוצתיות שנושאות את לובשן אל השמיים. הנוצות נמוגות באנחה כשהטיסה מסתיימת.
