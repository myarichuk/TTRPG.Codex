- id: potion-of-diminution
  flavor: >-
    נוזל שקוף ובו חרוז אדום שמתנפח ומצטמק בלי הרף ואינו מתיישב על צורה אחת. חייטים שתופרים לבני העם הזעיר של ביצות הקנים נשבעים בו, אף שהם מודים שהעבודה משאירה צלצול קל באוזניים.
- id: potion-of-flying
  flavor: >-
    ברק כסוף מצטבר בראש המשקה השקוף הזה, כמו ענן שנלחץ מתחת לזכוכית. שליחים בעיירות החוף נושאים אותו בדרכים ארוכות, לוגמים רגע לפני טיפוס ובטוחים שהרוח תחזיק אותם יציבים מעל הגגות.
- id: potion-of-gaseous-form
  flavor: >-
    ערפל ממלא את הבקבוק הזה ונשפך כמו מים דקים, מתפתל חזרה לעצמו בכל פעם שהפקק מורם. קוסמי במה בשווקי הנהר שומרים אחד כזה בשביל התעלול שבו מבצע חומק דרך דלת נעולה, אף שהקהל לעולם אינו רואה את התפרים.
- id: potion-of-giant-strength
  flavor: >-
    פיסות אור חיוורות נסחפות בנוזל השקוף הזה כמו גזרי ציפורן של יד עצומה. כל מזיגה של המשקה מדורגת לפי גודלם של בני העם שיצרו אותו לראשונה, ועל הבקבוקים תלוי תג פליז קטן הנוקב בעוצמתם.
- id: potion-of-growth
  flavor: >-
    דיו ארגמן כמו פורח בתוך המשקה המימי הזה, מתפשט מנקודה ואז נסוג אליה שוב. ילדי איכרים הלוגמים מעט לפני מרוץ ביריד מגחכים כשצלליהם נמתחים על הדשא, ריגוש טפשי שאינו נמשך זמן רב.
- id: potion-of-heroism
  flavor: >-
    ערפל מתגלגל לאט בתוך הצלוחית הזו ומזיז את משקלו כאילו הבקבוק הוא ים קטן. חיילים במחנות הגבול קוראים לחומר נחמה לפני הסתערות, וטוענים שהערפל מרגיע את העצבים ומייצב את הידיים.
- id: potion-of-invisibility
  flavor: >-
    דבר אינו נראה דרך הזכוכית הזו, ובכל זאת הצלוחית כבדה כאילו משהו סמיך מתנדנד בתוכה. גנבים ברובעי הנמל מעריכים בקבוקים כאלה בגלל שקטם, אף שסיפורים עתיקים מזהירים שהתעלול מסתיים ברגע שיד רשלנית מסגירה את עצמה.
- id: potion-of-mind-reading
  flavor: >-
    נוזל סגול סמיך מחזיק קלח ורוד רך שמתעקל בלולאות איטיות, כאילו הוא מיין את סודותיו של מישהו אחר. פקידים בבתי הדין הישנים לוגמים תבשילים כאלה לפני דיונים קשים, אף שלחישה תועה כמעט אינה נשארת שקטה.
- id: potion-of-poison
  flavor: >-
    הבקבוק הזה מחופש למשקה ריפוי, עם אותו פקק, אותו זיגוג ואותו גוון אודם, אך תכולתו נועדה להזיק. רק עין חדה, או חכם כנה עם זכוכית מיון, יכול להבחין בהבדל לפני הלגימה הראשונה.
- id: potion-of-resistance
  flavor: >-
    פסים משתנים של צבע חיוור נסחפים בנוזל הזה, וכל אחד מרמז על מגן אחר מפני פגיעה. שומרים בעיירות המלח נושאים כמה בקבוקונים בסיור, סומכים על המזל ועל היד היציבה של מי שמוזג.
