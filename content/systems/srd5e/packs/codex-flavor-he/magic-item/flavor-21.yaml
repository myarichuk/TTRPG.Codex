- id: staff-of-power
  flavor: >-
    מוט גבוה, כרוך ברצועות ברזל ועשוי ארז כהה, ובראשו אבן ענבר בודדת שיושבת בו כמו עין סבלנית. קוסמי גדרות מתווכחים מי השליט שהזמין אותו, אבל כולם מסכימים שהנושא אותו עומד זקוף יותר. מי שאוחז בו יכול לזמן חרוטי כפור או להבות אש, אך הענבר מתעמם עם כל לחש.
- id: staff-of-striking
  flavor: >-
    מטה לחימה פשוט מעץ אשור שזמזם כשמניפים אותו, כאילו העץ זוכר מלחמה עתיקה יותר. אפשר לחדד כל מכה בפעימה של כוח בלתי נראה, שמטלטלת עצמות ופוגעת חזק יותר ממה שהעץ אמור לאפשר. הסוהרים אומרים שמטה להוט צריך לנוח, אחרת יחזור להיות עץ רגיל.
- id: staff-of-swarming-insects
  flavor: >-
    המטה, מגולף בעץ ירוק-שחור ומשובץ חיפושיות ירקן זעירות, מחזיק חבורה זמזמנית משלו. פעימה מקסמו משחררת ענן חרקים מעופפים שאינם מזיקים, והם תלויים סמיכים באוויר ומסתירים את הנעשה מעיני כל מי שבחוץ. רוח חזקה או להבה פתאומית מפזרות את הנחיל.
- id: staff-of-the-magi
  flavor: >-
    המטה, עשוי אלון שחור צפוף וכרוך בכסף מוכהה, נראה כאילו בלע אלף קסמים קטנים. לחשים שמכוונים אל הנושא אותו נוטים להיפרם עליו ולהתפוגג לניצוצות שמזינים את הסיבים בעץ. חכמי המכללות הישנות מזהירים שמטה רעב כל כך עלול להתמלא יתר על המידה ולהפוך למסוכן.
- id: staff-of-the-python
  flavor: >-
    אורך של עץ מנומר, עם ראש נחש מגולף בקצהו, והמטה משתוקק להתפתל. אם זורקים אותו נכון, הוא מחליק בחזרה לשריר חי, חונק גדול שנענה רק לרצונו השקט של בעליו. אנשי הנהר מספרים על מטות שמסרבים לשכב בשקט גם אחרי מות אדוניהם.
- id: staff-of-the-woodlands
  flavor: >-
    עץ ליבנה חלק עם אחיזה עטופה בקליפה, וריחו כריח אזוב אחרי גשם; כשנוגעים בו הוא מזמזם כמו כוורת. שומרי היער אומרים שהענפים שבצמרתו מתכופפים לעבר הנושא כאילו הם מקשיבים. המטה יודע לפתות עצים, חיות ושורשים לשיתוף פעולה שקט.
- id: staff-of-thunder-and-lightning
  flavor: >-
    שתי סופות חולקות את מטה הלחימה הזה, אחת בהירה ואחת רועמת, והעץ רועד לפני שאחת מהן פורצת. ברק יכול לרכב על מהלומה, וקול רעם יכול להתגלגל החוצה ולזעזע את מי שעומד קרוב מדי. מזמני סערות מהחוף שומרים אותו אטום בזכוכית, שכן הוא שוקט רק לזמן מה אחרי כל שימוש.
- id: staff-of-withering
  flavor: >-
    אפור ומסודק כמו ענף מת, והמטה כאילו שותה את הצבע מהעלים שלידו. מכה ממנו יכולה לשאוב חום וחיוניות מהמטרה, ולהותיר את הגפיים איטיות וכבדות לזמן מה. מרפאי כפרי הגבעות מסרבים לגעת בו, ורוב המוצאים משאירים אותו במקום שבו שכב.
- id: stone-of-controlling-earth-elementals
  flavor: >-
    אבן חלקה בגוון אפור-חום, חמימה בכף היד כאילו נחצבה ממצע עמוק. כשלוחצים אותה לאדמה היא מעלה דמות מתנשאת של סלע ואדמה, שנעה לפי דבר אוחזה. היצור שוקע חזרה בעפר כשמלאכתו תמה, והאבן שותקת עד הבוקר.
- id: stone-of-good-luck-(luckstone)
  flavor: >-
    אגט מלוטש בגודל ביצת תרנגולת, פסים של שמנת וחלודה בו כמו שמי ערב מעומעמים. מהמרים ומודדי קרקע נושאים כאלה, ומי ששומר אותו קרוב אומר שהעולם נוטה מעט בחביבות לעברו.
