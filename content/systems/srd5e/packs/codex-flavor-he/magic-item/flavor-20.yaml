- id: shield-of-missile-attraction
  flavor: >-
    מגן מוכה, שצויר עליו מטרה עקומה, והוא מסיט חיצים וליבולים בעקשנות שכמעט נראית להוטה. מי שנושא אותו מגלה עד מהרה שחיצים שכוונו אל חבריו סוטים דווקא אליו. העסקה גרועה, כי הקללה נאחזת בחוזקה עד שטקס טיהור מסיר אותה.
- id: slippers-of-spider-climbing
  flavor: >-
    נעלי עור רכות, תפורות בחוט אפור דק, המאפשרות ללובש ללכת על קירות ועל תקרות בקלות כמו על רצפה. הידיים נשארות פנויות לציוד, לפנס, או לנופף לשומר המבוהל למטה. משטחים חלקלקים מנצחים את הקסם, וריצוף רטוב עדיין יחליק את הלובש.
- id: sovereign-glue
  flavor: >-
    משחה חלבית השמורה בבקבוק מרופד בשמן חלקלק. הדבק קושר שני משטחים בקשר שנכנע רק לממסים הנדירים ביותר. משהתקשה, הוא אוחז חזק, והחלקים נשארים מחוברים לתמיד. נגרים חולמים על צנצנת כזאת מימים ימימה, אבל המחיר אף פעם לא מפתיע לטובה.
- id: spell-scroll
  flavor: >-
    דף קלף מגולגל היטב וחתום בשעווה, ועליו לחש יחיד הכתוב בצופן שרק קורא מיומן יפענח. משנאמרו המילים, הקלף מתפורר לאבק והקסם מתכלה.
- id: spellguard-shield
  flavor: >-
    מגן שנחשל מסגסוגת כהה ונוצצת, אהוב על מי שיריביו מעדיפים להילחם במילים ובקסמי הקסמה. פניו נוצצים כשלחש פוגע בו, וכוונתו של המטיל מתנודדת כאילו האוויר נעשה סירופ.
- id: sphere-of-annihilation
  flavor: >-
    כדור שחור קטן של כלום תלוי באוויר כמו חור שנקדח בבד המציאות. הוא זולל כל מה שנוגע בו ואינו משאיר אחריו דבר מלבד שקט נמוך וזמזום קלוש. שומרים נבונים מאחסנים אותו בתיבות עופרת כבדות ולעולם אינם נותנים לו לשוטט ליד פתח.
- id: staff-of-charming
  flavor: >-
    אפר חיוור וטבעת כסף ליד הראש. את המטה הזה יצר בעל מלאכה שחשב שקסם הוא אמנות. מי שמחזיק בו יכול להוביל קהל אל נדיבות, לפקוד על חיה מבוהלת או לקרוא לשון זרה. כשהקסם מכוון אל נושא המטה, המטה עשוי להחזיר אותו אל מקורו.
- id: staff-of-fire
  flavor: >-
    עץ שחור חרוך ואזוק בטבעות פליז. את המטה יצרו נפחים שרצו משהו שיחמם חדר קר. המחזיק בו יכול לזמן פרץ להבות, כדור בוער או חומת אש. אבל אם משתמשים בו בקלות דעת, המטה עלול לסיים את חייו בנשיפת גחלים.
- id: staff-of-frost
  flavor: >-
    גביש כחול חיוור זורם במטה הזה כמו ורידים קפואים, והעץ שמתחתיו קר מספיק כדי להקפיא כף יד חשופה. המחזיק בו יכול להעלות ערפל סמיך, סופת ברד, חומת קרח או חרוט של קור נושך. טיפול רשלני עלול להמיס את המטה לשלולית מים.
- id: staff-of-healing
  flavor: >-
    מטה מגולף בעץ חיוור ועטוף פשתן נקי, מעשה ידי צמחונים שהאמינו שחבורות צריכות להיעלם מהר. המחזיק בו יכול לזמן קסם מרפא כדי לסגור פצעים, לרפא מחלה או לאחות פגיעות רבות בבת אחת. טיפול רשלני עלול לגרום למטה להיעלם בהבזק בהיר, אבוד לעד.
