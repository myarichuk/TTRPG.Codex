- id: wand-of-magic-missiles
  flavor: >-
    אורך דק של עץ כחול-שחור, ולאורך הגזע שלו משובצים גבישים זעירים, וכל אחד מהם נוצץ כמו כוכב שנלכד. חיצי כוח טהור זינקו מקצהו ורק לעיתים רחוקות מחטיאים, ויד נועזת יותר יכולה לשגר כמה בבת אחת. סוחרים נודדים נשבעים שהחיצים תמיד מוצאים את המטרה.
- id: wand-of-paralysis
  flavor: >-
    שרביט דק מכסף חיוור עם קצה כחלחל קלות, כאילו הוא מחזיק רסיס של שמי חורף. קרן קרה ודקה פורצת ממנו אל יצור אחד שנראה לעין, ואיברי הקורבן מתקשחים כאילו כפור זחל לתוך כל מפרק. רצונות עקשניים מצליחים לפעמים לנער מעליהם את הצינה.
- id: wand-of-polymorph
  flavor: >-
    שרביט שנהב ארוך עם עורקים ירוקים, ומשטחו חרוט בספירלות שנדמה שהן משנות את מקומן כשאיש לא מביט. נושאו יכול לשחרר הבזק של שינוי שהופך יצור אחד למשהו אחר, והתוצאה היא תמיד הימור. הארכיונאים אומרים שיש לשרביט חוש הומור, ושההומור הזה נדיר שהוא אדיב.
- id: wand-of-secrets
  flavor: >-
    שרביט אגוז דק עם קצה מכופף, ושבביו חלקים מרוב אצבעות לחוצות שנגעו בו. כשמפנים אותו אל חדר, הוא מתעוות לעבר הדלת הנסתרת או האבן המשוחררת שאיש לא טרח לבדוק. פורצים, ארכיונאים ושודדי קברים רצו כולם אחד כזה, מסיבות שאינן זקוקות להסבר.
- id: wand-of-the-war-mage
  flavor: >-
    שרביט אשוח פשוט עם טבעת ברזל סמוך לאחיזה, מסוג הכלים שקוסם מנוסה בשטח מחזיק קרוב בקרב קצר. חריצים לאורכו מונים קרבות ישנים, וכל אחד מהם נדמה מייצב את היד שאוחזת בו. ככל שהשרביט משובח יותר, כך הירייה מדויקת יותר.
- id: wand-of-web
  flavor: >-
    שרביט אפור חיוור שחוט משי דק כרוך סביב קצהו, ותמיד מורגשת בו דביקות קלה למגע. נושאו יכול לשחרר ממנו מטח של חוטים דביקים שנפרשים על מטרה וכובלים אותה למקומה. עכבישים היו מקנאים, והצייד הוותיק יודע טוב יותר מלגעת בו.
- id: wand-of-wonder
  flavor: >-
    שרביט עקום מעצים שאינם תואמים, ומשטחו מנוקד בצבע מכל גוון. מה שיקרה כשמפנים אותו הוא הפתעה לכולם, גם למחזיק בו. הפייטנים מתעקשים שיוצרו צחק כל הזמן, ואיש מעולם לא הוכיח אחרת.
- id: weapon
  flavor: >-
    להב כן ועשוי כהלכה, שנוגע בו ברק כסוף קלוש לאורך הלהב שאף אבן משחזת לא העניקה לו. נפחים שמחשלים נשקים כאלה מדברים על גאווה שקטה במתכת, כאילו היא יודעת בדיוק היכן היא אמורה לפגוע.
- id: weapon-of-warning
  flavor: >-
    נשק חייל פשוט מפלדה כנה, ואחיזתו כרוכה בחבל וקשור לראש הידית פעמון קטן מפליז. זקיפי מחנה נשבעים שהוא מעיר חברים ישנים ברגע שהלהבים נשלפים, ושנושאיו תמיד נראים כמי שמכים ראשונים.
- id: well-of-many-worlds
  flavor: >-
    בד שחור ועדין, רך כמשי ומקופל קטן מספיק כדי לדחוס לכיס. כשפורשים אותו על משטח שטוח, הוא נפתח לחלון טבעתי אל עולם אחר, ולאן החלון הזה מוביל איש אינו יודע. מי שמקפל אותו שוב סגור נוטה לראות משהו ששווה לשכוח.
