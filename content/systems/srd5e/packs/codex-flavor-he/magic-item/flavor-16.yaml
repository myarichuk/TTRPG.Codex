- id: potion-of-speed
  flavor: >-
    פסים זהובים וערבול כהה כדיו נסחפים בנוזל הצהוב הזה, כאילו הוא חסר סבלנות לעזוב את הבקבוק. השותים מדווחים על זריזות פתאומית שאינה משאירה אחריה עייפות כבדה כשהיא דועכת. שליחים מעיירות הנהר עדיין שומרים בקבוקון בהישג יד להודעות שחייבות להגיע לפני הגשם.
- id: potion-of-water-breathing
  flavor: >-
    נוזל ירוק ועכור, שריחו מלח וקצף ים, מחזיק בועה חיוורת שמתנהלת לאט במרכזו. מלחים שלוגמים ממנו מגלים שריאותיהם משנות בשקט את הרגליהן, וכך המים הפתוחים מרגישים כמו חדר מסביר פנים. רוב הדייגים משאירים את הבקבוק סתום בכל זאת, כי לבועה יש הרגל להיתקע בזכוכית.
- id: potions-of-healing
  flavor: >-
    נוזל אדום נוצץ בכל פעם שמנערים את הבקבוק, וגוון הזכוכית רומז כמה חזק התכשיר. מכשפי גדר ורוקחים שעל אם הדרך מוכרים את הסוגים הפשוטים, ואילו היבולים העשירים ביותר נשארים נעולים במכללות הוותיקות. תהא עוצמתו אשר תהא, המשקה גורם לשותה להרגיש כאילו יד חמה ייצבה אותו.
- id: ring-of-animal-influence
  flavor: >-
    טבעת ארד שזוף עוטפת אבן ענבר חלקה שנושאת ריח של חציר ופרווה רטובה. צדי חיות ורועים שעונדים אותה מגלים שזאבים, נצים ושוורים עקשנים מקשיבים קצת יותר בקשב. מאגר הכוח הקטן שלה מתמלא מחדש באור הבוקר.
- id: ring-of-djinni-summoning
  flavor: >-
    כסף עמום עוטף אבן כחולה מעושנת שנדמה כאילו היא מזמזמת כשהעונד חושב על טובה. רוח אוויר עונה לקריאה ועומדת במקום פנוי שבחר מזמנה, ומשתחווה כסוחר ותיק. היא נשארת רק כל עוד מזמנה שומר על ריכוזו יציב.
- id: ring-of-elemental-command
  flavor: >-
    כל טבעת קשורה לאחד מארבעת כוחות הקדמון, והאבן שלה מראה את מצב רוחו של הכוח בצבע. אבני אדמה בצבע אוכרה חיוור, זכוכית ים ירוקה-אפורה, וטבעות להבה זוהרות בענבר חסר מנוחה. יצורים העשויים מהכוחות האלה נעשים זהירים מכל מי שעונד אחת.
- id: ring-of-evasion
  flavor: >-
    טבעת דקה מפלדה מושחרת חרוטה בקשקשים זעירים חופפים, כאילו נחש קפא באמצע זחילה. אקרובטים, גנבים וקשתים מעריכים אותה בשל האינסטינקט המהיר שהיא מעניקה, התחושה שרשת נופלת או פיצוץ להבות פתאומי הם איטיים מעט מדי. מאגר המזל שלה מתמלא מחדש באור הבוקר.
- id: ring-of-feather-falling
  flavor: >-
    טבעת אפורה חיוורת ממתכת קלה נושאת נוצה לבנה בודדת המשובצת בחישוק, כאילו ציפור השילה אותה באמצע מעוף. מטפסים, מצלצלי פעמונים ושומרי מגדלים נשבעים באחיזתה הרכה באוויר, שמניחה לנפילה ארוכה להתפרש לירידה איטית ונסחפת. יש עונדים האומרים שבנדודיהם מעולם לא נחתו בקשיחות.
- id: ring-of-free-action
  flavor: >-
    טבעת ברזל מלוטש עם אבן שקופה בגוון זהוב קלוש יושבת על האצבע כמו שמש קטנה שלעולם אינה שוקעת. צוותי רציף, מתאבקים ומלחים במים סוערים מעדיפים אותה, כי בוץ, קורים וקסם נצמד מאבדים את אחיזתם בתנועותיו של העונד. האבן עדיין חמה כשלחש אכזרי מנסה לכבול אותם.
- id: ring-of-invisibility
  flavor: >-
    גביש אפור-עשן יוצר את הטבעת הזו, שמזמזמת בשקט ושחלל מרכזה נראה כבולע את האור הסמוך. מרגלים, פורצים ומרפאים נודדים מעריכים אותה מימים ימימה על כך שהיא מחליקה את העונד מהעין. רובם אומרים שהחלק הקשה ביותר הוא לזכור היכן הניחו את המגפיים שלהם.
