- id: mantle-of-spell-resistance
  flavor: >-
    הגלימה ארוגה מצמר אפור כבד, ונדמה שהיא סופגת ניצוצות וניצנוצים תועים לפני שיגיעו ללובשה. חייטים שתפרו אותה מתארים את הבטנה כקרירה למגע, גם ליד כבשן בוער. הלובשים אומרים שהבד גורם להם להרגיש יציבים יותר בקרבת קסם מוזר.
- id: manual-of-bodily-health
  flavor: >-
    הכרך הדק הזה כרוך בעור רך ומלא בעצות הגיוניות על אוכל, מנוחה ומתיחות. דפיו טעונים בקסם שקט המתגמל קריאה קפדנית, והקורא יוצא ממנה חסון יותר באופן ניכר. משנלמדו לקחיו, הספר מחשיך ומתעמעם לתקופה ארוכה.
- id: manual-of-gainful-exercise
  flavor: >-
    ספר עבה בכריכת בד, עם איורים של הרמה, גרירה וטיפוס, ושוליו גדושים בהערות קטנות בכתב יד נחפז. מילותיו מזמזמות באנרגיה חסרת מנוחה שנדמה כי זורמת אל זרועותיו וכתפיו של הקורא. כשהלקחים נלמדו, הדפים החווירו ושקטו, והספר ממתין לתלמיד להוט הבא.
- id: manual-of-golems
  flavor: >-
    הכרך הזה מחזיק את השרטוטים והלחשים הדרושים להנפשת סוג אחד של משרת אבן או מתכת. המחבר אינו מכנה את הסוג בשמו במפורש, ונדמה שהבחירה שייכת לספר עצמו. רק מטיל לחשים בעל הכשרה רצינית יכול להבין את דפיו, וקוראים מגושמים נענשים בזעזוע כואב של אש מחשבה.
- id: manual-of-quickness-of-action
  flavor: >-
    הספר הדק הזה, כרוך בבד ירוק חיוור, מלא בתרגילי שיווי משקל, שרטוטי עבודת רגליים והערות קטנטנות על רפלקסים. דפיו נושאים קסם קל וזריז שנדמה כי מזמזם בקצות אצבעותיו של כל מי שלומד בהם. אחרי שהלקחים שוקעים, הדפים דוהים לנייר פשוט, אך השוליים המשורבטים נשארים חיים להפתיע.
- id: marvelous-pigments
  flavor: >-
    בתוך קופסת עץ מהודרת מונחות קדרות חימר קטנות של צבע, צמודות למכחול רך. כל מה שנצבע בהן מקבל מוצקות מפתיעה, כך שדלת מצוירת אפשר לפתוח ועץ צבוע יכול לתת צל. התוצאות נוטות להיות יפות, אך הקדרות נוטות להיגמר ברגע הגרוע ביותר.
- id: medallion-of-thoughts
  flavor: >-
    דיסקית כסף על שרשרת דקה, קרירה למגע, מזמזמת בשקט בכל פעם שקוראים לקסמה. נצנוצה חושף את המחשבות העליונות של מוחות סמוכים, כך שאפשר לשמוע בבירור שמועה לחוצה או הבזק פתאומי של ספק. רבים מהעונדים אותה אומרים שהקושי הגדול הוא לשתוק את דעותיהם שלהם.
- id: mirror-of-life-trapping
  flavor: >-
    המראה הגבוהה והצרה הזאת מראה צורות קלושות של יצורים לכל מי שמציץ בה מהצד. מסגרתה מגולפת בגפנים קוצניות, והזכוכית עכורה כמו אדים על חלון קר. קל לשבור אותה, וזה מה שבעלים זהירים מוצאים מנחם, שהרי ניפוצה משחרר את כל מה שנלכד.
- id: mithral-armor
  flavor: >-
    כסוף וקל כנוצה, השריון הזה נלבש מתחת לבגדים רגילים בלי להראות זכר לנפח. הוא נע עם הגוף בחופשיות כמו מעיל צמר טוב, ולעולם אינו מקשקש על המדרגות.
- id: mysterious-deck
  flavor: >-
    קלפי שנהב או קלף, מצוירים בדמויות קטנות ומוזרות, מגיעים בכיס שחוק שריחו קלוש של ארז. נדמה שלכל חפיסה יש דעה משלה על מי מותר לו לשאול אותה שאלות. מגידי עתידות ותחמנים כאחד מתייחסים לקלפים בכבוד הגובל באימה.
