- id: gem-of-seeing
  flavor: >-
    אבן ירקרקה וחיוורת שקצותיה מתעכרים כשמשתמשים בה, כאילו הביטה האבן זמן רב מדי במשהו שאין ביכולתה להכיל. חכמים שמעריכים את הראייה יותר מנוחות נוהגים להניח אחת ליד החלון, ולצפות בצורות שאף עין רגילה לא אמורה להבחין בהן.
- id: giant-slayer
  flavor: >-
    נשק פשוט בעל עבודה טובה, שאיזונו מכוון לרגע שבו יריב גדול בהרבה בא לחפש צרות. מספרי סיפורי גוזמה בעיירות הנהר נשבעים שהנשק הפיל ברוטים בגודל גבעה במכה אחת מכוונת היטב.
- id: glamoured-studded-leather
  flavor: >-
    שריון עור מסומר שיכול ללבוש את התחפושת של המעיל המשובח ביותר של חייט, של סינר גנן או של מעיל הכרוז בחצר המלך. סייירים שחייבים להתגנב בין אורחי משתה בלי שישימו לב מוצאים בתעלול תועלת, אף שהעור אינו שוכח לגמרי את צורתו האמיתית.
- id: gloves-of-missile-snaring
  flavor: >-
    תפורות מעור רך עם כפות מחוזקות, והכפפות האלה עוזרות ללוחם זריז לתפוס חיצים, חיצי יד ופטישוני הטלה באמצע האוויר. קשתים מהמכללות הוותיקות שונאים אותן שנאה עזה, שכן תפיסה בעיתוי מושלם הופכת את מטח הירי הטוב ביותר שלהם לחופן מביך של שבבים.
- id: gloves-of-swimming-and-climbing
  flavor: >-
    כפפות צמודות מבד קנבס משומן, עם קצות אצבעות אוחזים, מסוג מה שמלח או סבל חבלים היה שולף לפני טיפוס ארוך. הלובשים מגלים שצוקים וסלעים שהגאות מכה בהם פתאום נראים פחות מאיימים, וכמה מהם חזרו הביתה בשחייה עם חיוך על הפנים.
- id: goggles-of-night
  flavor: >-
    עדשות עבות מעושנות במסגרת מסומרת, מסוג המשקפיים ששומר לילה או מצייר מפות של מערות חשוכות מחזיק בכיס המעיל. חוקרי מערות נשבעים שהעדשות מאפשרות להם לקרוא פנים בחשכה, וקומץ ערמומי טוען שהן גם עוזרות לזהות שקרים בפונדקים המוארים בנרות.
- id: hammer-of-thunderbolts
  flavor: >-
    פטיש מלחמה כבד שראשו כאגרוף קמוץ של ברזל כהה, וידיתו עטופה בעור שריחו קלוש של אוזון אחרי כל סערה. קוראי סערות מחופי הים לוחשים את שמו, שכן מכה שנזרקת בו יכולה לגרום לעמק שלם להידהד כמו פעמון שהוכה.
- id: handy-haversack
  flavor: >-
    תרמיל קנבס חזק עם כיס מרכזי רחב ושני כיסי צד, וכולם עמוקים מבפנים הרבה יותר ממה שהחוץ מרמז. סוחרים ונוודים אוהבים לגלות שהחפץ העליון הוא תמיד זה שאליו הם מושיטים יד, אף שכמה ותיקים מתלוננים שלתרמיל יש סודות משלו.
- id: hat-of-disguise
  flavor: >-
    כובע לבד חום עם סרט צר של חבל קלוע, מסוג הדברים שמשחקן נודד מרים לקהל לפני שהוא חומק לתוך פנים חדשות. רכלנים בעיירות הנהר אומרים שיש לכובע כישרון להפוך זר למישהו שאינו הזר, וזה בדיוק העניין.
- id: headband-of-intellect
  flavor: >-
    סרט דק של כסף חיוור ובו אבן כהה אחת, קריר למגע ומזמזם קלות כמו כוס שהוכתה. חכמים מהמכללות הוותיקות עונדים אותו בבחינות, וכמה מהם מתעקשים שלמתכת יש דעה על אילו ספרים ראויים להיקרא.
