- id: eyes-of-charming
  flavor: >-
    זוג עדשות גביש שיושבות על העיניים וזמזמו קלות כשהן לוכדות את האור. מי שעונד אותן מגלה שחיוכו נעשה משכנע באופן מוזר, והעדשות יודעות להתעתע בדעתו של אחר עד שתשרור בה ערפל ידידותי, אך כוחן שב אליהן רק עם עלות השחר.
- id: eyes-of-minute-seeing
  flavor: >-
    עדשות גביש שנחתכו לעבודה מדויקת מקרוב, ומאפשרות לעונד לראות את השריטה הקטנה ביותר או את התפר הדק ביותר כאילו הוא מציץ דרך זכוכית מגדלת. חכמי המכללות הישנות וגם מזייפים זהירים מעריכים אותן, שהרי שום דבר קטן אינו יכול להסתתר מעיניים חדות כאלה.
- id: eyes-of-the-eagle
  flavor: >-
    עדשות גביש שמחדדות את ראיית העונד עד שפרטים רחוקים בולטים בבהירות כמו קרובים. שומרים וציידים נשבעים בהן, שכן אפילו גרגר על קו האופק הרחוק נעשה צורה קריאה כשמביטים בו דרך זכוכית משובחת כזאת.
- id: feather-token
  flavor: >-
    נוצה בודדת, קלה כמו אנחה, שהופכת למשהו נשגב ברגע שזורקים או נוגעים בה. סוגיה נעים מעוגן קטן לספינה ועד שוט מרחף, ומלומדי המלאכה נוהגים להתבדח שהנוצה היא החלק הקטן ביותר בתעלול.
- id: figurine-of-wondrous-power
  flavor: >-
    פסלון מגולף קטן שמתעורר לחיים בדמות חיה, אם אריה, אם סוס ואם משהו מוזר יותר, ואחר כך חוזר לצורתו השקטה. נדמה שכל פסלון זוכר את הצאתו האחרונה, ומקמץ פנים זמן מה עד שהוא מוכן להיקרא שוב.
- id: flame-tongue
  flavor: >-
    להב שנטבל בידי נפחים שהשאירו את כבשניהם בוערים לאורך כל חורף. כשמילה שקטה נאמרת מעל ידיתו, להבה מטפסת על הפלדה כמו קיסוס, והאוויר מריח מאפר חם. מכשפי השדות עדיין מתווכחים אם האש הזאת רעבה או סתם להוטה.
- id: folding-boat
  flavor: >-
    קופסת אורן קטנה, קלה דיה להכניסה מתחת לזרוע, שנפתחת לסירה כשאומרים את המילים הנכונות. אנשי הנהרות נושאים אותן במעילים ונשבעים שהעץ זוכר כל אגם שצף עליו. קיפול הסירה בחזרה דורש זהירות, כי הסירה אינה עדינה בעניין הזה.
- id: frost-brand
  flavor: >-
    חרב שלהבה נראה כחצוב מאגם חורפי, וחודה מכוסה ערפל כפור גם בערבי הקיץ החמים ביותר. מדליקי האש במכללות הישנות מעריכים פלדה כזאת על שהיא מקפיאה את היעד עד לשד עצמותיו ומרחיקה את הלהבה מנושאה.
- id: gauntlets-of-ogre-power
  flavor: >-
    כפפות ברזל כבדות עם פרקי אצבעות כאבני נחל, שנבנו לאחיזה שיכולה לכופף פרסת סוס לצמיד. הנפחים שיצרו אותן אמרו שהמתכת זוכרת את שרירי הענק הראשון שלבש אותן, ורוב הסבלים עדיין מאמינים בכך.
- id: gem-of-brightness
  flavor: >-
    פריזמה מלוטשת של גביש צלול, חתוכה כך שהאור נראה כאילו מתקבץ בתוכה וממתין לרשות לצאת. מדליקי פנסים ושחקני במה מהמכללות הישנות חשקו בה מזמן, אף שהאבן אינה מחווירה לעולם, ויהא הדרוש ממנה כל שיהיה.
