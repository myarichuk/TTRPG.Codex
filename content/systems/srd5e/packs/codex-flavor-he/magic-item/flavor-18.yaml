- id: ring-of-the-ram
  flavor: >-
    ברונזה מוקצעת בפטיש מתעקלת בטבעת הזאת לראש איל, שנראה כבוהה בעקשנות ובנחישות בכל מה שניצב מולו. עונדי הטבעת הם בעיקר אנשי עיירות הגבול ומחנות הכרייה, כי מכת כוח רפאים מסוגלת להעיף יריב מעל רגליו.
- id: ring-of-three-wishes
  flavor: >-
    שלוש אבנים חיוורות קטנות יושבות בטבעת של זהב כבד, כל אחת זוהרת קלות וחלקה מרוב אגודלים של בעליה הקודמים. מלכים וסוחרים נלחמו עליה, והזהירים שומרים מרחק, כי הם יודעים שאחרי האבן האחרונה נשאר רק מתכת פשוטה.
- id: ring-of-warmth
  flavor: >-
    טבעת נחושת דקה אוחזת באבן ענבר שנשארת חמימה למגע גם בשלג מר. מדריכי הצפון ומלחים בחופים קפואים מעריכים אותה, כי קור החורף כמו קופץ מעל העונד אותה. מה שלא יעשה כפור קשה לאצבעות המטייל, הטבעת שומרת את החום קרוב ואטום.
- id: ring-of-water-walking
  flavor: >-
    מתכת חיוורת בגוון כסף וכחול יוצרת את הטבעת הזאת, ועל פניה מגולף גל זעיר. מעבורנים, קוצרי קנים ושליחי נהר משתמשים בה כדי לחצות ביצות ושדות מוצפים בלי להרטיב את המגפיים. נדמה שהגל מתרומם מעט בכל פעם שהעונד פוסע על בריכה נוצצת.
- id: ring-of-x-ray-vision
  flavor: >-
    טבעת פליז כהה מסגרת גביש חיוור בצורת עדשה, שכמו מציץ דרך כל מה שמונח לפניו. מפקחים, מנעולנים וחוקרים סקרנים אוהבים איך קירות הופכים לזכוכית, אבל הם לומדים שעופרת עבה ואבן כבדה עדיין חוסמות את המבט. כל שימוש מותיר את העיניים מעט מתוחות, ולכן עונדים חכמים נחים אחרי כל הצצה.
- id: robe-of-eyes
  flavor: >-
    אורגים במכללות העתיקות של חוף שטבע שזרו עיניים מצוירות בחלוק הזה, מתוך אמונה שבד צריך לשמור על העונד אותו. העפעפיים כמו ממצמצים מול צללים חולפים, ושום לחישה לא חומקת מתשומת לב. סנוור חזק והבזקים פתאומיים גורמים לעיניים המצוירות להעצים את עצמן, והעונד נשאר מסונוור ומתלונן עד שהצריבה חולפת.
- id: robe-of-scintillating-colors
  flavor: >-
    צבענים שערבבו חיפושיות כתושות ואבקות מינרלים יצרו את החלוק הזה, שמחזיק את צבעיו ברצועות משתנות. כשהעונד מחליט, הבד מתלקח בדוגמה מסנוורת שמבהילה צופים ומקלקלת את הכוונה של תוקפים. מי שנועץ מבט בלהבה עלול למצוא את רגליו הופכות לג׳לי מתנודד עד שהזוהר דועך.
- id: robe-of-stars
  flavor: >-
    חייטי שמי הלילה בעיר נמל רחוקה תפרו את החלוק הזה מבד כחול כהה זרוע כסף. שישה כוכבים גדולים יותר בחזית העליונה אפשר לקטוף ולבזבז כקרני כוח נוצצות, והמקומות הריקים מתמלאים כשהערב יורד. העונד יכול גם להחליק אל ממלכה מעורפלת מוארת כוכבים עם כל מה שהוא נושא.
- id: robe-of-the-archmagi
  flavor: >-
    בד שאף נול רגיל לא היה מסוגל לארוג נחתך כדי ליצור את הבגד הזה, ועליו רונים שזמזמים קלות תחת האצבעות. לחשים מחליקים מעל העונד כמו גשם מצמר משומן, וכל לחש שמוטל דרך חוטיו נעשה חד יותר. מכשפי שדה היו מוכנים לתת הרבה בעבור חוט אחד, אך המכללות העתיקות מזהירות שפאר כזה מושך עיניים קנאיות.
- id: robe-of-useful-items
  flavor: >-
    מתקן עם חוש הומור טלא את החלוק הזה, ועליו שאריות בד צבעוניות שנפרמות לחפצים אמיתיים: פנס, פגיון, מראה, מוט, חבל, שק, ודברים מוזרים יותר. כשהטלאי האחרון נתלש, החלוק הופך לבגד רגיל, וממתין ליריד הבא.
