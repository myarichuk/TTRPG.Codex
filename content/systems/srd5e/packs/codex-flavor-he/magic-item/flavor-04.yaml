- id: brooch-of-shielding
  flavor: >-
    סיכת כסף סגלגלה ועליה אבן אפורה עמומה שנדמה כי היא שותה את האור. הלובשים אותה מתארים דממה קלה שיורדת עליהם, כאילו האוויר התעבה והפך לזכוכית בלתי נראית. חוקרים במכללות הישנות אומרים שהיא נוצרה כדי להסיט מכות קהות וניצוצות תועים מסוימים של כישוף.
- id: broom-of-flying
  flavor: >-
    מטאטא פשוט מעץ מילה חיוור, שמתנהג כמו כל כלי בית עד שמישהו פושק רגליים מעליו ומצווה עליו לעלות לשמים. אנשי הנהר מספרים על מטאטאים שחמקו מבעליהם ועפו הביתה אל דלת המטבח, במבט פגוע במקצת. הידית שלו מזמזמת חרישית כשהוא נשלח להביא משהו מקרוב.
- id: candle-of-invocation
  flavor: >-
    נר חלב גבוה, שהשעווה שלו משויטת בזהב ובאפר, ומאיר את החדר ומחדד כל שכל בתוך זוהרו. שומרי המנורות של המכללות הישנות אומרים שנר דלוק מוסיף בהירות לתפילה וללימוד מהיר כאחד. יש שמדליקים אחד פעם אחת בלבד, ופותחים בו דלת אל מרחב רחוק במקום זוהר חמים.
- id: cape-of-the-mountebank
  flavor: >-
    שכמייה כהה שמדיפה ריח קלוש של גופרית ושל מטבעות ישנים, אהובה על בדרנים נודדים שנעלמים באמצע המופע. לובשה יכול לחמוק ממקום למקום כהרף עין, וקווצת עשן אפור נשארת במקום שבו עמד. מכשפי הפרא מזהירים שהבד זוכר כל תעלול שעזר להסתיר אי פעם.
- id: carpet-of-flying
  flavor: >-
    שטיח ארוג בארגמן וזהב דהויים, וציציותיו נגררות כזנבות של חתולים סבלניים. משנאמרה פקודה והשטיח זוכה לנוסע שהוא סומך עליו, הוא מתרומם בחלקות ועוקב אחר הוראות מי שיושב עליו. סוחרי עיירות הנהר מעריכים את הישנים שבהם, שחוצים עמקים רחבים בלי טרחת הדרכים.
- id: censer-of-controlling-air-elementals
  flavor: >-
    מחתת פליז עם מכסה מחוטי תיל מעוקלים, שדרכו מסתלסלים חוטי קטורת דקים בדוגמאות שאף רוח לא הייתה יוצרת. כשמנענעים אותה בעדינות, העשן מתאסף לדמות של אוויר שמדברת בשריקות רכות ומקבלת פקודות ממזמנה. כוהנים מסוג מסוים אינם אוהבים אותה, ובכל זאת הם סקרנים.
- id: chime-of-opening
  flavor: >-
    צינור מתכת דק וחלול שמצלצל בצליל צלול ובהיר כשמקישים עליו, מסוג הצלילים שמנעולים ובריחים כמו חוששים מפניו. לגנבים נודדים ולמסגרים ממולחים יש סיפורים על שירו שנישא לאורך עמק שלם. הוא נסדק אחרי מספיק הקשות, ונשאר ממנו רק קונכייה שקטה ומקומטת.
- id: circlet-of-blasting
  flavor: >-
    עטרה צרה מארד מושחר ובמצחה אבן גרנט אדומה אחת, מסוג הדברים שכושף מתבלט היה עונד לסעודה. האבן שלה מהבהבת כשניצוץ של אש מוכן לזנק. רבים למדו לשמור על רוח רגועה ליד כל מי שעונד אותה.
- id: cloak-of-arachnida
  flavor: >-
    לבוש מעודן שחור ושזור כסף, שנוצץ כטל על קורי עכביש. אומרים שעכבישי היערות הגבוהים טוו את החוט הראשון, והגלימה עדיין נעה בחן סבלני ונצמד. לובשה הולך על קירות ועל תקרות, ורשתות דביקות כמו נפתחות לפניו כווילונות.
- id: cloak-of-displacement
  flavor: >-
    גלימה נוצצת בכחול עמוק, שנדמה שהיא מחליפה את צבעיה בכל פעם שהאור משתנה. הלובשים אותה מתארים עצמי שני שעומד צעד קצר הצידה, תאום רפאים שסופג את המכות המיועדות להם. הבגד נעשה דומם ורגיל ברגע שלובשו נפגע.
