- id: sun-blade
  flavor: >-
    ידית פליז פשוטה וחסרת חן, שנהפכת ללהב של אור לקריאת אוחזה. האור בהיר ונקי, אבל המתים חסרי המנוחה מוצאים את מגעו צורב. הנושאים אותה אומרים שהיא מזמזמת חרש כשהשחר עולה מעל שדה קרב.
- id: sword-of-life-stealing
  flavor: >-
    להב חד מפלדה כהה, ובחריץ שלו חוט אור אדום, כאילו הוא שותה בעודו חותך. בפגיעה מושלמת הוא קורע חיים מאויב חי ועוטף את האוחז בו בחמימות חולפת. נפחי עם הנהר אומרים שהלהב לעולם אינו שבע, ולא ישחיזו אותו בנוכחות אחרים.
- id: sword-of-sharpness
  flavor: >-
    הלהב הבוהק והרעב הזה כאילו יודע בדיוק היכן האבן נכנעת והיכן השריון נפרד. מול חפצים חודו אינו מחמיץ לנגוס, ומהלומה מושלמת משאירה את האויב עייף ואיטי להתאושש.
- id: sword-of-wounding
  flavor: >-
    חרב קודרת שפצעיה מסרבים להיסגר בנקיות, וחודה כהה בברק סגול כחבורה. מי שנפגע ממנה חש צמרמורת עמוקה שמשתקעת פנימה ונשארת, ולזמן מה הוא אינו מסוגל להחלים. הצמרמורת דועכת רק לאט, והנפגע יכול להתנער ממנה בכל מאמץ עקשני.
- id: talisman-of-pure-good
  flavor: >-
    דיסקית של זהב חיוור, מלוטשת בידיים זהירות אלף פעמים, ועליה שמש פשוטה בתבליט. יצורי רקבון וגופרית שנוגעים בה חשים את עורם נחרך באור לבן ונקי. שומריה אומרים שהיא נענית רק ללב יציב, ושהיא מתלקחת בעוצמה רבה יותר בידי מי שכוונתו טובה.
- id: talisman-of-the-sphere
  flavor: >-
    טליסמן דק מברזל שחור, משובץ כתב כסף באלפבית שאיש כבר אינו קורא. העונדים אותו מנווטים חלל ריק קטן ורעב ביציבות מופלאה, כאילו היה חיית מחמד על רצועת משי. חכמים נשבעים שהחלל נוטה אל מחשבות בעליו, אף שעדיין איש לא ביקש ממנו יפה.
- id: talisman-of-ultimate-evil
  flavor: >-
    מדליון אכזרי מארד קר, ופניו עשן נסחף, והוא מייצג את הנקמנות בצורתה הטהורה ביותר. ידיים חיות שאוחזות בו זמן רב מדי חשות את חמימותן מתנקזת. עונדיו טוענים שהוא כבד יותר ככל שמחזיקים בו זמן רב יותר, וזה אולי הדבר הכן ביותר בו.
- id: tome-of-clear-thought
  flavor: >-
    דפיו מלאים בתרשימי חידות, משחקי זיכרון וטורים מסודרים של היגיון, בדיו כחול קריר ויציב. מי שלומד אותו היטב זמן ממושך מוצא את מחשבתו חדה יותר, ומוחו הופך לפתע מסודר כספרייה. משהשיעור נקלט, הספר משתתק ומתעמעם, ודיו נרדם לדורות.
- id: tome-of-leadership-and-influence
  flavor: >-
    כרוך בעור בצבע שמנת עם פינות מוזהבות, והכרך הזה נקרא כמכתב ארוך של מדינאי חד לשון. קטעיו על דיבור, יציבה ולחיצות ידיים גורמים לקולו של הקורא להישמע רחוק יותר ולברכתו להתקבל בחום. פקידי חצר בערים הוותיקות שומרים עותקים תחת מפתח, פן ילמד כל אדון קטן את התכסיס.
- id: tome-of-understanding
  flavor: >-
    כרך דק מאריג אפור יונה, שוליו עמוסים בסקיצות של ידיים, עיניים ופנים שקטות. קוראים שעוברים על תרגיליו מתחילים להבחין ברעד בקול ובשקר שמאחורי חיוך. הנזירים הזקנים שכתבו אותו אומרים שחוכמה אינה אלא קשב סבלני, והספר רק מתעקש על תרגול.
