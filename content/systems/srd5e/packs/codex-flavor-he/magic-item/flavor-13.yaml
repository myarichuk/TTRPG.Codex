- id: necklace-of-adaptation
  flavor: >-
    שרשרת פשוטה של חוליות נחושת מרוקעות מחזיקה חרוז חלק שמרגיש חמים במעט למגע. נדמה שאוויר מצחין ועשן סמיך נפרדים מפני העונד, ורעל מר מאבד חלק גדול מנשיכתו. רופאי שדה וקרטוגרפים כאחד נשאו קמעות כאלה אל ביצות ומכרות.
- id: necklace-of-fireballs
  flavor: >-
    רצועת עור כהה ועליה חרוזים מבריקים בגוון אדום-חום, כל אחד חמים במעט ומדיף ריח גופרית. כדאי לנתק חרוז בזהירות, כי ברגע שהוא נוחת הוא מתפרץ בלהבה מתגלגלת. חיילים והמרים כאחד מעריצים אותה, אך אף אחד מהם לא מצליח להחליט אם היא נשק או בדיחה.
- id: necklace-of-prayer-beads
  flavor: >-
    שרשרת של אבנים מלוטשות משלבת חרוזים פשוטים של ענבר וקוורץ, וכמה מהאבנים זוהרות קלות לעין קשובה. כל חרוז זוהר מחזיק חסד שאפשר לשחרר כשלוחצים על חרוז עונד בשעת צרה. שאר השרשרת היא תכשיט נעים, וזה חלק מקסמה.
- id: nine-lives-stealer
  flavor: >-
    חרב בעלת להב כהה וידית עטופה עור סדוק, המזמזמת בלהיטות קודרת בקרב. מי שנשא אותה מתארים משיכה חדה וקרה בכל פעם שמכה נקייה נוחתת. יש הקוראים לה גנבת חיים, וזה דבר לא נעים לומר על להב.
- id: oathbow
  flavor: >-
    קשת מעץ מילה חיוור עם מיתר שזור חוט כסף, ולחישה רכה עולה מהעץ בכל פעם שחץ מונח במקומו. היורה בה רשאי לבחור אויב מסוים אחד, והקשת שרה בחדות רבה יותר כשהוא מתקרב. סיפורי הציידים מזהירים שקשה להניח איבה שעל מיתר.
- id: oil-of-etherealness
  flavor: >-
    חרוזים אפורים ועכורים נאחזים בצדו הפנימי של הבקבוקון הזה ונעלמים כמעט ברגע שנוצרו. מי שפותח אותו מוצא את האוויר מדיף ריח קלוש של גשם שלא ירד, כאילו היצור הנמשח כבר החל להחליק החוצה מהחדר.
- id: oil-of-sharpness
  flavor: >-
    שבבי כסף זעירים נסחפים בג׳לי הצלול הזה כמו כפור בבריכה דוממת. נפחי המכללות הישנות אומרים שמריחה חלקה אחת ממנו מחדדת להב פשוט עד שיוכל לפצל שערה הנסחפת ברוח.
- id: oil-of-slipperiness
  flavor: >-
    המשחה השחורה והכבדה הזאת נשפכת לאט ואז רצה במהירות, כאילו נזכרה במקום שבו רצתה להיות. כשהיא נשפכת על רצפת אבן היא הופכת את הלוחות למלכודת שצוחקת על הנמהרים, וגם מגף רשלני לא ימצא אחיזה.
- id: pearl-of-power
  flavor: >-
    פנינה בצבע חלב ישן, חמימה מעט למגע, מזמזמת בשקט כשמחזיקים אותה קרוב. שומריה אומרים שהזוהר דועך כשהבעלים אוספים אל הנפש ניצוצות למדנות שהוצאו, הלוואה איטית מן המחר.
- id: periapt-of-health
  flavor: >-
    תליון מאבן ירקרקה חיוורת עטוף חוט נחושת דק, חם על העור ומדיף קלות ריח נענע כתושה. מרפאי בני הנהר תולים אותו על ילדים שמשוטטים קרוב מדי לביצה, כאילו קצת צבע יכול לגרש מחלה.
