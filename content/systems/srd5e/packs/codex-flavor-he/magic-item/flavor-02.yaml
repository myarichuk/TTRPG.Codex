- id: armor-of-resistance
  flavor: >-
    לכל שריון מהסוג הזה יש חולשה שקטה לסוג אחד של פגיעה, והאומנים הקדמונים מעולם לא הסכימו איך הוא בוחר. יש אומרים שהוא מקשיב למזג האוויר. אחרים אומרים שהשריון פשוט לובש את צורת הסכנה שהלובש שלו צפוי לפגוש בדרך.
- id: armor-of-vulnerability
  flavor: >-
    לשריון הזה משקל נעים וגימור יפהפה, וזו בדיוק הבעיה בו. יוצרו התכוון אותו כמלכודת לחמדנים, והקללה מתגלה רק לחכם שיש בידו הלחש הנכון. קונים נבונים מבקשים מכהן מסוים לבדוק אותו לפני שהם לוקחים אותו הביתה.
- id: arrow-catching-shield
  flavor: >-
    קשתים שונאים את המגן הזה, והשנאה הדדית. פניו חרוצים בחריצים רדודים שנדמה כי מושכים אליהם חיצים תועים, וכך חבר שעומד קרוב נשאר מחוץ לסכנה. חיילים ותיקים קוראים לו שכן טוב לפינות המסוכנות של הקרב.
- id: bag-of-beans
  flavor: >-
    רוכלים בשוק שברובע הנהר נשבעים שהשק הזה הוא ההימור הטוב ביותר שעשו אי פעם. נטע גרעין אחד, והאדמה אולי תשיב במזרקה, בעץ כבד מפרי, או במשהו הרבה פחות מנומס. אם תשפוך את כולם בלי זהירות, השעועית תתפוצץ ותצרוב את כל הסובבים, כולל בעל השק.
- id: bag-of-devouring
  flavor: >-
    השק הזה נראה כמו ארנק יפה והגיוני, ובדיוק משום כך ידיים רשלניות מוצאות את עצמן בתוכו. משהו רעב יושב מאחורי התפרים ולוקח כל מה שנופל פנימה בלי שמץ של תודה. סוחרי גרוטאות שמוצאים שק כזה נוטים למכור אותו מהר, בדרך כלל למי שלא שמע את הסיפורים.
- id: bag-of-holding
  flavor: >-
    סבלים ואורזים אוהבים את השק הזה כי הוא בולע כלי עבודה של בית שלם ועדיין קל כמו כיכר לחם. הפנים שלו רחבים בהרבה מהחוץ, תעלומה שבתי המלאכה הקדמונים מעולם לא הצליחו להסביר. קרע את התפרים או העמס על הרצועה, והתכולה נשפכת אל אי-שם כסוף ומנוקד כוכבים.
- id: bag-of-tricks
  flavor: >-
    להטוטנים נודדים מוכרים את שקי הבד האלה זה דורות, וכל אחד מהם מסתיר הפתעה קטנה ופרוותית. ציצת פרווה שנזרקת נוחתת ופורחת ליצור שממלא את רמזי בעליו, אך תמיד שומר לעצמו קצת מעצבנותו. כל שק מתיישן אחרי קומץ זריקות ומשאיר אחריו ריח חמצמץ קלוש.
- id: bead-of-force
  flavor: >-
    חלק כאבן נחל ושחור כלילת חורף, הכדור הקטן הזה מחזיק בתוך קליפתו פרץ לחץ סודי. כשזורקים אותו אל תוך המון, הוא פורח לכיפה שקופה שלוכדת את מי שלא הספיק לצאת מהדרך. הכיפה נשארת במקומה זמן מה ומאפשרת לאוויר לעבור, אך לא לשום דבר אחר.
- id: belt-of-dwarvenkind
  flavor: >-
    בני האבן בעמקים הגבוהים מעבירים את החגורות האלה בירושה, אף על פי שכמה מהן נדדו אל העולם הרחב. הלובש מוצא עד מהרה את לשון ההרים העתיקה על שפתיו, וגאווה עיקשת וחסונה מתיישבת בעצמותיו. מי שנולד במקום אחר מקבל גם ראייה חדה במנהרות עמומות וכישרון מפתיע להתעלם מרעל.
- id: belt-of-giant-strength
  flavor: >-
    ענקים עונדים את החגורות האלה כמו אבנטים גאים, וכל אבזם חצוב בגודל של צלחת ארוחת ערב. כל שבט מעדיף תפירה ומתכת משלו, והכוח שכל חגורה מעניקה כמו עולה עם גאוותו של הלובש. אנשים קטנים שמהדקים אחת מהן מוצאים שהעולם נוטה לטובתם, ואז מוזר איך הוא כבד כשהיא יורדת.
