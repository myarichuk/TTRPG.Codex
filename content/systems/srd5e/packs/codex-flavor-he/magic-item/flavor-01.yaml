- id: adamantine-armor
  flavor: >-
    נפחים שמעבדים אדמנטיום טוענים שהמתכת זוכרת כל מכה שהדפה. השריון הזה נושא את הזיכרון העיקש הזה בלוחותיו, ולכן מהלומה נקייה וקטלנית, שהייתה מוצאת סדק, נוחתת בו כמו דפיקה רגילה. הלובשים אומרים שהוא נשמע כמו פעמון שמסרב לצלצל כהלכה.
- id: ammunition
  flavor: >-
    קשתים שעוסקים בהקסמה מסמנים לרוב כל חץ בסמל זעיר, לטובת הקונים. הקסם נמוג ברגע שהחץ מוצא את מטרתו, ומשאיר אחריו שבב עץ מרוסק וסיפור לספר. עשרה כאלה עולים בערך כמו בקבוקון קטן של מזל.
- id: ammunition-of-slaying
  flavor: >-
    אשפת חצים כאלה מזמזם חרש בכל פעם שיצור מהסוג הלא נכון קרוב, כאילו הקנים זוכרים קצת טינה ישנה. ציידים מספרים על חץ בודד שהפיל חיה או טיטאן בעל עור אבן. מרגע שראש הברזל מצא את מטרתו, הקנה נעשה עמום ורגיל.
- id: amulet-of-health
  flavor: >-
    התליון הזה מגולף מחתיכה אחת של ירקן כהה, והוא חמים למגע. מרפאים שעונדים אחד מהם אומרים שגופם כאילו מחזיק מעמד קצת יותר, השרירים יציבים יותר והנשימה עמוקה יותר. יש החושדים שהאבן פשוט זוכרת לב נמרץ ומזכירה אותו לעונד.
- id: amulet-of-proof-against-detection-and-location
  flavor: >-
    חכמי הנסתר תפרו את הקמע הזה ממשי אפור ומפיסת זכוכית מכסיפה. מי שמחפש את העונד במראות, בסימנים או בהאזנה מרחוק מוצא רק חדר ריק. העונד עדיין יכול לבחור לפתוח את הדלת כשחבר נאמן דופק בה.
- id: amulet-of-the-planes
  flavor: >-
    קרטוגרפים של ממלכות רחוקות נשבעים בתליון הזה, שמזמזם כמו מזלג כוונון בכל פעם שהעונד חושב על מקום מרוחק. לעבור דרך הסדק בין העולמות לא נעשה בצורה מסודרת, וגורל גרוע יכול לפזר קהל שלם על פני שמיים לא מוכרים. נוסעים נבונים קושרים חבל לחגורה.
- id: animated-shield
  flavor: >-
    מגן שרוצה לעוף הוא יצור עצבני, שממהר להתרומם מהזרוע ולרחף לצד בעליו. חרשי השריון שמכינים אותם ממלמלים שהמתכת מעולם לא ממש הסכימה לשכב על מתלה. הוא שב ונאחז בכף היד או על אבני הרחוב כשבעליו מתעייף מהטריק.
- id: apparatus-of-the-crab
  flavor: >-
    החבית הזאת הועלתה מספינה טרופה שאיש לא הצליח לתארך, והיא נראית כחבית כבדה לא יותר, עד שמישהו מוצא את התפס הנסתר. בפנים ממתינה שורת מנופים נוקשים לטייס עם ידיים יציבות וחוש הומור. כשהיא מתעוררת, החבית נפרשת לקונכייה של רגליים וצבתות מפרקיות.
- id: armor
  flavor: >-
    שריון לוחות ושריון טבעות שנושאים הקסמה מהסוג הזה נראים רגילים, עד שלוחם עומד בהם ומרגיש את ההבדל. בתי היציקה מנהלים פנקס איכות לכל חלק, ומסמנים אותו בסדרת רונות קטנות ליד הצווארון. ככל שהרונה משובחת יותר, כך המתכת כאילו פוגשת את המכה באמצע הדרך.
- id: armor-of-invulnerability
  flavor: >-
    חרשי שריון משושלת עתיקה מצפים לפעמים את מלאכתם בסגסוגת צפופה וכהה שמצלצלת כמו גונג שהכו בו. השריון מגן על הלובש מפני מכות של להבים ושל חניתות, וברגע קשה עוטפת אותו בקליפה שאף נשק לא מצליח לחבוט בה. קליפה כזאת נוצרת רק פעם אחת וצריכה לנוח לפני שתיווצר שוב.
