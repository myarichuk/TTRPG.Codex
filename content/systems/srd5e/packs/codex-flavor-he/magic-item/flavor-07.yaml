- id: dust-of-disappearance
  flavor: >-
    קמצוץ חול דק שנעלם מכף היד, וזריקה שלו לאוויר מסתירה מן העין כל מה שנמצא בסביבה. זו מתנה לגנבים ולמי שצריך להחליק מתחת לעין פקוחה, אף שהאפקט דועך ברגע שמישהו פועל בגלוי.
- id: dust-of-dryness
  flavor: >-
    חבילה קטנה של חצץ חיוור שיכולה לאסוף בריכה שלמה לכדור אחד דמוי גולה, שיושב בשקט עד שמישהו מנפץ אותו וחושף שוב את המים. רוחות מים שונאות את החומר הזה בכל לבן, וקמצוץ ממנו יכול לייבש את גופם הרטוב של יסודנים.
- id: dust-of-sneezing-and-choking
  flavor: >-
    אבקה שנראית בדיוק כמו אבק שימושי יותר, עד שמישהו מסתכל מקרוב, ואז כבר מאוחר מדי. הענן שולח את חסרי המזל להתקפי התעטשות והתנשפות, ורק החסונים ביותר או העמידים ביותר בקסם מנערים אותו מעליהם.
- id: dwarven-plate
  flavor: >-
    שריון לוחות שנוצר באולמות העמוקים, בעל תחושה מוצקה ויציבה שכאילו מושכת בכתפיים מול כל דחיפה. חיבורי הפרקים הממולחים שלו מאפשרים ללובש להצמיד עקב לאדמה ולהתנגד לגרירה על פני האבנים בחבל או ברוח פתאומית.
- id: dwarven-thrower
  flavor: >-
    פטיש מלחמה מאוזן לזריקה, שנבנה כדי לעוף בקשת ארוכה ולחזור כמו כלב נאמן. נפחי ההרים העניקו לו מטען כוח זמזום שנועץ את שיניו בעוצמה רבה ביותר בענקים. לא משנה כמה רחוק הוא עף, הוא תמיד חוזר אל כף ידו של בעליו.
- id: efficient-quiver
  flavor: >-
    אשפת עור צרה עם שלושה תאים נסתרים, שכל אחד מהם נמתח הרבה יותר עמוק משהחוץ מרמז. חיצים, כידונים ומטות ארוכים נשלפים בקלות כמו מאשפה רגילה, וזה נוטה לבלבל את האנשים שצריכים לשאת אותה.
- id: efreeti-bottle
  flavor: >-
    בקבוק פליז צבוע עם פקק שאינו נשאר סגור לגמרי, ועשן שמתפתל החוצה בהבזק של אש לא מזיקה. רוח האש שכלואה בפנים נעשית חסרת מנוחה בכל פתיחה, והתוצאות תלויות במידת המזל שחש המספר באותו ערב.
- id: elemental-gem
  flavor: >-
    אבן קטנה מלוטשת שמחזיקה בתוכה גרגיר של מזג אוויר כלוא, ומאירה בצבע היסוד שלה. שברו אותה, ומשרת של אותו יסוד יוצא ממנה, עז ומציית לזמן קצר לפני שיגווע בחזרה אל העולם.
- id: elven-chain
  flavor: >-
    חולצה של חוליות שרשרת דקות, קלה וגמישה, שנארגה בידי אומנים שהאמינו שהשריון צריך לנוע עם הלובש. דוגמת הטבעות שלה נוצצת כסף בצל היער, והתעלול של יוצר החוליות מאפשר אפילו למי שחדש בשריון כבד לנוע כאילו נולד בו.
- id: eversmoking-bottle
  flavor: >-
    בקבוק נמוך ורחב שהפקק שלו, ברגע שהוא נשלף, משחרר ענן עשן סמיך שמתנפח על פני השדה ומסרב להידלל. גנבים ופרשים העריכו אותו מאז ומתמיד, אף שהענן ממשיך לגדול כל עוד הפקק בחוץ, והעשן עיוור באותה מידה כלפי ידיד ואויב.
