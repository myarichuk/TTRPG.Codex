- id: rod-of-absorption
  flavor: >-
    המטה הקצר הזה, שנטבע ממתכת כהה השותה אור, לוכד כישופים נכנסים ובולע את כוחם בלי הד. הלחש עצמו מתבטל, אך עוצמתו ממתינה בפנים לשימוש מאוחר יותר. חכמים ישנים קראו לו אוצר חסכן, אף שמטה מלא מתחיל לזמזם כמו קומקום על האש.
- id: rod-of-alertness
  flavor: >-
    מטה קצר דק מפליז, וראשו גביש זוהר, מעשה ידיהם של שענים שהעריכו מוח חד. הוא מחדד את חושיו של מי שאוחז בו ומזמן עזרים קטנים לבהירות הראייה ולמחשבות נסתרות. נעוץ באדמה, ראשו להט במגן שמייצב את בני הברית וחושף יצורים החבויים באור גלוי.
- id: rod-of-lordly-might
  flavor: >-
    נפח שאהב להשוויץ חישל את המטה הקצר הזה, והוא מתקפל ללהב לוהט, לגרזן, לחנית או לאיל ניגוח. כפתוריו מעירים כל צורה בהבזק, ומכה אחת יכולה להקפיא יריב במקומו או למצוץ את כוחו אל אוחז המטה.
- id: rod-of-rulership
  flavor: >-
    מלכים של שום מקום מסוים הרימו פעם את המטה הקצר והדק הזה וציפו שכל עין תשתחוה. מוצג לפני קהל, הוא הופך ים של עיניים לחסידים נאמנים הרואים בנושאו מנהיג מהימן, עד שפגיעה או פקודה אכזרית שוברות את הכישוף.
- id: rod-of-security
  flavor: >-
    מטה קצר חיוור מאם הפנינה, שנשאו מטיילים המבקשים מחסה מסערה. בפקודה אחת הוא מעביר את נושאו ואת חבריו המרצונים אל כיס פרטי של העולם, גן או פונדק או ארמון לבחירה. מזון ומים בשפע שם, ושום דבר שנאסף בפנים אינו יכול לצאת.
- id: rope-of-climbing
  flavor: >-
    קנבוס בעל דעה משלו: החבל הזה זוחל במעלה סלעים, נקשר למדפים ומתקשר לאחיזות. הוא מתעלם מרעל ומקסמים המטרידים את התודעה, ומאט לאט את הסיבים הבלויים שלו. מלחים נשבעים שפעם קשר קברניט עקשן לתורן, לבקשתו שלו.
- id: rope-of-entanglement
  flavor: >-
    עושי חבלים בנמל דייגים שזרו את הקו הזה בטינה כלפי גנבים. קצהו הרחוק יכול לזנק ולעטוף יצור בסבך, ולאחוז בו חזק עד שהשבוי מתפתל לחופשי או שהחבל מתכרבל חזרה אל היד שזרקה אותו.
- id: scarab-of-protection
  flavor: >-
    המדליון הזה בצורת חיפושית נחצב בידי סוג מסוים של כוהנים שחששו מקסמי קבר ומן המתים חסרי המנוחה, והוא מגן על לובשו מפני אמנויות אפלות. הגנתו האגורה דלה עם כל מגן שהוא מקים, ולבסוף הוא מתפורר לאבק ארד.
- id: scimitar-of-speed
  flavor: >-
    להב מעוקל מפלדה כחלחלה, בעל חוד מהיר ובוהק, מעשה נפחים שרצו חרב שאי אפשר להקדים. אוחזו מוצא בה קצב נוסף של הבזק, מכה שנייה המגיעה לפני שהראשונה חדלה לצלצל.
- id: shield
  flavor: >-
    המגן הפשוט הוא פיסת ההגנה המוכרת ביותר בכל נשקייה, אך מגנים מכושפים מרוויחים את מקומם בחוסן שקט וגדל. נושאו חש נוכחות יציבה ומרגיעה על הזרוע, ומכות שהיו מזעזעות את הכתף מחליקות הצידה.
