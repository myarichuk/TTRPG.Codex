- id: acolyte
  name: 'משרת מקדש'
  flavor: >-
    רוב היום הוקדש לעבודה השקטה של המקדש: גזירת פתילי נרות, העתקת תפילות בכתב יד מסודר והקשבה לצרותיהם של מי שנכנסו מהגשם. סמל הקודש על החוט נשחק עד חלקלקות מאצבעות חרדות. על שאלות בעניין הטקסים העתיקים באות תשובות זהירות, פדנטיות במקצת, ולרוב מלוות באנחה.
- id: criminal
  name: 'פושע'
  flavor: >-
    מעט מנעולים ברובע התחתון הצליחו לעצור את האיש הזה לזמן רב. בכיסי מעיל טוב נכנס יותר ממה שמותר, וצעד שקט על מדרגה חורקת הוא הרגל שנלמד בדרך הקשה. המקצוע נשען על טובות שחייבים, זיכרון חד לפרצופים וכבוד בריא ללוח הזמנים של המשמר.
- id: sage
  name: 'חכם'
  flavor: >-
    אבק ודיו נדבקים לשרוולי החכם שקרא יותר ממה שטוב לעיניים. שאלה על ממלכה נשכחת או על לחש ישן חוזרת עם שלוש הערות שוליים והפסקה ארוכה למחשבה. סולם הספרייה חורק תחת כל אורח, והתה התקרר מזמן.
- id: soldier
  name: 'חייל'
  flavor: >-
    שירי הצעדה דועכים מהר כשהדרך הופכת לבוץ, אבל ההרגלים נשארים. הכתפיים מזדקפות למשמע קרן, והחנית לעולם אינה רחוקה מהיד, אפילו בארוחת הערב. חברים ותיקים צוחקים על מנות שנשרפו, וקול גס בחצר המסדרים עדיין נושא אזהרה שאיש אינו מתעלם ממנה.
