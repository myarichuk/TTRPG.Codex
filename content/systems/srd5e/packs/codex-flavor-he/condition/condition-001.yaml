- id: blinded
  name: 'עיוור'
  flavor: >-
    האור הפך לכתם אפור, וכל צורה מגיעה כשמועה של צליל ומגע. היצור העיוור מניף את נשקו אל זיכרונות של מטרות, ונדמה שהעולם מניף בחזרה חזק יותר.
- id: charmed
  name: 'מוקסם'
  flavor: >-
    קול מתוק ובלתי ממהר התיישב מאחורי העיניים והפך את המקסים לדומה לחבר ותיק. היצור המוקסם עדיין מבדיל בין פח לחסד, אך אינו מצליח לגרום לעצמו לנשוך את היד שמאכילה אותו.
- id: deafened
  name: 'חרש'
  flavor: >-
    מקהלת הרחוב התכווצה להמהום עמום מאחורי קיר של צמר גפן. מילים מגיעות אל היצור החרש רק כצורות על שפתי אחרים, והפעמון שקרא לו פעם לארוחה מצלצל בשקט.
- id: exhaustion
  name: 'תשישות'
  flavor: >-
    העצמות מרגישות מלאות בחול רטוב, וכל מחשבה גוררת אחריה את העוגן שלה. תשישות היא חוב איטי שהולך ונערם, צובר ריבית באיברים כואבים עד שלילה ארוך של שינה מתחיל סוף סוף לפרוע אותו.
- id: frightened
  name: 'מבוהל'
  flavor: >-
    אימה נאספת מתחת לצלעות בכל פעם שמקור הפחד נכנס לטווח הראייה. ידיו של היצור המבוהל שוכחות את מיומנותן, ורגליו מתנגדות בחריפות לכל צעד נוסף לעבר מה שהוא חושש ממנו.
- id: grappled
  name: 'תפוס'
  flavor: >-
    אצבעות קרות נסגרו סביב קרסול או פרק כף יד, והמאבק הפך לתחרות איטית של משקל. היצור התפוס יכול לעמוד על מקומו אך לא לשוטט, קשור לאחיזה חזקה ממנו שמסרבת להרפות.
- id: incapacitated
  name: 'חסר יכולת פעולה'
  flavor: >-
    הגפיים והלשון השתתקו, כאילו הגוף נמסר למישהו אחר לאחר הצהריים. היצור חסר יכולת הפעולה יכול רק לצפות בקרב מתרחש, מחשבותיו מפוזרות ונשימתו אינה מצליחה ליצור מילת אזהרה.
- id: invisible
  name: 'בלתי נראה'
  flavor: >-
    נצנוצים מחליקים מהדמות כמו מים מאבן, ומשאירים משב אוויר קל ותחושה של מישהו שעומד היכן שנדמה שאין איש. עדשות ועיניים אינם מוצאים במה לאחוז, אם כי אף חד או אוזן קשובה עדיין עלולים להסגיר צל חולף.
- id: paralyzed
  name: 'משותק'
  flavor: >-
    כל פקודה שנשלחת מהמוח נתקעת בפרק כף היד, כאילו השליח המנומנם יירט את ההודעה. היצור המשותק נשאר נוקשה וחשוף, ונדמה שכל מכה שפוגעת מוצאת את המקום הרך ביותר.
- id: petrified
  name: 'מאובן'
  flavor: >-
    העור הופך לאבן אפורה, המפרקים ננעלים בתנוחת פסל, והשעון החי מפסיק לתקתק. תווי הפנים החרוטים שומרים על הבעתם האחרונה במשך דורות, קרים וכבדים כמו אנדרטה שממתינה שמישהו יזכור את שמה.
- id: poisoned
  name: 'מורעל'
  flavor: >-
    טעם מר נשאר בעומק הגרון והידיים מרגישות מגושמות, כאילו הן שייכות לזר. הכוונה של היצור המורעל נודדת וההיגיון שלו מתפרם, והמחשבות מסרבות להסתדר בשורות מסודרות.
- id: prone
  name: 'מוטל על הקרקע'
  flavor: >-
    אבק וחצץ הפכו לחברים קרובים יותר ממה שמישהו התכוון, וכל מאמץ להושיט יד לנשק פוגש את הקרקע. היצור שנפל מטפס לאט חזרה על רגליו, ובינתיים כל מי שרץ לעברו כאילו מגיע בזווית לא נוחה.
- id: restrained
  name: 'מרוסן'
  flavor: >-
    כבלים אינם חייבים להיות מברזל, שהרי סבך חבלים או משקלה של רשת מחזיקים איבר חזק כמו כל שרשרת. היצור המרוסן נאבק ברשתות, וכל מאמץ רק מהדק את הקשר.
- id: stunned
  name: 'המום'
  flavor: >-
    המוח מצלצל כמו פעמון שהוכה, והעולם מגיע בחלקים מנותקים שאינם מסכימים להישאר בסדר. היצור ההמום קורס תחת המכה, מבולבל מכדי להתכונן למה שיבוא אחר כך.
- id: unconscious
  name: 'מחוסר הכרה'
  flavor: >-
    השינה הגיעה בלי שיר ערש והפילה את הגוף על הלוחות כמו שק תבואה. המחשבות נסחפות אל ים חשוך ושקט, והישן אינו יודע מי עומד לידו.
