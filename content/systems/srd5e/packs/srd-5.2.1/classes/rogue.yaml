id: rogue
type: class
name: Rogue
description: >-
  **Primary Ability:** Dexterity  

  **Hit Point Die:** D8 per Rogue level  

  **Saving Throw Proficiencies:** DEX, INT  

  **Skill Proficiencies:** Choose 4: Acrobatics, Athletics, Deception, Insight, Intimidation, Investigation, Perception, Performance, Persuasion, Sleight of Hand, or Stealth  

  **Weapon Proficiencies:** Simple Weapons, Longswords, Rapiers, Scimitars, Shortswords, Whips, Hand crossbows, Tool: Thieves' Tools  

  **Armor Training:** Light Armor  

  **Starting Equipment:** (a) Leather Armor, 2 Daggers, Shortsword, Shortbow, 20 Arrows, Quiver, Thieves’ Tools, Burglar’s Pack, and 8 GP; (b) 100 GP
tags:
- class
properties:
  hitDie: d8
  primaryAbility: Dexterity
  savingThrows:
  - DEX
  - INT
  armorProficiencies:
  - Light Armor
  weaponProficiencies:
  - Simple Weapons
  - Longswords
  - Rapiers
  - Scimitars
  - Shortswords
  - Whips
  - Hand crossbows
  - "Tool: Thieves' Tools"
  skillChoices: 'Choose 4: Acrobatics, Athletics, Deception, Insight, Intimidation, Investigation, Perception, Performance, Persuasion, Sleight of Hand, or Stealth'
  startingEquipment: (a) Leather Armor, 2 Daggers, Shortsword, Shortbow, 20 Arrows, Quiver, Thieves’ Tools, Burglar’s Pack, and 8 GP; (b) 100 GP
  multiclassing: "Prerequisite: DEX 13+. Proficiencies gained: Light Armor, Tool: Thieves' Tools"
  multiclassPrerequisites:
  - DEX 13+
  subclasses:
  - Thief
  features:
  - name: Expertise
    level: 1
    description: >-
      You gain Expertise in two of your skill proficiencies of your choice. Sleight of Hand and Stealth are recommended if you have proficiency in them.

      At Rogue level 6, you gain Expertise in two more of your skill proficiencies of your choice.
  - name: Sneak Attack
    level: 1
    description: >-
      You know how to strike subtly and exploit a foe's distraction. Once per turn, you can deal an extra 1d6 damage to one creature you hit with an attack roll if you have Advantage on the roll and the attack uses a Finesse or a Ranged weapon. The extra damage's type is the same as the weapon's type.

      You don't need Advantage on the attack roll if at least one of your allies is within 5 feet of the target, the ally doesn't have the Incapacitated condition, and you don't have Disadvantage on the attack roll.

      The extra damage increases as you gain Rogue levels, as shown in the Sneak Attack column of the Rogue Features table.
  - name: Thieves' Cant
    level: 1
    description: You picked up various languages in the communities where you plied your roguish talents. You know Thieves' Cant and one other language of your choice, which you choose from the language tables in "Character Creation."
  - name: Weapon Mastery
    level: 1
    description: >-
      Your training with weapons allows you to use the mastery properties of two kinds of weapons of your choice with which you have proficiency, such as Daggers and Shortbows.

      Whenever you finish a Long Rest, you can change the kinds of weapons you chose. For example, you could switch to using the mastery properties of Scimitars and Shortswords.
  - name: Cunning Action
    level: 2
    description: 'Your quick thinking and agility allow you to move and act quickly. On your turn, you can take one of the following actions as a Bonus Action: Dash, Disengage, or Hide.'
  - name: Rogue Subclass
    level: 3
    description: You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.
  - name: Steady Aim
    level: 3
    description: As a Bonus Action, you give yourself Advantage on your next attack roll on the current turn. You can use this feature only if you haven't moved during this turn, and after you use it, your Speed is 0 until the end of the current turn.
  - name: Ability Score Improvement
    level: 4
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
  - name: Cunning Strike
    level: 5
    description: >-
      You've developed cunning ways to use your Sneak Attack. When you deal Sneak Attack damage, you can add one of the following Cunning Strike effects.

      Each effect has a die cost, which is the number of Sneak Attack damage dice you must forgo to add the effect. You remove the die before rolling, and the effect occurs immediately after the attack's damage is dealt. For example, if you add the Poison effect, remove 1d6 from the Sneak Attack's damage before rolling.

      If a Cunning Strike effect requires a saving throw, the DC equals 8 plus your Dexterity modifier and Proficiency Bonus.

      Poison (Cost: 1d6). You add a toxin to your strike, forcing the target to make a Constitution saving throw. On a failed save, the target has the Poisoned condition for 1 minute. At the end of each of its turns, the Poisoned target repeats the save, ending the effect on itself on a success.

      To use this effect, you must have a Poisoner's Kit on your person.

      Trip (Cost: 1d6). If the target is Large or smaller, it must succeed on a Dexterity saving throw or have the Prone condition.

      Withdraw (Cost: 1d6). Immediately after the attack, you move up to half your Speed without provoking Opportunity Attacks.
  - name: Uncanny Dodge
    level: 5
    description: When an attacker that you can see hits you with an attack roll, you can take a Reaction to halve the attack's damage against you (round down).
  - name: Expertise
    level: 6
    description: >-
      You gain Expertise in two of your skill proficiencies of your choice. Sleight of Hand and Stealth are recommended if you have proficiency in them.

      At Rogue level 6, you gain Expertise in two more of your skill proficiencies of your choice.
  - name: Evasion
    level: 7
    description: >-
      You can nimbly dodge out of the way of certain dangers.

      When you're subjected to an effect that allows you to make a Dexterity saving throw to take only half damage, you instead take no damage if you succeed on the saving throw and only half damage if you fail. You can't use this feature if you have the Incapacitated condition.
  - name: Reliable Talent
    level: 7
    description: Whenever you make an ability check that uses one of your skill or tool proficiencies, you can treat a d20 roll of 9 or lower as a 10.
  - name: Ability Score Improvement
    level: 8
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
  - name: Rogue Subclass
    level: 9
    description: You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.
  - name: Ability Score Improvement
    level: 10
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
  - name: Improved Cunning Strike
    level: 11
    description: You can use up to two Cunning Strike effects when you deal Sneak Attack damage, paying the die cost for each effect.
  - name: Ability Score Improvement
    level: 12
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
  - name: Rogue Subclass
    level: 13
    description: You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.
  - name: Devious Strikes
    level: 14
    description: >-
      You've practiced new ways to use your Sneak Attack deviously. The following effects are now among your Cunning Strike options.

      Daze (Cost: 2d6). The target must succeed on a Constitution saving throw, or on its next turn, it can do only one of the following: move or take an action or a Bonus Action.

      Knock Out (Cost: 6d6). The target must succeed on a Constitution saving throw, or it has the Unconscious condition for 1 minute or until it takes any damage. The Unconscious target repeats the save at the end of each of its turns, ending the effect on itself on a success.

      Obscure (Cost: 3d6). The target must succeed on a Dexterity saving throw, or it has the Blinded condition until the end of its next turn.
  - name: Slippery Mind
    level: 15
    description: >-
      Your cunning mind is exceptionally difficult to control.

      You gain proficiency in Wisdom and Charisma saving throws.
  - name: Ability Score Improvement
    level: 16
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Rogue levels 8, 10, 12, and 16.
  - name: Rogue Subclass
    level: 17
    description: You gain a Rogue subclass of your choice. A subclass is a specialization that grants you features at certain Rogue levels. For the rest of your career, you gain each of your subclass's features that are of your Rogue level or lower.
  - name: Elusive
    level: 18
    description: You're so evasive that attackers rarely gain the upper hand against you. No attack roll can have Advantage against you unless you have the Incapacitated condition.
  - name: Epic Boon
    level: 19
    description: You gain an Epic Boon feat (see "Feats") or another feat of your choice for which you qualify. Boon of the Night Spirit is recommended.
  - name: Stroke of Luck
    level: 20
    description: >-
      You have a marvelous knack for succeeding when you need to. If you fail a D20 Test, you can turn the roll into a 20.

      Once you use this feature, you can't use it again until you finish a Short or Long Rest.
