id: fighter
type: class
name: Fighter
description: >-
  **Primary Ability:** Strength or Dexterity  

  **Hit Point Die:** D10 per Fighter level  

  **Saving Throw Proficiencies:** STR, CON  

  **Skill Proficiencies:** Choose 2: Acrobatics, Animal Handling, Athletics, History, Insight, Intimidation, Perception, or Survival  

  **Weapon Proficiencies:** Simple Weapons, Martial Weapons  

  **Armor Training:** All armor, Shields  

  **Starting Equipment:** (a) Chain Mail, Greatsword, Flail, 8 Javelins, Dungeoneer’s Pack, and 4 GP; (b) Studded Leather Armor, Scimitar, Shortsword, Longbow, 20 Arrows, Quiver, Dungeoneer’s Pack, and 11 GP; or (c) 155 GP
tags:
- class
properties:
  hitDie: d10
  primaryAbility: Strength or Dexterity
  savingThrows:
  - STR
  - CON
  armorProficiencies:
  - All armor
  - Shields
  weaponProficiencies:
  - Simple Weapons
  - Martial Weapons
  skillChoices: 'Choose 2: Acrobatics, Animal Handling, Athletics, History, Insight, Intimidation, Perception, or Survival'
  startingEquipment: (a) Chain Mail, Greatsword, Flail, 8 Javelins, Dungeoneer’s Pack, and 4 GP; (b) Studded Leather Armor, Scimitar, Shortsword, Longbow, 20 Arrows, Quiver, Dungeoneer’s Pack, and 11 GP; or (c) 155 GP
  multiclassing: 'Prerequisite: STR 13+ or DEX 13+. Proficiencies gained: Light Armor, Medium Armor, Shields, Martial Weapons'
  multiclassPrerequisites:
  - STR 13+
  - DEX 13+
  subclasses:
  - Champion
  features:
  - name: Fighting Style
    level: 1
    description: >-
      You have honed your martial prowess and gain a Fighting Style feat of your choice (see "Feats"). Defense is recommended.

      Whenever you gain a Fighter level, you can replace the feat you chose with a different Fighting Style feat.
  - name: Second Wind
    level: 1
    description: >-
      You have a limited well of physical and mental stamina that you can draw on. As a Bonus Action, you can use it to regain Hit Points equal to 1d10 plus your Fighter level.

      You can use this feature twice. You regain one expended use when you finish a Short Rest, and you regain all expended uses when you finish a Long Rest.

      When you reach certain Fighter levels, you gain more uses of this feature, as shown in the Second Wind column of the Fighter Features table.
  - name: Weapon Mastery
    level: 1
    description: >-
      Your training with weapons allows you to use the mastery properties of three kinds of Simple or Martial weapons of your choice. Whenever you finish

      a Long Rest, you can practice weapon drills and change one of those weapon choices.

      When you reach certain Fighter levels, you gain the ability to use the mastery properties of more kinds of weapons, as shown in the Weapon Mastery column of the Fighter Features table.
  - name: Action Surge
    level: 2
    description: >-
      You can push yourself beyond your normal limits for a moment. On your turn, you can take one additional action, except the Magic action.

      Once you use this feature, you can't do so again until you finish a Short or Long Rest. Starting at level 17, you can use it twice before a rest but only once on a turn.
  - name: Tactical Mind
    level: 2
    description: You have a mind for tactics on and off the battlefield. When you fail an ability check, you can expend a use of your Second Wind to push yourself toward success. Rather than regaining Hit Points, you roll 1d10 and add the number rolled to the ability check, potentially turning it into a success. If the check still fails, this use of Second Wind isn't expended.
  - name: Fighter Subclass
    level: 3
    description: You gain a Fighter subclass of your choice. A subclass is a specialization that grants you features at certain Fighter levels. For the rest of your career, you gain each of your subclass's features that are of your Fighter level or lower.
  - name: Ability Score Improvement
    level: 4
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Extra Attack
    level: 5
    description: You can attack twice instead of once whenever you take the Attack action on your turn.
  - name: Tactical Shift
    level: 5
    description: Whenever you activate your Second Wind with a Bonus Action, you can move up to half your Speed without provoking Opportunity Attacks.
  - name: Ability Score Improvement
    level: 6
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Fighter Subclass
    level: 7
    description: You gain a Fighter subclass of your choice. A subclass is a specialization that grants you features at certain Fighter levels. For the rest of your career, you gain each of your subclass's features that are of your Fighter level or lower.
  - name: Ability Score Improvement
    level: 8
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Indomitable
    level: 9
    description: >-
      If you fail a saving throw, you can reroll it with a bonus equal to your Fighter level. You must use the new roll, and you can't use this feature again until you finish a Long Rest.

      You can use this feature twice before a Long Rest starting at level 13 and three times before a Long Rest starting at level 17.
  - name: Tactical Master
    level: 9
    description: When you attack with a weapon whose mastery property you can use, you can replace that property with the Push, Sap, or Slow property for that attack.
  - name: Fighter Subclass
    level: 10
    description: You gain a Fighter subclass of your choice. A subclass is a specialization that grants you features at certain Fighter levels. For the rest of your career, you gain each of your subclass's features that are of your Fighter level or lower.
  - name: Two Extra Attacks
    level: 11
    description: You can attack three times instead of once whenever you take the Attack action on your turn.
  - name: Ability Score Improvement
    level: 12
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Indomitable
    level: 13
    description: >-
      If you fail a saving throw, you can reroll it with a bonus equal to your Fighter level. You must use the new roll, and you can't use this feature again until you finish a Long Rest.

      You can use this feature twice before a Long Rest starting at level 13 and three times before a Long Rest starting at level 17.
  - name: Studied Attacks
    level: 13
    description: You study your opponents and learn from each attack you make. If you make an attack roll against a creature and miss, you have Advantage on your next attack roll against that creature before the end of your next turn.
  - name: Ability Score Improvement
    level: 14
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Fighter Subclass
    level: 15
    description: You gain a Fighter subclass of your choice. A subclass is a specialization that grants you features at certain Fighter levels. For the rest of your career, you gain each of your subclass's features that are of your Fighter level or lower.
  - name: Ability Score Improvement
    level: 16
    description: You gain the Ability Score Improvement feat (see "Feats") or another feat of your choice for which you qualify. You gain this feature again at Fighter levels 6, 8, 12, 14, and 16.
  - name: Action Surge
    level: 17
    description: >-
      You can push yourself beyond your normal limits for a moment. On your turn, you can take one additional action, except the Magic action.

      Once you use this feature, you can't do so again until you finish a Short or Long Rest. Starting at level 17, you can use it twice before a rest but only once on a turn.
  - name: Indomitable
    level: 17
    description: >-
      If you fail a saving throw, you can reroll it with a bonus equal to your Fighter level. You must use the new roll, and you can't use this feature again until you finish a Long Rest.

      You can use this feature twice before a Long Rest starting at level 13 and three times before a Long Rest starting at level 17.
  - name: Fighter Subclass
    level: 18
    description: You gain a Fighter subclass of your choice. A subclass is a specialization that grants you features at certain Fighter levels. For the rest of your career, you gain each of your subclass's features that are of your Fighter level or lower.
  - name: Epic Boon
    level: 19
    description: You gain an Epic Boon feat (see "Feats") or another feat of your choice for which you qualify. Boon of Combat Prowess is recommended.
  - name: Three Extra Attacks
    level: 20
    description: You can attack four times instead of once whenever you take the Attack action on your turn.
