  *Medium or small Humanoid, Neutral*


  **AC** 12  

  **HP** 27 (6d8)  

  **Speed** 30 ft., climb 30 ft.  

  **CR** 1 (XP 200; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 10 (+0) | 15 (+2) | 10 (+0) | 12 (+1) | 14 (+2) | 16 (+3) |


