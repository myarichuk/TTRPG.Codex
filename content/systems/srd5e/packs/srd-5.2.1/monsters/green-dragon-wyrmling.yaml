id: green-dragon-wyrmling
type: monster
name: Green Dragon Wyrmling
description: >-
  *Medium Dragon, Lawful Evil*


  **AC** 17  

  **HP** 38 (7d8 + 7)  

  **Speed** 30 ft., fly 60 ft., swim 30 ft.  

  **CR** 2 (XP 450; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 15 (+2) | 12 (+1) | 13 (+1) | 14 (+2) | 11 (+0) | 13 (+1) |


  **Saving Throws** DEX +3, WIS +2  

  **Skills** Perception +4, Stealth +3  

  **Immunities** poison, Poisoned  

  **Senses** darkvision 60 ft., blindsight 10 ft., passive perception 14  

  **Languages** Draconic


  ### Traits

  **Amphibious.** The dragon can breathe air and water.



  ### Actions

  **Multiattack.** The dragon makes two Rend attacks.


  **Rend.** Melee Attack Roll: +4, reach 5 ft. Hit: 7 (1d10 + 2) Slashing damage plus 3 (1d6) Poison damage.


  **Poison Breath.** Constitution Saving Throw: DC 11, each creature in a 15-foot Cone. Failure: 21 (6d6) Poison damage. Success: Half damage.
