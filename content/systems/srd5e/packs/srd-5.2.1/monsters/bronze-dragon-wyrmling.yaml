id: bronze-dragon-wyrmling
type: monster
name: Bronze Dragon Wyrmling
description: >-
  *Medium Dragon, Lawful Good*


  **AC** 15  

  **HP** 39 (6d8 + 12)  

  **Speed** 30 ft., fly 60 ft., swim 30 ft.  

  **CR** 2 (XP 450; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 17 (+3) | 10 (+0) | 15 (+2) | 12 (+1) | 11 (+0) | 15 (+2) |


  **Saving Throws** DEX +2, WIS +2  

  **Skills** Perception +4, Stealth +2  

  **Immunities** lightning  

  **Senses** darkvision 60 ft., blindsight 10 ft., passive perception 14  

  **Languages** Draconic


  ### Traits

  **Amphibious.** The dragon can breathe air and water.



  ### Actions

  **Multiattack.** The dragon makes two Rend attacks.


  **Rend.** Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Slashing damage.


  **Lightning Breath.** Dexterity Saving Throw: DC 12, each creature in a 40-foot-long, 5-footwide Line. Failure: 16 (3d10) Lightning damage. Success: Half damage.


  **Repulsion Breath.** Strength Saving Throw: DC 12, each creature in a 30-foot Cone. Failure: The target is pushed up to 30 feet straight away from the dragon and has the Prone condition.
