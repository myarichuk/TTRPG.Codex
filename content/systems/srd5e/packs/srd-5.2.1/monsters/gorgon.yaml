id: gorgon
type: monster
name: Gorgon
description: >-
  *Large Construct, Unaligned*


  **AC** 19  

  **HP** 114 (12d10 + 48)  

  **Speed** 40 ft.  

  **CR** 5 (XP 1800; PB +3)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 20 (+5) | 11 (+0) | 18 (+4) | 2 (-4) | 12 (+1) | 7 (-2) |


  **Skills** Perception +7  

  **Immunities** Exhaustion, Petrified  

  **Senses** darkvision 60 ft., passive perception 17  

  **Languages** None


  ### Actions

  **Gore.** Melee Attack Roll: +8, reach 5 ft. Hit: 18 (2d12 + 5) Piercing damage. If the target is a Large or smaller creature and the gorgon moved 20+ feet straight toward it immediately before the hit, the target has the Prone condition.


  **Petrifying Breath.** Constitution Saving Throw: DC 15, each creature in a 30-foot Cone. First Failure: The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. Second Failure: The target has the Petrified condition instead of the Restrained condition.



  ### Bonus Actions

  **Trample.** Dexterity Saving Throw: DC 16, one creature within 5 feet that has the Prone condition. Failure: 16 (2d10 + 5) Bludgeoning damage. Success: Half damage.
