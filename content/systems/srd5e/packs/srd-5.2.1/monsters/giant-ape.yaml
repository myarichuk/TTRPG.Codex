id: giant-ape
type: monster
name: Giant Ape
description: >-
  *Huge Beast, Unaligned*


  **AC** 12  

  **HP** 168 (16d12 + 64)  

  **Speed** 40 ft., climb 40 ft.  

  **CR** 7 (XP 2900; PB +3)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 23 (+6) | 14 (+2) | 18 (+4) | 5 (-3) | 12 (+1) | 7 (-2) |


  **Skills** Athletics +9, Perception +4, Survival +4  

  **Senses** passive perception 14  

  **Languages** None


  ### Actions

  **Multiattack.** The ape makes two Fist attacks.


  **Fist.** Melee Attack Roll: +9, reach 10 ft. Hit: 22 (3d10 + 6) Bludgeoning damage.


  **Boulder Toss.** The ape hurls a boulder at a point it can see within 90 feet. Dexterity Saving Throw: DC 17, each creature in a 5-foot-radius Sphere centered on that point. Failure: 24 (7d6) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition. Success: Half damage only.



  ### Bonus Actions

  **Leap.** The ape jumps up to 30 feet by spending 10 feet of movement.
