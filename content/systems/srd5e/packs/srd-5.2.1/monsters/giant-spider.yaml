id: giant-spider
type: monster
name: Giant Spider
description: >-
  *Large Beast, Unaligned*


  **AC** 14  

  **HP** 26 (4d10 + 4)  

  **Speed** 30 ft., climb 30 ft.  

  **CR** 1 (XP 200; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 14 (+2) | 16 (+3) | 12 (+1) | 2 (-4) | 11 (+0) | 4 (-3) |


  **Skills** Perception +4, Stealth +7  

  **Senses** darkvision 60 ft., passive perception 14  

  **Languages** None


  ### Traits

  **Spider Climb.** The spider can climb difficult surfaces, including along ceilings, without needing to make an ability check.


  **Web Walker.** The spider ignores movement restrictions caused by webs, and it knows the location of any other creature in contact with the same web.



  ### Actions

  **Bite.** Melee Attack Roll: +5, reach 5 ft. Hit: 7 (1d8 + 3) Piercing damage plus 7 (2d6) Poison damage.


  **Web.** Dexterity Saving Throw: DC 13, one creature the spider can see within 60 feet. Failure: The target has the Restrained condition until the web is destroyed (AC 10; HP 5; Vulnerability to Fire damage; Immunity to Poison and Psychic damage).
