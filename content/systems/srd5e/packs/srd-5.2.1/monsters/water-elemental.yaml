id: water-elemental
type: monster
name: Water Elemental
description: >-
  *Large Elemental, Neutral*


  **AC** 14  

  **HP** 114 (12d10 + 48)  

  **Speed** 30 ft., swim 90 ft.  

  **CR** 5 (XP 1800; PB +3)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 18 (+4) | 14 (+2) | 18 (+4) | 5 (-3) | 10 (+0) | 8 (-1) |


  **Resistances** acid, fire  

  **Immunities** poison, Exhaustion, Grappled, Paralyzed, Petrified, Poisoned, Prone, Restrained, Unconscious  

  **Senses** darkvision 60 ft., passive perception 10  

  **Languages** Primordial (Aquan)


  ### Traits

  **Freeze.** If the elemental takes Cold damage, its Speed decreases by 20 feet until the end of its next turn.


  **Water Form.** The elemental can enter an enemy’s space and stop there. It can move through a space as narrow as 1 inch without expending extra movement to do so.



  ### Actions

  **Multiattack.** The elemental makes two Slam attacks.


  **Slam.** Melee Attack Roll: +7, reach 5 ft. Hit: 13 (2d8 + 4) Bludgeoning damage. If the target is a Medium or smaller creature, it has the Prone condition.


  **Whelm.** Strength Saving Throw: DC 15, each creature in the elemental’s space. Failure: 22 (4d8 + 4) Bludgeoning damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 14). Until the grapple ends, the target has the Restrained condition, is suffocating unless it can breathe water, and takes 9 (2d8) Bludgeoning damage at the start of each of the elemental’s turns. The elemental can grapple one Large creature or up to two Medium or smaller creatures at a time with Whelm. As an action, a creature within 5 feet of the elemental can pull a creature out of it by succeeding on a DC 14 Strength (Athletics) check. Success: Half damage only.
