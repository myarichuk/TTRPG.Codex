id: basilisk
type: monster
name: Basilisk
description: >-
  *Medium Monstrosity, Unaligned*


  **AC** 15  

  **HP** 52 (8d8 + 16)  

  **Speed** 20 ft.  

  **CR** 3 (XP 700; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 16 (+3) | 8 (-1) | 15 (+2) | 2 (-4) | 8 (-1) | 7 (-2) |


  **Senses** darkvision 60 ft., passive perception 9  

  **Languages** None


  ### Actions

  **Bite.** Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage plus 7 (2d6) Poison damage.



  ### Bonus Actions

  **Petrifying Gaze.** Constitution Saving Throw: DC 12, each creature in a 30-foot Cone. If the basilisk sees its reflection in the Cone, the basilisk must make this save. First Failure: The target has the Restrained condition and repeats the save at the end of its next turn if it is still Restrained, ending the effect on itself on a success. Second Failure: The target has the Petrified condition instead of the Restrained condition.
