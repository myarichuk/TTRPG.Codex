id: wereboar-hybrid
type: monster
name: Wereboar, Hybrid Form
description: >-
  *Medium Monstrosity, Neutral Evil*


  **AC** 15  

  **HP** 97 (15d8 + 30)  

  **Speed** 30 ft.  

  **CR** 4 (XP 1100; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 17 (+3) | 10 (+0) | 15 (+2) | 10 (+0) | 11 (+0) | 8 (-1) |


  **Skills** Perception +2  

  **Gear** Javelins (6)  

  **Senses** passive perception 12  

  **Languages** Common (can’t speak in boar form)


  ### Actions

  **Multiattack.** The wereboar makes two attacks, using Javelin or Tusk in any combination. It can replace one attack with a Gore attack.


  **Gore.** Melee Attack Roll: +5, reach 5 ft. Hit: 12 (2d8 + 3) Piercing damage. If the target is a Humanoid, it is subjected to the following effect. Constitution Saving Throw: DC 12. Failure: The target is cursed. If the cursed target drops to 0 Hit Points, it instead becomes a Wereboar under the GM’s control and has 10 Hit Points. Success: The target is immune to this wereboar’s curse for 24 hours.


  **Javelin.** Melee or Ranged Attack Roll: +5, reach 5 ft. or range 30/120 ft. Hit: 13 (3d6 + 3) Piercing damage.


  **Tusk.** Melee Attack Roll: +5, reach 5 ft. Hit: 10 (2d6 + 3) Piercing damage. If the target is a Medium or smaller creature and the wereboar moved 20+ feet straight toward it immediately before the hit, the target takes an extra 7 (2d6) Piercing damage and has the Prone condition.



  ### Bonus Actions

  **Shape-Shift.** The wereboar shape-shifts into a Medium boar-humanoid hybrid or a Small boar, or it returns to its true humanoid form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn’t transformed.
