id: red-dragon-wyrmling
type: monster
name: Red Dragon Wyrmling
description: >-
  *Medium Dragon, Chaotic Evil*


  **AC** 17  

  **HP** 75 (10d8 + 30)  

  **Speed** 30 ft., climb 30 ft., fly 60 ft.  

  **CR** 4 (XP 1100; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 19 (+4) | 10 (+0) | 17 (+3) | 12 (+1) | 11 (+0) | 15 (+2) |


  **Saving Throws** DEX +2, WIS +2  

  **Skills** Perception +4, Stealth +2  

  **Immunities** fire  

  **Senses** darkvision 60 ft., blindsight 10 ft., passive perception 14  

  **Languages** Draconic


  ### Actions

  **Multiattack.** The dragon makes two Rend attacks.


  **Rend.** Melee Attack Roll: +6, reach 5 ft. Hit: 9 (1d10 + 4) Slashing damage plus 3 (1d6) Fire damage.


  **Fire Breath.** Dexterity Saving Throw: DC 13, each creature in a 15-foot Cone. Failure: 24 (7d6) Fire damage. Success: Half damage.
