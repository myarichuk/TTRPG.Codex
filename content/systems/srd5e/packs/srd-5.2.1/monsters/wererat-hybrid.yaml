id: wererat-hybrid
type: monster
name: Wererat, Hybrid Form
description: >-
  *Medium Monstrosity, Lawful Evil*


  **AC** 13  

  **HP** 60 (11d8 + 11)  

  **Speed** 30 ft., climb 30 ft.  

  **CR** 2 (XP 450; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 10 (+0) | 16 (+3) | 12 (+1) | 11 (+0) | 10 (+0) | 8 (-1) |


  **Skills** Perception +4, Stealth +5  

  **Gear** Hand Crossbow  

  **Senses** darkvision 60 ft., passive perception 14  

  **Languages** Common (can’t speak in rat form)


  ### Actions

  **Multiattack.** The wererat makes two attacks, using Scratch or Hand Crossbow in any combination. It can replace one attack with a Bite attack.


  **Bite.** Melee Attack Roll: +5, reach 5 ft. Hit: 8 (2d4 + 3) Piercing damage. If the target is a Humanoid, it is subjected to the following effect. Constitution Saving Throw: DC 11. Failure: The target is cursed. If the cursed target drops to 0 Hit Points, it instead becomes a Wererat under the GM’s control and has 10 Hit Points. Success: The target is immune to this wererat’s curse for 24 hours.


  **Scratch.** Melee Attack Roll: +5, reach 5 ft. Hit: 6 (1d6 + 3) Slashing damage.


  **Hand Crossbow.** Ranged Attack Roll: +5, range 30/120 ft. Hit: 6 (1d6 + 3) Piercing damage.



  ### Bonus Actions

  **Shape-Shift.** The wererat shape-shifts into a Medium rat-humanoid hybrid or a Small rat, or it returns to its true humanoid form. Its game statistics, other than its size, are the same in each form. Any equipment it is wearing or carrying isn’t transformed.
