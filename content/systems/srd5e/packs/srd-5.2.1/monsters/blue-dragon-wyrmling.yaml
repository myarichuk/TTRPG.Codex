id: blue-dragon-wyrmling
type: monster
name: Blue Dragon Wyrmling
description: >-
  *Medium Dragon, Lawful Evil*


  **AC** 17  

  **HP** 65 (10d8 + 20)  

  **Speed** 30 ft., burrow 15 ft., fly 60 ft.  

  **CR** 3 (XP 700; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 17 (+3) | 10 (+0) | 15 (+2) | 12 (+1) | 11 (+0) | 15 (+2) |


  **Saving Throws** DEX +2, WIS +2  

  **Skills** Perception +4, Stealth +2  

  **Immunities** lightning  

  **Senses** darkvision 60 ft., blindsight 10 ft., passive perception 14  

  **Languages** Draconic


  ### Actions

  **Multiattack.** The dragon makes two Rend attacks.


  **Rend.** Melee Attack Roll: +5, reach 5 ft. Hit: 8 (1d10 + 3) Slashing damage plus 3 (1d6) Lightning damage.


  **Lightning Breath.** Dexterity Saving Throw: DC 12, each creature in a 30-foot-long, 5-footwide Line. Failure: 21 (6d6) Lightning damage. Success: Half damage.
