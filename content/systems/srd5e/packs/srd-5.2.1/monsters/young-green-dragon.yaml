id: young-green-dragon
type: monster
name: Young Green Dragon
description: >-
  *Large Dragon, Lawful Evil*


  **AC** 18  

  **HP** 136 (16d10 + 48)  

  **Speed** 40 ft., fly 80 ft., swim 40 ft.  

  **CR** 8 (XP 3900; PB +3)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 19 (+4) | 12 (+1) | 17 (+3) | 16 (+3) | 13 (+1) | 15 (+2) |


  **Saving Throws** DEX +4, WIS +4  

  **Skills** Deception +5, Perception +7, Stealth +4  

  **Immunities** poison, Poisoned  

  **Senses** darkvision 120 ft., blindsight 30 ft., passive perception 17  

  **Languages** Common, Draconic


  ### Traits

  **Amphibious.** The dragon can breathe air and water.



  ### Actions

  **Multiattack.** The dragon makes three Rend attacks.


  **Rend.** Melee Attack Roll: +7, reach 10 ft. Hit: 11 (2d6 + 4) Slashing damage plus 7 (2d6) Poison damage.


  **Poison Breath.** Constitution Saving Throw: DC 14, each creature in a 30-foot Cone. Failure: 42 (12d6) Poison damage. Success: Half damage.
