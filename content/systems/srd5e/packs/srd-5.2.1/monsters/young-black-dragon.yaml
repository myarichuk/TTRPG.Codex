id: young-black-dragon
type: monster
name: Young Black Dragon
description: >-
  *Large Dragon, Chaotic Evil*


  **AC** 18  

  **HP** 127 (15d10 + 45)  

  **Speed** 40 ft., fly 80 ft., swim 40 ft.  

  **CR** 7 (XP 2900; PB +3)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 19 (+4) | 14 (+2) | 17 (+3) | 12 (+1) | 11 (+0) | 15 (+2) |


  **Saving Throws** DEX +5, WIS +3  

  **Skills** Perception +6, Stealth +5  

  **Immunities** acid  

  **Senses** darkvision 120 ft., blindsight 30 ft., passive perception 16  

  **Languages** Common, Draconic


  ### Traits

  **Amphibious.** The dragon can breathe air and water.



  ### Actions

  **Multiattack.** The dragon makes three Rend attacks.


  **Rend.** Melee Attack Roll: +7, reach 10 ft. Hit: 9 (2d4 + 4) Slashing damage plus 3 (1d6) Acid damage.


  **Acid Breath.** Dexterity Saving Throw: DC 14, each creature in a 30-foot-long, 5-footwide Line. Failure: 49 (14d6) Acid damage. Success: Half damage.
