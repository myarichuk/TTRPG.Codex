id: white-dragon-wyrmling
type: monster
name: White Dragon Wyrmling
description: >-
  *Medium Dragon, Chaotic Evil*


  **AC** 16  

  **HP** 32 (5d8 + 10)  

  **Speed** 30 ft., burrow 15 ft., fly 60 ft., swim 30 ft.  

  **CR** 2 (XP 450; PB +2)


  | STR | DEX | CON | INT | WIS | CHA |

  | --- | --- | --- | --- | --- | --- |

  | 14 (+2) | 10 (+0) | 14 (+2) | 5 (-3) | 10 (+0) | 11 (+0) |


  **Saving Throws** DEX +2, WIS +2  

  **Skills** Perception +4, Stealth +2  

  **Immunities** cold  

  **Senses** darkvision 60 ft., blindsight 10 ft., passive perception 14  

  **Languages** Draconic


  ### Traits

  **Ice Walk.** The dragon can move across and climb icy surfaces without needing to make an ability check. Additionally, Difficult Terrain composed of ice or snow doesn’t cost it extra movement.



  ### Actions

  **Multiattack.** The dragon makes two Rend attacks.


  **Rend.** Melee Attack Roll: +4, reach 5 ft. Hit: 6 (1d8 + 2) Slashing damage plus 2 (1d4) Cold damage.


  **Cold Breath.** Constitution Saving Throw: DC 12, each creature in a 15-foot Cone. Failure: 22 (5d8) Cold damage. Success: Half damage.
