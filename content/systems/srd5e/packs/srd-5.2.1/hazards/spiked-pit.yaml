id: spiked-pit
type: hazard
name: Spiked Pit
description: A 10-foot pit under a hinged lid made to match the floor, with sharpened wooden or metal spikes at the bottom.
properties:
  kind: trap
  severity: Deadly
  level: 1-4
  trigger: A creature moves onto the pit's lid.
  duration: Instantaneous
  depth: 10 feet
  damage:
  - dice: 1d6
    type: bludgeoning
  - dice: 2d8
    type: piercing
  effect: The lid swings open and the creature falls to the bottom, taking the bludgeoning damage from the fall and the piercing damage from the spikes. There is no save. The lid stays open.
  detect:
  - id: lid
    name: The lid
    action: Study
    check: Investigation
    dc: 15
    text: Examining the section of floor that forms the lid finds the pit.
  disarm:
  - id: wedge
    name: Wedge the lid
    after: lid
    needs: An Iron Spike or a similar object
    text: Wedged between lid and floor, it keeps the lid shut, so the pit is safe to cross.
  - id: lock
    name: Hold the lid shut
    after: lid
    needs: Arcane Lock or similar magic
  higherLevels:
  - levels: 5-10
    depth: 30 feet
    damage:
    - dice: 3d6
      type: bludgeoning
    - dice: 3d8
      type: piercing
  - levels: 11-16
    depth: 60 feet
    damage:
    - dice: 6d6
      type: bludgeoning
    - dice: 8d8
      type: piercing
  - levels: 17-20
    depth: 120 feet
    damage:
    - dice: 12d6
      type: bludgeoning
    - dice: 13d8
      type: piercing
  methods:
  - name: Escape
    needs: A Climb Speed, climbing gear, or magic such as Spider Climb
    text: The walls are smooth. Cracks big enough for handholds and footholds make it easier.
