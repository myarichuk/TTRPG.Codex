id: spiked-pit
type: hazard
name: Spiked Pit
description: A pit like the hidden one, but the lid is lined beneath with iron spikes, set to catch whoever falls.
properties:
  kind: trap
  severity: Deadly
  level: 1-4
  trigger: Weight on the lid.
  noticeCheck: Perception
  noticeDc: 15
  disableCheck: Thieves' Tools
  disableDc: 15
  saveAttribute: Dexterity
  saveDc: 15
  damage: 2d10
  damageType: piercing
  effect: A creature that fails the save falls 10 feet onto the spikes and takes the damage. Success catches the edge.
  reset: The lid is broken for good. The spikes stay.
  higherLevels:
  - levels: 5-10
    saveDc: 15
    damage: 4d10
  - levels: 11-16
    saveDc: 17
    damage: 10d10
  - levels: 17-20
    saveDc: 19
    damage: 18d10
  methods:
  - name: Escape
    check: Athletics
    dc: 10
    text: Climbing out of the pit without help.
  - name: Avoid
    check: Acrobatics
    dc: 15
    text: Jumping across a pit already known.
