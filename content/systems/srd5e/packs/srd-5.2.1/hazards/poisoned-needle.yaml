id: poisoned-needle
type: hazard
name: Poisoned Needle
description: A needle no bigger than a thorn is hidden in a lock, and stabs whoever opens it with anything but the proper key.
properties:
  kind: trap
  severity: Nuisance
  level: 1-4
  trigger: A creature opens the lock with anything but the proper key, or fails to disarm the trap.
  duration: Instantaneous
  saveAttribute: Constitution
  saveDc: 11
  onSave: half
  damage:
  - dice: 1d10
    type: poison
  conditions:
  - name: Poisoned
    lasts: 1 hour
  effect: The creature makes the save. On a failure it takes the damage and is Poisoned for 1 hour. On a success it takes half as much damage and nothing else.
  detect:
  - id: needle
    name: The needle
    action: Search
    check: Perception
    dc: 15
    text: Examining the lock finds the needle.
  disarm:
  - id: disarm
    name: Disarm the needle
    action: Action
    check: Sleight of Hand
    dc: 15
    after: needle
    triggersOn:
    - failure
    text: A failed check sets the trap off.
  higherLevels:
  - levels: 5-10
    saveDc: 13
    damage:
    - dice: 2d10
      type: poison
  - levels: 11-16
    saveDc: 15
    damage:
    - dice: 4d10
      type: poison
  - levels: 17-20
    saveDc: 17
    damage:
    - dice: 10d10
      type: poison
  methods:
  - name: Avoid
    needs: Knock or similar magic
    text: The trap does not trigger if the lock is opened with a Knock spell or similar magic.
