id: falling-net
type: hazard
name: Falling Net
description: A weighted net hangs folded in the dark above a door or corridor and drops on whoever pulls its cord.
properties:
  kind: trap
  severity: Nuisance
  level: 1-4
  trigger: A tripwire at ankle height.
  noticeCheck: Perception
  noticeDc: 10
  disableCheck: Thieves' Tools
  disableDc: 10
  saveAttribute: Dexterity
  saveDc: 10
  effect: A creature that fails the save is Restrained by the net. It deals no damage.
  reset: The net must be folded and hung again by hand.
  higherLevels:
  - levels: 5-10
    saveDc: 12
  - levels: 11-16
    saveDc: 14
  - levels: 17-20
    saveDc: 16
  methods:
  - name: Escape
    check: Strength
    dc: 10
    text: The restrained creature can try, or it can be cut loose with 5 points of slashing damage to the net (armor class 10).
  - name: Set
    check: Sleight of Hand
    dc: 10
    text: Hanging the net again so that it works.
