id: armor-of-resistance
type: magic-item
name: Armor of Resistance
description: >-
  Armor (Any Light, Medium, or Heavy)


  You have Resistance to one type of damage while you wear this armor. The GM chooses the type or determines it randomly by rolling on the following table.


  | 1d10 | Damage Type |


  |---|---|


  | 1 | Acid |


  | 2 | Cold |


  | 3 | Fire |


  | 4 | Force |


  | 5 | Lightning |


  | 6 | Necrotic |


  | 7 | Poison |


  | 8 | Psychic |


  | 9 | Radiant |


  | 10 | Thunder |
tags:
- rare
- armor
properties:
  category: Armor
  rarity: Rare
  attunement: true
