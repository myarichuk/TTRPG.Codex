id: homebrew-cursed-doorway
type: hazard
name: Cursed Doorway
description: A stone arch carved with a pattern of eyes. It hums faintly, and anyone who passes through without the right word feels watched from the other side.
tags:
- homebrew
properties:
  kind: haunt
  severity: Deadly
  level: 5-10
  trigger: A creature passes through the arch without speaking its word aloud.
  noticeCheck: Arcana
  noticeDc: 15
  disableCheck: Arcana
  disableDc: 17
  saveAttribute: Wisdom
  saveDc: 15
  damage: 4d10
  damageType: psychic
  effect: The creature makes the save. On a failure it takes the damage and is Frightened of the arch until the next dawn; on a success it takes half the damage and is not frightened.
  reset: The curse arms again at the next dawn.
  methods:
  - name: Speak the word
    check: History
    dc: 15
    text: Someone who has studied the people who built it can work out the word, or it may be found elsewhere in the ruin. Then the arch is harmless.
  - name: Dispel it
    check: Spellcasting
    dc: 17
    text: A spell that ends magic, cast on the arch, ends the curse for good.
