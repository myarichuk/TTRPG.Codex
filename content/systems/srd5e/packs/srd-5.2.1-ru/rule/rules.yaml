- id: ability-score-cha
  name: "Харизма"
  description: |-
    Уверенность, самообладание и обаяние
- id: ability-score-con
  name: "Телосложение"
  description: |-
    Здоровье и выносливость
- id: ability-score-dex
  name: "Ловкость"
  description: |-
    Проворство, рефлексы и равновесие
- id: ability-score-int
  name: "Интеллект"
  description: |-
    Способность рассуждать и запоминать
- id: ability-score-str
  name: "Сила"
  description: |-
    Физическую мощь
- id: ability-score-wis
  name: "Мудрость"
  description: |-
    Восприимчивость и силу воли
- id: alignment-chaotic-evil
  name: "Хаотично-злой"
  description: |-
    Хаотично-злые существа действуют с произвольным насилием, движимые ненавистью или жаждой крови. Злодей, преследующий планы мести и хаоса, вероятно, хаотично-злой.
- id: alignment-chaotic-good
  name: "Хаотично-добрый"
  description: |-
    Хаотично-добрые существа действуют по велению совести, мало заботясь о том, чего ожидают другие. Бунтарь, грабящий сборщиков налогов жестокого барона и раздающий украденные деньги бедным, вероятно, хаотично-добрый.
- id: alignment-chaotic-neutral
  name: "Хаотично-нейтральный"
  description: |-
    Хаотично-нейтральные существа следуют своим прихотям, ценя личную свободу превыше всего. Негодяй, странствующий по земле и живущий своим умом, вероятно, хаотично-нейтральный.
- id: alignment-lawful-evil
  name: "Принципиально-злой"
  description: |-
    Принципиально-злые существа методично берут то, что хотят, в рамках кодекса традиции, преданности или порядка. Аристократ, эксплуатирующий граждан и плетущий интриги ради власти, вероятно, принципиально-злой.
- id: alignment-lawful-good
  name: "Принципиально-добрый"
  description: |-
    Принципиально-добрые существа стремятся поступать правильно так, как ожидает общество. Тот, кто без колебаний борется с несправедливостью и защищает невинных, вероятно, принципиально-добрый.
- id: alignment-lawful-neutral
  name: "Принципиально-нейтральный"
  description: |-
    Принципиально-нейтральные личности действуют в соответствии с законом, традицией или личным кодексом. Тот, кто следует дисциплинированному образу жизни — и не поддаётся ни требованиям нуждающихся, ни искушениям зла — вероятно, принципиально-нейтральный.
- id: alignment-neutral
  name: "Нейтральный"
  description: |-
    Нейтральный — мировоззрение тех, кто предпочитает избегать моральных вопросов и не принимать сторон, делая то, что кажется лучшим в данный момент. Тот, кому скучны моральные дебаты, вероятно, нейтральный.
- id: alignment-neutral-evil
  name: "Нейтрально-злой"
  description: |-
    Нейтрально-злой — мировоззрение тех, кого не беспокоит вред, причиняемый в погоне за желаниями. Преступник, грабящий и убивающий по своему желанию, вероятно, нейтрально-злой.
- id: alignment-neutral-good
  name: "Нейтрально-добрый"
  description: |-
    Нейтрально-добрые существа делают всё возможное, работая в рамках правил, но не чувствуя себя связанными ими. Добрый человек, помогающий другим по мере их нужд, вероятно, нейтрально-добрый.
- id: alignment-unaligned
  name: "Без мировоззрения"
  description: |-
    Большинство существ, лишённых способности к рациональному мышлению, не имеют мировоззрения; они без мировоззрения. Акулы, например, — дикие хищники, но они не злые; они без мировоззрения.
- id: damage-type-acid
  name: "Кислота"
  description: |-
    Едкие жидкости, пищеварительные ферменты
- id: damage-type-bludgeoning
  name: "Дробящий"
  description: |-
    Тупые предметы, сдавливание, падение
- id: damage-type-cold
  name: "Холод"
  description: |-
