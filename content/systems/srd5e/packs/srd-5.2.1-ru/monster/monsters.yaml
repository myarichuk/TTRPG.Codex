    **_Облако насекомых._** *Спасбросок Ловкости:* СЛ 17, одно существо, которое дракон видит в пределах 120 футов. *Провал:* 22 (4d10) Ядовитого урона, и цель совершает с помехой спасброски для поддержания концентрации до конца своего следующего хода. *Провал или успех:* Дракон не может совершить это действие снова до начала своего следующего хода.

    **_Пугающее присутствие._** Дракон использует «Сотворение заклинаний» для сотворения *Страха*. Дракон не может совершить это действие снова до начала своего следующего хода.

    **_Прыжок._** Дракон может переместиться на половину своей скорости и совершает одну атаку разрывом.
