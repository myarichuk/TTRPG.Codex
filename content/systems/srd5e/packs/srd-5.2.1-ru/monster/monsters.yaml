    - **Класс доспеха:** 13
    - **Хиты:** 44 (8d8 + 8)
    - **Скорость:** 30 футов
    - **Инициатива:** +2 (12)

    |          |  СИЛ   |  ЛОВ   |  ТЕЛ   |  ИНТ   |  МДР   |  ХАР   |
    |:---:|:---:|:---:|:---:|:---:|:---:|:---:|
