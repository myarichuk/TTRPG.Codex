    #### Реакции

    **_Отражение снаряда._** *Триггер:* по великану попадает бросок дальнобойной атаки, и он получает от неё дробящий, колющий или рубящий урон. *Ответ:* великан уменьшает получаемый от атаки урон на 11 (1d10 + 6), и если урон уменьшен до 0, великан может перенаправить часть силы атаки. *Спасбросок Ловкости:* СЛ 17, одно существо, которое великан видит в пределах 60 футов. *Провал:* 11 (1d10 + 6) урона Силовым полем.
