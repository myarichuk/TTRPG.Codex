  name: "Молодой белый дракон"
  description: |-
    *Большой Дракон (цветной), хаотично-злой*

    - **Класс доспеха:** 17
    - **Хиты:** 123 (13d10 + 52)
    - **Скорость:** 40 футов, рытьё 20 футов, полёт 80 футов, плавание 40 футов
    - **Инициатива:** +3 (13)

    |          |  СИЛ   |  ЛОВ   |  ТЕЛ   |  ИНТ   |  МДР   |  ХАР   |
    |:---:|:---:|:---:|:---:|:---:|:---:|:---:|
    |   ЗНАЧ   |   18   |   10   |   18   |   6    |   11   |   12   |
    |   МОД    |   +4   |   +0   |   +4   |   -2   |   +0   |   +1   |
    |   СПАС   |   +4   |   +3   |   +4   |   -2   |   +3   |   +1   |

    - **Иммунитеты:** Холод
    - **Навыки:** Внимательность +6, Скрытность +3
    - **Чувства:** слепое зрение 30 футов, тёмное зрение 120 футов; пассивная Внимательность 16
    - **Языки:** Общий, Драконий
    - **ПО** 6 (ОО 2300; БМ +3)

    #### Особенности

    **_Хождение по льду._** Дракон может перемещаться и лазать по ледяным поверхностям без проверок способностей. Кроме того, труднопроходимая местность из льда или снега не требует дополнительного перемещения.

    #### Действия

    **_Мультиатака._** Дракон совершает три атаки разрыванием.

    **_Разрывание._** *Рукопашная атака:* +7, досягаемость 10 футов. 9 (2d4 + 4) Рубящего урона плюс 2 (1d4) урона Холодом.

    **_Ледяное дыхание (Перезарядка 5-6)._** *Спасбросок Телосложения:* СЛ 15, каждое существо в 30-футовом конусе. *Провал:* 40 (9d8) урона Холодом. *Успех:* Половина урона.
  properties:
