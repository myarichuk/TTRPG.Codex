    |   МОД    |   +0   |   +2   |   +1   |   +0   |   +2   |   +1   |
    |   СПАС   |   +0   |   +2   |   +1   |   +0   |   +4   |   +1   |

    - **Навыки:** Обман +3, Убеждение +3, Религия +2
    - **Снаряжение** Святой символ, кожаный доспех
    - **Чувства:** пассивная Внимательность 12
    - **Языки:** Общий
    - **ПО** 2 (ОО 450; БМ +2)

    #### Действия

    **_Клинок договора._** *Рукопашная атака:* +4, досягаемость 5 футов. 6 (1d8 + 2) Рубящего урона плюс 7 (2d6) Некротического урона.

    **_Колдовство._** Культист сотворяет одно из следующих заклинаний, используя Мудрость в качестве заклинательной характеристики (СЛ спасброска 12, +4 к броскам атаки заклинаниями):

    - **Неограниченно:** *Свет*, *Чудотворство*
    - **1/день каждое:** *удержание личности*
    - **2/день каждое:** *Приказ*

    #### Бонусные действия

    **_Духовное оружие (2/день)._** Культист сотворяет заклинание *духовное оружие*, используя ту же заклинательную характеристику, что и Колдовство.
