- id: adult-green-dragon
  name: "Взрослый зелёный дракон"
  description: |-
    *Огромный Дракон (цветной), принципиально-злой*

    - **Класс доспеха:** 19
    - **Хиты:** 207 (18d12 + 90)
    - **Скорость:** 40 футов, полёт 80 футов, плавание 40 футов
    - **Инициатива:** +11 (21)

    |          |  СИЛ   |  ЛОВ   |  ТЕЛ   |  ИНТ   |  МДР   |  ХАР   |
    |:---:|:---:|:---:|:---:|:---:|:---:|:---:|
    |   ЗНАЧ   |   23   |   12   |   21   |   18   |   15   |   18   |
    |   МОД    |   +6   |   +1   |   +5   |   +4   |   +2   |   +4   |
    |   СПАС   |   +6   |   +6   |   +5   |   +4   |   +7   |   +4   |

    - **Иммунитеты:** Ядовитый; Отравленный
    - **Навыки:** Обман +9, Внимательность +12, Убеждение +9, Скрытность +6
    - **Чувства:** слепое зрение 60 футов, тёмное зрение 120 футов; пассивная Внимательность 22
    - **Языки:** Общий, Драконий
    - **ПО** 15 (ОО 13 000 или 15 000 в логове; БМ +5)

    #### Особенности

    **_Амфибия._** Дракон может дышать воздухом и водой.

    **_Легендарное сопротивление (3/день, или 4/день в логове)._** Если дракон проваливает спасбросок, он может вместо этого успешно его совершить.

    #### Действия

    **_Мультиатака._** Дракон совершает три атаки разрывом. Он может заменить одну атаку использованием «Сотворение заклинаний» для сотворения *Ментального шипа* (версия 3-го уровня).

    **_Разрыв._** *Рукопашная атака:* +11, досягаемость 10 футов. 15 (2d8 + 6) Рубящего урона плюс 7 (2d6) Ядовитого урона.

    **_Ядовитое дыхание (перезарядка 5–6)._** *Спасбросок Телосложения:* СЛ 18, каждое существо в 60-футовом конусе. *Провал:* 56 (16d6) Ядовитого урона. *Успех:* Половина урона.

    **_Сотворение заклинаний._** Дракон сотворяет одно из следующих заклинаний, не требуя материальных компонентов и используя Харизму как заклинательную характеристику (СЛ спасброска 17):

    - **По желанию:** *Обнаружение магии*, *Ментальный шип*
    - **1/день каждое:** *Принуждение*

    #### Легендарные действия

    **_Вторжение в разум._** Дракон использует «Сотворение заклинаний» для сотворения *Ментального шипа* (версия 3-го уровня).

    **_Ядовитый туман._** *Спасбросок Телосложения:* СЛ 17, каждое существо в 20-футовой сфере с центром в точке, которую дракон видит в пределах 90 футов. *Провал:* 7 (2d6) Ядовитого урона, и цель получает штраф -2 к КД до конца своего следующего хода. *Провал или успех:* Дракон не может совершить это действие снова до начала своего следующего хода.

    **_Прыжок._** Дракон перемещается на половину своей скорости и совершает одну атаку разрывом.
  properties:
    speed: "40 футов, полёт 80 футов, плавание 40 футов"
    skills: "Обман +9, Внимательность +12, Убеждение +9, Скрытность +6"
    senses: "слепое зрение 60 футов, тёмное зрение 120 футов; пассивная Внимательность 22"
    languages: "Общий, Драконий"
    savingThrows: "ЛОВ +6, МДР +7"
