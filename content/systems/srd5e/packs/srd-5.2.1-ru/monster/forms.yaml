- id: werebear-bear
  name: "Вермедведь, форма медведя"
  description: |-
    *Большое Чудовище (ликантроп), нейтрально-добрый*

    - **Класс доспеха:** 15
    - **Хиты:** 135 (18d8 + 54)
    - **Скорость:** 40 футов, лазание 30 футов
    - **Инициатива:** +3 (13)

    |          |  СИЛ   |  ЛОВ   |  ТЕЛ   |  ИНТ   |  МДР   |  ХАР   |
    |:---:|:---:|:---:|:---:|:---:|:---:|:---:|
    |   ЗНАЧ   |   19   |   10   |   17   |   11   |   12   |   12   |
    |   МОД    |   +4   |   +0   |   +3   |   +0   |   +1   |   +1   |
    |   СПАС   |   +4   |   +0   |   +3   |   +0   |   +1   |   +1   |

    - **Навыки:** Внимательность +7
    - **Снаряжение** Ручные топоры (4)
    - **Чувства:** тёмное зрение 60 футов; пассивная Внимательность 17
    - **Языки:** Общий (не может говорить в форме медведя)
    - **ПО** 5 (ОО 1800; БМ +3)

    #### Действия

    **_Мультиатака._** Вермедведь совершает две атаки, используя ручной топор или разрывание в любой комбинации. Он может заменить одну атаку атакой укусом.

    **_Укус._** *Рукопашная атака:* +7, досягаемость 5 футов. 17 (2d12 + 4) Колющего урона. Если цель — гуманоид, она подвергается следующему эффекту. *Спасбросок Телосложения:* СЛ 14. *Провал:* Цель проклята. Если проклятая цель опускается до 0 хитов, она вместо этого становится вермедведем под контролем Мастера с 10 хитами. *Успех:* Цель получает иммунитет к проклятию этого вермедведя на 24 часа.

