- id: necklace-of-adaptation
  name: "Ожерелье адаптации"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите это ожерелье, вы можете нормально дышать в любой среде и совершаете с преимуществом спасброски, чтобы избежать или прекратить состояние «Отравленный».
# source: OmnisGM (CC BY 4.0)
- id: necklace-of-fireballs
  name: "Ожерелье огненных шаров"
  description: |-
    *Чудесный предмет, редкий*

    На этом ожерелье висит 1d6 + 3 бусины. Вы можете действием «Магия» отсоединить бусину и бросить её на расстояние до 60 футов. Достигнув конца траектории, бусина взрывается как *Огненный шар* 3-го уровня (СЛ спасброска 15).

    Вы можете метнуть несколько бусин или даже всё ожерелье за один раз. В этом случае увеличьте урон *Огненного шара* на 1d6 за каждую бусину после первой (максимум 12d6).
# source: OmnisGM (CC BY 4.0)
- id: necklace-of-prayer-beads
  name: "Ожерелье молитвенных бусин"
  description: |-
    *Чудесный предмет, редкий (требуется настройка жрецом, друидом или паладином)*

    На этом ожерелье 1d4 + 2 магические бусины из аквамарина, чёрного жемчуга или топаза. Также на нём много немагических бусин из таких камней, как янтарь, гелиотроп, цитрин, коралл, нефрит, жемчуг или кварц. Если магическую бусину снять с ожерелья, она теряет свою магию.

    Существует шесть типов магических бусин. Мастер решает тип каждой бусины на ожерелье или определяет его случайно броском по таблице ниже. На ожерелье может быть несколько бусин одного типа. Чтобы использовать бусину, вы должны носить ожерелье. Каждая бусина содержит заклинание, которое вы можете сотворить из неё бонусным действием (используя СЛ спасброска от ваших заклинаний, если нужен спасбросок). После того как заклинание магической бусины сотворено, эту бусину нельзя использовать снова до следующего рассвета.

    | 1d20  | Бусина | Заклинание |
    |---|---|---|
    | 1–6   | Бусина благословения | Благословение |
    | 7–12  | Бусина исцеления | Лечение ран (версия 2-го уровня) |
    | 13–16 | Бусина благоволения | Высшее восстановление |
    | 17–18 | Бусина кары | Сияющая кара |
    | 19    | Бусина призыва | Страж веры |
    | 20    | Бусина хождения по ветру | Хождение по ветру |
# source: OmnisGM (CC BY 4.0)
- id: nine-lives-stealer
  name: "Девятижизненный похититель"
  description: |-
    *Оружие (любое простое или воинское), очень редкий (требуется настройка)*

    Вы получаете бонус +2 к броскам атаки и урона этим магическим оружием.

    **_Похищение жизни._** Оружие имеет 1d8 + 1 заряд. Когда вы атакуете этим оружием существо, имеющее менее 100 хитов, и выбрасываете 20 на d20 для броска атаки, существо должно преуспеть в спасброске Телосложения со СЛ 15 или быть мгновенно убитым, когда меч вырывает жизненную силу из его тела. Конструкты и Нежить автоматически преуспевают в спасброске. Если существо убито, оружие теряет 1 заряд. Когда у оружия не остаётся зарядов, оно теряет это свойство.
# source: OmnisGM (CC BY 4.0)
- id: oil-of-etherealness
  name: "Масло эфирности"
  description: |-
    *Зелье, редкий*

    Одного флакона этого масла хватает, чтобы покрыть одно существо размера Средний или меньше вместе со снаряжением, которое оно носит и несёт (за каждую категорию размера больше Среднего требуется один дополнительный флакон). Нанесение масла занимает 10 минут. Затем существо, на которое оно нанесено, получает эффект заклинания *Эфирность* на 1 час.

    Капли этого мутного серого масла образуются снаружи его сосуда и быстро испаряются.
# source: OmnisGM (CC BY 4.0)
- id: oil-of-sharpness
  name: "Масло остроты"
  description: |-
    *Зелье, очень редкий*

    Одного флакона этого масла хватает, чтобы покрыть одно оружие ближнего боя или двадцать единиц боеприпасов, но действует оно только на боеприпасы и оружие ближнего боя, которые немагические и наносят Рубящий или Колющий урон. Нанесение масла занимает 1 минуту, после чего масло магически впитывается в то, что покрывает, превращая покрытое оружие в *Оружие +3*, а покрытые боеприпасы — в *Боеприпасы +3*.

    Это прозрачное желеобразное масло искрится крошечными сверхтонкими серебряными осколками.
# source: OmnisGM (CC BY 4.0)
- id: oil-of-slipperiness
  name: "Масло скольжения"
  description: |-
    *Зелье, необычный*

    Одного флакона этого масла хватает, чтобы покрыть одно существо размера Средний или меньше вместе со снаряжением, которое оно носит и несёт (за каждую категорию размера больше Среднего требуется один дополнительный флакон). Нанесение масла занимает 10 минут. Затем существо, на которое оно нанесено, получает эффект заклинания *Свобода перемещения* на 8 часов.

    Как вариант, масло можно вылить на землю действием «Магия», где оно покрывает квадрат 10 на 10 футов, воспроизводя эффект заклинания *Скольжение* в этой области на 8 часов.

    Эта липкая чёрная мазь густая и тяжёлая, но при выливании течёт быстро.
# source: OmnisGM (CC BY 4.0)
