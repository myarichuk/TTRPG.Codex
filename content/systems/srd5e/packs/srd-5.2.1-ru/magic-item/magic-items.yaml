    Пока вы носите этот кулон, вы можете действием «Магия» восстановить 2d4 + 2 хита. После использования это свойство нельзя использовать снова до следующего рассвета.

    Кроме того, пока вы носите этот кулон, вы совершаете с преимуществом спасброски, чтобы избежать или прекратить состояние «Отравленный».
# source: OmnisGM (CC BY 4.0)
- id: periapt-of-proof-against-poison
  name: "Кулон защиты от яда"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    На этой изящной серебряной цепочке висит кулон из чёрного самоцвета бриллиантовой огранки. Пока вы носите его, вы имеете иммунитет к состоянию «Отравленный» и урону Ядом.
# source: OmnisGM (CC BY 4.0)
- id: periapt-of-wound-closure
  name: "Кулон заживления ран"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот кулон, вы получаете следующие преимущества.

    **_Сохранение жизни._** Каждый раз, когда вы совершаете спасбросок от смерти, вы можете изменить результат 9 или ниже на 10, превращая проваленный спасбросок в успешный.

    **_Усиление естественного лечения._** Каждый раз, когда вы бросаете Кость Хитов, чтобы восстановить хиты, удвойте число восстановленных хитов.
# source: OmnisGM (CC BY 4.0)
- id: philter-of-love
  name: "Приворотное зелье"
  description: |-
    *Зелье, необычный*

    В следующий раз, когда вы увидите существо в течение 10 минут после того, как выпили это зелье, вы очарованы этим существом и получаете состояние «Очарованный» на 1 час.

    Эта розоватая шипучая жидкость содержит один легко не заметный пузырёк в форме сердца.
# source: OmnisGM (CC BY 4.0)
- id: pipes-of-haunting
  name: "Флейта преследования"
  description: |-
    *Чудесный предмет, необычный*

    Эта флейта имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Вы можете действием «Магия» сыграть на ней и израсходовать 1 заряд, чтобы создать жуткую, завораживающую мелодию. Каждое существо по вашему выбору в пределах 30 футов от вас должно преуспеть в спасброске Мудрости со СЛ 15 или получить состояние «Испуганный» на 1 минуту. Существо, провалившее спасбросок, повторяет его в конце каждого своего хода, прекращая эффект на себе при успехе. Существо, преуспевшее в спасброске, невосприимчиво к эффекту этой флейты в течение 24 часов.
# source: OmnisGM (CC BY 4.0)
- id: pipes-of-the-sewers
  name: "Свирель канализации"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока эта свирель при вас, обычные крысы и гигантские крысы Безразличны к вам и не нападут на вас, если вы не угрожаете им и не причиняете вреда.

    Свирель имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Если вы играете на свирели действием «Магия», вы можете бонусным действием израсходовать от 1 до 3 зарядов, призывая один **Рой крыс** за каждый израсходованный заряд, если в пределах полумили от вас достаточно крыс, чтобы призвать их таким образом (по решению Мастера). Если крыс недостаточно, чтобы образовать рой, заряд тратится впустую. Призванные рои движутся к музыке по кратчайшему доступному пути, но в остальном не находятся под вашим контролем.

    Каждый раз, когда **Рой крыс**, не находящийся под контролем другого существа, оказывается в пределах 30 футов от вас, пока вы играете на свирели, рой совершает спасбросок Мудрости со СЛ 15. При успехе рой ведёт себя как обычно и не поддаётся музыке свирели в течение следующих 24 часов. При провале рой поддаётся музыке свирели и становится Дружественным к вам и вашим союзникам, пока вы продолжаете играть на свирели каждый раунд действием «Магия». Дружественный рой подчиняется вашим командам. Если вы не отдаёте команд Дружественному рою, он защищается, но в остальном не совершает действий. Если Дружественный рой начинает свой ход дальше 30 футов от вас, ваш контроль над этим роем заканчивается, и рой ведёт себя как обычно и не поддаётся музыке свирели в течение следующих 24 часов.
# source: OmnisGM (CC BY 4.0)
- id: plate-armor-of-etherealness
  name: "Латный доспех эфирности"
  description: |-
    *Доспех (полулатный доспех или латный доспех), легендарный (требуется настройка)*

    Пока вы носите этот доспех, вы можете действием «Магия» и с помощью командного слова получить эффект заклинания *Эфирность*. Заклинание немедленно заканчивается, если вы снимаете доспех или действием «Магия» повторяете командное слово. Это свойство доспеха нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: portable-hole
  name: "Переносная дыра"
  description: |-
    *Чудесный предмет, редкий*

    Эта тонкая чёрная ткань, мягкая как шёлк, сложена до размеров носового платка. Она разворачивается в круглый лист диаметром 6 футов.

    Вы можете действием «Магия» развернуть *Переносную дыру* и разместить её на твёрдой поверхности или прислонить к ней, после чего *Переносная дыра* создаёт внепространственную дыру глубиной 10 футов. Цилиндрическое пространство внутри дыры существует в другом плане существования, поэтому её нельзя использовать для создания открытых проходов. Любое существо внутри открытой *Переносной дыры* может выбраться из дыры, вылезая из неё.

    Вы можете действием «Магия» закрыть *Переносную дыру*, взявшись за края ткани и сложив её. Складывание ткани закрывает дыру, и любые существа или объекты внутри остаются во внепространственном пространстве. Что бы в ней ни находилось, дыра весит почти ничего.

    Если дыра сложена, существо во внепространственном пространстве дыры может действием совершить проверку Силы (Атлетика) со СЛ 10. При успехе существо силой пробивается наружу и появляется в пределах 5 футов от *Переносной дыры*. Закрытая *Переносная дыра* содержит достаточно воздуха на 1 час дыхания, делённого на количество дышащих существ внутри.

    Помещение *Переносной дыры* во внепространственное пространство, созданное *Сумкой вместимости*, *Практичным рюкзаком* или подобным предметом, мгновенно уничтожает оба предмета и открывает врата в Астральный План. Врата возникают там, где один предмет был помещён в другой. Любое существо в пределах 10 футов от врат и не находящееся за полным укрытием засасывается сквозь них и переносится в случайное место на Астральном Плане. Затем врата закрываются. Врата односторонние и не могут быть открыты снова.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-animal-friendship
  name: "Зелье дружбы с животными"
  description: |-
    *Зелье, необычный*

    Когда вы выпиваете это зелье, вы можете сотворить версию заклинания *Дружба с животными* 3-го уровня (СЛ спасброска 13).

    Если взболтать мутную жидкость этого зелья, в ней проступают мелкие частицы: рыбья чешуйка, пёрышко колибри, кошачий коготь или беличий волосок.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-clairvoyance
  name: "Зелье ясновидения"
  description: |-
    *Зелье, редкий*

    Когда вы выпиваете это зелье, вы получаете эффект заклинания *Ясновидение* (Концентрация не требуется).

    В желтоватой жидкости этого зелья покачивается глазное яблоко, но оно исчезает, когда зелье открывают.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-climbing
  name: "Зелье лазания"
  description: |-
    *Зелье, обычный*

    Когда вы выпиваете это зелье, вы получаете скорость лазания, равную вашей скорости, на 1 час. В течение этого времени вы совершаете с преимуществом проверки Силы (Атлетика) для лазания.

    Это зелье разделено на коричневый, серебристый и серый слои, напоминающие полосы камня. Взбалтывание бутылки не смешивает цвета.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-diminution
  name: "Зелье уменьшения"
  description: |-
    *Зелье, редкий*

    Когда вы выпиваете это зелье, вы получаете эффект «уменьшение» заклинания *Увеличение/уменьшение* на 1d4 часа (Концентрация не требуется).

    Красный цвет в жидкости зелья непрерывно сжимается в крошечную каплю, а затем расширяется, окрашивая прозрачную жидкость вокруг. Взбалтывание бутылки не прерывает этот процесс.
# source: OmnisGM (CC BY 4.0); differs from our English, see tools/omnisgm-import/README
- id: potion-of-flying
  name: "Зелье полёта"
  description: |-
    *Зелье, очень редкий*

    Когда вы выпиваете это зелье, вы получаете скорость полёта, равную вашей скорости, на 1 час и можете парить. Если вы находитесь в воздухе, когда действие зелья заканчивается, вы падаете, если у вас нет иного способа удержаться в воздухе.

    Прозрачная жидкость этого зелья плавает в верхней части сосуда, и в ней дрейфуют мутные белые примеси.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-gaseous-form
  name: "Зелье газообразной формы"
  description: |-
    *Зелье, редкий*

    Когда вы выпиваете это зелье, вы получаете эффект заклинания *Газообразная форма* на 1 час (Концентрация не требуется) или пока не прекратите эффект бонусным действием.

    Кажется, что сосуд этого зелья содержит туман, который движется и льётся как вода.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-giant-strength
  name: "Зелье силы великана"
  description: |-
    *Зелье, редкость варьируется*

    Когда вы выпиваете это зелье, значение вашей Силы меняется на 1 час. Значение определяется типом великана (см. таблицу ниже). Зелье не действует на вас, если ваша Сила равна этому значению или превышает его.

    В прозрачной жидкости этого зелья плавает крупица света, напоминающая ноготь великана.

    | Зелье | Сил. | Редкость |
    |---|---|---|
    | Зелье силы великана (холмового) | 21 | Необычный |
    | Зелье силы великана (ледяного или каменного) | 23 | Редкий |
    | Зелье силы великана (огненного) | 25 | Редкий |
    | Зелье силы великана (облачного) | 27 | Очень редкий |
    | Зелье силы великана (штормового) | 29 | Легендарный |
# source: OmnisGM (CC BY 4.0)
- id: potion-of-growth
  name: "Зелье роста"
  description: |-
    *Зелье, необычный*

    Когда вы выпиваете это зелье, вы получаете эффект «увеличение» заклинания *Увеличение/уменьшение* на 10 минут (Концентрация не требуется).

    Красный цвет в жидкости зелья непрерывно расширяется из крошечной капли, окрашивая прозрачную жидкость вокруг, а затем сжимается. Взбалтывание бутылки не прерывает этот процесс.
# source: OmnisGM (CC BY 4.0); differs from our English, see tools/omnisgm-import/README
- id: potion-of-heroism
  name: "Зелье героизма"
  description: |-
    *Зелье, редкий*

    Когда вы выпиваете это зелье, вы получаете 10 временных хитов, которые длятся 1 час. На ту же длительность вы находитесь под эффектом заклинания *Благословение* (Концентрация не требуется).

    Синяя жидкость этого зелья пузырится и парит, будто кипит.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-invisibility
  name: "Зелье невидимости"
  description: |-
    *Зелье, редкий*

    Сосуд этого зелья выглядит пустым, но на ощупь кажется, что в нём есть жидкость. Когда вы выпиваете зелье, вы получаете состояние «Невидимый» на 1 час. Эффект заканчивается раньше, если вы совершаете бросок атаки, наносите урон или сотворяете заклинание.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-mind-reading
  name: "Зелье чтения мыслей"
  description: |-
    *Зелье, редкий*

    Когда вы выпиваете это зелье, вы получаете эффект заклинания *Обнаружение мыслей* (СЛ спасброска 13) на 10 минут (Концентрация не требуется).

    В плотной пурпурной жидкости этого зелья плавает яйцевидное розовое облачко.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-poison
  name: "Зелье яда"
  description: |-
    *Зелье, необычный*

    Это варево выглядит, пахнет и на вкус как *Зелье лечения* или другое полезное зелье. Однако на деле это яд, скрытый магией иллюзий. *Опознание* раскрывает его истинную природу.

    Если вы выпьете это зелье, вы получаете 4d6 Урона ядом и должны преуспеть в спасброске Телосложения со СЛ 13 или получить состояние «Отравленный» на 1 час.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-resistance
  name: "Зелье сопротивления"
  description: |-
    *Зелье, необычный*

    Когда вы выпиваете это зелье, вы обладаете сопротивлением одному типу урона на 1 час. Мастер выбирает тип или определяет его случайно броском по следующей таблице.

    | 1d10 | Тип урона |
    |---|---|
    | 1    | Кислота       |
    | 2    | Холод         |
    | 3    | Огонь         |
    | 4    | Силовое поле  |
    | 5    | Электричество |
    | 6    | Некротический |
    | 7    | Яд            |
    | 8    | Психический   |
    | 9    | Излучение     |
    | 10   | Гром          |
# source: OmnisGM (CC BY 4.0)
- id: potion-of-speed
  name: "Зелье скорости"
  description: |-
    *Зелье, очень редкий*

    Когда вы выпиваете это зелье, вы получаете эффект заклинания *Ускорение* на 1 минуту (Концентрация не требуется), не страдая от волны апатии, которая обычно возникает при окончании эффекта.

    Жёлтая жидкость этого зелья испещрена чёрными прожилками и сама по себе кружится.
# source: OmnisGM (CC BY 4.0)
- id: potion-of-water-breathing
  name: "Зелье водного дыхания"
  description: |-
    *Зелье, необычный*

    Выпив это зелье, вы можете дышать под водой в течение 24 часов.

    Мутная зелёная жидкость этого зелья пахнет морем, и в ней плавает похожий на медузу пузырёк.
# source: OmnisGM (CC BY 4.0)
- id: potions-of-healing
  name: "Зелья лечения"
  description: |-
    *Зелье, редкость варьируется*

    Вы восстанавливаете хиты, когда выпиваете это зелье. Число хитов зависит от редкости зелья, как показано в таблице ниже.

    Какова бы ни была его сила, красная жидкость зелья мерцает при взбалтывании.

    | Зелье | Восстановление хитов | Редкость |
    |---|---|---|
    | Зелье лечения | 2d4 + 2 | Обычный |
    | Зелье лечения (усиленное) | 4d4 + 4 | Необычный |
    | Зелье лечения (превосходное) | 8d4 + 8 | Редкий |
    | Зелье лечения (высшее) | 10d4 + 20 | Очень редкий |
# source: OmnisGM (CC BY 4.0)
- id: ring-of-animal-influence
  name: "Кольцо власти над животными"
  description: |-
    *Кольцо, редкий*

    Это кольцо имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Нося кольцо, вы можете израсходовать 1 заряд, чтобы сотворить из него одно из следующих заклинаний (СЛ спасброска 13):

    - *Дружба с животными*
    - *Страх* (действует только на Зверей)
    - *Разговор с животными*
# source: OmnisGM (CC BY 4.0)
- id: ring-of-djinni-summoning
  name: "Кольцо призыва джинна"
  description: |-
    *Кольцо, легендарный (требуется настройка)*

    Нося это кольцо, вы можете действием «Магия» призвать определённого **Джинна** со Стихийного Плана Воздуха. Джинн появляется в выбранном вами свободном пространстве в пределах 120 футов от вас. Он остаётся, пока вы поддерживаете Концентрацию, но не дольше 1 часа, или пока не опустится до 0 хитов.

    Будучи призванным, джинн Дружественен к вам и вашим союзникам и подчиняется вашим командам. Если вы не отдаёте ему команд, джинн защищается от нападающих, но не предпринимает иных действий.

    После того как джинн исчезает, его нельзя призвать снова в течение 24 часов, а если джинн погибает, кольцо становится немагическим.

    *Кольца призыва джинна* часто создаются теми джиннами, которых они призывают, и даруются смертным как знаки дружбы или уважения.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-elemental-command
  name: "Кольцо повеления стихиями"
  description: |-
    *Кольцо, легендарный (требуется настройка)*

    Каждое *Кольцо повеления стихиями* связано с одним из четырёх Стихийных Планов. Мастер выбирает или определяет случайно, с каким планом оно связано. Например, *Кольцо повеления стихиями* (воздух) связано со Стихийным Планом Воздуха.

    Каждое *Кольцо повеления стихиями* обладает следующими двумя свойствами:

    **_Гроза стихий._** Нося кольцо, вы совершаете с преимуществом броски атаки против Элементалей, а они совершают с помехой броски атаки против вас.

    **_Принуждение стихий._** Нося кольцо, вы можете действием «Магия» попытаться подчинить Элементаля, которого видите в пределах 60 футов от вас. Элементаль совершает спасбросок Мудрости со СЛ 18. При провале Элементаль получает состояние «Очарованный» до начала вашего следующего хода, и вы определяете, как он использует своё перемещение и действие в свой следующий ход.

    **_Фокус стихии._** Нося кольцо, вы получаете дополнительные свойства, соответствующие Стихийному Плану, с которым связано кольцо:

    **Воздух.** Вы знаете ауранский язык, обладаете сопротивлением Урону электричеством и имеете скорость полёта, равную вашей скорости, и можете парить.

    **Земля.** Вы знаете терранский язык и обладаете сопротивлением Кислотному урону. Местность из щебня, камней или земли не является для вас труднопроходимой. Кроме того, вы можете перемещаться сквозь сплошную землю или камень так, будто это труднопроходимая местность, не тревожа материал, сквозь который проходите. Если вы заканчиваете ход внутри сплошной земли или камня, вас выталкивает в ближайшее свободное пространство, которое вы занимали последним.

    **Огонь.** Вы знаете игнанский язык и обладаете иммунитетом к Огненному урону.

    **Вода.** Вы знаете акванский язык, получаете скорость плавания 60 футов и можете дышать под водой.

    **_Сотворение заклинаний._** Кольцо имеет 5 зарядов и восстанавливает 1d4 + 1 израсходованных заряда ежедневно на рассвете. Нося кольцо, вы можете сотворять из него заклинание. Выбирайте заклинание из списка доступных в зависимости от Стихийного Плана, с которым связано кольцо, как показано в следующей таблице. В таблице указано, сколько зарядов нужно израсходовать, чтобы сотворить заклинание, чья СЛ спасброска равна 18.

    | План | Заклинания (заряды)                                                                                                              |
    |---|---|
    | Воздух | Цепная молния (3 заряда), Падение пёрышком (0 зарядов), Порыв ветра (2 заряда), Стена ветра (1 заряд)                          |
    | Земля | Землетрясение (5 зарядов), Изменение формы камня (2 заряда), Каменная кожа (3 заряда), Каменная стена (3 заряда)                |
    | Огонь | Огненные руки (1 заряд), Огненный шар (2 заряда), Огненная буря (4 заряда), Стена огня (3 заряда)                              |
    | Вода | Сотворение или уничтожение воды (1 заряд), Град (2 заряда), Цунами (5 зарядов), Стена льда (3 заряда), Хождение по воде (2 заряда) |
# source: OmnisGM (CC BY 4.0)
- id: ring-of-evasion
  name: "Кольцо уклонения"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Это кольцо имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Когда вы проваливаете спасбросок Ловкости, нося это кольцо, вы можете реакцией израсходовать 1 заряд, чтобы вместо этого преуспеть в этом спасброске.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-feather-falling
  name: "Кольцо падения пёрышком"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Когда вы падаете, нося это кольцо, вы опускаетесь на 60 футов за раунд и не получаете урона от падения.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-free-action
  name: "Кольцо свободного действия"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Пока вы носите это кольцо, труднопроходимая местность не стоит вам дополнительного перемещения. Кроме того, магия не может ни уменьшить любую из ваших скоростей, ни вызвать у вас состояние «Парализованный» или «Опутанный».
# source: OmnisGM (CC BY 4.0)
- id: ring-of-invisibility
  name: "Кольцо невидимости"
  description: |-
    *Кольцо, легендарный (требуется настройка)*

    Нося это кольцо, вы можете действием «Магия» дать себе состояние «Невидимый». Вы остаётесь Невидимым, пока кольцо не снято или пока вы бонусным действием не станете снова видимым.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-jumping
  name: "Кольцо прыжков"
  description: |-
    *Кольцо, необычный (требуется настройка)*

    Нося это кольцо, вы можете сотворять из него *Прыжок*, но при этом можете нацеливаться только на себя.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-mind-shielding
  name: "Кольцо защиты разума"
  description: |-
    *Кольцо, необычный (требуется настройка)*

    Нося это кольцо, вы невосприимчивы к магии, позволяющей другим существам читать ваши мысли, определять, лжёте ли вы, узнавать ваше мировоззрение или ваш тип существа. Существа могут телепатически общаться с вами, только если вы это позволите.

    Вы можете действием «Магия» сделать кольцо неощутимым, пока другим действием «Магия» не сделаете его вновь ощутимым, пока не снимете кольцо или пока не умрёте.

    Если вы умираете, нося кольцо, ваша душа входит в него, если только оно уже не содержит другую душу. Вы можете оставаться в кольце или отправиться в загробную жизнь. Пока ваша душа в кольце, вы можете телепатически общаться с любым существом, носящим его. Носитель не может воспрепятствовать этому телепатическому общению.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-protection
  name: "Кольцо защиты"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Нося это кольцо, вы получаете бонус +1 к Классу доспеха и спасброскам.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-regeneration
  name: "Кольцо регенерации"
  description: |-
    *Кольцо, очень редкий (требуется настройка)*

    Нося это кольцо, вы восстанавливаете 1d6 хитов каждые 10 минут, если у вас есть хотя бы 1 хит. Если вы теряете часть тела, кольцо заставляет недостающую часть отрасти заново и полностью восстановить работоспособность через 1d6 + 1 дней, если всё это время у вас есть хотя бы 1 хит.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-resistance
  name: "Кольцо сопротивления"
  description: |-
    *Кольцо, редкий*

    Нося это кольцо, вы обладаете сопротивлением одному типу урона. Тип указывает самоцвет в кольце; Мастер выбирает его или определяет случайно броском по следующей таблице.

    | 1d10 | Тип урона | Самоцвет   |
    |---|---|---|
    | 1    | Кислота       | Жемчуг    |
    | 2    | Холод         | Турмалин  |
    | 3    | Огонь         | Гранат    |
    | 4    | Силовое поле  | Сапфир    |
    | 5    | Электричество | Цитрин    |
    | 6    | Некротический | Гагат     |
    | 7    | Яд            | Аметист   |
    | 8    | Психический   | Нефрит    |
    | 9    | Излучение     | Топаз     |
    | 10   | Гром          | Шпинель   |
# source: OmnisGM (CC BY 4.0)
- id: ring-of-shooting-stars
  name: "Кольцо стрельбы звёздами"
  description: |-
    *Кольцо, очень редкий (требуется настройка)*

    Вы можете сотворять из кольца *Танцующие огоньки* или *Свет*.

    Кольцо имеет 6 зарядов и восстанавливает 1d6 израсходованных зарядов ежедневно на рассвете. Вы можете расходовать его заряды, чтобы использовать свойства ниже.

    **_Огонь фей._** Вы можете израсходовать 1 заряд, чтобы сотворить из кольца *Огонь фей*.

    **_Молниевые сферы._** Вы можете действием «Магия» израсходовать 2 заряда, чтобы создать до четырёх сфер молний диаметром 3 фута.

    Каждая сфера появляется в свободном пространстве, которое вы видите в пределах 120 футов от вас. Сферы существуют, пока вы поддерживаете Концентрацию, но не дольше 1 минуты. Каждая сфера испускает тусклый свет в радиусе 30 футов.

    Бонусным действием вы можете переместить каждую сферу на расстояние до 30 футов, но не далее 120 футов от вас. Когда сфера впервые оказывается в пределах 5 футов от существа, кроме вас, не находящегося за полным укрытием, сфера разряжает молнию в это существо и исчезает. Это существо совершает спасбросок Ловкости со СЛ 15. При провале существо получает Урон электричеством в зависимости от числа созданных вами сфер, как показано в следующей таблице. При успехе существо получает половину этого урона.

    | Число сфер | Урон электричеством | Число сфер | Урон электричеством |
    |---|---|---|---|
    | 1                 | 4d12             | 3                 | 2d6              |
    | 2                 | 5d4              | 4                 | 2d4              |

    **_Падающие звёзды._** Вы можете действием «Магия» израсходовать от 1 до 3 зарядов. За каждый израсходованный заряд вы запускаете из кольца светящуюся искру света в точку, которую видите в пределах 60 футов от вас. Каждое существо в 15-футовом Кубе, исходящем из этой точки, осыпается искрами и совершает спасбросок Ловкости со СЛ 15, получая 5d4 Урона излучением при провале или половину этого урона при успехе.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-spell-storing
  name: "Кольцо хранения заклинаний"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Это кольцо хранит сотворённые в него заклинания, удерживая их, пока настроенный носитель не использует их. Кольцо может хранить одновременно заклинания суммарно до 5 уровней. При обнаружении оно содержит 1d6 − 1 уровней хранимых заклинаний, выбранных Мастером.

    Любое существо может сотворить в кольцо заклинание с 1-го по 5-й уровень, коснувшись кольца во время сотворения. Заклинание не оказывает никакого эффекта, кроме того, что сохраняется в кольце. Если кольцо не может вместить заклинание, заклинание расходуется без эффекта. Уровень ячейки, использованной для сотворения заклинания, определяет, сколько места оно занимает.

    Нося это кольцо, вы можете сотворить любое хранимое в нём заклинание. Заклинание использует уровень ячейки, СЛ спасброска заклинания, бонус атаки заклинанием и характеристику для сотворения заклинаний исходного заклинателя, но в остальном считается, будто заклинание сотворили вы. Сотворённое из кольца заклинание больше не хранится в нём, освобождая место.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-spell-turning
  name: "Кольцо отражения заклинаний"
  description: |-
    *Кольцо, легендарный (требуется настройка)*

    Нося это кольцо, вы совершаете с преимуществом спасброски против заклинаний. Если вы преуспеваете в спасброске против заклинания 7-го уровня или ниже, заклинание не действует на вас. Если это заклинание было нацелено только на вас и не создавало области воздействия, вы можете реакцией отразить заклинание обратно в его заклинателя; заклинатель должен совершить спасбросок против заклинания, используя свою собственную СЛ спасброска заклинания.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-swimming
  name: "Кольцо плавания"
  description: |-
    *Кольцо, необычный*

    Нося это кольцо, вы обладаете скоростью плавания 40 футов.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-telekinesis
  name: "Кольцо телекинеза"
  description: |-
    *Кольцо, очень редкий (требуется настройка)* Нося это кольцо, вы можете сотворять из него *Телекинез*.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-the-ram
  name: "Кольцо тарана"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Это кольцо имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Нося кольцо, вы можете действием «Магия» израсходовать от 1 до 3 зарядов, чтобы совершить дальнобойную атаку заклинанием по одному существу, которое видите в пределах 60 футов от вас. Кольцо создаёт призрачную голову барана и совершает бросок атаки с бонусом +7. При попадании за каждый израсходованный заряд цель получает 2d10 урона Силовым полем и отталкивается на 5 футов от вас.

    Также вы можете действием «Магия» израсходовать от 1 до 3 зарядов кольца, чтобы попытаться сломать немагический объект, который видите в пределах 60 футов от вас и который никто не носит и не несёт. Кольцо совершает проверку Силы с бонусом +5 за каждый израсходованный заряд.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-three-wishes
  name: "Кольцо трёх желаний"
  description: |-
    *Кольцо, легендарный*

    Нося это кольцо, вы можете израсходовать 1 из его 3 зарядов, чтобы сотворить из него *Исполнение желаний*. Кольцо становится немагическим, когда вы используете последний заряд.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-warmth
  name: "Кольцо тепла"
  description: |-
    *Кольцо, необычный (требуется настройка)*

    Если вы получаете Холодный урон, нося это кольцо, кольцо уменьшает получаемый вами урон на 2d8.

    Кроме того, пока вы носите это кольцо, вы и всё, что вы носите и несёте, не подвержены вреду от температур 0 градусов по Фаренгейту и ниже.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-water-walking
  name: "Кольцо хождения по воде"
  description: |-
    *Кольцо, необычный*

    Нося это кольцо, вы сотворяете из него *Хождение по воде*, нацеливаясь только на себя.
# source: OmnisGM (CC BY 4.0)
- id: ring-of-x-ray-vision
  name: "Кольцо рентгеновского зрения"
  description: |-
    *Кольцо, редкий (требуется настройка)*

    Нося это кольцо, вы можете действием «Магия» получить рентгеновское зрение с дистанцией 30 футов на 1 минуту. Для вас сплошные объекты в этом радиусе кажутся прозрачными и не мешают свету проходить сквозь них. Зрение проникает сквозь 1 фут камня, 1 дюйм обычного металла или до 3 футов дерева или земли. Более толстые материалы или тонкий лист свинца блокируют это зрение.

    Каждый раз, когда вы используете кольцо снова до долгого отдыха, вы должны преуспеть в спасброске Телосложения со СЛ 15 или получить 1 уровень Истощения.
# source: OmnisGM (CC BY 4.0)
- id: robe-of-eyes
  name: "Мантия глаз"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Эта мантия украшена узорами, похожими на глаза. Пока вы носите мантию, вы получаете следующие преимущества:

    **Круговое зрение.** Мантия даёт вам преимущество на проверки Мудрости (Внимательность), полагающиеся на зрение.

    **Особые чувства.** Вы обладаете тёмным зрением и истинным зрением, оба с дистанцией 120 футов.

    **_Недостатки._** Заклинание *Свет*, сотворённое на мантию, или заклинание *Дневной свет*, сотворённое в пределах 5 футов от мантии, даёт вам состояние «Ослеплённый» на 1 минуту. В конце каждого своего хода вы совершаете спасбросок Телосложения (СЛ 11 для *Света* или СЛ 15 для *Дневного света*), прекращая это состояние на себе при успехе.
# source: OmnisGM (CC BY 4.0)
- id: robe-of-scintillating-colors
  name: "Мантия мерцающих цветов"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Эта мантия имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Пока вы носите её, вы можете действием «Магия» израсходовать 1 заряд, чтобы одеяние начало отображать переливающийся узор ослепительных красок до конца вашего следующего хода. В это время мантия испускает яркий свет в радиусе 30 футов и тусклый свет ещё на 30 футов, и существа, которые видят вас, совершают с помехой броски атаки против вас. Любое существо в ярком свете, которое видит вас в момент активации силы мантии, должно преуспеть в спасброске Мудрости со СЛ 15 или получить состояние «Ошеломлённый», пока эффект не закончится.
# source: OmnisGM (CC BY 4.0)
- id: robe-of-stars
  name: "Мантия звёзд"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Эта чёрная или тёмно-синяя мантия расшита маленькими белыми или серебряными звёздами. Пока вы носите её, вы получаете бонус +1 к спасброскам.

    Шесть звёзд в верхней передней части мантии особенно велики. Нося эту мантию, вы можете действием «Магия» снять одну из звёзд и израсходовать её, чтобы сотворить *Магическую стрелу* на уровне 5. Ежедневно в сумерках на мантии вновь появляются 1d6 снятых звёзд.

    Пока вы носите мантию, вы можете действием «Магия» переместиться на Астральный План вместе со всем, что носите и несёте. Вы остаётесь там, пока действием «Магия» не вернётесь на план, на котором были. Вы вновь появляетесь в последнем занятом вами пространстве или, если оно занято, в ближайшем свободном пространстве.
# source: OmnisGM (CC BY 4.0)
- id: robe-of-the-archmagi
  name: "Мантия архимага"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка чародеем, колдуном или волшебником)*

    Это элегантное одеяние сшито из изысканной ткани и украшено рунами.

    Пока вы носите мантию, вы получаете следующие преимущества. *Доспех.* Если вы не носите доспех, ваш базовый Класс доспеха равен 15 плюс модификатор Ловкости. *Сопротивление магии.* Вы совершаете с преимуществом спасброски против заклинаний и других магических эффектов. *Боевой маг.* СЛ спасброска ваших заклинаний и бонус атаки заклинанием увеличиваются на 2 каждый.
# source: OmnisGM (CC BY 4.0)
- id: robe-of-useful-items
  name: "Мантия полезных вещей"
  description: |-
    *Чудесный предмет, необычный*

    Эту мантию покрывают тканевые заплатки различных форм и цветов. Нося мантию, вы можете действием «Магия» оторвать одну из заплаток, заставив её стать объектом или существом, которое она представляет. Когда последняя заплатка оторвана, мантия становится обычной одеждой.

    Мантия имеет по две заплатки каждого из следующих видов:

    - Направленный фонарь (заправленный и зажжённый)
    - Кинжал
    - Зеркало
    - Шест
    - Верёвка (свёрнутая)
    - Мешок

    Кроме того, мантия имеет 4d4 других заплаток. Мастер выбирает заплатки или определяет их случайно броском по следующей таблице.

    | 1d100 | Заплатка                                                                                                                                                |
    |---|---|
    | 01–08 | Сумка со 100 зм                                                                                                                                         |
    | 09–15 | Серебряный ларец (1 фут длиной, 6 дюймов шириной и глубиной) стоимостью 500 зм                                                                          |
    | 16–22 | Железная дверь (до 10 футов шириной и 10 футов высотой, с засовом на выбранной вами стороне), которую вы можете разместить в проёме, до которого дотягиваетесь; она подгоняется под проём, сама закрепляясь и навешиваясь на петли |
    | 23–30 | 10 самоцветов стоимостью 100 зм каждый                                                                                                                  |
    | 31–44 | Деревянная лестница (24 фута длиной)                                                                                                                    |
    | 45–51 | Верховая лошадь с верховым седлом                                                                                                                       |
    | 52–59 | Открытая яма (Куб 10 футов), которую вы можете разместить на земле в пределах 10 футов от себя                                                           |
    | 60–68 | 4 Зелья лечения                                                                                                                                         |
    | 69–75 | Гребная лодка (12 футов длиной)                                                                                                                         |
    | 76–83 | Свиток заклинания, содержащий одно заклинание 1, 2 или 3 уровня (на ваш выбор)                                                                          |
    | 84–90 | 2 мастифа                                                                                                                                               |
    | 91–96 | Окно (2 фута на 4 фута, глубиной до 2 футов), которое вы можете разместить на вертикальной поверхности, до которой дотягиваетесь                         |
    | 97–00 | Переносной таран                                                                                                                                        |
# source: OmnisGM (CC BY 4.0)
- id: rod-of-absorption
  name: "Жезл поглощения"
  description: |-
    *Жезл, очень редкий (требуется настройка)*

    Держа этот жезл, вы можете реакцией поглотить заклинание, нацеленное только на вас и не создающее область воздействия. Эффект поглощённого заклинания отменяется, а энергия заклинания — не само заклинание — сохраняется в жезле. Эта энергия имеет тот же уровень, что и заклинание при его сотворении. Отменённое заклинание рассеивается без эффекта, а все ресурсы, потраченные на его сотворение, пропадают впустую. Жезл может поглотить и хранить до 50 уровней энергии за время своего существования. Как только жезл поглощает 50 уровней энергии, он больше не может поглощать. Если вы становитесь целью заклинания, которое жезл не может сохранить, жезл никак не влияет на это заклинание.

    Когда вы настраиваетесь на жезл, вы знаете, сколько уровней энергии жезл поглотил за время своего существования и сколько уровней энергии заклинаний хранится в нём сейчас.

    Если вы заклинатель, держащий жезл, вы можете преобразовывать хранящуюся в нём энергию в ячейки заклинаний, чтобы сотворять подготовленные или известные вам заклинания. Вы можете создавать ячейки только того уровня, который равен уровню ваших собственных ячеек или ниже, максимум до 5-го уровня. Вы используете хранящиеся уровни вместо своих ячеек, но в остальном сотворяете заклинание как обычно. Например, вы можете использовать 3 уровня, хранящиеся в жезле, как ячейку заклинания 3-го уровня.

    Только что найденный жезл обычно хранит 1d10 уровней энергии заклинаний. Жезл, который больше не может поглощать энергию заклинаний и не имеет оставшейся энергии, становится немагическим.
# source: OmnisGM (CC BY 4.0)
- id: rod-of-alertness
  name: "Жезл бдительности"
  description: |-
    *Жезл, очень редкий (требуется настройка)*

    Этот жезл обладает следующими свойствами.

    **_Бдительность._** Держа жезл, вы совершаете с преимуществом проверки Мудрости (Внимательность) и броски Инициативы.

    **_Заклинания._** Держа жезл, вы можете сотворять из него следующие заклинания:

    - *Обнаружение добра и зла*
    - *Обнаружение магии*
    - *Обнаружение яда и болезни*
    - *Видение невидимого*

    **_Защитная аура._** Действием «Магия» вы можете воткнуть жезл рукоятью в землю, после чего его навершие испускает яркий свет в радиусе 60 футов и тусклый свет ещё на 60 футов. Находясь в этом ярком свете, вы и ваши союзники получаете бонус +1 к Классу доспеха и спасброскам и можете чувствовать местоположение любого Невидимого существа, которое также находится в этом ярком свете.

    Навершие жезла перестаёт светиться, и эффект заканчивается через 10 минут или когда существо действием «Магия» вытаскивает жезл из земли. После использования это свойство нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: rod-of-lordly-might
  name: "Жезл владычества"
  description: |-
    *Жезл, легендарный (требуется настройка)*

    Этот жезл имеет ребристое навершие и функционирует как магическая булава, дающая бонус +3 к броскам атаки и урона, совершаемым им. Жезл обладает свойствами, связанными с шестью разными кнопками, расположенными в ряд вдоль рукояти. У него также есть три других свойства, описанных ниже.

    **_Кнопки._** Бонусным действием вы можете нажать одну из следующих кнопок; эффект кнопки длится, пока вы не нажмёте другую кнопку или пока не нажмёте ту же кнопку снова, что заставляет жезл вернуться в обычную форму:

    **Кнопка 1.** Из конца, противоположного ребристому навершию жезла, вырастает огненный клинок. Пламя испускает яркий свет в радиусе 40 футов и тусклый свет ещё на 40 футов, а клинок функционирует как магический длинный меч или короткий меч (на ваш выбор), наносящий при попадании дополнительно 2d6 Огненного урона.

    **Кнопка 2.** Ребристое навершие жезла складывается, и выскакивают два серповидных клинка, превращая жезл в магический боевой топор, дающий бонус +3 к броскам атаки и урона, совершаемым им.

    **Кнопка 3.** Ребристое навершие жезла складывается, из кончика жезла выскакивает остриё копья, а рукоять жезла удлиняется до 6-футового древка, превращая жезл в магическое копьё, дающее бонус +3 к броскам атаки и урона, совершаемым им.

    **Кнопка 4.** Жезл превращается в шест для лазания длиной до 50 футов (вы задаёте длину), при этом кнопки жезла остаются в пределах вашей досягаемости. В поверхностях, твёрдых как гранит, шест закрепляется шипом снизу и тремя крюками сверху. По бокам выдвигаются горизонтальные перекладины длиной 3 дюйма на расстоянии 1 фута друг от друга, образуя лестницу. Шест выдерживает до 4000 фунтов. Больший вес или отсутствие прочного крепления заставляет жезл вернуться в обычную форму.

    **Кнопка 5.** Жезл превращается в ручной таран и даёт своему носителю бонус +10 к проверкам Силы (Атлетика), совершаемым, чтобы проломить двери, баррикады и другие преграды.

    **Кнопка 6.** Жезл принимает или сохраняет обычную форму и указывает на магнитный север. (Ничего не происходит, если эта функция жезла используется в месте, где нет магнитного севера.) Жезл также сообщает вам приблизительную глубину под землёй или высоту над ней.

    **_Вытягивание жизни._** Когда вы попадаете по существу рукопашной атакой этим жезлом, вы можете заставить цель совершить спасбросок Телосложения со СЛ 17. При провале цель получает дополнительно 4d6 Некротического урона, а вы восстанавливаете число хитов, равное половине этого Некротического урона. После использования это свойство нельзя использовать снова до следующего рассвета.

    **_Паралич._** Когда вы попадаете по существу рукопашной атакой этим жезлом, вы можете заставить цель совершить спасбросок Телосложения со СЛ 17. При провале цель получает состояние «Парализованный» на 1 минуту. Цель повторяет спасбросок в конце каждого своего хода, прекращая эффект при успехе. После использования это свойство нельзя использовать снова до следующего рассвета.

    **_Устрашение._** Держа жезл, вы можете действием «Магия» заставить каждое существо, которое видите в пределах 30 футов от себя, совершить спасбросок Мудрости со СЛ 17. При провале цель получает состояние «Испуганный» на 1 минуту. Испуганная цель повторяет спасбросок в конце каждого своего хода, прекращая эффект на себе при успехе. После использования это свойство нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: rod-of-rulership
  name: "Жезл повелителя"
  description: |-
    *Жезл, редкий (требуется настройка)*

    Вы можете действием «Магия» предъявить жезл и потребовать повиновения от каждого существа по вашему выбору, которое видите в пределах 120 футов от себя. Каждая цель должна преуспеть в спасброске Мудрости со СЛ 15 или получить состояние «Очарованный» на 8 часов. Пока существо Очаровано таким образом, оно считает вас своим доверенным вождём. Если ему причинят вред вы или ваши союзники либо ему прикажут сделать что-то противоречащее его натуре, цель перестаёт быть Очарованной таким образом. После использования это свойство нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: rod-of-security
  name: "Жезл безопасности"
  description: |-
    *Жезл, очень редкий*

    Держа этот жезл, вы можете действием «Магия» активировать его. Тогда жезл мгновенно переносит вас и до 199 других согласных существ, которых вы видите, в полуплан. Вы выбираете, какую форму принимает полуплан. Это может быть тихий сад, весёлая таверна, огромный дворец, тропический остров, невероятный карнавал или что угодно ещё, что вы можете вообразить. Независимо от его природы, полуплан содержит достаточно воды и пищи, чтобы поддерживать своих гостей, и окружение полуплана не может причинить вред его обитателям. Всё остальное, с чем там можно взаимодействовать, может существовать только там. Например, цветок, сорванный в тамошнем саду, исчезает, если его вынести за пределы полуплана.

    За каждый час, проведённый в полуплане, гость восстанавливает хиты, как если бы потратил 1 Кость Хитов. Кроме того, существа там не стареют, хотя время идёт как обычно. Гости могут оставаться там до 200 дней, делённых на число присутствующих существ (округляя вниз).

    Когда время истекает или вы действием «Магия» прекращаете эффект, все гости вновь появляются в том месте, которое занимали, когда вы активировали жезл, или в ближайшем к нему свободном пространстве. После использования это свойство нельзя использовать снова, пока не пройдёт 10 дней.
# source: OmnisGM (CC BY 4.0)
- id: rope-of-climbing
  name: "Верёвка лазания"
  description: |-
    *Чудесный предмет, необычный*

    Эта верёвка длиной 60 футов выдерживает до 3000 фунтов. Держа один конец верёвки, вы можете действием «Магия» приказать другому концу ожить и двигаться к выбранной вами цели на расстоянии до длины верёвки от вас. Этот конец перемещается на 10 футов в ваш ход, когда вы впервые отдаёте приказ, и на 10 футов в начале каждого вашего последующего хода, пока не достигнет цели или пока вы не прикажете ему остановиться. Вы также можете приказать верёвке надёжно прикрепиться к объекту или открепиться, завязаться или развязаться узлами, либо свернуться для переноски.

    Если вы прикажете верёвке завязаться узлами, вдоль неё через каждый 1 фут появляются большие узлы. С узлами верёвка укорачивается до длины 50 футов и даёт преимущество на проверки характеристик, совершаемые, чтобы взбираться по ней.

    Верёвка имеет КД 20, 20 хитов и иммунитет к урону Ядом и Психическому урону. Она восстанавливает 1 хит каждые 5 минут, пока у неё есть хотя бы 1 хит. Если хиты верёвки опускаются до 0, она уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: rope-of-entanglement
  name: "Верёвка опутывания"
  description: |-
    *Чудесный предмет, редкий*

    Эта верёвка длиной 30 футов. Держа один конец верёвки, вы можете действием «Магия» приказать другому концу метнуться вперёд и опутать одно существо, которое видите в пределах 20 футов от себя. Цель должна преуспеть в спасброске Ловкости со СЛ 15 или получить состояние «Опутанный». Вы можете освободить цель, отпустив свой конец верёвки (тогда верёвка сворачивается в пространстве цели), или бонусным действием повторив приказ (тогда верёвка сворачивается в вашей руке).

    Цель, Опутанная верёвкой, может действием совершить на свой выбор проверку Силы (Атлетика) или Ловкости (Акробатика) со СЛ 15. При успешной проверке цель больше не Опутана верёвкой. Если вы всё ещё держите верёвку, когда цель освобождается от неё, вы можете реакцией приказать верёвке свернуться в вашей руке; иначе верёвка сворачивается в пространстве цели.

    Верёвка имеет КД 20, 20 хитов и иммунитет к урону Ядом и Психическому урону. Она восстанавливает 1 хит каждые 5 минут, пока у неё есть хотя бы 1 хит. Если хиты верёвки опускаются до 0, она уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: scarab-of-protection
  name: "Скарабей защиты"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Этот медальон в форме жука даёт три преимущества, пока он при вас.

    **_Защита._** Вы получаете бонус +1 к Классу доспеха.

    **_Сохранение._** Скарабей имеет 12 зарядов. Если вы проваливаете спасбросок против заклинания школы Некромантии или вредоносного эффекта, исходящего от Нежити, вы можете реакцией израсходовать 1 заряд и превратить провал спасброска в успех. Когда израсходован последний заряд, скарабей рассыпается в прах и уничтожается.

    **_Сопротивление заклинаниям._** Вы совершаете с преимуществом спасброски против заклинаний.
# source: OmnisGM (CC BY 4.0)
- id: scimitar-of-speed
  name: "Скимитар скорости"
  description: |-
    *Оружие (скимитар), очень редкий (требуется настройка)*

    Вы получаете бонус +2 к броскам атаки и урона, совершаемым этим магическим оружием. Кроме того, вы можете совершать им одну атаку бонусным действием в каждый свой ход.
# source: OmnisGM (CC BY 4.0)
- id: shield
  name: "Щит, +1, +2 или +3"
  description: |-
    *Доспех (щит), необычный (+1), редкий (+2) или очень редкий (+3)*

    Держа этот щит, вы получаете бонус к Классу доспеха, определяемый редкостью щита, в дополнение к обычному бонусу щита к КД.
# source: OmnisGM (CC BY 4.0)
- id: shield-of-missile-attraction
  name: "Щит ловли стрел"
  description: |-
    *Доспех (щит), редкий (требуется настройка)*

    Держа этот щит, вы обладаете сопротивлением урону от атак, совершённых дальнобойным оружием.

    **_Проклятие._** Этот щит проклят. Настройка на него проклинает вас, пока вы не станете целью заклинания *Снятие проклятия* или подобной магии. Снятие щита не прекращает проклятие на вас. Каждый раз, когда атака дальнобойным оружием нацеливается на существо в пределах 10 футов от вас, проклятие делает целью вас вместо него.
# source: OmnisGM (CC BY 4.0)
- id: slippers-of-spider-climbing
  name: "Тапочки паучьего лазания"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эти лёгкие туфли, вы можете двигаться вверх, вниз и поперёк вертикальных поверхностей и по потолкам, оставляя руки свободными. У вас есть скорость лазания, равная вашей скорости. Однако тапочки не позволяют двигаться так по скользкой поверхности, например покрытой льдом или маслом.
# source: OmnisGM (CC BY 4.0)
- id: sovereign-glue
  name: "Суверенный клей"
  description: |-
    *Чудесный предмет, легендарный*

    Это вязкое молочно-белое вещество способно создать постоянную клейкую связь между любыми двумя объектами. Его нужно хранить в банке или колбе, изнутри покрытой *Маслом скольжения*. При обнаружении контейнер содержит 1d6 + 1 унцию.

    Одна унция клея покрывает поверхность площадью 1 квадратный фут. Нанесение унции *Суверенного клея* занимает действие «Использование», и нанесённый клей застывает за 1 минуту. После этого созданную им связь можно разрушить только применением *Универсального растворителя* или *Масла эфирности*, либо заклинанием *Исполнение желаний*.
# source: OmnisGM (CC BY 4.0)
- id: spell-scroll
  name: "Свиток заклинания"
  description: |-
    *Свиток, редкость варьируется*

    *Свиток заклинания* несёт слова одного заклинания, записанные мистическим шифром. Если заклинание есть в вашем списке заклинаний, вы можете прочитать свиток и сотворить его заклинание без Материальных компонентов. Иначе свиток непонятен. Сотворение заклинания чтением свитка требует обычного времени накладывания этого заклинания. Как только заклинание сотворено, свиток рассыпается в пыль. Если сотворение прервано, свиток не теряется.

    Если заклинание есть в вашем списке заклинаний, но более высокого уровня, чем вы обычно можете сотворять, вы совершаете проверку характеристики, используя свою базовую характеристику заклинателя, чтобы определить, сотворяете ли вы заклинание. СЛ равна 10 плюс уровень заклинания. При провале проверки заклинание исчезает со свитка без иного эффекта.

    Уровень заклинания на свитке определяет СЛ спасброска и бонус атаки заклинания, а также редкость свитка, как показано в следующей таблице.

    | Уровень заклинания | Редкость | СЛ спасброска | Бонус атаки |
    |---|---|---|---|
    | Заговор | Обычный | 13 | +5 |
    | 1 | Обычный | 13 | +5 |
    | 2 | Необычный | 13 | +5 |
    | 3 | Необычный | 15 | +7 |
    | 4 | Редкий | 15 | +7 |
    | 5 | Редкий | 17 | +9 |
    | 6 | Очень редкий | 17 | +9 |
    | 7 | Очень редкий | 18 | +10 |
    | 8 | Очень редкий | 18 | +10 |
    | 9 | Легендарный | 19 | +11 |

    **_Копирование свитка в книгу заклинаний._** Заклинание Волшебника со *Свитка заклинания* можно скопировать в книгу заклинаний. Когда заклинание копируется таким образом, копирующий должен преуспеть в проверке Интеллекта (Магия) со СЛ, равной 10 плюс уровень заклинания. При успешной проверке заклинание копируется. Удаётся проверка или проваливается, *Свиток заклинания* уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: spellguard-shield
  name: "Щит защиты от заклинаний"
  description: |-
    *Доспех (щит), очень редкий (требуется настройка)*

    Держа этот щит, вы совершаете с преимуществом спасброски против заклинаний и других магических эффектов, а броски атак заклинаниями совершаются против вас с помехой.
# source: OmnisGM (CC BY 4.0)
- id: sphere-of-annihilation
  name: "Сфера уничтожения"
  description: |-
    *Чудесный предмет, легендарный*

    Эта чёрная сфера диаметром 2 фута — дыра в мультивселенной, парящая в пространстве и стабилизированная окружающим её магическим полем.

    Сфера уничтожает всю материю, сквозь которую проходит, и всю материю, что проходит сквозь неё. Исключение — артефакты. Если только артефакт не подвержен урону от *Сферы уничтожения*, он проходит сквозь сферу невредимым. Всё прочее, что касается сферы, но не поглощено и не уничтожено ею целиком, получает 8d10 урона Силовым полем.

    **_Управление сферой._** *Сфера уничтожения* неподвижна, пока кто-нибудь не возьмёт её под контроль. Если вы в пределах 60 футов от сферы, вы можете действием «Магия» совершить проверку Интеллекта (Магия) со СЛ 25. При успешной проверке вы контролируете сферу до начала вашего следующего хода, и, если она была под контролем другого существа, то существо теряет контроль над сферой. При провале проверки сфера перемещается на 10 футов к вам по прямой линии.

    Контролируя сферу, вы можете бонусным действием заставить её переместиться в одном направлении по вашему выбору на число футов, равное 5-кратному модификатору вашего Интеллекта (минимум 5 футов). Любое существо, в пространство которого входит сфера, должно преуспеть в спасброске Ловкости со СЛ 19 или коснуться её, получив 8d10 урона Силовым полем. Существо, чьи хиты снижены этим уроном до 0, уничтожается, оставляя своё имущество, но без иных физических останков.

    **_Взаимодействия сферы._** Если сфера соприкасается с планарным порталом (например, созданным заклинанием *Врата*) или экстрапространственным пространством (например, внутри *Переносной дыры*), Мастер случайно определяет, что происходит, по следующей таблице.

    | 1d100 | Результат |
    |---|---|
    | 01–50 | Сфера уничтожается. |
    | 51–85 | Сфера проходит сквозь портал или в экстрапространственное пространство. |
    | 86–00 | Пространственный разлом отправляет сферу и каждое существо и объект в пределах 180 футов от сферы в случайный план существования. |
# source: OmnisGM (CC BY 4.0)
- id: staff-of-charming
  name: "Посох очарования"
  description: |-
    *Посох, редкий (требуется настройка Бардом, Жрецом, Друидом, Чародеем, Колдуном или Волшебником)*

    Этот посох имеет 10 зарядов. Держа посох, вы можете использовать любое из его свойств:

    **Сотворение заклинания.** Вы можете израсходовать 1 заряд посоха, чтобы сотворить из него *Очарование личности*, *Приказ* или *Понимание языков*, используя СЛ спасброска ваших заклинаний.

    **Отражение очарования.** Если вы преуспеваете в спасброске против заклинания школы Очарования, нацеленного только на вас, вы можете реакцией израсходовать 1 заряд посоха и обратить заклинание назад на его заклинателя, как если бы вы сотворили это заклинание.

    **Сопротивление очарованию.** Если вы проваливаете спасбросок против заклинания школы Очарования, нацеленного только на вас, вы можете превратить провал спасброска в успех. Вы не можете использовать это свойство посоха снова до следующего рассвета.

    **Восстановление зарядов.** Посох восстанавливает 1d8 + 2 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох рассыпается в пыль и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-fire
  name: "Посох огня"
  description: |-
    *Посох, очень редкий (требуется настройка Друидом, Чародеем, Колдуном или Волшебником)*

    Держа этот посох, вы обладаете сопротивлением Огненному урону.

    **_Заклинания._** Посох имеет 10 зарядов. Держа посох, вы можете сотворить из него одно из заклинаний в следующей таблице, используя СЛ спасброска ваших заклинаний. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Огненные руки | 1 |
    | Огненный шар | 3 |
    | Стена огня | 4 |

    **_Восстановление зарядов._** Посох восстанавливает 1d6 + 4 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох рассыпается в пепел и уничтожается.
