# source: OmnisGM (CC BY 4.0)
- id: adamantine-armor
  name: "Адамантиновый доспех"
  description: |-
    *Доспех (любой Средний или Тяжёлый, кроме шкурного доспеха), необычный*

    Этот доспех укреплён адамантином — одним из твердейших веществ на свете. Пока вы носите его, любое критическое попадание по вам становится обычным попаданием.
# source: OmnisGM (CC BY 4.0)
- id: ammunition
  name: "Боеприпасы, +1, +2 или +3"
  description: |-
    *Оружие (любые боеприпасы), необычный (+1), редкий (+2) или очень редкий (+3)*

    Вы получаете бонус к броскам атаки и урона, совершаемым этим магическим боеприпасом. Бонус определяется редкостью боеприпаса. Попав в цель, боеприпас перестаёт быть магическим.

    Эти боеприпасы обычно находят или продают партиями по десять или двадцать штук. Десять таких боеприпасов равны по ценности зелью той же редкости.
# source: OmnisGM (CC BY 4.0)
- id: ammunition-of-slaying
  name: "Боеприпасы убийства"
  description: |-
    *Оружие (любые боеприпасы), очень редкий*

    Этот магический боеприпас предназначен для убийства существ определённого типа, который Мастер выбирает или определяет случайно броском по таблице ниже. Если существо этого типа получает урон от боеприпаса, оно совершает спасбросок Телосложения со СЛ 17, получая дополнительно 6d10 урона Силовым полем при провале или половину этого дополнительного урона при успехе.

    Нанеся существу дополнительный урон, боеприпас становится немагическим.

    | 1d100 | Тип существа |
    |---|---|
    | 01–10 | Аберрации   |
    | 11–15 | Звери       |
    | 16–20 | Небожители  |
    | 21–25 | Конструкты  |
    | 26–35 | Драконы     |
    | 36–45 | Элементали  |
    | 46–50 | Гуманоиды   |
    | 51–60 | Феи         |
    | 61–70 | Исчадия     |
    | 71–75 | Великаны    |
    | 76–80 | Чудовища    |
    | 81–85 | Слизи       |
    | 86–90 | Растения    |
    | 91–00 | Нежить      |
# source: OmnisGM (CC BY 4.0)
- id: amulet-of-health
  name: "Амулет здоровья"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите этот амулет, ваше Телосложение равно 19. Он не действует на вас, если ваше Телосложение равно 19 или выше без него.
# source: OmnisGM (CC BY 4.0)
- id: amulet-of-proof-against-detection-and-location
  name: "Амулет защиты от обнаружения и локации"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот амулет, вы не можете быть целью заклинаний Прорицания, и вас нельзя воспринять через магические сенсоры наблюдения, если вы этого не позволите.
# source: OmnisGM (CC BY 4.0)
- id: amulet-of-the-planes
  name: "Амулет планов"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Пока вы носите этот амулет, вы можете действием «Магия» назвать знакомое вам место на другом плане существования. Затем совершите проверку Интеллекта (Магия) со СЛ 15. При успехе вы сотворяете *Переход между планами*. При провале вы и каждое существо и предмет в пределах 15 футов от вас переноситесь в случайное место, определяемое броском 1d100 по следующей таблице.

    | 1d100 | Назначение                              |
    |---|---|
    | 01–60 | Случайное место на плане, который вы назвали |
    | 61–70 | Случайное место на Внутреннем Плане, определяемое броском 1d6: при **1** — План Воздуха; при **2** — План Земли; при **3** — План Огня; при **4** — План Воды; при **5** — Страна Фей; при **6** — Царство Теней |
    | 71–80 | Случайное место на Внешнем Плане, определяемое броском 1d8: при **1** — Арбореа; при **2** — Аркадия; при **3** — Земли Зверей; при **4** — Битопия; при **5** — Элизиум; при **6** — Механус; при **7** — Гора Селестия; при **8** — Исгард |
    | 81–90 | Случайное место на Внешнем Плане, определяемое броском 1d8: при **1** — Бездна; при **2** — Ахерон; при **3** — Карцери; при **4** — Геенна; при **5** — Хейдс; при **6** — Лимбо; при **7** — Девять Преисподних; при **8** — Пандемониум |
    | 91–00 | Случайное место на Астральном Плане     |
# source: OmnisGM (CC BY 4.0)
- id: animated-shield
  name: "Анимированный щит"
  description: |-
    *Доспех (щит), очень редкий (требуется настройка)*

    Держа этот Щит, вы можете бонусным действием оживить его. Щит взмывает в воздух и парит в вашем пространстве, защищая вас, словно вы владеете им, оставляя ваши руки свободными. Щит остаётся оживлённым 1 минуту, пока вы бонусным действием не прекратите этот эффект или пока вы не умрёте или не получите состояние «Недееспособный» — тогда Щит падает на землю или в вашу руку, если она свободна.
# source: OmnisGM (CC BY 4.0)
- id: apparatus-of-the-crab
  name: "Аппарат краба"
  description: |-
    *Чудесный предмет, легендарный*

    Этот предмет поначалу выглядит как запечатанная железная бочка весом 500 фунтов. У бочки есть скрытая защёлка, которую можно найти успешной проверкой Интеллекта (Анализ) со СЛ 20. Освобождение защёлки открывает люк на одном конце бочки, позволяя двум существам размера Среднего или меньше залезть внутрь. На дальнем конце в ряд установлены десять рычагов, каждый в нейтральном положении, способный двигаться вверх или вниз. При использовании определённых рычагов аппарат преображается, напоминая гигантского омара.

    *Аппарат краба* — это Большой объект со следующими характеристиками: КД 20; хиты 200; Скорость 30 фт., Плавание 30 фт. (или 0 фт. для обоих, если ноги не выдвинуты); Иммунитет к урону ядом и психическому урону.

    Чтобы использовать аппарат как транспорт, ему нужен один пилот. Пока люк аппарата закрыт, отсек герметичен и водонепроницаем. Отсек вмещает воздух на 10 часов дыхания, разделённых на количество дышащих существ внутри.

    Аппарат держится на воде. Он также может погружаться под воду на глубину до 900 футов. Ниже этого транспорт получает 2d6 Дробящего урона каждую минуту от давления.

    Существо в отсеке может действием «Использование» переместить до двух рычагов аппарата вверх или вниз. После каждого использования рычаг возвращается в нейтральное положение. Каждый рычаг, слева направо, работает так, как показано в таблице «Рычаги аппарата краба».

    Table: Рычаги аппарата краба

    | Рычаг | Вверх                                                  | Вниз                                       |
    |---|---|---|
    | 1     | Ноги выдвигаются, позволяя аппарату ходить и плавать.  | Ноги втягиваются, снижая Скорость и Скорость плавания аппарата до 0 и лишая его возможности получать бонусы к скорости. |
    | 2     | Передняя оконная заслонка открывается.                | Передняя оконная заслонка закрывается.     |
    | 3     | Боковые оконные заслонки открываются (по две с каждой стороны). | Боковые оконные заслонки закрываются (по две с каждой стороны). |
    | 4     | Две клешни выдвигаются с передней стороны аппарата.   | Клешни втягиваются.                        |
    | 5     | Каждая выдвинутая клешня совершает следующую рукопашную атаку: +8 к попаданию, досягаемость 5 фт. *Попадание:* 7 (2d6) Дробящего урона. | Каждая выдвинутая клешня совершает следующую рукопашную атаку: +8 к попаданию, досягаемость 5 фт. *Попадание:* Цель получает состояние «Схваченный» (СЛ высвобождения 15). |
    | 6     | Аппарат идёт или плывёт вперёд, если его ноги выдвинуты. | Аппарат идёт или плывёт назад, если его ноги выдвинуты. |
    | 7     | Аппарат поворачивается на 90 градусов против часовой стрелки, если его ноги выдвинуты. | Аппарат поворачивается на 90 градусов по часовой стрелке, если его ноги выдвинуты. |
    | 8     | Глазоподобные устройства испускают Яркий свет в радиусе 30 футов и Тусклый свет ещё на 30 футов. | Свет выключается.                                                                                  |
    | 9     | Аппарат погружается до 20 футов, если находится в жидкости. | Аппарат поднимается до 20 футов, если находится в жидкости. |
    | 10    | Задний люк распечатывается и открывается.             | Задний люк закрывается и запечатывается.   |
# source: OmnisGM (CC BY 4.0)
- id: armor
  name: "Доспех, +1, +2 или +3"
  description: |-
    *Доспех (любой Лёгкий, Средний или Тяжёлый), редкий (+1), очень редкий (+2) или легендарный (+3)*

    Пока вы носите этот доспех, вы получаете бонус к Классу Доспеха. Бонус определяется его редкостью.
# source: OmnisGM (CC BY 4.0)
- id: armor-of-invulnerability
  name: "Доспех неуязвимости"
  description: |-
    *Доспех (латный доспех), легендарный (требуется настройка)*

    Пока вы носите этот доспех, вы обладаете Сопротивлением к дробящему, колющему и рубящему урону.

    *Металлический панцирь.* Вы можете действием «Магия» дать себе Иммунитет к дробящему, колющему и рубящему урону на 10 минут или пока не снимете доспех. После использования этого свойства его нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: armor-of-resistance
  name: "Доспех сопротивления"
  description: |-
    *Доспех (любой Лёгкий, Средний или Тяжёлый), редкий (требуется настройка)*

    Пока вы носите этот доспех, вы обладаете Сопротивлением к одному типу урона. Мастер выбирает тип или определяет его случайно броском по следующей таблице.

    | 1d10 | Тип урона   |
    |---|---|
    | 1    | Кислота     |
    | 2    | Холод       |
    | 3    | Огонь       |
    | 4    | Силовое поле |
    | 5    | Электричество |
    | 6    | Некротический |
    | 7    | Яд          |
    | 8    | Психический |
    | 9    | Излучение   |
    | 10   | Гром        |
# source: OmnisGM (CC BY 4.0)
- id: armor-of-vulnerability
  name: "Доспех уязвимости"
  description: |-
    *Доспех (любой Лёгкий, Средний или Тяжёлый), редкий (требуется настройка)*

    Пока вы носите этот доспех, вы обладаете Сопротивлением к одному из следующих типов урона: дробящему, колющему или рубящему. Мастер выбирает тип или определяет его случайно.

    *Проклятие.* Этот доспех проклят, и это раскрывается только при сотворении на него заклинания *Опознание* или при настройке на него. Настройка на доспех проклинает вас, пока вы не станете целью заклинания *Снятие проклятия* или подобной магии; снятие доспеха не прекращает проклятие. Пока вы прокляты, вы обладаете Уязвимостью к двум из трёх типов урона, связанных с доспехом (кроме того, к которому он даёт Сопротивление).
# source: OmnisGM (CC BY 4.0)
- id: arrow-catching-shield
  name: "Щит притяжения снарядов"
  description: |-
    *Доспех (щит), редкий (требуется настройка)*

    Пока вы владеете этим Щитом, вы получаете бонус +2 к Классу Доспеха против бросков дальнобойных атак. Этот бонус добавляется к обычному бонусу Щита к КД.

    Каждый раз, когда атакующий совершает бросок дальнобойной атаки по цели в пределах 5 футов от вас, вы можете реакцией стать целью атаки вместо неё.
# source: OmnisGM (CC BY 4.0)
- id: bag-of-beans
  name: "Сумка фасоли"
  description: |-
    *Чудесный предмет, редкий*

    Эта тяжёлая тканевая сумка содержит 3d4 сушёных фасолин при обнаружении. Сумка весит полфунта независимо от количества фасолин внутри и становится немагическим предметом, когда больше не содержит фасолин.

    Если вы высыпаете одну или несколько фасолин из сумки, они взрываются в 10-футовой Сфере с центром на них. Все высыпанные фасолины уничтожаются при взрыве, и каждое существо в Сфере, включая вас, совершает спасбросок Ловкости со СЛ 15, получая 5d4 урона Силовым полем при провале или половину этого урона при успехе.

    Если вы достаёте фасолину из сумки, сажаете её в грунт или песок и поливаете, фасолина исчезает, производя эффект через 1 минуту из земли, в которую была посажена. Мастер может выбрать эффект из следующей таблицы или определить его случайно.

    | 1d100 | Эффект                   |
    |---|---|
    | 01    | Прорастают 5d4 поганок. Если существо съедает поганку, бросьте любую кость. При нечётном результате существо должно успешно совершить спасбросок Телосложения со СЛ 15 или получить 5d6 урона ядом и состояние «Отравленный» на 1 час. При чётном результате существо получает 5d6 временных хитов на 1 час. |
    | 02–10 | Из земли бьёт гейзер, выбрасывающий воду, пиво, майонез, чай, уксус, вино или масло (по выбору Мастера) на 30 футов в воздух в течение 1d4 минут. |
    | 11–20 | Вырастает **Древень** (Treant). Бросьте любую кость. При нечётном результате древень хаотично-злой. При чётном результате древень хаотично-добрый. |
    | 21–30 | Из земли восстаёт подвижная, но неподвижная каменная статуя по вашему подобию и угрожает вам. Если вы уйдёте и подойдут другие, она описывает вас как самого гнусного злодея и направляет пришедших найти и атаковать вас. Если вы находитесь на том же плане существования, что и статуя, она знает, где вы. Статуя становится неодушевлённой через 24 часа. |
    | 31–40 | Вспыхивает костёр с зелёным пламенем, горящий 24 часа или пока не будет потушен. |
    | 41–50 | Прорастают три **Визгуна** (Shrieker Fungi). |
    | 51–60 | Выползают 1d4 + 4 ярко-розовые жабы. При прикосновении к жабе она превращается в Большого или меньшего монстра по выбору Мастера, который действует в соответствии со своим мировоззрением и природой. Монстр существует 1 минуту, затем исчезает в клубах ярко-розового дыма. |
    | 61–70 | Из земли выбирается голодный **Бюлетт** (Bulette) и атакует. |
    | 71–80 | Вырастает фруктовое дерево. На нём 1d10 + 20 плодов, 1d8 из которых действуют как случайно определённые зелья. Дерево исчезает через 1 час. Сорванные плоды сохраняются, удерживая магию в течение 30 дней. |
    | 81–90 | Появляется гнездо с 1d4 + 3 яйцами радужного цвета. Существо, съевшее яйцо, совершает спасбросок Телосложения со СЛ 20. При успехе существо навсегда увеличивает свою самую низкую характеристику на 1, выбирая случайно среди равных. При провале существо получает 10d6 урона Силовым полем от внутреннего взрыва. |
    | 91–95 | Из земли вырастает пирамида с квадратным основанием 60 футов. Внутри находится погребальная камера с **Мумией** (Mummy), **Повелителем мумий** (Mummy Lord) или другой Нежитью по выбору Мастера. Саркофаг содержит сокровища по выбору Мастера. |
    | 96–00 | Вырастает гигантское бобовое дерево высотой по выбору Мастера. Верхушка ведёт туда, куда решит Мастер, например, к прекрасному виду, замку облачного великана или на другой план существования. |
# source: OmnisGM (CC BY 4.0)
- id: bag-of-devouring
  name: "Сумка пожирания"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта сумка напоминает *Сумку вместимости*, но является пастью гигантского внепространственного существа. Выворачивание сумки наизнанку закрывает пасть.

    Внепространственное существо, связанное с сумкой, ощущает всё, что помещается внутрь. Животная или растительная материя, помещённая в сумку целиком, пожирается и теряется навсегда. Когда в сумку помещают часть живого существа — как при попытке засунуть руку внутрь, — есть 50-процентный шанс, что существо втянется в сумку. Существо внутри сумки может действием попытаться выбраться, сделав это успешной проверкой Силы (Атлетика) со СЛ 15. Другое существо может действием засунуть руку в сумку, чтобы вытащить существо, сделав это успешной проверкой Силы (Атлетика) со СЛ 20, при условии, что тянущего не втянет в сумку первым. Любое существо, начинающее свой ход внутри сумки, пожирается, а его тело уничтожается.

    В сумке можно хранить неодушевлённые предметы; она вмещает кубический фут такого материала. Однако раз в день сумка проглатывает любые предметы внутри неё и выплёвывает их на другой план существования. Мастер определяет время и план.

    Если сумку проколоть или разорвать, она уничтожается, и всё, что в ней содержится, переносится в случайное место на Астральном Плане.
# source: OmnisGM (CC BY 4.0)
- id: bag-of-holding
  name: "Сумка вместимости"
  description: |-
    *Чудесный предмет, необычный*

    Эта сумка имеет внутреннее пространство, значительно большее её внешних размеров, — примерно 2 фута в поперечнике и 4 фута в глубину внутри. Сумка может вместить до 500 фунтов, не превышая объём в 64 кубических фута. Сумка весит 5 фунтов независимо от содержимого. Извлечение предмета из сумки требует действия «Использование».

    Если сумку перегрузить, проколоть или разорвать, она уничтожается, а её содержимое рассеивается в Астральном Плане. Если сумку вывернуть наизнанку, её содержимое высыпается без вреда, но перед повторным использованием сумку нужно вернуть в правильное положение. Сумка вмещает воздух на 10 минут дыхания, разделённых на количество дышащих существ внутри.

    Помещение *Сумки вместимости* внутрь внепространственного пространства, созданного *Практичным рюкзаком*, *Переносной дырой* или подобным предметом, мгновенно уничтожает оба предмета и открывает врата в Астральный План. Врата возникают там, где один предмет поместили в другой. Любое существо в пределах 10-футовой Сферы с центром на вратах всасывается через них в случайное место на Астральном Плане. Затем врата закрываются. Врата односторонние и не могут быть открыты повторно.
# source: OmnisGM (CC BY 4.0)
- id: bag-of-tricks
  name: "Сумка фокусов"
  description: |-
    *Чудесный предмет, необычный*

    Эта сумка из серой, ржавой или жёлто-коричневой ткани кажется пустой. Однако, засунув в неё руку, можно нащупать маленький пушистый предмет.

    Вы можете действием «Магия» вытащить пушистый предмет из сумки и бросить его на расстояние до 20 футов. Приземлившись, предмет превращается в существо, которое вы определяете броском по таблице, соответствующей цвету сумки. Блок статистики существа см. в главе «Монстры». Существо исчезает на следующем рассвете или когда его хиты падают до 0.

    Существо Дружественно к вам и вашим союзникам и действует сразу после вас по вашему счёту Инициативы. Вы можете бонусным действием приказать, как существо перемещается и какое действие совершает в свой следующий ход, например атакует врага. В отсутствие таких приказов существо действует сообразно своей природе.

    После того как из сумки вытащили три пушистых предмета, сумку нельзя использовать снова до следующего рассвета.

    Table: Серая сумка фокусов

    | 1d8 | Существо     |
    |---|---|
    | 1   | Ласка        |
    | 2   | Гигантская крыса |
    | 3   | Барсук       |
    | 4   | Кабан        |
    | 5   | Пантера      |
    | 6   | Гигантский барсук |
    | 7   | Лютый волк   |
    | 8   | Гигантский лось |

    Table: Ржавая сумка фокусов

    | 1d8 | Существо   |
    |---|---|
    | 1   | Крыса      |
    | 2   | Сова       |
    | 3   | Мастиф     |
    | 4   | Козёл      |
    | 5   | Гигантский козёл |
    | 6   | Гигантский кабан |
    | 7   | Лев        |
    | 8   | Бурый медведь |

    Table: Жёлто-коричневая сумка фокусов

    | 1d8 | Существо     |
    |---|---|
    | 1   | Шакал        |
    | 2   | Обезьяна     |
    | 3   | Бабуин       |
    | 4   | Топорник     |
    | 5   | Чёрный медведь |
    | 6   | Гигантская ласка |
    | 7   | Гигантская гиена |
    | 8   | Тигр         |
# source: OmnisGM (CC BY 4.0); differs from our English, see tools/omnisgm-import/README
- id: bead-of-force
  name: "Бусина силы"
  description: |-
    *Чудесный предмет, редкий*

    Эта маленькая чёрная сфера имеет ¾ дюйма в диаметре и весит одну унцию. Обычно 1d4 + 4 *Бусины силы* находятся вместе.

    Вы можете действием «Магия» бросить бусину на расстояние до 60 футов. Бусина взрывается в 10-футовой Сфере при ударе и уничтожается. Каждое существо в Сфере должно преуспеть в спасброске Ловкости со СЛ 15 или получить 5d4 урона Силовым полем. Затем прозрачная сфера силового поля заключает область на 1 минуту. Любое существо, провалившее спасбросок и полностью находящееся в области, оказывается заперто внутри этой сферы. Существа, преуспевшие в спасброске или частично находящиеся в области, выталкиваются от центра сферы, пока не окажутся за её пределами. Только пригодный для дыхания воздух может проходить через стену сферы. Никакие атаки или другие эффекты пройти не могут.

    Заключённое существо может действием «Использование» толкнуть стену сферы, перемещая сферу на расстояние до половины скорости существа. Сферу можно поднять, и её магия заставляет её весить всего 1 фунт независимо от веса существ внутри.
# source: OmnisGM (CC BY 4.0)
- id: belt-of-dwarvenkind
  name: "Пояс дварфов"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)* Пока вы носите этот пояс, вы получаете следующие преимущества:

    **Дварфийский.** Вы знаете Дварфийский.

    **Друг дварфов.** Вы совершаете с преимуществом проверки Харизмы (Убеждение), сделанные для взаимодействия с дварфами и дуэргарами.

    **Стойкость.** Ваше Телосложение увеличивается на 2, до максимума 20.

    Кроме того, пока вы настроены на пояс, каждый день на рассвете есть 50-процентный шанс, что у вас отрастёт окладистая борода (если вы способны её отрастить) или более густая борода, если она у вас уже есть.

    Если вы не дварф и не дуэргар, пока вы носите пояс, вы получаете следующие дополнительные преимущества:

    **Тёмное зрение.** Вы обладаете Тёмным зрением с дистанцией 60 футов.

    **Устойчивость.** Вы обладаете Сопротивлением к урону ядом. Вы также совершаете с преимуществом спасброски, сделанные, чтобы избежать или прекратить состояние «Отравленный».
# source: OmnisGM (CC BY 4.0)
- id: belt-of-giant-strength
  name: "Пояс силы великана"
  description: |-
    *Чудесный предмет, редкость варьируется (требуется настройка)*

    Пока вы носите этот пояс, ваша Сила меняется на значение, даруемое поясом. Тип великана определяет это значение (см. таблицу ниже). Предмет не действует на вас, если ваша Сила без пояса равна значению пояса или превышает его.

    | Пояс                                    | Сил. | Редкость  |
    |---|---|---|
    | Пояс силы великана (холмовой)           | 21   | Редкий    |
    | Пояс силы великана (ледяной или каменный) | 23 | Очень редкий |
    | Пояс силы великана (огненный)           | 25   | Очень редкий |
    | Пояс силы великана (облачный)           | 27   | Легендарный |
    | Пояс силы великана (штормовой)          | 29   | Легендарный |
# source: OmnisGM (CC BY 4.0)
- id: berserker-axe
  name: "Топор берсерка"
  description: |-
    *Оружие (боевой топор, большой топор или алебарда), редкий (требуется настройка)*

    Вы получаете бонус +1 к броскам атаки и урона, совершаемым этим магическим оружием. Кроме того, пока вы настроены на это оружие, ваш максимум хитов увеличивается на 1 за каждый достигнутый вами уровень.

    **_Проклятие._** Это оружие проклято, и настройка на него распространяет проклятие на вас. Пока вы прокляты, вы не желаете расставаться с оружием и держите его в пределах досягаемости всё время. Вы также совершаете с помехой броски атаки оружием, отличным от этого.

    Каждый раз, когда другое существо наносит вам урон, пока оружие находится у вас, вы должны преуспеть в спасброске Мудрости со СЛ 15 или впасть в неистовство. Это неистовое состояние заканчивается, когда вы начинаете свой ход и в пределах 60 футов от вас нет существ, которых вы можете видеть или слышать.

    Пока вы в неистовстве, вы считаете своим врагом ближайшее к вам существо, которое можете видеть или слышать. Если возможных существ несколько, выберите одно случайно. В каждый свой ход вы должны переместиться как можно ближе к существу и совершить действие Атака, нацеленное на это существо. Если вы не можете подобраться к существу достаточно близко, чтобы атаковать его оружием, ваш ход заканчивается, когда вы израсходуете всё доступное перемещение. Если существо умирает или вы больше не можете его видеть или слышать, вашей новой целью становится следующее ближайшее существо, которое вы можете видеть или слышать.
# source: OmnisGM (CC BY 4.0)
- id: boots-of-elvenkind
  name: "Сапоги эльфа"
  description: |-
    *Чудесный предмет, необычный*

    Пока вы носите эти сапоги, ваши шаги не издают ни звука, независимо от поверхности, по которой вы движетесь. Вы также совершаете с преимуществом проверки Ловкости (Скрытность).
# source: OmnisGM (CC BY 4.0)
- id: boots-of-levitation
  name: "Сапоги левитации"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите эти сапоги, вы можете сотворить *Левитацию* на себя.
# source: OmnisGM (CC BY 4.0)
- id: boots-of-speed
  name: "Сапоги скорости"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите эти сапоги, вы можете бонусным действием щёлкнуть каблуками сапог друг о друга. Если вы это делаете, сапоги удваивают вашу Скорость, и любое существо, совершающее по вам провоцированную атаку, совершает бросок атаки с помехой. Если вы снова щёлкнете каблуками, вы прекращаете эффект.

    Когда вы использовали свойство сапог в общей сложности 10 минут, магия перестаёт работать для вас, пока вы не завершите долгий отдых.
# source: OmnisGM (CC BY 4.0)
- id: boots-of-striding-and-springing
  name: "Сапоги шага и прыжка"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эти сапоги, ваша Скорость становится 30 футов, если только она не выше, и ваша Скорость не снижается из-за того, что вы несёте вес сверх своей грузоподъёмности или носите Тяжёлые доспехи.

    Один раз в каждый свой ход вы можете прыгнуть на расстояние до 30 футов, потратив всего 10 футов перемещения.
# source: OmnisGM (CC BY 4.0)
- id: boots-of-the-winterlands
  name: "Сапоги зимних земель"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Эти меховые сапоги плотно облегают ногу и хранят тепло. Пока вы носите их, вы получаете следующие преимущества.

    **_Сопротивление холоду._** У вас есть Сопротивление урону Холодом, и вы переносите температуру 0 градусов по Фаренгейту и ниже без какой-либо дополнительной защиты.

    **_Зимний ходок._** Вы игнорируете Труднопроходимую местность, созданную льдом или снегом.
# source: OmnisGM (CC BY 4.0)
- id: bowl-of-commanding-water-elementals
  name: "Чаша призыва водных элементалей"
  description: |-
    *Чудесный предмет, редкий*

    Пока эта чаша наполнена водой и вы находитесь в пределах 5 футов от неё, вы можете действием «Магия» призвать **Водяного элементаля**. Элементаль появляется в свободном пространстве как можно ближе к чаше, понимает ваши языки, подчиняется вашим командам и совершает свой ход сразу после вас по вашему счёту Инициативы. Элементаль исчезает через 1 час, когда умирает или когда вы отпускаете его бонусным действием. Чашу нельзя использовать таким образом снова до следующего рассвета.

    Чаша около 1 фута в диаметре и вдвое меньше в глубину. Она вмещает около 3 галлонов.
# source: OmnisGM (CC BY 4.0)
- id: bracers-of-archery
  name: "Наручи стрельбы"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эти наручи, вы владеете Длинным луком и Коротким луком и получаете бонус +2 к броскам урона, совершаемым таким оружием.
# source: OmnisGM (CC BY 4.0)
- id: bracers-of-defense
  name: "Наручи защиты"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите эти наручи, вы получаете бонус +2 к Классу Доспеха, если не носите доспехов и не используете Щит.
# source: OmnisGM (CC BY 4.0)
- id: brazier-of-commanding-fire-elementals
  name: "Чаша призыва огненных элементалей"
  description: |-
    *Чудесный предмет, редкий*

    Пока вы находитесь в пределах 5 футов от этой жаровни, вы можете действием «Магия» призвать **Огненного элементаля**. Элементаль появляется в свободном пространстве как можно ближе к жаровне, понимает ваши языки, подчиняется вашим командам и совершает свой ход сразу после вас по вашему счёту Инициативы. Элементаль исчезает через 1 час, когда умирает или когда вы отпускаете его бонусным действием. Жаровню нельзя использовать таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: brooch-of-shielding
  name: "Брошь защиты"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эту брошь, у вас есть Сопротивление урону Силовым полем и Иммунитет к урону от заклинания *Магическая стрела*.
# source: OmnisGM (CC BY 4.0)
- id: broom-of-flying
  name: "Метла полёта"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Эта деревянная метла работает как обычная метла, пока вы не встанете на неё верхом и не заставите её действием «Магия» парить под вами — тогда на ней можно летать по воздуху. Её Скорость полёта — 50 футов. Она может нести до 400 фунтов, но её Скорость полёта становится 30 футов, если она несёт более 200 фунтов. Метла перестаёт парить, когда вы приземляетесь или больше не сидите на ней верхом.

    Действием «Магия» вы можете отправить метлу лететь в одиночку к цели в пределах 1 мили от вас, если назовёте место и знакомы с ним. Метла возвращается к вам, когда вы действием «Магия» произносите командное слово, если она всё ещё находится в пределах 1 мили от вас.
# source: OmnisGM (CC BY 4.0)
- id: candle-of-invocation
  name: "Свеча призыва"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Магия этой свечи активируется, когда её зажигают, что требует действия «Магия». После 4 часов горения свеча уничтожается. Вы можете погасить её досрочно, чтобы использовать позже. Вычтите время её горения из общего времени горения с шагом в 1 минуту.

    Пока свеча горит, она испускает Тусклый свет в радиусе 30 футов. Пока вы находитесь в этом свете, вы совершаете Проверки d20 с преимуществом. Кроме того, Жрец или Друид в этом свете может творить подготовленные заклинания 1-го уровня, не расходуя ячейки заклинаний.

    Как вариант, когда вы зажигаете свечу впервые, вы можете сотворить ею *Врата*. Это уничтожает свечу. Портал, созданный заклинанием, ведёт на определённый Внешний план, выбранный Мастером или определяемый броском по следующей таблице.

    | 1d100 | Внешний план |
    |---|---|
    | 01–05 | Бездна |
    | 06–10 | Ахерон |
    | 11–17 | Арборея |
    | 18–25 | Аркадия |
    | 26–33 | Земли зверей |
    | 34–41 | Битопия |
    | 42–46 | Карцери |
    | 47–54 | Элизиум |
    | 55–59 | Геенна |
    | 60–64 | Хейдс |
    | 65–69 | Лимбо |
    | 70–77 | Механус |
    | 78–85 | Гора Селестия |
    | 86–90 | Девять Преисподних |
    | 91–95 | Пандемониум |
    | 96–00 | Исгард |
# source: OmnisGM (CC BY 4.0)
- id: cape-of-the-mountebank
  name: "Плащ шарлатана"
  description: |-
    *Чудесный предмет, редкий*

    Этот плащ слабо пахнет серой. Пока вы носите его, вы можете действием «Магия» сотворить им *Дверь измерений*. Это свойство нельзя использовать снова до следующего рассвета.

    Когда вы телепортируетесь этим заклинанием, вы оставляете за собой облако дыма. Пространство, которое вы покинули, Слабо затемнено этим дымом до конца вашего следующего хода.
# source: OmnisGM (CC BY 4.0)
- id: carpet-of-flying
  name: "Ковёр-самолёт"
  description: |-
    *Чудесный предмет, очень редкий*

    Вы можете заставить этот ковёр парить и летать, действием «Магия» произнеся его командное слово. Он движется по вашим указаниям, если вы находитесь в пределах 30 футов от него.

    Существует четыре размера *Ковра-самолёта*. Мастер выбирает размер конкретного ковра или определяет его случайно броском по следующей таблице. Ковёр может нести вдвое больший вес, чем указано в таблице, но его Скорость полёта уменьшается вдвое, если он несёт больше своей обычной грузоподъёмности.

    | 1d100 | Размер | Грузоподъёмность | Скорость полёта |
    |---|---|---|---|
    | 01–20 | 3 фт. × 5 фт. | 200 фнт. | 80 футов |
    | 21–55 | 4 фт. × 6 фт. | 400 фнт. | 60 футов |
    | 56–80 | 5 фт. × 7 фт. | 600 фнт. | 40 футов |
    | 81–00 | 6 фт. × 9 фт. | 800 фнт. | 30 футов |
# source: OmnisGM (CC BY 4.0)
- id: censer-of-controlling-air-elementals
  name: "Чаша управления воздушными элементалями"
  description: |-
    *Чудесный предмет, редкий*

    Плавно покачивая эту курильницу, вы можете действием «Магия» призвать **Воздушного элементаля**. Элементаль появляется в свободном пространстве как можно ближе к курильнице, понимает ваши языки, подчиняется вашим командам и совершает свой ход сразу после вас по вашему счёту Инициативы. Элементаль исчезает через 1 час, когда умирает или когда вы отпускаете его бонусным действием. Курильницу нельзя использовать таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: chime-of-opening
  name: "Колокольчик открывания"
  description: |-
    *Чудесный предмет, редкий*

    Эта полая металлическая трубка около 1 фута в длину и весит 1 фунт. Действием «Магия» вы можете ударить в колокольчик, чтобы сотворить *Открывание*. Обычный стук этого заклинания заменяется чистым, звонким тоном колокольчика, который слышен на расстоянии до 300 футов.

    Колокольчик можно использовать 10 раз. После десятого раза он трескается и становится бесполезным.
# source: OmnisGM (CC BY 4.0)
- id: circlet-of-blasting
  name: "Обруч излучения"
  description: |-
    *Чудесный предмет, необычный*

    Пока вы носите этот обруч, вы можете сотворить им *Палящий луч* (+5 к попаданию). Обруч не может сотворить это заклинание снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-arachnida
  name: "Мантия паучьего лазания"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Это тонкое одеяние сделано из чёрного шёлка, переплетённого слабыми серебристыми нитями. Пока вы носите его, вы получаете следующие преимущества.

    **_Сопротивление яду._** У вас есть Сопротивление урону Ядом.

    **_Паучье лазание._** У вас есть Скорость лазания, равная вашей Скорости, и вы можете перемещаться вверх, вниз и поперёк вертикальных поверхностей и по потолкам, оставляя руки свободными.

    **_Паучья поступь._** Вас нельзя поймать в паутину любого рода, и вы можете перемещаться сквозь паутину, как если бы она была Труднопроходимой местностью.

    **_Паутина._** Вы можете сотворить *Паутину* (СЛ спасброска 13). Паутина, созданная заклинанием, заполняет вдвое большую область, чем обычно. После использования это свойство нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-displacement
  name: "Мантия смещения"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите эту мантию, она магически проецирует иллюзию, из-за которой вы кажетесь стоящим в месте рядом с вашим настоящим положением, из-за чего любое существо совершает броски атаки по вам с помехой. Если вы получаете урон, это свойство перестаёт работать до начала вашего следующего хода. Это свойство подавляется, пока ваша Скорость равна 0.
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-elvenkind
  name: "Плащ эльфа"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот плащ, проверки Мудрости (Внимательность) для обнаружения вас совершаются с помехой, и вы совершаете с преимуществом проверки Ловкости (Скрытность).
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-protection
  name: "Плащ защиты"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот плащ, вы получаете бонус +1 к Классу Доспеха и спасброскам.
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-the-bat
  name: "Плащ летучей мыши"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите этот плащ, вы совершаете с преимуществом проверки Ловкости (Скрытность). В области Тусклого света или Тьмы вы можете ухватиться за края плаща и с их помощью получить Скорость полёта 40 футов. Если во время такого полёта вы не удержите края плаща или окажетесь вне Тусклого света или Тьмы, вы теряете эту Скорость полёта.

    Пока вы носите плащ в области Тусклого света или Тьмы, вы можете сотворить *Превращение* на себя, обратившись в **Летучую мышь**. Пока вы в этой форме, вы сохраняете свои значения Интеллекта, Мудрости и Харизмы. Плащ нельзя использовать таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: cloak-of-the-manta-ray
  name: "Плащ манты"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот плащ, вы можете дышать под водой, и у вас есть Скорость плавания 60 футов.
# source: OmnisGM (CC BY 4.0)
- id: crystal-ball
  name: "Кристальный шар"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Касаясь этого кристального шара, вы можете сотворить им *Наблюдение* (СЛ спасброска 17).
# source: OmnisGM (CC BY 4.0)
- id: crystal-ball-of-mind-reading
  name: "Кристальный шар чтения мыслей"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Касаясь этого кристального шара, вы можете сотворить им *Наблюдение* (СЛ спасброска 17). Кроме того, вы можете сотворить *Обнаружение мыслей* (СЛ спасброска 17), нацелив его на видимых вами существ в пределах 30 футов от сенсора заклинания. Вам не нужно концентрироваться на этом заклинании *Обнаружение мыслей*, чтобы поддерживать его в течение его длительности, но оно заканчивается, если заканчивается заклинание *Наблюдение*.
# source: OmnisGM (CC BY 4.0)
- id: crystal-ball-of-telepathy
  name: "Кристальный шар телепатии"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Касаясь этого кристального шара, вы можете сотворить им *Наблюдение* (СЛ спасброска 17). Кроме того, вы можете телепатически общаться с видимыми вами существами в пределах 30 футов от сенсора заклинания. Вы также можете сотворить *Внушение* (СЛ спасброска 17) через сенсор на одно из этих существ. Вам не нужно концентрироваться на этом *Внушении*, чтобы поддерживать его в течение его длительности, но оно заканчивается, если заканчивается *Наблюдение*. Вы не можете сотворить *Внушение* таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: crystal-ball-of-true-seeing
  name: "Кристальный шар истинного зрения"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Касаясь этого кристального шара, вы можете сотворить им *Наблюдение* (СЛ спасброска 17). Кроме того, у вас есть Истинное зрение с дальностью 120 футов с центром на сенсоре заклинания.
# source: OmnisGM (CC BY 4.0)
- id: cube-of-force
  name: "Силовой куб"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Этот куб около дюйма в поперечнике. На каждой грани — своя отличительная метка. Вы можете нажать на одну из граней, израсходовать нужное для неё число зарядов и тем самым сотворить связанное с ней заклинание (СЛ спасброска 17), как показано в таблице «Грани Силового куба».

    Куб начинает с 10 зарядами и восстанавливает 1d6 израсходованных зарядов ежедневно на рассвете.

    Table: Грани Силового куба

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Доспехи мага | 1 |
    | Щит | 1 |
    | Крошечная хижина | 3 |
    | Личное убежище | 4 |
    | Упругая сфера | 4 |
    | Стена силы | 5 |
# source: OmnisGM (CC BY 4.0)
- id: cubic-gate
  name: "Кубический портал"
  description: |-
    *Чудесный предмет, легендарный*

    Этот куб 3 дюйма в поперечнике и излучает ощутимую магическую энергию. Каждая из шести сторон куба привязана к своему плану существования, один из которых — Материальный план. Остальные стороны связаны с планами, определяемыми Мастером.

    Куб имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Действием «Магия» вы можете израсходовать 1 заряд куба, чтобы сотворить с помощью куба одно из следующих заклинаний.

    **_Врата._** Нажимая одну сторону куба, вы творите *Врата*, открывая портал на план существования, привязанный к этой стороне.

    **_Переход между планами._** Дважды нажимая одну сторону куба, вы творите *Переход между планами*, перенося цели на план существования, привязанный к этой стороне.
# source: OmnisGM (CC BY 4.0)
- id: dagger-of-venom
  name: "Кинжал яда"
  description: |-
    *Оружие (кинжал), редкий*

    Вы получаете бонус +1 к броскам атаки и урона, совершаемым этим магическим оружием.

    Бонусным действием вы можете магически покрыть клинок ядом. Яд держится 1 минуту или до тех пор, пока атака этим оружием не попадёт по существу. Это существо должно преуспеть в спасброске Телосложения со СЛ 15 или получить 2d10 урона Ядом и состояние «Отравлен» на 1 минуту. Оружие нельзя использовать таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: dancing-sword
  name: "Танцующий меч"
  description: |-
    *Оружие (двуручный меч, длинный меч, рапира, скимитар или короткий меч), очень редкий (требуется настройка)*

    Бонусным действием вы можете подбросить это магическое оружие в воздух. Когда вы это делаете, оружие начинает парить, летит на расстояние до 30 футов и атакует одно существо на ваш выбор в пределах 5 футов от себя. Оружие использует ваш бросок атаки и добавляет ваш модификатор характеристики к броскам урона.

    Пока оружие парит, вы можете бонусным действием заставить его пролететь до 30 футов к другому месту в пределах 30 футов от вас. В рамках того же бонусного действия вы можете заставить оружие атаковать одно существо в пределах 5 футов от оружия.

    После того как парящее оружие атакует в четвёртый раз, оно летит обратно к вам и пытается вернуться в вашу руку. Если у вас нет свободной руки, оружие падает на землю в вашем пространстве. Если у оружия нет беспрепятственного пути к вам, оно перемещается к вам так близко, как может, а затем падает на землю. Оно также перестаёт парить, если вы схватите его или окажетесь дальше 30 футов от него.
# source: OmnisGM (CC BY 4.0)
- id: decanter-of-endless-water
  name: "Графин бесконечной воды"
  description: |-
    *Чудесный предмет, необычный*

    Эта закупоренная фляга булькает при встряхивании, как будто в ней вода. Графин весит 2 фунта.

    Действием «Магия» вы можете вынуть пробку и произнести одно из трёх командных слов, после чего из фляги льётся некоторое количество пресной или солёной воды (на ваш выбор). Вода перестаёт литься в начале вашего следующего хода. Выбирайте из следующих командных слов:

    **Всплеск.** Графин производит 1 галлон воды.

    **Фонтан.** Графин производит 5 галлонов воды.

    **Гейзер.** Графин производит 30 галлонов воды, которая бьёт вперёд Линией длиной 30 футов и шириной 1 фут. Если вы держите графин, вы можете направить гейзер в одну сторону (действие не требуется). Одно существо на ваш выбор в Линии должно преуспеть в спасброске Силы со СЛ 13 или получить 1d4 Дробящего урона и состояние «Лежащий». Вместо существа вы можете нацелиться на один объект в Линии, который никто не носит и не несёт и который весит не более 200 фунтов. Гейзер опрокидывает объект.
# source: OmnisGM (CC BY 4.0)
- id: deck-of-illusions
  name: "Колода иллюзий"
  description: |-
    *Чудесный предмет, необычный*

    В этой коробке лежит набор карт. В полной колоде 34 карты: 32 изображают конкретных существ, а две — с зеркальной поверхностью. В колоде, найденной как сокровище, обычно недостаёт 1d20 − 1 карт.

    Магия колоды работает, только если карты вытягиваются наугад. Действием «Магия» вы можете вытянуть случайную карту из колоды и бросить её на землю в точку в пределах 30 футов от себя. Над брошенной картой формируется иллюзия существа, определяемая броском по таблице «Колода иллюзий», и остаётся, пока её не рассеют. Иллюзорное существо, созданное картой, выглядит и ведёт себя как настоящее существо своего вида, но не может причинить вреда. Пока вы находитесь в пределах 120 футов от иллюзорного существа и видите его, вы можете действием «Магия» переместить его в любое место в пределах 30 футов от его карты.

    Любое физическое взаимодействие с иллюзорным существом выдаёт его поддельность, ведь предметы проходят сквозь него. Существо, которое действием «Изучение» визуально осматривает иллюзорное существо, распознаёт в нём иллюзию при успешной проверке Интеллекта (Анализ) со СЛ 15. Иллюзия длится, пока её карту не сдвинут или иллюзию не рассеют (заклинанием *Рассеивание магии* или подобным эффектом). Когда иллюзия заканчивается, изображение на её карте исчезает, и эту карту больше нельзя использовать.

    Table: Колода иллюзий

    | 1d100 | Иллюзия* |
    |---|---|
    | 01–03 | Взрослый красный дракон |
    | 04–06 | Архимаг |
    | 07–09 | Убийца |
    | 10–12 | Капитан бандитов |
    | 13–15 | Василиск |
    | 16–18 | Берсерк |
    | 19–21 | Багбир-воин |
    | 22–24 | Облачный великан |
    | 25–27 | Друид |
    | 28–30 | Эриния |
    | 31–33 | Эттин |
    | 34–36 | Огненный великан |
    | 37–39 | Ледяной великан |
    | 40–42 | Гнолл-воин |
    | 43–45 | Гоблин-воин |
    | 46–48 | Нага-страж |
    | 49–51 | Холмовой великан |
    | 52–54 | Хобгоблин-воин |
    | 55–57 | Инкуб |
    | 58–60 | Железный голем |
    | 61–63 | Рыцарь |
    | 64–66 | Кобольд-воин |
    | 67–69 | Лич |
    | 70–72 | Медуза |
    | 73–75 | Ночная карга |
    | 76–78 | Огр |
    | 79–81 | Они |
    | 82–84 | Жрец |
    | 85–87 | Суккуб |
    | 88–90 | Тролль |
    | 91–93 | Ветеран-воин |
    | 94–96 | Виверна |
    | 97–00 | Вытянувший карту |

    \*Блоки статистики этих существ (кроме вытянувшего карту) приведены в главе «Монстры».
# source: OmnisGM (CC BY 4.0)
- id: defender
  name: "Защитник"
  description: |-
    *Оружие (любое оружие ближнего боя), легендарный (требуется настройка)*

    Вы получаете бонус +3 к броскам атаки и урона, совершаемым этим магическим оружием.

    Когда вы впервые атакуете этим оружием в каждый свой ход, вы можете передать часть или весь бонус оружия своему Классу Доспеха. Например, вы можете уменьшить бонус к своим броскам атаки и урона до +1 и получить бонус +2 к Классу Доспеха. Изменённые бонусы действуют до начала вашего следующего хода, но вы должны держать оружие, чтобы получать от него бонус к КД.
# source: OmnisGM (CC BY 4.0)
- id: demon-armor
  name: "Демонический доспех"
  description: |-
    *Доспех (любой Лёгкий, Средний или Тяжёлый), очень редкий (требуется настройка)*

    Пока вы носите этот доспех, вы получаете бонус +1 к Классу Доспеха и знаете Бездонный язык. Кроме того, когтистые перчатки доспеха позволяют вашим Безоружным ударам наносить 1d8 Рубящего урона вместо обычного Дробящего урона, и вы получаете бонус +1 к броскам атаки и урона ваших Безоружных ударов.

    **_Проклятие._** Надев этот проклятый доспех, вы не можете снять его, пока на вас не будет наложено заклинание *Снятие проклятия* или подобная магия. Пока вы носите доспех, вы совершаете с помехой броски атаки по демонам и спасброски против их заклинаний и особых способностей.
# source: OmnisGM (CC BY 4.0)
- id: dimensional-shackles
  name: "Межпространственные кандалы"
  description: |-
    *Чудесный предмет, редкий*

    Действием «Использование» вы можете надеть эти кандалы на существо с состоянием «Недееспособный». Кандалы подстраиваются под существо размером от Маленького до Большого. Кандалы не позволяют скованному ими существу использовать любой способ внепространственного перемещения, включая телепортацию или переход на другой план существования. Они не мешают существу проходить сквозь межпространственный портал.

    Вы и любое существо, которое вы укажете при использовании кандалов, можете действием «Использование» снять их. Раз в 30 дней скованное существо может совершить проверку Силы (Атлетика) СЛ 30. При успехе существо вырывается на свободу и уничтожает кандалы.
# source: OmnisGM (CC BY 4.0)
- id: dragon-orb
  name: "Сферы драконов"
  description: |-
    *Чудесный предмет, артефакт (требуется настройка)*

    Сфера — это гравированный хрустальный шар около 10 дюймов в диаметре. При использовании он вырастает примерно до 20 дюймов в диаметре, и внутри него клубится туман.

    Пока вы настроены на сферу, вы можете действием «Магия» заглянуть в её глубины. Затем вы должны совершить спасбросок Харизмы СЛ 15. При успехе вы управляете сферой, пока остаётесь настроены на неё. При провале сфера накладывает на вас состояние «Очарованный», пока вы остаётесь настроены на неё.

    Пока вы Очарованы сферой, вы не можете добровольно прекратить настройку на неё, и сфера по своему желанию накладывает на вас *Внушение* (СЛ спасброска 18), побуждая вас служить злым целям, которых она жаждет. Драконья сущность внутри сферы может желать многого: уничтожения определённого общества или организации, свободы от сферы, распространения страданий в мире, продвижения культа Тиамат или чего-то ещё, что решит Мастер.

    **_Заклинания._** Сфера имеет 7 зарядов и восстанавливает 1d4 + 3 израсходованных заряда ежедневно на рассвете. Если вы управляете сферой, вы можете сотворить из неё одно из заклинаний следующей таблицы. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Лечение ран (версия 9-го уровня) | 4 |
    | Дневной свет | 1 |
    | Защита от смерти | 2 |
    | Обнаружение магии | 0 |
    | Наблюдение (СЛ спасброска 18) | 3 |

    **_Призыв драконов._** Пока вы управляете сферой, вы можете действием «Магия» заставить её издать телепатический зов, распространяющийся во всех направлениях на 40 миль. Хроматические драконы в пределах дистанции чувствуют побуждение как можно скорее прийти к сфере кратчайшим путём. Драконьи божества, такие как Тиамат, не подвержены этому зову. Хроматические драконы, привлечённые к сфере, могут быть Враждебны к вам за принуждение против их воли. Использовав это свойство, вы не можете использовать его снова в течение 1 часа.

    **_Уничтожение сферы._** *Сфера драконов* имеет КД 20 и уничтожается, если получает урон от *Оружия +3* или заклинания *Распыление*. Ничто иное не может ей навредить.
# source: OmnisGM (CC BY 4.0)
- id: dragon-scale-mail
  name: "Драконья чешуйчатая кольчуга"
  description: |-
    *Доспех (чешуйчатая кольчуга), очень редкий (требуется настройка)*

    *Драконья чешуйчатая кольчуга* сделана из чешуи одного вида дракона. Иногда драконы собирают свою сброшенную чешую и дарят её. В других случаях охотники бережно сохраняют шкуру мёртвого дракона. В любом случае *Драконья чешуйчатая кольчуга* высоко ценится.

    Пока вы носите этот доспех, вы получаете бонус +1 к Классу Доспеха, совершаете с Преимуществом спасброски против оружия дыхания Драконов и обладаете Сопротивлением одному типу урона, определяемому видом дракона, который дал чешую (см. прилагаемую таблицу).

    Кроме того, вы можете действием «Магия» сосредоточить свои чувства, чтобы определить расстояние и направление до ближайшего дракона в пределах 30 миль от себя, который того же типа, что и доспех. Это действие нельзя использовать снова до следующего рассвета.

    | Дракон | Сопротивление |
    |---|---|
    | Чёрный | Кислота |
    | Синий | Электричество |
    | Латунный | Огонь |
    | Бронзовый | Электричество |
    | Медный | Кислота |
    | Золотой | Огонь |
    | Зелёный | Яд |
    | Красный | Огонь |
    | Серебряный | Холод |
    | Белый | Холод |
# source: OmnisGM (CC BY 4.0)
- id: dragon-slayer
  name: "Дракоборческое оружие"
  description: |-
    *Оружие (любое простое или воинское), редкий*

    Вы получаете бонус +1 к броскам атаки и урона этим магическим оружием.

    Оружие наносит дополнительно 3d6 урона типа этого оружия, если цель — Дракон.
# source: OmnisGM (CC BY 4.0)
- id: dust-of-disappearance
  name: "Пыль исчезновения"
  description: |-
    *Чудесный предмет, необычный*

    Этот порошок напоминает мелкий песок. Его хватает на одно использование. Когда вы действием «Использование» подбрасываете пыль в воздух, вы и каждое существо и объект в пределах 10-футовой Эманации, исходящей от вас, получаете состояние «Невидимый» на 2d4 минуты. Длительность одинакова для всех целей, и пыль расходуется, когда её магия вступает в силу. Сразу после того, как затронутое существо совершает бросок атаки, наносит урон или сотворяет заклинание, состояние «Невидимый» для этого существа заканчивается.
# source: OmnisGM (CC BY 4.0)
- id: dust-of-dryness
  name: "Пыль сухости"
  description: |-
    *Чудесный предмет, необычный*

    Этот маленький пакетик содержит 1d6 + 4 щепотки пыли. Действием «Использование» вы можете посыпать щепотку пыли на воду, превратив воду объёмом до 15-футового Куба в одну гранулу размером со стеклянный шарик, которая плавает или покоится рядом с местом, где была рассыпана пыль. Вес гранулы ничтожен. Существо может действием «Использование» разбить гранулу о твёрдую поверхность, из-за чего она раскалывается и высвобождает воду, которую поглотила пыль. Это уничтожает гранулу и прекращает её магию.

    Действием «Использование» вы можете посыпать щепотку пыли на Элементаля в пределах 5 футов от себя, состоящего в основном из воды (например, на **Водяного элементаля**). Такое существо, подвергшееся щепотке пыли, совершает спасбросок Телосложения СЛ 13, получая 10d6 Некротического урона при провале или половину этого урона при успехе.
# source: OmnisGM (CC BY 4.0)
- id: dust-of-sneezing-and-choking
  name: "Пыль чихания и удушья"
  description: |-
    *Чудесный предмет, необычный*

    Найденный в маленьком контейнере, этот порошок напоминает *Пыль исчезновения*, и *Опознание* определяет его именно так. Его хватает на одно использование.

    Действием «Использование» вы можете подбросить пыль в воздух, вынуждая себя и каждое существо в пределах 30-футовой Эманации, исходящей от вас, совершить спасбросок Телосложения СЛ 15. Конструкты, Элементали, Слизи, Растения и Нежить автоматически преуспевают в спасброске.

    При провале существо начинает безудержно чихать; оно получает состояние «Недееспособный» и задыхается. Существо повторяет спасбросок в конце каждого своего хода, прекращая эффект на себе при успехе. Эффект также прекращается на любом существе, ставшем целью заклинания *Малое восстановление*.
# source: OmnisGM (CC BY 4.0)
- id: dwarven-plate
  name: "Дварфийский латный доспех"
  description: |-
    *Доспех (полулатный доспех или латный доспех), очень редкий*

    Пока вы носите этот доспех, вы получаете бонус +2 к Классу Доспеха. Кроме того, если эффект перемещает вас против вашей воли по земле, вы можете реакцией сократить расстояние перемещения на величину до 10 футов.
# source: OmnisGM (CC BY 4.0)
- id: dwarven-thrower
  name: "Дварфийский метатель"
  description: |-
    *Оружие (боевой молот), очень редкий (требуется настройка дварфом или существом, настроенным на Пояс дварфов)*

    Вы получаете бонус +3 к броскам атаки и урона этим магическим оружием. Оно обладает свойством «метательное» с обычной дистанцией 20 футов и максимальной дистанцией 60 футов. Когда вы попадаете дальнобойной атакой этим оружием, оно наносит дополнительно 1d8 урона Силовым полем или дополнительно 2d8 урона Силовым полем, если цель — Великан. Сразу после попадания или промаха оружие возвращается в вашу руку.
# source: OmnisGM (CC BY 4.0)
- id: efficient-quiver
  name: "Эффективный колчан"
  description: |-
    *Чудесный предмет, необычный*

    Каждое из трёх отделений колчана связано с внепространственным пространством, что позволяет колчану вмещать множество предметов, никогда не весив больше 2 фунтов. Самое короткое отделение может вмещать до 60 стрел, болтов или подобных предметов. Среднее отделение вмещает до 18 метательных копий или подобных предметов. Самое длинное отделение вмещает до 6 длинных предметов, таких как луки, боевые посохи или копья.

    Вы можете достать любой предмет из колчана так, как если бы доставали его из обычного колчана или ножен.
# source: OmnisGM (CC BY 4.0)
- id: efreeti-bottle
  name: "Бутылка ифрита"
  description: |-
    *Чудесный предмет, очень редкий*

    Когда вы действием «Магия» вынимаете пробку этой расписной латунной бутылки, из неё вытекает облако густого дыма. В конце вашего хода дым исчезает во вспышке безвредного огня, и в свободном пространстве в пределах 30 футов от вас появляется **Ифрит**.

    Когда бутылку открывают впервые, Мастер бросает по следующей таблице, чтобы определить, что происходит.

    | 1d10 | Эффект |
    |---|---|
    | 1 | Ифрит нападает на вас. Сражаясь 5 раундов, ифрит исчезает, и бутылка теряет свою магию. |
    | 2–9 | Ифрит понимает ваши языки и подчиняется вашим командам в течение 1 часа, после чего возвращается в бутылку, и его удерживает новая пробка. Пробку нельзя вынуть в течение 24 часов. Следующие два раза, когда бутылку открывают, происходит тот же эффект. Если бутылку открывают в четвёртый раз, ифрит вырывается и исчезает, и бутылка теряет свою магию. |
    | 10 | Ифрит понимает ваши языки и может один раз сотворить для вас *Исполнение желаний*. Он исчезает, когда исполняет желание или через 1 час, и бутылка теряет свою магию. |
# source: OmnisGM (CC BY 4.0)
- id: elemental-gem
  name: "Сферы стихий"
  description: |-
    *Чудесный предмет, необычный*

    Этот самоцвет содержит частицу стихийной энергии. Когда вы действием «Использование» разбиваете самоцвет, призывается элементаль (его блок статистики см. в «Монстрах»), и самоцвет перестаёт быть магическим. Элементаль появляется в свободном пространстве как можно ближе к разбитому самоцвету, понимает ваши языки, подчиняется вашим командам и действует сразу после вас по вашей Инициативе. Элементаль исчезает через 1 час, когда погибает или когда вы отпускаете его бонусным действием. Вид самоцвета определяет элементаля, как показано в следующей таблице.

    | Самоцвет | Призванный элементаль |
    |---|---|
    | Синий сапфир | Воздушный элементаль |
    | Изумруд | Водяной элементаль |
    | Красный корунд | Огненный элементаль |
    | Жёлтый алмаз | Земляной элементаль |
# source: OmnisGM (CC BY 4.0)
- id: elven-chain
  name: "Эльфийская кольчуга"
  description: |-
    *Доспех (кольчуга или кольчужная рубаха), редкий*

    Вы получаете бонус +1 к Классу Доспеха, пока носите этот доспех. Вы считаетесь владеющим этим доспехом, даже если не владеете Средними или Тяжёлыми доспехами.
# source: OmnisGM (CC BY 4.0)
- id: eversmoking-bottle
  name: "Колба вечного дыма"
  description: |-
    *Чудесный предмет, необычный*

    Действием «Магия» вы можете открыть или закрыть эту колбу. Открытие колбы заставляет густой дым вырываться наружу, образуя облако, заполняющее 60-футовую Эманацию, исходящую от колбы. Область внутри дыма Сильно затемнена.

    Каждую минуту, пока колба остаётся открытой, размер Эманации увеличивается на 10 футов, пока не достигнет максимального размера 120 футов.

    Закрытие колбы заставляет облако застыть на месте, пока оно не рассеется через 10 минут. Сильный ветер (например, созданный заклинанием *Порыв ветра*) рассеивает облако через 1 минуту.
# source: OmnisGM (CC BY 4.0)
- id: eyes-of-charming
  name: "Глаза очарования"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Эти хрустальные линзы надеваются на глаза. Они имеют 3 заряда. Нося их, вы можете израсходовать 1 или более зарядов, чтобы сотворить *Очарование личности* (СЛ спасброска 13). За 1 заряд вы сотворяете версию заклинания 1-го уровня. Вы повышаете уровень заклинания на один за каждый дополнительный израсходованный заряд. Линзы восстанавливают все израсходованные заряды ежедневно на рассвете.
# source: OmnisGM (CC BY 4.0)
- id: eyes-of-minute-seeing
  name: "Очки мелкого зрения"
  description: |-
    *Чудесный предмет, необычный*

    Эти хрустальные линзы надеваются на глаза. Нося их, ваше зрение значительно улучшается на расстоянии до 1 фута, давая вам Тёмное зрение в этом пределе и Преимущество на проверки Интеллекта (Анализ), совершаемые для изучения чего-либо в этом пределе.
# source: OmnisGM (CC BY 4.0)
- id: eyes-of-the-eagle
  name: "Глаза орла"
  description: |-
    *Чудесный предмет, необычный*

    Эти хрустальные линзы надеваются на глаза. Нося их, вы совершаете с Преимуществом проверки Мудрости (Внимательность), полагающиеся на зрение. В условиях ясной видимости вы можете различить детали даже крайне удалённых существ и объектов размером всего 2 фута в поперечнике.
# source: OmnisGM (CC BY 4.0)
- id: feather-token
  name: "Перо-талисман"
  description: |-
    *Чудесный предмет, редкость варьируется*

    Этот предмет выглядит как перо. Существуют разные типы перьев-талисманов, каждый с собственным одноразовым эффектом. Мастер выбирает вид талисмана или определяет его случайно, бросая по таблице «Перья-талисманы». Тип талисмана определяет его редкость.

    **_Якорь (необычный)._** Вы можете действием «Магия» коснуться талисманом лодки или корабля. В течение следующих 24 часов судно нельзя сдвинуть никакими средствами. Повторное касание талисманом судна прекращает эффект. Когда эффект заканчивается, талисман исчезает.

    **_Птица (редкий)._** Вы можете действием «Магия» подбросить талисман на 5 футов в воздух. Талисман исчезает, и на его месте появляется огромная разноцветная птица. Птица обладает характеристиками **Руха**, но не может атаковать. Она подчиняется вашим простым командам и может нести до 500 фунтов, летя на максимальной скорости (16 миль в час, максимум 144 мили в день, с 1 часом отдыха на каждые 3 часа полёта), или 1000 фунтов на половине этой скорости. Птица исчезает, пролетев за день своё максимальное расстояние, или если её хиты опускаются до 0. Вы можете отпустить птицу действием «Магия».

    **_Веер (необычный)._** Если вы на лодке или корабле, вы можете действием «Магия» подбросить талисман на высоту до 10 футов. Талисман исчезает, и на его месте появляется гигантский машущий веер. Веер парит и создаёт сильный ветер. Этот ветер может наполнить паруса одного корабля, увеличивая его скорость на 5 миль в час в течение 8 часов. Вы можете отпустить веер действием «Магия».

    **_Лебединая лодка (редкий)._** Вы можете действием «Магия» коснуться талисманом водоёма диаметром не менее 60 футов. Талисман исчезает, и на его месте появляется лодка длиной 50 футов и шириной 20 футов в форме лебедя. Лодка самоходна и движется по воде со скоростью 6 миль в час. Находясь на лодке, вы можете действием «Магия» приказать ей двигаться или повернуть на угол до 90 градусов. Лодка сохраняется 24 часа, а затем исчезает. Вы можете отпустить лодку действием «Магия».

    **_Дерево (необычный)._** Чтобы использовать этот талисман, вы должны находиться под открытым небом. Вы можете действием «Магия» коснуться им свободного пространства на земле. Талисман исчезает, и на его месте возникает немагический дуб. Дерево высотой 60 футов, со стволом диаметром 5 футов, а его ветви на вершине раскинуты в радиусе 20 футов.

    **_Кнут (редкий)._** Вы можете действием «Магия» бросить талисман в точку в пределах 10 футов от себя. Талисман исчезает, и на его месте появляется парящий кнут. Затем вы можете бонусным действием совершить рукопашную атаку заклинанием по существу в пределах 10 футов от кнута с бонусом атаки +9. При попадании цель получает 1d6 + 5 урона Силовым полем.

    Бонусным действием вы можете направить кнут пролететь до 20 футов и повторить атаку по существу в пределах 10 футов от кнута. Кнут исчезает через 1 час, когда вы действием «Магия» отпускаете его или когда вы умираете либо получаете состояние «Недееспособный».

    Table: Перья-талисманы

    | 1d100 | Талисман | Редкость |
    |---|---|---|
    | 01–20 | Якорь | Необычный |
    | 21–35 | Птица | Редкий |
    | 36–50 | Веер | Необычный |
    | 51–65 | Лебединая лодка | Редкий |
    | 66–90 | Дерево | Необычный |
    | 91–00 | Кнут | Редкий |
# source: OmnisGM (CC BY 4.0)
- id: figurine-of-wondrous-power
  name: "Образная фигурка чудесной силы"
  description: |-
    *Чудесный предмет, редкость варьируется*

    *Образная фигурка чудесной силы* — это статуэтка, достаточно маленькая, чтобы поместиться в кармане. Если вы действием «Магия» бросаете фигурку в точку на земле в пределах 60 футов от себя, фигурка становится живым существом, указанным в описании фигурки ниже. Если пространство, где должно появиться существо, занято другими существами или объектами, или если для существа недостаточно места, фигурка не становится существом.

    Существо Дружественно к вам и вашим союзникам. Оно понимает ваши языки, подчиняется вашим командам и действует сразу после вас по вашей Инициативе. Если вы не отдаёте команд, существо защищается, но не предпринимает других действий.

    Существо существует в течение длительности, характерной для каждой фигурки. По окончании длительности существо возвращается в форму фигурки. Оно возвращается в фигурку досрочно, если его хиты в форме существа опускаются до 0 или если вы действием «Магия», касаясь существа, заставляете его вернуться в форму фигурки. Когда существо снова становится фигуркой, её свойство нельзя использовать снова, пока не пройдёт определённое количество времени, указанное в описании фигурки.

    **_Бронзовый грифон (редкий)._** Эта бронзовая статуэтка изображает вздыбленного грифона. Она может стать **Грифоном** на срок до 6 часов. После использования её нельзя использовать снова, пока не пройдёт 5 дней.

    **_Эбеновая муха (редкий)._** Эта эбеновая статуэтка, вырезанная в виде слепня, может стать **Гигантской мухой** (см. прилагаемый блок статистики) на срок до 12 часов, и на ней можно ездить верхом. После использования её нельзя использовать снова, пока не пройдёт 2 дня.

    > #### Гигантская муха (Giant Fly)
    >
    > *Большой Зверь, без мировоззрения*
    >
    > **КД** 11
    >
    > **Инициатива** +1 (11)
    >
    > **Хиты** 19 (3d10 + 3)
    >
    > **Скорость** 30 фт., Полёт 60 фт.
    >
    > | Характеристика | Значение | Мод | Спас |
    > |---|---|---|---|
    > | Сил | 14 | +2 | +2 |
    > | Лов | 13 | +1 | +1 |
    > | Тел | 13 | +1 | +1 |
    > | Инт | 2 | -4 | -4 |
    > | Мдр | 10 | +0 | +0 |
    > | Хар | 3 | -4 | -4 |
    >
    > **Чувства** Тёмное зрение 60 фт., Пассивная Внимательность 10
    >
    > **Языки** Нет
    >
    > **ПО** 0 (ОО 0; БМ +2)

    **_Золотые львы (редкий)._** Эти золотые статуэтки львов всегда создаются парами. Вы можете использовать одну фигурку или обе одновременно. Каждая может стать **Львом** на срок до 1 часа. После того как лев был использован, его нельзя использовать снова, пока не пройдёт 7 дней.

    **_Козлы из слоновой кости (редкий)._** Эти статуэтки козлов из слоновой кости всегда создаются наборами по три. Каждый козёл выглядит уникально и работает иначе, чем остальные. Их свойства таковы:

    **Козёл ужаса.** Эта фигурка может стать **Гигантским козлом** на срок до 3 часов. Козёл не может атаковать, но вы можете (без вреда) снять его рога и использовать их как оружие. Один рог становится *Кавалерийской пикой +1*, а другой — *Длинным мечом +2*. Снятие рога требует действия «Магия», а оружие исчезает и рога возвращаются, когда козёл возвращается в форму фигурки. Пока вы едете на козле, любое Враждебное существо, начинающее свой ход в пределах 30-футовой Эманации, исходящей от козла, должно преуспеть в спасброске Мудрости СЛ 15 или получить состояние «Испуганный» на 1 минуту, пока вы не перестанете ехать на козле или пока козёл не вернётся в форму фигурки. Испуганное существо повторяет спасбросок в конце каждого своего хода, прекращая эффект на себе при успехе. Преуспев в спасброске, существо получает иммунитет к этому эффекту на следующие 24 часа. После использования фигурку нельзя использовать снова, пока не пройдёт 15 дней.

    **_Козёл странствий._** Эта фигурка может стать Большим козлом с теми же характеристиками, что и у **Верховой лошади**. Она имеет 24 заряда, и каждый час или его часть, проведённые в форме козла, стоят 1 заряд. Пока у неё есть заряды, вы можете использовать её так часто, как пожелаете. Когда заряды заканчиваются, она возвращается в форму фигурки, и её нельзя использовать снова, пока не пройдёт 7 дней, когда она восстанавливает все израсходованные заряды.

    **_Козёл тягот._** Эта фигурка может стать **Гигантским козлом** на срок до 3 часов. После использования её нельзя использовать снова, пока не пройдёт 30 дней.

    **_Мраморный слон (редкий)._** Эта мраморная статуэтка изображает трубящего слона. Она может стать **Слоном** на срок до 24 часов. После использования её нельзя использовать снова, пока не пройдёт 7 дней.

    **_Обсидиановый скакун (очень редкий)._** Этот отполированный обсидиановый конь может стать **Кошмаром** на срок до 24 часов. Кошмар сражается только для самозащиты. После использования его нельзя использовать снова, пока не пройдёт 5 дней.

    Каждый раз, когда вы используете фигурку, есть 10-процентный шанс, что она проигнорирует ваши приказы, включая команду вернуться в форму фигурки. Если вы садитесь на кошмара, пока он игнорирует ваши приказы, вы и кошмар мгновенно переноситесь в случайное место на плане Аида, где кошмар возвращается в форму фигурки.

    **_Ониксовый пёс (редкий)._** Эта ониксовая статуэтка пса может стать **Мастифом** на срок до 6 часов. Мастиф имеет Интеллект 8 и может говорить на Общем. Он также обладает Слепым зрением с дистанцией 60 футов. После использования его нельзя использовать снова, пока не пройдёт 7 дней.

    **_Серпентиновая сова (редкий)._** Эта серпентиновая статуэтка совы может стать **Гигантской совой** на срок до 8 часов. Сова может телепатически общаться с вами на любом расстоянии, если вы и она находитесь на одном плане существования. После использования её нельзя использовать снова, пока не пройдёт 2 дня.

    **_Серебряный ворон (необычный)._** Эта серебряная статуэтка ворона может стать **Вороном** на срок до 12 часов. После использования её нельзя использовать снова, пока не пройдёт 2 дня. В форме ворона фигурка даёт вам возможность сотворить на неё *Животного посланника*.
# source: OmnisGM (CC BY 4.0)
- id: flame-tongue
  name: "Пламенный язык"
  description: |-
    *Оружие (любое оружие ближнего боя), редкий (требуется настройка)*

    Держа это магическое оружие, вы можете бонусным действием произнести командное слово, чтобы пламя охватило наносящую урон часть оружия. Это пламя испускает яркий свет в радиусе 40 футов и тусклый свет ещё на 40 футов. Пока оружие пылает, оно наносит дополнительно 2d6 урона Огнём при попадании. Пламя длится, пока вы бонусным действием снова не произнесёте команду или пока вы не бросите, не уберёте или не вложите оружие в ножны.
# source: OmnisGM (CC BY 4.0)
- id: folding-boat
  name: "Складная лодка"
  description: |-
    *Чудесный предмет, редкий*

    Этот предмет выглядит как деревянный ящик длиной 12 дюймов, шириной 6 дюймов и глубиной 6 дюймов. Он весит 4 фунта и держится на плаву. Его можно открыть, чтобы хранить предметы внутри. Этот предмет также имеет три командных слова, каждое из которых требует для использования действия «Магия»:

    **Первое командное слово.** Ящик разворачивается в гребную лодку.

    **Второе командное слово.** Ящик разворачивается в килевую лодку.

    **Третье командное слово.** *Складная лодка* складывается обратно в ящик, если на борту нет существ. Любые предметы в судне, которые не помещаются внутрь ящика, остаются снаружи при складывании. Любые предметы в судне, которые помещаются внутрь ящика, оказываются в нём.

    Когда ящик становится судном, его вес становится весом обычного судна такого размера, и всё, что хранилось в ящике, остаётся в лодке.

    Характеристики гребной лодки и килевой лодки приведены в «Снаряжении». Если любое из судов снижается до 0 хитов, *Складная лодка* уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: frost-brand
  name: "Морозный клинок"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч, рапира, скимитар или короткий меч), очень редкий (требуется настройка)*

    Когда вы попадаете броском атаки этим магическим оружием, цель получает дополнительно 1d6 урона Холодом. Кроме того, пока вы держите оружие, вы обладаете Сопротивлением урону Огнём.

    При отрицательных температурах оружие испускает яркий свет в радиусе 10 футов и тусклый свет ещё на 10 футов.

    Когда вы обнажаете это оружие, вы можете погасить всё немагическое пламя в пределах 30 футов от себя. После использования это свойство нельзя использовать снова в течение 1 часа.
# source: OmnisGM (CC BY 4.0)
- id: gauntlets-of-ogre-power
  name: "Перчатки силы огра"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Ваша Сила равна 19, пока вы носите эти перчатки. Они не оказывают на вас эффекта, если ваша Сила без них 19 или выше.
# source: OmnisGM (CC BY 4.0)
- id: gem-of-brightness
  name: "Самоцвет сияния"
  description: |-
    *Чудесный предмет, необычный*

    Эта призма имеет 50 зарядов. Держа её, вы можете действием «Магия» произнести одно из трёх командных слов, чтобы вызвать один из следующих эффектов:

    **Первое командное слово.** Самоцвет испускает яркий свет в радиусе 30 футов и тусклый свет ещё на 30 футов. Этот эффект не расходует заряд. Он длится, пока вы бонусным действием не повторите командное слово или пока вы не используете другую функцию самоцвета.

    **Второе командное слово.** Вы расходуете 1 заряд и заставляете самоцвет выпустить ослепительный луч света в одно существо, которое вы видите в пределах 60 футов от себя. Существо должно преуспеть в спасброске Телосложения СЛ 15 или получить состояние «Ослеплённый» на 1 минуту. Существо повторяет спасбросок в конце каждого своего хода, прекращая эффект на себе при успехе.

    **Третье командное слово.** Вы расходуете 5 зарядов и заставляете самоцвет вспыхнуть интенсивным светом в 30-футовом Конусе. Каждое существо в Конусе совершает спасбросок, как если бы его поразил луч, созданный вторым командным словом.

    Когда все заряды самоцвета израсходованы, самоцвет становится немагическим драгоценным камнем стоимостью 50 зм.
# source: OmnisGM (CC BY 4.0)
- id: gem-of-seeing
  name: "Самоцвет видения"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Этот самоцвет имеет 3 заряда. Действием «Магия» вы можете израсходовать 1 заряд. В течение следующих 10 минут вы обладаете Истинным зрением на 120 футов, когда смотрите сквозь самоцвет.

    Самоцвет восстанавливает 1d3 израсходованных заряда ежедневно на рассвете.
# source: OmnisGM (CC BY 4.0)
- id: giant-slayer
  name: "Убийца великанов"
  description: |-
    *Оружие (любое простое или воинское), редкий*

    Вы получаете бонус +1 к броскам атаки и урона этим магическим оружием.

    Когда вы попадаете по Великану этим оружием, Великан получает дополнительно 2d6 урона типа этого оружия и должен преуспеть в спасброске Силы СЛ 15 или получить состояние «Лежащий».
# source: OmnisGM (CC BY 4.0)
- id: glamoured-studded-leather
  name: "Гламурная клёпаная кожа"
  description: |-
    *Доспех (клёпаный кожаный доспех), редкий*

    Пока вы носите этот доспех, вы получаете бонус +1 к Классу Доспеха. Вы также можете бонусным действием заставить доспех принять вид обычной одежды или какого-либо другого доспеха. Вы решаете, как он выглядит, — включая цвет, фасон и аксессуары, — но доспех сохраняет свою обычную громоздкость и вес. Иллюзорный облик длится, пока вы снова не используете это свойство или не снимете доспех.
# source: OmnisGM (CC BY 4.0)
- id: gloves-of-missile-snaring
  name: "Перчатки похищения снарядов"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Если по вам попадает бросок атаки дальнобойным или метательным оружием, пока вы носите эти перчатки, вы можете реакцией снизить урон на 1d10 плюс ваш модификатор Ловкости, если у вас есть свободная рука. Если вы снижаете урон до 0, вы можете поймать боеприпас или оружие, если оно достаточно мало, чтобы удержать его в этой руке.
# source: OmnisGM (CC BY 4.0)
- id: gloves-of-swimming-and-climbing
  name: "Перчатки плавания и лазания"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эти перчатки, вы обладаете скоростью лазания и скоростью плавания, равными вашей скорости, и получаете бонус +5 к проверкам Силы (Атлетика), совершаемым для лазания или плавания.
# source: OmnisGM (CC BY 4.0)
- id: goggles-of-night
  name: "Очки ночного видения"
  description: |-
    *Чудесный предмет, необычный*

    Нося эти тёмные линзы, вы обладаете Тёмным зрением на 60 футов. Если у вас уже есть Тёмное зрение, ношение очков увеличивает его дистанцию на 60 футов.
# source: OmnisGM (CC BY 4.0)
- id: hammer-of-thunderbolts
  name: "Молот громовержца"
  description: |-
    *Оружие (мол или боевой молот), легендарный (требуется настройка)*

    Вы получаете бонус +1 к броскам атаки и урона, совершаемым этим магическим оружием.

    Оружие имеет 5 зарядов. Вы можете израсходовать 1 заряд и совершить дальнобойную атаку этим оружием, метнув его, как если бы оно обладало свойством «Метательное» с нормальной дистанцией 20 футов и максимальной дистанцией 60 футов. При попадании оружие издаёт раскат грома, слышимый на расстоянии до 300 футов. Цель и каждое существо в пределах 30 футов от неё, кроме вас, должны преуспеть в спасброске Телосложения со СЛ 17 или получить состояние «Ошеломлённый» до конца вашего следующего хода. Сразу после попадания или промаха оружие возвращается в вашу руку. Оружие восстанавливает 1d4 + 1 израсходованных зарядов ежедневно на рассвете.

    **_Погибель великанов._** Пока вы настроены на это оружие и носите *Пояс силы великана* или *Перчатки силы огра*, к которым вы тоже настроены, вы получаете следующие преимущества:

    **Гроза великанов.** Когда вы выбрасываете 20 на d20 при броске атаки этим оружием по Великану, существо должно преуспеть в спасброске Телосложения со СЛ 17 или умереть.

    **Мощь великанов.** Значение Силы, даруемое вашим *Поясом силы великана* или *Перчатками силы огра*, увеличивается на 4, до максимума 30.
# source: OmnisGM (CC BY 4.0)
- id: handy-haversack
  name: "Практичный рюкзак"
  description: |-
    *Чудесный предмет, редкий*

    Этот рюкзак имеет центральный карман и два боковых кармана, каждый из которых является экстрапланарным пространством. Каждый боковой карман может вместить до 200 фунтов материала объёмом не более 25 кубических футов. Центральный карман может вместить до 500 фунтов материала объёмом не более 64 кубических футов. Рюкзак всегда весит 5 фунтов независимо от содержимого.

    Извлечение предмета из рюкзака требует действия «Использование» или бонусного действия (на ваш выбор). Когда вы тянетесь в рюкзак за определённым предметом, предмет всегда магически оказывается сверху.

    Если любой из карманов переполнен, проколот или разорван, рюкзак разрывается и уничтожается. Если рюкзак уничтожен, его содержимое теряется навсегда, хотя артефакт всегда всплывает где-то снова. Если рюкзак вывернут наизнанку, его содержимое высыпается без вреда, и рюкзак необходимо вернуть в правильное положение, прежде чем использовать снова.

    Каждый карман рюкзака содержит достаточно воздуха для 10 минут дыхания, делённых на количество дышащих существ внутри.

    Помещение рюкзака внутрь экстрапланарного пространства, созданного *Сумкой вместимости*, *Переносной дырой* или аналогичным предметом, мгновенно уничтожает оба предмета и открывает врата в Астральный План. Врата возникают там, где один предмет был помещён в другой. Любое существо в пределах 10 футов от врат, не находящееся за полным укрытием, втягивается через них и оказывается в случайном месте на Астральном Плане. Затем врата закрываются. Врата односторонние и не могут быть открыты повторно.
# source: OmnisGM (CC BY 4.0)
- id: hat-of-disguise
  name: "Шляпа маскировки"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите эту шляпу, вы можете сотворить заклинание *Маскировка*. Заклинание заканчивается, если шляпа снята.
# source: OmnisGM (CC BY 4.0)
- id: headband-of-intellect
  name: "Обруч интеллекта"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Ваш Интеллект равен 19, пока вы носите этот обруч. Он не действует на вас, если ваш Интеллект без него равен или выше 19.
# source: OmnisGM (CC BY 4.0)
- id: helm-of-brilliance
  name: "Шлем сияния"
  description: |-
    *Чудесный предмет, очень редкий (требуется настройка)*

    Этот шлем украшен 1d10 бриллиантами, 2d10 рубинами, 3d10 огненными опалами и 4d10 опалами. Любой камень, извлечённый из шлема, рассыпается в прах. Когда все камни удалены или уничтожены, шлем теряет свою магию.

    Пока вы носите шлем, вы получаете следующие преимущества.

    **_Алмазный свет._** Пока в шлеме есть хотя бы один бриллиант, шлем испускает 30-футовую эманацию. Когда хотя бы одна нежить находится в этой области, эманация наполняется тусклым светом. Любая нежить, начинающая свой ход в этой области, получает 1d6 Урона излучением.

    **_Пламя огненного опала._** Пока в шлеме есть хотя бы один огненный опал, вы можете действием «Магия» заставить одно оружие, которое вы держите, вспыхнуть пламенем. Пламя испускает яркий свет в радиусе 10 футов и тусклый свет ещё на 10 футов. Пламя безвредно для вас и оружия. Когда вы попадаете атакой пылающим оружием, цель получает дополнительно 1d6 Огненного урона. Пламя горит, пока вы не используете бонусное действие, чтобы погасить его, или пока не уроните или не уберёте оружие.

    **_Рубиновое сопротивление._** Пока в шлеме есть хотя бы один рубин, вы обладаете сопротивлением Огненному урону.

    **_Заклинания._** Вы можете сотворить одно из следующих заклинаний (СЛ спасброска 18), используя один из камней шлема указанного типа в качестве компонента: *Дневной свет* (опал), *Огненный шар* (огненный опал), *Радужные брызги* (бриллиант) или *Огненная стена* (рубин). Камень уничтожается при сотворении заклинания и исчезает из шлема.

    **_Получение огненного урона._** Бросьте 1d20, если вы носите шлем и получаете Огненный урон в результате провала спасброска против заклинания. При выпадении 1 шлем испускает лучи света из оставшихся камней и затем уничтожается. Каждое существо в 60-футовой эманации от вас должно преуспеть в спасброске Ловкости со СЛ 17 или быть поражено лучом, получая Урон излучением, равный количеству камней в шлеме.
# source: OmnisGM (CC BY 4.0)
- id: helm-of-comprehending-languages
  name: "Шлем понимания языков"
  description: |-
    *Чудесный предмет, необычный*

    Пока вы носите этот шлем, вы можете сотворить из него *Понимание языков*.
# source: OmnisGM (CC BY 4.0)
- id: helm-of-telepathy
  name: "Шлем телепатии"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока вы носите этот шлем, вы обладаете телепатией с дистанцией 30 футов и можете сотворить *Обнаружение мыслей* или *Внушение* (СЛ спасброска 13) из шлема. После сотворения любого из этих заклинаний из шлема это заклинание нельзя сотворить из него снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: helm-of-teleportation
  name: "Шлем телепортации"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Этот шлем имеет 3 заряда. Пока вы носите его, вы можете израсходовать 1 заряд, чтобы сотворить из него *Телепорт*. Шлем восстанавливает 1d3 израсходованных заряда ежедневно на рассвете.
# source: OmnisGM (CC BY 4.0)
- id: holy-avenger
  name: "Святой заступник"
  description: |-
    *Оружие (любое простое или воинское), легендарный (требуется настройка паладином)*

    Вы получаете бонус +3 к броскам атаки и урона этим магическим оружием. Когда вы попадаете по исчадию или нежити этим оружием, существо получает дополнительно 2d10 Урона излучением.

    Пока вы держите обнажённое оружие, оно создаёт 10-футовую эманацию, исходящую от вас. Вы и все Дружественные вам существа в эманации совершаете с преимуществом спасброски против заклинаний и других магических эффектов. Если у вас 17 или более уровней в классе паладина, размер эманации увеличивается до 30 футов.
# source: OmnisGM (CC BY 4.0)
- id: horn-of-blasting
  name: "Рог взрыва"
  description: |-
    *Чудесный предмет, редкий*

    Вы можете действием «Магия» подуть в рог, испускающий громовой раскат в 30-футовом Конусе, слышимый на расстоянии до 600 футов. Каждое существо в Конусе совершает спасбросок Телосложения со СЛ 15. При провале существо получает 5d8 Громового урона и состояние «Оглохший» на 1 минуту. При успехе существо получает лишь половину этого урона. Стеклянные или хрустальные предметы в Конусе, которые не носят и не несут, получают 10d8 Громового урона.

    Каждое использование магии рога имеет 20-процентный шанс вызвать взрыв рога. Взрыв наносит 10d6 урона Силовым полем использующему и уничтожает рог.
# source: OmnisGM (CC BY 4.0)
- id: horn-of-valhalla
  name: "Рог Валгаллы"
  description: |-
    *Чудесный предмет, редкий (серебряный или латунный), очень редкий (бронзовый) или легендарный (железный)*

    Вы можете действием «Магия» подуть в этот рог. В ответ духи воинов с плана Исгард появляются в свободных пространствах в пределах 60 футов от вас. Каждый дух использует статблок **Берсерка** (Berserker) и возвращается в Исгард через 1 час или когда его хиты падают до 0. Духи выглядят как живые, дышащие воины и обладают иммунитетом к состояниям «Очарованный» и «Испуганный». Использовав рог, его нельзя использовать снова, пока не пройдёт 7 дней.

    Известно о существовании четырёх типов *Рога Валгаллы*, каждый из которых сделан из своего металла. Тип рога определяет, сколько духов он призывает, а также требование для его использования. Мастер выбирает тип рога или определяет его случайно по следующей таблице.

    Если вы дуете в рог, не соответствуя его требованию, призванные духи атакуют вас. Если вы соответствуете требованию, они Дружественны вам и вашим союзникам и выполняют ваши команды.

    | 1d100 | Тип рога   | Духи | Требование                           |
    |---|---|---|---|
    | 01–40 | Серебряный | 2    | Нет                                  |
    | 41–75 | Латунный   | 3    | Владение всем простым оружием        |
    | 76–90 | Бронзовый  | 4    | Обучение всем Средним доспехам       |
    | 91–00 | Железный   | 5    | Владение всем воинским оружием       |
# source: OmnisGM (CC BY 4.0)
- id: horseshoes-of-a-zephyr
  name: "Подковы зефира"
  description: |-
    *Чудесный предмет, очень редкий*

    Эти подковы продаются в наборе из четырёх. Действием «Магия» вы можете прикоснуться одной из подков к копыту лошади или похожего существа, после чего подкова прикрепляется к копыту. Снятие подковы также требует действия «Магия».

    Пока все четыре подковы закреплены на копытах лошади или подобного существа, они позволяют существу нормально перемещаться, паря в 4 дюймах над поверхностью. Благодаря этому существо может пересекать нетвёрдые или неустойчивые поверхности (такие как вода или лава) или стоять над ними. Существо не оставляет следов и игнорирует труднопроходимую местность. Кроме того, существо может путешествовать до 12 часов в день, не получая уровней Истощения от длительного перехода.
# source: OmnisGM (CC BY 4.0)
- id: horseshoes-of-speed
  name: "Подковы скорости"
  description: |-
    *Чудесный предмет, редкий*

    Эти подковы продаются в наборе из четырёх. Действием «Магия» вы можете прикоснуться одной из подков к копыту лошади или похожего существа, после чего подкова прикрепляется к копыту. Снятие подковы также требует действия «Магия».

    Пока все четыре подковы прикреплены к одному существу, его скорость увеличивается на 30 футов.
# source: OmnisGM (CC BY 4.0)
- id: immovable-rod
  name: "Недвижимый жезл"
  description: |-
    *Жезл, необычный*

    Этот железный жезл имеет кнопку на одном конце. Вы можете действием «Использование» нажать кнопку, что заставляет жезл магически зафиксироваться на месте. Пока вы или другое существо снова не нажмёте кнопку действием «Использование», жезл не двигается, даже вопреки силе тяжести. Жезл может выдержать до 8000 фунтов веса. Больший вес заставляет жезл деактивироваться и упасть. Существо может действием «Использование» совершить проверку Силы (Атлетика) со СЛ 30, сдвинув зафиксированный жезл до 10 футов при успехе.
# source: OmnisGM (CC BY 4.0)
- id: instant-fortress
  name: "Мгновенная крепость"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Действием «Магия» вы можете поставить эту 1-дюймовую адамантиновую статуэтку на землю и, произнеся командное слово, заставить её быстро вырасти в квадратную адамантиновую башню. Повторение командного слова заставляет башню вернуться к форме статуэтки, что работает, только если башня пуста. Каждое существо в области, где появляется башня, выталкивается в свободное пространство снаружи, но рядом с башней. Объекты в области, которые не носят и не несут, также выталкиваются из башни.

    Башня имеет 20 футов в ширину и 30 футов в высоту, с бойницами со всех сторон и зубчатым парапетом наверху. Её интерьер разделён на два этажа, соединённых стремянкой, лестницей или пандусом (на ваш выбор). Эта стремянка, лестница или пандус заканчивается люком, ведущим на крышу. При создании башня имеет единственную дверь на уровне земли на стороне, обращённой к вам. Дверь открывается только по вашей команде, которую вы можете отдать бонусным действием. Она имеет иммунитет к заклинанию *Открывание* и аналогичной магии.

    Магия не позволяет опрокинуть башню. Крыша, дверь и стены имеют КД 20; 100 хитов; иммунитет к Дробящему, Колющему и Рубящему урону, кроме наносимого осадным снаряжением; и сопротивление всем прочим видам урона. Уменьшение башни обратно до формы статуэтки не восстанавливает её повреждения. Только заклинание *Исполнение желаний* может восстановить башню (это использование заклинания считается воспроизведением заклинания 8-го уровня или ниже). Каждое сотворение *Исполнения желаний* заставляет башню восстановить все свои хиты.
# source: OmnisGM (CC BY 4.0)
- id: ioun-stone
  name: "Боевой камень Иуна"
  description: |-
    *Чудесный предмет, редкость варьируется (требуется настройка)*

    Размером примерно с мраморный шарик, *Боевые камни Иуна* названы в честь Иуна, бога знаний и пророчеств, почитаемого в некоторых мирах. Существует множество типов *Боевых камней Иуна*, каждый тип — особое сочетание формы и цвета.

    Когда вы действием «Магия» подбрасываете *Боевой камень Иуна* в воздух, камень начинает кружить вокруг вашей головы на расстоянии 1d3 футов, наделяя вас своим преимуществом, пока делает это. Одновременно вокруг вашей головы могут кружить до трёх *Боевых камней Иуна*.

    Каждый *Боевой камень Иуна*, кружащий вокруг вашей головы, считается носимым вами предметом. Кружащий камень избегает контакта с другими существами и предметами, корректируя свою орбиту, чтобы избежать столкновений, и срывает все попытки других существ атаковать или схватить его.

    Действием «Использование» вы можете схватить и убрать любое число *Боевых камней Иуна*, кружащих вокруг вашей головы. Если ваша настройка на *Боевой камень Иуна* заканчивается, пока он кружит вокруг вашей головы, камень падает, как если бы вы его уронили.

    Тип камня определяет его редкость и эффекты.

    **_Поглощение (очень редкий)._** Пока этот бледно-лавандовый эллипсоид кружит вокруг вашей головы, вы можете реакцией отменить заклинание 4-го уровня или ниже, сотворённое существом, которое вы видите. Отменённое заклинание не имеет эффекта, а все ресурсы, потраченные на его сотворение, тратятся впустую. Как только камень отменит 20 уровней заклинаний, он выгорает, становится тускло-серым и теряет свою магию.

    **_Проворство (очень редкий)._** Ваша Ловкость увеличивается на 2, до максимума 20, пока этот тёмно-красный шар кружит вокруг вашей головы.

    **_Осведомлённость (редкий)._** Пока этот тёмно-синий ромбоид кружит вокруг вашей головы, вы совершаете с преимуществом броски инициативы и проверки Мудрости (Внимательность).

    **_Стойкость (очень редкий)._** Ваше Телосложение увеличивается на 2, до максимума 20, пока этот розовый ромбоид кружит вокруг вашей головы.

    **_Великое поглощение (легендарный)._** Пока этот мраморный лавандово-зелёный эллипсоид кружит вокруг вашей головы, вы можете реакцией отменить заклинание 8-го уровня или ниже, сотворённое существом, которое вы видите. Отменённое заклинание не имеет эффекта, а все ресурсы, потраченные на его сотворение, тратятся впустую. Как только камень отменит 20 уровней заклинаний, он выгорает, становится тускло-серым и теряет свою магию.

    **_Проницательность (очень редкий)._** Ваша Мудрость увеличивается на 2, до максимума 20, пока этот светящийся синий шар кружит вокруг вашей головы.

    **_Интеллект (очень редкий)._** Ваш Интеллект увеличивается на 2, до максимума 20, пока этот мраморный алый и синий шар кружит вокруг вашей головы.

    **_Лидерство (очень редкий)._** Ваша Харизма увеличивается на 2, до максимума 20, пока этот мраморный розовый и зелёный шар кружит вокруг вашей головы.

    **_Мастерство (легендарный)._** Ваш бонус мастерства увеличивается на 1, пока эта бледно-зелёная призма кружит вокруг вашей головы.

    **_Защита (редкий)._** Вы получаете бонус +1 к Классу доспеха, пока эта пыльно-розовая призма кружит вокруг вашей головы.

    **_Регенерация (легендарный)._** Вы восстанавливаете 15 хитов в конце каждого часа, пока этот жемчужно-белый веретенообразный камень кружит вокруг вашей головы, если у вас есть хотя бы 1 хит.

    **_Резерв (редкий)._** Эта ярко-фиолетовая призма хранит сотворённые в неё заклинания, удерживая их, пока вы их не используете. Камень может хранить до 4 уровней заклинаний одновременно. При обнаружении он содержит 1d4 уровней хранимых заклинаний, выбранных Мастером.

    Любое существо может сотворить в камень заклинание с 1-го по 4-й уровень, коснувшись его во время сотворения. Заклинание не имеет эффекта, кроме сохранения в камне. Если камень не может вместить заклинание, заклинание тратится без эффекта. Уровень ячейки, использованной для сотворения заклинания, определяет, сколько места оно занимает.

    Пока этот камень кружит вокруг вашей головы, вы можете сотворить любое хранимое в нём заклинание. Заклинание использует уровень ячейки, СЛ спасброска заклинания, бонус атаки заклинанием и заклинательную характеристику исходного заклинателя, но во всём остальном считается сотворённым вами. Сотворённое из камня заклинание больше не хранится в нём, освобождая место.

    **_Сила (очень редкий)._** Ваша Сила увеличивается на 2, до максимума 20, пока этот бледно-голубой ромбоид кружит вокруг вашей головы.

    **_Пропитание (редкий)._** Вам не нужно есть или пить, пока этот прозрачный веретенообразный камень кружит вокруг вашей головы.
# source: OmnisGM (CC BY 4.0)
- id: iron-bands
  name: "Железные оковы"
  description: |-
    *Чудесный предмет, редкий*

    Эта ржавая железная сфера имеет 3 дюйма в диаметре и весит 1 фунт. Вы можете действием «Магия» бросить сферу в Огромное или меньшее существо, которое видите в пределах 60 футов от себя. Когда сфера летит по воздуху, она раскрывается в путаницу металлических полос.

    Совершите дальнобойную атаку с бонусом атаки, равным вашему модификатору Ловкости плюс ваш бонус мастерства. При попадании цель получает состояние «Опутан», пока вы бонусным действием не отдадите команду, которая освобождает её. При этом или при промахе полосы сжимаются и снова становятся сферой.

    Существо, которое может касаться полос, включая Опутанное, может действием совершить проверку Силы (Атлетика) со СЛ 20, чтобы сломать железные оковы. При успехе предмет уничтожается, и Опутанное существо освобождается. При провале любые дальнейшие попытки этого существа автоматически проваливаются в течение 24 часов.

    После использования оковы нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: iron-flask
  name: "Железная фляга"
  description: |-
    *Чудесный предмет, легендарный*

    Пока вы держите эту железную флягу с латунной пробкой, вы можете действием «Магия» нацелиться на существо, которое видите в пределах 60 футов от вас. Если фляга пуста и цель является уроженцем другого плана существования, отличного от того, на котором находитесь вы, цель должна преуспеть в спасброске Мудрости со СЛ 17 или оказаться заключённой во фляге. Если цель уже была заключена во флягу ранее, она совершает спасбросок с преимуществом. Во фляге может находиться только одно существо одновременно. Существо, заключённое во фляге, не стареет и не нуждается в дыхании, еде или питье.

    Вы можете действием «Магия» снять пробку и освободить существо из фляги. Существо затем подчиняется вашим командам в течение 1 часа, понимая эти команды, даже если не знает языка, на котором они отдаются. Если вы не отдаёте команд или отдаёте команду, которая, вероятно, приведёт к его смерти или заключению, существо защищает себя, но не предпринимает иных действий. В конце длительности существо действует в соответствии со своим нормальным характером и мировоззрением.

    Заклинание *Идентификация* раскрывает, содержит ли фляга существо, но единственный способ определить тип существа — открыть флягу. Только что найденная *Железная фляга* может уже содержать существо, выбранное Мастером.
# source: OmnisGM (CC BY 4.0)
- id: javelin-of-lightning
  name: "Копьё молнии"
  description: |-
    *Оружие (копьё), необычный*

    Каждый раз, когда вы совершаете бросок атаки этим магическим оружием и попадаете, вы можете заставить его нанести Урон электричеством вместо Колющего урона.

    *Удар молнии.* Когда вы бросаете это оружие в цель не далее 120 футов от вас, вы можете отказаться от совершения дальнобойной атаки и вместо этого превратить оружие в молнию. Эта молния образует линию шириной 5 футов между вами и целью. Цель и каждое другое существо на линии (кроме вас) совершает спасбросок Ловкости со СЛ 13, получая 4d6 Урона электричеством при провале или половину этого урона при успехе. Сразу после нанесения этого урона оружие появляется в вашей руке. Это свойство нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: lantern-of-revealing
  name: "Фонарь раскрытия"
  description: |-
    *Чудесный предмет, необычный*

    Пока этот фонарь с заслонкой горит, он расходует 1 пинту масла за 6 часов, испуская яркий свет в радиусе 30 футов и тусклый свет ещё на 30 футов. Невидимые существа и предметы видны, пока находятся в ярком свете фонаря. Вы можете действием «Использование» опустить заслонку, уменьшив свет фонаря до тусклого в радиусе 5 футов.
# source: OmnisGM (CC BY 4.0)
- id: luck-blade
  name: "Удача (клинок)"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч, рапира, скимитар, серп или короткий меч), легендарный (требуется настройка)*

    Вы получаете бонус +1 к броскам атаки и урона этим магическим оружием. Пока оружие при вас, вы также получаете бонус +1 к спасброскам.

    *Удача.* Если оружие при вас, вы можете призвать его удачу (действие не требуется), чтобы перебросить одну проваленную Проверку d20, если у вас нет состояния «Недееспособный». Вы должны использовать второй результат. Использовав это свойство, его нельзя использовать снова до следующего рассвета.

    *Исполнение желаний.* Оружие имеет 1d3 заряда. Держа его, вы можете израсходовать 1 заряд и сотворить из него *Исполнение желаний*. Использовав это свойство, его нельзя использовать снова до следующего рассвета. Если у оружия не остаётся зарядов, оно теряет это свойство.
# source: OmnisGM (CC BY 4.0)
- id: mace-of-disruption
  name: "Булава разрушения"
  description: |-
    *Оружие (булава), редкий (требуется настройка)*

    Когда вы попадаете по исчадию или нежити этим магическим оружием, существо получает дополнительно 2d6 Урона излучением. Если у цели остаётся 25 хитов или меньше после получения этого урона, она должна преуспеть в спасброске Мудрости со СЛ 15 или быть уничтожена. При успешном спасброске существо получает состояние «Испуганный» до конца вашего следующего хода.

    **_Свет._** Пока вы держите это оружие, оно испускает яркий свет в радиусе 20 футов и тусклый свет ещё на 20 футов.
# source: OmnisGM (CC BY 4.0)
- id: mace-of-smiting
  name: "Булава крушения"
  description: |-
    *Оружие (булава), редкий*

    Вы получаете бонус +1 к броскам атаки и урона этим магическим оружием. Бонус увеличивается до +3, когда вы используете оружие для атаки конструкта.

    Когда вы выбрасываете 20 на броске атаки этим оружием, цель получает дополнительно 7 Дробящего урона, или 14 Дробящего урона, если это конструкт. Если у конструкта остаётся 25 хитов или меньше после получения этого урона, он уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: mace-of-terror
  name: "Булава ужаса"
  description: |-
    *Оружие (булава), редкий (требуется настройка)*

    Это магическое оружие имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Пока вы держите оружие, вы можете действием «Магия» израсходовать 1 заряд, чтобы выпустить волну ужаса из него. Каждое выбранное вами существо в пределах 30 футов от вас должно преуспеть в спасброске Мудрости со СЛ 15 или получить состояние «Испуганный» на 1 минуту. Пока Испугано таким образом, существо должно тратить свои ходы, пытаясь отойти от вас как можно дальше, и не может совершать провоцированные атаки. В качестве действия оно может использовать только Рывок или пытаться высвободиться из эффекта, не позволяющего ему двигаться. Если ему некуда двигаться, существо может совершить Уклонение. В конце каждого своего хода существо повторяет спасбросок, прекращая эффект на себе при успехе.
# source: OmnisGM (CC BY 4.0)
- id: mantle-of-spell-resistance
  name: "Мантия сопротивления заклинаниям"
  description: |-
    *Чудесный предмет, редкий (требуется настройка)*

    Пока вы носите эту мантию, вы совершаете с преимуществом спасброски против заклинаний.
# source: OmnisGM (CC BY 4.0)
- id: manual-of-bodily-health
  name: "Мануал Бодрого Здоровья"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга содержит советы по здоровью и питанию, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и следование её рекомендациям, ваше Телосложение увеличивается на 2, до максимума 30. Затем мануал теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: manual-of-gainful-exercise
  name: "Мануал Полезных Упражнений"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга описывает фитнес-упражнения, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и следование её рекомендациям, ваша Сила увеличивается на 2, до максимума 30. Затем мануал теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: manual-of-golems
  name: "Мануал Големов"
  description: |-
    *Чудесный предмет, очень редкий*

    Этот том содержит сведения и заклинания, необходимые для создания определённого типа голема. Мастер выбирает тип или определяет его случайно по прилагаемой таблице. Чтобы расшифровать и использовать мануал, вы должны быть заклинателем как минимум с двумя ячейками заклинаний 5-го уровня. Существо, которое не может использовать *Мануал Големов* и пытается прочитать его, получает 6d6 Психического урона.

    Чтобы создать голема, вы должны потратить время, указанное в таблице, работая без перерыва с мануалом под рукой и отдыхая не более 8 часов в день. Вы также должны заплатить указанную стоимость на покупку материалов.

    Как только вы завершите создание голема, книга сгорает в таинственном пламени. Голем оживает, когда пепел мануала посыпают на него. Статблок голема см. в разделе «Монстры». Голем находится под вашим контролем, понимает и выполняет ваши команды.

    | 1d20  | Голем          | Время    | Стоимость   |
    |---|---|---|---|
    | 1–5   | Глиняный голем | 30 дней  | 65 000 зм   |
    | 6–17  | Голем из плоти | 60 дней  | 50 000 зм   |
    | 18    | Железный голем | 120 дней | 100 000 зм  |
    | 19–20 | Каменный голем | 90 дней  | 80 000 зм   |
# source: OmnisGM (CC BY 4.0)
- id: manual-of-quickness-of-action
  name: "Мануал Быстроты Действий"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга содержит упражнения на координацию и равновесие, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и следование её рекомендациям, ваша Ловкость увеличивается на 2, до максимума 30. Затем мануал теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: marvelous-pigments
  name: "Волшебные краски"
  description: |-
    *Чудесный предмет, очень редкий*

    Этот тонкий деревянный ящик содержит 1d4 горшочка краски и кисть (общим весом 1 фунт).

    Используя кисть и расходуя 1 горшочек краски, вы можете нарисовать любое количество трёхмерных объектов и элементов ландшафта (таких как стены, двери, деревья, цветы, оружие, паутина и ямы) при условии, что все эти элементы умещаются в 20-футовом Кубе. Работа занимает 10 минут (независимо от числа создаваемых элементов), в течение которых вы должны оставаться в Кубе, и требует Концентрации. Если ваша Концентрация прервана или вы покидаете Куб до завершения работы, все нарисованные элементы исчезают, а горшочек краски расходуется впустую.

    Когда работа закончена, все нарисованные объекты и элементы ландшафта становятся реальными. Так, нарисованная на стене дверь создаёт настоящую дверь, которую можно открыть в то, что находится за ней. Нарисованная яма создаёт настоящую яму, вся глубина которой должна умещаться в пределах 20-футового Куба.

    Ни один объект, созданный горшочком краски, не может стоить более 25 зм, а общая стоимость всех объектов, созданных горшочком краски, не может превышать 500 зм. Если вы рисуете объекты большей стоимости (например, большую кучу золота), они выглядят настоящими, но при тщательном осмотре оказывается, что они сделаны из пасты, печенья или другого бесполезного материала.

    Если вы рисуете форму энергии, такую как огонь или молния, энергия рассеивается, как только вы завершаете рисунок, не причиняя вреда.
# source: OmnisGM (CC BY 4.0)
- id: medallion-of-thoughts
  name: "Медальон мыслей"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Медальон имеет 5 зарядов. Пока вы носите его, вы можете израсходовать 1 заряд, чтобы сотворить из него *Обнаружение мыслей* (СЛ спасброска 13). Медальон восстанавливает 1d4 израсходованных заряда ежедневно на рассвете.
# source: OmnisGM (CC BY 4.0)
- id: mirror-of-life-trapping
  name: "Зеркало заточения"
  description: |-
    *Чудесный предмет, очень редкий*

    Если смотреть на это зеркало высотой 4 фута и шириной 2 фута косвенно, на его поверхности видны слабые изображения существ. Зеркало весит 50 фунтов и имеет КД 11, 10 хитов, иммунитет к урону Ядом и Психическому урону, а также уязвимость к Дробящему урону. Оно разбивается и уничтожается, когда его хиты падают до 0.

    Если зеркало висит на вертикальной поверхности и вы находитесь в пределах 5 футов от него, вы можете действием «Магия» произнести командное слово, чтобы активировать его. Оно остаётся активированным, пока вы действием «Магия» не повторите командное слово для его деактивации.

    Любое существо, кроме вас, которое видит своё отражение в активированном зеркале и находится в пределах 30 футов от него, должно преуспеть в спасброске Харизмы со СЛ 15 или оказаться заключённым вместе со всем своим снаряжением в одном из двенадцати экстрапланарных отсеков зеркала. Существо, знающее природу зеркала, совершает спасбросок с преимуществом, а конструкты проходят его автоматически.

    Экстрапланарный отсек — это бесконечное пространство, заполненное густым туманом, который ограничивает видимость до 10 футов. Существа, заключённые в отсеках зеркала, не стареют и не нуждаются в еде, питье или сне. Существо, заключённое в отсеке, может выбраться с помощью магии, позволяющей межпланарное перемещение. В противном случае существо остаётся заключённым, пока не будет освобождено.

    Если зеркало заключает существо, но все двенадцать экстрапланарных отсеков уже заняты, зеркало освобождает одно заключённое существо случайным образом, чтобы разместить нового пленника. Освобождённое существо появляется в свободном пространстве в пределах видимости зеркала, но лицом от него. Если зеркало разбивается, все заключённые в нём существа освобождаются и появляются в свободных пространствах рядом с ним.

    Находясь в пределах 5 футов от зеркала, вы можете действием «Магия» назвать одно существо, заключённое в нём, или назвать конкретный отсек по номеру. Существо, названное или содержащееся в названном отсеке, появляется как изображение на поверхности зеркала. Вы и существо можете затем общаться.

    Аналогичным образом вы можете действием «Магия» произнести второе командное слово, чтобы освободить одно существо, заключённое в зеркале. Освобождённое существо появляется вместе со своим имуществом в ближайшем к зеркалу свободном пространстве, лицом от него.

    Помещение зеркала внутрь экстрапланарного пространства, созданного *Сумкой вместимости*, *Переносной дырой* или аналогичным предметом, мгновенно уничтожает обе вещи и открывает врата в Астральный План. Врата возникают там, где один предмет был помещён в другой. Каждое существо в пределах 10 футов от врат, не находящееся за полным укрытием, втягивается через них в случайное место на Астральном Плане. Затем врата закрываются. Врата односторонние и не могут быть открыты повторно.
# source: OmnisGM (CC BY 4.0)
- id: mithral-armor
  name: "Мифриловый доспех"
  description: |-
    *Доспех (любой Средний или Тяжёлый, кроме шкурного доспеха), необычный*

    Мифрил — лёгкий, гибкий металл. Доспех из этого материала можно носить под обычной одеждой. Если доспех обычно налагает помеху на проверки Ловкости (Скрытность) или имеет требование к Силе, мифриловая версия доспеха — нет.
# source: OmnisGM (CC BY 4.0); differs from our English, see tools/omnisgm-import/README
- id: mysterious-deck
  name: "Таинственная колода"
  description: |-
    *Чудесный предмет, легендарный*

    Обычно находимая в шкатулке или мешочке, эта колода содержит некоторое количество карт из слоновой кости или пергамента. У большинства (75 процентов) таких колод тринадцать карт, но у некоторых — двадцать две. При случайном определении вытянутых из колоды карт используйте соответствующий столбец таблицы «Таинственная колода».

    Прежде чем вытянуть карту, вы должны объявить, сколько карт намерены вытянуть, а затем вытянуть их случайным образом. Карты, вытянутые сверх этого числа, не имеют эффекта. В остальных случаях, как только вы вытягиваете карту из колоды, её магия вступает в силу. Каждую карту нужно вытягивать не позднее чем через 1 час после предыдущей. Если вы не вытянете выбранное число карт, оставшиеся карты сами вылетают из колоды и вступают в силу все разом.

    Вытянутая карта исчезает. Если это не Дурак и не Шут, карта вновь появляется в колоде, так что одну и ту же карту можно вытянуть дважды. (После того как Дурак или Шут покинул колоду, перебросьте по таблице, если эта карта выпадает снова.)

    Table: Таинственная колода

    | 1d100 (колода из 13 карт) | 1d100 (колода из 22 карт) | Карта |
    |---|---|---|
    | —     | 01–05 | Равновесие |
    | —     | 06–10 | Комета |
    | —     | 11–14 | Донжон |
    | 01–08 | 15–18 | Эвриала |
    | —     | 19–23 | Судьбы |
    | 09–16 | 24–27 | Пламя |
    | —     | 28–31 | Дурак |
    | —     | 32–36 | Самоцвет |
    | 17–24 | 37–41 | Шут |
    | 25–32 | 42–46 | Ключ |
    | 33–40 | 47–51 | Рыцарь |
    | 41–48 | 52–56 | Луна |
    | —     | 57–60 | Загадка |
    | 49–56 | 61–64 | Плут |
    | 57–64 | 65–68 | Разорение |
    | —     | 69–73 | Мудрец |
    | 65–72 | 74–77 | Череп |
    | 73–80 | 78–82 | Звезда |
    | 81–88 | 83–87 | Солнце |
    | —     | 88–91 | Когти |
    | 89–96 | 92–96 | Трон |
    | 97–00 | 97–00 | Пустота |

    Эффект каждой карты описан ниже.

    **_Равновесие._** Вы можете увеличить одно из значений своих характеристик на 2, максимум до 22, при условии что также уменьшите другое значение характеристики на 2. Нельзя уменьшать характеристику со значением 5 или ниже. Как вариант, вы можете не изменять значения характеристик, и тогда эта карта не имеет эффекта.

    **_Комета._** В следующий раз, когда вы вступите в бой против одного или нескольких Враждебных существ, при броске инициативы вы можете выбрать одно из них своим противником. Если во время этого боя вы снизите хиты противника до 0, вы получаете преимущество на спасброски от смерти на 1 год. Если хиты выбранного противника до 0 снизит кто-то другой или вы не выберете противника, эта карта не имеет эффекта.

    **_Донжон._** Вы исчезаете и оказываетесь заточены в состоянии анабиоза во внепространственной сфере. Всё, что вы носите и несёте, исчезает вместе с вами, кроме Артефактов, которые остаются в пространстве, которое вы занимали в момент исчезновения. Вы остаётесь в заточении, пока вас не найдут и не извлекут из сферы. Вас нельзя обнаружить никакой магией Прорицания, но заклинание *Исполнение желаний* может открыть местонахождение вашей темницы. Больше карт вы не вытягиваете.

    **_Эвриала._** Медузоподобный лик карты проклинает вас. Пока вы прокляты таким образом, вы получаете штраф −2 к спасброскам. Снять это проклятие может только бог или магия карты «Судьбы».

    **_Судьбы._** Ткань реальности распускается и сплетается заново, позволяя вам избежать или стереть одно событие, как будто его никогда не было. Вы можете использовать магию карты сразу же, как вытянули её, или в любое другое время до своей смерти.

    **_Пламя._** Могущественный дьявол становится вашим врагом. Дьявол жаждет вашей погибели и мучает вас, смакуя ваши страдания, прежде чем попытаться убить вас. Эта вражда длится, пока не умрёте вы или дьявол.

    **_Дурак._** В течение следующих 72 часов вы совершаете Проверки d20 с помехой. Вытяните ещё одну карту; это вытягивание не засчитывается в число объявленных вами.

    **_Самоцвет._** У ваших ног появляются двадцать пять ювелирных изделий стоимостью 2000 зм каждое или пятьдесят самоцветов стоимостью 1000 зм каждый.

    **_Шут._** В течение следующих 72 часов вы совершаете Проверки d20 с преимуществом, либо вы можете вытянуть две дополнительные карты сверх объявленных.

    **_Ключ._** При вас появляется магическое оружие Редкой или большей редкости, которым вы владеете. Оружие выбирает Мастер.

    **_Рыцарь._** Вы получаете услугу **Рыцаря**, который магически появляется в свободном пространстве по вашему выбору в пределах 30 футов от себя. Рыцарь имеет то же мировоззрение, что и вы, и служит вам верно до самой смерти, веря, что вас двоих свела судьба. Вместе с Мастером придумайте имя и предысторию для этого НИП. Мастер по желанию может использовать другой блок статистики для представления рыцаря.

    **_Луна._** Вы получаете способность сотворить *Исполнение желаний* 1d3 раза.

    **_Загадка._** Навсегда уменьшите свой Интеллект или Мудрость на 1d4 + 1 (до минимального значения 1). Вы можете вытянуть одну дополнительную карту сверх объявленных.

    **_Плут._** НИП по выбору Мастера становится Враждебным к вам. Вы не знаете, кто этот НИП, пока он сам или кто-то другой не раскроет это. Ничто, кроме заклинания *Исполнение желаний* или божественного вмешательства, не может прекратить враждебность НИП к вам.

    **_Разорение._** Все формы богатства, которые вы несёте или которыми владеете, кроме магических предметов, для вас потеряны. Переносимое имущество исчезает. Предприятия, здания и земли, которыми вы владеете, теряются так, чтобы это как можно меньше меняло реальность. Любые документы, доказывающие, что вы должны владеть чем-то потерянным из-за этой карты, также исчезают.

    **_Мудрец._** В любой выбранный вами момент в течение одного года после вытягивания этой карты вы можете задать вопрос в медитации и мысленно получить правдивый ответ на него.

    **_Череп._** **Аватар смерти** (см. прилагаемый блок статистики) появляется в свободном пространстве как можно ближе к вам. Аватар нацеливает свои атаки только на вас; он выглядит как призрачный скелет в изодранной чёрной мантии и с призрачной косой. Аватар исчезает, когда его хиты падают до 0 или когда вы умираете. Если ваш союзник наносит урон аватару, этот союзник призывает другого **Аватара смерти**. Новый аватар появляется в свободном пространстве как можно ближе к этому союзнику и нацеливает свои атаки только на него. Вы и каждый из ваших союзников можете призвать лишь одного аватара как следствие этого вытягивания. Существо, убитое аватаром, нельзя вернуть к жизни.

    **_Звезда._** Увеличьте одно из значений своих характеристик на 2, максимум до 24.

    **_Солнце._** При вас появляется магический предмет (выбранный Мастером). Кроме того, вы получаете 10 временных хитов ежедневно на рассвете, пока не умрёте.

    **_Когти._** Каждый магический предмет, который вы носите или несёте, распадается. Артефакты в вашем владении вместо этого исчезают.

    **_Трон._** Вы получаете владение и Компетентность в одном навыке на выбор: История, Проницательность, Запугивание или Убеждение. Кроме того, вы получаете законное право владения небольшой крепостью где-то в мире. Однако сейчас в этой крепости обитают одно или несколько чудовищ, которых нужно истребить, прежде чем вы сможете объявить крепость своей.

    **_Пустота._** Ваша душа извлекается из тела и заключается в предмет в месте по выбору Мастера. Это место охраняют одно или несколько могущественных существ. Пока ваша душа заточена таким образом, ваше тело неподвижно, перестаёт стареть и не нуждается в пище, воздухе или воде. Заклинание *Исполнение желаний* не может вернуть вашу душу в тело, но раскрывает местонахождение предмета, в котором заключена ваша душа. Больше карт вы не вытягиваете.

    > #### Аватар смерти (Avatar of Death)
    >
    > *Средняя Нежить, нейтрально-злой*
    >
    > **КД** 20
    >
    > **Инициатива** +3 (13)
    >
    > **Хиты** Половина максимума хитов призывателя
    >
    > **Скорость** 60 футов, Полёт 60 футов (парение)
    >
    > | Характеристика | Значение | Мод | Спас |
    > |-----------|-------|-----|------|
    > | Сил       | 16    | +3  | +3   |
    > | Лов       | 16    | +3  | +3   |
    > | Тел       | 16    | +3  | +3   |
    > | Инт       | 16    | +3  | +3   |
    > | Мдр       | 16    | +3  | +3   |
    > | Хар       | 16    | +3  | +3   |
    >
    >
    > **Иммунитеты** Некротический, Яд; Очарованный, Истощение, Испуганный, Парализованный, Окаменевший, Отравленный, Без сознания
    >
    > **Чувства** Истинное зрение 60 футов, Пассивная Внимательность 13
    >
    > **Языки** Все языки, известные его призывателю
    >
    > **ПО** Нет (ОО 0; БМ равен призывателю)
    >
    > ##### Особенности
    >
    > **_Бестелесное перемещение._** Аватар может перемещаться сквозь других существ и предметы, как если бы они были труднопроходимой местностью. Он получает 5 (1d10) урона Силовым полем, если заканчивает свой ход внутри предмета.
    >
    > ##### Действия
    >
    > **_Мультиатака._** Аватар совершает столько атак Жнущей косой, сколько равно половине бонуса мастерства призывателя (округляя вверх).
    >
    > **_Жнущая коса. Бросок рукопашной атаки:_** Автоматическое попадание, досягаемость 5 футов. *Попадание:* 7 (1d8 + 3) Рубящего урона плюс 4 (1d8) Некротического урона.
