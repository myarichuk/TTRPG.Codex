    Пока эта жемчужина при вас, вы можете действием «Магия» восстановить одну израсходованную ячейку заклинания 3-го уровня или ниже. Использовав жемчужину, её нельзя использовать снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
