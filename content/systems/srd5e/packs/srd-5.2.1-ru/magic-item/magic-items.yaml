    **_Восстановление зарядов._** Посох восстанавливает 1d6 + 4 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох исчезает во вспышке света, потерянный навсегда.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-power
  name: "Посох силы"
  description: |-
    *Посох, очень редкий (требуется настройка Чародеем, Колдуном или Волшебником)*

    Этот посох имеет 20 зарядов и может использоваться как магический боевой посох, дающий бонус +2 к броскам атаки и урона, совершаемым им. Держа его, вы получаете бонус +2 к Классу доспеха, спасброскам и броскам атак заклинаниями.

    **_Заклинания._** Держа посох, вы можете сотворить из него одно из заклинаний в следующей таблице, используя СЛ спасброска ваших заклинаний. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Конус холода | 5 |
    | Огненный шар (версия 5-го уровня) | 5 |
    | Сфера неуязвимости | 6 |
    | Удержание чудовища | 5 |
    | Левитация | 2 |
    | Молния (версия 5-го уровня) | 5 |
    | Магическая стрела | 1 |
    | Луч ослабления | 1 |
    | Стена силы | 5 |

    **_Восстановление зарядов._** Посох восстанавливает 2d8 + 4 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох сохраняет бонус +2 к броскам атаки и урона, но теряет все прочие свойства. При выпадении 20 посох восстанавливает 1d8 + 2 заряда.

    **_Возмездный удар._** Вы можете действием «Магия» переломить посох о колено или о твёрдую поверхность. Посох уничтожается и высвобождает свою магию во взрыве, заполняющем 30-футовую эманацию, исходящую от него. У вас есть 50-процентный шанс мгновенно перенестись в случайный план существования, избежав взрыва. Если вы не избежали эффекта, вы получаете урон Силовым полем, равный 16-кратному числу зарядов в посохе. Каждое другое существо в области совершает спасбросок Ловкости со СЛ 17. При провале существо получает урон Силовым полем, равный 4-кратному числу зарядов в посохе. При успехе существо получает вдвое меньше урона.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-striking
  name: "Посох поражения"
  description: |-
    *Посох, очень редкий (требуется настройка)*

    Этот посох может использоваться как магический боевой посох, дающий бонус +3 к броскам атаки и урона, совершаемым им.

    Посох имеет 10 зарядов. Когда вы попадаете рукопашной атакой им, вы можете израсходовать до 3 зарядов. За каждый израсходованный заряд цель получает дополнительно 1d6 урона Силовым полем.

    **_Восстановление зарядов._** Посох восстанавливает 1d6 + 4 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох становится немагическим боевым посохом.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-swarming-insects
  name: "Посох роя насекомых"
  description: |-
    *Посох, редкий (требуется настройка Бардом, Жрецом, Друидом, Чародеем, Колдуном или Волшебником)*

    Этот посох имеет 10 зарядов.

    **_Облако насекомых._** Держа посох, вы можете действием «Магия» израсходовать 1 заряд, чтобы заставить рой безвредных летающих насекомых заполнить 30-футовую эманацию, исходящую от вас. Насекомые остаются 10 минут, делая область Сильно затемнённой для существ, кроме вас. Сильный ветер (например, созданный *Порывом ветра*) рассеивает рой и прекращает эффект.

    **_Заклинания._** Держа посох, вы можете сотворить из него одно из заклинаний в следующей таблице, используя СЛ спасброска ваших заклинаний и модификатор атаки заклинанием. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Гигантское насекомое | 4 |
    | Нашествие насекомых | 5 |

    **_Восстановление зарядов._** Посох восстанавливает 1d6 + 4 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 рой насекомых поглощает и уничтожает посох, а затем рассеивается.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-the-magi
  name: "Посох мага"
  description: |-
    *Посох, легендарный (требуется настройка Чародеем, Колдуном или Волшебником)*

    Этот посох имеет 50 зарядов и может использоваться как магический боевой посох, дающий бонус +2 к броскам атаки и урона, совершаемым им. Держа его, вы получаете бонус +2 к броскам атак заклинаниями.

    **_Поглощение заклинаний._** Держа посох, вы совершаете с преимуществом спасброски против заклинаний. Кроме того, вы можете реакцией, когда другое существо сотворяет заклинание, нацеленное только на вас. Если вы это делаете, посох поглощает магию заклинания, отменяя его эффект и получая число зарядов, равное уровню поглощённого заклинания. Однако, если при этом общее число зарядов посоха превысит 50, посох взрывается, как если бы вы активировали его Возмездный удар (см. ниже).

    **_Заклинания._** Держа посох, вы можете сотворить из него одно из заклинаний в следующей таблице, используя СЛ спасброска ваших заклинаний. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Арканный замок | 0 |
    | Сотворение элементаля | 7 |
    | Обнаружение магии | 0 |
    | Рассеивание магии | 3 |
    | Увеличение/уменьшение | 0 |
    | Огненный шар (версия 7-го уровня) | 7 |
    | Пылающая сфера | 2 |
    | Град | 4 |
    | Невидимость | 2 |
    | Открывание | 2 |
    | Свет | 0 |
    | Молния (версия 7-го уровня) | 7 |
    | Волшебная рука | 0 |
    | Проход | 5 |
    | Переход между планами | 7 |
    | Защита от добра и зла | 0 |
    | Телекинез | 5 |
    | Стена огня | 4 |
    | Паутина | 2 |

    **_Восстановление зарядов._** Посох восстанавливает 4d6 + 2 израсходованных заряда ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 20 посох восстанавливает 1d12 + 1 заряд.

    **_Возмездный удар._** Вы можете действием «Магия» переломить посох о колено или о твёрдую поверхность. Посох уничтожается и высвобождает свою магию во взрыве, заполняющем 30-футовую эманацию, исходящую от него. У вас есть 50-процентный шанс мгновенно перенестись в случайный план существования, избежав взрыва. Если вы не избежали эффекта, вы получаете урон Силовым полем, равный 16-кратному числу зарядов в посохе. Каждое другое существо в области совершает спасбросок Ловкости со СЛ 17. При провале существо получает урон Силовым полем, равный 6-кратному числу зарядов в посохе. При успехе существо получает вдвое меньше урона.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-the-python
  name: "Посох питона"
  description: |-
    *Посох, необычный (требуется настройка)*

    Действием «Магия» вы можете бросить этот посох так, чтобы он приземлился в свободном пространстве в пределах 10 футов от вас, превратившись в этом пространстве в **Гигантского удава**. Змея под вашим контролем и разделяет ваш счёт Инициативы, действуя сразу после вас.

    В свой ход вы можете мысленно командовать змеёй (действие не требуется), если она в пределах 60 футов от вас и у вас нет состояния «Недееспособный». Вы решаете, какое действие змея совершает и куда перемещается в свой ход, либо можете отдать ей общий приказ, например атаковать ваших врагов или охранять место. В отсутствие ваших приказов змея защищается.

    Бонусным действием вы можете приказать змее вернуться в форму посоха в её текущем пространстве, и тогда вы не можете использовать это свойство посоха снова в течение 1 часа. Если хиты змеи снижены до 0, она умирает и возвращается в форму посоха; тогда посох раскалывается и уничтожается. Если змея возвращается в форму посоха до того, как потеряет все свои хиты, она восстанавливает их все.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-the-woodlands
  name: "Посох леса"
  description: |-
    *Посох, редкий (требуется настройка Друидом)*

    Этот посох имеет 6 зарядов и может использоваться как магический боевой посох, дающий бонус +2 к броскам атаки и урона, совершаемым им. Держа его, вы получаете бонус +2 к броскам атак заклинаниями.

    **_Заклинания._** Держа посох, вы можете сотворить из него одно из заклинаний в следующей таблице, используя СЛ спасброска ваших заклинаний. Таблица указывает, сколько зарядов нужно израсходовать, чтобы сотворить заклинание.

    | Заклинание | Стоимость в зарядах |
    |---|---|
    | Дружба с животными | 1 |
    | Пробуждение | 5 |
    | Кора | 2 |
    | Поиск животных или растений | 2 |
    | Бесследное передвижение | 2 |
    | Разговор с животными | 1 |
    | Разговор с растениями | 3 |
    | Стена тернов | 6 |

    **_Форма дерева._** Вы можете действием «Магия» воткнуть один конец посоха в землю в свободном пространстве и израсходовать 1 заряд, чтобы превратить посох в здоровое дерево. Дерево имеет высоту 60 футов и ствол диаметром 5 футов, а его ветви наверху раскидываются в радиусе 20 футов. Дерево выглядит обычным, но излучает слабую ауру магии школы Преобразования, которую можно распознать заклинанием *Обнаружение магии*. Касаясь дерева и используя действие «Магия», вы возвращаете посох в его обычную форму. Любое существо на дереве падает, когда дерево возвращается в посох.

    **_Восстановление зарядов._** Посох восстанавливает 1d6 израсходованных зарядов ежедневно на рассвете. Если вы расходуете последний заряд, бросьте 1d20. При выпадении 1 посох теряет свои свойства и становится немагическим боевым посохом.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-thunder-and-lightning
  name: "Посох грома и молнии"
  description: |-
    *Посох, очень редкий (требуется настройка)*

    Этот посох может использоваться как магический боевой посох, дающий бонус +2 к броскам атаки и урона, совершаемым им. У него также есть следующие дополнительные свойства. Как только одно из этих свойств использовано, его нельзя использовать снова до следующего рассвета.

    **_Молния._** Когда вы попадаете рукопашной атакой посохом, вы можете заставить цель получить дополнительно 2d6 урона Электричеством (действие не требуется).

    **_Гром._** Когда вы попадаете рукопашной атакой посохом, вы можете заставить посох издать раскат грома, слышимый на расстоянии до 300 футов (действие не требуется). Цель, по которой вы попали, должна преуспеть в спасброске Телосложения со СЛ 17 или получить состояние «Ошеломлённый» до конца вашего следующего хода.

    **_Гром и молния._** Сразу после того, как вы попадаете рукопашной атакой посохом, вы можете бонусным действием использовать свойства «Молния» и «Гром» (см. выше) одновременно. Это не расходует дневное использование тех свойств, только использование этого.

    **_Удар молнии._** Вы можете действием «Магия» заставить молнию сорваться с кончика посоха линией шириной 5 футов и длиной 120 футов. Каждое существо на этой линии совершает спасбросок Ловкости со СЛ 17, получая 9d6 урона Электричеством при провале или вдвое меньше урона при успехе.

    **_Раскат грома._** Вы можете действием «Магия» заставить посох произвести раскат грома, слышимый на расстоянии до 600 футов. Каждое существо в 60-футовой эманации, исходящей от вас, совершает спасбросок Телосложения со СЛ 17. При провале существо получает 2d6 урона Громом и состояние «Оглохший» на 1 минуту. При успехе существо получает только вдвое меньше урона.
# source: OmnisGM (CC BY 4.0)
- id: staff-of-withering
  name: "Посох увядания"
  description: |-
    *Посох, редкий (требуется настройка)*

    Этот посох имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете.

    Посох может использоваться как магический боевой посох. При попадании он наносит урон как обычный боевой посох, и вы можете израсходовать 1 заряд, чтобы нанести цели дополнительно 2d10 Некротического урона и заставить её совершить спасбросок Телосложения со СЛ 15. При провале цель в течение 1 часа совершает с помехой любые проверки характеристик или спасброски, использующие Силу или Телосложение.
# source: OmnisGM (CC BY 4.0)
- id: stone-of-controlling-earth-elementals
  name: "Камень управления земными элементалями"
  description: |-
    *Чудесный предмет, редкий*

    Касаясь этим камнем весом 5 фунтов земли, вы можете действием «Магия» призвать **Земляного элементаля**. Элементаль появляется в свободном пространстве по вашему выбору в пределах 30 футов от вас, подчиняется вашим командам и действует сразу после вас по вашему счёту Инициативы. Элементаль исчезает через 1 час, когда умирает или когда вы отпускаете его бонусным действием. Камень нельзя использовать таким образом снова до следующего рассвета.
# source: OmnisGM (CC BY 4.0)
- id: stone-of-good-luck-(luckstone)
  name: "Камень удачи (Камень везения) (Stone of Good Luck (Luckstone))"
  description: |-
    *Чудесный предмет, необычный (требуется настройка)*

    Пока этот полированный агат при вас, вы получаете бонус +1 к проверкам характеристик и спасброскам.
# source: OmnisGM (CC BY 4.0)
- id: sun-blade
  name: "Солнечный клинок"
  description: |-
    *Оружие (длинный меч), редкий (требуется настройка)*

    Этот предмет выглядит как эфес меча.

    **_Клинок сияния._** Сжимая эфес, вы можете бонусным действием вызвать появление клинка из чистого сияния или заставить клинок исчезнуть. Пока клинок существует, это магическое оружие функционирует как длинный меч со свойством «фехтовальное». Если вы владеете длинными мечами или короткими мечами, вы владеете *Солнечным клинком*.

    Вы получаете бонус +2 к броскам атаки и урона этим оружием, которое наносит Урон излучением вместо Рубящего урона. Когда вы попадаете по нежити им, цель получает дополнительно 1d8 Урона излучением.

    **_Солнечный свет._** Светящийся клинок меча испускает яркий свет в радиусе 15 футов и тусклый свет ещё на 15 футов. Свет является солнечным светом. Пока клинок существует, вы можете действием «Магия» расширить или уменьшить радиус яркого и тусклого света на 5 футов каждый, до максимума 30 футов каждый или минимума 10 футов каждый.
# source: OmnisGM (CC BY 4.0)
- id: sword-of-life-stealing
  name: "Меч похищения жизни"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч, рапира, скимитар или короткий меч), редкий (требуется настройка)*

    Когда вы атакуете существо этим магическим оружием и выбрасываете 20 на d20 для броска атаки, цель получает дополнительно 15 Некротического урона, если это не конструкт или нежить, и вы получаете временные хиты, равные сумме нанесённого некротического урона.
# source: OmnisGM (CC BY 4.0)
- id: sword-of-sharpness
  name: "Меч остроты"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч или скимитар), очень редкий (требуется настройка)*

    Когда вы атакуете объект этим магическим оружием и попадаете, максимизируйте кости урона вашего оружия против цели.

    Когда вы атакуете существо этим оружием и выбрасываете 20 на d20 для броска атаки, цель получает дополнительно 14 Рубящего урона и получает 1 уровень Истощения.
# source: OmnisGM (CC BY 4.0)
- id: sword-of-wounding
  name: "Меч ран"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч, рапира, скимитар или короткий меч), редкий (требуется настройка)*

    Когда вы попадаете по существу атакой этим магическим оружием, цель получает дополнительно 2d6 Некротического урона и должна успешно совершить спасбросок Телосложения со СЛ 15, иначе не сможет восстанавливать хиты в течение 1 часа. Цель повторяет спасбросок в конце каждого из своих ходов, прекращая эффект на себе при успехе.
# source: OmnisGM (CC BY 4.0)
- id: talisman-of-pure-good
  name: "Талисман чистого добра"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка жрецом или паладином)*

    Этот талисман — могучий символ добра. Исчадие или нежить, прикасающиеся к талисману, получают 8d6 Урона излучением и получают урон снова каждый раз, когда заканчивают свой ход, держа или неся талисман.

    **_Священный символ._** Вы можете использовать талисман как священный символ. Вы получаете бонус +2 к броскам атаки заклинаниями, пока носите или держите его.

    **_Чистое возмездие._** Талисман имеет 7 зарядов. Пока вы носите или держите талисман, вы можете действием «Магия» израсходовать 1 заряд и выбрать одно существо, которое вы видите на земле в пределах 120 футов от себя. Пылающая трещина открывается под целью, и цель совершает спасбросок Ловкости со СЛ 20. Если цель — исчадие или нежить, она совершает спасбросок с помехой. При провале цель падает в трещину и уничтожается, не оставляя останков. При успехе цель не падает в трещину, но получает 4d6 Психического урона от испытания. В любом случае трещина затем закрывается, не оставляя следов своего существования. Когда вы израсходуете последний заряд, талисман рассеивается в искрящиеся золотые частицы и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: talisman-of-the-sphere
  name: "Талисман сферы"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Пока вы держите или носите этот талисман, вы совершаете с преимуществом любую проверку Интеллекта (Магия), чтобы контролировать *Сферу уничтожения*. Кроме того, когда вы начинаете свой ход, контролируя *Сферу уничтожения*, вы можете действием «Магия» переместить её на 10 футов плюс дополнительное число футов, равное 10, умноженному на ваш модификатор Интеллекта. Это движение не обязано быть по прямой линии.
# source: OmnisGM (CC BY 4.0)
- id: talisman-of-ultimate-evil
  name: "Талисман абсолютного зла"
  description: |-
    *Чудесный предмет, легендарный (требуется настройка)*

    Этот предмет символизирует нераскаянное зло. Существо, которое не является исчадием или нежитью и прикасается к талисману, получает 8d6 Некротического урона и получает урон снова каждый раз, когда заканчивает свой ход, держа или неся талисман.

    **_Священный символ._** Вы можете использовать талисман как священный символ. Вы получаете бонус +2 к броскам атаки заклинаниями, пока носите или держите его.

    **_Окончательный конец._** Талисман имеет 6 зарядов. Пока вы носите или держите талисман, вы можете действием «Магия» израсходовать 1 заряд и выбрать одно существо, которое вы видите на земле в пределах 120 футов от себя. Пылающая трещина открывается под целью, и цель совершает спасбросок Ловкости со СЛ 20. Если цель — небожитель, она совершает спасбросок с помехой. При провале цель падает в трещину и уничтожается, не оставляя останков. При успехе цель не падает в трещину, но получает 4d6 Психического урона от испытания. В любом случае трещина затем закрывается, не оставляя следов своего существования. Когда вы израсходуете последний заряд, талисман растворяется в зловонную слизь и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: tome-of-clear-thought
  name: "Том ясной мысли"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга содержит упражнения на память и логику, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и практику её упражнений, ваш Интеллект увеличивается на 2, максимум до 30. Затем книга теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: tome-of-leadership-and-influence
  name: "Том лидерства и влияния"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга содержит руководства по влиянию и очарованию других, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и практику её руководств, ваша Харизма увеличивается на 2, максимум до 30. Затем книга теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: tome-of-understanding
  name: "Том понимания"
  description: |-
    *Чудесный предмет, очень редкий*

    Эта книга содержит упражнения на интуицию и проницательность, и её слова заряжены магией. Если вы потратите 48 часов в течение 6 или меньше дней на изучение содержимого книги и практику её руководств, ваша Мудрость увеличивается на 2, максимум до 30. Затем книга теряет свою магию, но восстанавливает её через столетие.
# source: OmnisGM (CC BY 4.0)
- id: trident-of-fish-command
  name: "Трезубец повелителя рыб"
  description: |-
    *Оружие (трезубец), необычный (требуется настройка)*

    Это магическое оружие имеет 3 заряда и восстанавливает 1d3 израсходованных заряда ежедневно на рассвете. Пока вы несёте его, вы можете израсходовать 1 заряд, чтобы сотворить *Подчинение зверя* (СЛ спасброска 15) из него на зверя, имеющего скорость плавания.
# source: OmnisGM (CC BY 4.0)
- id: universal-solvent
  name: "Универсальный растворитель"
  description: |-
    *Чудесный предмет, легендарный*

    Этот тюбик содержит молочную жидкость с сильным запахом алкоголя. При обнаружении тюбик содержит 1d6 + 1 унций.

    Вы можете действием «Использование» вылить 1 или более унций растворителя из тюбика на поверхность в пределах досягаемости. Каждая унция мгновенно растворяет до 1 квадратного фута клеящего вещества, которого касается, включая *Суверенный клей*.
# source: OmnisGM (CC BY 4.0)
- id: vicious-weapon
  name: "Жестокое оружие"
  description: |-
    *Оружие (любое простое или боевое), редкий*

    Это магическое оружие наносит дополнительно 2d6 урона любому существу, в которое попадает. Этот дополнительный урон того же типа, что и обычный урон оружия.
# source: OmnisGM (CC BY 4.0)
- id: vorpal-sword
  name: "Ворпальный меч"
  description: |-
    *Оружие (глефа, двуручный меч, длинный меч или скимитар), легендарный (требуется настройка)*

    Вы получаете бонус +3 к броскам атаки и урона этим магическим оружием. Кроме того, оружие игнорирует сопротивление рубящему урону.

    Когда вы используете это оружие для атаки существа, имеющего хотя бы одну голову, и выбрасываете 20 на d20 для броска атаки, вы отрубаете одну из голов существа. Существо умирает, если не может выжить без потерянной головы. Существо имеет иммунитет к этому эффекту, если обладает иммунитетом к рубящему урону, если у него нет головы или она ему не нужна, или если Мастер решает, что существо слишком большое, чтобы отрубить его голову этим оружием. Такое существо вместо этого получает дополнительно 30 Рубящего урона от попадания. Если существо имеет Легендарное сопротивление, оно может израсходовать одно ежедневное использование этой черты, чтобы избежать потери головы, получив вместо этого дополнительный урон.
# source: OmnisGM (CC BY 4.0)
- id: wand-of-binding
  name: "Волшебная палочка связывания"
  description: |-
    *Волшебная палочка, редкий (требуется настройка)*

    Эта палочка имеет 7 зарядов.

    **_Заклинания._** Пока вы держите палочку, вы можете сотворить одно из заклинаний (СЛ спасброска 17) в следующей таблице из неё. Таблица указывает, сколько зарядов нужно израсходовать для сотворения заклинания.

    | Заклинание         | Стоимость зарядов |
    |---|---|
    | Удержание чудовища | 5                 |
    | Удержание личности | 2                 |

    **_Восстановление зарядов._** Палочка восстанавливает 1d6 + 1 израсходованных зарядов ежедневно на рассвете. Если вы израсходуете последний заряд палочки, бросьте 1d20. При выпадении 1 палочка рассыпается в пепел и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: wand-of-enemy-detection
  name: "Волшебная палочка обнаружения врагов"
  description: |-
    *Волшебная палочка, редкий (требуется настройка)*

    Эта палочка имеет 7 зарядов. Пока вы её держите, вы можете действием «Магия» израсходовать 1 заряд. В течение 1 минуты вы знаете направление к ближайшему враждебному к вам существу в пределах 60 футов, но не его расстояние от вас. Палочка может обнаруживать присутствие враждебных существ, которые Невидимы, эфирны, замаскированы или скрыты, а также тех, кто на виду. Эффект заканчивается, если вы перестаёте держать палочку.

    **_Восстановление зарядов._** Палочка восстанавливает 1d6 + 1 израсходованных зарядов ежедневно на рассвете. Если вы израсходуете последний заряд палочки, бросьте 1d20. При выпадении 1 палочка рассыпается в пепел и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: wand-of-fear
  name: "Волшебная палочка страха"
  description: |-
    *Волшебная палочка, редкий (требуется настройка)* Эта палочка имеет 7 зарядов.

    **_Заклинания._** Пока вы держите палочку, вы можете сотворить одно из заклинаний (СЛ спасброска 15) в следующей таблице из неё. Таблица указывает, сколько зарядов нужно израсходовать для сотворения заклинания.

    | Заклинание                              | Стоимость зарядов |
    |---|---|
    | Приказ (только «беги» или «падай ниц»)  | 1                 |
    | Страх (60-футовый конус)                | 3                 |

    **_Восстановление зарядов._** Палочка восстанавливает 1d6 + 1 израсходованных зарядов ежедневно на рассвете. Если вы израсходуете последний заряд палочки, бросьте 1d20. При выпадении 1 палочка рассыпается в пепел и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: wand-of-fireballs
  name: "Волшебная палочка огненных шаров"
  description: |-
    *Волшебная палочка, редкий (требуется настройка заклинателем)*

    Эта палочка имеет 7 зарядов. Пока вы её держите, вы можете израсходовать не более 3 зарядов, чтобы сотворить *Огненный шар* (СЛ спасброска 15) из неё. За 1 заряд вы сотворяете версию заклинания 3-го уровня. Вы можете увеличить уровень заклинания на 1 за каждый дополнительный израсходованный заряд.

    **_Восстановление зарядов._** Палочка восстанавливает 1d6 + 1 израсходованных зарядов ежедневно на рассвете. Если вы израсходуете последний заряд палочки, бросьте 1d20. При выпадении 1 палочка рассыпается в пепел и уничтожается.
# source: OmnisGM (CC BY 4.0)
- id: wand-of-lightning-bolts
  name: "Волшебная палочка молний"
