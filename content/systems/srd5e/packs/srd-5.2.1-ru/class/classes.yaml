- id: bard
  name: "Бард"
  description: |-
    **Основная характеристика:** Харизма  
    **Кость Хитов:** d8 за каждый уровень Барда  
    **Владение спасбросками:** Ловкость и Харизма  
    **Владение навыками:** Выберите любые 3 навыка (см. «Как играть»)  
    **Владение оружием:** Простое оружие  
    **Владение инструментами:** Выберите 3 музыкальных инструмента (см. «Снаряжение»)  
    **Владение доспехами:** Лёгкие доспехи  
    **Начальное снаряжение:** Выберите А или Б: (А) Кожаные доспехи, 2 кинжала, музыкальный инструмент по вашему выбору, набор артиста и 19 зм; или (Б) 90 зм
  properties:
    skillChoices: "Выберите любые 3 навыка (см. «Как играть»)"
    startingEquipment: "Выберите А или Б: (А) Кожаные доспехи, 2 кинжала, музыкальный инструмент по вашему выбору, набор артиста и 19 зм; или (Б) 90 зм"
    features:
    - name: "Вдохновение барда"
      level: 1
      description: |-
        Вы можете сверхъестественно вдохновлять других словами, музыкой или танцем. Это вдохновение представлено вашей Костью бардического вдохновения, которая является d6.

        **Использование Вдохновения барда.** Бонусным действием вы можете вдохновить другое существо в пределах 60 футов от вас, которое может видеть или слышать вас. Это существо получает одну из ваших Костей бардического вдохновения. Существо может иметь только одну Кость бардического вдохновения за раз.

        Один раз в течение следующего часа, когда существо проваливает проверку d20, оно может бросить Кость бардического вдохновения и добавить выпавшее число к d20, потенциально превращая провал в успех. Кость бардического вдохновения расходуется при броске.

        **Количество использований.** Вы можете давать Кость бардического вдохновения количество раз, равное вашему модификатору Харизмы (минимум один раз), и восстанавливаете все использования после долгого отдыха.

        **На высоких уровнях.** Ваша Кость бардического вдохновения меняется при достижении определённых уровней Барда, как показано в столбце Кость бардического вдохновения таблицы Умения Барда. Кость становится d8 на 5-м уровне, d10 на 10-м уровне и d12 на 15-м уровне.
    - name: "Сотворение заклинаний"
      level: 1
      description: |-
        Вы научились творить заклинания через своё искусство барда. См. «Заклинания» для правил использования заклинаний. Информация ниже описывает, как вы используете эти правила с заклинаниями Барда, которые представлены в списке заклинаний Барда далее в описании класса.

        **Заговоры.** Вы знаете два заговора по вашему выбору из списка заклинаний Барда. Рекомендуются *пляшущие огоньки* и *злая насмешка*.

        Каждый раз, получая уровень Барда, вы можете заменить один из заговоров другим заговором по выбору из списка заклинаний Барда.

        При достижении 4-го и 10-го уровней Барда вы изучаете ещё один заговор по выбору из списка заклинаний Барда, как показано в столбце Заговоры таблицы Умения Барда.

        **Ячейки заклинаний.** Таблица Умения Барда показывает, сколько у вас ячеек заклинаний для сотворения заклинаний 1-го уровня и выше. Вы восстанавливаете все ячейки после долгого отдыха.

        **Подготовленные заклинания 1-го уровня и выше.** Вы подготавливаете список заклинаний 1-го уровня и выше, доступных для сотворения с этим умением. Для начала выберите четыре заклинания 1-го уровня из списка заклинаний Барда. Рекомендуются *очарование личности*, *цветные брызги*, *диссонирующий шёпот* и *лечащее слово*.

        Количество заклинаний в вашем списке увеличивается с ростом уровня Барда, как показано в столбце Подготовленные заклинания таблицы Умения Барда. При увеличении этого числа выбирайте дополнительные заклинания из списка заклинаний Барда, пока количество заклинаний в списке не сравняется с числом в таблице. Выбранные заклинания должны быть уровня, для которого у вас есть ячейки. Например, если вы Бард 3-го уровня, ваш список подготовленных заклинаний может включать шесть заклинаний 1-го и 2-го уровней в любой комбинации.

        Если другое умение Барда даёт вам заклинания, которые вы всегда держите подготовленными, эти заклинания не учитываются в количестве заклинаний, которые вы можете подготовить с этим умением, но в остальном считаются заклинаниями Барда.

        **Смена подготовленных заклинаний.** При получении уровня Барда вы можете заменить одно заклинание в списке другим заклинанием Барда, для которого у вас есть ячейки.

        **Заклинательная характеристика.** Харизма — ваша заклинательная характеристика для заклинаний Барда.

        **Заклинательный фокус.** Вы можете использовать музыкальный инструмент как заклинательный фокус для заклинаний Барда.
    - name: "Компетентность"
      level: 2
      description: |-
        Вы получаете Компетентность (см. «Глоссарий правил») в двух из ваших владений навыками по вашему выбору. Рекомендуются Выступление и Убеждение, если вы ими владеете.

        На 9-м уровне Барда вы получаете Компетентность ещё в двух владениях навыками по вашему выбору.
    - name: "Мастер на все руки"
      level: 2
      description: |-
        Вы можете добавлять половину бонуса мастерства (округляя вниз) к любой проверке характеристики с навыком, которым вы не владеете и который иначе не использует ваш бонус мастерства.

        Например, если вы совершаете проверку Силы (Атлетика) и не владеете Атлетикой, вы можете добавить половину бонуса мастерства к проверке.
    - name: "Подкласс Барда"
      level: 3
      description: |-
        Вы получаете подкласс Барда по вашему выбору. Подкласс Коллегия знаний описан после описания этого класса. Подкласс — это специализация, дающая вам умения на определённых уровнях Барда. До конца карьеры вы получаете каждое умение подкласса, соответствующее вашему уровню Барда или ниже.
    - name: "Увеличение характеристики"
      level: 4
      description: |-
        Вы получаете черту Увеличение характеристики (см. «Черты») или другую черту по вашему выбору, для которой вы подходите. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях Барда.
    - name: "Источник вдохновения"
      level: 5
      description: |-
        Теперь вы восстанавливаете все использования Вдохновения барда после короткого или долгого отдыха.

        Кроме того, вы можете потратить ячейку заклинания (действие не требуется), чтобы восстановить одно использование Вдохновения барда.
    - name: "Умение подкласса"
      level: 6
      description: |-
        На этом уровне вы получаете умение вашего подкласса Барда. Умения подкласса перечислены в его описании.
    - name: "Контрочарование"
      level: 7
      description: |-
        Вы можете использовать музыкальные ноты или слова силы, чтобы прервать влияющие на разум эффекты. Если вы или существо в пределах 30 футов от вас проваливает спасбросок против эффекта, накладывающего состояние Очарованный или Испуганный, вы можете использовать реакцию, чтобы перебросить спасбросок, и новый бросок получает Преимущество.
    - name: "Увеличение характеристики"
      level: 8
      description: |-
        Вы получаете черту Увеличение характеристики (см. «Черты») или другую черту по вашему выбору, для которой вы подходите. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях Барда.
    - name: "Компетентность"
      level: 9
      description: |-
        Вы получаете Компетентность (см. «Глоссарий правил») в двух из ваших владений навыками по вашему выбору. Рекомендуются Выступление и Убеждение, если вы ими владеете.

        На 9-м уровне Барда вы получаете Компетентность ещё в двух владениях навыками по вашему выбору.
    - name: "Тайны магии"
      level: 10
      description: |-
        Вы узнали тайны различных магических традиций. Каждый раз при достижении уровня Барда (включая этот), когда число в столбце Подготовленные заклинания увеличивается, вы можете выбирать любые из новых подготовленных заклинаний из списков заклинаний Барда, Жреца, Друида и Волшебника, и выбранные заклинания считаются заклинаниями Барда (см. раздел класса для его списка заклинаний). Кроме того, при замене подготовленного заклинания вы можете заменить его заклинанием из этих списков.
    - name: "Увеличение характеристики"
      level: 12
      description: |-
        Вы получаете черту Увеличение характеристики (см. «Черты») или другую черту по вашему выбору, для которой вы подходите. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях Барда.
    - name: "Умение подкласса"
      level: 14
      description: |-
        На этом уровне вы получаете умение вашего подкласса Барда. Умения подкласса перечислены в его описании.
    - name: "Увеличение характеристики"
      level: 16
      description: |-
        Вы получаете черту Увеличение характеристики (см. «Черты») или другую черту по вашему выбору, для которой вы подходите. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях Барда.
    - name: "Высшее вдохновение"
      level: 18
      description: |-
        Когда вы бросаете инициативу, вы восстанавливаете использования Вдохновения барда, пока у вас не будет двух, если у вас меньше.
    - name: "Эпическое благо"
      level: 19
      description: |-
        Вы получаете черту Эпическое благо (см. «Черты») или другую черту по вашему выбору, для которой вы подходите. Рекомендуется Благо воспоминания заклинаний.
    - name: "Слова творения"
      level: 20
      description: |-
        Вы овладели двумя Словами творения: словами жизни и смерти. Поэтому вы всегда держите подготовленными заклинания *слово силы: исцеление* и *слово силы: смерть*. Когда вы творите любое из этих заклинаний, вы можете нацелить второе существо, если оно находится в пределах 10 футов от первой цели.
# source: OmnisGM (CC BY 4.0)
- id: cleric
  name: "Жрец"
  description: |-
    **Основная характеристика:** Мудрость  
    **Кость Хитов:** d8 за каждый уровень жреца  
    **Владение спасбросками:** Мудрость и Харизма  
    **Владение навыками:** Выберите 2: История, Проницательность, Медицина, Убеждение или Религия  
    **Владение оружием:** Простое оружие  
    **Владение доспехами:** Лёгкие и Средние доспехи, щиты  
    **Начальное снаряжение:** Выберите А или Б: (А) Кольчужная рубаха, щит, булава, священный символ, набор священника и 7 зм; или (Б) 110 зм
  properties:
    skillChoices: "Выберите 2: История, Проницательность, Медицина, Убеждение или Религия"
    startingEquipment: "Выберите А или Б: (А) Кольчужная рубаха, щит, булава, священный символ, набор священника и 7 зм; или (Б) 110 зм"
    features:
    - name: "Божественный орден"
      level: 1
      description: |-
        Вы посвятили себя одной из следующих священных ролей на свой выбор.

        **Защитник.** Обученный для битвы, вы получаете владение воинским оружием и Тяжёлыми доспехами.

        **Чудотворец.** Вы знаете один дополнительный заговор из списка заклинаний жреца. Кроме того, ваша мистическая связь с божественным даёт вам бонус к проверкам Интеллекта (Магия или Религия). Бонус равен вашему модификатору Мудрости (минимум +1).
    - name: "Сотворение заклинаний"
      level: 1
      description: |-
        Вы научились творить заклинания через молитву и медитацию. Смотрите раздел «Заклинания» для правил использования заклинаний. Информация ниже описывает, как вы используете эти правила с заклинаниями жреца, которые приведены в списке заклинаний жреца далее в описании класса.

        **Заговоры.** Вы знаете три заговора на свой выбор из списка заклинаний жреца. Рекомендуются *Указание*, *Священное пламя* и *Тауматургия*.

        Каждый раз, когда вы получаете уровень жреца, вы можете заменить один из своих заговоров другим заговором на свой выбор из списка заклинаний жреца.

        Когда вы достигаете 4-го и 10-го уровня жреца, вы узнаёте ещё один заговор на свой выбор из списка заклинаний жреца, как показано в столбце Заговоры таблицы Умения жреца.

        **Ячейки заклинаний.** Таблица Умения жреца показывает, сколько у вас есть ячеек заклинаний для сотворения заклинаний 1-го уровня и выше. Вы восстанавливаете все потраченные ячейки, когда заканчиваете долгий отдых.

        **Подготовленные заклинания 1-го уровня и выше.** Вы подготавливаете список заклинаний 1-го уровня и выше, которые доступны вам для сотворения с помощью этого умения. Для начала выберите четыре заклинания 1-го уровня из списка заклинаний жреца. Рекомендуются *Благословение*, *Лечение ран*, *Направляющий снаряд* и *Щит веры*.

        Количество заклинаний в вашем списке увеличивается по мере получения уровней жреца, как показано в столбце Подготовленные заклинания таблицы Умения жреца. Каждый раз, когда это число увеличивается, выбирайте дополнительные заклинания из списка заклинаний жреца, пока количество заклинаний в вашем списке не сравняется с числом в таблице. Выбранные заклинания должны быть того уровня, для которого у вас есть ячейки заклинаний. Например, если вы жрец 3-го уровня, ваш список подготовленных заклинаний может включать шесть заклинаний 1-го и 2-го уровней в любой комбинации.

        Если другое умение жреца даёт вам заклинания, которые вы всегда держите подготовленными, эти заклинания не учитываются в количестве заклинаний, которые вы можете подготовить с помощью этого умения, но в остальном считаются заклинаниями жреца для вас.

        **Изменение подготовленных заклинаний.** Каждый раз, когда вы заканчиваете долгий отдых, вы можете изменить свой список подготовленных заклинаний, заменив любые заклинания в нём другими заклинаниями жреца, для которых у вас есть ячейки заклинаний.

        **Базовая характеристика заклинаний.** Мудрость является вашей базовой характеристикой для заклинаний жреца.

        **Заклинательный фокус.** Вы можете использовать священный символ в качестве заклинательного фокуса для заклинаний жреца.
    - name: "Божественный канал"
      level: 2
      description: |-
        Вы можете направлять божественную энергию непосредственно из Внешних Планов для создания магических эффектов. Изначально у вас есть два таких эффекта: Божественная искра и Изгнание нежити, каждый из которых описан ниже. Каждый раз, когда вы используете Божественный канал этого класса, выбирайте, какой эффект Божественного канала этого класса создать. На более высоких уровнях жреца вы получаете дополнительные варианты эффектов.

        Вы можете использовать Божественный канал этого класса дважды. Вы восстанавливаете одно потраченное использование, когда заканчиваете короткий отдых, и восстанавливаете все потраченные использования, когда заканчиваете долгий отдых. Вы получаете дополнительные использования, когда достигаете определённых уровней жреца, как показано в столбце Божественный канал таблицы Умения жреца.

        Если эффект Божественного канала требует спасброска, СЛ равна СЛ спасброска заклинаний из умения Сотворение заклинаний этого класса.

        **Божественная искра.** Действием «Магия» вы направляете священный символ на другое существо, которое видите в пределах 30 футов от себя, и фокусируете на нём божественную энергию. Бросьте 1d8 и добавьте свой модификатор Мудрости. Вы либо восстанавливаете существу количество хитов, равное этой сумме, либо заставляете его совершить спасбросок Телосложения. При провале существо получает некротический урон или урон излучением (на ваш выбор), равный этой сумме. При успехе существо получает половину этого урона (с округлением вниз).

        Вы бросаете дополнительный d8, когда достигаете 7-го (2d8), 13-го (3d8) и 18-го (4d8) уровня жреца.

        **Изгнание нежити.** Действием «Магия» вы представляете свой священный символ и порицаете нежить. Каждая нежить на ваш выбор в пределах 30 футов от вас должна совершить спасбросок Мудрости. Если существо проваливает спасбросок, оно получает состояния Испуганный и Недееспособный на 1 минуту. В течение этого времени оно пытается переместиться как можно дальше от вас в свой ход. Этот эффект заканчивается досрочно для существа, если оно получает какой-либо урон, если вы получаете состояние Недееспособный или если вы умираете.
    - name: "Подкласс жреца"
      level: 3
      description: |-
        Вы получаете подкласс жреца на свой выбор. Подкласс Домен жизни описан после описания этого класса. Подкласс — это специализация, которая даёт вам умения на определённых уровнях жреца. До конца вашей карьеры вы получаете каждое умение своего подкласса, которое соответствует вашему уровню жреца или ниже.
    - name: "Увеличение характеристики"
      level: 4
      description: |-
        Вы получаете черту Увеличение характеристики (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях жреца.
    - name: "Испепеление нежити"
      level: 5
      description: |-
        Каждый раз, когда вы используете Изгнание нежити, вы можете бросить количество d8, равное вашему модификатору Мудрости (минимум 1d8), и сложить результаты. Каждая нежить, провалившая спасбросок против этого использования Изгнания нежити, получает урон излучением, равный сумме броска. Этот урон не прекращает действие Изгнания нежити.
    - name: "Умение подкласса"
      level: 6
      description: |-
        На этом уровне вы получаете умение вашего подкласса жреца. Умения подкласса перечислены в его описании.
    - name: "Благословенные удары"
      level: 7
      description: |-
        Божественная сила наполняет вас в бою. Вы получаете одну из следующих опций на свой выбор (если вы получили какую-либо из этих опций от подкласса жреца из более старой книги, используйте только ту опцию, которую выбрали для этого умения).

        **Божественный удар.** Один раз в каждый свой ход, когда вы попадаете по существу броском атаки с использованием оружия, вы можете заставить цель получить дополнительно 1d8 некротического урона или урона излучением (на ваш выбор).

        **Мощное колдовство.** Добавляйте свой модификатор Мудрости к урону, который вы наносите любым заговором жреца.
    - name: "Увеличение характеристики"
      level: 8
      description: |-
        Вы получаете черту Увеличение характеристики (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях жреца.
    - name: "Божественное вмешательство"
      level: 10
      description: |-
        Вы можете призвать своё божество или пантеон вмешаться от вашего имени. Действием «Магия» выберите любое заклинание жреца 5-го уровня или ниже, которое не требует Реакции для сотворения. В рамках того же действия вы творите это заклинание без траты ячейки заклинания и без необходимости в материальных компонентах. Вы не можете использовать это умение снова, пока не закончите долгий отдых.
    - name: "Увеличение характеристики"
      level: 12
      description: |-
        Вы получаете черту Увеличение характеристики (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях жреца.
    - name: "Улучшенные благословенные удары"
      level: 14
      description: |-
        Опция, которую вы выбрали для Благословенных ударов, становится мощнее.

        **Божественный удар.** Дополнительный урон вашего Божественного удара увеличивается до 2d8.

        **Мощное колдовство.** Когда вы творите заговор жреца и наносите им урон существу, вы можете дать жизненную силу себе или другому существу в пределах 60 футов от себя, даруя количество временных хитов, равное удвоенному модификатору вашей Мудрости.
    - name: "Увеличение характеристики"
      level: 16
      description: |-
        Вы получаете черту Увеличение характеристики (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Вы получаете это умение снова на 8-м, 12-м и 16-м уровнях жреца.
    - name: "Умение подкласса"
      level: 17
      description: |-
        На этом уровне вы получаете умение вашего подкласса жреца. Умения подкласса перечислены в его описании.
    - name: "Эпический дар"
      level: 19
      description: |-
        Вы получаете черту Эпический дар (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Рекомендуется Дар судьбы.
    - name: "Великое божественное вмешательство"
      level: 20
      description: |-
        Вы можете призвать ещё более могущественное божественное вмешательство. Когда вы используете умение Божественное вмешательство, вы можете выбрать *Исполнение желаний* при выборе заклинания. Если вы это делаете, вы не можете использовать Божественное вмешательство снова, пока не закончите 2d4 долгих отдыхов.
