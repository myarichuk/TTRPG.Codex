    - name: "Эпический дар"
      level: 19
      description: |-
        Вы получаете черту Эпический дар (смотрите раздел «Черты») или другую черту на свой выбор, для которой вы соответствуете требованиям. Рекомендуется Дар вспоминания заклинаний.
    - name: "Коронные заклинания"
      level: 20
      description: |-
        Выберите два заклинания 3-го уровня в книге заклинаний как ваши коронные заклинания. Эти заклинания всегда у вас подготовлены, и вы можете сотворить каждое из них один раз на 3-м уровне без траты ячейки заклинания. Когда вы это делаете, вы не можете сотворить их таким образом снова, пока не закончите короткий или долгий отдых. Чтобы сотворить любое из заклинаний на более высоком уровне, вы должны потратить ячейку заклинания.
