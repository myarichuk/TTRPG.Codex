- id: prismatic-wall
  name: Призматическая стена
  description: |-
    *9-й уровень, Ограждение (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** 10 минут

    Мерцающая многоцветная плоскость света образует вертикальную непрозрачную стену длиной до 90 футов, высотой 30 футов и толщиной 1 дюйм, с центром в точке в пределах дистанции. Кроме того, вы можете придать стене форму шара диаметром до 30 футов с центром в точке в пределах дистанции. Стена существует в течение длительности. Если вы разместите стену в пространстве, которое занимает существо, заклинание мгновенно завершается без эффекта.
    Стена излучает яркий свет в радиусе 100 футов и тусклый свет на дополнительные 100 футов. Вы и существа, которых вы назначили при сотворении заклинания, можете проходить сквозь стену и находиться рядом с ней без вреда. Если другое существо, которое может видеть стену, перемещается в пределах 20 футов от неё или начинает там свой ход, оно должно преуспеть в спасброске Телосложения или получить состояние «Ослеплённый» на 1 минуту.
    Стена состоит из семи слоёв, каждый из которых имеет свой цвет. Когда существо тянется в стену или проходит сквозь неё, оно делает это по одному слою за раз, проходя через все слои. Каждый слой заставляет существо совершить спасбросок Ловкости, иначе на него действуют свойства этого слоя, как описано в таблице призматических слоёв.
    Стена имеет КД 10 и может быть разрушена по одному слою за раз, в порядке от красного к фиолетовому, средствами, специфичными для каждого слоя. Если слой разрушен, он исчезает на время действия заклинания. Поле антимагии не действует на стену, а Развеивание магии может повлиять только на фиолетовый слой. Призматические слои  Порядок  Эффекты 2    Оранжевый. При провале спасброска: 12d6 урона кислотой. При успехе: половина урона. Дополнительные эффекты: магические дальнобойные атаки не могут пройти через этот слой, который разрушается сильным ветром (например, создаваемым заклинанием Порыв ветра). 4    Зелёный. При провале спасброска: 12d6 урона ядом. При успехе: половина урона. Дополнительные эффекты: заклинание Проход сквозь стену или другое заклинание того же или большего уровня, способное открыть проход в твёрдой поверхности, разрушает этот слой. 6    Индиго. При провале спасброска: цель получает состояние «Опутанный» и совершает спасбросок Телосложения в конце каждого своего хода. Если она преуспевает в спасброске три раза, состояние заканчивается. Если она проваливает спасбросок три раза, она получает состояние «Окаменевший», пока её не освободит эффект, например заклинание Великое восстановление. Успехи и провалы не обязаны быть подряд; ведите учёт и тех и других, пока цель не наберёт три однотипных результата. Дополнительные эффекты: через этот слой нельзя сотворять заклинания, и он разрушается ярким светом заклинания Дневной свет.
