- id: scrying
  name: Провидение
  description: |-
    *5-й уровень, Прорицание (Бард, Жрец, Друид, Колдун, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** На себя
    **Компоненты:** В, С, М (фокусировка стоимостью 1,000+ зм, например хрустальный шар, зеркало или чаша, наполненная водой)
    **Длительность:** Концентрация, до 10 минут

    Вы можете видеть и слышать выбранное вами существо, находящееся на том же плане существования, что и вы. Цель совершает спасбросок Мудрости, который изменяется (см. таблицы ниже) в зависимости от того, насколько хорошо вы знаете цель, и от вида физической связи с ней. Цель не знает, против чего она совершает спасбросок, она лишь чувствует беспокойство. Насколько вы знаете цель ...    Модификатор спасброска Лично знакомы (встречали цель)    +0 У вас есть вещь цели ...    Модификатор спасброска Одежда или другое имущество    -4
    При успешном спасброске цель не подвергается эффекту, и вы не можете использовать на ней это заклинание снова в течение 24 часов.
    При провале спасброска заклинание создаёт Невидимый и нематериальный датчик в пределах 10 футов от цели. Вы можете видеть и слышать через датчик так, будто находитесь там. Датчик движется вместе с целью, оставаясь в пределах 10 футов от неё на протяжении длительности. Если кто-то может увидеть датчик, он выглядит как светящаяся сфера размером с ваш кулак.
    Вместо существа вы можете выбрать место, которое видели. В этом случае датчик появляется в этом месте и не двигается.
  properties:
    castingTime: 10 минут
    range: На себя
    material: фокусировка стоимостью 1,000+ зм, например хрустальный шар, зеркало или чаша, наполненная водой
    duration: до 10 минут
