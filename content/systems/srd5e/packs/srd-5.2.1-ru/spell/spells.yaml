- id: thunderwave
  name: "Волна грома"
  description: |-
    *Воплощение 1-го уровня (Бард, Друид, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Вы высвобождаете волну громовой энергии. Каждое существо в кубе с ребром 15 футов, исходящем от вас, совершает спасбросок Телосложения. При провале существо получает 2d8 урона громом и отталкивается на 10 футов от вас. При успехе существо получает только половину урона.

    Кроме того, незакреплённые объекты, которые полностью находятся в кубе, отталкиваются на 10 футов от вас, и громовой раскат слышен в пределах 300 футов.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Мгновенная"
# source: OmnisGM (CC BY 4.0)
- id: time-stop
  name: "Остановка времени"
  description: |-
    *Преобразование 9-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Вы кратковременно останавливаете ход времени для всех, кроме себя. Для других существ время не идёт, пока вы совершаете 1d4 + 1 ходов подряд, в течение которых можете использовать действия и перемещаться как обычно.

    Это заклинание заканчивается, если одно из действий, которые вы используете в этот период, или любые эффекты, которые вы создаёте в это время, воздействуют на существо, отличное от вас, или на объект, который несёт или носит кто-то, кроме вас. Кроме того, заклинание заканчивается, если вы перемещаетесь более чем на 1000 футов от места, где вы его сотворили.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Мгновенная"
# source: OmnisGM (CC BY 4.0)
- id: tiny-hut
  name: "Крошечная хижина"
  description: |-
    *Воплощение 3-го уровня (Бард, Волшебник)*

    **Время накладывания:** 1 минута или ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (хрустальная бусина)  
    **Длительность:** 8 часов

    Эманация радиусом 10 футов возникает вокруг вас и остаётся неподвижной на время действия заклинания. Заклинание проваливается, если эманация недостаточно велика, чтобы полностью вместить всех существ в её области.

    Существа и объекты внутри эманации в момент сотворения заклинания могут свободно проходить через неё. Все остальные существа и объекты не могут проходить через неё. Заклинания 3-го уровня или ниже не могут быть сотворены через неё, и эффекты таких заклинаний не могут проникнуть в неё.

    Атмосфера внутри эманации комфортная и сухая, независимо от погоды снаружи. До окончания заклинания вы можете сделать внутреннее пространство тускло освещённым или тёмным (действие не требуется). Эманация непрозрачна снаружи и имеет любой цвет на ваш выбор, но прозрачна изнутри.

    Заклинание заканчивается преждевременно, если вы покидаете эманацию или сотворяете его снова.
  properties:
    castingTime: "1 минута или ритуал"
    range: "На себя"
    material: "хрустальная бусина"
    duration: "8 часов"
# source: OmnisGM (CC BY 4.0)
- id: tongues
  name: "Языки"
  description: |-
    *Прорицание 3-го уровня (Бард, Жрец, Чародей, Колдун, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, М (миниатюрный зиккурат)  
    **Длительность:** 1 час

    Это заклинание даёт существу, которого вы касаетесь, способность понимать любой устный или жестовый язык, который оно слышит или видит. Более того, когда цель общается устно или жестами, любое существо, знающее хотя бы один язык, может понять её, если это существо может слышать речь или видеть жесты.
  properties:
    castingTime: "Действие"
    range: "Касание"
    material: "миниатюрный зиккурат"
    duration: "1 час"
# source: OmnisGM (CC BY 4.0)
- id: transport-via-plants
  name: "Перемещение растениями"
  description: |-
    *Вызов 6-го уровня (Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** 10 футов  
    **Компоненты:** В, С  
    **Длительность:** 1 минута

    Это заклинание создаёт магическую связь между неподвижным растением размера Большой или больше в пределах дистанции и другим растением на любом расстоянии на том же плане существования. Вы должны были видеть или касаться целевого растения хотя бы один раз ранее. На время действия заклинания любое существо может войти в целевое растение и выйти из целевого растения назначения, затратив 5 футов перемещения.
  properties:
    castingTime: "Действие"
    range: "10 футов"
    duration: "1 минута"
# source: OmnisGM (CC BY 4.0)
- id: tree-stride
  name: "Шаг сквозь деревья"
  description: |-
    *Вызов 5-го уровня (Друид, Следопыт)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Вы получаете способность входить в дерево и перемещаться изнутри него внутрь другого дерева того же вида в пределах 500 футов. Оба дерева должны быть живыми и по меньшей мере того же размера, что и вы. Вы должны использовать 5 футов перемещения, чтобы войти в дерево. Вы мгновенно узнаёте местоположение всех других деревьев того же вида в пределах 500 футов и, как часть перемещения, использованного для входа в дерево, можете либо войти в одно из этих деревьев, либо выйти из дерева, в котором находитесь. Вы появляетесь в месте на ваш выбор в пределах 5 футов от дерева назначения, используя ещё 5 футов перемещения. Если у вас не осталось перемещения, вы появляетесь в пределах 5 футов от дерева, в которое вошли.

    Вы можете использовать эту способность перемещения только один раз в каждый свой ход. Вы должны заканчивать каждый ход вне дерева.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, до 1 минуты"
# source: OmnisGM (CC BY 4.0)
- id: true-polymorph
  name: "Истинный полиморф"
  description: |-
    *Преобразование 9-го уровня (Бард, Колдун, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (капля ртути, капля камеди и клубок дыма)  
    **Длительность:** Концентрация, до 1 часа

    Выберите одно существо или немагический объект, который видите в пределах дистанции. Существо превращается в другое существо или немагический объект, или объект превращается в существо (объект не должен носиться или нестись другим существом). Трансформация длится на время действия заклинания или пока цель не умрёт или не будет уничтожена, но если вы поддерживаете концентрацию на этом заклинании в течение полного времени, заклинание длится до тех пор, пока не будет рассеяно.

    Несогласное существо может совершить спасбросок Мудрости, и при успехе оно не затрагивается этим заклинанием.

    **_Существо в существо._** Если вы превращаете существо в другой вид существа, новая форма может быть любого вида на ваш выбор с показателем опасности, равным или меньшим, чем показатель опасности или уровень цели. Игровая статистика цели заменяется блоком характеристик новой формы, но цель сохраняет свои хиты, Кости Хитов, мировоззрение и личность.

    Цель получает временные хиты, равные хитам новой формы. Эти временные хиты исчезают, если какие-либо из них остаются, когда заклинание заканчивается.

    Цель ограничена в действиях, которые может совершать, анатомией своей новой формы и не может говорить или сотворять заклинания.

    Снаряжение цели сливается с новой формой. Существо не может использовать или иным образом получать преимущества от этого снаряжения.

    **_Объект в существо._** Вы можете превратить объект в существо любого вида, при условии что размер существа не превышает размер объекта и показатель опасности существа не превышает 9. Существо дружелюбно к вам и вашим союзникам. В бою оно совершает свои ходы сразу после ваших и подчиняется вашим командам.

    Если заклинание длится более часа, вы больше не контролируете существо. Оно может оставаться дружелюбным к вам в зависимости от того, как вы обращались с ним.

    **_Существо в объект._** Если вы превращаете существо в объект, оно трансформируется вместе со всем, что носит и несёт, в эту форму, при условии что размер объекта не превышает размер существа. Характеристики существа становятся характеристиками объекта, и у существа нет воспоминаний о времени, проведённом в этой форме, после окончания заклинания и возвращения к своей обычной форме.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    material: "капля ртути, капля камеди и клубок дыма"
    duration: "Концентрация, до 1 часа"
# source: OmnisGM (CC BY 4.0)
- id: true-resurrection
  name: "Истинное воскрешение"
  description: |-
    *Некромантия 9-го уровня (Жрец, Друид)*

    **Время накладывания:** 1 час  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (алмазы стоимостью не менее 25 000 зм, которые заклинание расходует)  
    **Длительность:** Мгновенная

    Вы касаетесь существа, которое было мёртво не более 200 лет и которое умерло по любой причине, кроме старости. Существо возвращается к жизни со всеми своими хитами.

    Это заклинание закрывает все раны, нейтрализует любой яд, излечивает все магические болезни и снимает любые проклятия, действовавшие на существо, когда оно умерло. Заклинание заменяет повреждённые или отсутствующие органы и конечности. Если существо было нежитью, оно восстанавливается в своей не-нежитьной форме.

    Заклинание может предоставить новое тело, если оригинал больше не существует — в этом случае вы должны назвать существо. Затем существо появляется в свободном пространстве на ваш выбор в пределах 10 футов от вас.
  properties:
    castingTime: "1 час"
    range: "Касание"
    material: "алмазы стоимостью не менее 25 000 зм, которые заклинание расходует"
    duration: "Мгновенная"
# source: TTRPG.Codex (machine-drafted)
- id: true-seeing
  name: Истинное зрение
  description: |-
    *6-й уровень, Прорицание (Бард, Жрец, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (порошок грибов стоимостью 25+ зм, который заклинание расходует)
    **Длительность:** 1 час

    На время действия заклинания добровольное существо, которого вы касаетесь, обладает Истинным зрением на дистанции 120 футов.
  properties:
    castingTime: Действие
    range: Касание
    material: порошок грибов стоимостью 25+ зм, который заклинание расходует
    duration: 1 час
# source: OmnisGM (CC BY 4.0)
- id: true-strike
  name: "Верный удар"
  description: |-
    *Заговор прорицания (Бард, Чародей, Колдун, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** С, М (оружие, которым вы владеете, стоимостью 1+ мм)  
    **Длительность:** Мгновенная

    Направляемый вспышкой магической интуиции, вы совершаете одну атаку оружием, использованным при сотворении заклинания. Атака использует вашу заклинательную характеристику для бросков атаки и урона вместо Силы или Ловкости. Если атака наносит урон, это может быть урон излучением или обычный тип урона оружия (на ваш выбор).

    **_Улучшение заговора._** Независимо от того, наносите вы урон излучением или обычный урон оружия, атака наносит дополнительный урон излучением, когда вы достигаете 5-го уровня (1d6), 11-го уровня (2d6) и 17-го уровня (3d6).
  properties:
    castingTime: "Действие"
    range: "На себя"
    material: "оружие, которым вы владеете, стоимостью 1+ мм"
    duration: "Мгновенная"
# source: OmnisGM (CC BY 4.0)
- id: tsunami
  name: "Цунами"
  description: |-
    *Вызов 8-го уровня (Друид)*

    **Время накладывания:** 1 минута  
    **Дистанция:** 1 миля  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 6 раундов

    Стена воды возникает в точке на ваш выбор в пределах дистанции. Вы можете сделать стену до 300 футов в длину, 300 футов в высоту и 50 футов в толщину. Стена существует на время действия заклинания.

    Когда стена появляется, каждое существо в её области совершает спасбросок Силы, получая 6d10 дробящего урона при провале или половину этого урона при успехе.

    В начале каждого из ваших ходов после появления стены стена вместе с существами в ней перемещается на 50 футов от вас. Любое существо размера Огромный или меньше внутри стены или в пространство которого входит стена при перемещении, должно преуспеть в спасброске Силы, иначе получит 5d10 дробящего урона. Существо может получить этот урон только один раз за раунд. В конце хода высота стены уменьшается на 50 футов, и урон, который стена наносит в последующие раунды, уменьшается на 1d10. Когда стена достигает высоты 0 футов, заклинание заканчивается.

    Существо, захваченное стеной, может перемещаться, плавая. Однако из-за силы волны существо должно преуспеть в проверке Силы (Атлетика) против СЛ спасброска ваших заклинаний, чтобы вообще двигаться. Если оно проваливает проверку, оно не может двигаться. Существо, которое выбирается из стены, падает на землю.
  properties:
    castingTime: "1 минута"
    range: "1 миля"
    duration: "Концентрация, до 6 раундов"
# source: OmnisGM (CC BY 4.0)
- id: unseen-servant
  name: "Невидимый слуга"
  description: |-
    *Вызов 1-го уровня (Бард, Колдун, Волшебник)*

    **Время накладывания:** Действие или ритуал  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С, М (кусочек верёвки и деревяшка)  
    **Длительность:** 1 час

    Это заклинание создаёт невидимую, безмозглую, бесформенную силу размера Средний, которая выполняет простые задачи по вашей команде до окончания заклинания. Слуга появляется в свободном пространстве на земле в пределах дистанции. Он имеет КД 10, 1 хит и Силу 2, и он не может атаковать. Если его хиты падают до 0, заклинание заканчивается.

    Один раз в каждый свой ход бонусным действием вы можете мысленно приказать слуге переместиться на расстояние до 15 футов и взаимодействовать с объектом. Слуга может выполнять простые задачи, которые мог бы сделать человек, такие как приносить вещи, убирать, чинить, складывать одежду, разжигать огонь, подавать еду и разливать напитки. Получив приказ, слуга выполняет задачу в меру своих способностей, пока не завершит её, затем ждёт вашего следующего приказа.

    Если вы приказываете слуге выполнить задачу, которая переместит его более чем на 60 футов от вас, заклинание заканчивается.
  properties:
    castingTime: "Действие или ритуал"
    range: "60 футов"
    material: "кусочек верёвки и деревяшка"
    duration: "1 час"
# source: OmnisGM (CC BY 4.0)
- id: vampiric-touch
  name: "Прикосновение вампира"
  description: |-
    *Некромантия 3-го уровня (Чародей, Колдун, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Прикосновение вашей руки, окутанной тенью, может выкачивать жизненную силу из других, чтобы исцелять ваши раны. Совершите атаку заклинанием ближнего боя против одного существа в пределах досягаемости. При попадании цель получает 3d6 урона некротической энергией, и вы восстанавливаете хиты, равные половине нанесённого урона некротической энергией.

    До окончания заклинания вы можете повторять атаку в каждый свой ход действием «Магия», нацеливаясь на то же существо или другое.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d6 за каждый уровень ячейки выше 3-го.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, до 1 минуты"
    higherLevel: "Урон увеличивается на 1d6 за каждый уровень ячейки выше 3-го."
# source: OmnisGM (CC BY 4.0)
- id: vicious-mockery
  name: "Язвительная насмешка"
  description: |-
    *Заговор очарования (Бард)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Вы обрушиваете поток оскорблений, наполненных тонкими чарами, на одно существо, которое видите или слышите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе она получит 1d6 урона психической энергией и совершает с помехой следующий бросок атаки до конца своего следующего хода.

    **_Улучшение заговора._** Урон увеличивается на 1d6, когда вы достигаете 5-го уровня (2d6), 11-го уровня (3d6) и 17-го уровня (4d6).
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Мгновенная"
