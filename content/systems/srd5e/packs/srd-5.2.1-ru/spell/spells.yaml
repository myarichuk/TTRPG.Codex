- id: aura-of-life
  name: "Аура жизни"
  description: |-
    *Ограждение 4-го уровня (Жрец, Паладин)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** Концентрация, вплоть до 10 минут

    Аура излучается от вас в 30-футовой эманации на время действия заклинания. Пока в ауре, вы и ваши союзники обладаете сопротивлением к некротическому урону, и ваши максимумы хитов не могут быть уменьшены. Если союзник с 0 хитов начинает свой ход в ауре, этот союзник восстанавливает 1 хит.
