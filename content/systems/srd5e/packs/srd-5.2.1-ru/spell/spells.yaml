- id: animate-objects
  name: Оживление предметов
  description: |-
    *5-й уровень, Преобразование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** до 1 минуты

    Предметы оживают по вашей команде. Выберите количество немагических предметов в пределах дистанции, которые не надеты и не несутся, не закреплены на поверхности и не являются гигантскими. Максимальное количество предметов равно модификатору вашей характеристики заклинаний; при подсчёте цель среднего или меньшего размера считается одним предметом, большая цель считается двумя, а огромная — тремя.
    Каждая цель оживает, отращивает ноги и становится Конструктом, использующим блок статистики Оживлённого предмета. Это существо находится под вашим контролем до окончания заклинания или пока не будет сведено к 0 очков здоровья. Каждое существо, созданное этим заклинанием, является союзником для вас и ваших союзников. В бою оно разделяет вашу Инициативу и ходит сразу после вас.
    Пока заклинание действует, вы можете совершить Бонусное действие, чтобы мысленно приказать любому созданному этим заклинанием существу, если оно находится в пределах 500 футов от вас (если вы контролируете нескольких существ, вы можете отдать одну и ту же команду всем одновременно). Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Когда существо падает до 0 очков здоровья, оно возвращается к форме предмета, и любой оставшийся урон переносится на эту форму.

    **Использование ячейки более высокого уровня.** Урон Удара существа увеличивается на 1d4 (среднего или меньшего размера), 1d6 (большого) или 1d12 (огромного) за каждый уровень ячейки выше 5-го. Конструкт Огромного или меньшего размера, Без мировоззрения КБ 15 ОЗ 10 (среднего или меньшего размера), 20 (большого), 40 (огромного) Скорость 30 футов. МОД СПАС    МОД СПАС    МОД СПАС Сила 16 +3 +3 Ловкость 10 +0 +0 Телосложение 10 +0 +0 Интеллект 3 -4 -4 Мудрость 3 -4 -4 Харизма 1 -5 -5 Иммунитеты яд, психическая энергия; Очарованный, Истощение, Испуганный, Парализованный, Отравленный Чувства слепое зрение 30 футов; Пассивная внимательность 6 Языки Понимает языки, которые вы знаете ПО нет (0 опыта; БМ равен вашему бонусу мастерства) Действия     Удар. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 5 футов. Попадание: урон силовым полем равен 1d4 + 3 (среднего или меньшего размера), 2d6 + 3 + ваш модификатор характеристики заклинаний (большого), или 2d12 + 3 + ваш модификатор характеристики заклинаний (огромного).
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 1 минуты
    higherLevel: |-
      Урон Удара существа увеличивается на 1d4 (среднего или меньшего размера), 1d6 (большого) или 1d12 (огромного) за каждый уровень ячейки выше 5-го. Конструкт Огромного или меньшего размера, Без мировоззрения КБ 15 ОЗ 10 (среднего или меньшего размера), 20 (большого), 40 (огромного) Скорость 30 футов. МОД СПАС    МОД СПАС    МОД СПАС Сила 16 +3 +3 Ловкость 10 +0 +0 Телосложение 10 +0 +0 Интеллект 3 -4 -4 Мудрость 3 -4 -4 Харизма 1 -5 -5 Иммунитеты яд, психическая энергия; Очарованный, Истощение, Испуганный, Парализованный, Отравленный Чувства слепое зрение 30 футов; Пассивная внимательность 6 Языки Понимает языки, которые вы знаете ПО нет (0 опыта; БМ равен вашему бонусу мастерства) Действия     Удар. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 5 футов. Попадание: урон силовым полем равен 1d4 + 3 (среднего или меньшего размера), 2d6 + 3 + ваш модификатор характеристики заклинаний (большого), или 2d12 + 3 + ваш модификатор характеристики заклинаний (огромного).
