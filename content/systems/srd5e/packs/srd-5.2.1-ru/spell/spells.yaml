- id: speak-with-plants
  name: "Разговор с растениями"
  description: |-
    *Преобразование 3-го уровня (Бард, Друид, Следопыт)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** 10 минут

    Вы наделяете растения в неподвижной 30-футовой эманации ограниченным разумом и способностью к движению, давая им возможность общаться с вами и следовать вашим простым командам. Вы можете расспрашивать растения о событиях в области заклинания за последний день, получая информацию о существах, которые проходили мимо, погоде и других обстоятельствах.

    Вы также можете превратить труднопроходимую местность, вызванную растительностью (такую как заросли и подлесок), в обычную местность на время действия заклинания. Или вы можете превратить обычную местность, где есть растения, в труднопроходимую на время действия заклинания.

    Заклинание не позволяет растениям выкорчёвывать себя и перемещаться, но они могут шевелить своими ветвями, усиками и стеблями для вас.

    Если в области находится существо-растение, вы можете общаться с ним, как если бы вы владели общим языком.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "10 минут"
