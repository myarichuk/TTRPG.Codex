    10 | Штиль | 2 | Умеренный ветер
    3 | Сильный ветер | 4 | Шквал
    5 | Шторм    квадрат и глубиной 25 футов. Водоворот сохраняется до тех пор, пока вы не выберете другой эффект или заклинание не закончится. Водоворот имеет ширину 5 футов у основания, до 50 футов вверху и высоту 25 футов. Любое существо в воде и в пределах 25 футов от водоворота притягивается на 10 футов к нему. Когда существо входит в водоворот впервые за ход или заканчивает там свой ход, оно совершает спасбросок по характеристике Сила. При провале существо получает 2d8 дробящего урона. При успехе существо получает половину этого урона. Существо может выплыть из водоворота, только если сначала совершит действие, чтобы вырваться, и преуспеет в проверке Силы (Атлетика) против Сложности спасброска ваших заклинаний.
