# source: OmnisGM (CC BY 4.0)
- id: secret-chest
  name: "Тайный сундук"
  description: |-
    *Вызов 4-го уровня (Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (сундук размером 3 на 2 на 2 фута, изготовленный из редких материалов стоимостью 5000+ зм, и Крошечная его копия из тех же материалов стоимостью 50+ зм)  
    **Длительность:** Пока не рассеяно

    Вы прячете сундук и всё его содержимое на Эфирном Плане. Вы должны касаться сундука и миниатюрной копии, являющихся материальными компонентами заклинания. Сундук может вмещать до 12 кубических футов неживого материала (3 на 2 на 2 фута).

    Пока сундук остаётся на Эфирном Плане, вы можете совершить действие «Магия» и коснуться копии, чтобы призвать сундук. Он появляется в незанятом пространстве на земле в пределах 5 футов от вас. Вы можете отправить сундук обратно на Эфирный План, совершив действие «Магия» и коснувшись сундука и копии.

    После 60 дней существует кумулятивная 5-процентная вероятность в конце каждого дня, что заклинание закончится. Заклинание также заканчивается, если вы сотворяете его снова или если Крошечная копия сундука уничтожена. Если заклинание заканчивается, а большой сундук находится на Эфирном Плане, он остаётся там, чтобы вы или кто-то другой его нашёл.
  properties:
    castingTime: "Действие"
    range: "Касание"
    material: "сундук размером 3 на 2 на 2 фута, изготовленный из редких материалов стоимостью 5000+ зм, и Крошечная его копия из тех же материалов стоимостью 50+ зм"
    duration: "Пока не рассеяно"
