- id: teleport
  name: "Телепорт"
  description: |-
    *Вызов 7-го уровня (Бард, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 10 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Это заклинание мгновенно переносит вас и до восьми согласных существ, которых вы видите в пределах дистанции, или один объект, который вы видите в пределах дистанции, к месту назначения на ваш выбор. Если вы нацеливаетесь на объект, он должен быть размера Большой или меньше и не должен носиться или нестись несогласным существом.

    Место назначения, которое вы выбираете, должно быть вам известно и должно находиться на том же плане существования, что и вы. Ваше знакомство с местом назначения определяет, прибудете ли вы туда успешно. Мастер бросает 1d100 и сверяется с таблицей результатов телепортации и пояснениями после неё.

    Table: Результаты телепортации

    | Знакомство | Несчастье | Похожая область | Промах | В цель |
    |---|---|---|---|---|
    | Постоянный круг | — | — | — | 01–00 |
    | Связанный объект | — | — | — | 01–00 |
    | Очень знакомо | 01–05 | 06–13 | 14–24 | 25–00 |
    | Видели мельком | 01–33 | 34–43 | 44–53 | 54–00 |
    | Видели раз или по описанию | 01–43 | 44–53 | 54–73 | 74–00 |
    | Ложное место | 01–50 | 51–00 | — | — |

    **_Знакомство._** Вот значения терминов в столбце «Знакомство» таблицы:

    - «Постоянный круг» означает постоянный круг телепортации, сигнатурную последовательность которого вы знаете.
    - «Связанный объект» означает, что вы обладаете объектом, взятым из желаемого места назначения в течение последних шести месяцев, например книгой из библиотеки волшебника.
    - «Очень знакомо» — место, которое вы часто посещали, место, которое тщательно изучили, или место, которое вы видите в момент сотворения заклинания.
    - «Видели мельком» — место, которое вы видели более одного раза, но с которым не очень хорошо знакомы.
    - «Видели раз или по описанию» — место, которое вы видели один раз, возможно с помощью магии, или место, которое знаете по чужому описанию, например по карте.
    - «Ложное место» — место, которого не существует. Возможно, вы пытались наблюдать за убежищем врага, но вместо этого увидели иллюзию, или вы пытаетесь телепортироваться в место, которого больше нет.

    **_Несчастье._** Непредсказуемая магия заклинания приводит к трудному путешествию. Каждое телепортируемое существо (или объект-цель) получает 3d10 урона силовым полем, и Мастер перебрасывает по таблице, чтобы узнать, куда вы попали (возможно несколько несчастий, каждое наносит урон).

    **_Похожая область._** Вы и ваша группа (или объект-цель) появляетесь в другой области, визуально или тематически похожей на целевую область. Вы появляетесь в ближайшем похожем месте. Если вы направлялись в свою домашнюю лабораторию, например, вы можете появиться в лаборатории другого человека в том же городе.

    **_Промах._** Вы и ваша группа (или объект-цель) появляетесь в 2d12 милях от места назначения в случайном направлении. Бросьте 1d8 для определения направления: 1 — восток; 2 — юго-восток; 3 — юг; 4 — юго-запад; 5 — запад; 6 — северо-запад; 7 — север; 8 — северо-восток.

    **_В цель._** Вы и ваша группа (или объект-цель) появляетесь там, где планировали.
  properties:
    castingTime: "Действие"
    range: "10 футов"
    duration: "Мгновенная"
# source: OmnisGM (CC BY 4.0)
- id: teleportation-circle
  name: "Круг телепортации"
  description: |-
    *Вызов 5-го уровня (Бард, Чародей, Колдун, Волшебник)*

    **Время накладывания:** 1 минута  
    **Дистанция:** 10 футов  
    **Компоненты:** В, М (редкие чернила стоимостью 50+ зм, потребляемые заклинанием)  
    **Длительность:** 1 раунд

    Когда вы сотворяете заклинание, вы рисуете на земле круг радиусом 5 футов, начертанный сигилами, которые связывают ваше местоположение с постоянным кругом телепортации на ваш выбор, сигнатурную последовательность которого вы знаете и который находится на том же плане существования, что и вы. Мерцающий портал открывается в начерченном круге и остаётся открытым до конца вашего следующего хода. Любое существо, входящее в портал, мгновенно появляется в пределах 5 футов от круга назначения или в ближайшем свободном пространстве, если оно занято.

    Многие крупные храмы, залы гильдий и другие важные места имеют постоянные круги телепортации. Каждый такой круг включает уникальную сигнатурную последовательность — строку рун, расположенных в определённом узоре.

    Когда вы впервые получаете возможность сотворять это заклинание, вы узнаёте сигнатурные последовательности двух мест назначения на Материальном Плане, определённых Мастером. Вы можете узнать дополнительные сигнатурные последовательности во время своих приключений. Вы можете запомнить новую сигнатурную последовательность, изучив её в течение 1 минуты.

    Вы можете создать постоянный круг телепортации, сотворяя это заклинание в одном и том же месте каждый день в течение 365 дней.
  properties:
    castingTime: "1 минута"
    range: "10 футов"
    material: "редкие чернила стоимостью 50+ зм, потребляемые заклинанием"
    duration: "1 раунд"
