- id: wall-of-thorns
  name: Стена терниев
  description: |-
    *6-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (горсть терниев)
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте стену из спутанных зарослей, усеянных острыми как игла шипами. Стена появляется в пределах дистанции на твёрдой поверхности и существует в течение всей длительности. Вы выбираете, сделать ли стену длиной до 60 футов, высотой 10 футов и толщиной 5 футов или круг диаметром 20 футов, высотой до 20 футов и толщиной 5 футов. Стена блокирует линию видимости.
    Когда стена появляется, каждое существо в её области совершает спасбросок Ловкости, получая 7d8 урона колющим при провале или вдвое меньше при успехе.
    Существо может пройти сквозь стену, хотя и медленно и мучительно. За каждый 1 фут пути сквозь стену существо тратит 4 фута движения. Кроме того, при первом входе в пространство стены за ход или завершении хода в нём существо совершает спасбросок Ловкости, получая 7d8 урона рубящим при провале или вдвое меньше при успехе. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки более высокого уровня.** Оба вида урона увеличиваются на 1d8 за каждый уровень ячейки выше 6-го.
