  name: "Падение пёрышком"
  description: |-
    *Преобразование 1-го уровня (Бард, Чародей, Волшебник)*

    **Время накладывания:** Реакция, которую вы совершаете, когда вы или существо, которое вы видите в пределах 60 футов от вас, падает  
    **Дистанция:** 60 футов  
    **Компоненты:** В, М (маленькое перо или кусочек пуха)  
    **Длительность:** 1 минута

    Выберите до пяти падающих существ в пределах дистанции. Скорость падения падающего существа замедляется до 60 футов за раунд до окончания заклинания. Если существо приземляется до окончания заклинания, оно не получает урона от падения, и заклинание заканчивается для этого существа.
  properties:
    castingTime: "Реакция, которую вы совершаете, когда вы или существо, которое вы видите в пределах 60 футов от вас, падает"
    range: "60 футов"
    material: "маленькое перо или кусочек пуха"
    duration: "1 минута"
# source: TTRPG.Codex (machine-drafted)
- id: find-familiar
  name: Поиск фамильяра
  description: |-
    *1-й уровень, Вызов (Волшебник)*

    **Время сотворения:** 1 час или ритуал
    **Дистанция:** 10 футов
    **Компоненты:** V, S, M (горящие благовония стоимостью 10+ зм, которые заклинание расходует)
    **Длительность:** Мгновенная

    Вы получаете услуги фамильяра, духа, принимающего облик животного на ваш выбор: летучей мыши, кошки, жабы, ястреба, ящерицы, осьминога, совы, крысы, ворона, паука, ласки или другого зверя с показателем опасности 0. Появившись в незанятом пространстве в пределах дистанции, фамильяр имеет характеристики выбранной формы (см. «Монстры»), но является небожителем, феей или исчадием (на ваш выбор) вместо зверя. Фамильяр действует самостоятельно, но подчиняется вашим командам.
    Телепатическая связь. Пока фамильяр находится в пределах 100 футов от вас, вы можете общаться с ним телепатически. Кроме того, как бонусное действие вы можете видеть глазами фамильяра и слышать то, что слышит он, до начала вашего следующего хода, получая преимущества любых его особых чувств.
    Наконец, когда вы сотворяете заклинание с дистанцией «касание», ваш фамильяр может доставить касание. Фамильяр должен находиться в пределах 100 футов от вас и совершить реакцию, чтобы доставить касание при сотворении заклинания.
    Бой. Фамильяр является союзником для вас и ваших союзников. Он бросает собственную инициативу и действует в свой ход. Фамильяр не может атаковать, но может совершать другие действия как обычно.
    Исчезновение фамильяра. Когда фамильяр падает до 0 очков здоровья, он исчезает. Он появится вновь после того, как вы сотворите это заклинание снова. Как магическое действие вы можете временно отослать фамильяра в карманное измерение. Либо вы можете отослать его навсегда. Как магическое действие, пока он временно отослан, вы можете вызвать его появление в незанятом пространстве в пределах 30 футов от вас. Когда фамильяр падает до 0 очков здоровья или исчезает в карманном измерении, он оставляет в своём пространстве всё, что на нём надето или несётся.
    Только один фамильяр. Одновременно у вас может быть не более одного фамильяра. Если вы сотворите это заклинание, имея фамильяра, он вместо этого принимает новую подходящую форму.
  properties:
    castingTime: "1 час"
    range: "10 футов"
    material: "горящие благовония стоимостью 10+ зм, которые заклинание расходует"
    duration: "Мгновенная"
# source: TTRPG.Codex (machine-drafted)
- id: find-steed
  name: Поиск скакуна
  description: |-
    *2-й уровень, Вызов (Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов Компонент: V, S
    **Компоненты:**
    **Длительность:** Мгновенная

    Вы призываете потустороннее существо, которое предстаёт как верный скакун, в незанятом пространстве по вашему выбору в пределах дистанции. Это существо использует блок характеристик потустороннего скакуна. Если у вас уже есть скакун от этого заклинания, он заменяется новым.
    Скакун напоминает большое верховое животное на ваш выбор, например лошадь, верблюда, устрашающего волка или лося. При каждом сотворении заклинания выбирайте тип существа скакуна: небожитель, фея или исчадие, что определяет некоторые особенности в блоке характеристик.
    Бой. Скакун является союзником для вас и ваших союзников. В бою он разделяет ваш счётчик инициативы и функционирует как управляемое животное, пока вы на нём едете (по правилам боя верхом). Если вы получили состояние «Выведенный из строя», скакун совершает свой ход сразу после вашего и действует самостоятельно, сосредоточившись на вашей защите.
    Исчезновение скакуна. Скакун исчезает, если падает до 0 очков здоровья или если вы умираете. Когда он исчезает, он оставляет всё, что на нём надето или несётся. Если вы сотворите это заклинание снова, вы решаете, призвать ли исчезнувшего скакуна или другого.

    **Использование ячейки более высокого уровня.** Используйте уровень ячейки заклинания как уровень заклинания в блоке характеристик. Большой небожитель, фея или исчадие (на ваш выбор), Нейтральный КБ 10 + 1 за уровень заклинания, ОЗ 5 + 10 за уровень заклинания (у скакуна число Костей Хитов [d10s] равно уровню заклинания) Скорость 60 футов, полёт 60 футов (требуется заклинание 4-го уровня или выше) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 18 +4 +4 ЛОВ 12 +1 +1 ТЕЛ 14 +2 +2 ИНТ 6 -2 -2 МУД 12 +1 +1 ХАР 8 -1 -1 Чувства: пассивная Внимательность 11 Языки: телепатия 1 миля (работает только с вами) ПО нет (опыт 0; бонус мастерства равен вашему бонусу мастерства) Особенности     Жизненная связь. Когда вы восстанавливаете очки здоровья от заклинания 1-го уровня или выше, скакун восстанавливает то же количество очков здоровья, если вы находитесь в пределах 5 футов от него. Действия     Потусторонний удар. Бросок атаки ближнего боя: бонус равен бонусу атаки заклинанием, досягаемость 5 футов. Попадание: 1d8 плюс уровень заклинания урона излучением (небожитель), психической энергией (фея) или некротической энергией (исчадие). Бонусные действия     Жуткий взгляд (только исчадие; перезаряжается после продолжительного отдыха). Спасбросок Мудрости: Сл равна Сложности спасброска вашего заклинания, одно существо в пределах 60 футов, которое скакун видит. Провал: цель получает состояние «Испуганный» до конца вашего следующего хода. Шаг феи (только фея; перезаряжается после продолжительного отдыха). Скакун телепортируется вместе со своим всадником в незанятое пространство по вашему выбору на расстояние до 60 футов от себя. Целительное прикосновение (только небожитель; перезаряжается после продолжительного отдыха). Одно существо в пределах 5 футов от скакуна восстанавливает количество очков здоровья, равное 2d8 плюс уровень заклинания.
  properties:
    castingTime: "Действие"
    range: "30 футов Компонент: V, S"
    duration: "Мгновенная"
    higherLevel: "Используйте уровень ячейки заклинания как уровень заклинания в блоке характеристик. Большой небожитель, фея или исчадие (на ваш выбор), Нейтральный КБ 10 + 1 за уровень заклинания, ОЗ 5 + 10 за уровень заклинания (у скакуна число Костей Хитов [d10s] равно уровню заклинания) Скорость 60 футов, полёт 60 футов (требуется заклинание 4-го уровня или выше) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 18 +4 +4 ЛОВ 12 +1 +1 ТЕЛ 14 +2 +2 ИНТ 6 -2 -2 МУД 12 +1 +1 ХАР 8 -1 -1 Чувства: пассивная Внимательность 11 Языки: телепатия 1 миля (работает только с вами) ПО нет (опыт 0; бонус мастерства равен вашему бонусу мастерства) Особенности     Жизненная связь. Когда вы восстанавливаете очки здоровья от заклинания 1-го уровня или выше, скакун восстанавливает то же количество очков здоровья, если вы находитесь в пределах 5 футов от него. Действия     Потусторонний удар. Бросок атаки ближнего боя: бонус равен бонусу атаки заклинанием, досягаемость 5 футов. Попадание: 1d8 плюс уровень заклинания урона излучением (небожитель), психической энергией (фея) или некротической энергией (исчадие). Бонусные действия     Жуткий взгляд (только исчадие; перезаряжается после продолжительного отдыха). Спасбросок Мудрости: Сл равна Сложности спасброска вашего заклинания, одно существо в пределах 60 футов, которое скакун видит. Провал: цель получает состояние «Испуганный» до конца вашего следующего хода. Шаг феи (только фея; перезаряжается после продолжительного отдыха). Скакун телепортируется вместе со своим всадником в незанятое пространство по вашему выбору на расстояние до 60 футов от себя. Целительное прикосновение (только небожитель; перезаряжается после продолжительного отдыха). Одно существо в пределах 5 футов от скакуна восстанавливает количество очков здоровья, равное 2d8 плюс уровень заклинания."
