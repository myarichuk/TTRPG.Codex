- id: resilient-sphere
  name: "Упругая сфера"
  description: |-
    *Ограждение 4-го уровня (Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (стеклянная сфера)  
    **Длительность:** Концентрация, до 1 минуты

    Мерцающая сфера заключает в себя существо размера Большой или меньше или объект в пределах дистанции. Несогласное существо должно преуспеть в спасброске Ловкости, иначе будет заключено на время действия заклинания.

    Ничто — ни физические объекты, ни энергия, ни другие магические эффекты — не может проникнуть через барьер ни внутрь, ни наружу, хотя существо внутри сферы может дышать. Сфера иммунна ко всему урону, и существо или объект внутри не может получить урон от атак или эффектов, исходящих снаружи, равно как и существо внутри сферы не может нанести урон ничему снаружи.

    Сфера невесома и достаточно велика, чтобы вместить существо или объект внутри. Заключённое существо может действием толкать стенки сферы и таким образом перекатывать сферу со скоростью, равной половине скорости существа. Точно так же другие существа могут поднять и переместить сферу.

    Заклинание *Распад*, нацеленное на сферу, уничтожает её, не причиняя вреда тому, что внутри.
