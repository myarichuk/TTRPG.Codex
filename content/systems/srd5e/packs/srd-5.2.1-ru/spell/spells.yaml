    Каждое существо на ваш выбор в сфере радиусом 5 футов с центром в точке в пределах дистанции должно преуспеть в спасброске Мудрости, иначе оно получает состояние «Недееспособный» до конца своего следующего хода, после чего должно повторить спасбросок. Если цель проваливает второй спасбросок, она получает состояние «Без сознания» на время действия заклинания. Заклинание заканчивается для цели, если она получает урон или если кто-то в пределах 5 футов от неё совершает действие, чтобы вывести её из-под действия заклинания.

    Существа, которые не спят, например эльфы, или имеющие иммунитет к состоянию «Истощение», автоматически преуспевают в спасбросках от этого заклинания.
