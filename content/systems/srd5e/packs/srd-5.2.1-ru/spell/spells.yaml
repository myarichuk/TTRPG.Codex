    **Длительность:** Мгновенная

    Вы выпускаете ослепительную вспышку разноцветного света. Каждое существо в конусе длиной 15 футов, исходящем от вас, должно преуспеть в спасброске Телосложения, иначе оно получает состояние «Ослеплённый» до конца вашего следующего хода.
