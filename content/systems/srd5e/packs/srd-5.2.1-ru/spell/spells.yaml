- id: web
  name: "Паутина"
  description: |-
    *Вызов 2-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С, М (кусочек паутины)  
    **Длительность:** Концентрация, до 1 часа

    Вы создаёте массу густой, липкой паутины, заполняющей куб с ребром 20 футов от точки на ваш выбор в пределах дистанции. Паутина — это труднопроходимая местность, и область, которую она покрывает, слабо затемнена.

    Если паутина не прикреплена к двум твёрдым массам (таким как стены или деревья) или не растянута между полом, стеной и потолком, созданная паутина сминается и заклинание заканчивается в начале вашего следующего хода. Паутина, растянутая на плоской поверхности, имеет глубину 5 футов.

    Каждое существо, которое входит в паутину в свой ход или начинает там свой ход, должно совершить спасбросок Ловкости. При провале существо получает состояние «Опутанный», пока остаётся в паутине или пока не вырвется.

    Существо, Опутанное паутиной, может действием совершить проверку Силы (Атлетика) против СЛ спасброска ваших заклинаний. При успехе оно больше не Опутано.

    Паутина горюча. Любой куб паутины с ребром 5 футов, подвергшийся воздействию огня, сгорает за 1 раунд, нанося 2d4 урона огнём каждому существу, которое начинает свой ход в огне.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    material: "кусочек паутины"
    duration: "Концентрация, до 1 часа"
