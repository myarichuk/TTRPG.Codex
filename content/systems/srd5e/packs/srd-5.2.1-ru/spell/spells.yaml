- id: awaken
  name: Пробуждение
  description: |-
    *5-й уровень, Преобразование (Бард, Друид)*

    **Время сотворения:** 8 часов
    **Дистанция:** Касание
    **Компоненты:** В, С, М (агат стоимостью 1,000+ зм, который заклинание расходует)
    **Длительность:** Мгновенная

    Вы тратите время сотворения, прослеживая магические пути внутри драгоценного камня, а затем касаетесь цели. Цель должна быть либо Зверем или существом типа Растение с Интеллектом 3 или меньше, либо природным растением, которое не является существом. Цель получает Интеллект 10 и способность говорить на одном языке, который вы знаете. Если цель — природное растение, оно становится существом типа Растение и получает способность двигать своими конечностями, корнями, лозами, плетями и так далее, а также чувства, похожие на человеческие. Мастер выбирает игровые характеристики, подходящие для пробуждённого растения, например характеристики Пробуждённого кустарника или Пробуждённого дерева из «Существ».
    Пробуждённая цель получает состояние «Очарованный» на 30 дней или до тех пор, пока вы или ваши союзники не нанесёте ей урон. Когда это состояние заканчивается, пробуждённое существо выбирает своё отношение к вам.
  properties:
    castingTime: 8 часов
    range: Касание
    material: агат стоимостью 1,000+ зм, который заклинание расходует
    duration: Мгновенная
