    **Длительность:** Мгновенная

    Вы можете сотворить это заклинание только ночью. Выберите до трёх трупов Средних или Маленьких гуманоидов в пределах дистанции. Каждый из них становится Гулем под вашим контролем (см. «Монстры» для его блока характеристик).
    Каждый ваш ход в качестве Бонусного действия вы можете мысленно приказать любому существу, которое вы подняли этим заклинанием, если оно находится в пределах 120 футов от вас (если вы контролируете несколько существ, вы можете приказать любому из них одновременно, отдав им одну и ту же команду). Вы решаете, какое действие существо совершит и куда переместится в свой следующий ход, или можете отдать общий приказ, например охранять определённое место. Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Получив приказ, существо продолжает выполнять его, пока задача не будет выполнена.
    Существо находится под вашим контролем 24 часа, после чего перестаёт подчиняться любым приказам, которые вы ему отдали. Чтобы сохранить контроль над существом ещё на 24 часа, вы должны сотворить это заклинание на него до окончания текущего 24-часового периода. Такое использование заклинания восстанавливает ваш контроль над существами, которых вы подняли этим заклинанием, до трёх, вместо того чтобы поднимать новых.

    **Использование ячейки более высокого уровня.** Если вы используете ячейку 7-го уровня, вы можете поднять или восстановить контроль над четырьмя гулями. Если вы используете ячейку 8-го уровня, вы можете поднять или восстановить контроль над пятью гулями или двумя гастами либо вайтами. Если вы используете ячейку 9-го уровня, вы можете поднять или восстановить контроль над шестью гулями, тремя гастами или вайтами либо двумя мумиями. См. «Монстры» для этих блоков характеристик.
