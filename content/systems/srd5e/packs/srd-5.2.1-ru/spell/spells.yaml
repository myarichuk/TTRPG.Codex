- id: acid-arrow
  name: Кислотная стрела
  description: |-
    *2-й уровень, Воплощение (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С, М (порошок из листа ревеня)
    **Длительность:** Мгновенная

    Мерцающая зелёная стрела устремляется к цели в пределах дистанции и взрывается брызгами кислоты. Совершите против цели дальнобойную атаку заклинанием. При попадании цель получает 4d4 кислотного урона и ещё 2d4 кислотного урона в конце своего следующего хода. При промахе стрела обрызгивает цель кислотой, нанося только половину начального урона.

    **Использование ячейки более высокого уровня.** Урон (как начальный, так и последующий) увеличивается на 1d4 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 90 футов
    material: порошок из листа ревеня
    duration: Мгновенная
    higherLevel: Урон (как начальный, так и последующий) увеличивается на 1d4 за каждый уровень ячейки выше 2-го.

- id: acid-splash
  name: Брызги кислоты
  description: |-
    *Воплощение, заговор (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы создаёте кислотный пузырь в точке в пределах дистанции, и он взрывается в сфере радиусом 5 футов. Каждое существо в этой сфере должно пройти спасбросок Ловкости, иначе получит 1d6 кислотного урона.
    Улучшение заговора. Урон увеличивается на 1d6, когда вы достигаете 5-го (2d6), 11-го (3d6) и 17-го (4d6) уровня.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная

- id: aid
  name: Помощь
  description: |-
    *2-й уровень, Ограждение (Бард, Жрец, Друид, Паладин, Рейнджер)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (полоска белой ткани)
    **Длительность:** 8 часов

    Выберите до трёх существ в пределах дистанции. Максимум очков здоровья и текущие очки здоровья каждой цели увеличиваются на 5 на время действия заклинания.

    **Использование ячейки более высокого уровня.** Очки здоровья каждой цели увеличиваются на 5 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: полоска белой ткани
    duration: 8 часов
    higherLevel: Очки здоровья каждой цели увеличиваются на 5 за каждый уровень ячейки выше 2-го.

- id: alarm
  name: Сигнализация
  description: |-
    *1-й уровень, Ограждение (Рейнджер, Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (колокольчик и серебряная проволока)
    **Длительность:** 8 часов

    Вы устанавливаете сигнализацию против вторжения. Выберите дверь, окно или область в пределах дистанции, не больше куба со стороной 20 футов. Пока заклинание действует, сигнализация срабатывает, когда существо касается защищённой области или входит в неё. При сотворении вы можете указать существ, которые не будут её активировать. Также вы выбираете, будет сигнализация звуковой или мысленной. Звуковая сигнализация издаёт звук ручного колокольчика в течение 10 секунд в пределах 60 футов от защищённой области. Мысленная сигнализация посылает вам мысленный сигнал, если вы находитесь в пределах 1 мили от защищённой области. Этот сигнал пробуждает вас, если вы спите.
  properties:
    castingTime: 1 минута
    range: 30 футов
    material: колокольчик и серебряная проволока
    duration: 8 часов

- id: alter-self
  name: Смена облика
  description: |-
    *2-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 часа

    Вы меняете свою физическую форму. Выберите один из следующих вариантов. Его эффекты длятся всё время действия, в течение которого вы можете совершить Магическое действие, чтобы заменить выбранный вариант другим.
    Водная адаптация. Вы отращиваете жабры и обзаводитесь перепонками между пальцами. Вы можете дышать под водой и получаете скорость плавания, равную вашей скорости.
    Изменение внешности. Вы меняете внешность. Вы решаете, как выглядеть, включая рост, вес, черты лица, звучание голоса, длину волос, окрас и другие отличительные черты. Вы можете выглядеть как представитель другого вида, но ваши характеристики не меняются. Вы не можете принять облик существа другого размера, а ваша базовая форма остаётся прежней: если вы двуногий, например, с помощью этого заклинания вы не сможете стать четвероногим. На время действия вы можете совершить Магическое действие, чтобы снова изменить внешность таким образом.
    Естественное оружие. Вы отращиваете когти (рубящий урон), клыки (колющий урон), рога (колющий урон) или копыта (дробящий урон). Когда вы используете Безоружный удар, чтобы нанести урон этими новыми отростками, он наносит 1d6 урона типа, указанного в скобках, вместо обычного урона Безоружного удара, а для бросков атаки и урона вы используете модификатор характеристики заклинаний, а не характеристику Сила.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 часа

- id: animal-friendship
  name: Дружба с животными
  description: |-
    *1-й уровень, Очарование (Бард, Друид, Рейнджер)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (кусочек пищи)
    **Длительность:** 24 часа

    Выберите Зверя, которого вы видите в пределах дистанции. Цель должна пройти спасбросок Мудрости, иначе получит состояние Очарованный на время действия заклинания. Если вы или ваш союзник наносите урон цели, заклинание заканчивается.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одного дополнительного Зверя за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: кусочек пищи
    duration: 24 часа
    higherLevel: Вы можете выбрать одного дополнительного Зверя за каждый уровень ячейки выше 1-го.

- id: animal-messenger
  name: Животное-посыльный
  description: |-
    *2-й уровень, Очарование (Бард, Друид, Рейнджер)*

    **Время сотворения:** Действие или Ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (кусочек пищи)
    **Длительность:** 24 часа

    Крошечный Зверь по вашему выбору, которого вы видите в пределах дистанции, должен пройти спасбросок Харизмы, иначе он доставит ваше сообщение (если показатель опасности цели не равен 0, она автоматически проходит спасбросок). Вы указываете место, которое посещали, и получателя, подходящего под общее описание, например «человек в форме городской стражи» или «рыжеволосый дварф в остроконечной шляпе». Вы также передаёте сообщение длиной до двадцати пяти слов. Зверь движется к указанному месту в течение всей длительности, покрывая около 25 миль за 24 часа или 50 миль, если он умеет летать.
    Когда Зверь прибывает, он передаёт ваше сообщение описанному вами существу, подражая вашей манере речи. Если Зверь не доберётся до места назначения до окончания заклинания, сообщение теряется, а Зверь возвращается туда, где вы сотворили заклинание.

    **Использование ячейки более высокого уровня.** Длительность заклинания увеличивается на 48 часов за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: кусочек пищи
    duration: 24 часа
    higherLevel: Длительность заклинания увеличивается на 48 часов за каждый уровень ячейки выше 2-го.

- id: animal-shapes
  name: Облики животных
  description: |-
    *8-й уровень, Преобразование (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** 24 часа

    Выберите любое количество добровольных существ, которых вы видите в пределах дистанции. Каждая цель превращается в Зверя по вашему выбору размера Большого или меньше, с показателем опасности 4 или ниже. Вы можете выбрать разный облик для каждой цели. На последующих ходах вы можете совершить Магическое действие, чтобы снова превратить цели.
    Игровые характеристики цели заменяются характеристиками выбранного Зверя, но цель сохраняет свой тип существа, очки здоровья, Кости Хитов, мировоззрение, способность к общению, а также значения Интеллекта, Мудрости и Харизмы. Действия цели ограничены анатомией облика Зверя, и она не может сотворять заклинания. Снаряжение цели сливается с новой формой, и цель не может пользоваться этим снаряжением, пока находится в этом облике.
    Цель получает количество Временных очков здоровья, равное очкам здоровья первой формы, в которую она превратилась. Эти Временные очки здоровья исчезают, если какие-то из них остаются, когда заклинание заканчивается. Превращение длится всё время действия или до тех пор, пока цель не завершит его Бонусным действием.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 24 часа

- id: animate-dead
  name: Оживление мёртвых
  description: |-
    *3-й уровень, Некромантия (Жрец, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (капля крови, кусок плоти и щепотка костной пыли)
    **Длительность:** Мгновенная

    Выберите кучу костей или труп среднего или маленького гуманоида в пределах дистанции. Цель становится Нежитью: Скелетом, если вы выбрали кости, или Зомби, если вы выбрали труп (см. «Монстры» для блоков статистики).
    Каждый ваш ход вы можете совершить Бонусное действие, чтобы мысленно приказать любому существу, которое вы подняли этим заклинанием, если оно находится в пределах 60 футов от вас (если вы контролируете нескольких существ, вы можете отдать одну и ту же команду всем одновременно). Вы решаете, какое действие существо совершит и куда переместится в свой следующий ход, или можете отдать общий приказ, например охранять комнату или коридор. Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Получив приказ, существо продолжает его выполнять, пока задача не будет завершена.
    Существо находится под вашим контролем 24 часа, после чего перестаёт подчиняться любым вашим приказам. Чтобы сохранить контроль над существом ещё на 24 часа, вы должны сотворить это заклинание на нём до окончания текущего 24-часового периода. Такое использование заклинания подтверждает ваш контроль над существами, которых вы подняли этим заклинанием (до четырёх), вместо того чтобы поднимать нового.

    **Использование ячейки более высокого уровня.** Вы поднимаете или подтверждаете контроль над двумя дополнительными Нежитями за каждый уровень ячейки выше 3-го. Каждое существо должно происходить из разного трупа или кучи костей.
  properties:
    castingTime: 1 минута
    range: 10 футов
    material: капля крови, кусок плоти и щепотка костной пыли
    duration: Мгновенная
    higherLevel: Вы поднимаете или подтверждаете контроль над двумя дополнительными Нежитями за каждый уровень ячейки выше 3-го. Каждое существо должно происходить из разного трупа или кучи костей.

- id: animate-objects
  name: Оживление предметов
  description: |-
    *5-й уровень, Преобразование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** до 1 минуты

    Предметы оживают по вашей команде. Выберите количество немагических предметов в пределах дистанции, которые не надеты и не несутся, не закреплены на поверхности и не являются гигантскими. Максимальное количество предметов равно модификатору вашей характеристики заклинаний; при подсчёте цель среднего или меньшего размера считается одним предметом, большая цель считается двумя, а огромная — тремя.
    Каждая цель оживает, отращивает ноги и становится Конструктом, использующим блок статистики Оживлённого предмета. Это существо находится под вашим контролем до окончания заклинания или пока не будет сведено к 0 очков здоровья. Каждое существо, созданное этим заклинанием, является союзником для вас и ваших союзников. В бою оно разделяет вашу Инициативу и ходит сразу после вас.
    Пока заклинание действует, вы можете совершить Бонусное действие, чтобы мысленно приказать любому созданному этим заклинанием существу, если оно находится в пределах 500 футов от вас (если вы контролируете нескольких существ, вы можете отдать одну и ту же команду всем одновременно). Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Когда существо падает до 0 очков здоровья, оно возвращается к форме предмета, и любой оставшийся урон переносится на эту форму.

    **Использование ячейки более высокого уровня.** Урон Удара существа увеличивается на 1d4 (среднего или меньшего размера), 1d6 (большого) или 1d12 (огромного) за каждый уровень ячейки выше 5-го. Конструкт Огромного или меньшего размера, Без мировоззрения КБ 15 ОЗ 10 (среднего или меньшего размера), 20 (большого), 40 (огромного) Скорость 30 футов. МОД СПАС    МОД СПАС    МОД СПАС Сила 16 +3 +3 Ловкость 10 +0 +0 Телосложение 10 +0 +0 Интеллект 3 -4 -4 Мудрость 3 -4 -4 Харизма 1 -5 -5 Иммунитеты яд, психическая энергия; Очарованный, Истощение, Испуганный, Парализованный, Отравленный Чувства слепое зрение 30 футов; Пассивная внимательность 6 Языки Понимает языки, которые вы знаете ПО нет (0 опыта; БМ равен вашему бонусу мастерства) Действия     Удар. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 5 футов. Попадание: урон силовым полем равен 1d4 + 3 (среднего или меньшего размера), 2d6 + 3 + ваш модификатор характеристики заклинаний (большого), или 2d12 + 3 + ваш модификатор характеристики заклинаний (огромного).
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 1 минуты
    higherLevel: |-
      Урон Удара существа увеличивается на 1d4 (среднего или меньшего размера), 1d6 (большого) или 1d12 (огромного) за каждый уровень ячейки выше 5-го. Конструкт Огромного или меньшего размера, Без мировоззрения КБ 15 ОЗ 10 (среднего или меньшего размера), 20 (большого), 40 (огромного) Скорость 30 футов. МОД СПАС    МОД СПАС    МОД СПАС Сила 16 +3 +3 Ловкость 10 +0 +0 Телосложение 10 +0 +0 Интеллект 3 -4 -4 Мудрость 3 -4 -4 Харизма 1 -5 -5 Иммунитеты яд, психическая энергия; Очарованный, Истощение, Испуганный, Парализованный, Отравленный Чувства слепое зрение 30 футов; Пассивная внимательность 6 Языки Понимает языки, которые вы знаете ПО нет (0 опыта; БМ равен вашему бонусу мастерства) Действия     Удар. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 5 футов. Попадание: урон силовым полем равен 1d4 + 3 (среднего или меньшего размера), 2d6 + 3 + ваш модификатор характеристики заклинаний (большого), или 2d12 + 3 + ваш модификатор характеристики заклинаний (огромного).

- id: antilife-shell
  name: Оболочка против жизни
  description: |-
    *5-й уровень, Ограждение (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 часа

    Вокруг вас возникает аура в 10-футовой эманации, которая держится всё время действия. Аура не позволяет существам, кроме Конструктов и Нежити, проходить сквозь неё или дотягиваться через неё. Затронутое существо может сотворять заклинания или атаковать оружием дальнего боя или с досягаемостью через барьер.
    Если вы переместитесь так, что затронутое существо будет вынуждено пройти через барьер, заклинание заканчивается.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 часа

- id: antimagic-field
  name: Антимагическое поле
  description: |-
    *8-й уровень, Ограждение (Жрец, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (железные опилки)
    **Длительность:** Концентрация, до 1 часа

    Вокруг вас возникает аура антимагии в 10-футовой эманации. Никто не может сотворять заклинания, совершать Магические действия или создавать иные магические эффекты внутри ауры, и эти эффекты не могут выбирать целью или иначе воздействовать на что-либо внутри неё. Магические свойства магических предметов не работают внутри ауры или на что-либо внутри неё.
    Зоны воздействия, созданные заклинаниями или иной магией, не могут простираться в ауру, и никто не может телепортироваться в неё или из неё либо совершать межпланарные путешествия внутри неё. Порталы временно закрываются, пока находятся в ауре.
    Действующие заклинания, за исключением сотворённых артефактом или божеством, подавляются в этой области. Пока эффект подавлен, он не работает, но время подавления засчитывается в его длительность.
    Рассеивание магии не действует на ауру, а ауры разных заклинаний «Антимагическое поле» не аннулируют друг друга.
  properties:
    castingTime: Действие
    range: На себя
    material: железные опилки
    duration: до 1 часа
- id: antipathy-sympathy
  name: Антипатия/Симпатия
  description: |-
    *8-й уровень, Очарование (Бард, Друид, Волшебник)*

    **Время сотворения:** 1 час
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (смесь уксуса и мёда)
    **Длительность:** 10 дней

    Когда вы сотворяете заклинание, выберите, создаёт оно антипатию или симпатию, и нацельтесь на одно существо или предмет размером не больше Огромного. Затем укажите вид существ, например красных драконов, гоблинов или вампиров. Существо выбранного вида совершает спасбросок Мудрости, когда оказывается в пределах 120 футов от цели. Ваш выбор антипатии или симпатии определяет, что произойдёт с существом, которое проваливает этот спасбросок. Антипатия. Существо получает состояние «Испуганный». Испуганное существо должно тратить своё перемещение в свои ходы на то, чтобы как можно дальше удалиться от цели, двигаясь по самому безопасному маршруту. Симпатия. Существо получает состояние «Очарованный». Очарованное существо должно тратить своё перемещение в свои ходы на то, чтобы как можно ближе подойти к цели, двигаясь по самому безопасному маршруту. Если существо находится в пределах 5 футов от цели, оно не может добровольно отойти прочь. Если цель наносит урон очарованному существу, это существо может совершить спасбросок Мудрости, чтобы прекратить эффект, как описано ниже.
    Завершение эффекта. Если испуганное или очарованное существо заканчивает свой ход более чем в 120 футах от цели, оно совершает спасбросок Мудрости. При успешном спасброске оно больше не находится под воздействием цели. Существо, успешно прошедшее спасбросок против этого эффекта, получает иммунитет к нему на 1 минуту, после чего может снова попасть под его действие.
  properties:
    castingTime: 1 час
    range: 60 футов
    material: смесь уксуса и мёда
    duration: 10 дней

- id: arcane-eye
  name: Магический глаз
  description: |-
    *4-й уровень, Прорицание (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (немного меха летучей мыши)
    **Длительность:** Концентрация, до 1 часа

    Вы создаёте невидимый и неуязвимый глаз в пределах дистанции, который парит в течение длительности. Вы мысленно получаете визуальную информацию от глаза, который видит во всех направлениях. Кроме того, у него есть Тёмное зрение на 30 футов.
    В качестве Бонусного действия вы можете переместить глаз на 30 футов в любом направлении. Сплошная преграда блокирует движение глаза, но глаз может пройти через отверстие диаметром всего 1 дюйм.
  properties:
    castingTime: Действие
    range: 30 футов
    material: немного меха летучей мыши
    duration: до 1 часа

- id: arcane-hand
  name: Магическая рука
  description: |-
    *5-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (яичная скорлупа и перчатка)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте Большую руку из мерцающей магической энергии в незанятом пространстве, которое видите в пределах дистанции. Рука существует в течение длительности и движется по вашей команде, повторяя движения вашей собственной руки.
    Рука является предметом с КБ 20 и количеством очков здоровья, равным вашему максимуму очков здоровья. Если она падает до 0 очков здоровья, заклинание заканчивается. Рука не занимает пространство.
    Когда вы сотворяете заклинание, а также в последующих своих ходах в качестве Бонусного действия, вы можете переместить руку на 60 футов, а затем вызвать один из следующих эффектов: Сжатый кулак. Рука наносит удар по цели в пределах 5 футов от неё. Совершите рукопашную атаку заклинанием. При попадании цель получает 5d8 урона силовым полем. Сильная рука. Рука пытается толкнуть существо размером не больше Огромного в пределах 5 футов от неё. Цель должна преуспеть в спасброске Силы, иначе рука отодвинет её на 5 футов плюс количество футов, равное пятикратному модификатору вашей характеристики заклинаний. Рука движется вместе с целью, оставаясь в пределах 5 футов от неё. Хватающая рука. Рука пытается схватить существо размером не больше Огромного в пределах 5 футов от неё. Цель должна преуспеть в спасброске Ловкости, иначе она получает состояние «Схваченный» со Сложностью побега, равной Сложности спасброска вашего заклинания. Пока рука удерживает цель, вы можете потратить Бонусное действие, чтобы рука сдавила её, нанеся цели дробящий урон, равный 4d6 плюс модификатор вашей характеристики заклинаний. Заслоняющая рука. Рука даёт вам полукрытие от атак и других эффектов, которые исходят из её пространства или проходят через него. Кроме того, её пространство считается труднопроходимой местностью для ваших врагов.

    **Использование ячейки более высокого уровня.** Урон Сжатого кулака увеличивается на 2d8, а урон Хватающей руки увеличивается на 2d6 за каждый уровень ячейки выше 5.
  properties:
    castingTime: Действие
    range: 120 футов
    material: яичная скорлупа и перчатка
    duration: до 1 минуты
    higherLevel: Урон Сжатого кулака увеличивается на 2d8, а урон Хватающей руки увеличивается на 2d6 за каждый уровень ячейки выше 5.

- id: arcane-lock
  name: Магический замок
  description: |-
    *2-й уровень, Ограждение (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М ((золотая пыль стоимостью 25+ зм, которую заклинание расходует)
    **Длительность:** До рассеивания

    Вы касаетесь закрытой двери, окна, ворот, контейнера или люка и магически запираете его на всё время действия. Этот замок нельзя открыть никакими немагическими способами. Вы и любые существа, которых вы укажете при сотворении заклинания, можете открывать и закрывать предмет, несмотря на замок. Вы также можете назначить пароль, который при произнесении в пределах 5 футов от предмета открывает его на 1 минуту.
  properties:
    castingTime: Действие
    range: Касание
    material: (золотая пыль стоимостью 25+ зм, которую заклинание расходует
    duration: До рассеивания

- id: arcane-sword
  name: Магический меч
  description: |-
    *7-й уровень, Воплощение (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С, М ((миниатюрный меч стоимостью 250+ зм)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте призрачный меч, который парит в пределах дистанции. Он существует в течение длительности.
    Когда меч появляется, вы совершаете рукопашную атаку заклинанием по цели в пределах 5 футов от меча. При попадании цель получает урон силовым полем, равный 4d12 плюс модификатор вашей характеристики заклинаний.
    В последующих своих ходах вы можете потратить Бонусное действие, чтобы переместить меч на 30 футов в место, которое видите, и повторить атаку по той же или другой цели.
  properties:
    castingTime: Действие
    range: 90 футов
    material: миниатюрный меч стоимостью 250+ зм
    duration: до 1 минуты

- id: arcanists-magic-aura
  name: Магическая аура арканиста
  description: |-
    *2-й уровень, Иллюзия (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (маленький квадрат шёлка)
    **Длительность:** 24 часа

    Прикосновением вы накладываете иллюзию на согласное существо или на предмет, который не надет и не несётся. Существо получает эффект «Маска», описанный ниже, а предмет получает эффект «Ложная аура», описанный ниже. Эффект длится в течение длительности. Если вы сотворяете заклинание на одну и ту же цель каждый день в течение 30 дней, иллюзия длится до рассеивания.
    Маска (существо). Выберите тип существа, отличный от реального типа цели. Заклинания и другие магические эффекты будут считать цель существом выбранного типа.
    Ложная аура (предмет). Вы меняете то, как цель выглядит для заклинаний и магических эффектов, которые обнаруживают магические ауры, например для Обнаружения магии. Вы можете сделать немагический предмет похожим на магический, сделать магический предмет немагическим или изменить ауру предмета так, чтобы она казалась принадлежащей школе магии, которую вы выберете.
  properties:
    castingTime: Действие
    range: Касание
    material: маленький квадрат шёлка
    duration: 24 часа

- id: astral-projection
  name: Астральная проекция
  description: |-
    *9-й уровень, Некромантия (Жрец, Колдун, Волшебник)*

    **Время сотворения:** 1 час
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (для каждой цели заклинания один гиацинт стоимостью 1,000+ зм и один серебряный слиток стоимостью 100+ зм; всё это заклинание расходует)
    **Длительность:** До рассеивания

    Вы и до восьми согласных существ в пределах дистанции проецируете свои астральные тела на Астральный план (заклинание немедленно заканчивается, если вы уже находитесь на этом плане). Тело каждой цели остаётся в состоянии оцепенения: оно получает состояние «Без сознания», не нуждается в пище и воздухе и не стареет.
    Астральная форма цели во многом похожа на её тело и повторяет его игровые характеристики и снаряжение. Главное отличие — серебристая нить, тянущаяся между лопатками астральной формы. Нить исчезает из виду через 1 фут. Если нить перерезана (что происходит, только когда эффект прямо это указывает), тело цели и её астральная форма погибают.
    Астральная форма цели может путешествовать по Астральному плану. Как только астральная форма покидает этот план, тело цели и её снаряжение перемещаются по серебряной нити, и цель возвращается в своё тело на новом плане.
    Любой урон или иные эффекты, применяемые к астральной форме, не действуют на тело цели, и наоборот. Если тело цели или её астральная форма падает до 0 очков здоровья, заклинание заканчивается для этой цели. Заклинание заканчивается для всех целей, если вы совершаете Магическое действие, чтобы его рассеять.
    Когда заклинание заканчивается для цели, которая не мертва, цель появляется в своём теле и выходит из состояния оцепенения.
  properties:
    castingTime: 1 час
    range: 10 футов
    material: для каждой цели заклинания один гиацинт стоимостью 1,000+ зм и один серебряный слиток стоимостью 100+ зм; всё это заклинание расходует
    duration: До рассеивания

- id: augury
  name: Знамение
  description: |-
    *2-й уровень, Прорицание (Жрец, Друид, Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С, М ((особым образом помеченные палочки, кости, карты или другие гадательные знаки стоимостью 25+ зм)
    **Длительность:** Мгновенная

    Вы получаете знамение от потустороннего существа о результатах действия, которое вы планируете совершить в течение следующих 30 минут. Мастер выбирает знамение из таблицы «Знамения». Знамения  Знамение    Для результатов, которые будут... Беда    Плохо  Благо и беда    Хорошо и плохо     Безразличие    Ни хорошо, ни плохо Заклинание не учитывает обстоятельства, например другие заклинания, которые могут изменить результаты.
    Если вы сотворяете заклинание более одного раза до окончания продолжительного отдыха, то после первого сотворения каждое последующее имеет накопительный шанс 25 процентов, что вы не получите ответа.
  properties:
    castingTime: 1 минута
    range: На себя
    material: (особым образом помеченные палочки, кости, карты или другие гадательные знаки стоимостью 25+ зм
    duration: Мгновенная

- id: aura-of-life
  name: Аура жизни
  description: |-
    *4-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Концентрация, до 10 минут

    Аура исходит от вас в виде 30-футовой эманации на время действия. Находясь в ауре, вы и ваши союзники получаете сопротивление урону некротической энергией, а максимумы ваших очков здоровья не могут быть уменьшены. Если союзник с 0 очков здоровья начинает свой ход в ауре, он восстанавливает 1 очко здоровья.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 10 минут

- id: awaken
  name: Пробуждение
  description: |-
    *5-й уровень, Преобразование (Бард, Друид)*

    **Время сотворения:** 8 часов
    **Дистанция:** Касание
    **Компоненты:** В, С, М (агат стоимостью 1,000+ зм, который заклинание расходует)
    **Длительность:** Мгновенная

    Вы тратите время сотворения, прослеживая магические пути внутри драгоценного камня, а затем касаетесь цели. Цель должна быть либо Зверем или существом типа Растение с Интеллектом 3 или меньше, либо природным растением, которое не является существом. Цель получает Интеллект 10 и способность говорить на одном языке, который вы знаете. Если цель — природное растение, оно становится существом типа Растение и получает способность двигать своими конечностями, корнями, лозами, плетями и так далее, а также чувства, похожие на человеческие. Мастер выбирает игровые характеристики, подходящие для пробуждённого растения, например характеристики Пробуждённого кустарника или Пробуждённого дерева из «Существ».
    Пробуждённая цель получает состояние «Очарованный» на 30 дней или до тех пор, пока вы или ваши союзники не нанесёте ей урон. Когда это состояние заканчивается, пробуждённое существо выбирает своё отношение к вам.
  properties:
    castingTime: 8 часов
    range: Касание
    material: агат стоимостью 1,000+ зм, который заклинание расходует
    duration: Мгновенная

- id: bane
  name: Порча
  description: |-
    *1-й уровень, Очарование (Бард, Жрец, Колдун)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (капля крови)
    **Длительность:** Концентрация, до 1 минуты

    До трёх существ по вашему выбору, которых вы видите в пределах дистанции, должны совершить спасбросок Харизмы. Всякий раз, когда цель, проваливающая этот спасбросок, совершает бросок атаки или спасбросок до окончания заклинания, она должна вычесть 1d4 из броска атаки или спасброска.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 1.
  properties:
    castingTime: Действие
    range: 30 футов
    material: капля крови
    duration: до 1 минуты
    higherLevel: Вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 1.

- id: banishment
  name: Изгнание
  description: |-
    *4-й уровень, Ограждение (Жрец, Паладин, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (пентакль)
    **Длительность:** Концентрация, до 1 минуты

    Одно существо, которое вы видите в пределах дистанции, должно преуспеть в спасброске Харизмы, иначе оно будет перенесено в безопасный демиплан на время действия заклинания. Пока оно там, цель получает состояние «Выведенный из строя». Когда заклинание заканчивается, цель появляется в пространстве, которое покинула, или в ближайшем свободном пространстве, если оно занято.
    Если цель — Аберрация, Небожитель, Элементаль, Фея или Исчадие, она не возвращается, если заклинание длится 1 минуту. Вместо этого она переносится в случайное место на плане (выбор Мастера), связанном с её типом существа.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 4.
  properties:
    castingTime: Действие
    range: 30 футов
    material: пентакль
    duration: до 1 минуты
    higherLevel: Вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 4.
- id: barkskin
  name: Кора древа
  description: |-
    *2-й уровень, Преобразование (Друид, Следопыт)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (горсть коры)
    **Длительность:** 1 час

    Вы касаетесь добровольно согласного существа. Пока заклинание действует, кожа цели приобретает вид коры, а её Класс Брони становится равным 17, если он ниже этого значения.
  properties:
    castingTime: Бонусное действие
    range: Касание
    material: горсть коры
    duration: 1 час
- id: beacon-of-hope
  name: Маяк надежды
  description: |-
    *3-й уровень, Ограждение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Выберите любое количество существ в пределах дистанции. На время действия заклинания каждая цель получает преимущество на спасброски Мудрости и спасброски от смерти, а также восстанавливает максимально возможное количество очков здоровья от любого исцеления.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты
- id: befuddlement
  name: Замешательство
  description: |-
    *8-й уровень, Очарование (Бард, Друид, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (связка ключей без ключей)
    **Длительность:** Мгновенная

    Вы поражаете разум существа, которое видите в пределах дистанции. Цель совершает спасбросок Интеллекта.
    При провале спасброска цель получает 10d12 урона психической энергией и не может сотворять заклинания или совершать действие Магия. В конце каждых 30 дней цель повторяет спасбросок, и при успехе эффект прекращается. Эффект также можно прекратить заклинаниями Высшее восстановление, Исцеление или Желание.
    При успешном спасброске цель получает только половину урона.
  properties:
    castingTime: Действие
    range: 150 футов
    material: связка ключей без ключей
    duration: Мгновенная
- id: bestow-curse
  name: Наложение проклятия
  description: |-
    *3-й уровень, Некромантия (Бард, Жрец, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы касаетесь существа, которое должно преуспеть в спасброске Мудрости, иначе оно будет проклято на время действия. Пока проклятие действует, цель испытывает один из следующих эффектов на ваш выбор: • Выберите одну характеристику. Цель совершает проверки и спасброски этой характеристики с помехой. • Цель совершает броски атаки против вас с помехой. • В бою цель должна преуспеть в спасброске Мудрости в начале каждого своего хода, иначе она вынуждена совершить действие Уклонение в этом ходу. • Если вы наносите цели урон броском атаки или заклинанием, цель получает дополнительно 1d8 урона некротической энергией.

    **Использование ячейки более высокого уровня.** Если вы сотворяете это заклинание, используя ячейку 4-го уровня, вы можете поддерживать Концентрацию на нём до 10 минут. Если вы используете ячейку 5-го уровня или выше, заклинание не требует Концентрации, а длительность становится 8 часов (ячейка 5–6 уровня) или 24 часа (ячейка 7–8 уровня). Если вы используете ячейку 9-го уровня, заклинание действует, пока его не рассеют.
  properties:
    castingTime: Действие
    range: Касание
    duration: до 1 минуты
    higherLevel: Если вы сотворяете это заклинание, используя ячейку 4-го уровня, вы можете поддерживать Концентрацию на нём до 10 минут. Если вы используете ячейку 5-го уровня или выше, заклинание не требует Концентрации, а длительность становится 8 часов (ячейка 5–6 уровня) или 24 часа (ячейка 7–8 уровня). Если вы используете ячейку 9-го уровня, заклинание действует, пока его не рассеют.
- id: black-tentacles
  name: Чёрные щупальца
  description: |-
    *4-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С, М (щупальце)
    **Длительность:** Концентрация, до 1 минуты

    Извивающиеся чёрные щупальца заполняют квадрат со стороной 20 футов на земле, которую вы видите в пределах дистанции. На время действия заклинания эти щупальца превращают землю в этой области в труднопроходимую местность.
    Каждое существо в этой области совершает спасбросок (Сила). При провале оно получает 3d6 урона дробящим уроном и получает состояние Опутанный до окончания заклинания. Существо также совершает этот спасбросок, если входит в область или заканчивает в ней ход. Существо совершает этот спасбросок только один раз за ход.
    Опутанное существо может совершить действие, чтобы проверить Силу (Атлетика) против Сложности спасброска вашего заклинания и прекратить состояние на себе при успехе.
  properties:
    castingTime: Действие
    range: 90 футов
    material: щупальце
    duration: до 1 минуты
- id: blade-barrier
  name: Клинковый барьер
  description: |-
    *6-й уровень, Воплощение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте стену из вращающихся клинков, сотканных из магической энергии. Стена появляется в пределах дистанции и существует всё время действия заклинания. Вы создаёте прямую стену длиной до 100 футов, высотой 20 футов и толщиной 5 футов, или кольцевую стену диаметром до 60 футов, высотой 20 футов и толщиной 5 футов. Стена даёт укрытие на три четверти, а её пространство является труднопроходимой местностью.
    Любое существо в пространстве стены совершает спасбросок Ловкости и получает 6d10 урона силовым полем при провале или половину урона при успехе. Существо также совершает этот спасбросок, если входит в пространство стены или заканчивает там ход. Существо совершает этот спасбросок только один раз за ход.
  properties:
    castingTime: Действие
    range: 90 футов
    duration: до 10 минут
- id: bless
  name: Благословение
  description: |-
    *1-й уровень, Очарование (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (священный символ стоимостью 5+ зм)
    **Длительность:** Концентрация, до 1 минуты

    Вы благословляете до трёх существ в пределах дистанции. Каждый раз, когда цель совершает бросок атаки или спасбросок до окончания заклинания, она добавляет к броску 1d4.

    **Использование ячейки более высокого уровня.** Вы можете благословить одно дополнительное существо за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: священный символ стоимостью 5+ зм
    duration: до 1 минуты
    higherLevel: Вы можете благословить одно дополнительное существо за каждый уровень ячейки выше 1-го.
- id: blight
  name: Иссушение
  description: |-
    *4-й уровень, Некромантия (Друид, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Существо, которое вы видите в пределах дистанции, совершает спасбросок Телосложения, получая 8d8 урона некротической энергией при провале или половину урона при успехе. Существо типа «растение» автоматически проваливает этот спасбросок.
    Или выберите немагическое растение, которое не является существом, например дерево или кустарник. Оно не совершает спасбросок; оно просто увядает и погибает.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
- id: blindness-deafness
  name: Слепота/глухота
  description: |-
    *2-й уровень, Преобразование (Бард, Жрец, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В
    **Длительность:** 1 минута

    Одно существо, которое вы видите в пределах дистанции, должно преуспеть в спасброске Телосложения, иначе оно получит состояние Ослеплённый или Оглохший (на ваш выбор) на время действия. В конце каждого своего хода цель повторяет спасбросок, при успехе прекращая заклинание на себе.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: 1 минута
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 2-го.
- id: blink
  name: Мерцание
  description: |-
    *3-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** 1 минута

    В конце каждого вашего хода в течение действия заклинания бросьте 1d6. При результате 4–6 вы исчезаете со своего текущего плана существования и появляетесь на Эфирном плане (если вы уже находитесь на этом плане, заклинание немедленно прекращается). Находясь на Эфирном плане, вы можете видеть покинутый план, который выглядит в оттенках серого, но не видите ничего дальше 60 футов. Вы можете воздействовать и подвергаться воздействию только других существ на Эфирном плане, а существа на другом плане не могут вас воспринимать, если у них нет особой способности, позволяющей воспринимать объекты на Эфирном плане.
    Вы возвращаетесь на другой план в начале своего следующего хода и когда заклинание заканчивается, если вы находитесь на Эфирном плане. Вы возвращаетесь в свободное пространство по вашему выбору, которое видите в пределах 10 футов от пространства, которое покинули. Если в пределах этого расстояния нет свободного пространства, вы появляетесь в ближайшем свободном пространстве.
  properties:
    castingTime: Действие
    range: На себя
    duration: 1 минута
- id: blur
  name: Размытость
  description: |-
    *2-й уровень, Иллюзия (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Концентрация, до 1 минуты

    Ваше тело становится размытым. На время действия заклинания любое существо совершает броски атаки против вас с помехой. Нападающий не подвергается этому эффекту, если воспринимает вас с помощью слепого зрения или истинного зрения.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 минуты
- id: burning-hands
  name: Огненные ладони
  description: |-
    *1-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Тонкая полоса пламени вырывается из ваших рук. Каждое существо в 15-футовом конусе совершает спасбросок Ловкости, получая 3d6 урона огнём при провале или половину урона при успехе.
    Легковоспламеняющиеся предметы в конусе, которые не надеты и не несутся, начинают гореть.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: На себя
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
- id: call-lightning
  name: Призыв молнии
  description: |-
    *3-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Грозовая туча появляется в точке в пределах дистанции, которую вы видите над собой. Она принимает форму Цилиндра высотой 10 футов и радиусом 60 футов.
    Когда вы сотворяете заклинание, выберите точку под тучей, которую видите. Из тучи к этой точке устремляется молния. Каждое существо в пределах 5 футов от этой точки совершает спасбросок Ловкости и получает 3d10 урона электричеством при провале или половину этого урона при успехе.
    Пока заклинание не закончилось, вы можете использовать Магическое действие, чтобы снова вызвать молнию таким же образом, нацелив её на ту же точку или на другую.
    Если вы находитесь на улице во время грозы, когда сотворяете это заклинание, оно даёт вам контроль над этой грозой вместо создания новой. В таких условиях урон заклинания увеличивается на 1d10.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 3-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 3-го.
- id: calm-emotions
  name: Успокоение эмоций
  description: |-
    *2-й уровень, Очарование (Бард, Жрец)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Каждый гуманоид в Сфере радиусом 20 футов с центром в точке по вашему выбору в пределах дистанции должен преуспеть в спасброске Харизмы или подвергнуться одному из следующих эффектов (выберите для каждого существа): • Существо получает иммунитет к состояниям «Очарованный» и «Испуганный» до окончания заклинания. Если существо уже было Очаровано или Испугано, эти состояния подавляются на время действия заклинания. • Существо становится безразличным к существам по вашему выбору, к которым оно враждебно. Это безразличие заканчивается, если цель получает урон или видит, как её союзники получают урон. Когда заклинание заканчивается, отношение существа возвращается к прежнему.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 минуты
- id: chain-lightning
  name: Цепная молния
  description: |-
    *6-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 150 футов  
    **Компоненты:** В, С, М (три серебряных булавки)  
    **Длительность:** Мгновенная

    Вы выпускаете молнию в цель, которую видите в пределах дистанции. Затем от этой цели отскакивают ещё три молнии к другим целям по вашему выбору, числом до трёх. Каждая из них должна находиться в пределах 30 футов от первой цели. Целью может быть существо или предмет, и одна и та же цель может быть поражена только одной из молний.
    Каждая цель совершает спасбросок Ловкости и получает 10d8 урона электричеством при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Ещё одна молния отскакивает от первой цели к другой цели за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: три серебряных булавки
    duration: Мгновенная
    higherLevel: Ещё одна молния отскакивает от первой цели к другой цели за каждый уровень ячейки выше 6-го.
- id: charm-monster
  name: Очарование чудовища
  description: |-
    *4-й уровень, Очарование (Бард, Друид, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С  
    **Длительность:** 1 час

    Одно существо, которое вы видите в пределах дистанции, совершает спасбросок Мудрости. Оно совершает его с преимуществом, если вы или ваши союзники сражаетесь с ним. При провале спасброска цель получает состояние «Очарованный» до окончания заклинания или пока вы или ваши союзники не нанесёте ей урон. Очарованное существо относится к вам дружелюбно. Когда заклинание заканчивается, цель узнаёт, что была очарована вами.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 1 час
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 4-го.
- id: charm-person
  name: Очарование личности
  description: |-
    *1-й уровень, Очарование (Бард, Друид, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С  
    **Длительность:** 1 час

    Один гуманоид, которого вы видите в пределах дистанции, совершает спасбросок Мудрости. Он совершает его с преимуществом, если вы или ваши союзники сражаетесь с ним. При провале спасброска цель получает состояние «Очарованный» до окончания заклинания или пока вы или ваши союзники не нанесёте ей урон. Очарованное существо относится к вам дружелюбно. Когда заклинание заканчивается, цель узнаёт, что была очарована вами.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 1 час
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
- id: chill-touch
  name: Леденящее прикосновение
  description: |-
    *Заговор Некромантии (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Призывая холод могилы, совершите рукопашную атаку заклинанием по цели в пределах досягаемости. При попадании цель получает 1d10 урона некротической энергией и не может восстанавливать очки здоровья до конца вашего следующего хода.
    Улучшение заговора. Урон увеличивается на 1d10, когда вы достигаете 5-го (2d10), 11-го (3d10) и 17-го (4d10) уровня.
  properties:
    castingTime: Действие
    range: Касание
    duration: Мгновенная
- id: chromatic-orb
  name: Хроматическая сфера
  description: |-
    *1-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 90 футов  
    **Компоненты:** В, С, М (алмаз стоимостью 50+ зм)  
    **Длительность:** Мгновенная

    Вы бросаете сферу энергии в цель в пределах дистанции. Выберите тип создаваемой сферы: кислотный, холодный, огненный, электрический, ядовитый или звуковой, а затем совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 3d8 урона выбранного типа.
    Если на двух или более 8-гранных кубиках выпадает одинаковое число, сфера перескакивает на другую цель по вашему выбору в пределах 30 футов от первой. Совершите бросок атаки по новой цели и новый бросок урона. Сфера не может перескочить снова, если только вы не сотворили заклинание ячейкой 2+ уровня.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го. Сфера может перескакивать максимальное число раз, равное уровню потраченной ячейки, и каждое существо может быть выбрано целью этого заклинания только один раз за каждое его сотворение.
  properties:
    castingTime: Действие
    range: 90 футов
    material: алмаз стоимостью 50+ зм
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го. Сфера может перескакивать максимальное число раз, равное уровню потраченной ячейки, и каждое существо может быть выбрано целью этого заклинания только один раз за каждое его сотворение.
- id: circle-of-death
  name: Круг смерти
  description: |-
    *6-й уровень, Некромантия (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 150 футов  
    **Компоненты:** В, С, М (порошок из раздавленной чёрной жемчужины стоимостью 500+ зм)  
    **Длительность:** Мгновенная

    Негативная энергия расходится волной в Сфере радиусом 60 футов от точки по вашему выбору в пределах дистанции. Каждое существо в этой области совершает спасбросок Телосложения и получает 8d8 урона некротической энергией при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 2d8 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: порошок из раздавленной чёрной жемчужины стоимостью 500+ зм
    duration: Мгновенная
    higherLevel: Урон увеличивается на 2d8 за каждый уровень ячейки выше 6-го.
- id: clairvoyance
  name: Ясновидение
  description: |-
    *3-й уровень, Прорицание (Бард, Жрец, Чародей, Волшебник)*

    **Время сотворения:** 10 минут  
    **Дистанция:** 1 миля  
    **Компоненты:** В, С, М (фокусировка стоимостью 100+ зм, либо украшенный самоцветами рог для слуха, либо стеклянный глаз для зрения)  
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте Невидимый датчик в пределах дистанции в месте, знакомом вам (где вы бывали или видели его раньше), или в очевидном месте, которое вам незнакомо (например, за дверью, за углом или в роще деревьев). Нематериальный и неуязвимый датчик остаётся на месте в течение всей длительности.
    Когда вы сотворяете заклинание, выберите зрение или слух. Вы можете использовать выбранное чувство через датчик так, будто находитесь в его пространстве. Как Бонусное действие вы можете переключаться между зрением и слухом.
    Существо, которое видит датчик (например, существо, использующее Видение невидимого или Истинное зрение), видит светящуюся сферу размером с ваш кулак.
  properties:
    castingTime: 10 минут
    range: 1 миля
    material: фокусировка стоимостью 100+ зм (либо украшенный самоцветами рог для слуха, либо стеклянный глаз для зрения)
    duration: до 10 минут
- id: clone
  name: Клон
  description: |-
    *8-й уровень, Некромантия (Волшебник)*

    **Время сотворения:** 1 час  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (алмаз стоимостью 1,000+ зм, который заклинание поглощает, и герметичный сосуд стоимостью 2,000+ зм, достаточно большой, чтобы вместить клонируемое существо)  
    **Длительность:** Мгновенная

    Вы касаетесь существа или хотя бы 1 кубического дюйма его плоти. Внутри сосуда, использованного при сотворении заклинания, формируется неактивный двойник этого существа, который завершает рост через 120 дней. Вы выбираете, будет ли готовый клон того же возраста, что и существо, или моложе. Клон остаётся неактивным и сохраняется неограниченно долго, пока сосуд не потревожен.
    Если исходное существо умирает после того, как клон сформировался, душа существа переходит в клон, если она свободна и готова вернуться. Клон физически идентичен оригиналу и обладает теми же личностью, воспоминаниями и способностями, но не имеет снаряжения оригинала. Останки оригинала, если они есть, становятся неактивными и не могут быть оживлены, так как душа существа находится в другом месте.
  properties:
    castingTime: 1 час
    range: Касание
    material: алмаз стоимостью 1,000+ зм, который заклинание поглощает, и герметичный сосуд стоимостью 2,000+ зм, достаточно большой, чтобы вместить клонируемое существо
    duration: Мгновенная
- id: cloudkill
  name: Облако смерти
  description: |-
    *5-й уровень, Вызов (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте Сферу из жёлто-зелёного тумана радиусом 20 футов с центром в точке в пределах дистанции. Туман длится в течение длительности или до тех пор, пока сильный ветер (например, создаваемый заклинанием Порыв ветра) не рассеет его, что завершит заклинание. Область тумана считается сильно затемнённой.
    Каждое существо в Сфере совершает спасбросок Телосложения и получает 5d8 урона ядом при провале или половину этого урона при успехе. Существо также должно совершить этот спасбросок, когда Сфера переместится в его пространство, а также когда оно входит в Сферу или заканчивает там свой ход. Существо совершает этот спасбросок только один раз за ход.
    Сфера отодвигается от вас на 10 футов в начале каждого вашего хода.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 10 минут
    damageType: яд
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го.
- id: color-spray
  name: Цветные брызги
  description: |-
    *1-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (щепотка красочного песка)  
    **Длительность:** Мгновенная

    Вы выпускаете ослепительный массив мигающего разноцветного света. Каждое существо в Конусе длиной 15 футов, исходящем от вас, должно преуспеть в спасброске Телосложения или получить состояние «Ослеплённый» до конца вашего следующего хода.
  properties:
    castingTime: Действие
    range: На себя
    material: щепотка красочного песка
    duration: Мгновенная
- id: command
  name: Приказ
  description: |-
    *1-й уровень, Очарование (Бард, Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    Вы произносите одно слово-команду существу, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе она выполнит команду в свой следующий ход. Выберите команду из следующих вариантов. Подойти. Цель движется к вам по кратчайшему и самому прямому пути и завершает свой ход, если окажется в пределах 5 футов от вас. Бросить. Цель роняет всё, что держит, и затем завершает свой ход. Бежать. Цель тратит свой ход на то, чтобы как можно быстрее удалиться от вас доступными ей способами. Пасть ниц. Цель получает состояние «Лежащий ничком» и затем завершает свой ход. Стоять. В свой ход цель не двигается и не совершает ни действия, ни бонусного действия.

    **Использование ячейки более высокого уровня.** Вы можете затронуть одно дополнительное существо за каждый уровень ячейки заклинаний выше 1.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
    higherLevel: Вы можете затронуть одно дополнительное существо за каждый уровень ячейки заклинаний выше 1.

- id: commune
  name: Связь с божеством
  description: |-
    *5-й уровень, Прорицание (Жрец)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С, М (благовония)
    **Длительность:** 1 минута

    Вы связываетесь с божеством или его божественным посредником и задаёте до трёх вопросов, на которые можно ответить «да» или «нет». Вопросы нужно задать до окончания заклинания. Вы получаете верный ответ на каждый вопрос.
    Божественные существа не обязательно всеведущи, поэтому вы можете получить ответ «неясно», если вопрос касается сведений, лежащих за пределами знаний божества. Если однословный ответ может ввести в заблуждение или противоречить интересам божества, Мастер может дать короткую фразу в качестве ответа.
    Если вы сотворяете это заклинание более одного раза до окончания продолжительного отдыха, то с каждым последующим сотворением после первого появляется накопительный шанс 25 процентов, что вы не получите ответа.
  properties:
    castingTime: 1 минута
    range: На себя
    material: благовония
    duration: 1 минута

- id: commune-with-nature
  name: Общение с природой
  description: |-
    *5-й уровень, Прорицание (Друид, Следопыт)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы общаетесь с духами природы и узнаёте об окружающей местности. На открытом воздухе заклинание даёт вам знания о местности в радиусе 3 мили от вас. В пещерах и других естественных подземных местах радиус ограничен 300 футами. Заклинание не действует там, где природа заменена постройками, например в замках и поселениях.
    Выберите три из следующих сведений; вы узнаёте их применительно к области действия заклинания: • Расположение поселений • Расположение порталов в другие планы существования • Расположение одного существа с показателем опасности 10+ (выбор Мастера), которое является небожителем, элементалем, феей, исчадием или нежитью • Самый распространённый вид растений, минералов или зверей (вы выбираете, что узнать) • Расположение водоёмов. Например, вы можете определить местонахождение могущественного монстра в области, расположение водоёмов и расположение любых городов.
  properties:
    castingTime: 1 минута
    range: На себя
    duration: Мгновенная

- id: comprehend-languages
  name: Понимание языков
  description: |-
    *1-й уровень, Прорицание (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С, М (щепотка сажи и соли)
    **Длительность:** 1 час

    На протяжении действия заклинания вы понимаете буквальный смысл любого языка, который слышите, и любого жестового языка, который видите. Вы также понимаете любой письменный язык, который видите, но для этого нужно касаться поверхности, на которой написаны слова. На чтение одной страницы текста уходит около 1 минуты. Это заклинание не расшифровывает символы или тайные послания.
  properties:
    castingTime: Действие
    range: На себя
    material: щепотка сажи и соли
    duration: 1 час

- id: compulsion
  name: Принуждение
  description: |-
    *4-й уровень, Очарование (Бард)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Каждое существо по вашему выбору, которое вы видите в пределах дистанции, должно преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» до окончания заклинания.
    На протяжении действия заклинания вы можете использовать бонусное действие, чтобы указать направление, горизонтальное относительно вас. Каждая очарованная цель должна использовать как можно больше своего перемещения, чтобы двигаться в этом направлении в свой следующий ход, выбирая самый безопасный путь. После такого перемещения цель повторяет спасбросок и при успехе завершает действие заклинания для себя.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты

- id: cone-of-cold
  name: Конус холода
  description: |-
    *5-й уровень, Воплощение (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (маленький кристалл или стеклянный конус)
    **Длительность:** Мгновенная

    Вы высвобождаете поток ледяного воздуха. Каждое существо в конусе длиной 60 футов, исходящем из вас, совершает спасбросок Телосложения и получает 8d8 урона холодом при провале или половину этого урона при успехе. Существо, убитое этим заклинанием, превращается в замёрзшую статую, пока не оттает.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 5.
  properties:
    castingTime: Действие
    range: На себя
    material: маленький кристалл или стеклянный конус
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинания выше 5.

- id: confusion
  name: Смятение
  description: |-
    *4-й уровень, Очарование (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С, М (три ореховые скорлупки)
    **Длительность:** До 1 минуты

    Каждое существо в сфере радиусом 10 футов с центром в точке по вашему выбору в пределах дистанции должно преуспеть в спасброске Мудрости, иначе эта цель не может совершать бонусные действия и реакции и должна в начале каждого своего хода бросить 1d10, чтобы определить своё поведение на этот ход, сверяясь с таблицей ниже. 1d10 Поведение на ход 2-6    Цель не двигается и не совершает действий. 9-10  Цель сама выбирает своё поведение.
    В конце каждого своего хода затронутая цель повторяет спасбросок и при успехе завершает заклинание для себя.

    **Использование ячейки более высокого уровня.** Радиус сферы увеличивается на 5 футов за каждый уровень ячейки заклинаний выше 4.
  properties:
    castingTime: Действие
    range: 90 футов
    material: три ореховые скорлупки
    duration: до 1 минуты
    higherLevel: Радиус сферы увеличивается на 5 футов за каждый уровень ячейки заклинания выше 4.

- id: conjure-animals
  name: Призыв зверей
  description: |-
    *3-й уровень, Вызов (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов природы, которые появляются в виде большой стаи призрачных бестелесных животных в незанятом пространстве, которое видите в пределах дистанции. Стая существует в течение длительности, а вид животных, например волков, змей или птиц, выбираете вы.
    Вы совершаете спасброски Силы с преимуществом, находясь в пределах 5 футов от стаи, а когда двигаетесь в свой ход, можете также переместить стаю на 30 футов в незанятое пространство, которое видите. Каждый раз, когда стая перемещается в пределах 10 футов от существа, которое вы видите, и каждый раз, когда существо, которое вы видите, входит в пространство в пределах 10 футов от стаи или заканчивает там свой ход, вы можете заставить это существо совершить спасбросок Ловкости. При провале существо получает 3d10 урона рубящим. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки заклинаний выше 3.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки заклинания выше 3.

- id: conjure-celestial
  name: Призыв небожителя
  description: |-
    *7-й уровень, Вызов (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете дух из Верхних планов, который проявляется как столп света в цилиндре радиусом 10 футов и высотой 40 футов с центром в точке в пределах дистанции. Для каждого существа, которое вы видите в цилиндре, выберите, какой из этих светов на него будет светить: Целительный свет. Цель восстанавливает очки здоровья, равные 4d12 плюс ваш модификатор характеристики заклинаний. Испепеляющий свет. Цель совершает спасбросок Ловкости и получает 6d12 урона излучением при провале или половину этого урона при успехе. Пока заклинание действует, в цилиндре горит яркий свет, а когда вы двигаетесь в свой ход, можете также переместить цилиндр на 30 футов.
    Каждый раз, когда цилиндр перемещается в пространство существа, которое вы видите, и каждый раз, когда существо, которое вы видите, входит в цилиндр или заканчивает там свой ход, вы можете озарить его одним из светов. Существо может быть затронуто этим заклинанием только один раз за ход.

    **Использование ячейки более высокого уровня.** Исцеление и урон увеличиваются на 1d12 за каждый уровень ячейки заклинаний выше 7.
  properties:
    castingTime: Действие
    range: 90 футов
    duration: до 10 минут
    higherLevel: Исцеление и урон увеличиваются на 1d12 за каждый уровень ячейки заклинания выше 7.

- id: conjure-elemental
  name: Призыв элементаля
  description: |-
    *5-й уровень, Вызов (Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете Большой бестелесный дух из Элементальных планов, который появляется в незанятом пространстве в пределах дистанции. Выберите стихию духа, которая определяет его тип урона: воздух (электричество), земля (звук), огонь (огонь) или вода (холод). Дух существует в течение длительности.
    Каждый раз, когда существо, которое вы видите, входит в пространство духа или начинает свой ход в пределах 5 футов от духа, вы можете заставить это существо совершить спасбросок Ловкости, если дух ещё никого не опутал. При провале существо получает 8d8 урона стихией духа и получает состояние «Опутанный» до окончания заклинания. В начале каждого своего хода опутанная цель повторяет спасбросок. При провале она получает 4d8 урона стихией духа. При успехе цель больше не опутана духом.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 5.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинания выше 5.

- id: conjure-fey
  name: Призыв фей
  description: |-
    *6-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете Средний дух из Страны фей в незанятом пространстве, которое видите в пределах дистанции. Дух существует в течение длительности и выглядит как фея по вашему выбору. Когда дух появляется, вы можете совершить одну ближнюю атаку заклинанием по существу в пределах 5 футов от него. При попадании цель получает урон психической энергией, равный 3d12 плюс ваш модификатор характеристики заклинаний, и получает состояние «Испуганный» до начала вашего следующего хода, причём источником страха являетесь и вы, и дух.
    В свои последующие ходы вы можете использовать бонусное действие, чтобы телепортировать дух в незанятое пространство, которое видите в пределах 30 футов от пространства, которое дух покинул, и совершить атаку по существу в пределах 5 футов от него.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d12 за каждый уровень ячейки заклинаний выше 6.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d12 за каждый уровень ячейки заклинания выше 6.

- id: conjure-minor-elementals
  name: Призыв малых элементалей
  description: |-
    *4-й уровень, Вызов (Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов из Элементальных планов, которые кружат вокруг вас в эманации радиусом 15 футов на протяжении длительности. Пока заклинание действует, любая ваша атака наносит дополнительные 2d8 урона, когда вы попадаете по существу в эманации. Тип этого урона — кислотный, холодный, огненный или электрический (на ваш выбор в момент атаки).
    Кроме того, земля в эманации является труднопроходимой местностью для ваших врагов.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 4.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинания выше 4.
- id: conjure-woodland-beings
  name: Призыв лесных существ
  description: |-
    *4-й уровень, Вызов (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов природы, которые кружат вокруг вас в 10-футовой эманации на протяжении действия заклинания. Каждый раз, когда эманация входит в пространство видимого вам существа, а также когда видимое вам существо входит в эманацию или заканчивает там свой ход, вы можете заставить его совершить спасбросок Мудрости. Существо получает 5d8 урона силовым полем при провале или вдвое меньше урона при успехе. Существо совершает этот спасбросок только один раз за ход.
    Кроме того, вы можете совершить действие Отход как Бонусное действие на протяжении действия заклинания.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 4-го.
  properties:
    castingTime: Действие
    range: На себя
    duration: До 10 минут
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 4-го.

- id: contact-other-plane
  name: Связь с иным планом
  description: |-
    *5-й уровень, Прорицание (Колдун, Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** 1 минута

    Вы мысленно связываетесь с полубогом, духом давно умершего мудреца или другой осведомлённой сущностью из иного плана. Общение с этим потусторонним разумом может повредить ваш разум. Когда вы сотворяете это заклинание, совершите спасбросок Интеллекта со Сложностью 15. При успехе вы можете задать сущности до пяти вопросов. Вопросы нужно задать до окончания заклинания. Мастер отвечает на каждый вопрос одним словом, например «да», «нет», «возможно», «никогда», «неважно» или «неясно» (если сущность не знает ответа на вопрос). Если однословный ответ мог бы ввести в заблуждение, Мастер может вместо этого дать короткую фразу в качестве ответа.
    При провале вы получаете 6d6 урона психической энергией и получаете состояние Выведенный из строя до окончания продолжительного отдыха. Заклинание Высшее восстановление, наложенное на вас, прекращает этот эффект.
  properties:
    castingTime: 1 минута
    range: На себя
    duration: 1 минута

- id: contagion
  name: Зараза
  description: |-
    *5-й уровень, Некромантия (Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** Касание Компоненты: В, С
    **Компоненты:**
    **Длительность:** 7 дней

    Ваше касание вызывает магическую заразу. Цель должна преуспеть в спасброске Телосложения, иначе она получит 11d8 урона некротической энергией и состояние Отравленный. Также выберите одну характеристику при сотворении заклинания. Пока цель отравлена, она совершает спасброски с выбранной характеристикой с помехой.
    Цель должна повторять спасбросок в конце каждого своего хода, пока не получит три успеха или три провала. Если цель преуспеет в трёх таких спасбросках, заклинание прекращается для неё. Если цель провалит три спасброска, заклинание действует на неё 7 дней.
    Каждый раз, когда отравленная цель получает эффект, который должен прекратить состояние Отравленный, цель должна преуспеть в спасброске Телосложения, иначе состояние Отравленный на ней не заканчивается.
  properties:
    castingTime: Действие
    range: "Касание Компоненты: В, С"
    duration: 7 дней

- id: contingency
  name: Условие
  description: |-
    *6-й уровень, Ограждение (Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** На себя
    **Компоненты:** В, С, М (статуэтка вас, инкрустированная самоцветами, стоимостью 1,500+ зм)
    **Длительность:** 10 дней

    Выберите заклинание 5-го уровня или ниже, которое вы можете сотворить, у которого время сотворения — действие и которое может нацеливаться на вас. Вы сотворяете это заклинание — называемое условным заклинанием — как часть сотворения Условия, потратив ячейки заклинаний за оба, но условное заклинание не вступает в силу. Вместо этого оно начнёт действовать, когда произойдёт определённый триггер. Вы описываете этот триггер при сотворении обоих заклинаний. Например, Условие, сотворённое с Дыханием под водой, может предусматривать, что Дыхание под водой вступает в силу, когда вы оказываетесь в воде или подобной жидкости.
    Условное заклинание вступает в силу сразу после первого срабатывания триггера, независимо от того, хотите вы этого или нет, после чего Условие заканчивается.
    Условное заклинание действует только на вас, даже если обычно может нацеливаться на других. Одновременно может действовать только одно заклинание Условия. Если вы сотворите это заклинание снова, эффект другого заклинания Условия на вас заканчивается. Кроме того, Условие на вас заканчивается, если его материальный компонент когда-либо окажется не при вас.
  properties:
    castingTime: 10 минут
    range: На себя
    material: статуэтка вас, инкрустированная самоцветами, стоимостью 1,500+ зм
    duration: 10 дней

- id: continual-flame
  name: Вечное пламя
  description: |-
    *2-й уровень, Воплощение (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (рубиновая пыль стоимостью 50+ зм, которую заклинание поглощает)
    **Длительность:** До рассеивания

    Пламя возникает из предмета, которого вы касаетесь. Эффект создаёт Яркий свет в радиусе 20 футов и тусклый свет на расстоянии ещё 20 футов. Оно выглядит как обычное пламя, но не выделяет тепла и не расходует топлива. Пламя можно накрыть или спрятать, но нельзя задушить или погасить.
  properties:
    castingTime: Действие
    range: Касание
    material: рубиновая пыль стоимостью 50+ зм, которую заклинание поглощает
    duration: До рассеивания

- id: control-water
  name: Управление водой
  description: |-
    *4-й уровень, Преобразование (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 300 футов
    **Компоненты:** В, С, М (смесь воды и пыли)
    **Длительность:** Концентрация, до 10 минут

    Пока заклинание действует, вы управляете любой водой внутри выбранной вами области в виде Куба размером до 100 футов по стороне, используя один из следующих эффектов. Как Магическое действие в свои последующие ходы вы можете повторить тот же эффект или выбрать другой.
    Наводнение. Вы заставляете уровень воды всех стоячих водоёмов в области подняться на 20 футов. Если вы выбираете область в большом водоёме, вы вместо этого создаёте 20-футовую волну, которая проходит от одного края области до другого и затем обрушивается. Любые Огромные или меньшие транспортные средства на пути волны переносятся ею на другую сторону. Любые Огромные или меньшие транспортные средства, задетые волной, имеют шанс 25 процентов перевернуться.
    Уровень воды остаётся повышенным до окончания заклинания или пока вы не выберете другой эффект. Если этот эффект создал волну, волна повторяется в начале вашего следующего хода, пока действует эффект наводнения.
    Разделение воды. Вы разделяете воду в области и создаёте канаву. Канава тянется через всю область заклинания, а разделённая вода образует стену по обеим сторонам. Канава остаётся до окончания заклинания или пока вы не выберете другой эффект. Затем вода медленно заполняет канаву в течение следующего раунда, пока не восстановится обычный уровень воды. условия, чтобы вступить в силу. Как только они это сделают, вы можете снова изменить условия. Когда заклинание заканчивается, погода постепенно возвращается к норме.
    Когда вы меняете погодные условия, найдите текущее условие в следующих таблицах и измените его стадию на одну вверх или вниз. Меняя ветер, вы можете изменить его направление. Стадия осадков | Состояние
    1 | Ясно | 2 | Лёгкие облака
    3 | Пасмурно или туман у земли | 4 | Дождь, град или снег
    5 | Проливной дождь, сильный град или метель
    Перенаправление потока. Вы заставляете текущую воду в области двигаться в направлении, которое вы выбираете, даже если вода должна течь через препятствия, вверх по стенам или в других маловероятных направлениях. Вода в области движется, как вы направили, но, выйдя за пределы области заклинания, возвращается к течению по рельефу. Вода продолжает двигаться в выбранном направлении до окончания заклинания или пока вы не выберете другой эффект.
    Водоворот. Вы создаёте водоворот в центре области, который должен быть не меньше 50 футов. Стадия температуры | Состояние
    1 | Волна жары | 2 | Жарко
    3 | Тепло | 4 | Прохладно
    5 | Холодно | 6 | Морозно Контрзаклинание Стадия ветра Состояние
    10 | Штиль | 2 | Умеренный ветер
    3 | Сильный ветер | 4 | Шквал
    5 | Шторм    квадрат и глубиной 25 футов. Водоворот сохраняется до тех пор, пока вы не выберете другой эффект или заклинание не закончится. Водоворот имеет ширину 5 футов у основания, до 50 футов вверху и высоту 25 футов. Любое существо в воде и в пределах 25 футов от водоворота притягивается на 10 футов к нему. Когда существо входит в водоворот впервые за ход или заканчивает там свой ход, оно совершает спасбросок по характеристике Сила. При провале существо получает 2d8 дробящего урона. При успехе существо получает половину этого урона. Существо может выплыть из водоворота, только если сначала совершит действие, чтобы вырваться, и преуспеет в проверке Силы (Атлетика) против Сложности спасброска ваших заклинаний.
  properties:
    castingTime: Действие
    range: 300 футов
    material: смесь воды и пыли
    duration: До 10 минут

- id: control-weather
  name: Управление погодой
  description: |-
    *8-й уровень, Преобразование (Жрец, Друид, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** На себя
    **Компоненты:** В, С, М (горящие благовония)
    **Длительность:** Концентрация, до 8 часов

    Вы берёте под контроль погоду в радиусе 5 миль от себя на время действия. Вы должны находиться на открытом воздухе, чтобы сотворить это заклинание, и оно заканчивается раньше, если вы войдёте внутрь помещения.
    Когда вы сотворяете заклинание, вы меняете текущие погодные условия, которые определяет Мастер. Вы можете менять осадки, температуру и ветер. Нужно 1d4 × 10 минут, чтобы новые
  properties:
    castingTime: 10 минут
    range: На себя
    material: горящие благовония
    duration: До 8 часов

- id: counterspell
  name: Контрзаклинание
  description: |-
    *3-й уровень, Ограждение (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Реакция, которую вы совершаете, когда видите существо в пределах 60 футов от себя, сотворяющее заклинание с вербальными, соматическими или материальными компонентами
    **Дистанция:** 60 футов
    **Компоненты:** С
    **Длительность:** Мгновенная

    Вы пытаетесь прервать существо в процессе сотворения заклинания. Существо совершает спасбросок Телосложения. При провале заклинание рассеивается без эффекта, а действие, Бонусное действие или Реакция, потраченные на его сотворение, тратятся впустую. Если это заклинание было сотворено с использованием ячейки заклинаний, ячейка не расходуется.
  properties:
    castingTime: Реакция, которую вы совершаете, когда видите существо в пределах 60 футов от себя, сотворяющее заклинание с вербальными, соматическими или материальными компонентами
    range: 60 футов
    duration: Мгновенная

- id: create-food-and-water
  name: Создание пищи и воды
  description: |-
    *3-й уровень, Вызов (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы создаёте 45 фунтов пищи и 30 галлонов свежей воды на земле или в ёмкостях в пределах дистанции — и то и другое полезно для защиты от опасностей голода и обезвоживания. Пища безвкусна, но питательна и выглядит как пища на ваш выбор, а вода чистая. Пища портится через 24 часа, если её не съели.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: Мгновенная

- id: create-or-destroy-water
  name: Создание или уничтожение воды
  description: |-
    *1-й уровень, Преобразование (Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (смесь воды и песка)
    **Длительность:** Мгновенная

    Вы делаете одно из следующего. Создание воды. Вы создаёте до 10 галлонов чистой воды в пределах дистанции в открытом сосуде. Либо вода падает дождём в Куб размером 30 футов в пределах дистанции, гася открытое пламя там. Уничтожение воды. Вы уничтожаете до 10 галлонов воды в открытом сосуде в пределах дистанции. Либо вы уничтожаете туман в Кубе размером 30 футов в пределах дистанции.

    **Использование ячейки более высокого уровня.** Вы создаёте или уничтожаете 10 дополнительных галлонов воды либо размер Куба увеличивается на 5 футов за каждый уровень ячейки заклинаний выше 1-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: смесь воды и песка
    duration: Мгновенная
    higherLevel: Вы создаёте или уничтожаете 10 дополнительных галлонов воды либо размер Куба увеличивается на 5 футов за каждый уровень ячейки заклинаний выше 1-го.

- id: create-undead
  name: Создание нежити
  description: |-
    *6-й уровень, Некромантия (Жрец, Колдун, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (один чёрный оникс стоимостью 150+ зм на каждый труп)
    **Длительность:** Мгновенная

    Вы можете сотворить это заклинание только ночью. Выберите до трёх трупов Средних или Маленьких гуманоидов в пределах дистанции. Каждый из них становится Гулем под вашим контролем (см. «Монстры» для его блока характеристик).
    Каждый ваш ход в качестве Бонусного действия вы можете мысленно приказать любому существу, которое вы подняли этим заклинанием, если оно находится в пределах 120 футов от вас (если вы контролируете несколько существ, вы можете приказать любому из них одновременно, отдав им одну и ту же команду). Вы решаете, какое действие существо совершит и куда переместится в свой следующий ход, или можете отдать общий приказ, например охранять определённое место. Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Получив приказ, существо продолжает выполнять его, пока задача не будет выполнена.
    Существо находится под вашим контролем 24 часа, после чего перестаёт подчиняться любым приказам, которые вы ему отдали. Чтобы сохранить контроль над существом ещё на 24 часа, вы должны сотворить это заклинание на него до окончания текущего 24-часового периода. Такое использование заклинания восстанавливает ваш контроль над существами, которых вы подняли этим заклинанием, до трёх, вместо того чтобы поднимать новых.

    **Использование ячейки более высокого уровня.** Если вы используете ячейку 7-го уровня, вы можете поднять или восстановить контроль над четырьмя гулями. Если вы используете ячейку 8-го уровня, вы можете поднять или восстановить контроль над пятью гулями или двумя гастами либо вайтами. Если вы используете ячейку 9-го уровня, вы можете поднять или восстановить контроль над шестью гулями, тремя гастами или вайтами либо двумя мумиями. См. «Монстры» для этих блоков характеристик.
  properties:
    castingTime: 1 минута
    range: 10 футов
    material: один чёрный оникс стоимостью 150+ зм на каждый труп
    duration: Мгновенная
    higherLevel: Если вы используете ячейку 7-го уровня, вы можете поднять или восстановить контроль над четырьмя гулями. Если вы используете ячейку 8-го уровня, вы можете поднять или восстановить контроль над пятью гулями или двумя гастами либо вайтами. Если вы используете ячейку 9-го уровня, вы можете поднять или восстановить контроль над шестью гулями, тремя гастами или вайтами либо двумя мумиями. См. «Монстры» для этих блоков характеристик.

- id: creation
  name: Творение
  description: |-
    *5-й уровень, Иллюзия (Чародей, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (кисть художника)
    **Длительность:** Особая

    Вы вытягиваете клочья теневой материи из Теневого плана, чтобы создать предмет в пределах дистанции. Это либо предмет из растительного вещества (мягкие ткани, верёвка, дерево и тому подобное), либо из минерального (камень, кристалл, металл и тому подобное). Предмет не может быть больше Куба размером 5 футов, и он должен иметь форму и материал, которые вы видели.
    Длительность заклинания зависит от материала предмета, как показано в таблице «Материалы». Если предмет состоит из нескольких материалов, используйте наименьшую длительность. Использование любого предмета, созданного этим заклинанием, в качестве Материального компонента другого заклинания приводит к провалу того заклинания. Материалы Материал    Длительность Камень или кристалл    12 часов Самоцветы    10 минут  Адамантин или мифрил    1 минута

    **Использование ячейки более высокого уровня.** Куб увеличивается на 5 футов за каждый уровень ячейки заклинаний выше 5-го.
  properties:
    castingTime: 1 минута
    range: 30 футов
    material: кисть художника
    duration: Особая
    higherLevel: Куб увеличивается на 5 футов за каждый уровень ячейки заклинаний выше 5-го.
- id: cure-wounds
  name: Лечение ран
  description: |-
    *1-й уровень, Ограждение (Бард, Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Существо, которого вы касаетесь, восстанавливает количество очков здоровья, равное 2d8 плюс модификатор вашей характеристики заклинаний. Использование ячейки более высокого уровня. Исцеление увеличивается на 2d8 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: Касание
    duration: Мгновенная
- id: dancing-lights
  name: Пляшущие огоньки
  description: |-
    *Заговор Иллюзии (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** V, S, M (щепотка фосфора)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте до четырёх светящихся огоньков размером с факел в пределах дистанции. Они выглядят как факелы, фонари или светящиеся шары, которые парят в воздухе на время действия заклинания. Кроме того, вы можете объединить четыре огонька в один светящийся силуэт Средней величины, отдалённо похожий на гуманоида. Какую бы форму вы ни выбрали, каждый огонёк испускает тусклый свет в радиусе 10 футов.
    Бонусным действием вы можете переместить огоньки на расстояние до 60 футов в пространство в пределах дистанции. Огонёк должен находиться в 20 футах от другого огонька, созданного этим заклинанием, а огонёк исчезает, если выходит за пределы дистанции заклинания.
  properties:
    castingTime: Действие
    range: 120 футов
    material: щепотка фосфора
    duration: до 1 минуты
- id: darkness
  name: Тьма
  description: |-
    *2-й уровень, Воплощение (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, M (шерсть летучей мыши и кусочек угля)
    **Длительность:** Концентрация, до 10 минут

    На время действия заклинания из точки в пределах дистанции распространяется магическая Тьма и заполняет сферу радиусом 15 футов. Тёмное зрение не позволяет видеть сквозь неё, а немагический свет не может её осветить.
    Кроме того, вы можете наложить заклинание на предмет, который не надет и не несётся, и тогда Тьма заполнит эманацию в 15 футов, исходящую от этого предмета. Накрытие предмета чем-либо непрозрачным, например миской или шлемом, блокирует Тьму.
    Если любая часть области этого заклинания пересекается с областью яркого света или тусклого света, созданного заклинанием 2-го уровня или ниже, это другое заклинание рассеивается.
  properties:
    castingTime: Действие
    range: 60 футов
    material: шерсть летучей мыши и кусочек угля
    duration: до 10 минут
- id: darkvision
  name: Тёмное зрение
  description: |-
    *2-й уровень, Преобразование (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S, M (сушёная морковь)
    **Длительность:** 8 часов

    На время действия заклинания добровольное существо, которого вы касаетесь, получает тёмное зрение с дистанцией 150 футов.
  properties:
    castingTime: Действие
    range: Касание
    material: сушёная морковь
    duration: 8 часов
- id: daylight
  name: Дневной свет
  description: |-
    *3-й уровень, Воплощение (Жрец, Друид, Паладин, Следопыт, Чародей)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** 1 час

    На время действия заклинания солнечный свет распространяется из точки в пределах дистанции и заполняет сферу радиусом 60 футов. Область солнечного света является ярким светом и создаёт тусклый свет ещё на 60 футов.
    Кроме того, вы можете наложить заклинание на предмет, который не надет и не несётся, и тогда солнечный свет заполнит эманацию в 60 футов, исходящую от этого предмета. Накрытие предмета чем-либо непрозрачным, например миской или шлемом, блокирует солнечный свет.
    Если любая часть области этого заклинания пересекается с областью Тьмы, созданной заклинанием 3-го уровня или ниже, это другое заклинание рассеивается.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: 1 час
- id: death-ward
  name: Защита от смерти
  description: |-
    *4-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** 8 часов

    Вы касаетесь существа и даруете ему защиту от смерти. В первый раз, когда цель должна была бы упасть до 0 очков здоровья до окончания заклинания, она вместо этого падает до 1 очка здоровья, и заклинание заканчивается.
    Если заклинание всё ещё действует, когда цель подвергается эффекту, который убил бы её мгновенно без нанесения урона, этот эффект против цели не действует, и заклинание заканчивается.
  properties:
    castingTime: Действие
    range: Касание
    duration: 8 часов
- id: delayed-blast-fireball
  name: Отложенный огненный шар
  description: |-
    *7-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** V, S, M (шарик из гуано летучей мыши и серы)
    **Длительность:** Концентрация, до 1 минуты

    Из вас вырывается луч жёлтого света, который затем сгущается в выбранной точке в пределах дистанции в светящуюся бусину на время действия заклинания. Когда заклинание заканчивается, бусина взрывается, и каждое существо в сфере радиусом 20 футов с центром в этой точке совершает спасбросок Ловкости. Существо получает урон огнём, равный общему накопленному урону при проваленном спасброске, или половину этого урона при успешном.
    Базовый урон заклинания равен 12d6 и увеличивается на 1d6 каждый раз, когда заканчивается ваш ход, если заклинание ещё действует.
    Если существо касается светящейся бусины до окончания заклинания, оно совершает спасбросок Ловкости. При проваленном спасброске заклинание заканчивается, и бусина взрывается. При успешном спасброске существо может бросить бусину на расстояние до 40 футов. Если брошенная бусина попадает в пространство существа или сталкивается с твёрдым предметом, заклинание заканчивается, и бусина взрывается.
    Когда бусина взрывается, горючие предметы в зоне взрыва, которые не надеты и не несутся, начинают гореть.

    **Использование ячейки более высокого уровня.** Базовый урон увеличивается на 1d6 за каждый уровень ячейки выше 7-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: шарик из гуано летучей мыши и серы
    duration: до 1 минуты
    higherLevel: Базовый урон увеличивается на 1d6 за каждый уровень ячейки выше 7-го.
- id: demiplane
  name: Демиплан
  description: |-
    *8-й уровень, Вызов (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** S
    **Длительность:** 1 час

    Вы создаёте теневую дверь среднего размера на плоской твёрдой поверхности, которую видите в пределах дистанции. Дверь можно открывать и закрывать, и она ведёт в демиплан — пустую комнату размером 30 футов в каждом измерении, сделанную из дерева или камня (на ваш выбор).
    Когда заклинание заканчивается, дверь исчезает, а предметы внутри демиплана остаются там. Существа внутри демиплана тоже остаются, если только не решат быть вытолкнутыми через дверь в момент её исчезновения; тогда они оказываются в состоянии «Лежащий ничком» в свободных пространствах, ближайших к бывшему месту двери.
    Каждый раз, когда вы сотворяете это заклинание, вы можете создать новый демиплан или соединить теневую дверь с демипланом, созданным вами при предыдущем сотворении этого заклинания. Кроме того, если вы знаете природу и содержимое демиплана, созданного другим существом с помощью этого заклинания, вы можете соединить теневую дверь с ним.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: 1 час
- id: detect-evil-and-good
  name: Обнаружение добра и зла
  description: |-
    *1-й уровень, Прорицание (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 10 минут

    На время действия заклинания вы ощущаете местонахождение любых Аберраций, Небожителей, Элементалей, Фей, Исчадий или Нежити в пределах 30 футов от себя. Вы также ощущаете, активно ли в этом месте заклинание Освящение и, если да, где именно.
    Заклинание блокируется слоем камня, земли или дерева толщиной 1 фут, слоем металла толщиной 1 дюйм или тонким листом свинца.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 10 минут
- id: detect-magic
  name: Обнаружение магии
  description: |-
    *1-й уровень, Прорицание (Бард, Жрец, Друид, Паладин, Следопыт, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 10 минут

    На время действия заклинания вы ощущаете присутствие магических эффектов в пределах 30 футов от себя. Если вы ощущаете такие эффекты, вы можете выполнить Магическое действие, чтобы увидеть слабую ауру вокруг любого видимого существа или предмета в этой области, который несёт магию, а если эффект создан заклинанием, вы узнаёте школу магии этого заклинания.
    Заклинание блокируется слоем камня, земли или дерева толщиной 1 фут, слоем металла толщиной 1 дюйм или тонким листом свинца.
  properties:
    castingTime: Действие или ритуал
    range: На себя
    duration: до 10 минут
- id: detect-poison-and-disease
  name: Обнаружение яда и болезней
  description: |-
    *1-й уровень, Прорицание (Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** На себя
    **Компоненты:** V, S, M (лист тиса)
    **Длительность:** Концентрация, до 10 минут

    На время действия заклинания вы ощущаете местонахождение ядов, ядовитых и ядоносных существ и магических зараз в пределах 30 футов от себя. Вы ощущаете вид яда, существа или заразы в каждом случае.
    Заклинание блокируется слоем камня, земли или дерева толщиной 1 фут, слоем металла толщиной 1 дюйм или тонким листом свинца.
  properties:
    castingTime: Действие или ритуал
    range: На себя
    material: лист тиса
    duration: до 10 минут
- id: detect-thoughts
  name: Обнаружение мыслей
  description: |-
    *2-й уровень, Прорицание (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (1 медная монета)
    **Длительность:** Концентрация, до 1 минуты

    Вы активируете один из эффектов ниже. До окончания заклинания вы можете активировать любой из эффектов Магическим действием в свои последующие ходы.
    Ощущение мыслей. Вы ощущаете присутствие мыслей в пределах 30 футов от себя, принадлежащих существам, которые знают языки или телепатичны. Вы не читаете мысли, но знаете, что рядом есть мыслящее существо.
    Заклинание блокируется слоем камня, земли или дерева толщиной 1 фут, слоем металла толщиной 1 дюйм или тонким листом свинца.
    Чтение мыслей. Выберите одно существо, которое вы видите в пределах 30 футов от себя, или одно существо в пределах 30 футов от себя, которое вы обнаружили эффектом Ощущение мыслей. Вы узнаёте, что сейчас больше всего занимает разум цели. Если цель не знает языков и не телепатична, вы ничего не узнаёте.
    Магическим действием в свой следующий ход вы можете попытаться глубже проникнуть в разум цели. Если вы проникаете глубже, цель совершает спасбросок Мудрости. При проваленном спасброске вы распознаёте ход мыслей цели, её эмоции и нечто, что доминирует в её разуме (например, тревогу, любовь или ненависть). При успешном спасброске заклинание заканчивается. В любом случае цель понимает, что вы проникаете в её разум, и пока вы не переключите внимание с её разума, цель может совершить в своём ходу проверку Интеллекта (Магия) против Сложности спасброска вашего заклинания, и при успехе заклинание заканчивается.
  properties:
    castingTime: Действие
    range: На себя
    material: 1 медная монета
    duration: до 1 минуты
- id: dimension-door
  name: Дверь измерений
  description: |-
    *4-й уровень, Вызов (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 500 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Вы телепортируетесь в место в пределах дистанции. Вы прибываете точно в желаемую точку. Это может быть место, которое вы видите, место, которое можете представить, или место, которое можно описать, указав расстояние и направление, например «200 футов строго вниз» или «300 футов вверх на северо-запад под углом 45 градусов».
    Вы также можете телепортировать одно добровольное существо. Оно должно находиться в пределах 5 футов от вас в момент телепортации и окажется в пространстве в пределах 5 футов от вашей конечной точки.
    Если вы, другое существо или вы оба окажетесь в пространстве, занятом существом или полностью заполненном одним или несколькими предметами, вы и любое существо, путешествующее с вами, получаете по 4d6 урона силовым полем, а телепортация не удаётся.
  properties:
    castingTime: Действие
    range: 500 футов
    duration: Мгновенная

- id: disguise-self
  name: Маскировка
  description: |-
    *1-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** Личная  
    **Компоненты:** В, С  
    **Длительность:** 1 час

    Вы меняете себя, включая одежду, доспехи, оружие и прочие вещи, которые на вас, так, что выглядите иначе, пока заклинание не закончится. Вы можете казаться на 1 фут ниже или выше и казаться тяжелее или легче. Вы должны принять облик с таким же базовым расположением конечностей, как у вас. В остальном вид иллюзии определяете вы.
    Изменения, которые создаёт это заклинание, не выдерживают физической проверки. Например, если вы добавите к наряду шляпу, предметы будут проходить сквозь неё, а тот, кто её коснётся, ничего не почувствует.
    Чтобы распознать, что вы замаскированы, существо должно выполнить действие «Изучение», чтобы осмотреть ваш облик, и преуспеть в проверке Интеллекта (Расследование) против вашей Сл спасброска заклинаний.
  properties:
    castingTime: Действие
    range: Личная
    duration: 1 час

- id: disintegrate
  name: Распад
  description: |-
    *6-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С, М (магнитный камень и пыль)  
    **Длительность:** Мгновенная

    Вы выпускаете зелёный луч в цель, которую видите в пределах дистанции. Целью может быть существо, немагический предмет или создание магической силы, например стена, созданная заклинанием «Стена силы».
    Существо, на которое нацелено это заклинание, совершает спасбросок Ловкости. При провале цель получает 10d6 + 40 урона силовым полем. Если этот урон снижает её до 0 очков здоровья, она и всё немагическое, что на ней надето и что она несёт, обращаются в серую пыль. Вернуть такую цель к жизни можно только заклинаниями «Истинное воскрешение» или «Желание».
    Это заклинание автоматически разрушает немагический предмет Большого или меньшего размера либо создание магической силы. Если цель Огромного или большего размера, заклинание разрушает участок 10-футового куба этой цели.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 3d6 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: магнитный камень и пыль
    duration: Мгновенная
    higherLevel: Урон увеличивается на 3d6 за каждый уровень ячейки выше 6-го.

- id: dispel-evil-and-good
  name: Изгнание зла и добра
  description: |-
    *5-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** Действие  
    **Дистанция:** Личная  
    **Компоненты:** В, С, М (порошок из серебра и железа)  
    **Длительность:** Концентрация, до 1 минуты

    На время действия заклинания небожители, элементали, феи, исчадия и нежить совершают броски атаки по вам с помехой. Вы можете досрочно завершить заклинание, используя одну из следующих особых функций.
    Разрыв чар. Магическим действием вы касаетесь существа, которое одержимо существами перечисленных выше типов или находится в состоянии «Очарованный» или «Испуганный» по их вине. Цель больше не одержима, не находится в состоянии «Очарованный» или «Испуганный» со стороны таких существ.
    Изгнание. Магическим действием вы выбираете одно существо, которое видите в пределах 5 футов от себя и которое относится к одному из перечисленных выше типов. Цель должна преуспеть в спасброске Харизмы, иначе её отправят на родной план, если она ещё не там. Если они не на родном плане, нежить отправляется в Теневой план, а феи в Страну фей.
  properties:
    castingTime: Действие
    range: Личная
    material: порошок из серебра и железа
    duration: до 1 минуты

- id: dispel-magic
  name: Развеивание магии
  description: |-
    *3-й уровень, Ограждение (Бард, Жрец, Друид, Паладин, Следопыт, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Выберите одно существо, предмет или магический эффект в пределах дистанции. Любое действующее заклинание 3-го или более низкого уровня на цели оканчивается. Для каждого действующего заклинания 4-го или более высокого уровня на цели совершите проверку характеристики заклинаний (Сл 10 + уровень этого заклинания). При успешной проверке заклинание оканчивается.

    **Использование ячейки более высокого уровня.** Вы автоматически оканчиваете заклинание на цели, если его уровень не выше уровня использованной вами ячейки.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: Мгновенная
    higherLevel: Вы автоматически оканчиваете заклинание на цели, если его уровень не выше уровня использованной вами ячейки.

- id: dissonant-whispers
  name: Диссонирующий шёпот
  description: |-
    *1-й уровень, Очарование (Бард)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Одно существо по вашему выбору, которое вы видите в пределах дистанции, слышит в своём разуме диссонирующую мелодию. Цель совершает спасбросок Мудрости. При провале она получает 3d6 урона психической энергией и обязана немедленно использовать реакцию, если она доступна, чтобы как можно дальше отойти от вас, выбрав безопасный путь. При успешном спасброске цель получает вдвое меньше урона и никаких других эффектов.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.

- id: divination
  name: Прорицание
  description: |-
    *4-й уровень, Прорицание (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие или ритуал  
    **Дистанция:** Личная  
    **Компоненты:** В, С, М (благовония стоимостью 25+ зм, которые поглощает заклинание)  
    **Длительность:** Мгновенная

    Это заклинание позволяет вам связаться с богом или его слугами. Вы задаёте один вопрос о конкретной цели, событии или деятельности, которые произойдут в течение 7 дней. Мастер даёт правдивый ответ, который может быть короткой фразой или загадочной рифмой. Заклинание не учитывает обстоятельства, которые могут изменить ответ, например сотворение других заклинаний.
    Если вы сотворяете это заклинание более одного раза до окончания продолжительного отдыха, то после первого раза каждое последующее сотворение имеет накопительный шанс 25 процентов, что вы не получите ответа.
  properties:
    castingTime: Действие
    range: Личная
    material: благовония стоимостью 25+ зм, которые поглощает заклинание
    duration: Мгновенная

- id: divine-favor
  name: Божественная милость
  description: |-
    *1-й уровень, Преобразование (Паладин)*

    **Время сотворения:** Бонусное действие  
    **Дистанция:** Личная  
    **Компоненты:** В, С  
    **Длительность:** 1 минута

    До окончания заклинания ваши атаки оружием наносят дополнительно 1d4 урона излучением при попадании.
  properties:
    castingTime: Бонусное действие
    range: Личная
    duration: 1 минута

- id: divine-smite
  name: Божественная кара
  description: |-
    *1-й уровень, Воплощение (Паладин)*

    **Время сотворения:** Бонусное действие, которое вы совершаете сразу после попадания по цели рукопашным оружием или безоружным ударом  
    **Дистанция:** Личная Компонент: В  
    **Компоненты:**   
    **Длительность:** Мгновенная

    Цель получает дополнительно 2d8 урона излучением от атаки. Урон увеличивается на 1d8, если цель является исчадием или нежитью.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Бонусное действие, которое вы совершаете сразу после попадания по цели рукопашным оружием или безоружным ударом
    range: "Личная Компонент: В"
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го.

- id: divine-word
  name: Божественное слово
  description: |-
    *7-й уровень, Воплощение (Жрец)*

    **Время сотворения:** Бонусное действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Вы произносите слово, наполненное силой Верхних Планов. Каждое существо по вашему выбору в пределах дистанции совершает спасбросок Харизмы. При провале цель с 50 очками здоровья или меньше получает эффект в зависимости от её текущих очков здоровья, как показано в таблице эффектов «Божественного слова». Независимо от очков здоровья небожитель, элементаль, фея или исчадие, которое провалило спасбросок, принудительно возвращается на свой план происхождения (если оно ещё не там) и не может вернуться на текущий план в течение 24 часов никаким способом, кроме заклинания «Желание».
    Эффекты Божественного слова | Очки здоровья и эффект
    0-20 | Цель погибает.
    21-30 | Цель получает состояния «Ослеплённый», «Оглохший» и «Ошеломлённый» на 1 час.
    41-50 | Цель получает состояние «Оглохший» на 1 минуту.
  properties:
    castingTime: Бонусное действие
    range: 30 футов
    duration: Мгновенная

- id: dominate-beast
  name: Подчинение зверя
  description: |-
    *4-й уровень, Очарование (Друид, Следопыт, Чародей)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Один зверь, которого вы видите в пределах дистанции, должен преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» на время действия заклинания. Цель совершает спасбросок с преимуществом, если вы или ваши союзники сражаетесь с ней. Каждый раз, когда цель получает урон, она повторяет спасбросок и при успехе прекращает действие заклинания на себе.
    Пока вы оба находитесь на одном плане существования, у вас есть телепатическая связь с очарованной целью. В свой ход вы можете использовать эту связь, чтобы отдавать ей приказы (действие не требуется), например «Атакуй то существо», «Двигайся туда» или «Принеси тот предмет». Цель старается подчиниться в свой ход. Если она выполнила приказ и не получила новых указаний от вас, она действует и перемещается как хочет, заботясь прежде всего о своей защите.
    Вы можете приказать цели совершить реакцию, но для этого вы сами должны потратить свою реакцию.

    **Использование ячейки более высокого уровня.** Ваша концентрация может длиться дольше при использовании ячейки 5-го уровня (до 10 минут), 6-го (до 1 часа) или 7-го и выше (до 8 часов).
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 минуты
    higherLevel: Ваша концентрация может длиться дольше при использовании ячейки 5-го уровня (до 10 минут), 6-го (до 1 часа) или 7-го и выше (до 8 часов).

- id: dominate-monster
  name: Подчинение чудовища
  description: |-
    *8-й уровень, Очарование (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 часа

    Одно существо, которое вы видите в пределах дистанции, должно преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» на время действия заклинания. Цель совершает спасбросок с преимуществом, если вы или ваши союзники сражаетесь с ней. Каждый раз, когда цель получает урон, она повторяет спасбросок и при успехе прекращает действие заклинания на себе.
    Пока вы оба находитесь на одном плане существования, у вас есть телепатическая связь с очарованной целью. В свой ход вы можете использовать эту связь, чтобы отдавать ей приказы (действие не требуется), например «Атакуй то существо», «Двигайся туда» или «Принеси тот предмет». Цель старается подчиниться в свой ход. Если она выполнила приказ и не получила новых указаний от вас, она действует и перемещается как хочет, заботясь прежде всего о своей защите.
    Вы можете приказать цели совершить реакцию, но для этого вы сами должны потратить свою реакцию.

    **Использование ячейки более высокого уровня.** Ваша концентрация может длиться дольше при использовании ячейки 9-го уровня (до 8 часов).
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 часа
    higherLevel: Ваша концентрация может длиться дольше при использовании ячейки 9-го уровня (до 8 часов).
- id: dominate-person
  name: Подчинение личности
  description: |-
    *5-й уровень, Очарование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Один гуманоид, которого вы видите в пределах дистанции, должен преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» на время действия заклинания. Цель совершает этот спасбросок с преимуществом, если вы или ваши союзники сражаетесь с ней. Всякий раз, когда цель получает урон, она повторяет спасбросок и при успехе прекращает действие заклинания.
    Вы поддерживаете телепатическую связь с очарованной целью, пока вы оба находитесь на одном плане существования. В свой ход вы можете использовать эту связь, чтобы отдавать ей приказы (действие не требуется), например: «Атакуй то существо», «Иди вон туда» или «Принеси тот предмет». Цель старается выполнить приказ в свой ход. Если она выполнила приказ и не получила от вас новых указаний, она действует и перемещается по своему усмотрению, заботясь о собственной безопасности.
    Вы можете приказать цели совершить реакцию, но для этого вы сами должны потратить свою реакцию.

    **Использование ячейки более высокого уровня.** Ваша концентрация может длиться дольше, если вы используете ячейку 6-го уровня (до 10 минут), 7-го уровня (до 1 часа) или 8-го уровня и выше (до 8 часов).
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 минуты
    higherLevel: Ваша концентрация может длиться дольше, если вы используете ячейку 6-го уровня (до 10 минут), 7-го уровня (до 1 часа) или 8-го уровня и выше (до 8 часов).

- id: dragons-breath
  name: Дыхание дракона
  description: |-
    *2-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (горячий перец)
    **Длительность:** Концентрация, до 1 минуты

    Вы касаетесь существа, которое на это согласно, и выбираете один из типов урона: кислотный, холодный, огненный, электрический или ядовитый. Пока заклинание действует, цель может совершить магическое действие, чтобы выдохнуть 15-футовый конус. Каждое существо в этой области совершает спасбросок Ловкости и получает 3d6 урона выбранного типа при провале или половину этого урона при успехе.   Использование ячейки более высокого уровня. Урон увеличивается на 1d6 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Бонусное действие
    range: Касание
    material: горячий перец
    duration: до 1 минуты

- id: dream
  name: Сон
  description: |-
    *5-й уровень, Иллюзия (Бард, Колдун, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** Особая
    **Компоненты:** В, С, М (горсть песка)
    **Длительность:** 8 часов

    Вы выбираете целью знакомое вам существо на том же плане существования. Вы или добровольно согласившееся на это существо, которого вы касаетесь, входите в состояние транса, чтобы стать вестником снов. Пока вестник находится в трансе, он находится в состоянии «Выведенный из строя» и имеет скорость 0.
    Если цель спит, вестник появляется в её снах и может беседовать с ней, пока она спит, на протяжении всей длительности заклинания. Вестник также может менять окружение сна, создавая ландшафты, предметы и другие образы. Вестник может в любой момент выйти из транса, прекратив действие заклинания. Цель отчётливо помнит сон после пробуждения.
    Если цель бодрствует в момент сотворения, вестник это понимает и может либо прервать транс (и заклинание), либо дождаться, когда цель уснёт, и тогда войти в её сны.
    Вы можете сделать вестника ужасающим для цели. Если вы так поступите, вестник может передать сообщение не длиннее десяти слов, после чего цель совершает спасбросок Мудрости. При провале цель не получает пользы от отдыха и получает 3d6 урона психической энергией при пробуждении.
  properties:
    castingTime: 1 минута
    range: Особая
    material: горсть песка
    duration: 8 часов

- id: druidcraft
  name: Друидское искусство
  description: |-
    *Заговор Преобразования (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Обращаясь к духам природы, вы создаёте один из следующих эффектов в пределах дистанции.
    Датчик погоды. Вы создаёте крошечный, безвредный сенсорный эффект, который предсказывает погоду в вашем месте на следующие 24 часа. Эффект может проявиться золотым шаром при ясном небе, облаком при дожде, падающими снежинками при снеге и так далее. Эффект сохраняется 1 раунд.
    Цветение. Вы мгновенно заставляете цветок распуститься, стручок раскрыться или почку листа распуститься.
    Сенсорный эффект. Вы создаёте безвредный сенсорный эффект, например падающие листья, призрачных танцующих фей, лёгкий ветерок, звук животного или слабый запах скунса. Эффект должен помещаться в 5-футовый куб.
    Игра с огнём. Вы зажигаете или гасите свечу, факел или костёр.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: Мгновенная

- id: earthquake
  name: Землетрясение
  description: |-
    *8-й уровень, Преобразование (Жрец, Друид, Чародей)*

    **Время сотворения:** Действие
    **Дистанция:** 500 футов
    **Компоненты:** В, С, М (расколотый камень)
    **Длительность:** Концентрация, до 1 минуты

    Выберите точку на земле, которую вы видите в пределах дистанции. На время действия заклинания сильная тряска раскалывает землю в круге радиусом 100 футов с центром в этой точке. Земля там становится труднопроходимой местностью.
    В момент сотворения этого заклинания и в конце каждого вашего хода на протяжении его действия каждое существо на земле в этой области совершает спасбросок Ловкости. При провале существо получает состояние «Лежащий ничком», и его концентрация прерывается. Вы также можете вызвать эффекты, описанные ниже.
    Трещины. Всего 1d6 трещин открываются в области заклинания в конце хода, в котором вы его сотворили. Вы выбираете их расположение, которое не может находиться под постройками. Каждая трещина имеет глубину 1d10 × 10 футов и ширину 10 футов и тянется от одного края области заклинания до другого. Существо, находящееся в одном пространстве с трещиной, должно преуспеть в спасброске Ловкости, иначе провалится в неё. Существо, которое успешно спаслось, перемещается вместе с краем трещины по мере её открытия.
    Постройки. Тряска наносит 50 дробящего урона любой постройке, соприкасающейся с землёй в области, в момент сотворения заклинания и в конце каждого вашего хода до окончания заклинания. Если постройка опускается до 0 очков здоровья, она обрушивается.
    Существо, находящееся на расстоянии от обрушивающейся постройки, равном половине её высоты, совершает спасбросок Ловкости. При провале существо получает 12d6 дробящего урона, получает состояние «Лежащий ничком» и оказывается погребённым под обломками; чтобы выбраться, ему требуется действие и проверка по характеристике «Сила» (Атлетика) со Сложностью 20. При успешном спасброске существо получает только половину урона.
  properties:
    castingTime: Действие
    range: 500 футов
    material: расколотый камень
    duration: до 1 минуты

- id: eldritch-blast
  name: Мистический заряд
  description: |-
    *Заговор Воплощения (Колдун)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы выпускаете луч потрескивающей энергии. Совершите дальнобойную атаку заклинанием по одному существу или предмету в пределах дистанции. При попадании цель получает 1d10 урона силовым полем.
    Улучшение заговора. Заклинание создаёт два луча на 5-м уровне, три луча на 11-м уровне и четыре луча на 17-м уровне. Вы можете направить лучи в одну цель или в разные. Совершайте отдельный бросок атаки для каждого луча.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: Мгновенная

- id: elementalism
  name: Власть стихий
  description: |-
    *Заговор Преобразования (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы подчиняете себе стихии, создавая один из следующих эффектов в пределах дистанции.
    Призыв воздуха. Вы создаёте порыв ветра, достаточно сильный, чтобы колыхать ткань, поднимать пыль, шелестеть листьями и закрывать открытые двери и ставни, и всё это в области 5-футового куба. Двери и ставни, которые кто-то или что-то удерживает открытыми, не затрагиваются.
    Призыв земли. Вы создаёте тонкий слой пыли или песка, покрывающий поверхности в области 5-футового квадрата, или заставляете одно слово появиться вашим почерком на участке земли или песка.
    Призыв огня. Вы создаёте тонкое облако безвредных искр и цветного душистого дыма в 5-футовом кубе. Вы выбираете цвет и запах, а искры могут зажигать свечи, факелы или лампы в этой области. Запах дыма держится 1 минуту.
    Призыв воды. Вы создаёте брызги прохладного тумана, слегка смачивающие существ и предметы в 5-футовом кубе. Либо вы создаёте 1 чашку чистой воды в открытой ёмкости или на поверхности, и вода испаряется через 1 минуту.
    Придание формы стихии. Вы заставляете землю, песок, огонь, дым, туман или воду, которые помещаются в 1-футовый куб, принять грубую форму (например, форму существа) на 1 час.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: Мгновенная

- id: enhance-ability
  name: Усиление характеристики
  description: |-
    *2-й уровень, Преобразование (Бард, Жрец, Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (мех или перо)
    **Длительность:** Концентрация, до 1 часа

    Вы касаетесь существа и выбираете характеристику: Сила, Ловкость, Интеллект, Мудрость или Харизму. На время действия заклинания цель совершает проверки выбранной характеристики с преимуществом.

    **Использование ячейки более высокого уровня.** Вы можете нацелить на одно дополнительное существо за каждый уровень ячейки выше 2-го. Для каждой цели можно выбрать свою характеристику.
  properties:
    castingTime: Действие
    range: Касание
    material: мех или перо
    duration: до 1 часа
    higherLevel: Вы можете нацелить на одно дополнительное существо за каждый уровень ячейки выше 2-го. Для каждой цели можно выбрать свою характеристику.

- id: enlarge-reduce
  name: Увеличение/уменьшение
  description: |-
    *2-й уровень, Преобразование (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (щепотка железного порошка)
    **Длительность:** Концентрация, до 1 минуты

    На время действия заклинание увеличивает или уменьшает существо или предмет, который вы видите в пределах дистанции (см. выбранный эффект ниже). Целевой предмет не должен быть надет или переноситься. Если цель — существо, которое не хочет этого, оно может совершить спасбросок Телосложения. При успехе заклинание не действует.
    Всё, что целевое существо носит и несёт, меняет размер вместе с ним. Любой предмет, который оно роняет, немедленно возвращается к нормальному размеру. Метательное оружие или боеприпас возвращается к нормальному размеру сразу после попадания или промаха по цели.
    Увеличение. Размер цели увеличивается на одну категорию, например со среднего до большого. Цель также совершает проверки и спасброски по характеристике «Сила» с преимуществом. Её атаки увеличенным оружием или безоружными ударами наносят дополнительно 1d4 урона при попадании.
    Уменьшение. Размер цели уменьшается на одну категорию, например со среднего до маленького. Цель также совершает проверки и спасброски по характеристике «Сила» с помехой. Её атаки уменьшенным оружием или безоружными ударами наносят на 1d4 меньше урона при попадании (это не может снизить урон ниже 1).
  properties:
    castingTime: Действие
    range: 30 футов
    material: щепотка железного порошка
    duration: до 1 минуты

- id: ensnaring-strike
  name: Опутывающий удар
  description: |-
    *1-й уровень, Вызов (Следопыт)*

    **Время сотворения:** Бонусное действие, которое вы совершаете сразу после попадания по существу оружием
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Концентрация, до 1 минуты

    В момент попадания по цели на ней появляются цепкие лозы, и она совершает спасбросок по характеристике «Сила». Большое или более крупное существо совершает этот спасбросок с преимуществом. При провале цель получает состояние «Опутанный» до окончания заклинания. При успехе лозы высыхают, и заклинание заканчивается.
    Пока цель опутана, она получает 1d6 колющего урона в начале каждого своего хода. Цель или существо в пределах досягаемости от неё может совершить действие и проверку по характеристике «Сила» (Атлетика) против Сложности спасброска от вашего заклинания. При успехе заклинание заканчивается.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Бонусное действие, которое вы совершаете сразу после попадания по существу оружием
    range: На себя
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.

- id: entangle
  name: Опутывание
  description: |-
    *1-й уровень, Вызов (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Цепкие растения вырастают из земли на 20-футовом квадрате в пределах дистанции. На время действия заклинания эти растения превращают землю в этой области в труднопроходимую местность. Они исчезают, когда заклинание заканчивается.
    Каждое существо (кроме вас), находящееся в этой области в момент сотворения заклинания, должно преуспеть в спасброске Силы, иначе получит состояние «Опутанный» до окончания заклинания. Опутанное существо может совершить действие и проверку по характеристике «Сила» (Атлетика) против Сложности спасброска от вашего заклинания. При успехе оно высвобождается из цепких растений и больше не опутано ими.
  properties:
    castingTime: Действие
    range: 90 футов
    duration: до 1 минуты

- id: enthrall
  name: Увлечение
  description: |-
    *2-й уровень, Очарование (Бард, Колдун)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы плетёте отвлекающую цепочку слов, заставляя выбранных вами существ, которых вы видите в пределах дистанции, совершить спасбросок Мудрости. Любое существо, с которым сражаетесь вы или ваши спутники, автоматически преуспевает в этом спасброске. При провале цель получает штраф -10 к проверкам Мудрости (Внимательность) и пассивной внимательности до окончания заклинания.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 минуты
- id: etherealness
  name: Эфирность
  description: |-
    *7-й уровень, Вызов (Бард, Жрец, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** До 8 часов

    Вы входите в приграничные области Эфирного плана, там, где он пересекается с вашим текущим планом. Вы остаётесь в Приграничном Эфире на протяжении действия заклинания. За это время вы можете двигаться в любом направлении. Если вы движетесь вверх или вниз, каждый фут движения стоит дополнительный фут. Вы можете воспринимать план, который покинули; он выглядит серым, и вы не видите там ничего дальше 60 футов.
    Находясь на Эфирном плане, вы можете воздействовать и подвергаться воздействию только существ, предметов и эффектов на этом плане. Существа, не находящиеся на Эфирном плане, не могут воспринимать вас или взаимодействовать с вами, если только особенность не даёт им такой возможности.
    Когда заклинание заканчивается, вы возвращаетесь на план, который покинули, в точку, соответствующую вашему положению в Приграничном Эфире. Если вы появляетесь в занятом пространстве, вас сдвигают в ближайшее свободное пространство, и вы получаете урон силовым полем, равный удвоенному числу футов, на которое вас сдвинули.
    Это заклинание мгновенно заканчивается, если вы сотворили его, находясь на Эфирном плане или на плане, который с ним не граничит, например на одном из Внешних планов.

    **Использование ячейки более высокого уровня.** Вы можете выбрать до трёх добровольных существ (включая себя) за каждый уровень ячейки выше 7. Существа должны находиться в пределах 10 футов от вас в момент сотворения заклинания.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "До 8 часов"
    higherLevel: "Вы можете выбрать до трёх добровольных существ (включая себя) за каждый уровень ячейки выше 7. Существа должны находиться в пределах 10 футов от вас в момент сотворения заклинания."

- id: expeditious-retreat
  name: Ускоренное отступление
  description: |-
    *1-й уровень, Преобразование (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 10 минут

    Вы совершаете действие «Рывок», и до окончания заклинания вы можете снова совершить это действие как бонусное действие.
  properties:
    castingTime: "Бонусное действие"
    range: "На себя"
    duration: "до 10 минут"

- id: eyebite
  name: Взор зла
  description: |-
    *6-й уровень, Некромантия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 1 минуты

    На протяжении действия заклинания ваши глаза превращаются в чернильную пустоту. Одно существо по вашему выбору в пределах 60 футов от вас, которое вы видите, должно пройти спасбросок Мудрости или испытать один из следующих эффектов на ваш выбор на протяжении действия заклинания.
    В каждый ваш ход до окончания заклинания вы можете совершить магическое действие, чтобы выбрать другое существо, но не можете выбрать существо повторно, если оно прошло спасбросок против этого сотворения заклинания.
    Сон. Цель получает состояние «Без сознания». Она пробуждается, если получит урон или если другое существо совершит действие, чтобы её разбудить.
    Паника. Цель получает состояние «Испуганный». В каждый свой ход испуганная цель должна совершить действие «Рывок» и отойти от вас самым безопасным и коротким доступным путём. Если цель переместится в пространство на расстоянии не менее 60 футов от вас, где она не сможет вас видеть, этот эффект заканчивается. Недомогание. Цель получает состояние «Отравленный».
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "до 1 минуты"

- id: fabricate
  name: Изготовление
  description: |-
    *4-й уровень, Преобразование (Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** 120 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Вы превращаете сырые материалы в изделия из того же материала. Например, вы можете создать деревянный мост из группы деревьев, верёвку из пучка пеньки или одежду из льна или шерсти.
    Выберите сырые материалы в пределах дистанции, которые вы видите. Вы можете создать предмет размером Большой или меньше (помещающийся в куб 10 футов или восемь соединённых кубов 5 футов) при достаточном количестве материала. Однако если вы работаете с металлом, камнем или другим минеральным веществом, созданный предмет не может быть больше Среднего (помещающегося в куб 5 футов). Качество созданных предметов зависит от качества сырых материалов.
    Этим заклинанием нельзя создавать существ и магические предметы. Также нельзя создать предметы, требующие высокого мастерства, например оружие и доспехи, если вы не владеете видом инструментов ремесленника, которым изготавливаются такие предметы.
  properties:
    castingTime: "10 минут"
    range: "120 футов"
    duration: "Мгновенная"

- id: faerie-fire
  name: Огни фей
  description: |-
    *1-й уровень, Воплощение (Бард, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V
    **Длительность:** Концентрация, до 1 минуты

    Предметы в кубе 20 футов в пределах дистанции обводятся синим, зелёным или фиолетовым светом (на ваш выбор). Каждое существо в кубе также обводится светом, если проваливает спасбросок Ловкости. На протяжении действия заклинания предметы и затронутые существа испускают тусклый свет в радиусе 10 футов и не могут пользоваться состоянием «Невидимый».
    Броски атаки по затронутому существу или предмету совершаются с преимуществом, если атакующий его видит.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "до 1 минуты"

- id: faithful-hound
  name: Верный пёс
  description: |-
    *4-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** V, S, M (серебряный свисток)
    **Длительность:** 8 часов

    Вы призываете призрачного сторожевого пса в незанятом пространстве в пределах дистанции, которое вы видите. Пёс остаётся на протяжении действия заклинания или до тех пор, пока вы с ним не окажетесь дальше чем в 300 футах друг от друга.
    Никто, кроме вас, не может видеть пса; он неосязаем и неуязвим. Когда Маленькое или более крупное существо приближается к нему на 30 футов, не произнеся пароля, который вы назвали при сотворении заклинания, пёс начинает громко лаять. Пёс обладает Истинным зрением на дистанцию 30 футов.
    В начале каждого вашего хода пёс пытается укусить одного врага в пределах 5 футов от себя. Враг должен пройти спасбросок Ловкости или получить 4d8 урона силовым полем.
    В последующие ваши ходы вы можете совершить магическое действие, чтобы переместить пса на 30 футов.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    material: "серебряный свисток"
    duration: "8 часов"

- id: false-life
  name: Ложная жизнь
  description: |-
    *1-й уровень, Некромантия (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (капля алкоголя)
    **Длительность:** Мгновенная

    Вы получаете 2d4 + 4 временных очка здоровья.

    **Использование ячейки более высокого уровня.** Вы получаете 5 дополнительных временных очков здоровья за каждый уровень ячейки выше 1.
  properties:
    castingTime: "Действие"
    range: "На себя"
    material: "капля алкоголя"
    duration: "Мгновенная"
    higherLevel: "Вы получаете 5 дополнительных временных очков здоровья за каждый уровень ячейки выше 1."

- id: fear
  name: Страх
  description: |-
    *3-й уровень, Иллюзия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (белое перо)
    **Длительность:** Концентрация, до 1 минуты

    Каждое существо в конусе 30 футов должно пройти спасбросок Мудрости, иначе оно выронит всё, что держит, и получит состояние «Испуганный» на протяжении действия заклинания.
    Испуганное существо в каждом своём ходу совершает действие «Рывок» и отходит от вас самым безопасным путём, если есть куда отступать. Если существо заканчивает ход в пространстве, откуда не видит вас, оно совершает спасбросок Мудрости. При успешном спасброске заклинание заканчивается для этого существа.
  properties:
    castingTime: "Действие"
    range: "На себя"
    material: "белое перо"
    duration: "до 1 минуты"

- id: feather-fall
  name: Плавное падение
  description: |-
    *1-й уровень, Преобразование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Реакция, которую вы совершаете, когда вы или существо, которое вы видите в пределах 60 футов от вас, падает
    **Дистанция:** 60 футов
    **Компоненты:** V, M (маленькое перо или пушинка)
    **Длительность:** 1 минута

    Выберите до пяти падающих существ в пределах дистанции. Скорость падения каждого из них замедляется до 60 футов в раунд, пока заклинание не закончится. Если существо приземлится до окончания заклинания, оно не получает урона от падения, и заклинание для него заканчивается.
  properties:
    castingTime: "Реакция, которую вы совершаете, когда вы или существо, которое вы видите в пределах 60 футов от вас, падает"
    range: "60 футов"
    material: "маленькое перо или пушинка"
    duration: "1 минута"

- id: find-familiar
  name: Поиск фамильяра
  description: |-
    *1-й уровень, Вызов (Волшебник)*

    **Время сотворения:** 1 час или ритуал
    **Дистанция:** 10 футов
    **Компоненты:** V, S, M (горящие благовония стоимостью 10+ зм, которые заклинание расходует)
    **Длительность:** Мгновенная

    Вы получаете услуги фамильяра, духа, принимающего облик животного на ваш выбор: летучей мыши, кошки, жабы, ястреба, ящерицы, осьминога, совы, крысы, ворона, паука, ласки или другого зверя с показателем опасности 0. Появившись в незанятом пространстве в пределах дистанции, фамильяр имеет характеристики выбранной формы (см. «Монстры»), но является небожителем, феей или исчадием (на ваш выбор) вместо зверя. Фамильяр действует самостоятельно, но подчиняется вашим командам.
    Телепатическая связь. Пока фамильяр находится в пределах 100 футов от вас, вы можете общаться с ним телепатически. Кроме того, как бонусное действие вы можете видеть глазами фамильяра и слышать то, что слышит он, до начала вашего следующего хода, получая преимущества любых его особых чувств.
    Наконец, когда вы сотворяете заклинание с дистанцией «касание», ваш фамильяр может доставить касание. Фамильяр должен находиться в пределах 100 футов от вас и совершить реакцию, чтобы доставить касание при сотворении заклинания.
    Бой. Фамильяр является союзником для вас и ваших союзников. Он бросает собственную инициативу и действует в свой ход. Фамильяр не может атаковать, но может совершать другие действия как обычно.
    Исчезновение фамильяра. Когда фамильяр падает до 0 очков здоровья, он исчезает. Он появится вновь после того, как вы сотворите это заклинание снова. Как магическое действие вы можете временно отослать фамильяра в карманное измерение. Либо вы можете отослать его навсегда. Как магическое действие, пока он временно отослан, вы можете вызвать его появление в незанятом пространстве в пределах 30 футов от вас. Когда фамильяр падает до 0 очков здоровья или исчезает в карманном измерении, он оставляет в своём пространстве всё, что на нём надето или несётся.
    Только один фамильяр. Одновременно у вас может быть не более одного фамильяра. Если вы сотворите это заклинание, имея фамильяра, он вместо этого принимает новую подходящую форму.
  properties:
    castingTime: "1 час"
    range: "10 футов"
    material: "горящие благовония стоимостью 10+ зм, которые заклинание расходует"
    duration: "Мгновенная"

- id: find-steed
  name: Поиск скакуна
  description: |-
    *2-й уровень, Вызов (Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов Компонент: V, S
    **Компоненты:**
    **Длительность:** Мгновенная

    Вы призываете потустороннее существо, которое предстаёт как верный скакун, в незанятом пространстве по вашему выбору в пределах дистанции. Это существо использует блок характеристик потустороннего скакуна. Если у вас уже есть скакун от этого заклинания, он заменяется новым.
    Скакун напоминает большое верховое животное на ваш выбор, например лошадь, верблюда, устрашающего волка или лося. При каждом сотворении заклинания выбирайте тип существа скакуна: небожитель, фея или исчадие, что определяет некоторые особенности в блоке характеристик.
    Бой. Скакун является союзником для вас и ваших союзников. В бою он разделяет ваш счётчик инициативы и функционирует как управляемое животное, пока вы на нём едете (по правилам боя верхом). Если вы получили состояние «Выведенный из строя», скакун совершает свой ход сразу после вашего и действует самостоятельно, сосредоточившись на вашей защите.
    Исчезновение скакуна. Скакун исчезает, если падает до 0 очков здоровья или если вы умираете. Когда он исчезает, он оставляет всё, что на нём надето или несётся. Если вы сотворите это заклинание снова, вы решаете, призвать ли исчезнувшего скакуна или другого.

    **Использование ячейки более высокого уровня.** Используйте уровень ячейки заклинания как уровень заклинания в блоке характеристик. Большой небожитель, фея или исчадие (на ваш выбор), Нейтральный КБ 10 + 1 за уровень заклинания, ОЗ 5 + 10 за уровень заклинания (у скакуна число Костей Хитов [d10s] равно уровню заклинания) Скорость 60 футов, полёт 60 футов (требуется заклинание 4-го уровня или выше) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 18 +4 +4 ЛОВ 12 +1 +1 ТЕЛ 14 +2 +2 ИНТ 6 -2 -2 МУД 12 +1 +1 ХАР 8 -1 -1 Чувства: пассивная Внимательность 11 Языки: телепатия 1 миля (работает только с вами) ПО нет (опыт 0; бонус мастерства равен вашему бонусу мастерства) Особенности     Жизненная связь. Когда вы восстанавливаете очки здоровья от заклинания 1-го уровня или выше, скакун восстанавливает то же количество очков здоровья, если вы находитесь в пределах 5 футов от него. Действия     Потусторонний удар. Бросок атаки ближнего боя: бонус равен бонусу атаки заклинанием, досягаемость 5 футов. Попадание: 1d8 плюс уровень заклинания урона излучением (небожитель), психической энергией (фея) или некротической энергией (исчадие). Бонусные действия     Жуткий взгляд (только исчадие; перезаряжается после продолжительного отдыха). Спасбросок Мудрости: Сл равна Сложности спасброска вашего заклинания, одно существо в пределах 60 футов, которое скакун видит. Провал: цель получает состояние «Испуганный» до конца вашего следующего хода. Шаг феи (только фея; перезаряжается после продолжительного отдыха). Скакун телепортируется вместе со своим всадником в незанятое пространство по вашему выбору на расстояние до 60 футов от себя. Целительное прикосновение (только небожитель; перезаряжается после продолжительного отдыха). Одно существо в пределах 5 футов от скакуна восстанавливает количество очков здоровья, равное 2d8 плюс уровень заклинания.
  properties:
    castingTime: "Действие"
    range: "30 футов Компонент: V, S"
    duration: "Мгновенная"
    higherLevel: "Используйте уровень ячейки заклинания как уровень заклинания в блоке характеристик. Большой небожитель, фея или исчадие (на ваш выбор), Нейтральный КБ 10 + 1 за уровень заклинания, ОЗ 5 + 10 за уровень заклинания (у скакуна число Костей Хитов [d10s] равно уровню заклинания) Скорость 60 футов, полёт 60 футов (требуется заклинание 4-го уровня или выше) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 18 +4 +4 ЛОВ 12 +1 +1 ТЕЛ 14 +2 +2 ИНТ 6 -2 -2 МУД 12 +1 +1 ХАР 8 -1 -1 Чувства: пассивная Внимательность 11 Языки: телепатия 1 миля (работает только с вами) ПО нет (опыт 0; бонус мастерства равен вашему бонусу мастерства) Особенности     Жизненная связь. Когда вы восстанавливаете очки здоровья от заклинания 1-го уровня или выше, скакун восстанавливает то же количество очков здоровья, если вы находитесь в пределах 5 футов от него. Действия     Потусторонний удар. Бросок атаки ближнего боя: бонус равен бонусу атаки заклинанием, досягаемость 5 футов. Попадание: 1d8 плюс уровень заклинания урона излучением (небожитель), психической энергией (фея) или некротической энергией (исчадие). Бонусные действия     Жуткий взгляд (только исчадие; перезаряжается после продолжительного отдыха). Спасбросок Мудрости: Сл равна Сложности спасброска вашего заклинания, одно существо в пределах 60 футов, которое скакун видит. Провал: цель получает состояние «Испуганный» до конца вашего следующего хода. Шаг феи (только фея; перезаряжается после продолжительного отдыха). Скакун телепортируется вместе со своим всадником в незанятое пространство по вашему выбору на расстояние до 60 футов от себя. Целительное прикосновение (только небожитель; перезаряжается после продолжительного отдыха). Одно существо в пределах 5 футов от скакуна восстанавливает количество очков здоровья, равное 2d8 плюс уровень заклинания."

- id: find-the-path
  name: Поиск пути
  description: |-
    *6-й уровень, Прорицание (Бард, Жрец, Друид)*

    **Время сотворения:** 1 минута
    **Дистанция:** На себя
    **Компоненты:** V, S, M (набор инструментов прорицания, например карты или руны, стоимостью 100+ зм)
    **Длительность:** Концентрация, до 1 дня

    Вы магически ощущаете самый прямой физический путь к названному вами месту. Вы должны быть знакомы с этим местом, и заклинание не сработает, если вы назовёте пункт назначения на другом плане существования, движущийся пункт назначения (например, подвижную крепость) или неопределённый пункт назначения (например, «логово зелёного дракона»).
    На протяжении действия заклинания, пока вы находитесь на том же плане существования, что и пункт назначения, вы знаете, как далеко он находится и в каком направлении. Каждый раз, когда вы сталкиваетесь с выбором путей на пути туда, вы знаете, какой путь самый прямой.
  properties:
    castingTime: "1 минута"
    range: "На себя"
    material: "набор инструментов прорицания (например, карты или руны) стоимостью 100+ зм"
    duration: "до 1 дня"
- id: find-traps
  name: Обнаружение ловушек
  description: |-
    *2-й уровень, Прорицание (Жрец, Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы чувствуете любую ловушку в пределах дистанции, которая находится в прямой видимости. Ловушкой для целей этого заклинания считается любой предмет или механизм, созданный для нанесения урона или иной опасности. Поэтому заклинание почувствует «Сигнализацию» или «Глиф охранения» либо механическую ловушку-яму, но не выявит природную слабость пола, неустойчивый потолок или скрытую воронку.
    Заклинание сообщает, что ловушка есть, но не её местоположение. Вы узнаёте общий характер опасности, которую представляет почувствованная ловушка.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: Мгновенная
- id: finger-of-death
  name: Палец смерти
  description: |-
    *7-й уровень, Некромантия (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы высвобождаете негативную энергию в сторону существа, которое видите в пределах дистанции. Цель совершает спасбросок Телосложения, получая 7d8 + 30 урона некротической энергией при провале или вдвое меньше при успехе.
    Гуманоид, убитый этим заклинанием, поднимается в начале вашего следующего хода как Зомби (см. «Монстры»), который выполняет ваши устные приказы.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: fire-bolt
  name: Огненный снаряд
  description: |-
    *Заговор Воплощения (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы метаете огонь в существо или предмет в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1d10 урона огнём. Горючий предмет, пораженный этим заклинанием, загорается, если его не несут и не носят.
    Улучшение заговора. Урон увеличивается на 1d10, когда вы достигаете 5-го (2d10), 11-го (3d10) и 17-го (4d10) уровня.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: Мгновенная
- id: fire-shield
  name: Огненный щит
  description: |-
    *4-й уровень, Воплощение (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (немного фосфора или светлячок)
    **Длительность:** 10 минут

    Призрачное пламя окутывает ваше тело на всё время действия заклинания, испуская яркий свет в радиусе 10 футов и тусклый свет на расстоянии ещё 10 футов.
    Пламя даёт вам либо тёплый щит, либо холодный щит по вашему выбору. Тёплый щит даёт вам сопротивление урону холодом, а холодный щит даёт сопротивление урону огнём.
    Кроме того, каждый раз, когда существо в пределах 5 футов от вас попадает по вам броском атаки ближнего боя, щит вспыхивает пламенем. Атакующий получает 2d8 урона огнём от тёплого щита или 2d8 урона холодом от холодного щита.
  properties:
    castingTime: Действие
    range: На себя
    material: немного фосфора или светлячок
    duration: 10 минут
- id: fire-storm
  name: Огненный шторм
  description: |-
    *7-й уровень, Воплощение (Жрец, Друид, Чародей)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    В пределах дистанции обрушивается огонь в виде шторма. Область шторма состоит из до десяти кубов размером 10 футов, которые вы располагаете по своему усмотрению. Каждый куб должен граничить хотя бы с одним другим кубом. Каждое существо в области совершает спасбросок Ловкости, получая 7d10 урона огнём при провале или вдвое меньше при успехе.
    Горючие предметы в области, которые не несут и не носят, начинают гореть.
  properties:
    castingTime: Действие
    range: 150 футов
    duration: Мгновенная
- id: fireball
  name: Огненный шар
  description: |-
    *3-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (шарик из гуано летучих мышей и серы)
    **Длительность:** Мгновенная

    Яркий луч устремляется от вас к точке, которую вы выбираете в пределах дистанции, и с низким рёвом превращается в огненный взрыв. Каждое существо в сфере радиусом 20 футов с центром в этой точке совершает спасбросок Ловкости, получая 8d6 урона огнём при провале или вдвое меньше при успехе.
    Горючие предметы в области, которые не несут и не носят, начинают гореть.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 3-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: шарик из гуано летучих мышей и серы
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 3-го.
- id: flame-blade
  name: Пылающий клинок
  description: |-
    *2-й уровень, Воплощение (Друид, Чародей)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (лист сумаха)
    **Длительность:** Концентрация, до 10 минут

    Вы призываете огненный клинок в свободной руке. Клинок по размеру и форме похож на скимитар и существует на всё время действия заклинания. Если вы отпустите клинок, он исчезнет, но вы можете призвать его снова бонусным действием.
    Магическим действием вы можете совершить атаку ближнего боя заклинанием огненным клинком. При попадании цель получает урон огнём, равный 3d6 плюс ваш модификатор характеристики заклинаний.
    Пылающий клинок испускает яркий свет в радиусе 10 футов и тусклый свет на расстоянии ещё 10 футов.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
  properties:
    castingTime: Бонусное действие
    range: На себя
    material: лист сумаха
    duration: до 10 минут
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
- id: flame-strike
  name: Удар пламени
  description: |-
    *5-й уровень, Воплощение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (щепотка серы)
    **Длительность:** Мгновенная

    Вертикальный столб ослепительного огня с ревом обрушивается сверху. Каждое существо в цилиндре радиусом 10 футов и высотой 40 футов с центром в точке в пределах дистанции совершает спасбросок Ловкости, получая 5d6 урона огнём и 5d6 урона излучением при провале или вдвое меньше при успехе.

    **Использование ячейки более высокого уровня.** Урон огнём и урон излучением увеличиваются на 1d6 за каждый уровень ячейки заклинания выше 5-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: щепотка серы
    duration: Мгновенная
    higherLevel: Урон огнём и урон излучением увеличиваются на 1d6 за каждый уровень ячейки заклинания выше 5-го.
- id: flaming-sphere
  name: Пылающая сфера
  description: |-
    *2-й уровень, Вызов (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (восковой шарик)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте огненную сферу диаметром 5 футов в незанятом пространстве на земле в пределах дистанции. Она существует на всё время действия заклинания. Любое существо, которое заканчивает свой ход в пределах 5 футов от сферы, совершает спасбросок Ловкости, получая 2d6 урона огнём при провале или вдвое меньше при успехе.
    Бонусным действием вы можете переместить сферу на 30 футов, катая её по земле. Если вы перемещаете сферу в пространство существа, это существо совершает спасбросок против сферы, а сфера прекращает движение на этот ход.
    Перемещая сферу, вы можете направить её через препятствия высотой до 5 футов и перепрыгнуть ею через ямы шириной до 10 футов. Горючие предметы, которые не несут и не носят, начинают гореть при касании сферой, а сама сфера испускает яркий свет в радиусе 20 футов и тусклый свет на расстоянии ещё 20 футов.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: восковой шарик
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
- id: flesh-to-stone
  name: Превращение плоти в камень
  description: |-
    *6-й уровень, Преобразование (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (перо кокатриса)
    **Длительность:** Концентрация, до 1 минуты

    Вы пытаетесь превратить в камень одно существо, которое видите в пределах дистанции. Цель совершает спасбросок Телосложения. При провале она получает состояние «Опутанный» на время действия заклинания. При успешном спасброске её Скорость равна 0 до начала вашего следующего хода. Конструкты автоматически преуспевают в этом спасброске.
    Опутанная цель совершает спасбросок Телосложения в конце каждого своего хода. Если она три раза успешно спасётся от этого заклинания, оно заканчивается. Если она три раза провалит спасброски, она превращается в камень и получает состояние «Окаменевший» на время действия заклинания. Успехи и провалы не обязаны идти подряд; ведите учёт тех и других, пока у цели не накопятся три одинаковых результата.
    Если вы поддерживаете Концентрацию на этом заклинании в течение всей возможной длительности, цель становится «Окаменевшей» до тех пор, пока это состояние не будет снято заклинанием «Высшее восстановление» или подобной магией.
  properties:
    castingTime: Действие
    range: 60 футов
    material: перо кокатриса
    duration: до 1 минуты
- id: floating-disk
  name: Парящий диск
  description: |-
    *1-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (капля ртути)
    **Длительность:** 1 час

    Это заклинание создаёт круглую горизонтальную плоскость силового поля диаметром 3 фута и толщиной 1 дюйм, которая парит в 3 футах над землёй в незанятом пространстве по вашему выбору в пределах дистанции, которое вы видите. Плоскость существует на всё время действия заклинания и может выдержать до 500 фунтов. Если на неё положить больший вес, заклинание заканчивается, и всё, что лежит на диске, падает на землю.
    Диск неподвижен, пока вы находитесь в пределах 20 футов от него. Если вы отойдёте от него более чем на 20 футов, диск последует за вами, оставаясь в пределах 20 футов от вас. Он может двигаться по неровной местности, вверх и вниз по лестницам, склонам и тому подобному, но не может преодолеть перепад высоты 10 футов и более. Например, диск не может проплыть над ямой глубиной 10 футов и не может выбраться из такой ямы, если был создан на её дне.
    Если вы окажетесь более чем в 100 футах от диска (обычно потому, что он не может обойти препятствие, чтобы последовать за вами), заклинание заканчивается.
  properties:
    castingTime: Действие или ритуал
    range: 30 футов
    material: капля ртути
    duration: 1 час
- id: fly
  name: Полёт
  description: |-
    *3-й уровень, Преобразование (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (перо)
    **Длительность:** Концентрация, до 10 минут

    Вы касаетесь добровольного существа. На всё время действия заклинания цель получает скорость полёта 60 футов и может зависать в воздухе. Когда заклинание заканчивается, цель падает, если всё ещё находится в воздухе, если только не может остановить падение.

    **Использование ячейки более высокого уровня.** Вы можете нацелить заклинание на одно дополнительное существо за каждый уровень ячейки заклинания выше 3-го.
  properties:
    castingTime: Действие
    range: Касание
    material: перо
    duration: до 10 минут
    higherLevel: Вы можете нацелить заклинание на одно дополнительное существо за каждый уровень ячейки заклинания выше 3-го.
- id: fog-cloud
  name: Туманное облако
  description: |-
    *1-й уровень, Вызов (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 часа

    Вы создаёте сферу тумана радиусом 20 футов с центром в точке в пределах дистанции. Сфера сильно затемнена. Она длится всё время действия или до тех пор, пока сильный ветер (например, созданный заклинанием Порыв ветра) не рассеет её.

    **Использование ячейки более высокого уровня.** Радиус тумана увеличивается на 20 футов за каждый уровень ячейки заклинаний выше 1-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 1 часа
    higherLevel: Радиус тумана увеличивается на 20 футов за каждый уровень ячейки заклинаний выше 1-го.

- id: forbiddance
  name: Запрет
  description: |-
    *6-й уровень, Ограждение (Жрец)*

    **Время сотворения:** 10 минут или ритуал  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (рубиновая пыль стоимостью 1,000+ зм)  
    **Длительность:** 1 день

    Вы создаёте защиту от магических перемещений, которая охватывает до 40,000 квадратных футов площади пола на высоту 30 футов над полом. На время действия существа не могут телепортироваться в эту область и не могут использовать порталы, такие как созданные заклинанием Врата, чтобы войти в неё. Заклинание защищает область от межпланарных перемещений, поэтому оно не позволяет существам попасть в неё через Астральный план, Эфирный план, Страну фей, Теневой план или с помощью заклинания Смена плана.
    Кроме того, заклинание наносит урон существам выбранных вами типов. Выберите один или несколько из следующих: аберрации, небожители, элементали, феи, исчадия и нежить. Когда существо выбранного типа входит в область заклинания впервые за ход или завершает там свой ход, оно получает 5d10 урона излучением или некротической энергией (на ваш выбор в момент сотворения заклинания).
    Вы можете назвать пароль при сотворении заклинания. Существо, которое произносит пароль, входя в область, не получает от заклинания никакого урона.
    Область заклинания не может перекрываться с областью другого заклинания Запрет. Если вы сотворяете Запрет каждый день в течение 30 дней в одном и том же месте, заклинание длится, пока его не рассеют, а материальные компоненты расходуются при последнем сотворении.
  properties:
    castingTime: 10 минут
    range: Касание
    material: рубиновая пыль стоимостью 1,000+ зм
    duration: 1 день

- id: forcecage
  name: Силовая клетка
  description: |-
    *7-й уровень, Воплощение (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 100 футов  
    **Компоненты:** В, С, М (рубиновая пыль стоимостью 1,500+ зм, которую заклинание расходует)  
    **Длительность:** Концентрация, до 1 часа

    Неподвижная, невидимая тюрьма кубической формы, созданная из магического силового поля, появляется вокруг области, которую вы выберете в пределах дистанции. Тюрьма может быть клеткой или сплошным ящиком, по вашему выбору.
    Тюрьма в форме клетки может иметь сторону до 20 футов и состоит из прутьев диаметром 1/2 дюйма, расставленных с промежутком 1/2 дюйма. Тюрьма в форме ящика может иметь сторону до 10 футов и образует сплошной барьер, который не пропускает никакую материю и блокирует любые заклинания, направленные в область или из неё.
    Когда вы сотворяете заклинание, любое существо, полностью находящееся внутри области клетки, оказывается в ловушке. Существа, которые лишь частично находятся в области, либо те, кто слишком велик, чтобы поместиться внутри, отталкиваются от центра области, пока не окажутся полностью за её пределами.
    Существо внутри клетки не может покинуть её немагическими способами. Если существо пытается использовать телепортацию или межпланарное перемещение, чтобы выбраться, оно сначала должно совершить спасбросок Харизмы. При успешном спасброске существо может использовать эту магию, чтобы выйти из клетки. При провале оно не выходит из клетки, и заклинание или эффект тратятся впустую. Клетка также простирается в Эфирный план, блокируя эфирные перемещения. Это заклинание нельзя рассеять заклинанием Рассеивание магии.
  properties:
    castingTime: Действие
    range: 100 футов
    material: рубиновая пыль стоимостью 1,500+ зм, которую заклинание расходует
    duration: до 1 часа

- id: foresight
  name: Предвидение
  description: |-
    *9-й уровень, Прорицание (Бард, Друид, Колдун, Волшебник)*

    **Время сотворения:** 1 минута  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (перо колибри)  
    **Длительность:** 8 часов

    Вы касаетесь добровольно согласного существа и даруете ему ограниченную способность видеть ближайшее будущее. На время действия цель совершает броски с преимуществом на проверки d20, а другие существа совершают броски атаки по ней с помехой. Заклинание заканчивается досрочно, если вы сотворите его снова.
  properties:
    castingTime: 1 минута
    range: Касание
    material: перо колибри
    duration: 8 часов

- id: freedom-of-movement
  name: Свобода перемещения
  description: |-
    *4-й уровень, Ограждение (Бард, Жрец, Друид, Следопыт)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (кожаный ремень)  
    **Длительность:** 1 час

    Вы касаетесь добровольно согласного существа. На время действия передвижение цели не замедляется труднопроходимой местностью, а заклинания и другие магические эффекты не могут снизить скорость цели или вызвать у неё состояния Парализованный или Опутанный. Цель также получает скорость плавания, равную её скорости. Кроме того, цель может потратить 5 футов перемещения, чтобы автоматически освободиться от немагических пут, таких как кандалы, или от существа, которое накладывает на неё состояние Схваченный.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одну дополнительную цель за каждый уровень ячейки заклинаний выше 4-го.
  properties:
    castingTime: Действие
    range: Касание
    material: кожаный ремень
    duration: 1 час
    higherLevel: Вы можете выбрать одну дополнительную цель за каждый уровень ячейки заклинаний выше 4-го.

- id: freezing-sphere
  name: Ледяная сфера
  description: |-
    *6-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 300 футов  
    **Компоненты:** В, С, М (миниатюрная хрустальная сфера)  
    **Длительность:** Мгновенная

    Ледяной шар устремляется от вас к выбранной вами точке в пределах дистанции, где взрывается сферой радиусом 60 футов. Каждое существо в этой области совершает спасбросок Телосложения, получая 10d6 урона холодом при провале или половину этого урона при успехе.
    Если шар попадает в водоём, он замораживает воду на глубину 6 дюймов на площади 30 футов в квадрате. Этот лёд сохраняется 1 минуту. Существа, плавающие на поверхности замёрзшей воды, оказываются во льду в ловушке и получают состояние Опутанный. Попавшее в ловушку существо может действием совершить проверку характеристики Сила (Атлетика) против Сложности спасброска вашего заклинания, чтобы вырваться.
    Вы можете не выпускать шар после завершения сотворения заклинания. Если вы так поступите, в вашей руке появится шар размером с пулю из пращи, прохладный на ощупь. В любой момент вы или существо, которому вы передали шар, можете бросить шар (на дистанцию 40 футов) или метнуть его из пращи (на обычную дистанцию пращи). Он разбивается при ударе с тем же эффектом, что и при обычном сотворении заклинания. Вы также можете положить шар, не разбивая его. Через 1 минуту, если шар ещё не разбился, он взрывается.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинаний выше 6-го.
  properties:
    castingTime: Действие
    range: 300 футов
    material: миниатюрная хрустальная сфера
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинаний выше 6-го.

- id: gaseous-form
  name: Газообразная форма
  description: |-
    *3-й уровень, Преобразование (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (кусочек марли)  
    **Длительность:** Концентрация, до 1 часа

    Добровольно согласное существо, которого вы касаетесь, вместе со всем, что на нём надето и что оно несёт, изменяет форму и превращается в туманное облако на время действия. Заклинание заканчивается для цели, если она падает до 0 очков здоровья или если она тратит магическое действие, чтобы завершить заклинание на себе.
    В этой форме единственный способ передвижения цели — полёт со скоростью 10 футов, и она может зависать в воздухе. Цель может входить в пространство другого существа и занимать его. Цель имеет сопротивление дробящему, колющему и рубящему урону; она получает иммунитет к состоянию Лежащий ничком; и она совершает с преимуществом спасброски характеристик Сила, Ловкость и Телосложение. Цель может проходить через узкие отверстия, но жидкости для неё считаются твёрдыми поверхностями.
    Цель не может говорить или манипулировать предметами, а любые предметы, которые она несла или держала, нельзя уронить, использовать или иным образом взаимодействовать с ними. Наконец, цель не может атаковать или сотворять заклинания.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одну дополнительную цель за каждый уровень ячейки заклинаний выше 3-го.
  properties:
    castingTime: Действие
    range: Касание
    material: кусочек марли
    duration: до 1 часа
    higherLevel: Вы можете выбрать одну дополнительную цель за каждый уровень ячейки заклинаний выше 3-го.

- id: gate
  name: Врата
  description: |-
    *9-й уровень, Вызов (Жрец, Колдун, Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С, М (алмаз стоимостью 5,000+ зм)  
    **Длительность:** Концентрация, до 1 минуты

    Вы призываете портал, который соединяет незанятое пространство, видимое вами в пределах дистанции, с определённым местом на другом плане существования. Портал — это круглое отверстие диаметром от 5 до 20 футов, которое вы можете направить в любую сторону. Портал существует всё время действия, и место назначения видно через него.
    У портала есть лицевая и обратная стороны на каждом плане, где он появляется. Переход через портал возможен только при движении через его лицевую сторону. Всё, что так поступает, мгновенно переносится на другой план и появляется в ближайшем к порталу незанятом пространстве.
    Божества и другие правители планов могут помешать открытию порталов, созданных этим заклинанием, в своём присутствии или в любой точке своих владений.
    Когда вы сотворяете это заклинание, вы можете назвать имя определённого существа (псевдоним, титул или прозвище не подходят). Если это существо находится на другом плане, портал открывается рядом с ним и переносит его в ближайшее незанятое пространство на вашей стороне портала. Вы не получаете над существом никакой особой власти, и оно свободно действовать так, как сочтёт нужным Мастер. Оно может уйти, напасть на вас или помочь.
  properties:
    castingTime: Действие
    range: 60 футов
    material: алмаз стоимостью 5,000+ зм
    duration: до 1 минуты

- id: geas
  name: Гейс
  description: |-
    *5-й уровень, Очарование (Бард, Жрец, Друид, Паладин, Волшебник)*

    **Время сотворения:** 1 минута  
    **Дистанция:** 60 футов  
    **Компоненты:** В  
    **Длительность:** 30 дней

    Вы отдаёте словесный приказ существу, которое видите в пределах дистанции, велящий ему выполнить какую-либо службу или воздержаться от действия или определённого образа действий, как решите вы. Цель должна преуспеть в спасброске Мудрости, иначе на время действия она получит состояние Очарованный. Цель автоматически преуспевает, если не может понять ваш приказ.
    Находясь в состоянии Очарованный, существо получает 5d10 урона психической энергией, если действует вопреки вашему приказу. Этот урон наносится не более одного раза в день.
    Вы можете отдать любой приказ, какой захотите, кроме действия, которое повлечёт верную смерть. Если вы отдадите самоубийственный приказ, заклинание заканчивается.
    Заклинания Снятие проклятия, Великое восстановление или Желание заканчивают это заклинание.

    **Использование ячейки более высокого уровня.** Если вы используете ячейку 7-го или 8-го уровня, длительность составляет 365 дней. Если вы используете ячейку 9-го уровня, заклинание длится, пока его не завершит одно из перечисленных выше заклинаний.
  properties:
    castingTime: 1 минута
    range: 60 футов
    duration: 30 дней
    higherLevel: Если вы используете ячейку 7-го или 8-го уровня, длительность составляет 365 дней. Если вы используете ячейку 9-го уровня, заклинание длится, пока его не завершит одно из перечисленных выше заклинаний.

- id: gentle-repose
  name: Мирный покой
  description: |-
    *2-й уровень, Некромантия (Жрец, Паладин, Волшебник)*

    **Время сотворения:** Действие или ритуал  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (2 медные монеты, которые заклинание расходует)  
    **Длительность:** 10 дней

    Вы касаетесь трупа или других останков. На время действия цель защищена от разложения и не может стать нежитью.
    Заклинание также продлевает срок, в течение которого можно вернуть к жизни мёртвую цель, поскольку дни под его действием не учитываются в ограничении времени для таких заклинаний, как Воскрешение.
  properties:
    castingTime: Действие
    range: Касание
    material: 2 медные монеты, которые заклинание расходует
    duration: 10 дней

- id: giant-insect
  name: Гигантское насекомое
  description: |-
    *4-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы призываете гигантскую многоножку, паука или осу (выбирается при сотворении заклинания). Существо появляется в незанятом пространстве, которое вы видите в пределах дистанции, и использует блок характеристик «Гигантское насекомое». Выбранная форма определяет некоторые детали его блока характеристик. Существо исчезает, когда падает до 0 очков здоровья или когда заклинание заканчивается.
    Оно является союзником для вас и ваших союзников. В бою существо действует по одной инициативе с вами, но ходит сразу после вашего хода. Оно подчиняется вашим словесным приказам (ваше действие не требуется). Если вы не отдаёте приказов, оно совершает действие Уклонение и использует своё движение, чтобы избегать опасности.

    **Использование ячейки более высокого уровня.** Используйте уровень ячейки заклинаний как уровень заклинания в блоке характеристик. Большой зверь, без мировоззрения КБ 11 + уровень заклинания ОЗ 30 + 10 за каждый уровень заклинания выше 4-го Скорость 40 фт., лазание 40 фт., полёт 40 фт. (только оса) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 17 +3 +3 ЛОВ 13 +1 +1 ТЕЛ 15 +2 +2 ИНТ 4 -3 -3 МУД 14 +2 +2 ХАР 3 -4 -4 Чувства: тёмное зрение 60 фт.; пассивная Внимательность 12 Языки: понимает языки, которые знаете вы ПО нет (ОП 0; БМ равен вашему бонусу мастерства) Особенности     Лазание по паутине. Насекомое может лазать по трудным поверхностям, в том числе по потолкам, не совершая проверки характеристики. Действия     Множественная атака. Насекомое совершает число атак, равное половине уровня этого заклинания (округляя вниз). Ядовитый укол. Бросок атаки ближнего боя: бонус равен бонусу атаки вашего заклинания, досягаемость 10 фт. Попадание: 1d6 + 3 плюс уровень заклинания колющего урона плюс 1d4 урона ядом. Паутинный болт (только паук). Бросок атаки дальнего боя: бонус равен бонусу атаки вашего заклинания, дистанция 60 фт. Попадание: 1d10 + 3 плюс уровень заклинания дробящего урона, и скорость цели снижается до 0 до начала следующего хода насекомого. Бонусные действия     Ядовитый плевок (только многоножка). Спасбросок Телосложения: Сложность спасброска вашего заклинания, одно существо, которое насекомое видит в пределах 10 фт. Провал: цель получает состояние Отравленный до начала следующего хода насекомого.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 10 минут
    higherLevel: |-
      Используйте уровень ячейки заклинаний как уровень заклинания в блоке характеристик. Большой зверь, без мировоззрения КБ 11 + уровень заклинания ОЗ 30 + 10 за каждый уровень заклинания выше 4-го Скорость 40 фт., лазание 40 фт., полёт 40 фт. (только оса) МОД СПАС    МОД СПАС    МОД СПАС СИЛ 17 +3 +3 ЛОВ 13 +1 +1 ТЕЛ 15 +2 +2 ИНТ 4 -3 -3 МУД 14 +2 +2 ХАР 3 -4 -4 Чувства: тёмное зрение 60 фт.; пассивная Внимательность 12 Языки: понимает языки, которые знаете вы ПО нет (ОП 0; БМ равен вашему бонусу мастерства) Особенности     Лазание по паутине. Насекомое может лазать по трудным поверхностям, в том числе по потолкам, не совершая проверки характеристики. Действия     Множественная атака. Насекомое совершает число атак, равное половине уровня этого заклинания (округляя вниз). Ядовитый укол. Бросок атаки ближнего боя: бонус равен бонусу атаки вашего заклинания, досягаемость 10 фт. Попадание: 1d6 + 3 плюс уровень заклинания колющего урона плюс 1d4 урона ядом. Паутинный болт (только паук). Бросок атаки дальнего боя: бонус равен бонусу атаки вашего заклинания, дистанция 60 фт. Попадание: 1d10 + 3 плюс уровень заклинания дробящего урона, и скорость цели снижается до 0 до начала следующего хода насекомого. Бонусные действия     Ядовитый плевок (только многоножка). Спасбросок Телосложения: Сложность спасброска вашего заклинания, одно существо, которое насекомое видит в пределах 10 фт. Провал: цель получает состояние Отравленный до начала следующего хода насекомого.

- id: glibness
  name: Красноречие
  description: |-
    *8-й уровень, Очарование (Бард, Колдун)*

    **Время сотворения:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** 1 час

    Пока заклинание действует, когда вы совершаете проверку Харизмы, вы можете заменить выпавшее число на 15. Кроме того, какие бы слова вы ни говорили, магия, которая определяет, говорите ли вы правду, показывает, что вы говорите правду.
  properties:
    castingTime: Действие
    range: На себя
    duration: 1 час
- id: globe-of-invulnerability
  name: Сфера неуязвимости
  description: |-
    *6-й уровень, Ограждение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (стеклянная бусина)
    **Длительность:** Концентрация, до 1 минуты

    Неподвижный мерцающий барьер появляется в 10-футовой Эманации вокруг вас и остаётся на всё время длительности.
    Любое заклинание 5-го или меньшего уровня, сотворённое снаружи барьера, не может воздействовать на всё, что находится внутри него. Такое заклинание может выбирать своими целями существ и предметы внутри барьера, но не оказывает на них никакого эффекта. Аналогично, область внутри барьера исключается из областей действия, создаваемых такими заклинаниями.

    **Использование ячейки более высокого уровня.** Барьер блокирует заклинания на 1 уровень выше за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: На себя
    material: стеклянная бусина
    duration: Концентрация, до 1 минуты
    higherLevel: Барьер блокирует заклинания на 1 уровень выше за каждый уровень ячейки выше 6-го.
- id: glyph-of-warding
  name: Глиф охраны
  description: |-
    *3-й уровень, Ограждение (Бард, Жрец, Волшебник)*

    **Время сотворения:** 1 час
    **Дистанция:** Касание
    **Компоненты:** V, S, M (порошок алмаза стоимостью 200+ зм, который поглощается заклинанием)
    **Длительность:** До рассеивания или срабатывания

    Вы создаёте глиф, который позже высвобождает магический эффект. Вы наносите его либо на поверхность (например, на стол или участок пола), либо на предмет, который можно закрыть (например, на книгу или сундук), чтобы скрыть глиф. Глиф может покрывать площадь не больше 10 футов в диаметре. Если поверхность или предмет переместят более чем на 10 футов от места, где вы сотворили заклинание, глиф разрушается, и заклинание заканчивается, не сработав.
    Глиф почти незаметен, и для его обнаружения требуется успешная проверка Мудрости (Внимательность) против Сложности спасброска ваших заклинаний.
    Когда вы создаёте глиф, вы задаёте его срабатывание и выбираете, будет ли это взрывная руна или глиф заклинания, как описано ниже.
    Задание срабатывания. Вы решаете, что приведёт глиф в действие, когда вы сотворяете заклинание. Для глифов, нанесённых на поверхность, распространённые условия включают касание или наступание на глиф, снятие предмета, который его закрывает, или приближение на определённое расстояние. Для глифов, нанесённых внутри предмета, распространённые условия включают открытие этого предмета или возможность увидеть глиф. Как только глиф сработает, это заклинание заканчивается.
    Вы можете уточнить условие срабатывания так, чтобы глиф активировали только существа определённых типов (например, глиф можно настроить на Аберраций). Вы также можете задать условия для существ, которые не активируют глиф, например для тех, кто произнесёт определённый пароль.
    Взрывная руна. При срабатывании глиф выбрасывает магическую энергию в Сфере радиусом 20 футов с центром в глифе. Каждое существо в области совершает спасбросок Ловкости. Существо получает 5d8 урона кислотой, холодом, огнём, электричеством или звуком (на ваш выбор при создании глифа) при провале спасброска или половину этого урона при успехе.
    Глиф заклинания. Вы можете сохранить подготовленное заклинание 3-го или меньшего уровня в глифе, сотворив его как часть создания глифа. Заклинание должно нацеливаться на одно существо или на область. Сохранённое заклинание при таком сотворении не оказывает немедленного эффекта.
    Когда глиф срабатывает, сохранённое заклинание вступает в действие. Если у заклинания есть цель, оно нацеливается на существо, которое активировало глиф. Если заклинание воздействует на область, эта область центрируется на этом существе. Если заклинание призывает враждебных существ или создаёт вредоносные предметы или ловушки, они появляются как можно ближе к нарушителю и нападают на него. Если заклинание требует Концентрации, оно длится до конца всей своей длительности.

    **Использование ячейки более высокого уровня.** Урон взрывной руны увеличивается на 1d8 за каждый уровень ячейки выше 3-го. Если вы создаёте глиф заклинания, вы можете сохранить любое заклинание до того же уровня, что и ячейка, которую вы используете для Глифа охраны.
  properties:
    castingTime: 1 час
    range: Касание
    material: порошок алмаза стоимостью 200+ зм, который поглощается заклинанием
    duration: До рассеивания или срабатывания
    higherLevel: Урон взрывной руны увеличивается на 1d8 за каждый уровень ячейки выше 3-го. Если вы создаёте глиф заклинания, вы можете сохранить любое заклинание до того же уровня, что и ячейка, которую вы используете для Глифа охраны.
- id: goodberry
  name: Волшебные ягоды
  description: |-
    *1-й уровень, Вызов (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (веточка омелы)
    **Длительность:** 24 часа

    На вашей руке появляются десять ягод, которые на всё время длительности пропитываются магией. Существо может совершить Бонусное действие, чтобы съесть одну ягоду. Одна ягода восстанавливает 1 очко здоровья, а её достаточно, чтобы питать существо в течение одного дня. Несъеденные ягоды исчезают, когда заклинание заканчивается.
  properties:
    castingTime: Действие
    range: На себя
    material: веточка омелы
    duration: 24 часа
- id: grease
  name: Жир
  description: |-
    *1-й уровень, Вызов (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S, M (кусочек свиной шкурки или масло)
    **Длительность:** 1 минута

    Негорючий жир покрывает землю на 10-футовом квадрате с центром в точке в пределах дистанции и превращает её в труднопроходимую местность на всё время длительности.
    Когда жир появляется, каждое существо в его области должно преуспеть в спасброске Ловкости или получить состояние Лежащий ничком. Существо, которое входит в область или заканчивает там свой ход, также должно преуспеть в этом спасброске или упасть ничком.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кусочек свиной шкурки или масло
    duration: 1 минута
- id: greater-invisibility
  name: Большая невидимость
  description: |-
    *4-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 1 минуты

    Существо, которого вы касаетесь, получает состояние Невидимый до окончания заклинания.
  properties:
    castingTime: Действие
    range: Касание
    duration: до 1 минуты
- id: greater-restoration
  name: Высшее восстановление
  description: |-
    *5-й уровень, Ограждение (Бард, Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S, M (алмазная пыль стоимостью 100+ зм, которую поглощает заклинание)
    **Длительность:** Мгновенная

    Вы касаетесь существа и магически устраняете один из следующих эффектов: • 1 уровень истощения • состояние Очарованный или Окаменевший • проклятие, включая настройку цели на проклятый магический предмет • любое снижение одной из характеристик цели • любое снижение максимума очков здоровья цели
  properties:
    castingTime: Действие
    range: Касание
    material: алмазная пыль стоимостью 100+ зм, которую поглощает заклинание
    duration: Мгновенная
- id: guardian-of-faith
  name: Страж веры
  description: |-
    *4-й уровень, Вызов (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** V
    **Длительность:** 8 часов

    Большой призрачный страж появляется и на всё время длительности парит в незанятом пространстве в пределах дистанции, которое вы видите. Страж занимает это пространство, неуязвим и принимает облик, соответствующий вашему божеству или пантеону.
    Любой противник, который впервые за ход переместился в пространство в пределах 10 футов от стража или начинает там свой ход, совершает спасбросок Ловкости и получает 20 урона излучением при провале или половину этого урона при успехе. Страж исчезает, когда нанёс в общей сложности 60 урона.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 8 часов
- id: guards-and-wards
  name: Охрана и защита
  description: |-
    *6-й уровень, Ограждение (Бард, Волшебник)*

    **Время сотворения:** 1 час
    **Дистанция:** Касание
    **Компоненты:** V, S, M (серебряный стержень стоимостью 10+ зм)
    **Длительность:** 24 часа

    Вы создаёте охранное заклятие, которое защищает до 2,500 квадратных футов площади пола. Охраняемая область может быть высотой до 20 футов, и вы формируете её как один квадрат 50 футов, сто смежных квадратов 5 футов или двадцать пять смежных квадратов 10 футов.
    Когда вы сотворяете это заклинание, вы можете указать существ, на которых оно не действует. Вы также можете задать пароль, который, будучи произнесён вслух в пределах 5 футов от охраняемой области, делает говорящего невосприимчивым к её эффектам.
    Заклинание создаёт описанные ниже эффекты в охраняемой области. Рассеивание магии не действует на саму Охрану и защиту, но каждый из следующих эффектов можно рассеять. Если рассеяны все четыре, Охрана и защита заканчивается. Если вы сотворяете это заклинание каждый день в течение 365 дней в одной и той же области, оно впоследствии длится, пока не будут рассеяны все его эффекты.
    Коридоры. Туман заполняет все охраняемые коридоры, делая их Сильно затемнёнными. Кроме того, на каждом перекрёстке или ответвлении, где есть выбор направления, существо, отличное от вас, с вероятностью 50 процентов уверен, что идёт в направлении, противоположном выбранному им.
    Двери. Все двери в охраняемой области магически заперты, как будто запечатаны заклинанием Арканный замок. Кроме того, вы можете покрыть иллюзией до десяти дверей, чтобы они выглядели как обычные участки стены.
    Лестницы. Паутина заполняет все лестницы в охраняемой области сверху донизу, как в заклинании Паутина. Эти нити отрастают через 10 минут, если их уничтожат, пока длится Охрана и защита.
    Прочий эффект заклинания. Разместите в охраняемой области один из следующих магических эффектов: • Пляшущие огоньки в четырёх коридорах с простой программой, которую огоньки повторяют, пока длится Охрана и защита • Волшебные уста в двух местах • Зловонное облако в двух местах (пары возвращаются через 10 минут, если их рассеют, пока длится Охрана и защита) • Порыв ветра в одном коридоре или комнате (ветер дует непрерывно, пока длится заклинание) • Внушение в одном квадрате 5 футов; любое существо, вошедшее в этот квадрат, получает внушение мысленно
  properties:
    castingTime: 1 час
    range: Касание
    material: серебряный стержень стоимостью 10+ зм
    duration: 24 часа
- id: guidance
  name: Направление
  description: |-
    *Заговор Прорицания (Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** Касание Компоненты: V, S
    **Компоненты:**
    **Длительность:** Концентрация, до 1 минуты

    Вы касаетесь доброжелательного существа и выбираете навык. До окончания заклинания существо добавляет 1d4 к любой проверке характеристики, использующей выбранный навык.
  properties:
    castingTime: Действие
    range: "Касание Компоненты: V, S"
    duration: до 1 минуты
- id: guiding-bolt
  name: Направляющий снаряд
  description: |-
    *1-й уровень, Воплощение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** V, S
    **Длительность:** 1 раунд

    Вы посылаете снаряд света в существо в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 4d6 урона излучением, а следующий бросок атаки по ней до конца вашего следующего хода совершается с преимуществом.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: 1 раунд
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
- id: gust-of-wind
  name: Порыв ветра
  description: |-
    *2-й уровень, Воплощение (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V, S, M (семя бобового растения)
    **Длительность:** Концентрация, до 1 минуты

    Линия сильного ветра длиной 60 футов и шириной 10 футов вырывается из вас в выбранном вами направлении на всё время длительности. Каждое существо в Линии должно преуспеть в спасброске Силы или будет отброшено на 15 футов от вас в направлении, следующем вдоль Линии. Существо, которое заканчивает свой ход в Линии, должно совершить такой же спасбросок.
    Любое существо в Линии должно тратить 2 фута движения за каждый 1 фут, на который оно приближается к вам.
    Порыв рассеивает газ или пар и гасит свечи и подобные незащищённые огни в области. Он заставляет защищённое пламя, например пламя фонарей, неистово плясать и с вероятностью 50 процентов гасит его.
    В качестве Бонусного действия в свои последующие ходы вы можете изменить направление, в котором Линия вырывается из вас.
  properties:
    castingTime: Действие
    range: На себя
    material: семя бобового растения
    duration: до 1 минуты
- id: hallow
  name: Освящение
  description: |-
    *5-й уровень, Ограждение (Жрец)*

    **Время сотворения:** 24 часа
    **Дистанция:** Касание
    **Компоненты:** V, S, M (благовония стоимостью 1,000+ зм, которые поглощаются заклинанием)
    **Длительность:** До рассеивания

    Вы касаетесь точки и наполняете область вокруг неё священной или нечестивой силой. Область может иметь радиус до 60 футов, и заклинание проваливается, если радиус включает область, уже находящуюся под действием Освящения. Затронутая область имеет следующие эффекты.
    Освящённая защита. Выберите любые из этих типов существ: Аберрация, Небожитель, Элементаль, Фей, Исчадие или Нежить. Существа выбранных типов не могут добровольно входить в область, а любое существо, одержимое такими существами или находящееся под состоянием Очарованный или Испуганный от них, не одержимо, не очаровано и не испугано ими, пока находится в области.
    Дополнительный эффект. Вы привязываете к области дополнительный эффект из списка ниже: Храбрость. Существа любых выбранных вами типов не могут получить состояние Испуганный, пока находятся в области. Тьма. Тьма заполняет область. Обычный свет, а также магический свет от заклинаний уровнем ниже этого заклинания, не может осветить область. Дневной свет. Яркий свет заполняет область. Магическая тьма, созданная заклинаниями уровнем ниже этого заклинания, не может погасить этот свет. Мирный покой. Мёртвые тела, захороненные в области, не могут быть обращены в нежить. Межпланарные помехи. Существа любых выбранных вами типов не могут входить в область или выходить из неё посредством телепортации или межпланарного путешествия. Страх. Существа любых выбранных вами типов имеют состояние Испуганный, пока находятся в области. Сопротивление. Существа любых выбранных вами типов имеют Сопротивление одному типу урона по вашему выбору, пока находятся в области. Тишина. Никакой звук не может исходить из области и не может проникнуть в неё. Языки. Существа любых выбранных вами типов могут общаться с любым другим существом в области, даже если у них нет общего языка. Уязвимость. Существа любых выбранных вами типов имеют Уязвимость к одному типу урона по вашему выбору, пока находятся в области.
  properties:
    castingTime: 24 часа
    range: Касание
    material: благовония стоимостью 1,000+ зм, которые поглощаются заклинанием
    duration: До рассеивания
- id: hallucinatory-terrain
  name: Галлюцинаторный ландшафт
  description: |-
    *4-й уровень, Иллюзия (Бард, Друид, Колдун, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** 300 футов
    **Компоненты:** V, S, M (гриб)
    **Длительность:** 24 часа

    Вы меняете природный ландшафт в кубе со стороной 150 футов в пределах дистанции так, что он выглядит, звучит и пахнет как другой вид природного ландшафта. Так открытые поля или дорогу можно сделать похожими на болото, холм, расщелину или иной труднопроходимый либо непреодолимый ландшафт. Пруд может казаться лугом с травой, обрыв — пологим склоном, а заросший камнями овраг — широкой и гладкой дорогой. Созданные людьми сооружения, снаряжение и существа в этой области не меняются.
    Осязаемые свойства местности не меняются, поэтому существа, входящие в эту область, скорее всего заметят иллюзию. Если отличие не очевидно на ощупь, существо, изучающее иллюзию, может выполнить действие Изучение и совершить проверку Интеллекта (Расследование) против Сложности спасброска ваших заклинаний, чтобы распознать обман. Если существо понимает, что ландшафт иллюзорен, оно видит расплывчатый образ, наложенный на настоящий ландшафт.
  properties:
    castingTime: 10 минут
    range: 300 футов
    material: гриб
    duration: 24 часа
- id: harm
  name: Вред
  description: |-
    *6-й уровень, Некромантия (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Вы обрушиваете вирулентную магию на существо, которое видите в пределах дистанции. Цель совершает спасбросок Телосложения. При провале она получает 14d6 урона некротической энергией, а максимум её очков здоровья уменьшается на величину полученного некротического урона. При успешном спасброске она получает только половину урона. Это заклинание не может уменьшить максимум очков здоровья цели ниже 1.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: haste
  name: Ускорение
  description: |-
    *3-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** V, S, M (стружка корня солодки)
    **Длительность:** Концентрация, до 1 минуты

    Выберите готовое существо, которое вы видите в пределах дистанции. Пока заклинание действует, Скорость цели удваивается, она получает бонус +2 к Классу Брони, совершает спасброски Ловкости с преимуществом и получает дополнительное действие в каждом своём ходу. Это действие можно использовать только для Атаки (только одна атака), Рывка, Отхода, Засады или Использования предмета.
    Когда заклинание заканчивается, цель выведена из строя, и её Скорость равна 0 до конца её следующего хода, так как на неё накатывает волна вялости.
  properties:
    castingTime: Действие
    range: 30 футов
    material: стружка корня солодки
    duration: до 1 минуты
- id: heal
  name: Исцеление
  description: |-
    *6-й уровень, Ограждение (Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Выберите существо, которое вы видите в пределах дистанции. Через цель проходит позитивная энергия, восстанавливая 70 очков здоровья. Это заклинание также прекращает состояния Ослеплённый, Оглохший и Отравленный у цели.

    **Использование ячейки более высокого уровня.** Исцеление увеличивается на 10 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
    higherLevel: Исцеление увеличивается на 10 за каждый уровень ячейки выше 6-го.
- id: healing-word
  name: Слово исцеления
  description: |-
    *1-й уровень, Ограждение (Бард, Жрец, Друид)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 60 футов
    **Компоненты:** V
    **Длительность:** Мгновенная

    Существо по вашему выбору, которое вы видите в пределах дистанции, восстанавливает очки здоровья, равные 2d4 плюс модификатор вашей характеристики заклинаний.

    **Использование ячейки более высокого уровня.** Исцеление увеличивается на 2d4 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Бонусное действие
    range: 60 футов
    duration: Мгновенная
    higherLevel: Исцеление увеличивается на 2d4 за каждый уровень ячейки выше 1-го.
- id: heat-metal
  name: Раскалённый металл
  description: |-
    *2-й уровень, Преобразование (Бард, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S, M (кусок железа и пламя)
    **Длительность:** Концентрация, до 1 минуты

    Выберите изготовленный из металла предмет, например металлическое оружие или комплект тяжёлых либо средних доспехов, который вы видите в пределах дистанции. Вы заставляете предмет раскалиться докрасна. Любое существо, находящееся в физическом контакте с предметом, получает 2d8 урона огнём в момент сотворения заклинания. Пока заклинание действует, вы можете использовать бонусное действие в каждый свой последующий ход, чтобы нанести этот урон снова, если предмет находится в пределах дистанции.
    Если существо держит или носит предмет и получает от него урон, оно должно преуспеть в спасброске Телосложения или уронить предмет, если может. Если оно не уронило предмет, то совершает с помехой броски атаки и проверки характеристик до начала вашего следующего хода.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кусок железа и пламя
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го.
- id: hellish-rebuke
  name: Адская отповедь
  description: |-
    *1-й уровень, Воплощение (Колдун)*

    **Время сотворения:** Реакция, которую вы совершаете в ответ на получение урона от существа, которое вы видите в пределах 60 футов от себя
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Существо, которое нанесло вам урон, на мгновение окружается зелёным пламенем. Оно совершает спасбросок Ловкости и получает 2d10 урона огнём при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: "Реакция, которую вы совершаете в ответ на получение урона от существа, которое вы видите в пределах 60 футов от себя"
    range: 60 футов
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 1-го.
- id: heroes-feast
  name: Пир героев
  description: |-
    *6-й уровень, Вызов (Бард, Жрец, Друид)*

    **Время сотворения:** 10 минут
    **Дистанция:** Собственная
    **Компоненты:** V, S, M (украшенная самоцветами чаша стоимостью 1,000+ зм, которую заклинание поглощает)
    **Длительность:** Мгновенная

    Вы создаёте пир, который появляется на поверхности в незанятом кубе 10 футов рядом с вами. На поедание пира уходит 1 час, после чего он исчезает, а благотворные эффекты начинают действовать только по истечении этого часа. Не более двенадцати существ могут принять участие в пире.
    Существо, принявшее участие в пире, получает несколько преимуществ, которые длятся 24 часа. Оно получает сопротивление урону ядом и иммунитет к состояниям Испуганный и Отравленный. Максимум его очков здоровья также увеличивается на 2d10, и оно получает столько же очков здоровья.
  properties:
    castingTime: 10 минут
    range: Собственная
    material: украшенная самоцветами чаша стоимостью 1,000+ зм, которую заклинание поглощает
    duration: Мгновенная
- id: heroism
  name: Героизм
  description: |-
    *1-й уровень, Очарование (Бард, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 1 минуты

    Добровольное существо, которого вы касаетесь, наполняется храбростью. Пока заклинание действует, существо получает иммунитет к состоянию Испуганный и в начале каждого своего хода получает временные очки здоровья, равные модификатору вашей характеристики заклинаний.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: Касание
    duration: до 1 минуты
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
- id: hex
  name: Порча
  description: |-
    *1-й уровень, Очарование (Колдун)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 90 футов
    **Компоненты:** V, S, M (окаменевший глаз тритона)
    **Длительность:** Концентрация, до 1 часа

    Вы накладываете проклятие на существо, которое видите в пределах дистанции. Пока заклинание действует, вы наносите цели дополнительный урон 1d6 некротической энергией каждый раз, когда попадаете по ней броском атаки. Кроме того, при сотворении заклинания выберите одну характеристику. Цель совершает проверки этой характеристики с помехой.
    Если цель падает до 0 очков здоровья до окончания заклинания, вы можете в один из последующих ходов использовать бонусное действие, чтобы наложить проклятие на новое существо.

    **Использование ячейки более высокого уровня.** Концентрацию на заклинании можно поддерживать дольше при ячейке 2-го уровня (до 4 часов), 3-4-го уровня (до 8 часов) или 5-го и выше (24 часа).
  properties:
    castingTime: Бонусное действие
    range: 90 футов
    material: окаменевший глаз тритона
    duration: до 1 часа
    higherLevel: Концентрацию на заклинании можно поддерживать дольше при ячейке 2-го уровня (до 4 часов), 3-4-го уровня (до 8 часов) или 5-го и выше (24 часа).
- id: hideous-laughter
  name: Отвратительный смех
  description: |-
    *1-й уровень, Очарование (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** V, S, M (пирожок и перо)
    **Длительность:** Концентрация, до 1 минуты

    Одно существо по вашему выбору, которое вы видите в пределах дистанции, совершает спасбросок Мудрости. При провале оно получает состояния Лежащий ничком и Выведенный из строя на время действия заклинания. В это время оно неудержимо смеётся, если способно смеяться, и не может самостоятельно прекратить состояние Лежащий ничком.
    В конце каждого своего хода и каждый раз, когда получает урон, оно совершает ещё один спасбросок Мудрости. Если спасбросок вызван уроном, существо совершает его с преимуществом. При успешном спасброске заклинание заканчивается.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: пирожок и перо
    duration: до 1 минуты
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 1-го.
- id: hold-monster
  name: Удержание монстра
  description: |-
    *5-й уровень, Очарование (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** V, S, M (прямой железный стержень)
    **Длительность:** Концентрация, до 1 минуты

    Выберите существо, которое вы видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе на время действия заклинания она получает состояние Парализованный. В конце каждого своего хода цель повторяет спасбросок и при успехе прекращает действие заклинания на себе.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 5-го.
  properties:
    castingTime: Действие
    range: 90 футов
    material: прямой железный стержень
    duration: до 1 минуты
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки выше 5-го.
- id: hold-person
  name: Удержание личности
  description: |-
    *2-й уровень, Очарование (Бард, Жрец, Друид, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (прямой кусок железа)
    **Длительность:** Концентрация, до 1 минуты

    Выберите гуманоида, которого вы видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе на время действия заклинания получит состояние «Парализованный». В конце каждого своего хода цель повторяет спасбросок и при успехе прекращает действие заклинания на себе.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одного дополнительного гуманоида за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: прямой кусок железа
    duration: Концентрация, до 1 минуты
    higherLevel: Вы можете выбрать одного дополнительного гуманоида за каждый уровень ячейки выше 2-го.

- id: holy-aura
  name: Святая аура
  description: |-
    *8-й уровень, Ограждение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (реликварий стоимостью 1,000+ зм)
    **Длительность:** Концентрация, до 1 минуты

    На время действия заклинания вы излучаете ауру в 30-футовой эманации. Находящиеся в ауре существа по вашему выбору получают преимущество на все спасброски, а прочие существа совершают броски атаки по ним с помехой. Кроме того, когда Исчадие или Нежить попадает по затронутому существу броском атаки ближнего боя, атакующий должен преуспеть в спасброске Телосложения, иначе получит состояние «Ослеплённый» до конца своего следующего хода.
  properties:
    castingTime: Действие
    range: На себя
    material: реликварий стоимостью 1,000+ зм
    duration: Концентрация, до 1 минуты

- id: hunters-mark
  name: Метка охотника
  description: |-
    *1-й уровень, Прорицание (Следопыт)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 90 футов
    **Компоненты:** В
    **Длительность:** Концентрация, до 1 часа

    Вы магически помечаете одно существо, которое видите в пределах дистанции, как свою добычу. Пока заклинание действует, вы наносите цели дополнительный урон силовым полем 1d6 при каждом попадании по ней броском атаки. Кроме того, вы совершаете с преимуществом любые проверки Мудрости (Внимательности или Выживания), чтобы её отыскать.
    Если цель опускается до 0 очков здоровья до окончания действия заклинания, вы можете бонусным действием перенести метку на другое существо, которое видите в пределах дистанции.

    **Использование ячейки более высокого уровня.** Ваша концентрация может длиться дольше, если вы используете ячейку 3-4 уровня (до 8 часов) или 5+ уровня (до 24 часов).
  properties:
    castingTime: Бонусное действие
    range: 90 футов
    duration: Концентрация, до 1 часа
    higherLevel: Ваша концентрация может длиться дольше, если вы используете ячейку 3-4 уровня (до 8 часов) или 5+ уровня (до 24 часов).

- id: hypnotic-pattern
  name: Гипнотический узор
  description: |-
    *3-й уровень, Иллюзия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** С, М (щепотка конфетти)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте в пределах дистанции переливающийся узор из цветов внутри 30-футового куба. Узор появляется на мгновение и исчезает. Каждое существо в области, которое видит узор, должно преуспеть в спасброске Мудрости, иначе на время действия заклинания получит состояние «Очарованный». Пока существо очаровано, оно имеет состояние «Выведенный из строя» и скорость 0.
    Заклинание прекращает действие на пострадавшем существе, если оно получает любой урон или если кто-то другой тратит действие, чтобы вывести существо из оцепенения.
  properties:
    castingTime: Действие
    range: 120 футов
    material: щепотка конфетти
    duration: Концентрация, до 1 минуты

- id: ice-knife
  name: Ледяной нож
  description: |-
    *1-й уровень, Вызов (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** С, М (капля воды или кусочек льда)
    **Длительность:** Мгновенная

    Вы создаёте осколок льда и метаете его в одно существо в пределах дистанции. Совершите против цели дальнобойную атаку заклинанием. При попадании цель получает 1d10 колющего урона. Попав или промахнувшись, осколок взрывается. Цель и каждое существо в пределах 5 футов от неё должны преуспеть в спасброске Ловкости, иначе получат 2d6 урона холодом.

    **Использование ячейки более высокого уровня.** Урон холодом увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: капля воды или кусочек льда
    duration: Мгновенная
    higherLevel: Урон холодом увеличивается на 1d6 за каждый уровень ячейки выше 1-го.

- id: ice-storm
  name: Ледяной шторм
  description: |-
    *4-й уровень, Воплощение (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 300 футов
    **Компоненты:** В, С, М (варежка)
    **Длительность:** Мгновенная

    Град падает в цилиндре радиусом 20 футов и высотой 40 футов, центр которого находится в точке в пределах дистанции. Каждое существо в цилиндре совершает спасбросок Ловкости. Существо получает 2d10 дробящего урона и 4d6 урона холодом при провале или половину этого урона при успехе.
    Градины превращают землю в цилиндре в труднопроходимую местность до конца вашего следующего хода.

    **Использование ячейки более высокого уровня.** Дробящий урон увеличивается на 1d10 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: Действие
    range: 300 футов
    material: варежка
    duration: Мгновенная
    higherLevel: Дробящий урон увеличивается на 1d10 за каждый уровень ячейки выше 4-го.

- id: identify
  name: Опознание
  description: |-
    *1-й уровень, Прорицание (Бард, Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** Касание
    **Компоненты:** В, С, М (жемчужина стоимостью 100+ зм)
    **Длительность:** Мгновенная

    Вы касаетесь предмета на протяжении всего сотворения заклинания. Если предмет является магическим или иным магическим объектом, вы узнаёте его свойства и способ использования, требует ли он настройки и сколько у него зарядов, если они есть. Вы узнаёте, действуют ли на предмет какие-либо продолжительные заклинания и каковы они. Если предмет создан заклинанием, вы узнаёте название этого заклинания.
    Если вы касаетесь существа на протяжении всего сотворения, вы узнаёте, какие продолжительные заклинания, если такие есть, сейчас на него действуют.
  properties:
    castingTime: 1 минута или Ритуал
    range: Касание
    material: жемчужина стоимостью 100+ зм
    duration: Мгновенная

- id: illusory-script
  name: Иллюзорные письмена
  description: |-
    *1-й уровень, Иллюзия (Бард, Колдун, Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** Касание
    **Компоненты:** С, М (чернила стоимостью 10+ зм, которые заклинание расходует)
    **Длительность:** 10 дней

    Вы пишете на пергаменте, бумаге или другом подходящем материале и наделяете написанное иллюзией, которая действует в течение всей длительности. Для вас и для существ, которых вы укажете при сотворении, надпись выглядит обычной, написанной вашей рукой, и передаёт тот смысл, который вы в неё вложили. Для всех остальных надпись выглядит так, будто она написана неизвестным или магическим шрифтом, который невозможно разобрать. Либо иллюзия может изменить смысл, почерк и язык текста, но язык должен быть тем, который знаете вы.
    Если заклинание рассеяно, исходная надпись и иллюзия исчезают.
    Существо, обладающее истинным зрением, может прочитать скрытое послание.
  properties:
    castingTime: 1 минута или Ритуал
    range: Касание
    material: чернила стоимостью 10+ зм, которые заклинание расходует
    duration: 10 дней

- id: imprisonment
  name: Заточение
  description: |-
    *9-й уровень, Ограждение (Колдун, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (статуэтка цели стоимостью 5,000+ зм)
    **Длительность:** До рассеивания

    Вы создаёте магическую преграду, чтобы удержать существо, которое видите в пределах дистанции. Цель должна совершить спасбросок Мудрости. При успехе цель не затронута и на следующие 24 часа становится невосприимчивой к этому заклинанию. При провале цель заточается. Пока цель заточена, она не нуждается в воздухе, пище и питье и не стареет. Заклинания прорицания не могут обнаружить или воспринять заточённую цель, а цель не может телепортироваться.
    Пока заклинание действует, на цель также действует один из следующих эффектов по вашему выбору. Захоронение. Цель захоронена под землёй в полом шаре из силового поля, который лишь немного больше самой цели. Ничто не может пройти внутрь или наружу шара. Цепи. Цепи, прочно укреплённые в земле, удерживают цель на месте. Цель получает состояние «Опутанный» и не может быть перемещена никаким способом. Огороженная тюрьма. Цель заперта в демиплане, защищённом от телепортации и межпланарных перемещений. Демиплан по вашему выбору может быть лабиринтом, клеткой, башней или чем-то подобным. Миниатюрное заключение. Цель становится 1 дюйм ростом и заключена в неразрушимый драгоценный камень или похожий объект. Свет может проходить сквозь камень (позволяя цели видеть наружу, а другим существам видеть внутрь), но ничто другое не может пройти сквозь него никаким способом. Сон. Цель получает состояние «Без сознания» и не может быть разбужена.
    Окончание действия заклинания. Когда вы сотворяете заклинание, укажите условие, которое его прекратит. Условие может быть простым или сложным, по вашему выбору, но Мастер должен согласиться, что оно с высокой вероятностью произойдёт в течение ближайшего десятилетия. Условие должно быть наблюдаемым действием, например, кто-то совершит определённое подношение в храме вашего бога, спасёт вашу истинную любовь или победит конкретного монстра.
    Заклинание Рассеивание магии может прекратить действие этого заклинания, только если оно сотворено ячейкой 9-го уровня и направлено либо на темницу, либо на компонент, использованный для её создания.
  properties:
    castingTime: 1 минута
    range: 30 футов
    material: статуэтка цели стоимостью 5,000+ зм
    duration: До рассеивания

- id: incendiary-cloud
  name: Испепеляющее облако
  description: |-
    *8-й уровень, Вызов (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вихрящееся облако из искр и дыма заполняет сферу радиусом 20 футов с центром в точке в пределах дистанции. Область облака сильно затемнена. Облако действует в течение всей длительности или до тех пор, пока сильный ветер (например, создаваемый заклинанием Порыв ветра) его не рассеет.
    Когда облако появляется, каждое существо в нём совершает спасбросок Ловкости и получает 10d8 урона огнём при провале или половину этого урона при успехе. Существо также совершает этот спасбросок, когда сфера перемещается в его пространство, а также когда оно входит в сферу или заканчивает в ней свой ход. Существо совершает этот спасбросок только один раз за ход.
    Облако перемещается на 10 футов от вас в направлении, которое вы выбираете в начале каждого вашего хода.
  properties:
    castingTime: Действие
    range: 150 футов
    duration: Концентрация, до 1 минуты

- id: inflict-wounds
  name: Нанесение ран
  description: |-
    *1-й уровень, Некромантия (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Существо, которого вы касаетесь, совершает спасбросок Телосложения, получая 2d10 некротического урона при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Действие
    range: Касание
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 1-го.

- id: insect-plague
  name: Чума насекомых
  description: |-
    *5-й уровень, Вызов (Жрец, Друид, Чародей)*

    **Время сотворения:** Действие
    **Дистанция:** 300 футов
    **Компоненты:** В, С, М (саранча)
    **Длительность:** Концентрация, до 10 минут

    Роящаяся саранча заполняет сферу радиусом 20 футов с центром в выбранной вами точке в пределах дистанции. Сфера остаётся на протяжении всей длительности, а её область считается слабо затемнённой и труднопроходимой местностью.
    Когда рой появляется, каждое существо в нём совершает спасбросок Телосложения и получает 4d10 колющего урона при провале или половину этого урона при успехе. Существо также совершает этот спасбросок, когда впервые входит в область заклинания в течение хода или заканчивает там свой ход. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 5-го.
  properties:
    castingTime: Действие
    range: 300 футов
    material: саранча
    duration: Концентрация, до 10 минут
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 5-го.
- id: instant-summons
  name: Мгновенный призыв
  description: |-
    *6-й уровень, Вызов (Волшебник)*

    **Время сотворения:** 1 минута или Ритуал
    **Дистанция:** Касание
    **Компоненты:** В, С, М (сапфир стоимостью 1,000+ зм)
    **Длительность:** До рассеивания

    Вы касаетесь сапфира, использованного при сотворении, и предмета весом 10 фунтов или меньше, наибольший размер которого 6 футов или меньше. Заклинание оставляет на этом предмете невидимую метку и незаметно выгравировывает название предмета на сапфире. При каждом сотворении этого заклинания вы должны использовать другой сапфир.
    Затем вы можете потратить магическое действие, чтобы произнести название предмета и раздавить сапфир. Предмет мгновенно появляется у вас в руке независимо от физических или планарных расстояний, и заклинание заканчивается.
    Если другое существо держит или несёт этот предмет, раздавливание сапфира не переносит его, а вместо этого вы узнаёте, кто это существо и где оно сейчас находится.
  properties:
    castingTime: 1 минута
    range: Касание
    material: сапфир стоимостью 1,000+ зм
    duration: До рассеивания
- id: invisibility
  name: Невидимость
  description: |-
    *2-й уровень, Иллюзия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (ресница в гуммиарабике)
    **Длительность:** Концентрация, до 1 часа

    Существо, которого вы касаетесь, получает состояние Невидимый до окончания заклинания. Заклинание заканчивается досрочно сразу после того, как цель совершает бросок атаки, наносит урон или сотворяет заклинание.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинания выше 2-го.
  properties:
    castingTime: Действие
    range: Касание
    material: ресница в гуммиарабике
    duration: до 1 часа
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинания выше 2-го.
- id: irresistible-dance
  name: Неодолимый танец
  description: |-
    *6-й уровень, Очарование (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В
    **Длительность:** Концентрация, до 1 минуты

    Одно существо, которое вы видите в пределах дистанции, должно совершить спасбросок Мудрости. При успешном спасброске цель комично танцует до конца своего следующего хода, и в это время она должна потратить всё перемещение на танец на месте.
    При провале спасброска цель получает состояние Очарованный на время действия заклинания. Пока цель Очарована, она комично танцует, должна потратить всё перемещение на танец на месте и совершает с помехой спасброски Ловкости и броски атаки, а другие существа совершают броски атаки против неё с преимуществом. В каждом своём ходу цель может потратить действие, чтобы собраться с мыслями и повторить спасбросок; при успехе заклинание заканчивается для неё.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты
- id: jump
  name: Прыжок
  description: |-
    *1-й уровень, Преобразование (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (задняя нога кузнечика)
    **Длительность:** 1 минута

    Вы касаетесь добровольного существа. Один раз в каждом его ходу до окончания заклинания это существо может прыгнуть на расстояние до 30 футов, потратив 10 футов перемещения.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинания выше 1-го.
  properties:
    castingTime: Бонусное действие
    range: Касание
    material: задняя нога кузнечика
    duration: 1 минута
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинания выше 1-го.
- id: knock
  name: Отпирание
  description: |-
    *2-й уровень, Преобразование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    Выберите предмет, который вы видите в пределах дистанции. Предметом может быть дверь, ящик, сундук, набор наручников, навесной замок или другой предмет, в котором есть обычное или магическое средство, препятствующее доступу.
    Цель, которая заперта обычным замком, застряла или закрыта на засов, отпирается, освобождается или открывает засов. Если на предмете несколько замков, открывается только один из них.
    Если цель заперта заклинанием «Волшебный замок», то это заклинание подавляется на 10 минут, в течение которых цель можно открывать и закрывать.
    При сотворении этого заклинания из цели раздаётся громкий стук, слышимый на расстоянии до 300 футов.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: legend-lore
  name: Знание легенд
  description: |-
    *5-й уровень, Прорицание (Бард, Жрец, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** На себя
    **Компоненты:** В, С, М (благовония стоимостью 250+ зм, которые заклинание расходует, и четыре костяные пластинки стоимостью по 50+ зм каждая)
    **Длительность:** Мгновенная

    Назовите или опишите знаменитого человека, место или предмет. Заклинание даёт вам краткую сводку значимых преданий об этом знаменитом объекте, как их определяет Мастер.
    Предания могут содержать важные подробности, забавные открытия или даже тайные знания, которые никогда широко не были известны. Чем больше вы уже знаете об этом объекте, тем точнее и подробнее будут полученные сведения. Эта информация достоверна, но может быть изложена образным языком или в стихах, как решит Мастер.
    Если выбранный вами знаменитый объект на самом деле не знаменит, вы услышите грустные звуки, сыгранные на тромбоне, и заклинание провалится.
  properties:
    castingTime: 10 минут
    range: На себя
    material: благовония стоимостью 250+ зм, которые заклинание расходует, и четыре костяные пластинки стоимостью по 50+ зм каждая
    duration: Мгновенная
- id: lesser-restoration
  name: Малое восстановление
  description: |-
    *2-й уровень, Ограждение (Бард, Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** Касание
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы касаетесь существа и устраняете на нём одно состояние: Ослеплённый, Оглохший, Парализованный или Отравленный.
  properties:
    castingTime: Бонусное действие
    range: Касание
    duration: Мгновенная
- id: levitate
  name: Левитация
  description: |-
    *2-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (металлическая пружина)
    **Длительность:** Концентрация, до 10 минут

    Одно существо или свободный предмет по вашему выбору, который вы видите в пределах дистанции, поднимается вертикально на 20 футов и остаётся парящим там на время действия заклинания. Заклинание может поднять предмет весом до 500 фунтов. Нежелающее существо, которое успешно проходит спасбросок Телосложения, не испытывает на себе действия заклинания.
    Цель может перемещаться, только отталкиваясь или подтягиваясь от неподвижного предмета или поверхности в пределах досягаемости (например, стены или потолка), что позволяет ей двигаться так, будто она лезет. Вы можете изменить высоту цели на 20 футов в любом направлении в свой ход. Если целью являетесь вы, вы можете подниматься или опускаться как часть своего перемещения. В остальных случаях вы можете потратить магическое действие, чтобы переместить цель, которая должна оставаться в пределах дистанции заклинания.
    Когда заклинание заканчивается, цель мягко опускается на землю, если всё ещё находится в воздухе.
  properties:
    castingTime: Действие
    range: 60 футов
    material: металлическая пружина
    duration: до 10 минут
- id: light
  name: Свет
  description: |-
    *Заговор Воплощения (Бард, Жрец, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, М (светлячок или фосфоресцирующий мох)
    **Длительность:** 1 час

    Вы касаетесь одного предмета размером с Большой или меньше, который не надет и не переносится другим существом. До окончания заклинания предмет испускает яркий свет в радиусе 20 футов и тусклый свет ещё на 20 футов дальше. Свет может быть любого цвета по вашему выбору.
    Если накрыть предмет чем-то непрозрачным, свет блокируется. Заклинание заканчивается, если вы сотворите его снова.
  properties:
    castingTime: Действие
    range: Касание
    material: светлячок или фосфоресцирующий мох
    duration: 1 час
- id: lightning-bolt
  name: Молния
  description: |-
    *3-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (кусочек меха и кристаллический стержень)
    **Длительность:** Мгновенная

    Удар молнии, образующий Линию длиной 100 футов и шириной 5 футов, вырывается из вас в выбранном вами направлении. Каждое существо в Линии совершает спасбросок Ловкости, получая 8d6 урона электричеством при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 3-го.
  properties:
    castingTime: Действие
    range: На себя
    material: кусочек меха и кристаллический стержень
    duration: Мгновенная
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 3-го.
- id: locate-animals-or-plants
  name: Поиск животных или растений
  description: |-
    *2-й уровень, Прорицание (Бард, Друид, Следопыт)*

    **Время сотворения:** Действие или Ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С, М (шерсть ищейки)
    **Длительность:** Мгновенная

    Опишите или назовите конкретный вид Зверя, растительного существа или немагического растения. Вы узнаёте направление и расстояние до ближайшего существа или растения такого вида в пределах 5 миль, если такие есть поблизости.
  properties:
    castingTime: Действие
    range: На себя
    material: шерсть ищейки
    duration: Мгновенная
- id: locate-creature
  name: Поиск существа
  description: |-
    *4-й уровень, Прорицание (Бард, Жрец, Друид, Паладин, Следопыт, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (шерсть ищейки)
    **Длительность:** Концентрация, до 1 часа

    Опишите или назовите существо, которое вам знакомо. Вы ощущаете направление к его местонахождению, если оно находится в пределах 1,000 футов от вас. Если существо движется, вы знаете направление его движения.
    Заклинание может найти конкретное известное вам существо или ближайшее существо определённого вида (например, человека или единорога), если вы хотя бы раз видели такое существо вблизи, в пределах 30 футов. Если существо, которое вы описали или назвали, находится в другом облике, например под действием заклинания «Плоть в камень» или «Превращение», это заклинание не найдёт его.
    Это заклинание не может найти существо, если любой слой свинца преграждает прямой путь между вами и существом.
  properties:
    castingTime: Действие
    range: На себя
    material: шерсть ищейки
    duration: до 1 часа
- id: locate-object
  name: Поиск предмета
  description: |-
    *2-й уровень, Прорицание (Бард, Жрец, Друид, Паладин, Следопыт, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (раздвоенная веточка)
    **Длительность:** Концентрация, до 10 минут

    Опишите или назовите предмет, который вам знаком. Вы чувствуете направление к его местоположению, если он находится в пределах 1,000 футов от вас. Если предмет движется, вы знаете направление его движения.
    Заклинание может найти конкретный предмет, известный вам, если вы видели его вблизи, в пределах 30 футов, хотя бы раз. Также оно может найти ближайший предмет определённого вида, например определённый вид одежды, украшения, мебели, инструмента или оружия.
    Это заклинание не может найти предмет, если какой-либо слой свинца блокирует прямой путь между вами и предметом.
  properties:
    castingTime: Действие
    range: На себя
    material: раздвоенная веточка
    duration: до 10 минут
- id: longstrider
  name: Длинношаг
  description: |-
    *1-й уровень, Преобразование (Бард, Друид, Следопыт, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (щепотка земли)
    **Длительность:** 1 час

    Вы касаетесь существа. Скорость цели увеличивается на 10 футов до окончания заклинания.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинаний выше 1.
  properties:
    castingTime: Действие
    range: Касание
    material: щепотка земли
    duration: 1 час
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинаний выше 1.
- id: mage-armor
  name: Доспех мага
  description: |-
    *1-й уровень, Ограждение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (кусок выделанной кожи)
    **Длительность:** 8 часов

    Вы касаетесь добровольного существа, которое не носит доспехов. До окончания заклинания базовый Класс Брони цели становится равен 13 + модификатор Ловкости этого существа. Заклинание заканчивается досрочно, если цель надевает доспех.
  properties:
    castingTime: Действие
    range: Касание
    material: кусок выделанной кожи
    duration: 8 часов
- id: mage-hand
  name: Волшебная рука
  description: |-
    *Заговор Вызова (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** 1 минута

    Парящая призрачная рука появляется в выбранной вами точке в пределах дистанции. Рука существует в течение длительности. Она исчезает, если окажется дальше 30 футов от вас или если вы сотворите это заклинание снова.
    Когда вы сотворяете заклинание, вы можете использовать руку, чтобы манипулировать предметом, открыть незапертую дверь или контейнер, убрать предмет в открытый контейнер или достать его оттуда либо вылить содержимое флакона.
    Магическим действием в свои последующие ходы вы можете снова управлять рукой. В рамках этого действия вы можете переместить руку на расстояние до 30 футов.
    Рука не может атаковать, активировать магические предметы или переносить более 10 фунтов.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 1 минута
- id: magic-circle
  name: Магический круг
  description: |-
    *3-й уровень, Ограждение (Жрец, Паладин, Колдун, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (соль и порошок серебра стоимостью 100+ зм, которые заклинание поглощает)
    **Длительность:** 1 час

    Вы создаёте цилиндр магической энергии радиусом 10 футов и высотой 20 футов с центром в точке на земле, которую вы видите в пределах дистанции. Светящиеся руны появляются там, где цилиндр пересекается с полом или другой поверхностью.
    Выберите один или несколько из следующих типов существ: Небожители, Элементали, Феи, Исчадия или Нежить. Круг действует на существа выбранного типа следующим образом: • существо не может добровольно войти в цилиндр неволшебными способами. Если оно пытается воспользоваться телепортацией или межпланарным перемещением, чтобы войти, сначала оно должно преуспеть в спасброске Харизмы. • существо совершает броски атаки с помехой против целей внутри цилиндра. • цели внутри цилиндра не могут быть одержимы этим существом или получить от него состояние «Очарованный» или «Испуганный».
    Каждый раз, когда вы сотворяете это заклинание, вы можете заставить его магию работать в обратном направлении, не позволяя существу выбранного типа покидать цилиндр и защищая цели за его пределами.

    **Использование ячейки более высокого уровня.** Длительность увеличивается на 1 час за каждый уровень ячейки заклинаний выше 3.
  properties:
    castingTime: 1 минута
    range: 10 футов
    material: соль и порошок серебра стоимостью 100+ зм, которые заклинание поглощает
    duration: 1 час
    higherLevel: Длительность увеличивается на 1 час за каждый уровень ячейки заклинаний выше 3.
- id: magic-jar
  name: Магический сосуд
  description: |-
    *6-й уровень, Некромантия (Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** На себя
    **Компоненты:** В, С, М (драгоценный камень, кристалл или реликварий стоимостью 500+ зм)
    **Длительность:** до рассеивания

    Ваше тело впадает в каталептическое состояние, когда душа покидает его и входит в сосуд, который вы использовали как материальный компонент заклинания. Пока ваша душа находится в сосуде, вы осознаёте окружение так, будто находитесь в пространстве сосуда. Вы не можете двигаться или совершать реакции. Единственное действие, которое вы можете совершить, — отправить душу из сосуда на расстояние до 100 футов: либо вернуться в своё живое тело (и тем самым закончить заклинание), либо попытаться овладеть телом гуманоида.
    Вы можете попытаться овладеть телом любого гуманоида в пределах 100 футов от вас, которого вы видите (существа, защищённые заклинаниями «Защита от зла и добра» или «Магический круг», овладеть не могут). Цель совершает спасбросок Харизмы. При провале душа вашего существа входит в тело цели, а душа цели оказывается заперта в сосуде. При успешном спасброске цель сопротивляется вашим попыткам овладеть ею, и вы не можете повторить попытку в отношении неё в течение 24 часов.
    После того как вы овладели телом существа, вы управляете им. Ваши очки здоровья, кости Хитов, Сила, Ловкость, Телосложение, Скорость и органы чувств заменяются характеристиками этого существа. В остальном вы сохраняете свои игровые показатели.
    Тем временем душа одержимого существа может воспринимать происходящее из сосуда своими чувствами, но не может двигаться и находится в состоянии «Выведенный из строя».
    Пока вы находитесь в чужом теле, вы можете совершить Магическое действие, чтобы вернуться из тела-носителя в сосуд, если он находится в пределах 100 футов от вас, и вернуть душу существа в его тело. Если тело-носитель умирает, пока вы в нём, существо погибает, и вы совершаете спасбросок Харизмы против Сложности спасброска ваших заклинаний. При успехе вы возвращаетесь в сосуд, если он находится в пределах 100 футов от вас. В противном случае вы погибаете.
    Если сосуд уничтожен или заклинание заканчивается, ваша душа возвращается в ваше тело. Если ваше тело находится дальше 100 футов от вас или мертво, вы погибаете. Если в уничтоженном сосуде находится душа другого существа, она возвращается в своё тело, если тело живо и находится в пределах 100 футов. В противном случае это существо погибает. Когда заклинание заканчивается, сосуд уничтожается.
  properties:
    castingTime: 1 минута
    range: На себя
    material: драгоценный камень, кристалл или реликварий стоимостью 500+ зм
    duration: до рассеивания
- id: magic-missile
  name: Волшебная стрела
  description: |-
    *1-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** мгновенная

    Вы создаёте три светящихся дротика из магической силы. Каждый дротик поражает существо по вашему выбору, которое вы видите в пределах дистанции. Дротик наносит своей цели 1d4 + 1 урона силовым полем. Дротики поражают одновременно, и вы можете направить их на одно существо или на несколько.

    **Использование ячейки более высокого уровня.** Заклинание создаёт один дополнительный дротик за каждый уровень ячейки заклинаний выше 1.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: мгновенная
    higherLevel: Заклинание создаёт один дополнительный дротик за каждый уровень ячейки заклинаний выше 1.
- id: magic-mouth
  name: Волшебные уста
  description: |-
    *2-й уровень, Иллюзия (Бард, Волшебник)*

    **Время сотворения:** 1 минута или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (порошок нефрита стоимостью 10+ зм, который заклинание поглощает)
    **Длительность:** до рассеивания

    Вы внедряете послание в предмет в пределах дистанции: послание произносится, когда выполняется условие срабатывания. Выберите предмет, который вы видите и который не надет и не удерживается другим существом. Затем произнесите послание не длиннее 25 слов, хотя произносить его можно растянуть до 10 минут. Наконец, определите обстоятельство, которое запустит заклинание и передачу вашего послания.
    Когда это условие выполняется, на предмете появляется магический рот и произносит послание вашим голосом и с той же громкостью, с которой вы его говорили. Если у выбранного предмета есть рот или что-то похожее на рот (например, рот статуи), магический рот появляется там, и слова кажутся исходящими из его рта. Когда вы сотворяете это заклинание, вы можете задать, чтобы оно закончилось после передачи послания, или чтобы оно осталось и повторяло послание каждый раз, когда сработает условие.
    Условие срабатывания может быть любым, общим или подробным, но оно должно основываться на видимых или слышимых обстоятельствах, которые происходят в пределах 30 футов от предмета. Например, вы можете задать, чтобы рот заговорил, когда любое существо приблизится к предмету на расстояние 30 футов, или когда в пределах 30 футов от него зазвенит серебряный колокольчик.
  properties:
    castingTime: 1 минута или ритуал
    range: 30 футов
    material: порошок нефрита стоимостью 10+ зм, который заклинание поглощает
    duration: до рассеивания
- id: magic-weapon
  name: Магическое оружие
  description: |-
    *2-й уровень, Преобразование (Паладин, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** Касание
    **Компоненты:** В, С
    **Длительность:** 1 час

    Вы касаетесь немагического оружия. До окончания заклинания это оружие становится магическим, с бонусом +1 к броскам атаки и урону. Заклинание заканчивается досрочно, если вы сотворите его снова.

    **Использование ячейки более высокого уровня.** Бонус увеличивается до +2 при использовании ячейки 3-го–5-го уровня. Бонус увеличивается до +3 при использовании ячейки 6-го уровня или выше.
  properties:
    castingTime: Бонусное действие
    range: Касание
    duration: 1 час
    higherLevel: Бонус увеличивается до +2 при использовании ячейки 3-го–5-го уровня. Бонус увеличивается до +3 при использовании ячейки 6-го уровня или выше.
- id: magnificent-mansion
  name: Великолепный особняк
  description: |-
    *7-й уровень, Вызов (Бард, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 300 футов
    **Компоненты:** В, С, М (миниатюрная дверь стоимостью 15+ зм)
    **Длительность:** 24 часа

    Вы создаёте в пределах дистанции мерцающую дверь, которая существует в течение длительности. Дверь ведёт в надпространственное жилище и имеет ширину 5 футов и высоту 10 футов. Вы и любое существо, которое вы назначите при сотворении заклинания, можете входить в жилище, пока дверь открыта. Вы можете открыть или закрыть её (действие не требуется), если находитесь в пределах 30 футов от неё. Когда дверь закрыта, она незаметна.
    За дверью находится великолепное фойе с множеством комнат. Атмосфера в жилище чистая, свежая и тёплая.
    Вы можете создать любой план жилища, но он не может превышать 50 смежных кубов со стороной 10 футов. Жилище обставлено и украшено по вашему выбору. В нём достаточно еды, чтобы накрыть девятиблюдный пир на 100 человек. Мебель и другие предметы, созданные этим заклинанием, рассеиваются в дым, если их вынести из жилища.
    Штат из 100 почти прозрачных слуг встречает всех, кто входит. Вы определяете их внешность и одеяние. Слуги неуязвимы и повинуются вашим приказам. Каждый из них может выполнять задачи, которые под силу человеку, но не может атаковать или совершать действия, которые напрямую вредят другому существу. Таким образом, слуги могут приносить вещи, убирать, чинить, складывать одежду, разжигать огонь, подавать еду, наливать вино и так далее. Слуги не могут покидать жилище.
    Когда заклинание заканчивается, все существа и предметы, оставшиеся внутри надпространственного пространства, выталкиваются в свободные пространства, ближайшие к входу.
  properties:
    castingTime: 1 минута
    range: 300 футов
    material: миниатюрная дверь стоимостью 15+ зм
    duration: 24 часа
- id: major-image
  name: Большая иллюзия
  description: |-
    *3-й уровень, Иллюзия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (клочок шерсти)
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте образ предмета, существа или иного видимого явления, размер которого не превышает куба со стороной 20 футов. Образ появляется в видимом вам месте в пределах дистанции и существует в течение длительности. Он выглядит настоящим, включая звуки, запахи и температуру, соответствующие изображаемому, но не может наносить урон или вызывать состояния.
    Если вы находитесь в пределах дистанции от иллюзии, вы можете совершить Магическое действие, чтобы переместить образ в любое другое место в пределах дистанции. Меняя место, вы можете изменить образ так, чтобы его движения выглядели естественно. Например, если вы создали образ существа и переместили его, вы можете изменить образ так, чтобы казалось, будто оно идёт. Аналогично вы можете заставить иллюзию издавать разные звуки в разное время, даже вести беседу.
    Физическое взаимодействие с образом выдаёт в нём иллюзию, так как предметы могут проходить сквозь него. Существо, которое совершает действие «Изучение», чтобы осмотреть образ, может определить, что это иллюзия, успешной проверкой Интеллекта (Расследование) против Сложности спасброска ваших заклинаний. Если существо распознало иллюзию, оно может видеть сквозь образ, а его прочие органы чувств начинают воспринимать образ слабо.

    **Использование ячейки более высокого уровня.** Заклинание длится до рассеивания, не требуя Концентрации, если сотворено с использованием ячейки 4-го уровня или выше.
  properties:
    castingTime: Действие
    range: 120 футов
    material: клочок шерсти
    duration: до 10 минут
    higherLevel: Заклинание длится до рассеивания, не требуя Концентрации, если сотворено с использованием ячейки 4-го уровня или выше.
- id: mass-cure-wounds
  name: Массовое лечение ран
  description: |-
    *5-й уровень, Ограждение (Бард, Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** мгновенная

    Волна исцеляющей энергии расходится из точки, которую вы видите в пределах дистанции. Выберите до шести существ в Сфере радиусом 30 футов с центром в этой точке. Каждая цель восстанавливает очки здоровья, равные 5d8 + ваш модификатор характеристики заклинаний.

    **Использование ячейки более высокого уровня.** Исцеление увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 5.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: мгновенная
    higherLevel: Исцеление увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 5.
- id: mass-heal
  name: Массовое исцеление
  description: |-
    *9-й уровень, Ограждение (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Поток целительной энергии течёт из вас к существам вокруг. Вы восстанавливаете до 700 очков здоровья, распределяя их по своему выбору между любым количеством существ, которых вы видите в пределах дистанции. С существ, исцелённых этим заклинанием, также снимаются состояния «Ослеплённый», «Оглохший» и «Отравленный».
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Мгновенная"

- id: mass-healing-word
  name: Массовое исцеляющее слово
  description: |-
    *3-й уровень, Ограждение (Бард, Жрец)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 60 футов
    **Компоненты:** V
    **Длительность:** Мгновенная

    До шести существ по вашему выбору, которых вы видите в пределах дистанции, восстанавливают очки здоровья, равные 2d4 плюс ваш модификатор характеристики заклинаний.

    **Использование ячейки более высокого уровня.** Исцеление увеличивается на 1d4 за каждый уровень ячейки выше 3-го.
  properties:
    castingTime: "Бонусное действие"
    range: "60 футов"
    duration: "Мгновенная"
    higherLevel: "Исцеление увеличивается на 1d4 за каждый уровень ячейки выше 3-го."

- id: mass-suggestion
  name: Массовое внушение
  description: |-
    *6-й уровень, Очарование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S, M (язык змеи)
    **Длительность:** 24 часа

    Вы внушаете курс действий — описанный не более чем в 25 словах — до двенадцати или менее существ, которых вы видите в пределах дистанции и которые могут вас слышать и понимать. Внушение должно звучать выполнимым и не должно предполагать ничего, что явно нанесёт урон любой из целей или их союзникам. Например, вы можете сказать: «Иди в деревню по этой дороге и помогай тамошним жителям собирать урожай до заката». Или вы можете сказать: «Сейчас не время для насилия. Бросайте оружие и танцуйте! Остановитесь через час».
    Каждая цель должна преуспеть в спасброске Мудрости, иначе на время действия или до тех пор, пока вы или ваши союзники не нанесёте цели урон, она получит состояние «Очарованный». Каждая очарованная цель следует внушению по мере своих способностей. Внушённое действие может продолжаться всё время действия заклинания, но если его можно завершить быстрее, заклинание прекращает действовать для цели, как только она его завершит.

    **Использование ячейки более высокого уровня.** Заклинание длится дольше при использовании ячейки 7-го уровня (10 дней), 8-го уровня (30 дней) или 9-го уровня (366 дней).
  properties:
    castingTime: "Действие"
    range: "60 футов"
    material: "язык змеи"
    duration: "24 часа"
    higherLevel: "Заклинание длится дольше при использовании ячейки 7-го уровня (10 дней), 8-го уровня (30 дней) или 9-го уровня (366 дней)."

- id: maze
  name: Лабиринт
  description: |-
    *8-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 10 минут

    Вы отправляете существо, которое вы видите в пределах дистанции, в лабиринтоподобный демиплан. Цель остаётся там на протяжении действия заклинания или пока не выберется из лабиринта.
    Цель может совершить действие «Изучение», чтобы попытаться выбраться. Для этого она делает проверку Интеллекта (Расследование) Сл 20. При успехе она выбирается, и заклинание прекращает действовать.
    Когда заклинание заканчивается, цель появляется в том пространстве, которое покинула, или, если оно занято, в ближайшем свободном пространстве.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "до 10 минут"

- id: meld-into-stone
  name: Слияние с камнем
  description: |-
    *3-й уровень, Преобразование (Жрец, Друид, Следопыт)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** 8 часов

    Вы входите в каменный предмет или поверхность, достаточно большие, чтобы полностью вместить ваше тело, и на время действия заклинания сливаетесь с камнем вместе со своим снаряжением. Чтобы это сделать, вы должны коснуться камня. Ничто в вашем присутствии не остаётся видимым или обнаруживаемым чувствами, не связанными с магией.
    Пока вы слились с камнем, вы не видите, что происходит за его пределами, а проверки Мудрости (Внимательность), которые вы делаете, чтобы услышать звуки снаружи, совершаются с помехой. Вы сохраняете ощущение течения времени и можете сотворять заклинания на себя, находясь в камне. Вы можете использовать 5 футов перемещения, чтобы выйти из камня в том месте, где вошли, — это прекращает действие заклинания. В остальном вы не можете перемещаться.
    Небольшие физические повреждения камня вам не вредят, но его частичное разрушение или изменение формы (настолько, что вы больше в него не помещаетесь) выталкивает вас наружу и наносит вам 6d6 урона силовым полем. Полное разрушение камня (или его превращение в другое вещество) выталкивает вас наружу и наносит вам 50 урона силовым полем. Если вас вытолкнуло, вы перемещаетесь в ближайшее к месту входа свободное пространство и получаете состояние «Лежащий ничком».
  properties:
    castingTime: "Действие или ритуал"
    range: "Касание"
    duration: "8 часов"

- id: mending
  name: Починка
  description: |-
    *Заговор Преобразования (Бард, Жрец, Друид, Чародей, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** Касание
    **Компоненты:** V, S, M (два магнетита)
    **Длительность:** Мгновенная

    Это заклинание исправляет одну трещину или разрыв в предмете, которого вы касаетесь, например сломанное звено цепи, две половинки сломанного ключа, порванный плащ или дырявый бурдюк с вином. Пока трещина или разрыв не превышает 1 фута в любом измерении, вы устраняете его, не оставляя следов прежнего повреждения.
    Это заклинание может физически починить магический предмет, но не может вернуть магию такому предмету.
  properties:
    castingTime: "1 минута"
    range: "Касание"
    material: "два магнетита"
    duration: "Мгновенная"

- id: message
  name: Послание
  description: |-
    *Заговор Преобразования (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** S, M (медная проволока)
    **Длительность:** 1 раунд

    Вы указываете на существо в пределах дистанции и шёпотом передаёте ему послание. Цель (и только она) слышит послание и может ответить шёпотом, который слышите только вы.
    Вы можете сотворить это заклинание сквозь твёрдые предметы, если знакомы с целью и знаете, что она находится за преградой. Магическая тишина, 1 фут камня, металла или дерева либо тонкий лист свинца блокируют заклинание.
  properties:
    castingTime: "Действие"
    range: "120 футов"
    material: "медная проволока"
    duration: "1 раунд"

- id: meteor-swarm
  name: Метеоритный рой
  description: |-
    *9-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 1 миля
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Пылающие сферы огня падают на землю в четырёх разных точках, которые вы видите в пределах дистанции. Каждое существо в сфере радиусом 40 футов с центром в каждой из этих точек совершает спасбросок Ловкости. Существо получает 20d6 урона огнём и 20d6 урона дробящим при провале или половину этого урона при успехе. Существо, находящееся в области нескольких огненных сфер, получает урон только один раз.
    Немагический предмет, который не надет и не несётся, также получает урон, если находится в области заклинания, и начинает гореть, если он горючий.
  properties:
    castingTime: "Действие"
    range: "1 миля"
    duration: "Мгновенная"

- id: mind-blank
  name: Пустой разум
  description: |-
    *8-й уровень, Ограждение (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** 24 часа

    Пока заклинание действует, одно добровольное существо, которого вы касаетесь, имеет иммунитет к урону психической энергией и состоянию «Очарованный». Цель также не подвержена воздействию всего, что чувствует её эмоции или мировоззрение, читает её мысли или магически обнаруживает её местоположение, и никакое заклинание — даже «Желание» — не может собрать сведения о цели, наблюдать за ней на расстоянии или управлять её разумом.
  properties:
    castingTime: "Действие"
    range: "Касание"
    duration: "24 часа"

- id: mind-spike
  name: Ментальный шип
  description: |-
    *2-й уровень, Прорицание (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** S
    **Длительность:** Концентрация, до 1 часа

    Вы вонзаете шип психической энергии в разум одного существа, которое видите в пределах дистанции. Цель совершает спасбросок Мудрости и получает 3d8 урона психической энергией при провале или половину этого урона при успехе. При провале вы также всегда знаете местоположение цели до окончания заклинания, но только пока вы оба находитесь на одном плане существования. Пока вы обладаете этим знанием, цель не может укрыться от вас, а если она невидима, то не получает от этого состояния никакой выгоды против вас.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: "Действие"
    range: "120 футов"
    duration: "до 1 часа"
    higherLevel: "Урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го."

- id: minor-illusion
  name: Малая иллюзия
  description: |-
    *Заговор Иллюзии (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** S, M (клочок руна)
    **Длительность:** 1 минута

    Вы создаёте звук или образ предмета в пределах дистанции, который сохраняется на время действия. Эффекты каждого варианта описаны ниже. Иллюзия прекращается, если вы сотворите это заклинание снова.
    Если существо совершает действие «Изучение», чтобы рассмотреть звук или образ, оно может определить, что это иллюзия, успешно пройдя проверку Интеллекта (Расследование) против вашей Сложности спасброска заклинания. Если существо распознало иллюзию, для него она становится блёклой.
    Звук. Если вы создаёте звук, его громкость может быть от шёпота до крика. Это может быть ваш голос, чужой голос, рёв льва, бой барабанов или любой другой звук на ваш выбор. Звук продолжается без перерыва всё время действия или вы можете издавать отдельные звуки в разные моменты до окончания заклинания.
    Образ. Если вы создаёте образ предмета — например, стула, грязных следов или небольшого сундука, — он не может быть больше куба со стороной 5 футов. Образ не может создавать звук, свет, запах или любой другой чувственный эффект. Физическое взаимодействие с образом раскрывает его как иллюзию, так как предметы могут проходить сквозь него.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    material: "клочок руна"
    duration: "1 минута"

- id: mirage-arcane
  name: Тайный мираж
  description: |-
    *7-й уровень, Иллюзия (Бард, Друид, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** Прямая видимость
    **Компоненты:** V, S
    **Длительность:** 10 дней

    Вы превращаете местность на участке площадью до 1 квадратной мили так, что она выглядит, звучит, пахнет и даже ощущается как какой-то другой вид местности. Открытые поля или дорогу можно сделать похожими на болото, холм, расселину или другую труднопроходимую или непреодолимую местность. Пруд может показаться лугом, обрыв — пологим склоном, а заросший камнями овраг — широкой и гладкой дорогой.
    Аналогично вы можете изменить внешний вид сооружений или добавить их там, где их нет. Заклинание не маскирует, не скрывает и не добавляет существ.
    Иллюзия включает слуховые, зрительные, осязательные и обонятельные элементы, поэтому она может превратить открытую местность в труднопроходимую (или наоборот) или иным образом затруднять передвижение по области. Любая часть иллюзорной местности (например, камень или палка), вынесенная за пределы области заклинания, немедленно исчезает.
    Существа с Истинным зрением могут видеть сквозь иллюзию до истинного вида местности; однако все остальные элементы иллюзии сохраняются, поэтому, даже осознавая присутствие иллюзии, существо всё равно может физически взаимодействовать с ней.
  properties:
    castingTime: "10 минут"
    range: "Прямая видимость"
    duration: "10 дней"
- id: mirror-image
  name: Зеркальное отображение
  description: |-
    *2-й уровень, Иллюзия (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** 1 минута

    Три иллюзорных двойника вас появляются в вашем пространстве. До окончания заклинания двойники движутся вместе с вами и повторяют ваши действия, меняя положение так, что невозможно понять, какой образ настоящий.
    Каждый раз, когда существо попадает по вам броском атаки в течение действия заклинания, бросьте d6 для каждого из ваших оставшихся двойников. Если хотя бы один из 6-гранных кубиков выпадет 3 или больше, вместо вас поражается один из двойников, и он уничтожается. В остальных случаях двойники игнорируют любой другой урон и эффекты. Заклинание заканчивается, когда уничтожены все три двойника. Существо не подвержено действию этого заклинания, если у него есть состояние Ослеплённый, слепое зрение или истинное зрение.
  properties:
    castingTime: Действие
    range: На себя
    duration: 1 минута

- id: mislead
  name: Ввести в заблуждение
  description: |-
    *5-й уровень, Иллюзия (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** С
    **Длительность:** Концентрация, до 1 часа

    Вы получаете состояние Невидимый в тот же момент, как на месте, где вы стоите, появляется иллюзорный двойник. Двойник существует всё время действия, но невидимость заканчивается сразу после того, как вы совершаете бросок атаки, наносите урон или сотворяете заклинание.
    Магическим действием вы можете переместить иллюзорного двойника на расстояние до двух значений вашей Скорости и заставить его жестикулировать, говорить и вести себя так, как пожелаете. Он нематериален и неуязвим.
    Вы можете видеть его глазами и слышать его ушами, как если бы находились там, где он.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 часа

- id: misty-step
  name: Туманный шаг
  description: |-
    *2-й уровень, Вызов (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Мгновенная

    Окутанные серебристым туманом, вы телепортируетесь на расстояние до 30 футов в незанятое пространство, которое видите.
  properties:
    castingTime: Бонусное действие
    range: На себя
    duration: Мгновенная

- id: modify-memory
  name: Изменение памяти
  description: |-
    *5-й уровень, Очарование (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы пытаетесь изменить воспоминания другого существа. Одно существо в пределах дистанции, которое вы видите, совершает спасбросок Мудрости. Если вы сражаетесь с этим существом, оно совершает спасбросок с преимуществом. При провале спасброска цель получает состояние Очарованный на время действия. Пока цель очарована таким образом, она также получает состояние Выведенный из строя и не осознаёт окружающую обстановку, хотя и может слышать вас. Если цель получает урон или становится целью другого заклинания, это заклинание заканчивается, и воспоминания не изменяются.
    Пока это очарование действует, вы можете изменить память цели о событии, которое она пережила в течение последних 24 часов и которое длилось не более 10 минут. Вы можете полностью стереть память о событии, позволить цели вспомнить его с абсолютной ясностью, изменить детали воспоминания или создать воспоминание о другом событии.
    Вы должны говорить с целью, чтобы описать, как меняются её воспоминания, и она должна понимать ваш язык, чтобы изменённые воспоминания закрепились. Её разум заполняет любые пробелы в деталях вашего описания. Если заклинание закончится до того, как вы опишете изменённые воспоминания, память существа не изменится. В противном случае изменённые воспоминания закрепляются, когда заклинание заканчивается.
    Изменённое воспоминание не обязательно влияет на поведение существа, особенно если оно противоречит его естественным склонностям, мировоззрению или убеждениям. Нелогичное изменённое воспоминание, например ложное воспоминание о том, как существо получало удовольствие от плавания в кислоте, отбрасывается как дурной сон. Мастер может счесть изменённое воспоминание слишком абсурдным, чтобы оно повлияло на существо.
    Заклинание Снятие проклятия или Высшее восстановление, наложенное на цель, восстанавливает её истинное воспоминание.

    **Использование ячейки более высокого уровня.** Вы можете изменить воспоминания цели о событии, которое произошло до 7 дней назад (ячейка 6-го уровня), 30 дней назад (ячейка 7-го уровня), 365 дней назад (ячейка 8-го уровня) или в любой момент прошлого существа (ячейка 9-го уровня).
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты
    higherLevel: Вы можете изменить воспоминания цели о событии, которое произошло до 7 дней назад (ячейка 6-го уровня), 30 дней назад (ячейка 7-го уровня), 365 дней назад (ячейка 8-го уровня) или в любой момент прошлого существа (ячейка 9-го уровня).

- id: moonbeam
  name: Лунный луч
  description: |-
    *2-й уровень, Воплощение (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (лист лунного семени)
    **Длительность:** Концентрация, до 1 минуты

    Серебристый луч бледного света опускается в Цилиндр радиусом 5 футов и высотой 40 футов с центром в точке в пределах дистанции. До окончания заклинания Тусклый свет заполняет Цилиндр, и на последующих ходах вы можете совершить Магическое действие, чтобы переместить Цилиндр на расстояние до 60 футов.
    Когда Цилиндр появляется, каждое существо в нём совершает спасбросок Телосложения. При провале существо получает 2d10 урона излучением, и если существо изменило облик (например, под действием заклинания Превращение), оно возвращается к истинной форме и не может менять облик, пока не покинет Цилиндр. При успешном спасброске существо получает только половину урона. Существо также совершает этот спасбросок, когда область заклинания перемещается в его пространство, и когда оно входит в область заклинания или заканчивает там ход. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки заклинания более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 120 футов
    material: лист лунного семени
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 2-го.

- id: move-earth
  name: Передвижение земли
  description: |-
    *6-й уровень, Преобразование (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (миниатюрная лопатка)
    **Длительность:** Концентрация, до 2 часов

    Выберите участок местности не больше 40 футов с каждой стороны в пределах дистанции. Вы можете придать форму грунту, песку или глине на этом участке любым способом на время действия. Вы можете поднять или опустить высоту участка, выкопать или засыпать траншею, возвести или выровнять стену либо создать столб. Степень таких изменений не может превышать половины наибольшего измерения участка. Например, если вы воздействуете на квадрат 40 футов, вы можете создать столб высотой до 20 футов, поднять или опустить квадрат на 20 футов, выкопать траншею глубиной до 20 футов и так далее. На завершение этих изменений уходит 10 минут. Поскольку преобразование местности происходит медленно, существа на участке обычно не могут оказаться в ловушке или получить травму от движения грунта.
    В конце каждых 10 минут, которые вы тратите на концентрацию на заклинании, вы можете выбрать новый участок местности в пределах дистанции для воздействия.
    Это заклинание не может изменять природный камень или каменные сооружения. Породы и постройки смещаются, чтобы приспособиться к новому рельефу. Если способ изменения местности сделает постройку неустойчивой, она может обрушиться.
    Аналогично, это заклинание не влияет напрямую на рост растений. Перемещённая земля уносит с собой любые растения.
  properties:
    castingTime: Действие
    range: 120 футов
    material: миниатюрная лопатка
    duration: до 2 часов

- id: nondetection
  name: Защита от обнаружения
  description: |-
    *3-й уровень, Ограждение (Бард, Следопыт, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (щепотка алмазной пыли стоимостью 25+ зм, которую заклинание поглощает)
    **Длительность:** 8 часов

    На время действия вы скрываете касаемую вами цель от заклинаний Прорицания. Целью может быть согласное существо, место или предмет размером не больше 10 футов в любом измерении. Цель не может стать объектом никакого заклинания Прорицания и не может быть воспринята через магические сенсоры ясновидения.
  properties:
    castingTime: Действие
    range: Касание
    material: щепотка алмазной пыли стоимостью 25+ зм, которую заклинание поглощает
    duration: 8 часов

- id: pass-without-trace
  name: Путь без следа
  description: |-
    *2-й уровень, Ограждение (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (пепел сожжённой омелы)
    **Длительность:** Концентрация, до 1 часа

    Вы излучаете скрывающую ауру в Эманацию размером 30 футов на время действия. Находясь в ауре, вы и каждое выбранное вами существо получаете бонус +10 к проверкам Ловкости (Скрытность) и не оставляете следов.
  properties:
    castingTime: Действие
    range: На себя
    material: пепел сожжённой омелы
    duration: до 1 часа

- id: passwall
  name: Проход сквозь стену
  description: |-
    *5-й уровень, Преобразование (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (щепотка семян кунжута)
    **Длительность:** 1 час

    В точке, которую вы видите, на деревянной, гипсовой или каменной поверхности (например, стене, потолке или полу) в пределах дистанции появляется проход, который существует всё время действия. Вы выбираете размеры отверстия: до 5 футов в ширину, 8 футов в высоту и 20 футов в глубину. Проход не нарушает устойчивости окружающей его конструкции.
    Когда отверстие исчезает, все существа и предметы, оставшиеся в проходе, созданном заклинанием, безопасно выталкиваются в незанятое пространство, ближайшее к поверхности, на которой вы сотворили заклинание.
  properties:
    castingTime: Действие
    range: 30 футов
    material: щепотка семян кунжута
    duration: 1 час

- id: phantasmal-force
  name: Фантасмальная сила
  description: |-
    *2-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (клочок шерсти)
    **Длительность:** Концентрация, до 1 минуты

    Вы пытаетесь создать иллюзию в разуме существа, которое видите в пределах дистанции. Цель совершает спасбросок Интеллекта. При провале вы создаёте фантасмальный предмет, существо или иное явление размером не больше 10-футового Куба, которое воспринимается только целью на время действия. Фантазм включает звук, температуру и другие раздражители.
    Цель может совершить Действие «Изучение», чтобы осмотреть фантазм с помощью проверки Интеллекта (Расследование) против Сложности спасброска вашего заклинания. Если проверка успешна, цель понимает, что фантазм является иллюзией, и заклинание заканчивается.
    Пока на цель действует заклинание, она воспринимает фантазм как реальный и объясняет любые нелогичные последствия взаимодействия с ним. Например, если цель проходит по фантасмальному мосту и выживает после падения, она считает, что мост существует, а падение вызвало что-то другое.
    Затронутая цель может даже получить урон от иллюзии, если фантазм изображает опасное существо или опасность. В каждый ваш ход такой фантазм может наносить цели 2d8 урона психической энергией, если цель находится в его области или в пределах 5 футов от него. Цель воспринимает урон как тип, соответствующий иллюзии.
  properties:
    castingTime: Действие
    range: 60 футов
    material: клочок шерсти
    duration: до 1 минуты

- id: phantasmal-killer
  name: Фантасмальный убийца
  description: |-
    *4-й уровень, Иллюзия (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы проникаете в кошмары существа, которое видите в пределах дистанции, и создаёте иллюзию его самых глубоких страхов, видимую только этому существу. Цель совершает спасбросок Мудрости. При провале цель получает 4d10 урона психической энергией и имеет помеху к проверкам характеристик и броскам атаки на время действия. При успешном спасброске цель получает половину урона, и заклинание заканчивается.
    На время действия цель совершает спасбросок Мудрости в конце каждого своего хода. При провале она снова получает урон психической энергией. При успешном спасброске заклинание заканчивается.

    **Использование ячейки заклинания более высокого уровня.** Урон увеличивается на 1d10 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d10 за каждый уровень ячейки выше 4-го.

- id: phantom-steed
  name: Фантомный скакун
  description: |-
    *3-й уровень, Иллюзия (Волшебник)*

    **Время сотворения:** 1 минута или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** 1 час

    Большой, полуреальный, похожий на лошадь скакун появляется на земле в незанятом пространстве по вашему выбору в пределах дистанции. Внешний вид вы определяете сами; скакун снабжён седлом, удилами и уздечкой. Любое снаряжение, созданное заклинанием, исчезает в клубе дыма, если его унести дальше чем на 10 футов от скакуна.
    На время действия вы или выбранное вами существо можете ехать на скакуне. Скакун использует блок характеристик «Верховая лошадь» (см. «Существа»), за исключением того, что его Скорость составляет 100 футов, и он может пройти 13 миль за час. Когда заклинание заканчивается, скакун постепенно исчезает, давая всаднику 1 минуту на спешивание. Заклинание заканчивается досрочно, если скакун получает любой урон.
  properties:
    castingTime: 1 минута
    range: 30 футов
    duration: 1 час
- id: planar-ally
  name: Планарный союзник
  description: |-
    *6-й уровень, Вызов (Жрец)*

    **Время сотворения:** 10 минут
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы взываете к потусторонней сущности о помощи. Это существо должно быть вам известно: бог, демонический владыка или иное существо космической мощи. Оно посылает Небожителя, Элементаля или Исчадие, преданное ему, чтобы помочь вам, и существо появляется в свободном пространстве в пределах дистанции. Если вы знаете имя конкретного существа, вы можете произнести это имя при сотворении заклинания, чтобы призвать именно его, однако вы всё равно можете получить другое существо (решает Мастер).
    Когда существо появляется, оно ни к чему не обязано вести себя определённым образом. Вы можете попросить его выполнить услугу в обмен на плату, но оно не обязано соглашаться. Задача может быть простой (перенести нас через пропасть или помочь в битве) или сложной (шпионить за нашими врагами или защищать нас во время вылазки в подземелье). Вы должны уметь общаться с существом, чтобы договориться о его услугах.
    Плата может быть разной. Небожитель может потребовать крупного пожертвования золотом или магическими предметами союзному храму, а Исчадие может потребовать живой жертвы или подарка в виде сокровищ. Некоторые существа могут обменять свою службу на задание, которое выполните вы.
    Задача, измеряемая минутами, требует платы в 100 зм за минуту. Задача, измеряемая часами, требует 1,000 зм за час. А задача, измеряемая днями (до 10 дней), требует 10,000 зм за день. Мастер может корректировать эти суммы в зависимости от обстоятельств, при которых вы сотворяете заклинание. Если задача соответствует мировоззрению существа, плата может быть уменьшена вдвое или даже отменена. Неопасные задачи обычно требуют лишь половины предложенной платы, а особенно опасные могут потребовать большего подарка. Существа редко соглашаются на задачи, которые кажутся самоубийственными.
    Когда существо завершает задачу или когда истекает согласованный срок службы, оно возвращается на свой родной план, по возможности доложив вам. Если вы не можете договориться о цене за службу, существо немедленно возвращается на свой родной план.
  properties:
    castingTime: 10 минут
    range: 60 футов
    duration: Мгновенная
- id: planar-binding
  name: Планарные оковы
  description: |-
    *5-й уровень, Ограждение (Бард, Жрец, Друид, Чернокнижник, Волшебник)*

    **Время сотворения:** 1 час
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (драгоценный камень стоимостью 1,000+ зм, который поглощается заклинанием)
    **Длительность:** 24 часа

    Вы пытаетесь подчинить своей службе Небожителя, Элементаля, Фею или Исчадие. Существо должно находиться в пределах дистанции на протяжении всего сотворения заклинания. (Обычно существо сначала призывается в центр перевёрнутого варианта заклинания Магический круг, чтобы удержать его, пока сотворяется это заклинание.) По завершении сотворения цель должна преуспеть в спасброске Харизмы, иначе она будет связана службой вам на время действия заклинания. Если существо было призвано или создано другим заклинанием, длительность этого заклинания увеличивается до длительности данного заклинания.
    Связанное существо обязано выполнять ваши приказы по мере своих возможностей. Вы можете приказать ему сопровождать вас в приключении, охранять место или доставить сообщение. Если существо враждебно, оно стремится извратить ваши приказы, чтобы достичь собственных целей. Если существо полностью выполнит ваши приказы до окончания заклинания и вы находитесь на том же плане существования, оно придёт к вам и доложит об этом. Если вы находитесь на другом плане, оно вернётся к месту, где вы его связали, и останется там до окончания заклинания.

    **Использование ячейки более высокого уровня.** Длительность увеличивается при использовании ячейки 6-го уровня (10 дней), 7-го (30 дней), 8-го (180 дней) и 9-го (366 дней).
  properties:
    castingTime: 1 час
    range: 60 футов
    material: драгоценный камень стоимостью 1,000+ зм, который поглощается заклинанием
    duration: 24 часа
    higherLevel: Длительность увеличивается при использовании ячейки 6-го уровня (10 дней), 7-го (30 дней), 8-го (180 дней) и 9-го (366 дней).
- id: plane-shift
  name: Смещение плана
  description: |-
    *7-й уровень, Вызов (Жрец, Друид, Чародей, Чернокнижник, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (раздвоенный металлический стержень стоимостью 250+ зм, настроенный на план существования)
    **Длительность:** Мгновенная

    Вы и до восьми добровольцев, которые берутся за руки в круге, переноситесь на другой план существования. Вы можете указать целевое место в общих чертах, например определённый город на Элементальном плане Огня или дворец на втором уровне Девяти Преисподних, и вы появитесь в этом месте или рядом с ним, по решению Мастера.
    Кроме того, если вы знаете последовательность сигилов круга телепортации на другом плане существования, это заклинание может перенести вас к этому кругу. Если круг телепортации слишком мал, чтобы вместить всех перенесённых вами существ, они появляются в ближайших свободных клетках рядом с кругом.
  properties:
    castingTime: Действие
    range: Касание
    material: раздвоенный металлический стержень стоимостью 250+ зм, настроенный на план существования
    duration: Мгновенная
- id: plant-growth
  name: Рост растений
  description: |-
    *3-й уровень, Преобразование (Бард, Друид, Следопыт)*

    **Время сотворения:** Действие (Разрастание) или 8 часов (Обогащение)
    **Дистанция:** 150 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Это заклинание направляет жизненную силу в растения. Время сотворения, которое вы используете, определяет, будет ли заклинание иметь эффект Разрастания или Обогащения, описанные ниже.
    Разрастание. Выберите точку в пределах дистанции. Все обычные растения в сфере радиусом 100 футов с центром в этой точке становятся густыми и заросшими. Существо, которое движется через эту область, должно тратить 4 фута перемещения на каждый 1 фут пути. Вы можете исключить из действия заклинания одну или несколько областей любого размера внутри его области.
    Обогащение. Все растения в радиусе полумили от точки в пределах дистанции обогащаются на 365 дней. Растения дают вдвое больше пищи при сборе урожая. Они могут получить пользу только от одного Роста растений в год.
  properties:
    castingTime: Действие (Разрастание) или 8 часов (Обогащение)
    range: 150 футов
    duration: Мгновенная
- id: poison-spray
  name: Ядовитые брызги
  description: |-
    *Заговор Некромантии (Друид, Чародей, Чернокнижник, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы распыляете ядовитый туман в существо в пределах дистанции. Совершите против цели дальнобойную атаку заклинанием. При попадании цель получает 1d12 урона ядом.
    Улучшение заговора. Урон увеличивается на 1d12, когда вы достигаете 5-го (2d12), 11-го (3d12) и 17-го (4d12) уровня.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: Мгновенная
- id: polymorph
  name: Превращение
  description: |-
    *4-й уровень, Преобразование (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (кокон гусеницы)
    **Длительность:** Концентрация, до 1 часа

    Вы пытаетесь превратить существо, которое видите в пределах дистанции, в Зверя. Цель должна преуспеть в спасброске Мудрости, иначе она изменит облик, приняв форму Зверя на время действия заклинания. Это может быть любой Зверь по вашему выбору, у которого Показатель опасности меньше или равен показателю цели (или уровню цели, если у цели нет Показателя опасности). Игровые характеристики цели заменяются статблоком выбранного Зверя, но цель сохраняет мировоззрение, личность, тип существа, очки здоровья и кости Хитов. См. раздел «Животные» в разделе «Существа» для примеров статблоков Зверей.
    Цель получает временные очки здоровья в количестве, равном очкам здоровья формы Зверя. Эти временные очки здоровья пропадают, если к моменту окончания заклинания они ещё остаются. Заклинание заканчивается досрочно для цели, если у неё не осталось временных очков здоровья.
    Цель ограничена в действиях анатомией своей новой формы, и она не может говорить или сотворять заклинания.
    Снаряжение цели сливается с новой формой. Существо не может использовать или иным образом извлекать пользу из этого снаряжения.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кокон гусеницы
    duration: до 1 часа
- id: power-word-heal
  name: "Слово силы: исцеление"
  description: |-
    *9-й уровень, Очарование (Бард, Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов Компонент: V
    **Компоненты:**
    **Длительность:** Мгновенная

    Волна целительной энергии окутывает одно существо, которое вы видите в пределах дистанции. Цель восстанавливает все свои очки здоровья. Если существо находится в состоянии «Очарованный», «Испуганный», «Парализованный», «Отравленный» или «Ошеломлённый», это состояние прекращается. Если существо находится в состоянии «Лежащий ничком», оно может использовать свою реакцию, чтобы встать.
  properties:
    castingTime: Действие
    range: "60 футов Компонент: V"
    duration: Мгновенная
- id: power-word-kill
  name: "Слово силы: смерть"
  description: |-
    *9-й уровень, Очарование (Бард, Чародей, Чернокнижник, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов Компонент: V
    **Компоненты:**
    **Длительность:** Мгновенная

    Вы принуждаете одно существо, которое видите в пределах дистанции, умереть. Если у цели 100 очков здоровья или меньше, она умирает. В противном случае она получает 12d12 урона психической энергией.
  properties:
    castingTime: Действие
    range: "60 футов Компонент: V"
    duration: Мгновенная
- id: power-word-stun
  name: "Слово силы: оглушение"
  description: |-
    *8-й уровень, Очарование (Бард, Чародей, Чернокнижник, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    Вы подавляете разум одного существа, которое видите в пределах дистанции. Если у цели 150 очков здоровья или меньше, она получает состояние «Ошеломлённый». В противном случае её Скорость равна 0 до начала вашего следующего хода.
    Существо в состоянии «Ошеломлённый» совершает спасбросок Телосложения в конце каждого своего хода и прекращает это состояние при успехе.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: prayer-of-healing
  name: Молитва исцеления
  description: |-
    *2-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** 10 минут
    **Дистанция:** 30 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    До пяти существ по вашему выбору, которые остаются в пределах дистанции на протяжении всего сотворения заклинания, получают преимущества короткого отдыха и также восстанавливают 2d8 очков здоровья. Существо не может снова получить эффект этого заклинания, пока не завершит продолжительный отдых.   Использование ячейки более высокого уровня. Исцеление увеличивается на 1d8 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: 10 минут
    range: 30 футов
    duration: Мгновенная
- id: prestidigitation
  name: Фокусы
  description: |-
    *Заговор Преобразования (Бард, Чародей, Чернокнижник, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 10 футов
    **Компоненты:** В, С
    **Длительность:** До 1 часа

    Вы создаёте магический эффект в пределах дистанции. Выберите эффект из перечисленных ниже. Если вы сотворяете это заклинание несколько раз, вы можете одновременно поддерживать до трёх его немгновенных эффектов.
    Сенсорный эффект. Вы создаёте мгновенный, безвредный сенсорный эффект, например сноп искр, порыв ветра, негромкие музыкальные ноты или странный запах.
    Игра с огнём. Вы мгновенно зажигаете или гасите свечу, факел или небольшой костёр.
    Очистка или загрязнение. Вы мгновенно очищаете или загрязняете предмет размером не более 1 кубического фута.
    Незначительное ощущение. Вы охлаждаете, согреваете или придаёте вкус до 1 кубического фута неживого материала на 1 час.
    Магическая метка. Вы создаёте цвет, небольшую метку или символ на предмете или поверхности на 1 час.
    Незначительное создание. Вы создаёте немагическую безделушку или иллюзорное изображение, которое помещается в руке. Оно существует до конца вашего следующего хода. Безделушка не может нанести урон и не имеет денежной стоимости.
  properties:
    castingTime: Действие
    range: 10 футов
    duration: До 1 часа
- id: prismatic-spray
  name: Радужные брызги
  description: |-
    *7-й уровень, Воплощение (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Восемь лучей света вспыхивают из вас конусом длиной 60 футов. Каждое существо в конусе совершает спасбросок Ловкости. Для каждой цели бросьте 1d8, чтобы определить, какой цветной луч на неё подействует, сверяясь с таблицей «Призматические лучи». Призматические лучи 1d8 Луч 2    Оранжевый. Провал спасброска: 12d6 кислотного урона. Успешный спасбросок: половина урона. 4    Зелёный. Провал спасброска: 12d6 урона ядом. Успешный спасбросок: половина урона. 1d8 Луч 6    Индиго. Провал спасброска: цель получает состояние «Опутанный» и совершает спасбросок Телосложения в конце каждого своего хода. Если она успешно пройдёт спасбросок три раза, состояние прекращается. Если провалит три раза, она получает состояние «Окаменевший», пока её не освободит эффект, например заклинание Великое восстановление. Успехи и провалы не обязаны идти подряд; ведите подсчёт обоих, пока у цели не наберётся три одинаковых. 8    Особый. Цель поражается двумя лучами. Бросьте дважды, перебрасывая любые 8.
  properties:
    castingTime: Действие
    range: На себя
    duration: Мгновенная
- id: prismatic-wall
  name: Призматическая стена
  description: |-
    *9-й уровень, Ограждение (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** 10 минут

    Мерцающая многоцветная плоскость света образует вертикальную непрозрачную стену длиной до 90 футов, высотой 30 футов и толщиной 1 дюйм, с центром в точке в пределах дистанции. Кроме того, вы можете придать стене форму шара диаметром до 30 футов с центром в точке в пределах дистанции. Стена существует в течение длительности. Если вы разместите стену в пространстве, которое занимает существо, заклинание мгновенно завершается без эффекта.
    Стена излучает яркий свет в радиусе 100 футов и тусклый свет на дополнительные 100 футов. Вы и существа, которых вы назначили при сотворении заклинания, можете проходить сквозь стену и находиться рядом с ней без вреда. Если другое существо, которое может видеть стену, перемещается в пределах 20 футов от неё или начинает там свой ход, оно должно преуспеть в спасброске Телосложения или получить состояние «Ослеплённый» на 1 минуту.
    Стена состоит из семи слоёв, каждый из которых имеет свой цвет. Когда существо тянется в стену или проходит сквозь неё, оно делает это по одному слою за раз, проходя через все слои. Каждый слой заставляет существо совершить спасбросок Ловкости, иначе на него действуют свойства этого слоя, как описано в таблице призматических слоёв.
    Стена имеет КД 10 и может быть разрушена по одному слою за раз, в порядке от красного к фиолетовому, средствами, специфичными для каждого слоя. Если слой разрушен, он исчезает на время действия заклинания. Поле антимагии не действует на стену, а Развеивание магии может повлиять только на фиолетовый слой. Призматические слои  Порядок  Эффекты 2    Оранжевый. При провале спасброска: 12d6 урона кислотой. При успехе: половина урона. Дополнительные эффекты: магические дальнобойные атаки не могут пройти через этот слой, который разрушается сильным ветром (например, создаваемым заклинанием Порыв ветра). 4    Зелёный. При провале спасброска: 12d6 урона ядом. При успехе: половина урона. Дополнительные эффекты: заклинание Проход сквозь стену или другое заклинание того же или большего уровня, способное открыть проход в твёрдой поверхности, разрушает этот слой. 6    Индиго. При провале спасброска: цель получает состояние «Опутанный» и совершает спасбросок Телосложения в конце каждого своего хода. Если она преуспевает в спасброске три раза, состояние заканчивается. Если она проваливает спасбросок три раза, она получает состояние «Окаменевший», пока её не освободит эффект, например заклинание Великое восстановление. Успехи и провалы не обязаны быть подряд; ведите учёт и тех и других, пока цель не наберёт три однотипных результата. Дополнительные эффекты: через этот слой нельзя сотворять заклинания, и он разрушается ярким светом заклинания Дневной свет.
- id: private-sanctum
  name: Частное святилище
  description: |-
    *4-й уровень, Ограждение (Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** 120 футов
    **Компоненты:** V, S, M (тонкий лист свинца)
    **Длительность:** 24 часа

    Вы делаете область в пределах дистанции магически защищённой. Область представляет собой Куб, который может иметь сторону от 5 до 100 футов. Заклинание действует в течение длительности.
    При сотворении заклинания вы определяете, какую защиту оно обеспечивает, выбирая любые из следующих свойств: • Звук не может проникнуть через преграду по краю защищённой области. • Преграда защищённой области выглядит тёмной и туманной, препятствуя зрению (включая Тёмное зрение) сквозь неё. • Сенсоры, созданные заклинаниями Прорицания, не могут появиться внутри защищённой области или пройти через преграду по её периметру. • Существа в области не могут становиться целями заклинаний Прорицания. • Ничто не может телепортироваться в защищённую область или из неё. • Межпланарные путешествия в пределах защищённой области заблокированы.
    Если сотворить это заклинание в одном и том же месте каждый день в течение 365 дней, оно будет действовать, пока его не рассеют.

    **Использование ячейки более высокого уровня.** Вы можете увеличить размер Куба на 100 футов за каждый уровень ячейки заклинаний выше 4-го.
- id: produce-flame
  name: Создание пламени
  description: |-
    *Заговор Вызова (Друид)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** На себя
    **Компоненты:** V, S
    **Длительность:** 10 минут

    Мерцающее пламя появляется в вашей руке и остаётся там в течение длительности. Пока оно там, пламя не излучает тепла и ничего не поджигает, а также излучает яркий свет в радиусе 20 футов и тусклый свет на дополнительные 20 футов. Заклинание завершается, если вы сотворите его снова.
    Пока заклинание действует, вы можете использовать Магическое действие, чтобы метнуть огонь в существо или объект в пределах 60 футов от вас. Совершите дальнобойную атаку заклинанием. При попадании цель получает 1d8 урона огнём.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5 (2d8), 11 (3d8) и 17 (4d8) уровня.
- id: programmed-illusion
  name: Запрограммированная иллюзия
  description: |-
    *6-й уровень, Иллюзия (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** V, S, M (нефритовая пыль стоимостью 25+ зм)
    **Длительность:** До рассеивания

    Вы создаёте иллюзию предмета, существа или какого-либо другого видимого явления в пределах дистанции, которая активируется при наступлении определённого условия. До этого момента иллюзия незаметна. Она не может быть больше Куба со стороной 30 футов, а при сотворении заклинания вы решаете, как иллюзия будет себя вести и какие звуки издавать. Это заранее расписанное представление может длиться до 5 минут.
    Когда наступает заданное вами условие, иллюзия появляется и действует так, как вы описали. Закончив действовать, иллюзия исчезает и остаётся скрытой в течение 10 минут, после чего её можно активировать снова.
    Условие может быть настолько общим или подробным, насколько вы пожелаете, но оно должно основываться на визуальных или слышимых явлениях, происходящих в пределах 30 футов от области. Например, вы можете создать иллюзию себя, которая появится и предупредит других, пытающихся открыть ловушечную дверь.
    Физическое взаимодействие с образом выявляет его иллюзорность, поскольку предметы могут проходить сквозь него. Существо, которое совершает Действие «Изучение», чтобы осмотреть образ, может определить, что это иллюзия, успешной проверкой Интеллекта (Расследование) против Сложности спасброска ваших заклинаний. Если существо распознало иллюзию, оно видит сквозь образ, а любой шум, который оно издаёт, звучит для него глухо.
- id: project-image
  name: Проекция образа
  description: |-
    *7-й уровень, Иллюзия (Бард, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 500 миль
    **Компоненты:** V, S, M (статуэтка себя стоимостью 5+ зм)
    **Длительность:** Концентрация, до 1 дня

    Вы создаёте иллюзорную копию себя, которая существует в течение длительности. Копия может появиться в любой точке в пределах дистанции, которую вы видели раньше, независимо от препятствий на пути. Иллюзия выглядит и звучит как вы, но она нематериальна. Если иллюзия получает любой урон, она исчезает, и заклинание завершается.
    Вы можете видеть глазами иллюзии и слышать её ушами так, как будто находитесь в её пространстве. Как Магическое действие, вы можете переместить иллюзию на расстояние до 60 футов и заставить её жестикулировать, говорить и вести себя так, как вы выберете. Она безупречно копирует ваши манеры.
    Физическое взаимодействие с образом выявляет его иллюзорность, поскольку предметы могут проходить сквозь него. Существо, которое совершает Действие «Изучение», чтобы осмотреть образ, может определить, что это иллюзия, успешной проверкой Интеллекта (Расследование) против Сложности спасброска ваших заклинаний. Если существо распознало иллюзию, оно видит сквозь образ, а любой шум, который оно издаёт, звучит для него глухо.
- id: protection-from-energy
  name: Защита от энергии
  description: |-
    *3-й уровень, Ограждение (Жрец, Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 1 часа

    В течение длительности добровольное существо, которого вы касаетесь, получает сопротивление урону одного типа на ваш выбор: кислотой, холодом, огнём, электричеством или звуком.
- id: protection-from-evil-and-good
  name: Защита от зла и добра
  description: |-
    *1-й уровень, Ограждение (Жрец, Друид, Паладин, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S, M (флакон святой воды стоимостью 25+ зм, который расходуется заклинанием)
    **Длительность:** Концентрация, до 10 минут

    Пока заклинание действует, одно добровольное существо, которого вы касаетесь, защищено от существ типа Аберрация, Небожитель, Элементаль, Фея, Исчадие или Нежить. Защита даёт несколько преимуществ. Существа этих типов совершают броски атаки по цели с помехой. Цель также не может быть одержима ими или получить от них состояние «Очарованный» или «Испуганный». Если цель уже одержима, очарована или испугана таким существом, она совершает с преимуществом любой новый спасбросок от соответствующего эффекта.
- id: protection-from-poison
  name: Защита от яда
  description: |-
    *2-й уровень, Ограждение (Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** V, S
    **Длительность:** 1 час

    Вы касаетесь существа и заканчиваете на нём состояние «Отравленный». В течение длительности цель совершает с преимуществом спасброски, чтобы избежать состояния «Отравленный» или завершить его, и она имеет сопротивление урону ядом.
- id: purify-food-and-drink
  name: Очищение пищи и питья
  description: |-
    *1-й уровень, Преобразование (Жрец, Друид, Паладин)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 10 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Вы удаляете яд и гниль из немагической пищи и питья в Сфере радиусом 5 футов с центром в точке в пределах дистанции.
- id: raise-dead
  name: Оживление мёртвых
  description: |-
    *5-й уровень, Некромантия (Бард, Жрец, Паладин)*

    **Время сотворения:** 1 час
    **Дистанция:** Касание
    **Компоненты:** V, S, M (алмаз стоимостью 500+ зм, который расходуется заклинанием)
    **Длительность:** Мгновенная

    Прикосновением вы возвращаете к жизни мёртвое существо, если оно было мертво не дольше 10 дней и не было Нежитью при смерти.
    Существо возвращается к жизни с 1 очком здоровья. Это заклинание также нейтрализует любые яды, которые повлияли на существо в момент смерти.
    Это заклинание закрывает все смертельные раны, но не восстанавливает утраченные части тела. Если у существа отсутствуют части тела или органы, необходимые для выживания, например голова, заклинание автоматически проваливается.
    Возвращение из мёртвых — тяжёлое испытание. Цель получает штраф -4 к проверкам d20. Каждый раз, когда цель завершает Продолжительный отдых, штраф уменьшается на 1, пока не станет 0.
- id: ray-of-enfeeblement
  name: Луч ослабления
  description: |-
    *2-й уровень, Некромантия (Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Концентрация, до 1 минуты

    Луч изнуряющей энергии вырывается из вас в сторону существа в пределах дистанции. Цель должна совершить спасбросок Телосложения. При успешном спасброске цель совершает следующий бросок атаки с помехой до начала вашего следующего хода.
    При провале спасброска цель совершает с помехой проверки d20 на Силу в течение длительности. В это время она также вычитает 1d8 из всех своих бросков урона. Цель повторяет спасбросок в конце каждого своего хода, и заклинание завершается при успехе.
- id: ray-of-frost
  name: Луч холода
  description: |-
    *Заговор Воплощения (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** Мгновенная

    Ледяной бело-голубой луч света устремляется к существу в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1d8 урона холодом, а её Скорость уменьшается на 10 футов до начала вашего следующего хода.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5 (2d8), 11 (3d8) и 17 (4d8) уровня.
- id: ray-of-sickness
  name: Луч недуга
  description: |-
    *1-й уровень, Некромантия (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Вы выпускаете зеленоватый луч в существо в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 2d8 урона ядом и получает состояние «Отравленный» до конца вашего следующего хода. Использование ячейки заклинания более высокого уровня. Урон увеличивается на 1d8 за каждый уровень ячейки выше 1.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: regenerate
  name: Регенерация
  description: |-
    *7-й уровень, Преобразование (Бард, Жрец, Друид)*

    **Время сотворения:** 1 минута  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (молитвенное колесо)  
    **Длительность:** 1 час

    Существо, которого вы касаетесь, восстанавливает 4d8 + 15 очков здоровья. На протяжении действия заклинания цель восстанавливает 1 очко здоровья в начале каждого своего хода, а отсечённые части тела отрастают через 2 минуты.
  properties:
    castingTime: 1 минута
    range: Касание
    material: молитвенное колесо
    duration: 1 час
- id: reincarnate
  name: Реинкарнация
  description: |-
    *5-й уровень, Некромантия (Друид)*

    **Время сотворения:** 1 час  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (редкие масла стоимостью 1,000+ зм, которые заклинание расходует)  
    **Длительность:** Мгновенная

    Вы касаетесь мёртвого Гуманоида или его части. Если существо мертво не дольше 10 дней, заклинание создаёт для него новое тело и призывает душу войти в него. Бросьте 1d10 и сверьтесь с таблицей ниже, чтобы определить вид тела, или Мастер выберет другой доступный вид. 1d10 Вид 1d10 Вид 1 Бросьте ещё раз. 6 Голиаф 2 Драконорожденный 7 Полурослик 3 Дварф 8 Человек 4 Эльф 9 Орк 5    Гном
    10    Тифлинг
    Перевоплотившееся существо делает любой выбор, который предлагает описание вида, и помнит свою прежнюю жизнь. Оно сохраняет способности, которые имело в исходном облике, но теряет особенности прежнего вида и получает особенности нового.
  properties:
    castingTime: 1 час
    range: Касание
    material: редкие масла стоимостью 1,000+ зм, которые заклинание расходует
    duration: Мгновенная
- id: remove-curse
  name: Снятие проклятия
  description: |-
    *3-й уровень, Ограждение (Жрец, Паладин, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Прикосновением вы завершаете все проклятия, действующие на одно существо или предмет. Если предмет — проклятый магический предмет, его проклятие остаётся, но заклинание разрывает настройку владельца на этот предмет, чтобы его можно было снять или выбросить.
  properties:
    castingTime: Действие
    range: Касание
    duration: Мгновенная
- id: resilient-sphere
  name: Устойчивая сфера
  description: |-
    *4-й уровень, Ограждение (Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (стеклянная сфера)  
    **Длительность:** Концентрация, вплоть до 1 минуты

    Мерцающая сфера окружает существо или предмет размера «Большой» или меньше в пределах дистанции. Нежелательное существо должно преуспеть в спасброске Ловкости, иначе оно будет заключено в сферу на время действия заклинания.
    Ничто — ни физические предметы, ни энергия, ни другие эффекты заклинаний — не может пройти через барьер ни внутрь, ни наружу, хотя существо внутри сферы может там дышать. Сфера неуязвима ко всему урону, и существо или предмет внутри не может получить урон от атак или эффектов, исходящих извне, а существо внутри не может повредить ничего снаружи.
    Сфера невесома и ровно настолько велика, чтобы вместить существо или предмет внутри. Заключённое существо может потратить действие, чтобы упереться в стенки сферы и катить её со скоростью до половины своей Скорости. Аналогично сферу можно поднять и переместить другие существа.
    Заклинание «Распад», нацеленное на сферу, уничтожает её, не причиняя вреда тому, что внутри.
  properties:
    castingTime: Действие
    range: 30 футов
    material: стеклянная сфера
    duration: до 1 минуты
- id: resistance
  name: Сопротивление
  description: |-
    *Заговор Ограждения (Жрец, Друид)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание. Компоненты: В, С  
    **Компоненты:**   
    **Длительность:** Концентрация, вплоть до 1 минуты

    Вы касаетесь добровольного существа и выбираете тип урона: кислотный, дробящий, холод, огонь, электричество, некротическая энергия, колющий, яд, излучение, рубящий или звук. Когда существо получает урон выбранного типа до окончания заклинания, оно уменьшает общий полученный урон на 1d4. Существо может получить выгоду от этого заклинания только один раз за ход.
  properties:
    castingTime: Действие
    range: "Касание. Компоненты: В, С"
    duration: вплоть до 1 минуты
- id: resurrection
  name: Воскрешение
  description: |-
    *7-й уровень, Некромантия (Бард, Жрец)*

    **Время сотворения:** 1 час  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (алмаз стоимостью 1,000+ зм, который заклинание расходует)  
    **Длительность:** Мгновенная

    Касанием вы возвращаете к жизни мёртвое существо, которое мертво не дольше века, не умерло от старости и не было Нежитью в момент смерти.
    Существо возвращается к жизни со всеми своими очками здоровья. Заклинание также нейтрализует любые яды, действовавшие на существо в момент смерти. Оно закрывает все смертельные раны и восстанавливает все недостающие части тела.
    Возвращение с того света — тяжёлое испытание. Цель получает штраф -4 к проверкам d20. Каждый раз, когда цель завершает Продолжительный отдых, штраф уменьшается на 1, пока не станет 0.
    Сотворение этого заклинания, чтобы оживить существо, мёртвое 365 дней и дольше, истощает вас. До окончания Продолжительного отдыха вы не можете сотворять заклинания, и у вас Помеха к проверкам d20.
  properties:
    castingTime: 1 час
    range: Касание
    material: алмаз стоимостью 1,000+ зм, который заклинание расходует
    duration: Мгновенная
- id: reverse-gravity
  name: Обратная гравитация
  description: |-
    *7-й уровень, Преобразование (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 100 футов  
    **Компоненты:** В, С, М (магнетит и железные опилки)  
    **Длительность:** Концентрация, вплоть до 1 минуты

    Это заклинание обращает гравитацию в цилиндре радиусом 50 футов и высотой 100 футов с центром в точке в пределах дистанции. Все существа и предметы в этой области, которые не закреплены на земле, падают вверх и достигают верха цилиндра. Существо может совершить спасбросок Ловкости, чтобы ухватиться за неподвижный предмет, до которого может дотянуться, и избежать падения вверх.
    Если на пути падения вверх встречается потолок или закреплённый предмет, существа и предметы ударяются о него так же, как при падении вниз. Если затронутое существо или предмет достигает верха цилиндра, не ударившись ни о что, он зависает там на время действия заклинания. Когда заклинание заканчивается, затронутые предметы и существа падают вниз.
  properties:
    castingTime: Действие
    range: 100 футов
    material: магнетит и железные опилки
    duration: вплоть до 1 минуты
- id: revivify
  name: Оживление
  description: |-
    *3-й уровень, Некромантия (Жрец, Друид, Паладин, Следопыт)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (алмаз стоимостью 300+ зм, который заклинание расходует)  
    **Длительность:** Мгновенная

    Вы касаетесь существа, погибшего в течение последней минуты. Оно возвращается к жизни с 1 очком здоровья. Это заклинание не может оживить существо, умершее от старости, и не восстанавливает недостающие части тела.
  properties:
    castingTime: Действие
    range: Касание
    material: алмаз стоимостью 300+ зм, который заклинание расходует
    duration: Мгновенная
- id: rope-trick
  name: Верёвочный трюк
  description: |-
    *2-й уровень, Преобразование (Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (отрезок верёвки)  
    **Длительность:** 1 час

    Вы касаетесь верёвки. Один её конец поднимается вверх, пока верёвка не повиснет перпендикулярно земле или не упрётся в потолок. На верхнем конце верёвки открывается невидимый портал размером 3 на 5 футов, ведущий в экстрапространственное пространство, которое существует до окончания заклинания. Попасть в это пространство можно, взобравшись по верёвке, которую можно втянуть внутрь или сбросить из него.
    В пространство могут поместиться до восьми существ размера Средний или меньше. Атаки, заклинания и другие эффекты не могут проникнуть в пространство или выйти из него, но существа внутри могут видеть сквозь портал. Всё, что находится внутри пространства, выпадает наружу, когда заклинание заканчивается.
  properties:
    castingTime: Действие
    range: Касание
    material: отрезок верёвки
    duration: 1 час
- id: sacred-flame
  name: Священное пламя
  description: |-
    *Заговор Воплощения (Жрец)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Пламеподобное сияние нисходит на существо, которое вы видите в пределах дистанции. Цель должна преуспеть в спасброске Ловкости, иначе получит 1d8 урона излучением. Цель не получает преимуществ от половинного укрытия или укрытия на три четверти при этом спасброске.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5 (2d8), 11 (3d8) и 17 (4d8) уровней.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: sanctuary
  name: Святилище
  description: |-
    *1-й уровень, Ограждение (Жрец)*

    **Время сотворения:** Бонусное действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (осколок стекла из зеркала)  
    **Длительность:** 1 минута

    Вы защищаете существо в пределах дистанции. Пока заклинание действует, любое существо, которое нацеливает на защищённое существо атаку броском или урон заклинанием, должно преуспеть в спасброске Мудрости, иначе оно выбирает новую цель или теряет атаку или заклинание. Это заклинание не защищает существо от областей эффекта. Заклинание заканчивается, если защищённое существо совершает бросок атаки, сотворяет заклинание или наносит урон.
  properties:
    castingTime: Бонусное действие
    range: 30 футов
    material: осколок стекла из зеркала
    duration: 1 минута
- id: scorching-ray
  name: Жгучий луч
  description: |-
    *2-й уровень, Воплощение (Колдун, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы выпускаете три огненных луча. Вы можете направить их в одну цель в пределах дистанции или в несколько целей. Совершите дальнобойную атаку заклинанием для каждого луча. При попадании цель получает 2d6 урона огнём.

    **Использование ячейки более высокого уровня.** Вы создаёте один дополнительный луч за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: Мгновенная
    higherLevel: Вы создаёте один дополнительный луч за каждый уровень ячейки выше 2-го.

- id: scrying
  name: Провидение
  description: |-
    *5-й уровень, Прорицание (Бард, Жрец, Друид, Колдун, Волшебник)*

    **Время сотворения:** 10 минут
    **Дистанция:** На себя
    **Компоненты:** В, С, М (фокусировка стоимостью 1,000+ зм, например хрустальный шар, зеркало или чаша, наполненная водой)
    **Длительность:** Концентрация, до 10 минут

    Вы можете видеть и слышать выбранное вами существо, находящееся на том же плане существования, что и вы. Цель совершает спасбросок Мудрости, который изменяется (см. таблицы ниже) в зависимости от того, насколько хорошо вы знаете цель, и от вида физической связи с ней. Цель не знает, против чего она совершает спасбросок, она лишь чувствует беспокойство. Насколько вы знаете цель ...    Модификатор спасброска Лично знакомы (встречали цель)    +0 У вас есть вещь цели ...    Модификатор спасброска Одежда или другое имущество    -4
    При успешном спасброске цель не подвергается эффекту, и вы не можете использовать на ней это заклинание снова в течение 24 часов.
    При провале спасброска заклинание создаёт Невидимый и нематериальный датчик в пределах 10 футов от цели. Вы можете видеть и слышать через датчик так, будто находитесь там. Датчик движется вместе с целью, оставаясь в пределах 10 футов от неё на протяжении длительности. Если кто-то может увидеть датчик, он выглядит как светящаяся сфера размером с ваш кулак.
    Вместо существа вы можете выбрать место, которое видели. В этом случае датчик появляется в этом месте и не двигается.
  properties:
    castingTime: 10 минут
    range: На себя
    material: фокусировка стоимостью 1,000+ зм, например хрустальный шар, зеркало или чаша, наполненная водой
    duration: до 10 минут

- id: searing-smite
  name: Испепеляющая кара
  description: |-
    *1-й уровень, Воплощение (Паладин)*

    **Время сотворения:** Бонусное действие, которое вы совершаете сразу после попадания по цели рукопашным оружием или безоружным ударом
    **Дистанция:** На себя Компоненты: В
    **Компоненты:**
    **Длительность:** 1 минута

    Когда вы попадаете по цели, она получает дополнительно 1d6 урона огнём от атаки. В начале каждого её хода до окончания заклинания цель получает 1d6 урона огнём, затем совершает спасбросок Телосложения. При провале спасброска заклинание продолжается. При успешном спасброске заклинание заканчивается.

    **Использование ячейки более высокого уровня.** Весь урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: Бонусное действие, которое вы совершаете сразу после попадания по цели рукопашным оружием или безоружным ударом
    range: "На себя Компоненты: В"
    duration: 1 минута
    higherLevel: Весь урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.

- id: secret-chest
  name: Тайный сундук
  description: |-
    *4-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (сундук размером 3 фута на 2 фута на 2 фута, сделанный из редких материалов стоимостью 5,000+ зм, и крошечная копия сундука из тех же материалов стоимостью 50+ зм)
    **Длительность:** До рассеивания

    Вы прячете сундук и всё его содержимое на Эфирном плане. Вы должны коснуться сундука и крошечной копии, которые служат материальными компонентами заклинания. Сундук может вмещать до 12 кубических футов неживых материалов (3 фута на 2 фута на 2 фута).
    Пока сундук находится на Эфирном плане, вы можете совершить Магическое действие, коснувшись копии, чтобы призвать сундук. Он появляется в свободном пространстве на земле в пределах 5 футов от вас. Вы можете отправить сундук обратно на Эфирный план, совершив Магическое действие и коснувшись сундука и копии.
    Через 60 дней в конце каждого дня существует накопительный шанс 5 процентов, что заклинание закончится. Заклинание также заканчивается, если вы сотворите его снова или если крошечная копия сундука будет уничтожена. Если заклинание заканчивается, а большой сундук находится на Эфирном плане, он остаётся там, чтобы вы или кто-то другой мог его найти.
  properties:
    castingTime: Действие
    range: Касание
    material: сундук размером 3 фута на 2 фута на 2 фута, сделанный из редких материалов стоимостью 5,000+ зм, и крошечная копия сундука из тех же материалов стоимостью 50+ зм
    duration: До рассеивания

- id: see-invisibility
  name: Видение невидимого
  description: |-
    *2-й уровень, Прорицание (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (щепотка талька)
    **Длительность:** 1 час

    На протяжении длительности вы видите существ и предметы, находящихся в состоянии «Невидимый», так, будто они видимы, и можете видеть в Эфирный план. Существа и предметы там выглядят призрачно.
  properties:
    castingTime: Действие
    range: На себя
    material: щепотка талька
    duration: 1 час

- id: seeming
  name: Личина
  description: |-
    *5-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С
    **Длительность:** 8 часов

    Вы придаёте иллюзорный облик каждому выбранному вами существу в пределах дистанции, которое видите. Нежелающая цель может совершить спасбросок Харизмы, и если он успешен, заклинание на неё не действует.
    Вы можете придать целям одинаковый или разный облик. Заклинание может изменить облик тела и снаряжения цели. Вы можете сделать каждое существо казавшимся на 1 фут ниже или выше, а также тяжелее или легче. Новый облик цели должен иметь то же базовое расположение конечностей, что и у цели, но в остальном объём иллюзии зависит от вас. Заклинание действует на протяжении длительности.
    Изменения, которые создаёт это заклинание, не выдерживают физического осмотра. Например, если вы добавите шляпу к наряду существа, предметы будут проходить сквозь неё.
    Существо, которое совершает действие Изучение, чтобы осмотреть цель, может совершить проверку Интеллекта (Расследование) против Сложности спасброска вашего заклинания. При успехе оно понимает, что цель замаскирована.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: 8 часов

- id: sending
  name: Послание
  description: |-
    *3-й уровень, Прорицание (Бард, Жрец, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Неограниченная
    **Компоненты:** В, С, М (медная проволока)
    **Длительность:** Мгновенная

    Вы отправляете короткое сообщение не более чем из 25 слов существу, с которым вы встречались, или существу, описанному вам тем, кто с ним встречался. Цель слышит сообщение у себя в сознании, узнаёт вас как отправителя, если знает вас, и может немедленно ответить таким же образом. Заклинание позволяет цели понять смысл вашего сообщения.
    Вы можете отправить сообщение на любое расстояние и даже на другие планы существования, но если цель находится на другом плане, существует шанс 5 процентов, что сообщение не дойдёт. Вы узнаёте, если доставка не удалась.
    Получив ваше сообщение, существо может блокировать возможность снова связаться с ним при помощи этого заклинания на 8 часов. Если вы попытаетесь отправить другое сообщение в это время, вы узнаете, что заблокированы, и заклинание не сработает.
  properties:
    castingTime: Действие
    range: Неограниченная
    material: медная проволока
    duration: Мгновенная

- id: sequester
  name: Изоляция
  description: |-
    *7-й уровень, Преобразование (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (пыль из драгоценного камня стоимостью 5,000+ зм, которую заклинание расходует)
    **Длительность:** До рассеивания

    Касанием вы магически помещаете в состояние изоляции предмет или добровольное существо. На протяжении длительности цель находится в состоянии «Невидимый» и не может быть целью заклинаний Прорицания, обнаруживаться магией или наблюдаться на расстоянии с помощью магии.
    Если целью является существо, оно входит в состояние приостановленной анимации: находится в состоянии «Без сознания», не стареет и не нуждается в пище, воде или воздухе.
    Вы можете задать условие, при котором заклинание закончится раньше. Условие может быть любым, но оно должно произойти или стать видимым в пределах 1 мили от цели. Примеры: «через 1,000 лет» или «когда тарраска пробудится». Заклинание также заканчивается, если цель получает любой урон.
  properties:
    castingTime: Действие
    range: Касание
    material: пыль из драгоценного камня стоимостью 5,000+ зм, которую заклинание расходует
    duration: До рассеивания

- id: shapechange
  name: Смена облика
  description: |-
    *9-й уровень, Преобразование (Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (нефритовый обруч стоимостью 1,500+ зм)
    **Длительность:** Концентрация, до 1 часа

    Вы превращаетесь в другое существо на протяжении длительности или до тех пор, пока не совершите Магическое действие, чтобы принять другой облик из числа подходящих. Новый облик должен принадлежать существу с показателем опасности не выше вашего уровня или показателя опасности, который у вас уже есть. Вы должны ранее видеть существо такого вида, и оно не может быть Конструктом или Нежитью.
    Когда вы сотворяете заклинание, вы получаете количество временных очков здоровья, равное очкам здоровья первого облика, в который вы превращаетесь. Эти временные очки здоровья пропадают, если к моменту окончания заклинания что-то из них останется.
    Статблок выбранного облика заменяет ваши игровые характеристики, но вы сохраняете тип существа, мировоззрение, личность, значения Интеллекта, Мудрости и Харизмы, очки здоровья, Кости Хитов, владения и способность общаться. Если у вас есть умение Сотворение заклинаний, вы сохраняете и его.
    Превращаясь, вы определяете, падает ли ваше снаряжение на землю или меняет размер и форму, чтобы подходить новому облику, пока вы в нём.
  properties:
    castingTime: Действие
    range: На себя
    material: нефритовый обруч стоимостью 1,500+ зм
    duration: до 1 часа

- id: shatter
  name: Сокрушение
  description: |-
    *2-й уровень, Воплощение (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (кусочек слюды)
    **Длительность:** Мгновенная

    Громкий звук вырывается из выбранной вами точки в пределах дистанции. Каждое существо в сфере радиусом 10 футов с центром в этой точке совершает спасбросок Телосложения и получает 3d8 урона звуком при провале или половину этого урона при успехе. Конструкт совершает спасбросок с помехой.
    Немагический предмет, который не надет и не переносится, тоже получает урон, если находится в области действия заклинания. Использование ячейки более высокого уровня. Урон увеличивается на 1d8 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кусочек слюды
    duration: Мгновенная

- id: shield
  name: Щит
  description: |-
    *1-й уровень, Ограждение (Чародей, Волшебник)*

    **Время сотворения:** Реакция, которую вы совершаете, когда по вам попадает бросок атаки или на вас направлено заклинание «Магическая стрела»
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** 1 раунд

    Незаметный барьер из силового поля защищает вас. До начала вашего следующего хода вы получаете бонус +5 к Классу Брони, в том числе против провоцирующей атаки, и не получаете урона от заклинания «Магическая стрела».
  properties:
    castingTime: Реакция, которую вы совершаете, когда по вам попадает бросок атаки или на вас направлено заклинание «Магическая стрела»
    range: На себя
    duration: 1 раунд

- id: shield-of-faith
  name: Щит веры
  description: |-
    *1-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (свиток с молитвой)
    **Длительность:** Концентрация, до 10 минут

    Мерцающее поле окружает выбранное вами существо в пределах дистанции, даруя ему бонус +2 к Классу Брони на протяжении длительности.
  properties:
    castingTime: Бонусное действие
    range: 60 футов
    material: свиток с молитвой
    duration: до 10 минут
- id: shillelagh
  name: Шилейла
  description: |-
    *Заговор Преобразования (Друид)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (омела)
    **Длительность:** 1 минута

    Дубинка или боевой посох, которые вы держите, наполняются силой природы. На время действия вы можете использовать свою характеристику заклинаний вместо Силы для бросков атаки и урона при атаках оружием ближнего боя этим оружием, а кость урона оружия становится d8. Если атака наносит урон, это может быть урон силовым полем или обычный тип урона оружия (на ваш выбор).
    Заклинание заканчивается досрочно, если вы сотворите его снова или если выпустите оружие из рук.
    Улучшение заговора. Кость урона меняется, когда вы достигаете 5-го (d10), 11-го (d12) и 17-го (2d6) уровня.
  properties:
    castingTime: Бонусное действие
    range: На себя
    material: омела
    duration: 1 минута
- id: shining-smite
  name: Сияющая кара
  description: |-
    *2-й уровень, Преобразование (Паладин)*

    **Время сотворения:** Бонусное действие, которое вы совершаете сразу после попадания по существу оружием ближнего боя или безоружным ударом
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Концентрация, до 1 минуты

    Цель, пораженная ударом, получает дополнительно 2d6 урона излучением от атаки. Пока заклинание действует, цель испускает яркий свет в радиусе 5 футов, броски атаки по ней совершаются с преимуществом, и она не может получать преимущества от состояния Невидимый.

    **Использование ячейки заклинания более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
  properties:
    castingTime: Бонусное действие, которое вы совершаете сразу после попадания по существу оружием ближнего боя или безоружным ударом
    range: На себя
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинания выше 2-го.
- id: shocking-grasp
  name: Электрическое прикосновение
  description: |-
    *Заговор Воплощения (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    От вас к существу, которого вы пытаетесь коснуться, устремляется электричество. Совершите против цели рукопашную атаку заклинанием. При попадании цель получает 1d8 урона электричеством, и она не может совершать провоцированные атаки до начала своего следующего хода.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5-го (2d8), 11-го (3d8) и 17-го (4d8) уровня.
  properties:
    castingTime: Действие
    range: Касание
    duration: Мгновенная
- id: silence
  name: Безмолвие
  description: |-
    *2-й уровень, Иллюзия (Бард, Жрец, Следопыт)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    На время действия внутри Сферы радиусом 20 футов или сквозь неё не может возникать никакой звук; Сфера имеет центр в точке, которую вы выбираете в пределах дистанции. Любое существо или предмет, полностью находящиеся внутри Сферы, имеет иммунитет к урону звуком, а существа полностью внутри неё имеют состояние Оглохший. Сотворить заклинание с компонентом В внутри Сферы невозможно.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 10 минут
- id: silent-image
  name: Безмолвный образ
  description: |-
    *1-й уровень, Иллюзия (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (клочок шерсти)
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте образ предмета, существа или какого-либо другого видимого явления размером не больше Куба со стороной 15 футов. Образ появляется в выбранном вами месте в пределах дистанции и существует на протяжении длительности. Образ чисто визуальный; он не сопровождается звуком, запахом или иными сенсорными эффектами.
    Магическим действием вы можете переместить образ в любое место в пределах дистанции. Когда образ меняет место, вы можете изменить его внешний вид так, чтобы его движения выглядели естественно. Например, если вы создали образ существа и переместили его, вы можете изменить образ так, чтобы казалось, что оно идёт.
    Физическое взаимодействие с образом раскрывает его как иллюзию, так как сквозь него можно пройти. Существо, которое совершает действие Изучение, чтобы рассмотреть образ, может определить, что это иллюзия, успешной проверкой Интеллекта (Расследование) против Сложности спасброска вашего заклинания. Если существо распознало иллюзию, оно может видеть сквозь образ.
  properties:
    castingTime: Действие
    range: 60 футов
    material: клочок шерсти
    duration: до 10 минут
- id: simulacrum
  name: Подобие
  description: |-
    *7-й уровень, Иллюзия (Волшебник)*

    **Время сотворения:** 12 часов
    **Дистанция:** Касание
    **Компоненты:** В, С, М (порошок рубина стоимостью 1,500+ зм, который заклинание расходует)
    **Длительность:** До рассеивания

    Вы создаёте подобие одного зверя или гуманоида, находящегося в пределах 10 футов от вас на протяжении всего сотворения заклинания. Вы завершаете сотворение, касаясь одновременно существа и кучи льда или снега того же размера, что и существо; куча превращается в подобие, которое является существом. Оно использует игровые характеристики исходного существа на момент сотворения, за исключением того, что оно является Конструктом, его максимум очков здоровья вдвое меньше и оно не может сотворить это заклинание.
    Подобие Дружественно к вам и существам, которых вы назначите. Оно подчиняется вашим командам и действует в ваш ход в бою. Подобие не может получать уровни и не может совершать Короткий или Продолжительный отдых.
    Если подобие получает урон, восстановить его очки здоровья можно только починкой во время Продолжительного отдыха, в течение которого вы расходуете компоненты стоимостью 100 зм за каждое восстанавливаемое очко здоровья. Для починки подобие должно находиться в пределах 5 футов от вас.
    Подобие существует, пока не упадёт до 0 очков здоровья, после чего превращается в снег и тает. Если вы сотворите это заклинание снова, любое подобие, созданное вами этим заклинанием, мгновенно уничтожается.
  properties:
    castingTime: 12 часов
    range: Касание
    material: порошок рубина стоимостью 1,500+ зм, который заклинание расходует
    duration: До рассеивания
- id: sleep
  name: Сон
  description: |-
    *1-й уровень, Очарование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (щепотка песка или лепестков роз)
    **Длительность:** Концентрация, до 1 минуты

    Каждое существо по вашему выбору в Сфере радиусом 5 футов с центром в точке в пределах дистанции должно преуспеть в спасброске Мудрости, иначе оно получит состояние Выведенный из строя до конца своего следующего хода, после чего должно повторить спасбросок. Если цель провалит второй спасбросок, она получит состояние Без сознания на время действия. Заклинание заканчивается для цели, если она получает урон или кто-то в пределах 5 футов от неё совершает действие, чтобы вывести её из-под действия заклинания.
    Существа, которые не спят, например эльфы, или которые имеют иммунитет к состоянию Истощение, автоматически преуспевают в спасбросках от этого заклинания.
  properties:
    castingTime: Действие
    range: 60 футов
    material: щепотка песка или лепестков роз
    duration: до 1 минуты
- id: sleet-storm
  name: Ледяной шторм
  description: |-
    *3-й уровень, Вызов (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (миниатюрный зонтик)
    **Длительность:** Концентрация, до 1 минуты

    На время действия заклинания в Цилиндре высотой 40 футов и радиусом 20 футов, центр которого находится в точке, которую вы выбираете в пределах дистанции, выпадает мокрый снег. Область является Сильно затемнённой, а открытое пламя в ней гаснет.
    Земля в Цилиндре является труднопроходимой местностью. Когда существо впервые входит в Цилиндр за ход или начинает в нём свой ход, оно должно преуспеть в спасброске Ловкости, иначе получит состояние Лежащий ничком и потеряет Концентрацию.
  properties:
    castingTime: Действие
    range: 150 футов
    material: миниатюрный зонтик
    duration: до 1 минуты
- id: slow
  name: Замедление
  description: |-
    *3-й уровень, Преобразование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (капля патоки)
    **Длительность:** Концентрация, до 1 минуты

    Вы изменяете течение времени вокруг до шести существ по вашему выбору в Кубе со стороной 40 футов в пределах дистанции. Каждая цель должна преуспеть в спасброске Мудрости, иначе на время действия на неё будет действовать это заклинание.
    Скорость затронутого существа уменьшается вдвое, оно получает штраф -2 к Классу Брони и спасброскам Ловкости, и оно не может совершать Реакции. В свой ход оно может совершить либо действие, либо бонусное действие, но не оба, и может сделать только одну атаку, если использует действие Атака. Если оно сотворяет заклинание с соматическим компонентом (С), есть 25 процентов шанс, что заклинание провалится из-за того, что существо слишком медленно выполняет жесты.
    Затронутое существо повторяет спасбросок в конце каждого своего хода; при успехе заклинание на нём заканчивается.
  properties:
    castingTime: Действие
    range: 120 футов
    material: капля патоки
    duration: до 1 минуты
- id: sorcerous-burst
  name: Чародейский всплеск
  description: |-
    *Заговор Воплощения (Чародей)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов Компонент: В, С
    **Компоненты:**
    **Длительность:** Мгновенная

    Вы выпускаете чародейскую энергию в одно существо или предмет в пределах дистанции. Совершите против цели дальнобойную атаку заклинанием. При попадании цель получает 1d8 урона одного из типов на ваш выбор: кислотный, холод, огонь, электричество, яд, психическая энергия или звук.
    Если вы выбросили 8 на d8 для этого заклинания, вы можете бросить ещё один d8 и добавить его к урону. Когда вы сотворяете это заклинание, максимальное количество таких d8s, которые вы можете добавить к урону, равно модификатору вашей характеристики заклинаний.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5-го (2d8), 11-го (3d8) и 17-го (4d8) уровня.
  properties:
    castingTime: Действие
    range: "120 футов Компонент: В, С"
    duration: Мгновенная
- id: spare-the-dying
  name: Пощада умирающему
  description: |-
    *Заговор Некромантии (Жрец, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 15 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Выберите существо в пределах дистанции, у которого 0 очков здоровья и которое не мертво. Существо становится стабильным.
    Улучшение заговора. Дистанция удваивается, когда вы достигаете 5-го (30 футов), 11-го (60 футов) и 17-го (120 футов) уровня.
  properties:
    castingTime: Действие
    range: 15 футов
    duration: Мгновенная
- id: speak-with-animals
  name: Разговор с животными
  description: |-
    *1-й уровень, Прорицание (Бард, Друид, Следопыт, Колдун)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** 10 минут

    На время действия вы можете понимать Зверей и разговаривать с ними, а также использовать с ними любые варианты навыка действия Воздействие.
    Большинство Зверей мало что могут сказать о темах, не относящихся к выживанию или общению, но как минимум Зверь может рассказать вам о ближайших местах и монстрах, включая всё, что он заметил за последний день.
  properties:
    castingTime: Действие
    range: На себя
    duration: 10 минут
- id: speak-with-dead
  name: Разговор с мёртвыми
  description: |-
    *3-й уровень, Некромантия (Бард, Жрец, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (горящие благовония)
    **Длительность:** 10 минут

    Вы даруете подобие жизни трупу по своему выбору в пределах дистанции, позволяя ему отвечать на ваши вопросы. У трупа должен быть рот, а заклинание не действует, если погибшее существо при смерти было нежитью. Заклинание также не действует, если этот труп был целью данного заклинания в течение последних 10 дней.
    Пока заклинание не окончится, вы можете задать трупу до пяти вопросов. Труп знает только то, что знал при жизни, в том числе языки, которыми владел. Ответы обычно краткие, загадочные или повторяющиеся, и труп не обязан отвечать правдиво, если вы враждебны к нему или он узнаёт в вас врага. Это заклинание не возвращает душу существа в тело, а только его поддерживающий дух. Поэтому труп не может узнать новую информацию, не понимает ничего из происходившего после смерти и не может строить догадки о будущих событиях.
  properties:
    castingTime: Действие
    range: 10 футов
    material: горящие благовония
    duration: 10 минут

- id: speak-with-plants
  name: Разговор с растениями
  description: |-
    *3-й уровень, Преобразование (Бард, Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** 10 минут

    Вы наделяете растения в неподвижной 30-футовой эманации ограниченным разумом и подвижностью, давая им возможность общаться с вами и выполнять ваши простые приказы. Вы можете расспрашивать растения о событиях в области действия заклинания за прошедший день, узнавая о проходивших существах, погоде и других обстоятельствах.
    Вы также можете превратить труднопроходимую местность, образованную разрастанием растений (например, заросли и подлесок), в обычную местность, которая сохранится на протяжении длительности. Или же вы можете превратить обычную местность, где есть растения, в труднопроходимую, которая сохранится на протяжении длительности.
    Заклинание не позволяет растениям вырывать себя с корнем и передвигаться, но они могут двигать для вас ветвями, усиками и стеблями.
    Если в области действия есть существо типа Растение, вы можете общаться с ним так, будто у вас общий язык.
  properties:
    castingTime: Действие
    range: На себя
    duration: 10 минут

- id: spider-climb
  name: Лазанье паука
  description: |-
    *2-й уровень, Преобразование (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (капля битума и паук)
    **Длительность:** Концентрация, до 1 часа

    Пока заклинание не окончится, одно добровольное существо, которого вы касаетесь, получает возможность двигаться вверх, вниз и поперёк вертикальных поверхностей и по потолкам, при этом его руки остаются свободными. Цель также получает скорость лазания, равную её скорости.

    **Использование ячейки более высокого уровня.** Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинаний выше 2-го.
  properties:
    castingTime: Действие
    range: Касание
    material: капля битума и паук
    duration: До 1 часа
    higherLevel: Вы можете выбрать одно дополнительное существо за каждый уровень ячейки заклинаний выше 2-го.

- id: spike-growth
  name: Рост шипов
  description: |-
    *2-й уровень, Преобразование (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (семь шипов)
    **Длительность:** Концентрация, до 10 минут

    Земля в сфере радиусом 20 футов с центром в точке в пределах дистанции покрывается твёрдыми шипами и колючками. Область становится труднопроходимой местностью на протяжении длительности. Когда существо входит в область или перемещается внутри неё, оно получает 2d4 урона колющим за каждые 5 футов, которые проходит.
    Превращение земли замаскировано под естественный вид. Любое существо, которое не может видеть эту область в момент сотворения заклинания, должно совершить действие Поиск и преуспеть в проверке Мудрости (Внимательность или Выживание) против Сложности спасброска вашего заклинания, чтобы распознать местность как опасную до того, как войти в неё.
  properties:
    castingTime: Действие
    range: 150 футов
    material: семь шипов
    duration: До 10 минут

- id: spirit-guardians
  name: Духи-хранители
  description: |-
    *3-й уровень, Вызов (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (молитвенный свиток)
    **Длительность:** Концентрация, до 10 минут

    Защитные духи кружат вокруг вас в 15-футовой эманации на протяжении действия заклинания. Если вы добры или нейтральны, их призрачный облик выглядит ангельским или фейским (на ваш выбор). Если вы злы, они выглядят демоническими.
    Когда вы сотворяете это заклинание, вы можете указать существ, на которых оно не действует. Скорость любого другого существа в эманации уменьшается вдвое. Каждый раз, когда эманация входит в пространство существа, а также когда существо входит в эманацию или заканчивает там свой ход, оно должно совершить спасбросок Мудрости. При провале существо получает 3d8 урона излучением (если вы добры или нейтральны) или 3d8 урона некротической энергией (если вы злы). При успехе оно получает вдвое меньше урона. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 3-го.
  properties:
    castingTime: Действие
    range: На себя
    material: молитвенный свиток
    duration: До 10 минут
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 3-го.

- id: spiritual-weapon
  name: Духовное оружие
  description: |-
    *2-й уровень, Воплощение (Жрец)*

    **Время сотворения:** Бонусное действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте парящую призрачную силу, напоминающую оружие на ваш выбор, которая сохраняется на протяжении длительности. Сила появляется в пределах дистанции в пространстве по вашему выбору, и вы можете сразу же совершить одну атаку заклинанием ближнего боя по одному существу в пределах 5 футов от силы. При попадании цель получает 1d8 урона силовым полем плюс ваш модификатор характеристики заклинаний.
    Бонусным действием в свои последующие ходы вы можете переместить силу на 20 футов и повторить атаку по существу в пределах 5 футов от неё.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 2-го.
  properties:
    castingTime: Бонусное действие
    range: 60 футов
    duration: До 1 минуты
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки заклинаний выше 2-го.

- id: starry-wisp
  name: Звёздный огонёк
  description: |-
    *Заговор Воплощения (Бард, Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы запускаете частицу света в одно существо или предмет в пределах дистанции. Совершите атаку дальнобойным заклинанием по цели. При попадании цель получает 1d8 урона излучением, а до конца вашего следующего хода она испускает тусклый свет в радиусе 10 футов и не может получать преимущества от состояния Невидимый.
    Улучшение заговора. Урон увеличивается на 1d8, когда вы достигаете 5-го (2d8), 11-го (3d8) и 17-го (4d8) уровня.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная

- id: stinking-cloud
  name: Зловонное облако
  description: |-
    *3-й уровень, Вызов (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 90 футов
    **Компоненты:** В, С, М (тухлое яйцо)
    **Длительность:** Концентрация, до 1 минуты

    Вы создаёте сферу радиусом 20 футов из жёлтого тошнотворного газа с центром в точке в пределах дистанции. Облако сильно затемнено. Оно висит в воздухе на протяжении длительности или до тех пор, пока сильный ветер (например, создаваемый заклинанием Порыв ветра) не рассеет его.
    Каждое существо, которое начинает свой ход в сфере, должно преуспеть в спасброске Телосложения, иначе получит состояние Отравленный до конца текущего хода. Пока существо отравлено таким образом, оно не может совершать действие или Бонусное действие.
  properties:
    castingTime: Действие
    range: 90 футов
    material: тухлое яйцо
    duration: До 1 минуты

- id: stone-shape
  name: Формирование камня
  description: |-
    *4-й уровень, Преобразование (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (мягкая глина)
    **Длительность:** Мгновенная

    Вы касаетесь каменного предмета размером Средний или меньше либо участка камня не более 5 футов в любом измерении и придаёте ему любую форму по вашему выбору. Например, вы можете превратить большой валун в оружие, статую или сундук либо проделать небольшой проход в стене толщиной 5 футов. Вы также можете придать каменной двери или её раме такую форму, чтобы дверь была запечатана. Создаваемый предмет может иметь до двух петель и защёлку, но тонкие механические детали невозможны.
  properties:
    castingTime: Действие
    range: Касание
    material: мягкая глина
    duration: Мгновенная

- id: stoneskin
  name: Каменная кожа
  description: |-
    *4-й уровень, Преобразование (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (алмазная пыль стоимостью 100+ зм, которую заклинание поглощает)
    **Длительность:** Концентрация, до 1 часа

    Пока заклинание не окончится, одно добровольное существо, которого вы касаетесь, получает сопротивление дробящему, колющему и рубящему урону.
  properties:
    castingTime: Действие
    range: Касание
    material: алмазная пыль стоимостью 100+ зм, которую заклинание поглощает
    duration: До 1 часа

- id: storm-of-vengeance
  name: Буря мести
  description: |-
    *9-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 1 миля
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Грозовая туча формируется на протяжении длительности в точке в пределах дистанции и разрастается до радиуса 300 футов. Каждое существо под тучей в момент её появления должно преуспеть в спасброске Телосложения, иначе получит 2d6 урона звуком и состояние Оглохший на протяжении длительности.
    В начале каждого вашего последующего хода буря создаёт разные эффекты, как описано ниже.
    Ход 2. Падает кислотный дождь. Каждое существо и предмет под тучей получает 4d6 урона кислотным.
    Ход 3. Вы призываете шесть молний из тучи, чтобы ударить по шести разным существам или предметам под ней. Каждая цель совершает спасбросок Ловкости и получает 10d6 урона электричеством при провале или вдвое меньше урона при успехе.
    Ход 4. Проливается град. Каждое существо под тучей получает 2d6 урона дробящим.
    Ходы 5-10. Порывы ветра и ледяной дождь обрушиваются на область под тучей. Каждое существо там получает 1d6 урона холодом. Пока заклинание не окончится, область является труднопроходимой местностью и сильно затемнена, дальнобойные атаки оружием там невозможны, а через область дует сильный ветер.
  properties:
    castingTime: Действие
    range: 1 миля
    duration: До 1 минуты

- id: suggestion
  name: Внушение
  description: |-
    *2-й уровень, Очарование (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, М (капля мёда)
    **Длительность:** Концентрация, до 8 часов

    Вы предлагаете вариант действий, описанный не более чем 25 словами, одному существу, которое вы видите в пределах дистанции и которое может вас слышать и понимать. Предложение должно звучать выполнимо и не должно включать ничего, что явно нанесло бы урон цели или её союзникам. Например, вы можете сказать: «Принеси ключ от сокровищницы культа и отдай его мне». Или: «Прекратите драку, спокойно покиньте эту библиотеку и не возвращайтесь».
    Цель должна преуспеть в спасброске Мудрости, иначе получит состояние Очарованный на время действия заклинания или до тех пор, пока вы или ваши союзники не нанесёте ей урон. Очарованная цель стремится выполнить предложение по мере своих возможностей. Предложенное действие может продолжаться всю длительность, но если его можно выполнить быстрее, заклинание для цели прекращается, как только она его выполнит.
  properties:
    castingTime: Действие
    range: 30 футов
    material: капля мёда
    duration: До 8 часов
- id: summon-dragon
  name: Призыв дракона
  description: |-
    *5-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (предмет с изображением дракона, выгравированным на нём, стоимостью 500+ зм)
    **Длительность:** Концентрация, до 1 часа

    Вы призываете дух дракона. Он появляется в незанятом пространстве, которое вы видите в пределах дистанции, и использует стат-блок «Драконий дух». Существо исчезает, когда его очки здоровья снижаются до 0, или когда заклинание заканчивается.
    Существо является союзником для вас и ваших союзников. В бою существо делит с вами значение инициативы, но ходит сразу после вас. Оно подчиняется вашим словесным приказам (действие с вашей стороны не требуется). Если вы не отдаёте приказов, оно совершает действие Уклонение и использует своё перемещение, чтобы избежать опасности.

    **Использование ячейки более высокого уровня.** Используйте уровень ячейки заклинания как уровень заклинания в стат-блоке. Большой дракон, нейтральный, КД 14 + уровень заклинания, ОЗ 50 + 10 за каждый уровень заклинания выше 5, Скорость 30 фт., полёт 60 фт., плавание 30 фт.  МОД СПАС    МОД СПАС    МОД СПАС  СИЛ 19 +4 +4 ЛОВ 14 +2 +2 ТЕЛ 17 +3 +3 ИНТ 10 +0 +0 МУД 14 +2 +2 ХАР 14 +2 +2 Сопротивления: кислотный, холод, огонь, электричество, яд. Иммунитеты: очарованный, испуганный, отравленный. Чувства: слепое зрение 30 фт., тёмное зрение 60 фт.; пассивная Внимательность 12. Языки: драконий, понимает языки, которые знаете вы. ПО нет (опыт 0; БМ равен вашему бонусу мастерства). Особенности: Общее сопротивление. Когда вы призываете дух, выберите одно из его сопротивлений. Вы получаете сопротивление выбранному типу урона до конца действия заклинания. Действия: Множественная атака. Дух совершает количество атак «Разрыв», равное половине уровня заклинания (округлённо вниз), и использует Дыхание. Разрыв. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 10 футов. Попадание: 1d6 + 4 + уровень заклинания колющего урона. Дыхание. Спасбросок Ловкости: Сл равна вашей Сл спасброска заклинаний, каждое существо в конусе 30 футов. Провал: 2d6 урона типа, к которому дух имеет сопротивление (по вашему выбору при сотворении заклинания). Успех: половина урона.
  properties:
    castingTime: Действие
    range: 60 футов
    material: предмет с изображением дракона, выгравированным на нём, стоимостью 500+ зм
    duration: до 1 часа
    higherLevel: |-
      Используйте уровень ячейки заклинания как уровень заклинания в стат-блоке. Большой дракон, нейтральный, КД 14 + уровень заклинания, ОЗ 50 + 10 за каждый уровень заклинания выше 5, Скорость 30 фт., полёт 60 фт., плавание 30 фт.  МОД СПАС    МОД СПАС    МОД СПАС  СИЛ 19 +4 +4 ЛОВ 14 +2 +2 ТЕЛ 17 +3 +3 ИНТ 10 +0 +0 МУД 14 +2 +2 ХАР 14 +2 +2 Сопротивления: кислотный, холод, огонь, электричество, яд. Иммунитеты: очарованный, испуганный, отравленный. Чувства: слепое зрение 30 фт., тёмное зрение 60 фт.; пассивная Внимательность 12. Языки: драконий, понимает языки, которые знаете вы. ПО нет (опыт 0; БМ равен вашему бонусу мастерства). Особенности: Общее сопротивление. Когда вы призываете дух, выберите одно из его сопротивлений. Вы получаете сопротивление выбранному типу урона до конца действия заклинания. Действия: Множественная атака. Дух совершает количество атак «Разрыв», равное половине уровня заклинания (округлённо вниз), и использует Дыхание. Разрыв. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 10 футов. Попадание: 1d6 + 4 + уровень заклинания колющего урона. Дыхание. Спасбросок Ловкости: Сл равна вашей Сл спасброска заклинаний, каждое существо в конусе 30 футов. Провал: 2d6 урона типа, к которому дух имеет сопротивление (по вашему выбору при сотворении заклинания). Успех: половина урона.

- id: sunbeam
  name: Солнечный луч
  description: |-
    *6-й уровень, Воплощение (Жрец, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С, М (увеличительное стекло)
    **Длительность:** Концентрация, до 1 минуты

    Вы испускаете солнечный луч в линию шириной 5 футов и длиной 60 футов. Каждое существо в линии совершает спасбросок Телосложения. При провале существо получает 6d8 урона излучением и получает состояние «Ослеплённый» до начала вашего следующего хода. При успехе существо получает только половину урона.
    Пока заклинание действует, вы можете потратить магическое действие, чтобы создать новую линию сияния.
    На протяжении действия заклинания над вами сияет частица ослепительного света. Она создаёт яркий свет в радиусе 30 футов и тусклый свет на дополнительные 30 футов. Этот свет является солнечным.
  properties:
    castingTime: Действие
    range: На себя
    material: увеличительное стекло
    duration: до 1 минуты

- id: sunburst
  name: Солнечная вспышка
  description: |-
    *8-й уровень, Воплощение (Жрец, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (кусок солнечного камня)
    **Длительность:** Мгновенная

    Яркий солнечный свет вспыхивает в сфере радиусом 60 футов с центром в точке по вашему выбору в пределах дистанции. Каждое существо в сфере совершает спасбросок Телосложения. При провале существо получает 12d6 урона излучением и получает состояние «Ослеплённый» на 1 минуту. При успехе существо получает только половину урона.
    Существо, ослеплённое этим заклинанием, совершает ещё один спасбросок Телосложения в конце каждого своего хода и при успехе прекращает эффект на себе.
    Это заклинание рассеивает тьму, созданную любым заклинанием, в своей области.
  properties:
    castingTime: Действие
    range: 150 футов
    material: кусок солнечного камня
    duration: мгновенная

- id: symbol
  name: Символ
  description: |-
    *7-й уровень, Ограждение (Бард, Жрец, Друид, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** Касание
    **Компоненты:** В, С, М (порошок алмаза стоимостью 1,000+ зм, который заклинание расходует)
    **Длительность:** До рассеивания или срабатывания

    Вы наносите вредоносный глиф либо на поверхность (например, на участок пола или стены), либо внутрь предмета, который можно закрыть (например, книгу или сундук). Глиф может покрывать площадь не больше 10 футов в диаметре. Если вы выбрали предмет, он должен оставаться на месте; если его переместили больше чем на 10 футов от места, где вы сотворили заклинание, глиф разрушается, и заклинание заканчивается, так и не сработав.
    Глиф почти незаметен, и чтобы его обнаружить, требуется успешная проверка Мудрости (Внимательность) против Сл спасброска вашего заклинания.
    Нанося глиф, вы задаёте его срабатывание и выбираете эффект, который он несёт: Смерть, Раздор, Страх, Боль, Сон или Оглушение. Каждый из них описан ниже.
    Задание срабатывания. Вы решаете, что приведёт глиф в действие, когда сотворяете заклинание. Для глифов, нанесённых на поверхность, обычные условия срабатывания: прикосновение или наступание на глиф, удаление предмета, который его закрывает, или приближение к нему на определённое расстояние. Для глифов, нанесённых внутрь предмета, обычные условия: открытие этого предмета или просмотр глифа.
    Вы можете уточнить условие срабатывания так, чтобы глиф активировали только существа определённых типов (например, его можно настроить так, чтобы он воздействовал на аберраций). Также можно задать условия для существ, которые не активируют глиф, например для тех, кто произносит определённый пароль.
    После срабатывания глиф светится, заполняя сферу радиусом 60 футов тусклым светом на 10 минут, после чего заклинание заканчивается. Каждое существо в сфере в момент активации глифа становится его целью, как и существо, которое впервые входит в сферу за ход или заканчивает там свой ход. Существо может стать целью только один раз за ход.
    Смерть. Каждая цель совершает спасбросок Телосложения и получает 10d10 урона некротической энергией при провале или половину урона при успехе.
    Раздор. Каждая цель совершает спасбросок Мудрости. При провале цель в течение 1 минуты спорит с другими существами. В это время она не способна к осмысленному общению и совершает броски атаки и проверки характеристик с помехой.
    Страх. Каждая цель должна преуспеть в спасброске Мудрости или получить состояние «Испуганный» на 1 минуту. Пока цель испугана, она на каждом своём ходу должна отойти от глифа как минимум на 30 футов, если может.
    Боль. Каждая цель должна преуспеть в спасброске Телосложения или получить состояние «Выведенный из строя» на 1 минуту.
    Сон. Каждая цель должна преуспеть в спасброске Мудрости или получить состояние «Без сознания» на 10 минут. Существо просыпается, если получит урон или если кто-то потратит действие, чтобы его разбудить.
    Оглушение. Каждая цель должна преуспеть в спасброске Мудрости или получить состояние «Ошеломлённый» на 1 минуту.
  properties:
    castingTime: 1 минута
    range: Касание
    material: порошок алмаза стоимостью 1,000+ зм, который заклинание расходует
    duration: до рассеивания или срабатывания

- id: telekinesis
  name: Телекинез
  description: |-
    *5-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 10 минут

    Вы получаете способность перемещать или подчинять себе существ и предметы силой мысли. Когда вы сотворяете заклинание, а также магическим действием на своих последующих ходах до окончания заклинания, вы можете проявить свою волю к одному существу или предмету, который видите в пределах дистанции, вызвав один из эффектов ниже. Вы можете воздействовать на одну и ту же цель раунд за раундом или выбрать новую в любой момент. Если вы переключаетесь на другую цель, предыдущая цель больше не находится под действием заклинания.
    Существо. Вы можете попытаться переместить существо размера Огромный или меньше. Цель должна преуспеть в спасброске Силы, иначе вы переместите её на расстояние до 30 футов в любом направлении в пределах дистанции заклинания. До конца вашего следующего хода существо получает состояние «Опутанный», а если вы подняли его в воздух, оно остаётся висеть там. Оно падает в конце вашего следующего хода, если вы не используете этот вариант против него снова и оно провалит спасбросок.
    Предмет. Вы можете попытаться переместить предмет размера Огромный или меньше. Если предмет не надет и не несётся, вы автоматически перемещаете его на расстояние до 30 футов в любом направлении в пределах дистанции заклинания.
    Если предмет надет или несётся существом, это существо должно преуспеть в спасброске Силы, иначе вы вырываете предмет и перемещаете его на расстояние до 30 футов в любом направлении в пределах дистанции заклинания.
    Вы можете тонко управлять предметами своим телекинетическим захватом, например, манипулировать простым инструментом,
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 10 минут

- id: telepathic-bond
  name: Телепатическая связь
  description: |-
    *5-й уровень, Прорицание (Бард, Волшебник)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (два яйца)
    **Длительность:** 1 час

    Вы создаёте телепатическую связь между до восьми добровольными существами по вашему выбору в пределах дистанции, психически связывая каждое существо со всеми остальными на время действия заклинания. Существа, которые не могут общаться ни на одном языке, не подвергаются действию этого заклинания.
    Пока заклинание действует, цели могут общаться телепатически через эту связь независимо от того, есть ли у них общий язык. Связь возможна на любом расстоянии, однако не может распространяться на другие планы существования.
  properties:
    castingTime: Действие
    range: 30 футов
    material: два яйца
    duration: 1 час

- id: teleport
  name: Телепортация
  description: |-
    *7-й уровень, Вызов (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 10 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    Это заклинание мгновенно переносит вас и до восьми добровольных существ, которых вы видите в пределах дистанции, либо один предмет, который вы видите в пределах дистанции, в выбранное вами место назначения. Если вы выбираете предмет, он должен быть размера Большой или меньше и не может быть в руках или при ношении у существа, которое не согласно.
    Место назначения должно быть известно вам и находиться на том же плане существования, что и вы. Насколько хорошо вы знакомы с местом назначения, определяет, благополучно ли вы туда прибудете. Мастер бросает 1d100 и сверяется с таблицей результатов телепортации и пояснениями после неё. Результат телепортации  Исход  Знакомство Неудача Похожая область  Мимо цели
    На цели Постоянный круг 01-00 Связанный предмет 01-00 Очень знакомое место 01-05 06-13 14-24 25-00 Видели мельком 01-33 34-43 44-53 54-00 Видели однажды или описано 01-43 44-53 54-73 74-00 Ложное место 01-50 51-00 -
    Знакомство. Вот значения терминов из столбца «Знакомство» таблицы: • «Постоянный круг» означает постоянный круг телепортации, последовательность печатей которого вы знаете. • «Связанный предмет» означает, что у вас есть предмет, взятый из желаемого места назначения в течение последних шести месяцев, например книга из библиотеки волшебника. • «Очень знакомое место» — место, которое вы посещали часто, тщательно изучали или которое видите при сотворении заклинания. • «Видели мельком» — место, которое вы видели больше одного раза, но с которым вы не очень знакомы. • «Видели однажды или описано» — место, которое вы видели однажды, возможно с помощью магии, или место, которое вы знаете по чьему-то описанию, например по карте. • «Ложное место» — место, которого не существует. Возможно, вы пытались провидеть логово врага, но увидели иллюзию, или вы пытаетесь телепортироваться в место, которое больше не существует.
    Неудача. Непредсказуемая магия заклинания приводит к трудному путешествию. Каждое телепортирующееся существо (или целевой предмет) получает 3d10 урона силовым полем, а мастер заново бросает по таблице, чтобы определить, где вы окажетесь (неудач может быть несколько, и каждая наносит урон).
    Похожая область. Вы и ваша группа (или целевой предмет) появляетесь в другой области, которая визуально или по духу похожа на целевую. Вы появляетесь в ближайшем похожем месте. Если вы направлялись в свою домашнюю лабораторию, например, вы можете оказаться в чужой лаборатории в том же городе.
    Мимо цели. Вы и ваша группа (или целевой предмет) появляетесь в 2d12 милях от места назначения в случайном направлении. Бросьте 1d8, чтобы определить направление: 1 — восток; 2 — юго-восток; 3 — юг; 4 — юго-запад; 5 — запад; 6 — северо-запад; 7 — север; 8 — северо-восток.
    На цели. Вы и ваша группа (или целевой предмет) появляетесь там, где и намеревались.
  properties:
    castingTime: Действие
    range: 10 футов
    duration: мгновенная

- id: teleportation-circle
  name: Круг телепортации
  description: |-
    *5-й уровень, Вызов (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 10 футов
    **Компоненты:** В, М (редкие чернила стоимостью 50+ зм, которые заклинание расходует)
    **Длительность:** 1 раунд

    Сотворяя заклинание, вы чертите на земле круг радиусом 5 футов, испещрённый печатями, которые связывают ваше место с постоянным кругом телепортации по вашему выбору. Последовательность печатей этого круга вы должны знать, и он должен находиться на том же плане существования, что и вы. В начерченном круге открывается мерцающий портал, который остаётся открытым до конца вашего следующего хода. Любое существо, которое войдёт в портал, мгновенно появится в пределах 5 футов от круга назначения или в ближайшем свободном пространстве, если сам круг занят.
    Многие крупные храмы, гильдии и другие важные места имеют постоянные круги телепортации. У каждого круга есть уникальная последовательность печатей, то есть цепочка рун, выстроенных в определённом порядке.
    Когда вы впервые получаете способность сотворять это заклинание, вы узнаёте последовательности печатей для двух мест на Материальном плане, которые определяет мастер. Вы можете узнать и другие последовательности печатей в ходе приключений. Чтобы запомнить новую последовательность печатей, нужно изучать её в течение 1 минуты.
    Вы можете создать постоянный круг телепортации, сотворяя это заклинание в одном и том же месте каждый день в течение 365 дней.
  properties:
    castingTime: 1 минута
    range: 10 футов
    material: редкие чернила стоимостью 50+ зм, которые заклинание расходует
    duration: 1 раунд

- id: thaumaturgy
  name: Чудотворство
  description: |-
    *Заговор Преобразования (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В
    **Длительность:** До 1 минуты

    Вы создаёте небольшое чудо в пределах дистанции. Вы создаёте один из перечисленных ниже эффектов в пределах дистанции. Если вы сотворяете это заклинание несколько раз, вы можете иметь до трёх его эффектов длительностью 1 минута одновременно.
    Изменённые глаза. Вы меняете внешний вид своих глаз на 1 минуту.
    Громовой голос. Ваш голос звучит в три раза громче обычного на 1 минуту. На это время вы совершаете проверки Харизмы (Запугивание) с преимуществом.
    Игра огня. Вы заставляете пламя замерцать, разгореться, стать тусклее или сменить цвет на 1 минуту.
    Невидимая рука. Вы мгновенно заставляете незапертую дверь или окно распахнуться или захлопнуться.
    Фантомный звук. Вы создаёте мгновенный звук, который исходит из выбранной вами точки в пределах дистанции, например раскат грома, крик ворона или зловещий шёпот.
    Подземные толчки. Вы вызываете безвредные толчки земли на 1 минуту.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты

- id: thunderwave
  name: Громовая волна
  description: |-
    *1-й уровень, Воплощение (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Вы высвобождаете волну громового звука. Каждое существо в кубе 15 футов, исходящем из вас, совершает спасбросок Телосложения. При провале существо получает 2d8 урона звуком и отталкивается на 10 футов от вас. При успехе существо получает только половину урона.
    Кроме того, неприкреплённые предметы, полностью находящиеся внутри куба, отбрасываются на 10 футов от вас, а громовой раскат слышен на расстоянии до 300 футов.   Использование ячейки более высокого уровня. Урон увеличивается на 1d8 за каждый уровень ячейки заклинания выше 1-го.
  properties:
    castingTime: Действие
    range: На себя
    duration: мгновенная

- id: time-stop
  name: Остановка времени
  description: |-
    *9-й уровень, Преобразование (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В
    **Длительность:** Мгновенная

    Вы на короткое время останавливаете течение времени для всех, кроме себя. Для других существ время не проходит, а вы совершаете подряд 1d4 + 1 ходов, в течение которых можете использовать действия и перемещаться как обычно.
    Заклинание заканчивается, если одно из действий, которые вы совершаете в этот период, или любой эффект, который вы создаёте в это время, воздействует на существо, отличное от вас, или на предмет, который несёт или носит кто-то другой. Кроме того, заклинание заканчивается, если вы переместитесь в место, находящееся дальше чем в 1,000 футов от точки, где вы его сотворили.
  properties:
    castingTime: Действие
    range: На себя
    duration: мгновенная

- id: tiny-hut
  name: Крошечная хижина
  description: |-
    *3-й уровень, Воплощение (Бард, Волшебник)*

    **Время сотворения:** 1 минута или ритуал
    **Дистанция:** На себя
    **Компоненты:** В, С, М (хрустальная бусина)
    **Длительность:** 8 часов

    Вокруг вас возникает эманация размером 10 футов, которая остаётся неподвижной на протяжении действия заклинания. Заклинание не срабатывает, если эманация не достаточно велика, чтобы полностью охватить все существа в своей области.
    Существа и предметы, находящиеся в эманации в момент сотворения заклинания, могут свободно проходить сквозь неё. Все остальные существа и предметы не могут проходить сквозь неё. Заклинания 3-го уровня и ниже нельзя сотворить через неё, и их эффекты не могут распространяться внутрь неё.
    Атмосфера внутри эманации комфортна и суха независимо от погоды снаружи. Пока заклинание действует, вы можете приказать, чтобы внутри был тусклый свет или тьма (действие не требуется). Эманация непрозрачна снаружи и может быть любого цвета по вашему выбору, но изнутри она прозрачна.
    Заклинание заканчивается досрочно, если вы покидаете эманацию или сотворяете заклинание снова.
  properties:
    castingTime: 1 минута
    range: На себя
    material: хрустальная бусина
    duration: 8 часов
- id: tongues
  name: Языки
  description: |-
    *3-й уровень, Прорицание (Бард, Жрец, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, М (миниатюрный зиккурат)
    **Длительность:** 1 час

    Это заклинание даёт существу, которого вы касаетесь, способность понимать любой устный или жестовый язык, который оно слышит или видит. Более того, когда цель говорит или общается жестами, любое существо, знающее хотя бы один язык, может её понять, если способно слышать речь или видеть жесты.
  properties:
    castingTime: Действие
    range: Касание
    material: миниатюрный зиккурат
    duration: 1 час
- id: transport-via-plants
  name: Перенос через растения
  description: |-
    *6-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 10 футов
    **Компоненты:** В, С
    **Длительность:** 1 минута

    Это заклинание создаёт магическую связь между неодушевлённым растением Большого или большего размера в пределах дистанции и другим растением на любом расстоянии, на том же плане существования. Вы должны хотя бы однажды видеть или касаться растения-назначения до того, как сотворить заклинание. На время действия заклинания любое существо может войти в целевое растение и выйти из растения-назначения, потратив 5 футов движения.
  properties:
    castingTime: Действие
    range: 10 футов
    duration: 1 минута
- id: tree-stride
  name: Шаг через деревья
  description: |-
    *5-й уровень, Вызов (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы получаете способность войти в дерево и переместиться из его нутра в нутро другого дерева того же вида в пределах 500 футов. Оба дерева должны быть живыми и не меньше вас по размеру. Чтобы войти в дерево, вы должны потратить 5 футов движения. Вы мгновенно узнаёте расположение всех других деревьев того же вида в пределах 500 футов и, как часть перемещения, потраченного на вход в дерево, можете либо перейти в одно из этих деревьев, либо выйти из дерева, в котором находитесь. Вы появляетесь в выбранном вами месте в пределах 5 футов от дерева-назначения, потратив ещё 5 футов движения. Если у вас не осталось движения, вы появляетесь в пределах 5 футов от дерева, в которое вошли.
    Вы можете использовать эту способность перемещения только один раз за свой ход. Вы должны заканчивать каждый ход вне дерева.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 минуты
- id: true-polymorph
  name: Истинное превращение
  description: |-
    *9-й уровень, Преобразование (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (капля ртути, комочек аравийской камеди и струйка дыма)
    **Длительность:** Концентрация, до 1 часа

    Выберите одно существо или неволшебный предмет, который вы видите в пределах дистанции. Существо превращается в другое существо или неволшебный предмет, либо предмет превращается в существо (предмет не должен быть надет или нести при себе). Превращение длится всё время действия заклинания или до тех пор, пока цель не умрёт или не будет уничтожена, но если вы поддерживаете Концентрацию на это заклинание всё время его действия, оно продолжается, пока его не рассеют.
    Нежелающее существо может совершить спасбросок Мудрости, и если оно преуспеет, заклинание на него не действует.
    Существо в существо. Если вы превращаете существо в существо другого вида, новой формой может стать любой вид, который вы выберете, с показателем опасности не выше показателя опасности или уровня цели. Игровые характеристики цели заменяются характеристиками блока статистики новой формы, но цель сохраняет свои очки здоровья, кости здоровья, мировоззрение и личность.
    Цель получает количество Временных очков здоровья, равное очкам здоровья новой формы. Эти Временные очки здоровья исчезают, если какие-то из них остались, когда заклинание заканчивается.
    Цель ограничена в действиях, которые может совершать, анатомией новой формы, и не может говорить или сотворять заклинания.
    Снаряжение цели сливается с новой формой. Существо не может использовать или иным образом извлекать пользу из любого этого снаряжения.
    Предмет в существо. Вы можете превратить предмет в существо любого вида, если размер существа не больше размера предмета, а показатель опасности существа 9 или ниже. Существо дружелюбно к вам и вашим союзникам. В бою оно совершает свои ходы сразу после ваших и подчиняется вашим командам.
    Если заклинание длится больше часа, вы больше не контролируете существо. Оно может остаться дружелюбным к вам, в зависимости от того, как вы с ним обращались.
    Существо в предмет. Если вы превращаете существо в предмет, оно превращается в эту форму вместе с тем, что на нём надето и что оно несёт, если размер предмета не больше размера существа. Игровые характеристики существа становятся характеристиками предмета, и после окончания заклинания и возвращения в обычный облик существо не помнит времени, проведённого в этой форме.
  properties:
    castingTime: Действие
    range: 30 футов
    material: капля ртути, комочек аравийской камеди и струйка дыма
    duration: до 1 часа
- id: true-resurrection
  name: Истинное воскрешение
  description: |-
    *9-й уровень, Некромантия (Жрец, Друид)*

    **Время сотворения:** 1 час
    **Дистанция:** Касание
    **Компоненты:** В, С, М (алмазы стоимостью 25,000+ зм, которые заклинание расходует)
    **Длительность:** Мгновенная

    Вы касаетесь существа, которое было мертво не дольше 200 лет и умерло по любой причине, кроме старости. Существо возвращается к жизни со всеми своими очками здоровья.
    Это заклинание затягивает все раны, нейтрализует любые яды, излечивает все магические заражения и снимает любые проклятия, действовавшие на существо в момент его смерти. Заклинание восстанавливает повреждённые или утраченные органы и конечности. Если существо было нежитью, оно возвращается в свой прежний облик живого существа.
    Заклинание может создать новое тело, если исходное больше не существует, и в этом случае вы должны назвать имя существа. Тогда существо появляется в свободном месте, которое вы выберете в пределах 10 футов от вас.
  properties:
    castingTime: 1 час
    range: Касание
    material: алмазы стоимостью 25,000+ зм, которые заклинание расходует
    duration: Мгновенная
- id: true-seeing
  name: Истинное зрение
  description: |-
    *6-й уровень, Прорицание (Бард, Жрец, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (порошок грибов стоимостью 25+ зм, который заклинание расходует)
    **Длительность:** 1 час

    На время действия заклинания добровольное существо, которого вы касаетесь, обладает Истинным зрением на дистанции 120 футов.
  properties:
    castingTime: Действие
    range: Касание
    material: порошок грибов стоимостью 25+ зм, который заклинание расходует
    duration: 1 час
- id: true-strike
  name: Истинный удар
  description: |-
    *Заговор Прорицания (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** С, М (оружие, владение которым у вас есть и стоимостью 1+ мм)
    **Длительность:** Мгновенная

    Направляемые вспышкой магического озарения, вы совершаете одну атаку оружием, использованным при сотворении заклинания. Атака использует для бросков атаки и урона вашу характеристику заклинаний вместо Силы или Ловкости. Если атака наносит урон, он может быть излучением или обычным типом урона оружия (на ваш выбор).
    Усиление заговора. Независимо от того, наносите ли вы урон излучением или обычным типом урона оружия, атака наносит дополнительный урон излучением, когда вы достигаете 5-го (1d6), 11-го (2d6) и 17-го (3d6) уровня.
  properties:
    castingTime: Действие
    range: На себя
    material: оружие, владение которым у вас есть и стоимостью 1+ мм
    duration: Мгновенная
- id: tsunami
  name: Цунами
  description: |-
    *8-й уровень, Вызов (Друид)*

    **Время сотворения:** 1 минута
    **Дистанция:** 1 миля
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 6 раундов

    Стена воды возникает в точке, которую вы выбираете в пределах дистанции. Вы можете создать стену длиной до 300 футов, высотой 300 футов и толщиной 50 футов. Стена существует в течение всего срока действия заклинания. Когда стена появляется, каждое существо в её области совершает спасбросок Силы, получая 6d10 дробящего урона при провале или половину этого урона при успехе. В начале каждого вашего хода после появления стены стена вместе с находящимися в ней существами перемещается на 50 футов от вас. Любое существо Огромного или меньшего размера, которое находится внутри стены или пространство которого стена занимает при движении, должно преуспеть в спасброске Силы или получить 5d10 дробящего урона. Существо может получить этот урон только один раз за раунд. В конце хода высота стены уменьшается на 50 футов, а урон, который стена наносит в последующие раунды, уменьшается на 1d10. Когда высота стены достигает 0 футов, заклинание заканчивается. Существо, оказавшееся в стене, может двигаться вплавь. Но из-за силы волны оно должно преуспеть в проверке Силы (Атлетики) против Сложности спасброска вашего заклинания, чтобы вообще переместиться. Если оно проваливает проверку, то не может двигаться. Существо, выбравшееся из стены, падает на землю.
  properties:
    castingTime: 1 минута
    range: 1 миля
    duration: до 6 раундов
- id: unseen-servant
  name: Незримый слуга
  description: |-
    *1-й уровень, Вызов (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (кусочек верёвки и кусочек дерева)
    **Длительность:** 1 час

    Это заклинание создаёт невидимую, безмозглую и бесформенную силовую сущность среднего размера, которая выполняет простые задания по вашей команде до окончания заклинания. Слуга появляется в свободном месте на земле в пределах дистанции. У него Класс Брони 10, 1 очко здоровья и Сила 2, и он не может атаковать. Если его очки здоровья падают до 0, заклинание заканчивается.
    Один раз в каждом вашем ходу как бонусное действие вы можете мысленно приказать слуге переместиться на 15 футов и взаимодействовать с предметом. Слуга может выполнять простые задания, которые под силу человеку, например приносить вещи, убираться, чинить, складывать одежду, разжигать огонь, подавать еду и разливать напитки. Когда вы отдаёте приказ, слуга выполняет задание как можно лучше, пока не завершит его, а затем ждёт вашей следующей команды.
    Если вы прикажете слуге выполнить задание, которое переместит его больше чем на 60 футов от вас, заклинание заканчивается.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кусочек верёвки и кусочек дерева
    duration: 1 час
- id: vampiric-touch
  name: Вампирическое касание
  description: |-
    *3-й уровень, Некромантия (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Касание вашей окутанной тенями руки может высасывать жизненную силу из других существ, чтобы исцелять ваши раны. Совершите рукопашную атаку заклинанием по одному существу в пределах досягаемости. При попадании цель получает 3d6 урона некротической энергией, а вы восстанавливаете очки здоровья, равные половине нанесённого некротического урона.
    Пока заклинание действует, вы можете совершать эту атаку в каждом своём ходу как магическое действие, нацеливаясь на то же существо или на другое.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d6 за каждый уровень ячейки заклинаний выше 3-го.
  properties:
    castingTime: Действие
    range: На себя
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d6 за каждый уровень ячейки заклинаний выше 3-го.
- id: vicious-mockery
  name: Злобная насмешка
  description: |-
    *Заговор Очарования (Бард)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В
    **Длительность:** Мгновенная

    Вы обрушиваете поток оскорблений, пропитанных тонкими чарами, на одно существо, которое видите или слышите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе получит 1d6 урона психической энергией и совершит с помехой следующий бросок атаки до конца своего следующего хода.
    Усиление заговора. Урон увеличивается на 1d6, когда вы достигаете 5-го (2d6), 11-го (3d6) и 17-го (4d6) уровня.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: Мгновенная
- id: vitriolic-sphere
  name: Купоросная сфера
  description: |-
    *4-й уровень, Воплощение (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 150 футов
    **Компоненты:** В, С, М (капля желчи)
    **Длительность:** Мгновенная

    Вы указываете на место в пределах дистанции, и туда устремляется светящийся шар кислоты диаметром 1 фут, который взрывается сферой радиусом 20 футов. Каждое существо в этой области совершает спасбросок Ловкости. При провале существо получает 10d4 урона кислотой и ещё 5d4 урона кислотой в конце своего следующего хода. При успехе существо получает только половину начального урона.

    **Использование ячейки более высокого уровня.** Начальный урон увеличивается на 2d4 за каждый уровень ячейки заклинаний выше 4-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: капля желчи
    duration: Мгновенная
    higherLevel: Начальный урон увеличивается на 2d4 за каждый уровень ячейки заклинаний выше 4-го.
- id: wall-of-fire
  name: Стена огня
  description: |-
    *4-й уровень, Воплощение (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (кусочек древесного угля)
    **Длительность:** до 1 минуты

    Вы создаёте стену огня на твёрдой поверхности в пределах дистанции. Стена может быть длиной до 60 футов, высотой 20 футов и толщиной 1 фут, или кольцевой, диаметром до 20 футов, высотой 20 футов и толщиной 1 фут. Стена непрозрачна и существует в течение всей длительности.
    Когда стена появляется, каждое существо в её области совершает спасбросок Ловкости, получая 5d8 урона огнём при провале или вдвое меньше при успехе.
    Одна сторона стены, выбранная вами при сотворении заклинания, наносит 5d8 урона огнём каждому существу, которое завершает ход в пределах 10 футов от этой стороны или внутри стены. Существо получает такой же урон, когда впервые входит в стену за ход или завершает ход внутри неё. Другая сторона стены урона не наносит.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: Действие
    range: 120 футов
    material: кусочек древесного угля
    duration: до 1 минуты
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
- id: wall-of-force
  name: Стена силы
  description: |-
    *5-й уровень, Воплощение (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (осколок стекла)
    **Длительность:** Концентрация, до 10 минут

    Невидимая стена из силового поля возникает в точке по вашему выбору в пределах дистанции. Стена появляется в любой ориентации, которую вы выберете: горизонтальным или вертикальным барьером либо под углом. Она может парить в воздухе или опираться на твёрдую поверхность. Вы можете придать ей форму полусферического купола или шара радиусом до 10 футов либо создать плоскую поверхность из десяти панелей размером 10 на 10 футов. Каждая панель должна примыкать к другой панели. В любой форме стена имеет толщину 1/4 дюйма и существует в течение всей длительности. Если стена пересекает пространство существа в момент появления, это существо отталкивается к одной из сторон стены (сторону выбираете вы).
    Ничто не может физически пройти сквозь стену. Она неуязвима для любого урона и не может быть развеяна заклинанием «Развеивание магии». Однако заклинание «Распад» мгновенно уничтожает стену. Стена также простирается в Эфирный план и блокирует эфирные перемещения сквозь неё.
  properties:
    castingTime: Действие
    range: 120 футов
    material: осколок стекла
    duration: до 10 минут
- id: wall-of-ice
  name: Ледяная стена
  description: |-
    *6-й уровень, Воплощение (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (кусочек кварца)
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте ледяную стену на твёрдой поверхности в пределах дистанции. Вы можете придать ей форму полусферического купола или шара радиусом до 10 футов либо создать плоскую поверхность из десяти квадратных панелей со стороной 10 футов. Каждая панель должна примыкать к другой панели. В любой форме стена имеет толщину 1 фут и существует в течение всей длительности.
    Если стена пересекает пространство существа в момент появления, это существо отталкивается к одной из сторон стены (сторону выбираете вы) и совершает спасбросок Ловкости, получая 10d6 урона холодом при провале или вдвое меньше при успехе.
    Стена является предметом, который можно повредить и тем самым пробить. Её Класс Брони равен 12, а каждый 10-футовый участок стены имеет 30 очков здоровья. Стена имеет иммунитет к урону холодом, ядом и психической энергией и уязвимость к урону огнём. Уменьшение 10-футового участка стены до 0 очков здоровья разрушает его и оставляет на его месте лист леденящего воздуха в пространстве, которое занимала стена.
    Существо, проходящее сквозь лист леденящего воздуха в первый раз за ход, совершает спасбросок Телосложения, получая 5d6 урона холодом при провале или вдвое меньше при успехе.

    **Использование ячейки более высокого уровня.** Урон, который стена наносит при появлении, увеличивается на 2d6, а урон от прохождения через лист леденящего воздуха увеличивается на 1d6 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 120 футов
    material: кусочек кварца
    duration: до 10 минут
    higherLevel: Урон, который стена наносит при появлении, увеличивается на 2d6, а урон от прохождения через лист леденящего воздуха увеличивается на 1d6 за каждый уровень ячейки выше 6-го.
- id: wall-of-stone
  name: Каменная стена
  description: |-
    *5-й уровень, Воплощение (Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (куб гранита)
    **Длительность:** Концентрация, до 10 минут

    Немагическая стена из твёрдого камня возникает в точке по вашему выбору в пределах дистанции. Стена имеет толщину 6 дюймов и состоит из десяти панелей размером 10 на 10 футов. Каждая панель должна примыкать к другой панели. Либо вы можете создать панели размером 10 на 20 футов толщиной всего 3 дюйма.
    Если стена пересекает пространство существа в момент появления, это существо отталкивается к одной из сторон стены (сторону выбираете вы). Если существо окружено стеной со всех сторон (или стеной и другой твёрдой поверхностью), оно может совершить спасбросок Ловкости. При успехе оно может использовать свою реакцию, чтобы переместиться на расстояние до своей скорости так, чтобы больше не находиться внутри стены.
    Стена может иметь любую форму, которую вы пожелаете, однако она не может занимать пространство существа или предмета. Стена не обязана быть вертикальной или опираться на прочное основание. Но она должна срастаться с существующим камнем и опираться на него. Поэтому этим заклинанием можно перекинуть мост через пропасть или создать пандус.
    Если вы создаёте пролёт длиннее 20 футов, размер каждой панели нужно уменьшить вдвое, чтобы создать опоры. Стену можно грубо обработать, придав ей зубцы и тому подобное. Стена является каменным предметом, который можно повредить и тем самым пробить. Каждая панель имеет Класс Брони 15 и 30 очков здоровья на дюйм толщины, а также иммунитет к урону ядом и психической энергией. Уменьшение панели до 0 очков здоровья уничтожает её, и связанные с ней панели могут обрушиться по решению Мастера.
    Если вы поддерживаете Концентрацию на этом заклинании всё время его длительности, стена становится постоянной и не может быть развеяна. Иначе стена исчезает, когда заклинание заканчивается.
  properties:
    castingTime: Действие
    range: 120 футов
    material: куб гранита
    duration: до 10 минут
- id: wall-of-thorns
  name: Стена терниев
  description: |-
    *6-й уровень, Вызов (Друид)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (горсть терниев)
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте стену из спутанных зарослей, усеянных острыми как игла шипами. Стена появляется в пределах дистанции на твёрдой поверхности и существует в течение всей длительности. Вы выбираете, сделать ли стену длиной до 60 футов, высотой 10 футов и толщиной 5 футов или круг диаметром 20 футов, высотой до 20 футов и толщиной 5 футов. Стена блокирует линию видимости.
    Когда стена появляется, каждое существо в её области совершает спасбросок Ловкости, получая 7d8 урона колющим при провале или вдвое меньше при успехе.
    Существо может пройти сквозь стену, хотя и медленно и мучительно. За каждый 1 фут пути сквозь стену существо тратит 4 фута движения. Кроме того, при первом входе в пространство стены за ход или завершении хода в нём существо совершает спасбросок Ловкости, получая 7d8 урона рубящим при провале или вдвое меньше при успехе. Существо совершает этот спасбросок только один раз за ход.

    **Использование ячейки более высокого уровня.** Оба вида урона увеличиваются на 1d8 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 120 футов
    material: горсть терниев
    duration: до 10 минут
    higherLevel: Оба вида урона увеличиваются на 1d8 за каждый уровень ячейки выше 6-го.
- id: warding-bond
  name: Оберегающая связь
  description: |-
    *2-й уровень, Ограждение (Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (пара платиновых колец стоимостью 50+ зм каждое, которые вы и цель должны носить в течение всей длительности)
    **Длительность:** 1 час

    Вы касаетесь существа, которое согласно на это, и создаёте мистическую связь между собой и целью до окончания заклинания. Пока цель находится в пределах 60 футов от вас, она получает бонус +1 к Классу Брони и спасброскам и имеет сопротивление всему урону. Кроме того, каждый раз, когда цель получает урон, вы получаете такое же количество урона.
    Заклинание заканчивается, если вы падаете до 0 очков здоровья или если вы с целью оказываетесь разделены расстоянием более 60 футов. Оно также заканчивается, если заклинание сотворяют снова на одном из связанных существ.
  properties:
    castingTime: Действие
    range: Касание
    material: пара платиновых колец стоимостью 50+ зм каждое, которые вы и цель должны носить в течение всей длительности
    duration: 1 час
- id: water-breathing
  name: Дыхание под водой
  description: |-
    *3-й уровень, Преобразование (Друид, Следопыт, Чародей, Волшебник)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (короткий тростник)
    **Длительность:** 24 часа

    Это заклинание даёт до десяти согласных на это существ по вашему выбору в пределах дистанции способность дышать под водой до окончания заклинания. Затронутые существа также сохраняют свой обычный способ дыхания.
  properties:
    castingTime: Действие
    range: 30 футов
    material: короткий тростник
    duration: 24 часа
- id: water-walk
  name: Хождение по воде
  description: |-
    *3-й уровень, Преобразование (Жрец, Друид, Следопыт, Чародей)*

    **Время сотворения:** Действие или ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (кусочек пробки)
    **Длительность:** 1 час

    Это заклинание даёт способность перемещаться по поверхности любой жидкости, такой как вода, кислота, грязь, снег, зыбучие пески или лава, как по безвредной твёрдой земле (существа, переходящие через расплавленную лаву, всё равно могут получить урон от жара). До десяти согласных на это существ по вашему выбору в пределах дистанции получают эту способность на время действия.
    Затронутое существо должно потратить бонусное действие, чтобы перейти с поверхности жидкости в саму жидкость и обратно, но если существо упадёт в жидкость, оно пройдёт сквозь поверхность и окажется в жидкости ниже.
  properties:
    castingTime: Действие
    range: 30 футов
    material: кусочек пробки
    duration: 1 час
- id: web
  name: Паутина
  description: |-
    *2-й уровень, Вызов (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (кусочек паутины)
    **Длительность:** Концентрация, до 1 часа

    Вы создаёте в пределах дистанции липкую массу паутины в одной точке. Паутина заполняет там куб со стороной 20 футов на всё время действия. Паутина считается труднопроходимой местностью, а область внутри неё слабо заслонена.
    Если паутина не закреплена между двумя твёрдыми массами (например, стенами или деревьями) или не растянута поперёк пола, стены или потолка, она обрушивается сама на себя, и заклинание заканчивается в начале вашего следующего хода. Паутина, растянутая над плоской поверхностью, имеет глубину 5 футов.
    Существо, впервые войдя в паутину за ход или начав в ней ход, должно преуспеть в спасброске Ловкости, иначе получит состояние «Опутанный», пока находится в паутине или пока не освободится.
    Существо, опутанное паутиной, может совершить действие и проверить Силу (Атлетика) против Сложности спасброска ваших заклинаний. При успехе оно больше не опутано.
    Паутина горюча. Любой куб паутины 5 футов, подвергшийся огню, сгорает за 1 раунд и наносит 2d4 урона огнём каждому существу, которое начинает в огне свой ход.
  properties:
    castingTime: Действие
    range: 60 футов
    material: кусочек паутины
    duration: до 1 часа
- id: weird
  name: Странность
  description: |-
    *9-й уровень, Иллюзия (Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Вы пытаетесь создать иллюзорные ужасы в сознании других. Каждое существо по вашему выбору в сфере радиусом 30 футов с центром в точке в пределах дистанции совершает спасбросок Мудрости. При провале цель получает 10d10 урона психической энергией и состояние «Испуганный» на время действия. При успехе цель получает только половину урона.
    Испуганная цель совершает спасбросок Мудрости в конце каждого своего хода. При провале она получает 5d10 урона психической энергией. При успехе заклинание заканчивается для этой цели.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 1 минуты
- id: wind-walk
  name: Хождение по ветру
  description: |-
    *6-й уровень, Преобразование (Друид)*

    **Время сотворения:** 1 минута
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (свеча)
    **Длительность:** 8 часов

    Вы и до десяти согласных на это существ по вашему выбору в пределах дистанции принимаете газообразную форму на время действия, выглядя как клочья облака. В этой облачной форме цель имеет скорость полёта 300 футов и может зависать в воздухе; она имеет иммунитет к состоянию «Лежащий ничком» и сопротивление дробящему, колющему и рубящему урону. Единственные действия, которые цель может совершить в этой форме, — это действие «Рывок» или магическое действие, чтобы начать возвращение к своей обычной форме. Возвращение занимает 1 минуту, в течение которой цель находится в состоянии «Ошеломлённый». До окончания заклинания цель может вернуться в облачную форму, что также требует магического действия и 1-минутного превращения.
    Если цель находится в облачной форме и летит, когда эффект заканчивается, она опускается на 60 футов в раунд в течение 1 минуты, пока не приземлится безопасно. Если она не может приземлиться за 1 минуту, она падает оставшееся расстояние.
  properties:
    castingTime: 1 минута
    range: 30 футов
    material: свеча
    duration: 8 часов
- id: wind-wall
  name: Ветряная стена
  description: |-
    *3-й уровень, Воплощение (Друид, Следопыт)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (веер и перо)
    **Длительность:** Концентрация, до 1 минуты

    Сильный ветер поднимается от земли в точке по вашему выбору в пределах дистанции. Вы можете создать стену длиной до 50 футов, высотой 15 футов и толщиной 1 фут. Её можно придать любую форму, если она образует один непрерывный путь вдоль земли. Стена существует в течение всей длительности.
    Когда стена появляется, каждое существо в её области совершает спасбросок Силы, получая 4d8 урона дробящим при провале или вдвое меньше при успехе.
    Сильный ветер не даёт туману, дыму и другим газам проникать сквозь стену. Летающие существа и предметы Маленького размера или меньше не могут пройти через стену. Лёгкие рыхлые материалы, попавшие в стену, взлетают вверх. Стрелы, болты и другие обычные снаряды, выпущенные в цели за стеной, отклоняются вверх и автоматически промахиваются. Валуны, метаемые великанами или осадными орудиями, и подобные снаряды не затрагиваются. Существа в газообразной форме не могут пройти через стену.
  properties:
    castingTime: Действие
    range: 120 футов
    material: веер и перо
    duration: до 1 минуты
- id: wish
  name: Желание
  description: |-
    *9-й уровень, Вызов (Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** V
    **Длительность:** Мгновенная

    Желание — самое могущественное заклинание, доступное смертному. Достаточно произнести его вслух, и вы сможете изменить саму реальность.
    Основное применение этого заклинания — повторить любое другое заклинание 8-го уровня или ниже. Если вы используете его так, вам не нужно выполнять никаких требований для сотворения этого заклинания, включая дорогостоящие компоненты. Заклинание просто срабатывает.
    Либо вы можете создать один из следующих эффектов по своему выбору: Создание предмета. Вы создаёте один предмет стоимостью до 25,000 зм, который не является магическим. Предмет может иметь размер не более 300 футов в любом измерении и появляется в свободном пространстве на земле, которое вы видите. Мгновенное исцеление. Вы позволяете себе и до двадцати существам, которых видите, восстановить все очки здоровья, и прекращаете все эффекты на них, перечисленные в заклинании «Высшее восстановление». Сопротивление. Вы даруете до десяти существам, которых видите, сопротивление одному типу урона по вашему выбору. Это сопротивление постоянно. Иммунитет к заклинанию. Вы даруете до десяти существам, которых видите, иммунитет к одному заклинанию или иному магическому эффекту на 8 часов. Внезапное обучение. Вы заменяете одну из своих черт другой чертой, для которой вы подходите. Вы теряете все преимущества старой черты и получаете преимущества новой. Нельзя заменить черту, которая является требованием для любой другой вашей черты или умения. Переброс. Вы отменяете одно недавнее событие, заставляя перебросить любой бросок кубика, сделанный в течение последнего раунда (включая ваш последний ход). Реальность перестраивается, чтобы принять новый результат. Например, заклинание Желание может отменить провалённый спасбросок союзника или критическое попадание врага. Вы можете заставить перебросить кубик с преимуществом или помехой, и вы сами выбираете, использовать ли новый результат или исходный. Переделка реальности. Вы можете пожелать то, что не входит ни в один из других эффектов. Для этого сформулируйте свое желание Мастеру как можно точнее. Мастер имеет большую свободу в решении того, что произойдёт; чем грандиознее желание, тем вероятнее, что что-то пойдёт не так. Заклинание может просто провалиться, желаемый эффект может быть достигнут лишь частично, или вы можете получить непредвиденные последствия из-за формулировки желания. Например, пожелание смерти злодею может перенести вас во времени в период, когда этого злодея уже нет в живых, фактически удалив вас из игры. Аналогично, желание получить легендарный магический предмет или артефакт может мгновенно перенести вас к нынешнему владельцу предмета. Если ваше желание сбылось и его последствия затрагивают целое сообщество, регион или мир, вы, вероятно, привлечёте могущественных врагов. Если ваше желание затронет бога, его божественные слуги могут мгновенно вмешаться, чтобы помешать ему или подтолкнуть вас сформулировать желание определённым образом. Если ваше желание отменит сам мультиверс, оно провалится. Напряжение от сотворения «Желания» ради любого эффекта, кроме дублирования другого заклинания, ослабляет вас. Испытав это напряжение, каждый раз, когда вы сотворяете заклинание до окончания продолжительного отдыха, вы получаете 1d10 урона некротической энергией за каждый уровень этого заклинания. Этот урон нельзя уменьшить или предотвратить никаким образом. Кроме того, ваша Сила становится равной 3 на 2d4 дня. За каждый из этих дней, который вы проводите в отдыхе, не занимаясь ничем, кроме лёгкой активности, оставшееся время восстановления уменьшается на 2 дня. Наконец, есть 33-процентный шанс, что вы навсегда утратите возможность сотворять «Желание», если испытаете это напряжение.
  properties:
    castingTime: Действие
    range: На себя
    duration: Мгновенная
- id: word-of-recall
  name: Слово возвращения
  description: |-
    *6-й уровень, Вызов (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 5 футов
    **Компоненты:** V
    **Длительность:** Мгновенная

    Вы и до пяти добровольных существ в пределах 5 футов от вас мгновенно телепортируетесь в заранее назначенное святилище. Вы и любые существа, телепортирующиеся вместе с вами, появляются в ближайшем свободном пространстве к точке, которую вы назначили при подготовке святилища (см. ниже). Если вы сотворите это заклинание, не подготовив сначала святилище, оно не окажет никакого эффекта.
    Вы должны назначить место, например храм, святилищем, сотворив здесь это заклинание.
  properties:
    castingTime: Действие
    range: 5 футов
    duration: Мгновенная
- id: zone-of-truth
  name: Зона истины
  description: |-
    *2-й уровень, Очарование (Бард, Жрец, Паладин)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S
    **Длительность:** 10 минут

    Вы создаёте магическую зону, защищающую от обмана, в сфере радиусом 15 футов с центром в точке в пределах дистанции. Пока заклинание действует, существо, которое впервые входит в область его действия за ход или начинает там свой ход, совершает спасбросок Харизмы. При провале спасброска существо не может произносить намеренную ложь, находясь в радиусе. Вы знаете, успешен или провален спасбросок существа.
    Затронутое существо знает о заклинании и может уклоняться от ответов на вопросы, на которые обычно ответило бы ложью. Такое существо может быть уклончивым, но должно говорить правду.
  properties:
    castingTime: Действие
    range: 60 футов
    duration: 10 минут
