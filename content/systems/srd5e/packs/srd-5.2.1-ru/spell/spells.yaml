- id: slow
  name: "Замедление"
  description: |-
    *Преобразование 3-го уровня (Бард, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С, М (капля патоки)  
    **Длительность:** Концентрация, до 1 минуты

    Вы изменяете течение времени вокруг до шести существ на ваш выбор в кубе с ребром 40 футов в пределах дистанции. Каждая цель должна преуспеть в спасброске Мудрости, иначе она подвергается действию заклинания на время его действия.

    Скорость затронутой цели уменьшается вдвое, она получает штраф −2 к КД и спасброскам Ловкости и не может совершать реакции. В свой ход она может совершить либо действие, либо бонусное действие, но не оба, и может совершить только одну атаку, если совершает действие Атака. Если она творит заклинание с соматическим компонентом, есть 25-процентная вероятность, что заклинание не сработает из-за слишком медленных жестов цели.

    Затронутая цель повторяет спасбросок в конце каждого своего хода, оканчивая заклинание на себе при успехе.
