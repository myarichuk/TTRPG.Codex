- id: thaumaturgy
  name: Чудотворство
  description: |-
    *Заговор Преобразования (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В
    **Длительность:** До 1 минуты

    Вы создаёте небольшое чудо в пределах дистанции. Вы создаёте один из перечисленных ниже эффектов в пределах дистанции. Если вы сотворяете это заклинание несколько раз, вы можете иметь до трёх его эффектов длительностью 1 минута одновременно.
    Изменённые глаза. Вы меняете внешний вид своих глаз на 1 минуту.
    Громовой голос. Ваш голос звучит в три раза громче обычного на 1 минуту. На это время вы совершаете проверки Харизмы (Запугивание) с преимуществом.
    Игра огня. Вы заставляете пламя замерцать, разгореться, стать тусклее или сменить цвет на 1 минуту.
    Невидимая рука. Вы мгновенно заставляете незапертую дверь или окно распахнуться или захлопнуться.
    Фантомный звук. Вы создаёте мгновенный звук, который исходит из выбранной вами точки в пределах дистанции, например раскат грома, крик ворона или зловещий шёпот.
    Подземные толчки. Вы вызываете безвредные толчки земли на 1 минуту.
  properties:
    castingTime: Действие
    range: 30 футов
    duration: до 1 минуты
