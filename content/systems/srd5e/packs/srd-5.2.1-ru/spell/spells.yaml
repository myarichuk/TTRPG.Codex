- id: clairvoyance
  name: "Ясновидение"
  description: |-
    *Прорицание 3-го уровня (Бард, Жрец, Чародей, Волшебник)*

    **Время накладывания:** 10 минут  
    **Дистанция:** 1 миля  
    **Компоненты:** В, С, М (фокус стоимостью 100+ зм — украшенный драгоценностями рог для слуха или стеклянный глаз для зрения)  
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте невидимый сенсор в пределах дистанции в месте, знакомом вам (место, которое вы посещали или видели ранее), или в очевидном месте, незнакомом вам (например, за дверью, за углом или в роще). Нематериальный, неуязвимый сенсор остаётся на месте на время действия заклинания.

    При сотворении заклинания выберите зрение или слух. Вы можете использовать выбранное чувство через сенсор, как если бы находились в его пространстве. Бонусным действием вы можете переключаться между зрением и слухом.

    Существо, которое видит сенсор (например, существо с заклинанием *Видение невидимого* или истинным зрением), видит светящуюся сферу размером с ваш кулак.
  properties:
    castingTime: "10 минут"
    range: "1 миля"
    material: "фокус стоимостью 100+ зм — украшенный драгоценностями рог для слуха или стеклянный глаз для зрения"
    duration: "Концентрация, до 10 минут"
# source: OmnisGM (CC BY 4.0)
- id: clone
  name: "Клон"
  description: |-
    *Некромантия 8-го уровня (Волшебник)*

    **Время накладывания:** 1 час  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (алмаз стоимостью 1000+ зм, потребляемый заклинанием, и герметичный сосуд стоимостью 2000+ зм, достаточно большой, чтобы вместить клонируемое существо)  
    **Длительность:** Мгновенная

    Вы касаетесь существа или хотя бы 1 кубического дюйма его плоти. Внутри сосуда, использованного при сотворении, формируется инертная копия этого существа, которая полностью вырастает через 120 дней; вы выбираете, будет ли готовый клон того же возраста, что и существо, или моложе. Клон остаётся инертным и существует неопределённо долго, пока его сосуд не потревожен.

    Если исходное существо умирает после того, как клон полностью сформирован, душа существа переносится в клон, если душа свободна и желает вернуться. Клон физически идентичен оригиналу и обладает теми же личностью, воспоминаниями и способностями, но не имеет снаряжения оригинала. Останки исходного существа, если таковые имеются, становятся инертными и не могут быть воскрешены, поскольку душа существа находится в другом месте.
  properties:
    castingTime: "1 час"
    range: "Касание"
    material: "алмаз стоимостью 1000+ зм, потребляемый заклинанием, и герметичный сосуд стоимостью 2000+ зм, достаточно большой, чтобы вместить клонируемое существо"
    duration: "Мгновенная"
