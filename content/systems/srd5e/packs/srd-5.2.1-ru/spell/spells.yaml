# source: OmnisGM (CC BY 4.0)
- id: seeming
  name: "Ложный облик"
  description: |-
    *Иллюзия 5-го уровня (Бард, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С  
    **Длительность:** 8 часов

    Вы придаёте иллюзорный облик каждому существу по вашему выбору, которое видите в пределах дистанции. Несогласная цель может совершить спасбросок Харизмы, и при успехе заклинание на неё не действует.

    Вы можете дать одинаковый или разный облик целям. Заклинание может изменить облик тел и снаряжения целей. Вы можете сделать каждое существо на 1 фут ниже или выше, тяжелее или легче. Новый облик цели должен иметь то же базовое расположение конечностей, но в остальном иллюзия на ваше усмотрение. Заклинание длится до окончания его длительности.

    Изменения, созданные этим заклинанием, не выдерживают физической проверки. Например, если вы используете это заклинание, чтобы добавить шляпу к наряду существа, предметы проходят сквозь шляпу.

    Существо может использовать действие, чтобы осмотреть цель и совершить проверку Интеллекта (Анализ) против СЛ ваших заклинаний. При успехе существо осознаёт, что цель замаскирована.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    duration: "8 часов"
# source: OmnisGM (CC BY 4.0)
- id: sending
  name: "Послание"
  description: |-
    *Прорицание 3-го уровня (Бард, Жрец, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** Неограниченная  
    **Компоненты:** В, С, М (медная проволока)  
    **Длительность:** Мгновенная

    Вы посылаете короткое сообщение из 25 слов или меньше существу, с которым встречались, или существу, описанному вам кем-то, кто с ним встречался. Цель слышит сообщение в своём разуме, узнаёт вас как отправителя, если знает вас, и может немедленно ответить таким же образом. Заклинание позволяет целям понимать смысл вашего сообщения.

    Вы можете посылать сообщение на любое расстояние и даже на другие планы существования, но если цель находится на другом плане, чем вы, есть 5-процентный шанс, что сообщение не дойдёт. Вы узнаёте, если доставка не удалась.

    При получении вашего сообщения существо может заблокировать вашу способность связаться с ним снова этим заклинанием на 8 часов. Если вы попытаетесь отправить ещё одно сообщение в это время, вы узнаете, что вы заблокированы, и заклинание проваливается.
  properties:
    castingTime: "Действие"
    range: "Неограниченная"
    material: "медная проволока"
    duration: "Мгновенная"
# source: TTRPG.Codex (machine-drafted)
- id: sequester
  name: Изоляция
  description: |-
    *7-й уровень, Преобразование (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** Касание
    **Компоненты:** В, С, М (пыль из драгоценного камня стоимостью 5,000+ зм, которую заклинание расходует)
    **Длительность:** До рассеивания

    Касанием вы магически помещаете в состояние изоляции предмет или добровольное существо. На протяжении длительности цель находится в состоянии «Невидимый» и не может быть целью заклинаний Прорицания, обнаруживаться магией или наблюдаться на расстоянии с помощью магии.
    Если целью является существо, оно входит в состояние приостановленной анимации: находится в состоянии «Без сознания», не стареет и не нуждается в пище, воде или воздухе.
    Вы можете задать условие, при котором заклинание закончится раньше. Условие может быть любым, но оно должно произойти или стать видимым в пределах 1 мили от цели. Примеры: «через 1,000 лет» или «когда тарраска пробудится». Заклинание также заканчивается, если цель получает любой урон.
  properties:
    castingTime: Действие
    range: Касание
    material: пыль из драгоценного камня стоимостью 5,000+ зм, которую заклинание расходует
    duration: До рассеивания
# source: OmnisGM (CC BY 4.0)
- id: shapechange
  name: "Изменение формы"
  description: |-
    *Преобразование 9-го уровня (Друид, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (нефритовый обруч стоимостью 1500+ зм)  
    **Длительность:** Концентрация, до 1 часа

    Вы превращаетесь в другое существо на время действия заклинания или пока не совершите действие «Магия», чтобы принять другую подходящую форму. Новая форма должна быть формой существа, чей показатель опасности не превышает ваш уровень или показатель опасности. Вы должны были видеть это существо хотя бы раз, и это не может быть конструкт или нежить.

    При сотворении заклинания вы получаете временные хиты, равные хитам первой формы, которую принимаете. Эти временные хиты исчезают, если остаются, когда заклинание заканчивается.

    Ваши игровые характеристики заменяются блоком характеристик выбранной формы, но вы сохраняете свой тип существа; мировоззрение; личность; значения Интеллекта, Мудрости и Харизмы; хиты; Кости хитов; владения; и способность общаться. Если у вас есть умение Заклинания, вы его тоже сохраняете.

    При превращении вы определяете, падает ли ваше снаряжение на землю или изменяется в размере и форме, подстраиваясь под новую форму.
  properties:
    castingTime: "Действие"
    range: "На себя"
    material: "нефритовый обруч стоимостью 1500+ зм"
    duration: "Концентрация, до 1 часа"
