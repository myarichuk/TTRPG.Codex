- id: contact-other-plane
  name: "Связь с иным планом"
  description: |-
    *Прорицание 5-го уровня (Колдун, Волшебник)*

    **Время накладывания:** 1 минута или Ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** 1 минута

    Вы мысленно связываетесь с полубогом, духом давно умершего мудреца или иной сведущей сущностью с другого плана. Контакт с этим потусторонним интеллектом может сломить ваш разум. Когда вы сотворяете это заклинание, совершите спасбросок Интеллекта СЛ 15. При успехе вы можете задать сущности до пяти вопросов. Вы должны задать свои вопросы до окончания заклинания. Мастер отвечает на каждый вопрос одним словом, например, «да», «нет», «возможно», «никогда», «неважно» или «неясно» (если сущность не знает ответа на вопрос). Если односложный ответ будет вводить в заблуждение, Мастер может вместо этого предложить короткую фразу в качестве ответа.

    При провале вы получаете 6d6 урона психической энергией и получаете состояние «Недееспособный» до завершения долгого отдыха. Заклинание *Высшее восстановление*, сотворённое на вас, прекращает этот эффект.
  properties:
    castingTime: "1 минута или Ритуал"
    range: "На себя"
    duration: "1 минута"
# source: OmnisGM (CC BY 4.0)
- id: contagion
  name: "Заражение"
  description: |-
    *Некромантия 5-го уровня (Жрец, Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С  
    **Длительность:** 7 дней

    Ваше прикосновение насылает магическое заражение. Цель должна преуспеть в спасброске Телосложения, иначе получает 11d8 урона некротической энергией и получает состояние «Отравленный». Также выберите одну характеристику при сотворении заклинания. Пока цель Отравлена, она совершает с помехой спасброски выбранной характеристикой.

    Цель должна повторять спасбросок в конце каждого своего хода, пока не получит три успеха или три провала. Если цель преуспевает в трёх из этих спасбросков, заклинание заканчивается для неё. Если цель проваливает три спасброска, заклинание действует на неё 7 дней.

    Каждый раз, когда Отравленная цель получает эффект, который должен прекратить состояние «Отравленный», цель должна преуспеть в спасброске Телосложения, иначе состояние «Отравленный» не прекращается для неё.
  properties:
    castingTime: "Действие"
    range: "Касание"
    duration: "7 дней"
# source: OmnisGM (CC BY 4.0)
- id: contingency
  name: "Предусмотрительность"
  description: |-
    *Ограждение 6-го уровня (Волшебник)*

    **Время накладывания:** 10 минут  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (украшенная самоцветами статуэтка вас самих стоимостью 1500+ зм)  
    **Длительность:** 10 дней

    Выберите заклинание 5-го уровня или ниже, которое вы можете сотворить, которое имеет время накладывания действие и которое может нацеливаться на вас. Вы сотворяете это заклинание — называемое обусловленным заклинанием — как часть сотворения *Предусмотрительности*, расходуя ячейки заклинаний для обоих, но обусловленное заклинание не вступает в силу. Вместо этого оно вступает в силу при определённом условии. Вы описываете это условие, когда сотворяете оба заклинания. Например, *Предусмотрительность*, сотворённая с *Дыханием под водой*, может предусматривать, что *Дыхание под водой* вступает в силу, когда вы погружены в воду или подобную жидкость.

    Обусловленное заклинание вступает в силу немедленно после того, как условие срабатывает впервые, независимо от того, хотите вы этого или нет, и затем *Предусмотрительность* заканчивается.

    Обусловленное заклинание действует только на вас, даже если обычно оно может нацеливаться на других. Вы можете использовать только одну *Предусмотрительность* одновременно. Если вы сотворяете это заклинание снова, эффект другой *Предусмотрительности* на вас заканчивается. Также *Предусмотрительность* заканчивается на вас, если её материальный компонент когда-либо не находится при вас.
  properties:
    castingTime: "10 минут"
    range: "На себя"
    material: "украшенная самоцветами статуэтка вас самих стоимостью 1500+ зм"
    duration: "10 дней"
# source: OmnisGM (CC BY 4.0)
- id: continual-flame
  name: "Вечный огонь"
  description: |-
    *Воплощение 2-го уровня (Жрец, Друид, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (рубиновая пыль стоимостью 50+ зм, которую заклинание поглощает)  
    **Длительность:** Пока не рассеяно

    Пламя возникает из объекта, которого вы касаетесь. Эффект излучает яркий свет в радиусе 20 футов и тусклый свет в дополнительном радиусе 20 футов. Оно выглядит как обычное пламя, но не создаёт тепла и не потребляет топлива. Пламя можно накрыть или спрятать, но нельзя потушить или погасить.
  properties:
    castingTime: "Действие"
    range: "Касание"
    material: "рубиновая пыль стоимостью 50+ зм, которую заклинание поглощает"
    duration: "Пока не рассеяно"
# source: TTRPG.Codex (machine-drafted)
- id: control-water
  name: Управление водой
  description: |-
    *4-й уровень, Преобразование (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 300 футов
    **Компоненты:** В, С, М (смесь воды и пыли)
    **Длительность:** Концентрация, до 10 минут

    Пока заклинание действует, вы управляете любой водой внутри выбранной вами области в виде Куба размером до 100 футов по стороне, используя один из следующих эффектов. Как Магическое действие в свои последующие ходы вы можете повторить тот же эффект или выбрать другой.
    Наводнение. Вы заставляете уровень воды всех стоячих водоёмов в области подняться на 20 футов. Если вы выбираете область в большом водоёме, вы вместо этого создаёте 20-футовую волну, которая проходит от одного края области до другого и затем обрушивается. Любые Огромные или меньшие транспортные средства на пути волны переносятся ею на другую сторону. Любые Огромные или меньшие транспортные средства, задетые волной, имеют шанс 25 процентов перевернуться.
