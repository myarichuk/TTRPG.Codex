- id: dragons-breath
  name: "Драконье дыхание"
  description: |-
    *Преобразование 2-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Бонусное действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (острый перец)  
    **Длительность:** Концентрация, до 1 минуты

    Вы касаетесь одного согласного существа и выбираете кислоту, холод, огонь, электричество или яд. До окончания заклинания цель может совершить действие «Магия», чтобы выдохнуть конус 15 футов. Каждое существо в этой области совершает спасбросок Ловкости, получая 3d6 урона выбранного типа при провале или половину этого урона при успехе.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d6 за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: "Бонусное действие"
    range: "Касание"
    material: "острый перец"
    duration: "Концентрация, до 1 минуты"
