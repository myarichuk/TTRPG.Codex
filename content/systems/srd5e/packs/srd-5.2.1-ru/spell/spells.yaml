- id: freezing-sphere
  name: "Морозная сфера"
  description: |-
    *Воплощение 6-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 300 футов  
    **Компоненты:** В, С, М (миниатюрная хрустальная сфера)  
    **Длительность:** Мгновенная

    Морозная сфера летит от вас в выбранную точку в пределах дистанции, где взрывается в Сфере радиусом 60 футов. Каждое существо в этой области совершает спасбросок Телосложения, получая 10d6 урона холодом при провале или половину урона при успехе.

    Если сфера ударяет по водоёму, она замораживает воду на глубину 6 дюймов на площади квадрата со стороной 30 футов. Лёд держится 1 минуту. Существа, плывшие по поверхности замёрзшей воды, оказываются вмёрзшими в лёд и получают состояние «Опутанный». Вмёрзшее существо может действием совершить проверку Силы (Атлетика) против СЛ спасброска ваших заклинаний, чтобы вырваться.

    Вы можете не выпускать сферу после завершения сотворения заклинания. В этом случае в вашей руке появляется сфера размером примерно с пращный снаряд, холодная на ощупь. В любой момент вы или существо, которому вы отдадите сферу, можете бросить её (на расстояние 40 футов) или метнуть из пращи (на обычную дальность пращи). Она разбивается при ударе с тем же эффектом, что и при обычном сотворении заклинания. Вы также можете положить сферу, не разбивая её. Через 1 минуту, если сфера ещё не разбилась, она взрывается.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d6 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: "Действие"
    range: "300 футов"
    material: "миниатюрная хрустальная сфера"
    duration: "Мгновенная"
    higherLevel: "Урон увеличивается на 1d6 за каждый уровень ячейки выше 6-го."
