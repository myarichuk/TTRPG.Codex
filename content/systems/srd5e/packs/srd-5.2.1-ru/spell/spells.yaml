- id: mass-suggestion
  name: Массовое внушение
  description: |-
    *6-й уровень, Очарование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** V, S, M (язык змеи)
    **Длительность:** 24 часа

    Вы внушаете курс действий — описанный не более чем в 25 словах — до двенадцати или менее существ, которых вы видите в пределах дистанции и которые могут вас слышать и понимать. Внушение должно звучать выполнимым и не должно предполагать ничего, что явно нанесёт урон любой из целей или их союзникам. Например, вы можете сказать: «Иди в деревню по этой дороге и помогай тамошним жителям собирать урожай до заката». Или вы можете сказать: «Сейчас не время для насилия. Бросайте оружие и танцуйте! Остановитесь через час».
    Каждая цель должна преуспеть в спасброске Мудрости, иначе на время действия или до тех пор, пока вы или ваши союзники не нанесёте цели урон, она получит состояние «Очарованный». Каждая очарованная цель следует внушению по мере своих способностей. Внушённое действие может продолжаться всё время действия заклинания, но если его можно завершить быстрее, заклинание прекращает действовать для цели, как только она его завершит.

    **Использование ячейки более высокого уровня.** Заклинание длится дольше при использовании ячейки 7-го уровня (10 дней), 8-го уровня (30 дней) или 9-го уровня (366 дней).
  properties:
    castingTime: "Действие"
    range: "60 футов"
    material: "язык змеи"
    duration: "24 часа"
    higherLevel: "Заклинание длится дольше при использовании ячейки 7-го уровня (10 дней), 8-го уровня (30 дней) или 9-го уровня (366 дней)."
