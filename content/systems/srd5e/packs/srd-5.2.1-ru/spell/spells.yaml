  name: "Разговор с мёртвыми"
  description: |-
    *Некромантия 3-го уровня (Бард, Жрец, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 10 футов  
    **Компоненты:** В, С, М (горящие благовония)  
    **Длительность:** 10 минут

    Вы наделяете подобием жизни труп на ваш выбор в пределах дистанции, позволяя ему отвечать на ваши вопросы. У трупа должен быть рот, и заклинание не сработает, если умершее существо было нежитью при жизни. Заклинание также не сработает, если труп был целью этого заклинания в течение последних 10 дней.

    До окончания заклинания вы можете задать трупу до пяти вопросов. Труп знает лишь то, что знал при жизни, включая известные ему языки. Ответы обычно кратки, загадочны или повторяющиеся, и труп не обязан давать правдивый ответ, если вы враждебны к нему или он узнаёт в вас врага. Это заклинание не возвращает душу существа в его тело, а лишь оживляющий дух. Таким образом, труп не может узнавать новую информацию, не понимает ничего из произошедшего после его смерти и не может строить предположений о будущем.
  properties:
    castingTime: "Действие"
    range: "10 футов"
    material: "горящие благовония"
    duration: "10 минут"
