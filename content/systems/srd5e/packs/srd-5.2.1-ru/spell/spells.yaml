- id: wish
  name: "Исполнение желаний"
  description: |-
    *Вызов 9-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    *Исполнение желаний* — самое могущественное заклинание, которое может сотворить смертное существо. Просто произнеся вслух, вы можете изменить саму реальность.

    Базовое использование этого заклинания — дублирование любого другого заклинания 8-го уровня или ниже. Если вы используете его таким образом, вам не нужно выполнять какие-либо требования для сотворения этого заклинания, включая дорогостоящие компоненты. Заклинание просто вступает в силу.

    В качестве альтернативы вы можете создать один из следующих эффектов на ваш выбор:

    **_Создание объекта._** Вы создаёте один объект стоимостью до 25 000 зм, который не является магическим предметом. Объект не может превышать 300 футов ни в одном измерении и появляется в свободном пространстве, которое вы видите на земле.
    **_Мгновенное исцеление._** Вы позволяете себе и до двадцати существам, которых видите, восстановить все хиты, и вы оканчиваете все эффекты на них, перечисленные в заклинании *Высшее восстановление*.
    **_Сопротивление._** Вы даруете до десяти существам, которых видите, сопротивление к одному типу урона на ваш выбор. Это сопротивление является постоянным.
    **_Иммунитет к заклинанию._** Вы даруете до десяти существам, которых видите, иммунитет к одному заклинанию или другому магическому эффекту на 8 часов.
    **_Внезапное обучение._** Вы заменяете одну из своих черт на другую черту, которой соответствуете требованиям. Вы теряете все преимущества старой черты и получаете преимущества новой. Вы не можете заменить черту, являющуюся предпосылкой для любых других ваших черт или умений.
    **_Повтор броска._** Вы отменяете одно недавнее событие, заставляя перебросить любой бросок кости, сделанный в течение последнего раунда (включая ваш последний ход). Реальность перестраивается, чтобы учесть новый результат. Например, *Исполнение желаний* может отменить проваленный спасбросок союзника или критическое попадание врага. Вы можете заставить перебросить с преимуществом или помехой, и вы выбираете, использовать перебросок или исходный бросок.
    **_Изменение реальности._** Вы можете пожелать чего-то, не включённого ни в один из других эффектов. Для этого сформулируйте своё желание Мастеру как можно точнее. Мастер имеет широкие полномочия в определении того, что произойдёт; чем грандиознее желание, тем выше вероятность того, что что-то пойдёт не так. Это заклинание может просто не сработать, желаемый эффект может быть достигнут лишь частично, или вы можете пострадать от непредвиденных последствий в зависимости от формулировки желания. Например, пожелав, чтобы злодей умер, вы можете быть перенесены вперёд во времени — в период, когда этого злодея уже нет в живых, что фактически удалит вас из игры.

    Точно так же пожелав Легендарный магический предмет или Артефакт, вы можете быть мгновенно перенесены к нынешнему владельцу предмета. Если ваше желание исполнено и его последствия затрагивают целое сообщество, регион или мир, вы, скорее всего, привлечёте могущественных врагов. Если ваше желание затрагивает бога, божественные слуги могут немедленно вмешаться, чтобы предотвратить его или побудить вас сформулировать желание определённым образом. Если ваше желание разрушит саму мультивселенную, оно не исполняется.

    Стресс от сотворения *Исполнения желаний* для создания любого эффекта, кроме дублирования другого заклинания, ослабляет вас. После перенесения этого стресса каждый раз, когда вы сотворяете заклинание до завершения долгого отдыха, вы получаете 1d10 урона некротической энергией за каждый уровень этого заклинания. Этот урон нельзя уменьшить или предотвратить. Кроме того, ваша Сила падает до 3 на 2d4 дня. За каждый из этих дней, проведённый в отдыхе и занятии только лёгкой деятельностью, оставшееся время восстановления сокращается на 2 дня. Наконец, есть 33-процентный шанс, что вы никогда больше не сможете сотворить *Исполнение желаний*, если подвергнетесь этому стрессу.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Мгновенная"
