- id: enlarge-reduce
  name: Увеличение/уменьшение
  description: |-
    *2-й уровень, Преобразование (Бард, Друид, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (щепотка железного порошка)
    **Длительность:** Концентрация, до 1 минуты

    На время действия заклинание увеличивает или уменьшает существо или предмет, который вы видите в пределах дистанции (см. выбранный эффект ниже). Целевой предмет не должен быть надет или переноситься. Если цель — существо, которое не хочет этого, оно может совершить спасбросок Телосложения. При успехе заклинание не действует.
    Всё, что целевое существо носит и несёт, меняет размер вместе с ним. Любой предмет, который оно роняет, немедленно возвращается к нормальному размеру. Метательное оружие или боеприпас возвращается к нормальному размеру сразу после попадания или промаха по цели.
    Увеличение. Размер цели увеличивается на одну категорию, например со среднего до большого. Цель также совершает проверки и спасброски по характеристике «Сила» с преимуществом. Её атаки увеличенным оружием или безоружными ударами наносят дополнительно 1d4 урона при попадании.
    Уменьшение. Размер цели уменьшается на одну категорию, например со среднего до маленького. Цель также совершает проверки и спасброски по характеристике «Сила» с помехой. Её атаки уменьшенным оружием или безоружными ударами наносят на 1d4 меньше урона при попадании (это не может снизить урон ниже 1).
  properties:
    castingTime: Действие
    range: 30 футов
    material: щепотка железного порошка
    duration: до 1 минуты
