    **Компоненты:** В, С, М (алмаз стоимостью 1,000+ зм, который заклинание расходует)  
    **Длительность:** Мгновенная

    Касанием вы возвращаете к жизни мёртвое существо, которое мертво не дольше века, не умерло от старости и не было Нежитью в момент смерти.
    Существо возвращается к жизни со всеми своими очками здоровья. Заклинание также нейтрализует любые яды, действовавшие на существо в момент смерти. Оно закрывает все смертельные раны и восстанавливает все недостающие части тела.
    Возвращение с того света — тяжёлое испытание. Цель получает штраф -4 к проверкам d20. Каждый раз, когда цель завершает Продолжительный отдых, штраф уменьшается на 1, пока не станет 0.
    Сотворение этого заклинания, чтобы оживить существо, мёртвое 365 дней и дольше, истощает вас. До окончания Продолжительного отдыха вы не можете сотворять заклинания, и у вас Помеха к проверкам d20.
  properties:
    castingTime: 1 час
    range: Касание
    material: алмаз стоимостью 1,000+ зм, который заклинание расходует
    duration: Мгновенная
