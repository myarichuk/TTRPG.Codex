- id: command
  name: "Приказ"
  description: |-
    *Очарование 1-го уровня (Бард, Жрец, Паладин)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В  
    **Длительность:** Мгновенная

    Вы произносите команду из одного слова существу, которое видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе она следует команде в свой следующий ход. Выберите команду из следующих вариантов:

    **Подойди.** Цель перемещается к вам кратчайшим и наиболее прямым маршрутом, заканчивая свой ход, если она оказывается в пределах 5 футов от вас.

    **Брось.** Цель роняет всё, что держит, и затем заканчивает свой ход.

    **Беги.** Цель тратит свой ход на перемещение от вас самым быстрым доступным способом.

    **Падай.** Цель получает состояние «Лежащий» и затем заканчивает свой ход.

    **Стой.** В свой ход цель не перемещается и не совершает действий или бонусных действий.

    **_Использование ячейки более высокого уровня._** Вы можете воздействовать на одно дополнительное существо за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Мгновенная"
    higherLevel: "Вы можете воздействовать на одно дополнительное существо за каждый уровень ячейки выше 1-го."
# source: OmnisGM (CC BY 4.0)
- id: commune
  name: "Причастие"
  description: |-
    *Прорицание 5-го уровня (Жрец)*

    **Время накладывания:** 1 минута или ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (благовония)  
    **Длительность:** 1 минута

    Вы связываетесь с божеством или божественным посредником и задаёте до трёх вопросов, на которые можно ответить «да» или «нет». Вы должны задать свои вопросы до окончания заклинания. Вы получаете правильный ответ на каждый вопрос.

    Божественные существа не всеведущи, поэтому вы можете получить ответ «неясно», если вопрос касается информации, лежащей за пределами знаний божества. В случаях, когда однословный ответ может быть обманчивым или противоречить интересам божества, Мастер может предложить короткую фразу в качестве ответа.

    Если вы сотворяете заклинание более одного раза до завершения долгого отдыха, существует кумулятивная 25-процентная вероятность для каждого сотворения после первого, что вы не получите ответа.
  properties:
    castingTime: "1 минута или ритуал"
    range: "На себя"
    material: "благовония"
    duration: "1 минута"
# source: OmnisGM (CC BY 4.0)
- id: commune-with-nature
  name: "Связь с природой"
  description: |-
    *Прорицание 5-го уровня (Друид, Следопыт)*

    **Время накладывания:** 1 минута или ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Вы вступаете в общение с духами природы и получаете знания об окружающей местности. На открытом воздухе заклинание даёт вам знание об области в радиусе 3 миль от вас. В пещерах и других естественных подземных условиях радиус ограничен 300 футами. Заклинание не действует там, где природа заменена постройками, например в замках и поселениях.

    Выберите три факта из следующих; вы узнаёте эти факты применительно к области заклинания:

    - Местоположения поселений
    - Местоположения порталов в другие планы существования
    - Местоположение одного существа с показателем опасности 10+, (на выбор Мастера), которое является небожителем, элементалем, феей, исчадием или нежитью
    - Наиболее распространённый вид растений, минералов или зверей (вы выбираете, что узнать)
    - Местоположения водоёмов

    Например, вы можете определить местоположение могущественного монстра в области, местоположения водоёмов и местоположения любых городов.
  properties:
    castingTime: "1 минута или ритуал"
    range: "На себя"
    duration: "Мгновенная"
# source: OmnisGM (CC BY 4.0)
- id: comprehend-languages
  name: "Понимание языков"
  description: |-
    *Прорицание 1-го уровня (Бард, Чародей, Колдун, Волшебник)*

    **Время накладывания:** Действие или ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (щепотка сажи и соль)  
    **Длительность:** 1 час

    На время действия заклинания вы понимаете буквальный смысл любого языка, который слышите или видите в жестовой форме. Вы также понимаете любой письменный язык, который видите, но вы должны касаться поверхности, на которой написаны слова. Для чтения одной страницы текста требуется около 1 минуты. Это заклинание не расшифровывает символы или тайные послания.
  properties:
    castingTime: "Действие или ритуал"
    range: "На себя"
    material: "щепотка сажи и соль"
    duration: "1 час"
# source: OmnisGM (CC BY 4.0)
- id: compulsion
  name: "Принуждение"
  description: |-
    *Очарование 4-го уровня (Бард)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Каждое существо на ваш выбор, которое вы видите в пределах дистанции, должно преуспеть в спасброске Мудрости, иначе оно получает состояние «Очарованный» до окончания заклинания.

    На время действия заклинания вы можете бонусным действием указать горизонтальное направление. Каждая Очарованная цель должна использовать как можно больше своего перемещения, чтобы двигаться в этом направлении в свой следующий ход, выбирая наиболее безопасный маршрут. После перемещения таким образом цель повторяет спасбросок, оканчивая заклинание на себе при успехе.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    duration: "Концентрация, до 1 минуты"
