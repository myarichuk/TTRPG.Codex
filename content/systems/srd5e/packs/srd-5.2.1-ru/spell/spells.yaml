- id: conjure-animals
  name: "Призыв животных"
  description: |-
    *Вызов 3-го уровня (Друид, Следопыт)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов природы, которые появляются в виде Большой стаи призрачных, бесплотных животных в незанятом пространстве, которое видите в пределах дистанции. Стая существует на время действия заклинания, и вы выбираете форму животных — волки, змеи, птицы и т.д.

    Вы совершаете спасброски Силы с преимуществом, пока находитесь в пределах 5 футов от стаи, и когда вы перемещаетесь в свой ход, вы можете также переместить стаю на расстояние до 30 футов в незанятое пространство, которое видите.

    Каждый раз, когда стая перемещается в пределы 10 футов от существа, которое вы видите, и каждый раз, когда существо, которое вы видите, входит в пространство в пределах 10 футов от стаи или заканчивает там свой ход, вы можете заставить это существо совершить спасбросок Ловкости. При провале существо получает 3d10 рубящего урона. Существо совершает этот спасбросок только один раз за ход.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d10 за каждый уровень ячейки выше 3-го.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Концентрация, до 10 минут"
    higherLevel: "Урон увеличивается на 1d10 за каждый уровень ячейки выше 3-го."
# source: OmnisGM (CC BY 4.0)
- id: conjure-celestial
  name: "Призыв небожителя"
  description: |-
    *Вызов 7-го уровня (Жрец)*

    **Время накладывания:** Действие  
    **Дистанция:** 90 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы призываете дух Верхних Планов, который проявляется как столп света в цилиндре радиусом 10 футов и высотой 40 футов с центром в точке в пределах дистанции. Для каждого существа, которое вы видите в цилиндре, выберите, каким светом оно озаряется:

    **Исцеляющий свет.** Цель восстанавливает хиты, равные 4d12 плюс модификатор вашей заклинательной характеристики.

    **Опаляющий свет.** Цель совершает спасбросок Ловкости, получая 6d12 урона излучением при провале или половину этого урона при успехе.

    До окончания заклинания яркий свет заполняет цилиндр, и когда вы перемещаетесь в свой ход, вы можете также переместить цилиндр на расстояние до 30 футов.

    Каждый раз, когда цилиндр перемещается в пространство существа, которое вы видите, и каждый раз, когда существо, которое вы видите, входит в цилиндр или заканчивает там свой ход, вы можете озарить его одним из видов света. Существо может быть затронуто этим заклинанием только один раз за ход.

    **_Использование ячейки более высокого уровня._** Исцеление и урон увеличиваются на 1d12 за каждый уровень ячейки выше 7-го.
  properties:
    castingTime: "Действие"
    range: "90 футов"
    duration: "Концентрация, до 10 минут"
