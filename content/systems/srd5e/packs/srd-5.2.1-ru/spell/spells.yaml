- id: sorcerous-burst
  name: "Магический взрыв"
  description: |-
    *Заговор воплощения (Чародей)*

    **Время накладывания:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Мгновенная

    Вы направляете чародейскую энергию в одно существо или объект в пределах дистанции. Совершите дальнобойную атаку заклинанием по цели. При попадании цель получает 1d8 урона типа на ваш выбор: кислотой, холодом, огнём, молнией, ядом, психической энергией или громом.

    Если вы выбрасываете 8 на d8 для этого заклинания, вы можете бросить ещё одну d8 и добавить её к урону. При сотворении этого заклинания максимальное количество таких дополнительных d8, которые вы можете добавить к урону, равно модификатору вашей заклинательной характеристики.

    **_Улучшение заговора._** Урон увеличивается на 1d8, когда вы достигаете 5-го уровня (2d8), 11-го уровня (3d8) и 17-го уровня (4d8).
