- id: cloudkill
  name: Облако смерти
  description: |-
    *5-й уровень, Вызов (Чародей, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 120 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы создаёте Сферу из жёлто-зелёного тумана радиусом 20 футов с центром в точке в пределах дистанции. Туман длится в течение длительности или до тех пор, пока сильный ветер (например, создаваемый заклинанием Порыв ветра) не рассеет его, что завершит заклинание. Область тумана считается сильно затемнённой.
    Каждое существо в Сфере совершает спасбросок Телосложения и получает 5d8 урона ядом при провале или половину этого урона при успехе. Существо также должно совершить этот спасбросок, когда Сфера переместится в его пространство, а также когда оно входит в Сферу или заканчивает там свой ход. Существо совершает этот спасбросок только один раз за ход.
    Сфера отодвигается от вас на 10 футов в начале каждого вашего хода.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го.
  properties:
    castingTime: Действие
    range: 120 футов
    duration: до 10 минут
    damageType: яд
    higherLevel: Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го.
