- id: symbol
  name: "Символ"
  description: |-
    *Ограждение 7-го уровня (Бард, Жрец, Друид, Волшебник)*

    **Время накладывания:** 1 минута  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (порошок алмаза стоимостью 1000+ зм, потребляемый заклинанием)  
    **Длительность:** Пока не рассеяно или не активировано

    Вы начертываете вредоносный глиф либо на поверхности (такой как участок пола или стены), либо внутри объекта, который можно закрыть (такого как книга или сундук). Глиф может покрывать область диаметром не более 10 футов. Если вы выбираете объект, он должен оставаться на месте; если его переместить более чем на 10 футов от места сотворения заклинания, глиф разрушается и заклинание заканчивается без активации.

    Глиф почти незаметен и требует успешной проверки Мудрости (Внимательность) против СЛ ваших заклинаний, чтобы его обнаружить.

    Когда вы начертываете глиф, вы устанавливаете его активатор и выбираете, какой эффект несёт символ: Смерть, Раздор, Страх, Боль, Сон или Оглушение. Каждый описан ниже.

    **_Установка активатора._** Вы решаете, что активирует глиф, при сотворении заклинания. Для глифов, начертанных на поверхности, обычные активаторы включают прикосновение к глифу или наступание на него, удаление другого объекта, закрывающего его, или приближение на определённое расстояние к нему. Для глифов, начертанных внутри объекта, обычные активаторы включают открытие этого объекта или взгляд на глиф.

    Вы можете уточнить активатор, чтобы только существа определённых типов его срабатывали (например, глиф может быть настроен на аберрации). Вы также можете установить условия для существ, которые не активируют глиф, например тех, кто произносит определённый пароль.

    При активации глиф начинает светиться, заполняя сферу радиусом 60 футов тусклым светом на 10 минут, после чего заклинание заканчивается. Каждое существо в сфере, когда глиф активируется, попадает под его эффект, так же как и существо, впервые за ход входящее в сферу или заканчивающее в ней свой ход. Существо попадает под эффект только один раз за ход.

    **_Смерть._** Каждая цель совершает спасбросок Телосложения, получая 10d10 урона некротической энергией при провале или половину этого урона при успехе.

    **_Раздор._** Каждая цель совершает спасбросок Мудрости. При провале цель препирается и спорит с другими существами в течение 1 минуты. Во время этого она не способна вести осмысленное общение и совершает броски атаки и проверки характеристик с помехой.

    **_Страх._** Каждая цель совершает спасбросок Мудрости и при провале получает состояние «Испуганный» на 1 минуту. Пока цель Испугана, она должна перемещаться как минимум на 30 футов от глифа в каждый свой ход, если может.

    **_Боль._** Каждая цель совершает спасбросок Телосложения и при провале получает состояние «Недееспособный» на 1 минуту.

    **_Сон._** Каждая цель совершает спасбросок Мудрости и при провале получает состояние «Без сознания» на 10 минут. Существо пробуждается, если получает урон или если кто-то использует действие, чтобы его разбудить.

    **_Оглушение._** Каждая цель совершает спасбросок Мудрости и при провале получает состояние «Ошеломлённый» на 1 минуту.
  properties:
    castingTime: "1 минута"
    range: "Касание"
    material: "порошок алмаза стоимостью 1000+ зм, потребляемый заклинанием"
    duration: "Пока не рассеяно или не активировано"
