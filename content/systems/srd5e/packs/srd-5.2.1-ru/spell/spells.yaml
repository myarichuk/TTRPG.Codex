- id: word-of-recall
  name: Слово возвращения
  description: |-
    *6-й уровень, Вызов (Жрец)*

    **Время сотворения:** Действие
    **Дистанция:** 5 футов
    **Компоненты:** V
    **Длительность:** Мгновенная

    Вы и до пяти добровольных существ в пределах 5 футов от вас мгновенно телепортируетесь в заранее назначенное святилище. Вы и любые существа, телепортирующиеся вместе с вами, появляются в ближайшем свободном пространстве к точке, которую вы назначили при подготовке святилища (см. ниже). Если вы сотворите это заклинание, не подготовив сначала святилище, оно не окажет никакого эффекта.
    Вы должны назначить место, например храм, святилищем, сотворив здесь это заклинание.
  properties:
    castingTime: Действие
    range: 5 футов
    duration: Мгновенная
