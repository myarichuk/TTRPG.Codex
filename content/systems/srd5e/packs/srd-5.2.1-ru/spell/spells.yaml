- id: sanctuary
  name: "Святилище"
  description: |-
    *Ограждение 1-го уровня (Жрец)*

    **Время накладывания:** Бонусное действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (осколок стекла от зеркала)  
    **Длительность:** 1 минута

    Вы защищаете существо в пределах дистанции. До окончания заклинания любое существо, которое нацеливается на защищённое существо броском атаки или наносящим урон заклинанием, должно преуспеть в спасброске Мудрости, иначе оно должно выбрать новую цель или потерять атаку или заклинание. Это заклинание не защищает от эффектов по области. Заклинание заканчивается, если защищённое существо совершает бросок атаки, сотворяет заклинание или наносит урон.
