- id: conjure-minor-elementals
  name: "Призыв малых элементалей"
  description: |-
    *Вызов 4-го уровня (Друид, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов со Стихийных Планов, которые порхают вокруг вас в 15-футовой эманации на время действия заклинания. До окончания заклинания любая ваша атака наносит дополнительные 2d8 урона, когда вы попадаете по существу в эманации. Тип урона — кислотой, холодом, огнём или молнией (на ваш выбор при каждой атаке).

    Кроме того, земля в эманации является труднопроходимой местностью для ваших врагов.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, до 10 минут"
    higherLevel: "Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го."
# source: OmnisGM (CC BY 4.0)
- id: conjure-woodland-beings
  name: "Призыв лесных существ"
  description: |-
    *Вызов 4-го уровня (Друид, Следопыт)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы призываете духов природы, которые порхают вокруг вас в 10-футовой эманации на время действия заклинания. Каждый раз, когда эманация входит в пространство существа, которое вы видите, и каждый раз, когда существо, которое вы видите, входит в эманацию или заканчивает там свой ход, вы можете заставить это существо совершить спасбросок Мудрости. Существо получает 5d8 урона силовым полем при провале или половину этого урона при успехе. Существо совершает этот спасбросок только один раз за ход.

    Кроме того, вы можете совершать действие Отход бонусным действием на время действия заклинания.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d8 за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, до 10 минут"
