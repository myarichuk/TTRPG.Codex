- id: wall-of-force
  name: Стена силы
  description: |-
    *5-й уровень, Воплощение (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 120 футов
    **Компоненты:** В, С, М (осколок стекла)
    **Длительность:** Концентрация, до 10 минут

    Невидимая стена из силового поля возникает в точке по вашему выбору в пределах дистанции. Стена появляется в любой ориентации, которую вы выберете: горизонтальным или вертикальным барьером либо под углом. Она может парить в воздухе или опираться на твёрдую поверхность. Вы можете придать ей форму полусферического купола или шара радиусом до 10 футов либо создать плоскую поверхность из десяти панелей размером 10 на 10 футов. Каждая панель должна примыкать к другой панели. В любой форме стена имеет толщину 1/4 дюйма и существует в течение всей длительности. Если стена пересекает пространство существа в момент появления, это существо отталкивается к одной из сторон стены (сторону выбираете вы).
    Ничто не может физически пройти сквозь стену. Она неуязвима для любого урона и не может быть развеяна заклинанием «Развеивание магии». Однако заклинание «Распад» мгновенно уничтожает стену. Стена также простирается в Эфирный план и блокирует эфирные перемещения сквозь неё.
  properties:
    castingTime: Действие
    range: 120 футов
    material: осколок стекла
    duration: до 10 минут
