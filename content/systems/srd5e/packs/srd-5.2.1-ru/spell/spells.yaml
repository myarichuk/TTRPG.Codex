- id: antilife-shell
  name: "Барьер жизни"
  description: |-
    *Ограждение 5-го уровня (Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, вплоть до 1 часа

    Аура излучается от вас в 10-футовой эманации на время действия заклинания. Аура не позволяет существам, кроме конструктов и нежити, проходить или тянуться через неё. Затронутое существо может творить заклинания или совершать атаки дальнобойным оружием или оружием с досягаемостью через барьер.

    Если вы перемещаетесь так, что затронутое существо вынуждено пройти через барьер, заклинание заканчивается.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, вплоть до 1 часа"
