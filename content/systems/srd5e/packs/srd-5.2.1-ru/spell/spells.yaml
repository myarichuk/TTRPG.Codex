- id: augury
  name: "Предсказание"
  description: |-
    *Прорицание 2-го уровня (Жрец, Друид, Волшебник)*

    **Время накладывания:** 1 минута или ритуал  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (специально помеченные палочки, кости, карты или другие гадательные принадлежности стоимостью 25+ зм)  
    **Длительность:** Мгновенная

    Вы получаете знамение от потустороннего существа о результатах определённого действия, которое вы планируете предпринять в течение ближайших 30 минут. Мастер выбирает знамение из таблицы «Знамения».

    Таблица: Знамения

    | Знамение        | Для результатов, которые будут… |
    |---|---|
    | Благо           | Хорошими                       |
    | Беда            | Плохими                        |
    | Благо и беда    | Хорошими и плохими             |
    | Безразличие     | Ни хорошими, ни плохими        |

    Заклинание не учитывает обстоятельства, такие как другие заклинания, которые могут изменить результаты.

    Если вы сотворяете заклинание более одного раза до завершения долгого отдыха, существует кумулятивная 25-процентная вероятность для каждого сотворения после первого, что вы не получите ответа.
  properties:
    castingTime: "1 минута или ритуал"
    range: "На себя"
    material: "специально помеченные палочки, кости, карты или другие гадательные принадлежности стоимостью 25+ зм"
    duration: "Мгновенная"
