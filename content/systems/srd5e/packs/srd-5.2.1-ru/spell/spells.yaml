- id: suggestion
  name: Внушение
  description: |-
    *2-й уровень, Очарование (Бард, Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 30 футов
    **Компоненты:** В, М (капля мёда)
    **Длительность:** Концентрация, до 8 часов

    Вы предлагаете вариант действий, описанный не более чем 25 словами, одному существу, которое вы видите в пределах дистанции и которое может вас слышать и понимать. Предложение должно звучать выполнимо и не должно включать ничего, что явно нанесло бы урон цели или её союзникам. Например, вы можете сказать: «Принеси ключ от сокровищницы культа и отдай его мне». Или: «Прекратите драку, спокойно покиньте эту библиотеку и не возвращайтесь».
    Цель должна преуспеть в спасброске Мудрости, иначе получит состояние Очарованный на время действия заклинания или до тех пор, пока вы или ваши союзники не нанесёте ей урон. Очарованная цель стремится выполнить предложение по мере своих возможностей. Предложенное действие может продолжаться всю длительность, но если его можно выполнить быстрее, заклинание для цели прекращается, как только она его выполнит.
  properties:
