- id: ensnaring-strike
  name: "Опутывающий удар"
  description: |-
    *Вызов 1-го уровня (Следопыт)*

    **Время накладывания:** Бонусное действие, которое вы совершаете сразу после попадания по существу оружием  
    **Дистанция:** На себя  
    **Компоненты:** В  
    **Длительность:** Концентрация, до 1 минуты

    Когда вы попадаете по цели, на ней появляются хватающие лозы, и она совершает спасбросок Силы. Большое или большее существо совершает этот спасбросок с преимуществом. При провале цель получает состояние «Опутанный» до окончания заклинания. При успехе лозы увядают, и заклинание заканчивается.

    Пока цель Опутана, она получает 1d6 колющего урона в начале каждого своего хода. Цель или существо в пределах досягаемости от неё может совершить действие, чтобы сделать проверку Силы (Атлетика) против СЛ спасброска ваших заклинаний. При успехе заклинание заканчивается.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d6 за каждый уровень ячейки выше 1-го.
  properties:
