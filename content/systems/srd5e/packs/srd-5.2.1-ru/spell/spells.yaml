    **Длительность:** 10 минут

    На время действия заклинания вы можете понимать зверей и вербально общаться с ними, и вы можете использовать любой из вариантов навыков действия Воздействие по отношению к ним.

    Большинство зверей мало что могут сказать о темах, не связанных с выживанием или товариществом, но как минимум зверь может рассказать о ближайших местах и монстрах, включая всё, что он воспринимал за последний день.
