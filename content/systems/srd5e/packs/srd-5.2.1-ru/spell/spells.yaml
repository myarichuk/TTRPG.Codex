    range: "60 футов"
    material: "драгоценный камень стоимостью 1000+ зм, который заклинание расходует"
    duration: "24 часа"
    higherLevel: "Длительность увеличивается с ячейкой 6-го уровня (10 дней), 7-го уровня (30 дней), 8-го уровня (180 дней) и 9-го уровня (366 дней)."
