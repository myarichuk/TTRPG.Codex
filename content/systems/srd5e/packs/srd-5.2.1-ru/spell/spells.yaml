- id: chromatic-orb
  name: "Хроматическая сфера"
  description: |-
    *Воплощение 1-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 90 футов  
    **Компоненты:** В, С, М (бриллиант стоимостью 50+ зм)  
    **Длительность:** Мгновенная

    Вы швыряете сферу энергии в цель в пределах дистанции. Выберите Кислоту, Холод, Огонь, Электричество, Яд или Гром для типа создаваемой сферы, затем совершите дальнобойную атаку заклинанием против цели. При попадании цель получает 3d8 урона выбранного типа.

    Если вы выбросите одинаковое число на двух или более d8, сфера перескакивает к другой цели на ваш выбор в пределах 30 футов от цели. Совершите бросок атаки против новой цели и совершите новый бросок урона. Сфера не может перескочить снова, если вы не сотворили заклинание с ячейкой 2-го уровня или выше.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го. Сфера может перескочить максимальное количество раз, равное уровню израсходованной ячейки, и существо может быть целью только один раз от каждого сотворения этого заклинания.
  properties:
    castingTime: "Действие"
    range: "90 футов"
    material: "бриллиант стоимостью 50+ зм"
    duration: "Мгновенная"
    higherLevel: "Урон увеличивается на 1d8 за каждый уровень ячейки выше 1-го. Сфера может перескочить максимальное количество раз, равное уровню израсходованной ячейки, и существо может быть целью только один раз от каждого сотворения этого заклинания."
