- id: animal-friendship
  name: "Дружба с животными"
  description: |-
    *Очарование 1-го уровня (Бард, Друид, Следопыт)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (кусочек еды)  
    **Длительность:** 24 часа

    Выберите зверя, которого видите в пределах дистанции. Цель должна преуспеть в спасброске Мудрости, иначе получает состояние «Очарованный» на время действия заклинания. Если вы или один из ваших союзников нанесёт урон цели, заклинание заканчивается.

    **_Использование ячейки более высокого уровня._** Вы можете выбрать одного дополнительного зверя за каждый уровень ячейки выше 1-го.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    material: "кусочек еды"
    duration: "24 часа"
    higherLevel: "Вы можете выбрать одного дополнительного зверя за каждый уровень ячейки выше 1-го."
# source: TTRPG.Codex (machine-drafted)
- id: animal-messenger
  name: Животное-посыльный
  description: |-
    *2-й уровень, Очарование (Бард, Друид, Рейнджер)*

    **Время сотворения:** Действие или Ритуал
    **Дистанция:** 30 футов
    **Компоненты:** В, С, М (кусочек пищи)
    **Длительность:** 24 часа

    Крошечный Зверь по вашему выбору, которого вы видите в пределах дистанции, должен пройти спасбросок Харизмы, иначе он доставит ваше сообщение (если показатель опасности цели не равен 0, она автоматически проходит спасбросок). Вы указываете место, которое посещали, и получателя, подходящего под общее описание, например «человек в форме городской стражи» или «рыжеволосый дварф в остроконечной шляпе». Вы также передаёте сообщение длиной до двадцати пяти слов. Зверь движется к указанному месту в течение всей длительности, покрывая около 25 миль за 24 часа или 50 миль, если он умеет летать.
    Когда Зверь прибывает, он передаёт ваше сообщение описанному вами существу, подражая вашей манере речи. Если Зверь не доберётся до места назначения до окончания заклинания, сообщение теряется, а Зверь возвращается туда, где вы сотворили заклинание.

    **Использование ячейки более высокого уровня.** Длительность заклинания увеличивается на 48 часов за каждый уровень ячейки выше 2-го.
  properties:
    castingTime: Действие
    range: 30 футов
    material: кусочек пищи
    duration: 24 часа
    higherLevel: Длительность заклинания увеличивается на 48 часов за каждый уровень ячейки выше 2-го.
# source: OmnisGM (CC BY 4.0)
- id: animal-shapes
  name: "Животные формы"
  description: |-
    *Преобразование 8-го уровня (Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С  
    **Длительность:** 24 часа

    Выберите любое количество согласных существ, которых видите в пределах дистанции. Каждая цель превращается в Большого или меньшего зверя на ваш выбор с показателем опасности 4 или ниже. Вы можете выбрать разные формы для каждой цели. В последующие ходы вы можете совершить действие «Магия», чтобы снова превратить цели.

    Игровые характеристики цели заменяются характеристиками выбранного зверя, но цель сохраняет свой тип существа; хиты; кости хитов; мировоззрение; способность общаться; и значения Интеллекта, Мудрости и Харизмы. Действия цели ограничены анатомией звериной формы, и она не может творить заклинания. Снаряжение цели сливается с новой формой, и цель не может использовать это снаряжение, находясь в этой форме.

    Цель получает временные хиты, равные хитам первой формы, в которую она превращается. Эти временные хиты исчезают, если какие-то из них остаются после окончания заклинания. Превращение длится на время действия заклинания или пока цель не закончит его бонусным действием.
  properties:
    castingTime: "Действие"
    range: "30 футов"
    duration: "24 часа"
# source: TTRPG.Codex (machine-drafted)
- id: animate-dead
  name: Оживление мёртвых
  description: |-
    *3-й уровень, Некромантия (Жрец, Волшебник)*

    **Время сотворения:** 1 минута
    **Дистанция:** 10 футов
    **Компоненты:** В, С, М (капля крови, кусок плоти и щепотка костной пыли)
    **Длительность:** Мгновенная

    Выберите кучу костей или труп среднего или маленького гуманоида в пределах дистанции. Цель становится Нежитью: Скелетом, если вы выбрали кости, или Зомби, если вы выбрали труп (см. «Монстры» для блоков статистики).
    Каждый ваш ход вы можете совершить Бонусное действие, чтобы мысленно приказать любому существу, которое вы подняли этим заклинанием, если оно находится в пределах 60 футов от вас (если вы контролируете нескольких существ, вы можете отдать одну и ту же команду всем одновременно). Вы решаете, какое действие существо совершит и куда переместится в свой следующий ход, или можете отдать общий приказ, например охранять комнату или коридор. Если вы не отдаёте приказов, существо совершает действие Уклонение и перемещается только для того, чтобы избежать вреда. Получив приказ, существо продолжает его выполнять, пока задача не будет завершена.
    Существо находится под вашим контролем 24 часа, после чего перестаёт подчиняться любым вашим приказам. Чтобы сохранить контроль над существом ещё на 24 часа, вы должны сотворить это заклинание на нём до окончания текущего 24-часового периода. Такое использование заклинания подтверждает ваш контроль над существами, которых вы подняли этим заклинанием (до четырёх), вместо того чтобы поднимать нового.

    **Использование ячейки более высокого уровня.** Вы поднимаете или подтверждаете контроль над двумя дополнительными Нежитями за каждый уровень ячейки выше 3-го. Каждое существо должно происходить из разного трупа или кучи костей.
  properties:
    castingTime: 1 минута
    range: 10 футов
    material: капля крови, кусок плоти и щепотка костной пыли
    duration: Мгновенная
    higherLevel: Вы поднимаете или подтверждаете контроль над двумя дополнительными Нежитями за каждый уровень ячейки выше 3-го. Каждое существо должно происходить из разного трупа или кучи костей.
