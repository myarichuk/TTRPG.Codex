- id: prismatic-spray
  name: Радужные брызги
  description: |-
    *7-й уровень, Воплощение (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** На себя
    **Компоненты:** В, С
    **Длительность:** Мгновенная

    Восемь лучей света вспыхивают из вас конусом длиной 60 футов. Каждое существо в конусе совершает спасбросок Ловкости. Для каждой цели бросьте 1d8, чтобы определить, какой цветной луч на неё подействует, сверяясь с таблицей «Призматические лучи». Призматические лучи 1d8 Луч 2    Оранжевый. Провал спасброска: 12d6 кислотного урона. Успешный спасбросок: половина урона. 4    Зелёный. Провал спасброска: 12d6 урона ядом. Успешный спасбросок: половина урона. 1d8 Луч 6    Индиго. Провал спасброска: цель получает состояние «Опутанный» и совершает спасбросок Телосложения в конце каждого своего хода. Если она успешно пройдёт спасбросок три раза, состояние прекращается. Если провалит три раза, она получает состояние «Окаменевший», пока её не освободит эффект, например заклинание Великое восстановление. Успехи и провалы не обязаны идти подряд; ведите подсчёт обоих, пока у цели не наберётся три одинаковых. 8    Особый. Цель поражается двумя лучами. Бросьте дважды, перебрасывая любые 8.
  properties:
    castingTime: Действие
    range: На себя
    duration: Мгновенная
