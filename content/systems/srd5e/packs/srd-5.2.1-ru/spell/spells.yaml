- id: detect-thoughts
  name: "Обнаружение мыслей"
  description: |-
    *Прорицание 2-го уровня (Бард, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С, М (1 медная монета)  
    **Длительность:** Концентрация, до 1 минуты

    Вы активируете один из приведённых ниже эффектов. До окончания заклинания вы можете активировать любой из эффектов действием «Магия» в последующие ходы.

    **_Ощущение мыслей._** Вы ощущаете присутствие мыслей в пределах 30 футов от вас, принадлежащих существам, которые знают языки или обладают телепатией. Вы не читаете мысли, но знаете, что мыслящее существо присутствует.

    Заклинание блокируется 1 футом камня, земли или дерева; 1 дюймом металла; или тонким листом свинца.

    **_Чтение мыслей._** Нацельтесь на одно существо, которое видите в пределах 30 футов от вас, или на одно существо в пределах 30 футов от вас, которое вы обнаружили с помощью опции «Ощущение мыслей». Вы узнаёте, что сейчас больше всего занимает разум цели. Если цель не знает ни одного языка и не обладает телепатией, вы ничего не узнаёте.

    Действием «Магия» в свой следующий ход вы можете попытаться глубже проникнуть в разум цели. Если вы проникаете глубже, цель совершает спасбросок Мудрости. При провале вы распознаёте рассуждения цели, её эмоции и что-то, что занимает значительное место в её разуме (например, беспокойство, любовь или ненависть). При успехе заклинание заканчивается. В любом случае цель знает, что вы исследуете её разум, и пока вы не переключите внимание с разума цели, цель может действием в свой ход совершить проверку Интеллекта (Магия) против СЛ спасброска ваших заклинаний, заканчивая заклинание при успехе.
  properties:
    castingTime: "Действие"
    range: "На себя"
    material: "1 медная монета"
    duration: "Концентрация, до 1 минуты"
