    Вы призываете гигантскую многоножку, паука или осу (выбирается при сотворении заклинания). Существо появляется в незанятом пространстве, которое вы видите в пределах дистанции, и использует блок характеристик «Гигантское насекомое». Выбранная форма определяет некоторые детали его блока характеристик. Существо исчезает, когда падает до 0 очков здоровья или когда заклинание заканчивается.
