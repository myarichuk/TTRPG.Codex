- id: confusion
  name: "Замешательство"
  description: |-
    *Очарование 4-го уровня (Бард, Друид, Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 90 футов  
    **Компоненты:** В, С, М (три ореховых скорлупы)  
    **Длительность:** Концентрация, до 1 минуты

    Каждое существо в сфере радиусом 10 футов с центром в точке, которую вы выбираете в пределах дистанции, должно преуспеть в спасброске Мудрости, иначе эта цель не может совершать бонусные действия или реакции и должна бросать 1d10 в начале каждого своего хода, чтобы определить своё поведение на этот ход, сверяясь с приведённой ниже таблицей.

    Table: Поведение 1d10 на ход

    | d10 | Поведение на ход |
    |---|---|
    | 1 | Цель не совершает действие и использует всё своё перемещение, чтобы двигаться. Бросьте 1d4 для определения направления: 1 — север; 2 — восток; 3 — юг; 4 — запад. |
    | 2–6 | Цель не перемещается и не совершает действий. |
    | 7–8 | Цель не перемещается и совершает действие Атака, чтобы нанести один рукопашный удар по случайному существу в пределах досягаемости. Если таких нет, цель не совершает действие. |
    | 9–10 | Цель выбирает своё поведение. |

    В конце каждого своего хода затронутая цель повторяет спасбросок, оканчивая заклинание на себе при успехе.

    **_Использование ячейки более высокого уровня._** Радиус сферы увеличивается на 5 футов за каждый уровень ячейки выше 4-го.
  properties:
    castingTime: "Действие"
    range: "90 футов"
    material: "три ореховых скорлупы"
    duration: "Концентрация, до 1 минуты"
    higherLevel: "Радиус сферы увеличивается на 5 футов за каждый уровень ячейки выше 4-го."
