- id: circle-of-death
  name: Круг смерти
  description: |-
    *6-й уровень, Некромантия (Чародей, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 150 футов  
    **Компоненты:** В, С, М (порошок из раздавленной чёрной жемчужины стоимостью 500+ зм)  
    **Длительность:** Мгновенная

    Негативная энергия расходится волной в Сфере радиусом 60 футов от точки по вашему выбору в пределах дистанции. Каждое существо в этой области совершает спасбросок Телосложения и получает 8d8 урона некротической энергией при провале или половину этого урона при успехе.

    **Использование ячейки более высокого уровня.** Урон увеличивается на 2d8 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: Действие
    range: 150 футов
    material: порошок из раздавленной чёрной жемчужины стоимостью 500+ зм
    duration: Мгновенная
    higherLevel: Урон увеличивается на 2d8 за каждый уровень ячейки выше 6-го.
