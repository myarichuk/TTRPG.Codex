- id: detect-magic
  name: "Обнаружение магии"
  description: |-
    *Прорицание 1-го уровня (Бард, Жрец, Друид, Паладин, Следопыт, Чародей, Колдун, Волшебник)*

    **Время накладывания:** Действие или Ритуал  
