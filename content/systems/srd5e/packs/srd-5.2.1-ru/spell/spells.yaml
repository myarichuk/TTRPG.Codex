- id: conjure-elemental
  name: "Сотворение элементаля"
  description: |-
    *Вызов 5-го уровня (Друид, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы вызываете Большого неосязаемого духа из Стихийных Планов, который появляется в свободном пространстве в пределах дистанции. Выберите стихию духа, которая определяет тип его урона: воздух (электричество), земля (звук), огонь (огонь) или вода (холод). Дух существует на время действия заклинания.

    Каждый раз, когда видимое вами существо входит в пространство духа или начинает свой ход в пределах 5 футов от духа, вы можете заставить это существо совершить спасбросок Ловкости, если дух не удерживает ни одного существа. При провале цель получает 8d8 урона типа духа и получает состояние «Опутанный» до окончания заклинания. В начале каждого своего хода Опутанная цель повторяет спасбросок.

    При провале цель получает 4d8 урона типа духа. При успехе цель не Опутана духом.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Концентрация, до 10 минут"
    higherLevel: "Урон увеличивается на 1d8 за каждый уровень ячейки выше 5-го."
# source: OmnisGM (CC BY 4.0)
- id: conjure-fey
  name: "Сотворение феи"
  description: |-
    *Вызов 6-го уровня (Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 10 минут

    Вы вызываете Среднего духа из Страны Фей в свободном пространстве, которое видите в пределах дистанции. Дух существует на время действия заклинания и выглядит как существо-фея на ваш выбор. Когда дух появляется, вы можете совершить одну рукопашную атаку заклинанием против существа в пределах 5 футов от него. При попадании цель получает психический урон, равный 3d12 + модификатор вашей заклинательной характеристики, и получает состояние «Испуганный» до начала вашего следующего хода, причём и вы, и дух являетесь источником страха.

    Бонусным действием в последующие ходы вы можете телепортировать духа в свободное пространство, которое видите, в пределах 30 футов от пространства, которое он покинул, и совершить атаку против существа в пределах 5 футов от него.

    **_Использование ячейки более высокого уровня._** Урон увеличивается на 1d12 за каждый уровень ячейки выше 6-го.
  properties:
    castingTime: "Действие"
    range: "60 футов"
    duration: "Концентрация, до 10 минут"
