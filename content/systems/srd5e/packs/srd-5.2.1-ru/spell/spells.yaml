- id: divination
  name: Прорицание
  description: |-
    *4-й уровень, Прорицание (Жрец, Друид, Волшебник)*

    **Время сотворения:** Действие или ритуал  
    **Дистанция:** Личная  
    **Компоненты:** В, С, М (благовония стоимостью 25+ зм, которые поглощает заклинание)  
    **Длительность:** Мгновенная

    Это заклинание позволяет вам связаться с богом или его слугами. Вы задаёте один вопрос о конкретной цели, событии или деятельности, которые произойдут в течение 7 дней. Мастер даёт правдивый ответ, который может быть короткой фразой или загадочной рифмой. Заклинание не учитывает обстоятельства, которые могут изменить ответ, например сотворение других заклинаний.
    Если вы сотворяете это заклинание более одного раза до окончания продолжительного отдыха, то после первого раза каждое последующее сотворение имеет накопительный шанс 25 процентов, что вы не получите ответа.
  properties:
    castingTime: Действие
    range: Личная
    material: благовония стоимостью 25+ зм, которые поглощает заклинание
    duration: Мгновенная
