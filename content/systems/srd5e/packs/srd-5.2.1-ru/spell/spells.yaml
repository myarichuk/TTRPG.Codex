    Разделение воды. Вы разделяете воду в области и создаёте канаву. Канава тянется через всю область заклинания, а разделённая вода образует стену по обеим сторонам. Канава остаётся до окончания заклинания или пока вы не выберете другой эффект. Затем вода медленно заполняет канаву в течение следующего раунда, пока не восстановится обычный уровень воды. условия, чтобы вступить в силу. Как только они это сделают, вы можете снова изменить условия. Когда заклинание заканчивается, погода постепенно возвращается к норме.
    Когда вы меняете погодные условия, найдите текущее условие в следующих таблицах и измените его стадию на одну вверх или вниз. Меняя ветер, вы можете изменить его направление. Стадия осадков | Состояние
    1 | Ясно | 2 | Лёгкие облака
    3 | Пасмурно или туман у земли | 4 | Дождь, град или снег
    5 | Проливной дождь, сильный град или метель
    Перенаправление потока. Вы заставляете текущую воду в области двигаться в направлении, которое вы выбираете, даже если вода должна течь через препятствия, вверх по стенам или в других маловероятных направлениях. Вода в области движется, как вы направили, но, выйдя за пределы области заклинания, возвращается к течению по рельефу. Вода продолжает двигаться в выбранном направлении до окончания заклинания или пока вы не выберете другой эффект.
    Водоворот. Вы создаёте водоворот в центре области, который должен быть не меньше 50 футов. Стадия температуры | Состояние
    1 | Волна жары | 2 | Жарко
