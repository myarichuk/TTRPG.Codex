- id: storm-of-vengeance
  name: "Буря возмездия"
  description: |-
    *Вызов 9-го уровня (Друид)*

    **Время накладывания:** Действие  
    **Дистанция:** 1 миля  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Бурлящая грозовая туча формируется на время действия заклинания с центром в точке в пределах дистанции и распространяется на радиус 300 футов. Каждое существо под тучей при её появлении должно преуспеть в спасброске Телосложения, иначе оно получает 2d6 урона громом и получает состояние «Оглохший» на время действия заклинания.

    В начале каждого последующего вашего хода буря производит различные эффекты, описанные ниже.

    **_Ход 2._** Идёт кислотный дождь. Каждое существо и объект под тучей получает 4d6 урона кислотой.

    **_Ход 3._** Вы призываете шесть молний из тучи, поражающих шесть различных существ или объектов под ней. Каждая цель совершает спасбросок Ловкости, получая 10d6 урона молнией при провале или половину этого урона при успехе.

    **_Ход 4._** Обрушивается град. Каждое существо под тучей получает 2d6 дробящего урона.

    **_Ходы 5–10._** Порывы ветра и ледяной дождь обрушиваются на область под тучей. Каждое существо там получает 1d6 урона холодом. До окончания заклинания область является труднопроходимой местностью и сильно заслонена, дальнобойные атаки оружием в ней невозможны, и сильный ветер продувает область.
  properties:
    castingTime: "Действие"
    range: "1 миля"
    duration: "Концентрация, до 1 минуты"
