- id: summon-dragon
  name: Призыв дракона
  description: |-
    *5-й уровень, Вызов (Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С, М (предмет с изображением дракона, выгравированным на нём, стоимостью 500+ зм)
    **Длительность:** Концентрация, до 1 часа

    Вы призываете дух дракона. Он появляется в незанятом пространстве, которое вы видите в пределах дистанции, и использует стат-блок «Драконий дух». Существо исчезает, когда его очки здоровья снижаются до 0, или когда заклинание заканчивается.
    Существо является союзником для вас и ваших союзников. В бою существо делит с вами значение инициативы, но ходит сразу после вас. Оно подчиняется вашим словесным приказам (действие с вашей стороны не требуется). Если вы не отдаёте приказов, оно совершает действие Уклонение и использует своё перемещение, чтобы избежать опасности.

    **Использование ячейки более высокого уровня.** Используйте уровень ячейки заклинания как уровень заклинания в стат-блоке. Большой дракон, нейтральный, КД 14 + уровень заклинания, ОЗ 50 + 10 за каждый уровень заклинания выше 5, Скорость 30 фт., полёт 60 фт., плавание 30 фт.  МОД СПАС    МОД СПАС    МОД СПАС  СИЛ 19 +4 +4 ЛОВ 14 +2 +2 ТЕЛ 17 +3 +3 ИНТ 10 +0 +0 МУД 14 +2 +2 ХАР 14 +2 +2 Сопротивления: кислотный, холод, огонь, электричество, яд. Иммунитеты: очарованный, испуганный, отравленный. Чувства: слепое зрение 30 фт., тёмное зрение 60 фт.; пассивная Внимательность 12. Языки: драконий, понимает языки, которые знаете вы. ПО нет (опыт 0; БМ равен вашему бонусу мастерства). Особенности: Общее сопротивление. Когда вы призываете дух, выберите одно из его сопротивлений. Вы получаете сопротивление выбранному типу урона до конца действия заклинания. Действия: Множественная атака. Дух совершает количество атак «Разрыв», равное половине уровня заклинания (округлённо вниз), и использует Дыхание. Разрыв. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 10 футов. Попадание: 1d6 + 4 + уровень заклинания колющего урона. Дыхание. Спасбросок Ловкости: Сл равна вашей Сл спасброска заклинаний, каждое существо в конусе 30 футов. Провал: 2d6 урона типа, к которому дух имеет сопротивление (по вашему выбору при сотворении заклинания). Успех: половина урона.
  properties:
    castingTime: Действие
    range: 60 футов
    material: предмет с изображением дракона, выгравированным на нём, стоимостью 500+ зм
    duration: до 1 часа
    higherLevel: |-
      Используйте уровень ячейки заклинания как уровень заклинания в стат-блоке. Большой дракон, нейтральный, КД 14 + уровень заклинания, ОЗ 50 + 10 за каждый уровень заклинания выше 5, Скорость 30 фт., полёт 60 фт., плавание 30 фт.  МОД СПАС    МОД СПАС    МОД СПАС  СИЛ 19 +4 +4 ЛОВ 14 +2 +2 ТЕЛ 17 +3 +3 ИНТ 10 +0 +0 МУД 14 +2 +2 ХАР 14 +2 +2 Сопротивления: кислотный, холод, огонь, электричество, яд. Иммунитеты: очарованный, испуганный, отравленный. Чувства: слепое зрение 30 фт., тёмное зрение 60 фт.; пассивная Внимательность 12. Языки: драконий, понимает языки, которые знаете вы. ПО нет (опыт 0; БМ равен вашему бонусу мастерства). Особенности: Общее сопротивление. Когда вы призываете дух, выберите одно из его сопротивлений. Вы получаете сопротивление выбранному типу урона до конца действия заклинания. Действия: Множественная атака. Дух совершает количество атак «Разрыв», равное половине уровня заклинания (округлённо вниз), и использует Дыхание. Разрыв. Бросок атаки ближнего боя: бонус равен вашему модификатору атаки заклинанием, досягаемость 10 футов. Попадание: 1d6 + 4 + уровень заклинания колющего урона. Дыхание. Спасбросок Ловкости: Сл равна вашей Сл спасброска заклинаний, каждое существо в конусе 30 футов. Провал: 2d6 урона типа, к которому дух имеет сопротивление (по вашему выбору при сотворении заклинания). Успех: половина урона.
