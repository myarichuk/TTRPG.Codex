    До пяти существ на ваш выбор, которые остаются в пределах дистанции на протяжении всего сотворения заклинания, получают преимущества короткого отдыха, а также восстанавливают 2d8 хитов. Существо не может быть затронуто этим заклинанием снова, пока не завершит долгий отдых.

