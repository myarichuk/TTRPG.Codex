- id: dominate-beast
  name: Подчинение зверя
  description: |-
    *4-й уровень, Очарование (Друид, Следопыт, Чародей)*

    **Время сотворения:** Действие  
    **Дистанция:** 60 футов  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 минуты

    Один зверь, которого вы видите в пределах дистанции, должен преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» на время действия заклинания. Цель совершает спасбросок с преимуществом, если вы или ваши союзники сражаетесь с ней. Каждый раз, когда цель получает урон, она повторяет спасбросок и при успехе прекращает действие заклинания на себе.
    Пока вы оба находитесь на одном плане существования, у вас есть телепатическая связь с очарованной целью. В свой ход вы можете использовать эту связь, чтобы отдавать ей приказы (действие не требуется), например «Атакуй то существо», «Двигайся туда» или «Принеси тот предмет». Цель старается подчиниться в свой ход. Если она выполнила приказ и не получила новых указаний от вас, она действует и перемещается как хочет, заботясь прежде всего о своей защите.
    Вы можете приказать цели совершить реакцию, но для этого вы сами должны потратить свою реакцию.

    **Использование ячейки более высокого уровня.** Ваша концентрация может длиться дольше при использовании ячейки 5-го уровня (до 10 минут), 6-го (до 1 часа) или 7-го и выше (до 8 часов).
  properties:
    castingTime: Действие
    range: 60 футов
    duration: до 1 минуты
    higherLevel: Ваша концентрация может длиться дольше при использовании ячейки 5-го уровня (до 10 минут), 6-го (до 1 часа) или 7-го и выше (до 8 часов).
