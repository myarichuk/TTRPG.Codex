- id: dominate-person
  name: Подчинение личности
  description: |-
    *5-й уровень, Очарование (Бард, Чародей, Волшебник)*

    **Время сотворения:** Действие
    **Дистанция:** 60 футов
    **Компоненты:** В, С
    **Длительность:** Концентрация, до 1 минуты

    Один гуманоид, которого вы видите в пределах дистанции, должен преуспеть в спасброске Мудрости, иначе получит состояние «Очарованный» на время действия заклинания. Цель совершает этот спасбросок с преимуществом, если вы или ваши союзники сражаетесь с ней. Всякий раз, когда цель получает урон, она повторяет спасбросок и при успехе прекращает действие заклинания.
    Вы поддерживаете телепатическую связь с очарованной целью, пока вы оба находитесь на одном плане существования. В свой ход вы можете использовать эту связь, чтобы отдавать ей приказы (действие не требуется), например: «Атакуй то существо», «Иди вон туда» или «Принеси тот предмет». Цель старается выполнить приказ в свой ход. Если она выполнила приказ и не получила от вас новых указаний, она действует и перемещается по своему усмотрению, заботясь о собственной безопасности.
