- id: alarm
  name: "Тревога"
  description: |-
    *Ограждение 1-го уровня (Следопыт, Волшебник)*

    **Время накладывания:** 1 минута или ритуал  
    **Дистанция:** 30 футов  
    **Компоненты:** В, С, М (колокольчик и серебряная проволока)  
    **Длительность:** 8 часов

    Вы устанавливаете сигнализацию против вторжения. Выберите дверь, окно или область в пределах дистанции, не превышающую 20-футовый куб. До окончания заклинания сигнализация предупреждает вас всякий раз, когда существо касается защищённой области или входит в неё. При сотворении заклинания вы можете указать существ, которые не будут вызывать сигнализацию. Вы также выбираете, будет ли сигнализация слышимой или мысленной:

    **Слышимая сигнализация.** Сигнализация производит звук ручного колокольчика в течение 10 секунд в пределах 60 футов от защищённой области.

    **Мысленная сигнализация.** Вы получаете мысленный сигнал, если находитесь в пределах 1 мили от защищённой области. Этот сигнал пробуждает вас, если вы спите.
  properties:
    castingTime: "1 минута или ритуал"
    range: "30 футов"
    material: "колокольчик и серебряная проволока"
    duration: "8 часов"
# source: OmnisGM (CC BY 4.0)
- id: alter-self
  name: "Смена обличья"
  description: |-
    *Преобразование 2-го уровня (Чародей, Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** На себя  
    **Компоненты:** В, С  
    **Длительность:** Концентрация, до 1 часа

    Вы изменяете свою физическую форму. Выберите один из следующих вариантов. Его эффекты длятся на время действия заклинания, в течение которого вы можете совершить действие «Магия», чтобы заменить выбранный вариант другим.

    **_Водная адаптация._** У вас появляются жабры и перепонки между пальцами. Вы можете дышать под водой и получаете скорость плавания, равную вашей скорости.

    **_Изменение внешности._** Вы изменяете свою внешность. Вы решаете, как выглядите, включая рост, вес, черты лица, звучание голоса, длину волос, окраску и другие отличительные черты. Вы можете выглядеть как представитель другого вида, хотя ваши характеристики не меняются. Вы не можете выглядеть как существо другого размера, и ваша основная форма остаётся прежней; если вы двуногий, вы не можете использовать это заклинание, чтобы стать четвероногим, например. На время действия заклинания вы можете совершить действие «Магия», чтобы снова изменить внешность таким образом.

    **_Естественное оружие._** У вас вырастают когти (рубящий), клыки (колющий), рога (колющий) или копыта (дробящий). Когда вы используете безоружный удар для нанесения урона этим оружием, он наносит 1d6 урона типа, указанного в скобках, вместо обычного урона безоружного удара, и вы используете модификатор заклинательной характеристики для бросков атаки и урона вместо Силы.
  properties:
    castingTime: "Действие"
    range: "На себя"
    duration: "Концентрация, до 1 часа"
