- id: forcecage
  name: Силовая клетка
  description: |-
    *7-й уровень, Воплощение (Бард, Колдун, Волшебник)*

    **Время сотворения:** Действие  
    **Дистанция:** 100 футов  
    **Компоненты:** В, С, М (рубиновая пыль стоимостью 1,500+ зм, которую заклинание расходует)  
    **Длительность:** Концентрация, до 1 часа

    Неподвижная, невидимая тюрьма кубической формы, созданная из магического силового поля, появляется вокруг области, которую вы выберете в пределах дистанции. Тюрьма может быть клеткой или сплошным ящиком, по вашему выбору.
    Тюрьма в форме клетки может иметь сторону до 20 футов и состоит из прутьев диаметром 1/2 дюйма, расставленных с промежутком 1/2 дюйма. Тюрьма в форме ящика может иметь сторону до 10 футов и образует сплошной барьер, который не пропускает никакую материю и блокирует любые заклинания, направленные в область или из неё.
    Когда вы сотворяете заклинание, любое существо, полностью находящееся внутри области клетки, оказывается в ловушке. Существа, которые лишь частично находятся в области, либо те, кто слишком велик, чтобы поместиться внутри, отталкиваются от центра области, пока не окажутся полностью за её пределами.
    Существо внутри клетки не может покинуть её немагическими способами. Если существо пытается использовать телепортацию или межпланарное перемещение, чтобы выбраться, оно сначала должно совершить спасбросок Харизмы. При успешном спасброске существо может использовать эту магию, чтобы выйти из клетки. При провале оно не выходит из клетки, и заклинание или эффект тратятся впустую. Клетка также простирается в Эфирный план, блокируя эфирные перемещения. Это заклинание нельзя рассеять заклинанием Рассеивание магии.
  properties:
    castingTime: Действие
    range: 100 футов
    material: рубиновая пыль стоимостью 1,500+ зм, которую заклинание расходует
    duration: до 1 часа
