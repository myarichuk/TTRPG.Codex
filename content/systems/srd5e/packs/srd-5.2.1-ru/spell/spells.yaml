- id: meld-into-stone
  name: "Слияние с камнем"
  description: |-
    *Преобразование 3-го уровня (Жрец, Друид, Следопыт)*

    **Время накладывания:** Действие или Ритуал  
    **Дистанция:** Касание  
    **Компоненты:** В, С  
    **Длительность:** 8 часов

    Вы входите в каменный объект или поверхность, достаточно большие, чтобы полностью вместить ваше тело, сливаясь с камнем вместе со своим снаряжением на время действия заклинания. Вы должны коснуться камня, чтобы сделать это. Ничто из вашего присутствия не остаётся видимым или обнаруживаемым немагическими чувствами.

    Находясь слитым с камнем, вы не видите, что происходит снаружи, и любые проверки Мудрости (Внимательность), которые вы совершаете, чтобы услышать звуки снаружи, совершаются с помехой. Вы осознаёте ход времени и можете сотворять заклинания на себя, находясь слитым с камнем. Вы можете использовать 5 футов перемещения, чтобы выйти из камня там, где вошли, что заканчивает заклинание. В остальном вы не можете перемещаться.

    Незначительное физическое повреждение камня не причиняет вам вреда, но его частичное разрушение или изменение его формы (настолько, что вы больше не помещаетесь в нём) выталкивает вас и наносит вам 6d6 урона силовым полем. Полное разрушение камня (или превращение в другое вещество) выталкивает вас и наносит вам 50 урона силовым полем. Если вас вытолкнуло, вы перемещаетесь в свободное пространство, ближайшее к тому месту, где вы впервые вошли, и получаете состояние «Лежащий».
  properties:
    castingTime: "Действие или Ритуал"
    range: "Касание"
    duration: "8 часов"
