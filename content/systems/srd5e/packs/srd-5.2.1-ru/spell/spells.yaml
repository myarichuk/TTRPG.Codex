- id: arcane-lock
  name: "Арканный замок"
  description: |-
    *Ограждение 2-го уровня (Волшебник)*

    **Время накладывания:** Действие  
    **Дистанция:** Касание  
    **Компоненты:** В, С, М (золотая пыль стоимостью 25+ зм, которая потребляется заклинанием)  
    **Длительность:** Пока не рассеяно

