# source: OmnisGM (CC BY 4.0)
- id: champion
  name: "Чемпион"
  description: |-
    *Стремление к физическому совершенству в бою*

    Чемпион сосредоточен на развитии боевого мастерства в неустанном стремлении к победе. Чемпионы сочетают строгие тренировки с физическим совершенством, чтобы наносить сокрушительные удары, противостоять опасности и стяжать славу. Будь то атлетические состязания или кровопролитные битвы, Чемпионы стремятся к венцу победителя.
  properties:
    summary: "Стремление к физическому совершенству в бою"
    features:
    - name: "Улучшенный критический удар"
      level: 3
      description: |-
        Ваши броски атаки оружием и безоружными ударами могут нанести критическое попадание при результате 19 или 20 на d20.
    - name: "Выдающийся атлет"
      level: 3
      description: |-
        Благодаря вашему атлетизму вы получаете преимущество на броски инициативы и проверки Силы (Атлетика).

        Кроме того, сразу после нанесения критического попадания вы можете переместиться на расстояние до половины вашей скорости, не провоцируя Провоцированные атаки.
    - name: "Дополнительный боевой стиль"
      level: 7
      description: |-
        Вы получаете ещё одну черту Боевой стиль на свой выбор.
    - name: "Героический воин"
      level: 10
      description: |-
        Острые ощущения битвы ведут вас к победе. Во время боя вы можете дать себе Героическое вдохновение каждый раз, когда начинаете свой ход без него.
    - name: "Превосходный критический удар"
      level: 15
      description: |-
        Ваши броски атаки оружием и безоружными ударами теперь могут нанести критическое попадание при результате 18–20 на d20.
    - name: "Выживший"
      level: 18
      description: |-
        Вы достигли вершины стойкости в бою, получая следующие преимущества.

        **Противостояние смерти.** Вы получаете преимущество на спасброски от смерти. Более того, когда вы выбрасываете 18–20 на спасброске от смерти, вы получаете преимущество, как если бы выбросили 20.

        **Героическое восстановление.** В начале каждого вашего хода вы восстанавливаете количество хитов, равное 5 + ваш модификатор Телосложения, если вы окровавлены и имеете как минимум 1 хит.
# source: OmnisGM (CC BY 4.0)
- id: circle-of-the-land
  name: "Круг Земли"
  description: |-
    *Почитание связи с природным миром*

    Круг Земли объединяет мистиков и мудрецов, которые охраняют древние знания и обряды. Эти друиды собираются в священных кругах из деревьев или стоячих камней, чтобы шептать первобытные секреты на Друидическом. Мудрейшие члены круга выступают в качестве верховных жрецов своих общин.
  properties:
    summary: "Почитание связи с природным миром"
    features:
    - name: "Заклинания Круга Земли"
      level: 3
      description: |-
        Каждый раз, когда вы заканчиваете долгий отдых, выбирайте один тип земли: засушливая, полярная, умеренная или тропическая. Смотрите таблицу, соответствующую выбранному типу; у вас подготовлены заклинания, указанные для вашего уровня друида и ниже.

        Таблица: Засушливая земля

        | Уровень друида | Заклинания круга                         |
        |---|---|
        | 3              | Размытость, Огненные руки, Огненный снаряд  |
        | 5              | Огненный шар                             |
        | 7              | Гниль                                    |
        | 9              | Каменная стена                              |

        Таблица: Полярная земля

        | Уровень друида | Заклинания круга                                   |
        |---|---|
        | 3              | Туманное облако, Удержание личности, Луч холода |
        | 5              | Слякотный дождь                                             |
        | 7              | Град                                      |
        | 9              | Конус холода                                       |

        Таблица: Умеренная земля

        | Уровень друида | Заклинания круга                           |
        |---|---|
        | 3              | Туманный шаг, Шоковый захват, Усыпление |
        | 5              | Молния                                     |
        | 7              | Свобода перемещения                        |
        | 9              | Шаг сквозь деревья                         |

        Таблица: Тропическая земля

        | Уровень друида | Заклинания круга                             |
        |---|---|
        | 3              | Кислотные брызги, Луч болезни, Паутина         |
        | 5              | Удушающее облако                             |
        | 7              | Превращение                                     |
        | 9              | Нашествие насекомых                          |
    - name: "Помощь земли"
      level: 3
      description: |-
        Действием «Магия» вы можете потратить использование Дикого облика и выбрать точку в пределах 60 футов от себя. На мгновение появляются дающие жизнь цветы и высасывающие жизнь шипы в сфере радиусом 10 футов с центром в этой точке. Каждое существо на ваш выбор в сфере должно совершить спасбросок Телосложения против СЛ спасброска ваших заклинаний, получая 2d6 некротического урона при провале или половину этого урона при успехе. Одно существо на ваш выбор в этой области восстанавливает 2d6 хитов.

        Урон и лечение увеличиваются на 1d6, когда вы достигаете 10-го (3d6) и 14-го (4d6) уровня друида.
    - name: "Природное восстановление"
      level: 6
      description: |-
        Вы можете сотворить одно из заклинаний 1-го уровня или выше, которое у вас подготовлено из умения Заклинания Круга Земли, без траты ячейки заклинания, и вы должны закончить долгий отдых, прежде чем сможете сделать это снова.

        Кроме того, когда вы заканчиваете короткий отдых, вы можете восстановить потраченные ячейки заклинаний. Суммарный уровень ячеек заклинаний может быть равен или меньше половины вашего уровня друида (с округлением вверх), и ни одна из них не может быть 6-го уровня или выше. Например, если вы друид 6-го уровня, вы можете восстановить до трёх уровней ячеек заклинаний. Вы можете восстановить одну ячейку 3-го уровня, одну ячейку 2-го и одну 1-го уровня или три ячейки 1-го уровня. После восстановления ячеек заклинаний с помощью этого умения вы не можете сделать это снова, пока не закончите долгий отдых.
    - name: "Защита природы"
      level: 10
      description: |-
        Вы получаете иммунитет к состоянию Отравленный и сопротивление к типу урона, связанному с вашим текущим выбором земли в умении Заклинания Круга Земли, как показано в таблице Защита природы.

        Таблица: Защита природы

        | Тип земли   | Сопротивление | Тип земли  | Сопротивление |
        |---|---|---|---|
        | Засушливая  | Огонь         | Умеренная  | Электричество |
        | Полярная    | Холод         | Тропическая | Яд           |
    - name: "Убежище природы"
      level: 14
      description: |-
        Действием «Магия» вы можете потратить использование Дикого облика и призвать призрачные деревья и лозы в кубе со стороной 15 футов на земле в пределах 120 футов от себя. Они остаются там на 1 минуту или пока вы не получите состояние Недееспособный или не умрёте. Вы и ваши союзники получаете укрытие наполовину, находясь в этой области, и ваши союзники получают текущее сопротивление вашей Защиты природы, находясь там.

        Как Бонусное действие, вы можете переместить куб на расстояние до 60 футов на землю в пределах 120 футов от себя.
# source: OmnisGM (CC BY 4.0)
- id: college-of-lore
  name: "Коллегия знаний"
  description: |-
    *Постигай глубины магических знаний*

    Барды Коллегии знаний собирают заклинания и секреты из разнообразных источников — учёных трактатов, мистических ритуалов и крестьянских сказок. Члены коллегии собираются в библиотеках и университетах, чтобы делиться знаниями друг с другом. Они также встречаются на праздниках или государственных мероприятиях, где могут разоблачать коррупцию, распутывать ложь и высмеивать самодовольных властителей.
  properties:
    summary: "Постигай глубины магических знаний"
    features:
    - name: "Дополнительные владения"
      level: 3
      description: |-
        Вы получаете владение тремя навыками по вашему выбору.
    - name: "Острые слова"
      level: 3
      description: |-
        Вы учитесь использовать остроумие для сверхъестественного отвлечения, смущения и подрыва уверенности и компетенции других. Когда существо, которое вы видите в пределах 60 футов, совершает бросок урона или преуспевает в проверке характеристики или броске атаки, вы можете использовать реакцию, чтобы потратить одно использование Вдохновения барда; бросьте Кость бардического вдохновения и вычтите выпавшее число из броска существа, уменьшая урон или потенциально превращая успех в провал.
    - name: "Магические открытия"
      level: 6
      description: |-
        Вы изучаете два заклинания по вашему выбору. Эти заклинания могут быть из списка заклинаний Жреца, Друида или Волшебника или любой их комбинации (см. раздел класса для его списка заклинаний). Выбранное заклинание должно быть заговором или заклинанием, для которого у вас есть ячейки, как показано в таблице Умения Барда.

        Вы всегда держите выбранные заклинания подготовленными, и при получении уровня Барда вы можете заменить одно из заклинаний другим заклинанием, соответствующим этим требованиям.
    - name: "Несравненное мастерство"
      level: 14
      description: |-
        Когда вы совершаете проверку характеристики или бросок атаки и проваливаете, вы можете потратить одно использование Вдохновения барда; бросьте Кость бардического вдохновения и добавьте выпавшее число к d20, потенциально превращая провал в успех. При провале Вдохновение барда не расходуется.
# source: OmnisGM (CC BY 4.0)
- id: draconic-sorcery
  name: "Драконье чародейство"
  description: |-
    *Дышите магией драконов*

    Ваша врождённая магия происходит от дара дракона. Возможно, древний дракон перед смертью завещал часть своей магической силы вам или вашему предку. Вы могли впитать магию из места, пропитанного силой драконов. Или, возможно, вы держали в руках сокровище из драконьего клада, насыщенное драконьей силой. Или у вас может быть дракон в числе предков.
  properties:
    summary: "Дышите магией драконов"
    features:
    - name: "Драконья стойкость"
      level: 3
      description: |-
        Магия в вашем теле проявляет физические черты вашего драконьего дара. Ваш максимум хитов увеличивается на 3 и увеличивается на 1 каждый раз, когда вы получаете ещё один уровень чародея.

        Части вашего тела также покрыты чешуёй, похожей на драконью. Пока вы не носите доспехи, ваш базовый Класс Доспеха равен 10 + ваш модификатор Ловкости + ваш модификатор Харизмы.
    - name: "Драконьи заклинания"
      level: 3
      description: |-
        Когда вы достигаете уровня чародея, указанного в таблице Драконьи заклинания, у вас с этого момента всегда подготовлены перечисленные заклинания.

        Таблица: Драконьи заклинания

        | Уровень чародея | Заклинания                                                |
        |---|---|
        | 3               | Смена обличья, Хроматическая сфера, Приказ, Драконье дыхание |
        | 5               | Страх, Полёт                                              |
        | 7               | Арканный глаз, Чары чудовища                      |
        | 9               | Знание легенд, Призыв дракона                                   |
    - name: "Стихийная близость"
      level: 6
      description: |-
        Ваша драконья магия имеет близость с типом урона, связанным с драконами. Выберите один из этих типов: Кислота, Холод, Огонь, Электричество или Яд.

        Вы получаете сопротивление к этому типу урона, и когда вы творите заклинание, наносящее урон этого типа, вы можете добавить свой модификатор Харизмы к одному броску урона этого заклинания.
    - name: "Драконьи крылья"
      level: 14
      description: |-
        Как Бонусное действие, вы можете заставить драконьи крылья появиться на вашей спине. Крылья существуют 1 час или пока вы не развеете их (действие не требуется). В течение этого времени у вас есть скорость полёта 60 футов.

        После использования этого умения вы не можете использовать его снова, пока не закончите долгий отдых, если только вы не потратите 3 очка чародейства (действие не требуется), чтобы восстановить использование.
    - name: "Драконий спутник"
      level: 18
      description: |-
        Вы можете сотворить *Призыв дракона* без материального компонента. Вы также можете сотворить его один раз без ячейки заклинания и восстанавливаете способность сотворить его таким образом, когда заканчиваете долгий отдых.

        Каждый раз, когда вы начинаете творить это заклинание, вы можете модифицировать его так, чтобы оно не требовало концентрации. Если вы это делаете, длительность заклинания становится 1 минута для этого сотворения.
# source: OmnisGM (CC BY 4.0)
- id: evoker
  name: "Воплотитель"
  description: |-
    *Создание взрывных стихийных эффектов*

    Ваши исследования сосредоточены на магии, создающей мощные стихийные эффекты, такие как жгучий холод, опаляющее пламя, раскатистый гром, трескучие молнии и обжигающая кислота. Некоторые воплотители находят работу в военных силах, служа артиллерией для обстрела армий издалека. Другие используют свою силу для защиты других, а некоторые ищут собственную выгоду.
  properties:
    summary: "Создание взрывных стихийных эффектов"
    features:
    - name: "Знаток воплощения"
      level: 3
      description: |-
        Выберите два заклинания волшебника школы Воплощение, каждое из которых должно быть не выше 2-го уровня, и добавьте их в книгу заклинаний бесплатно.

        Кроме того, каждый раз, когда вы получаете доступ к новому уровню ячеек заклинаний в этом классе, вы можете добавить одно заклинание волшебника школы Воплощение в книгу заклинаний бесплатно. Выбранное заклинание должно быть того уровня, для которого у вас есть ячейки заклинаний.
    - name: "Мощный заговор"
      level: 3
      description: |-
        Ваши наносящие урон заговоры влияют даже на существ, которые избегают основной силы эффекта. Когда вы творите заговор по существу и промахиваетесь броском атаки или цель преуспевает в спасброске против заговора, цель получает половину урона заговора (если есть), но не получает никаких других эффектов от заговора.
    - name: "Формирование заклинаний"
      level: 6
      description: |-
        Вы можете создавать карманы относительной безопасности внутри эффектов ваших воплощений. Когда вы творите заклинание Воплощения, которое воздействует на других существ, которых вы видите, вы можете выбрать количество из них, равное 1 + уровень заклинания. Выбранные существа автоматически преуспевают в спасбросках против заклинания и не получают урона, если обычно получали бы половину урона при успешном спасброске.
    - name: "Усиленное воплощение"
      level: 10
      description: |-
        Каждый раз, когда вы творите заклинание волшебника школы Воплощение, вы можете добавить свой модификатор Интеллекта к одному броску урона этого заклинания.
    - name: "Перенаполнение"
      level: 14
      description: |-
        Вы можете увеличить силу ваших заклинаний. Когда вы творите заклинание волшебника с ячейкой заклинания 1-5 уровня, наносящее урон, вы можете нанести максимальный урон этим заклинанием в ход, когда вы его творите.

        В первый раз, когда вы делаете это, вы не испытываете никаких негативных последствий. Если вы используете это умение снова до окончания долгого отдыха, вы получаете 2d12 некротического урона за каждый уровень ячейки заклинания сразу после его сотворения. Этот урон игнорирует сопротивление и иммунитет.

        Каждый раз, когда вы используете это умение снова до окончания долгого отдыха, некротический урон за уровень заклинания увеличивается на 1d12.
# source: OmnisGM (CC BY 4.0)
- id: fiend-patron
  name: "Покровитель: Исчадие"
  description: |-
    *Заключите сделку с Нижними планами*

    Ваш договор черпает силу из Нижних планов, миров погибели. Вы могли заключить сделку с лордом демонов, архидьяволом или другим особенно могущественным исчадием. Цели этого покровителя злы — порча или разрушение всего сущего, включая в конечном счёте вас — и ваш путь определяется тем, насколько вы противостоите этим целям.
  properties:
    summary: "Заключите сделку с Нижними планами"
    features:
    - name: "Благословение тёмного"
      level: 3
      description: |-
        Когда вы уменьшаете хиты врага до 0, вы получаете временные хиты, равные вашему модификатору Харизмы + ваш уровень колдуна (минимум 1 временный хит). Вы также получаете это преимущество, если кто-то другой уменьшает хиты врага в пределах 10 футов от вас до 0.
    - name: "Заклинания исчадия"
      level: 3
      description: |-
        Магия вашего покровителя гарантирует, что у вас всегда готовы определённые заклинания; когда вы достигаете уровня колдуна, указанного в таблице Заклинания исчадия, у вас с этого момента всегда подготовлены перечисленные заклинания.

        Таблица: Заклинания исчадия

        | Уровень колдуна | Заклинания                                    |
        |---|---|
        | 3               | Огненные руки, Приказ, Палящий луч, Внушение |
        | 5               | Огненный шар, Удушающее облако                |
        | 7               | Огненный щит, Стена огня                      |
        | 9               | Обет, Нашествие насекомых                     |
    - name: "Собственная удача тёмного"
      level: 6
      description: |-
        Вы можете призвать своего дьявольского покровителя изменить судьбу в вашу пользу. Когда вы совершаете проверку характеристики или спасбросок, вы можете использовать это умение, чтобы добавить 1d10 к броску. Вы можете сделать это после того, как увидите результат броска, но до того, как проявятся какие-либо его последствия.

        Вы можете использовать это умение количество раз, равное вашему модификатору Харизмы (минимум один раз), но не более одного раза за бросок. Вы восстанавливаете все потраченные использования, когда заканчиваете долгий отдых.
    - name: "Дьявольская стойкость"
      level: 10
      description: |-
        Выбирайте один тип урона, кроме урона силовым полем, каждый раз, когда вы заканчиваете короткий или долгий отдых. Вы получаете сопротивление к этому типу урона, пока не выберете другой с помощью этого умения.
    - name: "Низвержение в ад"
      level: 14
      description: |-
        Один раз в ход, когда вы попадаете по существу броском атаки, вы можете попытаться мгновенно перенести цель через Нижние планы. Цель должна преуспеть в спасброске Харизмы против СЛ спасброска ваших заклинаний, или цель исчезает и проносится через кошмарный ландшафт. Цель получает 8d10 психического урона, если это не исчадие, и получает состояние Недееспособный до конца вашего следующего хода, когда она возвращается в пространство, которое занимала ранее, или в ближайшее незанятое пространство.

        После использования этого умения вы не можете использовать его снова, пока не закончите долгий отдых, если только вы не потратите ячейку Магии договора (действие не требуется), чтобы восстановить использование.
# source: OmnisGM (CC BY 4.0)
- id: hunter
  name: "Охотник"
  description: |-
    *Защита природы и людей от разрушения*

    Вы выслеживаете добычу в дикой местности и не только, используя свои способности Охотника для защиты природы и людей повсюду от сил, которые могут их уничтожить.
  properties:
    summary: "Защита природы и людей от разрушения"
    features:
    - name: "Знания охотника"
      level: 3
      description: |-
        Вы можете призвать силы природы, чтобы раскрыть определённые сильные и слабые стороны вашей добычи. Пока существо отмечено вашей *Меткой охотника*, вы знаете, есть ли у этого существа какие-либо иммунитеты, сопротивления или уязвимости, и если они есть, вы знаете какие.
    - name: "Добыча охотника"
      level: 3
      description: |-
        Вы получаете одну из следующих опций на свой выбор. Каждый раз, когда вы заканчиваете короткий или долгий отдых, вы можете заменить выбранную опцию другой.

        **Истребитель колоссов.** Ваша настойчивость может измотать даже самых стойких врагов. Когда вы попадаете по существу оружием, оружие наносит дополнительно 1d8 урона цели, если у неё не хватает хитов. Вы можете нанести этот дополнительный урон только один раз в ход.

        **Разрушитель орды.** Один раз в каждый свой ход, когда вы совершаете атаку оружием, вы можете совершить другую атаку тем же оружием по другому существу, которое находится в пределах 5 футов от первоначальной цели, находится в пределах дистанции оружия и которое вы не атаковали в этот ход.
    - name: "Защитная тактика"
      level: 7
      description: |-
        Вы получаете одну из следующих опций на свой выбор. Каждый раз, когда вы заканчиваете короткий или долгий отдых, вы можете заменить выбранную опцию другой.

        **Уход от орды.** Провоцированные атаки по вам совершаются с помехой.

        **Защита от множественных атак.** Когда существо попадает по вам броском атаки, это существо получает помеху на все другие броски атаки по вам в этот ход.
    - name: "Превосходная добыча охотника"
      level: 11
      description: |-
        Один раз в ход, когда вы наносите урон существу, отмеченному вашей *Меткой охотника*, вы также можете нанести дополнительный урон этого заклинания другому существу, которое вы видите в пределах 30 футов от первого существа.
    - name: "Превосходная защита охотника"
      level: 15
      description: |-
        Когда вы получаете урон, вы можете использовать Реакцию, чтобы получить сопротивление к этому урону и любому другому урону того же типа до конца текущего хода.
# source: OmnisGM (CC BY 4.0)
- id: life-domain
  name: "Домен жизни"
  description: |-
    *Исцеление боли мира*

    Домен жизни сосредоточен на позитивной энергии, которая поддерживает всю жизнь во вселенной. Жрецы, черпающие силу из этого домена, являются мастерами исцеления, использующими эту жизненную силу для лечения многих недугов.

    Само существование опирается на позитивную энергию, связанную с этим доменом, поэтому жрец практически любой религиозной традиции может выбрать его. Этот домен особенно связан с божествами земледелия, богами исцеления или выносливости, а также богами дома и общины. Религиозные ордена целителей также ищут магию этого домена.
  properties:
    summary: "Исцеление боли мира"
    features:
    - name: "Послушник жизни"
      level: 3
      description: |-
        Когда заклинание, которое вы творите с использованием ячейки заклинания, восстанавливает хиты существу, это существо восстанавливает дополнительные хиты в ход, когда вы творите заклинание. Дополнительные хиты равны 2 плюс уровень ячейки заклинания.
    - name: "Заклинания домена жизни"
      level: 3
      description: |-
        Ваша связь с этим божественным доменом гарантирует, что у вас всегда подготовлены определённые заклинания. Когда вы достигаете уровня жреца, указанного в таблице Заклинания домена жизни, у вас с этого момента всегда подготовлены перечисленные заклинания.

        Таблица: Заклинания домена жизни

        | Уровень жреца | Подготовленные заклинания                             |
        |---|---|
        | 3             | Помощь, Благословение, Лечение ран, Малое восстановление |
        | 5             | Массовое целебное слово, Возвращение к жизни                |
        | 7             | Аура жизни, Защита от смерти                        |
        | 9             | Высшее восстановление, Массовое исцеление ран        |
    - name: "Сохранение жизни"
      level: 3
      description: |-
        Действием «Магия» вы представляете священный символ и тратите одно использование Божественного канала, чтобы вызвать исцеляющую энергию, способную восстановить количество хитов, равное пятикратному вашему уровню жреца. Выберите окровавленных существ в пределах 30 футов от себя (включая себя) и распределите эти хиты между ними. Это умение может восстановить существу не более половины его максимума хитов.
    - name: "Благословенный целитель"
      level: 6
      description: |-
        Исцеляющие заклинания, которые вы творите на других, исцеляют и вас. Сразу после того, как вы сотворили заклинание с использованием ячейки заклинания, которое восстанавливает хиты одному или нескольким существам, кроме вас, вы восстанавливаете хиты, равные 2 плюс уровень ячейки заклинания.
    - name: "Высшее исцеление"
      level: 17
      description: |-
        Когда вы обычно бросаете одну или несколько костей для восстановления хитов существу заклинанием или Божественным каналом, не бросайте эти кости для исцеления; вместо этого используйте максимально возможное число для каждой кости. Например, вместо восстановления 2d6 хитов существу заклинанием, вы восстанавливаете 12.
# source: OmnisGM (CC BY 4.0)
- id: oath-of-devotion
  name: "Клятва преданности"
  description: |-
    *Защита идеалов справедливости и порядка*

    Клятва преданности связывает паладинов с идеалами справедливости и порядка. Эти паладины воплощают архетип рыцаря в сияющих доспехах. Они придерживаются высочайших стандартов поведения, и некоторые — к лучшему или худшему — требуют того же от остального мира.

    Многие, кто даёт эту клятву, преданы богам закона и добра и используют заповеди своих богов как мерило личной преданности. Другие считают ангелов своими идеалами и включают изображения ангельских крыльев в свои шлемы или гербы.

    Эти паладины разделяют следующие принципы:

    - Пусть твоё слово будет твоим обещанием.
    - Защищай слабых и никогда не бойся действовать.
    - Пусть твои благородные деяния служат примером.
  properties:
    summary: "Защита идеалов справедливости и порядка"
    features:
    - name: "Заклинания Клятвы преданности"
      level: 3
      description: |-
        Магия вашей клятвы гарантирует, что у вас всегда готовы определённые заклинания; когда вы достигаете уровня паладина, указанного в таблице Заклинания Клятвы преданности, у вас с этого момента всегда подготовлены перечисленные заклинания.

        Таблица: Заклинания Клятвы преданности

        | Уровень паладина | Заклинания                                      |
        |---|---|
        | 3                | Защита от добра и зла, Щит веры                 |
        | 5                | Помощь, Зона правды                         |
        | 9                | Маяк надежды, Рассеивание магии                 |
        | 13               | Свобода перемещения, Страж веры                 |
        | 17               | Причастие, Небесный огонь                       |
    - name: "Священное оружие"
      level: 3
      description: |-
        Когда вы совершаете действие Атака, вы можете потратить одно использование Божественного канала, чтобы наполнить оружие ближнего боя, которое держите, позитивной энергией. На 10 минут или пока вы не используете это умение снова, вы добавляете свой модификатор Харизмы к броскам атаки этим оружием (минимум +1), и каждый раз, когда вы попадаете им, вы заставляете его наносить свой обычный тип урона или урон излучением.

        Оружие также излучает яркий свет в радиусе 20 футов и тусклый свет ещё на 20 футов.

        Вы можете досрочно прекратить этот эффект (действие не требуется). Этот эффект также заканчивается, если вы не несёте оружие.
    - name: "Аура преданности"
      level: 7
      description: |-
        Вы и ваши союзники получаете иммунитет к состоянию Очарованный, пока находитесь в вашей Ауре защиты. Если Очарованный союзник входит в ауру, это состояние не действует на союзника, пока он там находится.
    - name: "Кара защиты"
      level: 15
      description: |-
        Ваша магическая кара теперь излучает защитную энергию. Каждый раз, когда вы творите *Божественную кару*, вы и ваши союзники получаете укрытие наполовину, находясь в вашей Ауре защиты. Аура обладает этим преимуществом до начала вашего следующего хода.
    - name: "Святой нимб"
      level: 20
      description: |-
        Как Бонусное действие, вы можете наполнить свою Ауру защиты святой силой, даруя преимущества ниже на 10 минут или пока вы не прекратите их (действие не требуется). После использования этого умения вы не можете использовать его снова, пока не закончите долгий отдых. Вы также можете восстановить использование, потратив ячейку заклинания 5-го уровня (действие не требуется).

        **Святая защита.** Вы получаете преимущество на любой спасбросок, который вы вынуждены совершить из-за исчадия или нежити.

        **Урон излучением.** Каждый раз, когда враг начинает свой ход в ауре, это существо получает урон излучением, равный вашему модификатору Харизмы + ваш бонус мастерства.

        **Солнечный свет.** Аура заполнена ярким светом, который является солнечным светом.
# source: OmnisGM (CC BY 4.0)
- id: path-of-the-berserker
  name: "Путь берсерка"
  description: |-
    *Направляй Ярость в неистовую жестокость*

    Варвары, идущие Путём берсерка, направляют свою Ярость преимущественно в насилие. Их путь — это необузданная ярость, и они наслаждаются хаосом битвы, позволяя Ярости охватить и усилить их.
  properties:
    summary: "Направляй Ярость в неистовую жестокость"
    features:
    - name: "Бешенство"
      level: 3
      description: |-
        Если вы используете Безрассудную атаку, пока Ярость активна, вы наносите дополнительный урон первой цели, которую поражаете в свой ход атакой на основе Силы. Чтобы определить дополнительный урон, бросьте количество d6, равное вашему бонусу урона ярости, и сложите их. Урон имеет тот же тип, что и оружие или безоружный удар, использованный для атаки.
    - name: "Безумная ярость"
      level: 6
      description: |-
        Вы получаете иммунитет к состояниям Очарованный и Испуганный, пока Ярость активна. Если вы Очарованы или Испуганы, когда входите в Ярость, состояние заканчивается на вас.
    - name: "Возмездие"
      level: 10
      description: |-
        Когда вы получаете урон от существа в пределах 5 футов от вас, вы можете использовать реакцию, чтобы совершить одну рукопашную атаку против этого существа оружием или безоружным ударом.
    - name: "Устрашающее присутствие"
      level: 14
      description: |-
        В качестве бонусного действия вы можете вселить ужас в других своим угрожающим присутствием и первобытной силой. Когда вы это делаете, каждое существо по вашему выбору в радиусе 30 футов от вас должно совершить спасбросок Мудрости (СЛ 8 + модификатор Силы + бонус мастерства). При провале существо получает состояние Испуганный на 1 минуту. В конце каждого своего хода Испуганное существо повторяет спасбросок, заканчивая эффект на себе при успехе.

        После использования этого умения вы не можете использовать его снова, пока не завершите долгий отдых, если только не потратите использование Ярости (действие не требуется), чтобы восстановить его использование.
# source: OmnisGM (CC BY 4.0)
- id: thief
  name: "Вор"
  description: |-
    *Охота за сокровищами как классический искатель приключений*

    Сочетание взломщика, охотника за сокровищами и исследователя — вы воплощение искателя приключений. Помимо улучшения ловкости и скрытности, вы получаете способности, полезные для исследования руин и получения максимальной пользы от найденных там магических предметов.
  properties:
    summary: "Охота за сокровищами как классический искатель приключений"
    features:
    - name: "Ловкие руки"
      level: 3
      description: |-
        Как Бонусное действие, вы можете сделать одно из следующего.

        **Ловкость рук.** Совершите проверку Ловкости (Ловкость рук), чтобы вскрыть замок или обезвредить ловушку с помощью воровских инструментов или чтобы залезть в карман.

        **Использовать предмет.** Совершите действие Использование или действие «Магия», чтобы использовать магический предмет, требующий этого действия.
    - name: "Работа на высоте"
      level: 3
      description: |-
        Вы натренировались проникать в особенно труднодоступные места, что даёт следующие преимущества.

        **Скалолаз.** Вы получаете скорость лазания, равную вашей скорости.

        **Прыгун.** Вы можете определять дистанцию прыжка, используя Ловкость вместо Силы.
    - name: "Превосходная скрытность"
      level: 9
      description: |-
        Вы получаете следующую опцию Хитрого удара. *Скрытная атака (Стоимость: 1d6).* Если у вас есть состояние Невидимый от действия Скрыться, эта атака не прекращает это состояние на вас, если вы заканчиваете ход за укрытием на три четверти или полным укрытием.
    - name: "Использование магических устройств"
      level: 13
      description: |-
        Вы научились максимально использовать магические предметы, получая следующие преимущества.

        **Настройка.** Вы можете настроиться на четыре магических предмета одновременно.

        **Заряды.** Каждый раз, когда вы используете свойство магического предмета, расходующее заряды, бросьте 1d6. При результате 6 вы используете свойство без траты зарядов.

        **Свитки.** Вы можете использовать любой *Свиток заклинания*, используя Интеллект как базовую характеристику для заклинания. Если заклинание является заговором или заклинанием 1-го уровня, вы можете сотворить его надёжно. Если свиток содержит заклинание более высокого уровня, вы должны сначала преуспеть в проверке Интеллекта (Магия) (СЛ 10 + уровень заклинания). При успехе вы творите заклинание со свитка. При провале свиток рассыпается.
    - name: "Рефлексы вора"
      level: 17
      description: |-
        Вы мастер в устройстве засад и быстром уходе от опасности. Вы можете совершить два хода в течение первого раунда любого боя. Вы совершаете первый ход при вашей обычной инициативе, а второй ход — при вашей инициативе минус 10.
# source: OmnisGM (CC BY 4.0)
- id: warrior-of-the-open-hand
  name: "Воин открытой ладони"
  description: |-
    *Мастер техник безоружного боя*

    Воины открытой ладони — мастера безоружного боя. Они изучают техники толкания и опрокидывания противников и манипулирования собственной энергией для защиты от вреда.
  properties:
    summary: "Мастер техник безоружного боя"
    features:
    - name: "Техника открытой ладони"
      level: 3
      description: |-
        Каждый раз, когда вы попадаете по существу атакой, предоставленной Шквалом ударов, вы можете наложить на цель один из следующих эффектов.

        **Сбить с толку.** Цель не может совершать провоцированные атаки до начала своего следующего хода.

        **Толчок.** Цель должна преуспеть в спасброске Силы или быть оттолкнута на расстояние до 15 футов от вас.

        **Опрокинуть.** Цель должна преуспеть в спасброске Ловкости или получить состояние Лежащий.
    - name: "Целостность тела"
      level: 6
      description: |-
        Вы получаете способность исцелять себя. Как Бонусное действие вы можете бросить кость боевых искусств. Вы восстанавливаете количество хитов, равное выпавшему числу + ваш модификатор Мудрости (минимум 1 восстановленный хит).

        Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум один раз), и восстанавливаете все потраченные использования, когда заканчиваете долгий отдых.
    - name: "Стремительный шаг"
      level: 11
      description: |-
        Когда вы совершаете Бонусное действие, отличное от Шага ветра, вы также можете использовать Шаг ветра сразу после этого Бонусного действия.
    - name: "Длань дрожи"
      level: 17
      description: |-
        Вы получаете способность создавать смертельные вибрации в теле противника. Когда вы попадаете по существу безоружным ударом, вы можете потратить 4 очка сосредоточения, чтобы начать эти незаметные вибрации, которые длятся количество дней, равное вашему уровню монаха. Вибрации безвредны, пока вы не совершите действие, чтобы прекратить их. Также, когда вы совершаете действие Атака в свой ход, вы можете отказаться от одной из атак, чтобы прекратить вибрации. Чтобы прекратить их, вы и цель должны находиться на одном плане существования. Когда вы прекращаете их, цель должна совершить спасбросок Телосложения, получая 10d12 урона силовым полем при провале или половину этого урона при успехе.

        Только одно существо одновременно может находиться под действием этого умения. Вы можете прекратить вибрации безвредно (действие не требуется).
