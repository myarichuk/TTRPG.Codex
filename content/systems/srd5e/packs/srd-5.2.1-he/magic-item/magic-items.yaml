- id: adamantine-armor
  name: שריון אדמנטיום
  description: |-
    שריון (כל בינוני או כבד, פרט לשריון עור)

    השריון הזה מחוזק באדמנטיום, אחד החומרים הקשים ביותר שקיימים. כשאתה לובש אותו, כל פגיעה קריטית נגדך הופכת לפגיעה רגילה.
- id: ammunition
  name: תחמושת קסומה
  description: |-
    נשק (כל תחמושת)

    יש לך בונוס לגלגולי התקפה ולגלגולי נזק שנעשים עם פיסת התחמושת הקסומה הזאת. הבונוס נקבע לפי נדירות התחמושת. ברגע שהיא פוגעת ביעד, התחמושת מפסיקה להיות קסומה.

    את התחמושת הזאת מוצאים או מוכרים בדרך כלל בכמויות של עשר או עשרים פיסות. עשר פיסות ממנה שוות בערכן לשיקוי בנדירות זהה.
- id: ammunition-of-slaying
  name: תחמושת קטלנית
  description: |-
    נשק (כל תחמושת)

    התחמושת הקסומה הזאת נועדה להרוג יצורים מסוג מסוים, שאותו בוחר שליט המבוך או קובע אקראית בהטלה על הטבלה שלהלן. אם יצור מהסוג הזה סופג נזק מהתחמושת, הוא מבצע זריקת הצלה בחוסן בדרגת קושי 17, וסופג 6d10 נזק כוח קסום נוסף בכישלון או מחצית מהנזק הנוסף בהצלחה.

    אחרי שהתחמושת גרמה את הנזק הנוסף שלה ליצור, היא הופכת ללא קסומה.

    | 1d100 | סוג יצור |

    |---|---|

    | 01-10 | שיקוצים |

    | 11-15 | חיות |

    | 16-20 | יצורי מרום |

    | 21-25 | יצירי כפיים |

    | 26-35 | דרקונים |

    | 36-45 | יסודנים |

    | 46-50 | דמויי אדם |

    | 51-60 | יצורי פייה |

    | 61-70 | בני-תופת |

    | 71-75 | ענקים |

    | 76-80 | תפלצים |

    | 81-85 | רפשים |

    | 86-90 | צמחים |

    | 91-00 | אל-מתים |
- id: amulet-of-health
  name: קמע הבריאות
  description: |-
    חפץ פלאי

    החוסן שלך הוא 19 כל עוד אתה עונד את הקמע הזה. אין לו השפעה עליך אם החוסן שלך הוא 19 או יותר גם בלעדיו.
- id: amulet-of-proof-against-detection-and-location
  name: קמע ההגנה מפני גילוי ואיתור
  description: |-
    חפץ פלאי

    כשאתה עונד את הקמע הזה, אי אפשר לבחור בך כיעד של לחשי חיזוי או לתפוס אותך דרך חיישני צפייה קסומים, אלא אם כן אתה מתיר זאת.
- id: amulet-of-the-planes
  name: קמע המישורים
  description: |-
    חפץ פלאי

    כשאתה עונד את הקמע הזה, אתה יכול לבצע פעולת קסם כדי לנקוב במקום המוכר לך במישור קיום אחר. לאחר מכן בצע בדיקת תבונה (מאגיה) בדרגת קושי 15. אם הבדיקה מצליחה, אתה מטיל את *מעבר מישורי*. אם הבדיקה נכשלת, אתה וכל יצור וחפץ בטווח 15 רגל ממך עוברים ליעד אקראי שנקבע בהטלת 1d100 והתייעצות עם הטבלה הבאה.

    | 1d100 | יעד |

    |---|---|

    | 01–60 | מקום אקראי במישור שנקבת בשמו |

    | 61–70 | מקום אקראי במישור פנימי שנקבע בהטלת 1d6: ב-**1,** מישור האוויר; ב-**2,** מישור האדמה; ב-**3,** מישור האש; ב-**4,** מישור המים; ב-**5,** ארץ הפייה; ב-**6,** ארץ הצללים |

    | 71–80 | מקום אקראי במישור חיצוני שנקבע בהטלת 1d8: ב-**1,** ארבוריאה; ב-**2,** ארקדיה; ב-**3,** ארץ החיות; ב-**4,** ביטופיה; ב-**5,** אליסיום; ב-**6,** מכאנוס; ב-**7,** הר סלסטיה; ב-**8,** יסגרד |

    | 81–90 | מקום אקראי במישור חיצוני שנקבע בהטלת 1d8: ב-**1,** התהום; ב-**2,** אכרון; ב-**3,** קרצרי; ב-**4,** גהנום; ב-**5,** הייד; ב-**6,** לימבו; ב-**7,** תשעת הגיהנום; ב-**8,** פנדמוניום |

    | 91–00 | מקום אקראי במישור האסטרלי |
- id: animated-shield
  name: מגן מונפש
  description: |-
    שריון (מגן)

    כשאתה מחזיק במגן הזה, אתה יכול לבצע פעולה נוספת כדי לגרום לו להתעורר לחיים. המגן זוקר את עצמו לאוויר ומרחף במשבצת שלך כדי להגן עליך כאילו אתה אוחז בו, וידיך נשארות פנויות. המגן נשאר מונפש למשך 1 דקה, עד שאתה מבצע פעולה נוספת כדי לסיים את ההשפעה, או עד שאתה מת או נעשה חסר יכולת פעולה. אז המגן נופל לארץ או אל ידך, אם יש לך יד פנויה.
- id: apparatus-of-the-crab
  name: מנגנון הסרטן
  description: |-
    חפץ פלאי

    בתחילה החפץ הזה נראה כחבית ברזל אטומה במשקל 500 פאונד. בחבית יש תפס נסתר, שאפשר למצוא בבדיקת תבונה (חקירה) מוצלחת בדרגת קושי 20. שחרור התפס פותח פתח בקצה אחד של החבית, ומאפשר לשני יצורים בינוניים או קטנים ממנו לזחול פנימה. בקצה הרחוק מסודרים בשורה עשרה מנופים, כל אחד במצב ניטרלי, ואפשר להזיז אותו למעלה או למטה. כשמפעילים מנופים מסוימים, המנגנון משנה צורה ונעשה דומה ללובסטר ענק.

    *מנגנון הסרטן* הוא חפץ גדול עם הנתונים הבאים: דרגת שריון 20; נקודות חיים 200; מהירות 30 רגל, שחייה 30 רגל (או 0 רגל בשתיהן אם הרגליים לא הושטו); חסינות לנזק רעל ולנזק נפשי.

    כדי להשתמש בו ככלי רכב, המנגנון דורש טייס אחד. כשפתח המנגנון סגור, התא אטום לאוויר ולמים. בתא יש אוויר מספיק ל-10 שעות נשימה, מחולק במספר היצורים הנושמים בפנים.

    המנגנון צף על המים. הוא יכול גם לצלול מתחת למים עד עומק 900 רגל. מתחת לעומק הזה כלי הרכב סופג 2d6 נזק מוחץ בכל דקה מהלחץ.

    יצור בתא יכול לבצע פעולת שימוש כדי להזיז עד שניים ממנופי המנגנון למעלה או למטה. אחרי כל שימוש המנוף חוזר למצבו הניטרלי. כל מנוף, משמאל לימין, פועל כפי שמוצג בטבלת מנופי מנגנון הסרטן.

    טבלה: מנופי מנגנון הסרטן

    | מנוף | למעלה | למטה |

    |---|---|---|

    | 1 | הרגליים נפרשות, ומאפשרות למנגנון ללכת ולשחות. | הרגליים מתקפלות, מורידות את המהירות ואת מהירות השחייה של המנגנון ל-0 ומונעות ממנו ליהנות מבונוסים למהירות. |

    | 2 | תריס החלון הקדמי נפתח. | תריס החלון הקדמי נסגר. |

    | 3 | תריסי החלונות בצדדים נפתחים (שניים בכל צד). | תריסי החלונות בצדדים נסגרים (שניים בכל צד). |

    | 4 | שתי צבתות נפרשות מהצד הקדמי של המנגנון. | הצבתות מתקפלות. |

    | 5 | כל צבת שנפרשה מבצעת את התקפת הקרב פנים אל פנים הבאה: +8 לפגיעה, הישג 5 רגל. *פגיעה:* 7 (2d6) נזק מוחץ. | כל צבת שנפרשה מבצעת את התקפת הקרב פנים אל פנים הבאה: +8 לפגיעה, הישג 5 רגל. *פגיעה:* על היעד חל המצב אחוז (דרגת קושי לחילוץ 15). |

    | 6 | המנגנון הולך או שוחה קדימה, בתנאי שרגליו הושטו. | המנגנון הולך או שוחה אחורה, בתנאי שרגליו הושטו. |

    | 7 | המנגנון מסתובב 90 מעלות נגד כיוון השעון, בתנאי שרגליו הושטו. | המנגנון מסתובב 90 מעלות עם כיוון השעון, בתנאי שרגליו הושטו. |

    | 8 | מתקנים דמויי עיניים פולטים אור בהיר ברדיוס 30 רגל ואור עמום ל-30 רגל נוספות. | האור כבה. |

    | 9 | המנגנון שוקע עד 20 רגל אם הוא בנוזל. | המנגנון עולה עד 20 רגל אם הוא בנוזל. |

    | 10 | הפתח האחורי נפתח ומשתחרר מהאטימה. | הפתח האחורי נסגר ונאטם. |
- id: armor
  name: שריון קסום
  description: |-
    שריון (כל קל, בינוני או כבד)

    יש לך בונוס לדרגת שריון כשאתה לובש את השריון הזה. הבונוס נקבע לפי הנדירות שלו.
- id: armor-of-invulnerability
  name: שריון אי-פגיעות
  description: |-
    שריון (שריון לוחות)

    יש לך עמידות לנזק מוחץ, דוקר וחותך כשאתה לובש את השריון הזה.

    קליפת מתכת. אתה יכול לבצע פעולת קסם כדי להעניק לעצמך חסינות לנזק מוחץ, דוקר וחותך למשך 10 דקות או עד שאינך לובש עוד את השריון. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: armor-of-resistance
  name: שריון עמידות
  description: |-
    שריון (כל קל, בינוני או כבד)

    כשאתה לובש את השריון הזה, יש לך עמידות לסוג אחד של נזק. שליט המבוך בוחר את הסוג או קובע אותו אקראית בהטלה על הטבלה שלהלן.

    | 1d10 | סוג נזק |

    |---|---|

    | 1 | חומצה |

    | 2 | קור |

    | 3 | אש |

    | 4 | כוח קסום |

    | 5 | ברק |

    | 6 | נקרוטי |

    | 7 | רעל |

    | 8 | נפשי |

    | 9 | קורן |

    | 10 | רעם |
- id: armor-of-vulnerability
  name: שריון רגישות
  description: |-
    שריון (כל קל, בינוני או כבד)

    כשאתה לובש את השריון הזה, יש לך עמידות לאחד מסוגי הנזק הבאים: מוחץ, דוקר או חותך. שליט המבוך בוחר את הסוג או קובע אותו אקראית.

    קללה. השריון הזה מקולל, עובדה שמתגלה רק כשמטילים עליו את הלחש זיהוי או כשאתה מתאים את עצמך אליו. ההתאמה לשריון מקללת אותך עד שמטילים עליך את הלחש הסרת קללה או קסם דומה; הסרת השריון אינה מסיימת את הקללה. כל עוד אתה מקולל, יש לך רגישות לשניים משלושת סוגי הנזק הקשורים לשריון (לא לסוג שהוא מעניק לו עמידות).
- id: arrow-catching-shield
  name: מגן לוכד חיצים
  description: |-
    שריון (מגן)

    אתה מקבל בונוס של 2+ לדרגת שריון נגד גלגולי התקפה מרחוק כל עוד אתה אוחז במגן הזה. הבונוס הזה נוסף לבונוס הרגיל של המגן לדרגת שריון.

    בכל פעם שתוקף מבצע גלגול התקפה מרחוק נגד יעד שנמצא במרחק של עד 5 רגל ממך, אתה יכול לבצע פעולת תגובה כדי להפוך בעצמך ליעד של ההתקפה.
- id: bag-of-beans
  name: שק שעועית
  description: |-
    חפץ פלאי

    שק הבד הכבד הזה מכיל 3d4 גרעיני שעועית יבשים כשמוצאים אותו. השק שוקל חצי פאונד בלי קשר לכמות השעועית שבו, והופך לחפץ לא קסום כשאין בו עוד שעועית.

    אם אתה מרוקן מהשק גרעין שעועית אחד או יותר, הם מתפוצצים בכדור ברדיוס של 10 רגל שמרכזו בהם. כל הגרעינים שרוקנו נהרסים בפיצוץ, וכל יצור בכדור, כולל אתה, מבצע זריקת הצלה בזריזות בדרגת קושי 15, וסופג 5d4 נזק כוח קסום בכישלון או מחצית מהנזק בהצלחה.

    אם אתה מוציא גרעין שעועית מהשק, נוטע אותו באדמה או בחול ומשקה אותו, הגרעין נעלם ו-1 דקה מאוחר יותר מופיעה תוצאה מהאדמה שבה ניטע. שליט המבוך יכול לבחור תוצאה מהטבלה שלהלן או לקבוע אותה אקראית.

    | 1d100 | תוצאה |

    |---|---|

    | 01 | 5d4 פטריות רעל צומחות. אם יצור אוכל פטרייה, הטל קוביה כלשהי. בתוצאה אי-זוגית, האוכל חייב להצליח בזריקת הצלה בחוסן בדרגת קושי 15, או לסבול 5d6 נזק רעל ולקבל את המצב מורעל למשך 1 שעה. בתוצאה זוגית, האוכל מקבל 5d6 נקודות חיים זמניות למשך 1 שעה. |

    | 02–10 | גייזר פורץ ומתיז מים, בירה, מיונז, תה, חומץ, יין או שמן (לבחירת שליט המבוך) לגובה 30 רגל באוויר למשך 1d4 דקות. |

    | 11–20 | **טרנט** צומח. הטל קוביה כלשהי. בתוצאה אי-זוגית, הטרנט רע וכאוטי. בתוצאה זוגית, הטרנט טוב וכאוטי. |

    | 21–30 | פסל אבן מונפש אך חסר תנועה בדמותך עולה מן האדמה ומשמיע נגדך איומים בעל פה. אם אתה עוזב אותו ואחרים מתקרבים, הוא מתאר אותך כנבל הנתעב ביותר ומורה לבאים לחפש אותך ולתקוף אותך. אם אתה נמצא באותו מישור קיום כמו הפסל, הוא יודע היכן אתה. הפסל הופך לדומם אחרי 24 שעות. |

    | 31–40 | מדורה בלהבות ירוקות מזנקת ובוערת במשך 24 שעות או עד שמכבים אותה. |

    | 41–50 | שלוש **פטריות צווחניות** צומחות. |

    | 51–60 | 1d4 + 4 קרפדות ורודות זוהרות זוחלות החוצה. בכל פעם שנוגעים בקרפדה, היא הופכת למפלצת בגודל גדול או קטן יותר לבחירת שליט המבוך, הפועלת בהתאם לנטייתה ולטבעה. המפלצת נשארת 1 דקה, ואז נעלמת בענן עשן ורוד זוהר. |

    | 61–70 | **בולט** רעב חופר את דרכו מעלה ותוקף. |

    | 71–80 | עץ פרי צומח. יש עליו 1d10 + 20 פירות, ו-1d8 מהם פועלים כשיקויים שנקבעו אקראית. העץ נעלם אחרי 1 שעה. פירות שנקטפו נשארים, ושומרים על הקסם שלהם למשך 30 ימים. |

    | 81–90 | קן של 1d4 + 3 ביצים בצבעי קשת מזנק מהאדמה. כל יצור שאוכל ביצה מבצע זריקת הצלה בחוסן בדרגת קושי 20. בהצלחה, היצור מעלה לצמיתות ב-1 את ערך התכונה הנמוך ביותר שלו, ובוחר אקראית בין ערכים נמוכים באותה מידה. בכישלון, היצור סופג 10d6 נזק כוח קסום מפיצוץ פנימי. |

    | 91–95 | פירמידה בעלת בסיס מרובע של 60 רגל פורצת כלפי מעלה. בתוכה חדר קבורה ובו **מומיה**, **אדון המומיות** או אל-מת אחר לבחירת שליט המבוך. בארון הקבורה שלה יש אוצר לבחירת שליט המבוך. |

    | 96–00 | גבעול שעועית ענק צומח עד לגובה לבחירת שליט המבוך. הקצה העליון מוביל למקום שבו בוחר שליט המבוך, כמו נוף עוצר נשימה, טירה של ענק ענן או מישור קיום אחר. |
- id: bag-of-devouring
  name: שק טורף
  description: |-
    חפץ פלאי

    השק הזה דומה לשק אחסון, אך הוא למעשה פתח האכלה של יצור ענק חוץ-ממדי. הפיכת השק מבפנים החוצה סוגרת את הפתח.

    היצור החוץ-ממדי המחובר לשק חש כל דבר שמניחים בתוכו. חומר מן החי או מן הצומח שמונח כולו בשק נטרף ואובד לנצח. כשחלק מגופו של יצור חי מוכנס לשק, כפי שקורה כשמישהו מכניס יד פנימה, יש סיכוי של 50 אחוז שהיצור נמשך לתוך השק. יצור שנמצא בתוך השק יכול לבצע פעולה כדי לנסות להימלט, וזאת בבדיקת כוח (אתלטיקה) מוצלחת בדרגת קושי 15. יצור אחר יכול לבצע פעולה ולהושיט יד לתוך השק כדי למשוך יצור החוצה, וזאת בבדיקת כוח (אתלטיקה) מוצלחת בדרגת קושי 20, בתנאי שהמושך לא נמשך קודם לתוך השק. כל יצור שמתחיל את תורו בתוך השק נטרף, וגופו נהרס.

    אפשר לאחסן בשק חפצים דוממים, והוא מכיל רגל מעוקבת אחת מחומר כזה. עם זאת, פעם ביום השק בולע כל חפץ שבתוכו ופולט אותו אל מישור קיום אחר. שליט המבוך קובע את הזמן ואת המישור.

    אם השק נדקר או נקרע, הוא נהרס, וכל מה שהיה בתוכו מועבר למקום אקראי במישור האסטרלי.
- id: bag-of-holding
  name: שק אחסון
  description: |-
    חפץ פלאי

    לשק הזה חלל פנימי גדול בהרבה ממידותיו החיצוניות: בערך 2 רגל רבוע ו-4 רגל בעומק מבפנים. השק יכול להכיל עד 500 פאונד, בנפח שאינו עולה על 64 רגל מעוקבת. השק שוקל 5 פאונד, בלי קשר לתכולתו. שליפת חפץ מהשק דורשת פעולת שימוש.

    אם השק עמוס מדי, נדקר או נקרע, הוא נהרס, ותכולתו מתפזרת במישור האסטרלי. אם הופכים את השק מבפנים החוצה, תכולתו נשפכת בלי פגע, אבל צריך להחזיר את השק לצורתו לפני שאפשר להשתמש בו שוב. בשק יש די אוויר לנשימה של 10 דקות, מחולק במספר היצורים הנושמים בתוכו.

    הנחת שק אחסון בתוך חלל חוץ-ממדי שנוצר על ידי ילקוט שימושי, חור נייד או חפץ דומה הורסת מיד את שני החפצים ופותחת שער למישור האסטרלי. השער נפתח במקום שבו הונח חפץ אחד בתוך האחר. כל יצור בכדור ברדיוס של 10 רגל שמרכזו בשער נשאב דרכו למקום אקראי במישור האסטרלי. אחר כך השער נסגר. השער חד-סטרי ואי אפשר לפתוח אותו מחדש.
- id: bag-of-tricks
  name: שק תחבולות
  description: |-
    חפץ פלאי

    השק הזה, העשוי בד אפור, חלוד או חום-בהיר, נראה ריק. אך כשמושיטים יד לתוכו מגלים חפץ קטן ופרוותי.

    אתה יכול לבצע פעולת קסם כדי לשלוף את החפץ הפרוותי מהשק ולזרוק אותו עד מרחק של 20 רגל. כשהחפץ נוחת, הוא הופך ליצור שאתה קובע בהטלה על הטבלה התואמת לצבע השק. את גיליון הנתונים של היצור ראה ב"יצורים". היצור נעלם עם עלות השחר הבאה או כשנקודות החיים שלו יורדות ל-0.

    היצור ידידותי אליך ואל בעלי בריתך, ופועל מיד אחריך בספירת היוזמה שלך. אתה יכול לבצע פעולה נוספת כדי לפקד על אופן תנועת היצור ועל הפעולה שיבצע בתורו הבא, כמו תקיפת אויב. בהיעדר פקודות כאלה, היצור פועל באופן המתאים לטבעו.

    אחרי ששלושה חפצים פרוותיים נשלפו מהשק, אי אפשר להשתמש בו שוב עד עלות השחר הבאה.

    טבלה: שק תחבולות אפור

    | 1d8 | יצור |

    |---|---|

    | 1 | סמור |

    | 2 | חולדה ענקית |

    | 3 | גירית |

    | 4 | חזיר בר |

    | 5 | פנתר |

    | 6 | גירית ענקית |

    | 7 | זאב אימים |

    | 8 | אייל ענק |

    טבלה: שק תחבולות חלוד

    | 1d8 | יצור |

    |---|---|

    | 1 | חולדה |

    | 2 | ינשוף |

    | 3 | מסטיף |

    | 4 | עז |

    | 5 | עז ענקית |

    | 6 | חזיר בר ענק |

    | 7 | אריה |

    | 8 | דוב חום |

    טבלה: שק תחבולות חום-בהיר

