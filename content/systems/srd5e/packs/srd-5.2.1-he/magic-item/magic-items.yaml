    כשאתה פוגע בענק עם הנשק הזה, הענק סופג 2d6 נזק נוסף מסוג הנזק של הנשק, ועליו להצליח בזריקת הצלה של כוח בדרגת קושי 15, אחרת הוא מקבל את המצב שרוע.
- id: glamoured-studded-leather
  name: שריון עור ממוסמר מוסווה
  description: |-
    שריון (שריון עור ממוסמר)

    כל עוד אתה לובש את השריון הזה, אתה מקבל בונוס של +1 לדרגת השריון. בנוסף, אתה יכול לבצע פעולה נוספת כדי לגרום לשריון לקבל מראה של בגדים רגילים או של סוג אחר של שריון. אתה מחליט איך הוא נראה, כולל צבע, סגנון ואביזרים, אבל השריון שומר על נפחו ומשקלו הרגילים. המראה האשלייתי נמשך עד שתשתמש שוב ביכולת הזאת או עד שתחלוץ את השריון.
- id: gloves-of-missile-snaring
  name: כפפות לכידת קליעים
  description: |-
