- id: ring-of-invisibility
  name: טבעת בלתי נראות
  description: |-
    טבעת

    כל עוד אתה עונד את הטבעת הזו, אתה יכול לבצע פעולת קסם כדי לקבל את מצב בלתי נראה. אתה נשאר בלתי נראה עד שהטבעת מוסרת או עד שאתה מבצע פעולה נוספת כדי להפוך שוב לנראה.
- id: ring-of-jumping
  name: טבעת קפיצה
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה יכול להטיל ממנה קפיצה, אך כשאתה עושה זאת אתה יכול לבחור כיעד רק את עצמך.
- id: ring-of-mind-shielding
  name: טבעת מגן תודעה
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה חסין לקסם שמאפשר ליצורים אחרים לקרוא את מחשבותיך, לדעת אם אתה משקר, לדעת מהי נטייתך או לדעת מהו סוג היצור שלך. יצורים יכולים לתקשר איתך בטלפתיה רק אם אתה מרשה זאת.

    אתה יכול לבצע פעולת קסם כדי לגרום לטבעת להפוך לבלתי מורגשת, עד שתבצע פעולת קסם נוספת כדי להפוך אותה למורגשת, עד שתסיר את הטבעת, או עד שתמות.

    אם אתה מת כשאתה עונד את הטבעת, נשמתך נכנסת אליה, אלא אם כן כבר שוכנת בה נשמה. אתה יכול להישאר בטבעת או לצאת לחיים שלאחר המוות. כל עוד נשמתך בטבעת, אתה יכול לתקשר בטלפתיה עם כל יצור שעונד אותה. העונד אינו יכול למנוע את התקשורת הטלפתית הזאת.
- id: ring-of-protection
  name: טבעת הגנה
  description: |-
    טבעת

    אתה מקבל תוסף של +1 לדרגת שריון ולזריקות הצלה כשאתה עונד את הטבעת הזאת.
- id: ring-of-regeneration
  name: טבעת התחדשות
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה מחזיר 1d6 נקודות חיים כל 10 דקות, אם יש לך לפחות 1 נקודת חיים. אם אתה מאבד חלק גוף, הטבעת גורמת לחלק החסר לצמוח מחדש ולחזור לפעולה מלאה אחרי 1d6 + 1 ימים, אם לאורך כל הזמן הזה יש לך לפחות 1 נקודת חיים.
- id: ring-of-resistance
  name: טבעת עמידות
  description: |-
    טבעת

    יש לך עמידות לסוג נזק אחד כשאתה עונד את הטבעת הזאת. אבן החן שבטבעת מציינת את הסוג, ששליט המבוך בוחר או קובע באקראי בהטלה על הטבלה הבאה.

    | 1d10 | סוג נזק | אבן חן |

    |---|---|---|

    | 1 | חומצה | פנינה |

    | 2 | קור | טורמלין |

    | 3 | אש | גרנט |

    | 4 | כוח קסום | ספיר |

    | 5 | ברק | סיטרין |

    | 6 | נקרוטי | גאג׳ט |

    | 7 | רעל | אמטיסט |

    | 8 | נפשי | ירקן |

    | 9 | קורן | טופז |

    | 10 | רעם | ספינל |
- id: ring-of-shooting-stars
  name: טבעת כוכבים נופלים
  description: |-
    טבעת

    אתה יכול להטיל מהטבעת *אורות מרקדים* או *אור*.

    לטבעת יש 6 מטענים, והיא מחזירה 1d6 מטענים שהוצאו מדי יום עם עלות השחר. אתה יכול להוציא את מטעניה כדי להשתמש בתכונות שלהלן.

    **_אש פיות._** אתה יכול להוציא 1 מטען כדי להטיל מהטבעת *אש פיות*.

    **_כדורי ברק._** אתה יכול להוציא 2 מטענים כפעולת קסם כדי ליצור עד ארבעה כדורי ברק בקוטר 3 רגל כל אחד.

    כל כדור מופיע במרחב פנוי שאתה רואה, במרחק של עד 120 רגל ממך. הכדורים נשארים כל עוד אתה שומר על ריכוז, עד 1 דקה. כל כדור פולט אור עמום ברדיוס 30 רגל.

    כפעולה נוספת, אתה יכול להזיז כל כדור עד 30 רגל, אך לא רחוק יותר מ-120 רגל ממך. בפעם הראשונה שכדור מגיע למרחק של עד 5 רגל מיצור אחר מלבדך שאינו מאחורי מחסה מלא, הכדור פולט ברק לעבר היצור ונעלם. היצור מבצע זריקת הצלה בזריזות בדרגת קושי 15. בכישלון, היצור סופג נזק ברק לפי מספר הכדורים שיצרת, כמפורט בטבלה הבאה. בהצלחה, היצור סופג מחצית מהנזק.

    | מספר כדורים | נזק ברק | מספר כדורים | נזק ברק |

    |---|---|---|---|

    | 1 | 4d12 | 3 | 2d6 |

    | 2 | 5d4 | 4 | 2d4 |

    **_כוכבים נופלים._** אתה יכול להוציא 1 עד 3 מטענים כפעולת קסם. על כל מטען שאתה מוציא, אתה משגר מהטבעת גרגיר אור זוהר אל נקודה שאתה רואה, במרחק של עד 60 רגל ממך. כל יצור בקובייה של 15 רגל שמקורה באותה נקודה מתכסה בניצוצות ומבצע זריקת הצלה בזריזות בדרגת קושי 15, וסופג 5d4 נזק קורן בכישלון או מחצית מהנזק בהצלחה.
- id: ring-of-spell-storing
  name: טבעת אגירת לחשים
  description: |-
    טבעת

    הטבעת הזאת אוגרת לחשים שהוטלו לתוכה, ומחזיקה אותם עד שהלובש המותאם משתמש בהם. הטבעת יכולה לאגור עד 5 דרגות של לחשים בכל רגע נתון. כשהיא נמצאת, היא מכילה 1d6 1 דרגות של לחשים אגורים שבחר שליט המבוך.

    כל יצור יכול להטיל לחש מדרגה 1 עד 5 לתוך הטבעת על ידי נגיעה בה בזמן הטלת הלחש. ללחש אין שום השפעה מלבד היאגרותו בטבעת. אם הטבעת אינה יכולה להכיל את הלחש, הלחש מתבזבז ללא השפעה. דרגת התא ששימש להטלת הלחש קובעת כמה מקום הוא תופס.

    כשאתה עונד את הטבעת הזאת, אתה יכול להטיל כל לחש שאגור בה. הלחש משתמש בדרגת התא, בדרגת הקושי להצלה נגד לחשים, בתוסף ההתקפה של לחשים וביכולת הטלת הלחשים של המטיל המקורי, אך בכל שאר ההיבטים הוא נחשב כאילו אתה הטלת אותו. הלחש שהוטל מהטבעת אינו אגור בה עוד, ומקומו מתפנה.
- id: ring-of-spell-turning
  name: טבעת היפוך לחשים
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, יש לך יתרון בזריקות הצלה נגד לחשים. אם אתה מצליח בזריקת ההצלה נגד לחש מדרגה 7 או נמוכה יותר, ללחש אין השפעה עליך. אם הלחש הזה כוון רק אליך ולא יצר אזור השפעה, אתה יכול לבצע פעולת תגובה כדי להסיט את הלחש חזרה אל מטילו; המטיל חייב לבצע זריקת הצלה נגד הלחש בדרגת הקושי להצלה נגד לחשים שלו עצמו.
- id: ring-of-swimming
  name: טבעת שחייה
  description: |-
    טבעת

    יש לך מהירות שחייה של 40 רגל כשאתה עונד את הטבעת הזאת.
- id: ring-of-telekinesis
  name: טבעת טלקינזיס
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה יכול להטיל ממנה טלקינזיס.
- id: ring-of-the-ram
  name: טבעת האיל
  description: |-
    טבעת

    לטבעת הזאת יש 3 מטענים, והיא מחזירה 1d3 מטענים שבוזבזו בכל יום עם עלות השחר. כשאתה עונד את הטבעת, אתה יכול לבצע פעולת קסם ולבזבז 1 עד 3 מטענים כדי לבצע התקפת לחש מטווח נגד יצור אחד שאתה רואה במרחק של עד 60 רגל ממך. הטבעת יוצרת ראש איל רפאים ומבצעת את גלגול ההתקפה שלה עם בונוס של +7. בפגיעה, על כל מטען שאתה מבזבז, המטרה סופגת 2d10 נזק כוח קסום ונדחפת 5 רגל ממך.

    לחלופין, אתה יכול לבזבז 1 עד 3 ממטעני הטבעת בפעולת קסם כדי לנסות לשבור חפץ לא קסום שאתה רואה במרחק של עד 60 רגל ממך ושאיש אינו לובש או נושא. הטבעת מבצעת בדיקת כוח עם בונוס של +5 על כל מטען שאתה מבזבז.
- id: ring-of-three-wishes
  name: טבעת שלוש המשאלות
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה יכול לבזבז 1 מתוך 3 מטעניה כדי להטיל ממנה *משאלה*. הטבעת הופכת ללא קסומה כשאתה משתמש במטען האחרון.
- id: ring-of-warmth
  name: טבעת חמימות
  description: |-
    טבעת

    אם אתה סופג נזק קור כשאתה עונד את הטבעת הזאת, הטבעת מפחיתה ב-2d8 את הנזק שאתה סופג.

    בנוסף, כשאתה עונד את הטבעת הזאת, טמפרטורות של 0 מעלות פרנהייט ומטה אינן פוגעות בך ובכל מה שאתה לובש ונושא.
- id: ring-of-water-walking
  name: טבעת הליכה על מים
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה מטיל ממנה *הליכה על מים*, כשאתה עצמך המטרה היחידה.
- id: ring-of-x-ray-vision
  name: טבעת ראיית רנטגן
  description: |-
    טבעת

    כשאתה עונד את הטבעת הזאת, אתה יכול לבצע פעולת קסם כדי לקבל ראיית רנטגן בטווח של 30 רגל למשך 1 דקה. בעיניך, עצמים מוצקים בתוך הרדיוס הזה נראים שקופים ואינם מונעים מהאור לעבור דרכם. הראייה חודרת עד 1 רגל של אבן, 1 אינץ׳ של מתכת רגילה, או עד 3 רגל של עץ או אדמה. חומרים עבים יותר, או יריעה דקה של עופרת, חוסמים את הראייה.

    בכל פעם שאתה משתמש בטבעת שוב לפני שסיימת מנוחה ארוכה, עליך להצליח בזריקת הצלה בחוסן בדרגת קושי 15, ואם לא, אתה מקבל 1 דרג תשישות.
- id: robe-of-eyes
  name: חלוק עיניים
  description: |-
    חפץ פלאי

    החלוק הזה מעוטר בדוגמאות דמויות עיניים. כשאתה לובש את החלוק, אתה מקבל את היתרונות הבאים: ראייה היקפית. החלוק מעניק לך יתרון בבדיקות חוכמה (הבחנה) שמסתמכות על ראייה. חושים מיוחדים. יש לך ראיית חושך וראיית אמת, שתיהן בטווח של 120 רגל.

    חסרונות. לחש *אור* שמוטל על החלוק, או לחש *אור יום* שמוטל במרחק של עד 5 רגל מהחלוק, גורם לך לקבל את המצב עיוור למשך 1 דקה. בסוף כל תור שלך, אתה מבצע זריקת הצלה בחוסן (דרגת קושי 11 עבור *אור* או דרגת קושי 15 עבור *אור יום*), וההצלחה מסיימת את המצב עליך.
- id: robe-of-scintillating-colors
  name: חלוק צבעים נוצצים
  description: |-
    חפץ פלאי

    לחלוק הזה יש 3 מטענים, והוא מחזיר 1d3 מטענים שבוזבזו בכל יום עם עלות השחר. כשאתה לובש אותו, אתה יכול לבצע פעולת קסם ולבזבז 1 מטען כדי לגרום לבגד להציג דוגמה משתנה של גוונים מסנוורים עד סוף התור הבא שלך. במהלך הזמן הזה, החלוק פולט אור בהיר ברדיוס של 30 רגל ואור עמום ל-30 רגל נוספות, ליצורים שרואים אותך יש חיסרון בגלגולי התקפה נגדך. כל יצור באור הבהיר שרואה אותך ברגע שכוח החלוק מופעל חייב להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, ואם לא, הוא מקבל את המצב המום עד שההשפעה מסתיימת.
- id: robe-of-stars
  name: חלוק הכוכבים
  description: |-
    חפץ פלאי

    החלוק השחור או הכחול-כהה הזה רקום בכוכבים קטנים לבנים או כסופים. אתה מקבל בונוס של +1 לזריקות הצלה כשאתה לובש אותו.

    שישה כוכבים, בחלק העליון של קדמת החלוק, גדולים במיוחד. כשאתה לובש את החלוק הזה, אתה יכול לבצע פעולת קסם כדי להסיר אחד הכוכבים ולבזבז אותו כדי להטיל את הגרסה מדרגה 5 של *טיל קסם*. בכל יום עם רדת הערב, 1d6 כוכבים שהוסרו מופיעים מחדש על החלוק.

    כשאתה לובש את החלוק, אתה יכול לבצע פעולת קסם כדי להיכנס אל המישור האסטרלי יחד עם כל מה שאתה לובש ונושא. אתה נשאר שם עד שאתה מבצע פעולת קסם כדי לחזור אל המישור שבו היית. אתה מופיע מחדש במשבצת האחרונה שתפסת, או, אם היא תפוסה, במשבצת הפנויה הקרובה ביותר.
- id: robe-of-the-archmagi
  name: חלוק הארכי-מאגים
  description: |-
    חפץ פלאי

    הבגד האלגנטי הזה עשוי בד משובח ומעוטר ברונים.

    אתה מקבל את היתרונות האלה כשאתה לובש את החלוק.

    שריון. אם אינך לובש שריון, דרגת השריון הבסיסית שלך היא 15 ועוד מודיפיקטור הזריזות שלך.

    עמידות בפני קסם. יש לך יתרון בזריקות הצלה נגד לחשים והשפעות קסומות אחרות.

    מאגוס לחימה. דרגת הקושי להצלה נגד לחשים שלך ובונוס התקפת הלחש שלך גדלים כל אחד ב-2.
- id: robe-of-useful-items
  name: חלוק פריטים שימושיים
  description: |-
    חפץ פלאי

    על החלוק הזה יש טלאי בד בצורות ובצבעים שונים. כשאתה לובש את החלוק, אתה יכול לבצע פעולת קסם כדי לתלוש אחד הטלאים, וכך להפוך אותו לחפץ או ליצור שהוא מייצג. כשהטלאי האחרון מוסר, החלוק הופך לבגד רגיל.

    בחלוק יש שני טלאים מכל אחד מהסוגים הבאים:

    - פנס זרקור (מלא ודלוק)

    - פגיון

    - מראה

    - מוט

    - חבל (מגולגל)

    - שק

    בנוסף, בחלוק יש 4d4 טלאים אחרים. שליט המבוך בוחר את הטלאים או קובע אותם באקראי בגלגול על הטבלה הבאה.

    | 1d100 | טלאי |

    |---|---|

    | 01–08 | שק עם 100 מ״ז |

    | 09–15 | קופסת כסף (באורך 1 רגל, ברוחב ובעומק 6 אינץ׳) בשווי 500 מ״ז |

    | 16–22 | דלת ברזל (ברוחב של עד 10 רגל ובגובה של עד 10 רגל, עם בריח בצד אחד לבחירתך), שאתה יכול למקם בפתח שאתה מגיע אליו; היא מתאימה את עצמה לפתח, ומתחברת ומתלה את עצמה בו |

    | 23–30 | 10 אבני חן בשווי 100 מ״ז כל אחת |

    | 31–44 | סולם עץ (באורך 24 רגל) |

    | 45–51 | סוס רכיבה עם אוכף רכיבה |

    | 52–59 | בור פתוח (קוביה של 10 רגל), שאתה יכול למקם על הקרקע במרחק של עד 10 רגל ממך |

    | 60–68 | 4 שיקויי ריפוי |

