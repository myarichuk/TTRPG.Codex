    אם נפגעת מגלגול התקפה שנעשה בנשק טווח או בנשק הטלה בעודך לובש את הכפפות האלה, אתה יכול לבצע פעולת תגובה כדי להפחית את הנזק ב-1d10 ועוד מתאם הזריזות שלך, אם יש לך יד פנויה. אם הפחתת את הנזק ל-0, אתה יכול לתפוס את התחמושת או את הנשק אם הם קטנים מספיק כדי שתוכל להחזיק אותם באותה יד.
- id: gloves-of-swimming-and-climbing
  name: כפפות שחייה וטיפוס
  description: |-
    חפץ פלאי

    כל עוד אתה לובש את הכפפות האלה, יש לך מהירות טיפוס ומהירות שחייה השווות למהירות שלך, ואתה מקבל בונוס של +5 לבדיקות כוח (אתלטיקה) שנעשות כדי לטפס או לשחות.
- id: goggles-of-night
  name: משקפי לילה
  description: |-
    חפץ פלאי

    כל עוד אתה לובש את העדשות הכהות האלה, יש לך ראיית חושך בטווח של 60 רגל. אם כבר יש לך ראיית חושך, לבישת המשקפיים מגדילה את הטווח שלה ב-60 רגל.
- id: hammer-of-thunderbolts
  name: פטיש הרעמים
  description: |-
    נשק (אלה פטישית או פטיש קרב)

    אתה מקבל בונוס של +1 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה.

    לנשק יש 5 מטענים. אתה יכול להוציא 1 מטען ולבצע התקפת טווח עם הנשק, תוך שאתה זורק אותו כאילו יש לו תכונת הטלה עם טווח רגיל של 20 רגל וטווח ארוך של 60 רגל. אם ההתקפה פוגעת, הנשק משחרר רעם הנשמע עד מרחק של 300 רגל. המטרה וכל יצור במרחק של עד 30 רגל ממנה, מלבדך, חייבים להצליח בזריקת הצלה של חוסן בדרגת קושי 17, אחרת הם מקבלים את המצב המום עד סוף התור הבא שלך. מיד לאחר שפגע או החטיא, הנשק עף חזרה אל ידך. הנשק משיב 1d4 + 1 מטענים שהוצאו מדי יום עם עלות השחר.

    חורבן ענקים. כל עוד אתה מותאם לנשק ולובש חגורת כוח ענקים או כפפות כוח אוג׳ר שגם אליהן אתה מותאם, אתה מקבל את היתרונות הבאים:חורבן ענקים. כשאתה מגלגל 20 בקובייה d20 בגלגול התקפה שנעשה עם הנשק הזה נגד ענק, היצור חייב להצליח בזריקת הצלה של חוסן בדרגת קושי 17, אחרת הוא מת.עוצמת הענקים. ערך הכוח שחגורת כוח ענקים או כפפות כוח אוג׳ר מעניקות לך עולה ב-4, עד מקסימום של 30.
- id: handy-haversack
  name: תרמיל שימושי
  description: |-
    חפץ פלאי

    לתרמיל הזה יש כיס מרכזי ושני כיסי צד, וכל אחד מהם הוא מרחב חוץ-ממדי. כל כיס צד יכול להכיל עד 200 פאונד של חומרים, בנפח שאינו עולה על 25 רגל מעוקבות. הכיס המרכזי יכול להכיל עד 500 פאונד של חומרים, בנפח שאינו עולה על 64 רגל מעוקבות. התרמיל שוקל תמיד 5 פאונד, ללא קשר לתכולתו.

    שליפת חפץ מהתרמיל דורשת פעולת שימוש או פעולה נוספת (לבחירתך). כשאתה מושיט יד לתרמיל אחר חפץ מסוים, החפץ תמיד נמצא באורח קסום למעלה.

    אם אחד הכיסים עמוס יתר על המידה, נוקב או קרוע, התרמיל נקרע ונהרס. אם התרמיל נהרס, תכולתו אבודה לעד, אף על פי שחפץ עוצמה תמיד צץ שוב באיזשהו מקום. אם התרמיל הופך מבפנים החוצה, תכולתו נשפכת ללא פגע, ויש להחזיר את התרמיל למצבו לפני שאפשר להשתמש בו שוב.

    כל כיס בתרמיל מחזיק די אוויר ל-10 דקות של נשימה, מחולק במספר היצורים הנושמים שבפנים.

    הנחת התרמיל בתוך מרחב חוץ-ממדי שנוצר על ידי שק אחסון, חור נייד או חפץ דומה הורסת מיד את שני החפצים ופותחת שער אל המישור האסטרלי. השער נפתח במקום שבו הונח חפץ אחד בתוך האחר. כל יצור במרחק של עד 10 רגל מהשער, שאינו מאחורי מחסה מלא, נשאב דרכו ומושלך במקום אקראי במישור האסטרלי. לאחר מכן השער נסגר. השער חד-כיווני בלבד ואי אפשר לפתוח אותו מחדש.
- id: hat-of-disguise
  name: כובע הסוואה
  description: |-
    חפץ פלאי

    כל עוד אתה חובש את הכובע הזה, אתה יכול להטיל את הלחש הסוואה עצמית. הלחש מסתיים אם מסירים את הכובע.
- id: headband-of-intellect
  name: סרט תבונה
  description: |-
    חפץ פלאי

    התבונה שלך היא 19 כל עוד אתה עונד את הסרט הזה. אין לו השפעה עליך אם התבונה שלך היא 19 או יותר גם בלעדיו.
- id: helm-of-brilliance
  name: קסדת הזוהר
  description: |-
    חפץ פלאי

    בקסדה זו משובצים 1d10 יהלומים, 2d10 אודמים, 3d10 אופלי אש ו-4d10 אופלים. כל אבן חן שנעקרת מהקסדה מתפוררת לאבק. כשכל האבנים הוסרו או נהרסו, הקסדה מאבדת את קסמה. אתה מקבל את היתרונות הבאים כל עוד אתה חובש את הקסדה.

    אור יהלום. כל עוד יש בקסדה לפחות יהלום אחד, היא פולטת הילה של 30 רגל. כשיש לפחות אל-מת אחד בתוך האזור הזה, ההילה מתמלאת באור עמום. כל אל-מת שמתחיל את תורו באזור הזה סופג 1d6 נזק קורן.

    להבות אופל האש. כל עוד יש בקסדה לפחות אופל אש אחד, אתה יכול לבצע פעולת קסם כדי לגרום לנשק אחד שאתה מחזיק לפרוץ בלהבות. הלהבות פולטות אור בהיר ברדיוס של 10 רגל ואור עמום ב-10 רגל נוספות. הלהבות אינן מזיקות לך ולנשק. כשאתה פוגע בהתקפה בנשק הבוער, המטרה סופגת 1d6 נזק אש נוסף. הלהבות נמשכות עד שאתה מבצע פעולה נוספת כדי לכבות אותן, או עד שאתה מפיל את הנשק או מחביא אותו.

    עמידות האודם. כל עוד יש בקסדה לפחות אודם אחד, יש לך עמידות לנזק אש.

    לחשים. אתה יכול להטיל אחד מהלחשים הבאים (דרגת קושי להצלה 18), תוך שימוש באחת מאבני החן של הקסדה מהסוג המצוין כרכיב: אור יום (אופל), כדור אש (אופל אש), ריסוס מנסרתי (יהלום) או חומת אש (אודם). אבן החן נהרסת כשהלחש מוטל ונעלמת מהקסדה.

    נזק אש. גלגל 1d20 אם אתה חובש את הקסדה וסופג נזק אש כתוצאה מכישלון בזריקת הצלה נגד לחש. בגלגול של 1, הקסדה פולטת קרני אור מאבני החן שנותרו בה, ואז נהרסת. כל יצור בתוך הילה של 60 רגל שמקורה בך חייב להצליח בזריקת הצלה של זריזות בדרגת קושי 17, או שקרן תפגע בו והוא יסבול נזק קורן השווה למספר אבני החן בקסדה.

- id: helm-of-comprehending-languages
  name: קסדת הבנת שפות
  description: |-
    חפץ פלאי

    כשאתה חובש את הקסדה, אתה יכול להטיל ממנה הבנת שפות.

- id: helm-of-telepathy
  name: קסדת טלפתיה
  description: |-
    חפץ פלאי

    כשאתה חובש את הקסדה, יש לך טלפתיה בטווח של 30 רגל, ואתה יכול להטיל ממנה גילוי מחשבות או שידול (דרגת קושי להצלה 13). לאחר שאחד הלחשים הוטל מהקסדה, אי אפשר להטיל אותו ממנה שוב עד עלות השחר הבאה.

- id: helm-of-teleportation
  name: קסדת תעתוק
  description: |-
    חפץ פלאי

    לקסדה יש 3 מטענים. כשאתה חובש אותה, אתה יכול לבזבז 1 מטען כדי להטיל ממנה תעתוק. הקסדה מחזירה 1d3 מטענים שבוזבזו בכל יום עם עלות השחר.

- id: holy-avenger
  name: נוקם קדוש
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    אתה מקבל בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה. כשאתה פוגע בו בבן-תופת או באל-מת, היצור סופג 2d10 נזק קורן נוסף. כל עוד אתה מחזיק את הנשק שלוף, הוא יוצר הילה של 10 רגל שמקורה בך. לך ולכל היצורים הידידותיים אליך בהילה יש יתרון בזריקות הצלה נגד לחשים והשפעות קסומות אחרות. אם יש לך 17 דרגות או יותר במקצוע הפלאדין, גודל ההילה גדל ל-30 רגל.

- id: horn-of-blasting
  name: קרן הפיצוץ
  description: |-
    חפץ פלאי

    אתה יכול לבצע פעולת קסם כדי לתקוע בקרן, והיא פולטת פיצוץ רועם בחרוט של 30 רגל, שנשמע עד מרחק 600 רגל. כל יצור בחרוט מבצע זריקת הצלה של חוסן בדרגת קושי 15. בכישלון, היצור סופג 5d8 נזק רעם ומקבל את המצב חירש למשך 1 דקה. בהצלחה, היצור סופג רק מחצית מהנזק. חפצי זכוכית או גביש בחרוט שאינם לבושים או נישאים סופגים 10d8 נזק רעם.

    בכל שימוש בקסם הקרן יש סיכוי של 20 אחוז שהקרן תתפוצץ. הפיצוץ גורם למשתמש 10d6 נזק כוח קסום והורס את הקרן.

- id: horn-of-valhalla
  name: קרן ולהאלה
  description: |-
    חפץ פלאי

    אתה יכול לבצע פעולת קסם כדי לתקוע בקרן. בתגובה, רוחות לוחמים מהמישור יסגרד מופיעות במרחבים פנויים בטווח 60 רגל ממך. כל רוח משתמשת בנתוני היצור של **ברסרקר** וחוזרת ליסגרד לאחר 1 שעה או כשהיא יורדת ל-0 נקודות חיים. הרוחות נראות כלוחמים חיים ונושמים, ויש להן חסינות למצבים מוקסם ומבוהל. לאחר שהשתמשת בקרן, אי אפשר להשתמש בה שוב עד שיעברו 7 ימים.

    ידועים ארבעה סוגים של *קרן ולהאלה*, כל אחד עשוי מתכת אחרת. סוג הקרן קובע כמה רוחות היא מזמנת, וכן את תנאי השימוש בה. שליט המבוך בוחר את סוג הקרן או קובע אותו באקראי בגלגול בטבלה הבאה.

    אם אתה תוקע בקרן מבלי לעמוד בתנאי השימוש בה, הרוחות המוזמנות תוקפות אותך. אם אתה עומד בתנאי, הן ידידותיות אליך ואל בעלי בריתך ומצייתות לפקודותיך.

    | 1d100 | סוג הקרן | רוחות | תנאי |

    |---|---|---|---|

    | 01–40 | כסף | 2 | אין |

    | 41–75 | פליז | 3 | מיומנות בכל הנשקים הפשוטים |

    | 76–90 | ארד | 4 | אימון בכל השריונות הבינוניים |

    | 91–00 | ברזל | 5 | מיומנות בכל נשקי הלחימה |

- id: horseshoes-of-a-zephyr
  name: פרסות הזפיר
  description: |-
    חפץ פלאי

    הפרסות האלה מגיעות בסט של ארבע. כפעולת קסם, אתה יכול לגעת באחת הפרסות בפרסה של סוס או של יצור דומה, ואז הפרסה מצמידה את עצמה לפרסה. גם הסרת פרסה דורשת פעולת קסם.

    כל עוד ארבע הפרסות מוצמדות לפרסות של סוס או של יצור דומה, הן מאפשרות ליצור לנוע כרגיל תוך כדי ריחוף 4 אינצ׳ים מעל משטח. האפקט הזה מאפשר ליצור לחצות משטחים לא מוצקים או לא יציבים, כמו מים או לבה, או לעמוד מעליהם. היצור אינו משאיר עקבות ומתעלם מתוואי שטח קשה. בנוסף, היצור יכול לנסוע עד 12 שעות ביום מבלי לצבור דרגות תשישות מנסיעה ממושכת.

- id: horseshoes-of-speed
  name: פרסות המהירות
  description: |-
    חפץ פלאי

    הפרסות האלה מגיעות בסט של ארבע. כפעולת קסם, אתה יכול לגעת באחת הפרסות בפרסה של סוס או של יצור דומה, ואז הפרסה מצמידה את עצמה לפרסה. גם הסרת פרסה דורשת פעולת קסם.

    כל עוד ארבע הפרסות מחוברות לאותו יצור, המהירות שלו גדלה ב-30 רגל.

- id: immovable-rod
  name: מטה קצר בלתי נע
  description: |-
    מטה קצר

    למטה הברזל הזה יש כפתור בקצהו האחד. אתה יכול לבצע פעולת שימוש כדי ללחוץ על הכפתור, וכך המטה מתקבע בקסם במקומו. עד שאתה או יצור אחר מבצע פעולת שימוש כדי ללחוץ על הכפתור שוב, המטה אינו זז, גם אם הוא מתריס נגד כוח הכבידה. המטה יכול לשאת משקל של עד 8,000 פאונד. משקל רב מזה גורם למטה להפסיק לפעול ולנפול. יצור יכול לבצע פעולת שימוש כדי לבצע בדיקת כוח (אתלטיקה) בדרגת קושי 30, ובהצלחה הוא מזיז את המטה המקובע עד 10 רגל.
- id: instant-fortress
  name: מבצר מיידי
  description: |-
    חפץ פלאי

    בפעולת קסם אתה יכול להניח את פסלון האדמנטיום הזה, שגובהו 1 אינץ׳, על הקרקע ולגרום לו, באמצעות מילת פקודה, לצמוח במהירות למגדל אדמנטיום מרובע. אמירה חוזרת של מילת הפקודה גורמת למגדל לחזור לצורת פסלון, וזה עובד רק אם המגדל ריק. כל יצור בשטח שבו מופיע המגדל נדחף למשבצת פנויה מחוץ למגדל, בסמוך אליו. גם חפצים בשטח שאינם לבושים או נישאים נדחפים הרחק מהמגדל.

    המגדל הוא באורך 20 רגל בכל צלע ובגובה 30 רגל, עם חרכי ירי בכל הצדדים וביצורי קרב בראשו. פנימו מחולק לשתי קומות, המחוברות בסולם, בגרם מדרגות או בשיפוע (לבחירתך). הסולם, גרם המדרגות או השיפוע מסתיימים בדלת מלכודת המובילה לגג. עם יצירתו יש למגדל דלת אחת בגובה הקרקע, בצד הפונה אליך. הדלת נפתחת רק בפקודתך, שאותה אתה יכול לתת בפעולה נוספת. היא חסינה ללחש דפיקה ולקסם דומה.

    קסם מונע מהמגדל להתהפך. לגג, לדלת ולכל אחד מהקירות יש דרגת שריון 20; נקודות חיים 100; חסינות לנזק מוחץ, דוקר וחותך, פרט לנזק שגורם ציוד מצור; ועמידות לכל שאר הנזק. כיווץ המגדל חזרה לצורת פסלון אינו מתקן את הנזק שנגרם לו. רק הלחש משאלה יכול לתקן את המגדל (שימוש זה בלחש נחשב לשכפול לחש מדרגה 8 או נמוכה יותר). כל הטלה של משאלה גורמת למגדל להחזיר לעצמו את כל נקודות החיים שלו.

- id: ioun-stone
  name: אבן יון
  description: |-
    חפץ פלאי

    אבני יון, שגודלן בערך כגודל גולת זכוכית, נקראות על שמו של יון, אל הידע והנבואה הנערץ בעולמות מסוימים. קיימים סוגים רבים של אבני יון, וכל סוג הוא שילוב ייחודי של צורה וצבע.

    כשאתה מבצע פעולת קסם כדי לזרוק אבן יון לאוויר, האבן מקיפה את ראשך במרחק 1d3 רגל ומעניקה לך את יתרונה כל עוד היא עושה זאת. אתה יכול להחזיק עד שלוש אבני יון המקיפות את ראשך בו-זמנית.

    כל אבן יון המקיפה את ראשך נחשבת לחפץ שאתה לובש. האבן המקיפה נמנעת ממגע עם יצורים וחפצים אחרים, מכווננת את מסלולה כדי להימנע מהתנגשויות ומסכלת כל ניסיון של יצורים אחרים לתקוף אותה או לחטוף אותה.

    בפעולת שימוש אתה יכול לתפוס ולהחביא כל מספר של אבני יון המקיפות את ראשך. אם ההתאמה שלך לאבן יון מסתיימת בזמן שהיא מקיפה את ראשך, האבן נופלת כאילו הפלת אותה.

    סוג האבן קובע את נדירותה ואת השפעותיה.

    בליעה (נדיר מאוד). כל עוד האליפסואיד הזה בצבע לבנדר חיוור מקיף את ראשך, אתה יכול לבצע פעולת תגובה כדי לבטל לחש מדרגה 4 או נמוכה יותר שהטיל יצור שאתה רואה. לחש מבוטל אינו משפיע, וכל המשאבים ששימשו להטלתו מבוזבזים. לאחר שהאבן ביטלה 20 דרגות של לחשים, היא נשרפת, הופכת אפורה וקהה ומאבדת את קסמה.

    זריזות (נדיר מאוד). הזריזות שלך עולה ב-2, עד למקסימום 20, כל עוד הכדור האדום עמוק הזה מקיף את ראשך.

    מודעות (נדיר). כל עוד המעויין הכחול כהה הזה מקיף את ראשך, יש לך יתרון בגלגולי יוזמה ובבדיקות חוכמה (הבחנה).

    עמידות (נדיר מאוד). החוסן שלך עולה ב-2, עד למקסימום 20, כל עוד המעויין הוורוד הזה מקיף את ראשך.

    בליעה מעולה (אגדי). כל עוד האליפסואיד המנוקד בלבנדר וירוק הזה מקיף את ראשך, אתה יכול לבצע פעולת תגובה כדי לבטל לחש מדרגה 8 או נמוכה יותר שהטיל יצור שאתה רואה. לחש מבוטל אינו משפיע, וכל המשאבים ששימשו להטלתו מבוזבזים. לאחר שהאבן ביטלה 20 דרגות של לחשים, היא נשרפת, הופכת אפורה וקהה ומאבדת את קסמה.

    תובנה (נדיר מאוד). החוכמה שלך עולה ב-2, עד למקסימום 20, כל עוד הכדור הכחול הלוהט הזה מקיף את ראשך.

    שכל (נדיר מאוד). התבונה שלך עולה ב-2, עד למקסימום 20, כל עוד הכדור המנוקד בארגמן וכחול הזה מקיף את ראשך.

    מנהיגות (נדיר מאוד). הכריזמה שלך עולה ב-2, עד למקסימום 20, כל עוד הכדור המנוקד בוורוד וירוק הזה מקיף את ראשך.

    שליטה מושלמת (אגדי). תוסף השליטה שלך עולה ב-1 כל עוד המנסרה הירוקה חיוורת הזאת מקיפה את ראשך.

    הגנה (נדיר). אתה מקבל תוסף של +1 לדרגת שריון כל עוד המנסרה בצבע ורד מאובק הזאת מקיפה את ראשך.

    התחדשות (אגדי). אתה מחזיר לעצמך 15 נקודות חיים בסוף כל שעה שבה הציר הלבן כמרגנית הזה מקיף את ראשך, אם יש לך לפחות 1 נקודת חיים.

    מאגר (נדיר). המנסרה הסגולה התוססת הזאת אוגרת לחשים שהוטלו לתוכה ושומרת אותם עד שתשתמש בהם. האבן יכולה לאגור עד 4 דרגות של לחשים בכל פעם. כשמוצאים אותה, היא מכילה 1d4 דרגות של לחשים אגורים לבחירת שליט המבוך.

    כל יצור יכול להטיל לחש מדרגה 1 עד 4 לתוך האבן על ידי נגיעה בה בזמן הטלת הלחש. ללחש אין השפעה מלבד היאגרות באבן. אם האבן אינה יכולה להכיל את הלחש, הלחש מתבזבז ללא השפעה. דרגת התא ששימש להטלת הלחש קובעת כמה מקום הוא תופס.

    כל עוד האבן הזאת מקיפה את ראשך, אתה יכול להטיל כל לחש האגור בה. הלחש משתמש בדרגת התא, בדרגת הקושי להצלה נגד לחשים, בתוסף ההתקפה של לחשים וביכולת הטלת הלחשים של המטיל המקורי, אך בשאר המובנים הוא מטופל כאילו הטלת אותו בעצמך. הלחש שהוטל מן האבן אינו אגור בה עוד, ובכך מתפנה מקום.

    כוח (נדיר מאוד). הכוח שלך עולה ב-2, עד למקסימום 20, כל עוד המעויין הכחול חיוור הזה מקיף את ראשך.

    מזון (נדיר). אינך צריך לאכול או לשתות כל עוד הציר השקוף הזה מקיף את ראשך.

- id: iron-bands
  name: רצועות ברזל
  description: |-
    חפץ פלאי

    כדור הברזל החלוד הזה הוא בקוטר 3 אינץ׳ ושוקל 1 פאונד. אתה יכול לבצע פעולת קסם כדי לזרוק את הכדור על יצור עצום או קטן ממנו שאתה רואה במרחק של עד 60 רגל ממך. בעוד הכדור חולף באוויר, הוא נפתח לסבך של רצועות מתכת.

    בצע גלגול התקפה מרחוק עם תוסף התקפה השווה למתאם הזריזות שלך ועוד תוסף השליטה שלך. בפגיעה, המטרה מרוסנת עד שתבצע פעולה נוספת כדי לתת פקודה המשחררת אותה. עשיית כן, או החטאה בהתקפה, גורמת לרצועות להתכווץ ולהפוך שוב לכדור.

    יצור שיכול לגעת ברצועות, ובכלל זה היצור המרוסן, יכול לבצע פעולה כדי לבצע בדיקת כוח (אתלטיקה) בדרגת קושי 20 ולשבור את רצועות הברזל. בהצלחה בבדיקה, החפץ נהרס והיצור המרוסן משתחרר. בכישלון בבדיקה, כל ניסיון נוסף של אותו יצור נכשל אוטומטית עד שיחלפו 24 שעות.

    משהשתמשת ברצועות, אי אפשר להשתמש בהן שוב עד הזריחה הבאה.

- id: iron-flask
  name: צלוחית ברזל
  description: |-
    חפץ פלאי

    כשאתה אוחז בצלוחית הברזל הזאת שפקקה מפליז, אתה יכול לבצע פעולת קסם כדי לכוון על יצור שאתה רואה במרחק של עד 60 רגל ממך. אם הצלוחית ריקה והמטרה ילידת מישור קיום שאינו זה שבו אתה נמצא, על המטרה להצליח בזריקת הצלה בחוכמה בדרגת קושי 17, שאם לא כן היא לכודה בצלוחית. אם המטרה כבר נלכדה בצלוחית בעבר, יש לה יתרון בהצלה. משנלכד, יצור נשאר בצלוחית עד שישוחרר. הצלוחית יכולה להכיל יצור אחד בלבד בכל זמן נתון. יצור הלכוד בצלוחית אינו מזדקן ואינו צריך לנשום, לאכול או לשתות.

    אתה יכול לבצע פעולת קסם כדי להסיר את פקק הצלוחית ולשחרר את היצור שבתוכה. היצור ממלא אז את פקודותיך במשך 1 שעה, ומבין אותן גם אם אינו מכיר את השפה שבה ניתנו. אם אינך נותן פקודות, או אם אתה נותן ליצור פקודה שצפויה להביא למותו או לכליאתו, הוא מגן על עצמו אך אינו נוקט פעולות אחרות. בתום המשך, היצור פועל בהתאם לנטייתו ולהתאמתו הרגילות.

    הלחש זיהוי מגלה אם הצלוחית מכילה יצור, אך הדרך היחידה לקבוע את סוג היצור היא לפתוח את הצלוחית. צלוחית ברזל שהתגלתה זה עתה עשויה כבר להכיל יצור שבחר שליט המבוך.

- id: javelin-of-lightning
  name: כידון הברק
  description: |-
    נשק (כידון)

    בכל פעם שאתה מבצע גלגול התקפה בנשק קסום זה ופוגע, אתה יכול לגרום לו לגרום נזק ברק במקום נזק דוקר.

    בליסת ברק. כשאתה מטיל את הנשק הזה על מטרה במרחק של עד 120 רגל ממך, אתה יכול לוותר על גלגול התקפה מרחוק ובמקום זאת להפוך את הנשק לבליסת ברק. הבליסה יוצרת קו ברוחב 5 רגל בינך לבין המטרה. המטרה וכל יצור אחר בקו (פרט לך) מבצעים זריקת הצלה בזריזות בדרגת קושי 13, וסופגים 4d6 נזק ברק בכישלון או מחצית מהנזק בהצלחה. מיד לאחר גרימת הנזק הזה, הנשק מופיע שוב בידך. אי אפשר להשתמש בתכונה זו שוב עד הזריחה הבאה.

- id: lantern-of-revealing
  name: פנס הגילוי
  description: |-
    חפץ פלאי

    כל עוד הוא דולק, הפנס הזה בעל המכסה בוער במשך 6 שעות על 1 פינט של שמן, ומפיץ אור בהיר ברדיוס 30 רגל ואור עמום ל-30 רגל נוספות. יצורים וחפצים בלתי נראים נראים כל עוד הם נמצאים באור הבהיר של הפנס. אתה יכול לבצע פעולת שימוש כדי להוריד את המכסה, ובכך להפחית את אור הפנס לאור עמום ברדיוס 5 רגל.

- id: luck-blade
  name: להב המזל
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה, רפירה, חרב עקומה, מגל או חרב קצרה)

    אתה מקבל תוסף של +1 לגלגולי התקפה וגלגולי נזק שנעשים בנשק קסום זה. כל עוד הנשק עליך, אתה מקבל גם תוסף של +1 לזריקות הצלה.

    מזל. אם הנשק עליך, אתה יכול לקרוא למזלו (ללא צורך בפעולה) כדי לגלגל מחדש מבחן D20 שנכשל, אם אינך חסר יכולת פעולה. עליך להשתמש בגלגול השני. משהשתמשת בתכונה, אי אפשר להשתמש בה שוב עד הזריחה הבאה.

    משאלה. לנשק יש 1d3 מטענים. כשאתה אוחז בו, אתה יכול להוציא 1 מטען ולהטיל ממנו את הלחש משאלה. משהשתמשת בתכונה, אי אפשר להשתמש בה שוב עד הזריחה הבאה. הנשק מאבד תכונה זו אם אין לו מטענים.

- id: mace-of-disruption
  name: אלת ברזל הפירוק
  description: |-
    נשק (אלת ברזל)

    כשאתה פוגע בבן-תופת או באל-מת בנשק קסום זה, היצור סופג 2d6 נזק קורן נוסף. אם לאחר שסבל את הנזק הזה נותרו למטרה 25 נקודות חיים או פחות, עליה להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, שאם לא כן היא נהרסת. בהצלחה בהצלה, היצור מבוהל עד סוף תורך הבא.

    אור. כל עוד אתה אוחז בנשק זה, הוא מפיץ אור בהיר ברדיוס 20 רגל ואור עמום ל-20 רגל נוספות.

- id: mace-of-smiting
  name: אלת ברזל ההכאה
  description: |-
    נשק (אלת ברזל)

    אתה מקבל תוסף של +1 לגלגולי התקפה וגלגולי נזק שנעשים בנשק קסום זה. התוסף עולה ל-+3 כשאתה משתמש בנשק כדי לתקוף יציר כפיים.

    כשאתה מגלגל 20 בגלגול התקפה בנשק זה, המטרה סופגת 7 נזק מוחץ נוסף, או 14 נזק מוחץ אם היא יציר כפיים. אם לאחר שסבל את הנזק הזה נותרו ליציר כפיים 25 נקודות חיים או פחות, הוא נהרס.

- id: mace-of-terror
  name: אלת ברזל האימה
  description: |-
    נשק (אלת ברזל)

    לנשק קסום זה יש 3 מטענים, והוא מחזיר 1d3 מטענים שהוצאו מדי יום עם הזריחה. כשאתה אוחז בנשק, אתה יכול לבצע פעולת קסם ולהוציא 1 מטען כדי לשחרר ממנו גל של אימה. כל יצור לבחירתך במרחק של עד 30 רגל ממך חייב להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, שאם לא כן הוא מבוהל למשך 1 דקה. כל עוד הוא מבוהל כך, היצור חייב לנצל את תוריו כדי לנסות להתרחק ממך ככל שיוכל, והוא אינו יכול לבצע התקפות מזדמנות. בפעולתו הוא יכול להשתמש רק בפעולת מאוץ או לנסות להימלט מהשפעה המונעת ממנו לזוז. אם אין לו לאן לזוז, היצור יכול לבצע את פעולת חמיקה. בסוף כל אחד מתוריו, היצור חוזר על הזריקה ומסיים את ההשפעה על עצמו בהצלחה.
- id: mantle-of-spell-resistance
  name: גלימת עמידות בפני לחשים
  description: |-
    חפץ פלאי

    יש לך יתרון בזריקות הצלה נגד לחשים כל עוד אתה לובש גלימה זו.
- id: manual-of-bodily-health
  name: מדריך הבריאות הגופנית
  description: |-
    חפץ פלאי

    ספר זה מכיל עצות בריאות ותזונה, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בפרק זמן של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, החוסן שלך עולה ב-2, עד למקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: manual-of-gainful-exercise
  name: מדריך הכושר המועיל
  description: |-
    חפץ פלאי

    ספר זה מתאר תרגילי כושר, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בפרק זמן של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, הכוח שלך עולה ב-2, עד למקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: manual-of-golems
  name: מדריך הגולמים
  description: |-
    חפץ פלאי

    כרך זה מכיל את המידע והלחשים הדרושים ליצירת סוג מסוים של גולם. שליט המבוך בוחר את הסוג או קובע אותו באקראי בהטלה על הטבלה המצורפת. כדי לפענח את המדריך ולהשתמש בו, עליך להיות מטיל לחשים עם לפחות שתי יחידות לחש מדרגה 5. יצור שאינו יכול להשתמש ב*מדריך הגולמים* ומנסה לקרוא בו סופג 6d6 נזק נפשי.

    כדי ליצור גולם, עליך להקדיש את הזמן המצוין בטבלה, ולעבוד ללא הפסקה כשהמדריך בהישג ידך ולנוח לא יותר מ-8 שעות ביום. עליך גם לשלם את העלות הנקובה לרכישת חומרי גלם.

    משסיימת ליצור את הגולם, הספר נשרף בלהבות על-טבעיות. הגולם מתעורר לחיים כשאפר המדריך מפוזר עליו. את גיליון הנתונים של הגולם ראה ב״מפלצות״. הגולם נתון לשליטתך, מבין את פקודותיך וצייתן להן.

    | 1d20 | גולם | זמן | עלות |

    |---|---|---|---|

    | 1–5 | גולם חימר | 30 ימים | 65,000 מ״ז |

    | 6–17 | גולם בשר | 60 ימים | 50,000 מ״ז |

    | 18 | גולם ברזל | 120 ימים | 100,000 מ״ז |

    | 19–20 | גולם אבן | 90 ימים | 80,000 מ״ז |
- id: manual-of-quickness-of-action
  name: מדריך המהירות והזריזות
  description: |-
    חפץ פלאי

    ספר זה מכיל תרגילי קואורדינציה ושיווי משקל, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בפרק זמן של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, הזריזות שלך עולה ב-2, עד למקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: marvelous-pigments
  name: צבעי פלא
  description: |-
    חפץ פלאי

    קופסת עץ מהודרת זו מכילה 1d4 קדרות צבע ומכחול (במשקל כולל של 1 פאונד).

    בעזרת המכחול והוצאת 1 קדרת צבע, אתה יכול לצייר כל מספר של עצמים תלת-ממדיים ומאפייני תוואי שטח (כמו קירות, דלתות, עצים, פרחים, כלי נשק, קורי עכביש ובורות), כל עוד כל האלמנטים האלה מוכלים בקובייה של 20 רגל. המאמץ אורך 10 דקות (ללא קשר למספר האלמנטים שאתה יוצר), ובמהלכן עליך להישאר בתוך הקובייה, והוא דורש ריכוז. אם הריכוז שלך נשבר או שאתה יוצא מהקובייה לפני סיום העבודה, כל האלמנטים שצויירו נעלמים וקדרת הצבע מתבזבזת.

    בסיום העבודה, כל העצמים ומאפייני תוואי השטח שצויירו הופכים לממשיים. כך, ציור דלת על קיר יוצר דלת אמיתית, שאפשר לפתוח אל מה שמעבר לה. ציור בור יוצר בור אמיתי, שכל עומקו חייב להיות בתוך הקובייה של 20 רגל.

    ערכו של אף עצם שנוצר בידי קדרת צבע אינו יכול לעלות על 25 מ״ז, והערך הכולל של כל העצמים שנוצרו בידי קדרת צבע אחת אינו יכול לעלות על 500 מ״ז. אם אתה מצייר עצמים בעלי ערך גבוה יותר (כמו ערימה גדולה של זהב), הם נראים אותנטיים, אך בבדיקה מקרוב מתברר שהם עשויים מעיסה, עוגיות או חומר אחר חסר ערך.

    אם אתה מצייר צורה של אנרגיה כמו אש או ברק, האנרגיה מתפוגגת ברגע שסיימת את הציור, בלי לגרום נזק.
- id: medallion-of-thoughts
  name: מדליון המחשבות
  description: |-
    חפץ פלאי

    במדליון 5 מטענים. כשאתה עונד אותו, אתה יכול להוציא 1 מטען כדי להטיל ממנו גילוי מחשבות (דרגת קושי להצלה 13). המדליון מחזיר 1d4 מטענים שהוצאו מדי יום עם עלות השחר.
- id: mirror-of-life-trapping
  name: מראת לכידת חיים
  description: |-
    חפץ פלאי

    כשמביטים במראה זו, שגובהה 4 רגל ורוחבה 2 רגל, מבט עקיף, פניה מראים תמונות קלושות של יצורים. המראה שוקלת 50 פאונד, ויש לה דרגת שריון 11, 10 נקודות חיים, חסינות לנזק רעל ולנזק נפשי, ורגישות לנזק מוחץ. היא מתנפצת ונהרסת כשהיא מופחתת ל-0 נקודות חיים.

    אם המראה תלויה על משטח אנכי ואתה בטווח 5 רגל ממנה, אתה יכול לבצע פעולת קסם ולהשתמש במילת פקודה כדי להפעיל אותה. היא נשארת פעילה עד שאתה מבצע פעולת קסם וחוזר על מילת הפקודה כדי לכבות אותה.

    כל יצור מלבדך שרואה את השתקפותו במראה הפעילה בעודו בטווח 30 רגל ממנה חייב להצליח בזריקת הצלה בכריזמה בדרגת קושי 15, או שיילכד, יחד עם כל מה שהוא לובש או נושא, באחד מתריסר התאים החוץ-ממדיים של המראה. יצור שיודע מהי טבעה של המראה זורק את ההצלה ביתרון, ויציר כפיים מצליח בהצלה אוטומטית.

    תא חוץ-ממדי הוא מרחב אינסופי המלא בערפל סמיך שמצמצם את הראות ל-10 רגל. יצורים הלכודים בתאי המראה אינם מזדקנים, ואינם צריכים לאכול, לשתות או לישון. יצור הלכוד בתא יכול להימלט באמצעות קסם המאפשר מעבר מישורי. אחרת, היצור כלוא בתא עד שישוחרר.

    אם המראה לוכדת יצור אך שנים-עשר התאים החוץ-ממדיים שלה כבר תפוסים, המראה משחררת באקראי יצור כלוא אחד כדי לפנות מקום לאסיר החדש. יצור משוחרר מופיע במשבצת פנויה בטווח ראייה מהמראה, אך כשפניו מופנות ממנה. אם המראה מתנפצת, כל היצורים שבתוכה משתחררים ומופיעים במשבצות פנויות סמוך אליה.

    כשאתה בטווח 5 רגל מהמראה, אתה יכול לבצע פעולת קסם כדי לנקוב בשמו של יצור אחד הלכוד בה, או לקרוא למספרו של תא מסוים. היצור הנקוב או היצור שבתא הנקוב מופיע כדמות על פני המראה. אתה והיצור יכולים אז לתקשר.

    באופן דומה, אתה יכול לבצע פעולת קסם ולהשתמש במילת פקודה שנייה כדי לשחרר יצור אחד הלכוד במראה. היצור המשוחרר מופיע, יחד עם חפציו, במשבצת הפנויה הקרובה ביותר למראה, כשפניו מופנות ממנה.

    הנחת המראה בתוך חלל חוץ-ממדי שנוצר על ידי שק אחסון, חור נייד או חפץ דומה הורסת מיד את שני החפצים ופותחת שער למישור האסטרלי. השער נפתח במקום שבו הונח חפץ אחד בתוך האחר. כל יצור בטווח 10 רגל מהשער שאינו מאחורי מחסה מלא נשאב דרכו למקום אקראי במישור האסטרלי. אחר כך השער נסגר. השער חד-סטרי ואי אפשר לפתוח אותו מחדש.
- id: mithral-armor
  name: שריון מיתריל
  description: |-
    שריון (כל בינוני או כבד, פרט לשריון עור)

    מיתריל הוא מתכת קלה וגמישה. אפשר ללבוש שריון העשוי ממנה מתחת לבגדים רגילים. אם השריון מטיל בדרך כלל חיסרון על בדיקות זריזות (התגנבות) או דורש ערך כוח מינימלי, גרסת המיתריל שלו אינה עושה זאת.
- id: mysterious-deck
  name: חפיסת הקלפים המסתורית
  description: |-
    חפץ פלאי

    החפיסה, המצויה בדרך כלל בקופסה או בכיס, מכילה מספר קלפים העשויים שנהב או קלף. ברוב החפיסות האלה (75 אחוז) יש שלושה-עשר קלפים, אך בחלקן יש עשרים ושניים. השתמש בעמודה המתאימה בטבלת החפיסה המסתורית כשאתה קובע באקראי את הקלפים הנשלפים מהחפיסה.

    לפני שאתה שולף קלף, עליך להכריז כמה קלפים בכוונתך לשלוף, ואז לשלוף אותם באקראי. קלפים שנשלפו מעבר למספר זה אינם משפיעים. מלבד זאת, ברגע שאתה שולף קלף מהחפיסה, קסמו נכנס לתוקף. עליך לשלוף כל קלף לא יותר מ-1 שעה אחרי השליפה הקודמת. אם אינך שולף את המספר שבחרת, הקלפים הנותרים עפים מהחפיסה מעצמם ומשפיעים כולם בבת אחת.

    משנשלף קלף, הוא נעלם. אלא אם הקלף הוא השוטה או הליצן, הוא מופיע מחדש בחפיסה, כך שאפשר לשלוף את אותו קלף פעמיים. (משהשוטה או הליצן עזבו את החפיסה, הטל שוב על הטבלה אם קלף זה עולה שוב.)

    טבלה: החפיסה המסתורית

    | 1d100 (חפיסה של 13 קלפים) | 1d100 (חפיסה של 22 קלפים) | קלף |

    |---|---|---|

    | — | 01–05 | איזון |

    | — | 06–10 | שביט |

    | — | 11–14 | צינוק |

    | 01–08 | 15–18 | אוריאלה |

    | — | 19–23 | גורלות |

    | 09–16 | 24–27 | להבות |

    | — | 28–31 | שוטה |

    | — | 32–36 | אבן חן |

    | 17–24 | 37–41 | ליצן |

    | 25–32 | 42–46 | מפתח |

    | 33–40 | 47–51 | אביר |

    | 41–48 | 52–56 | ירח |

    | — | 57–60 | חידה |

    | 49–56 | 61–64 | נוכל |

    | 57–64 | 65–68 | חורבן |

    | — | 69–73 | חכם |

    | 65–72 | 74–77 | גולגולת |

    | 73–80 | 78–82 | כוכב |

    | 81–88 | 83–87 | שמש |

    | — | 88–91 | ציפורניים |

    | 89–96 | 92–96 | כס |

    | 97–00 | 97–00 | ריק |

    השפעת כל קלף מתוארת להלן.

    **_איזון._** אתה יכול להעלות ערך תכונה אחד שלך ב-2, עד למקסימום של 22, בתנאי שאתה גם מפחית ערך תכונה אחר שלך ב-2. אי אפשר להפחית תכונה שערכה 5 או פחות. לחלופין, אתה יכול לבחור שלא לשנות את ערכי התכונות שלך, ובמקרה זה לקלף אין השפעה.

    **_שביט._** בפעם הבאה שאתה נכנס לקרב נגד יצור עוין אחד או יותר, אתה יכול לבחור אחד מהם כיריבך כשאתה מטיל יוזמה. אם אתה מוריד את יריבך ל-0 נקודות חיים במהלך הקרב, יש לך יתרון בזריקות הצלה ממוות למשך 1 שנה. אם מישהו אחר מוריד את היריב שבחרת ל-0 נקודות חיים או שאינך בוחר יריב, לקלף אין השפעה.

    **_אוריאלה._** פניו של הקלף, הדומות לפני מדוזה, מקללות אותך. אתה סופג קנס של −2 בזריקות הצלה כל עוד אתה מוקלל כך. רק אל או קסמו של קלף הגורלות יכולים לשים קץ לקללה זו.

    **_גורלות._** מארג המציאות נפרם וגולל מחדש, ומאפשר לך להימנע מאירוע אחד או למחוק אותו כאילו לא התרחש מעולם. אתה יכול להשתמש בקסם הקלף ברגע שאתה שולף אותו או בכל זמן אחר לפני מותך.

    **_להבות._** שד רב עוצמה הופך לאויבך. השד מבקש את חורבנך ומייסר אותך, נהנה מסבלך לפני שינסה להרוג אותך. איבה זו נמשכת עד שאתה או השד מתים.

    **_שוטה._** יש לך חיסרון במבחני d20 למשך 72 השעות הבאות. שלוף קלף נוסף; שליפה זו אינה נספרת כאחת מהשליפות שהכרזת עליהן.

    **_אבן חן._** עשרים וחמישה חפצי תכשיט בשווי 2,000 מ״ז כל אחד או חמישים אבני חן בשווי 1,000 מ״ז כל אחת מופיעים לרגליך.

    **_ליצן._** יש לך יתרון במבחני d20 למשך 72 השעות הבאות, או שאתה יכול לשלוף שני קלפים נוספים מעבר לשליפות שהכרזת עליהן.

    **_מפתח._** נשק קסום בנדירות נדיר ומעלה שאתה שולט בו מופיע עליך. שליט המבוך בוחר את הנשק.

    **_אביר._** אתה זוכה בשירותיו של **אביר**, המופיע בקסם במשבצת פנויה לבחירתך בטווח 30 רגל ממך. לאביר אותה נטייה כמוך והוא משרת אותך בנאמנות עד מותו, מתוך אמונה שהגורל הוביל אתכם זה אל זה. עבוד עם שליט המבוך ליצירת שם וסיפור רקע לדמות לא-שחקן זו. שליט המבוך רשאי להשתמש בגיליון נתונים אחר כדי לייצג את האביר, כרצונו.

    **_ירח._** אתה מקבל את היכולת להטיל משאלה 1d3 פעמים.

    **_חידה._** הפחת לצמיתות את התבונה או החוכמה שלך ב-1d4 + 1 (לערך מינימלי של 1). אתה יכול לשלוף קלף אחד נוסף מעבר לשליפות שהכרזת עליהן.

    **_נוכל._** דמות לא-שחקן לבחירת שליט המבוך הופכת לעוינת כלפיך. אינך יודע מיהי דמות זו עד שהיא או מישהו אחר חושפים זאת. רק לחש משאלה או התערבות אלוהית יכולים לשים קץ לעוינות הדמות כלפיך.

    **_חורבן._** כל צורות העושר שאתה נושא או מחזיק, מלבד חפצים קסומים, אובדות לך. רכוש נייד נעלם. עסקים, מבנים וקרקעות שבבעלותך אובדים באופן ששינוי המציאות בו הוא מזערי. כל מסמך המוכיח שעליך להחזיק בדבר שאבד בגלל קלף זה נעלם אף הוא.

    **_חכם._** בכל זמן שתבחר בתוך שנה אחת משליפת קלף זה, אתה יכול לשאול שאלה בהרהור ולקבל נפשית תשובה אמיתית לשאלה זו.

    **_גולגולת._** **התגלמות המוות** (ראה גיליון הנתונים המצורף) מופיעה במשבצת פנויה קרוב

    ככל האפשר אליך. ההתגלמות מכוונת את התקפותיה רק אליך, ומופיעה כשלד רפאים לבוש גלימה שחורה קרועה ונושא חרמש רוחני. ההתגלמות נעלמת כשהיא יורדת ל-0 נקודות חיים או כשאתה מת. אם בעל ברית שלך גורם נזק להתגלמות, אותו בעל ברית מזמן **התגלמות המוות** נוספת. ההתגלמות החדשה מופיעה במשבצת פנויה קרוב ככל האפשר לאותו בעל ברית ומכוונת את התקפותיה רק אליו. אתה ובעלי בריתך יכולים כל אחד להזמין רק התגלמות אחת כתוצאה משליפה זו. יצור שנהרג בידי התגלמות אי אפשר להחיות.

    **_כוכב._** העלה ערך תכונה אחד שלך ב-2, עד למקסימום של 24.

    **_שמש._** חפץ קסום (לבחירת שליט המבוך) מופיע עליך. בנוסף, אתה מקבל 10 נקודות חיים זמניות מדי יום עם עלות השחר עד מותך.

    **_ציפורניים._** כל חפץ קסום שאתה לובש או נושא מתפורר לאבק. חפצי עוצמה שברשותך נעלמים במקום זאת.

    **_כס._** אתה זוכה בשליטה ובמומחיות לבחירתך בהיסטוריה, תובנה, הפחדה או שכנוע. בנוסף, אתה זוכה בבעלות לגיטימית על מבצר קטן באיזשהו מקום בעולם. אולם המבצר משמש כעת מעון לחיה אחת או יותר, ויש לטהר אותו מהם לפני שתוכל לתבוע אותו כשלך.

    **_ריק._** נשמתך נמשכת מגופך ומוכלת בחפץ במקום לבחירת שליט המבוך. יצור אדיר אחד או יותר שומרים על המקום. כל עוד נשמתך לכודה כך, גופך דומם, חדל להזדקן ואינו זקוק למזון, אוויר או מים. לחש משאלה אינו יכול להחזיר את נשמתך לגופך, אך הלחש חושף את מיקום החפץ המחזיק בנשמתך. אינך שולף עוד קלפים.

    #### התגלמות המוות

    *אל-מת בינוני, ניטראלי רוע*

    **דרגת שריון** 20

    **יוזמה** +3 (13)

    **נקודות חיים** מחצית מהמקסימום של נקודות החיים של מזמנה

    **מהירות** 60 רגל, מעוף 60 רגל (ריחוף)

    | תכונה | ערך | מתאם | הצלה |

    |---|---|---|---|

    | כוח | 16 | +3 | +3 |

    | זריזות | 16 | +3 | +3 |

    | חוסן | 16 | +3 | +3 |

    | תבונה | 16 | +3 | +3 |

    | חוכמה | 16 | +3 | +3 |

    | כריזמה | 16 | +3 | +3 |

    **חסינות** נקרוטי, רעל; מכושף, תשישות, מבוהל, משותק, מאובן, מורעל, חסר הכרה

    **חושים** ראיית אמת 60 רגל, הבחנה קבועה 13

    **שפות** כל השפות הידועות למזמנה

    **אתגר** אין (0 נק״נ; תוסף השליטה שווה לזה של מזמנה)

    ##### מאפיינים

    **_תנועה לא-גשמית._** ההתגלמות יכולה לנוע דרך יצורים ועצמים אחרים כאילו היו תוואי שטח קשה. היא סופגת 5 (1d10) נזק כוח קסום אם היא מסיימת את תורה בתוך עצם.

    ##### פעולות

    **_התקפות מרובות._** ההתגלמות מבצעת מספר התקפות חרמש קוצר השווה למחצית תוסף השליטה של המזמן (מעוגל כלפי מעלה).

    **_חרמש קוצר. התקפה בקרב פנים אל פנים:_** פגיעה אוטומטית, הישג 5 רגל. *פגיעה:* 7 (1d8 + 3) נזק חותך ועוד 4 (1d8) נזק נקרוטי.
- id: necklace-of-adaptation
  name: שרשרת הסתגלות
  description: |-
    חפץ פלאי

    כשאתה עונד את השרשרת הזאת, אתה יכול לנשום כרגיל בכל סביבה, ויש לך יתרון בזריקות הצלה שנועדו להימנע מהמצב מורעל או לסיימו.
- id: necklace-of-fireballs
  name: שרשרת כדורי אש
  description: |-
    חפץ פלאי

    על השרשרת הזאת תלויים 1d6 + 3 חרוזים. אתה יכול לבצע פעולת קסם כדי לנתק חרוז אחד ולזרוק אותו עד מרחק של 60 רגל. כשהחרוז מגיע לסוף מסלולו, הוא מתפוצץ כלחש כדור אש בדרגה 3 (דרגת קושי להצלה 15).

    אתה יכול לזרוק כמה חרוזים בבת אחת, ואפילו את השרשרת כולה. כשאתה עושה זאת, הגדל את הנזק של כדור האש ב-1d6 על כל חרוז אחרי הראשון (מקסימום 12d6).
- id: necklace-of-prayer-beads
  name: שרשרת חרוזי תפילה
  description: |-
    חפץ פלאי

    על השרשרת הזאת יש 1d4 + 2 חרוזים קסומים העשויים אקוומרין, פנינה שחורה או טופז. יש בה גם חרוזים רבים לא קסומים העשויים אבנים כמו ענבר, אבן דם, סיטרין, אלמוג, ירקן, פנינה או קוורץ. אם חרוז קסום מוסר מהשרשרת, החרוז מאבד את הקסם שלו.

    קיימים שישה סוגים של חרוזים קסומים. שליט המבוך קובע את סוג כל חרוז בשרשרת, או קובע אותו באקראי בגלגול בטבלה שלהלן. בשרשרת יכולים להיות כמה חרוזים מאותו סוג. כדי להשתמש בחרוז, עליך לענוד את השרשרת. כל חרוז מכיל לחש שאתה יכול להטיל ממנו כפעולה נוספת (תוך שימוש בדרגת קושי להצלה נגד לחשים שלך אם נדרשת זריקת הצלה). אחרי שהלחש של חרוז קסום הוטל, אי אפשר להשתמש בחרוז הזה שוב עד עלות השחר הבאה.

    | 1d20 | חרוז | לחש |

    |---|---|---|

    | 1–6 | חרוז ברכה | ברכה |

    | 7–12 | חרוז ריפוי | ריפוי פצעים (גרסת דרגה 2) |

    | 13–16 | חרוז חסד | שחזור גדול |

    | 17–18 | חרוז מהלומה | מהלומה זוהרת |

    | 19 | חרוז זימון | שומר האמונה |

    | 20 | חרוז הליכת רוח | הליכת רוח |
- id: nine-lives-stealer
  name: גוזל תשעה חיים
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    אתה מקבל בונוס של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בנשק הקסום הזה.

    גזילת חיים. בנשק יש 1d8 + 1 מטענים. כשאתה תוקף בנשק הזה יצור שיש לו פחות מ-100 נקודות חיים ומטיל 20 בקובייה d20 של גלגול ההתקפה, היצור חייב להצליח בזריקת הצלה בחוסן בדרגת קושי 15, או שהוא נהרג מיידית כשהחרב קורעת את כוח החיים מגופו. יצירי כפיים ואל-מתים מצליחים בהצלה אוטומטית. הנשק מאבד 1 מטען אם היצור נהרג. כשלא נשארו בנשק מטענים, הוא מאבד את התכונה הזאת.
- id: oathbow
  name: קשת השבועה
  description: |-
    נשק (קשת ארוכה או קשת קצרה)

    כשאתה מניח חץ על הקשת הזאת, היא לוחשת באלפית: "תבוסה מהירה לאויבַי." כשאתה משתמש בנשק הזה לביצוע התקפת טווח, אתה יכול לומר או לסמן את מילות הפקודה הבאות: "מוות מהיר לך, אשר עשקתני." מטרת ההתקפה שלך הופכת לאויב השבוע שלך עד שהיא מתה או עד עלות השחר 7 ימים אחר כך. יכול להיות לך רק אויב שבוע אחד כזה בכל זמן נתון. כשאויב השבוע שלך מת, אתה יכול לבחור אחד חדש אחרי עלות השחר הבאה.

    כשאתה מגלגל התקפת טווח בנשק הזה נגד אויב השבוע שלך, יש לך יתרון בגלגול. בנוסף, המטרה שלך לא נהנית מחצי מחסה או משלושה רבעים מחסה, ואתה לא סובל מחיסרון בגלל טווח ארוך. אם ההתקפה פוגעת, אויב השבוע שלך סופג 3d6 נזק דוקר נוסף.

    כל עוד אויב השבוע שלך חי, יש לך חיסרון בגלגולי התקפה בכל שאר הנשקים.
- id: oil-of-etherealness
  name: שמן אתריות
  description: |-
    שיקוי

    בקבוקון אחד של השמן הזה יכול לכסות יצור אחד בגודל בינוני או קטן ממנו, יחד עם הציוד שהוא לובש ונושא (נדרש בקבוקון נוסף אחד לכל קטגוריית גודל מעל בינוני). מריחת השמן אורכת 10 דקות. היצור המושפע מקבל אז את ההשפעה של הלחש אתריות למשך 1 שעה.

    חרוזים של השמן האפור והעכור הזה נוצרים בחלקו החיצוני של הכלי שלו ומתאדים במהירות.
- id: oil-of-sharpness
  name: שמן חדות
  description: |-
    שיקוי

    בקבוקון אחד של השמן הזה יכול לצפות נשק קרב פנים אל פנים אחד או עשרים יחידות תחמושת, אבל רק תחמושת ונשקי קרב פנים אל פנים שאינם קסומים ופוגעים בנזק חותך או דוקר מושפעים. מריחת השמן אורכת 1 דקה, ואחריה השמן חודר בקסם לכל מה שציפה, והופך את הנשק המצופה ל-נשק +3 או את התחמושת המצופה ל-תחמושת +3.

    השמן הצלול והג׳לטיני הזה נוצץ בשבבי כסף זעירים ודקיקים במיוחד.
- id: oil-of-slipperiness
  name: שמן חלקלקות
  description: |-
    שיקוי

    בקבוקון אחד של השמן הזה יכול לכסות יצור אחד בגודל בינוני או קטן ממנו, יחד עם הציוד שהוא לובש ונושא (נדרש בקבוקון נוסף אחד לכל קטגוריית גודל מעל בינוני). מריחת השמן אורכת 10 דקות. היצור המושפע מקבל אז את ההשפעה של הלחש חופש תנועה למשך 8 שעות.

    לחלופין, אפשר לשפוך את השמן על הקרקע כפעולת קסם, והוא מכסה ריבוע של 10 רגל ומשכפל באזור הזה את ההשפעה של הלחש שומן למשך 8 שעות. המשחה השחורה והדביקה הזאת סמיכה וכבדה, אבל היא זורמת במהירות כשמוזגים אותה.
- id: pearl-of-power
  name: פנינת עוצמה
  description: |-
    חפץ פלאי

    כל עוד הפנינה הזאת עליך, אתה יכול לבצע פעולת קסם כדי להחזיר תא לחשים אחד שהוצא בדרגה 3 או נמוכה. אחרי שהשתמשת בפנינה, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: periapt-of-health
  name: תליון בריאות
  description: |-
    חפץ פלאי

    כשאתה עונד את התליון הזה, אתה יכול לבצע פעולת קסם כדי להחזיר 2d4 + 2 נקודות חיים. אחרי שנעשה בו שימוש, אי אפשר להשתמש בתכונה הזאת שוב עד עלות השחר הבאה.

    בנוסף, יש לך יתרון בזריקות הצלה כדי להימנע מהמצב מורעל או לסיימו כל עוד אתה עונד את התליון הזה.
- id: periapt-of-proof-against-poison
  name: תליון ההגנה מפני רעל
  description: |-
    חפץ פלאי

    לשרשרת הכסף העדינה הזאת תלוי תליון של אבן חן שחורה בליטוש מבריק. כל עוד אתה עונד אותו, אתה חסין למצב מורעל ולנזק רעל.
- id: periapt-of-wound-closure
  name: תליון סגירת פצעים
  description: |-
    חפץ פלאי

    כל עוד אתה עונד את התליון הזה, אתה זוכה ביתרונות הבאים.

    שימור חיים. בכל פעם שאתה מבצע זריקת הצלה ממוות, אתה יכול לשנות תוצאת גלגול של 9 או פחות ל-10, וכך להפוך הצלה כושלת להצלה מוצלחת.

    החלמה טבעית מוגברת. בכל פעם שאתה מטיל קוביית חיים כדי להחזיר נקודות חיים, הכפל פי שניים את מספר נקודות החיים שהיא משיבה.
- id: philter-of-love
  name: סם אהבה
  description: |-
    שיקוי

    בפעם הבאה שתראה יצור בתוך 10 דקות לאחר שתשתה את הסם הזה, אתה מוקסם מאותו יצור ונמצא במצב מוקסם למשך 1 שעה.

    הנוזל הוורדרד והמבעבע הזה מכיל בועה אחת בצורת לב, שקל לפספס אותה.
- id: pipes-of-haunting
  name: חלילי רדיפה
  description: |-
    חפץ פלאי

    לחלילים האלה יש 3 מטענים, והם מחזירים 1d3 מטענים שהוצאו בכל יום עם עלות השחר. אתה יכול לבצע פעולת קסם כדי לנגן בהם ולהוציא 1 מטען כדי ליצור מנגינה מצמררת ואוחזת. כל יצור לבחירתך בטווח 30 רגל ממך חייב להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, ואם לא, הוא מבוהל למשך 1 דקה. יצור שנכשל בהצלה חוזר עליה בסוף כל תור שלו, והאפקט מסתיים עליו אם הצליח. יצור שהצליח בהצלה חסין לאפקט של החלילים האלה למשך 24 שעות.
- id: pipes-of-the-sewers
  name: חלילי הביוב
  description: |-
    חפץ פלאי

    כל עוד החלילים האלה עליך, עכברושים רגילים ועכברושים ענקיים אדישים כלפיך ולא יתקפו אותך, אלא אם תאיים עליהם או תפגע בהם.

    לחלילים יש 3 מטענים, והם מחזירים 1d3 מטענים שהוצאו בכל יום עם עלות השחר. אם אתה מנגן בחלילים כפעולת קסם, אתה יכול לבצע פעולה נוספת כדי להוציא בין 1 ל-3 מטענים, ולהזעיק נחיל עכברושים אחד עבור כל מטען שהוצא, אם יש מספיק עכברושים בטווח חצי מייל ממך כדי שאפשר יהיה לזמן אותם כך (כפי שקובע שליט המבוך). אם אין מספיק עכברושים כדי ליצור נחיל, המטען מתבזבז. נחילים שהוזעקו נעים לעבר המוזיקה בדרך הקצרה ביותר, אך מלבד זאת אינם נתונים לשליטתך.

    בכל פעם שנחיל עכברושים שאינו תחת שליטת יצור אחר מגיע למרחק 30 רגל ממך בזמן שאתה מנגן בחלילים, הנחיל מבצע זריקת הצלה בחוכמה בדרגת קושי 15. אם הצליח, הנחיל מתנהג כרגיל ואי אפשר לשכנע אותו באמצעות מוזיקת החלילים ב-24 השעות הבאות. אם נכשל, מוזיקת החלילים משכנעת את הנחיל והוא נעשה ידידותי כלפיך וכלפי בעלי בריתך, כל עוד אתה ממשיך לנגן בחלילים בכל סבב כפעולת קסם. נחיל ידידותי מציית לפקודותיך. אם אינך נותן פקודות לנחיל ידידותי, הוא מגן על עצמו אך אינו נוקט פעולות אחרות. אם נחיל ידידותי מתחיל את תורו במרחק של יותר מ-30 רגל ממך, השליטה שלך בו מסתיימת, והנחיל מתנהג כרגיל ואי אפשר לשכנע אותו באמצעות מוזיקת החלילים ב-24 השעות הבאות.
- id: plate-armor-of-etherealness
  name: שריון לוחות של אתריות
  description: |-
    שריון (שריון חצי-לוחות או שריון לוחות)

    כל עוד אתה לובש את השריון הזה, אתה יכול לבצע פעולת קסם ולהשתמש במילת פקודה כדי לזכות באפקט של הלחש אתריות. הלחש מסתיים מיד אם אתה מסיר את השריון או מבצע פעולת קסם כדי לחזור על מילת הפקודה. אי אפשר להשתמש בתכונה הזאת של השריון שוב עד עלות השחר הבאה.
- id: portable-hole
  name: חור נייד
  description: |-
    חפץ פלאי

    הבד השחור והעדין הזה, רך כמשי, מקופל לממדים של מטפחת. כשהוא נפרש, הוא נעשה יריעה עגולה ברוחב 6 רגל.

    אתה יכול לבצע פעולת קסם כדי לפרוש חור נייד ולהניח אותו על משטח מוצק או מולו, ואז החור הנייד יוצר חור חוץ-ממדי בעומק 10 רגל. החלל הגלילי שבתוך החור קיים במישור מציאות אחר, ולכן אי אפשר להשתמש בו כדי ליצור מעברים פתוחים. כל יצור בתוך חור נייד פתוח יכול לצאת ממנו בטיפוס החוצה.

    אתה יכול לבצע פעולת קסם כדי לסגור חור נייד, באמצעות אחיזה בקצות הבד וקיפולו. קיפול הבד סוגר את החור, וכל היצורים או החפצים שבתוכו נשארים בחלל החוץ-ממדי. לא משנה מה בתוכו, החור שוקל כמעט כלום.

    אם החור מקופל, יצור שנמצא בחלל החוץ-ממדי של החור יכול לבצע פעולה כדי לבצע בדיקת כוח (אתלטיקה) בדרגת קושי 10. אם הצליח בבדיקה, היצור פורץ את דרכו החוצה ומופיע בטווח 5 רגל מהחור הנייד. חור נייד סגור מכיל מספיק אוויר לנשימה של 1 שעה, מחולקת במספר היצורים הנושמים שבתוכו.

    הנחת חור נייד בתוך חלל חוץ-ממדי שנוצר על ידי שק אחסון, ילקוט שימושי או חפץ דומה הורסת מיד את שני החפצים ופותחת שער למישור האסטרלי. השער נפתח במקום שבו הונח חפץ אחד בתוך האחר. כל יצור בטווח 10 רגל מהשער ושאינו מאחורי מחסה מלא נשאב דרכו ומושלך למקום אקראי במישור האסטרלי. אחר כך השער נסגר. השער חד-סטרי ואי אפשר לפתוח אותו מחדש.
