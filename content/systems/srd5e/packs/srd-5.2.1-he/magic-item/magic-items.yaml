- id: gem-of-brightness
  name: אבן הזוהר
  description: |-
    חפץ פלאי

    בפריזמה הזאת יש 50 מטענים. כשאתה מחזיק בה, אתה יכול לבצע פעולת קסם ולהשתמש באחת משלוש מילות פקודה כדי לגרום לאחת מההשפעות הבאות: מילת הפקודה הראשונה. האבן פולטת אור בהיר ברדיוס 30 רגל ואור עמום ל-30 רגל נוספות. ההשפעה הזאת אינה מבזבזת מטען. היא נמשכת עד שאתה מבצע פעולה נוספת כדי לחזור על מילת הפקודה, או עד שאתה משתמש בפונקציה אחרת של האבן. מילת הפקודה השנייה. אתה מבזבז 1 מטען וגורם לאבן לירות קרן אור מסנוורת ביצור אחד שאתה רואה בטווח 60 רגל ממך. היצור חייב להצליח בזריקת הצלה בחוסן בדרגת קושי 15, או לקבל את המצב עיוור למשך 1 דקה. היצור חוזר על ההצלה בסוף כל אחד מתוריו, ומסיים את ההשפעה על עצמו בהצלחה. מילת הפקודה השלישית. אתה מבזבז 5 מטענים וגורם לאבן להבזיק באור עז בחרוט של 30 רגל. כל יצור בחרוט מבצע זריקת הצלה כאילו נפגע בקרן שנוצרה במילת הפקודה השנייה. כשכל המטענים של האבן מבוזבזים, האבן הופכת לתכשיט לא קסום ששווה 50 מ״ז.
- id: gem-of-seeing
  name: אבן הראייה
  description: |-
    חפץ פלאי

    לאבן הזאת יש 3 מטענים. כפעולת קסם, אתה יכול להוציא 1 מטען. במשך 10 דקות הבאות יש לך ראיית אמת בטווח של 120 רגל כשאתה מביט דרך האבן.

    האבן משיבה 1d3 מטענים שהוצאו מדי יום עם עלות השחר.
- id: giant-slayer
  name: קוטל ענקים
  description: |-
