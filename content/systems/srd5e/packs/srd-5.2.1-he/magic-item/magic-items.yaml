- id: ring-of-djinni-summoning
  name: טבעת זימון ג׳יני
  description: |-
    טבעת

    כל עוד אתה עונד את הטבעת הזו, אתה יכול לבצע פעולת קסם כדי לזמן ג׳יני מסוים מהמישור היסודי של האוויר. הג׳יני מופיע במשבצת פנויה לבחירתך במרחק של עד 120 רגל ממך. הוא נשאר כל עוד אתה שומר על ריכוז, עד מקסימום של 1 שעה, או עד שהוא יורד ל-0 נקודות חיים.

    בזמן שהוא מזומן, הג׳יני ידידותי אליך ואל בני בריתך, והוא מציית לפקודותיך. אם אינך מפקד עליו, הג׳יני מגן על עצמו מפני תוקפים אך אינו מבצע שום פעולה אחרת.

    לאחר שהג׳יני עוזב, אי אפשר לזמן אותו שוב במשך 24 שעות, והטבעת הופכת ללא קסומה אם הג׳יני מת.

    טבעות זימון ג׳יני נוצרות לעיתים קרובות בידי הג׳ינים שהן מזמנות, ונמסרות לבני תמותה כמתנות ידידות או כאות הערכה.
- id: ring-of-elemental-command
  name: טבעת שליטה ביסודות
  description: |-
    טבעת

    כל *טבעת שליטה ביסודות* קשורה לאחד מארבעת המישורים היסודיים. שליט המבוך בוחר או קובע באקראי את המישור הקשור. לדוגמה, *טבעת שליטה ביסודות* (אוויר) קשורה למישור היסודי של האוויר.

    לכל *טבעת שליטה ביסודות* יש שתי התכונות הבאות:

    **_פורענות ליסודנים._** כל עוד אתה עונד את הטבעת, יש לך יתרון בגלגולי התקפה נגד יסודנים, ולהם יש חיסרון בגלגולי התקפה נגדך.

    **_כפייה על יסודנים._** כל עוד אתה עונד את הטבעת, אתה יכול לבצע פעולת קסם כדי לנסות לכפות את רצונך על יסודן שאתה רואה במרחק של עד 60 רגל ממך. היסודן מטיל זריקת הצלה בחוכמה בדרגת קושי 18. אם הוא נכשל, היסודן מקבל את מצב מוקסם עד תחילת התור הבא שלך, ואתה קובע מה הוא עושה בתנועה ובפעולה שלו בתורו הבא.

    **_מיקוד יסודי._** כל עוד אתה עונד את הטבעת, אתה נהנה מתכונות נוספות המתאימות למישור היסודי שאליו הטבעת קשורה:

    **אוויר.** אתה יודע אוראן, יש לך עמידות לנזק ברק, ויש לך מהירות מעוף השווה למהירותך, ואתה יכול לרחף.

    **אדמה.** אתה יודע טראן, ויש לך עמידות לנזק חומצה. תוואי שטח המורכב מהריסות, סלעים או עפר אינו תוואי שטח קשה עבורך. בנוסף, אתה יכול לנוע דרך אדמה או סלע מוצקים כאילו אזורים אלה הם תוואי שטח קשה, בלי להפריע לחומר שדרכו אתה עובר. אם אתה מסיים את תורך בתוך אדמה או סלע מוצקים, אתה נדחק החוצה אל המשבצת הפנויה הקרובה ביותר שתפסת לאחרונה.

    **אש.** אתה יודע איגנן, ויש לך חסינות לנזק אש.

    **מים.** אתה יודע אקוואן, אתה מקבל מהירות שחייה של 60 רגל, ואתה יכול לנשום מתחת למים.

    **_הטלת לחשים._** לטבעת יש 5 מטענים, והיא מחזירה 1d4 + 1 מטענים שהוצאו מדי יום עם עלות השחר. כל עוד אתה עונד את הטבעת, אתה יכול להטיל ממנה לחש. בחר את הלחש מרשימת הלחשים הזמינים לפי המישור היסודי שאליו הטבעת קשורה, כמפורט בטבלה הבאה. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש, שדרגת הקושי להצלה שלו היא 18.

    | מישור | לחשים (מטענים) |

    |---|---|

    | אוויר | שרשרת ברקים (3 מטענים), נפילת נוצה (0 מטענים), משב רוח (2 מטענים), חומת רוח (1 מטען) |

    | אדמה | רעידת אדמה (5 מטענים), עיצוב אבן (2 מטענים), עור אבן (3 מטענים), חומת אבן (3 מטענים) |

    | אש | ידיים בוערות (1 מטען), כדור אש (2 מטענים), סופת אש (4 מטענים), חומת אש (3 מטענים) |

    | מים | יצירה או השמדה של מים (1 מטען), סופת קרח (2 מטענים), צונאמי (5 מטענים), חומת קרח (3 מטענים), הליכה על מים (2 מטענים) |
