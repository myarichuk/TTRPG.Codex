    | 2 | קוף אדם |

    | 3 | בבון |

    | 4 | מקור-גרזן |

    | 5 | דוב שחור |

    | 6 | סמור ענק |

    | 7 | צבוע ענק |

    | 8 | נמר |
- id: bead-of-force
  name: חרוז כוח
  description: |-
    חפץ פלאי

    הכדור הקטן והשחור הזה הוא בקוטר 3/4 אינץ׳ ושוקל אונקיה. בדרך כלל מוצאים יחד 1d4 + 4 חרוזי כוח.

    אתה יכול לבצע פעולת קסם כדי לזרוק את החרוז עד מרחק של 60 רגל. החרוז מתפוצץ בעת הפגיעה בכדור ברדיוס של 10 רגל ונהרס. כל יצור בכדור חייב להצליח בזריקת הצלה בזריזות בדרגת קושי 15, או לסבול 5d4 נזק כוח קסום. אחר כך כדור שקוף של כוח קסום סוגר על האזור למשך 1 דקה. כל יצור שנכשל בהצלה ונמצא כולו בתוך האזור לכוד בתוך הכדור הזה. יצורים שהצליחו בהצלה או שנמצאים בחלקם בלבד בתוך האזור נדחפים הרחק ממרכז הכדור עד שהם כבר אינם בתוכו. רק אוויר נשימה יכול לעבור דרך דופן הכדור. שום התקפה או השפעה אחרת אינן יכולות לעבור.

    יצור כלוא יכול לבצע פעולת שימוש כדי לדחוף את דופן הכדור ולהזיז את הכדור עד מחצית מהמהירות של היצור. אפשר להרים את הכדור, והקסם שלו גורם לו לשקול 1 פאונד בלבד, בלי קשר למשקל היצורים שבתוכו.
- id: belt-of-dwarvenkind
  name: חגורת הגמדים
  description: |-
    חפץ פלאי

    כשאתה לובש את החגורה הזאת, אתה מקבל את היתרונות הבאים: גמדית. אתה יודע גמדית. ידיד הגמדים. יש לך יתרון בבדיקות כריזמה (שכנוע) שנעשות כדי ליצור אינטראקציה עם גמדים ודוארגים. חוסן. ערך החוסן שלך עולה ב-2, עד מקסימום של 20. בנוסף, כל עוד אתה מותאם לחגורה, יש סיכוי של 50 אחוז בכל יום עם עלות השחר שתצמיח זקן מלא אם אתה מסוגל לגדל אחד, או זקן עבה יותר אם כבר יש לך זקן. אם אינך גמד או דוארג, אתה מקבל את היתרונות הנוספים הבאים כל עוד אתה לובש את החגורה: ראיית חושך. יש לך ראיית חושך בטווח של 60 רגל. עמידות בפני פגעים. יש לך עמידות לנזק רעל. כמו כן יש לך יתרון בזריקות הצלה שאתה מבצע כדי להימנע מהמצב מורעל או לסיים אותו.
- id: belt-of-giant-strength
  name: חגורת כוח ענקים
  description: |-
    חפץ פלאי

    כשאתה לובש את החגורה הזאת, ערך הכוח שלך משתנה לערך שהחגורה מעניקה. סוג הענק קובע את הערך (ראה בטבלה שלהלן). לחפץ אין השפעה עליך אם ערך הכוח שלך בלי החגורה שווה לערך החגורה או גבוה ממנו.

    | חגורה | כוח | נדירות |

    |---|---|---|

    | חגורת כוח ענקים (גבעות) | 21 | נדיר |

    | חגורת כוח ענקים (כפור או אבן) | 23 | נדיר מאוד |

    | חגורת כוח ענקים (אש) | 25 | נדיר מאוד |

    | חגורת כוח ענקים (ענן) | 27 | אגדי |

    | חגורת כוח ענקים (סערה) | 29 | אגדי |
- id: berserker-axe
  name: גרזן הברסרקר
  description: |-
    נשק (גרזן קרב, גרזן גדול או הלברד)

    אתה מקבל בונוס של +1 לגלגולי התקפה ולגלגולי נזק שנעשים בנשק קסום זה. בנוסף, כל עוד אתה מותאם לנשק הזה, מקסימום נקודות החיים שלך עולה ב-1 על כל דרגה שהשגת.

    קללה. הנשק הזה מקולל, וההתאמה אליו מעבירה את הקללה גם אליך. כל עוד אתה מקולל, אתה מסרב להיפרד מהנשק ומחזיק אותו בהישג יד בכל עת. בנוסף, יש לך חיסרון בגלגולי התקפה בנשקים אחרים.

    בכל פעם שיצור אחר פוגע בך בנזק בזמן שהנשק ברשותך, עליך להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, ואם לא, אתה נכנס לזעם ברסרקר. מצב הזעם מסתיים כשאתה מתחיל את תורך ואין בטווח של 60 רגל ממך יצורים שאתה יכול לראות או לשמוע.

    כשאתה בזעם, אתה רואה ביצור הקרוב ביותר אליך שאתה יכול לראות או לשמוע את אויבך. אם יש כמה יצורים אפשריים, בחר אחד מהם באקראי. בכל אחד מתוריך עליך להתקרב ליצור ככל האפשר ולבצע את פעולת ההתקפה נגדו. אם אינך מצליח להתקרב ליצור מספיק כדי לתקוף אותו בנשק, התור שלך מסתיים לאחר שניצלת את כל התנועה העומדת לרשותך. אם היצור מת או שאתה כבר לא יכול לראות או לשמוע אותו, היצור הקרוב ביותר הבא שאתה יכול לראות או לשמוע הופך למטרה החדשה שלך.
- id: boots-of-elvenkind
  name: מגפי בני האלפים
  description: |-
    חפץ פלאי

    כל עוד אתה נועל את המגפיים האלה, צעדיך אינם משמיעים קול, בלי קשר לשטח שעליו אתה נע. בנוסף, יש לך יתרון בבדיקות זריזות (התגנבות).
- id: boots-of-levitation
  name: מגפי ריחוף
  description: |-
    חפץ פלאי

    כל עוד אתה נועל את המגפיים האלה, אתה יכול להטיל על עצמך את הלחש ריחוף.
- id: boots-of-speed
  name: מגפי מהירות
  description: |-
    חפץ פלאי

    כל עוד אתה נועל את המגפיים האלה, אתה יכול לבצע פעולה נוספת כדי להקיש את העקבים זה בזה. אם עשית זאת, המגפיים מכפילים את מהירותך, ולכל יצור שמבצע נגדך התקפה מזדמנת יש חיסרון בגלגול ההתקפה. אם אתה מקיש את העקבים שוב, ההשפעה מסתיימת.

    כשהשתמשת בתכונת המגפיים במשך 10 דקות בסך הכול, הקסם חדל לפעול עבורך עד שתסיים מנוחה ארוכה.
- id: boots-of-striding-and-springing
  name: מגפי צעידה וזינוק
  description: |-
    חפץ פלאי

    כל עוד אתה נועל את המגפיים האלה, מהירותך הופכת ל-30 רגל, אלא אם היא גבוהה מכך, ומהירותך אינה פוחתת בגלל נשיאת משקל החורג מיכולת הנשיאה שלך או בגלל לבישת שריון כבד.

    פעם אחת בכל אחד מתוריך, אתה יכול לקפוץ עד 30 רגל תוך הוצאת 10 רגל בלבד של תנועה.
- id: boots-of-the-winterlands
  name: מגפי ארצות החורף
  description: |-
    חפץ פלאי

    המגפיים המפרוותיים האלה צמודים לרגל ומרגישים חמים. כל עוד אתה נועל אותם, אתה מקבל את היתרונות הבאים.

    עמידות בפני קור. יש לך עמידות בפני נזק קור, ואתה יכול לשאת טמפרטורות של 0 מעלות פרנהייט ומטה בלי הגנה נוספת.

    הולך חורף. אתה מתעלם מתוואי שטח קשה שנוצר על ידי קרח או שלג.
- id: bowl-of-commanding-water-elementals
  name: קערת שליטה ביסודני מים
  description: |-
    חפץ פלאי

    כל עוד הקערה הזאת מלאה במים ואתה נמצא במרחק של עד 5 רגל ממנה, אתה יכול לבצע פעולת קסם כדי לזמן יסודן מים. היסודן מופיע במרחב פנוי הקרוב ביותר לקערה, מבין את שפותיך, ממלא את פקודותיך, ומקבל את תורו מיד אחריך בספירת היוזמה שלך. היסודן נעלם לאחר 1 שעה, כשהוא מת או כשאתה משחרר אותו בפעולה נוספת. אי אפשר להשתמש בקערה בדרך זו שוב עד עלות השחר הבאה.

    קוטרה של הקערה כ-1 רגל ועומקה חצי מכך. היא מחזיקה כ-3 גלונים.
- id: bracers-of-archery
  name: מגני אמה של קשתות
  description: |-
    חפץ פלאי

    כל עוד אתה עונד את מגני האמה האלה, יש לך שליטה בקשת ארוכה ובקשת קצרה, ואתה מקבל בונוס של +2 לגלגולי נזק שנעשים בנשקים כאלה.
- id: bracers-of-defense
  name: מגני אמה של הגנה
  description: |-
    חפץ פלאי

    כל עוד אתה עונד את מגני האמה האלה, אתה מקבל בונוס של +2 לדרגת השריון אם אינך לובש שריון ואינך משתמש במגן.
- id: brazier-of-commanding-fire-elementals
  name: מחם שליטה ביסודני אש
  description: |-
    חפץ פלאי

    כל עוד אתה נמצא במרחק של עד 5 רגל מהמחם הזה, אתה יכול לבצע פעולת קסם כדי לזמן יסודן אש. היסודן מופיע במרחב פנוי הקרוב ביותר למחם, מבין את שפותיך, ממלא את פקודותיך, ומקבל את תורו מיד אחריך בספירת היוזמה שלך. היסודן נעלם לאחר 1 שעה, כשהוא מת או כשאתה משחרר אותו בפעולה נוספת. אי אפשר להשתמש במחם בדרך זו שוב עד עלות השחר הבאה.
- id: brooch-of-shielding
  name: סיכת מגן
  description: |-
    חפץ פלאי

    כשאתה עונד את הסיכה הזאת, יש לך עמידות לנזק כוח קסום, וחסינות לנזק מהלחש טיל קסם.
- id: broom-of-flying
  name: מטאטא מעוף
  description: |-
    חפץ פלאי

    המטאטא העשוי עץ הזה פועל כמטאטא רגיל עד שאתה עומד עליו בפישוק ומבצע פעולת קסם כדי לגרום לו לרחף מתחתיך, ואז אפשר לרכוב עליו באוויר. יש לו מהירות מעוף של 50 רגל. הוא יכול לשאת עד 400 פאונד, אבל מהירות המעוף שלו יורדת ל-30 רגל כשהוא נושא יותר מ-200 פאונד. המטאטא מפסיק לרחף כשאתה נוחת או כשאתה כבר לא רוכב עליו.

    בפעולת קסם אתה יכול לשלוח את המטאטא לנוע לבדו ליעד בטווח 1 מייל ממך, אם אתה נוקב בשם המקום ומכיר אותו. המטאטא חוזר אליך כשאתה מבצע פעולת קסם ומשתמש במילת פקודה, אם המטאטא עדיין בטווח 1 מייל ממך.
- id: candle-of-invocation
  name: נר הזימון
  description: |-
    חפץ פלאי

    קסם הנר הזה מופעל כשהנר מודלק, מה שדורש פעולת קסם. אחרי שהנר בוער במשך 4 שעות, הוא נהרס. אפשר לכבות אותו מוקדם כדי להשתמש בו מאוחר יותר. מקזזים את הזמן שבער במרווחים של 1 דקה מכלל זמן הבעירה שלו.

    כשהנר דולק, הוא פולט אור עמום ברדיוס 30 רגל. כל עוד אתה בתוך האור הזה, יש לך יתרון בבדיקות d20. בנוסף, כוהן או דרואיד שנמצאים באור יכולים להטיל לחשים מדרגה 1 שהכינו מבלי לבזבז תאי לחשים.

    לחלופין, כשאתה מדליק את הנר בפעם הראשונה, אתה יכול להטיל באמצעותו *שער*. הפעולה הזאת הורסת את הנר. השער שהלחש יוצר מקשר למישור חיצוני מסוים שבוחר שליט המבוך או שנקבע בהטלה על הטבלה הבאה.

    | 1d100 | מישור חיצוני |

    |---|---|

    | 01–05 | התהום |

    | 06–10 | אכרון |

    | 11–17 | ארבוריאה |

    | 18–25 | ארקדיה |

    | 26–33 | ארץ החיות |

    | 34–41 | ביטופיה |

    | 42–46 | קרצרי |

    | 47–54 | אליסיום |

    | 55–59 | גהנום |

    | 60–64 | הייד |

    | 65–69 | לימבו |

    | 70–77 | מכאנוס |

    | 78–85 | הר סלסטיה |

    | 86–90 | תשעת הגיהנום |

    | 91–95 | פנדמוניום |

    | 96–00 | יסגרד |
- id: cape-of-the-mountebank
  name: שכמיית השרלטן
  description: |-
    חפץ פלאי

    השכמייה הזאת מדיפה ריח קלוש של גופרית. כשאתה לובש אותה, אתה יכול להשתמש בה כדי להטיל דלת ממדית בפעולת קסם. אי אפשר להשתמש ביכולת הזאת שוב עד עלות השחר הבאה.

    כשאתה מתעתק בעזרת הלחש הזה, אתה משאיר אחריך ענן עשן. המשבצת שעזבת מוסתרת קלות בעשן הזה עד סוף התור הבא שלך.
- id: carpet-of-flying
  name: שטיח מעוף
  description: |-
    חפץ פלאי

    אתה יכול לגרום לשטיח הזה לרחף ולעוף בביצוע פעולת קסם ובשימוש במילת הפקודה של השטיח. הוא נע לפי הוראותיך אם אתה בטווח 30 רגל ממנו.

    קיימים ארבעה גדלים של *שטיח מעוף*. שליט המבוך בוחר את גודלו של שטיח מסוים או קובע אותו אקראית בהטלה על הטבלה הבאה. שטיח יכול לשאת עד פי שניים מהמשקל המצוין בטבלה, אבל מהירות המעוף שלו מתחלקת בשניים אם הוא נושא יותר מהקיבולת הרגילה שלו.

    | 1d100 | גודל | קיבולת | מהירות מעוף |

    |---|---|---|---|

    | 01–20 | 3 רגל × 5 רגל | 200 פאונד | 80 רגל |

    | 21–55 | 4 רגל × 6 רגל | 400 פאונד | 60 רגל |

    | 56–80 | 5 רגל × 7 רגל | 600 פאונד | 40 רגל |

    | 81–00 | 6 רגל × 9 רגל | 800 פאונד | 30 רגל |
- id: censer-of-controlling-air-elementals
  name: מחתת שליטה ביסודני אוויר
  description: |-
    חפץ פלאי

    כשאתה מנענע בעדינות את המחתה הזאת, אתה יכול לבצע פעולת קסם כדי לזמן יסודן אוויר. היסודן מופיע במשבצת פנויה הקרובה ככל האפשר למחתה, מבין את השפות שלך, מציית לפקודותיך ומבצע את תורו מיד אחריך בספירת היוזמה שלך. היסודן נעלם אחרי 1 שעה, כשהוא מת או כשאתה משחרר אותו בפעולה נוספת. אי אפשר להשתמש במחתה בדרך הזאת שוב עד עלות השחר הבאה.
- id: chime-of-opening
  name: פעמון הפתיחה
  description: |-
    חפץ פלאי

    צינור המתכת החלול הזה אורכו כ-1 רגל ומשקלו 1 פאונד. בפעולת קסם אתה יכול להקיש על הפעמון כדי להטיל דפיקה. קול הדפיקה הרגיל של הלחש מוחלף בצליל הצלול והמצלצל של הפעמון, הנשמע עד מרחק 300 רגל.

    אפשר להשתמש בפעמון 10 פעמים. אחרי הפעם העשירית הוא נסדק והופך לחסר תועלת.
- id: circlet-of-blasting
  name: עטרת הפיצוץ
  description: |-
    חפץ פלאי

    כשאתה עונד את העטרה הזאת, אתה יכול להטיל באמצעותה קרן צורבת (+5 לפגיעה). העטרה לא יכולה להטיל את הלחש הזה שוב עד עלות השחר הבאה.
- id: cloak-of-arachnida
  name: גלימת העכבישניים
  description: |-
    חפץ פלאי

    הלבוש המעודן הזה עשוי משי שחור ושזור חוטי כסף קלושים. כשאתה לובש אותו, אתה מקבל את היתרונות הבאים.

    עמידות לרעל. יש לך עמידות לנזק רעל.

    טיפוס עכביש. יש לך מהירות טיפוס השווה למהירות שלך, ואתה יכול לנוע למעלה, למטה ולרוחב על משטחים אנכיים ולאורך תקרות, כשידיך נשארות פנויות.

    הליכת עכביש. אי אפשר ללכוד אותך בקורים מכל סוג, ואתה יכול לנוע דרך קורים כאילו היו תוואי שטח קשה.

    רשת. אתה יכול להטיל רשת קורים (דרגת קושי להצלה 13). הרשת שהלחש יוצר ממלאת פי שניים משטחה הרגיל. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: cloak-of-displacement
  name: גלימת ההסטה
  description: |-
    חפץ פלאי

    כשאתה לובש את הגלימה הזאת, היא מטילה באופן קסום אשליה שגורמת לך להיראות כאילו אתה עומד במקום סמוך למיקומך האמיתי, וכך לכל יצור יש חיסרון בגלגולי התקפה נגדך. אם אתה סופג נזק, היכולת מפסיקה לפעול עד תחילת התור הבא שלך. היכולת מושעית כל עוד המהירות שלך היא 0.
- id: cloak-of-elvenkind
  name: גלימת אלפים
  description: |-
    חפץ פלאי

    כשאתה לובש את הגלימה הזאת, לבדיקות חוכמה (הבחנה) שנעשות כדי לגלות אותך יש חיסרון, ויש לך יתרון בבדיקות זריזות (התגנבות).
- id: cloak-of-protection
  name: גלימת הגנה
  description: |-
    חפץ פלאי

    כשאתה לובש את הגלימה הזאת, אתה מקבל בונוס של +1 לדרגת השריון ולזריקות ההצלה.
- id: cloak-of-the-bat
  name: גלימת העטלף
  description: |-
    חפץ פלאי

    כשאתה לובש את הגלימה, יש לך יתרון בבדיקות זריזות (התגנבות). באזור של אור עמום או חשכה אתה יכול לאחוז בקצוות הגלימה ולהשתמש בה כדי לקבל מהירות מעוף של 40 רגל. אם אתה מפסיק לאחוז בקצוות הגלימה בזמן שאתה עף כך, או אם אתה כבר לא באור עמום או בחשכה, אתה מאבד את מהירות המעוף הזאת.

    כשאתה לובש את הגלימה באזור של אור עמום או חשכה, אתה יכול להטיל על עצמך *שינוי צורה* ולהפוך לעטלף. בצורה הזאת נשארים לך ציוני התבונה, החוכמה והכריזמה שלך. אי אפשר להשתמש בגלימה כך שוב עד עלות השחר הבאה.
- id: cloak-of-the-manta-ray
  name: גלימת המנטה
  description: |-
    חפץ פלאי

    כשאתה לובש את הגלימה הזאת, אתה יכול לנשום מתחת למים, ויש לך מהירות שחייה של 60 רגל.
- id: crystal-ball
  name: כדור בדולח
  description: |-
    חפץ פלאי

    כשאתה נוגע בכדור הבדולח הזה, אתה יכול להטיל באמצעותו *הצצה מרחוק* (דרגת קושי להצלה 17).
- id: crystal-ball-of-mind-reading
  name: כדור בדולח של קריאת מחשבות
  description: |-
    חפץ פלאי

    כשאתה נוגע בכדור הבדולח הזה, אתה יכול להטיל באמצעותו *הצצה מרחוק* (דרגת קושי להצלה 17). בנוסף, אתה יכול להטיל *גילוי מחשבות* (דרגת קושי להצלה 17) על יצורים שאתה רואה בטווח 30 רגל מחיישן הלחש. אינך צריך להתרכז ב*גילוי מחשבות* הזה כדי לקיים אותו למשך זמנו, אבל הוא מסתיים אם *הצצה מרחוק* מסתיים.
- id: crystal-ball-of-telepathy
  name: כדור בדולח של טלפתיה
  description: |-
    חפץ פלאי

    כשאתה נוגע בכדור הבדולח הזה, אתה יכול להטיל באמצעותו *הצצה מרחוק* (דרגת קושי להצלה 17). בנוסף, אתה יכול לתקשר בטלפתיה עם יצורים שאתה רואה בטווח 30 רגל מחיישן הלחש. אתה יכול גם להטיל *שידול* (דרגת קושי להצלה 17) דרך החיישן על אחד מהיצורים האלה. אינך צריך להתרכז ב*שידול* הזה כדי לקיים אותו למשך זמנו, אבל הוא מסתיים אם *הצצה מרחוק* מסתיים. אי אפשר להטיל *שידול* כך שוב עד עלות השחר הבאה.
- id: crystal-ball-of-true-seeing
  name: כדור בדולח של ראיית אמת
  description: |-
    חפץ פלאי

    כשאתה נוגע בכדור הבדולח הזה, אתה יכול להטיל באמצעותו *הצצה מרחוק* (דרגת קושי להצלה 17). בנוסף, יש לך ראיית אמת בטווח 120 רגל שמרכזו בחיישן הלחש.
- id: cube-of-force
  name: קוביית כוח
  description: |-
    חפץ פלאי

    הקובייה הזאת רחבה כאינץ׳ בערך. על כל פאה שלה יש סימן ייחודי. אתה יכול ללחוץ על אחת הפאות, להוציא את מספר המטענים הנדרש לה, ובכך להטיל את הלחש שמשויך אליה (דרגת קושי להצלה 17), כפי שמופיע בטבלת פאות קוביית הכוח.

    הקובייה מתחילה עם 10 מטענים, ובכל עלות שחר היא מחזירה 1d6 מטענים שהוצאו.

    Table: פאות קוביית הכוח

    | לחש | עלות במטענים |

    |---|---|

    | שריון האשף | 1 |

    | מגן | 1 |

    | בקתה זעירה | 3 |

    | מקלט פרטי | 4 |

    | כדור עמיד | 4 |

    | חומת כוח | 5 |
- id: cubic-gate
  name: שער קובייתי
  description: |-
    חפץ פלאי

    הקובייה הזאת רחבה 3 אינץ׳ ופולטת אנרגיה קסומה מוחשית. כל אחת משש פאותיה קשורה למישור קיום אחר, ואחד מהם הוא המישור החומרי. שאר הפאות מקושרות למישורים שקובע שליט המבוך.

    בקובייה יש 3 מטענים, והיא מחזירה 1d3 מטענים שהוצאו בכל עלות שחר. כפעולת קסם, אתה יכול להוציא 1 ממטעני הקובייה כדי להטיל באמצעותה אחד מהלחשים הבאים.

    שער. אתה לוחץ על פאה אחת של הקובייה ומטיל *שער*, ופותח פתח למישור הקיום שקשור לאותה פאה.

    מעבר מישורי. אתה לוחץ פעמיים על פאה אחת של הקובייה ומטיל *מעבר מישורי*, ומעביר את היעדים למישור הקיום שקשור לאותה פאה.
- id: dagger-of-venom
  name: פגיון רעל
  description: |-
    נשק (פגיון)

    אתה מקבל בונוס של +1 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה.

    אתה יכול לבצע פעולה נוספת כדי לצפות את הלהב ברעל בדרך קסם. הרעל נשאר במשך 1 דקה או עד שהתקפה בנשק הזה פוגעת ביצור. היצור חייב להצליח בזריקת הצלה בחוסן בדרגת קושי 15, ואם לא, הוא סופג 2d10 נזק רעל והופך למורעל למשך 1 דקה. אי אפשר להשתמש בנשק בצורה הזו שוב עד הזריחה הבאה.
- id: dancing-sword
  name: חרב רוקדת
  description: |-
    נשק (חרב גדולה, חרב ארוכה, רפירה, חרב עקומה או חרב קצרה)

    אתה יכול לבצע פעולה נוספת כדי להטיל את הנשק הקסום הזה אל האוויר. כשאתה עושה זאת, הנשק מתחיל לרחף, עף עד 30 רגל ותוקף יצור אחד לבחירתך במרחק 5 רגל ממנו. הנשק משתמש בגלגול ההתקפה שלך ומוסיף את מתאם התכונה שלך לגלגולי הנזק.

    כל עוד הנשק מרחף, אתה יכול לבצע פעולה נוספת כדי לגרום לו לעוף עד 30 רגל אל נקודה אחרת במרחק 30 רגל ממך. כחלק מאותה פעולה נוספת אתה יכול לגרום לנשק לתקוף יצור אחד במרחק 5 רגל מהנשק. אחרי שהנשק המרחף תוקף בפעם הרביעית, הוא עף חזרה אליך ומנסה לחזור אל ידך. אם אין לך יד פנויה, הנשק נופל אל הקרקע במרחב שלך. אם אין לנשק נתיב פנוי אליך, הוא מתקרב אליך ככל שהוא יכול ואז נופל אל הקרקע. הוא גם חדל לרחף אם אתה אוחז בו או אם אתה רחוק ממנו יותר מ-30 רגל.
- id: decanter-of-endless-water
  name: קנקן המים האינסופיים
  description: |-
    חפץ פלאי

    הבקבוק הסגור הזה מקשקש כשמנערים אותו, כאילו יש בו מים. הקנקן שוקל 2 פאונד.

    אתה יכול לבצע פעולת קסם כדי להסיר את הפקק ולהגיד אחת משלוש מילות פקודה, ואז כמות של מים מתוקים או מים מלוחים (לבחירתך) נשפכת מהבקבוק. המים חדלים לזרום בתחילת התור הבא שלך. בחר מבין מילות הפקודה הבאות: התזה. הקנקן מפיק 1 גלון מים. מזרקה. הקנקן מפיק 5 גלונים מים. גייזר. הקנקן מפיק 30 גלונים מים שפורצים בקו באורך 30 רגל וברוחב 1 רגל. אם אתה מחזיק בקנקן, אתה יכול לכוון את הגייזר לכיוון אחד (ללא צורך בפעולה). יצור אחד לבחירתך בקו חייב להצליח בזריקת הצלה בכוח בדרגת קושי 13, ואם לא, הוא סופג 1d4 נזק מוחץ והופך לשרוע. במקום יצור, אתה יכול לכוון אל חפץ אחד בקו שאינו לבוש או נישא ושוקל לא יותר מ-200 פאונד. הגייזר מפיל את החפץ.
- id: deck-of-illusions
  name: חפיסת אשליות
  description: |-
    חפץ פלאי

    הקופסה הזו מכילה סט קלפים. חפיסה מלאה מונה 34 קלפים: 32 מציגים יצורים מסוימים ושניים בעלי משטח מראה. חפיסה שנמצאת כאוצר חסרים בה בדרך כלל 1d20 − 1 קלפים.

    קסם החפיסה פועל רק אם הקלפים נשלפים באקראי. אתה יכול לבצע פעולת קסם כדי לשלוף קלף באקראי מהחפיסה ולזרוק אותו אל הקרקע בנקודה במרחק 30 רגל ממך. אשליה של יצור, שנקבע בגלגול בטבלת חפיסת אשליות, נוצרת מעל הקלף שנזרק וקיימת עד שמבטלים אותה. היצור המדומה שיוצר הקלף נראה ומתנהג כיצור אמיתי מסוגו, אלא שאינו יכול לגרום כל נזק. כל עוד אתה במרחק 120 רגל מהיצור המדומה ויכול לראות אותו, אתה יכול לבצע פעולת קסם כדי להזיז אותו לכל מקום במרחק 30 רגל מהקלף שלו.

    כל מגע פיזי עם היצור המדומה מגלה שהוא כוזב, כי חפצים עוברים דרכו. יצור שמבצע פעולת עיון כדי לבחון את היצור המדומה בעיניו מזהה אותו כאשליה בבדיקת תבונה (חקירה) מוצלחת בדרגת קושי 15. האשליה נמשכת עד שהקלף שלה מוזז או עד שהאשליה מבוטלת (בלחש *ביטול קסם* או באפקט דומה). כשהאשליה מסתיימת, התמונה שעל הקלף נעלמת, ואי אפשר להשתמש בקלף שוב.

    טבלה: חפיסת אשליות

    | 1d100 | אשליה* |

    |---|---|

    | 01–03 | דרקון אדום בוגר |

    | 04–06 | אשף עליון |

    | 07–09 | מתנקש |

    | 10–12 | קפטן שודדים |

    | 13–15 | בזיליסק |

    | 16–18 | ברסרקר |

    | 19–21 | באגבר לוחם |

    | 22–24 | ענק ענן |

    | 25–27 | דרואיד |

    | 28–30 | אריניס |

    | 31–33 | אטין |

    | 34–36 | ענק אש |

    | 37–39 | ענק כפור |

    | 40–42 | גנול לוחם |

    | 43–45 | גובלין לוחם |

    | 46–48 | נאגה שומרת |

    | 49–51 | ענק גבעות |

    | 52–54 | לוחם הובגובלין |

    | 55–57 | אינקובוס |

    | 58–60 | גולם ברזל |

    | 61–63 | אביר |

    | 64–66 | קובולד לוחם |

    | 67–69 | ליץ׳ |

    | 70–72 | מדוזה |

    | 73–75 | מכשפת לילה |

    | 76–78 | אוג׳ר |

    | 79–81 | אוני |

    | 82–84 | כומר |

    | 85–87 | סוקובוס |

    | 88–90 | טרול |

    | 91–93 | לוחם ותיק |

    | 94–96 | וויברן |

    | 97–00 | מושך הקלף |

    \*נתוני היצורים האלה (פרט למושך הקלף) מופיעים ב"יצורים".
- id: defender
  name: נשק המגן
  description: |-
    נשק (כל נשק קרב פנים אל פנים)

    אתה מקבל בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה.

    בפעם הראשונה שאתה תוקף עם הנשק בכל אחד מהתורות שלך, אתה יכול להעביר חלק מהבונוס של הנשק, או את כולו, אל דרגת השריון שלך. לדוגמה, אתה יכול להפחית את הבונוס לגלגולי ההתקפה ולגלגולי הנזק ל-+1 ולקבל בונוס של +2 לדרגת השריון. הבונוסים המותאמים נשארים בתוקף עד תחילת התור הבא שלך, אך עליך להחזיק בנשק כדי לקבל ממנו בונוס לדרגת שריון.
- id: demon-armor
  name: שריון שדים
  description: |-
    שריון (כל קל, בינוני או כבד)

    כל עוד אתה לובש את השריון הזה, אתה מקבל בונוס של +1 לדרגת השריון, ואתה יודע שפת התהום. בנוסף, כפפות השריון עם הטפרים מאפשרות למכות הלא חמושות שלך לגרום 1d8 נזק חותך במקום הנזק המוחץ הרגיל, ואתה מקבל בונוס של +1 לגלגולי ההתקפה והנזק של המכות הלא חמושות שלך.

    קללה. ברגע שאתה לובש את השריון המקולל הזה, אינך יכול להסיר אותו אלא אם כן לחש *הסרת קללה* או קסם דומה מכוונים עליך. כל עוד אתה לובש את השריון, יש לך חיסרון בגלגולי התקפה נגד שדים ובזריקות הצלה נגד הלחשים והיכולות המיוחדות שלהם.
- id: dimensional-shackles
  name: אזיקים ממדיים
  description: |-
    חפץ פלאי

    אתה יכול לבצע פעולת שימוש כדי להניח את האזיקים האלה על יצור שמצבו חסר יכולת פעולה. האזיקים מתאימים את עצמם ליצור בגודל קטן עד גדול. האזיקים מונעים מיצור הכבול בהם להשתמש בכל שיטה של תנועה חוץ-ממדית, כולל שיגור או מסע למישור קיום אחר. הם אינם מונעים מהיצור לעבור דרך שער בין-ממדי.

    אתה וכל יצור שתייעד בעת השימוש באזיקים יכולים לבצע פעולת שימוש כדי להסיר אותם. פעם ב-30 ימים היצור הכבול יכול לבצע בדיקת כוח (אתלטיקה) בדרגת קושי 30. אם הבדיקה מצליחה, היצור משתחרר והורס את האזיקים.
- id: dragon-orb
  name: כדור דרקון
  description: |-
    חפץ פלאי

    הכדור הוא גלובוס גביש חרוט בקוטר של כ-10 אינץ׳. כשמשתמשים בו, הוא גדל לקוטר של כ-20 אינץ׳, וערפל מסתחרר בתוכו.

    כל עוד אתה מותאם לכדור, אתה יכול לבצע פעולת קסם כדי להציץ אל עומקיו. עליך אז לבצע זריקת הצלה בכריזמה בדרגת קושי 15. אם ההצלה מצליחה, אתה שולט בכדור כל עוד אתה נשאר מותאם אליו. אם ההצלה נכשלת, הכדור מטיל עליך את המצב מוקסם כל עוד אתה נשאר מותאם אליו.

    כל עוד אתה מוקסם על ידי הכדור, אינך יכול לסיים מרצונך את ההתאמה שלך אליו, והכדור מטיל עליך את *שידול* כרצונו (דרגת קושי להצלה 18) ומדרבן אותך לפעול למען המטרות הרעות שהוא חפץ בהן. מהות הדרקון שבתוך הכדור עשויה לרצות דברים רבים: השמדת חברה או ארגון מסוימים, חופש מהכדור, הפצת סבל בעולם, קידום פולחן טיאמת, או כל דבר אחר שהשליט המבוך קובע.

    **_לחשים._** בכדור יש 7 מטענים, והוא מחזיר 1d4 + 3 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה שולט בכדור, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות במטענים |

    |---|---|

    | ריפוי פצעים (גרסת דרגה 9) | 4 |

    | אור יום | 1 |

    | הגנה מפני מוות | 2 |

    | גילוי קסם | 0 |

    | הצצה מרחוק (דרגת קושי להצלה 18) | 3 |

    **_קריאה לדרקונים._** כל עוד אתה שולט בכדור, אתה יכול לבצע פעולת קסם כדי לגרום לכדור לשלוח קריאה טלפתית שמתפשטת לכל הכיוונים למרחק 40 מייל. דרקונים כרומטיים בטווח חשים הכרח להגיע אל הכדור בהקדם האפשרי בדרך הישירה ביותר. אלוהויות דרקון כמו טיאמת אינן מושפעות מהקריאה הזו. דרקונים כרומטיים שנמשכו אל הכדור עשויים להיות עוינים כלפיך על שהכרחת אותם בניגוד לרצונם. ברגע שהשתמשת ביכולת הזו, אי אפשר להשתמש בה שוב במשך 1 שעה.

    **_השמדת כדור._** ל*כדור דרקון* יש דרגת שריון 20 והוא נהרס אם הוא סופג נזק מ*נשק +3* או מלחש *התפוררות*. שום דבר אחר אינו יכול לפגוע בו.
- id: dragon-scale-mail
  name: שריון קשקשי דרקון
  description: |-
    שריון (שריון קשקשים)

    *שריון קשקשי דרקון* עשוי מקשקשי דרקון מסוג אחד. לפעמים דרקונים אוספים את הקשקשים שהשירו ומעניקים אותם במתנה. לפעמים ציידים משמרים בקפידה את עורו של דרקון מת. בכל מקרה, *שריון קשקשי דרקון* נחשב ליקר ערך מאוד.

    כל עוד אתה לובש את השריון הזה, אתה מקבל בונוס של +1 לדרגת השריון, יש לך יתרון בזריקות הצלה נגד נשימות הנשק של דרקונים, ויש לך עמידות לסוג נזק אחד שנקבע לפי סוג הדרקון שסיפק את הקשקשים (ראה את הטבלה המצורפת).

    בנוסף, אתה יכול למקד את חושיך בפעולת קסם כדי לזהות את המרחק והכיוון אל הדרקון הקרוב ביותר במרחק 30 מייל ממך שהוא מאותו סוג כמו השריון. אי אפשר להשתמש בפעולה הזו שוב עד הזריחה הבאה.

    | דרקון | עמידות |

    |---|---|

    | שחור | חומצה |

    | כחול | ברק |

    | פליז | אש |

    | ארד | ברק |

    | נחושת | חומצה |

    | זהב | אש |

    | ירוק | רעל |

    | אדום | אש |

    | כסף | קור |

    | לבן | קור |
- id: dragon-slayer
  name: קטלן דרקונים
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    אתה מקבל בונוס של +1 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה.

    הנשק גורם 3d6 נזק נוסף מסוג הנזק של הנשק אם היעד הוא דרקון.
- id: dust-of-disappearance
  name: אבק היעלמות
  description: |-
    חפץ פלאי

    האבקה הזו דומה לחול דק. יש בה מספיק לשימוש אחד. כשאתה מבצע פעולת שימוש כדי לזרוק את האבק לאוויר, אתה וכל יצור וחפץ בהילה של 10 רגל שמקורה בך הופכים לבעלי מצב בלתי נראה למשך 2d4 דקות. משך הזמן זהה לכל הנפגעים, והאבק נצרך כשהקסם שלו נכנס לתוקף. מיד אחרי שיצור מושפע מגלגל גלגול התקפה, גורם נזק או מטיל לחש, מצב בלתי נראה מסתיים אצלו.
- id: dust-of-dryness
  name: אבק יובש
  description: |-
    חפץ פלאי

    החבילה הקטנה הזו מכילה 1d6 + 4 קמצוצי אבק. כפעולת שימוש, אתה יכול לפזר קמצוץ אבק מעל מים, וכך להפוך קובייה של מים בגודל של עד 15 רגל לכדור קטן אחד בגודל גולה, שצף או נח סמוך למקום שבו פוזר האבק. משקלו של הכדור זניח. יצור יכול לבצע פעולת שימוש כדי לנפץ את הכדור על משטח קשה, וכך הכדור מתנפץ ומשחרר את המים שהאבק ספג. פעולה זו משמידה את הכדור ומסיימת את הקסם שלו.

    כפעולת שימוש, אתה יכול לפזר קמצוץ אבק על יסודן שנמצא במרחק של עד 5 רגל ממך ומורכב ברובו ממים (כגון יסודן מים). יצור כזה שנחשף לקמצוץ האבק מטיל הצלה של חוסן בדרגת קושי 13, וסופג 10d6 נזק נקרוטי בהצלה כושלת, או חצי מהנזק בהצלה מוצלחת.
- id: dust-of-sneezing-and-choking
  name: אבק התעטשות וחנק
  description: |-
    חפץ פלאי

    האבקה הזו, שנמצאת במיכל קטן, דומה לאבק היעלמות, וזיהוי מגלה שהיא אכן כזו. יש בה מספיק לשימוש אחד.

    כפעולת שימוש, אתה יכול לזרוק את האבק לאוויר, וכך אתה וכל יצור בהילה של 30 רגל שמקורה בך נאלצים להטיל הצלה של חוסן בדרגת קושי 15. יציר כפיים, יסודן, רפש, צמח ואל-מת מצליחים בהצלה באופן אוטומטי.

    בהצלה כושלת, היצור מתחיל להתעטש בלי שליטה; הוא חסר יכולת פעולה ונחנק. היצור חוזר על ההצלה בסוף כל תור שלו, והאפקט מסתיים עליו בהצלחה. האפקט מסתיים גם על כל יצור שמושפע מהלחש הבראה פחותה.
- id: dwarven-plate
  name: שריון לוחות גמדי
  description: |-
    שריון (שריון חצי-לוחות או שריון לוחות)

    בזמן שאתה לובש את השריון הזה, אתה מקבל בונוס של +2 לדרגת השריון. בנוסף, אם אפקט מזיז אותך בעל כורחך לאורך הקרקע, אתה יכול לבצע פעולת תגובה כדי להקטין את המרחק שבו אתה מוזז בעד 10 רגל.
- id: dwarven-thrower
  name: פטיש זריקה גמדי
  description: |-
    נשק (פטיש קרב)

    אתה מקבל בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים עם הנשק הקסום הזה. יש לו תכונת הטלה עם טווח רגיל של 20 רגל וטווח ארוך של 60 רגל. כשאתה פוגע בהתקפת טווח בנשק הזה, הוא גורם 1d8 נזק כוח נוסף, או 2d8 נזק כוח נוסף אם המטרה היא ענק. מיד אחרי שפגע או החטיא, הנשק עף חזרה אל ידך.
- id: efficient-quiver
  name: אשפה יעילה
  description: |-
    חפץ פלאי

    כל אחד משלושת התאים של האשפה מחובר למרחב חוץ-ממדי, שמאפשר לה להכיל פריטים רבים מבלי שמשקלה יעלה על 2 פאונד. התא הקצר ביותר יכול להכיל עד 60 חיצים, חיצי קשת מכנית או חפצים דומים. התא הבינוני מכיל עד 18 כידונים או חפצים דומים. התא הארוך ביותר מכיל עד 6 חפצים ארוכים, כגון קשתות, מקלות או חניתות.

    אתה יכול לשלוף כל פריט שבאשפה כאילו אתה עושה זאת מאשפה רגילה או מנדן.
- id: efreeti-bottle
  name: בקבוק האפריט
  description: |-
    חפץ פלאי

    כשאתה מבצע פעולת קסם כדי להסיר את הפקק של בקבוק הפליז הצבוע הזה, ענן עשן סמיך נשפך ממנו. בסוף תורך העשן נעלם בהבזק של אש לא מזיקה, ו**אפריט** מופיע במרחב פנוי בטווח 30 רגל ממך.

    בפעם הראשונה שהבקבוק נפתח, שליט המבוך מטיל על הטבלה הבאה כדי לקבוע מה קורה.

    | 1d10 | אפקט |

    |---|---|

    | 1 | האפריט תוקף אותך. אחרי לחימה של 5 סיבובים, האפריט נעלם והבקבוק מאבד את הקסם שלו. |

    | 2–9 | האפריט מבין את השפות שלך וממלא את פקודותיך במשך 1 שעה, ואז חוזר אל הבקבוק, ופקק חדש כולא אותו. אי אפשר להסיר את הפקק במשך 24 שעות. בשתי הפעמים הבאות שהבקבוק נפתח, מתרחש אותו אפקט. אם הבקבוק נפתח בפעם הרביעית, האפריט בורח ונעלם, והבקבוק מאבד את הקסם שלו. |

    | 10 | האפריט מבין את השפות שלך ויכול להטיל עבורך *משאלה* פעם אחת. הוא נעלם כשהוא מגשים את המשאלה או אחרי 1 שעה, והבקבוק מאבד את הקסם שלו. |
- id: elemental-gem
  name: אבן יסוד
  description: |-
    חפץ פלאי

    האבן הזו מכילה גרגיר של אנרגיה יסודית. כשאתה מבצע פעולת שימוש כדי לשבור את האבן, יסודן מוזמן (ראה "מפלצות" לגבי גוש הנתונים שלו), והאבן חדלה להיות קסומה. היסודן מופיע במרחב פנוי הקרוב ביותר לאבן השבורה, מבין את השפות שלך, ממלא את פקודותיך ומבצע את תורו מיד אחריך בספירת היוזמה שלך. היסודן נעלם אחרי 1 שעה, כשהוא מת או כשאתה משחרר אותו בפעולה נוספת. סוג האבן קובע את היסודן, כפי שמוצג בטבלה הבאה.

    | אבן | יסודן מוזמן |

    |---|---|

    | ספיר כחול | יסודן אוויר |

    | אזמרגד | יסודן מים |

    | קורונד אדום | יסודן אש |

    | יהלום צהוב | יסודן אדמה |
- id: elven-chain
  name: שריון שרשראות אלפי
  description: |-
    שריון (שריון שרשראות או חולצת שרשראות)

    אתה מקבל בונוס של +1 לדרגת השריון בזמן שאתה לובש את השריון הזה. אתה נחשב מיומן בשריון הזה גם אם אין לך מיומנות בשריון בינוני או כבד.
- id: eversmoking-bottle
  name: בקבוק העשן הנצחי
  description: |-
    חפץ פלאי

    כפעולת קסם, אתה יכול לפתוח או לסגור את הבקבוק הזה. פתיחת הבקבוק גורמת לעשן סמיך לפרוץ ממנו וליצור ענן שממלא הילה של 60 רגל שמקורה בבקבוק. האזור שבתוך העשן מוסתר מאוד.

    בכל דקה שהבקבוק נשאר פתוח, גודל ההילה גדל ב-10 רגל עד שהוא מגיע לגודל המרבי של 120 רגל.

    סגירת הבקבוק גורמת לענן להיקבע במקומו עד שהוא מתפזר אחרי 10 דקות. רוח חזקה (כמו זו שיוצר הלחש משב רוח) מפזרת את הענן אחרי 1 דקה.
- id: eyes-of-charming
  name: עיני הקסמה
  description: |-
    חפץ פלאי

    העדשות הגבישיות האלה מתאימות על העיניים. יש בהן 3 מטענים. כשאתה עונד אותן, אתה יכול לבזבז לפחות 1 מטען כדי להטיל את הלחש הקסמת אדם (דרגת קושי להצלה 13). תמורת 1 מטען אתה מטיל את הלחש בדרגה 1. אתה מעלה את דרגת הלחש באחת על כל מטען נוסף שאתה מבזבז. העדשות מחזירות את כל המטענים שבוזבזו מדי יום עם עלות השחר.
- id: eyes-of-minute-seeing
  name: עיני הראייה הזעירה
  description: |-
    חפץ פלאי

    העדשות הגבישיות האלה מתאימות על העיניים. כשאתה עונד אותן, הראייה שלך משתפרת מאוד עד טווח של 1 רגל, ומקנה לך ראיית חושך בתוך הטווח הזה ויתרון בבדיקות תבונה (חקירה) שנעשות כדי לבחון דבר מה בתוך הטווח הזה.
- id: eyes-of-the-eagle
  name: עיני הנשר
  description: |-
    חפץ פלאי

    העדשות הגבישיות האלה מתאימות על העיניים. כשאתה עונד אותן, יש לך יתרון בבדיקות חוכמה (הבחנה) שמסתמכות על ראייה. בתנאי ראות צלולים אתה מצליח להבחין בפרטים של יצורים רחוקים ביותר, ושל חפצים ברוחב של 2 רגל בלבד.
- id: feather-token
  name: אסימון נוצה
  description: |-
    חפץ פלאי

    החפץ הזה נראה כמו נוצה. קיימים סוגים שונים של אסימוני נוצה, ולכל אחד מהם השפעה שונה לשימוש חד-פעמי. שליט המבוך בוחר את סוג האסימון או קובע אותו אקראית בהטלה על טבלת אסימוני הנוצה. סוג האסימון קובע את נדירותו.

    עוגן (לא נפוץ). אתה יכול לבצע פעולת קסם כדי לגעת באסימון בסירה או בספינה. במשך 24 השעות הבאות אי אפשר להזיז את כלי השיט בשום אמצעי. נגיעה נוספת של האסימון בכלי השיט מסיימת את ההשפעה. כשההשפעה מסתיימת, האסימון נעלם.

    ציפור (נדיר). אתה יכול לבצע פעולת קסם כדי לזרוק את האסימון 5 רגל לאוויר. האסימון נעלם וציפור ענקית ססגונית תופסת את מקומו. לציפור הנתונים של רוק, אך היא אינה יכולה לתקוף. היא מציית לפקודות פשוטות שלך ויכולה לשאת עד 500 פאונד בעת טיסה במהירותה המרבית (16 מייל לשעה, עד 144 מייל ליום, עם מנוחה של 1 שעה על כל 3 שעות טיסה) או 1,000 פאונד במחצית מהמהירות הזאת. הציפור נעלמת אחרי שטסה את המרחק המרבי ליום או אם נקודות החיים שלה יורדות ל-0. אתה יכול לשחרר את הציפור בפעולת קסם.

    מניפה (לא נפוץ). אם אתה על סירה או על ספינה, אתה יכול לבצע פעולת קסם כדי לזרוק את האסימון עד 10 רגל לאוויר. האסימון נעלם ומניפה ענקית מתנופפת תופסת את מקומו. המניפה מרחפת ויוצרת רוח חזקה. הרוח הזאת יכולה למלא את המפרשים של ספינה אחת ולהגביר את מהירותה ב-5 מייל לשעה במשך 8 שעות. אתה יכול לשחרר את המניפה בפעולת קסם.

    סירת ברבור (נדיר). אתה יכול לבצע פעולת קסם כדי לגעת באסימון במקווה מים ברוחב של 60 רגל לפחות. האסימון נעלם וסירה בצורת ברבור, באורך 50 רגל וברוחב 20 רגל, תופסת את מקומו. הסירה מונעת בכוחות עצמה ונעה על פני המים במהירות של 6 מייל לשעה. כשאתה על הסירה, אתה יכול לבצע פעולת קסם כדי לפקוד עליה לנוע או לפנות עד 90 מעלות. הסירה נשארת למשך 24 שעות ואז נעלמת. אתה יכול לשחרר את הסירה בפעולת קסם.

    עץ (לא נפוץ). אתה חייב להיות בחוץ כדי להשתמש באסימון הזה. אתה יכול לבצע פעולת קסם כדי לגעת בו במרחב פנוי על הקרקע. האסימון נעלם, ובמקומו צומח עץ אלון לא קסום. גובה העץ 60 רגל, קוטר הגזע שלו 5 רגל, והענפים בצמרתו נפרשים ברדיוס של 20 רגל.

    שוט (נדיר). אתה יכול לבצע פעולת קסם כדי לזרוק את האסימון לנקודה בטווח 10 רגל ממך. האסימון נעלם ושוט מרחף תופס את מקומו. לאחר מכן אתה יכול לבצע פעולה נוספת כדי לבצע התקפת לחש בקרב פנים אל פנים נגד יצור בטווח 10 רגל מהשוט, עם בונוס התקפה של +9. בפגיעה היעד סופג 1d6 + 5 נזק כוח קסום.

    בפעולה נוספת אתה יכול להורות לשוט לעוף עד 20 רגל ולחזור על ההתקפה נגד יצור בטווח 10 רגל מהשוט. השוט נעלם אחרי 1 שעה, כשאתה מבצע פעולת קסם כדי לשחרר אותו, או כשאתה מת או נעשה חסר יכולת פעולה.

    אסימוני נוצה

    | 1d100 | אסימון | נדירות |

    |---|---|---|

    | 01-20 | עוגן | לא נפוץ |

    | 21-35 | ציפור | נדיר |

    | 36-50 | מניפה | לא נפוץ |

    | 51-65 | סירת ברבור | נדיר |

    | 66-90 | עץ | לא נפוץ |

    | 91-00 | שוט | נדיר |
- id: figurine-of-wondrous-power
  name: פסלון הכוח הפלאי
  description: |-
    חפץ פלאי

    פסלון הכוח הפלאי הוא פסלון קטן דיו להיכנס לכיס. אם אתה מבצע פעולת קסם כדי לזרוק את הפסלון לנקודה על הקרקע בטווח 60 רגל ממך, הפסלון הופך ליצור חי שמצוין בתיאור הפסלון להלן. אם המקום שבו היה היצור אמור להופיע תפוס על ידי יצורים או חפצים אחרים, או אם אין די מקום ליצור, הפסלון אינו הופך ליצור.

    היצור ידידותי אליך ואל בעלי בריתך. הוא מבין את השפות שלך, מציית לפקודותיך ופועל מיד אחריך בספירת היוזמה שלך. אם אינך נותן פקודות, היצור מגן על עצמו אך אינו נוקט פעולות אחרות.

    היצור קיים למשך זמן הייחודי לכל פסלון. בתום משך הזמן היצור חוזר לצורת פסלון. הוא חוזר לצורת פסלון מוקדם יותר אם נקודות החיים של צורת היצור שלו יורדות ל-0, או אם אתה מבצע פעולת קסם תוך כדי נגיעה ביצור כדי להחזירו לצורת פסלון. כשהיצור הופך שוב לפסלון, אי אפשר להשתמש שוב ביכולת שלו עד שיחלוף פרק זמן מסוים, כמצוין בתיאור הפסלון.

    גריפון הברונזה (נדיר). פסלון הברונזה הזה מציג גריפון בעמידה על רגליו האחוריות. הוא יכול להפוך לגריפון עד 6 שעות. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 5 ימים.

    זבוב האבנון (נדיר). פסלון האבנון הזה, החצוב בדמות זבוב סוס, יכול להפוך לזבוב ענק (ראה גיליון הנתונים הנלווה) עד 12 שעות אפשר לרכוב עליו כעל חיית רכיבה. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 2 ימים. גדול, חיה, חסר נטייה דרגת שריון 11 יוזמה +1 (11) נקודות חיים 19 (3d10 + 3) מהירות 30 רגל, תעופה 60 רגל מתאם הצלה מתאם הצלה מתאם הצלה כוח 14 +2 +2 זריזות 13 +1 +1 חוסן 13 +1 +1 תבונה 2 -4 -4 חוכמה 10 +0 +0 כריזמה 3 -4 -4 חושים ראיית חושך 60 רגל, הבחנה קבועה 10 שפות אין אתגר 0 (נק״נ 0; תוסף שליטה +2)

    אריות הזהב (נדיר). פסלוני הזהב האלה של אריות נוצרים תמיד בזוגות. אתה יכול להשתמש בפסלון אחד או בשניהם בו-זמנית. כל אחד יכול להפוך לאריה עד 1 שעה. לאחר ששימשת באריה, אי אפשר להשתמש בו שוב עד שיחלפו 7 ימים.

    עזי השנהב (נדיר). פסלוני השנהב האלה של עזים נוצרים תמיד בקבוצות של שלושה. כל עז נראית שונה ופועלת באופן שונה מהאחרות. תכונותיהן הן אלה: עז האימה. הפסלון הזה יכול להפוך לעז ענקית עד 3 שעות. העז אינה יכולה לתקוף, אבל אתה יכול להסיר את קרניה (בלי לפגוע בהן) ולהשתמש בהן כנשקים. קרן אחת הופכת לרומח פרשים +1, והאחרת הופכת לחרב ארוכה +2. הסרת קרן דורשת פעולת קסם, והנשקים נעלמים והקרניים חוזרות כשהעז חוזרת לצורת פסלון. כל עוד אתה רוכב על העז, כל יצור עוין שמתחיל את תורו בהילה של 30 רגל היוצאת מהעז חייב להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, או לקבל את המצב מבוהל למשך 1 דקה, עד שאתה מפסיק לרכוב על העז, או עד שהעז חוזרת לצורת פסלון. היצור המבוהל חוזר על ההצלה בסוף כל אחד מתוריו, ומסיים את ההשפעה על עצמו בהצלחה. לאחר שהצליח בהצלה, היצור חסין להשפעה הזאת ל-24 השעות הבאות. לאחר שהשתמשת בפסלון, אי אפשר להשתמש בו שוב עד שיחלפו 15 ימים. עז הנסיעות. הפסלון הזה יכול להפוך לעז גדולה עם אותם נתונים כמו של סוס רכיבה. יש לו 24 מטענים, וכל שעה או חלק ממנה שהוא מבלה בצורת עז עולים 1 מטען. כל עוד יש לו מטענים, אתה יכול להשתמש בו בתדירות שתרצה. כשהמטענים אוזלים, הוא חוזר לצורת פסלון ואי אפשר להשתמש בו שוב עד שיחלפו 7 ימים, ואז הוא מחזיר את כל המטענים שבוזבזו. עז העמל. הפסלון הזה יכול להפוך לעז ענקית עד 3 שעות. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 30 ימים.

    פיל השיש (נדיר). פסלון השיש הזה דומה לפיל שמריע בחדק. הוא יכול להפוך לפיל עד 24 שעות. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 7 ימים.

    סוס האובסידיאן (נדיר מאוד). סוס האובסידיאן המלוטש הזה יכול להפוך לסוס סיוט עד 24 שעות. סוס הסיוט נלחם רק כדי להגן על עצמו. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 5 ימים.

    בכל פעם שאתה משתמש בפסלון יש סיכוי של 10 אחוז שהוא יתעלם מהפקודות שלך, כולל פקודה לחזור לצורת פסלון. אם אתה רוכב על סוס הסיוט בזמן שהוא מתעלם מהפקודות שלך, אתה וסוס הסיוט מועברים מיד למקום אקראי במישור הייד, ושם סוס הסיוט חוזר לצורת פסלון.

    כלב האוניקס (נדיר). פסלון האוניקס הזה של כלב יכול להפוך למסטיף עד 6 שעות. התבונה של המסטיף היא 8 והוא יכול לדבר בשפה משותפת. יש לו גם אל-ראייה בטווח של 60 רגל. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 7 ימים.

    ינשוף הסרפנטין (נדיר). פסלון הסרפנטין הזה של ינשוף יכול להפוך לינשוף ענק עד 8 שעות. הינשוף יכול לתקשר איתך בטלפתיה בכל טווח אם אתה והוא נמצאים באותו מישור קיום. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 2 ימים.

    עורב הכסף (לא נפוץ). פסלון הכסף הזה של עורב יכול להפוך לעורב עד 12 שעות. לאחר שהשתמשת בו, אי אפשר להשתמש בו שוב עד שיחלפו 2 ימים. כל עוד הוא בצורת עורב, הפסלון מקנה לך את היכולת להטיל עליו את הלחש חיה שליחה.
- id: flame-tongue
  name: לשון להבה
  description: |-
    נשק (כל נשק קרב פנים אל פנים)

    כשאתה מחזיק בנשק הקסום הזה, אתה יכול לבצע פעולה נוספת ולהשתמש במילת פקודה כדי לגרום ללהבות לעטוף את החלק של הנשק שגורם נזק. הלהבות האלה פולטות אור בהיר ברדיוס 40 רגל ואור עמום ל-40 רגל נוספות. כל עוד הנשק בוער, הוא גורם 2d6 נזק אש נוסף בפגיעה. הלהבות נמשכות עד שאתה מבצע פעולה נוספת כדי לתת שוב את הפקודה, או עד שאתה מפיל את הנשק, מכניס אותו לנרתיק או מחזיר אותו לנדן.
- id: folding-boat
  name: סירה מתקפלת
  description: |-
    חפץ פלאי

    החפץ הזה נראה כקופסת עץ באורך 12 אינץ׳, ברוחב 6 אינץ׳ ובעומק 6 אינץ׳. היא שוקלת 4 פאונד וצפה. אפשר לפתוח אותה כדי לאחסן בה חפצים. לחפץ הזה יש גם שלוש מילות פקודה, וכל אחת מהן דורשת פעולת קסם: מילת הפקודה הראשונה. הקופסה נפתחת לסירת משוטים. מילת הפקודה השנייה. הקופסה נפתחת לסירת קיל. מילת הפקודה השלישית. הסירה המתקפלת מתקפלת חזרה לקופסה אם אין יצורים על סיפונה. חפצים בכלי השיט שאינם נכנסים לקופסה נשארים מחוץ לקופסה כשהיא מתקפלת. חפצים בכלי השיט שנכנסים לקופסה נכנסים אליה. כשהקופסה הופכת לכלי שיט, משקלה הופך למשקל של כלי שיט רגיל בגודלה, וכל מה שאוחסן בקופסה נשאר בסירה.

    הנתונים של סירת המשוטים ושל סירת הקיל מופיעים ב"ציוד". אם אחד מכלי השיט האלה מגיע ל-0 נקודות חיים, הסירה המתקפלת נהרסת.
- id: frost-brand
  name: להב כפור
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה, רפירה, חרב עקומה או חרב קצרה)

    כשאתה פוגע בגלגול התקפה בנשק הקסום הזה, היעד סופג 1d6 נזק קור נוסף. בנוסף, כל עוד אתה מחזיק בנשק, יש לך עמידות לנזק אש.

    בטמפרטורות קפיאה הנשק פולט אור בהיר ברדיוס 10 רגל ואור עמום ל-10 רגל נוספות.

    כשאתה שולף את הנשק הזה, אתה יכול לכבות את כל הלהבות הלא קסומות בטווח 30 רגל ממך. לאחר השימוש, אי אפשר להשתמש ביכולת הזאת שוב במשך 1 שעה.
