    | 97–00 | איל ניגוח נייד |
- id: rod-of-absorption
  name: מטה קצר ספיגה
  description: |-
    מטה קצר

    כל עוד אתה מחזיק במטה הקצר הזה, אתה יכול לבצע פעולת תגובה כדי לספוג לחש שמכוון רק אליך ואינו יוצר שטח השפעה. השפעת הלחש הנספג מתבטלת, ואנרגיית הלחש, ולא הלחש עצמו, נשמרת במטה הקצר. לאנרגיה יש אותה דרגה שהייתה ללחש כשהוטל. לחש מבוטל מתפוגג ללא השפעה, וכל המשאבים ששימשו להטלתו מבוזבזים. המטה הקצר יכול לספוג ולאגור עד 50 דרגות של אנרגיה במהלך קיומו. משנספגו בו 50 דרגות של אנרגיה, הוא אינו יכול לספוג עוד. אם אתה מטרה של לחש שהמטה הקצר אינו יכול לאגור, המטה הקצר אינו משפיע על הלחש הזה.

    כשאתה מתאים את עצמך למטה הקצר, אתה יודע כמה דרגות של אנרגיה הוא ספג במהלך קיומו וכמה דרגות של אנרגיית לחש הוא אוגר כעת.

    אם אתה מטיל לחשים ומחזיק במטה הקצר, אתה יכול להמיר אנרגיה שנאגרה בו לתאי לחשים כדי להטיל לחשים שהכנת או שאתה מכיר. אתה יכול ליצור תאי לחשים רק מדרגה השווה לדרגת תאי הלחשים שלך או נמוכה ממנה, עד מקסימום של דרגה 5. אתה משתמש בדרגות האגורות במקום בתאים שלך, אך מטיל את הלחש כרגיל בשאר הדברים. לדוגמה, אתה יכול להשתמש ב-3 דרגות שאגורות במטה הקצר כתא לחשים מדרגה 3.

    מטה קצר שנמצא זה עתה מכיל בדרך כלל 1d10 דרגות של אנרגיית לחש. מטה קצר שאינו יכול עוד לספוג אנרגיית לחש ואין בו אנרגיה שנותרה חדל להיות קסום.
- id: rod-of-alertness
  name: מטה קצר ערנות
  description: |-
    מטה קצר

    למטה קצר זה התכונות הבאות.

    ערנות. כל עוד אתה מחזיק במטה הקצר, יש לך יתרון בבדיקות חוכמה (הבחנה) ובגלגולי יוזמה.

    לחשים. כל עוד אתה מחזיק במטה הקצר, אתה יכול להטיל ממנו את הלחשים הבאים:• גילוי רע וטוב• גילוי קסם• גילוי רעל ומחלה• ראיית הבלתי נראה

    הילת הגנה. בפעולת קסם אתה יכול לנעוץ את קצה הידית של המטה הקצר באדמה, ומיד ראש המטה פולט אור בהיר ברדיוס 60 רגל ואור עמום ל-60 רגל נוספות. כל עוד אתה ובני בריתך נמצאים באור הבהיר הזה, אתם מקבלים בונוס של +1 לדרגת השריון ולזריקות הצלה, ויכולים לחוש את מיקומו של כל יצור בלתי נראה הנמצא גם הוא באור הבהיר.

    ראש המטה הקצר מפסיק לזהור וההשפעה מסתיימת לאחר 10 דקות או כשיצור מבצע פעולת קסם כדי לשלוף את המטה הקצר מהאדמה. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: rod-of-lordly-might
  name: מטה קצר עוצמה אדונית
  description: |-
    מטה קצר

    למטה קצר זה ראש מלוטש, והוא פועל כאלה קסומה המעניקה בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים בו. למטה הקצר יש תכונות הקשורות לשישה כפתורים שונים הערוכים בשורה לאורך הידית. יש לו גם שלוש תכונות נוספות, המפורטות להלן.

    כפתורים. אתה יכול ללחוץ על אחד הכפתורים הבאים בפעולה נוספת; השפעת הכפתור נמשכת עד שתלחץ על כפתור אחר או עד שתלחץ שוב על אותו כפתור, מה שגורם למטה הקצר לחזור לצורתו הרגילה:כפתור 1. להב לוהט צומח מהקצה שמול ראש המטה הקצר. הלהבות פולטות אור בהיר ברדיוס 40 רגל ואור עמום ל-40 רגל נוספות, והלהב פועל כחרב ארוכה קסומה או כחרב קצרה קסומה (לבחירתך) הגורם 2d6 נזק אש נוסף בפגיעה.כפתור 2. ראש המטה הקצר מתקפל כלפי מטה ושני להבים בצורת סהר נפתחים, והופכים את המטה הקצר לגרזן קרב קסום המעניק בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים בו.כפתור 3. ראש המטה הקצר מתקפל כלפי מטה, חוד חנית יוצא מקצה המטה הקצר, והידית מתארכת לידית באורך 6 רגל, והופכת את המטה הקצר לחנית קסומה המעניקה בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים בה.כפתור 4. המטה הקצר הופך לעמוד טיפוס באורך של עד 50 רגל (אתה קובע את האורך), אף שהכפתורים נשארים בהישג ידך. בשטחים קשים כגרניט, יתד בתחתית ושלושה ווים בראש מעגנים את העמוד.מוטות אופקיים באורך 3 אינץ׳ נפרשים מהצדדים במרווחים של 1 רגל זה מזה ויוצרים סולם. העמוד יכול לשאת עד 4,000 פאונד. משקל גדול מזה או היעדר עיגון יציב גורמים למטה הקצר לחזור לצורתו הרגילה.כפתור 5. המטה הקצר הופך לאיל ניגוח נישא ומעניק למשתמש בו בונוס של +10 לבדיקות כוח (אתלטיקה) שנועדו לפרוץ דלתות, התרסות ומחסומים אחרים.כפתור 6. המטה הקצר מקבל את צורתו הרגילה או נשאר בה, ומצביע על הצפון המגנטי. (דבר אינו קורה אם משתמשים ביכולת הזאת של המטה הקצר במקום שאין בו צפון מגנטי.) המטה הקצר גם מודיע לך על עומקך המשוער מתחת לפני האדמה או על גובהך מעליה.

    ניקוז חיים. כשאתה פוגע ביצור בהתקפת קרב פנים אל פנים עם המטה הקצר, אתה יכול לאלץ את המטרה לבצע זריקת הצלה בחוסן בדרגת קושי 17. אם ההצלה נכשלת, המטרה סובלת 4d6 נזק נקרוטי נוסף, ואתה מחזיר לעצמך נקודות חיים בכמות השווה למחצית מהנזק הנקרוטי הזה. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.

    שיתוק. כשאתה פוגע ביצור בהתקפת קרב פנים אל פנים עם המטה הקצר, אתה יכול לאלץ את המטרה לבצע זריקת הצלה בחוסן בדרגת קושי 17. אם ההצלה נכשלת, המטרה מקבלת את המצב משותק למשך 1 דקה. המטרה חוזרת על ההצלה בסוף כל אחד מתוריה, וההשפעה מסתיימת עליה בהצלחה. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.

    הטלת אימה. כל עוד אתה מחזיק במטה הקצר, אתה יכול לבצע פעולת קסם כדי לאלץ כל יצור שאתה רואה במרחק של עד 30 רגל ממך לבצע זריקת הצלה בחוכמה בדרגת קושי 17. אם ההצלה נכשלת, המטרה מקבלת את המצב מבוהל למשך 1 דקה. מטרה מבוהלת חוזרת על ההצלה בסוף כל אחד מתוריה, והשפעה מסתיימת עליה בהצלחה. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: rod-of-rulership
  name: מטה קצר שלטון
  description: |-
    מטה קצר

    אתה יכול לבצע פעולת קסם כדי להציג את המטה הקצר ולדרוש ציות מכל יצור לבחירתך שאתה רואה במרחק של עד 120 רגל ממך.כל מטרה חייבת להצליח בזריקת הצלה בחוכמה בדרגת קושי 15, או לקבל את המצב מוקסם למשך 8 שעות. כל עוד היצור מוקסם בדרך זו, הוא רואה בך מנהיג מהימן. אם אתה או בני בריתך פוגעים בו, או אם פוקדים עליו לעשות דבר הנוגד את טבעו, המטרה חדלה להיות מוקסמת בדרך זו. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.
- id: rod-of-security
  name: מטה קצר מקלט
  description: |-
    מטה קצר

    כל עוד אתה מחזיק במטה הקצר הזה, אתה יכול לבצע פעולת קסם כדי להפעיל אותו. המטה הקצר מעביר מיד אותך ועד 199 יצורים נוספים מרצון שאתה רואה אל מישור כיס. אתה בוחר את הצורה שלובש מישור הכיס. זה יכול להיות גן שליו, פונדק עליז, ארמון עצום, אי טרופי, קרנבל נפלא או כל דבר אחר שתוכל לדמיין. יהיה אופיו אשר יהיה, מישור הכיס מכיל מספיק מים ומזון כדי לקיים את מבקריו, וסביבתו אינה יכולה להזיק לשוהים בו. כל דבר אחר שאפשר לקיים עמו אינטראקציה שם יכול להתקיים רק שם. לדוגמה, פרח שנקטף שם מהגן נעלם אם מוציאים אותו מחוץ למישור הכיס.

    על כל שעה שמבלה במישור הכיס, מבקר מחזיר לעצמו נקודות חיים כאילו הוציא 1 קוביית חיים. כמו כן, יצורים אינם מזדקנים שם, אף שהזמן חולף כרגיל. מבקרים יכולים להישאר שם עד 200 ימים מחולקים במספר היצורים הנוכחיים (עיגול כלפי מטה).

    כשהזמן אוזל או כשאתה מבצע פעולת קסם כדי לסיים את ההשפעה, כל המבקרים מופיעים מחדש במקום שבו היו כשהפעלת את המטה הקצר, או במרחב פנוי הקרוב ביותר אליו. לאחר שהשתמשת ביכולת הזאת, אי אפשר להשתמש בה שוב עד שיעברו 10 ימים.
- id: rope-of-climbing
  name: חבל טיפוס
  description: |-
    חפץ פלאי

    אורך החבל הזה 60 רגל, והוא יכול לשאת עד 3,000 פאונד. כל עוד אתה אוחז בקצה אחד של החבל, אתה יכול לבצע פעולת קסם כדי לפקוד על הקצה השני של החבל להתעורר לחיים ולנוע אל יעד שתבחר, עד מרחק אורך החבל ממך. הקצה הזה נע 10 רגל בתורך כשאתה פוקד עליו לראשונה, ו-10 רגל בתחילת כל אחד מתוריך הבאים, עד שהוא מגיע ליעדו או עד שתורה לו לעצור. אתה יכול גם להורות לחבל להיקשר היטב לחפץ או להתנתק ממנו, להיקשר בקשרים או להתיר את עצמו, או להתכרבל לצורך נשיאה.

    אם אתה מורה לחבל להיקשר בקשרים, מופיעים קשרים גדולים במרווחים של 1 רגל לאורך החבל. כל עוד הוא קשור בקשרים, החבל מתקצר לאורך 50 רגל ומעניק יתרון בבדיקות תכונה שנעשות כדי לטפס בעזרתו. לחבל דרגת שריון 20, 20 נקודות חיים וחסינות לנזק רעל ולנזק נפשי. הוא מחזיר לעצמו 1 נקודת חיים כל 5 דקות כל עוד יש לו לפחות 1 נקודת חיים. אם נקודות החיים של החבל יורדות ל-0, הוא נהרס.
- id: rope-of-entanglement
  name: חבל סבך
  description: |-
    חפץ פלאי

    אורך החבל הזה 30 רגל. כל עוד אתה אוחז בקצה אחד של החבל, אתה יכול לבצע פעולת קסם כדי לפקוד על הקצה השני לזנק קדימה ולסבך יצור אחד שאתה רואה במרחק של עד 20 רגל ממך. המטרה חייבת להצליח בזריקת הצלה בזריזות בדרגת קושי 15, או לקבל את המצב מרוסן. אתה יכול לשחרר את המטרה בכך שתפסיק לאחוז בקצה שלך של החבל (וכך החבל מתכרבל במרחב של המטרה) או בכך שתשתמש בפעולה נוספת כדי לחזור על הפקודה (וכך החבל מתכרבל בידך).

    מטרה שהחבל מרסן יכולה לבצע פעולה ולבחור בין בדיקת כוח (אתלטיקה) לבין בדיקת זריזות (אקרובטיקה) בדרגת קושי 15. אם הבדיקה מצליחה, המטרה אינה מרוסנת עוד על ידי החבל. אם אתה עדיין אוחז בחבל כשמטרה נחלצת ממנו, אתה יכול לבצע פעולת תגובה כדי לפקוד על החבל להתכרבל בידך; אחרת, החבל מתכרבל במרחב של המטרה.

    לחבל דרגת שריון 20, 20 נקודות חיים וחסינות לנזק רעל ולנזק נפשי. הוא מחזיר לעצמו 1 נקודת חיים כל 5 דקות כל עוד יש לו לפחות 1 נקודת חיים. אם נקודות החיים של החבל יורדות ל-0, הוא נהרס.
- id: scarab-of-protection
  name: חרפושית הגנה
  description: |-
    חפץ פלאי

    המדליון הזה בצורת חיפושית מעניק שלושה יתרונות כל עוד הוא עליך.הגנה. אתה מקבל בונוס של +1 לדרגת השריון.

    שימור. לחרפושית 12 מטענים. אם אתה נכשל בזריקת הצלה נגד לחש תאובה או נגד השפעה מזיקה שמקורה באל-מת, אתה יכול לבצע פעולת תגובה כדי לבזבז 1 מטען ולהפוך את ההצלה הכושלת להצלחה. החרפושית מתפוררת לאבק ונהרסת כשהמטען האחרון שלה מבוזבז.

    עמידות בלחשים. יש לך יתרון בזריקות הצלה נגד לחשים.
- id: scimitar-of-speed
  name: חרב עקומה של מהירות
  description: |-
    נשק (חרב עקומה)

    אתה מקבל בונוס של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בנשק הקסום הזה. בנוסף, אתה יכול לבצע איתו התקפה אחת בפעולה נוספת בכל אחד מתוריך.
- id: shield
  name: מגן קסום
  description: |-
    שריון (מגן)

    כל עוד אתה אוחז במגן הזה, יש לך בונוס לדרגת השריון הנקבע לפי נדירות המגן, בנוסף לבונוס הרגיל של המגן לדרגת השריון.
- id: shield-of-missile-attraction
  name: מגן משיכת קליעים
  description: |-
    שריון (מגן)

    כל עוד אתה מחזיק במגן הזה, יש לך עמידות לנזק מהתקפות שבוצעו בנשקי טווח.

    קללה. המגן הזה מקולל. התאמה אליו מקללת אותך עד שמטילים עליך את הלחש *הסרת קללה* או קסם דומה. הסרת המגן אינה מסיימת את הקללה שעליך. בכל פעם שהתקפה בנשק טווח מכוונת ליצור במרחק של עד 10 רגל ממך, הקללה גורמת לכך שאתה תהיה המטרה במקומו.
- id: slippers-of-spider-climbing
  name: נעלי טיפוס עכביש
  description: |-
    חפץ פלאי

    כל עוד אתה נועל את הנעליים הקלות האלה, אתה יכול לנוע למעלה, למטה ולרוחב על משטחים אנכיים ולאורך תקרות, כשידיך נשארות פנויות. יש לך מהירות טיפוס השווה למהירות שלך. עם זאת, הנעליים אינן מאפשרות לך לנוע כך על משטח חלקלק, כמו משטח מכוסה בקרח או בשמן.
- id: sovereign-glue
  name: דבק עליון
  description: |-
    חפץ פלאי

    החומר הדביק והלבן-חלבי הזה יכול ליצור קשר דבק קבוע בין שני חפצים כלשהם. יש לאחסן אותו בצנצנת או בקבוק שצופו מבפנים ב*שמן חלקלקות*. כשמוצאים אותו, המכל מכיל 1d6 + 1 אונקיות.

    אונקיה אחת של הדבק מכסה משטח רבוע שצלעו 1 רגל. מריחת אונקיה של דבק עליון דורשת פעולת שימוש, והדבק שנמרח לוקח 1 דקה להתקשות. משהתקשה, אפשר לשבור את הקשר שיצר רק בהחלת *ממס אוניברסלי* או *שמן אתריות*, או בלחש *משאלה*.
- id: spell-scroll
  name: מגילת לחש
  description: |-
    מגילה

    מגילת לחש נושאת את מילותיו של לחש יחיד, כתובות בצופן מיסטי. אם הלחש נמצא ברשימת הלחשים שלך, אתה יכול לקרוא את המגילה ולהטיל את הלחש שלה בלי רכיבים חומריים. אחרת, המגילה בלתי מובנת. הטלת הלחש בקריאת המגילה דורשת את זמן ההטלה הרגיל של הלחש. משהוטל הלחש, המגילה מתפוררת לאבק. אם ההטלה נקטעת, המגילה אינה אובדת.

    אם הלחש נמצא ברשימת הלחשים שלך אך דרגתו גבוהה מזו שאתה יכול להטיל בדרך כלל, אתה מבצע בדיקת תכונה באמצעות תכונת הטלת הלחשים שלך כדי לקבוע אם הצלחת להטיל אותו. דרגת הקושי שווה ל-10 ועוד דרגת הלחש. בבדיקה שנכשלה, הלחש נעלם מהמגילה בלי כל השפעה אחרת.

    דרגת הלחש שעל המגילה קובעת את דרגת הקושי של זריקת ההצלה ואת בונוס ההתקפה של הלחש, וכן את הנדירות של המגילה, כפי שמופיע בטבלה הבאה.

    | דרגת לחש | נדירות | דרגת קושי להצלה | בונוס התקפה |

    |---|---|---|---|

    | לחשון | נפוץ | 13 | +5 |

    | 1 | נפוץ | 13 | +5 |

    | 2 | לא נפוץ | 13 | +5 |

    | 3 | לא נפוץ | 15 | +7 |

    | 4 | נדיר | 15 | +7 |

    | 5 | נדיר | 17 | +9 |

    | 6 | נדיר מאוד | 17 | +9 |

    | 7 | נדיר מאוד | 18 | +10 |

    | 8 | נדיר מאוד | 18 | +10 |

    | 9 | אגדי | 19 | +11 |

    העתקת מגילה לספר לחשים. אפשר להעתיק לחש אשף שעל מגילת לחש לתוך ספר לחשים. כשלחש מועתק כך, המעתיק חייב להצליח בבדיקת תבונה (מאגיה) בדרגת קושי השווה ל-10 ועוד דרגת הלחש. בבדיקה מוצלחת, הלחש מועתק. בין שהבדיקה מצליחה ובין שנכשלת, מגילת הלחש נהרסת.
- id: spellguard-shield
  name: מגן שומר לחשים
  description: |-
    שריון (מגן)

    כל עוד אתה מחזיק במגן הזה, יש לך יתרון בזריקות הצלה נגד לחשים והשפעות קסומות אחרות, ולגלגולי התקפת לחש נגדך יש חיסרון.
- id: sphere-of-annihilation
  name: כדור הכחדה
  description: |-
    חפץ פלאי

    הכדור השחור הזה, בקוטר 2 רגל, הוא חור במרובד העולמות, הנח ברחיפה בחלל ומיוצב בידי שדה קסום שמקיף אותו.

    הכדור מחסל כל חומר שהוא עובר דרכו וכל חומר שעובר דרכו. חפצי עוצמה הם היוצאים מן הכלל. אלא אם חפץ עוצמה פגיע לנזק מ*כדור הכחדה*, הוא עובר דרך הכדור בלי פגע. כל דבר אחר שנוגע בכדור אך אינו נבלע בו כולו ומחוסל סופג 8d10 נזק כוח קסום.

    **_שליטה בכדור._** *כדור הכחדה* נייח עד שמישהו משתלט עליו. אם אתה במרחק של עד 60 רגל מכדור, אתה יכול לבצע פעולת קסם כדי לבצע בדיקת תבונה (מאגיה) בדרגת קושי 25. בבדיקה מוצלחת, אתה שולט בכדור עד תחילת תורך הבא, ואם הוא היה בשליטת יצור אחר, היצור הזה מאבד שליטה בו. בבדיקה שנכשלת, הכדור נע 10 רגל לעברך בקו ישר.

    כל עוד אתה שולט בכדור, אתה יכול לבצע פעולה נוספת כדי לגרום לו לנוע בכיוון אחד לבחירתך, עד מספר רגל השווה ל-5 כפול מתאם התבונה שלך (מינימום 5 רגל). כל יצור שהכדור נכנס למרחב שלו חייב להצליח בזריקת הצלה בזריזות בדרגת קושי 19, או שהכדור נוגע בו והוא סופג 8d10 נזק כוח קסום. יצור שנקודות החיים שלו יורדות ל-0 בנזק הזה מחוסל, ומשאיר אחריו את רכושו אך לא כל שריד פיזי אחר.

    **_אינטראקציות של הכדור._** אם הכדור בא במגע עם פתח מישורי (כמו זה שנוצר בלחש *שער*) או עם מרחב חוץ-ממדי (כמו זה שבתוך *חור נייד*), שליט המבוך קובע באקראי מה קורה באמצעות הטבלה הבאה.

    | 1d100 | תוצאה |

    |---|---|

    | 01–50 | הכדור נהרס. |

    | 51–85 | הכדור עובר דרך הפתח או נכנס אל המרחב החוץ-ממדי. |

    | 86–00 | קרע מרחבי שולח את הכדור ואת כל יצור וחפץ במרחק של עד 180 רגל ממנו אל מישור קיום אקראי. |
- id: staff-of-charming
  name: מטה הקסם
  description: |-
    מטה

    במטה הזה יש 10 מטענים. כל עוד אתה מחזיק במטה, אתה יכול להשתמש בכל אחת מיכולותיו: הטלת לחש. אתה יכול להוציא 1 ממטעני המטה כדי להטיל ממנו *הקסמת אדם*, *פקודה* או *הבנת שפות* בדרגת הקושי להצלה נגד לחשים שלך. החזרת הקסמה. אם אתה מצליח בזריקת הצלה נגד לחש הקסמה שמכוון רק אליך, אתה יכול לבצע תגובה כדי להוציא 1 מטען מהמטה ולהחזיר את הלחש אל מטילו כאילו אתה הטלת אותו. עמידות להקסמה. אם אתה נכשל בזריקת הצלה נגד לחש הקסמה שמכוון רק אליך, אתה יכול להפוך את ההצלה הכושלת להצלה מוצלחת. אי אפשר להשתמש ביכולת הזאת של המטה שוב עד עלות השחר הבאה.

    התאוששות מטענים. המטה מחזיר 1d8 + 2 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. בהטלה של 1, המטה מתפורר לאבק ונהרס.
- id: staff-of-fire
  name: מטה האש
  description: |-
    מטה

    יש לך עמידות לנזק אש כל עוד אתה מחזיק במטה הזה.

    **_לחשים._** במטה יש 10 מטענים. כל עוד אתה מחזיק במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, בדרגת הקושי להצלה נגד לחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | מחיר במטענים |

    |---|---|

    | ידיים בוערות | 1 |

    | כדור אש | 3 |

    | חומת אש | 4 |

    **_התאוששות מטענים._** המטה מחזיר 1d6 + 4 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. בהטלה של 1, המטה מתפורר לגחלים ונהרס.
- id: staff-of-frost
  name: מטה הכפור
  description: |-
    מטה

    יש לך עמידות לנזק קור כל עוד אתה מחזיק במטה הזה.

    **_לחשים._** במטה יש 10 מטענים. כל עוד אתה מחזיק במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, בדרגת הקושי להצלה נגד לחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | מחיר במטענים |

    |---|---|

    | חרוט הקור | 5 |

    | ענן ערפל | 1 |

    | סופת קרח | 4 |

    | חומת קרח | 4 |

    **_התאוששות מטענים._** המטה מחזיר 1d6 + 4 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. בהטלה של 1, המטה הופך למים ונהרס.
- id: staff-of-healing
  name: מטה הריפוי
  description: |-
    מטה

    במטה הזה יש 10 מטענים. כל עוד אתה מחזיק במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, באמצעות מתאם תכונת הטלת הלחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | מחיר במטענים |

    |---|---|

    | ריפוי פצעים | 1 מטען לכל דרגת לחש (מקסימום 4 ללחש בדרגה 4) |

    | הבראה פחותה | 2 |

    | ריפוי פצעים המוני | 5 |

    **_התאוששות מטענים._** המטה מחזיר 1d6 + 4 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. בהטלה של 1, המטה נעלם בהבזק אור, אבוד לעד.
- id: staff-of-power
  name: מטה העוצמה
  description: |-
    מטה

    במטה יש 20 מטענים, ואפשר להחזיק בו כמטה לחימה קסום שמעניק תוסף של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בו. כל עוד אתה אוחז בו, אתה מקבל תוסף של +2 לדרגת שריון, לזריקות הצלה ולגלגולי התקפת לחש.

    **_לחשים._** כל עוד אתה אוחז במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, תוך שימוש בדרגת הקושי להצלה נגד לחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות מטענים |

    |---|---|

    | חרוט הקור | 5 |

    | כדור אש (גרסת דרגה 5) | 5 |

    | כדור אל-פגיעה | 6 |

    | שיתוק מפלצת | 5 |

    | ריחוף | 2 |

    | פגיעת ברק (גרסת דרגה 5) | 5 |

    | טיל קסם | 1 |

    | קרן החלשה | 1 |

    | חומת כוח | 5 |

    **_חידוש מטענים._** המטה מחזיר 2d8 + 4 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. אם יצא 1, המטה שומר על התוסף של +2 לגלגולי התקפה ולגלגולי נזק, אך מאבד את כל שאר תכונותיו. אם יצא 20, המטה מחזיר 1d8 + 2 מטענים.

    **_מכת נקם._** אתה יכול לבצע פעולת קסם כדי לשבור את המטה על ברכך או על משטח מוצק. המטה נהרס ומשחרר את קסמו בפיצוץ שממלא הילה של 30 רגל שמקורה בו. יש לך סיכוי של 50 אחוז לנוע ברגע אל מישור קיום אקראי ולהימנע מהפיצוץ. אם לא הצלחת להימנע מההשפעה, אתה סופג נזק כוח קסום השווה ל-16 כפול מספר המטענים במטה. כל יצור אחר באזור מטיל זריקת הצלה בזריזות בדרגת קושי 17. בהצלה שנכשלה, היצור סופג נזק כוח קסום השווה ל-4 כפול מספר המטענים במטה. בהצלה מוצלחת, היצור סופג מחצית מהנזק.

- id: staff-of-striking
  name: מטה המהלומה
  description: |-
    מטה

    אפשר להחזיק במטה זה כמטה לחימה קסום שמעניק תוסף של +3 לגלגולי התקפה ולגלגולי נזק שנעשים בו.

    במטה יש 10 מטענים. כשאתה פוגע בהתקפה בקרב פנים אל פנים באמצעותו, אתה יכול להוציא עד 3 מטענים. על כל מטען שאתה מוציא, המטרה סופגת 1d6 נזק כוח קסום נוסף.

    חידוש מטענים. המטה מחזיר 1d6 + 4 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. אם יצא 1, המטה הופך למטה לחימה לא קסום.

- id: staff-of-swarming-insects
  name: מטה נחילי החרקים
  description: |-
    מטה

    במטה יש 10 מטענים.

    **_ענן חרקים._** כל עוד אתה אוחז במטה, אתה יכול לבצע פעולת קסם ולהוציא מטען 1 כדי לגרום לנחיל של חרקים מעופפים בלתי מזיקים למלא הילה של 30 רגל שמקורה בך. החרקים נשארים 10 דקות, והאזור מוסתר היטב ליצורים מלבדך. רוח חזקה (כמו זו שיוצר *משב רוח*) מפזרת את הנחיל ומסיימת את ההשפעה.

    **_לחשים._** כל עוד אתה אוחז במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, תוך שימוש בדרגת הקושי להצלה נגד לחשים שלך ובמתאם התקפת הלחש שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות מטענים |

    |---|---|

    | חרק ענק | 4 |

    | מכת חרקים | 5 |

    **_חידוש מטענים._** המטה מחזיר 1d6 + 4 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. אם יצא 1, נחיל חרקים טורף את המטה והורס אותו, ואז מתפזר.

- id: staff-of-the-magi
  name: מטה האשפים
  description: |-
    מטה

    במטה יש 50 מטענים, ואפשר להחזיק בו כמטה לחימה קסום שמעניק תוסף של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בו. כל עוד אתה אוחז בו, אתה מקבל תוסף של +2 לגלגולי התקפת לחש.

    **_ספיגת לחשים._** כל עוד אתה אוחז במטה, יש לך יתרון בזריקות הצלה נגד לחשים. בנוסף, אתה יכול לבצע תגובה כשיצור אחר מטיל לחש שמכוון אליך בלבד. אם עשית זאת, המטה סופג את קסם הלחש, מבטל את השפעתו ומקבל מספר מטענים השווה לדרגת הלחש שנספג. אולם אם בעקבות זאת סך המטענים במטה עולה על 50, המטה מתפוצץ כאילו הפעלת את מכת הנקם שלו (ראה להלן).

    **_לחשים._** כל עוד אתה אוחז במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, תוך שימוש בדרגת הקושי להצלה נגד לחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות מטענים |

    |---|---|

    | נעילה מאגית | 0 |

    | זימון יסודן | 7 |

    | גילוי קסם | 0 |

    | ביטול קסם | 3 |

    | הגדלה/הקטנה | 0 |

    | כדור אש (גרסת דרגה 7) | 7 |

    | כדור בוער | 2 |

    | סופת קרח | 4 |

    | בלתי נראות | 2 |

    | דפיקה | 2 |

    | אור | 0 |

    | פגיעת ברק (גרסת דרגה 7) | 7 |

    | יד האשף | 0 |

    | מעבר בקיר | 5 |

    | מעבר מישורי | 7 |

    | הגנה מפני רע וטוב | 0 |

    | טלקינזיס | 5 |

    | חומת אש | 4 |

    | רשת קורים | 2 |

    **_חידוש מטענים._** המטה מחזיר 4d6 + 2 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. אם יצא 20, המטה מחזיר 1d12 + 1 מטענים.

    **_מכת נקם._** אתה יכול לבצע פעולת קסם כדי לשבור את המטה על ברכך או על משטח מוצק. המטה נהרס ומשחרר את קסמו בפיצוץ שממלא הילה של 30 רגל שמקורה בו. יש לך סיכוי של 50 אחוז לנוע ברגע אל מישור קיום אקראי ולהימנע מהפיצוץ. אם לא הצלחת להימנע מההשפעה, אתה סופג נזק כוח קסום השווה ל-16 כפול מספר המטענים במטה. כל יצור אחר באזור מטיל זריקת הצלה בזריזות בדרגת קושי 17. בהצלה שנכשלה, היצור סופג נזק כוח קסום השווה ל-6 כפול מספר המטענים במטה. בהצלה מוצלחת, היצור סופג מחצית מהנזק.

- id: staff-of-the-python
  name: מטה הפיתון
  description: |-
    מטה

    בפעולת קסם אתה יכול לזרוק את המטה כך שינחת במרחב פנוי במרחק של עד 10 רגל ממך, וגרום לו להפוך לנחש חונק ענק באותו מרחב. הנחש נתון לשליטתך, חולק את ספירת היוזמה שלך, ותורו מגיע מיד אחרי תורך.

    בתורך אתה יכול לפקד על הנחש במחשבה (ללא צורך בפעולה) אם הוא נמצא במרחק של עד 60 רגל ממך ואין לך את המצב חסר יכולת פעולה. אתה מחליט איזו פעולה הנחש מבצע ולאן הוא נע בתורו, או שאתה יכול לתת לו פקודה כללית, כמו לתקוף את אויבך או לשמור על מקום. אם לא נתת לו פקודות, הנחש מגן על עצמו.

    בפעולה נוספת אתה יכול לפקד על הנחש לחזור לצורת מטה במרחב שבו הוא נמצא, ואינך יכול להשתמש שוב בתכונת המטה למשך שעה 1. אם נקודות החיים של הנחש יורדות ל-0, הוא מת וחוזר לצורת מטה; המטה אז מתנפץ ונהרס. אם הנחש חוזר לצורת מטה לפני שאיבד את כל נקודות החיים שלו, הוא מחזיר את כולן.

- id: staff-of-the-woodlands
  name: מטה היערות
  description: |-
    מטה

    במטה יש 6 מטענים, ואפשר להחזיק בו כמטה לחימה קסום שמעניק תוסף של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בו. כל עוד אתה אוחז בו, יש לך תוסף של +2 לגלגולי התקפת לחש.

    **_לחשים._** כל עוד אתה אוחז במטה, אתה יכול להטיל ממנו אחד מהלחשים שבטבלה הבאה, תוך שימוש בדרגת הקושי להצלה נגד לחשים שלך. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות מטענים |

    |---|---|

    | ידידות עם חיות | 1 |

    | התעוררות | 5 |

    | עור קליפה | 2 |

    | איתור בעלי חיים או צמחים | 2 |

    | מעבר ללא עקבות | 2 |

    | שיח עם בעלי חיים | 1 |

    | שיח עם צמחים | 3 |

    | חומת קוצים | 6 |

    **_צורת עץ._** אתה יכול לבצע פעולת קסם כדי לנעוץ קצה אחד של המטה באדמה במרחב פנוי ולהוציא מטען 1 כדי להפוך את המטה לעץ בריא. גובה העץ 60 רגל, קוטר גזעו 5 רגל, וענפיו בצמרת נפרשים ברדיוס של 20 רגל. העץ נראה רגיל, אך מקרין הילה קלושה של קסם תהפוכה שאפשר להבחין בה באמצעות הלחש *גילוי קסם*. כשאתה נוגע בעץ ומבצע פעולת קסם, אתה מחזיר את המטה לצורתו הרגילה. כל יצור שנמצא בעץ נופל כשהעץ חוזר להיות מטה.

    **_חידוש מטענים._** המטה מחזיר 1d6 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון, הטל 1d20. אם יצא 1, המטה מאבד את תכונותיו והופך למטה לחימה לא קסום.

- id: staff-of-thunder-and-lightning
  name: מטה הרעם והברק
  description: |-
    מטה

    אפשר להחזיק במטה זה כמטה לחימה קסום שמעניק תוסף של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בו. יש לו גם את התכונות הנוספות הבאות. לאחר שנעשה שימוש באחת מהן, אי אפשר להשתמש בה שוב עד עלות השחר הבאה.

    ברק. כשאתה פוגע בהתקפה בקרב פנים אל פנים באמצעות המטה, אתה יכול לגרום למטרה לסבול 2d6 נזק ברק נוסף (ללא צורך בפעולה).

    רעם. כשאתה פוגע בהתקפה בקרב פנים אל פנים באמצעות המטה, אתה יכול לגרום למטה להפיק קול רעם הנשמע עד מרחק של 300 רגל (ללא צורך בפעולה). המטרה שפגעת בה חייבת להצליח בזריקת הצלה בחוסן בדרגת קושי 17, אחרת היא תהיה במצב המום עד סוף תורך הבא.

    רעם וברק. מיד לאחר שפגעת בהתקפה בקרב פנים אל פנים באמצעות המטה, אתה יכול לבצע פעולה נוספת כדי להשתמש בתכונות ברק ורעם (ראה לעיל) בו זמנית. בכך אינך מוציא את השימוש היומי של אותן תכונות, אלא רק את השימוש בתכונה זו.

    מכת ברק. אתה יכול לבצע פעולת קסם כדי לגרום לברק לזנק מקצה המטה בקו ברוחב 5 רגל ובאורך 120 רגל. כל יצור בקו מטיל זריקת הצלה בזריזות בדרגת קושי 17, וסופג 9d6 נזק ברק בהצלה שנכשלה או מחצית מהנזק בהצלה מוצלחת.

    קול רעם. אתה יכול לבצע פעולת קסם כדי לגרום למטה להפיק קול רעם הנשמע עד מרחק של 600 רגל. כל יצור בהילה של 60 רגל שמקורה בך מטיל זריקת הצלה בחוסן בדרגת קושי 17. בהצלה שנכשלה, היצור סופג 2d6 נזק רעם ונמצא במצב חירש למשך דקה 1. בהצלה מוצלחת, היצור סופג מחצית מהנזק בלבד.

- id: staff-of-withering
  name: מטה הקמילה
  description: |-
    מטה

    במטה יש 3 מטענים, והוא מחזיר 1d3 מטענים שהוצאו מדי יום עם עלות השחר.

    אפשר להחזיק במטה כמטה לחימה קסום. בפגיעה הוא גורם נזק כמו מטה לחימה רגיל, ואתה יכול להוציא מטען 1 כדי לגרום למטרה 2d10 נזק נקרוטי נוסף ולחייב אותה להטיל זריקת הצלה בחוסן בדרגת קושי 15. בהצלה שנכשלה יש למטרה חיסרון למשך שעה 1 בכל בדיקת תכונה או זריקת הצלה שמשתמשת בכוח או בחוסן.

- id: stone-of-controlling-earth-elementals
  name: אבן שליטה ביסודני אדמה
  description: |-
    חפץ פלאי

    כשאתה נוגע בקרקע באבן הזו, שמשקלה 5 פאונד, אתה יכול לבצע פעולת קסם כדי לזמן יסודן אדמה. היסודן מופיע במרחב פנוי לבחירתך במרחק של עד 30 רגל ממך, מציית לפקודותיך, ותורו מגיע מיד אחריך בספירת היוזמה שלך. היסודן נעלם לאחר שעה 1, כשהוא מת, או כשאתה משחרר אותו בפעולה נוספת. אי אפשר להשתמש באבן כך שוב עד עלות השחר הבאה.

- id: stone-of-good-luck-(luckstone)
  name: אבן מזל טוב
  description: |-
    חפץ פלאי

    כל עוד האגט המלוטש הזה עליך, אתה מקבל תוסף של +1 לבדיקות תכונה ולזריקות הצלה.
- id: sun-blade
  name: להב שמש
  description: |-
    נשק (חרב ארוכה)

    הפריט הזה נראה כידית של חרב.

    להב זוהר. כשאתה אוחז בידית, אתה יכול לבצע פעולה נוספת כדי לגרום ללהב של זוהר טהור להופיע או להיעלם. כל עוד הלהב קיים, הנשק הקסום הזה פועל כחרב ארוכה בעלת תכונת מעודן. אם יש לך שליטה בחרבות ארוכות או בחרבות קצרות, יש לך שליטה גם בלהב שמש.

    אתה מקבל בונוס של +2 לגלגולי התקפה ולגלגולי נזק שנעשים בנשק הזה, והוא גורם נזק קורן במקום נזק חותך. כשאתה פוגע באל-מת בנשק, המטרה סופגת 1d8 נזק קורן נוסף.

    אור שמש. הלהב הזוהר של החרב פולט אור בהיר ברדיוס 15 רגל ואור עמום ל-15 רגל נוספות. האור הוא אור שמש. כל עוד הלהב קיים, אתה יכול לבצע פעולת קסם כדי להרחיב או לצמצם ב-5 רגל כל אחד את רדיוס האור הבהיר ואת רדיוס האור העמום, עד מקסימום של 30 רגל כל אחד או מינימום של 10 רגל כל אחד.
- id: sword-of-life-stealing
  name: חרב גזילת חיים
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה, רפירה, חרב עקומה או חרב קצרה)

    כשאתה תוקף יצור בנשק הקסום הזה ומטיל 20 בקובייה d20 של גלגול ההתקפה, המטרה סופגת 15 נזק נקרוטי נוסף אם אינה יצור מלאכותי או אל-מת, ואתה מקבל נקודות חיים זמניות השוות לכמות הנזק הנקרוטי שנגרם.
- id: sword-of-sharpness
  name: חרב חדות
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה או חרב עקומה)

    כשאתה תוקף חפץ בנשק הקסום הזה ופוגע, הגדל למקסימום את קוביות הנזק של הנשק כלפי המטרה.

    כשאתה תוקף יצור בנשק הזה ומטיל 20 בקובייה d20 של גלגול ההתקפה, המטרה סופגת 14 נזק חותך נוסף ומקבלת דרג תשישות 1.
- id: sword-of-wounding
  name: חרב פצעים
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה, רפירה, חרב עקומה או חרב קצרה)

    כשאתה פוגע ביצור בהתקפה בנשק הקסום הזה, המטרה סופגת 2d6 נזק נקרוטי נוסף וחייבת להצליח בזריקת הצלה בחוסן בדרגת קושי 15, או שלא תוכל להחזיר נקודות חיים למשך 1 שעה. המטרה חוזרת על ההצלה בסוף כל אחד מתוריה, ובהצלחה ההשפעה מסתיימת עליה.
- id: talisman-of-pure-good
  name: טליסמן הטוב הטהור
  description: |-
    חפץ פלאי

    הטליסמן הזה הוא סמל עוצמתי של טוב. בן-תופת או אל-מת שנוגע בטליסמן סופג 8d6 נזק קורן, וסופג את הנזק שוב בכל פעם שהוא מסיים את תורו כשהוא מחזיק או נושא את הטליסמן.

    סמל קודש. אתה יכול להשתמש בטליסמן כסמל קודש. אתה מקבל בונוס של +2 לגלגולי התקפת לחש כל עוד אתה לובש או מחזיק אותו.

    נזיפה טהורה. בטליסמן יש 7 מטענים. כל עוד אתה לובש או מחזיק את הטליסמן, אתה יכול לבצע פעולת קסם כדי להוציא 1 מטען ולכוון אל יצור אחד שאתה רואה, שנמצא על הקרקע במרחק של עד 120 רגל ממך. סדק לוהט נפער מתחת למטרה, והמטרה מבצעת זריקת הצלה בזריזות בדרגת קושי 20. אם המטרה היא בן-תופת או אל-מת, יש לה חיסרון בהצלה. בהצלה כושלת, המטרה נופלת לתוך הסדק ומושמדת, בלי להותיר שריד. בהצלה מוצלחת, המטרה אינה נזרקת לתוך הסדק, אך סופגת 4d6 נזק נפשי מן החוויה. בשני המקרים הסדק נסגר אחר כך, בלי להותיר סימן לקיומו. כשאתה מוציא את המטען האחרון, הטליסמן מתפזר לגרגרי אור זהוב ומושמד.
- id: talisman-of-the-sphere
  name: טליסמן הכדור
  description: |-
    חפץ פלאי

    כל עוד אתה מחזיק או לובש את הטליסמן הזה, יש לך יתרון בכל בדיקת תבונה (מאגיה) שאתה מבצע כדי לשלוט בכדור הכחדה. בנוסף, כשאתה מתחיל את תורך בשליטה בכדור הכחדה, אתה יכול לבצע פעולת קסם כדי להזיז אותו 10 רגל, ועוד מספר רגל נוספות השווה ל-10 כפול מתאם התבונה שלך. התנועה הזאת אינה חייבת להיות בקו ישר.
- id: talisman-of-ultimate-evil
  name: טליסמן הרוע המוחלט
  description: |-
    חפץ פלאי

    הפריט הזה מסמל רוע חסר חרטה. יצור שאינו בן-תופת או אל-מת ונוגע בטליסמן סופג 8d6 נזק נקרוטי, וסופג את הנזק שוב בכל פעם שהוא מסיים את תורו כשהוא מחזיק או נושא את הטליסמן.

    סמל קודש. אתה יכול להשתמש בטליסמן כסמל קודש. אתה מקבל בונוס של +2 לגלגולי התקפת לחש כל עוד אתה לובש או מחזיק אותו.

    קץ מוחלט. בטליסמן יש 6 מטענים. כל עוד אתה לובש או מחזיק את הטליסמן, אתה יכול לבצע פעולת קסם כדי להוציא 1 מטען ולכוון אל יצור אחד שאתה רואה, שנמצא על הקרקע במרחק של עד 120 רגל ממך. סדק לוהט נפער מתחת למטרה, והמטרה מבצעת זריקת הצלה בזריזות בדרגת קושי 20. אם המטרה היא יצור מרום, יש לה חיסרון בהצלה. בהצלה כושלת, המטרה נופלת לתוך הסדק ומושמדת, בלי להותיר שריד. בהצלה מוצלחת, המטרה אינה נזרקת לתוך הסדק, אך סופגת 4d6 נזק נפשי מן החוויה. בשני המקרים הסדק נסגר אחר כך, בלי להותיר סימן לקיומו. כשאתה מוציא את המטען האחרון, הטליסמן מתמוסס לריר מסריח ומושמד.
- id: tome-of-clear-thought
  name: ספר החשיבה הצלולה
  description: |-
    חפץ פלאי

    הספר הזה מכיל תרגילי זיכרון והיגיון, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בתוך תקופה של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, התבונה שלך עולה ב-2, עד מקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: tome-of-leadership-and-influence
  name: ספר המנהיגות וההשפעה
  description: |-
    חפץ פלאי

    הספר הזה מכיל הנחיות להשפעה על אחרים ולקסימתם, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בתוך תקופה של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, הכריזמה שלך עולה ב-2, עד מקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: tome-of-understanding
  name: ספר ההבנה
  description: |-
    חפץ פלאי

    הספר הזה מכיל תרגילי אינטואיציה ופיקחות, ומילותיו טעונות בקסם. אם אתה מקדיש 48 שעות, בתוך תקופה של 6 ימים או פחות, ללימוד תוכן הספר ולתרגול הנחיותיו, החוכמה שלך עולה ב-2, עד מקסימום של 30. אז המדריך מאבד את קסמו, אך מחזיר אותו בעוד מאה שנה.
- id: trident-of-fish-command
  name: תלת-שן שליטה בדגים
  description: |-
    נשק (תלת-שן)

    לנשק הקסום הזה יש 3 מטענים, והוא מחזיר 1d3 מטענים שהוצאו מדי יום עם עלות השחר. כל עוד אתה נושא אותו, אתה יכול להוציא 1 מטען כדי להטיל ממנו *שליטה בחיה* (דרגת קושי להצלה 15) על חיה בעלת מהירות שחייה.
- id: universal-solvent
  name: ממס אוניברסלי
  description: |-
    חפץ פלאי

    הצינורית הזאת מכילה נוזל חלבי בעל ריח אלכוהול חזק. כשמוצאים אותה, היא מכילה 1d6 + 1 אונקיות.

    אתה יכול לבצע פעולת שימוש כדי לשפוך 1 אונקיה או יותר של הממס מהצינורית על משטח בהישג ידך. כל אונקיה ממיסה מיד עד 1 רגל רבועה של חומר דבק שהיא נוגעת בו, כולל *דבק עליון*.
- id: vicious-weapon
  name: נשק אכזרי
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    הנשק הקסום הזה גורם 2d6 נזק נוסף לכל יצור שהוא פוגע בו. הנזק הנוסף הוא מאותו סוג כמו הנזק הרגיל של הנשק.
- id: vorpal-sword
  name: חרב ורפלית
  description: |-
    נשק (חרב מוט, חרב גדולה, חרב ארוכה או חרב עקומה)

    אתה מקבל בונוס של +3 לגלגולי התקפה ולגלגולי נזק שנעשים בנשק הקסום הזה. בנוסף, הנשק מתעלם מעמידות לנזק חותך.

    כשאתה תוקף בנשק הזה יצור שיש לו לפחות ראש אחד ומגלגל 20 ב-d20 של גלגול ההתקפה, אתה כורת את אחד מראשי היצור. היצור מת אם אינו יכול לשרוד בלי הראש האבוד. יצור חסין להשפעה הזאת אם יש לו חסינות לנזק חותך, אם אין לו ראש ואינו זקוק לו, או אם שליט המבוך קובע שהיצור גדול מכדי שאפשר יהיה לכרות את ראשו בנשק הזה. במקום זאת, יצור כזה סופג 30 נזק חותך נוסף מהפגיעה. אם ליצור יש עמידות אגדית, הוא יכול להוציא שימוש יומי אחד של התכונה הזאת כדי להימנע מאובדן ראשו, וסופג את הנזק הנוסף במקומו.
- id: wand-of-binding
  name: שרביט הכבילה
  description: |-
    שרביט

    לשרביט הזה יש 7 מטענים.

    **_לחשים._** כשאתה מחזיק את השרביט, אתה יכול להטיל ממנו אחד מהלחשים (דרגת קושי להצלה 17) שבטבלה הבאה. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות במטענים |

    |---|---|

    | שיתוק מפלצת | 5 |

    | שיתוק אדם | 2 |

    **_החזרת מטענים._** השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון של השרביט, גלגל 1d20. בגלגול של 1, השרביט מתפורר לאפר ומושמד.
- id: wand-of-enemy-detection
  name: שרביט גילוי אויבים
  description: |-
    שרביט

    לשרביט הזה יש 7 מטענים. כשאתה מחזיק אותו, אתה יכול לבצע פעולת קסם כדי להוציא 1 מטען. למשך 1 דקה, אתה יודע באיזה כיוון נמצא היצור העוין לך הקרוב ביותר בטווח של 60 רגל, אך לא מה מרחקו ממך. השרביט מרגיש בנוכחותם של יצורים עוינים שהם בלתי נראים, אתריים, מחופשים או נסתרים, וכן של אלה שנראים לעין. ההשפעה מסתיימת אם אתה מפסיק להחזיק בשרביט.

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון של השרביט, גלגל 1d20. בגלגול של 1, השרביט מתפורר לאפר ומושמד.
- id: wand-of-fear
  name: שרביט הפחד
  description: |-
    שרביט

    לשרביט הזה יש 7 מטענים.

    **לחשים.** כשאתה מחזיק את השרביט, אתה יכול להטיל ממנו אחד מהלחשים (דרגת קושי להצלה 15) שבטבלה הבאה. הטבלה מציינת כמה מטענים עליך להוציא כדי להטיל את הלחש.

    | לחש | עלות במטענים |

    |---|---|

    | פקודה ("ברח" או "השתטח" בלבד) | 1 |

    | פחד (חרוט של 60 רגל) | 3 |
- id: wand-of-fireballs
  name: שרביט כדורי האש
  description: |-
    שרביט

    לשרביט הזה יש 7 מטענים. כשאתה מחזיק אותו, אתה יכול להוציא לא יותר מ-3 מטענים כדי להטיל ממנו *כדור אש* (דרגת קושי להצלה 15). תמורת 1 מטען אתה מטיל את הגרסה מדרגה 3 של הלחש. אתה יכול להעלות את דרגת הלחש ב-1 על כל מטען נוסף שאתה מוציא.

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון של השרביט, גלגל 1d20. בגלגול של 1, השרביט מתפורר לאפר ומושמד.
- id: wand-of-lightning-bolts
  name: שרביט פגיעות הברק
  description: |-
    שרביט

    לשרביט הזה יש 7 מטענים. כשאתה מחזיק אותו, אתה יכול להוציא לא יותר מ-3 מטענים כדי להטיל ממנו *פגיעת ברק* (דרגת קושי להצלה 15). תמורת 1 מטען אתה מטיל את הגרסה מדרגה 3 של הלחש. אתה יכול להעלות את דרגת הלחש ב-1 על כל מטען נוסף שאתה מוציא.

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום עם עלות השחר. אם אתה מוציא את המטען האחרון של השרביט, גלגל 1d20. בגלגול של 1, השרביט מתפורר לאפר ומושמד.
- id: wand-of-magic-detection
  name: שרביט גילוי קסם
  description: |-
    שרביט

    לשרביט הזה יש 3 מטענים. כשאתה מחזיק אותו, אתה יכול להוציא 1 מטען כדי להטיל ממנו *גילוי קסם*. השרביט מחזיר 1d3 מטענים שהוצאו מדי יום עם עלות השחר.
- id: wand-of-magic-missiles
  name: שרביט טילי קסם
  description: |-
    שרביט

    בשרביט הזה 7 מטענים. כשאתה מחזיק בו, אתה יכול להוציא עד 3 מטענים כדי להטיל ממנו את הלחש טיל קסם. תמורת 1 מטען אתה מטיל את הגרסה מדרגה 1 של הלחש. אתה יכול להעלות את דרגת הלחש ב-1 על כל מטען נוסף שאתה מוציא.

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון של השרביט, הטל 1d20. בתוצאה 1, השרביט מתפורר לאפר ונהרס.
- id: wand-of-paralysis
  name: שרביט שיתוק
  description: |-
    שרביט

    בשרביט הזה 7 מטענים. כשאתה מחזיק בו, אתה יכול לבצע פעולת קסם ולהוציא 1 מטען כדי לגרום לקרן כחולה דקה להיורות מקצה השרביט לעבר יצור שאתה רואה בטווח של 60 רגל ממך. על המטרה להצליח בהצלה של חוסן בדרגת קושי 15, ואם לא, היא מקבלת את המצב משותק למשך 1 דקה. בסוף כל אחד מתורי המטרה היא חוזרת על ההצלה, ובהצלחה האפקט מסתיים עליה.

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון של השרביט, הטל 1d20. בתוצאה 1, השרביט מתפורר לאפר ונהרס.
- id: wand-of-polymorph
  name: שרביט שינוי צורה
  description: |-
    שרביט

    בשרביט הזה 7 מטענים. כשאתה מחזיק בו, אתה יכול להוציא 1 מטען כדי להטיל ממנו את הלחש שינוי צורה (דרגת קושי להצלה 15).

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון של השרביט, הטל 1d20. בתוצאה 1, השרביט מתפורר לאפר ונהרס.
- id: wand-of-secrets
  name: שרביט סודות
  description: |-
    שרביט

    בשרביט הזה 3 מטענים, והוא מחזיר 1d3 מטענים שהוצאו מדי יום בעלות השחר. כשאתה מחזיק בו, אתה יכול לבצע פעולת קסם ולהוציא 1 מטען, ואם דלת סודית או מלכודת נמצאות בטווח של 60 רגל ממך, השרביט פועם ומצביע על הקרובה אליך ביותר.
- id: wand-of-the-war-mage
  name: שרביט קוסם המלחמה
  description: |-
    שרביט

    כשאתה מחזיק בשרביט הזה, אתה מקבל בונוס לגלגולי התקפת לחש, בהתאם לנדירות השרביט. בנוסף, אתה מתעלם ממחסה למחצה כשאתה מגלגל התקפת לחש.
- id: wand-of-web
  name: שרביט רשת קורים
  description: |-
    שרביט

    בשרביט הזה 7 מטענים. כשאתה מחזיק בו, אתה יכול להוציא 1 מטען כדי להטיל ממנו את הלחש רשת קורים (דרגת קושי להצלה 13).

    החזרת מטענים. השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון של השרביט, הטל 1d20. בתוצאה 1, השרביט מתפורר לאפר ונהרס.
- id: wand-of-wonder
  name: שרביט פלאים
  description: |-
    שרביט

    בשרביט הזה 7 מטענים. כשאתה מחזיק בו, אתה יכול לבצע פעולת קסם ולהוציא 1 מטען תוך בחירת נקודה בטווח של 120 רגל ממך. המקום הזה הופך לנקודת המוצא של לחש או של אפקט קסום אחר, שנקבע בגלגול בטבלת אפקטי שרביט פלאים. לחשים שמוטלים מהשרביט הם בדרגת קושי להצלה 15. אם הטווח המרבי של לחש הוא בדרך כלל פחות מ-120 רגל, הוא הופך ל-120 רגל כשהלחש מוטל מהשרביט. אם לאפקט יש כמה נושאים אפשריים, שליט המבוך קובע באקראי מי מהם מושפע.

    **_החזרת מטענים._** השרביט מחזיר 1d6 + 1 מטענים שהוצאו מדי יום בעלות השחר. אם אתה מוציא את המטען האחרון של השרביט, הטל 1d20. בתוצאה 1, השרביט מתפורר לאבק ונהרס.

    טבלה: אפקטי שרביט פלאים

    | 1d100 | אפקט |

    |---|---|

    | 01–20 | אתה מטיל לחש שמקורו בנקודה שנבחרה. הטל 1d10 כדי לקבוע את הלחש: בתוצאה **1–2,** *חושך*; בתוצאה **3–4,** *אש פיות*; בתוצאה **5–6,** *כדור אש*; בתוצאה **7–8,** *האטה*; בתוצאה **9–10,** *ענן סרחון*. |

    | 21–25 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, אתה מקבל את המצב המום עד תחילת התור הבא שלך, מתוך אמונה שהרגע קרה משהו מדהים. |

    | 26–30 | אתה מטיל *משב רוח*. הקו שהלחש יוצר משתרע ממך אל נקודת המוצא שנבחרה. |

    | 31–35 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, אתה סופג 1d6 נזק נפשי. |

    | 36–40 | גשם כבד יורד במשך 1 דקה בגליל בגובה 120 רגל וברדיוס 60 רגל שמרכזו בנקודת המוצא שנבחרה. במהלך הזמן הזה, אזור האפקט מוסתר קלות. |

    | 41–45 | ענן של 600 פרפרים ענקיים ממלא גליל בגובה 60 רגל וברדיוס 30 רגל שמרכזו בנקודת המוצא שנבחרה. הפרפרים נשארים למשך 10 דקות, ובמהלכן אזור האפקט מוסתר מאוד. |

    | 46–50 | אתה מטיל *פגיעת ברק*. הקו שהלחש יוצר משתרע ממך אל נקודת המוצא שנבחרה. |

    | 51–55 | היצור הקרוב ביותר לנקודת המוצא שנבחרה מוגדל כאילו הטלת עליו *הגדלה/הקטנה*. אם המטרה אינה אתה ואי אפשר להשפיע עליה בלחש הזה, אתה הופך למטרה במקומה. |

    | 56–60 | יצור שנוצר בקסם מופיע במרחב פנוי הקרוב ככל האפשר לנקודת המוצא שנבחרה. היצור אינו בשליטתך, פועל כפי שהיה פועל בדרך כלל, ונעלם אחרי 1 שעה או כשהוא יורד ל-0 נקודות פגיעה. הטל 1d4 כדי לקבוע איזה יצור מופיע. בתוצאה **1,** מופיע **קרנף**; בתוצאה **2,** מופיע **פיל**; ובתוצאה **3–4,** מופיע **עכברוש**. |

    | 61–64 | דשא מכסה עיגול קרקע ברדיוס 60 רגל, שמרכזו קרוב ככל האפשר לנקודת המוצא שנבחרה. דשא שכבר נמצא שם גדל לפי עשרה מגודלו הרגיל ונשאר עבות במשך 1 דקה. |

    | 65–68 | חפץ לבחירת שליט המבוך נעלם אל המישור האתרי. החפץ חייב להיות לא לבוש ולא נישא, בטווח של 120 רגל מנקודת המוצא שנבחרה, ולא גדול מ-10 רגל בשום מימד. אם אין חפצים כאלה בטווח, שום דבר לא קורה. |

    | 69–72 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, אתה מתכווץ כאילו הטלת *הגדלה/הקטנה* על עצמך, ונשאר במצב הזה למשך 1 דקה. |

    | 73–77 | עלים צומחים מהיצור הקרוב ביותר לנקודת המוצא שנבחרה. אם לא קוטפים אותם, העלים מחומים ונושרים אחרי 24 שעות. |

    | 78–82 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, התפרצות של אור צבעוני ונוצץ משתרעת ממך בהילה של 30 רגל. כל יצור באזור חייב להצליח בהצלה של חוסן בדרגת קושי 15, ואם לא, הוא מקבל את המצב עיוור למשך 1 דקה. יצור חוזר על ההצלה בסוף כל אחד מתוריו, ובהצלחה האפקט מסתיים עליו. |

    | 83–87 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, אתה מטיל *בלתי נראות* על עצמך. |

    | 88–92 | שום דבר לא קורה בנקודת המוצא שנבחרה. במקום זאת, זרם של 1d4 × 10 אבני חן, שכל אחת מהן שווה 1 מ״ז, נורה מקצה השרביט בקו באורך 30 רגל וברוחב 5 רגל לעבר נקודת המוצא שנבחרה. כל אבן חן גורמת 1 נזק מוחץ, וסך הנזק של אבני החן מחולק שווה בשווה בין כל היצורים בקו. |

    | 93–97 | אתה מטיל *שינוי צורה* על היצור הקרוב ביותר לנקודת המוצא שנבחרה. הטל 1d4 כדי לקבוע את צורתו החדשה של היצור. בתוצאה **1,** הצורה החדשה היא **דוב שחור;** בתוצאה **2,** הצורה החדשה היא **צרעה ענקית;** בתוצאה **3–4,** הצורה החדשה היא **צפרדע.** |

    | 98–00 | היצור הקרוב ביותר לנקודת המוצא שנבחרה מטיל הצלה של חוסן בדרגת קושי 15. בהצלה כושלת, היצור מקבל את המצב מרוסן ומתחיל להפוך לאבן. כל עוד הוא מרוסן בדרך הזו, היצור חוזר על ההצלה בסוף תורו הבא. בהצלה מוצלחת, האפקט מסתיים. בהצלה כושלת, היצור מקבל את המצב מאובן במקום המצב מרוסן. ההתאבנות נמשכת עד שהיצור משוחרר בלחש *שחזור גדול* או בקסם דומה. |
- id: weapon
  name: "נשק קסום (+1, +2 או +3)"
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    יש לך בונוס לגלגולי התקפה ולגלגולי נזק שנעשים בנשק הקסום הזה. הבונוס נקבע לפי נדירות הנשק.
- id: weapon-of-warning
  name: נשק אזהרה
  description: |-
    נשק (כל נשק פשוט או נשק לחימה)

    כל עוד הנשק הזה בהישג ידך ואתה מותאם אליו, אתה והבעלי ברית שבטווח של 30 רגל ממך מקבלים את היתרונות הבאים.

    התראה. הנשק מעיר בקסם כל נושא שישן שינה טבעית כשהלחימה מתחילה. היתרון הזה אינו מעיר נושא משינה שנגרמה בקסם.

    ערנות על-טבעית. לכל נושא יש יתרון בגלגולי היוזמה שלו.
- id: well-of-many-worlds
  name: באר העולמות הרבים
  description: |-
    חפץ פלאי

    הבד השחור והעדין הזה, רך כמשי, מקופל לממדים של מטפחת. הוא נפרש ליריעה עגולה ברוחב 6 רגל.

    אתה יכול לבצע פעולת קסם כדי לפרוש את באר העולמות הרבים ולהניח אותה על משטח מוצק, ואז היא יוצרת פורטל עגול דו-כיווני ברוחב 6 רגל אל עולם או מישור קיום אחר. בכל פעם שהחפץ פותח פורטל, שליט המבוך מחליט לאן הוא מוביל. הפורטל נשאר פתוח עד שיצור שנמצא בטווח של 5 רגל ממנו מבצע פעולת קסם כדי לסגור אותו, בכך שהוא אוחז בקצוות הבד ומקפל אותו.

    אחרי שבאר העולמות הרבים פתחה פורטל, היא אינה יכולה לעשות זאת שוב במשך 1d8 שעות.
- id: wind-fan
  name: מניפת רוח
  description: |-
    חפץ פלאי

    כשאתה אוחז במניפה הזאת, אתה יכול להטיל ממנה את *משב רוח* (דרגת קושי להצלה 13). בכל שימוש נוסף במניפה לפני עלות השחר הבאה יש סיכוי מצטבר של 20 אחוז שהיא לא תפעל; אם המניפה אינה פועלת, היא נקרעת לסמרטוטים חסרי תועלת ולא קסומים.
- id: winged-boots
  name: מגפי כנפיים
  description: |-
    חפץ פלאי

    במגפיים האלה יש 4 מטענים, והם מחזירים 1d4 מטענים שהוצאו בכל עלות שחר. כשאתה נועל את המגפיים, אתה יכול לבצע פעולת קסם כדי להוציא 1 מטען ולקבל מהירות מעוף של 30 רגל למשך 1 שעה. אם אתה מעופף כשמשך האפקט מסתיים, אתה יורד בקצב של 30 רגל בסבב עד שאתה נוחת.
- id: wings-of-flying
  name: כנפי מעוף
  description: |-
    חפץ פלאי

    כשאתה לובש את המעטפת הזאת, אתה יכול לבצע פעולת קסם כדי להפוך אותה לזוג כנפיים על גבך. הכנפיים נשארות למשך 1 שעה או עד שאתה מסיים את האפקט מוקדם בפעולת קסם. הכנפיים מעניקות לך מהירות מעוף של 60 רגל. אם אתה באוויר כשהכנפיים נעלמות, אתה נופל. כשהכנפיים נעלמות, אינך יכול להשתמש בהן שוב במשך 1d12 שעות.
