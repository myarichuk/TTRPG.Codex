        אם הפחתת את הנזק ל-0, אתה יכול לנצל נקודת מיקוד אחת כדי להסיט חלק מעוצמת ההתקפה. אם עשית זאת, בחר יצור שאתה רואה בטווח של 5 רגל ממך אם ההתקפה הייתה התקפת מגע, או יצור שאתה רואה בטווח של 60 רגל ממך ואינו מאחורי מחסה מלא אם ההתקפה הייתה התקפת טווח. היצור חייב להצליח בזריקת הצלה בזריזות, ואם לא, הוא סופג נזק השווה לשתי הטלות של קוביית אומנויות הלחימה שלך ועוד מתאם הזריזות שלך. הנזק הוא מאותו סוג שגרמה ההתקפה.
