        הטל 1d8 והוסף את מתאם החוכמה שלך. אתה מחזיר ליצור נקודות חיים השוות לסכום הזה, או מאלץ את היצור לבצע זריקת הצלה בחוסן. אם ההצלה נכשלת, היצור סופג נזק נקרוטי או קורן (לבחירתך) השווה לסכום הזה. אם ההצלה מצליחה, היצור סופג מחצית מהנזק (עיגול כלפי מטה).

        אתה מטיל d8 נוסף כשאתה מגיע לדרגות 7 (2d8), 13 (3d8) ו-18 (4d8) של כוהן.

        גירוש אל-מתים. בפעולת קסם, אתה מציג את הסמל הקדוש שלך וגוער באל-מתים. כל אל-מת לבחירתך בטווח של 30 רגל ממך חייב לבצע זריקת הצלה בחוכמה. אם היצור נכשל בהצלה, הוא נמצא במצבים מבוהל וחסר יכולת פעולה למשך דקה אחת. במשך הזמן הזה, הוא מנסה

        להתרחק ממך ככל שהוא יכול בתוריו. ההשפעה הזאת מסתיימת מוקדם יותר ביצור אם הוא סופג נזק כלשהו, אם אתה במצב חסר יכולת פעולה, או אם אתה מת.
    - name: "תת-מקצוע כוהן"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של כוהן לבחירתך. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של כוהן. למשך שארית הקריירה שלך, אתה מקבל כל אחת מיכולות תת-המקצוע שלך שדרגתה כדרגת הכוהן שלך או נמוכה ממנה.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של כוהן.
    - name: "צריבת אל-מתים"
      level: 5
      description: |-
        בכל פעם שאתה משתמש בגירוש אל-מתים, אתה יכול להטיל מספר קוביות d8 השווה למתאם החוכמה שלך (מינימום 1d8) ולחבר את התוצאות. כל אל-מת שנכשל בזריקת ההצלה שלו נגד אותו שימוש בגירוש אל-מתים סופג נזק קורן השווה לסכום ההטלה. הנזק הזה אינו מסיים את השפעת הגירוש.
    - name: "יכולת תת-מקצוע"
      level: 6
      description: |-
        אתה מקבל יכולת מתת-המקצוע הכוהן שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "מכות מבורכות"
      level: 7
      description: |-
        כוח אלוהי ממלא אותך בקרב. אתה מקבל אחת מהאפשרויות הבאות לבחירתך (אם אתה מקבל אחת משתי האפשרויות מתת-מקצוע של כוהן בספר ישן יותר, השתמש רק באפשרות שבחרת ביכולת הזאת).

        מכה אלוהית. פעם אחת בכל אחד מתוריך, כשאתה פוגע ביצור בהטלת התקפה בנשק, אתה יכול לגרום ליעד לסבול 1d8 נזק נקרוטי או קורן נוסף (לבחירתך).

        הטלת לחשים עוצמתית. הוסף את מתאם החוכמה שלך לנזק שאתה גורם בכל לחשון של כוהן.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של כוהן.
    - name: "התערבות אלוהית"
      level: 10
      description: |-
        אתה יכול לקרוא לאל שלך או לפנתיאון שלך שיתערבו למענך. בפעולת קסם, בחר כל לחש כוהן מדרגה 5 או נמוכה שאינו דורש

        תגובה להטלה. כחלק מאותה פעולה, אתה מטיל את הלחש הזה מבלי לנצל תא לחשים ומבלי להזדקק לרכיבים חומריים. אינך יכול להשתמש ביכולת הזאת שוב עד שתסיים מנוחה ארוכה.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של כוהן.
    - name: "מכות מבורכות משופרות"
      level: 14
      description: |-
        האפשרות שבחרת עבור מכות מבורכות הופכת חזקה יותר.

        מכה אלוהית. הנזק הנוסף של המכה האלוהית שלך גדל ל-2d8.

        הטלת לחשים עוצמתית. כשאתה מטיל לחשון של כוהן וגורם בו נזק ליצור, אתה יכול להקנות חיוניות לעצמך או ליצור אחר בטווח של 60 רגל ממך, ולהעניק מספר נקודות חיים זמניות השווה לכפל מתאם החוכמה שלך.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של כוהן.
    - name: "יכולת תת-מקצוע"
      level: 17
      description: |-
        אתה מקבל יכולת מתת-המקצוע הכוהן שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת הגורל.
    - name: "התערבות אלוהית גדולה"
      level: 20
      description: |-
        אתה יכול לקרוא להתערבות אלוהית חזקה אף יותר. כשאתה משתמש ביכולת ההתערבות האלוהית שלך, אתה יכול לבחור במשאלה כשאתה בוחר לחש.

        אם עשית זאת, אינך יכול להשתמש בהתערבות אלוהית שוב עד שתסיים 2d4 מנוחות ארוכות.
- id: druid
  name: "דרואיד"
  description: |-
    **תכונה עיקרית:** חוכמה  
    **קוביית חיים:** d8 לכל דרגה של דרואיד  
    **שליטה בזריקות הצלה:** תבונה, חוכמה  
    **שליטה במיומנויות:** בחר 2: מאגיה, טיפול בחיות, תובנה, רפואה, טבע, הבחנה, דת או השרדות  
    **שליטה בנשק:** נשק פשוט, ערכת צמחאות  
    **אימון בשריון:** שריון קל, מגנים  
    **ציוד התחלתי:** (א) שריון עור, מגן, מגל, מוקד דרואידי (מטה), חבילת מגלה, ערכת צמחאות ו-9 מ״ז; או (ב) 50 מ״ז
  properties:
    skillChoices: "בחר 2: מאגיה, טיפול בחיות, תובנה, רפואה, טבע, הבחנה, דת או השרדות"
    startingEquipment: "(א) שריון עור, מגן, מגל, מוקד דרואידי (מטה), חבילת מגלה, ערכת צמחאות ו-9 מ״ז; או (ב) 50 מ״ז"
    multiclassing: "דרישה: חוכמה 13+. שליטות שנרכשות: שריון קל, מגנים"
    features:
    - name: "דרואידית"
      level: 1
      description: |-
        אתה מכיר דרואידית, השפה הסודית של הדרואידים. בעת לימוד הלשון העתיקה הזאת פתחת גם את קסם התקשורת עם בעלי חיים; הלחש שיח עם בעלי חיים תמיד מוכן אצלך.

        אתה יכול להשתמש בדרואידית כדי להשאיר הודעות נסתרות. אתה ואחרים המכירים דרואידית מבחינים בהודעה כזאת אוטומטית. אחרים מבחינים בקיומה של ההודעה בבדיקת תבונה (חקירה) מוצלחת בדרגת קושי 15, אך אינם יכולים לפענח אותה בלי קסם.
    - name: "סדר קדמוני"
      level: 1
      description: |-
        הקדשת את עצמך לאחד מהתפקידים הקדושים הבאים, לבחירתך.

        קוסם. אתה מכיר לחשון נוסף אחד מרשימת לחשי הדרואיד. בנוסף, הקשר המיסטי שלך אל הטבע מעניק לך בונוס לבדיקות תבונה (מאגיה או טבע). הבונוס שווה למתאם החוכמה שלך (בונוס מינימלי של +1).

        שומר. אתה מאומן ללחימה, ולכן אתה מקבל שליטה בנשק צבאי ואימון בשריון בינוני.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        למדת להטיל לחשים באמצעות חקר הכוחות המיסטיים של הטבע. ראה ״לחשים״ לכללי הטלת לחשים. המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי דרואיד, המופיעים ברשימת לחשי הדרואיד בהמשך תיאור המקצוע.

        לחשונים. אתה מכיר שני לחשונים לבחירתך מרשימת לחשי הדרואיד. מומלצים אמנות הדרואיד ויצירת להבה.

        בכל פעם שאתה עולה דרגה כדרואיד, אתה יכול להחליף אחד מהלחשונים שלך בלחשון אחר לבחירתך מרשימת לחשי הדרואיד.

        כשאתה מגיע לדרגות 4 ו-10 של דרואיד, אתה לומד לחשון נוסף לבחירתך מרשימת לחשי הדרואיד, כמפורט בעמודת הלחשונים בטבלת יכולות הדרואיד.

        תאי לחשים. טבלת יכולות הדרואיד מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר ארבעה לחשים מדרגה 1 מרשימת לחשי הדרואיד. מומלצים ידידות עם חיות, ריפוי פצעים, אש פיות וגל רעם.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כדרואיד, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות הדרואיד. בכל פעם שהמספר הזה גדל, בחר לחשים נוספים מרשימת לחשי הדרואיד עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלה. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים. לדוגמה, אם אתה דרואיד בדרגה 3, רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשים מדרגות 1 ו-2 בכל שילוב.

        אם יכולת אחרת של דרואיד מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי דרואיד עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול לשנות את רשימת הלחשים המוכנים שלך ולהחליף כל אחד מהלחשים בלחשי דרואיד אחרים שיש לך עבורם תאי לחשים.

        תכונת הטלת לחשים. חוכמה היא תכונת הטלת הלחשים שלך ללחשי הדרואיד שלך.

        מוקד לחשים. אתה יכול להשתמש במוקד דרואידי כמוקד לחשים ללחשי הדרואיד שלך.
    - name: "צורה פראית"
      level: 2
      description: |-
        כוחו של הטבע מאפשר לך לקבל צורה של חיה. בפעולה נוספת, אתה משנה צורה לצורת חיה שלמדת עבור היכולת הזאת (ראה ״צורות מוכרות״ להלן). אתה נשאר בצורה הזאת מספר שעות השווה למחצית דרגת הדרואיד שלך, או עד שאתה משתמש בצורה פראית שוב, נכנס למצב חסר יכולת פעולה או מת. אתה יכול גם לצאת מהצורה מוקדם יותר בפעולה נוספת.

        מספר שימושים. אתה יכול להשתמש בצורה פראית פעמיים. אתה מחזיר שימוש אחד שנוצל בתום מנוחה קצרה, ואת כל השימושים שנוצלו בתום מנוחה ארוכה.

        אתה מקבל שימושים נוספים כשאתה מגיע לדרגות מסוימות של דרואיד, כמפורט בעמודת הצורה הפראית בטבלת יכולות הדרואיד.

        צורות מוכרות. אתה מכיר ארבע צורות חיה עבור היכולת הזאת, הנבחרות מתוך כרטיסי יצור של חיות שדרגת האתגר המרבית שלהן 1/4 ושאין להן מהירות מעוף (ראה ״בעלי חיים״ תחת ״יצורים״ לאפשרויות כרטיסי יצור). מומלצים החולדה, סוס הרכיבה, העכביש והזאב. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול להחליף אחת מהצורות המוכרות שלך בצורה אחרת מתאימה.

        כשאתה מגיע לדרגות מסוימות של דרואיד, מספר הצורות המוכרות שלך ודרגת האתגר המרבית שלהן גדלים, כמפורט בטבלת צורות החיה. בנוסף, החל מדרגה 8 אתה יכול לקבל צורה שיש לה מהירות מעוף.

        בבחירת הצורות המוכרות, אתה רשאי לחפש חיות מתאימות במקורות אחרים אם שליט המבוך מתיר לך זאת.


        צורות חיה

        דרגת דרואיד / צורות מוכרות / דרגת אתגר מרבית / מהירות מעוף

        2 / 4 / 1/4 / לא

        4 / 6 / 1/2 / לא

        8 / 8 / 1 / כן


        כללים בעת שינוי צורה. כשאתה בצורה, אתה שומר על האישיות, הזיכרונות והיכולת לדבר שלך, והכללים הבאים חלים:

        נקודות חיים זמניות. כשאתה מקבל צורה פראית, אתה מקבל מספר נקודות חיים זמניות השווה לדרגת הדרואיד שלך.

        מאפייני משחק. מאפייני המשחק שלך מוחלפים בכרטיס היצור של החיה, אך אתה שומר על סוג היצור שלך; נקודות החיים; קוביות החיים; ערכי התבונה, החוכמה והכריזמה; יכולות המקצוע; השפות; והכשרונות שלך. אתה שומר גם על השליטה שלך במיומנויות ובזריקות הצלה ומשתמש בתוסף השליטה שלך עבורן, בנוסף לקבלת השליטות של היצור. אם מתאם מיומנות או זריקת הצלה בכרטיס היצור של החיה גבוה משלך, השתמש במתאם שבכרטיס.

        ללא הטלת לחשים. אתה אינך יכול להטיל לחשים, אך שינוי הצורה אינו שובר את הריכוז שלך ואינו מפריע בדרך אחרת ללחש שכבר הטלת.

        חפצים. היכולת שלך לטפל בחפצים נקבעת לפי הגפיים של הצורה ולא לפי הגפיים שלך. בנוסף, אתה בוחר אם הציוד שלך נופל במרחב שלך, מתמזג עם הצורה החדשה שלך או נלבש עליה. ציוד לבוש פועל כרגיל, אך שליט המבוך מחליט אם מעשי לצורה החדשה ללבוש פריט ציוד, בהתאם לגודל היצור ולצורתו. הציוד שלך אינו משנה גודל או צורה כדי להתאים לצורה החדשה, וכל ציוד שהצורה החדשה אינה יכולה ללבוש חייב ליפול לקרקע או להתמזג עם הצורה. ציוד שמתמזג עם הצורה אינו משפיע כל עוד אתה בצורה הזאת.
    - name: "בן לוויה פראי"
      level: 2
      description: |-
        אתה יכול לזמן רוח טבע שמקבלת צורת חיה כדי לסייע לך. בפעולת קסם, אתה יכול לנצל תא לחשים או שימוש אחד בצורה פראית כדי להטיל את הלחש מציאת מלווה ללא רכיבים חומריים.

        כשאתה מטיל את הלחש בדרך הזאת, המלווה הוא יצור פייה ונעלם כשאתה מסיים מנוחה ארוכה.
    - name: "תת-מקצוע דרואיד"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של דרואיד לבחירתך. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של דרואיד. למשך שארית הקריירה שלך, אתה מקבל כל אחת מיכולות תת-המקצוע שלך שדרגתה כדרגת הדרואיד שלך או נמוכה ממנה.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של דרואיד.
    - name: "התעוררות פראית"
      level: 5
      description: |-
        פעם אחת בכל אחד מתוריך, אם לא נותרו לך שימושים בצורה פראית, אתה יכול להעניק לעצמך שימוש אחד על ידי ניצול תא לחשים (ללא צורך בפעולה).

        בנוסף, אתה יכול לנצל שימוש אחד בצורה פראית (ללא צורך בפעולה) כדי להעניק לעצמך תא לחשים מדרגה 1, אך אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.
    - name: "יכולת תת-מקצוע"
      level: 6
      description: |-
        אתה מקבל יכולת מתת-המקצוע הדרואיד שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "זעם היסודות"
      level: 7
      description: |-
        עוצמת היסודות זורמת בך. אתה מקבל אחת מהאפשרויות הבאות לבחירתך.

        הטלת לחשים עוצמתית. הוסף את מתאם החוכמה שלך לנזק שאתה גורם בכל לחשון של דרואיד.

        מכה קדמונית. פעם אחת בכל אחד מתוריך, כשאתה פוגע ביצור בהטלת התקפה בנשק או בהתקפה של צורת חיה בצורה פראית, אתה יכול לגרום ליעד לסבול 1d8 נזק קור, אש, ברק או רעם נוסף (בחר בעת הפגיעה).
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של דרואיד.
    - name: "יכולת תת-מקצוע"
      level: 10
      description: |-
        אתה מקבל יכולת מתת-המקצוע הדרואיד שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של דרואיד.
    - name: "יכולת תת-מקצוע"
      level: 14
      description: |-
        אתה מקבל יכולת מתת-המקצוע הדרואיד שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "זעם היסודות משופר"
      level: 15
      description: |-
        האפשרות שבחרת עבור זעם היסודות הופכת חזקה יותר, כמפורט להלן.

        הטלת לחשים עוצמתית. כשאתה מטיל לחשון של דרואיד שטווחו 10 רגל או יותר, טווח הלחש גדל ב-300 רגל.

        מכה קדמונית. הנזק הנוסף של המכה הקדמונית שלך גדל ל-2d8.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של דרואיד.
    - name: "לחשי חיה"
      level: 18
      description: |-
        בזמן שימוש בצורה פראית, אתה יכול להטיל לחשים בצורת חיה, מלבד כל לחש שיש לו רכיב חומרי בעל עלות מצוינת או שצורך את הרכיב החומרי שלו.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת מסע בין ממדים.
    - name: "ארכי-דרואיד"
      level: 20
      description: |-
        חיוניות הטבע פורחת בך ללא הרף ומעניקה לך את היתרונות הבאים.

        צורה פראית ירוקת-עד. בכל פעם שאתה מטיל יוזמה ולא נותרו לך שימושים בצורה פראית, אתה מחזיר שימוש אחד שנוצל בה.

        קוסם הטבע. אתה יכול להמיר שימושים בצורה פראית לתא לחשים (ללא צורך בפעולה). בחר מספר שימושים שלא נוצלו בצורה פראית והמר אותם לתא לחשים יחיד, כשכל שימוש תורם 2 דרגות לחש. לדוגמה, אם אתה ממיר שני שימושים בצורה פראית, אתה יוצר תא לחשים מדרגה 4. לאחר שהשתמשת ביתרון הזה, אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.

        אריכות ימים. הקסם הקדמוני שאתה מפעיל גורם לך להזדקן לאט יותר. על כל עשר שנים שעוברות, גופך מזדקן שנה אחת בלבד.
