      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של נזיר.
    - name: "הטיית אנרגיה"
      level: 13
      description: |-
        מעתה אתה יכול להשתמש ביכולת הטיית ההתקפות שלך נגד התקפות הגורמות כל סוג נזק, ולא רק נזק מוחץ, דוקר או חותך.
    - name: "שורד ממושמע"
      level: 14
      description: |-
        המשמעת הגופנית והנפשית שלך מעניקה לך שליטה בכל זריקות ההצלה.

        בנוסף, בכל פעם שאתה מבצע זריקת הצלה ונכשל, אתה יכול לנצל נקודת מיקוד אחת כדי להטיל אותה שוב, ועליך להשתמש בהטלה החדשה.
    - name: "מיקוד מושלם"
      level: 15
      description: |-
        כשאתה מטיל יוזמה ואינך משתמש בחילוף חומרים מופלא, אתה מחזיר נקודות מיקוד שנוצלו עד שיהיו לך 4, אם יש לך 3 או פחות.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של נזיר.
    - name: "יכולת תת-מקצוע"
      level: 17
      description: |-
        אתה מקבל יכולת מתת-המקצוע הנזיר שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "הגנה עליונה"
      level: 18
      description: |-
        בתחילת תורך, אתה יכול לנצל 3 נקודות מיקוד כדי לחזק את עצמך מפני פגיעה למשך דקה אחת או עד שאתה נמצא במצב חסר יכולת פעולה. במשך הזמן הזה, יש לך עמידות בפני כל סוגי הנזק מלבד נזק כוח קסום.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת התקפה בלתי ניתנת לעצירה.
    - name: "גוף ונפש"
      level: 20
      description: |-
        פיתחת את גופך ואת נפשך לשיאים חדשים. ערכי הזריזות והחוכמה שלך גדלים ב-4, עד מקסימום של 25.
- id: paladin
  name: "פלאדין"
  description: |-
    **תכונה עיקרית:** כוח וכריזמה  
    **קוביית חיים:** d10 לכל דרגה של פלאדין  
    **שליטה בזריקות הצלה:** חוכמה, כריזמה  
    **שליטה במיומנויות:** בחר 2: אתלטיקה, תובנה, הפחדה, רפואה, שכנוע או דת  
    **שליטה בנשק:** נשק פשוט, נשק צבאי  
    **אימון בשריון:** כל סוגי השריון, מגנים  
    **ציוד התחלתי:** (א) שריון שרשראות, מגן, חרב ארוכה, 6 כידונים, סמל קדוש, חבילת כוהן ו-9 מ״ז; או (ב) 150 מ״ז
  properties:
    skillChoices: "בחר 2: אתלטיקה, תובנה, הפחדה, רפואה, שכנוע או דת"
    startingEquipment: "(א) שריון שרשראות, מגן, חרב ארוכה, 6 כידונים, סמל קדוש, חבילת כוהן ו-9 מ״ז; או (ב) 150 מ״ז"
    multiclassing: "דרישה: כוח 13+, כריזמה 13+. שליטות שנרכשות: שריון קל, שריון בינוני, מגנים, נשק צבאי"
    features:
    - name: "הנחת ידיים"
      level: 1
      description: |-
        מגעך המבורך יכול לרפא פצעים. יש לך מאגר של כוח ריפוי שמתמלא מחדש כשאתה מסיים מנוחה ארוכה. באמצעות המאגר הזה אתה יכול להחזיר סך של נקודות חיים השווה לפי חמישה מדרגת הפלאדין שלך.

        בפעולה נוספת, אתה יכול לגעת ביצור (גם בעצמך) ולשאוב כוח ממאגר הריפוי כדי להחזיר ליצור מספר נקודות חיים, עד הכמות המרבית שנותרה במאגר.

        אתה יכול גם לנצל 5 נקודות חיים מהמאגר כדי להסיר מהיצור את המצב מורעל; הנקודות האלה אינן מחזירות ליצור גם נקודות חיים.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        למדת להטיל לחשים באמצעות תפילה ומדיטציה. ראה ״לחשים״ לכללי הטלת לחשים. המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי פלאדין, המופיעים ברשימת לחשי הפלאדין בהמשך תיאור המקצוע.

        תאי לחשים. טבלת יכולות הפלאדין מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר שני לחשי פלאדין מדרגה 1. מומלצים גבורה ומהלומה צורבת.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כפלאדין, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות הפלאדין. בכל פעם שהמספר הזה גדל, בחר לחשי פלאדין נוספים עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלת יכולות הפלאדין. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים. לדוגמה, אם אתה פלאדין בדרגה 5, רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשי פלאדין מדרגה 1 או 2 בכל שילוב.

        אם יכולת אחרת של פלאדין מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי פלאדין עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול להחליף לחש אחד ברשימה שלך בלחש פלאדין אחר שיש לך עבורו תאי לחשים.

        תכונת הטלת לחשים. כריזמה היא תכונת הטלת הלחשים שלך ללחשי הפלאדין שלך.

        מוקד לחשים. אתה יכול להשתמש בסמל קדוש כמוקד לחשים ללחשי הפלאדין שלך.
    - name: "אומנות נשק"
      level: 1
      description: |-
        האימון שלך בנשק מאפשר לך להשתמש בתכונות האומנות של שני סוגי נשק לבחירתך שיש לך שליטה בהם, כגון חרבות ארוכות וכידונים.

        בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול לשנות את סוגי הנשק שבחרת. לדוגמה, אתה יכול לעבור לשימוש בתכונות האומנות של הלברדים ואלות שרשרת.
    - name: "סגנון לחימה"
      level: 2
      description: |-
        אתה מקבל כשרון סגנון לחימה לבחירתך (ראה ״כשרונות״ לכשרונות). במקום לבחור באחד הכשרונות האלה, אתה יכול לבחור באפשרות שלהלן.

        לוחם מבורך. אתה לומד שני לחשונים של כוהן לבחירתך (ראה את פרק מקצוע הכוהן לרשימת לחשי הכוהן). מומלצים הדרכה ולהבה קדושה. הלחשונים שנבחרו נחשבים לחשי פלאדין עבורך, וכריזמה היא תכונת הטלת הלחשים שלך עבורם. בכל פעם שאתה עולה דרגה כפלאדין, אתה יכול להחליף אחד מהלחשונים האלה בלחשון אחר של כוהן.
    - name: "מהלומת הפלאדין"
      level: 2
      description: |-
        הלחש מהלומה אלוהית תמיד מוכן אצלך. בנוסף, אתה יכול להטיל אותו מבלי לנצל תא לחשים, אך עליך לסיים מנוחה ארוכה לפני שתוכל להטיל אותו בדרך הזאת שוב.
    - name: "תיעול אלוהי"
      level: 3
      description: |-
        אתה יכול לתעל אנרגיה אלוהית ישירות מהמישורים החיצוניים ולהשתמש בה כדי להניע השפעות קסומות. אתה מתחיל עם השפעה אחת כזאת: חוש אלוהי, המתואר להלן. יכולות אחרות של פלאדין מעניקות אפשרויות השפעה נוספות של תיעול אלוהי. בכל פעם שאתה משתמש בתיעול האלוהי של המקצוע הזה, אתה בוחר איזו השפעה מהמקצוע הזה ליצור.

        אתה יכול להשתמש בתיעול האלוהי של המקצוע הזה פעמיים. אתה מחזיר שימוש אחד שנוצל בתום מנוחה קצרה, ואת כל השימושים שנוצלו בתום מנוחה ארוכה. אתה מקבל שימוש נוסף כשאתה מגיע לדרגה 11 של פלאדין.

        אם השפעה של תיעול אלוהי דורשת זריקת הצלה, דרגת הקושי שווה לדרגת הקושי להצלה נגד לחשים מיכולת הטלת הלחשים של המקצוע הזה.

        חוש אלוהי. בפעולה נוספת, אתה יכול לפתוח את מודעותך כדי לזהות יצורי מרום, בני-תופת ואל-מתים. במשך 10 הדקות הבאות או עד שאתה נכנס למצב חסר יכולת פעולה, אתה יודע את מיקומו של כל יצור מהסוגים האלה בטווח של 60 רגל ממך, ואתה יודע מהו סוג היצור. באותו רדיוס אתה גם מזהה את נוכחותו של כל מקום או חפץ שקודש או חולל, כמו בלחש קידוש.
    - name: "תת-מקצוע פלאדין"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של פלאדין לבחירתך. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של פלאדין. למשך שארית הקריירה שלך, אתה מקבל כל אחת מיכולות תת-המקצוע שלך שדרגתה כדרגת הפלאדין שלך או נמוכה ממנה.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פלאדין.
    - name: "התקפה נוספת"
      level: 5
      description: |-
        אתה יכול לתקוף פעמיים במקום פעם אחת בכל פעם שאתה נוקט פעולת התקפה בתורך.
    - name: "סוס נאמן"
      level: 5
      description: |-
        אתה יכול לקרוא לעזרתה של בהמת רכיבה מעולם אחר. הלחש מציאת בהמת רכיבה תמיד מוכן אצלך.

        אתה יכול גם להטיל את הלחש פעם אחת מבלי לנצל תא לחשים, ואתה מחזיר את היכולת לעשות זאת כשאתה מסיים מנוחה ארוכה.
    - name: "מעטה הגנה"
      level: 6
      description: |-
        אתה מקרין מעטה מגן בלתי נראה בהילה של 10 רגל שמקורה בך. המעטה אינו פעיל כל עוד אתה במצב חסר יכולת פעולה.

        אתה ובעלי בריתך שבמעטה מקבלים בונוס לזריקות הצלה השווה למתאם הכריזמה שלך (בונוס מינימלי של +1).

        אם נוכח פלאדין נוסף, יצור יכול ליהנות ממעטה הגנה אחד בלבד בכל רגע נתון; היצור בוחר באיזה מהמעטים ליהנות בעודו בתוכם.
    - name: "יכולת תת-מקצוע"
      level: 7
      description: |-
        אתה מקבל יכולת מתת-המקצוע הפלאדין שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פלאדין.
    - name: "הדחת אויבים"
      level: 9
      description: "בפעולת קסם, אתה יכול לנצל שימוש אחד בתיעול האלוהי של המקצוע הזה כדי להכריע אויבים ביראת כבוד. כשאתה מציג את הסמל הקדוש שלך או את נשקך, אתה יכול לבחור כיעדים מספר יצורים השווה למתאם הכריזמה שלך (מינימום יצור אחד) שאתה רואה בטווח של 60 רגל ממך. כל יעד חייב להצליח בזריקת הצלה בחוכמה, ואם לא, הוא נמצא במצב מבוהל למשך דקה אחת או עד שהוא סופג נזק כלשהו. כל עוד הוא מבוהל בדרך זו, יעד יכול לעשות רק אחד מהבאים בתוריו: לנוע, לנקוט פעולה או לנקוט פעולה נוספת."
    - name: "מעטה אומץ"
      level: 10
      description: |-
        אתה ובעלי בריתך חסינים למצב מבוהל כל עוד אתם במעטה ההגנה שלך. אם בן ברית מבוהל נכנס למעטה, המצב הזה אינו משפיע עליו כל עוד הוא שם.
    - name: "מכות קורנות"
      level: 11
      description: |-
        המכות שלך נושאות כעת כוח על-טבעי. כשאתה פוגע ביעד בהטלת התקפה בנשק קרב מגע או במכה לא חמושה, היעד סופג 1d8 נזק קורן נוסף.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פלאדין.
    - name: "מגע משקם"
      level: 14
      description: "כשאתה משתמש בהנחת ידיים על יצור, אתה יכול להסיר ממנו גם מצב אחד או יותר מהמצבים הבאים: עיוור, מוקסם, חירש, מבוהל, משותק או המום. עליך לנצל 5 נקודות חיים ממאגר הריפוי של הנחת הידיים עבור כל אחד מהמצבים שאתה מסיר; הנקודות האלה אינן מחזירות ליצור גם נקודות חיים."
    - name: "יכולת תת-מקצוע"
      level: 15
      description: |-
        אתה מקבל יכולת מתת-המקצוע הפלאדין שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פלאדין.
    - name: "הרחבת המעטה"
      level: 18
      description: |-
        מעטה ההגנה שלך הוא מעתה הילה של 30 רגל.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת ראיית אמת.
