    features:
    - name: "קריאות קמאיות"
      level: 1
      description: |-
        חשפת קריאות קמאיות, פיסות ידע אסור שמחדירות בך יכולת קסומה מתמשכת או לקחים אחרים. אתה מקבל קריאה אחת לבחירתך, כגון ברית הספר. הקריאות מתוארות בסעיף ״אפשרויות קריאה קמאית״ בהמשך תיאור המקצוע.

        דרישות קדם. אם לקריאה יש דרישת קדם, עליך לעמוד בה כדי ללמוד את הקריאה. לדוגמה, אם קריאה דורשת שתהיה מכשף בדרגה 5 ומעלה, אתה יכול לבחור בקריאה כשאתה מגיע לדרגה 5 של מכשף.

        החלפת קריאות וקבלתן. בכל פעם שאתה עולה דרגה כמכשף, אתה יכול להחליף אחת מהקריאות שלך בקריאה אחרת שאתה עומד בדרישותיה. אינך יכול להחליף קריאה אם היא דרישת קדם לקריאה אחרת שיש לך.

        כשאתה מגיע לדרגות מסוימות של מכשף, אתה מקבל קריאות נוספות לבחירתך, כמפורט בעמודת הקריאות בטבלת יכולות המכשף.

        אינך יכול לבחור באותה קריאה יותר מפעם אחת, אלא אם תיאורה קובע אחרת.
    - name: "קסם ברית"
      level: 1
      description: |-
        באמצעות טקס נסתר, כרתת ברית עם ישות מסתורית כדי לקבל כוחות קסם.

        הישות היא קול בצללים, זהותה לא ברורה, אך המתנה שלה אליך מוחשית: היכולת להטיל לחשים. ראה ״לחשים״ לכללי הטלת לחשים.

        המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי מכשף, המופיעים ברשימת לחשי המכשף בהמשך תיאור המקצוע.

        לחשונים. אתה מכיר שני לחשוני מכשף לבחירתך. מומלצים פרץ קמאי ולהטוטנות.

        בכל פעם שאתה עולה דרגה כמכשף, אתה יכול להחליף אחד מהלחשונים שלך מהיכולת הזאת בלחשון מכשף אחר לבחירתך.

        כשאתה מגיע לדרגות 4 ו-10 של מכשף, אתה לומד לחשון מכשף נוסף לבחירתך, כמפורט בעמודת הלחשונים בטבלת יכולות המכשף.

        תאי לחשים. טבלת יכולות המכשף מראה כמה תאי לחשים יש לך להטלת לחשי המכשף שלך מדרגות 1–5. הטבלה מראה גם את דרגת התאים האלה, שכולם מאותה דרגה. אתה מחזיר את כל תאי קסם הברית שנוצלו כשאתה מסיים מנוחה קצרה או ארוכה.

        לדוגמה, כשאתה מכשף בדרגה 5, יש לך שני תאי לחשים מדרגה 3. כדי להטיל את הלחש הקסמת אדם מדרגה 1, עליך להוציא אחד מהתאים האלה, ואתה מטיל אותו כלחש מדרגה 3.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר שני לחשי מכשף מדרגה 1. מומלצים הקסמת אדם וקללת מכשף.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כמכשף, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות המכשף. בכל פעם שהמספר הזה גדל, בחר לחשי מכשף נוספים עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלה. הלחשים שנבחרו חייבים להיות מדרגה שאינה גבוהה ממה שמופיע בעמודת דרגת התא בטבלה לדרגתך. כשאתה מגיע לדרגה 6, למשל, אתה לומד לחש מכשף חדש, שיכול להיות מדרגות 1–3.

        אם יכולת אחרת של מכשף מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי מכשף עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה עולה דרגה כמכשף, אתה יכול להחליף לחש אחד ברשימה שלך בלחש מכשף אחר מדרגה מתאימה.

        תכונת הטלת לחשים. כריזמה היא תכונת הטלת הלחשים ללחשי המכשף שלך.

        מוקד לחשים. אתה יכול להשתמש במוקד מאגי כמוקד לחשים ללחשי המכשף שלך.
