      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פייטן.
    - name: "מעיין ההשראה"
      level: 5
      description: |-
        מעתה אתה מחזיר את כל השימושים שנוצלו של השראה פייטנית כשאתה מסיים מנוחה קצרה או ארוכה.

        בנוסף, אתה יכול לנצל תא לחשים (ללא צורך בפעולה) כדי להחזיר שימוש אחד שנוצל של השראה פייטנית.
    - name: "יכולת תת-מקצוע"
      level: 6
      description: |-
        אתה מקבל יכולת מתת-המקצוע הפייטן שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "מנגינת נגד"
      level: 7
      description: |-
        אתה יכול להשתמש בצלילים או במילות כוח כדי לשבש השפעות המשפיעות על התודעה. אם אתה או יצור בטווח של 30 רגל ממך נכשלים בזריקת הצלה נגד השפעה שמחילה את המצב מוקסם או מבוהל, אתה יכול לנקוט תגובה כדי לגרום להטלה חוזרת של ההצלה, ולהטלה החדשה יש יתרון.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פייטן.
    - name: "מומחיות"
      level: 9
      description: |-
        אתה מקבל מומחיות (ראה ״מילון חוקים״) בשתיים מהמיומנויות שאתה שולט בהן, לבחירתך. הופעה ושכנוע מומלצות אם אתה שולט בהן.

        בדרגה 9 של פייטן, אתה מקבל מומחיות בשתי מיומנויות נוספות שאתה שולט בהן, לבחירתך.
    - name: "סודות קסם"
      level: 10
      description: |-
        למדת סודות ממסורות קסם שונות. בכל פעם שאתה מגיע לדרגה של פייטן (כולל הדרגה הזאת) ומספר הלחשים המוכנים בטבלת יכולות הפייטן גדל, אתה יכול לבחור כל אחד מהלחשים המוכנים החדשים שלך מרשימות הלחשים של הפייטן, הכוהן, הדרואיד והאשף, והלחשים שנבחרו נחשבים לחשי פייטן עבורך (ראה את פרק המקצוע לרשימת הלחשים שלו). בנוסף, בכל פעם שאתה מחליף לחש שהוכן עבור המקצוע הזה, אתה יכול להחליף אותו בלחש מהרשימות האלה.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פייטן.
    - name: "יכולת תת-מקצוע"
      level: 14
      description: |-
        אתה מקבל יכולת מתת-המקצוע הפייטן שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של פייטן.
    - name: "השראה עליונה"
      level: 18
      description: |-
        כשאתה מטיל יוזמה, אתה מחזיר שימושים שנוצלו של השראה פייטנית עד שיהיו לך שניים, אם יש לך פחות מכך.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת היזכרות בלחשים.
    - name: "מילות הבריאה"
      level: 20
      description: "שלטת בשתיים ממילות הבריאה: מילות החיים והמוות. לכן הלחשים מילת כוח: ריפוי ומילת כוח: מוות תמיד מוכנים אצלך. כשאתה מטיל אחד מהם, אתה יכול לבחור בו גם יצור שני, אם הוא בטווח של 10 רגל מהיעד הראשון."
