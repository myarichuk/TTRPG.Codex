- id: barbarian
  name: "ברברי"
  description: |-
    **תכונה עיקרית:** כוח  
    **קוביית חיים:** d12 לכל דרגה של ברברי  
    **שליטה בזריקות הצלה:** כוח, חוסן  
    **שליטה במיומנויות:** בחר 2: טיפול בחיות, אתלטיקה, הפחדה, טבע, הבחנה או השרדות  
    **שליטה בנשק:** נשק פשוט, נשק צבאי  
    **אימון בשריון:** שריון קל, שריון בינוני, מגנים  
    **ציוד התחלתי:** (א) גרזן קרב, 4 גרזני יד, חבילת מגלה ו-15 מ״ז; או (ב) 75 מ״ז
  properties:
    skillChoices: "בחר 2: טיפול בחיות, אתלטיקה, הפחדה, טבע, הבחנה או השרדות"
    startingEquipment: "(א) גרזן קרב, 4 גרזני יד, חבילת מגלה ו-15 מ״ז; או (ב) 75 מ״ז"
    multiclassing: "דרישה: כוח 13+. שליטות שנרכשות: מגנים, נשק צבאי"
    features:
    - name: "זעם"
      level: 1
      description: |-
        אתה יכול למלא את עצמך בכוח קדמוני שנקרא זעם, כוח שמעניק לך עוצמה וחוסן יוצאי דופן. אתה יכול להיכנס אליו כפעולה נוספת אם אינך לובש שריון כבד.

        אתה יכול להיכנס לזעם מספר פעמים השווה למספר המופיע לדרגת הברברי שלך בעמודת הזעמים בטבלת יכולות הברברי. אתה מחזיר שימוש אחד שנוצל בתום מנוחה קצרה, ואת כל השימושים שנוצלו בתום מנוחה ארוכה.

        כל עוד הזעם פעיל, הוא פועל לפי הכללים הבאים.

        **עמידות בפני נזק.** יש לך עמידות בפני נזק מוחץ, דוקר וחותך.

        **נזק זעם.** כשאתה מבצע התקפה באמצעות כוח, בין בנשק ובין במכה לא חמושה, ופוגע ביעד, אתה מקבל בונוס לנזק שגדל ככל שאתה עולה בדרגות כברברי, כמפורט בעמודת נזק הזעם בטבלת יכולות הברברי.

        **יתרון בכוח.** יש לך יתרון בבדיקות כוח ובזריקות הצלה בכוח.

        **ללא ריכוז או לחשים.** אתה אינך יכול לשמור על ריכוז, ואינך יכול להטיל לחשים.

        **משך.** הזעם נמשך עד סוף התור הבא שלך, ומסתיים מוקדם יותר אם אתה לובש שריון כבד או נכנס למצב חסר יכולת פעולה. אם הזעם עדיין פעיל בתור הבא שלך, אתה יכול להאריך אותו בסבב נוסף באחת הדרכים הבאות:

        - לבצע הטלת התקפה נגד אויב.

        - לאלץ אויב לבצע זריקת הצלה.

        - להשתמש בפעולה נוספת כדי להאריך את הזעם.

        בכל פעם שהזעם מוארך, הוא נמשך עד סוף התור הבא שלך. אתה יכול לשמור על זעם עד 10 דקות.
    - name: "הגנה ללא שריון"
      level: 1
      description: |-
        כל עוד אינך לובש שום שריון, דרגת השריון הבסיסית שלך שווה ל-10 ועוד מתאמי הזריזות והחוסן שלך. אתה יכול להשתמש במגן ועדיין ליהנות מהיתרון הזה.
    - name: "אומנות נשק"
      level: 1
      description: |-
        האימון שלך בנשק מאפשר לך להשתמש בתכונות האומנות של שני סוגי נשק פשוט או צבאי לקרב מגע לבחירתך, כגון גרזני קרב וגרזני יד. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול לתרגל תרגילי נשק ולשנות אחת מבחירות הנשק האלה.

        כשאתה מגיע לדרגות מסוימות של ברברי, אתה מקבל את היכולת להשתמש בתכונות האומנות של סוגי נשק נוספים, כמפורט בעמודת אומנות נשק בטבלת יכולות הברברי.
    - name: "חוש סכנה"
      level: 2
      description: |-
        אתה מפתח תחושה על-טבעית לכך שמשהו אינו כשורה, והיא מעניקה לך יתרון בהתחמקות מסכנות. יש לך יתרון בזריקות הצלה בזריזות, אלא אם אתה במצב חסר יכולת פעולה.
    - name: "התקפה פזיזה"
      level: 2
      description: |-
        אתה יכול להשליך הצידה כל דאגה להגנה כדי לתקוף בפראות מוגברת. כשאתה מבצע את הטלת ההתקפה הראשונה שלך בתורך, אתה יכול להחליט לתקוף בפזיזות. כך אתה מקבל יתרון בהטלות התקפה בכוח עד תחילת תורך הבא,

        אך הטלות התקפה נגדך מקבלות יתרון באותו פרק זמן.
    - name: "תת-מקצוע ברברי"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של ברברי לבחירתך. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של ברברי. למשך שארית הקריירה שלך, אתה מקבל כל אחת מיכולות תת-המקצוע שלך שדרגתה כדרגת הברברי שלך או נמוכה ממנה.
    - name: "ידע קדמוני"
      level: 3
      description: |-
        אתה מקבל שליטה במיומנות נוספת לבחירתך מרשימת המיומנויות העומדת לרשות ברבריים בדרגה 1.

        בנוסף, כל עוד הזעם שלך פעיל, אתה יכול לתעל כוח קדמוני כשאתה מנסה משימות מסוימות: בכל פעם שאתה מבצע בדיקת תכונה באחת מהמיומנויות הבאות, אתה יכול לבצע אותה כבדיקת כוח גם אם היא משתמשת בדרך כלל בתכונה אחרת:

        אקרובטיקה, הפחדה, הבחנה, התגנבות או השרדות. כשאתה משתמש ביכולת הזאת, הכוח שלך מייצג את העוצמה הקדמונית הזורמת בך ומשחיזה את זריזותך, יציבתך וחושיך.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של ברברי.
    - name: "התקפה נוספת"
      level: 5
      description: |-
        אתה יכול לתקוף פעמיים במקום פעם אחת בכל פעם שאתה נוקט פעולת התקפה בתורך.
    - name: "תנועה מהירה"
      level: 5
      description: |-
        המהירות שלך גדלה ב-10 רגל כל עוד אינך לובש שריון כבד.
    - name: "יכולת תת-מקצוע"
      level: 6
      description: |-
        אתה מקבל יכולת מתת-המקצוע הברברי שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "אינסטינקט פראי"
      level: 7
      description: |-
        האינסטינקטים שלך חדים עד כדי כך שיש לך יתרון בהטלות יוזמה.
    - name: "זינוק אינסטינקטיבי"
      level: 7
      description: |-
        כחלק מהפעולה הנוספת שאתה נוקט כדי להיכנס לזעם, אתה יכול לנוע עד חצי מהמהירות שלך.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של ברברי.
    - name: "מכה אכזרית"
      level: 9
      description: |-
        אם אתה משתמש בהתקפה פזיזה, אתה יכול לוותר על כל יתרון בהטלת התקפה אחת מבוססת כוח לבחירתך בתורך. להטלת ההתקפה שנבחרה אסור שיהיה חיסרון. אם הטלת ההתקפה שנבחרה פוגעת, היעד סופג 1d10 נזק נוסף מאותו סוג שגרם הנשק או המכה הלא חמושה, ואתה יכול לגרום להשפעה אחת של מכה אכזרית לבחירתך. אלה אפשרויות ההשפעה העומדות לרשותך.

        מכה כבדה. היעד נדחף 15 רגל בקו ישר ממך. לאחר מכן אתה יכול לנוע עד חצי מהמהירות שלך בקו ישר לעבר היעד מבלי לעורר התקפות מזדמנות.

        מכת עקב. מהירותו של היעד פוחתת ב-15 רגל עד תחילת תורך הבא. יעד יכול להיות מושפע ממכת עקב אחת בלבד בכל פעם, האחרונה שבהן.
    - name: "יכולת תת-מקצוע"
      level: 10
      description: |-
        אתה מקבל יכולת מתת-המקצוע הברברי שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "זעם בלתי נלאה"
      level: 11
      description: |-
        הזעם שלך יכול לשמור אותך בלחימה למרות פצעים קשים. אם אתה יורד ל-0 נקודות חיים בזמן שהזעם שלך פעיל ואינך מת מיד, אתה יכול לבצע זריקת הצלה בחוסן בדרגת קושי 10. אם אתה מצליח, נקודות החיים שלך משתנות במקום זאת למספר השווה לכפל דרגת הברברי שלך.

        בכל פעם שאתה משתמש ביכולת הזאת אחרי הפעם הראשונה, דרגת הקושי גדלה ב-5. כשאתה מסיים מנוחה קצרה או ארוכה, דרגת הקושי חוזרת ל-10.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של ברברי.
    - name: "מכה אכזרית משופרת"
      level: 13
      description: |-
        שכללת דרכים חדשות לתקוף בזעם. ההשפעות הבאות נוספות מעתה לאפשרויות המכה האכזרית שלך.

        מכה מערערת. ליעד יש חיסרון בזריקת ההצלה הבאה שהוא מבצע, והוא אינו יכול לבצע התקפות מזדמנות עד תחילת תורך הבא.

        מכה מבקעת. לפני תחילת תורך הבא, הטלת ההתקפה הבאה שמבצע יצור אחר נגד היעד מקבלת בונוס של +5 להטלה. הטלת התקפה יכולה לקבל בונוס אחד בלבד של מכה מבקעת.
    - name: "יכולת תת-מקצוע"
      level: 14
      description: |-
        אתה מקבל יכולת מתת-המקצוע הברברי שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "זעם מתמיד"
      level: 15
      description: |-
        כשאתה מטיל יוזמה, אתה יכול להחזיר את כל שימושי הזעם שנוצלו. לאחר שהחזרת שימושי זעם בדרך זו, אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.

        בנוסף, הזעם שלך עז עד כדי כך שהוא נמשך עכשיו 10 דקות מבלי שתצטרך לעשות דבר כדי להאריך אותו מסבב לסבב. הזעם שלך מסתיים מוקדם יותר אם אתה במצב חסר הכרה (ולא רק במצב חסר יכולת פעולה) או לובש שריון כבד.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של ברברי.
    - name: "מכה אכזרית משופרת"
      level: 17
      description: |-
        הנזק הנוסף של המכה האכזרית שלך גדל ל-2d10. בנוסף, אתה יכול להשתמש בשתי השפעות שונות של מכה אכזרית בכל פעם שאתה משתמש ביכולת המכה האכזרית שלך.
    - name: "עוצמה בלתי ניתנת לשבירה"
      level: 18
      description: |-
        אם הסכום שלך בבדיקת כוח או בזריקת הצלה בכוח נמוך מערך הכוח שלך, אתה יכול להשתמש בערך הזה במקום הסכום.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת התקפה בלתי ניתנת לעצירה.
    - name: "אלוף קדמוני"
      level: 20
      description: |-
        אתה מגלם את הכוח הקדמוני. ערכי הכוח והחוסן שלך גדלים ב-4, עד מקסימום של 25.
- id: bard
  name: "פייטן"
  description: |-
    **תכונה עיקרית:** כריזמה  
    **קוביית חיים:** d8 לכל דרגה של פייטן  
    **שליטה בזריקות הצלה:** זריזות, כריזמה  
    **שליטה במיומנויות:** בחר 3 מיומנויות כלשהן; שלושה כלי נגינה לבחירתך  
    **שליטה בנשק:** נשק פשוט  
    **אימון בשריון:** שריון קל  
    **ציוד התחלתי:** (א) שריון עור, 2 פגיונות, כלי נגינה לבחירתך, חבילת בדרן ו-19 מ״ז; או (ב) 90 מ״ז
  properties:
    skillChoices: "בחר 3 מיומנויות כלשהן; שלושה כלי נגינה לבחירתך"
    startingEquipment: "(א) שריון עור, 2 פגיונות, כלי נגינה לבחירתך, חבילת בדרן ו-19 מ״ז; או (ב) 90 מ״ז"
    multiclassing: "דרישה: כריזמה 13+. שליטות שנרכשות: שריון קל"
    features:
    - name: "השראה פייטנית"
      level: 1
      description: |-
        אתה יכול להשרות השראה על-טבעית על אחרים באמצעות מילים, מוזיקה או ריקוד. ההשראה הזאת מיוצגת בקוביית ההשראה הפייטנית שלך, שהיא d6.

        שימוש בהשראה פייטנית. בפעולה נוספת, אתה יכול להשרות השראה על יצור אחר בטווח של 60 רגל ממך שיכול לראות או לשמוע אותך.

        היצור מקבל אחת מקוביות ההשראה הפייטנית שלך. ליצור יכולה להיות קוביית השראה פייטנית אחת בלבד בכל רגע נתון.

        פעם אחת במהלך השעה הקרובה, כשהיצור נכשל במבחן d20, הוא יכול להטיל את קוביית ההשראה הפייטנית ולהוסיף את התוצאה ל-d20, ובכך אולי להפוך כישלון להצלחה. קוביית השראה פייטנית מנוצלת כשהיא מוטלת.

        מספר שימושים. אתה יכול להעניק קוביית השראה פייטנית מספר פעמים השווה למתאם הכריזמה שלך (מינימום פעם אחת), ואתה מחזיר את כל השימושים שנוצלו כשאתה מסיים מנוחה ארוכה.

        בדרגות גבוהות יותר. קוביית ההשראה הפייטנית שלך משתנה כשאתה מגיע לדרגות מסוימות של פייטן, כמפורט בעמודת קוביית הפייטן בטבלת יכולות הפייטן. הקובייה הופכת ל-d8 בדרגה 5, ל-d10 בדרגה 10 ול-d12 בדרגה 15.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        למדת להטיל לחשים באמצעות אמנויות הפייטנות שלך. ראה ״לחשים״ לכללי הטלת לחשים. המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי פייטן, המופיעים ברשימת לחשי הפייטן בהמשך תיאור המקצוע.

        לחשונים. אתה מכיר שני לחשונים לבחירתך מרשימת לחשי הפייטן. מומלצים אורות מרקדים ולעג אכזרי.

        בכל פעם שאתה עולה דרגה כפייטן, אתה יכול להחליף אחד מהלחשונים שלך בלחשון אחר לבחירתך מרשימת לחשי הפייטן.

        כשאתה מגיע לדרגות 4 ו-10 של פייטן, אתה לומד לחשון נוסף לבחירתך מרשימת לחשי הפייטן, כמפורט בעמודת הלחשונים בטבלת יכולות הפייטן.

        תאי לחשים. טבלת יכולות הפייטן מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר ארבעה לחשים מדרגה 1 מרשימת לחשי הפייטן. מומלצים הקסמת אדם, ריסוס צבעים, לחישות צורמות ומילת ריפוי.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כפייטן, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות הפייטן. בכל פעם שהמספר הזה גדל, בחר לחשים נוספים מרשימת לחשי הפייטן עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלה. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים.

        לדוגמה, אם אתה פייטן בדרגה 3,

        רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשים מדרגות 1 ו-2 בכל שילוב.

        אם יכולת אחרת של פייטן מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי פייטן עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה עולה דרגה כפייטן, אתה יכול להחליף לחש אחד ברשימה שלך בלחש פייטן אחר שיש לך עבורו תאי לחשים.

        תכונת הטלת לחשים. כריזמה היא תכונת הטלת הלחשים שלך ללחשי הפייטן שלך.

        מוקד לחשים. אתה יכול להשתמש בכלי נגינה כמוקד לחשים ללחשי הפייטן שלך.
    - name: "מומחיות"
      level: 2
      description: |-
        אתה מקבל מומחיות (ראה ״מילון חוקים״) בשתיים מהמיומנויות שאתה שולט בהן, לבחירתך. הופעה ושכנוע מומלצות אם אתה שולט בהן.

        בדרגה 9 של פייטן, אתה מקבל מומחיות בשתי מיומנויות נוספות שאתה שולט בהן, לבחירתך.
    - name: "בקי בכול"
      level: 2
      description: |-
        אתה יכול להוסיף מחצית מתוסף השליטה שלך (עיגול כלפי מטה) לכל בדיקת תכונה שאתה מבצע המשתמשת במיומנות שאינך שולט בה ושאינה משתמשת אחרת בתוסף השליטה שלך.

        לדוגמה, אם אתה מבצע בדיקת כוח (אתלטיקה) ואינך שולט באתלטיקה, אתה יכול להוסיף לבדיקה מחצית מתוסף השליטה שלך.
