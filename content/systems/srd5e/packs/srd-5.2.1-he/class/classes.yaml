- id: ranger
  name: "סייר"
  description: |-
    **תכונה עיקרית:** זריזות וחוכמה  
    **קוביית חיים:** d10 לכל דרגה של סייר  
    **שליטה בזריקות הצלה:** כוח, זריזות  
    **שליטה במיומנויות:** בחר 3: טיפול בחיות, אתלטיקה, תובנה, חקירה, טבע, הבחנה, התגנבות או השרדות  
