- id: wizard
  name: "אשף"
  description: |-
    **תכונה עיקרית:** תבונה  
    **קוביית חיים:** d6 לכל דרגה של אשף  
    **שליטה בזריקות הצלה:** תבונה, חוכמה  
    **שליטה במיומנויות:** בחר 2: מאגיה, היסטוריה, תובנה, חקירה, רפואה או דת  
    **שליטה בנשק:** נשק פשוט  
    **ציוד התחלתי:** (א) 2 פגיונות, מוקד מאגי (מטה), גלימה, ספר לחשים, חבילת מלומד ו-5 מ״ז; או (ב) 55 מ״ז
  properties:
    skillChoices: "בחר 2: מאגיה, היסטוריה, תובנה, חקירה, רפואה או דת"
    startingEquipment: "(א) 2 פגיונות, מוקד מאגי (מטה), גלימה, ספר לחשים, חבילת מלומד ו-5 מ״ז; או (ב) 55 מ״ז"
    multiclassing: "דרישה: תבונה 13+"
    features:
    - name: "התאוששות מאגית"
      level: 1
      description: |-
        אתה יכול להחזיר לעצמך מעט מהאנרגיה הקסומה שלך באמצעות עיון בספר הלחשים שלך. כשאתה מסיים מנוחה קצרה, אתה יכול לבחור תאי לחשים שנוצלו כדי להחזיר אותם.

        סך הדרגות של תאי הלחשים יכול להיות לכל היותר מחצית מדרגת האשף שלך (עיגול כלפי מעלה), ואף אחד מהתאים אינו יכול להיות מדרגה 6 או גבוהה יותר.

        לדוגמה, אם אתה אשף בדרגה 4, אתה יכול להחזיר תאי לחשים בשווי שתי דרגות לכל היותר, כלומר תא לחשים אחד מדרגה 2 או שני תאי לחשים מדרגה 1.

        לאחר שהשתמשת ביכולת הזאת, אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.
    - name: "בקי בטקסים"
      level: 1
      description: |-
        אתה יכול להטיל כל לחש כטקס אם יש ללחש תג טקס והלחש נמצא בספר הלחשים שלך. אינך חייב להכין את הלחש, אך עליך לקרוא מהספר כדי להטיל לחש בדרך הזאת.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        כתלמיד של קסם מאגי, למדת להטיל לחשים. ראה ״לחשים״ לכללי הטלת לחשים.

        המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי אשף, המופיעים ברשימת לחשי האשף בהמשך תיאור המקצוע.

        לחשונים. אתה מכיר שלושה לחשוני אשף לבחירתך. מומלצים אור, יד האשף וקרן כפור.

        בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול להחליף אחד מהלחשונים שלך מהיכולת הזאת בלחשון אשף אחר לבחירתך.

        בדרגות מסוימות של אשף אתה לומד לחשון אשף נוסף לבחירתך, כמפורט בעמודת הלחשונים בטבלת יכולות האשף.

        ספר לחשים. החניכות שלך כאשף הגיעה לשיאה ביצירת ספר ייחודי: ספר הלחשים שלך. זהו חפץ קטנטן ששוקל 3 ליברות, מכיל 100 עמודים, ואפשר לקרוא בו רק אתה או מי שמטיל זיהוי. אתה קובע את מראה הספר ואת החומרים שלו, כגון כרך בעל שולי זהב או אוסף דפי קלף קשורים בחוט.

        הספר מכיל את הלחשים מדרגה 1 ומעלה שאתה מכיר. בתחילה הוא מכיל שישה לחשי אשף מדרגה 1 לבחירתך.

        מומלצים גילוי קסם, נפילת נוצה, שריון האשף, טיל קסם, שינה וגל רעם.

        בכל פעם שאתה עולה דרגה כאשף אחרי דרגה 1, הוסף לספר הלחשים שלך שני לחשי אשף לבחירתך. כל אחד מהלחשים האלה חייב להיות מדרגה שיש לך עבורה תאי לחשים, כמפורט בטבלת יכולות האשף.

        הלחשים הם פרי מחקר מאגי שאתה מבצע בקביעות.

        תאי לחשים. טבלת יכולות האשף מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. לשם כך, בחר ארבעה לחשים מתוך ספר הלחשים שלך. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כאשף, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות האשף. בכל פעם שהמספר הזה גדל, בחר לחשי אשף נוספים עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלה. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים. לדוגמה, אם אתה אשף בדרגה 3, רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשים מדרגות 1 ו-2 בכל שילוב, הנבחרים מתוך ספר הלחשים שלך.

        אם יכולת אחרת של אשף מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי אשף עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול לשנות את רשימת הלחשים המוכנים שלך ולהחליף כל אחד מהלחשים בה בלחשים מתוך ספר הלחשים שלך.

        תכונת הטלת לחשים. תבונה היא תכונת הטלת הלחשים ללחשי האשף שלך.

        מוקד לחשים. אתה יכול להשתמש במוקד מאגי או בספר הלחשים שלך כמוקד לחשים ללחשי האשף שלך.
