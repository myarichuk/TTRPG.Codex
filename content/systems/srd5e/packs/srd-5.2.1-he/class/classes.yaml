    **אימון בשריון:** שריון קל, שריון בינוני, מגנים  
    **ציוד התחלתי:** (א) שריון עור מסומר, חרב מעוקלת, חרב קצרה, קשת ארוכה, 20 חיצים, אשפה, מוקד דרואידי (ענף דבקון), חבילת מגלה ו-7 מ״ז; או (ב) 150 מ״ז
  properties:
    skillChoices: "בחר 3: טיפול בחיות, אתלטיקה, תובנה, חקירה, טבע, הבחנה, התגנבות או השרדות"
    startingEquipment: "(א) שריון עור מסומר, חרב מעוקלת, חרב קצרה, קשת ארוכה, 20 חיצים, אשפה, מוקד דרואידי (ענף דבקון), חבילת מגלה ו-7 מ״ז; או (ב) 150 מ״ז"
    multiclassing: "דרישה: זריזות 13+, חוכמה 13+. שליטות שנרכשות: שריון קל, שריון בינוני, מגנים, נשק צבאי"
    features:
    - name: "אויב מועדף"
      level: 1
      description: |-
        הלחש אות הצייד תמיד מוכן אצלך. אתה יכול להטיל אותו פעמיים מבלי לנצל תא לחשים, ואתה מחזיר את כל השימושים שנוצלו ביכולת הזאת כשאתה מסיים מנוחה ארוכה.

        מספר הפעמים שבהן אתה יכול להטיל את הלחש ללא תא לחשים גדל כשאתה מגיע לדרגות מסוימות של סייר, כמפורט בעמודת האויב המועדף בטבלת יכולות הסייר.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        למדת לתעל את מהות הקסם של הטבע כדי להטיל לחשים. ראה ״לחשים״ לכללי הטלת לחשים. המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי סייר, המופיעים ברשימת לחשי הסייר בהמשך תיאור המקצוע.

        תאי לחשים. טבלת יכולות הסייר מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר שני לחשי סייר מדרגה 1.

        מומלצים ריפוי פצעים ומכה מלכדת.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות כסייר, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות הסייר. בכל פעם שהמספר הזה גדל, בחר לחשי סייר נוספים עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלת יכולות הסייר. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים. לדוגמה, אם אתה סייר בדרגה 5, רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשי סייר מדרגה 1 או 2 בכל שילוב.

        אם יכולת אחרת של סייר מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי סייר עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול להחליף לחש אחד ברשימה שלך בלחש סייר אחר שיש לך עבורו תאי לחשים.

        תכונת הטלת לחשים. חוכמה היא תכונת הטלת הלחשים שלך ללחשי הסייר שלך.

        מוקד לחשים. אתה יכול להשתמש במוקד דרואידי כמוקד לחשים ללחשי הסייר שלך.
    - name: "אומנות נשק"
      level: 1
      description: |-
        האימון שלך בנשק מאפשר לך להשתמש בתכונות האומנות של שני סוגי נשק לבחירתך שיש לך שליטה בהם, כגון קשתות ארוכות וחרבות קצרות.

        בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול לשנות את סוגי הנשק שבחרת. לדוגמה, אתה יכול לעבור לשימוש בתכונות האומנות של חרבות מעוקלות וחרבות ארוכות.
    - name: "חוקר מיומן"
      level: 2
      description: |-
        הודות למסעותיך, אתה מקבל את היתרונות הבאים.

        מומחיות. בחר אחת מהמיומנויות שאתה שולט בהן ושאין לך בה מומחיות. אתה מקבל מומחיות במיומנות הזאת.

        שפות. אתה מכיר שתי שפות לבחירתך מטבלאות השפות ב״יצירת דמות״.
    - name: "סגנון לחימה"
      level: 2
      description: |-
        אתה מקבל כשרון סגנון לחימה לבחירתך (ראה ״כשרונות״). במקום לבחור באחד הכשרונות האלה, אתה יכול לבחור באפשרות שלהלן.

        לוחם דרואידי. אתה לומד שני לחשונים של דרואיד לבחירתך (ראה את פרק מקצוע הדרואיד לרשימת לחשי הדרואיד). מומלצים הדרכה וניצוץ כוכבי. הלחשונים שנבחרו נחשבים לחשי סייר עבורך, וחוכמה היא תכונת הטלת הלחשים שלך עבורם. בכל פעם שאתה עולה דרגה כסייר, אתה יכול להחליף אחד מהלחשונים האלה בלחשון אחר של דרואיד.
    - name: "תת-מקצוע סייר"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של סייר לבחירתך. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של סייר. למשך שארית הקריירה שלך, אתה מקבל כל אחת מיכולות תת-המקצוע שלך שדרגתה כדרגת הסייר שלך או נמוכה ממנה.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של סייר.
    - name: "התקפה נוספת"
      level: 5
      description: |-
        אתה יכול לתקוף פעמיים במקום פעם אחת בכל פעם שאתה נוקט פעולת התקפה בתורך.
    - name: "נדודים"
      level: 6
      description: |-
        המהירות שלך גדלה ב-10 רגל כל עוד אינך לובש שריון כבד. יש לך גם מהירות טיפוס ומהירות שחייה השוות למהירות שלך.
    - name: "יכולת תת-מקצוע"
      level: 7
      description: |-
        אתה מקבל יכולת מתת-המקצוע הסייר שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 12 ו-16 של סייר.
    - name: "מומחיות"
      level: 9
      description: |-
        בחר שתיים מהמיומנויות שאתה שולט בהן ושאין לך בהן מומחיות. אתה מקבל מומחיות במיומנויות האלה.
    - name: "חסר ליאות"
      level: 10
      description: |-
        כוחות קדמוניים מסייעים לך כעת להתדלק במסעותיך ומעניקים לך את היתרונות הבאים.

        נקודות חיים זמניות. בפעולת קסם, אתה יכול להעניק לעצמך מספר נקודות חיים זמניות השווה ל-1d8 ועוד מתאם החוכמה שלך (מינימום 1). אתה יכול להשתמש בפעולה הזאת מספר פעמים השווה למתאם החוכמה שלך (מינימום פעם אחת), ואתה מחזיר את כל השימושים שנוצלו כשאתה מסיים מנוחה ארוכה.

        הפחתת תשישות. בכל פעם שאתה מסיים מנוחה קצרה, דרגת התשישות שלך, אם יש לך כזו, פוחתת ב-1.
    - name: "יכולת תת-מקצוע"
      level: 11
      description: |-
        אתה מקבל יכולת מתת-המקצוע הסייר שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
