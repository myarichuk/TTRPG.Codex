      level: 3
      description: |-
        בפעולה נוספת, אתה מעניק לעצמך יתרון בהטלת ההתקפה הבאה שלך בתור הנוכחי. אתה יכול להשתמש ביכולת הזאת רק אם לא זזת במהלך התור הזה, ולאחר שהשתמשת בה המהירות שלך היא 0 עד סוף התור הנוכחי.
    - name: "העלאת ערך תכונה"
      level: 4
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 10, 12 ו-16 של נוכל.
    - name: "מכה ערמומית"
      level: 5
      description: |-
        פיתחת דרכים ערמומיות להשתמש בהתקפה המתגנבת שלך. כשאתה גורם נזק של התקפה מתגנבת, אתה יכול להוסיף אחת מהשפעות המכה הערמומית הבאות.

        לכל השפעה יש עלות בקוביות, שהיא מספר קוביות הנזק של ההתקפה המתגנבת שעליך לוותר עליהן כדי להוסיף את ההשפעה. אתה מסיר את הקובייה לפני ההטלה, וההשפעה מתרחשת מיד לאחר שהנזק של ההתקפה נגרם. לדוגמה, אם אתה מוסיף את ההשפעה רעל, הסר 1d6 מנזק ההתקפה המתגנבת לפני ההטלה.

        אם השפעה של מכה ערמומית דורשת זריקת הצלה, דרגת הקושי שווה ל-8 ועוד מתאם הזריזות שלך ותוסף השליטה שלך.

        רעל (עלות: 1d6). אתה מוסיף רעלן למכה שלך ומאלץ את היעד לבצע זריקת הצלה בחוסן. אם ההצלה נכשלת, היעד נמצא במצב מורעל למשך דקה אחת. בסוף כל אחד מתוריו, היעד המורעל חוזר על ההצלה, ואם הצליח, ההשפעה מסתיימת עליו.

        כדי להשתמש בהשפעה הזאת, חייבת להיות עליך ערכת הרעלה.

        הכשלה (עלות: 1d6). אם היעד בגודל גדול או קטן יותר, עליו להצליח בזריקת הצלה בזריזות, אחרת הוא נמצא במצב שרוע.

        התרחקות (עלות: 1d6). מיד לאחר ההתקפה, אתה נע עד חצי מהמהירות שלך מבלי לעורר התקפות מזדמנות.
    - name: "חמיקה מופלאה"
      level: 5
      description: |-
        כשתוקף שאתה רואה פוגע בך בהטלת התקפה, אתה יכול לנקוט תגובה כדי להפחית את הנזק של ההתקפה נגדך למחציתו (עיגול כלפי מטה).
    - name: "מומחיות"
      level: 6
      description: |-
        אתה מקבל מומחיות בשתיים מהמיומנויות שאתה שולט בהן, לבחירתך. זריזות ידיים והתגנבות מומלצות אם אתה שולט בהן.

        בדרגה 6 של נוכל, אתה מקבל מומחיות בשתי מיומנויות נוספות שאתה שולט בהן, לבחירתך.
    - name: "התחמקות"
      level: 7
      description: |-
        אתה יכול לחמוק בזריזות מסכנות מסוימות.

        כשאתה נתון להשפעה שמאפשרת לך לבצע זריקת הצלה בזריזות כדי לסבול מחצית מהנזק בלבד, אתה במקום זאת אינך סופג נזק אם אתה מצליח בזריקת ההצלה, וסופג מחצית מהנזק בלבד אם אתה נכשל. אינך יכול להשתמש ביכולת הזאת אם אתה במצב חסר יכולת פעולה.
    - name: "כישרון אמין"
      level: 7
      description: |-
        בכל פעם שאתה מבצע בדיקת תכונה המשתמשת באחת ממיומנויותיך או מהשליטות שלך בכלים, אתה יכול להתייחס להטלת d20 של 9 או פחות כאל 10.
    - name: "העלאת ערך תכונה"
      level: 8
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 10, 12 ו-16 של נוכל.
    - name: "יכולת תת-מקצוע"
      level: 9
      description: |-
        אתה מקבל יכולת מתת-המקצוע הנוכל שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "העלאת ערך תכונה"
      level: 10
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 10, 12 ו-16 של נוכל.
    - name: "מכה ערמומית משופרת"
      level: 11
      description: |-
        אתה יכול להשתמש בעד שתי השפעות של מכה ערמומית כשאתה גורם נזק של התקפה מתגנבת, ולשלם את עלות הקוביות של כל השפעה.
    - name: "העלאת ערך תכונה"
      level: 12
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 10, 12 ו-16 של נוכל.
    - name: "יכולת תת-מקצוע"
      level: 13
      description: |-
        אתה מקבל יכולת מתת-המקצוע הנוכל שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "מכות מרושעות"
      level: 14
      description: |-
        תרגלת דרכים חדשות להשתמש בהתקפה המתגנבת שלך בעורמה. ההשפעות הבאות נוספות מעתה לאפשרויות המכה הערמומית שלך.

        סחרור (עלות: 2d6). היעד חייב להצליח בזריקת הצלה בחוסן, אחרת בתורו הבא הוא יכול לעשות רק אחד מהבאים: לנוע, או לנקוט פעולה או פעולה נוספת.

        הכרעה (עלות: 6d6). היעד חייב להצליח בזריקת הצלה בחוסן, אחרת הוא נמצא במצב חסר הכרה למשך דקה אחת או עד שהוא סופג נזק כלשהו. היעד חסר ההכרה חוזר על ההצלה בסוף כל אחד מתוריו, ואם הצליח, ההשפעה מסתיימת עליו.

        הצללה (עלות: 3d6). היעד חייב להצליח בזריקת הצלה בזריזות, אחרת הוא נמצא במצב עיוור עד סוף תורו הבא.
    - name: "תודעה חמקנית"
      level: 15
      description: |-
        קשה במיוחד לשלוט בתודעה הערמומית שלך.

        אתה מקבל שליטה בזריקות הצלה בחוכמה ובכריזמה.
    - name: "העלאת ערך תכונה"
      level: 16
      description: |-
        אתה מקבל את הכשרון העלאת ערך תכונה (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. אתה מקבל את היכולת הזאת שוב בדרגות 8, 10, 12 ו-16 של נוכל.
    - name: "יכולת תת-מקצוע"
      level: 17
      description: |-
        אתה מקבל יכולת מתת-המקצוע הנוכל שלך בדרגה הזאת. יכולותיו מפורטות בתת-המקצוע.
    - name: "חמקמק"
      level: 18
      description: |-
        אתה חומק עד כדי כך שתוקפים נדירות משיגים יד על העליונה נגדך. אף הטלת התקפה אינה יכולה לקבל יתרון נגדך, אלא אם אתה במצב חסר יכולת פעולה.
    - name: "מתנה אפית"
      level: 19
      description: |-
        אתה מקבל כשרון מתנה אפית (ראה ״כשרונות״) או כשרון אחר לבחירתך שאתה עומד בדרישותיו. מומלצת מתת רוח הלילה.
    - name: "מכת מזל"
      level: 20
      description: |-
        יש לך כישרון מופלא להצליח כשאתה זקוק לכך. אם אתה נכשל במבחן d20, אתה יכול להפוך את ההטלה ל-20.

        לאחר שהשתמשת ביכולת הזאת, אינך יכול להשתמש בה שוב עד שתסיים מנוחה קצרה או ארוכה.
- id: sorcerer
  name: "כושף"
  description: |-
    **תכונה עיקרית:** כריזמה  
    **קוביית חיים:** d6 לכל דרגה של כושף  
    **שליטה בזריקות הצלה:** חוסן, כריזמה  
    **שליטה במיומנויות:** בחר 2: מאגיה, הונאה, תובנה, הפחדה, שכנוע או דת  
    **שליטה בנשק:** נשק פשוט  
    **ציוד התחלתי:** (א) חנית, 2 פגיונות, מוקד מאגי (גביש), חבילת מבוכים ו-28 מ״ז; או (ב) 50 מ״ז
  properties:
    skillChoices: "בחר 2: מאגיה, הונאה, תובנה, הפחדה, שכנוע או דת"
    startingEquipment: "(א) חנית, 2 פגיונות, מוקד מאגי (גביש), חבילת מבוכים ו-28 מ״ז; או (ב) 50 מ״ז"
    multiclassing: "דרישה: כריזמה 13+"
    features:
    - name: "כושפות מולדת"
      level: 1
      description: |-
        אירוע בעברך הותיר בך חותם בל יימחה והחדיר בך קסם תוסס. בפעולה נוספת, אתה יכול לשחרר את הקסם הזה למשך דקה אחת, ובמהלכה אתה מקבל את היתרונות הבאים: - דרגת הקושי להצלה נגד לחשי הכושף שלך גדלה ב-1.

        - יש לך יתרון בהטלות ההתקפה של לחשי כושף שאתה מטיל.

        אתה יכול להשתמש ביכולת הזאת פעמיים, ואתה מחזיר את כל השימושים שנוצלו בה כשאתה מסיים מנוחה ארוכה.
    - name: "הטלת לחשים"
      level: 1
      description: |-
        בהישענות על הקסם המולד שלך, אתה יכול להטיל לחשים. ראה ״לחשים״ לכללי הטלת לחשים. המידע שלהלן מפרט כיצד אתה משתמש בכללים האלה עם לחשי כושף, המופיעים ברשימת לחשי הכושף בהמשך תיאור המקצוע.

        לחשונים. אתה מכיר ארבעה לחשוני כושף לבחירתך. מומלצים אור, להטוטנות, אחיזה מחשמלת ופרץ כושפני. בכל פעם שאתה עולה דרגה ככושף, אתה יכול להחליף אחד מהלחשונים שלך מהיכולת הזאת בלחשון כושף אחר לבחירתך.

        כשאתה מגיע לדרגות 4 ו-10 של כושף, אתה לומד לחשון כושף נוסף לבחירתך, כמפורט בעמודת הלחשונים בטבלת יכולות הכושף.

        תאי לחשים. טבלת יכולות הכושף מראה כמה תאי לחשים יש לך להטלת לחשיך מדרגה 1 ומעלה. אתה מחזיר את כל התאים שנוצלו כשאתה מסיים מנוחה ארוכה.

        לחשים מוכנים מדרגה 1 ומעלה. אתה מכין את רשימת הלחשים מדרגה 1 ומעלה שעומדים לרשותך להטלה באמצעות היכולת הזאת. בתחילה, בחר שני לחשי כושף מדרגה 1. מומלצים ידיים בוערות וגילוי קסם.

        מספר הלחשים ברשימה שלך גדל ככל שאתה עולה בדרגות ככושף, כמפורט בעמודת הלחשים המוכנים בטבלת יכולות הכושף. בכל פעם שהמספר הזה גדל, בחר לחשי כושף נוספים עד שמספר הלחשים ברשימה שלך שווה למספר שבטבלת יכולות הכושף. הלחשים שנבחרו חייבים להיות מדרגה שיש לך עבורה תאי לחשים. לדוגמה, אם אתה כושף בדרגה 3, רשימת הלחשים המוכנים שלך יכולה לכלול שישה לחשי כושף מדרגה 1 או 2 בכל שילוב.

        אם יכולת אחרת של כושף מעניקה לך לחשים שתמיד מוכנים אצלך, הלחשים האלה אינם נספרים במניין הלחשים שאתה יכול להכין באמצעות היכולת הזאת, אך מלבד זאת הם נחשבים לחשי כושף עבורך.

        החלפת הלחשים המוכנים שלך. בכל פעם שאתה עולה דרגה ככושף, אתה יכול להחליף לחש אחד ברשימה שלך בלחש כושף אחר שיש לך עבורו תאי לחשים.

        תכונת הטלת לחשים. כריזמה היא תכונת הטלת הלחשים שלך ללחשי הכושף שלך.

        מוקד לחשים. אתה יכול להשתמש במוקד מאגי כמוקד לחשים ללחשי הכושף שלך.
    - name: "מעיין הקסם"
      level: 2
      description: |-
        אתה יכול לשאוב ממעיין הקסם שבתוכך. המעיין הזה מיוצג בנקודות כושפות, המאפשרות לך ליצור מגוון השפעות קסומות.

        יש לך 2 נקודות כושפות, ואתה מקבל עוד ככל שאתה מגיע לדרגות גבוהות יותר, כמפורט בעמודת נקודות הכושפות בטבלת יכולות הכושף. אינך יכול להחזיק יותר נקודות כושפות מהמספר המופיע בטבלה לדרגתך. אתה מחזיר את כל נקודות הכושפות שנוצלו כשאתה מסיים מנוחה ארוכה.

        אתה יכול להשתמש בנקודות הכושפות כדי להניע את האפשרויות שלהלן, וכן יכולות אחרות, כגון מטא-קסם, המשתמשות בנקודות האלה.

        המרת תאי לחשים לנקודות כושפות. אתה יכול לנצל תא לחשים כדי לקבל מספר נקודות כושפות השווה לדרגת התא (ללא צורך בפעולה).

        יצירת תאי לחשים. בפעולה נוספת, אתה יכול להפוך נקודות כושפות שלא נוצלו לתא לחשים אחד. טבלת יצירת תאי לחשים מציגה את עלות יצירת תא לחשים בדרגה נתונה, ומפרטת את דרגת הכושף המינימלית שעליך להיות כדי ליצור תא. אתה יכול ליצור תא לחשים בדרגה 5 לכל היותר.

        כל תא לחשים שיצרת באמצעות היכולת הזאת נעלם כשאתה מסיים מנוחה ארוכה.

        יצירת תאי לחשים דרגת תא לחשים | עלות בנקודות כושפות | דרגת כושף מינימלית

        1 | 2 | 2

        2 | 3 | 3

        3 | 5 | 5

        4 | 6 | 7

        5 | 7 | 9
    - name: "מטא-קסם"
      level: 2
      description: |-
        מכיוון שהקסם שלך זורם מבפנים, אתה יכול לשנות את לחשיך כך שיתאימו לצרכיך; אתה מקבל שתי אפשרויות מטא-קסם לבחירתך מתוך ״אפשרויות מטא-קסם״ בהמשך תיאור המקצוע. אתה משתמש באפשרויות שבחרת כדי לשנות זמנית לחשים שאתה מטיל. כדי להשתמש באפשרות, עליך להוציא את מספר נקודות הכושפות שהיא עולה.

        אתה יכול להשתמש באפשרות מטא-קסם אחת בלבד על לחש כשאתה מטיל אותו, אלא אם צוין אחרת באחת האפשרויות האלה.

        בכל פעם שאתה עולה דרגה ככושף, אתה יכול להחליף אחת מאפשרויות המטא-קסם שלך באפשרות שאינך מכיר. אתה מקבל שתי אפשרויות נוספות בדרגה 10 של כושף ושתיים נוספות בדרגה 17 של כושף.
    - name: "תת-מקצוע כושף"
      level: 3
      description: |-
        אתה מקבל תת-מקצוע של כושף לבחירתך. תת-המקצוע קסם דרקוני מפורט לאחר תיאור המקצוע. תת-מקצוע הוא התמחות שמעניקה לך יכולות בדרגות מסוימות של כושף.

