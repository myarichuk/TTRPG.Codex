  properties:
    skillChoices: "בחר 2: אקרובטיקה, אתלטיקה, היסטוריה, תובנה, דת או התגנבות; בחר סוג אחד של כלי אומן או כלי נגינה אחד"
    startingEquipment: "(א) חנית, 5 פגיונות, כלי אומן או כלי נגינה שנבחרו לשליטה בכלי לעיל, חבילת מגלה ו-11 מ״ז; או (ב) 50 מ״ז"
    multiclassing: "דרישה: זריזות 13+, חוכמה 13+"
    features:
    - name: "אומנויות לחימה"
      level: 1
      description: |-
        התרגול שלך באומנויות לחימה מעניק לך שליטה בסגנונות לחימה המשתמשים במכה הלא חמושה שלך ובכלי הנשק של הנזיר, שהם אלה:

        • נשק פשוט לקרב מגע

        • נשק צבאי לקרב מגע בעל התכונה קל

        אתה מקבל את היתרונות הבאים כשאתה לא חמוש או אוחז רק בכלי נשק של נזיר, ואינך לובש שריון ואינך אוחז במגן.

        מכה לא חמושה נוספת. אתה יכול לבצע מכה לא חמושה בפעולה נוספת.

        קוביית אומנויות לחימה. אתה יכול להטיל 1d6 במקום הנזק הרגיל של המכה הלא חמושה שלך או של כלי הנשק של הנזיר. הקובייה הזאת משתנה ככל שאתה עולה בדרגות כנזיר, כמפורט בעמודת אומנויות הלחימה בטבלת יכולות הנזיר.

        התקפות זריזות. אתה יכול להשתמש במתאם הזריזות שלך במקום במתאם הכוח שלך להטלות ההתקפה והנזק של המכות הלא חמושות שלך ושל כלי הנשק של הנזיר. בנוסף, כשאתה משתמש באפשרות האחיזה או הדחיפה של המכה הלא חמושה שלך, אתה יכול להשתמש במתאם הזריזות שלך במקום במתאם הכוח כדי לקבוע את דרגת הקושי להצלה.
    - name: "הגנה ללא שריון"
      level: 1
      description: |-
        כל עוד אינך לובש שריון ואינך אוחז במגן, דרגת השריון הבסיסית שלך שווה ל-10 ועוד מתאמי הזריזות והחוכמה שלך.
    - name: "מיקוד הנזיר"
      level: 2
      description: |-
        המיקוד והאימון הלחימתי שלך מאפשרים לך לרתום מעיין של אנרגיה יוצאת דופן בתוכך. האנרגיה הזאת מיוצגת בנקודות מיקוד. דרגת הנזיר שלך קובעת את מספר הנקודות שיש לך, כמפורט בעמודת נקודות המיקוד בטבלת יכולות הנזיר.

        אתה יכול לנצל את הנקודות האלה כדי לשפר או להניע יכולות מסוימות של נזיר. אתה מתחיל כשאתה מכיר שלוש יכולות כאלה: מטח מכות, הגנה סבלנית וצעד הרוח, שכל אחת מהן מפורטת להלן.

        כשאתה מנצל נקודת מיקוד, היא אינה זמינה עד שתסיים מנוחה קצרה או ארוכה, ובסופה אתה מחזיר את כל הנקודות שנוצלו.

        יכולות מסוימות המשתמשות בנקודות מיקוד דורשות מהיעד לבצע זריקת הצלה. דרגת הקושי להצלה שווה ל-8 ועוד מתאם החוכמה שלך ותוסף השליטה שלך.

        מטח מכות. אתה יכול לנצל נקודת מיקוד אחת כדי לבצע שתי מכות לא חמושות בפעולה נוספת.

        הגנה סבלנית. אתה יכול לנקוט פעולת נסיגה בפעולה נוספת. לחלופין, אתה יכול לנצל נקודת מיקוד אחת כדי לנקוט גם פעולת נסיגה וגם פעולת חמיקה בפעולה נוספת.

        צעד הרוח. אתה יכול לנקוט פעולת מאוץ בפעולה נוספת. לחלופין, אתה יכול לנצל נקודת מיקוד אחת כדי לנקוט גם פעולת נסיגה וגם פעולת מאוץ בפעולה נוספת,

        ומרחק הקפיצה שלך מוכפל לאותו תור.
