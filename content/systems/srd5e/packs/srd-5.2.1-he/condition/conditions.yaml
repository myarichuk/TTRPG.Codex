- id: blinded
  name: "עיוור"
  description: |-
    כל עוד אתה במצב עיוור, אתה חווה את ההשפעות הבאות.
    **אינך יכול לראות.** אתה לא יכול לראות ונכשל אוטומטית בכל בדיקת תכונה שדורשת ראייה.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון, והטלות התקיפה שלך מקבלות חיסרון.
- id: charmed
  name: "מוקסם"
  description: |-
    כל עוד אתה במצב מוקסם, אתה חווה את ההשפעות הבאות.
    **לא יכול לפגוע במקסים.** אתה לא יכול לתקוף את המקסים או לכוון נגדו יכולות או השפעות קסומות שגורמות נזק.
    **יתרון חברתי.** למקסים יש יתרון בבדיקות תכונה לאינטראקציה חברתית איתך.
- id: deafened
  name: "חירש"
  description: |-
    כל עוד אתה במצב חירש, אתה חווה את ההשפעה הבאה.
    **אינך יכול לשמוע.** אתה לא יכול לשמוע ונכשל אוטומטית בכל בדיקת תכונה שדורשת שמיעה.
- id: exhaustion
  name: "תשישות"
  description: |-
    כל עוד אתה במצב תשישות, אתה חווה את ההשפעות הבאות.
    **דרגות תשישות.** מצב זה מצטבר. בכל פעם שאתה מקבל אותו, אתה מקבל 1 דרגת תשישות. אתה מת אם דרגת התשישות שלך היא 6.
    **מבחני d20 מושפעים.** כשאתה מבצע מבחן d20, התוצאה מצטמצמת ב-2 כפול דרגת התשישות שלך.
    **מהירות מופחתת.** המהירות שלך מצטמצמת במספר רגל השווה ל-5 כפול דרגת התשישות שלך.
    **הסרת דרגות תשישות.** סיום מנוחה ארוכה מסיר 1 מדרגות התשישות שלך. כשדרגת התשישות שלך מגיעה ל-0, המצב מסתיים.
- id: frightened
  name: "מבוהל"
  description: |-
    כל עוד אתה במצב מבוהל, אתה חווה את ההשפעות הבאות.
    **בדיקות תכונה ותקיפות מושפעות.** יש לך חיסרון בבדיקות תכונה ובהטלות תקיפה כל עוד מקור הפחד בקו ראייה שלך.
    **אינך יכול להתקרב.** אתה לא יכול לגשת מרצונך קרוב יותר אל מקור הפחד שלך.
- id: grappled
  name: "אחוז"
  description: |-
    כל עוד אתה במצב אחוז, אתה חווה את ההשפעות הבאות.
    **מהירות 0.** המהירות שלך היא 0 ואינה יכולה לגדול.
    **תקיפות מושפעות.** יש לך חיסרון בהטלות תקיפה נגד כל יעד שאינו האוחז בך.
    **ניתן להזזה.** האוחז יכול לגרור או לשאת אותך כשהוא זז, אך כל רגל של תנועה עולה לו 1 רגל נוספת, אלא אם אתה קטנטן או קטן ממנו בשני גדלים או יותר.
- id: incapacitated
  name: "חסר יכולת פעולה"
  description: |-
    כל עוד אתה במצב חסר יכולת פעולה, אתה חווה את ההשפעות הבאות.
    **חסר פעילות.** אתה לא יכול לבצע שום פעולה, פעולה נוספת או תגובה.
    **ללא ריכוז.** הריכוז שלך נשבר.
    **חסר דיבור.** אתה לא יכול לדבר.
    **מופתע.** אם אתה חסר יכולת פעולה כשאתה מטיל יוזמה, יש לך חיסרון בהטלה.
- id: invisible
  name: "בלתי נראה"
  description: |-
    כל עוד אתה במצב בלתי נראה, אתה חווה את ההשפעות הבאות.
    **הפתעה.** אם אתה בלתי נראה כשאתה מטיל יוזמה, יש לך יתרון בהטלה.
    **מוסתר.** אתה לא מושפע מהשפעה שדורשת שיראו את יעדה, אלא אם יוצר ההשפעה מצליח איכשהו לראות אותך. גם כל ציוד שאתה לובש או נושא מוסתר.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות חיסרון, והטלות התקיפה שלך מקבלות יתרון. אם יצור מצליח איכשהו לראות אותך, אתה לא מקבל יתרון זה נגדו.
- id: paralyzed
  name: "משותק"
  description: |-
    כל עוד אתה במצב משותק, אתה חווה את ההשפעות הבאות.
    **חסר יכולת פעולה.** אתה נמצא במצב חסר יכולת פעולה.
    **מהירות 0.** המהירות שלך היא 0 ואינה יכולה לגדול.
    **זריקות הצלה מושפעות.** אתה נכשל אוטומטית בזריקות הצלה של כוח וזריזות.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון.
    **פגיעות קריטיות אוטומטיות.** כל הטלת תקיפה שפוגעת בך היא פגיעה קריטית אם התוקף נמצא בטווח 5 רגל ממך.
- id: petrified
  name: "מאובן"
  description: |-
    כל עוד אתה במצב מאובן, אתה חווה את ההשפעות הבאות.
    **הפיכה לחומר דומם.** אתה, יחד עם כל חפץ לא קסום שאתה לובש או נושא, הופך לחומר דומם וקשיח (בדרך כלל אבן). משקלך גדל פי עשרה, ואתה מפסיק להזדקן.
    **חסר יכולת פעולה.** אתה נמצא במצב חסר יכולת פעולה.
    **מהירות 0.** המהירות שלך היא 0 ואינה יכולה לגדול.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון.
    **זריקות הצלה מושפעות.** אתה נכשל אוטומטית בזריקות הצלה של כוח וזריזות.
    **עמידות לנזק.** יש לך עמידות לכל סוגי הנזק.
    **חסינות לרעל.** יש לך חסינות למצב מורעל.
    **זריקות הצלה מושפעות.** אתה נכשל אוטומטית בזריקות הצלה של כוח וזריזות.
    **עמידות לנזק.** יש לך עמידות לכל סוגי הנזק.
    **חסינות לרעל.** יש לך חסינות למצב מורעל.
- id: poisoned
  name: "מורעל"
  description: |-
    כל עוד אתה במצב מורעל, אתה חווה את ההשפעה הבאה.
    **בדיקות תכונה ותקיפות מושפעות.** יש לך חיסרון בהטלות תקיפה ובבדיקות תכונה.
- id: prone
  name: "שרוע"
  description: |-
    כל עוד אתה במצב שרוע, אתה חווה את ההשפעות הבאות.
    **תנועה מוגבלת.** אפשרויות התנועה היחידות שלך הן לזחול או להוציא כמות תנועה השווה למחצית המהירות שלך (מעוגל כלפי מטה) כדי לקום ובכך לסיים את המצב. אם המהירות שלך היא 0, אתה לא יכול לקום.
    **תקיפות מושפעות.** יש לך חיסרון בהטלות תקיפה. הטלת תקיפה נגדך מקבלת יתרון אם התוקף נמצא בטווח 5 רגל ממך. אחרת, הטלת תקיפה זו מקבלת חיסרון.
- id: restrained
  name: "מרוסן"
  description: |-
    כל עוד אתה במצב מרוסן, אתה חווה את ההשפעות הבאות.
    **מהירות 0.** המהירות שלך היא 0 ואינה יכולה לגדול.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון, והטלות התקיפה שלך מקבלות חיסרון.
    **זריקות הצלה מושפעות.** יש לך חיסרון בזריקות הצלה של זריזות.
- id: stunned
  name: "המום"
  description: |-
    כל עוד אתה במצב המום, אתה חווה את ההשפעות הבאות.
    **חסר יכולת פעולה.** אתה נמצא במצב חסר יכולת פעולה.
    **זריקות הצלה מושפעות.** אתה נכשל אוטומטית בזריקות הצלה של כוח וזריזות.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון.
- id: unconscious
  name: "חסר הכרה"
  description: |-
    כל עוד אתה במצב חסר הכרה, אתה חווה את ההשפעות הבאות.
    **דומם.** אתה נמצא במצבים חסר יכולת פעולה ושרוע, ואתה מפיל כל דבר שהחזקת.
    **כשמצב זה מסתיים, אתה נשאר שרוע.
    **מהירות 0.** המהירות שלך היא 0 ואינה יכולה לגדול.
    **תקיפות מושפעות.** הטלות תקיפה נגדך מקבלות יתרון.
    **זריקות הצלה מושפעות.** אתה נכשל אוטומטית בזריקות הצלה של כוח וזריזות.
    **פגיעות קריטיות אוטומטיות.** כל הטלת תקיפה שפוגעת בך היא פגיעה קריטית אם התוקף נמצא בטווח 5 רגל ממך.
    **לא מודע.** אתה לא מודע לסביבתך.
