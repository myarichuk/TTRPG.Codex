- id: ability-score-improvement
  name: "העלאת ערך תכונה"
  description: |-
    העלה תכונה אחת לבחירתך ב-2, או העלה שתי תכונות לבחירתך ב-1. כשרון זה אינו יכול להעלות ערך תכונה מעל 20.
- id: alert
  name: "דרוך"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **שליטה ביוזמה.** כשאתה מטיל יוזמה, אתה יכול להוסיף להטלה את תוסף השליטה שלך.
    **החלפת יוזמה.** מיד לאחר שהטלת יוזמה, אתה יכול להחליף את היוזמה שלך ביוזמתו של בן ברית מוכן אחד באותו קרב. אתה לא יכול לבצע החלפה זו אם אתה או בן הברית נמצאים במצב חסר יכולת פעולה.
- id: archery
  name: "קשתות"
  description: |-
    אתה מקבל בונוס של +2 להטלות תקיפה שאתה מבצע בנשק טווח.
- id: boon-of-combat-prowess
  name: "מתת כושר לחימה"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **כוונה ללא דופי.** כשאתה מחטיא בהטלת תקיפה, אתה יכול לפגוע במקום זאת. לאחר שהשתמשת ביתרון זה, אינך יכול להשתמש בו שוב עד תחילת התור הבא שלך.
- id: boon-of-dimensional-travel
  name: "מתת מסע בין ממדים"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **צעדי הבהוב.** מיד לאחר שביצעת את פעולת התקיפה או את פעולת הקסם, אתה יכול להשתגר עד 30 רגל למשבצת פנויה שאתה רואה.
- id: boon-of-fate
  name: "מתת הגורל"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **שיפור הגורל.** כשאתה או יצור אחר בטווח 60 רגל ממך מצליח או נכשל במבחן d20, אתה יכול להטיל 2d4 ולהחיל את הסכום שהוטל כבונוס או כקנס על הטלת ה-d20. לאחר שהשתמשת ביתרון זה, אינך יכול להשתמש בו שוב עד שתטיל יוזמה או תסיים מנוחה קצרה או ארוכה.
- id: boon-of-irresistible-offense
  name: "מתת התקפה בלתי ניתנת לעצירה"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **התגברות על הגנות.** נזק מוחץ, דוקר וחותך שאתה גורם מתעלם תמיד מעמידות.
    **מכה מוחצת.** כשאתה מטיל 20 על ה-d20 בהטלת תקיפה, אתה יכול לגרום ליעד נזק נוסף השווה לערך התכונה שהועלתה בכשרון זה. סוג הנזק הנוסף זהה לסוג התקיפה.
- id: boon-of-spell-recall
  name: "מתת היזכרות בלחשים"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **הטלה חינם.** בכל פעם שאתה מטיל לחש באמצעות תא לחשים מדרגה 1–4, הטל 1d4. אם המספר שהטלת זהה לדרגת התא, התא אינו נוצל.
- id: boon-of-the-night-spirit
  name: "מתת רוח הלילה"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **התמזגות עם הצללים.** כשאתה באור עמום או בחושך, אתה יכול להעניק לעצמך את המצב בלתי נראה בפעולה נוספת. המצב מסתיים עליך מיד לאחר שאתה מבצע פעולה, פעולה נוספת או תגובה.
    **צורת צל.** כשאתה באור עמום או בחושך, יש לך עמידות לכל סוגי הנזק מלבד נזק נפשי וקורן.
- id: boon-of-truesight
  name: "מתת ראיית אמת"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה תכונה אחת לבחירתך ב-1, עד מקסימום של 30.
    **ראיית אמת.** יש לך ראיית אמת בטווח 60 רגל.
- id: defense
  name: "הגנה"
  description: |-
    כשאתה לובש שריון קל, בינוני או כבד, אתה מקבל בונוס של +1 לדרגת השריון.
- id: grappler
  name: "מתאבק"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **העלאת ערך תכונה.** העלה את ערך הכוח או הזריזות שלך ב-1, עד מקסימום של 20.
    **אגרוף ואחיזה.** כשאתה פוגע ביצור במכה לא מזוינת כחלק מפעולת התקיפה בתורך, אתה יכול להשתמש גם באפשרות הנזק וגם באפשרות האחיזה. אתה יכול להשתמש ביתרון זה פעם אחת בלבד בכל תור.
    **יתרון בתקיפה.** יש לך יתרון בהטלות תקיפה נגד יצור שהוא אחוז על ידך.
    **מתאבק מהיר.** אינך צריך להוציא תנועה נוספת כדי להזיז יצור שהוא אחוז על ידך אם היצור בגודלך או קטן ממך.
- id: great-weapon-fighting
  name: "לחימה בנשק כבד"
  description: |-
    כשאתה מטיל נזק לתקיפה שאתה מבצע בנשק קרב מגע שאתה מחזיק בשתי ידיים, אתה יכול להתייחס לכל 1 או 2 בקוביית נזק כאל 3. כדי ליהנות מיתרון זה, לנשק חייבת להיות התכונה דו-ידני או רב שימושי.
- id: magic-initiate
  name: "מחונן בקסם"
  description: |-
    אתה מקבל את היתרונות הבאים.
    **שני לחשונים.** אתה לומד שני לחשונים לבחירתך מרשימת הלחשים של הכוהן, הדרואיד או האשף. תבונה, חוכמה או כריזמה היא תכונת הטלת הלחשים שלך ללחשי כשרון זה (בחר בעת בחירת הכשרון).
    **לחש דרגה 1.** בחר לחש דרגה 1 מאותה רשימה שממנה בחרת את הלחשונים של כשרון זה. הלחש הזה מוכן אצלך תמיד. אתה יכול להטיל אותו פעם אחת ללא תא לחשים, ואתה מחדש את היכולת להטילו כך כשאתה מסיים מנוחה ארוכה. אתה יכול גם להטיל את הלחש באמצעות כל תא לחשים שיש לך.
    **החלפת לחש.** בכל פעם שאתה מקבל דרגה חדשה, אתה יכול להחליף אחד מהלחשים שבחרת לכשרון זה בלחש אחר מאותה דרגה מתוך הרשימה שבחרת.
- id: savage-attacker
  name: "תוקף פראי"
  description: |-
    התאמנת לגרום מכות הרסניות במיוחד. פעם אחת בכל תור, כשאתה פוגע ביעד בנשק, אתה יכול להטיל פעמיים את קוביות הנזק של הנשק ולהשתמש בכל אחת מההטלות נגד היעד.
- id: skilled
  name: "מיומן"
  description: |-
    אתה מקבל שליטה בכל שילוב של שלוש מיומנויות או כלים לבחירתך.
- id: two-weapon-fighting
  name: "לחימה בשני נשקים"
  description: |-
    כשאתה מבצע תקיפה נוספת בנשק בעל התכונה קל, אתה יכול להוסיף את מתאם התכונה לנזק של אותה תקיפה אם אינך מוסיף אותו כבר.
