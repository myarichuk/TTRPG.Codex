- id: champion
  name: 'אלוף'
  description: |-
    *שאיפה לשלמות גופנית בקרב*

    האלוף מתמקד בפיתוח כושר לחימה בשאיפה בלתי פוסקת לניצחון. אלופים משלבים אימון קפדני עם שלמות גופנית כדי להנחית מכות מחץ, לעמוד בסכנה ולרכוש תהילה. בין אם בתחרויות אתלטיקה ובין אם בקרב עקוב מדם, אלופים שואפים לכתר המנצח.
  properties:
    summary: 'שאיפה לשלמות גופנית בקרב'
    features:
    - name: 'פגיעה קריטית משופרת'
      level: 3
      description: |-
        גלגולי ההתקפה שלך בנשק ובמכות לא חמושות יכולים להסתיים בפגיעה קריטית כשהגלגול על ה-d20 הוא 19 או 20.
    - name: 'ספורטאי יוצא דופן'
      level: 3
      description: |-
        הודות לכושר האתלטי שלך יש לך יתרון בגלגולי יוזמה ובבדיקות כוח (אתלטיקה).

        בנוסף, מיד אחרי שהשגת פגיעה קריטית אתה יכול לנוע עד מחצית המהירות שלך בלי לעורר התקפות מזדמנות.
    - name: 'סגנון לחימה נוסף'
      level: 7
      description: |-
        אתה מקבל כשרון סגנון לחימה נוסף לבחירתך.
    - name: 'לוחם הרואי'
      level: 10
      description: |-
        סערת הקרב דוחפת אותך לעבר הניצחון. במהלך קרב אתה יכול להעניק לעצמך השראה הרואית בכל פעם שאתה מתחיל את התור שלך בלעדיה.
    - name: 'פגיעה קריטית עליונה'
      level: 15
      description: |-
        גלגולי ההתקפה שלך בנשק ובמכות לא חמושות יכולים כעת להסתיים בפגיעה קריטית כשהגלגול על ה-d20 הוא 18-20.
    - name: 'שורד'
      level: 18
      description: |-
        אתה מגיע לשיא העמידות בקרב, ומקבל את ההטבות האלה.

        התרסה למוות. יש לך יתרון בזריקות הצלה ממוות. יתרה מזו, כשאתה מגלגל 18-20 בזריקת הצלה ממוות, אתה נהנה מההטבה כאילו גלגלת 20.

        התעוררות הרואית. בתחילת כל אחד מהתורים שלך אתה מחזיר נקודות חיים השוות ל-5 ועוד מתאם החוסן שלך, אם אתה פצוע ויש לך לפחות נקודת חיים אחת.
- id: circle-of-the-land
  name: 'מעגל האדמה'
  description: |-
    *חגיגת הקשר לעולם הטבע*

    מעגל האדמה כולל מיסטיקנים וחכמים השומרים על ידע וטקסים עתיקים. הדרואידים האלה מתכנסים במעגלים קדושים של עצים או אבני עמידה כדי ללחוש סודות קדמוניים בשפת הדרואידים. החכמים ביותר שבמעגל משמשים כוהנים גדולים של קהילותיהם.
  properties:
    summary: 'חגיגת הקשר לעולם הטבע'
    features:
    - name: 'לחשי מעגל האדמה'
      level: 3
      description: |-
        בכל פעם שאתה מסיים מנוחה ארוכה, בחר סוג אחד של קרקע: צחיחה, קוטבית, ממוזגת או טרופית. עיין בטבלה המתאימה לסוג שבחרת; הלחשים הרשומים לדרגת הדרואיד שלך ולדרגות נמוכות ממנה מוכנים אצלך.

        קרקע צחיחה

        דרגת דרואיד לחשי מעגל

        3 טשטוש, ידיים בוערות, חץ אש

        5 כדור אש

        7 קמילה

        9 חומת אבן

        קרקע קוטבית

        דרגת דרואיד לחשי מעגל

        3 ענן ערפל, שיתוק אדם, קרן כפור

        5 סופת גשם קפוא

        7 סופת קרח

        9 חרוט הקור

        קרקע ממוזגת

        דרגת דרואיד לחשי מעגל

        3 צעד ערפל, אחיזה מחשמלת, שינה

        5 פגיעת ברק

        7 חופש תנועה

        9 צעידה בין עצים

        קרקע טרופית

        דרגת דרואיד לחשי מעגל

        3 התזת חומצה, קרן חולי, רשת קורים

        5 ענן סרחון

        7 שינוי צורה

        9 מכת חרקים
    - name: 'עזרת האדמה'
      level: 3
      description: |-
        כפעולת קסם אתה יכול להוציא שימוש אחד מצורת החיה שלך ולבחור נקודה בטווח 60 רגל ממך. פרחים נותני חיים ושיחי קוצים ינקי חיים מופיעים לרגע בכדור ברדיוס 10 רגל שמרכזו בנקודה הזאת. כל יצור לבחירתך בכדור חייב לבצע זריקת הצלה בחוסן מול דרגת הקושי להצלה נגד לחשים שלך, וסופג 2d6 נזק נקרוטי בכישלון או מחצית מהנזק בהצלחה. יצור אחד לבחירתך באזור הזה מחזיר 2d6 נקודות חיים.

        הנזק והריפוי גדלים ב-1d6 כשאתה מגיע לדרגות דרואיד 10 (3d6) ו-14 (4d6).
    - name: 'התאוששות טבעית'
      level: 6
      description: |-
        אתה יכול להטיל אחד מלחשי דרגה 1 ומעלה שהכנת מיכולת לחשי המעגל, בלי להוציא תא לחשים, ועליך לסיים מנוחה ארוכה לפני שתעשה זאת שוב.

        בנוסף, כשאתה מסיים מנוחה קצרה אתה יכול לבחור תאי לחשים שהוצאת כדי להחזיר אותם. סכום הדרגות של התאים יכול להיות שווה למחצית דרגת הדרואיד שלך (מעוגל כלפי מעלה) או נמוך ממנה, ואף אחד מהם אינו יכול להיות מדרגה 6 ומעלה. לדוגמה, אם אתה דרואיד בדרגה 6, אתה יכול להחזיר תאי לחשים בשווי שלוש דרגות: תא אחד מדרגה 3, תא מדרגה 2 ותא מדרגה 1, או שלושה תאים מדרגה 1. לאחר שהחזרת תאי לחשים באמצעות היכולת הזאת, אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.
    - name: 'מחסה הטבע'
      level: 10
      description: |-
        אתה חסין למצב מורעל, ויש לך עמידות לסוג נזק הקשור לבחירת הקרקע הנוכחית שלך ביכולת לחשי המעגל, כמפורט בטבלת מחסה הטבע.

        מחסה הטבע

        סוג קרקע עמידות

        צחיחה אש

        קוטבית קור

        סוג קרקע עמידות

        ממוזגת ברק

        טרופית רעל
    - name: 'מקלט הטבע'
      level: 14
      description: |-
        כפעולת קסם אתה יכול להוציא שימוש אחד מצורת החיה שלך ולהעלות עצים וגפנים רפאים בקובייה של 15 רגל על הקרקע בטווח 120 רגל ממך. הם נשארים שם למשך דקה אחת או עד שיש לך את המצב חסר יכולת פעולה או שאתה מת. לך ולבני בריתך יש חצי מחסה בעודכם באזור הזה, ובני בריתך מקבלים את העמידות הנוכחית של מחסה הטבע שלך בעודם שם.

        כפעולה נוספת אתה יכול להזיז את הקובייה עד 60 רגל אל קרקע בטווח 120 רגל ממך.
- id: college-of-lore
  name: 'מועצת הידע'
  description: |-
    *צלילה לעומק הידע הקסום*

    פייטני מועצת הידע אוספים לחשים וסודות ממקורות מגוונים, כגון כרכים מלומדים, טקסים מיסטיים וסיפורי עם. חברי המועצה מתכנסים בספריות ובאוניברסיטאות כדי לחלוק זה עם זה את הידע שלהם. הם נפגשים גם בפסטיבלים ובאירועי מדינה, שם הם יכולים לחשוף שחיתות, לפרום שקרים וללעוג לדמויות סמכות נפוחות מחשיבות עצמית.
  properties:
    summary: 'צלילה לעומק הידע הקסום'
    features:
    - name: 'שליטות נוספות'
      level: 3
      description: |-
        אתה מקבל שליטה בשלוש מיומנויות לבחירתך.
    - name: 'מילים חותכות'
      level: 3
      description: |-
        אתה לומד להשתמש בשנינות שלך כדי להסיח את דעתם של אחרים, לבלבל אותם ולכרסם באופן על-טבעי בביטחון ובכישורים שלהם. כשיצור שאתה רואה בטווח 60 רגל ממך מגלגל גלגול נזק, או מצליח בבדיקת תכונה או בגלגול התקפה, אתה יכול להשתמש בתגובה כדי להוציא שימוש אחד מהשראת הפייטן שלך; גלג את קוביית השראת הפייטן שלך, והפחת את המספר שיצא מהגלגול של היצור, כך שהנזק קטן או שהצלחה עשויה להפוך לכישלון.
    - name: 'תגליות קסומות'
      level: 6
      description: |-
        אתה לומד שני לחשים לבחירתך. הלחשים האלה יכולים להגיע מרשימת הלחשים של הכוהן, הדרואיד או האשף, או מכל שילוב שלהם (עיין בפרק של כל מקצוע לרשימת הלחשים שלו). הלחש שתבחר חייב להיות לחשון או לחש שיש לך תאי לחשים עבורו, כמפורט בטבלת יכולות הפייטן.

        הלחשים שבחרת תמיד מוכנים אצלך, ובכל פעם שאתה מקבל דרגת פייטן אתה יכול להחליף אחד מהם בלחש אחר העומד בדרישות האלה.
    - name: 'מיומנות ללא תחרות'
      level: 14
      description: |-
        כשאתה מגלגל בדיקת תכונה או גלגול התקפה ונכשל, אתה יכול להוציא שימוש אחד מהשראת הפייטן; גלג את קוביית השראת הפייטן והוסף את המספר שיצא ל-d20, כך שכישלון עשוי להפוך להצלחה. אם נכשלת, השראת הפייטן אינה מוצאת.
- id: draconic-sorcery
  name: 'קסם דרקוני'
  description: |-
    *נשימת הקסם של דרקונים*

    הקסם המולד שלך נובע ממתנתו של דרקון. אולי דרקון עתיק שעמד למות הוריש לך או לאבותיך חלק מכוחו הקסום. ייתכן שספגת קסם ממקום ספוג בכוחם של דרקונים. או אולי אחזת באוצר שנלקח מהמטמון של דרקון והיה ספוג בכוח דרקוני. ייתכן גם שיש לך דרקון בין אבותיך.
  properties:
    summary: 'נשימת הקסם של דרקונים'
    features:
    - name: 'עמידות דרקונית'
      level: 3
      description: |-
        הקסם שבגופך מבטא תכונות פיזיות של המתנה הדרקונית שלך. מקסימום נקודות החיים שלך גדל ב-3, וגדל ב-1 בכל פעם שאתה מקבל דרגת כושף נוספת.

        חלקים מגופך מכוסים גם בקשקשים דמויי דרקון. כשאינך לובש שריון, דרגת השריון הבסיסית שלך שווה ל-10 ועוד מתאמי הזריזות והכריזמה שלך.
    - name: 'לחשים דרקוניים'
      level: 3
      description: |-
        כשאתה מגיע לדרגת כושף המצוינת בטבלת הלחשים הדרקוניים, מאותו רגע הלחשים הרשומים מוכנים אצלך תמיד.

        לחשים דרקוניים

        דרגת

        כושף לחשים

        3 שינוי גוף, כדור צבעים, פקודה,

        נשימת דרקון

        5 פחד, מעוף

        7 עין מאגית, הקסמת מפלצת

        9 ידע אגדות, זימון דרקון
    - name: 'זיקה יסודית'
      level: 6
      description: |-
        הקסם הדרקוני שלך נמשך לסוג נזק הקשור לדרקונים. בחר אחד מהסוגים האלה: חומצה, קור, אש, ברק או רעל.

        יש לך עמידות לסוג הנזק הזה, וכשאתה מטיל לחש שגורם נזק מהסוג הזה אתה יכול להוסיף את מתאם הכריזמה שלך לגלגול נזק אחד של הלחש.
    - name: 'כנפי דרקון'
      level: 14
      description: |-
        כפעולה נוספת אתה יכול לגרום לכנפי דרקון להופיע על גבך. הכנפיים נשארות למשך שעה או עד שאתה מבטל אותן (ללא צורך בפעולה). בזמן שהן קיימות יש לך מהירות מעוף של 60 רגל.

        לאחר שהשתמשת ביכולת הזאת, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה, אלא אם כן תוציא 3 נקודות כישוף (ללא צורך בפעולה) כדי להחזיר לעצמך את השימוש בה.
    - name: 'בן לוויה דרקוני'
      level: 18
      description: |-
        אתה יכול להטיל זימון דרקון בלי רכיב חומרי. אתה יכול גם להטיל אותו פעם אחת בלי תא לחשים, ואתה מחזיר לעצמך את היכולת להטילו כך כשאתה מסיים מנוחה ארוכה.

        בכל פעם שאתה מתחיל להטיל את הלחש אתה יכול לשנות אותו כך שלא ידרוש ריכוז. אם עשית זאת, משך הלחש בהטלה הזאת הוא דקה אחת.
- id: evoker
  name: 'מטיל כוחות'
  description: |-
    *יצירת השפעות יסודיות מתפוצצות*

    הלימודים שלך מתמקדים בקסם היוצר השפעות יסודיות עוצמתיות כגון קור עז, להבה צורבת, רעם מתגלגל, ברק מתפצח וחומצה בוערת. חלק ממטילי הכוחות מוצאים עבודה בכוחות צבא, ומשמשים ארטילריה שמנתצת צבאות מרחוק. אחרים משתמשים בכוחם כדי להגן על אחרים, וישנם המבקשים רווח לעצמם.
  properties:
    summary: 'יצירת השפעות יסודיות מתפוצצות'
    features:
    - name: 'בקיא בתעצומה'
      level: 3
      description: |-
        בחר שני לחשי אשף מאסכולת התעצומה, שכל אחד מהם בדרגה 2 לכל היותר, והוסף אותם לספר הלחשים שלך בחינם.

        בנוסף, בכל פעם שאתה מקבל גישה לדרגה חדשה של תאי לחשים במקצוע הזה, אתה יכול להוסיף לספר הלחשים שלך בחינם לחש אשף אחד מאסכולת התעצומה. הלחש שתבחר חייב להיות בדרגה שיש לך תאי לחשים עבורה.
    - name: 'לחשון עוצמתי'
      level: 3
      description: |-
        הלחשונים הגורמים נזק שלך משפיעים גם על יצורים שחומקים מעיקר ההשפעה. כשאתה מטיל לחשון על יצור ומחטיא בגלגול ההתקפה, או שהיעד מצליח בזריקת ההצלה נגד הלחשון, היעד סופג מחצית מנזק הלחשון (אם יש) אך אינו סובל מכל השפעה נוספת של הלחשון.
    - name: 'עיצוב לחשים'
      level: 6
      description: |-
        אתה יכול ליצור כיסי ביטחון יחסי בתוך ההשפעות של לחשי התעצומה שלך. כשאתה מטיל לחש תעצומה המשפיע על יצורים אחרים שאתה רואה, אתה יכול לבחור מספר מהם השווה ל-1 ועוד דרגת הלחש. היצורים שנבחרו מצליחים אוטומטית בזריקות ההצלה שלהם נגד הלחש, ואינם סופגים נזק אם בדרך כלל היו סופגים מחצית מהנזק בהצלחה.
    - name: 'תעצומה מוגברת'
      level: 10
      description: |-
        בכל פעם שאתה מטיל לחש אשף מאסכולת התעצומה, אתה יכול להוסיף את מתאם התבונה שלך לגלגול נזק אחד של הלחש.
    - name: 'העמסת כוח'
      level: 14
      description: |-
        אתה יכול להגביר את עוצמת הלחשים שלך. כשאתה מטיל לחש אשף הגורם נזק בתא לחשים מדרגה 1-5, אתה יכול לגרום באותו תור נזק מרבי בלחש הזה.

        בפעם הראשונה שאתה עושה זאת, אינך סובל מכל השפעה שלילית. אם אתה משתמש ביכולת הזאת שוב לפני שסיימת מנוחה ארוכה, אתה סופג 2d12 נזק נקרוטי על כל דרגה של תא הלחשים מיד אחרי שהטלת את הלחש. הנזק הזה מתעלם מעמידות וחסינות.

        בכל פעם שאתה משתמש ביכולת הזאת שוב לפני שסיימת מנוחה ארוכה, הנזק הנקרוטי לכל דרגת לחש גדל ב-1d12.
- id: fiend-patron
  name: 'פטרון בן-תופת'
  description: |-
    *כריתת עסקה עם המישורים התחתונים*

    ההסכם שלך שואב ממישורי התחתית, ממלכות האבדון. ייתכן שכרתת הסכם עם אדון שדים, שטן עליון או בן-תופת אדיר במיוחד אחר. מטרות הפטרון הזה רעות, השחתה או הרס של כל הדברים, ובסופו של דבר גם שלך, והדרך שלך נקבעת לפי מידת המאמץ שלך להיאבק במטרות האלה.
  properties:
    summary: 'כריתת עסקה עם המישורים התחתונים'
    features:
    - name: 'ברכת האפל'
      level: 3
      description: |-
        כשאתה מוריד אויב ל-0 נקודות חיים, אתה מקבל נקודות חיים זמניות השוות למתאם הכריזמה שלך ועוד דרגת המכשף שלך (מינימום נקודת חיים זמנית אחת). אתה מקבל את ההטבה הזאת גם אם מישהו אחר מוריד ל-0 נקודות חיים אויב הנמצא בטווח 10 רגל ממך.
    - name: 'לחשי בן-תופת'
      level: 3
      description: |-
        קסם הפטרון שלך מבטיח שתמיד יהיו מוכנים אצלך לחשים מסוימים; כשאתה מגיע לדרגת מכשף המצוינת בטבלת לחשי בן-תופת, מאותו רגע הלחשים הרשומים מוכנים אצלך תמיד.

        לחשי בן-תופת

        דרגת מכשף לחשים

        3 ידיים בוערות, פקודה,

        קרן צורבת, שידול

        5 כדור אש, ענן סרחון

        7 מגן אש, חומת אש

        9 כפיית משימה, מכת חרקים
    - name: 'מזלו של האפל'
      level: 6
      description: |-
        אתה יכול לקרוא לפטרון הבן-תופת שלך לשנות את הגורל לטובתך. כשאתה מגלגל בדיקת תכונה או זריקת הצלה, אתה יכול להשתמש ביכולת הזאת כדי להוסיף 1d10 לגלגול. אתה יכול לעשות זאת אחרי שראית את הגלגול אך לפני שהשפעות הגלגול מתרחשות.

        אתה יכול להשתמש ביכולת הזאת מספר פעמים השווה למתאם הכריזמה שלך (מינימום פעם אחת), אך לא יותר מפעם אחת בכל גלגול. אתה מחזיר את כל השימושים שהוצאת כשאתה מסיים מנוחה ארוכה.
    - name: 'עמידות תופתית'
      level: 10
      description: |-
        בכל פעם שאתה מסיים מנוחה קצרה או ארוכה, בחר סוג נזק אחד, מלבד כוח קסום. יש לך עמידות לסוג הנזק הזה עד שתבחר סוג אחר באמצעות היכולת הזאת.
    - name: 'השלכה דרך הגיהינום'
      level: 14
      description: |-
        פעם בתור, כשאתה פוגע ביצור בגלגול התקפה, אתה יכול לנסות להעביר את היעד באופן מיידי דרך המישורים התחתונים. היעד חייב להצליח בזריקת הצלה בכריזמה מול דרגת הקושי להצלה נגד לחשים שלך, אחרת הוא נעלם ומתעופף דרך נוף של סיוט. היעד סופג 8d10 נזק נפשי אם אינו בן-תופת, ויש לו את המצב חסר יכולת פעולה עד סוף התור הבא שלך, אז הוא חוזר למשבצת שתפס קודם או למשבצת הפנויה הקרובה ביותר.

        לאחר שהשתמשת ביכולת הזאת, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה, אלא אם כן תוציא תא לחשי ברית (ללא צורך בפעולה) כדי להחזיר לעצמך את השימוש בה.
- id: hunter
  name: 'צייד'
  description: |-
    *הגנה על הטבע ועל בני אדם מפני הרס*

    אתה צד טרף בשטחים פראיים ובמקומות אחרים, ומשתמש ביכולות הצייד שלך כדי להגן על הטבע ועל בני אדם בכל מקום מפני כוחות המבקשים להשמידם.
  properties:
    summary: 'הגנה על הטבע ועל בני אדם מפני הרס'
    features:
    - name: 'ידע הצייד'
      level: 3
      description: |-
        אתה יכול לקרוא לכוחות הטבע כדי שיגלו חוזקות וחולשות מסוימות של הטרף שלך. כל עוד יצור מסומן באות הצייד שלך, אתה יודע אם יש לו חסינויות, עמידויות או רגישויות, ואם יש לו, אתה יודע מהן.
    - name: 'טרף הצייד'
      level: 3
      description: |-
        אתה מקבל אחת מאפשרויות היכולת הבאות לבחירתך. בכל פעם שאתה מסיים מנוחה קצרה או ארוכה, אתה יכול להחליף את האפשרות שבחרת באחרת.

        קוטל ענקים. הנחישות שלך יכולה לשחוק אפילו את האויבים העמידים ביותר. כשאתה פוגע ביצור בנשק, הנשק גורם ליעד 1d8 נזק נוסף אם חסרות לו נקודות חיים. אתה יכול לגרום את הנזק הנוסף הזה פעם אחת בלבד בתור.

        שובר המון. פעם אחת בכל אחד מהתורים שלך כשאתה מבצע התקפה בנשק, אתה יכול לבצע התקפה נוספת באותו נשק נגד יצור אחר הנמצא בטווח 5 רגל מהיעד המקורי, בטווח הנשק, ושלא תקפת בתור הזה.
    - name: 'טקטיקות הגנה'
      level: 7
      description: |-
        אתה מקבל אחת מאפשרויות היכולת הבאות לבחירתך. בכל פעם שאתה מסיים מנוחה קצרה או ארוכה, אתה יכול להחליף את האפשרות שבחרת באחרת.

        בריחה מההמון. להתקפות מזדמנות יש חיסרון נגדך.

        הגנה מפני התקפות מרובות. כשיצור פוגע בך בגלגול התקפה, ליצור הזה יש חיסרון בכל גלגולי ההתקפה האחרים נגדך בתור הזה.
    - name: 'טרף הצייד העליון'
      level: 11
      description: |-
        פעם בתור, כשאתה גורם נזק ליצור המסומן באות הצייד שלך, אתה יכול לגרום את הנזק הנוסף של הלחש גם ליצור אחר שאתה רואה בטווח 30 רגל מהיצור הראשון.
    - name: 'הגנת הצייד העליונה'
      level: 15
      description: |-
        כשאתה סופג נזק, אתה יכול להשתמש בתגובה כדי להעניק לעצמך עמידות לנזק הזה ולכל נזק אחר מאותו סוג עד סוף התור הנוכחי.
- id: life-domain
  name: 'תחום החיים'
  description: |-
    *ריפוי פצעי העולם*

    תחום החיים מתמקד באנרגיה החיובית התומכת בכל החיים ברב-היקום. כוהנים הנוגעים בתחום הזה הם אדוני הריפוי, ומשתמשים בכוח החיים כדי לרפא פצעים רבים.
    עצם הקיום נשען על האנרגיה החיובית הקשורה בתחום הזה, ולכן כוהן כמעט מכל מסורת דתית עשוי לבחור בו. התחום קשור במיוחד באלי חקלאות, באלי ריפוי או סיבולת, ובאלי בית וקהילה. גם מסדרים דתיים של ריפוי מבקשים את הקסם של התחום הזה.
  properties:
    summary: 'ריפוי פצעי העולם'
    features:
    - name: 'תלמיד החיים'
      level: 3
      description: |-
        כשלחש שהטלת בתא לחשים מחזיר נקודות חיים ליצור, היצור הזה מחזיר נקודות חיים נוספות בתור שבו הטלת את הלחש. הנקודות הנוספות שוות ל-2 ועוד דרגת תא הלחשים.
    - name: 'לחשי תחום החיים'
      level: 3
      description: |-
        הקשר שלך לתחום האלוהי הזה מבטיח שתמיד יהיו מוכנים אצלך לחשים מסוימים. כשאתה מגיע לדרגת כוהן המצוינת בטבלת לחשי תחום החיים, מאותו רגע הלחשים הרשומים מוכנים אצלך תמיד.

        לחשי תחום החיים

        דרגת כוהן

        לחשים מוכנים

        3 סיוע, ברכה, ריפוי פצעים,

        הבראה פחותה

        5 מילת ריפוי המונית, החייאה

        7 הילת חיים, הגנה מפני מוות

        9 שחזור גדול, ריפוי פצעים המוני
    - name: 'שימור החיים'
      level: 3
      description: |-
        כפעולת קסם אתה מציג את הסמל הקדוש שלך ומוציא שימוש אחד מערוץ האלוהות שלך כדי לעורר אנרגיית ריפוי היכולה להחזיר מספר נקודות חיים השווה לחמישה כפול דרגת הכוהן שלך. בחר יצורים פצועים בטווח 30 רגל ממך (ואתה יכול להיכלל בהם), וחלק ביניהם את נקודות החיים האלה. היכולת הזאת יכולה להחזיר ליצור לא יותר ממחצית מקסימום נקודות החיים שלו.
    - name: 'מרפא מבורך'
      level: 6
      description: |-
        לחשי הריפוי שאתה מטיל על אחרים מרפאים גם אותך. מיד אחרי שהטלת לחש בתא לחשים המחזיר נקודות חיים ליצור אחד או יותר מלבדך, אתה מחזיר נקודות חיים השוות ל-2 ועוד דרגת תא הלחשים.
    - name: 'ריפוי עליון'
      level: 17
      description: |-
        כשהיית מגלגל בדרך כלל קובייה אחת או יותר כדי להחזיר נקודות חיים ליצור באמצעות לחש או ערוץ אלוהות, אל תגלגל את הקוביות האלה לריפוי; במקום זאת השתמש במספר הגבוה ביותר האפשרי בכל קובייה. לדוגמה, במקום להחזיר ליצור 2d6 נקודות חיים באמצעות לחש, אתה מחזיר 12.
- id: oath-of-devotion
  name: 'שבועת המסירות'
  description: |-
    *שמירה על אידיאלים של צדק וסדר*

    שבועת המסירות קושרת פלאדינים לאידיאלים של צדק וסדר. הפלאדינים האלה הם אב-טיפוס של האביר בשריון נוצץ. הם מחייבים את עצמם לסטנדרטים הגבוהים ביותר של התנהגות, וחלקם, לטוב או לרע, מחייבים את שאר העולם באותם סטנדרטים.
    רבים מאלה הנשבעים את השבועה מסורים לאלי חוק וטוב ומשתמשים בעקרונות האלים שלהם כמדד למסירות אישית. אחרים רואים במלאכים את האידיאל שלהם וכוללים דימויים של כנפי מלאכים בקסדות או בסמלי המשפחה שלהם.
    הפלאדינים האלה חולקים את העקרונות הבאים:
    - תן לדברך להיות הבטחתך.
    - הגן על החלשים ואל תירא לפעול.
    - תן למעשיך הנכבדים לשמש דוגמה.
  properties:
    summary: 'שמירה על אידיאלים של צדק וסדר'
    features:
    - name: 'לחשי שבועת המסירות'
      level: 3
      description: |-
        קסם השבועה שלך מבטיח שתמיד יהיו מוכנים אצלך לחשים מסוימים; כשאתה מגיע לדרגת פלאדין המצוינת בטבלת לחשי שבועת המסירות, מאותו רגע הלחשים הרשומים מוכנים אצלך תמיד.

        לחשי שבועת המסירות

        דרגת פלאדין לחשים

        לחשי פלאדין דרגה 3

        לחש אסכולה מיוחד

        5 סיוע, אזור אמת

        אור יום תעצומה -

        מעגל קסם מגננה ח

        החייאה תאובה ח

        לחשי פלאדין דרגה 4

        לחש אסכולה מיוחד

        גירוש מגננה ר

        איתור יצור חיזוי ר

        לחשי פלאדין דרגה 5

        לחש אסכולה מיוחד

        כפיית משימה הקסמה -

        הקמת מתים תאובה ח

        13 חופש תנועה, שומר האמונה
    - name: 'נשק קדוש'
      level: 3
      description: |-
        כשאתה נוקט פעולת התקפה, אתה יכול להוציא שימוש אחד מערוץ האלוהות שלך כדי להחדיר אנרגיה חיובית לנשק קרב מגע אחד שאתה מחזיק. למשך 10 דקות או עד שתשתמש ביכולת הזאת שוב, אתה מוסיף את מתאם הכריזמה שלך לגלגולי ההתקפה שלך בנשק הזה (תוסף מינימלי של +1), ובכל פעם שאתה פוגע בו הוא גורם את סוג הנזק הרגיל שלו או נזק קורן.

        הנשק גם פולט אור בהיר ברדיוס 20 רגל ואור עמום ב-20 הרגל שמעבר לכך.

        אתה יכול לסיים את ההשפעה הזאת מוקדם (ללא צורך בפעולה). ההשפעה מסתיימת גם אם אינך נושא את הנשק.
    - name: 'הילת המסירות'
      level: 7
      description: |-
        לך ולבני בריתך יש חסינות למצב מוקסם בעודכם בהילת ההגנה שלך. אם בן ברית מוקסם נכנס להילה, המצב אינו משפיע עליו כל עוד הוא שם.
    - name: 'מהלומת הגנה'
      level: 15
      description: |-
        המהלומה הקסומה שלך קורנת כעת אנרגיית הגנה. בכל פעם שאתה מטיל מהלומה אלוהית, לך ולבני בריתך יש חצי מחסה בעודכם בהילת ההגנה שלך.

        ההילה נותנת את ההטבה הזאת עד תחילת התור הבא שלך.
    - name: 'הילה קדושה'
      level: 20
      description: |-
        כפעולה נוספת אתה יכול להחדיר להילת ההגנה שלך כוח קדוש, ולהעניק את ההטבות שלהלן למשך 10 דקות או עד שאתה מסיים אותן (ללא צורך בפעולה). לאחר שהשתמשת ביכולת הזאת, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה. אתה יכול גם להחזיר לעצמך את השימוש בה על ידי הוצאת תא לחשים מדרגה 5 (ללא צורך בפעולה).

        מגן קדוש. יש לך יתרון בכל זריקת הצלה שבן-תופת או אל-מת מכריחים אותך לבצע.

        נזק קורן. בכל פעם שאויב מתחיל את התור שלו בהילה, היצור הזה סופג נזק קורן השווה למתאם הכריזמה שלך ועוד תוסף השליטה שלך.

        אור שמש. ההילה מלאה באור בהיר שהוא אור שמש.
- id: path-of-the-berserker
  name: 'דרך הברסרקר'
  description: |-
    *תעלת הזעם לזעם אלים*

    ברברים ההולכים בדרך הברסרקר מכוונים את הזעם שלהם בעיקר לאלימות. דרכם היא דרך של זעם בלתי מרוסן, והם נהנים מהכאוס של הקרב בעודם מניחים לזעם שלהם לאחוז בהם ולהעצים אותם.
  properties:
    summary: 'תעלת הזעם לזעם אלים'
    features:
    - name: 'טירוף'
      level: 3
      description: |-
        אם אתה משתמש בהתקפה פזיזה בעוד הזעם שלך פעיל, אתה גורם נזק נוסף ליעד הראשון שפגעת בו בתור שלך בהתקפה מבוססת כוח. כדי לקבוע את הנזק הנוסף, גלגל מספר קוביות d6 השווה לתוסף נזק הזעם שלך, וחבר אותן. לנזק יש אותו סוג כמו הנשק או המכה הלא חמושה ששימשו להתקפה.
    - name: 'זעם חסר דעת'
      level: 6
      description: |-
        יש לך חסינות למצבים מוקסם ומבוהל בעוד הזעם שלך פעיל. אם אתה מוקסם או מבוהל כשאתה נכנס לזעם, המצב מסתיים אצלך.
    - name: 'גמול'
      level: 10
      description: |-
        כשאתה סופג נזק מיצור הנמצא בטווח 5 רגל ממך, אתה יכול להשתמש בתגובה כדי לבצע התקפת קרב מגע אחת נגד היצור הזה, בנשק או במכה לא חמושה.
    - name: 'נוכחות מאיימת'
      level: 14
      description: |-
        כפעולה נוספת אתה יכול להטיל אימה באחרים בנוכחותך המאיימת ובכוח הקדמוני שלך.

        כשאתה עושה זאת, כל יצור לבחירתך בהילה של 30 רגל היוצאת ממך חייב לבצע זריקת הצלה בחוכמה (דרגת קושי 8 ועוד מתאם הכוח ותוסף השליטה שלך). בכישלון היצור מקבל את המצב מבוהל למשך דקה אחת. בסוף כל אחד מהתורים של היצור המבוהל, היצור חוזר על ההצלה, ובהצלחה ההשפעה מסתיימת אצלו.

        לאחר שהשתמשת ביכולת הזאת, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה, אלא אם כן תוציא שימוש אחד מהזעם שלך (ללא צורך בפעולה) כדי להחזיר לעצמך את השימוש בה.
- id: thief
  name: 'גנב'
  description: |-
    *ציד אוצרות כהרפתקן קלאסי*

    שילוב של פורץ, ציד אוצרות ומגלה ארצות, אתה התגלמות ההרפתקן. מלבד שיפור הזריזות וההתגנבות שלך, אתה מקבל יכולות שימושיות לחדירה להריסות ולהפקת המרב מפריטי הקסם שתמצא שם.
  properties:
    summary: 'ציד אוצרות כהרפתקן קלאסי'
    features:
    - name: 'ידיים מהירות'
      level: 3
      description: |-
        כפעולה נוספת אתה יכול לבצע אחד מהבאים.

        זריזות ידיים. בצע בדיקת זריזות (זריזות ידיים) כדי לפרוץ מנעול או לנטרל מלכודת בכלי גנבים, או כדי לכייס.

        שימוש בחפץ. נקוט פעולת שימוש, או פעולת קסם כדי להשתמש בפריט קסום הדורש את הפעולה הזאת.
    - name: 'עבודת קומה שנייה'
      level: 3
      description: |-
        התאמנת להגיע למקומות קשים במיוחד לגישה, וקיבלת את ההטבות האלה.

        מטפס. אתה מקבל מהירות טיפוס השווה למהירות שלך.

        קופץ. אתה יכול לקבוע את מרחק הקפיצה שלך לפי הזריזות במקום לפי הכוח.
    - name: 'התגנבות עליונה'
      level: 9
      description: |-
        אתה מקבל את אפשרות מכת הערמה הבאה.

        התקפה חמקנית (מחיר: 1d6). אם יש לך את המצב בלתי נראה מפעולת ההתחבאות, ההתקפה הזאת אינה מסיימת את המצב הזה אם אתה מסיים את התור מאחורי מחסה שלושה רבעים או מחסה מלא.
    - name: 'שימוש בהתקן קסום'
      level: 13
      description: |-
        למדת איך להפיק את המרב מפריטי קסם, וקיבלת את ההטבות הבאות.

        התאמה. אתה יכול להתאים עד ארבעה פריטי קסם בו בזמן.

        מטענים. בכל פעם שאתה משתמש בתכונה של פריט קסום המוציאה מטענים, גלגל 1d6. אם יצא 6, אתה משתמש בתכונה בלי להוציא את המטענים.

        מגילות. אתה יכול להשתמש בכל מגילת לחש, ותבונה היא תכונת הטלת הלחשים שלך לאותו לחש. אם הלחש הוא לחשון או לחש דרגה 1, אתה יכול להטיל אותו בביטחון. אם המגילה מכילה לחש בדרגה גבוהה יותר, עליך להצליח תחילה בבדיקת תבונה (מאגיה) (דרגת קושי 10 ועוד דרגת הלחש). בבדיקה מוצלחת אתה מטיל את הלחש מהמגילה. בבדיקה כושלת המגילה מתפוררת.
    - name: 'רפלקסי הגנב'
      level: 17
      description: |-
        אתה מיומן בהטמנת מארבים ובמילוט מהיר מסכנה. אתה יכול לנקוט שני תורות בסבב הראשון של כל קרב. את התור הראשון אתה נוקט ביוזמה הרגילה שלך ואת התור השני ביוזמה שלך פחות 10.
- id: warrior-of-the-open-hand
  name: 'לוחם היד הפתוחה'
  description: |-
    *שליטה בטכניקות לחימה לא חמושה*

    לוחמי היד הפתוחה הם אדוני הלחימה הלא חמושה. הם לומדים טכניקות לדחוף את יריביהם ולהפיל אותם, ולשלוט באנרגיה שלהם כדי להגן על עצמם מפגיעה.
  properties:
    summary: 'שליטה בטכניקות לחימה לא חמושה'
    features:
    - name: 'טכניקת היד הפתוחה'
      level: 3
      description: |-
        בכל פעם שאתה פוגע ביצור בהתקפה שניתנה לך מסופת המכות, אתה יכול להטיל על היעד אחת מההשפעות הבאות.

        הלם. היעד אינו יכול לבצע התקפות מזדמנות עד תחילת התור הבא שלו.

        דחיפה. היעד חייב להצליח בזריקת הצלה בכוח, אחרת הוא נדחף עד 15 רגל ממך.

        הפלה. היעד חייב להצליח בזריקת הצלה בזריזות, אחרת יש לו את המצב שרוע.
    - name: 'שלמות הגוף'
      level: 6
      description: |-
        אתה מקבל את היכולת לרפא את עצמך. כפעולה נוספת אתה יכול לגלגל את קוביית אומנויות הלחימה שלך. אתה מחזיר מספר נקודות חיים השווה למספר שיצא

        ועוד מתאם החוכמה שלך (מינימום נקודת חיים אחת מוחזרת).

        אתה יכול להשתמש ביכולת הזאת מספר פעמים השווה למתאם החוכמה שלך (מינימום פעם אחת), ואתה מחזיר את כל השימושים שהוצאת כשאתה מסיים מנוחה ארוכה.
    - name: 'צעד זריז'
      level: 11
      description: |-
        כשאתה נוקט פעולה נוספת מלבד צעד הרוח, אתה יכול להשתמש גם בצעד הרוח מיד אחרי הפעולה הנוספת הזאת.
    - name: 'כף רועדת'
      level: 17
      description: |-
        אתה מקבל את היכולת להשרות רעידות קטלניות בגופו של מישהו. כשאתה פוגע ביצור במכה לא חמושה, אתה יכול להוציא 4 נקודות מיקוד כדי להתחיל את הרעידות הבלתי מורגשות האלה, שנמשכות

        מספר ימים השווה לדרגת הנזיר שלך. הרעידות אינן מזיקות אלא אם כן תנקוט פעולה כדי לסיים אותן. לחלופין, כשאתה נוקט פעולת התקפה בתור שלך, אתה יכול לוותר על אחת ההתקפות כדי לסיים את הרעידות. כדי לסיים אותן, אתה והיעד חייבים להיות באותו מישור קיום. כשאתה מסיים אותן, היעד חייב לבצע זריקת הצלה בחוסן, וסופג 10d12 נזק כוח קסום בכישלון או מחצית מהנזק בהצלחה.

        אתה יכול להחזיק רק יצור אחד תחת השפעת היכולת הזאת בכל רגע נתון. אתה יכול לסיים את הרעידות ללא נזק (ללא צורך בפעולה).
