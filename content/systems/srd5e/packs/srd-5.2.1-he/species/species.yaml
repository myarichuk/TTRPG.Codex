- id: dragonborn
  name: "דם דרקון"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **ראיית חושך (60 רגל).** יש לך ראיית חושך בטווח 60 רגל.

    **טיסה דרקונית.** כשאתה מגיע לדרגת דמות 5, אתה יכול להפנות קסם דרקוני כדי להעניק לעצמך טיסה זמנית. בפעולה נוספת אתה מצמיח על גבך כנפי רוח שנמשכות 10 דקות, או עד שאתה מכווץ אותן (ללא צורך בפעולה) או נכנס למצב חסר יכולת פעולה. במהלך הזמן הזה יש לך מהירות מעוף השווה למהירות שלך. הכנפיים שלך נראות עשויות מאותה אנרגיה כמו נשק הנשימה שלך. לאחר שהשתמשת בתכונה זו, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה.
  properties:
    lineages: []
- id: dwarf
  name: "גמד"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **ראיית חושך (120 רגל).** יש לך ראיית חושך בטווח 120 רגל.

    **חוסן גמדי.** יש לך עמידות לנזק רעל. כמו כן יש לך יתרון בזריקות הצלה שאתה מבצע כדי להימנע ממצב מורעל או לסיים אותו.

    **קשיחות גמדית.** מקסימום נקודות החיים שלך גדל ב-1, והוא גדל שוב ב-1 בכל פעם שאתה מקבל דרגה.

    **בקיאות באבן.** בפעולה נוספת אתה מקבל חוש-רעד בטווח 60 רגל למשך 10 דקות. כדי להשתמש בחוש-רעד זה עליך לעמוד על משטח אבן או לגעת בו. האבן יכולה להיות טבעית או מעובדת.
    אתה יכול להשתמש בפעולה נוספת זו מספר פעמים השווה לתוסף השליטה שלך, ואתה מחדש את כל השימושים שנוצלו כשאתה מסיים מנוחה ארוכה.
- id: elf
  name: "אלף"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **ראיית חושך (60 רגל).** יש לך ראיית חושך בטווח 60 רגל.

    **שושלת אלפית.** אתה שייך לשושלת שמעניקה לך יכולות על-טבעיות. בחר שושלת מטבלת השושלות האלפיות. אתה מקבל את היתרון של דרגה 1 משושלת זו.
    כשאתה מגיע לדרגות דמות 3 ו-5, אתה לומד לחש בדרגה גבוהה יותר, כפי שמוצג בטבלה.
    הלחש הזה מוכן אצלך תמיד. אתה יכול להטיל אותו פעם אחת ללא תא לחשים, ואתה מחדש את היכולת להטילו כך כשאתה מסיים מנוחה ארוכה. אתה יכול גם להטיל את הלחש באמצעות כל תא לחשים שיש לך מהדרגה המתאימה.
    שושלות אלפיות
    דרואו
    דרגה 1. טווח ראיית החושך שלך גדל ל-120 רגל. אתה גם מכיר את הלחשון אורות מרקדים.
    דרגה 3. אש פיות
    דרגה 5. חושך
    אלף עילית
    דרגה 1. אתה מכיר את הלחשון להטוטנות. בכל פעם שאתה מסיים מנוחה ארוכה, אתה יכול להחליף את הלחשון הזה בלחשון אחר מרשימת הלחשים של האשף.
    דרגה 3. גילוי קסם
    דרגה 5. צעד ערפל
    אלף עצים
    דרגה 1. המהירות שלך גדלה ל-35 רגל. אתה גם מכיר את הלחשון אמנות הדרואיד.
    דרגה 3. צעידה ארוכה
    דרגה 5. מעבר ללא עקבות
    תבונה, חוכמה או כריזמה היא תכונת הטלת הלחשים שלך ללחשים שאתה מטיל באמצעות תכונה זו (בחר את התכונה כשאתה בוחר את השושלת).

    **מורשת פיות.** יש לך יתרון בזריקות הצלה שאתה מבצע כדי להימנע ממצב מוקסם או לסיים אותו.

    **חושים חדים.** יש לך שליטה במיומנות תובנה, הבחנה או השרדות.

    **טראנס.** אינך צריך לישון, וקסם לא יכול להרדים אותך. אתה יכול לסיים מנוחה ארוכה ב-4 שעות אם אתה מעביר אותן בהרהור דמוי טראנס, שבמהלכו אתה נשאר בהכרה.
  properties:
    lineages: []
- id: gnome
  name: "ננס"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** קטן  
    **מהירות:** 30 רגל

    **ראיית חושך (60 רגל).** יש לך ראיית חושך בטווח 60 רגל.

    **ערמומיות ננסית.** יש לך יתרון בזריקות הצלה של תבונה, חוכמה וכריזמה.

    **שושלת ננסית.** אתה שייך לשושלת שמעניקה לך יכולות על-טבעיות. בחר אחת מהאפשרויות הבאות; לא משנה מה בחרת, תבונה, חוכמה או כריזמה היא תכונת הטלת הלחשים שלך ללחשים שאתה מטיל באמצעות תכונה זו (בחר את התכונה כשאתה בוחר את השושלת):
    ננס יער. אתה מכיר את הלחשון אשליה קטנה. בנוסף, הלחש שיח עם בעלי חיים מוכן אצלך תמיד. אתה יכול להטיל אותו ללא תא לחשים מספר פעמים השווה לתוסף השליטה שלך, ואתה מחדש את כל השימושים שנוצלו כשאתה מסיים מנוחה ארוכה. אתה יכול גם להשתמש בכל תא לחשים שיש לך כדי להטיל את הלחש.
    ננס אבן. אתה מכיר את הלחשונים תיקון ולהטוטנות. בנוסף, אתה יכול להקדיש 10 דקות להטלת להטוטנות כדי ליצור מכשיר קטנטן מבוסס מנגנון שעון (דרגת שריון 5, 1 נקודת חיים), כמו צעצוע, מצית או קופסת נגינה. כשאתה יוצר את המכשיר, אתה קובע את תפקידו בבחירת אחת מההשפעות של להטוטנות; המכשיר מפיק את ההשפעה הזו בכל פעם שאתה או יצור אחר מקדיש פעולה נוספת להפעלתו במגע. אם להשפעה שנבחרה יש אפשרויות בתוכה, אתה בוחר אחת מהן עבור המכשיר כשאתה יוצר אותו.
    לדוגמה, אם אתה בוחר בהשפעת ההדלקה-וההכבאה של הלחש, אתה קובע אם המכשיר מדליק אש או מכבה אותה; המכשיר אינו עושה את שני הדברים. יכולים להתקיים לצדך שלושה מכשירים כאלה בו-זמנית, וכל אחד מהם מתפרק 8 שעות לאחר יצירתו או כשאתה מפרק אותו במגע בפעולת שימוש.
- id: goliath
  name: "גוליית"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 35 רגל

    **שושלת ענקים.** אתה צאצא של ענקים. בחר אחד מהיתרונות הבאים, מתת על-טבעית משושלתך; אתה יכול להשתמש ביתרון שבחרת מספר פעמים השווה לתוסף השליטה שלך, ואתה מחדש את כל השימושים שנוצלו כשאתה מסיים מנוחה ארוכה:
    זינוק הענן (ענק ענן). בפעולה נוספת אתה משתגר בקסם עד 30 רגל למשבצת פנויה שאתה רואה.
    צריבת האש (ענק אש). כשאתה פוגע ביעד בהטלת תקיפה וגורם לו נזק, אתה יכול גם לגרום לו 1d10 נזק אש.
    צינת הכפור (ענק כפור). כשאתה פוגע ביעד בהטלת תקיפה וגורם לו נזק, אתה יכול גם לגרום לו 1d6 נזק קור ולהפחית את מהירותו ב-10 רגל עד תחילת התור הבא שלך.
    התגלגלות הגבעה (ענק גבעות). כשאתה פוגע ביצור גדול או קטן ממנו בהטלת תקיפה וגורם לו נזק, אתה יכול להעניק ליעד את המצב שרוע.
    סיבולת האבן (ענק אבן). כשאתה סופג נזק, אתה יכול לבצע תגובה כדי להטיל 1d12. הוסף את מתאם החוסן שלך למספר שהוטל והפחת את הנזק בסכום זה.
    - רעם הסערה (ענק סערה). כשאתה סופג נזק מיצור בטווח 60 רגל ממך, אתה יכול לבצע תגובה כדי לגרום ליצור זה 1d8 נזק רעם.

    **צורה גדולה.** החל מדרגת דמות 5, אתה יכול לשנות את גודלך לגדול בפעולה נוספת אם אתה נמצא במרחב גדול דיו. השינוי נמשך 10 דקות או עד שאתה מסיים אותו (ללא צורך בפעולה). במהלך הזמן הזה יש לך יתרון בבדיקות כוח, והמהירות שלך גדלה ב-10 רגל. לאחר שהשתמשת בתכונה זו, אינך יכול להשתמש בה שוב עד שתסיים מנוחה ארוכה.

    **מבנה עצום.** יש לך יתרון בכל בדיקת תכונה שאתה מבצע כדי לסיים את המצב אחוז. כמו כן, אתה נחשב לגדול ממך בגודל אחד לצורך קביעת קיבולת הנשיאה שלך.
  properties:
    lineages: []
- id: halfling
  name: "זוטון"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** קטן  
    **מהירות:** 30 רגל

    **אמיץ.** יש לך יתרון בזריקות הצלה שאתה מבצע כדי להימנע ממצב מבוהל או לסיים אותו.

    **זריזות זוטונית.** אתה יכול לעבור דרך משבצת של כל יצור שגדול ממך בגודל אחד, אך אינך יכול לעצור באותה משבצת.

    **מזל.** כשאתה מטיל 1 על ה-d20 של מבחן d20, אתה יכול להטיל את הקובייה מחדש, ועליך להשתמש בהטלה החדשה.

    **התגנבות טבעית.** אתה יכול לבצע את פעולת ההתחבאות גם כשאתה מוסתר רק על ידי יצור שגדול ממך לפחות בגודל אחד.
- id: human
  name: "בן-אנוש"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **תושייה.** אתה מקבל השראה הרואית בכל פעם שאתה מסיים מנוחה ארוכה.

    **מיומנות.** אתה מקבל שליטה במיומנות אחת לבחירתך.

    **רב-גוניות.** אתה מקבל כשרון מוצא לבחירתך (ראה "כשרונות"). מומלץ מיומן.
- id: orc
  name: "אורק"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **זרם אדרנלין.** אתה יכול לבצע את פעולת המאוץ בפעולה נוספת. כשאתה עושה זאת, אתה מקבל נקודות חיים זמניות במספר השווה לתוסף השליטה שלך.
    אתה יכול להשתמש בתכונה זו מספר פעמים השווה לתוסף השליטה שלך, ואתה מחדש את כל השימושים שנוצלו כשאתה מסיים מנוחה קצרה או ארוכה.

    **ראיית חושך (120 רגל).** יש לך ראיית חושך בטווח 120 רגל.

    **סיבולת בלתי נלאית.** כשנקודות החיים שלך יורדות ל-0 אך אינך נהרג במקום, אתה יכול לרדת במקום זאת ל-1 נקודת חיים. לאחר שהשתמשת בתכונה זו, אינך יכול לעשות זאת שוב עד שתסיים מנוחה ארוכה.
- id: tiefling
  name: "זד"
  description: |-
    **סוג יצור:** דמוי אדם  
    **גודל:** בינוני  
    **מהירות:** 30 רגל

    **ראיית חושך (60 רגל).** יש לך ראיית חושך בטווח 60 רגל.

    **מורשת תופתית.** אתה מקבל מורשת שמעניקה לך יכולות על-טבעיות. בחר מורשת מטבלת המורשות התופתיות. אתה מקבל את היתרון של דרגה 1 מהמורשת שבחרת.
    כשאתה מגיע לדרגות דמות 3 ו-5, אתה לומד לחש בדרגה גבוהה יותר, כפי שמוצג בטבלה.
    הלחש הזה מוכן אצלך תמיד. אתה יכול להטיל אותו פעם אחת ללא תא לחשים, ואתה מחדש את היכולת להטילו כך כשאתה מסיים מנוחה ארוכה. אתה יכול גם להטיל את הלחש באמצעות כל תא לחשים שיש לך מהדרגה המתאימה.
    תבונה, חוכמה או כריזמה היא תכונת הטלת הלחשים שלך ללחשים שאתה מטיל באמצעות תכונה זו (בחר את התכונה כשאתה בוחר את המורשת).
    מורשות תופתיות
    תהומית.
    דרגה 1. יש לך עמידות לנזק רעל. אתה גם מכיר את הלחשון התזת רעל.
    דרגה 3. קרן חולי
    דרגה 5. שיתוק אדם
    שאולית.
    דרגה 1. יש לך עמידות לנזק נקרוטי. אתה גם מכיר את הלחשון מגע קר.
    דרגה 3. חיים מדומים
    דרגה 5. קרן החלשה
    תופתית.
    דרגה 1. יש לך עמידות לנזק אש. אתה גם מכיר את הלחשון חץ אש.
    דרגה 3. נזיפת תופת
    דרגה 5. חושך

    **נוכחות מעולמות אחרים.** אתה מכיר את הלחשון מופתים. כשאתה מטיל אותו באמצעות תכונה זו, הלחש משתמש באותה תכונת הטלת לחשים שבה אתה משתמש לתכונת המורשת התופתית שלך.
  properties:
    lineages: []
