    **הרטבת יצור או חפץ.** כשאתה נוקט פעולת התקפה, אתה יכול להחליף אחת מההתקפות שלך בהטלת צלוחית שמן. בחר יצור או חפץ אחד במרחק של עד 20 רגל ממך. על המטרה להצליח בזריקת הצלה בזריזות (דרגת קושי 8 ועוד מתאם הזריזות שלך ותוסף השליטה שלך), או שתיכסה בשמן. אם המטרה סופגת נזק אש לפני שהשמן מתייבש (אחרי 1 דקה), היא סופגת 5 נזק אש נוסף מהשמן הבוער.
    **הרטבת שטח.** אתה יכול לנקוט פעולת שימוש כדי לשפוך צלוחית שמן על קרקע ישרה ולכסות שטח ריבועי של 5 רגל במרחק של עד 5 רגל ממך. אם השמן מודלק, הוא בוער עד סוף התור, 2 סבבים מרגע ההדלקה (או 12 שניות), ופוגע ב-5 נזק אש בכל יצור שנכנס לשטח או מסיים בו את התור שלו. יצור יכול לסבול נזק זה רק פעם אחת בתור.
    **דלק.**  שמן משמש כדלק למנורות ולפנסים. לאחר שהודלקה, צלוחית שמן בוערת במשך 6 שעות במנורה או בפנס. משך זה אינו חייב להיות רצוף; אתה יכול לכבות את השמן הבוער (כפעולת שימוש) ולהצית אותו מחדש עד שבער בסך הכול 6 שעות
