    **קובייה רפשית.** הקובייה ממלאת את כל המרחב שלה והיא שקופה. יצורים אחרים יכולים להיכנס למרחב הזה, אך יצור שעושה זאת נתון לבליעה של הקובייה ויש לו חיסרון בזריקת ההצלה. ליצורים בתוך הקובייה יש כיסוי מלא, והקובייה יכולה להחזיק בתוכה בו-זמנית יצור גדול אחד או עד ארבעה יצורים בינוניים או קטנים. כפעולה, יצור בטווח 5 רגל מהקובייה יכול למשוך יצור או חפץ אל מחוץ לקובייה אם הוא מצליח בבדיקת כוח (אתלטיקה) בדרגת קושי 12, והמושך מקבל 10 (3d6) נזק חומצה.

    **שקיפות.** גם כשהקובייה בשדה הראייה הגלוי, יצור חייב להצליח בבדיקת חוכמה (הבחנה) בדרגת קושי 15 כדי לשים לב אליה, אם הוא לא ראה את הקובייה נעה או פועלת בדרך אחרת.


    ### פעולות
    **פסאודופוד.** התקפה בקרב פנים אל פנים: +4, הישג 5 רגל. פגיעה: 12 (3d6 + 2) נזק חומצה.

    **בליעה.** הקובייה נעה עד מהירותה בלי לעורר התקפות מזדמנות. הקובייה יכולה לנוע דרך המרחבים של יצורים גדולים או קטנים יותר אם יש בתוכה מקום להכיל אותם (ראה מאפיין קובייה רפשית). זריקת הצלה בזריזות: דרגת קושי 12, כל יצור שהקובייה נכנסת למרחבו בפעם הראשונה במהלך תנועה זו. כישלון: 10 (3d6) נזק חומצה, והיעד נבלע. יעד בלוע נחנק, לא יכול להטיל לחשים עם רכיב קולי, יש לו את מצב מרוסן, וסופג 10 (3d6) נזק חומצה בתחילת כל אחד מתורי הקובייה. כשהקובייה נעה, היעד הבלוע נע איתה. יעד בלוע יכול לנסות להימלט בכך שהוא נוקט פעולה ומבצע בדיקת כוח (אתלטיקה) בדרגת קושי 12. אם הבדיקה מצליחה, היעד נמלט ונכנס למרחב הפנוי הקרוב ביותר. הצלחה: מחצית מהנזק, והיעד עובר למרחב פנוי בטווח 5 רגל מהקובייה. אם אין מרחב פנוי, היעד נכשל בהצלה במקום זאת.
