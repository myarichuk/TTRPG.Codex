- id: aboleth
  name: אבולת
  description: |-
    *שיקוץ גדול, רע וחוקי*

    **דרגת שריון** 17  
    **נקודות חיים** 150 (20d10 + 40)  
    **מהירות** 10 רגל, שחייה 40 רגל  
    **אתגר** 10 (נק״נ 5900; תוסף שליטה +4)

    | כוח | זרז | חוס | תבנ | חכמ | כרז |
    | --- | --- | --- | --- | --- | --- |
    | 21 (+5) | 9 (-1) | 15 (+2) | 18 (+4) | 15 (+2) | 18 (+4) |

    **זריקות הצלה** זרז +3, חוס +6, תבנ +8, חכמ +6  
    **מיומנויות** היסטוריה +12, הבחנה +10  
    **חושים** ראיית חושך 120 רגל, הבחנה קבועה 20  
    **שפות** דיבור עמוק; טלפתיה 120 רגל

    ### מאפיינים
    **דו-חיי.** האבולת יכולה לנשום אוויר ומים.

    **שיקום מיסתורי.** אם האבולת מושמדת, היא מקבלת גוף חדש בתוך 5d10 ימים, ומתעוררת עם כל נקודות החיים שלה במרחב הרחוק או במקום אחר שבחר שליט המבוך.

    **עמידות אגדית (3/יום).** אם האבולת נכשלת בזריקת הצלה, היא יכולה לבחור להצליח במקומה.

    **ענן ריר.** כשהאבולת מתחת למים, היא מוקפת ריר. זריקת הצלה בחוסן: דרגת קושי 14, כל יצור בהילה של 5 רגל שמקורה באבולת, בסוף תורה של האבולת. כישלון: היעד מקולל. עד שהקללה מסתיימת, עורו של היעד נעשה רירי, הוא יכול לנשום אוויר ומים, והוא לא יכול להחזיר נקודות חיים אלא אם הוא מתחת למים. כשהיצור המקולל מחוץ לגוף מים, הוא מקבל 6 (1d12) נזק חומצה בסוף כל 10 דקות, אלא אם הרטיבו את עורו לפני שחלפו הדקות האלה.

    **טלפתיה חוקרת.** אם יצור שהאבולת יכולה לראות מתקשר עם האבולת בטלפתיה, האבולת לומדת מהם משאלות לבו העמוקות ביותר.


    ### פעולות
    **התקפות מרובות.** האבולת מבצעת שתי התקפות מחוש, ומשתמשת בבליעת זיכרונות או בשליטה בתודעה, אם זמינה.

    **מחוש.** התקפה בקרב פנים אל פנים: +9, הישג 15 רגל. פגיעה: 12 (2d6 + 5) נזק מוחץ. אם היעד הוא יצור גדול או קטן יותר, הוא אחוז (דרגת קושי לחילוץ 14) באחד מארבעת המחושים.

    **בליעת זיכרונות.** זריקת הצלה בתבונה: דרגת קושי 16, יצור אחד בטווח 30 רגל שהוא מוקסם או אחוז בידי האבולת. כישלון: 10 (3d6) נזק נפשי. הצלחה: מחצית מהנזק. כישלון או הצלחה: האבולת מקבלת את זיכרונותיו של היעד אם הוא דמוי אדם והפעולה הזאת מורידה אותו ל-0 נקודות חיים.

    **שליטה בתודעה (2/יום).** זריקת הצלה בחוכמה: דרגת קושי 16, יצור אחד שהאבולת יכולה לראות בטווח 30 רגל. כישלון: היעד מוקסם עד שהאבולת מתה או נמצאת במישור קיום אחר מזה של היעד. כל עוד הוא מוקסם, היעד פועל כבעל ברית של האבולת ונתון לשליטתה כשהוא בטווח 60 רגל ממנה. בנוסף, האבולת והיעד יכולים לתקשר זה עם זה בטלפתיה מכל מרחק. היעד חוזר על ההצלה בכל פעם שהוא מקבל נזק, וגם אחרי כל 24 שעות שהוא שוהה לפחות 1 מייל מהאבולת, ומסיים את ההשפעה על עצמו בהצלחה.


    ### פעולות אגדיות
    **הצלפה.** האבולת מבצעת התקפת מחוש אחת.

    **ניקוז נפשי.** אם יש לאבולת לפחות יצור אחד מוקסם או אחוז, היא משתמשת בבליעת זיכרונות ומחזירה לעצמה 5 (1d10) נקודות חיים.
