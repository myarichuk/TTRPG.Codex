    **שאגת רעם.** זריקת הצלה בחוסן: דרגת קושי 27, כל יצור וכל חפץ שאינו לבוש או נישא בחרוט של 150 רגל. כישלון: 78 (12d12) נזק רעם, והיעד חירש ומבוהל עד סוף תורו הבא. הצלחה: מחצית מהנזק בלבד.


