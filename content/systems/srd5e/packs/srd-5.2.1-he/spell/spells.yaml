    הילה מזויפת (חפץ). אתה משנה את האופן שבו היעד נראה ללחשים ולאפקטים קסומים שמגלים הילות קסומות, כמו גילוי קסם. אתה יכול לגרום לחפץ לא קסום להיראות קסום, לפריט קסום להיראות לא קסום, או לשנות את ההילה של החפץ כך שתיראה כשייכת לאסכולת קסם שתבחר.
  properties:
    castingTime: פעולה
    range: מגע
    material: ריבוע קטן של משי
    duration: 24 שעות
- id: astral-projection
  name: הקרנה אסטרלית
  description: |-
    *דרגה 9, תאובה (כוהן, מכשף, אשף)*

    **זמן הטלה:** 1 שעה  
    **טווח:** 10 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (לכל אחד מיעדי הלחש: יקינתון בשווי 1,000+ מ״ז ומטיל כסף בשווי 100+ מ״ז, שהלחש צורך את כולם)  
    **משך:** עד ביטול

    אתה ועד שמונה יצורים מוכנים בטווח מקרינים את גופיכם האסטרליים אל המישור האסטרלי (הלחש מסתיים מיד אם אתה כבר נמצא במישור הזה). גופו של כל יעד נשאר מאחור במצב של חיים מושהים; הוא חסר הכרה, אינו צריך מזון או אוויר, ואינו מזדקן.
    צורתו האסטרלית של יעד דומה לגופו כמעט בכל היבטיו, והיא משכפלת את נתוני המשחק שלו ואת רכושו. ההבדל העיקרי הוא תוספת של חוט כסוף שנמתח מבין שכמות הצורה האסטרלית. החוט נעלם מהעין לאחר 1 רגל. אם החוט נחתך (דבר שקורה רק כשאפקט קובע זאת), גם גופו של היעד וגם צורתו האסטרלית מתים.
    צורתו האסטרלית של היעד יכולה לנוע במישור האסטרלי. ברגע שצורה אסטרלית עוזבת את המישור, גופו של היעד ורכושו נעים לאורך החוט הכסוף, וכך היעד חוזר לגופו במישור החדש.
    כל נזק או אפקט אחר שחל על צורה אסטרלית לא משפיע על גופו של היעד, וההיפך. אם גופו של יעד או צורתו האסטרלית יורדים ל-0 נקודות חיים, הלחש מסתיים עבור אותו יעד. הלחש מסתיים עבור כל היעדים אם אתה מבצע פעולת קסם כדי לסיימו.
    כשהלחש מסתיים עבור יעד שאינו מת, היעד מופיע שוב בגופו ויוצא ממצב ההשהיה.
  properties:
