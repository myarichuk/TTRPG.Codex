    היעד יכול לנקוט פעולת עיון כדי לבחון את הדמות המדומה בבדיקת תבונה (חקירה) נגד דרגת הקושי להצלה נגד לחשים שלך. אם הבדיקה מצליחה, היעד מבין שהדמות המדומה היא אשליה, והלחש מסתיים.
