    משאלה היא הלחש האדיר ביותר שבן תמותה יכול להטיל. די בכך שתאמר אותה בקול, ואתה יכול לשנות את המציאות עצמה.
    השימוש הבסיסי בלחש הוא לשכפל כל לחש אחר מדרגה 8 ומטה. אם אתה משתמש בו כך, אינך צריך לעמוד בשום דרישה להטלת אותו לחש, כולל רכיבים יקרים. הלחש פשוט נכנס לתוקף.
    לחלופין, אתה יכול ליצור אחד מהאפקטים הבאים לבחירתך: יצירת חפץ. אתה יוצר חפץ אחד ששווייו עד 25,000 זהב ואינו חפץ קסום. החפץ אינו יכול להיות גדול מ-300 רגל באף מימד, והוא מופיע במרחב פנוי שאתה רואה על הקרקע. בריאות מיידית. אתה מאפשר לעצמך ולעד עשרים יצורים שאתה רואה להחזיר את כל נקודות החיים שלהם, ואתה מסיים עליהם את כל האפקטים הרשומים בלחש שחזור גדול. עמידות. אתה מעניק לעד עשרה יצורים שאתה רואה עמידות לסוג נזק אחד שתבחר. עמידות זו קבועה. חסינות ללחש. אתה מעניק לעד עשרה יצורים שאתה רואה חסינות ללחש אחד או לאפקט קסום אחר למשך 8 שעות. למידה פתאומית. אתה מחליף אחד מהכשרונות שלך בכשרון אחר שאתה זכאי לו. אתה מאבד את כל היתרונות של הכשרון הישן ומקבל את היתרונות של החדש. אינך יכול להחליף כשרון שהוא דרישת קדם לכשרונות או ליכולות אחרים שלך. גלגול חוזר. אתה מבטל אירוע אחד שהתרחש לאחרונה בכך שאתה מכריח גלגול חוזר של כל הטלת קובייה שבוצעה בסבב האחרון (כולל התור האחרון שלך). המציאות מעצבת את עצמה מחדש כדי להתאים לתוצאה החדשה. לדוגמה, לחש משאלה יכול לבטל זריקת הצלה כושלת של בעל ברית או פגיעה קריטית של אויב. אתה יכול להכריח את הגלגול החוזר להיעשות ביתרון או בחיסרון, ואתה בוחר אם להשתמש בגלגול החוזר או במקורי. עיצוב מחדש של המציאות. אתה יכול לבקש משהו שאינו כלול באף אחד מהאפקטים האחרים. כדי לעשות זאת, הצהר על משאלתך בפני שליט המבוך בדייקנות רבה ככל האפשר. לשליט המבוך יש חופש פעולה רחב בהכרעה מה קורה במקרה כזה; ככל שהמשאלה גדולה יותר, גדל הסיכוי שמשהו ישתבש. ייתכן שהלחש פשוט ייכשל, ייתכן שהאפקט שאתה מבקש יושג רק בחלקו, או שתסבול תוצאה בלתי צפויה בגלל אופן ניסוח המשאלה. לדוגמה, משאלה שנבל יהיה מת עלולה להקפיץ אותך קדימה בזמן לתקופה שבה הנבל כבר אינו בין החיים, ובכך להוציא אותך מהמשחק למעשה. באופן דומה, משאלה לחפץ קסום אגדי או לחפץ קדמון עלולה להעביר אותך מיד אל נוכחות הבעלים הנוכחי של החפץ. אם משאלתך מתגשמת וההשלכות שלה נוגעות לקהילה שלמה, לאזור או לעולם, סביר שתמשוך אליך אויבים חזקים. אם משאלתך משפיעה על אל, משרתיו האלוהיים של האל עלולים להתערב מיד כדי למנוע אותה או כדי לדחוף אותך לנסח את המשאלה בדרך מסוימת. אם משאלתך הייתה מבטלת את ריבוי העולמות עצמו, המשאלה נכשלת. הלחץ של הטלת משאלה כדי ליצור כל אפקט שאינו שכפול לחש אחר מחליש אותך. אחרי שעברת את הלחץ הזה, בכל פעם שאתה מטיל לחש עד שתסיים מנוחה ארוכה, אתה סופג 1d10 נזק נקרוטי על כל דרגה של אותו לחש. אי אפשר להפחית את הנזק הזה או למנוע אותו בשום דרך. בנוסף, ערך הכוח שלך הופך ל-3 למשך 2d4 ימים. על כל יום מהימים האלה שאתה מבלה במנוחה ואינך עושה דבר מלבד פעילות קלה, זמן ההחלמה הנותר שלך מתקצר ב-2 ימים. לבסוף, יש סיכוי של 33 אחוזים שלא תוכל להטיל משאלה לעולם שוב, אם אתה סובל את הלחץ הזה.
