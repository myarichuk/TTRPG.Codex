    higherLevel: "השתמש בדרגת תא הלחשים כדרגת הלחש בגיליון הנתונים. גדול יצור מרום, יצור פייה או בן-תופת (לבחירתך), ניטרלי דרגת שריון 10 + 1 לכל דרגת לחש נקודות חיים 5 + 10 לכל דרגת לחש (לבהמה יש מספר קוביות חיים [d10] השווה לדרגת הלחש) מהירות 60 רגל, מעוף 60 רגל (דורש לחש בדרגה 4+) מתאם הצלה    מתאם הצלה    מתאם הצלה כוח 18 +4 +4 זריזות 12 +1 +1 חוסן 14 +2 +2 תבונה 6 -2 -2 חוכמה 12 +1 +1 כריזמה 8 -1 -1 חושים הבחנה קבועה 11 שפות טלפתיה 1 מייל (פועלת רק איתך) אתגר ללא (0 נק״נ; תוסף השליטה שווה לתוסף השליטה שלך) מאפיינים קשר חיים. כשאתה מחזיר לעצמך נקודות חיים מלחש בדרגה 1+, הבהמה מחזירה לעצמה אותו מספר נקודות חיים אם אתה בטווח של 5 רגל ממנה. פעולות מכת עולם אחר. התקפת קרב מגע: התוסף שווה לתוסף ההתקפה בלחש שלך, הישג 5 רגל. פגיעה: 1d8 ועוד דרגת הלחש נזק קורן (יצור מרום), נפשי (יצור פייה) או תאובה (בן-תופת). פעולות נוספות מבט אכזרי (בן-תופת בלבד; מתחדש לאחר מנוחה ארוכה). זריקת הצלה בחוכמה: דרגת קושי השווה לדרגת הקושי להצלה נגד לחשים שלך, יצור אחד בטווח של 60 רגל שהבהמה רואה. כישלון: היעד מבוהל עד סוף תורך הבא. צעד פייה (יצור פייה בלבד; מתחדש לאחר מנוחה ארוכה). הבהמה מתעתקת, יחד עם רוכבה, למשבצת פנויה לבחירתך עד 60 רגל ממנה. מגע מרפא (יצור מרום בלבד; מתחדש לאחר מנוחה ארוכה). יצור אחד בטווח של 5 רגל מהבהמה מחזיר לעצמו נקודות חיים בכמות השווה ל-2d8 ועוד דרגת הלחש."
