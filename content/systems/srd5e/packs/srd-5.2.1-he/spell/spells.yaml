    אתה מפציר בישות מעולם אחר לעזור לך. הישות חייבת להיות מוכרת לך: אל, נסיך שדים או יצור אחר בעל כוח קוסמי. הישות שולחת אליך יצור מרום, יסודן או בן-תופת הנאמן לה כדי לעזור לך, והיצור מופיע במרחב פנוי בטווח. אם אתה מכיר את שמו של יצור מסוים, אתה יכול לומר את השם בעת הטלת הלחש כדי לבקש את אותו יצור, אך ייתכן שתקבל בכל זאת יצור אחר (לפי בחירת שליט המבוך).
    כשהיצור מופיע, שום כורח אינו מחייב אותו להתנהג בדרך מסוימת. אתה יכול לבקש ממנו לבצע שירות תמורת תשלום, אך אין הוא חייב להסכים. המשימה המבוקשת יכולה לנוע מפשוטה (לטוס איתנו מעבר לתהום, או לעזור לנו בקרב) למורכבת (לרגל אחרי אויבינו, או להגן עלינו במהלך הפשיטה על המבוך). עליך להיות מסוגל לתקשר עם היצור כדי לשאת ולתת על שירותיו.
    התשלום יכול לקחת צורות רבות. יצור מרום עשוי לדרוש תרומה נכבדה של זהב או פריטי קסם למקדש בעל ברית, ואילו בן-תופת עשוי לדרוש קורבן חי או מתנה של אוצר. יצורים מסוימים עשויים להחליף את שירותם במשימה שתבצע עבורם.
    משימה שאפשר למדוד בדקות דורשת תשלום בשווי 100 מטבעות זהב לדקה. משימה שנמדדת בשעות דורשת 1,000 מטבעות זהב לשעה. ומשימה שנמדדת בימים (עד 10 ימים) דורשת 10,000 מטבעות זהב ליום. שליט המבוך יכול להתאים את התשלומים לפי הנסיבות שבהן הטלת את הלחש. אם המשימה מתיישבת עם אתוס היצור, התשלום עשוי לרדת למחציתו ואף להתבטל. משימות לא מסוכנות דורשות בדרך כלל רק מחצית מהתשלום המוצע, ואילו משימות מסוכנות במיוחד עשויות לדרוש מתנה גדולה יותר. יצורים נדירים מאוד מקבלים על עצמם משימות שנראות כמו התאבדות.
