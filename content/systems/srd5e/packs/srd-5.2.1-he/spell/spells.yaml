    מדרגות. קורי עכביש ממלאים את כל המדרגות בשטח המוגן מלמעלה למטה, כמו בלחש רשת. החוטים האלה צומחים מחדש תוך 10 דקות אם הם נהרסים בזמן ששומרים והגנות בתוקף.
