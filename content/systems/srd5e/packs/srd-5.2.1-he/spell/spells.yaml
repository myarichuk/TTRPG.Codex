- id: antipathy-sympathy
  name: אנטיפתיה / סימפתיה
  description: |-
    *דרגה 8, הקסמה (פייטן, דרואיד, אשף)*

    **זמן הטלה:** 1 שעה  
    **טווח:** 60 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (תערובת של חומץ ודבש)  
    **משך:** 10 ימים

    בזמן שאתה מטיל את הלחש, בחר אם הוא יוצר אנטיפתיה או סימפתיה, וכוון ליצור או חפץ אחד בגודל עצום או קטן יותר. לאחר מכן ציין סוג של יצורים, כמו דרקונים אדומים, גובלינים או ערפדים. יצור מהסוג שציינת חייב לבצע זריקת הצלה בחוכמה כשהוא מתקרב למרחק של 120 רגל מהיעד. הבחירה שלך באנטיפתיה או בסימפתיה קובעת מה קורה ליצור כשהוא נכשל בהצלה:
    אנטיפתיה. היצור מקבל את המצב מבוהל. היצור המבוהל חייב להשתמש בתנועתו בתורותיו כדי להתרחק מהיעד ככל האפשר, בדרך הבטוחה ביותר.
    סימפתיה. היצור מקבל את המצב מוקסם. היצור המוקסם חייב להשתמש בתנועתו בתורותיו כדי להתקרב ליעד ככל האפשר, בדרך הבטוחה ביותר. אם היצור נמצא במרחק של עד 5 רגל מהיעד, הוא לא יכול לזוז ממנו מרצונו. אם היעד גורם נזק ליצור המוקסם, היצור יכול לבצע זריקת הצלה בחוכמה כדי לסיים את האפקט, כמתואר להלן.
    סיום האפקט. אם היצור המבוהל או המוקסם מסיים את תורו במרחק של יותר מ-120 רגל מהיעד, היצור מבצע זריקת הצלה בחוכמה. בהצלה מוצלחת, היצור כבר אינו מושפע מהיעד. יצור שהצליח בהצלה נגד האפקט הזה חסין לו למשך 1 דקה, ואחריה הוא יכול להיות מושפע שוב.
