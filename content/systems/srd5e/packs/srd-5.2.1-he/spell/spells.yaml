- id: acid-arrow
  name: חץ חומצה
  description: |-
    *דרגה 2, תעצומה (אשף)*

    **זמן הטלה:** פעולה  
    **טווח:** 90 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (אבקת עלה ריוונד)  
    **משך:** מיידי

    חץ ירוק נוצץ טס אל יעד בטווח ומתפוצץ בהתזה של חומצה. בצע התקפת לחש מרחוק נגד היעד. בפגיעה, היעד סופג 4d4 נזק חומצה, ובסוף תורו הבא הוא סופג 2d4 נזק חומצה. בהחטאה, החץ מתיז על היעד חומצה וגורם רק למחצית מהנזק הראשוני.

    **שימוש בתא לחשים בדרגה גבוהה יותר.** הנזק (גם הראשוני וגם המאוחר) גדל ב-1d4 על כל דרגת תא לחשים מעל 2.
  properties:
    castingTime: פעולה
    range: 90 רגל
    material: אבקת עלה ריוונד
    duration: מיידי
    higherLevel: הנזק (גם הראשוני וגם המאוחר) גדל ב-1d4 על כל דרגת תא לחשים מעל 2.
- id: acid-splash
  name: התזת חומצה
  description: |-
    *לחשון תעצומה (כושף, אשף)*

    **זמן הטלה:** פעולה  
    **טווח:** 60 רגל  
    **רכיבים:** מילולי, תנועתי  
    **משך:** מיידי

    אתה יוצר בועה חומצית בנקודה בטווח, והיא מתפוצצת בכדור ברדיוס של 5 רגל. כל יצור בתוך הכדור חייב להצליח בזריקת הצלה בזריזות, אחרת הוא סופג 1d6 נזק חומצה.
    שדרוג לחשון. הנזק גדל ב-1d6 כשאתה מגיע לדרגה 5 (2d6), לדרגה 11 (3d6) ולדרגה 17 (4d6).
  properties:
    castingTime: פעולה
    range: 60 רגל
    duration: מיידי
- id: aid
  name: סיוע
  description: |-
