    אתה מנסה לעצב מחדש את זיכרונותיו של יצור אחר. יצור אחד שאתה רואה בטווח מבצע זריקת הצלה בחוכמה. אם אתה נלחם ביצור, יש לו יתרון בזריקה. בזריקה כושלת היעד מוקסם למשך הלחש. כל עוד הוא מוקסם כך, היעד גם חסר יכולת פעולה ואינו מודע לסביבתו, אף שהוא יכול לשמוע אותך. אם הוא סופג נזק כלשהו או שלחש אחר מכוון אליו, הלחש הזה מסתיים ושום זיכרון אינו משתנה.
