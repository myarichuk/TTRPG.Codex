    בחר שטח קרקע שאורך כל אחת מצלעותיו אינו עולה על 40 רגל, בטווח. למשך הלחש אתה יכול לעצב את העפר, החול או החימר שבשטח בכל דרך שתרצה. אתה יכול להגביה או להנמיך את פני השטח, ליצור תעלה או למלא אותה, להקים קיר או לשטח אותו, או ליצור עמוד. היקף השינויים אינו יכול לעלות על מחצית מהמימד הגדול ביותר של השטח. לדוגמה, אם אתה משפיע על ריבוע של 40 רגל, אתה יכול ליצור עמוד בגובה עד 20 רגל, להגביה או להנמיך את הריבוע עד 20 רגל, לחפור תעלה בעומק עד 20 רגל, וכן הלאה. השלמת השינויים אורכת 10 דקות. מכיוון שהשינוי בקרקע מתרחש לאט, יצורים בשטח לא יכולים בדרך כלל להילכד או להיפצע מתנועת האדמה.
    בסוף כל 10 דקות שאתה מקדיש לריכוז בלחש, אתה יכול לבחור שטח קרקע חדש שישפיע עליו, בטווח.
    הלחש אינו יכול לשנות אבן טבעית או מבנה אבן. סלעים ומבנים זזים כדי להתאים לקרקע החדשה. אם הדרך שבה אתה מעצב את הקרקע הייתה הופכת מבנה לבלתי יציב, הוא עלול להתמוטט.
    כמו כן, הלחש אינו משפיע ישירות על צמיחת צמחים. האדמה שזזה נושאת עמה את כל הצמחים.
