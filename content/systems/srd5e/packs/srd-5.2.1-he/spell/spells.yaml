    עליך לדבר אל היעד כדי לתאר כיצד זיכרונותיו מושפעים, והוא חייב להיות מסוגל להבין את שפתך כדי שהזיכרונות ששונו ינעצו שורש. תודעתו ממלאת פערים בפרטי התיאור שלך. אם הלחש מסתיים לפני שסיימת לתאר את הזיכרונות ששונו, זיכרון היצור אינו משתנה. אחרת, הזיכרונות ששונו נקלטים כשהלחש מסתיים.
    זיכרון ששונה אינו משפיע בהכרח על התנהגות היצור, בייחוד אם הזיכרון סותר את נטיותיו הטבעיות, את נטייתו או את אמונותיו. זיכרון ששונה באופן לא הגיוני, כמו זיכרון כוזב של כמה נהנה היצור לשחות בחומצה, נדחה כחלום רע. שליט המבוך רשאי לקבוע שזיכרון ששונה מופרך מדי מכדי להשפיע על יצור.
