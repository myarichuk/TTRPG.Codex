- id: alarm
  name: אזעקה
  description: |-
    *דרגה 1, מגננה (סייר, אשף)*

    **זמן הטלה:** 1 דקה או טקס  
    **טווח:** 30 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (פעמון וחוט כסף)  
    **משך:** 8 שעות

    אתה מציב אזעקה נגד חדירה. בחר דלת, חלון או אזור בטווח שאינו גדול מקובייה של 20 רגל. עד שהלחש מסתיים, האזעקה מתריעה בכל פעם שיצור נוגע באזור המוגן או נכנס אליו. כשאתה מטיל את הלחש, אתה יכול לייעד יצורים שלא יפעילו את האזעקה. אתה גם בוחר אם האזעקה תהיה קולית או מנטלית: אזעקה קולית. האזעקה משמיעה צליל של פעמון יד במשך 10 שניות, עד מרחק של 60 רגל מהאזור המוגן. אזעקה מנטלית. אתה מקבל התרעה מנטלית אם אתה נמצא במרחק של עד 1 מייל מהאזור המוגן. ההתרעה הזו מעירה אותך אם אתה ישן.
  properties:
    castingTime: 1 דקה
    range: 30 רגל
    material: פעמון וחוט כסף
    duration: 8 שעות
- id: alter-self
  name: שינוי גוף
  description: |-
    *דרגה 2, תהפוכה (כושף, אשף)*

    **זמן הטלה:** פעולה  
    **טווח:** עצמי  
    **רכיבים:** מילולי, תנועתי  
    **משך:** ריכוז, עד 1 שעה

    אתה משנה את צורתך הפיזית. בחר אחת מהאפשרויות הבאות. השפעותיה נמשכות למשך הלחש, ובמהלכו אתה יכול לבצע פעולת קסם כדי להחליף את האפשרות שבחרת באחרת.
    התאמה למים. צומחים לך זימים, ובין אצבעותיך נוצרים קרומי שחייה. אתה יכול לנשום מתחת למים ומקבל מהירות שחייה השווה למהירותך.
    שינוי מראה. אתה משנה את מראך. אתה מחליט איך תיראה, כולל גובהך, משקלך, תווי פניך, קולך, אורך שיערך, צבעי גופך וסימנים מזהים אחרים. אתה יכול להיראות כבן גזע אחר, אף שנתוני המשחק שלך אינם משתנים. אינך יכול להיראות כיצור בגודל אחר, וצורת הגוף הבסיסית שלך נשארת כמות שהיא; אם אתה דו-רגלי, למשל, אינך יכול להשתמש בלחש הזה כדי להפוך לארבע-רגלי. במשך הלחש אתה יכול לבצע פעולת קסם כדי לשנות שוב את מראך באופן הזה.
    נשק טבעי. צומחים לך טפרים (חותך), ניבים (דוקר), קרניים (דוקר) או פרסות (מוחץ). כשאתה משתמש בהתקפה ללא נשק כדי לגרום נזק באמצעות הצמיחה החדשה הזו, היא גורמת נזק של 1d6 מהסוג שבסוגריים, במקום הנזק הרגיל של ההתקפה ללא נשק, ואתה משתמש במתאם תכונת הטלת הלחשים לגלגולי ההתקפה והנזק, ולא בכוח.
  properties:
    castingTime: פעולה
    range: עצמי
    duration: עד 1 שעה
- id: animal-friendship
  name: ידידות עם חיות
  description: |-
    *דרגה 1, הקסמה (פייטן, דרואיד, סייר)*

    **זמן הטלה:** פעולה  
    **טווח:** 30 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (פיסת מזון)  
    **משך:** 24 שעות

    בחר כיעד חיה שאתה רואה בטווח. היעד חייב להצליח בזריקת הצלה בחוכמה, אחרת הוא מקבל את המצב מוקסם למשך הלחש. אם אתה או אחד מבני בריתך גורמים נזק ליעד, הלחש מסתיים.

    **שימוש בתא לחשים בדרגה גבוהה יותר.** אתה יכול לבחור כיעד חיה נוספת על כל דרגת תא לחשים מעל 1.
