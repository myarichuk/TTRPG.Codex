- id: glyph-of-warding
  name: סמל מגן
  description: |-
    *דרגה 3, מגננה (פייטן, כוהן, אשף)*

    **זמן הטלה:** 1 שעה  
    **טווח:** מגע  
    **רכיבים:** מילולי, תנועתי, חומרי (אבקת יהלום בשווי 200+ מטבעות זהב, שהלחש צורך)  
    **משך:** עד שיבוטל או יופעל

    אתה חורט סמל שמאוחר יותר משחרר אפקט קסום. אתה חורט אותו על משטח (כמו שולחן או קטע רצפה) או בתוך חפץ שאפשר לסגור (כמו ספר או תיבה) כדי להסתיר את הסמל. הסמל יכול לכסות שטח שקוטרו אינו עולה על 10 רגל. אם המשטח או החפץ מוזזים יותר מ-10 רגל ממקום הטלת הלחש, הסמל נשבר והלחש מסתיים בלי שהופעל.
    הסמל כמעט בלתי מורגש, וכדי לזהות אותו נדרשת בדיקת חוכמה (הבחנה) מוצלחת נגד דרגת הקושי להצלה נגד לחשים שלך.
    כשאתה חורט את הסמל, אתה קובע את הגורם המפעיל שלו ובוחר אם הוא רונה מתפוצצת או סמל לחש, כמוסבר להלן.
    קביעת הגורם המפעיל. אתה מחליט מה מפעיל את הסמל בעת הטלת הלחש. בסמלים שנחרטו על משטח, גורמים מפעילים נפוצים כוללים נגיעה בסמל או דריכה עליו, הסרת חפץ אחר שמכסה אותו, או התקרבות אליו עד מרחק מסוים. בסמלים שנחרטו בתוך חפץ, גורמים מפעילים נפוצים כוללים פתיחת החפץ או ראיית הסמל. מרגע שהסמל הופעל, הלחש הזה מסתיים.
    אתה יכול לדייק את הגורם המפעיל כך שרק יצורים מסוגים מסוימים יפעילו אותו (לדוגמה, אפשר לקבוע שהסמל יפעל על שיקוצים). אתה יכול גם לקבוע תנאים ליצורים שאינם מפעילים את הסמל, כמו אלה שאומרים סיסמה מסוימת.
    רונה מתפוצצת. כשהסמל מופעל, הוא מתפרץ באנרגיה קסומה בכדור ברדיוס של 20 רגל שמרכזו בסמל. כל יצור באזור מבצע זריקת הצלה בזריזות. יצור סופג 5d8 נזק חומצה, קור, אש, ברק או רעם (לבחירתך בעת יצירת הסמל) בזריקה כושלת, או מחצית מהנזק בזריקה מוצלחת.
    סמל לחש. אתה יכול לאחסן בסמל לחש מוכן מדרגה 3 ומטה, על ידי הטלתו כחלק מיצירת הסמל. הלחש חייב לכוון ליצור יחיד או לאזור. לחש שמאוחסן כך אינו משפיע מיד כשהוא מוטל.
    כשהסמל מופעל, הלחש המאוחסן נכנס לתוקף. אם יש ללחש יעד, הוא מכוון ליצור שהפעיל את הסמל. אם הלחש משפיע על אזור, האזור ממורכז ביצור הזה. אם הלחש מזמן יצורים עוינים או יוצר חפצים או מלכודות מזיקים, הם מופיעים קרוב ככל האפשר לפולש ותוקפים אותו. אם הלחש דורש ריכוז, הוא נמשך עד תום משכו המלא.

    **שימוש בתא לחשים בדרגה גבוהה יותר.** הנזק של רונה מתפוצצת גדל ב-1d8 על כל דרגת תא לחשים מעל 3. אם אתה יוצר סמל לחש, אתה יכול לאחסן בו כל לחש עד דרגת תא הלחשים שבו השתמשת עבור סמל מגן.
