    הילה אנטי-קסומה של 10 רגל מקיפה אותך. אף אחד לא יכול להטיל לחשים, לבצע פעולות קסם או ליצור אפקטים קסומים אחרים בתוך ההילה, ודברים אלה לא יכולים לכוון או להשפיע על שום דבר הנמצא בתוכה. התכונות הקסומות של פריטים קסומים לא עובדות בתוך ההילה או על מה שנמצא בתוכה.
    אזורי השפעה שנוצרו על ידי לחשים או קסם אחר לא יכולים להתפשט לתוך ההילה, ואף אחד לא יכול להיכנס אליה או לצאת ממנה בטלפורטציה, או להשתמש שם בנסיעה בין מישורים. פורטלים נסגרים זמנית כל עוד הם בתוך ההילה.
    לחשים מתמשכים, פרט לאלה שהוטלו על ידי חפץ עוצמה או על ידי אל, מושבתים באזור. בזמן שאפקט מושבת, הוא לא פועל, אבל הזמן שהוא מבלה מושבת נספר במניין משכו.
    לביטול קסם אין השפעה על ההילה, וההילות שנוצרות על ידי לחשי שדה אנטי-קסם שונים אינן מבטלות זו את זו.
