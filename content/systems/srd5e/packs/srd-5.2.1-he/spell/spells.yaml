    היעד מקבל מספר נקודות חיים זמניות השווה לנקודות החיים של הצורה החדשה. נקודות החיים הזמניות האלה נעלמות אם נותרו כאלה כשהלחש מסתיים.
    הפעולות שהיעד יכול לבצע מוגבלות בידי האנטומיה של צורתו החדשה, והוא אינו יכול לדבר או להטיל לחשים.
    ציוד היעד נטמע בצורה החדשה. היצור אינו יכול להשתמש בציוד הזה או ליהנות ממנו בדרך אחרת.
