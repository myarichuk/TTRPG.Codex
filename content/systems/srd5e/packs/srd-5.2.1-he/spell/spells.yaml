    **טווח:** מגע
    **רכיבים:** מילולי, תנועתי, חומרי (אבקת יהלום בשווי 1,000+ מטבעות זהב, שהלחש צורך)
    **משך:** עד ביטול או הפעלה

    אתה חורט סמל מזיק על משטח (כגון קטע של רצפה או קיר) או בתוך חפץ שאפשר לסגור (כגון ספר או תיבה). הסמל יכול לכסות שטח שקוטרו אינו עולה על 10 רגל. אם בחרת בחפץ, עליו להישאר במקומו; אם מזיזים אותו יותר מ-10 רגל מהמקום שבו הטלת את הלחש, הסמל נשבר והלחש מסתיים בלי שהופעל.
    הסמל כמעט בלתי מורגש, וכדי להבחין בו נדרשת בדיקת חוכמה (הבחנה) מוצלחת נגד דרגת הקושי להצלה נגד לחשים שלך.
    כשאתה חורט את הסמל, אתה קובע את הגורם המפעיל שלו ובוחר איזה אפקט הוא נושא: מוות, מחלוקת, פחד, כאב, שינה או הלם. כל אחד מהם מוסבר להלן.
    קביעת הגורם המפעיל. אתה מחליט מה מפעיל את הסמל כשאתה מטיל את הלחש. בסמלים החרוטים על משטח, גורמים נפוצים הם נגיעה בסמל או דריכה עליו, הסרת חפץ אחר המכסה אותו, או התקרבות אליו עד מרחק מסוים. בסמלים החרוטים בתוך חפץ, גורמים נפוצים הם פתיחת החפץ או הבטה בסמל.
    אתה יכול לדייק את הגורם המפעיל כך שרק יצורים מסוגים מסוימים יפעילו אותו (למשל, אפשר לקבוע שהסמל ישפיע על שיקוצים). אתה יכול גם לקבוע תנאים ליצורים שלא יפעילו את הסמל, כגון אלה שאומרים סיסמה מסוימת.
    משהופעל, הסמל זוהר ומציף כדור ברדיוס של 60 רגל באור עמום למשך 10 דקות, ובסופן הלחש מסתיים. כל יצור בכדור ברגע שהסמל מופעל הופך ליעד של האפקט שלו, וכך גם יצור שנכנס לכדור לראשונה בתור כלשהו או מסיים בו את תורו. יצור הופך ליעד פעם אחת בלבד בכל תור.
    מוות. כל יעד מבצע זריקת הצלה בחוסן וסופג 10d10 נזק נקרוטי בזריקה כושלת, או מחצית מהנזק בזריקה מוצלחת.
    מחלוקת. כל יעד מבצע זריקת הצלה בחוכמה. בזריקה כושלת היעד מתקוטט עם יצורים אחרים למשך 1 דקה. בזמן הזה הוא אינו מסוגל לתקשורת בעלת משמעות, ויש לו חיסרון בגלגולי התקפה ובבדיקות תכונה.
    פחד. כל יעד חייב להצליח בזריקת הצלה בחוכמה, או שיהיה מבוהל למשך 1 דקה. כל עוד הוא מבוהל, היעד חייב בכל אחד מתוריו להתרחק מהסמל לפחות 30 רגל, אם הוא יכול.
    כאב. כל יעד חייב להצליח בזריקת הצלה בחוסן, או שיהיה חסר יכולת פעולה למשך 1 דקה.
    שינה. כל יעד חייב להצליח בזריקת הצלה בחוכמה, או שיהיה חסר הכרה למשך 10 דקות. יצור מתעורר אם הוא סופג נזק או אם מישהו נוקט פעולה כדי לנער אותו.
    הלם. כל יעד חייב להצליח בזריקת הצלה בחוכמה, או שיהיה המום למשך 1 דקה.
