    material: לכל אחד מיעדי הלחש, יקינתון בשווי 1,000+ מ״ז ומטיל כסף בשווי 100+ מ״ז, שהלחש צורך את כולם
    duration: עד ביטול
- id: augury
  name: נבואת סימנים
  description: |-
