    מסדרונות. ערפל ממלא את כל המסדרונות המוגנים והופך אותם לאפלים מאוד. בנוסף, בכל צומת או מעבר מתפצל שמציע בחירת כיוון, יש סיכוי של 50 אחוז שיצור שאינו אתה יאמין שהוא הולך בכיוון ההפוך לזה שבחר.
