    הפרדת מים. אתה מפריד את המים באזור ויוצר תעלה. התעלה משתרעת לאורך אזור הלחש, והמים שהופרדו יוצרים חומה משני צדיה. התעלה נשארת עד שהלחש מסתיים או עד שתבחר אפקט אחר. לאחר מכן המים ממלאים לאט את התעלה במהלך הסבב הבא, עד שמפלס המים הרגיל חוזר. התנאים להיכנס לתוקף. לאחר שיעשו זאת, תוכל לשנות את התנאים שוב. כשהלחש מסתיים, מזג האוויר חוזר בהדרגה לקדמותו.
    כשאתה משנה את תנאי מזג האוויר, מצא תנאי נוכחי בטבלאות שלהלן ושנה את שלבו באחד, כלפי מעלה או מטה. כשאתה משנה את הרוח, אתה יכול לשנות גם את כיוונה. שלב משקעים | תנאי
    1 | בהיר | 2 | עננים קלים
    3 | מעונן או ערפל קרקע | 4 | גשם, ברד או שלג
    5 | גשם שוטף, ברד עז או סופת שלגים
    הסטת זרימה. אתה גורם למים הזורמים באזור לנוע בכיוון שתבחר, גם אם המים צריכים לזרום מעל מכשולים, במעלה קירות, או בכיוונים לא סבירים אחרים. המים באזור נעים כפי שתכוון אותם, אבל ברגע שהם חוצים את גבולות אזור הלחש הם ממשיכים לזרום לפי פני השטח. המים ממשיכים לנוע בכיוון שבחרת עד שהלחש מסתיים או עד שתבחר אפקט אחר.
    מערבולת. אתה גורם למערבולת להיווצר במרכז האזור, שחייב להיות רחב לפחות 50 רגל. שלב טמפרטורה | תנאי
    1 | גל חום | 2 | חם
    3 | חמים | 4 | קריר
    5 | קר | 6 | קפוא נטרול לחש שלב רוח | תנאי
    10 | שקט | 2 | רוח מתונה
    3 | רוח חזקה | 4 | רוח סוערת
    5 | סערה    מרובע ובעומק 25 רגל. המערבולת נמשכת עד שתבחר אפקט אחר או עד שהלחש מסתיים. המערבולת רחבה 5 רגל בבסיסה, עד 50 רגל בראשה, וגבוהה 25 רגל. כל יצור שנמצא במים ובטווח של 25 רגל מהמערבולת נמשך 10 רגל לעברה. כשיצור נכנס למערבולת בפעם הראשונה בתור, או מסיים בה את תורו, הוא מבצע זריקת הצלה בכוח. בכישלון, היצור סופג 2d8 נזק מוחץ. בהצלחה, היצור סופג מחצית מהנזק. יצור יכול לשחות הרחק מהמערבולת רק אם הוא קודם נוקט פעולה כדי להיחלץ ומצליח בבדיקת כוח (אתלטיקה) נגד דרגת הקושי להצלה נגד לחשים שלך.
  properties:
