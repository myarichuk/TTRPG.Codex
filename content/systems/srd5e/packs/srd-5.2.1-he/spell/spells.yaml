    higherLevel: אתה יכול לבחור כיעד חיה נוספת על כל דרגת תא לחשים מעל 1.
- id: animal-messenger
  name: חיה שליחה
  description: |-
    *דרגה 2, הקסמה (פייטן, דרואיד, סייר)*

    **זמן הטלה:** פעולה או טקס  
    **טווח:** 30 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (פיסת מזון)  
    **משך:** 24 שעות

    חיה קטנטנה שתבחר ושאתה רואה בטווח חייבת להצליח בזריקת הצלה בכריזמה, אחרת היא מנסה למסור הודעה בשבילך (אם דרגת האתגר של היעד אינה 0, הוא מצליח בהצלה אוטומטית). אתה מציין מיקום שביקרת בו ונמען שמתאים לתיאור כללי, כמו ״אדם לבוש במדי שומרי העיר״ או ״גמד אדום שיער חובש כובע מחודד״. אתה גם מוסר הודעה של עד עשרים וחמש מילים. החיה נעה במשך הלחש לעבר המיקום שציינת, ועוברת כ-25 מייל בכל 24 שעות, או 50 מייל אם היא יכולה לעוף.
    כשהחיה מגיעה, היא מוסרת את הודעתך ליצור שתיארת, ומחקה את אופן התקשורת שלך. אם החיה אינה מגיעה ליעדה לפני שהלחש מסתיים, ההודעה אובדת והחיה חוזרת למקום שבו הטלת את הלחש.

    **שימוש בתא לחשים בדרגה גבוהה יותר.** משך הלחש גדל ב-48 שעות על כל דרגת תא לחשים מעל 2.
  properties:
    castingTime: פעולה
    range: 30 רגל
    material: פיסת מזון
    duration: 24 שעות
    higherLevel: משך הלחש גדל ב-48 שעות על כל דרגת תא לחשים מעל 2.
- id: animal-shapes
  name: צורות חיה
  description: |-
    *דרגה 8, תהפוכה (דרואיד)*

    **זמן הטלה:** פעולה  
    **טווח:** 30 רגל  
    **רכיבים:** מילולי, תנועתי  
    **משך:** 24 שעות

    בחר כל מספר של יצורים מוכנים שאתה רואה בטווח. כל יעד משנה צורה לחיה לבחירתך בגודל גדול או קטן יותר, שדרגת האתגר שלה היא 4 או פחות. אתה יכול לבחור צורה שונה לכל יעד. בתורות מאוחרות יותר אתה יכול לבצע פעולת קסם כדי להפוך את היעדים שוב.
    נתוני המשחק של היעד מוחלפים בנתוני החיה שנבחרה, אבל היעד שומר על סוג היצור שלו, על נקודות החיים שלו, על קוביות נקודות החיים שלו, על נטייתו, על יכולתו לתקשר ועל ציוני התבונה, החוכמה והכריזמה שלו. פעולותיו של היעד מוגבלות על ידי האנטומיה של צורת החיה, והוא לא יכול להטיל לחשים. הציוד של היעד מתמזג לתוך הצורה החדשה, והוא לא יכול להשתמש באף אחד מפריטי הציוד האלה בזמן שהוא בצורה הזו.
    היעד מקבל נקודות חיים זמניות השוות לנקודות החיים של הצורה הראשונה שאליה הוא הופך. נקודות החיים הזמניות האלה נעלמות אם נותרו כלשהן כשהלחש מסתיים. ההמרה נמשכת למשך הלחש, או עד שהיעד מסיים אותה בפעולה נוספת.
  properties:
    castingTime: פעולה
    range: 30 רגל
    duration: 24 שעות
- id: animate-dead
  name: החייאת מתים
  description: |-
    *דרגה 3, תאובה (כוהן, אשף)*

    **זמן הטלה:** 1 דקה  
    **טווח:** 10 רגל  
    **רכיבים:** מילולי, תנועתי, חומרי (טיפת דם, פיסת בשר ומעט אבק עצמות)  
    **משך:** מיידי

    בחר ערימת עצמות או גופה של דמוי אדם בגודל בינוני או קטן בטווח. היעד הופך ליצור אל-מת: שלד אם בחרת בעצמות, או זומבי אם בחרת בגופה (ראה ״מפלצות״ לנתוני היצורים).
    בכל תור שלך אתה יכול לבצע פעולה נוספת כדי לפקד מנטלית על כל יצור שיצרת בלחש הזה, אם הוא נמצא במרחק של עד 60 רגל ממך (אם אתה שולט בכמה יצורים, אתה יכול לפקד על כולם בו זמנית, ולתת לכל אחד את אותה פקודה). אתה מחליט איזו פעולה היצור יבצע ולאן ינוע בתורו הבא, או שאתה יכול לתת פקודה כללית, כמו לשמור על חדר או מסדרון. אם אינך נותן פקודות, היצור מבצע פעולת חמיקה ונע רק כדי להימנע מנזק. לאחר שניתנה פקודה, היצור ממשיך לבצע אותה עד שהמשימה שלו מסתיימת.
    היצור נשלט על ידך למשך 24 שעות, ולאחר מכן הוא מפסיק לציית לכל פקודה שנתת לו. כדי לשמור על השליטה בו למשך 24 שעות נוספות, עליך להטיל שוב את הלחש הזה על היצור לפני שתקופת 24 השעות הנוכחית מסתיימת. שימוש זה בלחש מחזק מחדש את שליטתך על עד ארבעה יצורים שהחייאת בלחש הזה, במקום להחיות יצור חדש.

    **שימוש בתא לחשים בדרגה גבוהה יותר.** אתה מחיה, או מחדש את שליטתך, בשני יצורי אל-מת נוספים על כל דרגת תא לחשים מעל 3. כל אחד מהיצורים חייב להגיע מגופה או מערימת עצמות שונה.
  properties:
    castingTime: 1 דקה
    range: 10 רגל
    material: טיפת דם, פיסת בשר ומעט אבק עצמות
    duration: מיידי
    higherLevel: אתה מחיה, או מחדש את שליטתך, בשני יצורי אל-מת נוספים על כל דרגת תא לחשים מעל 3. כל אחד מהיצורים חייב להגיע מגופה או מערימת עצמות שונה.
- id: animate-objects
  name: החייאת חפצים
  description: |-
    *דרגה 5, תהפוכה (פייטן, כושף, אשף)*

    **זמן הטלה:** פעולה  
    **טווח:** 120 רגל  
    **רכיבים:** מילולי, תנועתי  
    **משך:** ריכוז, עד 1 דקה

    חפצים מתעוררים לחיים לפי פקודתך. בחר בטווח מספר חפצים לא קסומים שאינם לבושים או נישאים, אינם מחוברים למשטח ואינם אדירים. המספר המרבי של חפצים שווה למתאם תכונת הטלת הלחשים שלך. לצורך המניין, יעד בגודל בינוני או קטן נחשב כחפץ אחד, יעד גדול נחשב לשניים, ויעד עצום נחשב לשלושה.
    כל יעד מקבל חיים, מצמיח רגליים והופך ליציר כפיים שמשתמש בנתוני החפץ המונפש. היצור נשאר בשליטתך עד שהלחש מסתיים, או עד שהוא מגיע ל-0 נקודות חיים. כל יצור שאתה יוצר בלחש הזה הוא בעל ברית שלך ושל בני בריתך. בקרב הוא חולק את ספירת היוזמה שלך ופועל מיד אחרי התור שלך.
    עד שהלחש מסתיים, אתה יכול לבצע פעולה נוספת כדי לפקד מנטלית על כל יצור שיצרת בלחש הזה, אם היצור נמצא במרחק של עד 500 רגל ממך (אם אתה שולט בכמה יצורים, אתה יכול לפקד על כולם בו זמנית, ולתת לכל אחד את אותה פקודה). אם אינך נותן פקודות, היצור מבצע פעולת חמיקה ונע רק כדי להימנע מנזק. כשהיצור יורד ל-0 נקודות חיים, הוא חוזר לצורת החפץ שלו, והנזק שנותר עובר לצורה הזו.

