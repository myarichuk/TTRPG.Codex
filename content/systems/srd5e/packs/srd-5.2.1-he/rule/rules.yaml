- id: school-of-magic-conjuration
  name: "יצירה"
  description: |-
    מעבירה יצורים או חפצים ממקום למקום
- id: school-of-magic-divination
  name: "חיזוי"
  description: |-
    חושפת מידע
- id: school-of-magic-enchantment
  name: "הקסמה"
  description: |-
    משפיעה על מוחות
- id: school-of-magic-evocation
  name: "תעצומה"
  description: |-
    מתעלת אנרגיה ליצירת אפקטים שהם לעיתים קרובות הרסניים
- id: school-of-magic-illusion
  name: "אשליה"
  description: |-
    מטעה את הנפש או את החושים
- id: school-of-magic-necromancy
  name: "תאובה"
  description: |-
    מניפולציה של חיים ומוות
- id: school-of-magic-transmutation
  name: "תהפוכה"
  description: |-
    משנה צורה של יצורים או חפצים
- id: skill-acrobatics
  name: "אקרובטיקה"
  description: |-
    **תכונה:** זרז

    להישאר על הרגליים במצב מסובך, או לבצע תרגיל אקרובטי.
- id: skill-animal-handling
  name: "טיפול בחיות"
  description: |-
    **תכונה:** חכמ

    להרגיע או לאלף חיה, או לגרום לחיה להתנהג בדרך מסוימת.
- id: skill-arcana
  name: "מאגיה"
  description: |-
    **תכונה:** תבנ

    להיזכר בידע על לחשים, פריטים קסומים ומישורי הקיום.
- id: skill-athletics
  name: "אתלטיקה"
  description: |-
    **תכונה:** כוח

    לקפוץ רחוק מהרגיל, להישאר צף במים סוערים, או לשבור משהו.
- id: skill-deception
  name: "הונאה"
  description: |-
    **תכונה:** כרז

    לשקר בצורה משכנעת, או להסתיר את זהותך בהסוואה משכנעת.
- id: skill-history
  name: "היסטוריה"
  description: |-
    **תכונה:** תבנ

    להיזכר בידע על אירועים היסטוריים, אישים, אומות ותרבויות.
- id: skill-insight
  name: "תובנה"
  description: |-
    **תכונה:** חכמ

    להבין את מצב רוחו וכוונותיו של אדם.
- id: skill-intimidation
  name: "הפחדה"
  description: |-
    **תכונה:** כרז

    להטיל אימה או לאיים על מישהו כדי שיעשה את מה שאתה רוצה.
- id: skill-investigation
  name: "חקירה"
  description: |-
    **תכונה:** תבנ

    למצוא מידע נסתר בספרים, או להסיק איך משהו עובד.
- id: skill-medicine
  name: "רפואה"
  description: |-
    **תכונה:** חכמ

    לאבחן מחלה, או לקבוע מה הרג מי שנהרג לא מכבר.
- id: skill-nature
  name: "טבע"
  description: |-
    **תכונה:** תבנ

    להיזכר בידע על שטחים, צמחים, בעלי חיים ומזג אוויר.
- id: skill-perception
  name: "הבחנה"
  description: |-
    **תכונה:** חכמ

    בעזרת שילוב של חושים, לשים לב למשהו שקל להחמיץ.
- id: skill-performance
  name: "הופעה"
  description: |-
    **תכונה:** כרז

    לשחק, לספר סיפור, לנגן או לרקוד.
- id: skill-persuasion
  name: "שכנוע"
  description: |-
    **תכונה:** כרז

    לשכנע מישהו בדבר מה בכנות ובנעימות.
- id: skill-religion
  name: "דת"
  description: |-
    **תכונה:** תבנ

    להיזכר בידע על אלים, טקסים דתיים וסמלים קדושים.
- id: skill-sleight-of-hand
  name: "זריזות ידיים"
  description: |-
    **תכונה:** זרז

    לכייס, להסתיר חפץ שאתה מחזיק ביד, או לבצע להטוטי ידיים.
- id: skill-stealth
  name: "התגנבות"
  description: |-
    **תכונה:** זרז

    להימנע מגילוי באמצעות תנועה שקטה והסתתרות מאחורי עצמים.
- id: skill-survival
  name: "השרדות"
  description: |-
    **תכונה:** חכמ

    לעקוב אחר עקבות, לחפש מזון, למצוא שביל, או להימנע מסכנות טבעיות.
- id: weapon-mastery-cleave
  name: "ביקוע"
  description: |-
    אם פגעת ביצור בגלגול התקפה בקרב פנים אל פנים בעזרת נשק זה, אתה יכול לבצע גלגול התקפה בקרב פנים אל פנים בעזרת הנשק נגד יצור שני הנמצא במרחק של עד 5 רגל מהראשון ושנמצא גם הוא בהישג ידך. אם פגעת, היצור השני סופג את הנזק של הנשק, אך אל תוסיף את מתאם התכונה שלך לנזק זה אלא אם המתאם שלילי. אתה יכול לבצע התקפה נוספת זו פעם אחת בלבד בכל תור.
- id: weapon-mastery-graze
  name: "שריטה"
  description: |-
    אם גלגול ההתקפה שלך בעזרת נשק זה מחטיא יצור, אתה יכול לגרום ליצור נזק השווה למתאם התכונה ששימש אותך בגלגול ההתקפה. נזק זה הוא מאותו סוג שהנשק גורם, וניתן להגדילו רק באמצעות הגדלת מתאם התכונה.
- id: weapon-mastery-nick
  name: "חריץ"
  description: |-
    כשאתה מבצע את ההתקפה הנוספת של תכונת הנשק קל, אתה יכול לבצע אותה כחלק מפעולת התקפה במקום כפעולה נוספת. אתה יכול לבצע התקפה נוספת זו פעם אחת בלבד בכל תור.
- id: weapon-mastery-push
  name: "דחיפה"
  description: |-
    אם פגעת ביצור בעזרת נשק זה, אתה יכול לדחוף את היצור עד 10 רגל בקו ישר הרחק ממך, אם הוא גדול או קטן יותר.
- id: weapon-mastery-sap
  name: "החלשה"
  description: |-
    אם פגעת ביצור בעזרת נשק זה, ליצור יש חיסרון בגלגול ההתקפה הבא שלו לפני תחילת התור הבא שלך.
- id: weapon-mastery-slow
  name: "האטה"
  description: |-
    אם פגעת ביצור בעזרת נשק זה וגרמת לו נזק, אתה יכול להפחית את מהירותו ב-10 רגל עד תחילת התור הבא שלך. אם היצור נפגע יותר מפעם אחת מנשקים בעלי תכונה זו, הפחתת המהירות אינה עולה על 10 רגל.
- id: weapon-mastery-topple
  name: "הפלה"
  description: |-
    אם פגעת ביצור בעזרת נשק זה, אתה יכול לאלץ את היצור לבצע זריקת הצלה של חוסן (דרגת קושי 8 ועוד מתאם התכונה ששימש בגלגול ההתקפה ועוד תוסף השליטה שלך). אם נכשל בהצלה, היצור נעשה שרוע.
- id: weapon-mastery-vex
  name: "הטרדה"
  description: |-
    אם פגעת ביצור בעזרת נשק זה וגרמת לו נזק, יש לך יתרון בגלגול ההתקפה הבא שלך נגד אותו יצור לפני סוף התור הבא שלך.
- id: weapon-property-ammunition
  name: "תחמושת"
  description: |-
    אתה יכול להשתמש בנשק בעל תכונת תחמושת כדי לבצע התקפת טווח רק אם יש לך תחמושת לירות ממנו. סוג התחמושת הנדרש מצוין לצד הטווח של הנשק. כל התקפה צורכת פריט תחמושת אחד. שליפת התחמושת היא חלק מההתקפה (נדרשת יד פנויה כדי לטעון נשק חד-ידני). לאחר קרב, אתה יכול להשקיע 1 דקה כדי לאסוף מחצית מהתחמושת (מעוגל כלפי מטה) שהשתמשת בה בקרב; השאר אבדה.
- id: weapon-property-finesse
  name: "מעודן"
  description: |-
    כשאתה מבצע התקפה בנשק מעודן, השתמש לבחירתך במתאם הכוח או במתאם הזריזות שלך לגלגולי ההתקפה והנזק. עליך להשתמש באותו מתאם לשני הגלגולים.
- id: weapon-property-heavy
  name: "כבד"
  description: |-
    יש לך חיסרון בגלגולי התקפה בנשק כבד אם זהו נשק לחימה פנים אל פנים וציון הכוח שלך אינו לפחות 13, או אם זהו נשק טווח וציון הזריזות שלך אינו לפחות 13.
- id: weapon-property-light
  name: "קל"
  description: |-
    כשאתה מבצע את פעולת ההתקפה בתורך ותוקף בנשק קל, אתה יכול לבצע התקפה נוספת אחת כפעולה נוספת מאוחר יותר באותו תור. ההתקפה הנוספת חייבת להתבצע בנשק קל אחר, ואתה לא מוסיף את מתאם התכונה שלך לנזק ההתקפה הנוספת אלא אם המתאם שלילי. לדוגמה, אתה יכול לתקוף בחרב קצרה ביד אחת ובפגיון ביד השנייה בעזרת פעולת ההתקפה ופעולה נוספת, אך אינך מוסיף את מתאם הכוח או הזריזות שלך לגלגול הנזק של הפעולה הנוספת אלא אם המתאם שלילי.
- id: weapon-property-loading
  name: "טעינה"
  description: |-
    אתה יכול לירות פריט תחמושת אחד בלבד מנשק טעינה כשאתה משתמש בפעולה, בפעולה נוספת או בתגובה כדי לירות בו, ללא קשר למספר ההתקפות שאתה יכול לבצע בדרך כלל.
- id: weapon-property-range
  name: "טווח"
  description: |-
    לנשק טווח יש טווח בסוגריים אחרי תכונת התחמושת או ההטלה. הטווח מפרט שני מספרים. הראשון הוא הטווח הרגיל של הנשק ברגל, והשני הוא הטווח הארוך של הנשק. כשאתה תוקף יעד מעבר לטווח הרגיל, יש לך חיסרון בגלגול ההתקפה. אינך יכול לתקוף יעד מעבר לטווח הארוך.
- id: weapon-property-reach
  name: "הישג"
  description: |-
    נשק הישג מוסיף 5 רגל להישג ידך כשאתה תוקף בו, וכן כשקובעים את הישג ידך להתקפות מזדמנות בו.
- id: weapon-property-thrown
  name: "הטלה"
  description: |-
    אם לנשק יש תכונת הטלה, אתה יכול לזרוק את הנשק כדי לבצע התקפת טווח, ואתה יכול לשלוף את הנשק כחלק מההתקפה. אם הנשק הוא נשק לחימה פנים אל פנים, השתמש באותו מתאם תכונה לגלגולי ההתקפה והנזק שבו אתה משתמש להתקפה בקרב פנים אל פנים בנשק זה.
- id: weapon-property-two-handed
  name: "דו-ידני"
  description: |-
    נשק דו-ידני דורש שתי ידיים כשאתה תוקף בו.
- id: weapon-property-versatile
  name: "רב שימושי"
  description: |-
    ניתן להשתמש בנשק רב שימושי ביד אחת או בשתי ידיים. ערך נזק בסוגריים מופיע לצד התכונה. הנשק גורם נזק זה כשמשתמשים בו בשתי ידיים לביצוע התקפה בקרב פנים אל פנים.
