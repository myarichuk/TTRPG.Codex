- id: ability-score-cha
  name: "כריזמה"
  description: |-
    ביטחון עצמי, איזון וקסם אישי
- id: ability-score-con
  name: "חוסן"
  description: |-
    בריאות וסיבולת
- id: ability-score-dex
  name: "זריזות"
  description: |-
    זריזות, רפלקסים ושיווי משקל
- id: ability-score-int
  name: "תבונה"
  description: |-
    חשיבה הגיונית וזיכרון
- id: ability-score-str
  name: "כוח"
  description: |-
    עוצמה פיזית
- id: ability-score-wis
  name: "חוכמה"
  description: |-
    ערנות וחוסן נפשי
- id: alignment-chaotic-evil
  name: "רע וכאוטי"
  description: |-
    יצורים רעים וכאוטיים פועלים באלימות שרירותית, מונעים משנאה או מצימאון לדם. נבל הרודף תוכניות נקמה וחורבן הוא ככל הנראה רע וכאוטי.
- id: alignment-chaotic-good
  name: "טוב וכאוטי"
  description: |-
    יצורים טובים וכאוטיים פועלים לפי צו מצפונם, ומתעניינים מעט במה שאחרים מצפים מהם. מורד המארב לגובי המסים של ברון אכזר ומשתמש בכסף הגנוב כדי לעזור לעניים הוא ככל הנראה טוב וכאוטי.
- id: alignment-chaotic-neutral
  name: "ניטרלי וכאוטי"
  description: |-
    יצורים ניטרליים וכאוטיים נוהגים לפי גחמותיהם, ומעריכים את חירותם האישית מעל לכול. נוכל המשוטט בארץ וחי על שנינותו הוא ככל הנראה ניטרלי וכאוטי.
- id: alignment-lawful-evil
  name: "רע וחוקי"
  description: |-
    יצורים רעים וחוקיים לוקחים באופן שיטתי את מה שהם רוצים, במסגרת קוד של מסורת, נאמנות או סדר. אצילי המנצל אזרחים ושוזר מזימות להשגת כוח הוא ככל הנראה רע וחוקי.
- id: alignment-lawful-good
  name: "טוב וחוקי"
  description: |-
    יצורים טובים וחוקיים משתדלים לעשות את הדבר הנכון, כפי שהחברה מצפה. מי שנלחם בעוול ומגן על חפים מפשע ללא היסוס הוא ככל הנראה טוב וחוקי.
- id: alignment-lawful-neutral
  name: "ניטרלי וחוקי"
  description: |-
    ניטרליים וחוקיים פועלים בהתאם לחוק, למסורת או לקודים אישיים. מי שמנהל אורח חיים ממושמע, ואינו מושפע לא מדרישותיהם של הנזקקים ולא מפיתויי הרוע, הוא ככל הנראה ניטרלי וחוקי.
- id: alignment-neutral
  name: "ניטרלי"
  description: |-
    ניטרלי הוא נטייתם של מי שמעדיפים להימנע משאלות מוסריות ואינם בוחרים צד, ועושים את מה שנראה להם הטוב ביותר באותו רגע. מי שמשתעמם מוויכוחים מוסריים הוא ככל הנראה ניטרלי.
- id: alignment-neutral-evil
  name: "רע וניטרלי"
  description: |-
    רע וניטרלי הוא נטייתם של מי שאינם מוטרדים מהנזק שהם גורמים בעת מרדף אחר תאוותיהם. פושע השודד ורוצח כראות עיניו הוא ככל הנראה רע וניטרלי.
- id: alignment-neutral-good
  name: "טוב וניטרלי"
  description: |-
    יצורים טובים וניטרליים עושים את המיטב שביכולתם, פועלים במסגרת הכללים אך אינם חשים מחויבים להם. אדם אדיב העוזר לאחרים לפי צורכיהם הוא ככל הנראה טוב וניטרלי.
- id: alignment-unaligned
  name: "ללא נטייה"
  description: |-
    לרוב היצורים החסרים יכולת חשיבה הגיונית אין נטייה; הם ללא נטייה. כרישים, למשל, הם טורפים פראיים, אך אינם רעים; הם ללא נטייה.
- id: damage-type-acid
  name: "חומצה"
  description: |-
    נוזלים מאכלים, אנזימי עיכול
- id: damage-type-bludgeoning
  name: "מוחץ"
  description: |-
    עצמים קהים, חנק, נפילה
- id: damage-type-cold
  name: "קור"
  description: |-
    מים קופאים, משבי קרח
- id: damage-type-fire
  name: "אש"
  description: |-
    להבות, חום בלתי נסבל
- id: damage-type-force
  name: "כוח קסום"
  description: |-
    אנרגיה קסומה טהורה
- id: damage-type-lightning
  name: "ברק"
  description: |-
    חשמל
- id: damage-type-necrotic
  name: "נקרוטי"
  description: |-
    אנרגיה השואבת חיים
- id: damage-type-piercing
  name: "דוקר"
  description: |-
    ניבים, עצמים מנקבים
- id: damage-type-poison
  name: "רעל"
  description: |-
    גז רעיל, ארס
- id: damage-type-psychic
  name: "נפשי"
  description: |-
    אנרגיה המרסקת את הנפש
- id: damage-type-radiant
  name: "קורן"
  description: |-
    אנרגיה קדושה, קרינה צורבת
- id: damage-type-slashing
  name: "חותך"
  description: |-
    טפרים, עצמים חותכים
- id: damage-type-thunder
  name: "רעם"
  description: |-
    קול מזעזע
