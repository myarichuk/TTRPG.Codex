- id: barbarian
  name: 'Варвар'
  flavor: >-
    Варвары — те, кто отвечает на барабаны, когда кровь ещё горяча после прошлой схватки. Их ярость — прилив, поднимающийся откуда-то глубже мысли, и речной люд клянётся, что земля сама затихает, когда он вырывается наружу. Большинство учится носить этот огонь, не позволяя ему сжечь себя дотла, что труднее, чем кажется.
- id: bard
  name: 'Бард'
  flavor: >-
    Барды собирают песни так, как сороки собирают блестящее, и охотно выменяют тайну на хороший куплет и тёплое место у огня. Их слова несут особую взятую взаймы храбрость, которая переходит из рук в руки по толпе, пока испуганные не распрямят плечи. Спросите барда, где он учился ремеслу, и услышите про три города, одну трактирную драку и как минимум одну ложь.
- id: cleric
  name: 'Жрец'
  flavor: >-
    Жрецов зовут в деревню, когда у ребёнка жар или над могилой нужно как следует прочесть благословение. Их вера требует терпения и твёрдой руки; за ужином они спорят о доктрине, а потом всю ночь сидят у постели больного. Иные священники говорят, что их сила — заём у чего-то большего, и кредиторы редко торопятся требовать долг назад.
- id: druid
  name: 'Друид'
  flavor: >-
    Друиды хранят древние уговоры с живой изгородью и лесной лощиной и отсчитывают времена года по тому, как птицы меняют песни. Многие питают к животным привязанность, граничащую с невежливостью, а некоторые способны на один день влезть в лисью шкуру или обрасти ястребиными перьями. Речной люд оставляет им хлеб на опушке, а лес по-своему отвечает любезностью.
- id: fighter
  name: 'Воин'
  flavor: >-
    Воины рано решили, что тяжёлую жизнь лучше потратить с пользой, и тренировали тело, пока тренировка не стала инстинктом. Они знают все виды клинков и доспехов и обычно скажут, какой из них подведёт первым. Одни идут на войну за деньги, другие за дело, а некоторые просто не выносят, когда кто-то другой машет мечом.
- id: monk
  name: 'Монах'
  flavor: >-
    Монахи тренируют тело, пока оно не станет инструментом, а инструмент — пока он не станет своего рода тишиной. Их дисциплина строится на дыхании и равновесии, и они способны превратить голый кулак или простой посох во что-то, что заслужило бы уважение мастера меча. Их монастыри стоят на высотах, где ветер громок, а колокола редки, и гости нередко уходят с большим числом вопросов, чем пришли.
- id: paladin
  name: 'Паладин'
  flavor: >-
    Паладины дают клятву ещё до того, как берут в руки щит, и именно клятва не даёт им спать по ночам. Они несут исцеляющее прикосновение, которое иссякает быстрее, чем хотелось бы, и потому учатся расходовать его бережно. Любой городской стражник расскажет историю о рыцаре, державшем ворота, и каждая версия льстит рассказчику чуть больше, чем рыцарю.
- id: ranger
  name: 'Следопыт'
  flavor: >-
    Следопыты ходят по краю обжитых земель, где карты перестают быть полезными, а охотники начинают прислушиваться. Они читают следы, как другие читают письма, и обычно знают, где вы находитесь, раньше, чем вы решили войти. Большинство предпочло бы, чтобы их оставили в покое, но деревня в беде находит их быстрее любого гонца.
- id: rogue
  name: 'Плут'
  flavor: >-
    Плуты живут на разрыве между тем, что люди ожидают, и тем, что видят на самом деле. Они вскрывают замки, карманы и споры с одинаковым спокойствием и держат личную книгу услуг, должных им сразу в нескольких городах. Гильдии делают вид, что не знают их, что всех устраивает: плут, которого толком не видят, — это и плут, которого толком не поймать.
- id: sorcerer
  name: 'Чародей'
  flavor: >-
    Чародеи родились с искрой, которую их не учил разжигать ни один наставник, и эта искра любит вспыхивать посреди спора. Их магия горяча и близка к коже, поэтому от них часто веет озоном или корицей — смотря кто рассказывает. Старые семьи порой пытаются присвоить чародея, а чародеи обычно отвечают на это впечатляющей случайностью.
- id: warlock
  name: 'Колдун'
  flavor: >-
    Колдуны заключили сделку с тем, кто живёт в трещинах между ответами, и условия никогда не были так щедры, как казалось в первом разговоре. Сила приходит к ним мелкими острыми осколками — каждый из них секрет, который кажется подарком, пока не начинает чесаться. Друзья тревожатся, покровители улыбаются, а счётная книга в голове колдуна с каждым сезоном становится чуть длиннее.
- id: wizard
  name: 'Волшебник'
  flavor: >-
    Волшебники — это ученики, которые так и не перестали вести конспекты, а их книги заклинаний так же личны, как дневники, и вдвое опаснее. Каждую переписывают, снабжают пометками и спорят над ней на полях, пока она не становится картой разума владельца. Старые коллегии по-прежнему учат тем же осторожным привычкам: теорию проверяют, прежде чем ей поверить, и ни одному заклинанию не верят, пока оно не записано дважды.
