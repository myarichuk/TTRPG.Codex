- id: blinded
  name: 'Ослеплённый'
  flavor: >-
    Свет превратился в серое пятно, и каждая форма доходит лишь слухом о звуке и прикосновении. Ослеплённое существо рубит воспоминания о целях, а мир, кажется, рубит в ответ сильнее.
- id: charmed
  name: 'Очарованный'
  flavor: >-
    Сладкий неспешный голос поселился за глазами и сделал очарователя похожим на старого друга. Очарованное существо всё ещё отличает ловушку от доброты, но не в силах заставить себя укусить кормящую руку.
- id: deafened
  name: 'Оглохший'
  flavor: >-
    Хор улицы сжался до приглушённого гула за стеной из ваты. Слова доходят до оглохшего существа лишь формами на губах других, а колокол, звавший его к ужину, звонит в тишине.
- id: exhaustion
  name: 'Истощение'
  flavor: >-
    Кости словно набиты мокрым песком, и каждая мысль тащит за собой якорь. Истощение — долг, который накапливается, набирая проценты в ноющих конечностях, пока долгий сон наконец не начнёт его гасить.
- id: frightened
  name: 'Испуганный'
  flavor: >-
    Ужас скапливается под рёбрами всякий раз, когда источник страха попадает в поле зрения. Руки испуганного существа забывают своё мастерство, а ноги яростно спорят против каждого шага ближе к тому, чего оно боится.
- id: grappled
  name: 'Схваченный'
  flavor: >-
    Холодные пальцы сомкнулись на лодыжке или запястье, и борьба превратилась в медленное состязание весов. Схваченное существо может стоять на месте, но не может уйти — оно привязано к более сильной хватке, которая не желает разжиматься.
- id: incapacitated
  name: 'Недееспособный'
  flavor: >-
    Конечности и язык притихли, словно тело на этот день передали кому-то другому. Недееспособное существо может лишь смотреть, как разворачивается битва; мысли разбегаются, а дыхание не складывается в слово предупреждения.
- id: invisible
  name: 'Невидимый'
  flavor: >-
    Блики стекают с фигуры, как вода с камня, оставляя лёгкий сквозняк и ощущение, что кто-то стоит там, где никого нет. Ни линзы, ни глаза не находят, за что зацепиться, хотя чуткий нос или внимательное ухо всё ещё могут выдать проходящую тень.
- id: paralyzed
  name: 'Парализованный'
  flavor: >-
    Каждый приказ разума застревает у запястья, словно послание перехватил сонный курьер. Парализованное существо остаётся неподвижным и беззащитным, и любой удар, кажется, находит самое мягкое место.
- id: petrified
  name: 'Окаменевший'
  flavor: >-
    Кожа становится серым камнем, суставы замирают в позе скульптора, а живые часы перестают тикать. Высеченные черты хранят последнее выражение веками — холодные и тяжёлые, как монумент, ждущий, пока кто-нибудь вспомнит его имя.
- id: poisoned
  name: 'Отравленный'
  flavor: >-
    Горький привкус держится в глубине горла, а руки кажутся неловкими, будто принадлежат чужаку. Прицел отравленного существа блуждает, рассудок расползается, и мысли отказываются выстраиваться ровными рядами.
- id: prone
  name: 'Сбитый с ног'
  flavor: >-
    Пыль и гравий оказались ближе, чем кому-либо хотелось, и каждая попытка дотянуться до оружия упирается в землю. Упавшее существо медленно карабкается вверх, а всё, что несётся на него, словно приходит под неудачным углом.
- id: restrained
  name: 'Обездвиженный'
  flavor: >-
    Путы не обязаны быть железными: клубок верёвок или тяжесть сети держат конечность не хуже любой цепи. Обездвиженное существо рвётся из силков, и каждое усилие лишь туже затягивает узел.
- id: stunned
  name: 'Ошеломлённый'
  flavor: >-
    Разум звенит, как ударенный колокол, а мир приходит обрывками, которые не желают складываться по порядку. Ошеломлённое существо оседает под ударом, слишком оглушённое, чтобы подготовиться к тому, что будет дальше.
- id: unconscious
  name: 'Без сознания'
  flavor: >-
    Сон пришёл без колыбельной и уронил тело на плиты, как мешок зерна. Мысли уплывают в тёмное безмолвное море, и спящий не знает, кто стоит рядом.
