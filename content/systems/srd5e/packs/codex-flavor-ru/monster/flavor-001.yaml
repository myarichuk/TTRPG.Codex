- id: aboleth
  flavor: >-
    Нечто огромное ждёт в чёрной воде затопленных цистерн, существо, которое мыслит медленными, терпеливыми течениями. Его разум дотягивается до других без единого звука, и те, к кому он прикоснулся, обнаруживают, что их собственные воспоминания тихо читают, словно гроссбух. Законопослушный, как прилив, он держит слуг близко и не забывает ничего, что стоит присвоить.
- id: adult-black-dragon
  flavor: >-
    Взрослый чёрный дракон заявляет права на топи и затопленные руины, где воздух пахнет гнилью и стоячей водой. Его чешуя поглощает свет, а дыхание — шипящее облако, которое разъедает и бронзу, и кость. Он жесток без церемоний, из тех тиранов, для которых болотные деревни — не более чем строки в налоговых книгах.
- id: adult-blue-dragon
  flavor: >-
    Синие драконы правят сухими котловинами, где собираются грозы без дождя. Взрослый представитель этого вида — терпеливый интриган: он зарывается под песчаные дюны, чтобы следить за караванами и забирать то, что считает своим по праву. Когда он наконец поднимается, небо трещит, а дюны блестят застывшим стеклом.
- id: adult-brass-dragon
  flavor: >-
    Латунные драконы — болтуны выжженных солнцем пустошей, и счастливее всего они тогда, когда кто-то слушает их рассказы. Взрослый дракон наслаждается загадками, старыми песнями и тёплыми сплетнями странствующих бардов. Его гнев вспыхивает быстро и ярко, как чиркнутая спичка, и так же быстро остывает.
- id: adult-bronze-dragon
  flavor: >-
    Бронзовые драконы стерегут берега и устья рек, патрулируя побережье так, будто море наняло их на службу. Взрослый дракон спокоен и справедлив, из тех, кто выслушает жалобу рыбака, прежде чем что-либо решить. Его рёв катится над водой, как гром, и те, кто нарушает порядок на приливе, быстро учатся вести себя тихо.
- id: adult-copper-dragon
  flavor: >-
    Медные драконы — это озорство с крыльями, и взрослый дракон относится к своим шуткам очень серьёзно. Он усаживается на утёсах и каменистых выступах, придумывая планы, как переставить мебель в замках соперничающих лордов или спрятать призовых коров городка в пещере. Его смех звонкий и восторженный, и никогда не ясно, закончатся ли его проделки пиром или крушением.
- id: adult-gold-dragon
  flavor: >-
    Золотые драконы — величественные, медленно говорящие стражи древних королевств, и взрослый дракон носит это достоинство, словно королевский плащ. Он смотрит на войны и свадьбы с одинаково долгим прищуром, предлагая советы, которые порой нежеланны, но никогда не легкомысленны. Его огонь — тёплый золотой прилив, и он приберегает его для тех, кто угрожает земле.
- id: adult-green-dragon
  flavor: >-
    Зелёные драконы таятся в старых лесах, где крона скрывает все тайны. Взрослый дракон — интриган, который предпочитает шёпотом заключаемые сделки открытой войне, и его голос проскальзывает в мысли слушателя, словно холодный сквозняк. Его дыхание — удушающее зелёное облако, и больше всего ему нравится смотреть, как соперники, кашляя, идут к сделке, выгодной для дракона.
- id: adult-red-dragon
  flavor: >-
    Красные драконы гнездятся на вулканических пиках и в пещерах, полных сокровищ, где жар земли под стать их нраву. Взрослый дракон горд и жаден, из тех тиранов, что пересчитывают монеты дважды, а затем пересчитывают монеты соседей. Когда он взмывает в небо, его дым ещё долго висит над долиной после его ухода.
- id: adult-silver-dragon
  flavor: >-
    Серебряные драконы — странники высоких горных перевалов, собирающие истории, как другие собирают монеты. Взрослый дракон любит загадки судьбы и часто появляется на краю лагеря, чтобы задать вопросы, которые приводят путников туда, где им полезно быть. Его иней — острый, яркий холод, и он ненавидит нарушенное обещание сильнее, чем любой клинок.
- id: adult-white-dragon
  flavor: >-
    Белые драконы обитают на ледниках и промёрзших болотах, где их холод надёжнее любой дороги. Взрослый дракон — грубый охотник, который находит удовольствие в простых радостях погони и в медленной тишине, что следует за ней. Его дыхание превращает озёра в твёрдый лёд, и оставленный им лёд выглядит почти как скульптура, созданная терпеливым и жестоким мастером.
- id: air-elemental
  flavor: >-
    Воздушный элементаль — это вихрь ветра, наделённый упрямой волей, и он дрейфует по открытым дворам так, будто владеет небом. Жестокость ради жестокости его не интересует, но одним порывом он может сбросить беспечного путника с дороги. Когда он ревёт, звук подобен грому, а позади него пыль поднимается спиралью.
- id: allosaurus
  flavor: >-
    Аллозавр — хищник старых равнин с огромной челюстью, созданный для внезапных рывков, а не для долгой погони. Его укус достаточно силён, чтобы расколоть кость, а когтистые передние лапы полосуют всё, что подвернётся на пути. В нём нет злобы, лишь голод и узкая, практичная хитрость, которая знает, где обычно собирается добыча.
- id: ancient-black-dragon
  flavor: >-
    Старше болотных дорог и большинства названий, которыми их описывают, древний чёрный дракон затопил целые долины, чтобы устроить логово. Его чешуя цвета мокрого сланца, а дыхание способно растворить крепостную стену одним взмахом. Картографы оставляют его владения пустыми, и это, кажется, устраивает всех.
- id: ancient-blue-dragon
  flavor: >-
    Терпеливый сверх всякого смертного счёта, древний синий дракон правит сухими котловинами дольше, чем у них появились названия. Он роет ходы под песками и ждёт, когда буря отзовётся на его волю, а затем посылает молнию сквозь дюны, словно письмо, написанное огнём. Его манеры холодны и учтивы, но каждая любезность — договор с условиями.
- id: ancient-brass-dragon
  flavor: >-
    Немногие существа пустыни помнят время, когда древний латунный дракон ещё не рассказывал истории под дюнами. Его голос тёплый и неизменно весёлый, и он охотно меняет историю на историю так же легко, как золото. Огонь вырывается из его пасти, когда ему становится скучно, хотя он редко надолго остаётся праздным, ведь хорошая загадка всегда возвращает его обратно.
- id: ancient-bronze-dragon
  flavor: >-
    Там, где кончаются старые портовые карты и начинается открытое море, древний бронзовый дракон несёт долгое, зоркое бдение. Он охраняет побережье, как маяк охраняет море: ровно, ярко и так, что его невозможно не заметить. Его громовые раскаты способны опрокинуть ряд лодок, но он предпочитает мягко оттеснить нарушителя к берегу и дать приливу преподать урок.
- id: ancient-copper-dragon
  flavor: >-
    Умнее, чем обычно бывают драконы, древний медный дракон видит весь мир как загадку, созданную для его развлечения. Он переставлял целые сады, просто чтобы посмотреть, как отреагируют фермеры, и после каждого раза оставлял вежливые извинения. Его кислотное дыхание — шипящее зелёно-золотое облако, но больше всего тревожит тех, кто перешёл ему дорогу, его смех.
- id: ancient-gold-dragon
  flavor: >-
    Никем не венчанный и никому не подотчётный, древний золотой дракон всё же ведёт себя как мудрейший советник, на которого может надеяться любой двор. Его суждения приходят медленно и почти никогда не отменяются, ведь он видел, как поднимались и падали империи задолго до того, как большинство учёных выучили их имена. Когда он раскрывает крылья, свет, разливающийся по земле, тёплый и золотой, и такого зрелища не забудет ни один свидетель.
- id: ancient-green-dragon
  flavor: >-
    В лесу ничто не растёт без его согласия, и древний зелёный дракон давно решил, что каждый корень принадлежит ему. Его разум проникает в мысли королей и деревенских старейшин, подталкивая их к решениям, которые служат терпеливому, очень древнему голоду. Его ядовитое дыхание стелется над верхушками деревьев, словно туман, который помнит каждое имя, что он когда-либо задушил.
- id: ancient-red-dragon
  flavor: >-
    Пепел осел на каждой вершине, которую древний красный дракон присвоил, и камень под ним всегда тёплый. Он правит страхом и лестью в равной мере, повелевая низшими существами голосом, от которого у них подгибаются колени раньше, чем они понимают почему. Его огонь чудовищен по размаху, и старые предания о сожжённых городах рассказывают о нём испуганным шёпотом.
- id: ancient-silver-dragon
  flavor: >-
    Историки высоких пиков часто отказываются писать о древнем серебряном драконе, ведь он поправляет их рассказы с неприятной точностью. Он наблюдал, как династии севера хоронили своих мёртвых и возводили новые города из того же промёрзлого камня. Его манеры придворные и добрые, но холодное дыхание, которое он способен выпустить, достаточно жестоко, чтобы остановить армию на марше.
- id: ancient-white-dragon
  flavor: >-
    У мороза долгая память, и древний белый дракон провёл всё своё правление, обучая его новому терпению. Он устроил логово под ледником, который стонет и трескается всякий раз, когда дракон шевелится, и считает заснеженную тундру охотничьими угодьями, которыми ему никогда не хотелось делиться. Его ледяное дыхание замораживает реки на ходу, а путники, пережившие переправу, клянутся, что лёд как будто прислушивался.
- id: animated-armor
  flavor: >-
    Доспех стоит в углу забытого зала, его сочленения скованы, а забрало пусто, и в нём нет разума, о котором стоило бы говорить. Кто-то однажды связал его простым долгом, и эта связь пережила почти всех, кто помнит приказ. Он движется с тяжёлым, лязгающим терпением, а его латные рукавицы с радостью размахивают любым оружием, которое ему дали.
- id: animated-flying-sword
  flavor: >-
    Клинок без хозяина висит в воздухе тихой оружейной, медленно поворачиваясь, будто ищет руку, что когда-то его держала. Тот, кто его зачаровал, дал ему одну цель и не оставил терпения ни на что, кроме неё. Он бросается на незваных гостей с тонким, нетерпеливым свистом и странно доволен, когда находит цель.
- id: animated-rug-of-smothering
  flavor: >-
    Тканый ковёр, который какой-то скучающий изобретатель вышил голодным сердцем и бросил валяться на лестнице. Его бахрома изгибается, словно терпеливая рука, и он падает на всякого, кто по неосторожности ступит на его яркий узор. Жертвы описывают это ощущение как тёплое, тёмное и крайне недружелюбное.
- id: ankheg
  flavor: >-
    Фермеры низин винят в каждом обвалившемся поле существо, которое роет под ним ходы. Оно грызёт глину и скальные породы, оставляя гладкие проходы, что остаются открытыми долго после того, как тварь ушла. Когда оно выныривает из почвы, его щёлкающие челюсти хватают добычу, а кислотный плевок растворяет всё, что оно не может проглотить.
- id: ankylosaurus
  flavor: >-
    Широкий, покрытый панцирем травоядный движется через папоротниковые леса, словно медленная бронированная повозка. Его тяжёлый хвост заканчивается костяным узлом, способным сбить с ног бросающегося на него хищника. Большинство мудрых путников держатся от него подальше и дают ему спокойно дожевать.
- id: ape
  flavor: >-
    Широкоплечий лазающий зверь, обитающий в кронах джунглей и на скалистых обрывах. Обезьяны любопытны к чужакам и долго наблюдают с ветвей, прежде чем выбрать сторону. Когда им становится тесно, они с удивительной меткостью швыряют камни, и мало кто из путников забывает первую встречу.
- id: archelon
  flavor: >-
    Огромная морская черепаха, панцирь которой мог бы укрыть небольшую рыбацкую деревню. Она спит, дрейфуя на тёплых течениях, и выныривает так редко, что моряки принимают её за риф. Голодная, она щёлкает челюстью, достаточно сильной, чтобы разломить корабельный брус.
