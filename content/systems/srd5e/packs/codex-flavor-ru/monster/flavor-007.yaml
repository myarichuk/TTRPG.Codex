- id: ice-devil
  flavor: >-
    Ледяной дьявол — терпеливое, серебристоязыкое существо, которое предпочитает контракты сражениям и считает холодный взгляд своего рода любезностью. Он носит длинное белое копьё, от которого воздух вокруг леденеет, и возводит ледяные стены, чтобы сделки не были нарушены. Те, кто подписывает с ним договор, обычно обнаруживают мелкий шрифт лишь тогда, когда пробирает холод.
- id: ice-mephit
  flavor: >-
    Ледяные мефиты дрейфуют по холодным горным перевалам, словно обрывки инея, и болтают чепуху каждому, кто подходит слишком близко. Они напускают туман над тропой, чтобы скрыть своё хихиканье, а затем выдыхают морозный порыв, после которого путники стоят окоченевшие и угрюмые. Когда один из них наконец разбивается, он рассыпается резким холодным облаком, поэтому благоразумные держатся на почтительном расстоянии от его покрытого инеем тела.
- id: imp
  flavor: >-
    Импы — крошечные, злобные обманщики, которые любят смотреть, как умные люди выставляют себя дураками. Они принимают облик крысы, ворона или паука, когда это им выгодно, и никогда не устают от лукавого шёпота и отравленных укусов. Наёмные работники редко замечают существо, пока его невидимое присутствие уже не утащило монеты из их карманов.
- id: incubus
  flavor: >-
    Инкуб носит красивое лицо и бархатный голос, и мало кто из путников догадывается, что добрый незнакомец в трактире — терпеливый интриган. Вечерами он сеет сомнения и бессонные кошмары в спящих, и проклятия, которые он оставляет, не проходят даже после последнего бокала. Те, кто просыпается измождённым и хмурым, часто винят свою невезучесть, но никогда — красивого гостя, который сидел у их изголовья.
- id: invisible-stalker
  flavor: >-
    Невидимый охотник — это порыв ветра, наделённый упрямой целью, терпеливый преследователь, который парит незримо, пока жертва не почувствует внезапного рывка. Продрогшие в бурю моряки описывают рёв, идущий ниоткуда, а затем вихрь пыли и брызг, который хватает их за ноги и сбивает с равновесия. Учёные старых коллегий говорят, что он повинуется заклинанию, призвавшему его, и редко забывает обиду, когда ветер уже повернул.
- id: iron-golem
  flavor: >-
    Железный голем — возвышающийся страж из склёпанного металла, созданный охранять единственный проход и не слушать никаких доводов, требующих отступить в сторону. Кулаки его звенят, как ударяемые колокола, а при выдохе болезненно-зелёное дыхание висит над двором долго после того, как бой окончен. Создатели таких существ исчезли, оставив лишь металл и упрямую верность двери, которую им велели охранять.
- id: jackal
  flavor: >-
    Шакалы скользят по степи стаями, быстрые и взъерошенные, всегда высматривая случайный кусок мяса или ягнёнка, отбившегося от стада. Они мелкие и смелые, бегают кругами, чтобы измотать добычу, и поодиночке храбрыми бывают редко. Пастухи холмистых краёв говорят без выражения: один шакал — досада, а два — похороны.
- id: killer-whale
  flavor: >-
    Косатки — гладкие чёрно-белые охотники, которые кочуют по холодным морям тесными семейными группами и движутся с точностью, похожей на отрепетированную. Моряки северных путей рассказывают о спинном плавнике, рассекающем волну, а через мгновение о треске огромного хвоста. Рыбаки, слыша их щёлкающие призывы, учатся тихо опускать сети и грести к берегу.
- id: knight
  flavor: >-
    Рыцари — профессиональные воины, которые присягают знамени лорда, и хорошие из них интересуются не славой, а чистым договором. Их доспехи скрипят на марше, а помятый щит рассказывает историю каждого выигранного поединка. Мудрый лорд держит рыцаря при себе, хотя тот охотно примет второе предложение, если первый наниматель окажется скучным.
- id: kobold-warrior
  flavor: >-
    Кобольды — маленькие чешуйчатые существа, которые считают себя законными наследниками древних драконов и охраняют свои туннели хитрыми ловушками и громким бахвальством. Воин племени носит горсть метательных кинжалов и сражается в толпе, ведь один кобольд легко сбивается с ног. Яркое солнце им не по нраву: они щурятся и ворчат, и громко клянутся, что всё это — заговор.
- id: kraken
  flavor: >-
    Кракен — огромный морской ужас, чьё горообразное тело лишь изредка выходит на поверхность, и моряки, которые его видят, редко остаются в живых, чтобы подробно описать. Его щупальца способны утянуть корабль под волну, а чёрные чернила, которые он выбрасывает, оставляют команды слепыми и спотыкающимися на палубе. Учёные изучали его щупальца, но так и не пришли к согласию, голоден ли этот зверь, разгневан или просто любопытен.
- id: lamia
  flavor: >-
    Ламия имеет верхнюю часть тела тонко очерченной женщины и нижнюю часть змеи, и она использует тёплый голос, чтобы выманить тайны у неосторожных. Когти её остры, а прикосновение оставляет кислый, долго не проходящий ужас, который липнет к жертве ещё долго после пира. Деревенские чародеи спорят веками, можно ли такое существо исправить, и ламия находит этот спор очень забавным.
- id: lemure
  flavor: >-
    Лемуры — безумные, шаркающие оболочки проклятых душ, медлительные и угрюмые, которые бродят по мрачным полям и бормочут над лужами грязи. Они не умеют говорить, однако понимают каждый приказ, брошенный им, поэтому мелкие дьяволы и тюремщики находят их столь полезными. Каждый несёт собственное медленное сожаление, а проницательный наблюдатель заметит, что лемур редко дуется надолго.
- id: lich
  flavor: >-
    Лич — маг, который обменял смертность на хватку над миром, и мало какая хватка бывает крепче его собственной. Голос его сух, как старый пергамент, и говорит он о древних соперниках с весёлым презрением человека, который всех их пережил. Его логово завалено запасными телами и банками, в которых хранятся осколки души, на случай если нынешнее тело разобьют.
- id: lion
  flavor: >-
    Львы — гордые кошки открытых равнин, которые охотятся стаями и лежат в высокой траве, пока стадо не станет беспечным. Вожак прайда рычит, чтобы обратить добычу в бегство, а остальные члены семьи смыкают круг терпеливыми, отработанными лапами. Охотники сухих земель восхищаются мужеством зверя, хотя и внимательно следят за ним, когда ветер меняется.
- id: lizard
  flavor: >-
    Ящерица — небольшое, терпеливое существо, которое греется на тёплых камнях и легко взбирается по стенам, холоднокровное и почти не впечатлённое миром. Дети ловят их в сложенные ладони, а старые фермеры утверждают, что ящерица на стене предвещает ясную погоду. Она без усилий держится на потолке, а если её прижать, укусит, хотя укус не болезненнее щипка.
- id: mage
  flavor: >-
    Маги — учёные, которые продвинулись в изучении арканных сил дальше большинства и редко стесняются это доказывать. Маг может носить простой плащ и держать один посох, но несколько точно подобранных слов способны превратить тихую таверну в поле огня. Жители торговых городков уважают их, в основном потому, что раздражённый маг помнит каждую обиду и возвращает её с процентами.
- id: magma-mephit
  flavor: >-
    Магмовые мефиты — маленькие тлеющие импы из вулканической породы, которые вечно суетятся в трещинах горячей горы. Они выскакивают из озёр лавы, чтобы плюнуть огненным дыханием в проходящих шахтёров, и громко хихикают, когда пламя подпаливает чьи-нибудь сапоги. Их тела потрескивают при ударе, и самые мудрые пещерные жители держат наготове ведро холодной воды для неизбежного взрыва.
- id: magmin
  flavor: >-
    Магмины — весёлые маленькие существа из пламени, которые пляшут в углях кузниц и вулканических жерлах, в восторге от любого беспорядка, который могут поджечь. Их прикосновение заставляет одежду и деревянные балки тлеть, поэтому с магмином лучше встречаться на расстоянии вытянутой руки, с ведром воды наготове. Светятся они ярче всего, когда довольны, и один угрюмый кузнец как-то поклялся, что только довольный магмин стоит держать возле мехов.
- id: mammoth
  flavor: >-
    Мамонты — косматые гиганты холодного севера, которые ступают по снегу с бивнями длиной с мачту парусника. Стада движутся медленно и спокойно, но разъярённый самец — сокрушительная сила, и он без раздумий проломит любой забор. Охотники, уважающие их размер, обычно оставляют стадо в покое, ведь старые звери помнят каждую тропу и каждую опушку.
- id: manticore
  flavor: >-
    Мантикора имеет лицо угрюмого мужчины, тело льва и хвост, ощетинившийся зазубренными шипами, которыми она способна метнуть в добычу. Голос её — жестокое урчание, и она любит поиграть с путниками, прежде чем ударить сверху крыльями, отбрасывающими длинную тень. Выжившие часто клянутся, что она рассуждала во время боя, а это неприятное ощущение, которого большинство воинов предпочло бы избежать.
- id: marilith
  flavor: >-
    Марилит — высокий демон с шестью руками, и в каждой зажат свой клинок, а двигается она с грацией танцовщицы, которая скрывает свирепый и расчётливый ум. Нижняя половина её тела вьётся, как у змеи, и способна стиснуть врага в смертельном захвате, пока клинки сверкают в воздухе. Те, кто встречался с ней в бою, редко забывают вихрь сверкающих лезвий, и благоразумный капитан молится, чтобы этой твари было скучно.
- id: mastiff
  flavor: >-
    Мастифы — крупные, верные псы с тяжёлыми брылями и низким лаем, который может напугать грабителя раньше, чем будет обнажён клинок. Крестьянские семьи ценят их как сторожей: хороший пёс собьёт нарушителя с ног и будет держать его, пока не придёт помощь. Преданность его ровная, хотя иногда он дуется на кухне, если считает, что про похлёбку забыли.
- id: medusa
  flavor: >-
    Медуза имеет корону из живых змей вместо волос и взгляд, способный обратить смелого противника в камень. Она держит мраморный двор, полный статуй, и весьма гордится своей коллекцией, хотя не любит гостей, которые смотрят слишком долго. Умные путники берут с собой начищенный щит и никогда не встречаются с ней взглядом напрямую, что избавляет от множества хлопот.
- id: merfolk-skirmisher
  flavor: >-
    Мерфолки-застрельщики — лёгкие и быстрые бойцы из рифов, вооружённые зазубренным копьём, которое, кажется, после каждого броска возвращается обратно в руку. Они одинаково дышат воздухом и водой, поэтому выскальзывают на берег, чтобы напасть на рыбацкие деревни, и исчезают под волнами раньше, чем кто-либо успеет собрать толпу. Портовые стражники ворчат, что один застрельщик — досада, а дюжина — осада, которой не выдержит ни одна морская стена.
- id: merrow
  flavor: >-
    Мероу — громоздкие морские существа с рыбьей нижней частью тела, зазубренными зубами и нравом, который под стать шторму. Они таятся в холодных отмелях прибрежных пещер и утаскивают неудачливые лодки на крючковатых гарпунах. Рыбацкие деревни оставляют на камнях солёную рыбу как знак мира, и мероу принимает её с ворчанием и голодной ухмылкой.
- id: mimic
  flavor: >-
    Большинство путников полагает, что железом окованный сундук в углу трактира — всего лишь мебель. Мимик живёт на этом предположении дольше, чем кто-либо из трактирщиков может припомнить: он принимает облик дверей, бочек и сундуков с сокровищами и ждёт с терпением, которое кажется почти вежливым. Его поверхность настолько липкая, что тот, кто прислонится к нему слишком близко, может никогда не уйти.
- id: minotaur-of-baphomet
  flavor: >-
    Рогатые стражи запретного святилища редко бывают весёлой компанией, и этот обладает тяжеловесностью часового, который забыл, зачем ему пост. Он выше любого дверного проёма и машет чёрной глефой с мрачным, неспешным рвением. Культисты утверждают, что зверь никогда не устаёт, хотя пятна на его алтаре говорят об обратном.
- id: minotaur-skeleton
  flavor: >-
    Кто-то однажды собрал этот скелет из костей быка и затаённой обиды, и с тех пор он марширует по одному и тому же лабиринту. Рёбра его громыхают при каждом тяжёлом шаге, а череп по-прежнему опускается на незваных гостей так, будто рога никуда не делись. Законопослушный и методичный, он без вопросов подчиняется старым приказам, что делает его неприятно надёжным тюремщиком.
- id: mummy-lord
  flavor: >-
    Тогда как низшие забальзамированные мертвецы тупы и шаркают, повелитель мумий помнит всё, чему его учили при жизни. Он говорит на нескольких языках, ведёт тщательные записи каждой обиды и наставляет гробницы, которые охраняет, с точностью учёного. Воры, принявшие его молчание за слабость, обычно узнают разницу от стены из завёрнутых и наблюдающих слуг.
