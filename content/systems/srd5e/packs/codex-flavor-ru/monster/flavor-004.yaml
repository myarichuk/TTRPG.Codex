- id: dryad
  flavor: >-
    Дриада связана с одним великим деревом, и её настроение поднимается и опадает вместе с состоянием леса, который она охраняет. У неё голос, способный успокоить испуганного жеребёнка или очаровать путника так, что тот забудет дорогу домой. Дровосеки, уважающие старые деревья, редко тревожатся, но те, кто вырубает рощу на дрова, порой слышат шёпот из коры, который следует за ними домой.
- id: dust-mephit
  flavor: >-
    Пылевые мефиты — маленькие крылатые озорники, рождённые из песка сухих мест, и, кажется, они получают удовольствие от каждой неприятности, которую поднимают. Они носятся в облаках тонкого песка, слепя всякого, кто подойдёт слишком близко, и чихают с восторженным тонким писком. Когда один из них уничтожен, он взрывается облаком пыли, которое разносит всё вокруг, а смех мефита долго висит в воздухе после его ухода.
- id: eagle
  flavor: >-
    Орлы парят в тёплых потоках над высокими утёсами, высматривая долины глазами, достаточно острыми, чтобы разглядеть полёвку с высоты. Они яростно защищают свои гнёзда и бросаются на всё, что подойдёт слишком близко, но большую часть времени просто кружат и ждут. Пастухи горных мест уважают их, а некоторые поют старые песни о птице, которая однажды донесла потерянного ребёнка домой.
- id: earth-elemental
  flavor: >-
    Земляной элементаль — неуклюжая масса камня и утрамбованной почвы, которая пробуждается, когда глубинная порода потревожена. Он медленно движется сквозь твёрдую землю, не оставляя за собой туннеля, а затем выныривает рядом с изумлённой артелью шахтёров, с двумя кулаками, словно валуны. Стены и ворота — его естественные враги, а шахтёры, услышавшие низкий скрежет под ногами, знают, что нужно немедленно покинуть ствол.
- id: efreeti
  flavor: >-
    Ифрит — гордый дух пламени, выкованный в краях печей, где небо остаётся красным и никогда не остывает. Его нрав так же горяч, как его кожа, и оскорбление его рода он принимает куда серьёзнее, чем нарушенное обещание. Многие неразумные учёные пытались подчинить ифрита ради милости, но обнаруживали, что тот охотно исполняет желание, а затем долго следит за тем, чтобы цена была уплачена пеплом.
- id: elephant
  flavor: >-
    Слоны движутся по степям длинными медленными колоннами, которые ведёт старейшая матриарх, и каждый член стада внимательно следит за остальными. Бык, которому тесно или которого раздразнили, может атаковать с ошеломляющей скоростью, а его огромные бивни способны раскроить борт фургона. Путники, встретившие стадо на дороге, обычно запоминают, что память этого зверя так же длинна, как его терпение коротко.
- id: elk
  flavor: >-
    Лось носит корону огромных рогов, которые кажутся слишком тяжёлыми для тонкой шеи под ними. Стада пасутся на высоких лугах летом, деля ветер и высматривая волков с каждого гребня. Когда наступает гон, самцы сходятся с треском, который разносится эхом по долине, и побеждает тот, кто остаётся стоять, когда другой наконец отступит.
- id: erinyes
  flavor: >-
    Эриния — крылатая исполнительница холодных контрактов, фигура, которая взыскивает долги с вежливой угрозой и улыбкой, никогда не доходящей до глаз. Она носит свёрнутую зачарованную верёвку, которая держит накрепко всё, что поймает, а её клинок кусает холодной остротой. Те, кто ставит свою подпись под соглашением с законным дьявольским двором, обычно узнают, что бумаги важны и что она всегда появится, когда придёт срок платежа.
- id: ettercap
  flavor: >-
    Эттеркап — сутулое, косматое существо, которое плетёт липкую паутину в развилках старых деревьев и в руинах амбаров. Он достаточно сообразителен, чтобы ставить ловушки, и достаточно жесток, чтобы получать от них удовольствие, и хранит запас костей у любимой паутины как мрачный трофей. Охотники, забредшие слишком глубоко в его владения, сообщают, что слышат мягкое подёргивание прямо перед тем, как шёлк затянется.
- id: ettin
  flavor: >-
    Две головы, которые никогда ни в чём не согласны, делят одно огромное тело, и пара проводит бодрствование в перебранке о том, в какую сторону идти. Холмовой народ оставляет ему загоны для скота, ведь существо обижается на всё, что похоже на ограду, и из злости сравнивает ряд с землёй. Те, кто видел, как оно сражается, говорят, что головы по очереди орут, а спор ни разу не замедлил удар топора.
- id: fire-elemental
  flavor: >-
    Сгусток живого пламени дрейфует по кузницам и очагам, горя ровным и терпеливым голодом, который не утолил бы ни один мех. Учёные старых коллегий спорят, существо ли это или собственная стихия погоды, ведь у него нет лица и чётких очертаний. Караванщики держат фонари подальше от него, а мудрые кузнецы никогда не подпускают его к своему углю.
- id: fire-giant
  flavor: >-
    Огненные великаны держат свои царства в вулканических залах, где выковывают клинки, сияющие, как закат, и судят подданных железным терпением. Их закон жёсток, а гордость горячее любой печи, поэтому вызов от существа поменьше встречается не смехом, а мечом. Те, кто выживает в поединке с одним из них, нередко обнаруживают, что выжженная земля под ними всё ещё дымится.
- id: flesh-golem
  flavor: >-
    Сшитый из старых останков, голем — это лоскутное тело из несходящихся частей, удерживаемых швами и искрой заимствованной жизни. Его создатель хотел слугу, который никогда не устаёт, и получил того, кто помнит руки, из которых был собран, и обижается, когда ему велят, что делать. Огонь — его единственная слабость, поэтому мудрый хранитель никогда не носит рядом с ним факел и держит наготове спокойный голос.
- id: flying-snake
  flavor: >-
    Тонкая змея с кожистыми складками по бокам планирует с ветки на ветку с большей уверенностью, чем изяществом. Проводники в джунглях говорят, что большую часть жизни она проводит в кронах, падая на добычу сверху и уплывая прежде, чем её успеют прогнать. Её укус скорее досадная помеха, чем угроза, хотя яд жжёт достаточно сильно, чтобы путник пожалел о прогулке.
- id: frog
  flavor: >-
    Маленькая бурая лягушка сидит на листе кувшинки — из тех созданий, от которых весь пруд звучит ярче, когда она квакает. Болотный народ большую часть времени не обращает на неё внимания, хотя дети, пытавшиеся её поймать, быстро узнают, что она прыгает дальше, чем они ожидали. Её песня — ночное чудо болота и мягкое напоминание о том, что даже самое маленькое существо может владеть участком воды.
- id: frost-giant
  flavor: >-
    Ледяные великаны возводят свои чертоги на ледниковых уступах, где ветер всегда поёт, а снег никогда не тает. В оттепель они забирают то, что хотят, у деревень низин, оставляя иней на дверных косяках как холодную визитную карточку. Их жестокость терпелива, юмор сух, и они с удовольствием позволят путнику замёрзнуть, пока сами пересчитывают овец.
- id: gargoyle
  flavor: >-
    Высеченная из живого камня, горгулья сидит на высоких карнизах и ждёт, когда под ней пройдёт что-нибудь неосторожное. Её каменные крылья похожи на украшение, пока они не раскроются с треском, словно ломающийся сланец, и тогда существо уже в воздухе и в дурном расположении духа. Горожане научились закрывать ставни рано, ведь разгневанная горгулья может спрыгнуть с крыши без предупреждения.
- id: gelatinous-cube
  flavor: >-
    Дрожащая стена прозрачного желе медленно движется по старым туннелям, поглощая упавшие монеты, кости и всё прочее, что валяется на полу. Её тело так прозрачно, что несчастных можно разглядеть внутри, спокойных и удивлённых, долгое время, прежде чем кто-нибудь догадается помочь. Гильдии искателей приключений вывешивают об этом объявления, и все они заканчиваются одной и той же просьбой не оставлять ценности на полу.
- id: ghast
  flavor: >-
    Гаст — упырь, ставший ещё злее и ещё гнилее, и несёт он зловоние такой густоты, что дышать рядом с ним — дурная затея. Могильщики иногда говорят, что запах приходит немного раньше самого существа, и осторожный успевает убежать. Тот, кто слышит его низкий смех после наступления темноты, предпочитает забарикадировать двери.
- id: ghost
  flavor: >-
    Дух того, кто умер с незаконченными делами, призрак проходит сквозь стены и полы так, словно это занавески. Он помнит мало из своей жизни, но в точности помнит, кто его обидел, и возвращается, чтобы сообщить им об этом голосом холодного ветра. Тех, кто вежливо просит его рассказать свою историю, иногда награждают добрым словом, хотя призрак редко бывает в щедром расположении духа.
- id: ghoul
  flavor: >-
    Упырь — голодная мёртвая тварь, которая бродит по старым полям сражений и одиноким могилам, скребя землю в поисках пищи. Когти у него достаточно длинны, чтобы зацепиться за столб забора, а укус несёт приторную сладость, которая липнет к горлу. Караванная стража рано узнаёт, что упырь опаснее всего тогда, когда притворяется спящим путником на дороге.
- id: giant-ape
  flavor: >-
    Выше ворот амбара и сложена как обвал, гигантская обезьяна предпочитает тихий утёс драке, хотя и будет драться, если её раздразнить. Горные пастухи оставляют её в покое, и она отвечает тем же, делясь уступом с дикими плодами в весёлом молчании. Тот, кто её разозлит, узнает, что она способна метнуть валун через долину с поразительной точностью и удивительно острым чувством юмора.
- id: giant-badger
  flavor: >-
    Барсук размером с большую собаку роет ходы под живыми изгородями и воспринимает любую найденную нору как личное оскорбление. Фермеры ворчат из-за дыр, но ворчат тише, увидев, как он гонит лису через поле. Его нрав короток, челюсти сильны, и его ещё никто не уговорил отказаться от добычи.
