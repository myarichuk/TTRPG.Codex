- id: priest
  flavor: >-
    В каждой общине есть жрец, который знает, какие семьи в долгу и какие крыши нужно залатать до зимы. Этот служитель годами тихо нёс свою службу, сросся с ней, хорошо помнит обиды и ещё лучше замечает деньги. Когда беда приходит в приход, жрец отвечает огнём, тяжёлой булавой и голосом, который отчётливо слышен на всей площади.
- id: pseudodragon
  flavor: >-
    Псевдодракон — хитрый маленький родич великих драконов, достаточно крохотный, чтобы сидеть на плече, и достаточно умный, чтобы хранить секреты. Он превосходно понимает общий язык, но не может произнести ни слова, поэтому общается взмахом хвоста и выразительным взглядом. Многие мудрецы держат такого спутника, хотя сам зверёк обычно решает, кому можно доверять, раньше, чем это успевают сделать хозяева.
- id: pteranodon
  flavor: >-
    Птеранодоны гнездятся на морских утёсах и парят на тёплых восходящих потоках над волнами, а их длинные гребни ловят ветер, словно парус. Охотники они не умные, но терпеливые: падают на косяки рыбы и уносят всё, до чего могут дотянуться. Стая, устроившаяся на мысе, кажется почти мирной, пока одна из птиц не развернётся в воздухе с раскрытым клювом.
- id: purple-worm
  flavor: >-
    Под холмами есть туннель, достаточно широкий, чтобы проехать по нему телеге, а в его дальнем конце живёт пурпурный червь. Он движется сквозь твёрдую породу так же легко, как река течёт сквозь ил, оставляя за собой пустоту, которую местные жители избегают на протяжении поколений. Учёные, видевшие его зияющую пасть, до сих пор спорят, охотится ли он по звуку, по запаху или просто на беду путника.
- id: quasit
  flavor: >-
    Квазиты — мелкие, злобные существа, которые выбираются из трещин старых призывных кругов и устраивают пакости тем, кто их призвал. Они принимают любой облик, какой им позабавен, обычно пушистый или милый, и быстро становятся невидимыми, когда бой идёт плохо. Деревенский колдун, который держит такого фамильяра, скоро узнает, что существо интересует собственное удобство куда больше, чем чьи-либо приказы.
- id: rakshasa
  flavor: >-
    Это исчадие носит красивое лицо так же, как купец носит добрый плащ, и ожидает, что все встречные будут ему подчиняться. Его терпение безгранично, а договоры обязательны, хотя мелкий шрифт всегда выгоден тому, кто его написал. Дворы старых земель нанимали его в советники и лишь слишком поздно обнаруживали, что совет был нужен самому ракшасе.
- id: rat
  flavor: >-
    Крысы идут туда, где есть хлеб, и делают это столько же, сколько существуют амбары, которые можно разграбить. Одна крыса почти не опасна, но целая стая в канализации может опустошить кладовую быстрее любого вора. Повара учатся накрывать муку и держать детей поближе, потому что крысы терпеливы, умеют находить любую щель и всегда голодны.
- id: raven
  flavor: >-
    Вороны — умные птицы, которые собираются там, где есть смерть, и любят таскать блестящие вещицы в свои гнёзда. Этот ворон научился копировать голоса, которые слышал в лагере: шёпот здесь, щебет там, так что слушатели порой не могут отличить птицу от человека, которому она подражает. Старые предания горных деревень гласят, что ворон, назвавший имя путника, скоро принесёт дурные вести.
- id: red-dragon-wyrmling
  flavor: >-
    Детёныш — это дракон, который ещё не заслужил права на гордость, хотя старается изо всех сил. Чешуя у него цвета углей в золе, и он уже усвоил, что всё ценное, сложенное в кучу, стоит охранять зубами и норовом. Жители деревни, услышавшие на закате треск в холмах, должны запереть двери и надеяться, что молодой зверь ещё слишком жаден, чтобы заниматься ими.
- id: reef-shark
  flavor: >-
    Рифовые акулы патрулируют тёплое мелководье, где коралловые гряды разбивают прибой, и держатся свободными семьями, которые охотятся вместе. Они скорее любопытны, чем жестоки, и большинство ныряльщиков, встретивших одну из них, видят лишь тень, скользящую вдоль края рифа. Однако рыбаки быстро понимают, что акула, попробовавшая крови, вернётся с родичами и не обратит внимания ни на один крик с лодки.
- id: remorhaz
  flavor: >-
    Этот землерой живёт там, где холод проникает глубже всего, однако сам несёт внутри жар, словно печь, научившаяся ползать, в длинном членистом теле. Он прокладывает ходы сквозь лёд и камень с терпением, которое пугает шахтёров, и выныривает в облаке пара там, где порода начинает нагреваться. Выжившие описывают воздух рядом с ним как дрожащий, с запахом где-то между раскалённым железом и подгоревшим хлебом.
- id: rhinoceros
  flavor: >-
    Носорог — тяжёлый, близорукий травоядный, который доверяет рогу куда больше, чем глазам. Если его не трогать, он неспешно бродит по степи и не замечает всего, что не пахнет соперниками или опасностью. Но стоит ему решить броситься в атаку, как равнина, кажется, содрогается, и самые смелые пастухи учатся уступать ему дорогу.
- id: riding-horse
  flavor: >-
    Верховая лошадь — животное, которое везёт гонцов, лекарей и всех, кто не может позволить себе идти пешком. У неё ровный шаг, зоркий глаз и мало терпения к глупостям. Конюхи часто говорят, что хороший конь — тот, который доверяет всаднику, а мудрый всадник — тот, который никогда не даёт ему повода усомниться в нём.
- id: roc
  flavor: >-
    Рух считает горы своей полкой для гнёзд и видит всё внизу такими острыми глазами, что с высоты облаков способен разобрать письмо. Он может поднять быка с пастбища, овцу из загона или моряка с палубы, если ветер подвёл. Те, кто видел, как его тень пересекает долину, говорят, что небо словно темнеет, а свет будто наклоняется ближе, чтобы послушать.
- id: roper
  flavor: >-
    В тёмных углах пещер веревник выглядит как обычный сталагмит из серого камня, и именно так он любит оставаться незамеченным. Стоит беспечному путнику склониться слишком близко, как десяток липких нитей хлещет вверх и тянет добычу к пасти с зубцами. Шахтёры, заметившие подозрительно бугристую колонну, учатся постукивать по ней киркой, прежде чем опереться рукой.
- id: rust-monster
  flavor: >-
    Ржавник — шестиногий падальщик, который чует железо издалека и не может устоять перед таким угощением. Золото и самоцветы его не интересуют, только металл, что висит на поясах людей и лежит в их доспехах. Путник, увидевший, как его перистые усики тянутся к мечу, должен тихо отступить и надеяться, что клинок достаточно дешёвый, чтобы не жалко было его потерять.
- id: saber-toothed-tiger
  flavor: >-
    Задолго до первых полей саблезубый тигр крался по краям степей плавной походкой, похожей на дым, а его тяжёлые передние лапы были созданы для того, чтобы валить крупную добычу. Клыки у него так длинны, что кажутся скорее обрядовыми, хотя служат вполне практичной цели. Стада, пасшиеся недалеко от его охотничьих угодий, научились разбегаться при первом намёке на рыжий бок, мелькнувший в камышах.
- id: sahuagin-warrior
  flavor: >-
    Эти морские налётчики с рыбьими лицами — охотники, которые путешествуют по течениям организованными боевыми отрядами и считают поверхностный мир хорошо заполненной кладовой. Воины носят панцири из раковин и несут зазубренные копья, а торгуются с акулами так же спокойно, как фермер торгуется за волов. Прибрежные города, заметившие плавник, режущий воду у входа в гавань, запирают ворота и зажигают все фонари, какие у них есть.
- id: salamander
  flavor: >-
    Саламандры — существа из живого огня, которые плывут сквозь кузницы и вулканические жерла, светясь, словно угли, научившиеся двигаться. Их тела длинные и мускулистые, и они обвивают добычу раньше, чем жар превращает доспехи пленника в раскалённую клетку. Кузнецы, заключившие сделку с саламандрой, находят её щедрой лишь до тех пор, пока условия не будут прочитаны вслух.
- id: satyr
  flavor: >-
    Сатиры — дикие феи с козлиными ногами и талантом к музыке, от которой слушатели забывают о своих делах. Они тщеславны, остроумны и любят высмеивать всякого, кто слишком серьёзно относится к себе. Сатир сыграет весёлую мелодию, чтобы увести путников с тропы, а потом громко расхохочется, когда те заметят, что дорога позади исчезла.
- id: scorpion
  flavor: >-
    Скорпион — маленький бронированный охотник, который предпочитает сухие камни, тень под упавшими брёвнами и трещины старых стен. Клешни нужны ему, чтобы удерживать добычу, а загнутый хвост несёт жало, несоразмерное размеру животного. Кочевники пустыни каждое утро вытряхивают сапоги, и эта привычка спасла немало сонных путников.
- id: scout
  flavor: >-
    Разведчики — тихие люди, которые идут впереди каждого отряда и возвращаются с вестями, какие никто другой добыть не сумел бы. Они держатся опушек, читают грязь в поисках следов чужаков и носят длинный лук, который редко выпускают из рук. Большинство предпочли бы остаться незамеченными, чем вызывать восхищение, и хороший разведчик — тот, чей лагерь не находит никто.
- id: sea-hag
  flavor: >-
    Морские карги обитают в холодном мелководье, куда рыбацкие лодки подходят слишком близко к рифам. Кожа у них скользкая и зелёная, а лицо показывает красоту лишь тем, кто ещё не смотрел на него внимательно. Моряки, заметившие одну на поверхности, обычно понимают слишком поздно, что прекрасный голос принадлежит существу, которое желает им утонуть.
- id: seahorse
  flavor: >-
    Морские коньки дрейфуют в зарослях ламинарии, обвив хвостами морскую траву, и выглядят как самое безобидное существо в воде. Их маленькие тела способны рывком пронестись сквозь течение быстрее, чем можно ожидать от их размера, и дышат они только под волнами. Ныряльщики, видевшие такого, прильнувшего к рифу, нередко клянутся, что он смотрел на них в ответ.
- id: shadow
  flavor: >-
    Тень — это то, что остаётся, когда последнее тепло покидает человека и лишь очертания бродят по свету. Она скользит вдоль стен погребов и под дверными проёмами, отыскивая тусклые углы, где свет сдался, и питается лишь жизненной силой. Те, к кому она прикоснулась, редко остаются собой, и благоразумные семьи допоздна держат лампы зажжёнными.
- id: shambling-mound
  flavor: >-
    Шатающийся холм — это куча гнили и болотной травы, которая научилась ходить, и пахнет сырой землёй задолго до того, как появляется в поле зрения. Его щупальца потрескивают от накопленной молнии, впитанной из гроз, а существо, попавшее в объятия, медленно втягивается в сырую массу. Путникам, переходящим болото после грозы, стоит присмотреться к тростнику, прежде чем на него ступить.
- id: shield-guardian
  flavor: >-
    Страж-щит — высокий конструкт из клёпаных пластин, созданный для охраны гробницы или хранилища колдуна. Он подчиняется только владельцу связанного с ним амулета, и когда того ударяют, страж встаёт на его место, озарённый вспышкой силы, чтобы принять удар. Металл его изнашивается медленно, и побитый страж нередко восстанавливается сам, пока бой ещё продолжается.
- id: shrieker-fungus
  flavor: >-
    Визгун — приземистый фиолетовый гриб, который процветает во влажных пещерах, где терпеливо сидит и ждёт, пока к нему приблизится что-нибудь яркое или живое. Почуяв факел или проходящего путника, он начинает пронзительно визжать, и крик разносится по туннелям, созывая всё голодное поблизости. У пещерного народа есть поговорка, что визг — единственное честное предупреждение во тьме, и большинство из них научились ступать мимо на цыпочках.
- id: silver-dragon-wyrmling
  flavor: >-
    Детёныш серебряного дракона — молодой дракон с чешуёй, похожей на отполированные монеты, и он любопытнее, чем жесток, несмотря на острые зубы. Его морозное дыхание способно заморозить существо на месте, и оглушённая жертва может остаться неспособной к действию, пока детёныш перебирает добычу. Сокровища — его первая гордость и любимый повод для обид, поэтому гостям серебряного гнезда стоит держать монеты в карманах.
- id: skeleton
  flavor: >-
    Скелет — это голый каркас того, кого похоронили с мечом, и разум, что некогда жил в нём, давно умолк. Он выбирается из кургана или затопленного склепа по зову некроманта, неся ржавый клинок и лук, которому верности больше, чем здравого смысла. Его ухмылка никогда не меняется, и это наименее жуткая часть встречи с ним на тёмном кладбище.
