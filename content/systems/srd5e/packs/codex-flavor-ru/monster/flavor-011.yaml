- id: tyrannosaurus-rex
  flavor: >-
    Исполинский хищник выходит из папоротникового леса, его огромный череп полон кинжальных зубов, каждый длиной с предплечье человека. Передние лапы у него слишком малы для хватки, зато челюсти и тяжёлый хвост могут прижать и сломать всё, что он выберет. Стада разбегаются при первом глухом топоте, и даже другие большие рептилии обходят его стороной.
- id: unicorn
  flavor: >-
    Белая лошадь с витым рогом стоит на краю серебристолистного леса, и её шкура так ярка, что в сумерках кажется светящейся. Такие создания редко видны и редко к ним подходят, ведь говорят, что они испытывают сердца тех, кто приближается. Те, кто завоевал их доверие, обнаруживают, что единорог говорит лишь мягкими мыслями, и он охранит раненого путника мерцающим светом.
- id: vampire-bat
  flavor: >-
    Маленькая чёрная летучая мышь срывается с балок молчаливого особняка, и там, где её крылья касаются воздуха, по комнате разливается холод. Это благородный вампир в самом малом своём облике, он проскальзывает под ставнями и через замочные скважины, чтобы смотреть, как спит домочадцы. Глаза у него старые и умные, и возвращается он к истинному облику только тогда, когда выбрал жертву.
- id: vampire-familiar
  flavor: >-
    Худой, быстрый слуга стоит у плеча своего хозяина, одетый в изящную тёмную ткань и с поясом метательных ножей. Такие фамильяры связаны с вампиром кровью и нитью общего зрения, которая позволяет хозяину видеть их глазами. Они движутся с неестественной скоростью, скользят вдоль стен и по крышам и никогда не устают от поручения.
- id: vampire-mist
  flavor: >-
    Серый туман стелется низко над могилами, густой, как мокрая шерсть, и достаточно холодный, чтобы дыхание замерзало. Внутри него вампир способен проникать сквозь щели шире нити, просачиваясь под двери и в тесные углы, куда ни один здравомыслящий человек не станет заглядывать. Туман не говорит, но наблюдает с терпением, которое почти похоже на голод.
- id: vampire-spawn
  flavor: >-
    Худая фигура с длинными белыми пальцами и голодной улыбкой выбирается из свежевырытой ямы, стряхивая землю с серого савана. Порождения — выводок старшего вампира, созданный из осушенных и погребённых. Они лазают по стенам, как пауки, и хватают двумя когтистыми руками, притягивая жертву к укусу, после которого остаётся холодная, болезненная слабость.
- id: vampire-vampire
  flavor: >-
    Бледный аристократ в жёстком высоком воротнике стоит во главе длинного обеденного стола, и его глаза блестят в свете свечей, словно монеты. Вампиры такого рода живут веками, изучая дворы далёких городов и привычки тех, кто им служит. Они очаровательные хозяева и страшные враги, и каждую схватку воспринимают как приглашение, а не как угрозу.
- id: venomous-snake
  flavor: >-
    Маленькая оливково-зелёная змея свернулась на нагретом солнцем камне у ручья и пробует языком воздух в поисках следующей добычи. Укус её быстр, а яд для такого маленького существа силён, поэтому благоразумно держаться на почтительном расстоянии. Болотный народ часто говорит, что чем меньше змея, тем быстрее придёт лихорадка.
- id: violet-fungus
  flavor: >-
    Пучок фиолетовых щупалец вырастает из сырой ямы и медленно клонится к любому движущемуся рядом теплу. У этого роста нет глаз и мыслей, достойных упоминания, лишь медленное терпение и прикосновение, которое гниёт всё, за что он цепляется. Собиратели трав, потерявшие перчатку в его объятиях, обычно возвращаются домой, пахнущие плесенью, и больше за остальным не возвращаются.
- id: vrock
  flavor: >-
    Крылатый демон размером с упряжную лошадь вываливается из серо-жёлтого неба, его голова, похожая на голову грифа, увенчана костяными шипами. Крылья бьют со звуком рвущихся парусов, а когтистые руки рвут всё, до чего можно дотянуться. Когда он визжит, воздух воняет гнилью, а те, кто вдохнёт споры, часто чувствуют, как их конечности тяжелеют и замедляются.
- id: vulture
  flavor: >-
    Лысошеий падальщик кружит высоко над равниной, паря на тёплом воздухе без единого взмаха крыльев. Грифы терпеливы, неуклюжи на земле и совершенно равнодушны к запаху смерти. Где один приземлится, туда быстро слетаются другие, и небольшая стая может очистить тушу до голой кости прежде, чем кончится день.
- id: warhorse-skeleton
  flavor: >-
    Некоторые полевые командиры выводили боевого коня для атаки, и сама атака пережила всех, кто её затеял. Осталась костлявая верховая лошадь, которая всё ещё держит строй на холодном лугу, копыта её стучат с упрямым чувством порядка. Всадник никогда не вернётся, поэтому она просто трусит туда, где её в последний раз велели топтать.
- id: warhorse
  flavor: >-
    Боевых коней разводят ради веса и выдержки, и этот конь обладает и тем и другим в избытке. Он стоит спокойно рядом со своим хозяином, но незнакомцы, которые встают у него на пути, обнаруживают, что терпения у него куда меньше. Копыта — его любимый довод, и он размахивает ими, как парой тяжёлых молотов.
- id: warrior-infantry
  flavor: >-
    Каждый гарнизон держит несколько таких, в основном по простой причине: копьё и строй друзей дешевле героя. Пехотинец доверяет соседям в строю и стоит так близко к ним, что удар по одному становится ударом по всем. Из имущества у него лишь кольчужная рубаха, копьё и упрямая привычка не выходить из строя.
- id: warrior-veteran
  flavor: >-
    Такие ветераны пережили почти всех, кто их обучал, и сохранили привычку держать подбородок низко, а клинок наготове. Пластинчатый доспех вмят в десятке мест, и каждая вмятина — история, которую воин не расскажет. Берётся ли он за двуручный меч или выцеливает тяжёлый арбалет, его трудно поразить и ещё труднее застать врасплох.
- id: water-elemental
  flavor: >-
    Водяной элементаль — скорее внезапное решение, которое принимает озеро, чем существо. Он просачивается сквозь щели, не шире нити, а затем поднимается, чтобы заключить незадачливого путника в свою кипящую массу и держать, пока не кончится дыхание. Выжившие после его объятий обычно говорят, что холод был худшей частью, а тишина — почти такой же худшей.
- id: weasel
  flavor: >-
    Ласка — маленький комок злобы и точного расчёта: она проскальзывает в щель живой изгороди и выскакивает с другой стороны прежде, чем кто-либо успеет закончить крик. Она взбирается на всё, где есть трещина, и садится смотреть блестящими, недовольными глазами. Фермеры терпят их ради мышей, а мыши терпят ласок по причинам, которых никто так и не объяснил.
- id: werebear-bear
  flavor: >-
    В облике медведя это существо огромно: оно лазает по деревьям с лёгкостью того, кто владеет лесом. Сердце у него доброе, и порой оно оставляет мёд у тропы для путников, которых сочтёт заблудившимися. Однако нрав его вспыхивает быстро, когда лесу причиняют вред, и тогда оно вовсе не добро.
- id: werebear-human
  flavor: >-
    Одетый в обычную шерсть и с парой ручных топоров, этот вермедведь мог бы сойти за дровосека с щедрой натурой. Манеры у него терпеливые, а смех лёгкий, хотя грубые руки и долгие паузы перед ответом говорят о другом. Немногие, кто встретит его на деревенской площади, догадаются, во что он превращается при полной луне.
- id: werebear-hybrid
  flavor: >-
    Наполовину между двумя обличьями гибрид стоит высоко на мощных задних лапах, с медвежьей головой, увенчанной густым бурым мехом. Эта форма выбирается для тяжёлой работы, будь то таскание упавшего бревна или удар топором по бандиту, который задержался слишком долго. Голос его низкий и хриплый, но смысл понятен любому, кто готов слушать.
- id: wereboar-boar
  flavor: >-
    Этот небольшой кабан вспыльчив не по размеру, и клыки — лишь начало неприятностей. Он фыркает над упавшими плодами и роется в подлеске, а потом разворачивается на любого охотника, который подойдёт слишком близко. Его упрямство славно среди деревень, которые пытались его огородить, а аппетит к озорству гораздо больше, чем кажется.
- id: wereboar-human
  flavor: >-
    Одетый для охоты и с пучком дротиков, этот вервепрь похож на угрюмого разбойника, который засиделся допоздна. Смех у него громкий, комплименты грубые, и он привык плевать между фразами. Те, кто делит с ним стол, быстро учатся держать хорошее вино подальше от него, а сапоги — поближе к двери.
- id: wereboar-hybrid
  flavor: >-
    Гибрид ходит прямо на толстых ногах, держа голову низко, с кабаньими клыками, загибающимися из челюсти, которая никогда до конца не смыкается. Он создан для атаки и метает дротик с тем же мрачным удовольствием, с каким вышибает дверь с петель. Жители деревни говорят, что беда всегда приходит в этом облике, а остаток ночи уходит на уборку.
- id: wererat-human
  flavor: >-
    Незаметный в углу таверны, этот веркрыса прячет под плащом арбалет для руки и держит в голове реестр долгов. Манеры его точны, правила строже, а верность достаётся тому, кто платит вовремя. Соседи называют его честным торговцем, но те, кто с ним имел дело, обычно оказываются беднее и заметно тише.
- id: wererat-hybrid
  flavor: >-
    Наполовину человек, наполовину крыса: у гибрида узкая морда, усы, которые подёргиваются от неправильного запаха, и проворные руки, находящие карманы раньше, чем их хозяева что-либо заметят. Двигается он на цыпочках и лазает по стенам без лишней суеты. Такие гибриды редко встречаются при свете дня, и никто ещё не нашёл вежливого способа спросить почему.
- id: wererat-rat
  flavor: >-
    Эта крыса немного крупнее тех, что водятся в амбаре, и гораздо умнее в этом смысле. Она проскальзывает в подвалы, по карнизам и через щели старых стен, оставляя слабый запах страха и рассыпанного зерна. Те, кто увидел её не вовремя, клянутся, что её маленькие чёрные глаза знают их имена.
- id: weretiger-human
  flavor: >-
    Этот вертигр держится особняком и предпочитает длинный лук долгой беседе. В деревне он тихий охотник с терпеливым лицом и зорким глазом, из тех, кто замечает, кто уходит из трактира и когда. Отвечает он вежливо и никогда не подпускает никого настолько близко, чтобы узнать, куда он уходит на закате.
- id: weretiger-hybrid
  flavor: >-
    Выше дверного проёма и полосатый, как связка теней, гибрид движется с такой тишиной, что окружающие вдруг чувствуют себя под наблюдением. Он способен бесшумно подняться по склону, а затем замереть в густой траве так, что его почти забывают. Тигриная ухмылка — последнее, что помнят многие путники, прежде чем понимают, что тропа за ними пуста.
- id: weretiger-tiger
  flavor: >-
    В облике тигра это существо — длинная золотисто-чёрная тень, скользящая сквозь камыш, словно дым. Лапы его не оставляют следов на мокрой грязи, а хвост дёргается, только когда он доволен, что случается нечасто. Охотники, которые его выслеживают, обычно находят лишь слабое тепло на камне и ощущение, что за ними всё ещё наблюдают.
- id: werewolf-human
  flavor: >-
    Чаще всего этот вервольф выглядит как беспокойный путник с луком за спиной и привычкой появляться как раз тогда, когда разожгли костёр. Он водит компанию с себе подобными и охотится парами: один привлекает внимание, а другой бьёт из-за деревьев. Глаза его трудно прочесть, но волк внутри никогда не отходит далеко от поверхности.
