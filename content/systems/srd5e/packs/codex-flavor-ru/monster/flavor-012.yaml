- id: werewolf-hybrid
  flavor: >-
    Стоя прямо на двух ногах, гибрид нависает над большинством дверей и держит плечи, как таран. Лицо его наполовину волчье, наполовину что-то терпеливое и мрачное, а лук, который он несёт, — скорее любезность, чем предпочтение. Рядом воздух пахнет мокрой шерстью и железом, и собаки затихают, будто вспоминая что-то древнее своих имён.
- id: werewolf-wolf
  flavor: >-
    Это волк в старом смысле слова: худой, быстрый и уверенный в своём пути среди деревьев. Шерсть у него пятнистая, серая, и она сливается с корой, а вой разносится по холмам раньше, чем угаснет свет. Пастухи, услышавшие его, иногда пересчитывают стадо дважды, а волк, в свою очередь, тоже пересчитывает их.
- id: white-dragon-wyrmling
  flavor: >-
    Детёныш белого дракона — молодое и тщеславное существо, гордое своей бледной чешуёй и готовое доказать, что она крепче, чем кажется. Он любит ледники, тундровые озёра и корку снега, лежащую над северным перевалом. Его холодное дыхание скорее злобно, чем расчётливо, и ему очень нравится замораживать всё, что показалось ему слегка раздражающим.
- id: wight
  flavor: >-
    Умертвие когда-то было человеком с именем, обидой и незаконченным поручением, и именно обида держала его на ногах. Оно всё ещё носит кожаный доспех с заклёпками и несёт клинок и лук с терпением стража, который забыл о войне. Его прикосновение крадёт тепло и силы у живых, и оно ненавидит солнце по причинам, которые уже не помнит.
- id: will-o-wisp
  flavor: >-
    Этот огонёк блуждает над болотами и топями, мерцая и подрагивая, словно ему куда-то надо и он вовсе не собирается туда попадать. Путники, которые идут за ним, потом жалеют о своём любопытстве, и именно в этом и состоит замысел. Старые болотные жители оставляют на грязи маленькие приношения, чтобы огонёк был доволен, хотя никому ещё не удалось доказать, что это помогает.
- id: winter-wolf
  flavor: >-
    Зимний волк — крупный охотник с белой шерстью, который считает снежные поля своей кухней. Дыхание его сначала приходит холодным туманом, а потом чем-то хуже: оно прокатывается по поляне и оставляет траву жёсткой и серебристой. Известно, что великаны держали этих созданий как псов, и это многое говорит о великанах.
- id: wolf
  flavor: >-
    Серые охотники высоких сосновых краёв движутся семьями, которые делят один счёт обид и один аппетит. Их вой разносится по промёрзшим долинам задолго до того, как путник увидит их силуэты между стволами. Пастухи старых долин говорят, что стая всегда знает, какой ягнёнок слабее, и редко ошибаются в этом.
- id: worg
  flavor: >-
    Ворги — волки, которых научили слушаться, а это хуже, чем волк, который просто охотится. Гоблины ездят на них в сырые ложбины леса, и звери, кажется, наслаждаются жестокостью своих хозяев. Их глаза светятся знающим, кислым огнём, когда путник подходит слишком близко к костру.
- id: wraith
  flavor: >-
    Призрак — это то, что остаётся, когда обида переживает тело, с которым была связана. Он проходит сквозь стены и спящие комнаты, будто это тяжёлые занавески, оставляя за собой холодный сквозняк и слабый привкус железа. Старые погребальные обычаи некоторых холмистых городов существуют главным образом затем, чтобы эти духи не тревожили живых, и не всегда в этом преуспевают.
- id: wyvern
  flavor: >-
    Виверна — дракон в том же смысле, в каком лиса — волк: меньше в замыслах, острее в аппетите. Она охотится с высоких скал, падая на коз и путников с хлопком кожистых крыльев и хвостом, который заканчивается зазубренным жалом. Её яд на время делает жертву вялой, а этого обычно хватает виверне с избытком.
- id: xorn
  flavor: >-
    Зорн движется сквозь твёрдый камень так же, как пловец движется сквозь тёплое озеро, не оставляя за собой ни одной трещины в породе. Шахтёры, слышавшие тихий стук в стенах, скоро учатся прятать золото в другом месте. У него рот, полный зубов, и нет никакого желания что-либо объяснять.
- id: young-black-dragon
  flavor: >-
    Молодой чёрный дракон обосновался в болоте, где вода пахнет ржавчиной, а камыш бледнеет. Чешуя его блестит, как мокрый сланец, и он усвоил, что терпеливое болото — кладовая, которая никогда не пустеет. Путники, зашедшие в топь без предупреждения, порой возвращаются лишь историями, которые рассказывают лягушки.
- id: young-blue-dragon
  flavor: >-
    Караваны в пустыне узнают молодого синего дракона по треску в воздухе перед бурей. Он ведёт учёт в песке, с ужасающей точностью пересчитывает каждую дань и ожидает, что долг будет уплачен в срок. Те, кто торгуется с ним, обнаруживают, что условия записаны честно, а мелкий шрифт всегда его собственный.
- id: young-brass-dragon
  flavor: >-
    Латунные драконы — самые болтливые из молодых драконов: они заговорят путнику уши до глухоты, прежде чем решат, съесть ли остальное. Они собирают песни, шутки и сплетни, как другие собирают монеты. Их усыпляющее дыхание считается грубым способом завершить разговор, хотя молодые настаивают, что это лишь любезность.
- id: young-bronze-dragon
  flavor: >-
    Моряки на сером побережье говорят, что бронзовый дракон будет охранять гавань столько, сколько кто-либо помнит, не требуя монеты взамен. Он плавает так же легко, как летает, и считает тонущий корабль делом чести, а не поводом для добычи. Если же ему приходится вразумить упрямого капитана, одно дуновение его дыхания отправляет капитана на палубу, и урок редко забывается.
- id: young-copper-dragon
  flavor: >-
    Медные драконы превращают каждое противостояние в головоломку, которую решают с помощью шутки и скрытой ловушки. Они лазают по отвесным скалам с весельем ребёнка на лестнице и оставляют загадки, нацарапанные на камнях, мимо которых проходят. Караванщики рассказывают о молодом медном драконе, который однажды подменил каждый мешок соли галькой, а затем написал извинение в стихах.
- id: young-gold-dragon
  flavor: >-
    Учёные старых дворов описывают молодого золотого дракона как терпеливого дипломата с печью вместо груди. Он предпочитает выигрывать споры в большом зале, хотя охотно войдёт в горящее поле, чтобы спасти скот фермера. Его слово считается нерушимым, а позолоченная чешуя, как говорят, сияет ярче всего, когда он говорит правду.
- id: young-green-dragon
  flavor: >-
    Лесные отшельники шепчутся, что молодой зелёный дракон однажды принял облик соседа, прежде чем тот бесследно исчез. Он собирает секреты охотнее, чем монеты, и обменивает их на услуги, которые связывают торговца на всю жизнь. Яд его медлителен, а манеры безупречны, что делает его опаснее как гостя за ужином.
- id: young-red-dragon
  flavor: >-
    Горы золота обычно манят молодых красных драконов, как лампа манит мотыльков, и дракон редко рад делиться светом. Он тщеславен насчёт своих рогов, быстро обижается и любит объявлять о своём прибытии столбом жара. Горные деревни рано учатся запирать двери и прятать лучшее серебро подальше от глаз.
- id: young-silver-dragon
  flavor: >-
    Архивисты утверждают, что молодой серебряный дракон ведёт более точную летопись долины, чем сама долина. Он читает старые письма проходящим пастухам вслух и поправляет их даты терпеливым, слегка усталым вздохом. Когда он гневается, воздух вокруг его крыльев превращается в иней, и даже самый упрямый историк быстро учится соглашаться.
- id: young-white-dragon
  flavor: >-
    Северные охотники судят о молодом белом драконе не по уму, а по морозу, который он оставляет на всём, к чему прикасается. Он не особенно умён и не терпит загадок, поэтому предпочитает засаду разговору. Его логово обычно расположено в замёрзшем ущелье, где лёд слабо светится голубым, а кости, разбросанные по полу, редко бывают обглоданы дочиста.
- id: zombie
  flavor: >-
    Зомби — неуклюжие, затянувшиеся остатки смерти, которая не была доведена до конца. Они ковыляют к живым с неторопливой, почти учтивой настойчивостью и способны выдержать удивительно много ударов, прежде чем окончательно остановиться. Жители деревни держат ворота запертыми, а собак — в доме, потому что единственный настоящий талант зомби — отказываться лечь.
