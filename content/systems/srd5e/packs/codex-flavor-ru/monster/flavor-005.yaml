- id: giant-bat
  flavor: >-
    Размером с охотничью борзую и почти так же бесшумная, гигантская летучая мышь устраивается на ночлег в пещерах и предоставляет эху искать добычу вместо себя. Шахтёры учатся различать слабый писк, который предшествует взмаху крыльев, и держать фонари зажжёнными в глубоких штреках. Это не жадный охотник, но голодная летучая мышь в тёмном туннеле может оказаться на удивление смелой.
- id: giant-boar
  flavor: >-
    Дикий кабан размером с ломовую лошадь, гигантский кабан бросается в атаку, опустив голову и выставив клыки, которыми отшвыривает всё, что оказывается на пути. Ярость его растёт по мере того, как он теряет кровь, поэтому раненый кабан опаснее любого здорового, и охотники усваивают этот факт на собственном горьком опыте. Жители деревень засевают поля по другую сторону леса и оставляют болото кабанам.
- id: giant-centipede
  flavor: >-
    Членистый охотник длиной с человеческую руку, гигантская сороконожка живёт под гниющими брёвнами и в трещинах старых стен. Она движется быстрее, чем кажется, проносясь по полам и вверх по стенам с шуршанием ножек, похожим на шелест сухих листьев, которые ветер гонит по тропе. Укус оставляет резкую, долго не проходящую боль, и осторожный путник перед сном вытряхивает сапоги и постель.
- id: giant-constrictor-snake
  flavor: >-
    Змея толщиной с бочку и терпеливая, как спящий холм, гигантский удав ждёт в речном тростнике, пока мимо не пройдёт что-нибудь тёплое. Когда кольца смыкаются, он не торопится: он лишь сжимается, вдох за вдохом, пока у добычи не останется сил для борьбы. Речной люд рассказывает детям, что мелькнувшая в иле бледная чешуя — знак выбрать длинную дорогу домой.
- id: giant-crab
  flavor: >-
    Краб шириной с обеденный стол живёт в приливных заводях и мелких заливах, где поджидает неосторожную сеть, наполовину зарывшись в песок. Рыбаки аккуратно чинят сети у камней, ведь краб, вцепившийся в ногу, редко разжимает клешни до того, как отхлынет прилив. Его панцирь годится на красивые доспехи, поэтому местные кузнецы с тихим интересом следят за каждым крабом, забредшим на мелководье.
- id: giant-crocodile
  flavor: >-
    Крокодил, способный одним укусом взять лошадь, гигантский крокодил правит медленными протоками болота и не терпит ничего, что держится на воде. Он может недвижно лежать под мутной поверхностью дольше, чем хватило бы терпения у рыбака, а затем взрывается брызгами и мышечной силой. Жители деревень гребут на лодках парами и никогда не опускают руку в воду — урок, который река преподаёт достаточно часто.
- id: giant-eagle
  flavor: >-
    Гордая птица высоких скал, гигантский орёл стережёт долины и порой слетает вниз, чтобы помочь тем, кто попал в беду. Перья его мерцают слабым золотистым светом, а голос разносится по холмам, словно колокол, который никогда не умолкает до конца. Пастухи, спасённые с уступа скалы, рассказывают эту историю с благоговением, а некоторые оставляют на камне миску молока в знак благодарности.
- id: giant-elk
  flavor: >-
    Рога шире телеги и шкура цвета свежего снега — гигантский лось движется по лесу, словно тихое обещание, которое сдержали. Лесной народ говорит о нём с почтением, а те, кто встречает его на поляне, порой надолго становятся легче на душе. Он не станет нести всадника и не даётся охотникам, и мудрый оставит ему тропу, по которой тот может уйти с миром.
- id: giant-fire-beetle
  flavor: >-
    Жук размером с кошку, с двумя светящимися железами, которые позволяют ему охотиться в тёмных туннелях так же легко, как на солнечном свете. Шахтёры ценят их за свет и боятся за жар, ведь загнанный в угол жук кусается и оставляет небольшой ожог. Их свечение ровное и весёлое, и старые смотрители ламп утверждают, что это более приятная компания, чем большинство людей, которые их нанимают.
- id: giant-frog
  flavor: >-
    Лягушка такой ширины, что в неё поместилась бы тачка, гигантская лягушка таится в болотах и мелких прудах, дожидаясь, пока неосторожный олень зайдёт достаточно близко, чтобы его проглотить. Пастухи держат собак на коротком поводке у воды, а детей с раннего возраста учат, что всплеск в камышах не всегда означает рыбу. Она сидит очень неподвижно, пока не ударит, а потом одним прыжком пересекает топь.
- id: giant-goat
  flavor: >-
    Коза с рогами, как витое железо, и нравом упрямого быка, гигантский козёл владеет высокими пастбищами и всем, что на них есть. Пастухи сгоняют стада в долину до первых снегов, ведь козёл охотно взбирается на скалу и сбрасывает с неё соперника. Его баран — предмет гордости и синяков, и известно, что он сбивал с горной тропы странствующего торговца.
- id: giant-hyena
  flavor: >-
    Крупнее любой упряжной лошади, гигантская гиена бродит по сухой траве, где располагаются караваны. Её смех слышен дальше, чем её тень, и пастухи учатся узнавать его раньше, чем видят зверя. Как только жертва истекает кровью, зверь пробуждает ярость, которая гонит его обратно в гущу схватки.
- id: giant-lizard
  flavor: >-
    Гигантская ящерица — терпеливый скалолаз, цепляющийся за утёсы и разрушенные стены чешуйчатыми пальцами, которым не доверило бы себя ни одно разумное существо. Поселенцы пустыни после заката настороженно поглядывают на кладку, ведь ящерица охотится из засады сверху. Это простое животное, которое не интересуют загадки, — ей нужна лишь ближайшая тёплая трапеза.
- id: giant-octopus
  flavor: >-
    Гигантский осьминог живёт в холодной тёмной воде под морскими утёсами и среди затонувших корпусов, где его восемь щупалец могут так же легко обвить киль лодки, как ногу рыбака. Моряки, переживших встречу с ним, прежде всего описывают чернила — чёрное облако, которое превращает море в слепую комнату. Рыбацкий люд оставляет у берега дары из солёной рыбы, что является либо уважением, либо очень практичной взяткой.
- id: giant-owl
  flavor: >-
    Гигантская сова — небесный вестник, который держится старых лесов и высоких наблюдательных постов и смотрит на мир с терпением, почти учтивым. Она не говорит ни на одном языке посетителей, однако понимает каждое слово, произнесённое под её насестом, и не раз помогала потерявшимся путникам выбраться. Деревенские чародеи в старых коллегиях говорят, что сова, которая сидит близко, оценивает слушателя, и ошибаются они редко.
- id: giant-rat
  flavor: >-
    Гигантская крыса примерно с большого кота, с длинным голым хвостом и привычкой ходить стаями по канализации, зернохранилищам и под старыми мостами. По отдельности они — досадная помеха; вместе они причина, по которой погреба запирают на засов. Горожане говорят детям, что крыса, которая остановилась и смотрит на тебя, пересчитывает выходы.
- id: giant-scorpion
  flavor: >-
    Гигантский скорпион ждёт под камнями пустыни со сложенными клешнями, терпеливый мастер своего дела, который точно знает, как далеко может дотянуться его хвост. Яд его достаточно силён, чтобы замедлить сердце крепкого путника, поэтому караванные стражи в сухих землях вешают на лагерь колокольчики. Скорпион охотится не ради забавы: он просто берёт всё, что подходит близко к песку.
- id: giant-seahorse
  flavor: >-
    Гигантский морской конёк дрейфует в тёплом мелководье и среди коралловых проливов, держась вертикально и неторопливо, пока что-нибудь не возмутит воду. Когда он бросается в атаку, удар оказывается куда тяжелее, чем можно было бы подумать по его хрупкому телу, и рыбаки усвоили, что спокойное покачивание морского конька вовсе не признак милосердия. Прибрежные художники рисуют их с коронами из кораллов — лестный портрет, который мало кто из встречавших конька когда-либо видел.
- id: giant-shark
  flavor: >-
    Гигантская акула — громадный хищник открытых вод, настолько длинный, что команда лодки ощущает, как над ними проходит тень, прежде чем увидит плавник. Её укус губителен, а аппетит становится острее в тот миг, когда в воде появляется кровь. Старые портовые песни предупреждают, что акула, которая однажды закружила, будет кружить снова, и разумный капитан поворачивает к берегу.
- id: giant-spider
  flavor: >-
    Гигантский паук плетёт ловушки между старыми деревьями и в заброшенных шахтах, нити настолько тонкие, что путники входят в них, прежде чем заметить. Лесорубы в горных деревнях помечают линии паутины яркой тканью — привычка, которая спасла не одну жизнь. Укус его несёт медленный яд, и паук терпеливо ждёт, пока жертва перестанет биться.
- id: giant-toad
  flavor: >-
    Гигантская жаба сидит в тростниковых болотах и на илистых бродах, широкая и раздутая, с виду почти комичная, пока не прыгнет. Её глотание пугает деревенских детей больше всего: существо некоторое время держит добычу живой у себя в брюхе, а истории о нём говорят недобрые вещи. Болотный народ на закате отгоняет скот подальше от камышей и никогда не купается в одиночку.
- id: giant-venomous-snake
  flavor: >-
    Гигантская ядовитая змея — гибкий охотник с тёмными полосами на теле, обитающий на речных берегах и в зарослях болот, куда подвижнее, чем подсказывают её тяжёлые кольца. Она бьёт с безопасного расстояния, и это научило нескольких осторожных фермеров ходить по берегу с длинной палкой. Яд её медленный и мрачный, а старые травницы держат горькое средство наготове для каждого дома у воды.
- id: giant-vulture
  flavor: >-
    Гигантский гриф кружит над полями сражений и умирающими городами, терпеливый падальщик, который, кажется, появляется раньше самой беды. Его рваная рана оставляет после себя болезнь, так что даже небольшая царапина может надолго сделать путника вялым и разбитым. Учёные старых коллегий спорят, зверь он или нечто худшее, а грифы так и не высказали своего мнения.
- id: giant-wasp
  flavor: >-
    Гигантская оса висит в воздухе над садами и сенокосами, крылья её сливаются в размытое пятно, звучащее как далёкая пила. Пчеловоды долины говорят о ней с особым страхом, ведь она защищает гнездо с такой яростью, какую мало какие ульи способны пережить. Жало её быстрое, а яд долго держится, поэтому тот, кого ужалили, должен немедленно сесть и ждать, пока опухоль спадёт.
- id: giant-weasel
  flavor: >-
    Гигантская ласка — гибкий и смышлёный охотник живых изгородей и амбаров, достаточно быстрый, чтобы проскользнуть в щель не больше сапога. Фермеры винят её в пропавших курах и изредка исчезающих ягнятах, хотя на открытом месте её редко увидишь. Зубы у неё маленькие, но очень острые, а зверь охотнее загоняет добычу в угол, чем сражается за неё.
- id: giant-wolf-spider
  flavor: >-
    Гигантский паук-волк охотится без паутины, мчась по открытой местности с такой скоростью, что наблюдатели сомневаются в собственных глазах. Он живёт в норах под упавшими брёвнами и в сухих земляных обрывах и выходит на закате, чтобы подкараулить всё, что достаточно мало, чтобы его унести. Травники держат банку его яда для притупления боли, хотя укус сам по себе вовсе не мягок.
- id: gibbering-mouther
  flavor: >-
    Бормочущая пасть — груда ртов, глаз и влажной плоти, которая дрейфует по топкой земле, бормоча на десяток сломанных голосов одновременно. Тот, кто слышит её лепет, теряет нить собственных мыслей, и спотыкающийся путник может шагнуть прямо в поджидающие рты. Учёные старых коллегий числят её досадной помехой болот, и это довольно мягко сказано о существе, которое поглощает всё, что кусает.
- id: glabrezu
  flavor: >-
    Глабрезу — огромный демон с сокрушающими когтями и хитростью, из тех торговцев, которые предлагают выгодную сделку, а потом с удовольствием зачитывают вслух мелкий шрифт. Его клешни способны крепко удержать пленника, пока заклинания вскрывают его волю, и застать его врасплох почти невозможно. Призыватели, которые вызывают его из нижних миров, редко бывают довольны условиями, на которые согласились, и старые коллегии хранят долгие списки тех, кто пытался.
- id: gladiator
  flavor: >-
    Гладиатор сражается на песчаных аренах перед толпами, которые жаждут зрелищ и острых ощущений, — обученный профессионал, в равной мере артист и солдат. Его копейные залпы точны, а удачно рассчитанный удар щитом способен сбить соперника с ног посреди красивой речи. Устроители объявляют публике, что гладиатор борется ради славы, хотя большинство бойцов сражаются ради платы и шанса выйти живыми.
- id: gnoll-warrior
  flavor: >-
    Гнолл-воин — разбойник с головой гиены, который сражается костяным луком с дикой радостью, обращающей испуганных жителей деревень в бегство. Гноллы путешествуют налегке, грабя сухие равнины и покинутые крепости, и каждая победа завершается воем, слышным во всей долине. Разведчики утверждают, что банды следуют за вожаком по запаху, и это, пожалуй, единственное, что они воспринимают всерьёз.
