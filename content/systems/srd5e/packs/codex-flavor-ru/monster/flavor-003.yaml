- id: camel
  flavor: >-
    Верблюд — терпеливое животное сухих равнин и соляных озёр, устойчивое на ногах и не замечающее жары, которая свалила бы лошадь. Его горбы запасают пищу на скудные сезоны, а длинные ресницы придают взгляду вид мягкого неодобрения, которое многие путники находят трудно простить. Караванщики ценят его выше почти любого другого животного, хотя и признают вполголоса, что у него есть чувство юмора.
- id: cat
  flavor: >-
    Кошка — небольшой, самодостаточный охотник, который научился жить рядом с людьми на собственных условиях. Она спит на солнечных подоконниках, забирается на всё, откуда есть вид, и считает большинство домашних правил предложениями, сделанными более медленными созданиями. Мыши в амбаре знают, каково её внимание, и хозяева, которые так и не могут по-настоящему её себе присвоить, знают это не хуже.
- id: centaur-trooper
  flavor: >-
    Кентавр-солдат — воин высоких трав, соединение коня и выносливого всадника, который сражается за народ, которому поклялся служить. Его доспехи ухожены, копьё смазано, а манеры лучше, чем у большинства трактирных драчунов. Пограничные деревни спят спокойнее, когда один из таких всадников стоит дозором на холмах, хотя он настаивает, что вся заслуга принадлежит лошадям.
- id: chain-devil
  flavor: >-
    Цепной дьявол — мрачный надзиратель адских рядов, скованный громыхающим железом и всегда носящий при себе цепь для того, кто выйдет из строя. Он служит высшим демонам с угрюмой дисциплиной и не упускает случая напомнить низшим душам, как легко может сжаться хватка. Тот, кто слышал звон его цепей в тёмном коридоре, редко забывает этот звук.
- id: chimera
  flavor: >-
    Химера — три зверя, сшитые в одно злое тело: львиная голова, козлиная мощь и драконьи крылья, которые так и не научились работать сообща. Каждая голова требует собственной добычи, и в результате получается охотник быстрый, раздражительный и легко отвлекаемый. Пастухи держат стада за высокими изгородями, а собак — при себе, ведь аппетит химеры никогда не слушал ничьих советов.
- id: chuul
  flavor: >-
    Чуул — длинноногая аберрация тёмных, солоноватых вод, вся из клешней и чувствительных усиков, которые дрейфуют в мути, словно вопрос, который никто не хотел слышать. Под панцирем он хранит трофеи своих уловов и питает слабость к глубоким местам, куда не доходит солнце. Ныряльщики, работающие возле его вод, держат лампы зажжёнными, а глаза — на берегу.
- id: clay-golem
  flavor: >-
    Глиняный голем — громоздкая фигура, слепленная из влажной земли и наделённая целью бережными словами создателя, с тяжёлой поступью и лицом, которое никогда не меняется. Он делает именно то, для чего был создан, и ничего сверх того, что утешает его создателей и тревожит всех остальных. Закончив своё создание, он редко говорит, и его молчание обычно звучит как приговор.
- id: cloaker
  flavor: >-
    Плащеносец — плоский, тёмноспинный странник, который висит в тенях и ждёт своего момента, чтобы упасть на беспечных путников. На его брюхе — пасть, полная зубов, а на хвосте — жалящие шипы, которыми он пользуется с небрежной уверенностью существа, которому никогда не было стыдно. Одни учёные полагают, что плащеносец просто скучает, а другие считают его самым терпеливым созданием во тьме.
- id: cloud-giant
  flavor: >-
    Облачный великан живёт высоко над низинами, в башнях из бледного мрамора, которые, кажется, плывут среди облаков. Манеры у него учтивые, а любопытство огромно, и он судит дела мелкого народа с терпением, которое может показаться снисходительностью. Гости, поднявшиеся в его палаты, обычно получают пир, долгую беседу и ясное понимание того, насколько малы их собственные беды.
- id: cockatrice
  flavor: >-
    Кокатрис — маленькая пернатая диковина с крыльями курицы, когтями чего-то гораздо более древнего и взглядом, который лучше не испытывать. Крестьяне держатся настороженно далеко от его гнезда и велят детям медленно проходить мимо курятника. При всей своей угрозе это создание привычек: в основном оно клюёт зерно и ругает всякого, кто подходит слишком близко.
- id: commoner
  flavor: >-
    Обыватель — это просто любой, кто работает в поле, чинит сети или держит хлеб тёплым в деревенской печи. Именно они знают дороги, погоду и сплетни раньше знати и редко поднимают из-за этого шум. Большинство искателей приключений начинают свой путь с того, что слушают такого человека, и большинство заканчивает, сожалея, что слушали его недостаточно внимательно.
- id: constrictor-snake
  flavor: >-
    Удав — тяжёлая, мускулистая змея речных берегов и нагретых солнцем камней, достаточно терпеливая, чтобы ждать целое утро, пока добыча сама не подойдёт поближе. Охотится она, туго свиваясь в кольца, и плавает так же легко, как ползает, отчего рыбацкие деревни по ночам нервничают из-за лодок. Её терпение легендарно, но чутьё на время — ещё лучше.
- id: copper-dragon-wyrmling
  flavor: >-
    Детёныш медного дракона — проказливый маленький дракон холмов и сухих оврагов, который вечно испытывает всё, до чего может дотянуться. Он любит загадки, розыгрыши и выражение на лице путника, когда загадку разгадали слишком быстро. Под подтруниванием он весьма щедр и готов отдать монету или подсказку всякому, кто заставит его рассмеяться.
- id: couatl
  flavor: >-
    Коатль — пернатый змей верхнего неба, яркий окраской и изящный в словах. Те, кто с ним встречается, часто получают мягкую лекцию о честности, прочитанную с большей теплотой, чем у большинства людей за ужином. Он быстро исцеляет раненых и медленно прощает всякую жестокость, совершённую у него на глазах, а сброшенные перья какое-то время светятся слабым светом.
- id: crab
  flavor: >-
    Крошечный и защищённый панцирем, отполированным рассолом, краб бегает по приливным отмелям и внимательно следит за всем, кто слишком долго задерживается у его норы. Рыбаки мелких городков научились проверять сети на наличие его щипающих клешней, хотя большинство крабов хотят лишь тихого участка мокрого песка. Он дышит и воздухом, и водой, что делает его упрямым соседом для всякого, кто пытается его прогнать.
- id: crocodile
  flavor: >-
    Крокодил — длинный, низкий речной охотник, который лежит у берега так неподвижно, что его легко принять за упавшее бревно, пока что-нибудь неосторожное не подойдёт к кромке воды. Его челюсти достаточно тяжелы, чтобы утащить взрослое животное под воду и держать там, и речной народ давно научился держать бельё и коз подальше от камыша. Терпеливый и хладнокровный, он счастливее всего там, где ил тёплый, а рыбы много.
- id: cultist-fanatic
  flavor: >-
    Некогда тихий смотритель погреба, этот фанатик горел такой яростной преданностью, что соседи перестали спрашивать, кому он предан. Он носит клинок, который слабо гудит, когда он говорит о своих хозяевах, и имеет привычку называть мелкие одолжения чудесами. Среди маленьких сект, собирающихся в забытых часовнях, он единственный, кто никогда не спит и никогда не сомневается.
- id: cultist
  flavor: >-
    Культисты такого рода обычно бывают местными лавочниками, писарями или фермерами, которым пообещал что-то лучшее незнакомец в капюшоне. Они носят простую кожу и чаще держат серп, чем меч, и после заката имеют обыкновение исчезать с деревенской площади. Их проповеди коротки, вера громка, а ножи острее, чем кто-либо ожидал.
- id: darkmantle
  flavor: >-
    Тёмная мантия висит на потолках пещер, словно сложенный клочок мокрой ткани, и ждёт, пока что-нибудь тёплое не пройдёт под ней. Она падает с внезапной липкой тяжестью и обвивает жертву чернильным саваном, после чего даже самый храбрый факелоносец обнаруживает, что свет не достаёт далеко. Шахтёры глубоких штолен говорят, что это скорее не существо, а пятно мрака, которое случайно движется.
- id: death-dog
  flavor: >-
    Пёс смерти выглядит как тощая, облезлая гончая, пока его пасть не раскроется и не выпустит запах старой гнили. Эти охотники бегают парами по чёрным холмам, описывая круги вокруг лагеря путника, пока один не бросится, а другой не укусит с фланга. Волки и пастухи обходят их стороной, ведь один укус такого пса оставляет рану, которая никогда до конца не затягивается.
- id: deer
  flavor: >-
    Олени движутся по опушке леса с грацией, которая заставляет их почти парить, и при первом признаке опасности вскидывают белые хвосты. Большинство предпочло бы бегство драке, хотя испуганный самец опустит голову и боднёт всё, что загородит ему путь. Жители высокогорья вырезают из их костей иглы, а из шкур шьют мягкие перчатки, но старых оленей-быков по-прежнему не трогают.
- id: deva
  flavor: >-
    Дэва спускается с неба с крыльями, похожими на сложенные паруса, и светом, от которого тени съёживаются у неё на пути. Эти вестники берут сторону обиженных и носят булаву, которая звенит, словно колокол, когда ударяет. Те, кто сражался с дэвой, часто говорят, что это был не бой, а расплата, и что существо, казалось, сожалело о каждом ударе, который вынуждено было нанести.
- id: dire-wolf
  flavor: >-
    Лютый волк — это то, что происходит, когда обычный волк становится слишком большим для рассказов о себе и начинает им соответствовать. Его стая движется по снегу как единое существо, загоняя путников к повороту дороги, где ждёт засада. Матери в северных долинах вешают на ворота колокольчики в сумерках, и звенят они громче любого охотничьего рога.
- id: djinni
  flavor: >-
    Джинн — дух движущегося воздуха, не связанный ни с каким хозяином, кроме собственного развлечения, и он может быть щедрым или жестоким в зависимости от смекалки того, кто к нему обращается. Он появляется на внезапном ветру, который поднимает песок во вращающиеся столбы и заставляет торговцев хвататься за шляпы. Старые торговцы до сих пор торгуются с небом о милости, говоря осторожно, ведь обещание, данное джинну, им редко забывается.
- id: doppelganger
  flavor: >-
    Доппельгангер носит лица людей, с которыми встречался, и носит их достаточно хорошо, чтобы друзья чаще всего замечали разницу последними. Он предпочитает долго изучать намеченную жертву, прежде чем вступить в дело, выучивая привычки и страхи, пока не сможет говорить её голосом. Когда его раскрывают, истинный облик — бледное, гладкое существо с длинными конечностями и глазами, которые, кажется, никогда не моргают.
- id: draft-horse
  flavor: >-
    Тягловые лошади — широкие, терпеливые животные, выведенные для того, чтобы тащить то, что сломало бы более слабого зверя. Их копыта достаточно тяжелы, чтобы греметь осью повозки, когда они бьют о землю, а нрав у них спокойный, терпимый почти ко всему, кроме грубых окриков. Фермеры низинных деревень часто говорят, что хорошая тягловая лошадь вспашет поле вдвое быстрее, чем её погонщик жалуется.
- id: dragon-turtle
  flavor: >-
    Драконья черепаха несёт на спине гору обросшего ракушками панциря, и моряки, принявшие её за остров, обычно жалеют о высадке. Её дыхание — обжигающее облако пара, которое способно содрать краску с корпуса, а челюсти могут разломить лодку пополам. Морской народ рассказывает о городах, построенных на костях её предков, хотя никто так и не нашёл эти города.
- id: dretch
  flavor: >-
    Дретч — маленький пузатый демон с серой кожей и зловонием, которое приходит задолго до него самого. Эти существа служат любому жестокому хозяину, который их примет, обычно как падальщики, дозорные или досадная помеха, от которой никто не может избавиться. Они бормочут друг другу на общем ментальном языке, слышном ближайшим ушам, и смеются, когда кого-то тошнит.
- id: drider
  flavor: >-
    Драйдер — наполовину паук, наполовину нечто, что когда-то ходило прямо, озлобленное существо с яростной обидой на мир, который его создал. Его нижняя часть скользит по потолкам и стенам с пугающей лёгкостью, а взгляд задерживается на всяком, кто когда-то смотрел на него свысока. Пещеры и тёмные руины — его излюбленные жилища, и он избегает солнца так, будто сам свет — оскорбление.
- id: druid
  flavor: >-
    Друиды хранят старые тихие договоры между дикими местами и людьми, которые живут рядом с ними, и бывают куда терпеливее поселенцев, которым дают советы. Друид может призвать бурю из терниев или разбудить саженец от сна, и большинство из них скорее доведёт спор до конца разговором, чем дракой. Те, кто переходит им дорогу, быстро узнают, что память друида на обиды так же длинна, как память старого дуба.
