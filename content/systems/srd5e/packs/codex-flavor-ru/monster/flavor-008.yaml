- id: mummy
  flavor: >-
    Тугие бинты, намотанные поверх давней скорби, держат мумию на ногах долго после того, как тело должно было сдаться. Она медленно движется по сухим склепам, и её гниющие кулаки по-прежнему верны тому, кто связал её клятвой с гробницей. Одного неподвижного взгляда часто достаточно, чтобы обратить грабителей могил в бегство, и они редко задумываются, что же она охраняла.
- id: nalfeshnee
  flavor: >-
    Нечто среднее между громоздкой обезьяной и обрюзгшим тираном, налфешни восседает на собственном богатстве голодных сделок. Голос его мягок и рассудителен, и оттого его обещания становятся ещё опаснее. Низшие дьяволы приносят ему дань из далёких бездн, а он одаривает их скучающей, снисходительной добротой, которая очень похожа на угрозу.
- id: night-hag
  flavor: >-
    Сутулая и терпеливая, ночная карга ведёт маленькую книгу учёта всех сделок, заключённых в тихих уголках мира. Она принимает добрый облик, навещая колыбели и постели больных, и редко оказывается без ласкового слова наготове. Её шабаши собираются там, где огонь почти догорел, и делятся секретами, которые стоят дороже любой монеты.
- id: nightmare
  flavor: >-
    Подкованный углями и окружённый беспокойным сиянием, кошмар скачет через спящие деревни, с благословением или проклятием всадника. Глаза его горят, как угли, а там, где касаются воздуха его копыта, долго держится слабый свет. Конюхи, которые пытались объездить такого зверя, обычно находят утром, как они смотрят в стропила и ухмыляются.
- id: noble
  flavor: >-
    В каждом значительном городе найдётся дворянин, который считает гавань и зернохранилища по праву принадлежащими его семье. Он одевается в начищенный нагрудник под бархатным плащом и улыбается зубами, которым никогда не недоставало ужина. Большинство его споров решается остроумным словом, хотя он держит рапиру для тех редких случаев, когда слова изменяют ему.
- id: ochre-jelly
  flavor: >-
    Капая с влажных нижних сторон старых мостов, охровый студень — медленная, кислая масса, которая принимает любую щель за пищу. Он сползает по стенам и растекается по потолкам, оставляя после себя запах уксуса и разъеденного металла. Рыбаки, которые видели его в камышах, потом долго держатся от берега подальше.
- id: ogre-zombie
  flavor: >-
    Огров трудно убить, и огр-зомби сделал эту трудность мрачным поводом для гордости. Его плоть обвисает на огромном, шаркающем остове, но он продолжает таскать дубину, когда разум уже давно угас. Те, кто видел, как он поднимается после смертельного удара, говорят, что мёртвый великан, кажется, даже смущён, словно забыл, как ложиться.
- id: ogre
  flavor: >-
    Местный огр — тот сосед, который берёт телегу взаймы и возвращает одни колёса. Он шумный, жадный и быстро обижается, поэтому из него плохой собеседник в споре о последней краюхе хлеба. Дубину с узлами он несёт на одном плече, пучок дротиков — на другом и твёрдо верит, что всё стоящее можно выиграть, если кричать громче.
- id: oni
  flavor: >-
    Рогатый и широкоплечий, он ведёт строгий учёт долгов и наказаний и взыскивает то и другое с ухмылкой. Он способен исцеляться от ран, которые свалили бы существо послабее, и парит в воздухе так же легко, как ходит. Правители и судьи находят его полезным, однако тот, кто его нанимает, должен ожидать, что счёт будет оплачен полностью, пусть и не сразу.
- id: otyugh
  flavor: >-
    Нет ничего надёжнее в сточной канаве, чем существо, которое предпочитает гниль свежему хлебу, и отиуг — тому яркий пример. Его туша лежит в грудах отбросов, где щупальца перебирают остатки города наверху. Он говорит только мыслями, которые вкладывает в разум ближних слушателей, и обычно ворчит о запахе собственного логова.
- id: owl
  flavor: >-
    Сидя в дупле дуба, сова следит за переулком с такой неподвижностью, что это пугает самого смелого работника фермы. Крылья её почти не издают звука, поэтому мышь может так и не узнать, что её заметили, пока не сомкнутся когти. В птице есть тихое достоинство, и она охотно предоставляет остальной мир более шумным созданиям.
- id: owlbear
  flavor: >-
    Охотники в высоких лесах обходят совомедведя стороной, ведь тело у него медвежье, а нрав ещё хуже. Его совиная голова поворачивается с ухающим, оскорблённым криком, стоит кому-либо вторгнуться на его территорию. Он редко охотится ради забавы, однако сорвёт ограду, не задумываясь, кто стоит за ней.
- id: panther
  flavor: >-
    Пантера — это тень, которая движется, когда никто не смотрит, скользит сквозь камыш и вверх по стволам почти без шороха. Она охотится на краю лагеря и исчезает раньше, чем фонарь успевает её найти. Ловчие говорят, что шерсть у неё цвета мокрого сланца и что она ни разу не потратила лишнего шага.
- id: pegasus
  flavor: >-
    Белокрылый и кроткий, пегас — то существо, о котором слагают песни, и он находит это слегка смущающим. Он перенесёт заблудившегося ребёнка через реку или раненого рыцаря с поля боя и не просит ничего взамен, кроме тёплого слова. Его шкура блестит в утреннем свете, и он редко позволяет кому-либо коснуться своей гривы, пока не заслужит это доверие.
- id: phase-spider
  flavor: >-
    Некоторые пауки плетут паутину, но фазовый паук ткёт себя из самого обычного мира. Он проскальзывает между осязаемым и невидимым, появляясь на потолке лишь затем, чтобы через мгновение раствориться в камне. Охотники, шедшие по его следам, рассказывают, что след просто обрывается, словно паук решил, что эта комната больше не стоит его хлопот.
- id: piranha
  flavor: >-
    Одна пиранья едва ли заслуживает второго взгляда, но в реке их редко бывает одна. Они движутся блестящей серебристой толпой и обрушиваются на всплеск с такой скоростью, что дети, которые брели по воде, поспешно выбираются на берег. Рыбаки знают, что кусочек старого мяса быстро привлекает их, и этот урок лучше усвоить с берега.
- id: pirate-captain
  flavor: >-
    Капитан пиратов носит камзол, сшитый из обрывков трёх разных флотов, и улыбку, которая не раз выручала его из-под виселицы. Владение дуэльным клинком для него скорее хобби, чем умение: он фехтует одной рукой, а другой приподнимает шляпу. Команда идёт за ним ради доли добычи и остаётся ради историй, большинство из которых хотя бы наполовину правдивы.
- id: pirate
  flavor: >-
    В каждой гавани найдётся несколько пиратов, которые предпочитают обаяние абордажным саблям, и этот — один из самых убедительных. На кожаной перевязи висят шесть кинжалов, и с каждым связана история о человеке, у которого его отобрали. Его обаяние обычно заставляет незнакомцев отдать кошельки раньше, чем они поймут, что их о чём-либо просили.
- id: pit-fiend
  flavor: >-
    Ямный дьявол — своего рода адский бюрократ с размахом крыльев под стать, и он воспринимает каждый договор как личное оскорбление, которое нужно уладить в свою пользу. Шкура его толста и покрыта шрамами, а хлыст — вовсе не украшение. Низшие демоны поднимаются и падают по его прихоти, а посетители, пришедшие торговаться, обычно уходят с условиями, которых не помнят согласия.
- id: planetar
  flavor: >-
    Лучезарный и неторопливый, планетар парит в воздухе, словно лампа, которая забыла, как падать. Его крылья взмахивают медленно, и каждое слово, которое он произносит, словно несёт свет в тёмные углы комнаты. Смертные, встретившие такого ангела, часто признаются в вещах, которые намеревались скрыть, хотя существо принимает эти признания как милость, а не как трофей.
- id: plesiosaurus
  flavor: >-
    Моряки, которые видят длинную шею, скользящую под волной, обычно решают, что ничего не видели. Это терпеливый морской зверь, который перекатывается по глубоким заливам на четырёх гребущих конечностях и поднимает голову только затем, чтобы схватить то, что подплыло слишком близко. Он задерживает дыхание дольше любого рыбака, и мелководье, как он давно понял, даёт ему самую лёгкую добычу.
- id: polar-bear
  flavor: >-
    На далёком севере, где лёд встречается с открытой водой, белый медведь так же спокойно входит в море, как ступает на замёрзшую равнину. Он охотится на тюленей с дрейфующих льдин, плывя с высоко поднятой широкой головой, и не слишком заботится о холоде, который остановил бы менее выносливых зверей. Охотники, которые встречают его, быстро узнают, что его терпение опаснее его нрава.
- id: pony
  flavor: >-
    Пони — животное, которое держит каждая деревня, но о котором никто не слагает песен. Этот маленький и упрямый, с лохматой шерстью и привычкой останавливаться на краю любого моста, которому не доверяет. Его копыта тверже его нрава, и конюшенные мальчишки учатся уважать это раньше, чем научатся чему-либо ещё.
- id: priest-acolyte
  flavor: >-
    Послушник — тот, кто подметает алтарь, носит свечи и помнит каждое имя в списке пожертвований. Молодой, усердный и немного пугающийся старших священников, он, тем не менее, держит булаву под рукой и умеет использовать священный огонь для защиты, когда деревенская дорога становится опасной. Большинство предпочло бы ухаживать за садом, чем сражаться, и большинство делает это хорошо.
