- id: archmage
  flavor: >-
    Учёный, поднявшийся на вершину старых коллегий и отказавшийся спускаться оттуда. В библиотеке башни больше книг, чем их владелец когда-либо считал. Гостей, которые вежливо стучатся, угощают чаем, хотя чай — редко самое опасное, что есть в комнате.
- id: assassin
  flavor: >-
    Наёмный убийца, который предпочитает оставаться невидимым до того самого мгновения, когда это важно. Ассасины работают на того, кто платит, и не оставляют следов своих методов, кроме отравленного клинка. Их дурная слава так велика, что жители каждого города запирают двери на закате.
- id: awakened-shrub
  flavor: >-
    Куст, которого однажды проходивший мимо друид уговорил начать думать самостоятельно, и с тех пор он без умолку сплетничает. Его ветви тонки, листьев мало, но он помнит каждое доброе слово и каждый небрежный пинок. Садовникам, которые хотят тихую живую изгородь, стоит приберечь секатор для другого растения.
- id: awakened-tree
  flavor: >-
    Старый дуб, которого разбудила песнь друида и который с тех пор так и не уснул. Его ствол скрипит на ветру, словно дверь, а корни медленно тянутся по склону холма, пока дерево бродит. Деревни у его пути оставляют подношения из свежего хлеба, надеясь, что оно продолжит свой путь.
- id: axe-beak
  flavor: >-
    Нелетающая птица размером с пони, с клювом, похожим на топор. Пастухи быстро узнают, что её длинные ноги способны обогнать галопирующую лошадь, а нрав у неё хуже аппетита. Караваны разбивают лагерь подальше от её гнёзд, и самые осторожные крепко привязывают палатки.
- id: azer-sentinel
  flavor: >-
    Коренастый страж из живого пламени, словно высеченный из чёрного камня и освещённый изнутри. Хозяева ставят его охранять кузницы и сокровищницы, и он не моргает, не спит и не принимает взяток. Всякий, кто подойдёт к его посту с враждебными намерениями, почувствует жар раньше, чем увидит молот.
- id: baboon
  flavor: >-
    Стая этих умных приматов путешествует вместе, и каждый её член следит за спинами остальных. Они шумны, быстры и гораздо организованнее, чем ожидает случайный наблюдатель. Одиночного бабуина встретить редко, поэтому большинство историй о них рассказывают про целую банду.
- id: badger
  flavor: >-
    Упрямый землекоп с полосатой мордой и нравом, который переживает большинство охотников. Барсуки роют глубокие норы под живыми изгородями и защищают их с удивительной яростью. Фермеры ворчат из-за дыр, которые они оставляют в полях, но вряд ли кто-то захочет схватиться с одним из них.
- id: balor
  flavor: >-
    Высокий рогатый тиран, окутанный пламенем, чей огненный кнут способен стащить рыцаря из седла. Даже когда его уничтожают, его пепел собирается вновь в каком-нибудь далёком провале и поднимается заново, ещё больше и злее прежнего. Главы культов, которые призывают балора, редко доживают до того, чтобы пересмотреть условия сделки.
- id: bandit-captain
  flavor: >-
    Главарь разбойничьей шайки, который следит, чтобы счета велись честно, а добыча пересчитывалась. Капитаны носят пистолет и кривой клинок и чаще парируют, чем хвастаются, а это о многом говорит. Торговцы на торговом тракте платят пошлину без споров, иначе заплатят потом куда дороже.
- id: bandit
  flavor: >-
    Дешёвая разновидность неприятностей, которые встречаются на тихих дорогах, обычно по нескольку человек сразу. Бандиты голодны чаще, чем жестоки, и обычно разбегаются, когда к ним выходит разумный фермер с фонарём и обидой на сердце. Их главное умение — заставить вьючного мула выглядеть ценнее, чем он есть на самом деле.
- id: barbed-devil
  flavor: >-
    Рогатый искуситель, чья шипастая шкура рвёт всякого, кто достаточно глуп, чтобы его схватить. Колючие дьяволы терпеливы, а не опрометчивы: они предпочитают прижать пленника и дать шипам вести спор. Знатоки таких существ говорят, что им нравится ждать, пока пленник сам не выбьется из сил.
- id: basilisk
  flavor: >-
    Охотник, похожий на ящерицу, чей взгляд превращает живую плоть в холодный серый камень. Он живёт в разрушенных подвалах и гравийных карьерах, где безмолвными рядами стоят каменные фигуры его прежних жертв. Те, кто пережил встречу с ним, рассказывают эту историю только за долгим ужином.
- id: bat
  flavor: >-
    Маленькое крылатое млекопитающее, которое висит вниз головой в тёмных пещерах и спит в светлые часы утра. Летучие мыши ориентируются на звук и прикосновение, поэтому редко сталкиваются с чем-то важным. Тот, кто держит фонарь, обычно пугается их шелеста сильнее, чем укуса.
- id: bearded-devil
  flavor: >-
    Щетинистый, бородатый головорез с длинным глефом и пристрастием к ранам, которые не затягиваются. Бородатые дьяволы собираются отрядами и муштруются, как солдаты на унылом плацу. Их традиция гласит, что достойная рана та, что продолжает болеть и долго после окончания боя.
- id: behir
  flavor: >-
    Длинный змей со множеством ног и пристрастием к молниям, которые потрескивают по его чешуе. Он свивается над утёсами и горными перевалами, падает на путников и сжимает их, пока воздух не покинет их лёгкие. Старые предания говорят, что в его логове лежат кости целых караванов, хотя кости редко кто пересчитывает.
- id: berserker
  flavor: >-
    Воин, который сражается лучше всего тогда, когда бой уже стал кровавым. Берсерки раскрашивают лица и поют боевые песни перед схваткой, а затем становятся яростнее по мере того, как открываются их раны. Деревни вдоль северных рек научились бояться рога, который призывает их на войну.
- id: black-bear
  flavor: >-
    Широкоспинный собиратель, который лазает по деревьям так же легко, как переходит вброд ручей. Чёрные медведи предпочитают ягоды и рыбу драке, но мать с медвежатами заставит всякого пожалеть о своём приближении. Путникам, которые встретили такого зверя, советуют говорить спокойно, отступать медленно и нести с собой что-нибудь шумное.
- id: black-dragon-wyrmling
  flavor: >-
    Молодой дракон, который присвоил себе болото и уже очень гордится его зловонием. Его чешуя цвета мокрого сланца, и он плюётся кислотой во всякого, кто потревожит его ужин. Детёныши растут медленно, что даёт живущим поблизости людям достаточно времени, чтобы уйти подальше.
- id: black-pudding
  flavor: >-
    Глянцевая куча тёмной, дрожащей слизи, которая проползает через стоки и трещины в подвалах. Её прикосновение разъедает кожу, железо и дерево, поэтому искатели приключений, сражавшиеся с ней, обычно оставляют снаряжение в негодном виде. Любой удар, который её достаёт, может расколоть её на два меньших пудинга, каждый из которых голоднее предыдущего.
- id: blink-dog
  flavor: >-
    Мигающие псы — фейские гончие, которые, кажется, выскакивают из одного кустарника в другой, и охотники, идущие по их следу, находят обычно лишь клочья серебристой шерсти. Их стаи известны учтивостью: они делят добычу и терпеливо ждут на краю поляны, пока путник не пройдёт мимо. Немногие, кто с ними встречался, забывают, как быстро дружелюбное виляние хвостом может обернуться внезапным исчезновением.
- id: blood-hawk
  flavor: >-
    Кровавый ястреб — маленький хищник с ржаво-рыжими крыльями и беспокойным, неумолимым взглядом. Охотники пользуются ими так же, как другие пользуются свистком: птицу пускают кружить высоко, а острые глаза внизу делают остальное. Он умнее, чем можно подумать по его размеру, и фермеры, держащие кур, учатся прислушиваться к внезапной тишине, означающей, что он прилетел.
- id: blue-dragon-wyrmling
  flavor: >-
    Детёныш синего дракона — молодой дракон сухих равнин и выжженных дюн, чья чешуя цвета грозы, увиденной издалека. Он терпелив, как существа, которые рассчитывают пережить всех, кто их обидел, и ведёт тщательные счета оказанным услугам. Будучи ещё молодым, он уже предпочитает сделку, выгодную для себя, любой драке, которую может проиграть.
- id: boar
  flavor: >-
    Кабан — коренастый, щетинистый добытчик дубрав и речных низин, который скорее станет рыться в опавших листьях, чем затеет драку. Загнанный в угол, он превращается во что-то совсем иное: одни плечи да опущенные клыки. Лесорубы быстро усваивают, что ворчливой свиноматке нужно давать много места и никогда не вставать между ней и её поросятами.
- id: bone-devil
  flavor: >-
    Костяной дьявол — высокий, утыканный шипами демон упорядоченных адских дворов, где ранг отмечается длиной собственных шипов, а холодная чистота договоров — умением держать слово. Это существо точных сделок, и оно любит смотреть, как смертный слишком поздно понимает, какой пункт он подписал. Его терпение ужасно, а шипастый хвост, который он использует как плеть, редко промахивается мимо цели.
- id: brass-dragon-wyrmling
  flavor: >-
    Латунный детёныш обитает в жарких, открытых краях и говорит больше, чем сочли бы вежливым большинство драконов. Он любит истории, песни и звук собственного голоса, разносящийся над барханом, и без лишних споров меняет рассказ на рассказ, не задумываясь, кто кому должен. Путники, встретившие такого, обычно уходят с указанием дороги, шуткой и слабым запахом тёплого металла.
- id: bronze-dragon-wyrmling
  flavor: >-
    Бронзовый детёныш обитает на побережьях и медленных зелёных реках, где бережёт рыбацкие деревни, решив защищать их. Он относится к своим обязанностям серьёзно, быть может, чересчур серьёзно, и бывало, что он часами висел над гаванью в долгое серое утро, не проронив ни слова. Моряки говорят, что именно его терпение — единственная причина, по которой некоторые лодки возвращаются домой, и дракон считает такой порядок вполне разумной сделкой.
- id: brown-bear
  flavor: >-
    Бурый медведь — широкоплечий странник горных лесов и высоких лугов, который бредёт сквозь ягодники с видом существа, никогда не спешившего ни на минуту. Большинство предпочло бы, чтобы их оставили в покое, и большинство уступит путнику, который шумит достаточно, чтобы его заметили. Матери с медвежатами — совсем другое дело, и мудрые обходят их стороной.
- id: bugbear-stalker
  flavor: >-
    Багбир-охотник — тихий представитель косматого и вспыльчивого семейства, добытчик, который предпочитает затенённый край тропы открытой дороге. Он изучает привычки своей добычи, прежде чем сам показаться на глаза, и его трофеи аккуратными рядами хранятся так, что пугают даже собственных родичей. Следопыты низин говорят о нём шёпотом, будто громкий голос может призвать его обратно.
- id: bugbear-warrior
  flavor: >-
    Багбир-воин — громкая, передовая версия своих сородичей, сложенная как бочка с руками под стать. Он любит хороший крик перед боем и хорошую трапезу после него и мало терпит тех, кто называет его медлительным. Воины его племени держатся собственного кодекса, в основном о том, кому достаётся самая большая доля добычи.
- id: bulette
  flavor: >-
    Бюлетт — бронированный ужас, который движется сквозь рыхлую почву, словно рыба сквозь воду, и выныривает, только когда собирается охотиться. Спина у него покрыта пластинами, как щитом, а челюсти достаточно широки, чтобы проглотить козу целиком. Фермеры возле его охотничьих полей учатся чувствовать дрожь земли раньше, чем гребень пластин пробьёт дёрн.
