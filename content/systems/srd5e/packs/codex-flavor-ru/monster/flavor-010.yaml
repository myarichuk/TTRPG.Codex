- id: solar
  flavor: >-
    Солар — лучезарный вестник высоких небес, воин, чей золотой меч вылетает из его руки и возвращается сам. Он слышит каждую ложь, произнесённую в пределах слуха, и способен подняться после смерти в новом теле, хотя большинство встречавших его помнят лишь гнев. Его лук — оружие из света, способное поразить цель через долину, поэтому никому не стоит рассчитывать на чистый побег от его взгляда.
- id: specter
  flavor: >-
    Спектр — бледный, скорбный облик человека, чьи последние мгновения прошли в горькой обиде, и он проплывает сквозь камень так же легко, как сквозь занавеску. Солнечный свет ослабляет его, а в тёмных местах он смелеет и тянется холодной рукой, высасывая тепло и силы из каждого, до кого дотронется. Его жертвы нередко обнаруживают, что что-то незаметно ушло из них и не вернулось.
- id: sphinx-of-lore
  flavor: >-
    Сфинкс знаний — лев с крыльями птицы и терпением библиотекаря, который торгует загадками и тайнами за ответ, способный ему понравиться. Его рёв способен ошеломить самого смелого путника, а ни один магический глаз и ни одно заклинание не могут прочесть его мысли.
- id: sphinx-of-valor
  flavor: >-
    С телом льва и крыльями орла сфинкс доблести охраняет врата древних полей битв рёвом, способным рассеять целые армии. Его когти способны расколоть щит одним ударом, и тем, кто хочет пройти, сначала придётся доказать свою доблесть в бою, иначе им позорно укажут на дверь.
- id: sphinx-of-wonder
  flavor: >-
    Игривый сфинкс чудес с телом кошки питает слабость к остроумным подаркам и радуется тем, кто умеет его рассмешить. Его изобретения и яркие заклинания порой идут не так, как задумано, но он охотно добавит немного удачи усилиям друга или прикроет спутника от беды.
- id: spider
  flavor: >-
    Пауки такого рода — охотники, которые плетут шёлковые сети поперёк лесных просветов и входов в пещеры, подолгу ждут, поджав лапы. Они ходят по собственной паутине, не запутываясь в ней, и чувствуют каждое дрожание, которое бьющаяся добыча посылает по нитям. Их яд, хоть и не сильный, делает жертву настолько вялой, что её можно утащить.
- id: spirit-naga
  flavor: >-
    Духовная нага — призрак колдуна со змеиным телом, который продал душу чему-то тёмному, и его человеческое лицо всё ещё хранит слабую жестокую улыбку. Она охраняет разрушенные святилища в диких землях, и любой, кто будет так глуп, что потревожит её, обнаружит ядовитый укус и леденящий некротический луч. Говорят, даже её кости шепчут тайны, хотя большинство слышавших их не доживают до того, чтобы повторить услышанное.
- id: sprite
  flavor: >-
    Спрайты — крошечный народ фей с крыльями стрекозы и быстрыми, озорными руками; они порхают по лесам по поручениям, смысл которых никто толком не понимает. Они носят тонкие, как игла, мечи и луки, способные на миг заставить прохожего безнадёжно влюбиться в них, и могут скрыться из виду, когда пожелают. Их любопытство к чужому сердцу достаточно остро, чтобы ясно читать чувства, хотя сами феи редко рассказывают, что обнаружили.
- id: spy
  flavor: >-
    Шпион — тихий профессионал, который продаёт тайны тому, кто больше заплатит, и движется сквозь толпы и по крышам с отточенной лёгкостью, от которой преследователи теряют след. Его оружие всегда начищено, а яд всегда под рукой, и единственного пореза отравленным клинком достаточно, чтобы цель на время оглушить и дать ему скрыться.
- id: steam-mephit
  flavor: >-
    Паровой мефит — весёлый маленький элементаль из кипящего тумана, полный влажного жара и шипящей бравады, и при ударе он обычно вспыхивает облаком пара. Его пар может обварить лицо прохожего, а кто вдохнёт его, почувствует, что ноги слабеют и мысли путаются на короткое время. Большинство из них больше хвастовства, чем вреда, хотя яркое шипение при их вспышке трудно забыть.
- id: stirge
  flavor: >-
    Стирж — летучий ужас с крыльями летучей мыши и длинным игольчатым клювом; он охотится, бесшумно плывя над спящими лагерями, пока не найдёт тёплую шею, в которую можно впиться. Присосавшись, он пьёт досыта, и отодрать его можно лишь намеренным рывком, оставив жертву бледной, озябшей и ослабленной.
- id: stone-giant
  flavor: >-
    Каменные великаны строят жилища в склонах гор и обращают склоны в сад тщательно расставленных валунов. Они терпеливые мастера и бдительные стражи, и каменный великан швырнёт валун в любого незваного гостя. Его мастерство с камнем настолько тонко, что великан способен отбить брошенный снаряд обратно в метнувшего, и мудрые подходят к ним как к торговым партнёрам, а не как к противникам.
- id: stone-golem
  flavor: >-
    Каменный голем — резной страж из гранита и рун, созданный для того, чтобы хранить одну форму и следовать словам создателя буквально. Он отражает большинство заклинаний, направленных на него, а его тяжёлые кулаки бьют с силой, которая раскалывает камень и кость одинаково. Его медленные тяжёлые шаги слышны задолго до появления, а одного слова команды достаточно, чтобы он остановился или ушёл прочь.
- id: storm-giant
  flavor: >-
    Штормовые великаны держат чертоги на морских утёсах и читают надвигающуюся погоду в облаках так же легко, как другие читают письмо. Их мечи потрескивают молниями, и одного удара может хватить, чтобы поразить врага издалека и оглушить его, поэтому большинство мореходов обходит их побережье стороной. И всё же они щедры к честным торговцам, и штормовой великан способен стать надёжным другом любому кораблю, который уважает море.
- id: succubus
  flavor: >-
    Суккуб — исчадие, которое носит прекрасное лицо, чтобы завоевать доверие, и может принять более скромный облик, когда устанет от восхищения. Голос у неё мягкий, а прикосновение жгучее, и очарованные ею нередко чувствуют, как силы утекают с каждым шёпотом обещания. Те, кто разглядел её улыбку, обычно бегут прочь, прежде чем узнают, чего она хочет.
- id: swarm-of-bats
  flavor: >-
    Рой летучих мышей — кипящее облако крыльев и игольчатых зубов, которое вырывается из пасти пещеры на закате и на мгновение гасит луну. Ни одна летучая мышь сама по себе не страшна, но сотня может за мгновения окровавить путника и заставить его шататься, поэтому благоразумные держат факелы зажжёнными и накрывают голову.
- id: swarm-of-crawling-claws
  flavor: >-
    Скопление отрубленных пальцев и шуршащих рук собирается в гробнице, подтягиваясь вдоль стен и потолка единой беспокойной массой. Собственной воли, которую кто-либо сумел бы прочесть, у него нет, есть лишь голод хватать, держать и тащить вниз всё, что приблизится. Холодные учёные говорят, что это останки сотни мелких грабителей могил, каждый из которых всё ещё тянется за очередной горстью земли.
- id: swarm-of-insects
  flavor: >-
    Жуки, клещи и осы движутся единой бурой волной сквозь заросли тростника и гудят так, что звук разносится дальше, чем следует. Каждое насекомое слабо само по себе, но вместе они за мгновения покрывают путника и находят любую щель в доспехах. Охотники учатся ходить медленно, дышать через ткань и никогда не задерживаться возле гниющего бревна.
- id: swarm-of-piranhas
  flavor: >-
    Вспышка серебристой чешуи превращает медленную реку в кипящий омут, когда стайка мелких рыб смыкается вокруг всего, что плеснёт у её края. Стая движется как единое голодное существо, стремительно мелькая среди водорослей и затонувших корней деревьев. Речной народ говорит, что вода затихает прямо перед укусами, и мудрые держат руки подальше от течения.
- id: swarm-of-rats
  flavor: >-
    Серый шуршащий поток крыс выливается из обрушенного подвала, карабкаясь друг на друга в меняющемся ковре из шерсти и зубов. Одна крыса разбежалась бы от каблука, но собравшись вместе, они наступают и заполняют каждый угол, до которого могут дотянуться. У подвальщиков старых городов есть поговорка: одна крыса — досадная помеха, а сотня — расплата.
- id: swarm-of-ravens
  flavor: >-
    Чёрное облако воронов проносится над пустошью, хлопанье множества крыльев и резкий гомон карканья поднимаются над ним, словно сигнальный колокол. Каждая птица достаточно умна, чтобы стащить застёжку плаща или блестящее кольцо у зазевавшегося путника, и стая движется как единый разум. Пастухи говорят, что одного этого звука достаточно, чтобы человек потерял опору, поэтому они запирают двери, когда небо темнеет.
- id: swarm-of-venomous-snakes
  flavor: >-
    Десятки полосатых змей сплетаются в колышущуюся массу, скользя сквозь тростник и по затонувшим ступеням с сухим шипением, которое почти не смолкает. Стая бьёт единым броском, и каждый маленький клык сочится ядом, который жжёт кровь любого, кто стоит неподвижно слишком долго. Торговцы травами в болотных городах продают обереги против них, хотя никто ещё не доказал, что они действуют.
- id: tarrasque
  flavor: >-
    Бронированная гора-зверь выступает из холмов, её панцирная шкура покрыта гребнями, как старый сланец, а челюсти достаточно широки, чтобы проглотить целую телегу. Магия соскальзывает с его панциря, а рёв способен сбить с ног целую шеренгу солдат ещё до того, как они подойдут к стене. Учёные, изучавшие кости таких существ, говорят, что тарраска не столько умирает, сколько отказывается оставаться мёртвым.
- id: tiger
  flavor: >-
    Полосатый охотник проходит сквозь высокую траву беззвучно, а янтарные глаза его устремлены на стадо у дальнего края речного луга. Тигры — терпеливые засадники: они ждут спотыкания или отставшего, а затем бьют единым тяжёлым ударом, сбивающим добычу с ног. Когда добыча взята, кошка скользит обратно в тень зарослей, и стадо так и не узнаёт, что забрало одного из своих.
- id: tough-boss
  flavor: >-
    Главарь разбойной шайки носит кольчугу, которая видела много драк, и держит тяжёлый боевой молот с множеством старых вмятин. Он управляет отрядом короткими окриками и жестами, так что его люди сражаются слаженно и смыкают ряды раньше, чем враг успеет уйти. Те, кто пережил встречу с ним, говорят, что его арбалет так же тверд, как вспыльчив его нрав.
- id: tough
  flavor: >-
    В каждом караванном городе есть несколько таких наёмников, мужчин и женщин в поношенной коже, которые охраняют дорогу за плату и не задают лишних вопросов. Головорез носит булаву для ближнего боя и тяжёлый арбалет, чтобы держать дальнюю сторону повозки, и лучше всего сражается рядом с друзьями. Они редко жестоки, но никогда не бывают мягкими, а их верность длится ровно столько, сколько платят.
- id: treant
  flavor: >-
    Древнее дерево возвышается выше сельской управы, его кора покрыта мхом, а ветви шелестят голосами леса. Такие стражи пробуждаются медленно и гневаются неспешно, но, разбуженные, способны поднять из земли молодые деревья, которые будут сражаться рядом с ними. Лесной народ оставляет у корней маленькие дары и говорит тихо, ведь в роще мало что старше и терпеливее.
- id: triceratops
  flavor: >-
    Огромный рогатый травоядный бредёт по папоротниковым равнинам, его костистый воротник гремит, когда он опускает три длинных надбровных рога к тому, кто осмелится пересечь его путь. Он не охотник, но создание такой тяжести редко нуждается в охоте. Мелкие звери с лёгкой осторожностью уходят с его дороги, а старые самцы бросаются на всё, что стоит между ними и водой.
- id: troll-limb
  flavor: >-
    Отрубленная рука, всё ещё царапающая тупыми серыми пальцами, сама дёргается в грязи логова тролля. Она тащится к ближайшему тёплому телу и взмахивает с неожиданной силой, на ходу срастаясь с разорванной плотью. Если её оставить надолго, конечность может засохнуть, но немногие несчастные, видевшие, как она собирается заново, говорят, что она никогда по-настоящему не перестаёт стараться.
- id: troll
  flavor: >-
    Громоздкий серый верзила бродит у бродов и мостов, длинные руки свисают почти до колен, а раны срастаются прямо во время кровотечения. Тролли туповаты, но неотступны, и кидаются в драку с восторгом ребёнка на пиру. Путники, встретившие тролля, берут с собой факелы и смолу, хотя никто не может сказать наверняка, что на самом деле прикончит тролля.
