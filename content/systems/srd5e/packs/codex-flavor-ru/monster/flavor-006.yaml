- id: goat
  flavor: >-
    Козёл — уверенно стоящая на ногах обитательница склонов и каменистых пастбищ, способная взбираться на уступы, которые кажутся недоступными для любого четвероногого. Большинство коз просто упрямы, но некоторые становятся достаточно дерзкими, чтобы боднуть пастуха со склона, и деревенские предания выставляют самых скверных из них злодеями. И всё же хорошая коза даёт молоко и имеет мнение о каждой калитке в приходе.
- id: goblin-boss
  flavor: >-
    Гоблин-босс — невысокий, но острый на язык предводитель, который управляет отрядом воинов с помощью бахвальства, хитрости и вовремя поставленного толчка. Чаще всего он стоит за спинами телохранителей и позволяет им принимать первый удар — привычка, которая сохранила его шею целой не в одной неприятной драке. Караванщики научились платить его поборы без споров, ведь босс всегда быстро запоминает лица.
- id: goblin-minion
  flavor: >-
    Гоблин-миньон — самый маленький и самый легко заменимый член разбойничьей банды, с горстью кинжалов и изрядным запасом нервной энергии. Он крадётся вдоль живых изгородей и по крышам, надеясь проскользнуть мимо стражи и стащить всё, что оставлено без присмотра. Начальство редко узнаёт его имя, и он предпочитает так и оставаться: имена, как известно, имеют дурную привычку привлекать неприятности.
- id: goblin-warrior
  flavor: >-
    Гоблин-воин — становой хребет большинства гоблинских военных отрядов, потрёпанный солдат в кожаном доспехе, с помятым щитом и коротким луком за спиной. Он сражается неровными рядами, выкрикивая оскорбления врагам и полагаясь на число, чтобы восполнить нехватку роста. Если выбирать между долгим боем и быстрым отступлением, гоблин обычно выбирает отступление и называет его тактикой.
- id: gold-dragon-wyrmling
  flavor: >-
    Детёныш золотого дракона — молодой ярко-чешуйчатый дракон с чертой благородства, которую старшие находят одновременно очаровательной и тревожной. Его огненное дыхание — славный фокус на праздниках, но детёныш целится им осторожно в тех, кто был груб, а ослабевающее дыхание оставляет противников спотыкаться в следующем обмене ударами. Сокровищница его невелика, в основном из монет и отполированных безделушек, и он скорее одолжит услугу, чем станет вести счёт.
- id: gorgon
  flavor: >-
    Горгона — конструкт в бронзовых пластинах, созданный для охраны древних гробниц и запечатанных хранилищ, машина без цели, кроме своих приказов. Её дыхание превращает плоть в камень в течение нескольких мгновений, и это мрачный урок, который заставил каменотёсов держаться подальше. Учёные старых коллегий до сих пор спорят, кто её создал и зачем, но для горгоны этот вопрос значит меньше, чем нарушитель перед ней.
- id: gray-ooze
  flavor: >-
    Серая слизь проскальзывает сквозь трещины старых погребов и стоков, оставляя за собой бледную плёнку. Она растворяет пряжки, клинки и сапоги с одинаково терпеливым безразличием и, похоже, не имеет мнения ни о чём из этого. Охотники учатся брать с собой огонь и деревянную палку и прислушиваться к влажному чавканью, которое звучит раньше, чем пол начинает двигаться.
- id: green-dragon-wyrmling
  flavor: >-
    Детёныш зелёного дракона — молодое и тщеславное существо, которое считает, что его чешуя делает его умнейшим созданием в любом болоте. Он хранит краденые монеты у медленной реки и торгуется, только когда уже решил выиграть. Его дыхание пахнет гнилью и раздавленными листьями, а тростник возле его логова всегда пожелтел.
- id: green-hag
  flavor: >-
    Зелёные карги устраивают свои шабаши в гниющих уголках лесов, где вода стоит неподвижно, а птицы перестали петь. Они достаточно искусно подражают детскому плачу или голосу соседки, чтобы заманить неосторожных в камыши. Жители деревень говорят, что карга, которой как следует отблагодарили, перестанет их беспокоить, хотя ни одной карги, которой можно было бы доверять в таком обещании, они так и не нашли.
- id: grick
  flavor: >-
    Грик — худое серо-коричневое существо, которое цепляется за стены утёсов и похоже на кусок мокрого камня, пока не двинется. Его крючковатый клюв быстр, но грик предпочитает ждать в расщелине и позволить щупальцам решить всё за него. Путники, которые молча проходят под уступом, редко оказываются теми, кто потом рассказывает, что случилось дальше.
- id: griffon
  flavor: >-
    Грифоны гнездятся на высоких скалах, где ветер достаточно громок, чтобы заглушить их крики. Голова и передние лапы у них птичьи, а добычу они несут на вершины так же гордо, как любой знаменосец несёт знамя. Пастухи холмистых краёв рассказывают детям, что грифон возьмёт овцу, если сможет, а пастуха — если придётся.
- id: grimlock
  flavor: >-
    Гримлоки — бледные, слепые охотники, которые так долго живут в пещерах, что уже не скучают по солнцу. Они слышат упавший камешек с другого конца зала и находят добычу по звуку её дыхания. Их костяные дубины сделаны из всего, что пещера уже отбросила, а мёртвых они хоронят в тех же туннелях, где растят своих детёнышей.
- id: guard-captain
  flavor: >-
    Капитан стражи решает, какая из городских стен нуждается в починке первой и какие ворота можно оставить без присмотра на вечер. Наёмные клинки и присяжное ополчение подчиняются свистку капитана, и хороший капитан способен назвать каждую семью из караульного списка. Доспехи его начищены до блеска, копья пересчитываются дважды каждое утро, а нрав он держит при себе.
- id: guard
  flavor: >-
    Стражники — обычные люди, которым выдали копьё, щит и график дежурств. Большинство предпочло бы сидеть дома, сняв сапоги, и говорит об этом каждому, кто вежливо спросит. Верность стражника обычно простирается на тех, кто платит жалованье, на двоюродного брата с соседнего поста и на горячий ужин.
- id: guardian-naga
  flavor: >-
    Наги-стражи — учёные с телом змеи, которые охраняют старые библиотеки и запечатанные двери и повторяют клятвы, данные давным-давно. Их терпение славится среди тех, кто учится рядом с ними, а гнев медлителен, но основателен. Учёные, которым доводилось встречать такого наги, говорят о нём шёпотом, словно он всё ещё может их слышать.
- id: half-dragon
  flavor: >-
    Полудракон — это то, что случается, когда род дракона забредает в деревню и сохраняет что-то от своего предка, обычно блеск чешуи на руках и нрав, похожий на жар угасающей кузницы. Они гордятся кровью и настороженно относятся к тому, что их за неё судят. Большинство рано усваивает, что скрывать наследие труднее, чем носить его открыто.
- id: harpy
  flavor: >-
    Гарпии гнездятся на морских утёсах и в разрушенных башнях забытых побережий, распевая над скалами, пока ветер не разнесёт их песню по каждой долине внизу. Песня сладка для любого, кто её слышит, и моряки, которые идут за ней, обычно оказываются в прибое. Их оперённые руки быстры, а когти небрежны, так что жертвам гарпий редко удаётся пожалеть о том, что они прислушались.
- id: hawk
  flavor: >-
    Ястребы охотятся с высокого неба и пикируют с криком, от которого мелкие птицы замирают в живой изгороди. Ястреб редко замечает людей, если только те не несут что-нибудь стоящее украсть, например бутерброд или блестящее кольцо. Соколятники, которые их выучивают, говорят о терпении так, будто это своего рода погода.
- id: hell-hound
  flavor: >-
    Адские гончие рыщут стаями по выгоревшим краям мира и редко показываются без своего тлеющего дыхания. Их косматые шкуры цвета остывающих углей, и держатся они так близко друг к другу, что ни одна гончая никогда не остаётся в одиночку. Говорят, когда-то они были охотничьей сворой одного лорда, хотя рассказ меняется с каждым костром, у которого его ведут.
- id: hezrou
  flavor: >-
    Эти тяжёлые, жабомордые громилы приходят из самых низких глубин худших мест, и с собой они приносят зловоние, которое цепляется к каждой комнате, куда входят. Они не сражаются с изяществом: они бьют сокрушительными ударами и поднимают изрядный шум. Учёные, знающие толк в таких существах, отмечают, что убитый хезроу просто возрождается в другом месте, и это, возможно, единственное утешение, которое кто-либо находит в их обществе.
- id: hill-giant
  flavor: >-
    Холмовые великаны — огромные, медлительные в мыслях существа, которые предпочитают высокие места, где ветер чист, а овец много. Они редко жестоки ради самой жестокости, но мало задумываются о том, что топчут по пути к ужину. Дубина холмового великана обычно представляет собой целое молодое дерево, очищенное хозяином и сохраняемое из сентиментальных соображений.
- id: hippogriff
  flavor: >-
    Гиппогрифы имеют голову и передние ноги орла и тело лошади, что делает их любопытным зрелищем на любом лугу. Это горделивые животные, которые терпят всадника, если решат, что тот стоит хлопот. Молодые легко пугаются, а испуганный гиппогриф в открытом небе становится опасностью для всех поблизости.
- id: hippopotamus
  flavor: >-
    Бегемоты проводят жаркие послеполуденные часы, погрузившись в медленные бурые реки, и над водой видны только их глаза и уши. Они не такие дружелюбные, как выглядят с берега, и лодочники держатся от них подальше. Крупный бегемот способен долго задерживать дыхание, и именно этим он обычно удивляет рыбаков, которые ловят поблизости.
- id: hobgoblin-captain
  flavor: >-
    Хобгоблины-капитаны — те, кто помнит приказы, пересчитывает копья и следит, чтобы лучники не отлынивали в тени. Доспехи у них хорошие, а манеры ещё хуже, и они ждут, что низшие гоблины будут салютовать раньше, чем к ним обратятся. Те, кто служит под началом такого капитана, учатся держать голову опущенной, пока он не закончит кричать.
- id: hobgoblin-warrior
  flavor: >-
    Хобгоблины-воины обучаются строю и приучаются смыкать ряды с дисциплиной хорошо смазанного механизма. В одной руке у них меч, в другой лук, и они охотно используют любое из них для одной и той же цели. Большинство выросло с пониманием, что щит полезен, только когда тот, кто стоит рядом, держится твёрдо.
- id: homunculus
  flavor: >-
    Гомункул — маленькое сотворённое существо, сшитое чародеем, который хотел получить слугу, никогда не способного возразить. Оно парит близко к своему хозяину, слушая с тихим, острым вниманием, и передаёт каждое слово обратно тонким голоском. Укус его сам по себе не опасен, но существо достаточно коварно, чтобы оставить жертву сонной и лежащей в пыли.
- id: horned-devil
  flavor: >-
    Рогатые дьяволы — высокие, красноспинные задиры, которые маршируют строем и получают удовольствие, наблюдая, как другие вздрагивают. Их хвосты оснащены крюком, способным наказать врага на близкой дистанции, а их огненные броски точны и безжалостны. Такие существа — неумолимые середняки собственных тёмных орденов, и говорят они о милосердии так, как клерк говорит о погоде.
- id: hunter-shark
  flavor: >-
    Акулы-охотники патрулируют глубокие тёплые воды за рифом, где они слишком крупны, чтобы их беспокоили большинство хищников. Репутация у них заслуженная и страшная: отведав крови, они не остановятся, пока течение не стихнет. Рыбацкие лодки учатся держать сети низко, а голоса — тихими.
- id: hydra
  flavor: >-
    Гидра — великан болот с множеством шей, каждая из которых оканчивается щёлкающей головой, будто имеющей собственное мнение. Отрубите одну, и на пне скоро появится что-то новое, и это превратило существо в вечное испытание для каждого героя, который пытался навести порядок. Охотники знают, что окончить спор можно лишь одним верным способом — огнём.
- id: hyena
  flavor: >-
    Гиены смеются по-своему, резко и отрывисто, и этот звук разносится по степи далеко за полночь. Они охотятся свободными стаями и долго, терпеливо идут по следу раненого путника. Их смех, даже больше, чем зубы, не даёт кострам в зарослях погаснуть до утра.
