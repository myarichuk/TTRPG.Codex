- id: guardian-of-faith
  flavor: >-
    Бледный страж из света возникает в воздухе и отказывается сдвинуться с места, проявляя то терпение, которое по-настоящему оценят только набожные. Тот, кто подойдёт слишком близко, быстро узнаёт, что его взгляд жалит святым огнём. Старые храмовые служители клянутся, что эта штука ни разу не моргнула.
- id: guards-and-wards
  flavor: >-
    Туман собирается в коридорах, двери с щелчком запираются, а каждая лестница обрастает липкими нитями. Озорные огоньки пляшут по углам, а сквозняк вздыхает в галерее. Тот, кто знает пароль, может пройти прямо сквозь всё это, что старые коллегии считают разумным оскорблением.
- id: guidance
  flavor: >-
    Тихий толчок ровного голоса, передаваемый из рук в руки, как одолженная монета. Каким бы ни было выбранное ремесло, помогаемый человек ощущает внезапную ясность цели, словно дружеский локоть коснулся его плеча. Колдуны-самоучки ворчат, что это лучше всего работает на тех, кто уже наполовину решился попробовать.
- id: guiding-bolt
  flavor: >-
    Копьё белого света срывается с кончиков пальцев заклинателя и выслеживает цель, как почтовый голубь, который не желает отвлекаться. Оно поражает со звуком удара колокола, и послесвечение прилипает к пострадавшему, помечая его для каждого союзника, который последует. Некоторые называют это самым вежливым способом указать.
- id: gust-of-wind
  flavor: >-
    Порыв воздуха приходит ниоткуда и катится по двору, как нетерпеливый управляющий, очищающий крыльцо. Свечи трепещут, плащи хлопают, а пыль взбирается под стропила. Моряки клянутся, что у ветра есть любимое направление, хотя обычно за него решает заклинатель.
- id: hallow
  flavor: >-
    Освящённая или осквернённая, земля тихо переходит во владение. Воздух успокаивается, трава замирает, и слабый гул намерения висит над камнями ещё долго после того, как ритуальные свечи догорели до основания. Гостям, которым там неспокойно, обычно говорят, что это всего лишь соседи.
- id: hallucinatory-terrain
  flavor: >-
    Для каждого, кто смотрит, луг превращается в болото, а пологий склон принимает облик обрыва. Поля и дороги получают новые силуэты, не меняя ни одного камня. Осторожные путники всё равно проверяют опору сапогом, а умные проверяют дважды.
- id: harm
  flavor: >-
    Синяк из серого света расцветает под кожей и продолжает расползаться даже после того, как рука отнята. Старая рана не столько заживает, сколько оседает в меньшую форму. Целители, однажды увидевшие это, обычно начинают очень интересоваться профилактикой.
- id: haste
  flavor: >-
    Каждое движение щёлкает в более быстрый ритм, словно тело нашло второе дыхание и запасную пару ног. Нервы звенят, рефлексы подтягиваются. Счёт приходит позже, когда на всю компанию накатывает тяжёлая внезапная сонливость.
- id: heal
  flavor: >-
    Тёплый свет льётся через раненое тело и рассеивает туман яда, а также мрак слепоты и глухоты. Раны срастаются с темпом, от которого зрителям становится не по себе. Скептики обычно перестают спорить, когда к их щекам возвращается цвет.
- id: healing-word
  flavor: >-
    Одно короткое слово, пробормотанное, как успокоение нервной лошади, и синяки начинают стихать. Это такая помощь, которую можно оказать посреди спора, и никто не заметит перебивания. Полевые лекари любят её именно за это, и так же любят люди, которые ненавидят ждать в очереди.
- id: heat-metal
  flavor: >-
    Клинок или нагрудник начинает светиться цветом заката, и металл тикает и вздыхает, нагреваясь. Тот, кто его держит, быстро понимает, что хватка значит меньше, чем желание разжать руку. Кузнецы считают это жульничеством, а воры — отличным уроком.
- id: hellish-rebuke
  flavor: >-
    Злобный зелёный огонь вспыхивает над тем, кто только что ударил. Это ответ, подан с идеальным расчётом времени, из тех, после которых нападающий жалеет, что выбрал более тихую цель. Пламя слабо пахнет перцем и дурными решениями.
- id: heroes-feast
  flavor: >-
    Пир появляется на ровной траве: горы жареного мяса, хлеб, ещё дымящийся, и фрукты, словно собранные этим утром. Говорят, что те, кто садится есть, встают твёрже, смелее и заметно труднее выводятся из равновесия. Чаша, которая всё это сделала возможным, к сожалению, в процессе израсходована.
- id: heroism
  flavor: >-
    Ровное тепло оседает в груди и вытягивает дрожь из коленей. Страх соскальзывает с кожи, как дождь с хорошего плаща, и в начале каждого хода появляется маленькая подушка мужества. Барды сочиняют об этом песни, обычно плохие.
- id: hex
  flavor: >-
    Маленькое, злобное проклятие садится на существо, как репей в носке. Каждый удар заклинателя несёт кислое дополнительное жало, а удача цели словно соскальзывает в самые неудобные моменты. Чернокнижники считают это давней обидой, которая случайно записана чернилами.
- id: hideous-laughter
  flavor: >-
    Кто-то в толпе охвачен приступом хохота, таким сильным, что подгибаются колени. Смех непроизволен и довольно неприличен, а бедняга пытается подняться и раз за разом проигрывает спор с тяжестью. Зрителям трудно жалеть того, кто так счастливо хрипит на полу.
- id: hold-monster
  flavor: >-
    Существо любого размера замирает на полушаге, и его мышцы отказываются выполнять каждый приказ собственного мозга. Глаза всё ещё двигаются, и это почему-то хуже. Маги с чувством юмора держат запасной план именно для такой неловкой встречи.
- id: hold-person
  flavor: >-
    Суставы каменеют, и гуманоид стоит неподвижно, как манекен в витрине магазина, способный наблюдать за комнатой, но не участвовать в ней. Первой угасает гордость, за ней терпение. Старые мастера ремесла говорят, что неподвижность выносить тяжелее, чем крик.
- id: holy-aura
  flavor: >-
    Мягкий золотой ореол расходится от заклинателя и оседает над теми, кого он выбрал укрыть. Враги обнаруживают, что их удары становятся неуклюжими, а уверенность шатается. Существа тьмы, которые посмеют ударить защищённых, встречают внезапное и тошнотворное головокружение.
