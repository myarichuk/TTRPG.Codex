- id: unseen-servant
  flavor: >-
    Участок невидимой силы принимает форму в пустом углу, послушный и безмозглый, готовый принести, унести и прибрать. Он не может говорить, не способен ответить ударом и едва поднимает буханку хлеба, однако никогда не ворчит над работой. Замотанные домохозяйки повсюду призывают его, лишь бы пыль не копилась.
- id: vampiric-touch
  flavor: >-
    Рука, окутанная тенью, тянется и выпивает немного жизни из того, до кого дотронулась. Жертва ощущает холодную боль, растекающуюся по конечностям, а творящий чувствует, как тепло возвращается в его собственные раны. Те, кто практикует это искусство, редко бывают желанными гостями на пирах, хотя компания им почти всегда найдётся.
- id: vicious-mockery
  flavor: >-
    Ряд оскорблений, сказанных как надо, проскальзывает мимо ушей и застревает в мыслях, словно заноза. Мысли цели цепляются за колючки, и её удары летят мимо и в дикую сторону. Трактирные остроумцы пытаются повторить самую жестокую версию на протяжении поколений, и большинство из них всё ещё проигрывает.
- id: vitriolic-sphere
  flavor: >-
    Светящийся шар кислоты летит к месту, выбранному творящим, и лопается, словно разбитая склянка с чем-то мерзким. Попавшие в брызги шипят и покрываются волдырями, а ожог продолжает разъедать их и после первого шока. Алхимики относятся к этому веществу с большим уважением и с большим подозрением.
- id: wall-of-fire
  flavor: >-
    Полотно пламени встаёт из твёрдой поверхности, голодное и яркое, и ни одно разумное существо не захочет к нему прикасаться. Всё, что проходит через его область, попадает в жгучий поток жара, а стена держит своё яркое лицо обращённым к тому, что приближается. Хранители очага говорят, что хороший огонь знает, когда быть упрямым.
- id: wall-of-force
  flavor: >-
    Маги-самоучки называют её окном, которое забыло, что должно быть стеклом. Через неё никто не проходит: ни пыль, ни сомнение, ни кошка, которая однажды попыталась и была вежливо отвергнута. Умные творцы вешают её в воздухе, словно полку для идей, которые отказываются двигаться.
- id: wall-of-ice
  flavor: >-
    Морозные чародеи любят хвастаться, что их стены могут переспорить огонь. Лёд жалит, как вызов, а после пролома остаётся полотно воздуха настолько стылого, что кусает лёгкие каждому, кто споткнётся внутри.
- id: wall-of-stone
  flavor: >-
    Каменотёсы клянутся, что это просто скала, научившаяся подчиняться голосу. Она перекидывает мосты через ущелья, строит пандусы там, где их не должно быть, и стоит на месте, пока творящий держит разум ровным, а это больше верности, чем показывают многие горы.
- id: wall-of-thorns
  flavor: >-
    Садовники диких мест выращивают такую изгородь, когда злятся на мир. Это сплошная спутанная поросль и колючки, острые как иглы, заросли, которым безразлично, кого они царапают, и которые скрывают за зелёной завесой всё, что лежит за ними.
- id: warding-bond
  flavor: >-
    Кольца стоят достаточно дёшево, чтобы их заложить, и достаточно дорого, чтобы нервировать ростовщика. Два добровольных носителя становятся единым осторожным целым, связанные нитью, которая дёргается, когда один из них получает удар, и которую нелегко порвать.
- id: water-breathing
  flavor: >-
    Камышорезы давно знают, что короткий полый стебель позволяет человеку дышать под водой. Рыбий народ находит этот приём немного оскорбительным, ведь ему никогда не требовались камыши, но он соглашается одолжить стебель для случайного званого ужина.
- id: water-walk
  flavor: >-
    Кусочек пробки превращает почти любую поверхность в пол. Грязь, слякоть, песок, пьющий сапоги, даже расплавленный камень можно пересечь, словно это танцпол. Весь фокус в том, чтобы знать, когда нужно тонуть, ведь озеро помнит каждую ошибку.
- id: web
  flavor: >-
    Паучники старых коллегий читают лекции об этом, снимая шёлк с рукавов. Липкая масса паутины заполняет участок коридора и удерживает всякого, кто в неё вляпается, но вспыхивает серной вспышкой, если кто-то поднесёт факел.
- id: weird
  flavor: >-
    Иллюзия проста: она показывает каждому то, чего он боится больше всего, а затем предоставляет его собственному воображению доделать остальное. Те, кто не справился, пугаются, и их кошмары становятся немного хуже с каждым новым взглядом, пока кто-нибудь всерьёз не разбудит их.
- id: wind-walk
  flavor: >-
    Пастухи облаков говорят, что небо — это земля, перевёрнутая вверх дном. Их способ требует свечи, немалого терпения и готовности стать клочком пара, дрейфующим над верхушками деревьев и глядящим вниз на ссорящиеся деревни.
- id: wind-wall
  flavor: >-
    Стена ветра поднимается из травы, словно нетерпеливый швейцар. Она отгоняет туман, гонит бумаги по спирали к небу и отбивает стрелы с курса, хотя валуны великанов проходят сквозь неё, словно смущаясь за всех.
- id: wish
  flavor: >-
    Каждый учёный предупреждает, что самые могущественные слова, которые смертный может произнести, стоят дороже всего. Сказанные легкомысленно, они могут изогнуть реальность точно так, как надеялись, или же пожать плечами, повернуть формулировку в шутку и выставить счёт говорящему.
- id: word-of-recall
  flavor: >-
    Жрецы определённого толка держат одну любимую дверь в своём храме и ни одной больше. Творящий с друзьями рядом возвращается домой, в освящённое место, тогда как неподготовленный творящий находит лишь тишину и озадаченного пономаря.
- id: zone-of-truth
  flavor: >-
    Некоторые суды подвешивают круг тишины в большом зале и называют это любезностью. Вошедшие в него обнаруживают, что язык неохотно складывает обдуманную ложь, хотя умные люди учатся уходить от вопросов изящными увёртками, которые при этом не содержат неправды.
