- id: magic-weapon
  flavor: >-
    Простой клинок или дубина приобретает слабое гудение, когда твёрдая рука вдохнула в них нечто большее. Металл сохраняет эту заёмную остроту с упрямым изяществом, и старые кузнецы клянутся, что он помнит форму каждого удачного удара.
- id: magnificent-mansion
  flavor: >-
    Мерцающая дверь висит в воздухе, выглядя достаточно скромно, и открывается в комнаты, которым за ней не место. Внутри мебель добротна, хлеб тёплый, а хозяин неизменно учтив с каждым, кто вытер ноги.
- id: major-image
  flavor: >-
    Убедительный образ лошади, колокола или дующегося лорда может быть призван прямо на глазах, вместе со звуками и запахами. Он рассеивается, когда внимание творца ослабевает, и не может ни укусить, ни порезать, ни вытащить кошелёк, как бы реален ни выглядел.
- id: mass-cure-wounds
  flavor: >-
    Волна тёплого света расходится от выбранной точки и разом находит целую толпу раненых. Синяки сходятся, порезы срастаются, и даже упрямые ссадины, оставшиеся после долгой битвы, ощущают прикосновение мягкого прилива.
- id: mass-heal
  flavor: >-
    Поток исцеляющей энергии изливается из целителя и омывает всех поблизости, кто ранен или болен. Щедрость его подобна щедрости хорошего повара, варящего рагу: яд, путаница мыслей и звенящая тишина глухоты уходят прочь.
- id: mass-healing-word
  flavor: >-
    Быстрая, напевная фраза проносится над толпой, словно тёплый ветерок, и избитые и потрёпанные ощущают себя чуточку устойчивее. Многие клирики держат её наготове для схваток, после которых все выглядят немного хуже для ношения.
- id: mass-suggestion
  flavor: >-
    Мягкий толчок приходит голосом, похожим на голос старого друга, и десяток слушателей находят эту мысль совершенно разумной. Старые коллегии учат, что толчок должен звучать честно и безобидно, иначе всё обернётся дурной шуткой, которая ударит по самому творцу.
- id: maze
  flavor: >-
    Ухмыляющийся незнакомец исчезает в лабиринте, сложенном сам в себя, в кармане ниоткуда, где стены переставляются по желанию. Запертая душа может блуждать веками, прежде чем споткнётся о выход, а старые истории настаивают, что путь наружу требует хитрости, а не силы.
- id: meld-into-stone
  flavor: >-
    Путник вдавливается в гранит, словно тот — тёплое масло, и остаётся лишь тихая зернистость камня. Внизу мир глохнет и отдаляется, а камень хранит свою тайну с терпением того, кто ждал целые эпохи.
- id: mending
  flavor: >-
    Сломанную застёжку или разошедшийся шов можно стянуть обратно несколькими терпеливыми словами и парой тёмных магнитных камней. Починка не оставляет шва, который можно было бы найти, и сапожники с переплётчиками, как известно, недолюбливают, что от работы остаётся так мало следов.
- id: message
  flavor: >-
    Шёпот скользит по нити воздуха и попадает в одно конкретное ухо, оставляя остальных в комнате в неведении. Ответ возвращается так же тихо, бормотанием, которое слышно ровно настолько, насколько задумал говорящий, даже сквозь каменные стены, что обычно поглощают каждое слово.
- id: meteor-swarm
  flavor: >-
    Четыре пылающих камня срываются с холодного неба и раскалывают воздух над полем боя дождём расплавленного грохота. Там, где они падают, земля светится, а дым катится тяжёлыми кольцами, и выжившие учёные называют это короткой лекцией, которую небо прочитало во весь голос.
- id: mind-blank
  flavor: >-
    Послушный разум складывается в запертую комнату без окон, и любопытство шпионов и читателей мыслей безвредно скребётся о дверь. Эмоции стихают, личные мысли остаются личными, и даже величайшее колдовство не находит, за что зацепиться.
- id: mind-spike
  flavor: >-
    Игла псионического давления входит в один череп и оставляет острую, яркую боль. Творящий затем может чувствовать, где блуждает жертва: тонкая нить тянется по карте её мыслей, пока связь не истреплется и не угаснет.
- id: minor-illusion
  flavor: >-
    Небольшой звук, мерцание свечи или нарисованный набросок кошки может быть создан на месте на краткий миг. Внимательные глаза способны разгадать трюк, но ученик, который создаёт убедительный колокольчик, всегда пользуется успехом на вечеринках.
- id: mirage-arcane
  flavor: >-
    Скучную равнину можно нарядить болотом, а сухой овраг сойдёт за гладкую дорогу без единой фальшивой ноты. Путники входят в камыши, сапоги вязнут, и выжженная солнцем переправа становится прекрасной ложью.
- id: mirror-image
  flavor: >-
    Три мерцающих двойника творящего появляются из ничего, у каждого своя чуть иная усмешка и привычка уступать место прямо перед тем, как настоящий двинется. Нападающие бьют по отражениям и проклинают пустой воздух, пока настоящая фигура спокойно идёт дальше.
- id: mislead
  flavor: >-
    Двойник творящего стоит на виду, пока сам творящий ускользает из поля зрения. Двойник говорит, жестикулирует и бродит, как скучающий актёр на репетиционной сцене. Это ловкая приманка, которая держится лишь до тех пор, пока кто-нибудь не решит нанести удар.
- id: misty-step
  flavor: >-
    Серебристое облачко тумана окутывает творящего на миг, и когда оно рассеивается, тот оказывается совсем в другом месте. Трактирные легенды утверждают, что приём работает лучше всего, если пункт назначения выбран заранее, хотя никто этого так и не доказал.
- id: modify-memory
  flavor: >-
    Разум мягко переставляют, как писарь переставляет картотеку и оставляет несколько ящиков набитыми не теми бумагами. Те, кто оказывался на принимающей стороне, вспоминают день как приятную дымку, и именно эта дымка и является целью.
- id: moonbeam
  flavor: >-
    Столб бледного света нисходит с прохладного звёздного неба и ложится на участок луга, словно серебряный шатёр. Существа, попавшие под него, чувствуют, как свечение тянет их, а друид может медленными, продуманными жестами вести столб по полю.
- id: move-earth
  flavor: >-
    Почва, песок и глина откликаются на медленную, продуманную руку и поднимаются холмами или проседают рвами, будто земля передумала. Стены можно возвести или сровнять, и новый ландшафт выглядит так, будто был здесь всегда, тихо ворча.
- id: nondetection
  flavor: >-
    Существо или небольшой предмет окутывается тихой вуалью, мимо которой скользят взгляды гадателей. Вуаль оплачивается растёртым в пыль алмазом, который расходуется, когда защита вступает в силу, а прорицатели ворчат, что их хрустальные шары показывают лишь пустую мебель.
- id: pass-without-trace
  flavor: >-
    Мягкое серое сияние ложится на небольшой отряд, и их следы в пыли позади просто перестают появляться. Охотники, полагающиеся на следы, находят лишь голую землю, а лесные звери, кажется, забывают, что здесь кто-то проходил вообще.
- id: passwall
  flavor: >-
    Аккуратный проём в форме двери появляется в стене из дерева, штукатурки или камня и остаётся открытым достаточно долго, чтобы осторожный путник прошёл. Когда он закрывается, поверхность срастается без единой трещины, и стражник с другой стороны остаётся в недоумении, почёсывая затылок.
- id: phantasmal-force
  flavor: >-
    Маленький клочок шерсти — всё, что нужно колдуну, чтобы вплести картину в чью-то голову. Жертва видит мост, зверя или стену тумана и верит в них всей душой. Её разум делает всё остальное, придумывая объяснения каждой странности.
- id: phantasmal-killer
  flavor: >-
    Каждый разум хранит личную галерею своих худших страхов, и это заклинание проходит по ней без приглашения. Образ создан только для своего владельца и сотворён из теней, которых он боится больше всего. Некоторые жертвы просыпаются, потрясённые видением, а некоторые так и не перестают слышать шаги, которых не было.
- id: phantom-steed
  flavor: >-
    Чернильно-тёмная грива, копыта, стучащие по пустоте, и седло, сшитое из дыма. Заклинатели-самоучки называют это дешёвым способом пересечь долину, и они не ошибаются. Скакун вежливо растворяется, когда срок его истекает, и всаднику остаётся мгновение, чтобы спешиться, прежде чем земля, кажется, стряхнёт его.
- id: planar-ally
  flavor: >-
    Сделка заключается с чем-то огромным и далёким, обычно за плату монетами или услугами. Сущность посылает верного вестника, который обязан ей службой, и вестник сам вправе назвать свою цену. Старые жрецы говорят, что самые дорогие сделки оплачиваются квестами, а не золотом.
- id: planar-binding
  flavor: >-
    Связать чужеродное существо просто описать и мучительно совершить, поэтому старые коллегии настаивают на драгоценном камне в качестве платы. Существо должно оставаться неподвижным, пока произносятся слова, и только его упрямая гордость может сопротивляться. Когда оно уступает, служит с недовольной покорностью, искривляя каждый приказ в свою пользу.
