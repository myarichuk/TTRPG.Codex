- id: divination
  flavor: >-
    Паломники древних храмовых городов когда-то поднимались по лестнице из дыма, чтобы задать небесам один вопрос. Ответ приходит в виде шёпотом произнесённой пословицы или загадки с зубами, и мудрые узнают, что небо замолкает, если его спрашивать слишком часто.
- id: divine-favor
  flavor: >-
    Тихое благословение оседает в рукояти оружия, и каждый удар звенит чистым белым светом. Сталь остаётся сталью, но вдоль её лезвия несётся маленькое солнце, пока держится молитва.
- id: divine-smite
  flavor: >-
    Удар паладина приходится с внезапной вспышкой, и в воздухе раздаётся треск, похожий на раскол тонкого стекла. Исчадия и беспокойные мертвецы чувствуют, как удар уходит глубже, ведь свет жжёт сильнее всего там, где пустил корни порок.
- id: divine-word
  flavor: >-
    Одно слово, произнесённое негромко и обдуманно, несёт вес приговора. Каждый слушатель, у которого не хватает сил отмахнуться, содрогается до костей, а любой гость из иного плана отбрасывается обратно в свой мир.
- id: dominate-beast
  flavor: >-
    Зверь с диким и настороженным сердцем затихает под рукой, которая знает его язык. Между ними протягивается нить безмолвной мысли, так что приказы проходят без единого звука, и животное старается изо всех сил.
- id: dominate-monster
  flavor: >-
    Существа крупнее и опаснее подчинить труднее, и для такой связи нужна более крепкая воля. Когда чудовище склонено под волю заклинателя, безмолвные приказы бегут по связующей нити, и монстр повинуется, пока нить не истреплется или он не уйдёт к своим тёмным делам.
- id: dominate-person
  flavor: >-
    Чужой взгляд задерживается чуть дольше, чем следует, а потом глаза смягчаются и становятся послушными, словно на плечо опустилась тёплая рука. Связь держится, пока двое стоят под одним небом, хотя резкий удар или несгибаемое сердце способны её ослабить.
- id: dragons-breath
  flavor: >-
    Огонь, словно от жгучего перца, на время заключается в покорного союзника. Какой бы элемент ни выбрал заклинатель — пламя, мороз, искры, едкий яд или разъедающую слюну, союзник может выдохнуть его конусом, который накатывает на всё, что стоит слишком близко.
- id: dream
  flavor: >-
    Посланник впадает в транс и скользит по воображению спящего, неся слова и выстраивая пейзажи из песка и памяти. Спящий просыпается, а картина всё ещё светится за его глазами, и если послание было страшным, пробуждение приносит толчок холодного ужаса.
- id: druidcraft
  flavor: >-
    Шёпотом обращённые к духам природы слова выманивают из ближайшей земли маленькие, безобидные чудеса. Почка раскрывается, листок клонится к мягкому ветерку, свеча вспыхивает, или слабая лесная песня плывёт над поляной.
- id: earthquake
  flavor: >-
    Почва помнит каждую обиду, которую ей когда-либо нанесли, и сегодня сводит счёты. Камень вздыхает и раскрывается длинными трещинами, а старые башни клонятся к тому, кто стоит ближе всего к разлому.
- id: eldritch-blast
  flavor: >-
    Яркий, твёрдый луч звука и злобы срывается с руки заклинателя, и цель редко успевает его заметить. Маги старых коллегий называют его честным заклинанием, ведь оно ничего не требует и обещает лишь жало.
- id: elementalism
  flavor: >-
    Дуновение погоды, щепотка земли и облачко дыма — всё по воле заклинателя. Деревенские дети обожают это, а хозяева трактиров хотели бы, чтобы так и оставалось, ведь выточенная из воды чаша никогда не бывает так трезва, как выглядит.
- id: enhance-ability
  flavor: >-
    Прикосновение спокойной руки, а в карман для удачи спрятан клочок меха или перо, и упрямое дело словно гнётся перед тем, кто просил. Никто не назовёт это жульничеством, хотя те, кому помогли, обычно выглядят довольно собой.
- id: enlarge-reduce
  flavor: >-
    Всё, что носит и несёт тело, растёт или уменьшается вместе с ним, так что дверные проёмы — меньшая из чьих-либо забот. Одни считают этот трюк милостью, другие — грубой шуткой, а те, кого он коснулся против воли, громко спорят об этом.
- id: ensnaring-strike
  flavor: >-
    Клинок охотника ещё гудит, когда из удара выползают зелёные верёвки и туго затягиваются. Следопыты клянутся, что лозы тщательно выбирают добычу, а сама добыча, надо отдать ей должное, обычно сопротивляется им с настоящим духом.
- id: entangle
  flavor: >-
    Сама поляна оборачивается против чужаков: на участке земли поднимается путаница цепких стеблей и корней. Пойманные в зелёную ловушку обнаруживают, что ноги вдруг не слушаются, а растения с удовольствием составят им компанию, пока они не выпутаются.
- id: enthrall
  flavor: >-
    Голос, похожий на тёплую ванну и сладкое обещание, льётся и заставляет толпу забыть проверить карманы. Те, кто уже сражается рядом с говорящим, невосприимчивы, и это либо утешение, либо предупреждение — в зависимости от того, на чьей стороне стоит слушатель.
- id: etherealness
  flavor: >-
    Края заклинателя бледнеют и истончаются, и он соскальзывает в серую кайму, где мир наполовину недоделан. Там звуки глохнут, твёрдые стены в основном слухи, а небрежное возвращение может уронить путника прямо в чужую мебель.
- id: expeditious-retreat
  flavor: >-
    Быстрый взмах каблуками — и заклинатель просто оказывается в другом месте, оставляя слабый запах горячего воска и нескольких раздражённых зевак. Учёные спорят, бегство это или всего лишь ранний старт, а бегуны ярмарочных состязаний держат своё мнение при себе.
- id: eyebite
  flavor: >-
    Чернила собираются в глазах заклинателя, и один взгляд может уложить выбранного слушателя без чувств или отправить его с криком через поля. Истории такого рода полны предостережений, и эта не исключение.
- id: fabricate
  flavor: >-
    Сырой материал терпелив, и это ремесло просит его стать чем-то новым: например, воротами из упавшего бревна или мешком, сплетённым из кучи камыша. Готовая вещь не лучше материала, из которого её начали, поэтому осторожный мастер выбирает с умом.
- id: faerie-fire
  flavor: >-
    Мерцающие контуры расцветают над всем, что попало на выбранный участок, и спрятанные сумки и сложенные бочки становятся светящимися указателями для всякого, кто видит их ясно. Цвета синие, зелёные или фиолетовые, а свечение настолько яркое, что прятаться в тени становится довольно плохой шуткой.
- id: faithful-hound
  flavor: >-
    Призрачный сторожевой пёс трусцой выбегает в пустой угол, видимый только своему создателю, и держит пост с терпением, которому может позавидовать большинство людей-часовых. Всё, что подойдёт без нужного пароля, получает громкое и недвусмысленное приветствие, и соседи просыпаются, гадая почему.
- id: false-life
  flavor: >-
    Небольшой глоток дешёвого спирта, пробормотанное слово — и заклинатель чувствует прилив упрямой жизненной силы, которая не совсем то же самое, что здоровье. Аптекари называют это позаимствованной бодростью, и она спадает так же быстро, как и пришла.
- id: fear
  flavor: >-
    Холодная стена ужаса выплёскивается наружу расширяющимся веером, и самые храбрые лица бледнеют, когда холод до них доходит. Те, кто бежит, не останавливаются, чтобы объяснить себя, а наблюдатели с безопасного расстояния клянутся, что ночь стала тише.
- id: feather-fall
  flavor: >-
    Нежная рука тянется в воздух и просит падающее тело замедлиться, словно небо вдруг вспомнило о манерах. Тяжесть ворчит, но соглашается, и приземление выходит достаточно мягким, чтобы весь кувырок казался разумным планом.
- id: find-familiar
  flavor: >-
    Маленькая фигурка с умными глазами выходит из облачка благовонного дыма и садится у локтя нового хозяина. Каждый такой спутник — шпион и критик, и он ни за что не желает оставаться в стороне от лучших моментов любого приключения.
- id: find-steed
  flavor: >-
    Потусторонний скакун появляется в вспышке света, с преданным взглядом и терпением, будто ждавшим всё это время. Его облик — крупный и разумный зверь, которого выбрал заклинатель, и каким бы ни было его естество, он совсем не намерен быть чьим-то праздным украшением.
- id: find-the-path
  flavor: >-
    Нить направления разматывается внутри разума, сначала слабая, а затем уверенная, указывая на место, которое искатель хорошо знает. Перекрёстки перестают быть азартной игрой: нить всегда знает, какой поворот ведёт прямее всего, и искатель понимает устройство местности, не спрашивая помощи у незнакомца.
