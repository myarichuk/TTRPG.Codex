- id: acid-arrow
  flavor: >-
    Зелёная полоса едко пахнущего света срывается с руки заклинателя и в месте попадания рассыпается брызгами жгучей жидкости. Учителя в дешёвых школах пользуются этим приёмом, чтобы наглядно преподать урок, и ожог долго не проходит, даже когда брызги давно высохли.
- id: acid-splash
  flavor: >-
    Пузырь кислого зелёного пара вздувается над выбранным местом и лопается кольцом шипящих капель. Ученики задних рядов осваивают его первыми, обычно по неосторожности, и ни разу он не улучшил ни одного званого ужина.
- id: aid
  flavor: >-
    Полоска белой ткани, завязанная на плечах нескольких добровольцев, может придать уставшей компании больше смелости, чем она заслуживает. Полевые лекари речных народов клянутся этим обычаем, и никто не спрашивает, зачем нужны узлы.
- id: alarm
  flavor: >-
    Колокольчик и серебряная нить охраняют дверной проём, окно или участок пола, дожидаясь непрошеной ноги. Колдуны-самоучки называют это дешёвой верностью, ведь она никогда не спит и никому ничего не разбалтывает.
- id: alter-self
  flavor: >-
    Быстрая перестройка жабр, перепонок или позаимствованного лица, которая держится, пока у заклинателя хватает духу. За ужином результаты выглядят странно, но старые коллегии утверждают, что хорошая маскировка стоит нескольких неловких знакомств.
- id: animal-friendship
  flavor: >-
    Небольшое подношение еды и спокойный взгляд могут расположить к себе дикое существо, по крайней мере на день. Зверь охотнее прощает первый тычок, чем второй, и старые охотники-ловцы это знают.
- id: animal-messenger
  flavor: >-
    Небольшое существо с письмом под перьями трусцой направляется к месту, где заклинатель однажды бывал. Оно доносит слова нужному незнакомцу в нужном городе, чего не всегда добиваются курьеры, и в пути не останавливается поболтать.
- id: animal-shapes
  flavor: >-
    Круг верных друзей сбрасывает собственный облик и принимает форму крупного зверя, сохраняя свои воспоминания и мнения. Позаимствованные тела неуклюжи с руками и инструментами, и мудрые оставляют карманные часы дома.
- id: animate-dead
  flavor: >-
    Кости или труп поднимаются с тоскливым пустым терпением, дожидаясь голоса, который держит поводок. Старые коллегии считают это мрачной рутиной, а лучшие практики ведут учёт каждому слуге, которого подняли.
- id: animate-objects
  flavor: >-
    Чайники, стулья и столбы забора шевелятся и отращивают неровные ножки, жаждая работы. Они топают за заклинателем, как толпа неоплачиваемых работяг, и рассыпаются обратно в обычный хлам, стоит их разбить вдребезги.
- id: antilife-shell
  flavor: >-
    Слабо мерцающий купол из живого воздуха вежливо удерживает снаружи толпу из плоти и крови, пока кости и глина свободно ходят внутрь. Друиды старых рощ считают его учтивой стеной, хотя гость, который войдёт не с той стороны, тотчас нарушит эту тишину.
- id: antimagic-field
  flavor: >-
    Неподвижный пузырь ничего окружает заклинателя, и каждое волшебство внутри него затихает, словно перерезанная струна. Учёные веками спорят, является ли эта тишина даром или кражей, и споры так и не разрешены.
- id: antipathy-sympathy
  flavor: >-
    Тихое проклятие притяжения или отвращения, закреплённое на одном предмете и направленное на целый вид существ. Осторожные учёные твердят, что выбор между любовью и ненавистью — единственное настоящее решение в заклинании, а всё остальное — бумажная волокита.
- id: arcane-eye
  flavor: >-
    Стеклянный глаз из собранного света висит в воздухе и дрейфует туда, куда устремляется внимание заклинателя. Он видит во всех направлениях сразу, что делает его отличным соглядатаем и ужасным гостем в доме.
- id: arcane-hand
  flavor: >-
    Огромная призрачная ладонь из мерцающей силы разворачивается рядом с заклинателем и повторяет каждый жест, словно скучающий ученик, передразнивающий наставника. Она может толкнуть, прижать или сжать, и больше всего ей по душе, когда есть работа.
- id: arcane-lock
  flavor: >-
    Закрытая дверь или запечатанный сундук получает упрямый магический захват, с которым не справятся ни обычные ключи, ни лом. Заклинатель может держать короткий список людей, которым позволено проходить, а сказанное слово ненадолго откроет замок, прежде чем он снова защёлкнется.
- id: arcane-sword
  flavor: >-
    Призрачный клинок висит в воздухе, крохотный меч из чистого намерения, который бросается на выбранного врага и затем ждёт своего хода. Бардам нравится его театральность, а маги делают вид, что ничего не замечают.
- id: arcanists-magic-aura
  flavor: >-
    Небольшой квадрат шёлка, прижатый к покорному существу или к лежащему предмету, обманывает всякого, кто читает магию. Его владельцы любят говорить, что это костюм для души, хотя большинство из них просто хочет хорошей маскировки.
- id: astral-projection
  flavor: >-
    Тела лежат в тихом сне, а их хозяева уплывают в бледное бескрайнее море мысли. Тонкая серебряная нить удерживает каждого путника на привязи к дому, и древние тексты предупреждают, что порванная нить — единственное, что страшнее, чем заблудиться там.
- id: augury
  flavor: >-
    В комнате воцаряется тишина, пока невидимый свидетель взвешивает дорогу впереди и выносит приговор одним словом. Ответ не лучше палочек, костей или карт, которые его принесли, и мудрые платят за то, чтобы знамения не лгали.
- id: aura-of-life
  flavor: >-
    Тёплое сияние с золотистой каймой расходится от заклинателя, поддерживая больных и отгоняя серый налёт гниения. Ветераны учат, что сияние длится лишь до тех пор, пока держится упрямство носителя, и эту ложь стоит принимать на веру.
- id: awaken
  flavor: >-
    Терпеливый ритуал, при котором по дорогому самоцвету прочерчиваются светящиеся пути, наделяет укоренённое или листвяное существо разумом и несколькими словами. Пробуждённое создание обычно милое, слегка растерянное и очень привязывается к первому доброму лицу, которое увидело.
- id: bane
  flavor: >-
    Туман невезения окутывает небольшую группу врагов, делая каждое их движение и каждую решимость чуть тяжелее. Чернокнижники и жрецы сходятся во мнении, что приём срабатывает лучше всего, если жертвы только что похвастались своим мастерством.
- id: banishment
  flavor: >-
    Врага отправляет скользить прочь из мира в унылое безвредное ничто, где он стоит оглушённый и не может действовать. Большинство существ возвращается, когда заклинание спадает, хотя существа дикой породы порой оказываются совсем в другом месте.
- id: barkskin
  flavor: >-
    Прикосновение превращает кожу покорного друга в кору, крепкую и узловатую, так, как мог бы выглядеть старый дуб, решивший стать воином. Следопыты глухих лесов говорят, что кора терпелива и мудра, но огня она не прощает.
- id: beacon-of-hope
  flavor: >-
    Фонарь, зажжённый на высоком шесте, виден по всей долине, и этот горит ровнее большинства. Те, кто стоит под ним, стойко противятся страху и ужасу, а любое исцеление, дошедшее до них, приживается полностью. Колдуны-самоучки клянутся, что он удерживает угасающее тело по эту сторону могилы.
- id: befuddlement
  flavor: >-
    Некоторые умы слишком умны для собственного блага, и это заклинание — средство, которое старые коллегии приберегали для них. Сфокусированный выброс психической силы заставляет жертву бессмысленно таращиться в стену, не способную сплести ни одного заклинания. Мудрецы говорят, что восстановление приходит медленно, по одной упрямой мысли за раз.
- id: bestow-curse
  flavor: >-
    Прикосновение оставляет пятно, которое не отстирает никакая вода, и жертва чувствует, как оно оседает в костях, словно сырость в старых стенах. Неловкие руки, кислая удача, привычка отворачиваться от зеркал: проклятие само выбирает, какой гадостью наградить, а старые жрецы предупреждали, что сделки с такой магией редко заканчиваются чисто.
- id: black-tentacles
  flavor: >-
    Эбеновые конечности вырываются сквозь булыжник и обвиваются вокруг всего, что по глупости встанет на этот участок земли. Скользкие канаты, цепкие руки и внезапная потеря опоры — вот что приходит на ум. Учёные настаивают, что эти твари призваны, а не выросли сами, что, впрочем, никого не избавило от мысли, что лучше было остаться дома.
- id: blade-barrier
  flavor: >-
    Стена гудящих клинков вращается там, где раньше был путь, и перемалывает всё, что пытается пройти. Камню она безразлична, зато сталь крошится, и потому её одинаково любят и скучающие, и осторожные. Инструкторы преподают её как урок о том, как провести черту и потом не спорить о ней.
