- id: plane-shift
  flavor: >-
    Кольцо сцепленных рук, раздвоенный жезл, гудящий заёмным расстоянием, и рывок, оставляющий желудок позади. Путешественники говорят, что место назначения прибывает по частям: сначала запах, потом цвет без названия на родине, и лишь затем почва. Разумные всегда берут с собой запасную пару сапог.
- id: plant-growth
  flavor: >-
    Живые изгороди густеют в стены, корни пробиваются сквозь булыжник, а сад приносит плоды тяжелее, чем заслуживает любой фермер. Старые речные люди говорят, что зелёные существа помнят, кто их разбудил. Густой подлесок отлично служит преградой, и зерно этому рад.
- id: poison-spray
  flavor: >-
    Облако болезненного тумана, бледно-зелёного и слегка сладкого, плывёт к испуганной цели. Любители лабораторий настаивают, что пар — это простая химия, а учёные в своих башнях громко не соглашаются. Так или иначе, жертва ощущает вкус металла долго после того, как кашель стих.
- id: polymorph
  flavor: >-
    Кокон обвивает объект, и внутри шевелится нечто незнакомое. Существо сохраняет сердце и воспоминания, но его облик принадлежит зверю, выбранному творящим. Его снаряжение уходит в новое тело и перестаёт быть тем, чем человек может воспользоваться.
- id: power-word-heal
  flavor: >-
    Единственное слово исцеления, произнесённое голосом, похожим на тёплую воду над камнями. Раны срастаются, яд уходит, а дрожь в конечностях просто прекращается. Даже поникшая фигура выпрямляется настолько, чтобы встать и встретить день.
- id: power-word-kill
  flavor: >-
    Один слог чистой команды, и сердце просто перестаёт решать, биться ему или нет. Слабые падают без звука, оставляя могильщику лишь прибрать. Более крепкие жертвы терпят бурю внутренней боли, прежде чем замолкнуть.
- id: power-word-stun
  flavor: >-
    Мысль прижимается плашмя, как лист между страницами, и разум затихает. Могучие существа стряхивают удар, лишь чтобы обнаружить, что их ноги забыли своё назначение. Оглушённый разум выбирается обратно понемногу с каждым ходом, пока туман не рассеется.
- id: prayer-of-healing
  flavor: >-
    Долгая, шёпотом произносимая литания, которую разделяет малый круг верующих, служба, где никто не смотрит на часы. Их синяки бледнеют, дыхание становится легче, и они покидают комнату с лёгкой походкой. Те, кто уже был благословлён однажды, должны проспать свою усталость, прежде чем слова вновь подействуют.
- id: prestidigitation
  flavor: >-
    Простые фокусы, которые каждый ученик осваивает первыми: сноп искр, дуновение ветра, свеча, которая зажигается сама и тут же передумывает. Кружки по желанию согреваются или остывают, а упрямое пятно исчезает бесследно. Немногие мастера утруждают себя записью этих трюков, поэтому наставники называют их просто работой по дому.
- id: prismatic-spray
  flavor: >-
    Восемь полос цветного света веером расходятся конусом, и каждая несёт свою беду. Одна обжигает, как раскалённая медь, другая пахнет кислой гнилью, а третья превращает существо в негнущуюся статую из серого камня. Немногие зрители достаточно смелы, чтобы стоять на её пути.
- id: prismatic-wall
  flavor: >-
    Вертикальный лист света, переливающийся семью цветами, поднимается там, где прежде был пустой воздух. Слои проходятся по порядку, один за другим, и каждый требует от дерзнувшего пройти нечто своё. Прикосновение заставляет нервы гудеть, а свечение достаточно ярко, чтобы колоть глаза стоящим рядом.
- id: private-sanctum
  flavor: >-
    Куб тишины, вырезанный из мира, со стенами, поглощающими звук, и туманом, который не пропускает взгляд. Картографы и соседи-сплетники одинаково находят, что места попросту нет, когда они смотрят туда. Если творить заклинание на том же месте каждое утро в течение года, тишина становится постоянной.
- id: produce-flame
  flavor: >-
    Маленькое пламя лежит на открытой ладони, достаточно яркое, чтобы читать при нём, но не дающее ни капли тепла. Владелец может метнуть струю огня в соперника или запертую дверь, и искры никогда не оказываются там, где ожидаешь. Старые друидские круги называют это очагом, который отказывается сидеть на месте.
- id: programmed-illusion
  flavor: >-
    Сцена заранее отрепетирована и затем оставлена ждать, безмолвная и невидимая, своего сигнала. Когда спусковой миг наконец наступает, представление оживает точно по сценарию, а затем исчезает и дуется, прежде чем сможет выступить снова. Тот, кто ткнёт в неё, встретит пустое эхо, которое выдаст игру.
- id: project-image
  flavor: >-
    Бледный двойник творящего выходит вперёд и говорит тем же голосом, с той же привычкой делать паузу перед ложью. Он переходит через расстояния, которые творящий когда-либо видел, и каждый встреченный взгляд видит знакомое лицо. Ударьте его, и он рассыплется, оставив настоящего говорящего гадать, куда подевалось доверие.
- id: protection-from-energy
  flavor: >-
    Тонкое мерцание ложится на добровольное тело и отводит худшую из выбранных сил: мороз, пламя, кислоту, искру или глубокий рокот грома. Творящий выбирает стихию до того, как заклинание вступает в силу, и щит помнит этот выбор до самого окончания действия. Кузнецы и моряки одинаково клянутся этим заклинанием.
- id: protection-from-evil-and-good
  flavor: >-
    Фляга святой воды выливается на одну добровольную душу, запечатывая защиту от определённых существ, которые проникают сюда извне. Гости из неправильных краёв потустороннего находят защищённого трудно осязаемым, а их шёпот скатывается с него, как дождь. Защита длится лишь до тех пор, пока творящий удерживает на ней ровный разум.
- id: protection-from-poison
  flavor: >-
    Простое касание прекращает болезнь в крови, как будто тело лишь ждало разрешения её выкашлять. Некоторое время после этого плоть сопротивляется следующей дозе, а желудок становится крепче. Травники речного квартала клянутся, что эффект упрямее, чем признаёт любая надпись на склянке.
- id: purify-food-and-drink
  flavor: >-
    Тихо сказанное слово превращает испорченный бульон во что-то, чего не стыдно подать повару. Гниль поднимается лёгким облачком, оставляя хлеб хрустящим, а вино прозрачным. Рыночные стражи всё равно иногда проверяют хлеб дважды, и справедливо.
- id: raise-dead
  flavor: >-
    Алмаз размером со сливу растворяется в ране, и дыхание возвращается в тело, которое неподвижно лежало несколько дней. Возвращение не бывает мягким пробуждением. Воскрешённые ходят тяжело неделями, и их равновесие и смелость возвращаются медленно.
- id: ray-of-enfeeblement
  flavor: >-
    Тонкий луч серого света проникает в кости цели, и мышцы начинают ощущаться, как мокрая бумага. Старые коллегии преподают его как жестокий урок терпения, ведь жертва раз за разом пытается стряхнуть слабость. Каждая неудачная попытка восстановиться лишь даёт лучу новый шанс укусить.
- id: ray-of-frost
  flavor: >-
    Бело-голубая полоса холода срывается с пальцев творящего и падает с треском инея. Речные люди утверждают, что холод задерживается в ногах существа надолго после того, как ожог проходит, и каждый шаг становится маленьким спором. Драчуны любят его в ссорах, ведь замёрзшая стопа прекращает больше споров, чем длинная речь.
- id: ray-of-sickness
  flavor: >-
    Зеленоватый луч выскальзывает из кончиков пальцев и находит цель с неприятным шипением. Тошнотворное ощущение, которое он оставляет, из тех, что переворачивают желудок долго после удара. Аптекари жалуются, что его кислый запах въедается в одежду, справедливая цена за такое мелкое заклинание.
- id: regenerate
  flavor: >-
    Медленное зелёное тепло ползёт по израненному телу и срастает плоть быстрее любой мази. Жестянщики крутят маленькое латунное колёсико, чтобы удержать эффект, и починка продолжается долго после того, как пациент встаёт на ноги. Говорят, даже потерянные пальцы отрастают, и это делает счёт целителя совсем иным делом.
- id: reincarnate
  flavor: >-
    Мёртвому путнику дают новое тело и второй шанс на жизнь, хотя редко то же лицо. Душа приходит со своими воспоминаниями, и это надолго делает разговоры в трактире неловкими. Целители болотных городов настаивают, что новая форма подходит душе лучше, чем когда-либо подходила старая.
- id: remove-curse
  flavor: >-
    Осторожное прикосновение распутывает каждое проклятие, цепляющееся за одно существо или предмет, словно узел, ослабленный терпеливыми пальцами. Проклятые безделушки — дело иное, ведь проклятие остаётся на месте, даже когда связь с владельцем разорвана. Разумные коллекционеры держат запасную пару перчаток наготове именно для такого момента.
- id: resilient-sphere
  flavor: >-
    Стеклянный пузырь захлопывается над существом или небольшим предметом, тихо гудит и стряхивает каждый удар снаружи. Ничто не проходит сквозь его оболочку: ни сталь, ни искры, ни хитрое заклинание соперника. Те, кто внутри, по-прежнему могут дышать, что сделало сферу любимицей нервных путешественников и очень осторожных шахматистов.
- id: resistance
  flavor: >-
    Добровольного спутника успокаивают мягким словом и слабым мерцанием, и он готов принять удар, не дрогнув. Каждый вред встречает чуть более толстую стену, если творящий назовёт нужный вид беды. Плащевые мастера давно продают более дешёвую копию этого приёма, и никто никогда не просил их прекратить.
- id: resurrection
  flavor: >-
    Алмаз рассыпается в руке в ничто, и давно умершая фигура делает первый вдох. Смертельные раны срастаются, утраченные конечности возвращаются, а старый яд в крови вымывается начисто. Возвращение — это испытание, оставляющее воскрешённого неуклюжим и раздражительным, пока тело не вспомнит, как быть живым.
- id: reverse-gravity
  flavor: >-
    Мелкий гравий, случайные шляпы и перепуганные птицы взмывают все вместе, будто небо решило оттянуть всё назад. Всё, что не держится прочно, дрейфует вверх, пока не упрётся в потолок или не зависнет на вершине, ожидая, когда тяготение опомнится.
