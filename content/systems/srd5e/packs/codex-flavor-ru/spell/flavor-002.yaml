- id: bless
  flavor: >-
    Несколько слов, пробормотанных над горсткой спутников, на время делают их удачливыми, словно фортуна обратила на них внимание. Их удары попадают чуть точнее, а разум чуть крепче держится против обмана. Жрецы клянутся, что эффект обязан скорее хорошей осанке, чем какому-либо божеству, хотя никто ещё не проверял это утверждение.
- id: blight
  flavor: >-
    Увядание проходит через живое существо, как иней через поздний цветок, оставляя серую гниль там, где была зелень. Растения вянут первыми и быстрее всего, что делает это заклинание любимым у тех, кто недолюбливает сады и тех, кто за ними ухаживает.
- id: blindness-deafness
  flavor: >-
    Внезапная тишина или внезапная тьма, выбранная заклинателем, и жертва остаётся нащупывать мир не теми чувствами. Каждый ход даёт новый шанс стряхнуть это, что обычно делает страдальца чересчур драматичным во всей этой истории.
- id: blink
  flavor: >-
    Некоторые заклинатели по прихоти броска кубика ускользают из обычного мира в серое, полувидимое место, где настоящие улицы лишь тени. Они проходят сквозь стены и между мгновениями и возвращаются с историями, в которые никто толком не верит.
- id: blur
  flavor: >-
    Очертания носящего смягчаются, словно фигура, увиденная сквозь стекло в дождевых потёках, так что удары и стрелы находят не то место пустого воздуха. Невозмутимы лишь те, кто видит чувствами, выходящими за пределы зрения, и они, как правило, невыносимо самодовольны по этому поводу.
- id: burning-hands
  flavor: >-
    Тонкий лист огня срывается веером с кончиков пальцев, опаляя всё на пути и поджигая бумагу и сухую ткань. Практики держат рядом ведро, ведь заклинание отлично разжигает пожары и плохо их гасит.
- id: call-lightning
  flavor: >-
    Над небом, спокойным ещё мгновение назад, собирается гроза, и заклинатель может стянуть вниз разряд из её основания. Всё, что окажется под тучей, получит потрескивающее напоминание о том, кто ведает погодой. Друиды старых рощ считают это крайним средством, ведь грозы имеют привычку не слушаться указаний.
- id: calm-emotions
  flavor: >-
    Тишина накатывает на толпу, как отлив, и крик стихает на лицах ближайших к центру. Гнев остывает, паника ослабляет хватку, а упрямое желание драться на время уходит. Дипломаты определённого склада держат это заклинание при себе, ведь спокойная комната — слушающая комната.
- id: chain-lightning
  flavor: >-
    Молния бьёт один раз и затем не желает останавливаться, перескакивая от тела к телу, словно слух на ногах. Каждая новая жертва ощущает толчок, а запах палёных волос долго держится, когда небо уже стихло. Маги бури говорят, что это самая общительная погода, какую им доводилось создавать.
- id: charm-monster
  flavor: >-
    Мягкий голос и ровный взгляд могут заставить почти любое существо почувствовать, что заклинатель — самая приятная компания на свете. Очарованный следует за ним со стеклянным терпением, пока что-нибудь не выдернет его из этого состояния. Укротители ценных животных считают это самым дешёвым способом удержать норов в узде.
- id: charm-person
  flavor: >-
    Приятный взгляд, тёплая улыбка и уместный комплимент могут превратить незнакомца в друга на время действия заклинания. Новый друг рад компании и на удивление неохотно слушает дурное слово о заклинателе. Трактиры речных районов давно спорят, считать ли это хорошими манерами или шалостью.
- id: chill-touch
  flavor: >-
    Прикосновение, холодное, как камень погреба, оставляет серую боль, и рана ещё какое-то время отказывается затягиваться. Гробовщики клянутся, что холод приходит откуда-то глубоко под землёй, где мёртвые держат собственную погоду.
- id: chromatic-orb
  flavor: >-
    Маленькая сфера накопленной энергии швыряется в цель, и её цвет объявляет, какую беду она намерена причинить. Кислота шипит, яд кисло отдаёт, мороз кусает, пламя вспыхивает, а гром сотрясает зубы. Иногда сфера не в силах устоять перед второй целью, и никто толком не знает почему.
- id: circle-of-death
  flavor: >-
    Тёмная энергия расходится кругами из одной выбранной точки и вытягивает цвет и тепло из всего, что попадает в её радиус. Трава буреет, свечи чадят, и живым вдруг кажется, что они стали старше, чем были за завтраком. Целители и могильщики сходятся во мнении, что это ужасное заклинание и очень действенное.
- id: clairvoyance
  flavor: >-
    Чувствительный соглядатай, настолько слабый, что его никто не замечает, уплывает к знакомому заклинателю месту, и то, что он воспринимает, течёт обратно так, будто заклинатель стоит там сам. Писцы далёких обсерваторий сосредотачивали работу с помощью украшенного самоцветами рога или стеклянного глаза и клялись, что соглядатай предпочитает знакомые комнаты.
- id: clone
  flavor: >-
    Копия тела медленно растёт в запечатанном сосуде, тихая и пустая до назначенного часа. Когда оригинал падает, запасной шагает наружу, неся лицо, которое ждало своей очереди. Философы веками спорят о том, наследует ли копия долги, и юристы пока так и не решили этот вопрос.
- id: cloudkill
  flavor: >-
    Нездоровый жёлто-зелёный туман катится из выбранной точки и оседает на всё внизу, так густо, что глаза слезятся, а горло смыкается. Горняцкие города веками боялись таких же испарений, поэтому осторожные алхимики дают заклинанию мрачное название.
- id: color-spray
  flavor: >-
    Щепотку цветного песка подбрасывают в воздух, и он рассыпается вспышкой мерцающего света. Тот, кто попал в веер этого блеска, щурится и моргает, почти ничего не видя, пока вспышка не угаснет. Уличные артисты давно завидуют этому приёму, хотя никогда не признаются, что позаимствовали его.
- id: command
  flavor: >-
    Одно слово, произнесённое правильным тоном, может заставить упрямого слушателя шагнуть вперёд, опуститься на колени или просто замереть. Строевые сержанты и нервные хозяева ценят этот приём, и он работает лучше всего, когда говорящий звучит так, будто уверен в повиновении.
- id: commune-with-nature
  flavor: >-
    Тихий ритуал позволяет друиду вслушаться в землю, и земля отвечает языком ветра, корней и воды. Вопросы о том, что лежит за следующим хребтом, получают мягкий, уверенный ответ о местности. Отшельники говорят, что ответы становятся слабее там, где камень и механизмы оттеснили зелень.
- id: commune
  flavor: >-
    Тихая аудиенция с чем-то гораздо более древним, чем любой храмовый колокол, достигается через струйку сладкого благовония и шёпотом произнесённую просьбу. Ответы приходят короткими словами, и умелый спрашивающий учится формулировать каждый вопрос так, чтобы голое «да» или «нет» нельзя было обратить против него.
- id: comprehend-languages
  flavor: >-
    Чужие языки на время теряют туман, и речь, которая мгновение назад была бессмыслицей, обретает ясный смысл. Исписанные страницы тоже отдают свой смысл, но только тому читателю, который касается бумаги. Шифры же хранят свои тайны, ведь понимание слов — не то же самое, что умение видеть сквозь умную ложь.
- id: compulsion
  flavor: >-
    Толпа зрителей обнаруживает, что её шаги склоняются к одному направлению, словно тёплое течение обволокло их. Их пути никто не тянет цепями, но каждый шаг подаётся навстречу внушению. Многие стряхивают чары, как только к ним возвращается собственное упрямое чувство себя.
- id: cone-of-cold
  flavor: >-
    Выдох зимы вырывается наружу и катится по широкому клину открытого воздуха, покрывая инеем всё, чего касается. Попавшие в его путь могут обратиться в сверкающие статуи и оставаться такими, пока какое-нибудь тепло не вернёт их к жизни. Старые маги-самоучки говорят, что худшее — тишина, которая наступает потом.
- id: confusion
  flavor: >-
    Мысли разлетаются, как спугнутые воробьи, внутри толпы свидетелей, и каждая уводит в свою странную сторону. Одни стоят в растерянности, другие спотыкаются, а некоторые набрасываются на того, кто ближе. Трактиры старого квартала до сих пор спорят, проклятие это или милость.
- id: conjure-animals
  flavor: >-
    Стая призрачных зверей собирается из диких мест: волки, змеи или птицы, очерченные мерцаниями, словно дыхание в холодное утро. Они бесплотны и проскальзывают сквозь камень и сталь, но способны загнать врага в дурной угол с пугающим терпением.
- id: conjure-celestial
  flavor: >-
    Столб белого света нисходит с неба, которое не совсем то, что над головой, и освещает узкую башню воздуха, где рождается яркое присутствие. Те, кто стоит внутри, чувствуют, как тепло проникает в кости, а других обжигает глухой блеск, от которого слезятся глаза. Зрители клянутся, что небо обратило на них внимание.
- id: conjure-elemental
  flavor: >-
    Дух камня, пламени, бури или прилива висит в воздухе, его очертания зыбки и призрачны. Его природа определяет укус: треск молнии, раскат грома, яркая вспышка огня или холод до костей. Тот, кто подойдёт слишком близко, может оказаться втянутым в испытание на проворство.
- id: conjure-fey
  flavor: >-
    Бледный, озорной дух возникает в том облике, который выбрал заклинатель, весь из рогов и мерцания. Он может ударить когтем психического давления, и поражённый враг на время растеряется и испугается. Это меньше похоже на призыв, чем на незваный визит соседа, который так и не научился стучаться.
- id: conjure-minor-elementals
  flavor: >-
    Малые духи стихий кружат вокруг заклинателя свободным кольцом, вспыхивая инеем, огнём, молнией или кислотой по мере нужды момента. Каждый удар по врагу внутри кольца несёт острое дополнительное жало, а земля там становится коварной для всякого, кто захотел бы через неё броситься.
