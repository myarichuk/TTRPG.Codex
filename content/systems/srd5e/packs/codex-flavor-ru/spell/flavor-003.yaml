- id: conjure-woodland-beings
  flavor: >-
    Духи природы вьются облаком вокруг заклинателя, яркие, как искры в продуваемой ветром изгороди, и хватают всё, что забредает в их пляску. Существо, попавшее в вихрь, чувствует внезапный нажим дикой силы, хотя быстрый ум может ускользнуть от худшего. Лесной народец клянётся, что духи не любят бронированных нарушителей.
- id: contact-other-plane
  flavor: >-
    Шёпот откуда-то издалека касается разума заклинателя и несёт голос древнего разума из-за небес. Такая компания опасна, и связь может расколоть мысли учёного, как старое стекло. Те, кто выходит из неё невредимым, получают горсть тупых и коротких ответов, часто не длиннее одного слова.
- id: contagion
  flavor: >-
    Одно прикосновение оставляет болезненный налёт под кожей, заразу, которая разносится по крови, как гниль по старой древесине. Тело жертвы ведёт долгую и мучительную борьбу. Недуг тянется днями, а его худшая жестокость приходится на ту силу, которую назвал заклинатель.
- id: contingency
  flavor: >-
    Подготовленное заклинание тихо лежит в резерве и ждёт условия, которое заклинатель выбрал заранее. Тот, кто планирует тщательно, может добиться того, что простая защита встанет на место именно тогда, когда она нужна, словно ловушка, поставленная в темноте. Учёные спорят, является ли такая предусмотрительность мудростью или страхом в более вежливой оболочке.
- id: continual-flame
  flavor: >-
    Маленькое пламя расцветает на поверхности предмета, достаточно яркое, чтобы читать при нём в большой комнате, но прохладное на ощупь и никогда не требующее топлива. Его можно накрыть или спрятать за абажуром, но ни дыхание, ни плеск воды его не погасят. Мастера старых ламп давно завидуют его терпению.
- id: control-water
  flavor: >-
    Реки и лужи подчиняются одной воле: поднимаются стенами, стягиваются в водовороты или уходят вниз, оставляя голые камни и грязь. Резкий взмах запястья может превратить гавань в ловушку или наводнение в мягкую оттепель. Ровная сосредоточенность удерживает их, и вода угрюмо возвращается к своей форме, как только сосредоточенность сбивается.
- id: control-weather
  flavor: >-
    Облака гнутся под одной волей над обширным участком местности, и заклинатель может уговорить солнце, дождь или ветер сменить настроение. Небо меняется неохотно и на протяжении долгого времени. Заклинание заканчивается, если заклинатель уходит под крышу, ведь небо отзывается только тем, кто стоит под ним.
- id: counterspell
  flavor: >-
    Резкое слово отказа пересекает незавершённое заклинание другого мага и гасит рабочую искру слабым шипением. Попытка не всегда срывается, ведь цель может сопротивляться упрямым усилием воли. Энергия, потраченная на неудавшееся действие, просто пропадает, и эту потерю никто не может вернуть.
- id: create-food-and-water
  flavor: >-
    Простая провизия появляется из ниоткуда, скромная и сытная, принимая форму любого блюда, которое пожелает заклинатель, а рядом в кувшины или сосуды льётся чистая вода. Караваи и похлёбки не сохранятся, поэтому пир лучше съесть сразу, пока он ещё горячий. Путники ни разу не жаловались на вкус, только на недостаток приправ.
- id: create-or-destroy-water
  flavor: >-
    Вода приходит и уходит по воле заклинателя: ведро наполняется из ничего или дождь из капель падает сквозь небольшой участок воздуха, гася огонь. Обращённая в другую сторону, та же магия выпивает воду из кувшина или растворяет гряду тумана.
- id: create-undead
  flavor: >-
    Мертвецов можно поднять только после заката, и несколько трупов встают голодными бредущими тварями, которые повинуются тихим приказам заклинателя. Каждый несёт мрачную неподвижность могилы, а холодный ветер, кажется, тянется за новыми слугами куда бы они ни пошли.
- id: creation
  flavor: >-
    Клочья тени собираются в вещь, которая выглядит плотной, будь то дерево, ткань, камень или металл, — что заклинатель способен ясно себе представить. Хрупкие создания уходят быстрее прочных, а теневое вещество так и не забывает, откуда пришло.
- id: cure-wounds
  flavor: >-
    Тепло течёт через прикосновение и срастает разорванную кожу и ушибленные мышцы, а тело поднимается быстрее, чем кажется возможным. Опытные руки делают свечение ярче, и даже неловкое прикосновение приносит некоторое облегчение.
- id: dancing-lights
  flavor: >-
    Горсть огоньков, похожих на факелы, фонари или дрейфующие шары, покачивается в воздухе и может быть подманена, чтобы сложиться в смутную человеческую фигуру. Она движется грациозным, мерцающим шагом и порхает над крышами, как кошка, охотящаяся на мышей.
- id: darkness
  flavor: >-
    Чернила, вылитые в воздух, образуют сферу мрака, которая поглощает свет факела целиком. Даже зоркие глаза, привыкшие к сумраку, ничего не находят внутри, а простая крышка из ткани или железа способна её задушить. Колдуны-самоучки любят прятать за ней свои крадущиеся шаги.
- id: darkvision
  flavor: >-
    Некоторые фонарщики клянутся, что тьма — лишь слух, распущенный людьми, которые так и не научились щуриться. Позаимствованное чувство, вложенное в глаза покорного друга, позволяет ему читать тёмные вывески таверн так же легко, как в полдень.
- id: daylight
  flavor: >-
    Колдуны-самоучки называют это взятым напрокат полднем. Яркий шар поднимается над площадью и разливает тёплый белый свет по каждой брусчатке, а существа, прячущиеся в обычном полумраке, уползают искать более прохладную тьму.
- id: death-ward
  flavor: >-
    Упрямые целители учат простому правилу: тело может пасть, но последняя нить держится. Малый знак, прижатый к груди друга, покупает один отважный вдох, прежде чем могила предъявит свои права.
- id: delayed-blast-fireball
  flavor: >-
    Яркая нить жёлтого света срывается с заклинателя и повисает в воздухе светящейся бусиной, тёплой и терпеливой. Тот, кто по неосторожности её коснётся, обнаружит, что она жадна до жара, и чем дольше она ждёт, тем больше огня поглотит перед финальным ревущим взрывом.
- id: demiplane
  flavor: >-
    Осторожные учёные тесных лавок со свитками описывают дверь, которая не открывается ни на одну карту. За тёмной рамой ждёт простая комната из камня или дерева, подметённая и пустая, готовая принять всё, что путник решит в ней оставить.
- id: detect-evil-and-good
  flavor: >-
    Благочестивый холодок пробегает по коже, когда приближается дурная компания. Любые тени, духи или беспокойные мертвецы, таящиеся рядом, проявляются слабыми притяжениями, словно стрелка компаса, поворачивающаяся в подвале.
- id: detect-magic
  flavor: >-
    Воздух старой читальни покалывает, когда поблизости задерживается чьё-то очарование. Над обычными на вид вещами расцветают слабые цветовые ореолы, и терпеливый учёный может узнать, какая арканная школа впервые их соткала.
- id: detect-poison-and-disease
  flavor: >-
    Осторожный травник обнюхивает комнату, прежде чем коснуться чаши. Горькие запахи яда, спор и подкрадывающейся хвори звенят, как маленькие колокольчики, и каждый сообщает своему хозяину, какая беда ждёт в темноте.
- id: detect-thoughts
  flavor: >-
    Чтецы мыслей в задних комнатах некоторых трактиров любят говорить, что толпа — это одно длинное бормотание. Если настроиться на него вблизи, бормотание распадается на отдельные тихие голоса, и при терпении слушатель может уловить, чего больше всего хочет ближайший из них.
- id: dimension-door
  flavor: >-
    Быстрый шаг в сторону сквозь ткань вещей — и путник внезапно стоит на балконе на другом конце города. Между отправлением и прибытием нет ничего, кроме дрожи холодного воздуха, а неудачное приземление означает сокрушительный удар невидимой силы.
- id: disguise-self
  flavor: >-
    Маскировка — это ремесло, и лучшие актёры старых театров умеют носить чужое лицо, как позаимствованное пальто. Иллюзия поддаётся при близком прикосновении, так что носителю остаётся надеяться, что никто не станет слишком внимательно разглядывать швы.
- id: disintegrate
  flavor: >-
    Узкий изумрудный луч срывается с кончиков пальцев и несёт голодную, беззвучную силу. Всё, что он поражает, либо шатается под толчком чистой мощи, либо рассыпается в тонкую серую пыль, которую уносит ветер, оставляя лишь слабый запах гари.
- id: dispel-evil-and-good
  flavor: >-
    Короткий оберег бледного света ложится на плечи заклинателя, и порождения иных планов отшатываются от него. Руки, возложенные на одержимого или испуганного, могут сломить хватку духа или исчадия, а резкое слово способно отправить незваного гостя обратно туда, где ему место.
- id: dispel-magic
  flavor: >-
    Резкий щелчок пальцами пускает холодную волну сквозь сияние чар. Слабые заклинания рассыпаются в воздухе, а упрямые приходится проверить на мастерство заклинателя, прежде чем они поддадутся.
- id: dissonant-whispers
  flavor: >-
    Мелодия, которую больше никто не слышит, проскальзывает в череп жертвы, кислая и режущая, как колокол, зазвучавший не в той тональности. Слушатель вздрагивает, а затем отшатывается от певца, словно сам звук был обрывом.
