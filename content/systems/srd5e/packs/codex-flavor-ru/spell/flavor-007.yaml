- id: hunters-mark
  flavor: >-
    Слабый серебристый знак прилипает к добыче и виден лишь тому, кто его наложил. Следы становятся яснее, и тропа, кажется, сама клонится к помеченной жертве. Лесовики говорят, что метка никогда не устаёт, устаёт только охотник.
- id: hypnotic-pattern
  flavor: >-
    Разноцветные ленты на мгновение извиваются в воздухе и тут же гаснут, оставляя толпу глядеть в пустоту. Тех, кто слишком пристально смотрел, мягко покачивает, и они забывают, что собирались сделать. Обычно достаточно резкого тычка, окрика или пощёчины, чтобы их разбудить.
- id: ice-knife
  flavor: >-
    Острый осколок инея слетает с руки, словно брошенная сосулька, и впивается в цель. Как только он попадает, осколок взрывается облаком ледяных осколков, которые жалят всех, кто стоит рядом. Маги, сведущие в зиме, считают это весьма наглядным доводом в пользу личного пространства.
- id: ice-storm
  flavor: >-
    Град обрушивается ревущим столбом и превращает землю в скользкое, растрескавшееся месиво, которое собьёт с ног любого, кто осмелится бежать. Холод пробирается сквозь плащи, а звук напоминает тысячу костяшек пальцев по жестяной крыше. Фермеры, видевшие это однажды, предпочитают слушать об этом в доме.
- id: identify
  flavor: >-
    Над предметом воцаряется жемчужное спокойствие, и его история разматывается, словно лента. Скрытые свойства и тихие проклятия выходят на поверхность одно за другим, вежливо представляясь. Учёные, всю жизнь охотящиеся за подобными тайнами, называют это самой приятной разновидностью сплетен.
- id: illusory-script
  flavor: >-
    Чернила приобретают скрытый слой, так что страница может сказать одно своему автору и совсем другое каждому любопытному читателю. Старые коллегии передают такие приёмы друг другу, как сплетни, а ловкие писцы прячут их внутри обычных писем. Никто, читая чужие заметки, не подозревает о ловушке на полях.
- id: imprisonment
  flavor: >-
    В этом заклинании живёт терпеливая жестокость: врага можно заточить в запечатанную сферу, в оковы неподвижности, в крошечный самоцвет или в спящую темницу сновидений. Старые стражи называли это могилой, которая помнит своего узника. Те, кто вскрывает такую темницу, обычно находят внутри памятную вещицу самого тюремщика.
- id: incendiary-cloud
  flavor: >-
    Дымное пятно из тлеющих углей катится по полю боя, поглощая крики и окрашивая небо в цвет старого чая. Искры плывут, словно медленные мотыльки, и оседают на плащах, волосах и самых уверенных планах. Тот, кто окажется внутри, узнает, что дым не всегда является мягкой стороной огня.
- id: inflict-wounds
  flavor: >-
    Холодное прикосновение, помнящее каждую могилу, которую миновало, касается кожи и заставляет тело вспомнить то же самое. Вены сжимаются, краска сходит с лица, а рана кажется старше руки, которая её нанесла. Жрецы тихого толка говорят, что мёртвые хранят самые долгие обиды.
- id: insect-plague
  flavor: >-
    Жужжащее облако саранчи возникает ниоткуда и превращает обычный луг в мрачные обои из крыльев. Рой плывёт, куда ему вздумается, цепляется за плащи и заставляет даже самых смелых ёрзать. Фермеры старых сказаний винили в этом плохую погоду, хотя к погоде это не имело никакого отношения.
- id: instant-summons
  flavor: >-
    Сапфир хранит обещание: дорогая вещь вернётся домой, стоит лишь произнести её имя и раздавить камень. Камень при этом расходуется, поэтому каждый вызов требует нового самоцвета и терпеливого кошелька. Воры, узнавшие этот приём, обычно хранят свои самоцветы в очень прочных карманах.
- id: invisibility
  flavor: >-
    Тонкая серебристая вуаль скользит над спутником, и видны лишь его намерения, да и то лишь внимательному глазу. Эффект хрупок и обычно распускается, как только носитель делает смелый шаг. Актёры, коты и плохие поэты пытались его повторить с переменным успехом.
- id: irresistible-dance
  flavor: >-
    Внезапное желание пуститься в пляс охватывает врага посреди мрачного замысла, и вскоре его ноги выстукивают задорный мотив, на который он никогда не соглашался. Достоинство пошатывается, движения становятся комичными, а каждый удар будто промахивается мимо ритма. Старые барды говорят, что хороший танец ещё никогда не был честным поединком.
- id: jump
  flavor: >-
    Лёгкость ложится на ноги доброго друга, будто тяготение вежливо попросили взять короткий отпуск. Каждый прыжок переносит его через канавы, ящики и изредка через перепуганную козу. Перепрыгиватели речных городков клянутся этим заклинанием, в основном потому, что их приземления легче простить.
- id: knock
  flavor: >-
    Один резкий стук раздаётся из замка, защёлки или упрямого засова, и старый запор сдаётся с усталым вздохом. Звук разносится по холмам и оповещает всех поблизости, что дверь открылась там, где ей открываться не следовало. Слесари речных городков воспринимают это как личное оскорбление.
- id: legend-lore
  flavor: >-
    Наступает тишина, и из воздуха разворачивается воспоминание, несущее слухи и великие деяния известного имени. Подробности приходят загадками и отступлениями, будто прошлое слишком горделиво, чтобы говорить прямо. Учёные, полагающиеся на него, держат наготове острый карандаш и подозрительную ухмылку.
- id: lesser-restoration
  flavor: >-
    Тёплое ощущение проходит через руки друга и рассеивает туман, застилающий ему глаза, уши, конечности или кровь. Облегчение приходит быстро и без пышности, словно открытое окно после долгой зимы. Целители, предпочитающие тихую работу громким речам, обычно выбирают именно это заклинание.
- id: levitate
  flavor: >-
    Существо или лёгкий предмет поднимается с пола, будто невидимая рука решила, что пора зависнуть. Его можно направлять вверх и вниз, а двигаться вдоль стен или потолка оно может лишь отталкиваясь от них. Когда магия угасает, оно мягко опускается, выглядя слегка обиженным.
- id: light
  flavor: >-
    Бледное сияние расцветает на выбранном предмете и окрашивает соседние стены в тот цвет, какой пожелает творящий. Маги-самоучки называют это самым дешёвым утешением в ремесле, ведь оно почти ничего не стоит кошельку. Накрыть свечение тканью значит мгновенно его приглушить, и сонные этому только рады.
- id: lightning-bolt
  flavor: >-
    Белый огненный разряд срывается с руки творящего и прочерчивает в воздухе длинную яркую линию. Всё, что окажется на пути, получает резкий урок электричества, от которого встают дыбом волосы, а воздух после пахнет грозой и палёной шерстью. Жрецы грозовых орденов считают это самым честным доводом в мире.
- id: locate-animals-or-plants
  flavor: >-
    Шёпот поднимается из травы и листьев и указывает на ближайшее существо выбранного рода. Охотники и травники давно полагаются на это чутьё, чтобы находить птиц, зверей и упрямые корни. Оно показывает, где прячется жизнь, но никогда не говорит, почему она решила спрятаться.
- id: locate-creature
  flavor: >-
    В груди возникает натяжение, как от рыболовной лески, и указывает на знакомое лицо или распространённое существо. Тяга слабеет, если искомый носит чужую личину, и вовсе пропадает, если на пути стоит свинец. Следопыты клянутся, что это самый упрямый компас из всех, что им доводилось носить.
- id: locate-object
  flavor: >-
    Нить интуиции тянется к памятной вещице или к ближайшему предмету заданного вида. Треснувший ключ, хороший меч или любимая шляпа могут быть извлечены из тумана многолюдного рынка. Искатели говорят, что это работает лучше всего, если однажды они держали предмет в руках достаточно близко, чтобы запомнить его вес.
- id: longstrider
  flavor: >-
    Более пружинистый шаг ложится на поступь друга, и дорога, кажется, сокращается под его сапогами. Гонцы, паломники и все, кто опоздал к ужину, ценят эту скромную милость на протяжении поколений. Действие приятное и тихое, такое благословение никто не вспоминает поблагодарить, пока путешествие не окончится.
- id: mage-armor
  flavor: >-
    Мерцающий слой защитной магии окутывает добровольца, который ещё не надел латы. Он даёт ровное ощущение безопасности, хотя настоящий металл всегда будет убедительнее. Портные старых коллегий жалуются, что это портит вполне приличный крой плаща.
- id: mage-hand
  flavor: >-
    Призрачная рука появляется в поле зрения и выполняет мелкие, аккуратные поручения с манерами очень вежливого слуги. Она может повернуть защёлку, перелить жидкость из склянки или достать письмо из ящика, но ударить или поднять тяжёлую ношу не способна. Ученики её обожают, в основном потому, что она никогда не ворчит над посудой.
- id: magic-circle
  flavor: >-
    Высокий столб гудящего света поднимается там, где светящиеся руны отмечают пол и запечатывают пространство от определённых незваных гостей. Небожители, элементали, фейри, исчадия и беспокойные мертвецы находят этот барьер неприветливым. Некоторые стражи переворачивают его логику, так что гости внутри остаются на месте.
- id: magic-jar
  flavor: >-
    Неподвижное тело погружается в оцепенение, а душа выскальзывает и оседает внутри самоцвета, кристалла или небольшой реликвии. Оттуда она может ненадолго отплыть и присмотреться к ближайшему незнакомцу, надеясь на удобное новое жильё. Маги, решившиеся на это, редко возвращаются в то же тело с теми же убеждениями.
- id: magic-missile
  flavor: >-
    Три светящихся дротика чистой силы возникают из ничего и устремляются к целям, выбранным творящим. Они всегда попадают, поэтому их любят робкие ученики и очень упрямые наставники. Каждый дротик прилетает в один и тот же миг, и жертвы потом спорят, кто был поражён первым.
- id: magic-mouth
  flavor: >-
    Каменное лицо или резная горгулья внезапно обретает голос и произносит заранее подготовленное послание, как только появляется выбранный знак. Слова звучат голосом творящего, будто говорящий стоит прямо за статуей. Озорные маги используют это для приветственных записок, зловещих предупреждений и изредка для уместной колкости.
