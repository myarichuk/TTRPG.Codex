- id: find-traps
  flavor: >-
    Тихое гудение повисает в воздухе и выявляет, что нечто хитрое и жестокое устроено так, чтобы укусить. Природные опасности молчат, ведь гудение заботится только о преднамеренной работе. Оно не даёт карты, а лишь предостережение и примерное представление о том, какая каша ждёт впереди.
- id: finger-of-death
  flavor: >-
    Указующая рука, холодный взгляд и шёпот праха из могилы, и жизненные силы жертвы в один миг утекают. Те, кто выживает, часто жалеют, что выжили, а незадачливые мертвецы, как правило, встают снова и ждут чёткого приказа.
- id: fire-bolt
  flavor: >-
    Оранжевая искорка огня срывается с кончиков пальцев, перечёркивает комнату и поджигает всё, что неосторожно лежит на пути. Тряпьё, ящики и старые деревянные вывески вспыхивают быстро, поэтому разумные хозяева таверн держат вёдра у стойки.
- id: fire-shield
  flavor: >-
    Сплетённое из пламени облако обволакивает тело живым ореолом, и носитель сам выбирает, будет ли тот тёплым или холодным. Любой, кто ударит вблизи, получит в ответ очень громкое потрескивание.
- id: fire-storm
  flavor: >-
    Огненная буря падает ниоткуда и складывается в угловатую фигуру, выбранную заклинателем, словно ребёнок, расставляющий игрушечные кубики. Всё, что окажется внутри, ищет укрытия, а сено и сухие шторы вспыхивают мгновенно.
- id: fireball
  flavor: >-
    Оранжевая бусина света слетает с кончика пальца заклинателя и расцветает ревом, встретив толпу, которой следовало бы держаться подальше. Старые коллегии называют его честным заклинанием, ведь никому не нужны вторые объяснения. Дым катится с обожжённых камней долго после того, как смолкли крики.
- id: flame-blade
  flavor: >-
    Тонкий клинок огня вырастает из простой палки в руке заклинателя и гудит, словно чайник с собственным мнением. Это аккуратный трюк для путника, который не хочет таскать факел. Клинок никогда не греет перчатку, что речные народы находят подозрительным.
- id: flame-strike
  flavor: >-
    Столб жара падает из ясного неба на того, кто задержался не в том дворе. Некоторые маги-самоучки настаивают, что это проповедь огнём, хотя обожжённые камни намекают на более практичный довод. Всякий, кто стоит рядом, учится смотреть вверх, прежде чем принимать любое приглашение.
- id: flaming-sphere
  flavor: >-
    Шар тлеющих красных углей катится за своим создателем, как собака, научившаяся дуться. Он стукается о мебель с виноватым треском и выделяет ровно столько жара, чтобы повар начал нервничать. Мало какие домашние питомцы так трудно игнорировать.
- id: flesh-to-stone
  flavor: >-
    Медленный серый прилив ползёт сквозь упрямое тело и превращает кожу и кости в тот камень, из которого делают садовые статуи. Старые скульпторы шепчут, что это ремесло жестоко и прекрасно. Жертва сохраняет всё выражение лица, которое у неё было, и это либо милость, либо оскорбление.
- id: floating-disk
  flavor: >-
    Плоская пластина из мерцающей силы парит на уровне пояса и послушно несёт всё, что на ней сложено. Квартирмейстеры старых караванов считали её лучшим слугой из всех изобретённых, в основном потому, что она никогда не жаловалась на вес. Это совершенно скучное чудо, и в этом весь смысл.
- id: fly
  flavor: >-
    Внезапная лёгкость поднимает заклинателя над полом и заставляет его дрейфовать, как лист на тёплом ветерке. Маги-самоучки описывают это ощущение как краткое прощение от тяжести. Большинство пробовавших обнаруживают, что небо просторнее, чем показывали карты.
- id: fog-cloud
  flavor: >-
    Бледный вал тумана выкатывается ниоткуда и поглощает ближайшие изгороди, фонари и любые благие намерения. Прибрежные контрабандисты клянутся этим, ведь такой густой туман делает каждого незнакомца похожим либо на друга, либо на соперника, и редко на то и другое сразу. Видимость становится слухом, а шаги — предположениями.
- id: forbiddance
  flavor: >-
    Тихий давящий оберег ложится на дверной проём, и ему безразлично, кто хочет пройти. Мастера охранных заклятий старых коллегий настаивают, что секрет в тщательном выборе границы. Тот, кто пренебрежёт предупреждением, обычно жалеет об этом на лестнице.
- id: forcecage
  flavor: >-
    Коробка невидимой силы смыкается вокруг существа с аккуратностью хорошо сделанного ящика. Её стены прозрачны и тверды, так что узник и мир могут видеть друг друга, — жестокая форма вежливости. Тюремщики, ценящие и надёжность, и беседу, обычно предпочитают её.
- id: foresight
  flavor: >-
    Тонкая нить знания ложится на человека и нашёптывает короткие предупреждения о ближайших мгновениях. Прорицатели старых коллегий описывают это как слышать, как дом оседает, прежде чем рухнет крыша. Те, кто слишком полагается на неё, становятся очень хороши в ожидании.
- id: freedom-of-movement
  flavor: >-
    Свободная лента тёплой защиты обвивает конечности и позволяет скованным суставам двигаться так, будто мир смазали маслом. Беглецы-артисты и танцоры трактиров клянутся этим, а старые цепи обычно дуются по углам. В этом ощущении нет ничего драматичного, и именно поэтому оно так успокаивает.
- id: freezing-sphere
  flavor: >-
    Холод собирается в ладони заклинателя, пока не станет плотным от инея, а потом покидает руку с треском, как ломающийся пруд. Зимние колдуны считают это вежливым способом закончить спор. Сфера затем рассыпается вспышкой блестящих осколков.
- id: gaseous-form
  flavor: >-
    Тело ослабляет хватку на самом себе и дрейфует, как дым, проскальзывая сквозь щели, которые ни один разумный дверной проём не пропустил бы. Знатоки торговли туманом описывают это ощущение как слух, которому случайно выросли руки. Возвращение в твёрдую форму — то, что все помнят ярче всего.
- id: gate
  flavor: >-
    Высокий проём из серебряного света открывается в воздухе, и сквозь него видно далёкий зал, где пахнет дождём. Путешествующие учёные старых коллегий относятся к порогу с большим почтением, ведь у той стороны есть собственное мнение о гостях.
- id: geas
  flavor: >-
    Убедительное обещание, наполовину клятва и наполовину головная боль, связывает упрямый разум с единственным поручением. Старые судебные книги описывают это как самый разумный способ испортить праздник. Разум ворчит, тело маршем шагает, и поручение выполняется.
- id: gentle-repose
  flavor: >-
    Спокойная тишина ложится на тело, которое ждёт погребения, и хранит его свежим и безмолвным до нужного дня. Речные гробовщики мало говорят об этом при семьях. Это милость с часовым механизмом внутри.
- id: giant-insect
  flavor: >-
    Хитиновая фигура выползает из почвы по воле заклинателя, вся из жвал и щёлкающего терпения. Конюхи рассказывают истории о её применении, хотя предпочитают не говорить, что случилось со сборщиком податей. Тот, кто командует такой тварью, узнаёт, что жуки составляют удивительно преданную рабочую силу.
- id: glibness
  flavor: >-
    Гладкая, тёплая уверенность оседает на языке и заставляет каждое слово звучать лучше, чем оно заслуживает. Странствующие торговцы старых дорог заплатили бы за неё щедро. Эффект быстро угасает, оставляя лишь слабый привкус мёда и сомнения.
- id: globe-of-invulnerability
  flavor: >-
    Мерцающий купол бледного света обволакивает небольшой участок и отворачивает более слабые чары, которые осмеливаются его коснуться. Инженеры осторожных городов считают его переносным залом щитов и продают подделки нетерпеливым. Спокойствие внутри него на удивление заразительно.
- id: glyph-of-warding
  flavor: >-
    Слабый знак выгравирован на камне или металле, тихий, как спящая кошка, пока кто-нибудь его не потревожит. Слесари и архивариусы говорят о нём с тем уважением, которое обычно приберегают для дурного нрава. Реакция, когда она приходит, громкая, яркая и никогда не бывает тонкой.
- id: goodberry
  flavor: >-
    Горсть налитых ягод появляется в руке заклинателя, прохладных и сладких, словно живая изгородь ждала этого. Собиратели из холмистых городков говорят, что одна ягода может накормить усталого путника, хотя всё же предпочитают хлеб. На вкус она слабо отдаёт летом, что странно нести с собой зимой.
- id: grease
  flavor: >-
    Скользкая плёнка растекается по участку пола или по перекладине лестницы, незаметно превращая каждый шаг в небольшие переговоры. Трактирщики старых дорог имеют твёрдое мнение о её применении на своих лестницах. Тот, кто на ней поскользнётся, обычно помнит урок дольше, чем синяк.
- id: greater-invisibility
  flavor: >-
    Фигура постепенно исчезает из виду, оставляя лишь слабый контур, который глаз всё время норовит поправить. Воровские гильдии старых городов считают это профессиональной любезностью, а трактирщики — оскорблением для счёта. Даже обычные хлопоты, например разлив чая, не нарушают чар.
- id: greater-restoration
  flavor: >-
    Мягкое тепло проходит через усталое тело и смывает застарелые следы давней невзгоды. Целители многих традиций говорят, что это напоминает весеннюю уборку для души, хотя признают, что душу стереть пыль гораздо труднее. Облегчение тихое, основательное и полностью заслуженное.
