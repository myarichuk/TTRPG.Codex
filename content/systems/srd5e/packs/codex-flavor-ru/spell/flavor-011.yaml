- id: spider-climb
  flavor: >-
    Липкое, цепкое сияние ложится на ладони и подошвы добровольного спутника, позволяя ему взбираться по стенам и ползать по потолкам, полагаясь лишь на собственную смелость. Выглядит так, будто кто-то одолжил ему хватку паука. Лучшее в этом то, что руки остаются свободными и есть место для факела и кинжала.
- id: spike-growth
  flavor: >-
    Почва под участком травы выпускает жёсткие колючки, которые кажутся совершенно природными, пока кто-нибудь не наступит. Каждый шаг по зарослям оставляет острый укол у небрежного путника. Следопыты, знающие ремесло, учатся читать листья, чтобы заметить подсказку, что что-то не так.
- id: spirit-guardians
  flavor: >-
    Бледные, зоркие духи плывут широким кругом вокруг преданного творца, принимая фейский или сияющий облик, когда творец добр, и исчадийский облик, когда он таковым не является. Враги, шагнувшие в круг, чувствуют, как их ноги тяжелеют, а жгучий свет или могильный холод рвут их на части, в зависимости от склонностей творца.
- id: spiritual-weapon
  flavor: >-
    Призрачный клинок, булава или молот появляется в воздухе, напевая деловитым, терпеливым рвением. Его можно послать к врагу, и там он ударит с силой, звучащей как колокол. Каждый последующий визит — новый удар, такой же надёжный, как писарь, который никогда не забывает счёт.
- id: starry-wisp
  flavor: >-
    Частица звёздного света срывается с руки творящего и жалит свою цель прохладной яркой искрой. Свечение остаётся после, словно хвост кометы, и всякий, кто попытается ускользнуть, оказывается легко заметным.
- id: stinking-cloud
  flavor: >-
    Облако болезненного жёлтого тумана расцветает над местом, которое выбирает творящий, и пахнет бочкой забытых яиц. Тот, кто вдохнёт его, давится, оседает и оказывается слишком тошнотно, чтобы действовать. Пары висят, пока сильный ветер не разгонит их, и это самое желанное зрелище для всех поблизости.
- id: stone-shape
  flavor: >-
    Камень поддаётся твёрдой руке, размягчаясь в статую, оружие, сундук или аккуратный проход сквозь стену. Каменщики-цеховики расплакались бы, увидев это, ведь ни одно долото не сравнится со скоростью такого превращения. Результат сохраняет петли и защёлку, хотя тонкая часовая работа находится за пределами его возможностей.
- id: stoneskin
  flavor: >-
    Кожа из серого камня растекается под касанием добровольного союзника и превращает клинки, дубины и наконечники стрел в глухой стук. Эффект плотный, тяжёлый и целиком является даром творящего, хотя платой служит алмазная пыль, растёртая настолько мелко, что блестит. Воины, испытавшие это, рассказывают о спокойствии и о прогулке через бой без единого синяка.
- id: storm-of-vengeance
  flavor: >-
    Бурлящая грозовая туча вздымается над землёй, влача за собой гром, кислотный дождь, град и молнии по всему ландшафту в торжественной процессии. Существа под ней шатаются от первого удара звука, а затем терпят одну жестокую погодную напасть за другой. Друиды, призывающие такие бури, говорят, что у неба долгая память на обиды.
- id: suggestion
  flavor: >-
    Мягкая, убедительная фраза скользит в голову слушателя и устраивается там, как кошка в тёплых коленях. Слушатель ощущает желание сделать именно то, что ему велено, и это желание длится, пока кто-нибудь не выбьет мысль ударом. Придворные клянутся, что капля мёда действует лучше строгого тона.
- id: summon-dragon
  flavor: >-
    Блестящая безделушка, украшенная чешуйчатым узором, способна призвать дух дракона из широкой тьмы. Он приходит как дым и острое внимание и остаётся верным, пока творящий держит нить натянутой. Маги-самоучки говорят, что дух всегда помнит свои обиды, поэтому мудрый призывающий даёт ему лишь простые приказы.
- id: sunbeam
  flavor: >-
    Копьё белого света срывается с ладони творящего и опаляет прямую дорожку сквозь всё, что стоит на пути. Попавшие в его сияние щурятся, шатаются и на миг теряют зрение, будто глянули прямо в полдень. Старые коллегии однажды использовали его, чтобы пристыдить лжецов в переполненных залах.
- id: sunburst
  flavor: >-
    Солнечный свет расцветает наружу от выбранной точки, словно уроненная лампа в подвале, полном пыли, и блеск обжигает всё, чего касается. Попавшие во вспышку спотыкаются, глаза слезятся, и какое-то время они ни на что не годятся. Речные люди говорят, что солнечный камень, питающий заклинание, остаётся тёплым долго после того, как свет погаснет.
- id: symbol
  flavor: >-
    Вредоносный знак вдавливается в пол, стену или крышку, терпеливо ожидая неосторожной руки или ноги. Тех, кто его задевает, захватывает вспышка той разрушительной силы, которую выбрал писец, а затем знак гаснет, как иней. Старые хранители сокровищниц называют такие ловушки самыми честными, ведь они не предупреждают никого вовсе.
- id: telekinesis
  flavor: >-
    Одна лишь мысль становится парой невидимых рук, поднимающих камень, телегу или упрямую дверь без единого поднятого пальца. Творящий может толкнуть существо через пол или держать клинок в воздухе, меняя хватку, когда захочет. Учителя предупреждают, что усталый разум даёт неуклюжие руки, поэтому ровная сосредоточенность важнее силы.
- id: telepathic-bond
  flavor: >-
    Два треснувших яйца, сжатые вместе под шёпот, сплетают нить общей мысли через небольшой круг добровольных друзей. Каждый слышит остальных без общего языка, так что моряк и учёный наконец могут обмениваться шутками. Чаще всего связь заставляет людей перебивать друг друга, что речные люди находят одновременно очаровательным и утомительным.
- id: teleport
  flavor: >-
    Внезапный рывок в животе, вспышка незнакомых запахов, и творящий оказывается в другом месте. Друзья, которые держатся за творящего, прибывают вместе с ним, а тот, кто возражает, остаётся на месте. Тот, кто неверно запомнил пункт назначения, часто попадает в сырое и неправильное место, что старые коллегии называют уроком смирения.
- id: teleportation-circle
  flavor: >-
    Меловые знаки, начерченные малым кругом, пробуждаются в мерцающий проём, который держится лишь недолго и тает. Всякий, кто шагнёт в него, появляется у постоянного круга, который творящий хорошо знает, а путешествие пахнет слегка озоном и старым лаком. Осторожные учёные переписывают последовательность знаков дважды, ведь смазанная линия может отправить путников туда, куда никто не ожидал.
- id: thaumaturgy
  flavor: >-
    Малое чудо делает отличный фокус на вечеринке в тусклом зале. Творящий может заставить глаза странно светиться, перевести голос в рёв или заставить пламя свечей плясать в диковинных цветах. Клирики определённого толка используют эти фокусы, чтобы смутить скептиков, и, честно говоря, это лучшая часть работы.
- id: thunderwave
  flavor: >-
    Раскат грома вырывается из творящего во все стороны сразу, гремя окнами и шатая зубы. Попавшие на его пути отбрасываются назад и растягиваются на земле, а всё незакреплённое скользит прочь вместе с ними. Путники говорят, что грохот слышен и с соседнего холма.
- id: time-stop
  flavor: >-
    Мир затихает, каждый падающий лист замирает на полпути, и движется только творящий. Несколько лёгких шагов сквозь застывшую толпу ощущаются как кража того, чего никто не хватится. Мудрецы предупреждают, что украденное мгновение нужно вернуть до того, как кто-нибудь заметит разрыв, иначе счёт предъявят каким-то иным образом.
- id: tiny-hut
  flavor: >-
    Скромный купол мерцающей силы поднимается над творящим и его спутниками, уютный домик размером не больше повозки. Те, кто уже внутри, могут свободно входить и выходить, а всякий другой обнаруживает стены упрямо закрытыми. Старые походники клянутся, что воздух внутри удивительно тёплый.
- id: tongues
  flavor: >-
    Краткое прикосновение к горлу превращает каждое произнесённое слово или жест рук в понятный слушателю смысл. Дар работает в обе стороны, так что всякий, кто знает хотя бы один язык, может понимать и говорящего. Говорят, послы платят за него щедро, а коллегии до сих пор спорят, считать ли это жульничеством.
- id: transport-via-plants
  flavor: >-
    Большое дерево или живая изгородь становится дверью, связывая себя с далёким растением, которое творящий уже видел. Любой может шагнуть в одно и выйти из другого, сделав лишь короткий шаг. Садовники, заметившие внезапный сквозняк в корнях, предпочитают делать вид, будто ничего не видели.
- id: tree-stride
  flavor: >-
    Творящий скользит в один ствол и выходит из другого такого же вида, и листья задевают его лицо. Живые деревья подходящего обхвата — единственные двери, так что лес становится тайной дорогой. Лесовик, знающий каждый дуб в долине, может исчезнуть с одного склона и появиться на следующем.
- id: true-polymorph
  flavor: >-
    Странное превращение поглощает выбранное существо или неживой предмет и переформовывает его во что-то иное. Новой формой может стать зверь, дух или куча верёвки, а прежнее «я» тихо ждёт внутри, пока перемена не закончится. Учёные спорят, сохраняет ли такое изменение душу нетронутой, и эти споры делают беседы за ужином скучными.
- id: true-resurrection
  flavor: >-
    Долго после того, как тело остыло, прикосновение может вернуть дух в тело, снова сделанное целым. Раны срастаются, яды выходят, а утраченные конечности отрастают, будто их никогда не теряли. Некоторые могильщики говорят, что это самый щедрый поступок, который способен совершить жрец определённого толка, и самый дорогой.
- id: true-seeing
  flavor: >-
    Щепотка пыльного порошка грибов, растёртая над глазами, позволяет доброму другу видеть сквозь самые хитрые иллюзии. Потайные двери, невидимые существа и облики, носящие чужое лицо, теряют силу обмана. Старые контрабандисты платили за это хорошо, и некоторые платят до сих пор.
- id: true-strike
  flavor: >-
    На один мимолётный удар сердца оружие творящего будто знает, где именно окажется цель. Удар ведёт прозрение, а не мышцы, и может гореть ярким сиянием вместо обычной остроты. Дуэлянты в залах фехтования называют это жульничеством, а потом просят их научить.
- id: tsunami
  flavor: >-
    Громадная стена морской воды поднимается из выбранной точки и катится вперёд с ужасающим терпением. Всё на её пути разбивается и волочится за собой, удерживаемое в кипящей воде, пока волна не отпустит. Рыбацкие деревни побережья до сих пор рассказывают сказки о той волне, что пришла без предупреждения, хотя никто не согласен, кто её призвал.
