- id: revivify
  flavor: >-
    Быстрое прикосновение возвращает свежий труп через порог, хотя возвращающаяся душа приходит дрожащей и помятой по краям. Могильщики говорят, что алмаз, использованный для этого приёма, больше никогда не видят, и уж они-то знают. Недостающие части остаются недостающими, так что никто не должен просить вернуть остальное тело.
- id: rope-trick
  flavor: >-
    Простая верёвка поднимает свой конец к стропилам, пока не повиснет прямо, как отвес. Наверху открывается дверь, которую никто не видит, и ведёт в тесную комнату, которой нет ни на одной карте. Путники внутри могут смотреть на улицу через щель, но ни клинок, ни болт, ни дурная удача не пересекут её.
- id: sacred-flame
  flavor: >-
    Бледный свет падает сверху, словно фонарь, спущенный на верёвке, и находит цель, где бы она ни пряталась. Укрытие почти не спасает, ведь свечение находит каждую щель, которую оставляет стена или живая изгородь. Жрецы определённого толка называют это уроком смирения для всякого, кто доверился прочному забору.
- id: sanctuary
  flavor: >-
    Осколок зеркального стекла запечатывает защитное обещание над союзником, поворачивая враждебные взгляды к другим целям. Многие смелые нападающие обнаруживают, что решимость дрогнула в решающий момент, ведь неуверенный удар может попасть в случайного прохожего. Оберег ломается, как только защищённый наносит ответный удар, и это держит услуги честными.
- id: scorching-ray
  flavor: >-
    Три ярких огненных луча срываются с одной ладони, и каждый охотится за своей целью, как пёс, сорвавшийся с поводка. Маги-самоучки любят его против толпы, ведь несколько трескучих лучей можно разослать сразу по нескольким врагам. Более высокие ячейки заклинаний добавляют в залп ещё один луч, и шум от этого становится громче.
- id: scrying
  flavor: >-
    Тихая заводь или отполированный кристалл показывает далёкое лицо, и владелец этого лица ощущает внезапный холодок у основания шеи. Тот, кто делил трапезу с наблюдаемой стороной или хранит её памятную вещицу, находит связь легче проследить, и ремесло давно этим пользуется.
- id: searing-smite
  flavor: >-
    Удар оружием оставляет огненную метку, которая цепляется за рану и не желает гаснуть. С каждым ударом сердца вспыхивает новый жар, и жертва должна стряхнуть его одной лишь упрямой волей. Кузнецы старого квартала утверждают, что лучшие клинки — те, что сохраняют метку и после.
- id: secret-chest
  flavor: >-
    Маленький сундук выскальзывает из мира в скрытый слой воздуха и ждёт, когда владелец позовёт его домой. Единственный ключ — крошечная копия из того же дорогого материала, так что вор, который найдёт её первым, уже выиграл.
- id: see-invisibility
  flavor: >-
    Скрытые вещи на время теряют свой плащ, и комната внезапно оказывается полна фигур, которые были здесь всё это время. Призраки проплывают в бледных очертаниях, а дальняя сторона завесы выглядит как туман, пойманный в фонаре. Воры ненавидят это заклинание почти так же, как ненавидят свет свечи.
- id: seeming
  flavor: >-
    Толпа гостей может быть одета в чужие лица, и каждое из них носит свою идею респектабельности. Портные и швеи одинаково не любят этот трюк, ведь острый глаз или тычок в щёку выдают краску под ним. Он держится достаточно долго для шалости и достаточно недолго для достоинства.
- id: sending
  flavor: >-
    Нить мысли протягивается от одного разума к другому, неся несколько отрывистых слов над сушей и морем. Получатель слышит слова у себя в голове и может ответить немедленно, хотя некоторые сообщения сбиваются с пути. Умные люди знают, что ответ открывает дверь, а получатель может закрыть её перед любым незнакомцем.
- id: sequester
  flavor: >-
    Выбранный предмет или послушное существо сворачивается в неподвижность, которой время не касается, и исчезает из поля ясновидения и любопытных взглядов. Спящие в этой неподвижности не стареют и не голодают и просыпаются, лишь когда наконец появится оговорённый знак. Разумные владельцы выбирают условие с осторожностью, ведь загадочное условие может пережить терпение всех вокруг.
- id: shapechange
  flavor: >-
    Очертания творящего расслабляются и складываются заново в существо, которое он хорошо изучил: мех или чешуя появляются одна за другой. Опытные маги предупреждают, что новое тело приходит с заёмной крепостью, а запас свежей силы угасает, когда форму сбрасывают. Мудрые творцы выбирают облик, который не вызовет ссоры с соседями.
- id: shatter
  flavor: >-
    Внезапный громовой раскат вырывается из выбранной точки и сотрясает всё, что оказалось в пределах досягаемости. Стекло звенит, колокола дребезжат, а обычный камень и дерево гремят, будто буря заперта в банке. Часовщики и каменотёсы сходятся во мнении, что звук — ничто по сравнению с тем, что он делает с нервами упрямого голема.
- id: shield-of-faith
  flavor: >-
    Мерцающее поле ложится на выбранного союзника и даёт упрямый, но небольшой запас против клинков и когтей. Древние писцы говорят, что поле похоже на рябь воды, хотя большинство замечает его, лишь когда клинок соскальзывает с него. Свёрнутого свитка, заткнутого за пояс, достаточно, чтобы нервный страж почувствовал себя смелым.
- id: shield
  flavor: >-
    Тонкая пластина невидимой силы встаёт на место как раз в тот миг, когда приходится удар. Маги-самоучки называют её самой дешёвой страховкой в ремесле, ведь она требует лишь взмаха пальцев и быстрой смекалки. Всё, что ударило по творящему, соскальзывает, а стрелы Магической стрелы просто растворяются о неё.
- id: shillelagh
  flavor: >-
    Простая дубина или посох, выглаженные речными людьми задолго до этого, в руке друида обретают более плотное волокно и более острый нрав. Дерево тихо гудит, и каждый удар звучит треском далёкого грома. Когда хватка ослабевает, дерево снова затихает, как собака, закончившая лаять.
- id: shining-smite
  flavor: >-
    Клинок, только что нанёсший удар, внезапно вспыхивает светом, будто бы приходящим откуда-то из-за неба. Жертва светится, как фонарь в тумане, и каждый удар, нацеленный в её сторону, находит лёгкую мишень. Плащи и тени бесполезны, ведь сияние выдаёт всякого, кто попытается спрятаться.
- id: shocking-grasp
  flavor: >-
    Треск срывается с голой ладони и пляшет по коже того, кому не повезло быть тронутым. Искры заставляют мышцы цели дёргаться, и её ноги теряют всякую устойчивость. Заклинатели заговоров старых коллегий любили его за аккуратный, сердитый щелчок.
- id: silence
  flavor: >-
    Сфера тишины опускается на выбранное место и поглощает каждый колокол, крик и птичий зов внутри себя. Всякий, кто стоит внутри, обнаруживает уши, набитые ватой, а речь заклинательного толка просто не покидает губ. Жрецы некоторых тихих орденов предпочитают его для бдений, а воры — для всего остального.
- id: silent-image
  flavor: >-
    Нарисованная картина встаёт и уходит, хотя ни один шаг не слышен. Фигура — лишь призрачная форма, и всякий, кто её тронет, почувствует только воздух и поймёт обман. Уличные фокусники называют это самым дешёвым способом заставить толпу поверить в дракона.
- id: simulacrum
  flavor: >-
    Комок снега формуют и дышат на него, пока он не встанет, в точности похожий на зверя или человека в момент создания. Это неутомимая копия с холодным сердцем. Творец должен поддерживать её хрупкое тело дорогими камнями, иначе она растает в лужу.
- id: sleep
  flavor: >-
    Волна сонной магии катится по участку земли и укладывает слушателей, как пшеницу под тяжёлым ветром. Сонные люди погружаются в самый глубокий сон в своей жизни, а упрямые души лишь кивают на месте. Эльфы, которым такой сон вовсе не нужен, отмахиваются от него зевком, который кажется почти невежливым.
- id: sleet-storm
  flavor: >-
    Серый ледяной ливень заполняет высокий столб воздуха, превращая землю в скользкое стекло и гася каждый открытый огонь. Всякий, кто войдёт в него, обнаруживает, что сапоги скользят, а равновесие теряется. Разумные путники застёгивают плащи и держат фонари подальше от края.
- id: slow
  flavor: >-
    Воздух густеет над горсткой невезучих фигур, которые двигаются, будто бредут сквозь тёплый сироп. Их конечности тяжелеют, реакция замирает, и каждый удар приходит с запозданием и немного неуклюже. Даже опытный творец может сбиться с жеста, ведь замедленная рука движется в темпе старого маятника.
- id: sorcerous-burst
  flavor: >-
    Сырое колдовство срывается с пальцев творящего и ищет цель с нетерпением голодной гончей. Заряд принимает ту разновидность вреда, которую выберет творящий: мороз, пламя, гниль или раскат грома. Порой искра вспыхивает ярче обычного, и трактирные хвастуны уверяют, что так и задумано.
- id: spare-the-dying
  flavor: >-
    Рука, положенная на угасающее тело, может на время удержать серый край смерти. Существо не просыпается и не исцеляется, но дыхание выравнивается, и самая тёмная тень отступает. Целители речных городков говорят, что это самая тихая милость, доступная в их ремесле.
- id: speak-with-animals
  flavor: >-
    На короткое время пушистые и пернатые обитатели леса становятся бойкими собеседниками. Большинство зверей мало заботятся о политике или поэзии, но охотно делятся тем, что недавно видели, нюхали или на что натыкались. Следопыты воспринимают такие беседы как соседский обмен сплетнями, в основном полезный и немного невежливый.
- id: speak-with-dead
  flavor: >-
    Труп уговаривают на краткий, скрипучий подобие его прежнего облика, способный ответить на несколько вопросов. Мёртвые редко становятся хорошими свидетелями, ведь они знают лишь то, что знали, когда их сердца остановились. Их ответы отрывисты, загадочны или упрямо повторяются, а враг мёртвых получит лишь обиженное молчание.
- id: speak-with-plants
  flavor: >-
    Укоренённым существам на время дают голос, и они могут рассказать, что мимо них проходило и падал ли на листья дождь. Заросли и колючки можно уговорить расступиться или, наоборот, спутаться, склоняя землю к удобству путника. Растения не умеют ходить, но способны помахать ветвями в ответ на полезный жест.
