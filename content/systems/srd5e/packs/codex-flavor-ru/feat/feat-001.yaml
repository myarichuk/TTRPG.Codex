- id: ability-score-improvement
  name: 'Повышение характеристик'
  flavor: >-
    Годы тяжёлых уроков оставляют след, и порой этот след — острый ум или более твёрдая рука. Наставники зовут это поздним цветением; ветераны называют это ещё одним годом утр, проведённых за тасканьем тяжестей.
- id: alert
  name: 'Бдительность'
  flavor: >-
    Те, кто слышит беду раньше, чем она покажет лицо, всегда ценились старыми начальниками стражи выше любого меча. Быстрая голова в начале схватки может решить, кто действует первым, а кто лишь отвечает.
- id: archery
  name: 'Стрельба из лука'
  flavor: >-
    В каждой деревне есть человек, способный расщепить узел на расстоянии, и вся площадь молча соглашается с ним не спорить. Охотники, сборщики пошлин и скучающие лучники одинаково считают ровную тетиву честным языком.
- id: boon-of-combat-prowess
  name: 'Дар боевого мастерства'
  flavor: >-
    Покровитель войны, слишком старый, чтобы назвать своё имя, однажды прижал тёплый большой палец к запястью солдата. С тех пор промахи у того стали редкими и куда менее окончательными, чем раньше.
- id: boon-of-dimensional-travel
  name: 'Дар межпространственных путешествий'
  flavor: >-
    Не всякая дверь сделана из камня или дерева, и те, что открываются для странника, обычно появляются посреди боя. Обладатель этого дара учится шагать вбок из беды и в основном приземляться там, где задумал.
- id: boon-of-fate
  name: 'Дар судьбы'
  flavor: >-
    Удача — сплетница, и известно, что она шепчет некоторым упрямцам, которые не прекращают задавать вопросы. Тот, кто её слышит, учится слегка подталкивать исход — удар соперника или ставку друга, — и толчок всегда возвращается позже.
- id: boon-of-irresistible-offense
  name: 'Дар неотразимого нападения'
  flavor: >-
    Некоторые дары приходят с многозначительным взглядом и предупреждением, что от получателя будут ждать, что он ими воспользуется. Когда идеальный удар находит цель, доспех и толстая шкура под ним перестают иметь значение, а старые сержанты клялись, что такие удары выставляют упрямство глупостью.
- id: boon-of-spell-recall
  name: 'Дар возврата заклинаний'
  flavor: >-
    Магия понемногу утекает из каждого заклинания, как жар из печи для обжига, и большинство заклинателей принимает потерю как цену ремесла. Этот дар латает часть утечек, так что иное заклинание порой уходит и вовсе без затрат.
- id: boon-of-the-night-spirit
  name: 'Дар ночного духа'
  flavor: >-
    Ночь не пуста, и каждый, кто провёл долгие часы в чёрном подвале, знает, что у тьмы есть свой вес и своя компания. Принявшие этот дар проскальзывают в мрак так же легко, как кошка под дверь, и большинству клинков не за что зацепиться.
- id: boon-of-truesight
  name: 'Дар истинного зрения'
  flavor: >-
    Множество глаз вежливы. Они принимают увиденные формы за чистую монету и редко заглядывают за маскировку. Дар, видящий сквозь краску, маски и придворную ложь, — смешанное благословение, ведь открываемая им правда редко бывает удобной.
- id: defense
  name: 'Защита'
  flavor: >-
    Доспех — это обещание, что носителя будет непросто поразить, и хороший кузнец знает, что обещание ценно ровно настолько, насколько ценен тот, кто его держит. Солдаты, научившиеся носить его хорошо, двигаются так, словно сталь — вторая кожа, а не бремя.
- id: grappler
  name: 'Борец'
  flavor: >-
    Речные города решают большинство споров хваткой, а не кулаком, и их борцы скажут вам, что терпеливая рука побеждает быструю. Стоит кого-то схватить, как он быстро узнаёт, как мало остаётся места для вывёртываний.
- id: great-weapon-fighting
  name: 'Бой с тяжёлым оружием'
  flavor: >-
    Двуручный клинок вознаграждает терпение и упрямое уважение к хвату. Кузнецы горных кузниц говорят, что хорошее тяжёлое оружие хочет, чтобы им взмахнули до конца, а старые мастера соглашались, что поспешный полузамах — это зря потраченное железо.
- id: magic-initiate
  name: 'Начинающий заклинатель'
  flavor: >-
    Заклинатели обычно начинают с одолженной книги и упрямого учителя, настаивавшего на одном маленьком заклинании перед любыми великими. Уроки остаются с человеком, когда лекции давно забыты, и первое выученное заклинание — обычно то, которое он всё ещё творит, когда что-то идёт не так.
- id: savage-attacker
  name: 'Свирепый атакующий'
  flavor: >-
    В схватке бывает миг, когда клинок уже нашёл цель, и остаётся лишь вопрос, насколько глубоко он войдёт. Старые бойцы, учившие этому приёму, любили говорить, что в счёт идёт вторая попытка того же удара.
- id: skilled
  name: 'Умелец'
  flavor: >-
    Многие хорошо знают одно ремесло, но те, кто носит в котомке три, редко остаются без дела. Лудильщики и учителя сходятся в том, что несколько удачно выбранных навыков — полезный мост между двумя очень разными комнатами.
- id: two-weapon-fighting
  name: 'Бой двумя оружиями'
  flavor: >-
    Второй клинок в слабой руке — это не лишняя сталь, а ритм, и дуэлянты, овладевшие им, двигаются как люди, привыкшие говорить обеими руками. Когда ответный удар достигает цели, за ним стоит чуть больше инерции первого взмаха.
