- id: acolyte
  name: 'Послушник'
  flavor: >-
    Большая часть дня уходила на тихую храмовую работу: подрезать свечи, аккуратным почерком переписывать молитвы и выслушивать беды тех, кто заходил внутрь, спасаясь от дождя. Священный символ на шнурке стёрся до гладкости от тревожных пальцев. На вопросы о древних обрядах следуют осторожные, слегка педантичные ответы, чаще всего со вздохом.
- id: criminal
  name: 'Преступник'
  flavor: >-
    Мало какие замки в нижнем квартале надолго задерживали этого человека. В карманах хорошего плаща помещается больше, чем положено, а тихий шаг по скрипучей лестнице — привычка, добытая нелёгким путём. Ремесло держится на долгах за услуги, острой памяти на лица и здоровом уважении к расписанию городской стражи.
- id: sage
  name: 'Мудрец'
  flavor: >-
    Пыль и чернила въелись в рукава мудреца, который прочёл больше, чем полезно для глаз. На вопрос о забытом королевстве или старом заклинании он отвечает тремя сносками и долгой паузой на раздумье. Библиотечная стремянка скрипит под каждым гостем, а чай давно остыл.
- id: soldier
  name: 'Солдат'
  flavor: >-
    Походные песни быстро смолкают, когда дорога превращается в грязь, но привычки остаются. Плечи расправляются на звук рога, а копьё даже за ужином лежит под рукой. Старые товарищи смеются над подгоревшим пайком, а грубый голос на плацу и сегодня несёт предупреждение, которое никто не оставит без внимания.
