- id: dragonborn
  name: 'Драконорождённый'
  flavor: >-
    Чешуя ловит свет ламп в холмистых городках, и драконорождённые, которые её носят, обычно первыми берут слово на пиру. Предки оставили в роду жаркое дыхание, и каждое поколение обнаруживает у него свой цвет. Кто-то носит наследство с гордостью, другие — пожав плечами и с очень длинной трубкой.
- id: dwarf
  name: 'Дварф'
  flavor: >-
    Камень — единственный собеседник, которого дварф считает вполне честным, и горный народ скажет вам это над второй кружкой. Они сохраняют твёрдость сердца в долгие зимы и ещё более долгие обиды, а упрямый ум считается семейной реликвией. Их руки отличают хороший камень от плохого одним прикосновением.
- id: elf
  name: 'Эльф'
  flavor: >-
    Эльфы старых рощ ведут более медленный календарь, чем соседи, отмеряя времена года цветением определённого дерева. Они обходятся без сна, погружаясь в спокойную медитацию, которая позволяет не смыкать глаз и смотреть, как вращаются звёзды. Их старейшины говорят, что остроумие вострее всего, когда не спешит, и детей учат слушать, прежде чем говорить.
- id: gnome
  name: 'Гном'
  flavor: >-
    Гномы малы ростом и велики любопытством, а их мастерские обычно гудят тиканьем часового механизма. Лесные гномы обмениваются сплетнями с птицами, а горные возятся с шестернями, которые никогда не останавливаются. Мало кто из них способен устоять перед хитрым вопросом, и ещё меньше тех, кто признает, что ошибся насчёт машины.
- id: goliath
  name: 'Голиаф'
  flavor: >-
    Голиафы несут в костях память о горных великанах, и высокие вершины по-прежнему кажутся им домом. Одни, похоже, стряхивают удар, словно в них лишь стукнулся камень, а другие отвечают на вызов брошенным валуном. Спросите любого о предках и ждите долгой счастливой истории.
- id: halfling
  name: 'Полурослик'
  flavor: >-
    Полурослики держат очаги тёплыми, а двери открытыми, и большинство предпочитает хороший обед великой ссоре. У них талант проскальзывать мимо беды и упрямая привычка вставать снова, когда страх сбивает с ног. На просьбу часто отвечают улыбкой, тёплым ужином и уже сделанной услугой.
- id: human
  name: 'Человек'
  flavor: >-
    Люди — непоседы, вечно строящие новую дорогу или новую репутацию, пока старая не успела остыть. Их таланты расходятся во все стороны, поэтому они хороши почти во всём, за что берутся хотя бы раз. Спросите человека, в чём он лучше всего, и ответом обычно будут три вещи, названные с равной уверенностью.
- id: orc
  name: 'Орк'
  flavor: >-
    Орков часто судят по самым громким историям о них, в которых редко упоминается долгое терпение их старейшин. Они известны яростным приливом сил в бою и странным нежеланием оставаться на земле, когда схватка почти окончена. Их песни восхваляют твёрдые руки, честные клятвы и такую выносливость, от которой суровая зима кажется короткой.
- id: tiefling
  name: 'Тифлинг'
  flavor: >-
    Тифлинги несут слабую печать происхождения, о котором в старых деревнях редко говорили вслух. Их дары — быстрый язык, талант к странным маленьким чудесам и спокойствие, смущающее тех, кто ждал крика. Большинство предпочло бы, чтобы их судили по поступкам, а не по форме рогов.
