- id: robe-of-stars
  flavor: >-
    Ночные портные далёкого портового городка сшили эту мантию из тёмно-синей ткани, усыпанной серебром. Шесть крупных звёзд на верхней части спереди можно выдернуть и потратить как искрящиеся сгустки силы, а пустые места снова заполняются с наступлением сумерек. Носящий может также скрыться в туманном царстве, залитом звёздным светом, вместе со всем, что несёт.
- id: robe-of-the-archmagi
  flavor: >-
    Выкроенная из ткани, которую не смог бы соткать ни один обычный станок, эта одежда несёт руны, которые слабо гудят под пальцами. Заклинания скользят с носящего, как дождь с промасленной шерсти, а каждое заклятие, прошедшее через её нити, становится острее. Деревенские чародеи отдали бы многое за одну нить, хотя старые коллегии предупреждают, что такая роскошь привлекает завистливые взгляды.
- id: robe-of-useful-items
  flavor: >-
    Залатанная умельцем с чувством юмора, эта мантия несёт яркие лоскутки, которые распарываются в настоящие предметы: фонарь, кинжал, зеркало, шест, верёвку, мешок и кое-что более странное. Когда последний лоскуток вытянут, мантия становится обычной одеждой, ожидающей следующей ярмарки.
- id: rod-of-absorption
  flavor: >-
    Выкованный из тёмного металла, который пьёт свет, этот жезл ловит входящие чары и поглощает их силу без единого звука. Само заклинание аннулируется, но его мощь ждёт внутри для будущего применения. Старые учёные называли его бережливым сокровищем, хотя полный жезл начинает гудеть, как чайник на плите.
- id: rod-of-alertness
  flavor: >-
    Тонкий медный жезл со светящейся кристаллической головкой, сделанный часовщиками, которые ценили острый ум. Он обостряет чувства того, кто его держит, и создаёт маленькие помощники для ясного зрения и скрытой мысли. Воткнутый в землю, он вспыхивает охранным знаком, который укрепляет союзников и выявляет существ, прячущихся на виду.
- id: rod-of-lordly-might
  flavor: >-
    Выкованный кузнецом с пристрастием к показухе, этот жезл складывается в огненный клинок, топор, копьё или таран. Его кнопки пробуждают каждую форму вспышкой, и один удар может оставить врага замершим на месте или выкачать его силу в носящего.
- id: rod-of-rulership
  flavor: >-
    Короли неизвестно каких земель когда-то поднимали этот тонкий жезл и ожидали, что каждый взгляд склонится. Показанный перед толпой, он превращает море глаз в верных последователей, которые считают носящего доверенным вождём, пока вред или жестокий приказ не разрушит чары.
- id: rod-of-security
  flavor: >-
    Бледный жезл из перламутра, который носят путники, ищущие укрытия от бури. Одной командой он уносит владельца и желающих друзей в укромный карман мира — в сад, таверну или дворец по выбору. Там много еды и воды, и ничто, взятое внутрь, не может покинуть его.
- id: rope-of-climbing
  flavor: >-
    Пенька с собственным разумом, эта верёвка ползёт вверх по скалам, прикрепляется к карнизам и завязывается в опоры для рук. Она не боится яда и магии, сбивающей разум, и медленно сама залечивает свои истрёпанные пряди. Моряки клянутся, что однажды она привязала упрямого капитана к мачте по его собственной просьбе.
- id: rope-of-entanglement
  flavor: >-
    Канатчики портового города скрутили этот шнур с обидой на воров. Его дальний конец может выстрелить и обвить существо в путаницу, удерживая его крепко, пока пленник не вырвется или верёвка не вернётся, свернувшись в руку, которая её бросила.
