- id: necklace-of-prayer-beads
  flavor: >-
    Ожерелье из отполированных камней чередуется с простыми бусинами из янтаря и кварца, а несколько камней, если присмотреться, слабо светятся. Каждая светящаяся бусина хранит доброту, которая может быть высвобождена, когда в беде нажимают одну из носимых бусин. Остальная часть нити — приятная безделушка, и в этом часть её очарования.
- id: nine-lives-stealer
  flavor: >-
    Меч с тёмным клинком и рукоятью, обмотанной потрескавшейся кожей, гудит мрачным азартом в бою. Те, кто носил его, описывают резкое, холодное натяжение каждый раз, когда удар попадает чисто. Некоторые называют его вором жизни, что, впрочем, несправедливо по отношению к клинку.
- id: oathbow
  flavor: >-
    Лук из бледного ясеня с тетивой из плетёного серебряного волокна; когда стрелу кладут на место, из дерева поднимается тихий шёпот. Его стрелок может выбрать одного определённого врага, и лук поёт тем пронзительнее, чем ближе подходит этот враг. Рассказы охотников предупреждают: обиду, натянутую на тетиву, нелегко отпустить.
- id: oil-of-etherealness
  flavor: >-
    Мутновато-серые бусины липнут к внутренней стенке этого флакона и исчезают почти сразу после того, как образуются. Тот, кто откроет его, почувствует в воздухе слабый запах дождя, который так и не пролился, как будто помазанное существо уже начало ускользать из комнаты.
- id: oil-of-sharpness
  flavor: >-
    Крошечные серебряные осколки плывут сквозь этот прозрачный студень, словно иней в неподвижном пруду. Кузнецы старых цехов говорят, что одного скользкого слоя этого масла достаточно, чтобы простой клинок стал настолько острым, что рассечёт волос, летящий по ветру.
- id: oil-of-slipperiness
  flavor: >-
    Тяжёлая чёрная мазь выливается медленно, а потом бежит быстро, словно вспомнила, куда ей хочется попасть. Разлитая на каменном полу, она превращает плиты в ловушку, которая смеётся над неосторожными, и беспечный сапог не найдёт опоры.
- id: pearl-of-power
  flavor: >-
    Жемчужина цвета старого молока, слегка тёплая на ощупь, тихо гудит, когда кто-то подносит её близко. Её хранители говорят, что свечение гаснет по мере того, как владелец возвращает в разум израсходованные искры знания, — медленное заимствование у завтрашнего дня.
- id: periapt-of-health
  flavor: >-
    Кулон из бледно-зелёного камня, обвитый тонкой медной проволокой, тёплый на коже и слабо пахнущий растёртой мятой. Целители речного народа вешают такие на детей, которые слишком далеко забредают к болоту, словно немного цвета может прогнать хворь.
- id: periapt-of-proof-against-poison
  flavor: >-
    Блестящий чёрный камень сидит на дне тонкой серебряной цепочки и ловит свет так, как его ловит глубокая вода. Старые аптекари носили такие кулоны рядом с собой, когда работали с горькими кореньями, полагаясь на тёмный камень, который отводит любое кислое дыхание и каждую отравленную каплю.
- id: periapt-of-wound-closure
  flavor: >-
    Из серебряной и красной нитей сплетён этот тонкий кулон, узлы затянуты так туго, будто в них бьётся собственный пульс. Полевые хирурги горных крепостей клялись такими амулетами, утверждая, что упрямое сердце редко сдаётся, когда рядом оказывается один из них.
- id: philter-of-love
  flavor: >-
    Розоватая жидкость слабо шипит, и внутри плавает один пузырёк в форме сердца. Пьющие в старых тавернах клянутся, что первое лицо, которое они увидят после этого, начинает светиться такой теплотой, от которой трудно избавиться.
- id: pipes-of-haunting
  flavor: >-
    Бледно-костяные свирели, отполированные множеством рук, издают тонкий звук, который долго держится под стропилами после последнего вдоха. Артисты речных городков рассказывают о публике, которая покидала зал, уверенная, что услышала собственные имена, шепчущиеся в камышах.
- id: pipes-of-the-sewers
  flavor: >-
    Набор помятых оловянных дудочек, позеленевших от патины и тёплых от частого касания. Крысоловы, работающие под улицами рынка, говорят, что визжащие стаи собираются на первый звук и движутся, как прилив, который отзывается лишь на мелодию.
- id: plate-armor-of-etherealness
  flavor: >-
    Латный доспех, украшенный тонкими серебряными спиралями, выполненный так искусно, что металл, кажется, дышит вместе с носящим его. Рыцари, вернувшиеся с полей пепла, говорят, что сталь на краях бледнеет, словно носящий уже наполовину прошёл сквозь закрытую дверь.
- id: portable-hole
  flavor: >-
    Кусок чёрного шёлка, сложенный так мало, что его можно спрятать в карман, и разворачивающийся с шелестом, когда его встряхивают. Деревенские чародеи клянутся, что он вмещает погреб, полный припасов, хотя никто ещё не заглядывал в тёмное отверстие и не возвращался с ясным отчётом.
- id: potion-of-animal-friendship
  flavor: >-
    Мутно-коричневая жидкость содержит крапинки, которые всплывают всякий раз, когда флакон наклоняют, и среди них видны усик крота, клочок крыла мотылька и завиток коры. Пастухи высокогорных лугов утверждают, что напиток заставляет диких созданий опускать головы и подходить, любопытствуя, что им можно разделить.
- id: potion-of-clairvoyance
  flavor: >-
    Желтоватая жидкость несёт в себе слабый образ глаза, который поворачивается вслед взгляду каждого, кто заглядывает внутрь. Писцы пограничных дворов говорят, что её лучше наливать в чашу осторожно, ведь открытый глаз склонен блуждать к тому, кто будет пить.
- id: potion-of-climbing
  flavor: >-
    В склянке лежат коричневые, серебристые и серые слои, и никакое встряхивание не смешает их. Шахтёры горных посёлков пьют его перед тем, как штурмовать скальную стену, доверяя заключённым в склянку скалам передать им свою хватку.
- id: potion-of-diminution
  flavor: >-
    Прозрачная жидкость, в которой красная капля то разбухает, то сжимается, так и не принимая одной формы. Портные, шьющие для крошечного народа болотных камышей, клянутся этим зельем, хотя признают, что работа оставляет слабый звон в ушах.
- id: potion-of-flying
  flavor: >-
    Серебристый блеск собирается наверху этого прозрачного зелья, словно облако, прижатое стеклом. Курьеры прибрежных городов берут его в долгие поездки, отхлебывая непосредственно перед подъёмом и доверяя ветру держать их устойчиво над крышами.
- id: potion-of-gaseous-form
  flavor: >-
    Туман заполняет этот флакон и льётся, как тонкая вода, закручиваясь обратно на себя всякий раз, когда открывают пробку. Сценические фокусники на речных рынках держат такое зелье для трюка, когда артист проскальзывает сквозь запертую дверь, хотя публика никогда не видит швов.
- id: potion-of-giant-strength
  flavor: >-
    Бледные искры света плывут сквозь эту прозрачную жидкость, словно обрезки какой-то огромной руки. Каждую партию этого напитка сортируют по росту тех, кто впервые его сварил, а на склянках висит маленькая медная бирка с указанием силы.
- id: potion-of-growth
  flavor: >-
    Багровые чернила словно распускаются в этом водянистом напитке, растекаясь от одной точки и снова втягиваясь в неё. Дети фермеров, отпив немного перед ярмарочными состязаниями, хихикают, когда их тени вытягиваются по траве, — нелепый восторг, который никогда не длится долго.
- id: potion-of-heroism
  flavor: >-
    Туман медленно перекатывается внутри этой фляги, меняя вес, словно бутылка — маленькое море. Солдаты приграничных лагерей называют это зелье утешением перед атакой и уверяют, что туман успокаивает нервы и укрепляет руки.
- id: potion-of-invisibility
  flavor: >-
    Сквозь это стекло ничего не видно, однако флакон весит так, будто внутри плещется что-то густое. Воры портовых кварталов ценят такие склянки за их тишину, хотя старые предания предупреждают, что уловка кончается в тот миг, когда неосторожная рука выдаёт себя.
- id: potion-of-mind-reading
  flavor: >-
    Густая фиолетовая жидкость содержит мягкий розовый завиток, который медленно петляет, словно перебирает чужие тайны. Писари старых судов пьют такие отвары перед тяжёлыми слушаниями, хотя случайный шёпот редко остаётся в тишине.
- id: potion-of-poison
  flavor: >-
    Этот флакон оформлен под целебный напиток: та же пробка, та же глазурь и тот же рубиновый оттенок, хотя содержимое создано, чтобы вредить. Лишь острый глаз или правдивый мудрец с сортировочным стеклом способны различить их до первого глотка.
- id: potion-of-resistance
  flavor: >-
    Переливающиеся полосы бледного цвета плывут в этой жидкости, и каждая намекает на свой щит от вреда. Стражи соляных городов берут несколько флаконов в дозор, полагаясь на удачу и твёрдую руку того, кто наливает.
- id: potion-of-speed
  flavor: >-
    Золотые прожилки и тёмный чернильный завиток плывут в этой жёлтой жидкости, словно она нетерпеливо рвётся вон из склянки. Пьющие сообщают о внезапной быстроте, которая не оставляет тяжёлой усталости, когда отпускает. Курьеры речных городков до сих пор держат флакон под рукой для посланий, которые должны прийти до дождя.
- id: potion-of-water-breathing
  flavor: >-
    Мутно-зелёная жидкость с запахом соли и морской пены содержит бледный пузырёк, медленно плывущий через её середину. Моряки, отпившие её, замечают, как их лёгкие тихо меняют привычки, и открытая вода кажется гостеприимной комнатой. Большинство рыбаков всё же держат склянку закупоренной, поскольку пузырёк имеет привычку стукаться о стекло.
