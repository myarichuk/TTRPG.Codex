- id: potions-of-healing
  flavor: >-
    Красная жидкость мерцает всякий раз, когда флакон встряхивают, а стеклянный колпачок намекает на силу варева. Деревенские чародеи и придорожные аптекари продают простые сорта, а самые богатые выдержки хранятся под замком в старых коллегиях. Какой бы ни была сила, напиток оставляет пьющего с ощущением, будто тёплая рука придержала его.
- id: ring-of-animal-influence
  flavor: >-
    Лента темноватой бронзы держит гладкий янтарный камень, пахнущий сеном и мокрой шерстью. Ловцы и пастухи, носящие его, замечают, что волки, ястребы и упрямые быки прислушиваются немного внимательнее. Его небольшой запас силы пополняется с утренним светом.
- id: ring-of-djinni-summoning
  flavor: >-
    Тусклое серебро обхватывает дымчато-синий камень, который, кажется, гудит, когда носящий думает о милости. Дух ветра откликается на зов и встаёт в чистом месте, выбранном призывающим, кланяясь, как старый купец. Он задерживается лишь до тех пор, пока призывающий сохраняет ровное внимание.
- id: ring-of-elemental-command
  flavor: >-
    Каждое кольцо связано с одной из четырёх первородных сил, а его камень показывает настроение этой силы цветом. Земляные камни бледно-охряные, морское стекло зеленовато-серое, а кольца огня светятся беспокойным янтарём. Существа, сотканные из этих сил, начинают остерегаться любого, кто носит такое кольцо.
- id: ring-of-evasion
  flavor: >-
    Тонкий обруч из почерневшей стали покрыт мелкими перекрывающимися чешуйками, словно змея застыла на полпути в скольжении. Акробаты, воры и лучники ценят его за быстрое чутьё, которое он даёт: ощущение, что падающая сеть или внезапный выплеск пламени движутся чуть медленнее, чем нужно. Его запас удачи пополняется с утренним светом.
- id: ring-of-feather-falling
  flavor: >-
    Светло-серое кольцо из лёгкого металла несёт одно белое перо, вставленное в обруч, словно птица обронила его на лету. Скалолазы, звонари и смотрители башен клянутся его мягкой хваткой за воздух, которая разматывает долгое падение в медленный, плавный спуск. Некоторые носящие говорят, что за свои странствия ни разу не приземлились жёстко.
- id: ring-of-free-action
  flavor: >-
    Кольцо из полированного железа с прозрачным, слегка золотистым камнем сидит на пальце, как маленькое солнце, которое никогда не заходит. Портовые рабочие, борцы и моряки в штормовых водах любят его, ведь грязь, паутина и цепкая магия теряют хватку над движениями носящего. Камень всё ещё тёплый, когда жестокое заклинание пытается сковать их.
- id: ring-of-invisibility
  flavor: >-
    Дымчато-серый кристалл образует это кольцо, которое тихо гудит, а его пустая сердцевина, кажется, поглощает ближний свет. Шпионы, воры и странствующие целители давно ценят его за то, как он уводит носящего из виду. Большинство носящих говорят, что труднее всего запомнить, куда они положили собственные сапоги.
- id: ring-of-jumping
  flavor: >-
    Яркая медь изогнута в петлю в форме прыгающего зайца, его лапы поджаты в середине прыжка. Охотники, гонцы и акробаты крыш обнаруживают, что внезапный прыжок переносит их дальше, чем могли бы унести их собственные ноги. Его магия проста и готова к делу, и обычно хватает лишь быстрого движения кисти.
- id: ring-of-mind-shielding
  flavor: >-
    Простое кольцо из тёмного олова с едва заметным серебряным швом не пускает назойливые мысли в голову носящего. Шпионы и хранители тихих комнат любят его, потому что ни один читающий мысли не поймёт, о чём они на самом деле думают. Слухи намекают, что душа, заключённая в кольце, может веками держать свои думы при себе.
- id: ring-of-protection
  flavor: >-
    Простой стальной обруч несёт маленький тусклый сапфир, который ловит свет, только когда носящий стоит твёрдо. Стражники, караванщики и тревожные учёные носят его ради скромного, но надёжного ощущения, что клинок или проклятие чуть менее вероятно найдут свою цель.
- id: ring-of-regeneration
  flavor: >-
    Бледно-розовый кварц в тонком золотом кольце слегка тёпл на коже, словно целебный компресс. Полевые хирурги и горные охотники дорожат им за медленное, ровное заживление, которое он даёт, когда они ушиблись или порезались далеко от помощи. Говорят, он способен вернуть утраченную конечность, хотя мало кто пробовал.
- id: ring-of-resistance
  flavor: >-
    Цвет самоцвета намекает на стихию, от которой защищает обруч, например жемчуг от кислоты или гранат от огня. Торговцы в портовых городах и на горных перевалах продают их как разумные подарки путешественникам, которые ждут беды. Даже сильный удар этой стихией оставляет носящего лишь с обгоревшим рукавом или ноющей ладонью.
- id: ring-of-shooting-stars
  flavor: >-
    Тёмно-синий обруч держит серебряные искры, которые скользят по его поверхности, словно маленькое зимнее небо. Странники и ночные дозоры пользуются его мерцанием, чтобы читать путь впереди, а его яркие вспышки способны напугать или разогнать толпу врагов. Его искры гаснут обратно в металл только тогда, когда носящий замирает и умолкает.
- id: ring-of-spell-storing
  flavor: >-
    Толстое кольцо из тёмного золота, кажется, хранит в своём самоцвете слабый завиток цветного света, словно оно полно дыхания. Маги оставляют его на столах и в карманах, и заклинания падают в него на хранение, пока кто-то достойный не призовёт их.
- id: ring-of-spell-turning
  flavor: >-
    Полированный чёрный металл несёт зеркально-яркие линии, которые переливаются по обручу, как вода. Дуэлянты и советники при дворах, опасающиеся враждебного колдовства, ценят его, ведь большинство недружественных заклинаний соскальзывают с него или возвращаются к своему творцу. Старые предания восхваляют носящих за то, что они поворачивают ветер проклятия против того, кто его наслал.
- id: ring-of-swimming
  flavor: >-
    Бледно-голубая эмаль образует кольцо с маленьким узором волны, который, кажется, течёт, когда носящий движет рукой. Ловцы жемчуга и команды паромов ценят его за уверенные, рыбьи гребки, которые он даёт в глубоких течениях. Некоторые говорят, что сама вода становится к носящему чуть дружелюбнее.
- id: ring-of-telekinesis
  flavor: >-
    Розоватый железный обруч держит маленький прозрачный кристалл, который всегда кажется слегка парящим над оправой. Каменотёсы, строители мостов и хитрые воры мечтают о тихой хватке, с которой камень или упавший инструмент может по одной мысли плыть через комнату.
- id: ring-of-the-ram
  flavor: >-
    Кованая бронза складывается в бараньи головы на этом кольце, которое, кажется, упрямо смотрит на всё, что стоит перед ним. Носящие в пограничных городах и на рудниках любят его, ведь призрачный удар силы способен выбить соперника из равновесия.
- id: ring-of-three-wishes
  flavor: >-
    Три маленьких бледных самоцвета сидят в тяжёлом золотом кольце, каждый слабо светится и стёрт до гладкости большими пальцами прежних владельцев. Короли и купцы дрались за него, а осторожные люди держатся подальше, зная, что последний самоцвет оставляет после себя лишь простой металл.
- id: ring-of-warmth
  flavor: >-
    Тонкий медный обруч держит янтарный камень, который остаётся тёплым на ощупь даже в лютый снег. Северные проводники и моряки замёрзших побережий ценят его, ведь зимний холод, кажется, отскакивает от носящего. Что бы ни сделал сильный мороз с пальцами путника, кольцо удерживает тепло вплотную.
- id: ring-of-water-walking
  flavor: >-
    Светлый серебристо-голубой металл образует это кольцо, а по его поверхности вырезана крошечная волна. Паромщики, собиратели тростника и речные курьеры пользуются им, чтобы переходить болота и затопленные поля, не замочив сапог. Волна, кажется, чуть приподнимается всякий раз, когда носящий ступает на мерцающий пруд.
- id: ring-of-x-ray-vision
  flavor: >-
    Тёмное латунное кольцо обрамляет бледный линзовидный кристалл, который, кажется, заглядывает сквозь всё, что лежит перед ним. Инспекторы, слесари и любопытные учёные любят то, как стены становятся стеклом, однако узнают, что толстый свинец и тяжёлый камень всё равно закрывают обзор. Каждое использование утомляет глаза, поэтому мудрые носящие отдыхают после каждого взгляда.
- id: robe-of-eyes
  flavor: >-
    Ткачи старых коллегий затонувшего побережья вшили в эту мантию нарисованные глаза, веря, что ткань должна следить за носящим. Веки, кажется, моргают при проходящих тенях, и ни один шёпот не остаётся незамеченным. Яркий блик и внезапные вспышки заставляют нарисованные глаза зажмуриться, оставляя носящего ослеплённым и ворчащим, пока жжение не пройдёт.
- id: robe-of-scintillating-colors
  flavor: >-
    Красильщики, смешивавшие толчёных жуков и минеральные порошки, создали эту мантию, которая держит свои цвета в переливающихся полосах. Когда носящий пожелает, ткань вспыхивает ослепительным узором, который пугает зрителей и сбивает прицел нападающих. Тот, кто уставится в эту вспышку, может обнаружить, что его ноги превратились в дрожащее желе, пока блеск не угаснет.
