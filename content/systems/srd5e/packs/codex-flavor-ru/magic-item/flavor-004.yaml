- id: helm-of-brilliance
  flavor: >-
    Церемониальный шлем, усыпанный самоцветами четырех цветов, каждый из которых ловит свой особый свет, так что владелец будто окутан маленьким личным восходом. Кузнецы говорят, что их самоцветы рассыпаются в пыль, если их выковырять, а мудрецы, писавшие о нем, тщательно избегали называть хоть одного владельца.
- id: helm-of-comprehending-languages
  flavor: >-
    Простой железный шлем с забралом из полированного стекла, благодаря которому владелец понимает речи на языках, которых никто за столом никогда не слышал. Посланники и портовые писцы ценят его, хотя один острый на язык повар заметил, что шлем, который понимает всех, слышит и каждую жалобу.
- id: helm-of-telepathy
  flavor: >-
    Прохладный серебряный шлем, внутренняя подбивка которого вытерта дюжиной владельцев, каждый из которых утверждал, что слышит мысли своих друзей. Ярмарочные гадатели по мыслям отдали бы многое за такой шлем, а старые коллегии строго запрещают давать его тем, кто затаил обиду.
- id: helm-of-teleportation
  flavor: >-
    Сияющий бронзовый шлем с тремя маленькими синими камнями вдоль гребня, каждый из которых хранит немного беспокойного желания владельца оказаться где-нибудь в другом месте. Курьеры и картографы одинаково жаждут его, хотя деревенские колдуны предупреждают, что прибытие иногда выходит не в том порядке: сапогами вперед.
- id: holy-avenger
  flavor: >-
    Длинный меч с лезвием из белого золота, рукоять которого обмотана слоновой костью, а навершие украшено одним бледным камнем, светящимся при обнажении. Стражи старых коллегий хранят его с великой осторожностью, а некоторые предания утверждают, что его бледный свет загоняет теневых тварей обратно во тьму.
- id: horn-of-blasting
  flavor: >-
    Длинный медный рог с раструбом и широким мундштуком, корпус которого помят от многих попыток хвастунов взять самую громкую ноту. Шахтеры и паромщики держат его как предупреждение, ведь известно, что рог лопается в руках того, кто трубит в него слишком часто.
- id: horn-of-valhalla
  flavor: >-
    Изогнутый рог, отлитый из нескольких металлов, который призывает духов воинов из далекого чертога героев, когда его звук разносится над полем. Те, кто их призывает, говорят, что духи вежливы, пока не начнется бой, а потом становятся лишь верными, бесстрашными и очень громкими.
- id: horseshoes-of-a-zephyr
  flavor: >-
    Четыре бледные железные подковы, которые поднимают коня чуть над землей и не оставляют следов копыт ни на грязи, ни на песке, ни на снегу. Курьеры речных равнин клянутся, что подковы делают коня легким, как лист, а гильдии старых конюхов считают их слишком хитроумными для честного ремесла.
- id: horseshoes-of-speed
  flavor: >-
    Четыре темно-бронзовые подковы с загнутыми краями, на каждой из которых выгравирована полоска золотых линий, похожих на ветер, схваченный на скаку. Гонщики старых ярмарок отдали бы собственные седла за комплект, а конюхи говорят, что конь с ними обгонит собственную тень.
- id: immovable-rod
  flavor: >-
    Железный стержень с кнопкой на одном конце, которая, будучи нажата, удерживает его на месте так же упрямо, как гора держит свою форму. Геодезисты и канатчики находят его полезным для мостов и неудобных уступов, хотя те, кто пытается его сдвинуть, обычно жалуются на тяжесть.
- id: instant-fortress
  flavor: >-
    В адамантиновой фигурке размером с ладонь заключена башня, которая ждет одного слова команды. Как только она раскроется, серокаменные стены встанут высоко и неприступно, а все, что стояло на пути, будет вежливо отодвинуто в сторону. Большинство владельцев держат ее как крепость на тот редкий вечер, когда открытая дорога становится враждебной.
- id: ioun-stone
  flavor: >-
    Каждый камень — гладкий стеклянистый самоцвет, огранённый в форме косой призмы или коренастого зуба, и цвет каждого — его собственная тайная метка. Те, кто их хранит, обычно позволяют им медленно плыть над головой, словно крошечным лунам. Ученые старых коллегий бесконечно спорят о том, думают ли эти камни или лишь капризничают.
- id: iron-bands
  flavor: >-
    Ржавый железный шар, не больше сливы, скрывает внутри клубок свернутых металлических лент. Брошенный уверенной рукой, он раскрывается на лету и опутывает цель лязгающим узлом, который держит крепко, пока бросивший сам не решит ослабить его. Контрабандисты и тюремщики одинаково ценят его за то, как аккуратно он делает свою работу.
- id: iron-flask
  flavor: >-
    Пробка этой железной фляги медная, а сосуд исцарапан владельцами, которые так и не научились доверять тому, что в нем хранится. Всякий, кто открывал ее, рассказывает о тесной, серной тишине, которая, кажется, тянется целую вечность. Осторожные коллекционеры подписывают каждую флягу именем, которое надеются никогда не произносить вслух.
- id: javelin-of-lightning
  flavor: >-
    Тонкое метательное копье с древком из темного ясеня, обвитым медной проволокой, и наконечник его слабо гудит перед каждым броском. Брошенное движением запястья, оно может расколоться на трескучую молнию, которая прошивает толпу врагов насквозь. Охотники, которые его носят, обычно держат друзей на осторожном расстоянии.
- id: lantern-of-revealing
  flavor: >-
    Фонарь из латуни с капюшоном, который горит ровно на капле масла, а свет его достаточно ясен, чтобы показать то, что должно оставаться скрытым. Вещи, прячущиеся от обычных глаз, в его сиянии словно проступают наружу. Путешественники держат руку на капюшоне, ведь опущенный, он смягчает свет перед сном.
- id: luck-blade
  flavor: >-
    Лезвие этого клинка отполировано так ярко, что, кажется, хранит личную шутку с владельцем. О счастливых владельцах говорят, что они выигрывают и споры, и тесные схватки, а в рукоять вделана крошечная серебряная монета как напоминание. Любимая хитрость меча — свежий шанс, тихо предложенный тогда, когда первый бросок судьбы пошел не так.
- id: mace-of-disruption
  flavor: >-
    Ее ребристая железная головка испещрена бледными кольцами света, и она гудит всякий раз, когда чует нечто, что не должно ходить. Против нежити и исчадий она бьет импульсом сияния, способным пошатнуть ослабленного врага до самых основ. Свечение цепляется к держащему даже в покое.
- id: mace-of-smiting
  flavor: >-
    Тяжелые железные шишки венчают эту булаву, а ее рукоять обмотана тусклым серым шнуром, который согревается в руке. Удары, пришедшиеся точно, вознаграждаются треском силы, который проходит сквозь цель, а искусная механическая фигура рассыплется по швам. Инженеры, которые чинят часовые механизмы, держат такую поближе, чаще всего чтобы свести счеты.
- id: mace-of-terror
  flavor: >-
    Темная железная булава с головкой, похожей на сжатый кулак, и каждый раз, когда ею машут над толпой, от нее словно слетает тихий шепот. Когда оружие выпускает свой ужас, ближние враги испытывают желание отодвинуться от владельца как можно дальше. Его носители часто мечтают о более тихом оружии.
- id: mantle-of-spell-resistance
  flavor: >-
    Этот плащ соткан из тяжелой серой шерсти, которая, кажется, впитывает искры и случайные отблески до того, как они доберутся до владельца. Портные, которые его шили, говорят, что подкладка прохладна на ощупь даже в пылающей кузне. Те, кто его носит, утверждают, что ткань делает их устойчивее рядом со странной магией.
- id: manual-of-bodily-health
  flavor: >-
    Тонкий том в мягком переплете, полный разумных советов о питании, отдыхе и растяжке. Его страницы заряжены тихой магией, которая вознаграждает внимательное чтение, заметно делая читателя крепче. Когда все уроки усвоены, книга тускнеет и на долгое время становится безжизненной.
- id: manual-of-gainful-exercise
  flavor: >-
    Толстая книга в тканевом переплете с рисунками подъема, переноски и лазания, а поля ее испещрены мелкими заметками торопливым почерком. Слова гудят беспокойной энергией, которая, кажется, перетекает в руки и плечи читателя. Когда уроки усвоены, страницы бледнеют и успокаиваются, а книга ждет следующего жаждущего ученика.
- id: manual-of-golems
  flavor: >-
    Этот фолиант содержит чертежи и заклинания, необходимые для оживления одного особого вида каменного или железного слуги. Автор никогда прямо не называет этот вид, и выбор, кажется, принадлежит самой книге. Понять ее страницы может лишь заклинатель с серьезным обучением, а неуклюжих читателей наказывает болезненный разряд умственного огня.
- id: manual-of-quickness-of-action
  flavor: >-
    Переплетенная в бледно-зеленую ткань, эта тонкая книга полна упражнений на равновесие, эскизов постановки ног и мелких заметок о рефлексах. Ее страницы несут легкую, проворную магию, которая, кажется, пробегает по кончикам пальцев всякого, кто их изучает. Когда уроки усвоены, страницы выцветают до обычной бумаги, хотя исписанные поля остаются удивительно живыми.
- id: marvelous-pigments
  flavor: >-
    В тонком деревянном ящичке маленькие глиняные горшочки с красками лежат плотно рядом с мягкой кистью. Все, что нарисовано ими, обретает удивительную плотность, так что нарисованную дверь можно открыть, а нарисованное дерево дает тень. Результаты обычно выходят прекрасными, хотя краски, кажется, кончаются в самый неподходящий момент.
- id: medallion-of-thoughts
  flavor: >-
    Серебряный диск на тонкой цепочке, прохладный на коже, тихо гудит всякий раз, когда призывают его чары. Его мерцание открывает поверхностные мысли находящихся рядом, так что шепотом переданный слух или внезапная тень сомнения становятся ясно слышны. Многие носящие его говорят, что самое трудное — держать собственное мнение при себе.
- id: mirror-of-life-trapping
  flavor: >-
    Это высокое узкое зеркало показывает смутные очертания существ тому, кто взглянет на него искоса. Рама его вырезана в виде колючих лоз, а стекло помутнело, как дыхание на холодном окне. Его легко разбить, и осторожные владельцы таких вещей, кажется, находят это успокаивающим, ведь разбитое зеркало освобождает то, что было в него поймано.
- id: mithral-armor
  flavor: >-
    Серебристый и легкий, как перо, этот доспех можно носить под обычной одеждой, и он не выдает ни следа громоздкости. Он движется вместе с телом так же свободно, как хорошая шерстяная куртка, и никогда не звякает на лестнице.
- id: mysterious-deck
  flavor: >-
    Карты из слоновой кости или пергамента, расписанные странными фигурками, лежат в потертом мешочке, который слабо пахнет кедром. Каждая колода, кажется, имеет собственное мнение о том, кому позволено задавать ей вопросы. Гадалки и плуты одинаково относятся к картам с уважением, граничащим со страхом.
