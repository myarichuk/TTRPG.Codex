- id: necklace-of-adaptation
  flavor: >-
    Простая цепочка из кованых медных звеньев держит гладкую бусину, которая на ощупь слегка теплая. Дурной воздух и густой дым, кажется, расступаются перед владельцем, а горький яд теряет большую часть своего укуса. Полевые лекари и картографы одинаково брали такие амулеты в болота и шахты.
- id: necklace-of-fireballs
  flavor: >-
    Шнур из темной кожи с блестящими красно-коричневыми бусинами, каждая из которых слегка теплая и пахнет серой. Вынимать бусину нужно осторожно, ведь она взрывается катящимся пламенем в тот миг, когда падает на землю. Солдаты и игроки одинаково восхищаются ею, хотя никто не может решить, оружие это или шутка.
