- id: adamantine-armor
  flavor: >-
    Кузнецы, которые куют с адамантином, утверждают, что металл помнит каждый удар, который он отразил. Этот доспех хранит ту же упрямую память в своих пластинах, поэтому чистый, смертоносный удар, который нашел бы брешь, вместо этого приходится как обычный толчок. Носители говорят, что звучит он как колокол, который отказывается звенеть чисто.
- id: ammunition-of-slaying
  flavor: >-
    Колчан с этими стрелами слабо гудит всякий раз, когда рядом оказывается не та тварь, будто древки помнят старую обиду. Охотники рассказывают истории о единственном выстреле, который сразил зверя или каменнокожего титана. Как только железный наконечник находит цель, древко тускнеет и становится обычным.
- id: ammunition
  flavor: >-
    Мастера-оперители, работающие с чарами, часто наносят на каждое древко крошечный знак для покупателей. Чары спадают в тот миг, когда древко находит цель, оставляя после себя щепку и историю, которую можно рассказать. Десяток таких стрел стоит примерно как маленький флакон удачи.
- id: amulet-of-health
  flavor: >-
    Этот кулон вырезан из одного куска темного нефрита и приятно теплый на ощупь. Целители, которые его носят, говорят, что их собственные тела словно держатся немного дольше: мышцы крепче, дыхание глубже. Некоторые подозревают, что камень просто помнит сильное сердце и напоминает о нем владельцу.
- id: amulet-of-proof-against-detection-and-location
  flavor: >-
    Знатоки скрытого сшили этот амулет из серого шелка и осколка посеребренного стекла. Кто станет искать владельца с помощью зеркал, знамений или дальнего подслушивания, найдет лишь пустую комнату. Владелец по-прежнему может сам решить, открыть ли дверь, когда придет доверенный друг и постучит.
- id: amulet-of-the-planes
  flavor: >-
    Картографы далеких миров клянутся этим кулоном, который гудит, как камертон, стоит владельцу подумать о далеком месте. Шаг через разрыв между мирами никогда не бывает аккуратным, а неудачный бросок жребия может разметать целую толпу по незнакомому небу. Мудрые путешественники привязывают веревку к поясу.
- id: animated-shield
  flavor: >-
    Щит, который хочет летать, — существо беспокойное: он легко отрывается от руки и зависает у бока владельца. Оружейники, которые такие делают, ворчат, что металл никогда не был доволен тем, что лежит на стойке. Он снова ложится в хват или на мостовую, когда владельцу надоедает этот трюк.
- id: apparatus-of-the-crab
  flavor: >-
    Поднятая со дна кораблекрушения, датировать которое никто не смог, эта железная бочка выглядит как обычная тяжелая бочка, пока кто-нибудь не найдет скрытую защелку. Внутри ряд жестких рычагов ждет пилота с твердой рукой и чувством юмора. Как только аппарат оживает, бочка раскрывается в панцирь из сочлененных ног и клешней.
- id: armor-of-invulnerability
  flavor: >-
    Оружейники старого рода иногда покрывают свою работу плотным темным сплавом, который звенит, как ударенный гонг. Доспех защищает владельца от ударов мечей и копий, а в час крайней опасности окутывает его оболочкой, которую не берет ни одно оружие. Такая оболочка формируется только один раз и должна отдохнуть, прежде чем сформируется вновь.
- id: armor-of-resistance
  flavor: >-
    У каждого доспеха этого рода есть тихое предпочтение к одному виду вреда, и старые мастера так и не сошлись во мнении, как оно выбирается. Одни говорят, что он прислушивается к погоде. Другие утверждают, что доспех просто принимает форму той опасности, с которой его владелец, скорее всего, встретится в дороге.
- id: armor-of-vulnerability
  flavor: >-
    Этот доспех приятно весит и хорошо отделан, и в этом-то и беда. Его создатель задумал его как ловушку для жадных, и проклятие открывается только ученому, который знает нужное заклинание. Осторожные покупатели просят священника определенного толка осмотреть доспех, прежде чем брать его домой.
- id: armor
  flavor: >-
    Латы и кольчуги с чарами такого рода выглядят обычно, пока воин не наденет их и не почувствует разницу. Кузни ведут учет качества каждого изделия, которое отмечено небольшим набором рун у воротника. Чем лучше руна, тем охотнее металл, кажется, встречает удар на полпути.
- id: arrow-catching-shield
  flavor: >-
    Лучники ненавидят этот щит, и чувство это взаимно. Его лицо испещрено неглубокими бороздками, которые, кажется, притягивают шальные стрелы, и потому стоящий рядом друг остается вне опасности. Старые солдаты называют его хорошим соседом для опасных углов битвы.
- id: bag-of-beans
  flavor: >-
    Торговцы с речного квартала клянутся, что этот холщовый мешок — самая удачная их ставка. Посади одну фасолину, и земля может ответить фонтаном, деревом, тяжелым от плодов, или чем-то куда менее учтивым. Если высыпать содержимое небрежно, фасолины взрываются вспышкой, которая опаляет всех поблизости, включая владельца мешка.
- id: bag-of-devouring
  flavor: >-
    Этот мешок выглядит как изящный и разумный кошель, и именно поэтому неосторожные руки оказываются внутри. За швом сидит что-то голодное и принимает все, что в него бросят, без малейшей благодарности. Старьевщики, которые находят такой мешок, обычно быстро его продают, чаще всего тому, кто не слышал историй о нем.
- id: bag-of-holding
  flavor: >-
    Упаковщики и носильщики любят этот мешок, потому что он поглощает инструменты целого хозяйства и при этом остается легким, как каравай. Внутри он куда просторнее, чем снаружи, — фокус, который старые мастерские так и не смогли толком объяснить. Порвите швы или перегрузите ремень, и содержимое высыплется в серебристое звездное ничто.
- id: bag-of-tricks
  flavor: >-
    Странствующие балаганщики продают эти холщовые мешки из поколения в поколение, и в каждом спрятан маленький пушистый сюрприз. Брошенный клок падает и распускается существом, которое следует указаниям владельца, хотя всегда сохраняет немного собственного норова. Каждый мешок изнашивается после нескольких бросков и оставляет после себя слегка кислый запах.
- id: bead-of-force
  flavor: >-
    Гладкая, как речной камень, и черная, как зимняя ночь, эта маленькая сфера хранит внутри себя тайный заряд давления. Брошенная в толпу, она распускается прозрачным куполом, который запирает того, кто не успел отскочить. Купол держится какое-то время, пропускает воздух, но не пускает ничего другого.
- id: belt-of-dwarvenkind
  flavor: >-
    Дварфы высоких долин передают эти пояса как семейные реликвии, хотя некоторые из них разошлись по всему большому миру. Владелец скоро обнаруживает, что на его языке появляется старая горная речь, а в костях поселяется упрямая, крепкая гордость. Те, кто рожден в других краях, тоже получают острое зрение в тусклых туннелях и удивительную способность стойко переносить яды.
- id: belt-of-giant-strength
  flavor: >-
    Великаны носят эти пояса, как горделивые перевязи, и каждая пряжка вырезана по размеру обеденной тарелки. Каждый род отдает предпочтение своей строчке и металлу, и сила, которую дает пояс, словно растет вместе с гордостью владельца. Низкорослые, которые застегивают такой пояс, обнаруживают, что мир клонится в их пользу, а когда пояс снимают, становится странно тяжело.
- id: berserker-axe
  flavor: >-
    Кузнец, выковавший этот топор, был в гневе, и это видно в каждой зарубке клинка. Лезвие врезается глубоко, а рукоять ложится в руку так, будто там и должна быть, и именно этим топор удерживает владельца. Те, кто берет его в руки, привязываются к нему, а потом начинают маяться, стоит клинку покинуть их хват.
- id: boots-of-elvenkind
  flavor: >-
    Сапожники лесного народа шьют эти мягкие сапоги из светлой кожи, которая впитывает звук. Тот, кто их носит, ступает, как слух по переполненному залу, и приходит раньше, чем кто-либо успевает прислушаться. Воры и шпионы порой платят целое состояние за пару, хотя честные разведчики ценят их не меньше.
- id: boots-of-levitation
  flavor: >-
    Однажды сапожник клялся, что эти сапоги — обычные подошвы с капелькой упрямого духа, вшитой в подкладку. Тот, кто их носит, учится подниматься над полом по желанию и зависать в воздухе, словно воздушный змей на терпеливой нити. Скалолазы очень их ценят, хотя по слухам первую пару сшили для привередливого старого ученого.
- id: boots-of-speed
  flavor: >-
    Гонцы-курьеры в вольных городах говорят, что хорошие каблуки обгонят хорошую лошадь. В пятке этих сапог спрятана хитрость — резкий щелчок, который удваивает шаг, и любой, кто попытается догнать бегуна, обнаружит, что опора ненадежна. Если перенапрячь их, магия обижается и молчит, пока владелец как следует не отдохнет.
- id: boots-of-striding-and-springing
  flavor: >-
    Странствующие лудильщики ворчат, что сапогам не полагается так много уметь. Эти сохраняют ровный шаг путника, каким бы тяжелым ни был мешок или какой бы толстой ни была куртка. Время от времени они дарят радостный прыжок, перенося владельца через канаву или упавшее бревно.
- id: boots-of-the-winterlands
  flavor: >-
    Сшитые руками, которые никогда не доверяли лету, эти меховые сапоги остаются теплыми, даже когда иней подбирается к самым ступеням. Старые следопыты клянутся, что подошвы помнят каждый сугроб, который они пересекли. Ходьба по утоптанному снегу превращается в своего рода тихий танец.
- id: bowl-of-commanding-water-elementals
  flavor: >-
    Простая глиняная чаша оживает, стоит ее наполнить водой и подойти достаточно близко, чтобы заговорить. Вода поднимается в фигуру с холодным, терпеливым лицом, и она подчиняется, пока работа не будет завершена или ее не отправят домой. Прибрежные повара говорят, что чаша помнит каждый прилив, который в ней удерживала.
- id: bracers-of-archery
  flavor: >-
    Мягкие кожаные наручи с крошечными мотивами стрел любят лучники, которые хотят, чтобы рука с тетивой пела. Деревенские колдуны утверждают, что кожу выдубили в погребе на склоне холма, где ветер никогда не переставал свистеть. Каждый выстрел, пущенный через них, словно несет с собой немного дополнительной силы намерения.
- id: bracers-of-defense
  flavor: >-
    Простые наручи из стальных полос, которые, кажется, слабо гудят всякий раз, когда владелец не прикрыт доспехом. Старые дуэлянты любят их для ночей, когда хочется двигаться свободно, а не быть погребенным под латами. Металл хранит спокойную, внимательную тишину, будто ждет клинка, который так и не приходит.
- id: brazier-of-commanding-fire-elementals
  flavor: >-
    Железная жаровня, почерневшая по краю от жара, пробуждается, когда кто-то подходит достаточно близко, чтобы пробормотать старую команду. Пламя собирается в фигуру с угольными глазами и потрескивающим голосом, и она отвечает призвавшему, пока ее не отпустят или она не догорит. Пепел в чаше остается теплым еще долго после этого.
