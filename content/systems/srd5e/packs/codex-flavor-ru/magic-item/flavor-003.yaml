- id: dust-of-disappearance
  flavor: >-
    Щепотка тонкого песка, который исчезает с ладони, а если его подбросить в воздух, все поблизости скрывается из виду. Это подарок ворам и тем, кому нужно проскользнуть мимо бдительного глаза, хотя действие рассеивается, как только кто-нибудь начнет действовать открыто.
- id: dust-of-dryness
  flavor: >-
    Маленький пакетик бледной серой крупы, которая способна собрать целую лужу в один шарик, похожий на мрамор. Шарик тихо лежит, пока кто-нибудь не разобьет его снова. Духи воды терпеть не могут эту пыль, и щепотка ее способна иссушить водяные тела элементалей.
- id: dust-of-sneezing-and-choking
  flavor: >-
    Тонкий порошок, который выглядит точно как более полезная пыль, пока кто-нибудь не присмотрится, и тогда уже слишком поздно. Облако вызывает у незадачливых приступы чихания и удушья, и лишь самые крепкие или магически стойкие могут стряхнуть его с себя.
- id: dwarven-plate
  flavor: >-
    Тяжелые латы, выкованные в глубоких залах дварфов, с крепким, устойчивым ощущением, которое, кажется, легко переносит толчок. Хитроумное соединение пластин позволяет владельцу упереться пяткой и не дать себя утащить по камням веревкой или внезапным порывом ветра.
- id: dwarven-thrower
  flavor: >-
    Боевой молот, сбалансированный для броска, созданный так, чтобы лететь длинной дугой и возвращаться, как верная собака. Горные кузнецы наделили его гудящим зарядом силы, который сильнее всего впивается в великанов. Как бы далеко он ни улетел, он всегда возвращается на ладонь владельца.
- id: efficient-quiver
  flavor: >-
    Тонкий кожаный колчан с тремя скрытыми отделениями, каждое из которых тянется намного глубже, чем можно было бы предположить по его внешнему виду. Стрелы, дротики и длинные древки выскальзывают так же легко, будто их достали из обычного футляра, что обычно ставит в тупик тех, кому приходится это нести.
- id: efreeti-bottle
  flavor: >-
    Расписная медная бутылка с пробкой, которая никогда до конца не держится закрытой, и дым, который выползает с безвредной вспышкой огня. Огненный дух, заточенный внутри, с каждым открытием становится все беспокойнее, а результат зависит от того, насколько удачлив рассказчик в тот вечер.
- id: elemental-gem
  flavor: >-
    Небольшой граненый камень, в котором заперт осколок погоды, светящийся цветом своей стихии. Расколите его, и из него выйдет слуга этой стихии, яростный и послушный на короткое время, прежде чем раствориться обратно в мире.
- id: elven-chain
  flavor: >-
    Рубаха из тонких звеньев кольчуги, легкая и гибкая, сплетенная мастерами, которые считали, что доспех должен двигаться вместе с владельцем. Узор ее колец блестит серебром в лесной тени, а хитрость кузнеца позволяет даже новичку в тяжелой броне двигаться так, будто он в ней родился.
- id: eversmoking-bottle
  flavor: >-
    Приземистая склянка, из которой при вынутой пробке вырывается густое облако дыма, разрастающееся по полю и отказывающееся рассеиваться. Воры и разведчики давно ценят ее, хотя облако продолжает расти, пока пробка остается вынутой, и дым одинаково слеп как для друга, так и для врага.
- id: eyes-of-charming
  flavor: >-
    Пара кристаллических линз, которые ложатся на глаза и слабо гудят, ловя свет. Владелец замечает, что его улыбка становится на удивление убедительной, а линзы способны склонить разум к дружелюбной дымке, однако их сила возвращается лишь с рассветом.
- id: eyes-of-minute-seeing
  flavor: >-
    Кристаллические линзы, выточенные для тонкой работы, позволяют владельцу разглядеть мельчайшую царапину или шов, будто он смотрит через увеличительное стекло. Ученые старых коллегий и осторожные фальшивомонетчики одинаково ценят их, ведь от таких острых глаз не спрячется ничто мелкое.
- id: eyes-of-the-eagle
  flavor: >-
    Кристаллические линзы, которые обостряют зрение владельца так, что далекие детали видны так же ясно, как и близкие. Сторожа и охотники клянутся ими, ведь даже пятнышко на дальнем горизонте становится читаемой формой, если смотреть сквозь такое тонкое стекло.
- id: feather-token
  flavor: >-
    Одно перо, легкое, как вздох, которое становится чем-то величественным, едва его бросят или коснутся. Его вид варьируется от маленького якоря для корабля до парящего хлыста, и ученые-мастера часто шутят, что перо — самая малая часть фокуса.
- id: figurine-of-wondrous-power
  flavor: >-
    Маленькая резная статуэтка, которая оживает в виде зверя, будь то лев, конь или что-нибудь более странное, а затем возвращается в тихий облик фигурки. Каждая фигурка, кажется, помнит свою последнюю вылазку и дуется какое-то время, пока ее снова не призовут.
- id: flame-tongue
  flavor: >-
    Клинок, выкованный кузнецами, которые не гасили горна ни одной зимой. Когда над его рукоятью произносят тихое слово, пламя взбирается по стали, как плющ, и воздух пахнет угольями. Деревенские колдуны до сих пор спорят, голодно ли это пламя или просто жаждет дела.
- id: folding-boat
  flavor: >-
    Небольшой сосновый ящичек, достаточно легкий, чтобы уместиться под мышкой, который раскладывается в лодку при нужных словах. Речной люд носит их в своих плащах и клянется, что дерево помнит каждое озеро, по которому оно плавало. Складывать обратно требует определенной осторожности, ведь лодка никогда не бывает нежна при этом.
- id: frost-brand
  flavor: >-
    Меч, клинок которого словно вырезан из зимнего озера, а лезвие покрыто инеем даже в самые теплые летние вечера. Смотрители огня старых коллегий ценят такую сталь за то, как она выстуживает цель до мозга костей и не дает пламени подобраться к владельцу.
- id: gauntlets-of-ogre-power
  flavor: >-
    Тяжелые железные рукавицы с костяшками, похожими на речную гальку, созданные для хватки, способной согнуть подкову в браслет. Кузнецы, которые их ковали, говорили, что металл помнит мышцы первого великана, который их надел, и большинство носильщиков верят в это до сих пор.
- id: gem-of-brightness
  flavor: >-
    Граненая призма из прозрачного кристалла, огранка которой такова, что свет, кажется, собирается внутри и ждет разрешения уйти. Фонарщики и актеры старых коллегий давно его жаждут, хотя камень никогда не тускнеет, как бы его ни нагружали.
- id: gem-of-seeing
  flavor: >-
    Бледно-зеленый самоцвет, который мутнеет по краям, когда им пользуются, словно камень слишком долго смотрел в то, чего не мог удержать. Мудрецы, которые ценят зрение выше удобства, обычно держат его поближе к окну и следят за очертаниями, которых не должен замечать обычный глаз.
- id: giant-slayer
  flavor: >-
    Простое оружие хорошей работы, баланс которого подобран под тот миг, когда за вами пришлет гораздо более крупный противник. Рассказчики в речных городах клянутся, что этим оружием одним точным ударом валили чудовищ размером с холм.
- id: glamoured-studded-leather
  flavor: >-
    Комплект клепаного кожаного доспеха, который может принять облик лучшего портновского кафтана, садовничьего фартука или таббарда придворного герольда. Разведчикам, которым нужно незаметно проскользнуть мимо пира, этот трюк полезен, хотя кожа никогда до конца не забывает своей настоящей формы.
- id: gloves-of-missile-snaring
  flavor: >-
    Сшитые из гибкой кожи, с укрепленными ладонями, эти перчатки помогают ловкому бойцу ловить в воздухе стрелы, дротики и брошенные топорики. Лучники старых коллегий их терпеть не могут, ведь точно рассчитанный захват способен превратить их лучший залп в конфузливую охапку щепок.
- id: gloves-of-swimming-and-climbing
  flavor: >-
    Облегающие перчатки из промасленного холста с цепкими кончиками пальцев, такие, за которые берется моряк или канатчик перед долгим подъемом. Те, кто их носит, обнаруживают, что скалы и приливные камни вдруг кажутся менее грозными, а некоторые, как говорят, сумели доплыть до дома с ухмылкой на лице.
- id: goggles-of-night
  flavor: >-
    Толстые дымчатые линзы в клепаной оправе, такие очки, какие ночной сторож или картограф темных пещер может держать в кармане плаща. Исследователи пещер клянутся, что линзы позволяют им различать лица в полумраке, а некоторые хитрецы утверждают, что помогают распознавать ложь в освещенных трактирах.
- id: hammer-of-thunderbolts
  flavor: >-
    Тяжелый боевой молот с головкой, похожей на сжатый кулак из темного железа, а его древко обмотано кожей, которая после каждой грозы слабо пахнет озоном. Прибрежные вызыватели бурь шепчут его имя, ведь один брошенный удар способен заставить целую долину звенеть, как ударенный колокол.
- id: handy-haversack
  flavor: >-
    Прочный холщовый рюкзак с широким центральным карманом и двумя боковыми, и все они глубже внутри, чем можно было бы подумать снаружи. Торговцы и странники любят, что нужная вещь всегда оказывается сверху, хотя несколько старых бывалых ворчат, что мешок хранит свои секреты.
- id: hat-of-disguise
  flavor: >-
    Коричневая фетровая шляпа с узкой лентой из плетеного шнура, такая вещь, какую странствующий актер может приподнять перед толпой, прежде чем примерить новое лицо. Сплетники речных городов говорят, что шляпа умеет сделать незнакомца похожим на кого угодно, кроме самого себя, и в этом-то и вся суть.
- id: headband-of-intellect
  flavor: >-
    Тонкая лента из бледного серебра с одним темным камнем, прохладная на ощупь и слабо гудящая, как стеклянный колокольчик. Ученые старых коллегий надевают их на экзамены, а некоторые утверждают, что металл имеет свое мнение о том, какие книги стоит читать.
