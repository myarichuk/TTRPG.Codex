- id: scarab-of-protection
  flavor: >-
    Вырезанный жрецом определённого толка, который боялся магии смерти и беспокойных мертвецов, этот медальон в форме жука охраняет носящего от тёмных искусств. Запасённая защита истончается с каждым поставленным оберегом, и в конце концов он рассыпается в бронзовую пыль.
- id: scimitar-of-speed
  flavor: >-
    Изогнутый клинок из синеватой стали с быстрой, яркой кромкой, выкованный кузнецами, которые хотели меча, его нельзя было обогнать. Его владелец находит дополнительную искру ритма, второй взмах, который приходит раньше, чем отзвенел первый.
- id: shield-of-missile-attraction
  flavor: >-
    Потрёпанный щит с нарисованной кривой мишенью отражает стрелы и болты с почти охотным упрямством. Тот, кто его берёт, скоро замечает, что стрелы, нацеленные в его друзей, сворачивают к нему. Сделка плохая, ведь проклятие держится крепко, пока очищающий обряд его не снимет.
- id: shield
  flavor: >-
    Простой щит — самая знакомая защита в любом арсенале, однако зачарованные щиты оправдывают себя тихой, растущей прочностью. Носящий ощущает спокойное, обнадёживающее присутствие на руке, а удары, которые могли бы выбить плечо, соскальзывают в сторону.
- id: slippers-of-spider-climbing
  flavor: >-
    Мягкие кожаные туфли, прошитые тонкой серой нитью, позволяют носящему ходить по стенам и потолкам так же легко, как по полу. Руки остаются свободны для снаряжения, фонаря или приветствия нервного стражника внизу. Скользкие поверхности одолевают магию, поэтому мокрая плитка всё равно заставит носящего заскользить.
- id: sovereign-glue
  flavor: >-
    Молочная паста во флаконе, выстланном скользким маслом, этот клей связывает две поверхности, которые поддаются лишь редчайшим растворителям. Застыв, он держит крепко, и детали остаются соединёнными навсегда. Мебельщики давно вожделеют банку, хотя цена никогда не бывает приятным сюрпризом.
- id: spell-scroll
  flavor: >-
    Лист пергамента, туго скрученный и запечатанный воском, несёт одно заклинание, написанное шифром, который распутает только опытный читатель. Когда слова произнесены, пергамент рассыпается в пыль, и магия расходуется.
- id: spellguard-shield
  flavor: >-
    Выкованный из тёмного блестящего сплава, этот щит предпочитают те, чьи противники сражаются словами и чарами. Его поверхность мерцает, когда в неё ударяет заклинание, а прицел колдуна дрожит, словно воздух превратился в сироп.
- id: sphere-of-annihilation
  flavor: >-
    Маленький чёрный шар из ничего висит в воздухе, словно дыра, проколотая в ткани бытия. Он пожирает всё, чего касается, оставляя после себя лишь тихую, слабо гудящую тишину. Мудрые хранители прячут его в тяжёлых свинцовых ящиках и никогда не позволяют ему блуждать у дверного проёма.
- id: staff-of-charming
  flavor: >-
    Бледный ясень с серебряным кольцом у навершия, этот посох создан торговцем, который считал обаяние искусством. Его владелец может склонить толпу к доброте, приказать пугливому зверю или прочесть незнакомый язык. Когда очарование направлено на носящего, посох может отразить его обратно к источнику.
- id: staff-of-fire
  flavor: >-
    Обугленное чёрное дерево, схваченное медными кольцами, этот посох выкован кузнецами, которые хотели создать нечто, способное согреть холодную комнату. Владелец может вызвать вспышку пламени, пылающую сферу или огненную стену. Однако при небрежном обращении посох может закончить свою жизнь облачком пепла.
- id: staff-of-frost
  flavor: >-
    Бледно-голубой кристалл проходит через этот посох, словно замёрзшие жилки, а дерево под ним настолько холодно, что покрывает инеем голую ладонь. Владелец может призвать густой туман, ледяной град, ледяную стену или конус жгучего холода. При неумелом обращении посох может растаять в лужицу воды.
- id: staff-of-healing
  flavor: >-
    Вырезанный из светлого дерева и обёрнутый чистым полотном, этот посох создан травниками, которые верили, что синяки должны быстро сходить. Владелец может призвать целительную магию, чтобы закрыть раны, излечить хворь или залечить сразу много ушибов. Небрежное обращение может заставить посох исчезнуть в яркой вспышке, потерянным навсегда.
- id: staff-of-power
  flavor: >-
    Обручи из кованого железа и тёмного кедра связывают этот высокий стержень, а в навершии сидит один янтарный камень, словно терпеливый глаз. Маги из глуши спорят о том, какой правитель его заказал, но все сходятся в том, что носящий становится выше. Владелец может призвать конусы инея или вспышки огня, однако янтарь тускнеет с каждым заклинанием.
- id: staff-of-striking
  flavor: >-
    Простой боевой посох из ясеня гудит при взмахе, словно дерево помнит давнюю войну. Каждый удар может быть усилен импульсом невидимой силы, который сотрясает кости и бьёт сильнее, чем позволило бы дерево. Стражи говорят, что рвущийся в бой посох должен отдыхать, иначе он обратится обратно в обычную древесину.
- id: staff-of-swarming-insects
  flavor: >-
    Вырезанный из зелено-чёрного дерева и усыпанный крошечными нефритовыми жуками, этот посох держит собственную жужжащую свиту. Импульс его магии выпускает облако безвредных летающих насекомых, которые густо висят в воздухе и застилают зрение всем, кто стоит снаружи. Сильный порыв ветра или внезапное пламя рассеивает рой.
- id: staff-of-the-magi
  flavor: >-
    Плотный чёрный дуб, перехваченный потускневшим серебром, этот посох словно поглотил тысячу малых чар. Заклинания, направленные на владельца, склонны распускаться о него, рассыпаясь искрами, которые питают волокна дерева. Учёные старых коллегий предупреждают, что так ненасытный посох может перенасытиться и стать опасным.
- id: staff-of-the-python
  flavor: >-
    Кусок пятнистого дерева с вырезанной головой змеи на одном конце, этот посох жаждет свернуться кольцами. Брошенный точно, он уползает обратно в живую мускулатуру, превращаясь в огромного удава, который подчиняется лишь безмолвной воле хозяина. Речной народ рассказывает о посохах, которые не желают лежать спокойно после смерти своего хозяина.
- id: staff-of-the-woodlands
  flavor: >-
    Гладкое берёзовое дерево с рукоятью, обмотанной корой, этот посох пахнет мхом после дождя и гудит, как улей, когда к нему прикасаются. Хранители леса говорят, что ветви на верхушке склоняются к владельцу, словно прислушиваясь. Посох может склонить деревья, зверей и корни к тихому сотрудничеству.
- id: staff-of-thunder-and-lightning
  flavor: >-
    Два шторма живут в этом боевом посохе, один яркий, другой громкий, и дерево дрожит, прежде чем разразиться любым из них. Молния может скакнуть вдоль удара, а раскат грома прокатиться и сотрясти всех, кто стоит слишком близко. Прибрежные вызыватели бурь держат его запечатанным в стекле, ведь он успокаивается лишь ненадолго после каждого использования.
- id: staff-of-withering
  flavor: >-
    Серый и потрескавшийся, словно мёртвая ветка, этот посох как будто высасывает цвет из листьев рядом с ним. Удар им может выпить тепло и силу цели, оставив конечности вялыми и тяжёлыми на некоторое время. Целители деревень на холмах не хотят прикасаться к нему, а большинство находящих оставляют его там, где он лежит.
- id: stone-of-controlling-earth-elementals
  flavor: >-
    Гладкий серо-коричневый камень, тёплый в ладони, словно добытый из глубокого пласта. Когда его прижимают к земле, он призывает исполинскую фигуру из камня и почвы, которая движется по слову своего владельца. Существо уходит обратно в землю, когда работа окончена, а камень молчит до утра.
- id: stone-of-good-luck-(luckstone)
  flavor: >-
    Отполированный агат размером с куриное яйцо, полосатый кремовым и ржавым, словно сумеречное небо. Азартные игроки и землемеры носят такой камень, и те, кто держит его рядом, говорят, что мир слегка склоняется к ним благосклонно.
- id: sun-blade
  flavor: >-
    Ничем не примечательная рукоять из простой латуни становится клинком света по зову владельца. Свет яркий и чистый, но беспокойные мертвецы находят его прикосновение испепеляющим. Те, кто носит его, говорят, что он тихо гудит, когда на поле боя занимается рассвет.
- id: sword-of-life-stealing
  flavor: >-
    Острый клинок из тёмной стали с красной нитью света вдоль желобка, словно он пьёт, когда режет. При идеальном ударе он вырывает жизнь из живого врага и окутывает владельца мимолётным теплом. Кузнецы речного народа говорят, что клинок никогда не насыщается, и не станут точить его при посторонних.
- id: sword-of-sharpness
  flavor: >-
    Этот яркий, жадный клинок, кажется, знает точное место, где камень уступает и где доспех расходится. Против предметов его кромка никогда не подводит, а идеальный удар оставляет врага утомлённым и медленным в восстановлении.
- id: sword-of-wounding
  flavor: >-
    Мрачный меч, чьи раны отказываются закрываться чисто, с кромкой, тёмной от синевато-фиолетового блеска. Пораженные им ощущают глубокий холод, который оседает внутри и остаётся, мешая им залечиваться некоторое время. Холод отступает лишь медленно, и жертва может стряхнуть его каждым упорным усилием.
- id: talisman-of-pure-good
  flavor: >-
    Диск светлого золота, отполированный тысячами осторожных рук, несёт простое солнце в рельефе. Порождения гнили и серы, касающиеся его, чувствуют, как их шкура обжигается чистым белым светом. Хранители говорят, что он отвечает только устойчивому сердцу и вспыхивает ярче в руках того, кто желает добра.
- id: talisman-of-the-sphere
  flavor: >-
    Тонкий талисман из чёрного железа, инкрустированный серебряными письменами на алфавите, который уже никто не читает. Носящий управляет маленькой голодной пустотой с необычайным спокойствием, словно это питомец на шёлковом поводке. Учёные клянутся, что пустота склоняется к мыслям владельца, хотя никто ещё не попросил её вежливо.
- id: talisman-of-ultimate-evil
  flavor: >-
    Жестокий медальон из холодной бронзы с лицом из клубящегося дыма олицетворяет злобу в чистейшем виде. Живые руки, которые сжимают его слишком долго, чувствуют, как из них уходит тепло. Носящие утверждают, что с каждым часом он становится тяжелее, и, возможно, это самое честное, что можно о нём сказать.
