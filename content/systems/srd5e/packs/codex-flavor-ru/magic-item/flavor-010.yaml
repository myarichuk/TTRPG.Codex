- id: tome-of-clear-thought
  flavor: >-
    На страницах его — схемы головоломок, игры на память и аккуратные столбцы логики, написанные ровными холодными синими чернилами. Тот, кто внимательно изучает его долгое время, обнаруживает, что мышление обостряется, а ум вдруг становится упорядоченным, как библиотека. Когда урок усвоен, книга умолкает и тускнеет, а её чернила спят поколениями.
- id: tome-of-leadership-and-influence
  flavor: >-
    Переплетённый кремовой кожей с позолоченными углами, этот том читается как длинное письмо остроумного государственного мужа. Его страницы о речи, осанке и рукопожатиях делают голос читающего слышнее, а приветствие — теплее. Придворные писари старых городов хранят копии под замком, чтобы каждый мелкий лорд не узнал этот приём.
- id: tome-of-understanding
  flavor: >-
    Тонкий том из голубино-серой ткани, поля которого тесно заполнены набросками рук, глаз и тихих лиц. Читатели, одолевающие его упражнения, начинают замечать дрожь в голосе и ложь за ухмылкой. Старые отшельники, написавшие его, говорят, что мудрость — это лишь терпеливое внимание, а книга просто настаивает на практике.
- id: trident-of-fish-command
  flavor: >-
    Вилка из посеребрённой бронзы с тремя зубцами, которые ловят свет, словно рыбья чешуя, а древко стёрто солью до гладкости. Тот, кто её несёт, может склонить плавающее существо на свою сторону одной твёрдой мыслью. Рыбаки серых берегов шепчут, что однажды она призывала целые косяки к сетям.
- id: universal-solvent
  flavor: >-
    Тонкая стеклянная трубка с молочной, резко пахнущей жидкостью, запечатанная воском, который так и не высыхает до конца. Капля её разрушает самый упрямый клей, даже тот, которым скрепляют запретные письма. Торговцы портовых рынков клянутся, что трубка никогда не пустеет, хотя никогда не спрашивают, кто её наполняет.
- id: vicious-weapon
  flavor: >-
    Простой клинок или древко, заточенные сверх меры, кромка которых всегда кажется чуть голоднее руки, его держащей. Каждый удар несёт волну злобы, которая едет вместе с ударом и входит глубже, чем следовало бы.
- id: vorpal-sword
  flavor: >-
    Яркий клинок из бледной стали, который слабо гудит при взмахе, его баланс так совершенен, что кажется, будто меч сам выбирает цель. Дуэлянты говорят о нём вполголоса, ведь один точно рассчитанный удар может окончить бой, который никакое мастерство не выиграло бы.
- id: wand-of-binding
  flavor: >-
    Тонкая палочка из бледного ясеня с потускневшим железным наконечником, поверхность её покрыта витками узловатой верёвки. Один взмах запястьем может пригвоздить зверя или человека к месту, оставив их застывшими и смотрящими в пустоту. Тюремщики держат свои на крючках у двери, ведь неподвижность может быть жестокой, а не только милосердной.
- id: wand-of-enemy-detection
  flavor: >-
    Тонкий прут из бледного ясеня дёргается в сторону опасности прежде, чем её заметит кто-либо другой. Деревенские чародеи говорят, что он слабо гудит, когда приближается скрытый враг, и это гудение спасло не одного путника в камышах. Он смолкает в тот же миг, как другая рука берёт его.
- id: wand-of-fear
  flavor: >-
    Бледно-костяная палочка, перевитая шнуром цвета старой ржавчины, некогда принадлежавшая строгому наставнику, который доверял крику больше, чем фехтованию. Короткое резкое слово с её кончика может заставить врага бежать или опуститься на колени. Старые солдаты называют её палочкой задиры, и они не совсем неправы.
- id: wand-of-fireballs
  flavor: >-
    Почерневшая дубовая палочка с наконечником из дымчатого стекла, тёплая на ощупь даже зимой. Владелец может вызвать из неё яркую вспышку пламени, а при небольшом дополнительном усилии взрыв становится яростнее, как ревёт разожжённая печь, когда в неё подбрасывают уголь. Старые коллегии клянутся, что она капризничает, когда почти исчерпана.
- id: wand-of-lightning-bolts
  flavor: >-
    Отрезок пепельно-серого дерева, перехваченный медными кольцами, которые слабо гудят при прикосновении. С его кончика срываются потрескивающие синие искры и разветвляются в воздухе зазубренной линией, обжигая всё, что стоит на пути. Докеры клянутся, что однажды одна такая палочка расколола мачту корабля во время бури.
- id: wand-of-magic-detection
  flavor: >-
    Простая ивовая палочка со спиралью серебряной проволоки, обвивающей древко, достаточно мала, чтобы спрятать её в рукав. Её владелец может вытянуть слабое мерцание, которое показывает, где рядом лежат зачарованные предметы и остаточные заклинания, словно лампа, видимая сквозь матовое стекло. Ученики старых школ часто носят такую как первый инструмент.
- id: wand-of-magic-missiles
  flavor: >-
    Тонкий отрезок сине-чёрного дерева с крошечными кристаллами вдоль древка, каждый из которых блестит, как пойманная звезда. Из кончика вылетают стрелы чистой силы, которые почти никогда не промахиваются, а смелая рука может выпустить сразу несколько. Странствующие торговцы клянутся, что стрелы всегда находят цель.
- id: wand-of-paralysis
  flavor: >-
    Тонкая серебряная палочка со слегка синеватым кончиком, будто она хранит осколок зимнего неба. Тонкий холодный луч устремляется от неё к одному существу в поле зрения, и конечности жертвы деревенеют, словно иней пополз в каждый сустав. Упрямая воля иногда стряхивает этот холод.
- id: wand-of-polymorph
  flavor: >-
    Длинная палочка из слоновой кости с зелёными прожилками, поверхность её покрыта резными завитками, которые, кажется, меняются, когда никто не смотрит. Её владелец может выпустить вспышку перемены, которая превращает одно существо во что-то иное, и исход всегда — азартная игра. Архивариусы говорят, что у палочки есть чувство юмора, и юмор этот редко добрый.
- id: wand-of-secrets
  flavor: >-
    Тонкая лещиновая палочка с загнутым кончиком, её волокна стёрты гладкими от множества тревожных пальцев. Направленная на комнату, она дёргается к скрытой двери или шаткому камню, о которых никто не подумал проверить. Взломщики, архивариусы и расхитители гробниц все хотели такую, по причинам, которые не нуждаются в объяснении.
- id: wand-of-the-war-mage
  flavor: >-
    Простая ясеневая палочка с железным ободом у рукояти, такой инструмент полевой маг держит под рукой в стычке. Зарубки по её длине отмечают старые битвы, и каждая словно укрепляет руку, которая её держит. Чем лучше палочка, тем точнее выстрел.
- id: wand-of-web
  flavor: >-
    Бледная серая палочка с тонкой шёлковой нитью, намотанной у кончика, и она всегда слегка липкая на ощупь. Владелец может выпустить брызги липких нитей, которые накидываются на цель и удерживают её на месте. Пауки позавидовали бы, а старые охотники знают, что к такой палочке лучше не прикасаться.
- id: wand-of-wonder
  flavor: >-
    Кривая палочка из разномастных пород дерева, поверхность которой покрыта пятнами краски всех цветов. Что бы ни случилось, когда её направят, исход удивляет всех, включая держащего. Барды утверждают, что её создатель всё время смеялся, и никто этого не опроверг.
- id: weapon-of-warning
  flavor: >-
    Простое солдатское оружие из честной стали, рукоять обмотана шнуром, а на навершии привязан маленький медный колокольчик. Лагерные часовые клянутся, что он будит спящих товарищей в миг, когда вынимают клинки, и что его владельцы почему-то всегда бьют первыми.
- id: weapon
  flavor: >-
    Честный клинок обычной работы, по кромке которого проходит слабый серебристый блеск, которого не давал ни один точильный камень. Кузнецы, которые куют такое оружие, говорят о тихой гордости за металл, словно он точно знает, куда ему предназначено ударить.
- id: well-of-many-worlds
  flavor: >-
    Тонкая чёрная ткань, мягкая как шёлк и сложенная так мало, что её можно спрятать в карман. Разложенная на плоской поверхности, она раскрывается в кольцевое окно в какой-то иной мир, а куда ведёт это окно, никто не знает. Тот, кто снова её сложит, обычно видел то, что стоит забыть.
- id: wind-fan
  flavor: >-
    Расписной шёлковый веер с бамбуковыми рёбрами, складки которого украшены бледными облаками и летящими птицами. Взмахнув им коротким движением запястья, вы поднимаете внезапный порыв, способный опрокинуть свечу или унести шляпу. Веера такого рода имеют привычку рваться в самый неподходящий момент.
- id: winged-boots
  flavor: >-
    Гибкие коричневые кожаные сапоги с выцветшей золотой строчкой, потёртые на пятке от целой жизни поспешных поручений. Стоит их зашнуровать, как шаг носящего становится легче, словно воздух протянул помощную руку. Те, кто их носил, описывают головокружительный подъём и странное нежелание возвращаться вниз.
- id: wings-of-flying
  flavor: >-
    Тяжёлый дорожный плащ из тёмно-зелёной шерсти, застёжка которого выполнена в виде серебряной птицы в полёте. По выверенному жесту ткань раскрывается и поднимается, разворачиваясь в пару широких пернатых крыльев, которые уносят носящего ввысь. Перья тают со вздохом, когда полёт окончен.
