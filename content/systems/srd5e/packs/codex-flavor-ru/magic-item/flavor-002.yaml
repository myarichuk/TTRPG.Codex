- id: brooch-of-shielding
  flavor: >-
    Овальная серебряная брошь с тусклым серым камнем, который, кажется, пьет свет. Владельцы описывают, как их обволакивает легкая тишина, будто воздух сгустился в невидимое стекло. Ученые старых коллегий говорят, что ее сделали, чтобы отражать тупые удары и некоторые шальные искры волшбы.
- id: broom-of-flying
  flavor: >-
    Простая метла из светлого ясеня ведет себя как любой инструмент для уборки, пока кто-нибудь не сядет на нее верхом и не пожелает взлететь. Речной люд рассказывает о метлах, которые сбрасывали хозяев и летели домой, к кухонной двери, с видом слегка обиженным. Ее черенок тихо гудит, когда метлу отправляют за чем-нибудь поблизости.
- id: candle-of-invocation
  flavor: >-
    Высокая сальная свеча, воск которой испещрен золотом и пеплом, освещает комнату и обостряет ум всех, кто оказался в ее свете. Смотрители фонарей старых коллегий говорят, что горящая свеча придает ясности и молитвам, и быстрому учению. Некоторые зажигают ее лишь однажды, и тогда вместо теплого сияния она открывает дверь в далекий мир.
- id: cape-of-the-mountebank
  flavor: >-
    Темный плащ, который слабо пахнет серой и старыми монетами, любят странствующие артисты, что исчезают прямо посреди выступления. Его владелец может перенестись с одного места на другое в мгновение ока, а там, где он стоял, остается завиток серого дыма. Деревенские колдуны предупреждают, что ткань помнит каждый трюк, который когда-либо помогала спрятать.
- id: carpet-of-flying
  flavor: >-
    Тканый ковер выцветших багряных и золотых тонов, с кистями, которые тянутся, как хвосты терпеливых кошек. Как только прозвучит команда и ковер примет пассажира, он плавно поднимется и будет следовать указаниям того, кто на нем сидит. Купцы из речных городов ценят старые ковры за то, что с их помощью можно пересекать широкие долины, не тратя время на дороги.
- id: censer-of-controlling-air-elementals
  flavor: >-
    Медная кадильница с крышкой из витой проволоки, сквозь которую вьются тонкие нити благовоний в узорах, какие не создал бы ни один ветер. Когда ее мягко раскачивают, дым собирается в фигуру из воздуха, которая говорит мягким свистом и принимает приказы призвавшего. Жрецы определенного склада ума не любят ее, однако и сами любопытствуют.
- id: chime-of-opening
  flavor: >-
    Тонкая полая трубка из металла, которая звенит чистым, ярким тоном, стоит ее ударить, — такого звука, которого, кажется, боятся замки и засовы. Бродячие воры и ловкие слесари рассказывают истории о том, как ее песня разносится по целой долине. После достаточного числа ударов трубка трескается и оставляет лишь молчаливую, вмятую оболочку.
- id: circlet-of-blasting
  flavor: >-
    Узкий обруч из потемневшей бронзы с одним красным гранатом на лбу, такая вещь, какую может надеть напоказ чародей на пиру. Камень мерцает, когда искра огня готова сорваться с места. Многие научились держать свой нрав в узде рядом с тем, кто его носит.
- id: cloak-of-arachnida
  flavor: >-
    Тонкое черное одеяние, сотканное с серебряными нитями, которые блестят, словно роса на паутине. Говорят, первую нить соткали пауки высоких лесов, и плащ до сих пор движется с терпеливой, цепкой грацией. Его владелец ходит по стенам и ползает по потолкам, а липкие ловушки словно расступаются перед ним, как занавеси.
- id: cloak-of-displacement
  flavor: >-
    Переливчатый плащ глубокого синего цвета, который, кажется, меняет оттенки всякий раз, когда меняется свет. Те, кто его носит, описывают второе «я», стоящее в шаге в сторону, призрачного двойника, который принимает на себя удары, предназначенные владельцу. Одеяние становится неподвижным и обычным, как только его владелец получает рану.
- id: cloak-of-elvenkind
  flavor: >-
    Плащ приглушенного зеленовато-серого цвета, сотканный так мягко, что заглушает каждый шаг и притупляет блеск внимательного глаза. Лесные стражи, которым важен тихий подход, часто передают такие плащи по наследству. Тот, кто его носит, проскальзывает мимо острого слуха и зорких глаз, будто тени приходятся ему родней.
- id: cloak-of-protection
  flavor: >-
    Тяжелый плащ из сливово-темной шерсти, подол которого расшит простой полосой серебряных узлов. Стражи пограничных городков носят такие в долгих ночных дозорах, полагаясь на то, что ткань отведет шальной удар и успокоит разум при внезапном испуге. Старые няньки говорят, что узлы завязывают в каждый шаг немного удачи.
- id: cloak-of-the-bat
  flavor: >-
    Сумеречный плащ с выемчатым подолом, в котором, кажется, таится немного ночи. В сумраке и тени владелец может ухватиться за края и скользить на кожистых крыльях из ткани. Некоторые из носивших складываются в маленькую крылатую фигурку и, сохраняя ум и обаяние, порхают вокруг.
- id: cloak-of-the-manta-ray
  flavor: >-
    Мягкий плащ с пятнистым синим и бледным серебристым узором, края которого расходятся веером, как крылья парящего морского существа. Ныряльщики, которые его носят, дышат в глубокой воде так же легко, как на открытом воздухе. Прибрежные рыбаки уверяют, что ткань до сих пор слабо пахнет солью и морской капустой.
- id: crystal-ball-of-mind-reading
  flavor: >-
    Безупречная хрустальная сфера, прохладная на ощупь, которая хранит слабые отражения далеких комнат. Смотрящий может заглянуть в далекое место, а затем услышать мысли тех, кто стоит рядом с линзой. Ученые старых коллегий предупреждают, что такое проникновение оставляет разум открытым для вреда, который он может причинить себе сам.
- id: crystal-ball-of-telepathy
  flavor: >-
    Гладкая стеклянная сфера в бронзовой оправе, поверхность которой изнутри слегка затуманена. Через нее пользователь может говорить с умами, которых видит издалека, и подтолкнуть одного из них к выбору. Те, кто пользуется ею часто, становятся осторожны в словах, ведь стекло хранит слабую память о каждом шепоте.
- id: crystal-ball-of-true-seeing
  flavor: >-
    Бледная хрустальная сфера с мутноватым сердцем, которое проясняется, стоит ее коснуться твердой рукой. Глядя сквозь нее, провидец видит истинные обличья даже там, где иллюзии и тени притворяются иначе. Ее зрение достигает лишь определенного предела, но в пределах этого круга ничто скрытое долго не остается спрятанным.
- id: crystal-ball
  flavor: >-
    Простой хрустальный шар с тонким серебряным ободком, из тех семейных реликвий, что стоят на каминной полке и ждут, когда кто-нибудь попросит на них взглянуть. Заглядывая в его глубину, можно увидеть далекие комнаты и лица, хотя картина никогда не бывает совсем устойчивой. Мистики из речных городков рассказывают истории о том, как видели любимого человека сквозь пелену тумана.
- id: cube-of-force
  flavor: >-
    Маленький кубик не больше кончика пальца, каждая грань которого испещрена своим знаком темно-красными чернилами. Нажатие на грань высвобождает короткий всплеск защитной магии: небольшой заслон, прочное убежище или стену бледного света, которая не поддается ни одному удару. Изобретатели называют его самой упрямой игрушкой, какую когда-либо создавали.
- id: cubic-gate
  flavor: >-
    Куб из тусклого серого металла с шестью гранями, каждая из которых отмечена своим символом и гудит беспокойной силой. Нажатие на грань открывает проход в мир, на который она указывает, а двойное нажатие переносит рядом стоящих спутников. Мудрые пользователи держат запасной заряд под рукой, ведь по ту сторону редко бывает аккуратно.
- id: dagger-of-venom
  flavor: >-
    Тонкий клинок с зеленовато-черным блеском, заточку которого ведет терпеливый алхимик, никогда не желавший благодарности. Яд, который он несет, липнет к стали, как речной туман, а рана, которую он оставляет, долго не заживает после боя.
- id: dancing-sword
  flavor: >-
    Длинный клинок, который не желает оставаться в руке и предпочитает парить над площадкой для поединков, сам выбирая себе цели. Кузнецы одной упрямой школы утверждают, что он перенял этот трюк у стаи испуганных цапель.
- id: decanter-of-endless-water
  flavor: >-
    Приземистая фляга с пробкой, которая убедительно плещется даже пустой, — такой шутки любят повторять деревенские колдуны. Вытяните пробку, и из нее хлынет свежая или соленая вода: от вежливого всплеска до бурного потока, который сбивает с ног все, что стоит на пути.
- id: deck-of-illusions
  flavor: >-
    Потертая шкатулка с раскрашенными картами, большинство из которых изображают чудовищ, а пара отражает лицо того, кто осмелился взглянуть. Если перетасовать карты как следует и бросить их на землю, каждая призывает призрачное чудовище, которое притворяется опасным, хотя укусить никого не может.
- id: defender
  flavor: >-
    Простое, честное оружие ближнего боя любого вида, однако чувство юмора мастера проявляется в скрытом приеме. Владелец может перевести силу из клинка в более прочный щит, обменяв силу удара на устойчивую стойку, когда бой становится тяжелым.
- id: demon-armor
  flavor: >-
    Доспех из черного железа, покрытый гравировкой с ухмыляющимися лицами, его когтистые латные рукавицы жаждут схватки. Тот, кто его надевает, осваивает язык глубоких бездн, но ремни никогда до конца не отпускают, и демоны проявляют к владельцу кислый интерес.
- id: dimensional-shackles
  flavor: >-
    Тяжелые железные оковы, которые ослабевают или затягиваются под того, кто в них закован, и обычно надевают их на тех, кто уже слишком оглушен, чтобы сопротивляться. Мастера побега старых коллегий говорят, что единственный надежный ключ хранится у того, кто их защелкнул, а упрямый пленник все равно может попытаться вырваться.
- id: dragon-orb
  flavor: >-
    Хрустальный шар, внутри которого клубится туман, а в стекло вложена древняя злоба дракона. Тот, кто смотрит в него слишком долго, обнаруживает, что сфера захватывает его волю, нашептывая мрачные советы и предлагая мелкие милости, а дым поднимается в форме крыльев.
- id: dragon-scale-mail
  flavor: >-
    Перекрывающие друг друга чешуйки, вырезанные из шкуры одного дракона, каждая отполирована до блеска цветного стекла. Иногда дракон дарит сброшенную чешую, а иногда терпеливый охотник сохраняет шкуру павшего зверя, но в любом случае доспех ценится выше золота теми, кто его носит.
- id: dragon-slayer
  flavor: >-
    Простой, хорошо сбалансированный клинок, лезвие которого, кажется, гудит, когда приближается чешуйчатое чудовище. Старые охотники клянутся, что сталь помнит каждого змея, которого она когда-либо пронзила, и держат ее смазанной к следующему, кто перейдет им дорогу.
