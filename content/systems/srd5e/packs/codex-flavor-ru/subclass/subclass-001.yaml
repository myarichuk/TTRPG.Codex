- id: champion
  name: 'Чемпион'
  flavor: >-
    Чемпионы считают арену и поле боя одним и тем же испытательным полигоном. Их удары обладают остротой, о которой ветераны турниров говорят вполголоса, а тела, кажется, стряхивают раны, что свалили бы менее стойких воинов. Там, где другие видят толпу, Чемпион видит корону, ждущую победителя.
- id: circle-of-the-land
  name: 'Круг Земли'
  flavor: >-
    Круги этого рода проводят обряды под открытым небом, где стоячие камни и старые деревья отмечают священную землю. Каждый хранитель изучает нрав одного типа местности — сухих пустошей, ледяных просторов, умеренных лесов или влажных тропических чащ — и заимствует немного характера этой земли. Деревенские старейшины часто просят у них совета о порче, непогоде и правильном времени для посева.
- id: college-of-lore
  name: 'Коллегия знаний'
  flavor: >-
    Учёные старых коллегий считают, что хорошая история стоит больше меча, хотя редко говорят это владельцу меча. Члены коллегии собирают факты так же, как сороки собирают блестящее: из пыльных фолиантов, полузабытых обрядов и бабушкиных сказок. Они также любят пронзать пустую важность лордов, ведь вовремя брошенная шутка свергает тирана не хуже любого довода.
- id: draconic-sorcery
  name: 'Драконья магия'
  flavor: >-
    Некоторые дары приходят вслед за драконом: случайный клочок древней силы, завещанный умирающим змеем или впитанный из сокровищницы, так и не остывшей до конца. Кровь этих чародеев несёт слабое металлическое тепло, а кожа приобретает блеск твёрдой чешуи. Объяснить перемену могут происхождение, слухи или просто невезение.
- id: evoker
  name: 'Эвокатор'
  flavor: >-
    Эвокаторы изучают громкие искусства — те, что приносят злой мороз, палящее пламя, раскаты грома и кислоту, разъедающую железо. Некоторые становятся осадной артиллерией в армиях сильных мира сего и обрушивают разруху на поле, прежде чем враг успеет сблизиться. Другие выбирают сторону тише: охраняют деревни от налётчиков или просто берут плату с того, кто предложит больше, за свои бури.
- id: fiend-patron
  name: 'Покровитель-исчадие'
  flavor: >-
    Сделка с чем-то из глубин всегда идёт с долговой книгой, и существо по ту сторону ведёт свои счета кровью. Такие покровители одалживают силу, расположение и немного украденной удачи, но их цели клонятся к разрушению, и колдун должен решить, как далеко следовать за ними. Многие обнаруживают, что цена выплачивается мелкими уступками задолго до последнего расчёта.
- id: hunter
  name: 'Охотник'
  flavor: >-
    Охотники бродят по краю обжитых земель, выслеживая всё, что угрожает фермам и лесам за последней оградой. Они изучают слабые места добычи, пристально наблюдая за ней, и читают недуги зверя так же легко, как фермер читает небо. Их ремесло защищает и дикие места, и людей, живущих рядом.
- id: life-domain
  name: 'Домен Жизни'
  flavor: >-
    Целители, служащие искусству врачевания, считают каждую рану маленьким спором со смертью и обычно побеждают. Когда они работают, их руки согреваются ровным сиянием, а больные потом часто говорят, что в комнате пахнет дождём на свежей траве. Фермерские городки, ложа больных и поля сражений знают их труд, и мало кто спрашивает, откуда взялся дар.
- id: oath-of-devotion
  name: 'Клятва преданности'
  flavor: >-
    Рыцари, принимающие этот обет, считают слово столь же нерушимым, как сталь, а нарушенное обещание — худшим из преступлений. Многие носят на щитах эмблемы с крыльями — кивок существам света, о которых говорят, что они присматривают за честным людом. Иные суровы до крайности, но в королевстве спится спокойнее, пока они несут стражу.
- id: path-of-the-berserker
  name: 'Путь берсерка'
  flavor: >-
    Берсерки позволяют красному приливу нести себя. Ярость поднимает их в бурю ударов, а неистовство боя они принимают как возвращение домой, а не как ужас. Друзьям порой трудно позвать их назад, когда схватка окончена, а враги быстро узнают, что берсерк не ведает страха в гуще битвы.
- id: thief
  name: 'Вор'
  flavor: >-
    В каждой разрушенной башне найдутся запертый сундук и пара историй, которые никто не хочет рассказывать, и вор пришёл за обоими. Ловкие пальцы вскрывают замки и карманы одинаково легко, а лёгкий шаг несёт по отвесным стенам и через крыши. Таких людей трудно удержать надолго, а магические безделушки, которые они выуживают, часто оказываются на людном столе.
- id: warrior-of-the-open-hand
  name: 'Воин открытой ладони'
  flavor: >-
    Монахи этой школы сражаются без оружия и считают собственное тело лучшим из своих орудий. Они могут отбросить разъярённого здоровяка через весь двор, сбить соперника с равновесия или затянуть собственные раны импульсом внутренней силы. Их неподвижность известна, а дисциплина, как говорят, делает самый твёрдый камень мягким.
