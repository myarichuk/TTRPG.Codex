- id: homebrew-cursed-doorway
  name: 'Проклятый дверной проём'
  description: 'Каменная арка, покрытая резным узором из глаз. Она тихо гудит, и всякий, кто проходит под ней, не сказав нужного слова, чувствует на себе взгляд с другой стороны.'
  properties:
    trigger: 'Существо проходит под аркой, не произнеся вслух её слово.'
    duration: 'Мгновенно'
    detect:
    - id: arch
      name: 'Узор'
      action: 'Изучение'
      check: Arcana
      dc: 15
      text: 'Осмотр арки выявляет проклятие в резьбе.'
    disarm:
    - id: unravel
      name: 'Распутать проклятие'
      action: 'Действие'
      check: Arcana
      dc: 17
      after: arch
    effect: 'Существо совершает спасбросок. При провале оно получает урон и до следующего рассвета остаётся испуганным из-за арки; при успехе получает половину урона и не пугается.'
    reset: 'Проклятие снова вступает в силу на следующем рассвете.'
    methods:
    - name: 'Произнести слово'
      check: History
      dc: 15
      text: 'Тот, кто изучил народ, построивший арку, может вычислить слово, или же его можно найти где-то ещё в руинах. После этого арка безвредна.'
    - name: 'Рассеять проклятие'
      check: Spellcasting
      dc: 17
      text: 'Заклинание, прекращающее магию, брошенное на арку, навсегда снимает проклятие.'

- id: homebrew-flooding-room
  name: 'Затопляемая комната'
  description: 'Комната с одной дверью, запертой снаружи, и полом из железных решёток. Когда дверь закрывается, из стен начинает хлестать вода.'
  properties:
    trigger: 'Дверь захлопывается: от веса на напольной плите или от рычага с другой стороны.'
    duration: 'Пока комната не наполнится или шлюзы не будут заклинены'
    detect:
    - id: plate
      name: 'Напольная плита'
      action: 'Изучение'
      check: Investigation
      dc: 15
      text: 'Осмотр комнаты выявляет плиту, рычаг и шлюзы.'
    disarm:
    - id: jam
      name: 'Заклинить плиту'
      action: 'Действие'
      check: Thieves' Tools
      dc: 15
      after: plate
    effect: 'Первый напор воды сбивает существ с ног. Каждое существо в комнате совершает спасбросок: при провале оно получает урон, при успехе — половину урона. После этого комната действует в свой собственный ход (см. порядок действий), пока не наполнится или шлюзы не будут заклинены.'
    reset: 'Вода уходит через решётки за час, и дверь снова поднимается. Рычаг снаружи взводит ловушку заново.'
    routine:
    - name: 'Вода поднимается'
      description: 'Вода поднимается на один фут. На уровне груди движение стоит вдвое больше. Когда вода поднимается выше головы существа, оно плывёт или задыхается по обычным правилам.'
    - name: 'Всплеск'
      description: 'Каждый третий раунд волна швыряет всё в комнате к стенам. Каждое существо снова совершает спасбросок: при провале оно получает половину урона, при успехе не получает урона.'
    methods:
    - name: 'Заклинить шлюзы'
      check: Thieves' Tools
      dc: 15
      text: 'Добраться до шлюза под водой — одно действие и одна проверка. Каждый заклиненный шлюз из четырёх останавливает пятую часть воды.'
    - name: 'Выломать дверь'
      check: Strength
      dc: 20
      text: 'Дверь железная и тяжёлая. Помогать могут несколько существ, каждое с одной проверкой.'
