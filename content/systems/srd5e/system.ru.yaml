sheetRules:
  bonusesLabel: Бонусы предыстории
  increasesLabel: Повышения характеристик
  listDescriptions:
    cantrips: Известные заговоры. Только заговоры вашего класса, не больше числа из таблицы класса.
    spells: Заклинания 1-го уровня и выше. Только из списка вашего класса, не выше вашей самой высокой ячейки, не больше числа подготовленных заклинаний.
    grantedSpells: Заклинания, которые умение даёт вам вне списка класса (заклинания подкласса, Одарённый магией, наследие вида, Таинственный арканум). Они не входят в число подготовленных.
    feats: Общие черты и дары эпических героев, полученные от умений класса. Черты происхождения даёт предыстория; у боевых стилей свой список.
    fightingStyles: Черты боевого стиля от умений класса, например «Боевой стиль» воина и «Дополнительный боевой стиль» чемпиона.
    extraOriginFeats: Черта происхождения сверх черты предыстории, например та, что даёт человеку «Универсальность».
  messages:
    "this choice is not allowed by the rules.": это не разрешено правилами.
