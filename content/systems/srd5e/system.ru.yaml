name: Пятая редакция SRD (5.2.1)
compatibility: Совместимо с 5E
description: >-
  Редакция 2024 года правил пятой редакции в том виде, как они опубликованы в Системном справочном
  документе 5.2.1: двенадцать классов по одному подклассу, девять видов, четыре предыстории,
  семнадцать черт, 339 заклинаний и 340 существ.

