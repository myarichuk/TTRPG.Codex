sheetRules:
  bonusesLabel: בונוסים מהרקע
  increasesLabel: העלאות ציוני תכונות
  listDescriptions:
    cantrips: לחשונים ידועים. רק הלחשונים של המקצוע שלך, עד המספר שבטבלת המקצוע.
    spells: לחשים מדרגה 1 ומעלה. רק מהרשימה של המקצוע שלך, לא גבוהים מתא הלחשים הגבוה ביותר שלך, עד מספר הלחשים המוכנים.
    grantedSpells: לחשים שיכולת מעניקה לך מחוץ לרשימת המקצוע (לחשי תת-מקצוע, חניך קסם, שושלת גזע, ארקנום מסתורי). הם אינם נספרים בלחשים המוכנים שלך.
    feats: כשרונות כלליים וכשרוני מתנה אפית שמתקבלים מיכולות מקצוע. כשרוני מוצא מגיעים מהרקע; לסגנונות לחימה יש רשימה משלהם.
    fightingStyles: כשרוני סגנון לחימה מיכולות מקצוע, כמו סגנון הלחימה של הלוחם וסגנון הלחימה הנוסף של האלוף.
    extraOriginFeats: כשרון מוצא מעבר לזה של הרקע שלך, כמו זה שמעניקה התכונה "רב-גוניות" של בן אנוש.
