name: מהדורה חמישית SRD‏ (5.2.1)
compatibility: תואם 5E
description: >-
  מהדורת 2024 של חוקי המהדורה החמישית כפי שפורסמה במסמך ההתייחסות למערכת 5.2.1:
  שנים-עשר מקצועות עם תת-מקצוע אחד לכל אחד, תשעה מינים, ארבע רקעים, שבע-עשרה תכונות מיוחדות,
  339 לחשים ו-340 יצורים.

