name: Website

# Builds the site in site/ and, on main, publishes it to GitHub Pages. Pull requests only build and check it.
# One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/Codex.Localization/Resources/**'          # the site quotes the app's own button names
      - 'src/Codex.Web/Components/Layout/LucideIcon.razor'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/Codex.Localization/Resources/**'
      - 'src/Codex.Web/Components/Layout/LucideIcon.razor'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci --omit=dev

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build
        working-directory: site
        env:
          # The address the site is served from, so canonical links, the sitemap and social previews are right.
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node build.mjs

      - name: Check links, anchors and markup
        working-directory: site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node tools/check.mjs

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
