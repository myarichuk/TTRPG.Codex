name: Release

# On demand (Actions > Release > Run workflow), or by pushing a v*.*.* tag.
# Each platform is built and smoke-tested on its own runner by packaging/package.sh or
# packaging/package.ps1, so a local build and a CI build are the same thing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.4.0). Leave empty to let GitVersion pick it.'
        required: false
        default: ''
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false
      draft:
        description: 'Create as a draft (publish it by hand later)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        if: inputs.version == ''
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine version with GitVersion
        if: inputs.version == ''
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      - name: Pick the version
        id: pick
        env:
          REQUESTED: ${{ inputs.version }}
          COMPUTED: ${{ steps.gitversion.outputs.semVer }}
        run: |
          version="${REQUESTED:-$COMPUTED}"
          version="${version#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semantic version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version" >> "$GITHUB_STEP_SUMMARY"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: win-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: packaging/package.sh "${{ matrix.rid }}" "$VERSION" dist

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/package.ps1 -Rid "${{ matrix.rid }}" -Version "$env:VERSION" -Out dist

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        run: packaging/smoke-test.sh "dist/${{ matrix.rid }}/app"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/smoke-test.ps1 -App "dist/${{ matrix.rid }}/app"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.pkg
            dist/*-setup.exe

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: TTRPG.Codex ${{ needs.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          prerelease: ${{ (github.event_name == 'workflow_dispatch' && inputs.prerelease) || contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          body: |
            ## Install

            | Platform | Installer | Portable |
            | --- | --- | --- |
            | Windows (x64) | `TTRPG.Codex-${{ needs.version.outputs.version }}-win-x64-setup.exe` | `.zip`, run `TTRPG.Codex.cmd` |
            | macOS (Apple silicon) | `.pkg`, installs to Applications | `.tar.gz`, run `ttrpg-codex` |
            | Linux (x64) | `.deb`, then run `ttrpg-codex` | `.tar.gz`, run `ttrpg-codex` |

            Each package carries its own .NET runtime: nothing else to install. The app opens at
            http://localhost:5080; set `CODEX_URL=http://0.0.0.0:5080` before starting it to let players on
            your network join. Campaign data is kept in your user folder (`%LOCALAPPDATA%\TTRPG.Codex`,
            `~/Library/Application Support/TTRPG.Codex` or `~/.local/share/ttrpg-codex`), so upgrades keep it.

            The packages are not code-signed yet: Windows SmartScreen and macOS Gatekeeper will ask
            before running them (on macOS, right-click the .pkg and choose Open).
          files: |
            dist/*
