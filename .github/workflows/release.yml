name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.5.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.5.0

      # B10: PublishTrimmed broke reflection-based plugin loading, YamlDotNet, DynamicExpresso,
      # and RavenDB, and the plugins/ folder was never part of the publish output at all, so a
      # release build shipped with zero game systems even before trimming got a chance to break
      # anything. Trimming is dropped, and each RID's plugins/ folder is populated below.
      - name: Publish Linux (x64)
        run: dotnet publish src/Codex.Web/Codex.Web.csproj -c Release -r linux-x64 -o dist/linux -p:PublishSingleFile=true -p:SelfContained=true -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Publish Windows (x64)
        run: dotnet publish src/Codex.Web/Codex.Web.csproj -c Release -r win-x64 -o dist/win -p:PublishSingleFile=true -p:SelfContained=true -p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Publish macOS (arm64)
        run: dotnet publish src/Codex.Web/Codex.Web.csproj -c Release -r osx-arm64 -o dist/macos -p:PublishSingleFile=true -p:SelfContained=true -p:Version=${{ steps.gitversion.outputs.semVer }}

      # Packs are generated, not checked in - a fresh clone has no packs/ directory,
      # so regenerate both from source (stdlib-only, needs network) before packaging.
      - name: Generate content packs
        run: |
          python3 scripts/import_srd51.py --no-install
          python3 scripts/import_pf2e.py --no-install

      - name: Build plugins
        run: |
          dotnet build src/Codex.Systems.DnD5e/Codex.Systems.DnD5e.csproj -c Release -o build/plugins
          dotnet build src/Codex.Systems.Pf2e/Codex.Systems.Pf2e.csproj -c Release -o build/plugins

      - name: Populate plugins/ next to each published app
        run: |
          for platform in linux win macos; do
            mkdir -p dist/$platform/plugins
            cp build/plugins/Codex.Systems.DnD5e.dll dist/$platform/plugins/
            cp build/plugins/Codex.Systems.Pf2e.dll dist/$platform/plugins/
            cp -r packs/srd51-full dist/$platform/plugins/
            cp -r packs/pf2e-remastered dist/$platform/plugins/
          done

      # TODO(B10): embedded RavenDB still shells out to a child `dotnet Raven.Server.dll`
      # process at runtime, so even a "self-contained" publish needs a .NET runtime installed
      # on the host. Not addressed here - needs a decision (bundle a runtime for Raven, or
      # document the framework-dependency explicitly). See docs/REVIEW_AND_REMEDIATION_PLAN.md.

      - name: Smoke test the Linux artifact
        run: |
          chmod +x dist/linux/Codex.Web
          ASPNETCORE_URLS=http://127.0.0.1:5299 ASPNETCORE_ENVIRONMENT=Production ./dist/linux/Codex.Web > smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:5299/login; then
              echo "Server responded to /login"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server never responded to /login" >&2
              cat smoke.log
              kill $APP_PID || true
              exit 1
            fi
            sleep 1
          done
          for expected in "Loaded plugin: DnD5e" "Loaded plugin: Pf2e" "(srd51-full)" "(pf2e-remastered)"; do
            if ! grep -q "$expected" smoke.log; then
              echo "Expected '$expected' in plugin load output - see smoke.log" >&2
              cat smoke.log
              kill $APP_PID || true
              exit 1
            fi
          done
          kill $APP_PID || true

      # Proves the Dockerfile still builds (no local daemon in most dev setups to
      # catch rot). Packs regenerate inside the image build, same as above.
      - name: Validate Dockerfile
        run: docker build -f Dockerfile -t ttrpg-codex:${{ steps.gitversion.outputs.semVer }} .

      - name: Archive Linux (x64)
        run: cd dist/linux && zip -r ../TTRPG.Codex-linux-x64-${{ steps.gitversion.outputs.semVer }}.zip .

      - name: Archive Windows (x64)
        run: cd dist/win && zip -r ../TTRPG.Codex-win-x64-${{ steps.gitversion.outputs.semVer }}.zip .

      - name: Archive macOS (arm64)
        run: cd dist/macos && zip -r ../TTRPG.Codex-osx-arm64-${{ steps.gitversion.outputs.semVer }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.gitversion.outputs.semVer }}
          generate_release_notes: true
          files: |
            dist/*.zip
