<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Offline | TTRPG.Codex</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        :root { --bg: #f4f3ef; --text: #1a1917; --muted: #67645e; --accent: #4f46e5; --accent-2: #7c3aed; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0e0f13; --text: #f2f0ea; --muted: #9c9890; --accent: #a5b4fc; --accent-2: #c4b5fd; } }
        html, body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
        .mark { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 18px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3); }
        h1 { font-size: 1.4rem; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
        p { color: var(--muted); max-width: 40ch; margin: 0 auto 1.4rem; line-height: 1.5; }
        button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; padding: 0.6rem 1.2rem; cursor: pointer; }
    </style>
</head>
<body>
    <main>
        <div>
            <div class="mark" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
            </div>
            <h1>You're offline</h1>
            <p>TTRPG.Codex runs live against your server, so the table, sheets and wiki need a connection. Check your network and try again.</p>
            <button type="button" onclick="location.reload()">Try again</button>
        </div>
    </main>
</body>
</html>
