<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0a08" />
    <title>Offline | TTRPG.Codex</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
        /* Same preference the app stores: dark unless the player opted into parchment. */
        try { if (localStorage.getItem('codex-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { }
    </script>
    <style>
        /* Fonts are precached by the service worker; the serif fallbacks cover a first-ever offline visit. */
        @font-face { font-family: "Cinzel"; font-weight: 400 900; font-display: swap; src: url("/fonts/cinzel/cinzel-latin-wght-normal.woff2") format("woff2"); }
        @font-face { font-family: "Alegreya Sans"; font-weight: 400; font-display: swap; src: url("/fonts/alegreya-sans/alegreya-sans-latin-400-normal.woff2") format("woff2"); }
        @font-face { font-family: "Alegreya Sans"; font-weight: 700; font-display: swap; src: url("/fonts/alegreya-sans/alegreya-sans-latin-700-normal.woff2") format("woff2"); }
        :root { color-scheme: dark; --bg: #0c0a08; --surface: #17130f; --text: #efe6d2; --muted: #a99c83; --accent: #d4a84f; --on-accent: #17110a; --brass: #9b7d44; --inner: #050403; }
        :root[data-theme="light"] { color-scheme: light; --bg: #e6dbc2; --surface: #f4ecd8; --text: #26201a; --muted: #65563f; --accent: #6f4e14; --on-accent: #fbf4e0; --brass: #7d6128; --inner: rgba(58, 46, 28, 0.35); }
        html, body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Alegreya Sans", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 106.25%; }
        main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; text-align: center; }
        .mark { width: 64px; height: 64px; margin: 0 auto 1.2rem; border-radius: 4px; display: grid; place-items: center; color: var(--accent); background: var(--surface); border: 1px solid var(--brass); box-shadow: inset 0 0 0 1px var(--inner); }
        h1 { font-family: "Cinzel", "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-size: 1.4rem; font-weight: 600; margin: 0 0 0.5rem; letter-spacing: 0.04em; }
        p { color: var(--muted); max-width: 40ch; margin: 0 auto 1.4rem; line-height: 1.5; }
        button { font: inherit; font-weight: 700; letter-spacing: 0.02em; color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); border-radius: 2px; box-shadow: inset 0 0 0 1px var(--inner); padding: 0.6rem 1.2rem; cursor: pointer; }
        button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <div>
            <div class="mark" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
            </div>
            <h1 data-i18n="title">You're offline</h1>
            <p data-i18n="text">TTRPG.Codex runs live against your server, so the table, sheets and wiki need a connection. Check your network and try again.</p>
            <button type="button" onclick="location.reload()" data-i18n="retry">Try again</button>
        </div>
    </main>
    <script>
        /* A static page: no server culture here, so follow the browser's language (English by default). */
        (function () {
            var T = {
                ru: { page: "Нет соединения | TTRPG.Codex", title: "Вы не в сети", text: "TTRPG.Codex работает вживую на вашем сервере, поэтому для стола, листов и вики нужно соединение. Проверьте сеть и попробуйте снова.", retry: "Повторить" },
                he: { page: "לא מקוון | TTRPG.Codex", title: "אין חיבור לרשת", text: "TTRPG.Codex פועל בזמן אמת מול השרת שלכם, ולכן השולחן, דפי הדמויות והוויקי דורשים חיבור. בדקו את הרשת ונסו שוב.", retry: "נסו שוב" }
            };
            var lang = String(navigator.language || "en").toLowerCase().slice(0, 2);
            if (lang === "iw") lang = "he";
            var t = T[lang];
            if (!t) return;
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
            document.title = t.page;
            var nodes = document.querySelectorAll("[data-i18n]");
            for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t[nodes[i].getAttribute("data-i18n")];
        })();
    </script>
</body>
</html>
