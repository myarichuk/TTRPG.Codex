# A settlement (a village, a town, a city): its wiki page, its places, the people the party will meet there, the powers
# that pull at it and, if asked, rumours the party can chase. Labels: Strings.WorldBuilder*.resx, WorldBuilder.Recipe.settlement.*
key: settlement
icon: map-pin
drafts: [wiki, place, npc, fact]
questions:
  - key: size
    type: choice
    ask: How big is it?
    options: [village, town, city, metropolis]
    surprise: true
  - key: land
    type: text
    ask: Where is it, and what is the land around it like?
    surprise: true
  - key: knownFor
    type: text
    ask: What is it known for?
    surprise: true
  - key: rulers
    type: text
    ask: Who rules it?
    surprise: true
  - key: trouble
    type: longText
    ask: What trouble is brewing there?
    surprise: true
  - key: tone
    type: choice
    ask: What tone should it have?
    options: [heroic, grim, whimsical, eerie]
    surprise: true
  - key: detail
    type: choice
    ask: How much should be written up?
    options: [sketch, full]
    default: sketch
  - key: rumours
    type: toggle
    ask: Also write rumours the party can chase?
    default: "true"
prompt: |
  Design one original settlement for the campaign and what brings it to life at the table. Return exactly one draft of
  kind "wiki" for the settlement itself: its name is the settlement's name, and its pitch says what it is like and what
  is going wrong there. How much to return depends on the game master's answer: for "sketch", two places, three people
  and one faction; for "full", four places, five people and two factions. Places are drafts of kind "place" (a district,
  a landmark, an inn, a temple...), each linking to the settlement. People are drafts of kind "npc" (whoever rules it,
  someone tied to the trouble, people the party will meet), each with their role and one memorable trait in the pitch,
  linking to the settlement and to the place or faction they belong to. Factions are drafts of kind "wiki" (a guild, a
  gang, a temple, a noble house) whose pitch says what they want, linking to the settlement and their people. If the
  game master asked for rumours, add one ("sketch") or two ("full") drafts of kind "fact" whose name is the rumour
  itself, one sentence that may or may not be true, linking to what it is about; otherwise return no fact. The
  settlement links to its places, people and factions. Where it fits, link to existing wiki pages, such as the region
  it lies in.
