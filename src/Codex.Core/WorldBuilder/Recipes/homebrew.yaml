# A homebrew Library entry of any of the system's content types (a spell, a creature, a magic item...),
# optionally with a wiki page about its history. Labels: Strings.WorldBuilder*.resx, WorldBuilder.Recipe.homebrew.*
key: homebrew
icon: sparkles
drafts: [homebrew, wiki]
questions:
  - key: type
    type: contentType
    ask: What kind of entry is it?
    required: true
  - key: concept
    type: longText
    ask: What is it, in a sentence or two?
    surprise: true
  - key: power
    type: choice
    ask: How powerful should it be?
    options: [minor, moderate, major, legendary]
    default: moderate
  - key: tone
    type: choice
    ask: What tone should it have?
    options: [heroic, grim, whimsical, eerie]
    surprise: true
  - key: origin
    type: text
    ask: Where does it come from, or who made it?
    surprise: true
  - key: history
    type: toggle
    ask: Also write a wiki page about its history?
    default: "false"
prompt: |
  Design one original homebrew entry of the content type the game master chose, fit for their campaign. Return exactly
  one draft of kind "homebrew" whose "type" is that content type. Power: "minor" suits early adventures, "moderate"
  a seasoned party, "major" high-level play and "legendary" the end of a campaign; keep the numbers in line with
  official material of that power. If the game master asked for a history page, add one draft of kind "wiki" about its
  history, the people tied to it and where it might be found, which links to the homebrew draft; otherwise return no
  wiki draft.
