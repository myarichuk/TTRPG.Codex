# A test fixture for the encounter difficulty readout, shape "sum" (docs/ENCOUNTER_BUILDER_DESIGN.md 2.1 and 16). Every number here is invented so that a
# test can work the answer out by hand; none is from any game. Budgets are per character, by character level.
id: difficulty-sum
name: Difficulty readout, sum (test fixture)
version: 0.1.0
license:
  name: CC0-1.0
  attribution: Test fixture released to the public domain by the TTRPG.Codex project.

actorFields:
  - { key: level, label: Level, type: Number, defaultValue: 1, min: 1, max: 20 }
fieldRoles:
  level: level

entityTypes:
  - type: monster
    label: Creature
    pluralLabel: Creatures
    folder: monsters
    actorBlueprint: true
    fields:
      - { key: worth, label: Worth, type: Number }
  - type: lore
    label: Lore
    pluralLabel: Lore
    folder: lore

sheetKinds:
  - { kind: hero, label: Hero, role: player }
  - { kind: pet, label: Pet, role: player, partyMember: false }

encounters:
  difficulty:
    shape: sum
    partyLevel: level
    creatureValue: worth
    unit: pts
    pick: atMost
    bands:
      - { key: low, label: Low }
      - { key: moderate, label: Moderate }
      - { key: high, label: High }
    budget:
      - { level: 1, low: 10, moderate: 20, high: 30 }
      - { level: 2, low: 15, moderate: 30, high: 45 }
      - { level: 3, low: 20, moderate: 40, high: 60 }
