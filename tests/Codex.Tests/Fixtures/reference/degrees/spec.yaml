# What a host that reads ./system.yaml must make of it (step P1 of the hybrid-system plan). `step` is the overhaul step
# whose primitive an expectation uses (2 values, 4 rolls, 5 events), as in the other fixtures; the plan step meant to make a failing
# one pass is in the comment above it ("now: fail, P2"), since the spec format has no key for it. `why` shows the arithmetic.
# Format: ../README.md.
#
# The sheet: a level 5 Vanguard of the Hillfolk. Str 18 (+4), Dex 14 (+2), Con 14 (+2), Int 10 (+0), Wis 12 (+1).
system: ref-degrees

sheets:
  hero5:
    kind: character
    values: { level: 5, str: 18, dex: 14, con: 14, int: 10, wis: 12, cha: 10, ancestry: hillfolk, class: vanguard, acMode: auto }
    lists:
      inventory: ["scale-coat|equipped:1"]
      skillTrained: [athletics]
      skillExpert: [stealth]
      skillLegendary: [survival]
      saveExpert: [dex]

  # A level 1 Vanguard of the Hillfolk built from boosts: every score starts at 10 (+0). The ancestry gives Con and Wis, one of Str or
  # Dex (Str here), one free (Dex here) and a flaw in Int; the class gives Str.
  newcomer:
    kind: character
    values: { level: 1, attrMethod: boosts, ancestry: hillfolk, class: vanguard }
    lists:
      boost__ancestry__hillfolk.b1: [str]
      boost__ancestry__hillfolk.b2: [dex]

expectations:
  # ---- Ranks: level + 1 / 3 / 6 / 9 ----
  # now: pass. CurrentEngineHost.Values reports `skills.<key>` and `saves.<key>` from the sheet-rules evaluation (added with P1).
  - id: degrees.a-rank-is-the-level-plus-its-step
    step: 2
    sheet: hero5
    expect: { values: { skills.athletics: 10, skills.stealth: 10, skills.survival: 15 } }
    why: "Athletics trained 5 + 1, + Str 4 = 10. Stealth expert 5 + 3, + Dex 2 = 10. Survival legendary 5 + 9, + Wis 1 = 15."
  # now: pass.
  - id: degrees.untrained-adds-the-attribute-alone
    step: 2
    sheet: hero5
    expect: { values: { skills.arcana: 0 } }
    why: "No rank in Arcana: no level, Int +0."
  # now: pass.
  - id: degrees.a-rank-grows-with-the-level
    step: 2
    sheet: hero5
    with: { values: { level: 1 } }
    expect: { values: { skills.athletics: 6 } }
    why: "Trained at level 1: 1 + 1, + Str 4."
  # now: pass (saves.<key> comes from SheetEvaluation.SavingThrows).
  - id: degrees.saves-are-ranked-like-skills
    step: 2
    sheet: hero5
    expect: { values: { saves.con: 8, saves.dex: 10, saves.wis: 7 } }
    why: "The class trains Con and Wis saves: 5 + 1, + 2 = 8; 5 + 1, + 1 = 7. Dex is expert on the sheet: 5 + 3, + 2 = 10."
  # now: pass. Perception is a ranked list of its own; `perceptionExpert` is the sheet key its expert rank gets by default.
  - id: degrees.perception-has-a-rank-of-its-own
    step: 2
    sheet: hero5
    with: { lists: { perceptionExpert: [perception] } }
    expect: { values: { perception: 9 } }
    why: "Expert Perception: 5 + 3, + Wis 1 = 9. Trained alone would be 7."

  # ---- Hit points and armor class ----
  # now: pass. The ancestry's 6 counts once; the class's 7 and Con count every level.
  - id: degrees.hit-points-are-ancestry-plus-class-and-con-per-level
    step: 2
    sheet: hero5
    expect: { values: { maxHp: 51 } }
    why: "Ancestry 6 + (class 7 + Con 2) x 5 = 51."
  # now: pass.
  - id: degrees.hit-points-at-first-level
    step: 2
    sheet: hero5
    with: { values: { level: 1 } }
    expect: { values: { maxHp: 15 } }
    why: "6 + (7 + 2) x 1."
  # now: pass. The armor rank is the armor list's trained rank (level + 1), read for the coat's medium category.
  - id: degrees.armor-class-is-armor-dex-to-its-cap-and-the-rank
    step: 2
    sheet: hero5
    expect: { values: { armorClass: 23 } }
    why: "Scale coat base 15 + Dex 2 (cap 3) + trained 5 + 1 = 23."
  # now: pass.
  - id: degrees.armor-caps-dex
    step: 2
    sheet: hero5
    with: { values: { dex: 18 } }
    expect: { values: { armorClass: 24 } }
    why: "Dex +4 is held to the coat's +3: 15 + 3 + 6."
  # now: pass.
  - id: degrees.unarmored-is-ten-plus-dex-and-the-rank
    step: 2
    sheet: hero5
    with: { lists: { inventory: [] } }
    expect: { values: { armorClass: 20 } }
    why: "12 + Dex 2 + 6."

  # ---- Typed bonuses and penalties ----
  # now: pass. Class DC is 12 + 5 + 1 + Str 4 = 22.
  - id: degrees.typed-bonuses-keep-the-highest-of-each-type
    step: 2
    sheet: hero5
    with: { lists: { feats: [steady-mind, iron-focus, sharp-wits, drilled] } }
    expect: { values: { classDc: 30 } }
    why: "Status +2 and +3 keep the +3; circumstance +2 and untyped +3 add: 22 + 3 + 2 + 3 = 30."
  # now: pass. Bonuses and penalties of one type are separate groups.
  - id: degrees.a-status-bonus-and-a-status-penalty-both-count
    step: 2
    sheet: hero5
    with: { values: { condition_rattled: 3 }, lists: { feats: [iron-focus] } }
    expect: { values: { classDc: 22 } }
    why: "Iron Focus +3 status, Rattled 3 is -3 status: 22 + 3 - 3."
  # now: pass. penalties: highest keeps the worst penalty of a type.
  - id: degrees.typed-penalties-keep-the-worst
    step: 2
    sheet: hero5
    with: { values: { condition_rattled: 3 }, lists: { feats: [jumpy] } }
    expect: { values: { perception: 4 } }
    why: "Perception 5 + 1 + 1 = 7. Jumpy -2 status and Rattled -3 status: only the -3 counts. 7 - 3 = 4."
  # now: pass. `penaltyTypes: { untyped: sum }` lets both untyped penalties count.
  - id: degrees.untyped-penalties-stack
    step: 2
    sheet: hero5
    with: { lists: { feats: [old-wound, bad-knee] } }
    expect: { values: { perception: 2 } }
    why: "An untyped -2 and an untyped -3 both count: 7 - 2 - 3 = 2."

  # ---- Rattled: a valued condition on both sides of the hybrid ----
  # now: pass. The routing rule sends classDc and perception to sheetRules. Status penalties keep the worst, so this alone
  # cannot tell once from twice; the Inspired expectation below can.
  - id: degrees.rattled-lowers-dcs-and-checks-once
    step: 2
    sheet: hero5
    with: { values: { condition_rattled: 3 } }
    expect: { values: { classDc: 19, perception: 4 } }
    why: "22 - 3 and 7 - 3."
  # now: pass. senseDc is the kind's value, so SheetModel takes this modifier and sheetRules does not.
  - id: degrees.rattled-reaches-the-kinds-value-once
    step: 2
    sheet: hero5
    with: { values: { condition_rattled: 3 } }
    expect: { values: { senseDc: 16 } }
    why: "Sense DC 12 + 5 + 1 + Wis 1 = 19, - 3 = 16."
  # now: pass. The test that bites: an untyped bonus adds up, so a condition counted twice on either side would show.
  - id: degrees.a-condition-counts-once-on-each-side-of-the-hybrid
    step: 2
    sheet: hero5
    with: { conditions: [Inspired] }
    expect: { values: { classDc: 24, senseDc: 21 } }
    why: "Inspired +2 untyped: 22 + 2 and 19 + 2; counted twice, 26 and 23."
  # now: pass (the check bonus comes from SheetEvaluation.Skills).
  - id: degrees.rattled-lowers-a-skill-check
    step: 2
    sheet: hero5
    with: { values: { condition_rattled: 3 } }
    expect: { values: { skills.athletics: 7 } }
    why: "10 - 3."
  # now: pass. The drop at the end of a turn is SheetConditions.Drop in Codex.Core (P4b); the table and this host raise the event, then drop.
  - id: degrees.rattled-drops-by-two-at-the-end-of-the-turn
    step: 5
    sheet: hero5
    with: { values: { condition_rattled: 3 } }
    event: { type: turnEnd }
    expect: { after: { tracks: { condition_rattled: 1 }, values: { classDc: 21 } } }
    why: "3 drops by 2 to 1; class DC 22 - 1."
  # now: pass (as above).
  - id: degrees.rattled-ends-at-zero
    step: 5
    sheet: hero5
    with: { values: { condition_rattled: 1 } }
    event: { type: turnEnd }
    expect: { after: { tracks: { condition_rattled: 0 }, values: { classDc: 22 } } }
    why: "1 drops by 2 but stops at 0, so Rattled no longer holds."

  # ---- A sheet kind's feature on the hybrid ----
  # now: pass. The kind's trinket is collected by sheetRules' CollectFeatures and by SheetModel; only the model counts it.
  - id: degrees.a-kind-features-modifier-counts-once
    step: 2
    sheet: hero5
    with: { lists: { trinkets: [{ id: wind-ribbon }] } }
    expect: { values: { speed: 23 } }
    why: "20 + 3 untyped; counted twice it would be 26."

  # ---- Four degrees, the natural 20 / 1 shift ----
  # now: pass for every roll below: a named roll's outcomes over the `degree` function.
  - id: degrees.meeting-the-dc-succeeds
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 20 }, dice: [13] }
    expect: { outcome: success, total: 20 }
  - id: degrees.missing-the-dc-fails
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 20 }, dice: [12] }
    expect: { outcome: failure, total: 19 }
  - id: degrees.beating-the-dc-by-eight-is-a-critical-success
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 17 }, dice: [18] }
    expect: { outcome: criticalSuccess, total: 25 }
    why: "25 is the DC plus 8."
  - id: degrees.missing-by-six-is-a-critical-failure
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 20 }, dice: [7] }
    expect: { outcome: criticalFailure, total: 14 }
    why: "14 is the DC less 6: missed by six."
  - id: degrees.missing-by-five-is-only-a-failure
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 20 }, dice: [8] }
    expect: { outcome: failure, total: 15 }
  - id: degrees.a-natural-twenty-moves-up-one-step
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 30 }, dice: [20] }
    expect: { outcome: success, total: 27 }
    why: "27 misses 30, a failure; the natural 20 makes it a success, not a critical success."
  - id: degrees.a-natural-one-moves-down-one-step
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 7, target: 5 }, dice: [1] }
    expect: { outcome: failure, total: 8 }
    why: "8 beats 5, a success; the natural 1 makes it a failure, not a critical failure."
  - id: degrees.a-natural-one-on-a-critical-success-is-a-success
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 30, target: 10 }, dice: [1] }
    expect: { outcome: success, total: 31 }
  - id: degrees.a-natural-twenty-cannot-go-above-critical-success
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 10, target: 10 }, dice: [20] }
    expect: { outcome: criticalSuccess, total: 30 }
  - id: degrees.a-natural-one-cannot-go-below-critical-failure
    step: 4
    sheet: hero5
    roll: { definition: degreeCheck, inputs: { bonus: 0, target: 30 }, dice: [1] }
    expect: { outcome: criticalFailure, total: 1 }

  # ---- The multiple attack penalty as a roll input ----
  # now: pass. The table is sheetRules.multipleAttack, read by the strike roll's attackPenalty(). The Actions panel reads the same table
  # (P6); the spec format rolls named rolls only, so that half is in ActionsPanelAttackNumberTests.
  - id: degrees.the-first-attack-has-no-penalty
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18 }, dice: [9] }
    expect: { outcome: success, total: 18 }
  - id: degrees.the-second-attack-takes-three
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18, attackNumber: 2 }, dice: [11] }
    expect: { outcome: failure, total: 17 }
    why: "11 + 9 - 3."
  - id: degrees.the-third-attack-and-later-take-seven
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18, attackNumber: 4 }, dice: [20] }
    expect: { outcome: criticalSuccess, total: 22 }
    why: "20 + 9 - 7 = 22 beats 18, a success; the natural 20 makes it a critical success."
  # now: pass (P6). The weapon is an input; its featherlight trait picks the variant row of sheetRules.multipleAttack.
  - id: degrees.a-trait-lowers-the-second-attack-penalty
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18, attackNumber: 2, weapon: swift-knife }, dice: [11] }
    expect: { outcome: success, total: 18 }
    why: "11 + 9 - 2 meets 18. Without the trait the same die gives 17, a failure."
  - id: degrees.a-trait-lowers-the-third-attack-penalty
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18, attackNumber: 3, weapon: swift-knife }, dice: [14] }
    expect: { outcome: success, total: 18 }
    why: "14 + 9 - 5 meets 18. Without the trait it is 16."
  - id: degrees.a-condition-on-the-rolls-own-key-lowers-the-named-roll-once
    step: 4
    sheet: hero5
    with: { values: { condition_rattled: 3 } }
    roll: { definition: strike, inputs: { bonus: 9, target: 18 }, dice: [12] }
    expect: { outcome: success, total: 18 }
    why: "12 + 9 - 3 (Rattled 3 on the roll's own key, once). Not 15, which would count it on both targets."
  - id: degrees.a-weapon-without-the-trait-keeps-the-full-penalty
    step: 4
    sheet: hero5
    roll: { definition: strike, inputs: { bonus: 9, target: 18, attackNumber: 2, weapon: oak-staff }, dice: [10] }
    expect: { outcome: failure, total: 16 }

  # ---- Attribute boosts (P5): sheetRules.attributes.boosts ----
  # now: pass. Boosts are final in the attribute totals, before anything derived reads them.
  - id: degrees.boosts-raise-scores-from-ten
    step: 2
    sheet: newcomer
    expect: { values: { str: 14, dex: 12, con: 12, wis: 12, cha: 10 }, violations: [] }
    why: "Str: the ancestry's pick (+1) and the class (+1), 10 + 2 + 2. Dex: the free boost, 12. Con and Wis: fixed, 12. Cha untouched."
  # now: pass.
  - id: degrees.a-flaw-lowers-the-score
    step: 2
    sheet: newcomer
    expect: { values: { int: 8 } }
    why: "The ancestry's flaw takes a full step (2 score points) off Int."
  # now: pass. The ancestry's two fixed boosts become one free one.
  - id: degrees.two-fixed-boosts-trade-for-one-free
    step: 2
    sheet: newcomer
    with: { lists: { boost__ancestry__hillfolk.trade: [con, wis], boost__ancestry__hillfolk.t1: [cha] } }
    expect: { values: { con: 10, wis: 10, cha: 12 }, violations: [] }
    why: "Con and Wis are given up (back to 10); the free boost goes to Cha."
  # now: pass. Str: 12 (ancestry), 14 (class), then 16, 18 at levels 4 and 8; at +4 the level 12 boost is a half step.
  - id: degrees.a-boost-above-plus-four-is-half
    step: 2
    sheet: newcomer
    with:
      values: { level: 12 }
      lists: { boost__lvl4__m1: [str], boost__lvl8__m1: [str], boost__lvl12__m1: [str] }
    expect: { values: { str: 19 } }
    why: "Str 18 is +4, so the next boost adds 1 score point: 19, still +4 with half a step stored."
  # now: pass.
  - id: degrees.two-half-boosts-make-a-full-step
    step: 2
    sheet: newcomer
    with:
      values: { level: 16 }
      lists: { boost__lvl4__m1: [str], boost__lvl8__m1: [str], boost__lvl12__m1: [str], boost__lvl16__m1: [str] }
    expect: { values: { str: 20 } }
    why: "Two half steps (19, 20) make +5."
  # now: pass. Three boosts at a milestone go to three different attributes; Con is chosen twice.
  - id: degrees.different-boosts-are-required
    step: 2
    sheet: newcomer
    with:
      values: { level: 4 }
      lists: { boost__lvl4__m1: [str], boost__lvl4__m2: [con], boost__lvl4__m3: [con] }
    expect: { violations: [{ field: boosts, key: Actor.Rule.BoostSame }] }
    why: "One violation, naming the source; the scores still show what was chosen."
  # now: pass.
  - id: degrees.an-open-boost-is-a-warning
    step: 2
    sheet: newcomer
    with: { values: { level: 4 } }
    expect: { violations: [], warnings: [{ field: boosts, key: Actor.Rule.BoostOpen }] }
    why: "Level 4 has three free boosts and none is placed: a warning, so the sheet can still be saved."
