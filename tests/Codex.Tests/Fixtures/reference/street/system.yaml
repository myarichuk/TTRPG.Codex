# Reference fixture B (docs/SYSTEM_IMPLEMENTATION_OVERHAUL.md, section 2): a street-level homebrew with no levels and no
# classes. Its names, mechanics and numbers are this project's own; nothing is taken from any published game. Written in
# the syntax the overhaul proposes (../README.md), and spec.yaml says what a host that reads it must make of it. Some
# rules are scripts (rules.js), which is what step 8 of the overhaul makes run.
id: ref-street
name: Reference street homebrew (test fixture)
version: 0.1.0
description: >-
  A trait plus a skill plus a twelve-sided die against a difficulty, vigor from might and grit, a battered state that
  hinders every action, a guard per body location that wears down, and composure that implants strain.
license:
  name: CC0-1.0
  attribution: Test fixture released to the public domain by the TTRPG.Codex project.

# ---- What this version reads today ----

attributes:
  - { key: might,   label: Might,   default: 5, min: 2, max: 8 }
  - { key: grit,    label: Grit,    default: 5, min: 2, max: 8 }
  - { key: speed,   label: Speed,   default: 5, min: 2, max: 8 }
  - { key: finesse, label: Finesse, default: 5, min: 2, max: 8 }
  - { key: knack,   label: Knack,   default: 5, min: 2, max: 8 }
  - { key: wits,    label: Wits,    default: 5, min: 2, max: 8 }

entityTypes:
  - { type: implant, label: Implant, folder: implants }
  - { type: gear,    label: Gear,    folder: gear }

conditions: [Battered, Bleeding out]

# ---- The proposed primitives (overhaul section 3) ----

functions:
  vigor: { script: rules.js#vigor, reads: [might, grit] }
  advanceCost: { formula: "(skillLevel) => 10 + 15 * skillLevel" }

conditionEffects:
  Battered:
    modifiers: [{ target: '@checks', amount: -3, source: Battered }]

sheetKinds:
  - kind: runner
    label: Runner
    role: player

    keyedLists:
      - key: skills
        label: Skills
        itemFields: [{ key: level, type: Number, min: 0, max: 10 }]
        keys:
          - { key: pistols,   label: Pistols,   attribute: speed,   groups: [checks] }
          - { key: fistfight, label: Fistfight, attribute: might,   groups: [checks] }
          - { key: running,   label: Running,   attribute: finesse, groups: [checks] }
          - { key: notice,    label: Notice,    attribute: wits,    groups: [checks] }
        derive:
          value: "s => score(s.attribute) + s.level"

    lists:
      - key: implants
        label: Implants
        type: implant
      - key: armor
        label: Armor
        type: gear
        itemFields: [{ key: location, type: Dropdown, options: [head, torso] }]

    values:
      - { key: Vigor_Max,       formula: "vigor(might, grit)" }
      - { key: Composure_Max,   formula: "grit * 6 + wits * 2 - sum(implants, c => c.strain)" }
      - { key: rapport,         formula: "floor(Composure / 6)" }
      - { key: Guard_head_Max,  formula: "max(where(armor, a => a.location == 'head'), a => a.guard, 0)" }
      - { key: Guard_torso_Max, formula: "max(where(armor, a => a.location == 'torso'), a => a.guard, 0)" }

    tracks:
      # Thresholds add effects; several can hold at once. div is the host's integer division (contract rule 4): a third of
      # a maximum that three does not divide rounds down in every supplier.
      - key: Vigor
        label: Vigor
        max: Vigor_Max
        min: -10
        thresholds:
          - { atOrBelow: "div(Vigor_Max, 3)", condition: Battered }
          - { below: 0, condition: Bleeding out }
      - { key: Composure, label: Composure, max: Composure_Max, start: max }
      - { key: Guard_head, label: Head guard, max: Guard_head_Max, start: max }
      - { key: Guard_torso, label: Torso guard, max: Guard_torso_Max, start: max }
      - { key: Fading, label: Fading, min: 0, max: 10, start: 0 }
      - { key: XP, label: Experience, min: 0 }

    layout:
      - { section: Traits, widgets: [{ widget: values, keys: [might, grit, speed, finesse, knack, wits, rapport] }] }
      - { section: Condition, widgets: [{ widget: track, key: Vigor }, { widget: track, key: Composure }, { widget: track, key: Guard_head }, { widget: track, key: Guard_torso }] }
      - { section: Skills, widgets: [{ widget: table, key: skills, columns: [level, value] }, { widget: roll, roll: check }] }

rolls:
  # A check: trait + skill + d12 against a difficulty. A natural 12 adds one more d12 (once); a natural 1 takes one away
  # (once). The second die never explodes or implodes again. Battered's penalty is on '@checks', which every skill lists
  # among its groups, so the skill's value already carries it: adding modifiers('@checks') here would count it twice.
  - key: check
    dice: 1d12
    explode: { on: 12, times: 1 }
    implode: { on: 1, times: 1 }
    add: ["skills[input.skill].value"]
    inputs:
      - { key: skill, from: roller }
      - { key: difficulty, from: gm, label: Difficulty }
    outcomes:
      - { name: success, when: "total >= difficulty" }
      - { name: failure }
  # A last stand: a d12 plus Fading, at or under grit + 4 (roll-under). Each one rolled raises Fading.
  - key: lastStand
    dice: 1d12
    add: ["Fading"]
    outcomes:
      - { name: success, when: "total <= grit + 4" }
      - { name: failure }

events:
  damage: { script: rules.js#onDamage }
  turnStart:
    - { when: "has('Bleeding out')", intents: [{ roll: { definition: lastStand } }] }
  roll:
    - { when: "ev.definition == 'lastStand'", intents: [{ adjust: { track: Fading, by: 1 } }] }
  advance: { script: rules.js#onAdvance }
